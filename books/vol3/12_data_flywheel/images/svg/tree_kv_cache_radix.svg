<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: NAIVE INDEPENDENT SERVING (DUPLICATION)               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="430" height="354" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. NAIVE INDEPENDENT SERVING (REDUNDANT DUPLICATION)</text>

    <!-- Branch Rows -->
    <!-- Branch 1 -->
    <text x="12" y="47" font-size="8" font-weight="700" fill="#334155">Branch 1:</text>
    <rect x="68" y="36" width="118" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="127" y="48" text-anchor="middle" font-size="8.0" fill="#334155">System Prompt (2k)</text>
    <rect x="190" y="36" width="105" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="242" y="48" text-anchor="middle" font-size="8.0" fill="#334155">Step 1 Trace (1.5k)</text>
    <rect x="299" y="36" width="118" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="358" y="48" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Step 2 (A) (0.5k)</text>

    <!-- Branch 2 -->
    <text x="12" y="73" font-size="8" font-weight="700" fill="#334155">Branch 2:</text>
    <rect x="68" y="62" width="118" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="127" y="74" text-anchor="middle" font-size="8.0" fill="#991b1b">System Prompt [DUP]</text>
    <rect x="190" y="62" width="105" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="242" y="74" text-anchor="middle" font-size="8.0" fill="#991b1b">Step 1 Trace [DUP]</text>
    <rect x="299" y="62" width="118" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="358" y="74" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Step 2 (B) (0.5k)</text>

    <!-- Branch 3 -->
    <text x="12" y="99" font-size="8" font-weight="700" fill="#334155">Branch 3:</text>
    <rect x="68" y="88" width="118" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="127" y="100" text-anchor="middle" font-size="8.0" fill="#991b1b">System Prompt [DUP]</text>
    <rect x="190" y="88" width="105" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="242" y="100" text-anchor="middle" font-size="8.0" fill="#991b1b">Step 1 Trace [DUP]</text>
    <rect x="299" y="88" width="118" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="358" y="100" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Step 2 (C) (0.5k)</text>

    <!-- Branch 4 -->
    <text x="12" y="125" font-size="8" font-weight="700" fill="#334155">Branch 4:</text>
    <rect x="68" y="114" width="118" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="127" y="126" text-anchor="middle" font-size="8.0" fill="#991b1b">System Prompt [DUP]</text>
    <rect x="190" y="114" width="105" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="242" y="126" text-anchor="middle" font-size="8.0" fill="#991b1b">Step 1 Trace [DUP]</text>
    <rect x="299" y="114" width="118" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="358" y="126" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Step 2 (D) (0.5k)</text>

    <!-- Stats Card -->
    <g transform="translate(12, 142)">
      <rect x="0" y="0" width="406" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Memory Footprint &amp; Prefill Overhead:</text>
      <text x="10" y="38" font-size="8.0" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#dc2626">4 × 4,000 = 16,000 tokens</tspan></text>
      <text x="10" y="56" font-size="8.0" fill="#334155">• Redundant Duplicate Tokens: <tspan font-weight="700" fill="#dc2626">10,500 tokens (65.6% pure waste)</tspan></text>
      <text x="10" y="74" font-size="8.0" fill="#334155">• Prefill Thrashing: Redundant re-computation of 3.5k tokens 4× times</text>
      <text x="10" y="92" font-size="8.0" font-weight="700" fill="#991b1b">• Result: Rapid GPU HBM exhaustion when scaling search width B &gt; 8</text>

      <rect x="10" y="102" width="386" height="24" rx="1" fill="#fee2e2"/>
      <text x="203" y="118" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">HBM Status: Severe Fragmentation &amp; Low Concurrency</text>
    </g>

    <!-- Explanatory note -->
    <g transform="translate(12, 288)">
      <rect x="0" y="0" width="406" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.0" font-weight="700" fill="#0f172a">Independent Serving Consequence:</text>
      <text x="10" y="32" font-size="8.0" fill="#475569">Independent inference contexts cannot share physical PagedAttention blocks,</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">forcing duplicated attention KV allocations for identical prefix history.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: RADIXTREE KV-CACHE (SGLANG / RADIXATTENTION)         -->
  <!-- ================================================================= -->
  <g transform="translate(490, 74)">
    <rect x="0" y="0" width="430" height="354" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">B. RADIXTREE KV-CACHE WITH COPY-ON-WRITE</text>

    <!-- Tree Graph Diagram -->
    <g transform="translate(12, 34)">
      <!-- Root Node -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="105" height="40" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Root Node</text>
        <text x="52" y="28" text-anchor="middle" font-size="8.0" fill="#16a34a">Prompt: 2k tok [rc=4]</text>
      </g>

      <!-- Arrow Root -> Step 1 -->
      <line x1="105" y1="56" x2="132" y2="56" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

      <!-- Step 1 Node -->
      <g transform="translate(135, 36)">
        <rect x="0" y="0" width="105" height="40" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Step 1 Node</text>
        <text x="52" y="28" text-anchor="middle" font-size="8.0" fill="#16a34a">Trace: 1.5k tok [rc=4]</text>
      </g>

      <!-- Diverging Lines to 4 Leaves -->
      <line x1="240" y1="46" x2="274" y2="15" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <line x1="240" y1="52" x2="274" y2="42" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <line x1="240" y1="60" x2="274" y2="69" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <line x1="240" y1="66" x2="274" y2="96" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- 4 Delta Leaves -->
      <rect x="278" y="5" width="128" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="342" y="18" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Leaf A: Δ 0.5k [rc=1]</text>

      <rect x="278" y="32" width="128" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="342" y="45" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Leaf B: Δ 0.5k [rc=1]</text>

      <rect x="278" y="59" width="128" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="342" y="72" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Leaf C: Δ 0.5k [rc=1]</text>

      <rect x="278" y="86" width="128" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="342" y="99" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Leaf D: Δ 0.5k [rc=1]</text>
    </g>

    <!-- Stats Card -->
    <g transform="translate(12, 142)">
      <rect x="0" y="0" width="406" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Radix Tree Memory &amp; Prefill Savings:</text>
      <text x="10" y="38" font-size="8.0" fill="#334155">• Shared Root &amp; Step 1: <tspan font-weight="700" fill="#16a34a">2,000 + 1,500 = 3,500 tokens</tspan> (allocated ONCE)</text>
      <text x="10" y="56" font-size="8.0" fill="#334155">• Delta Leaves Allocation: <tspan font-weight="700" fill="#16a34a">4 × 500 = 2,000 tokens</tspan></text>
      <text x="10" y="74" font-size="8.0" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#15803d">5,500 tokens vs. 16,000 tokens (65.6% saved!)</tspan></text>
      <text x="10" y="92" font-size="8.0" font-weight="700" fill="#15803d">• Zero Prefill Overhead: Child branches fork instantly without prefill</text>

      <rect x="10" y="102" width="386" height="24" rx="1" fill="#dcfce7"/>
      <text x="203" y="118" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">HBM Status: High Concurrency &amp; Reference Counting</text>
    </g>

    <!-- Explanatory note -->
    <g transform="translate(12, 288)">
      <rect x="0" y="0" width="406" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.0" font-weight="700" fill="#0f172a">RadixAttention Memory Management:</text>
      <text x="10" y="32" font-size="8.0" fill="#475569">PagedAttention physical blocks are freed automatically via LRU eviction</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">only when the node reference count drops to 0, maximizing prefix hit rates.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM BANNER: SYSTEMS INVARIANT                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 438)">
    <rect x="0" y="0" width="880" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="52" rx="1" fill="#16a34a"/>
    <text x="14" y="18" font-size="8.5" font-weight="700" fill="#0f172a">SYSTEMS INVARIANT: THE PREFIX-TREE MEMORY LAW</text>
    <text x="14" y="34" font-size="8.0" fill="#475569">When serving branching search trees, memory scales with tree frontier width rather than total token count: </text>
    <text x="496" y="34" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">M_tree = M_prefix + Σ M_Δ(leaf) ≪ Σ M_total(path).</text>
    <text x="14" y="45" font-size="8.0" fill="#64748b">Decouples tree search horizon and branch breadth from catastrophic GPU memory exhaustion.</text>
  </g>

</g>
</svg>