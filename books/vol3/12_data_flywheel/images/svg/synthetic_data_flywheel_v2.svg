<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#92400E"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM METRICS                                           -->
  <!-- ================================================================= -->
  <g transform="translate(50, 18)">
    <text x="0" y="18" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.3">CLOSED-LOOP SYNTHETIC DATA FLYWHEEL ARCHITECTURE</text>
    <text x="0" y="34" font-size="11" fill="#475569">Continuous Trajectory Synthesis, Disaggregated Verification, Sieve Curation, and Distributed Policy Compilation</text>

    <!-- Top Invariant Box -->
    <rect x="760" y="0" width="390" height="38" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="772" y="16" font-size="10" font-weight="700" fill="#581C87">Convergence Law:</text>
    <text x="880" y="16" font-size="9.5" font-family="'SF Mono', monospace" fill="#1E293B">pi_{k+1} = argmax_theta E_{tau ~ D_k} [ R(tau) ]</text>
    <text x="772" y="30" font-size="8.5" fill="#6B21A8">Recursive expansion of autonomous task frontier across generations</text>
  </g>

  <!-- ================================================================= -->
  <!-- TOP TIER: FORWARD SYNTHESIS PIPELINE                              -->
  <!-- ================================================================= -->

  <!-- Block 1: Task & Environment Synthesizer -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="310" height="175" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/>
    <rect x="0" y="0" width="310" height="28" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#1E293B">1. SPECIFICATION GENERATOR</text>
    <text x="240" y="19" font-size="9" fill="#64748B" font-family="'SF Mono', monospace">Stage I</text>

    <!-- Schema elements -->
    <rect x="12" y="38" width="286" height="42" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="20" y="53" font-size="9" font-weight="700" fill="#334155">Synthetic Mutation &amp; Telemetry Ingestion</text>
    <text x="20" y="68" font-size="8.5" font-family="'SF Mono', monospace" fill="#475569">x_task = { Repo_AST, Diff_seed, Spec_invar }</text>

    <!-- Internal sub-blocks -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="138" height="42" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#334155">AST Defect Fuzzer</text>
      <text x="8" y="30" font-size="8" fill="#64748B">Semantic mutations</text>

      <rect x="148" y="0" width="138" height="42" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
      <text x="156" y="15" font-size="8.5" font-weight="700" fill="#334155">Property Harness</text>
      <text x="156" y="30" font-size="8" fill="#64748B">Assertion suites</text>
    </g>

    <!-- Output Bus Contract -->
    <rect x="12" y="138" width="286" height="26" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="0.8"/>
    <text x="20" y="155" font-size="8.5" font-family="'SF Mono', monospace" fill="#581C87">Task Contract &lt; Goal, Env, Invariants &gt;</text>
  </g>

  <!-- Bus Arrow: Stage 1 -> Stage 2 -->
  <g transform="translate(360, 170)">
    <line x1="0" y1="12" x2="52" y2="12" stroke="#581C87" stroke-width="2.2" marker-end="url(#arr-amethyst)"/>
    <rect x="6" y="-6" width="40" height="14" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="0.8"/>
    <text x="26" y="4" font-size="7.5" font-weight="700" fill="#581C87" text-anchor="middle">batch(x)</text>
  </g>

  <!-- Block 2: GPU Rollout Inference Fleet -->
  <g transform="translate(420, 95)">
    <rect x="0" y="0" width="360" height="175" rx="6" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="28" rx="6" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#581C87">2. GPU ROLLOUT FLEET (Policy pi_k)</text>
    <text x="270" y="19" font-size="9" fill="#7E22CE" font-family="'SF Mono', monospace">Tensor Cores</text>

    <!-- Accelerator architecture inside -->
    <rect x="12" y="38" width="336" height="42" rx="3" fill="#FAF5FF" stroke="#C084FC" stroke-width="0.8"/>
    <text x="20" y="53" font-size="9" font-weight="700" fill="#581C87">Continuous Batching &amp; Radix Tree Prefix Cache</text>
    <text x="20" y="68" font-size="8.5" font-family="'SF Mono', monospace" fill="#3B0764">tau_1, ..., tau_N ~ pi_k( . | x_task )  [T in (0.6, 0.8)]</text>

    <!-- Micro-Rollouts Schematic -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="105" height="42" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#581C87">Rollout tau_1</text>
      <text x="8" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">[a_1, o_1, a_2]</text>

      <rect x="115" y="0" width="105" height="42" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
      <text x="123" y="16" font-size="8.5" font-weight="700" fill="#581C87">Rollout tau_2</text>
      <text x="123" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">[a_1, a_2', a_3]</text>

      <rect x="230" y="0" width="106" height="42" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
      <text x="238" y="16" font-size="8.5" font-weight="700" fill="#581C87">Rollout tau_N</text>
      <text x="238" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">[a_1, a_2'', ...]</text>
    </g>

    <!-- Bottom metric -->
    <rect x="12" y="138" width="336" height="26" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="20" y="155" font-size="8.5" fill="#475569">High Arithmetic Intensity GEMM Prefill / Decode Concurrency</text>
  </g>

  <!-- Bus Arrow: Stage 2 -> Stage 3 -->
  <g transform="translate(780, 170)">
    <line x1="0" y1="12" x2="52" y2="12" stroke="#92400E" stroke-width="2.2" marker-end="url(#arr-ochre)"/>
    <rect x="6" y="-6" width="40" height="14" rx="2" fill="#FFFBEB" stroke="#92400E" stroke-width="0.8"/>
    <text x="26" y="4" font-size="7.5" font-weight="700" fill="#92400E" text-anchor="middle">stream(tau)</text>
  </g>

  <!-- Block 3: Asynchronous Ring Buffer / Message Broker -->
  <g transform="translate(840, 95)">
    <rect x="0" y="0" width="310" height="175" rx="6" fill="#FFFFFF" stroke="#92400E" stroke-width="1.3"/>
    <rect x="0" y="0" width="310" height="28" rx="6" fill="#FEF3C7" stroke="#92400E" stroke-width="1.3"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#92400E">3. ASYNCHRONOUS BUFFER</text>
    <text x="220" y="19" font-size="9" fill="#B45309" font-family="'SF Mono', monospace">Partitioned</text>

    <!-- Buffer Details -->
    <rect x="12" y="38" width="286" height="42" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
    <text x="20" y="53" font-size="9" font-weight="700" fill="#92400E">Hardware Decoupling Queue (Kafka Log)</text>
    <text x="20" y="68" font-size="8.5" fill="#78350F">Buffers GPU burst generation against slow CPU sandbox eval</text>

    <!-- Queue slot diagram -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="45" height="42" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <text x="22" y="25" font-size="8" font-family="'SF Mono', monospace" fill="#B45309" text-anchor="middle">Q_0</text>

      <rect x="48" y="0" width="45" height="42" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <text x="70" y="25" font-size="8" font-family="'SF Mono', monospace" fill="#B45309" text-anchor="middle">Q_1</text>

      <rect x="96" y="0" width="45" height="42" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <text x="118" y="25" font-size="8" font-family="'SF Mono', monospace" fill="#B45309" text-anchor="middle">Q_2</text>

      <rect x="144" y="0" width="45" height="42" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <text x="166" y="25" font-size="8" font-family="'SF Mono', monospace" fill="#B45309" text-anchor="middle">...</text>

      <rect x="192" y="0" width="94" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="239" y="19" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Backpressure</text>
      <text x="239" y="32" font-size="7.5" fill="#64748B" text-anchor="middle">Flow Control</text>
    </g>

    <!-- Ingestion rate strip -->
    <rect x="12" y="138" width="286" height="26" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="20" y="155" font-size="8.5" font-family="'SF Mono', monospace" fill="#475569">dispatch_shards -> CPU Worker Nodes</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRANSITION DOWNWARD: DISPATCH ARROW                               -->
  <!-- ================================================================= -->
  <g transform="translate(995, 270)">
    <line x1="0" y1="0" x2="0" y2="65" stroke="#92400E" stroke-width="2.5" marker-end="url(#arr-ochre)"/>
    <rect x="8" y="22" width="75" height="20" rx="3" fill="#FFFBEB" stroke="#92400E" stroke-width="0.8"/>
    <text x="45" y="36" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#92400E" text-anchor="middle">dispatch()</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM TIER: VERIFICATION, SIEVE & COMPILATION                    -->
  <!-- ================================================================= -->

  <!-- Block 4: Multi-Tier MicroVM Verification Cluster -->
  <g transform="translate(840, 345)">
    <rect x="0" y="0" width="310" height="175" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
    <rect x="0" y="0" width="310" height="28" rx="6" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.3"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#0F766E">4. MICROVM VERIFIER CLUSTER</text>
    <text x="230" y="19" font-size="9" fill="#0D9488" font-family="'SF Mono', monospace">CPU Nodes</text>

    <!-- Verification Checks inside -->
    <rect x="12" y="38" width="286" height="42" rx="3" fill="#F0FDFA" stroke="#99F6E4" stroke-width="0.8"/>
    <text x="20" y="53" font-size="9" font-weight="700" fill="#0F766E">Isolated Sandboxes (Firecracker / KVM)</text>
    <text x="20" y="68" font-size="8.5" font-family="'SF Mono', monospace" fill="#115E59">Oracle V(tau) in {0, 1} via Hard Invariants</text>

    <!-- Verification checks list -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="90" height="42" rx="2" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
      <text x="45" y="18" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle">AST Syntax</text>
      <text x="45" y="32" font-size="8" fill="#64748B" text-anchor="middle">Parsability</text>

      <rect x="98" y="0" width="90" height="42" rx="2" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
      <text x="143" y="18" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle">Unit Tests</text>
      <text x="143" y="32" font-size="8" fill="#64748B" text-anchor="middle">Pass / Fail</text>

      <rect x="196" y="0" width="90" height="42" rx="2" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
      <text x="241" y="18" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle">FS Invariants</text>
      <text x="241" y="32" font-size="8" fill="#64748B" text-anchor="middle">Diff Check</text>
    </g>

    <!-- Evaluation outcome strip -->
    <rect x="12" y="138" width="286" height="26" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="20" y="155" font-size="8.5" font-family="'SF Mono', monospace" fill="#334155">Tagged Stream: &lt; tau_i, V(tau_i) &gt;</text>
  </g>

  <!-- Bus Arrow: Stage 4 -> Stage 5 (Leftwards) -->
  <g transform="translate(775, 420)">
    <line x1="65" y1="12" x2="10" y2="12" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arr-teal)"/>
    <rect x="15" y="-6" width="45" height="14" rx="2" fill="#F0FDFA" stroke="#0F766E" stroke-width="0.8"/>
    <text x="37" y="4" font-size="7.5" font-weight="700" fill="#0F766E" text-anchor="middle">verdict</text>
  </g>

  <!-- Block 5: Bifurcated Trajectory Sieve -->
  <g transform="translate(420, 345)">
    <rect x="0" y="0" width="360" height="175" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
    <rect x="0" y="0" width="360" height="28" rx="6" fill="#F8FAFC" stroke="#334155" stroke-width="1.3"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#1E293B">5. BIFURCATED TRAJECTORY SIEVE</text>
    <text x="270" y="19" font-size="9" fill="#64748B" font-family="'SF Mono', monospace">Curator</text>

    <!-- Split Branches -->
    <!-- Branch A: R = 1 Golden Path -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="336" height="52" rx="3" fill="#F0FDF4" stroke="#166534" stroke-width="1.2"/>
      <circle cx="15" cy="16" r="5" fill="#166534"/>
      <text x="26" y="20" font-size="9" font-weight="700" fill="#166534">Branch A: Golden Path Extraction (V = 1)</text>
      <text x="26" y="34" font-size="8.5" fill="#15803D">Prune exploratory backtracking; compute dense loss masks</text>
      <text x="26" y="46" font-size="8" font-family="'SF Mono', monospace" fill="#166534">D_gold &lt;- D_gold U { tau_minimal }  (Targets SFT &amp; RLVR)</text>
    </g>

    <!-- Branch B: R = 0 Error Mining -->
    <g transform="translate(12, 98)">
      <rect x="0" y="0" width="336" height="52" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2"/>
      <circle cx="15" cy="16" r="5" fill="#991B1B"/>
      <text x="26" y="20" font-size="9" font-weight="700" fill="#991B1B">Branch B: DAgger Error Mining (V = 0)</text>
      <text x="26" y="34" font-size="8.5" fill="#B91C1C">Isolate fault injection point; pair with expert recovery act</text>
      <text x="26" y="46" font-size="8" font-family="'SF Mono', monospace" fill="#991B1B">D_error &lt;- D_error U { (s_fault, a_expert) }  (Drift Defense)</text>
    </g>

    <!-- Footer -->
    <rect x="12" y="154" width="336" height="16" rx="2" fill="#FFFFFF"/>
    <text x="180" y="166" font-size="8" fill="#64748B" text-anchor="middle">Exact Deduplication &amp; Structural MinHash Filtration</text>
  </g>

  <!-- Bus Arrow: Stage 5 -> Stage 6 (Leftwards) -->
  <g transform="translate(360, 420)">
    <line x1="60" y1="12" x2="5" y2="12" stroke="#166534" stroke-width="2.2" marker-end="url(#arr-green)"/>
    <rect x="12" y="-6" width="40" height="14" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
    <text x="32" y="4" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">dataset</text>
  </g>

  <!-- Block 6: Distributed Policy Compiler (SFT & RLVR) -->
  <g transform="translate(50, 345)">
    <rect x="0" y="0" width="310" height="175" rx="6" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="28" rx="6" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#166534">6. POLICY COMPILER (Trainer)</text>
    <text x="210" y="19" font-size="8.5" fill="#15803D" font-family="'SF Mono', monospace">FSDP / Megatron</text>

    <!-- Compiler Engine details -->
    <rect x="12" y="38" width="286" height="42" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="20" y="53" font-size="9" font-weight="700" fill="#166534">Supervised SFT &amp; GRPO Alignment</text>
    <text x="20" y="68" font-size="8.5" font-family="'SF Mono', monospace" fill="#14532D">theta_{k+1} &lt;- theta_k + eta * grad_loss(D_curated)</text>

    <!-- Training details -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="138" height="42" rx="2" fill="#FFFFFF" stroke="#166534" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#166534">Loss Masking</text>
      <text x="10" y="30" font-size="8" fill="#475569">Action tokens only</text>

      <rect x="148" y="0" width="138" height="42" rx="2" fill="#FFFFFF" stroke="#166534" stroke-width="1"/>
      <text x="158" y="16" font-size="8.5" font-weight="700" fill="#166534">Weight Checkpoint</text>
      <text x="158" y="30" font-size="8" fill="#475569">pi_{k+1} artifacts</text>
    </g>

    <!-- Compilation summary strip -->
    <rect x="12" y="138" width="286" height="26" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="0.8"/>
    <text x="20" y="155" font-size="8.5" font-weight="700" fill="#581C87">Context Compaction: 85% Prefix Shrinkage</text>
  </g>

  <!-- ================================================================= -->
  <!-- CLOSING THE LOOP: WEIGHT RETURN BUS ROUTED CLEANLY AROUND BLOCKS  -->
  <!-- ================================================================= -->
  <!-- From Block 6 left (x=50, y=430) -> left to x=22 -> up to y=65 -> right to x=600 -> down to Block 2 top (x=600, y=95) -->
  <path d="M 50 432 L 22 432 L 22 68 L 600 68 L 600 95" fill="none" stroke="#581C87" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-amethyst)"/>
  <rect x="230" y="56" width="200" height="22" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1"/>
  <text x="330" y="71" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">Weight Broadcast Bus: pi_{k+1} Checkpoints</text>
</svg>
