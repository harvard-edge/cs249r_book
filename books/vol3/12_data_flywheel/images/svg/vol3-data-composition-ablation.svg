<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .grid { stroke: #f1f5f9; stroke-width: 1.2; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .axis-tick { stroke: #475569; stroke-width: 1.2; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .axis-lbl-y { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: end; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      
      .curve-complex { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; }
      .curve-unit { stroke: #16a34a; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .curve-pert { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 6 3; fill: none; stroke-linecap: round; }
      
      .ref-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .opt-dot { fill: #2563eb; stroke: #ffffff; stroke-width: 2.5; }
      
      .legend-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4; }
      .legend-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      
      .badge-opt { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 4; }
      .txt-badge-title { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #1e40af; text-anchor: middle; }
      .txt-badge-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #1d4ed8; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Plot Area: x=110 to 880 (w=770), y=40 to 390 (h=350) -->
  <!-- Horizontal Grid Lines -->
  <line x1="110" y1="390" x2="880" y2="390" class="grid" />
  <line x1="110" y1="320" x2="880" y2="320" class="grid" />
  <line x1="110" y1="250" x2="880" y2="250" class="grid" />
  <line x1="110" y1="180" x2="880" y2="180" class="grid" />
  <line x1="110" y1="110" x2="880" y2="110" class="grid" />
  <line x1="110" y1="40" x2="880" y2="40" class="grid" />

  <!-- Vertical Reference Line at 30% Recovery (x = 495) -->
  <line x1="495" y1="40" x2="495" y2="390" class="ref-line" />

  <!-- Y-Axis Labels -->
  <text x="96" y="394" class="axis-lbl-y">0%</text>
  <text x="96" y="324" class="axis-lbl-y">20%</text>
  <text x="96" y="254" class="axis-lbl-y">40%</text>
  <text x="96" y="184" class="axis-lbl-y">60%</text>
  <text x="96" y="114" class="axis-lbl-y">80%</text>
  <text x="96" y="44" class="axis-lbl-y">100%</text>
  
  <text x="35" y="215" class="axis-title" transform="rotate(-90 35 215)">Downstream Benchmark Task Success Rate (%)</text>

  <!-- X-Axis Labels -->
  <text x="110" y="412" class="axis-lbl">0% (All Pristine)</text>
  <text x="238" y="412" class="axis-lbl">10%</text>
  <text x="367" y="412" class="axis-lbl">20%</text>
  <text x="495" y="412" class="axis-lbl" font-weight="700" fill="#1e40af">30% (Optimal Mix)</text>
  <text x="623" y="412" class="axis-lbl">40%</text>
  <text x="752" y="412" class="axis-lbl">50%</text>
  <text x="880" y="412" class="axis-lbl">60%</text>
  
  <text x="495" y="442" class="axis-title">Corpus Composition Ratio: % Recovery Demonstrations (Remainder Pristine Demonstrations)</text>

  <!-- Axes Lines -->
  <line x1="110" y1="40" x2="110" y2="390" class="axis" />
  <line x1="110" y1="390" x2="880" y2="390" class="axis" />

  <!-- Tick Marks -->
  <line x1="104" y1="390" x2="110" y2="390" class="axis-tick" />
  <line x1="104" y1="320" x2="110" y2="320" class="axis-tick" />
  <line x1="104" y1="250" x2="110" y2="250" class="axis-tick" />
  <line x1="104" y1="180" x2="110" y2="180" class="axis-tick" />
  <line x1="104" y1="110" x2="110" y2="110" class="axis-tick" />
  <line x1="104" y1="40" x2="110" y2="40" class="axis-tick" />

  <line x1="110" y1="390" x2="110" y2="396" class="axis-tick" />
  <line x1="238" y1="390" x2="238" y2="396" class="axis-tick" />
  <line x1="367" y1="390" x2="367" y2="396" class="axis-tick" />
  <line x1="495" y1="390" x2="495" y2="396" class="axis-tick" />
  <line x1="623" y1="390" x2="623" y2="396" class="axis-tick" />
  <line x1="752" y1="390" x2="752" y2="396" class="axis-tick" />
  <line x1="880" y1="390" x2="880" y2="396" class="axis-tick" />

  <!-- Curve 2: Single-Turn Unit Tasks (Green) -->
  <path d="M 110 103 C 200 96, 300 98, 400 102 C 500 106, 650 120, 760 148 C 820 160, 850 164, 880 166" class="curve-unit" />

  <!-- Curve 3: Perturbed Environmental Faults (Red Dashed) -->
  <path d="M 110 337 C 230 290, 360 220, 495 194 C 590 172, 700 163, 880 165" class="curve-pert" />

  <!-- Curve 1: Complex Multi-Step Repos (Blue) -->
  <path d="M 110 246 C 220 205, 360 155, 495 134 C 610 150, 740 185, 880 215" class="curve-complex" />

  <!-- Optimal Peak Dot & Badge (Badge shifted to y=46, completely above green curve at y=106) -->
  <circle cx="495" cy="134" r="5.5" class="opt-dot" />
  
  <g transform="translate(422, 46)">
    <rect width="146" height="38" class="badge-opt" />
    <text x="73" y="16" class="txt-badge-title">Peak Yield: 73.2%</text>
    <text x="73" y="30" class="txt-badge-sub">30% Recovery / 70% Pristine</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(620, 46)">
    <rect width="245" height="85" class="legend-box" />
    
    <line x1="16" y1="22" x2="46" y2="22" class="curve-complex" />
    <text x="56" y="26" class="legend-txt">Complex Multi-Step Repos</text>
    
    <line x1="16" y1="46" x2="46" y2="46" class="curve-unit" />
    <text x="56" y="50" class="legend-txt">Single-Turn Unit Tasks</text>
    
    <line x1="16" y1="68" x2="46" y2="68" class="curve-pert" />
    <text x="56" y="72" class="legend-txt">Perturbed Environmental Faults</text>
  </g>

</svg>
