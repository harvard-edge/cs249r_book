<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 395" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="395" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .supervisor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0f172a; }
      .card-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #dc2626; stroke-width: 1.8; fill: none; marker-end: url(#arrow-red); }
      .line-red { stroke: #dc2626; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="395" class="bg" />

  <!-- Main Supervisor Container -->
  <g transform="translate(40, 20)">
    <!-- Outer Box -->
    <rect x="0" y="0" width="800" height="355" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="800" height="28" rx="6" fill="#334155" />
    <text x="16" y="19" class="supervisor-title">HOST AGENT SUPERVISOR (COMPLETE MEDIATION LAYER)</text>

    <!-- SECTION 1: OPERATING ENVELOPE -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="768" height="135" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="14" y="20" class="card-hdr" fill="#0f172a">OPERATING ENVELOPE INVARIANTS</text>

      <!-- Subcard 1: Resource Budget -->
      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="176" height="92" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#0369a1">Resource Budget (B)</text>
        <text x="10" y="38" class="mono" font-size="10">Tokens: M ≤ 250k</text>
        <text x="10" y="56" class="mono" font-size="10">Wall Clock: T ≤ 600s</text>
        <text x="10" y="74" class="mono" font-size="10">Turns: H ≤ 25 steps</text>
      </g>

      <!-- Subcard 2: Error Ceiling -->
      <g transform="translate(200, 30)">
        <rect x="0" y="0" width="176" height="92" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#b45309">Error Ceiling (κ)</text>
        <text x="10" y="38" class="mono" font-size="10">Tool Errors: K ≤ 3</text>
        <text x="10" y="56" class="mono" font-size="10">Build Fails: R ≤ 5</text>
        <text x="10" y="74" class="mono" font-size="10">Divergence: d ≤ 0.8</text>
      </g>

      <!-- Subcard 3: Action Sandbox -->
      <g transform="translate(388, 30)">
        <rect x="0" y="0" width="176" height="92" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#6d28d9">Action Sandbox</text>
        <text x="10" y="38" class="mono" font-size="10">Rootfs: Read-Only CoW</text>
        <text x="10" y="56" class="mono" font-size="10">Net: Isolated No-Egress</text>
        <text x="10" y="74" class="mono" font-size="10">Seccomp: Block Syscalls</text>
      </g>

      <!-- Subcard 4: Audit Ledger -->
      <g transform="translate(576, 30)">
        <rect x="0" y="0" width="180" height="92" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#047857">Durable Audit Ledger</text>
        <text x="10" y="38" class="mono" font-size="10">Log: Append-Only WAL</text>
        <text x="10" y="56" class="mono" font-size="10">Integrity: CRC32-C / SHA</text>
        <text x="10" y="74" class="mono" font-size="10">Persistence: Direct NVMe</text>
      </g>
    </g>

    <!-- Breach Event Transition -->
    <g transform="translate(250, 175)">
      <line x1="150" y1="0" x2="150" y2="10" class="line-red" />
      <rect x="35" y="10" width="230" height="20" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
      <text x="150" y="24" class="mono" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">ENVELOPE BREACH DETECTED</text>
      <line x1="150" y1="30" x2="150" y2="39" class="arrow" />
    </g>

    <!-- SECTION 2: ESCALATION DISPATCHER -->
    <g transform="translate(16, 215)">
      <rect x="0" y="0" width="768" height="125" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="14" y="20" class="card-hdr" fill="#0f172a">DETERMINISTIC ESCALATION DISPATCHER</text>

      <!-- Escalation Action 1 -->
      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="176" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">K &gt; 3 Tool Errors</text>
        <text x="10" y="36" class="subtext" font-size="10">Invalidate plan cache</text>
        <text x="10" y="52" class="subtext" font-size="10">Inject error frame</text>
        <text x="10" y="68" class="subtext" font-size="10">Force scratchpad re-read</text>
      </g>

      <!-- Escalation Action 2 -->
      <g transform="translate(200, 30)">
        <rect x="0" y="0" width="176" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">H &gt; 25 Turns</text>
        <text x="10" y="36" class="subtext" font-size="10">Halt live generation</text>
        <text x="10" y="52" class="subtext" font-size="10">Snapshot dirty overlay</text>
        <text x="10" y="68" class="subtext" font-size="10">Quarantine ACB state</text>
      </g>

      <!-- Escalation Action 3 -->
      <g transform="translate(388, 30)">
        <rect x="0" y="0" width="176" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">T &gt; 600s Timeout</text>
        <text x="10" y="36" class="subtext" font-size="10">Dispatch SIGKILL</text>
        <text x="10" y="52" class="subtext" font-size="10">Tear down sandbox</text>
        <text x="10" y="68" class="subtext" font-size="10">Drain inflight RPCs</text>
      </g>

      <!-- Escalation Action 4 -->
      <g transform="translate(576, 30)">
        <rect x="0" y="0" width="180" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">High-Blast Action</text>
        <text x="10" y="36" class="subtext" font-size="10">Suspend execution loop</text>
        <text x="10" y="52" class="subtext" font-size="10">Hold action in escrow</text>
        <text x="10" y="68" class="subtext" font-size="10">Escalate to human gate</text>
      </g>
    </g>
  </g>
</svg>
