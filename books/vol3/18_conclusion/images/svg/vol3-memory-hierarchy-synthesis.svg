<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1160" height="620" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .tier-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12.5px; fill: #0f172a; }
      .box-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; }
      .text-reg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-weight: 700; font-size: 9.5px; }
      .tag { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; font-weight: 600; }
      .bus-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .arrow-data { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arr-blue); }
      .arrow-inval { stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-red); }
      .arrow-sync { stroke: #059669; stroke-width: 1.6; fill: none; marker-end: url(#arr-green); }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="1160" height="620" class="bg" />

  <!-- TOP ROW: VOLATILE & INFERENCE TIERS (Tiers 1 & 2) -->
  <!-- TIER 1: LOGICAL WORKING CONTEXT -->
  <g transform="translate(30, 20)">
    <rect width="530" height="230" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 0 L 530 0 L 530 28 L 0 28 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="19" class="tier-hdr" fill="#1e40af">TIER 1: LOGICAL WORKING CONTEXT</text>
    <text x="350" y="19" class="tag" fill="#2563eb">Host Heap · Ephemeral Viewport</text>

    <!-- Sub-blocks inside Tier 1 -->
    <g transform="translate(14, 38)">
      <!-- Context Frame Structure -->
      <rect width="242" height="178" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Active Sequence Bounding</text>
      <text x="10" y="34" class="mono">Tokens: L_t ≤ L_max (e.g. 128k)</text>
      <text x="10" y="50" class="text-reg">Owned by: Host Agent Supervisor</text>
      <text x="10" y="66" class="text-reg">Latency: ≤ 1 ms assembly</text>

      <rect x="8" y="80" width="226" height="88" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="14" y="96" class="mono-bold" fill="#0f172a">Viewport Token Layout:</text>
      <text x="14" y="112" class="mono">[System Prompt | Tool Contracts]</text>
      <text x="14" y="128" class="mono">[Historical Trajectory Slices]</text>
      <text x="14" y="144" class="mono">[Selected Artifact References]</text>
      <text x="14" y="160" class="mono">[Observation Envelope o_t]</text>
    </g>

    <g transform="translate(268, 38)">
      <!-- Compaction & Filtering Engine -->
      <rect width="248" height="178" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Context Assembly &amp; Compaction</text>
      <text x="10" y="36" class="text-reg">Dynamic Token Allocator:</text>
      <text x="10" y="52" class="mono">Budget: M_rem = M_task - ∑ m_i</text>
      <text x="10" y="72" class="text-reg">Sliding-Window Truncation:</text>
      <text x="10" y="88" class="mono">Evicts distant turns on turn ceiling</text>
      <text x="10" y="108" class="text-reg">Observation Sanitizer:</text>
      <text x="10" y="124" class="mono">ANSI stripping, byte clamping</text>
      <text x="10" y="144" class="text-reg">Rewrite Protocol:</text>
      <text x="10" y="160" class="mono-bold" fill="#b91c1c">Invalidated files purged per turn</text>
    </g>
  </g>

  <!-- TIER 2: PHYSICAL KV CACHE -->
  <g transform="translate(600, 20)">
    <rect width="530" height="230" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 0 L 530 0 L 530 28 L 0 28 Z" fill="#f5f3ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="19" class="tier-hdr" fill="#5b21b6">TIER 2: PHYSICAL KEY-VALUE (KV) CACHE</text>
    <text x="350" y="19" class="tag" fill="#7c3aed">HBM / Host DRAM · Volatile</text>

    <!-- Sub-blocks inside Tier 2 -->
    <g transform="translate(14, 38)">
      <!-- PagedAttention Manager -->
      <rect width="242" height="178" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">PagedAttention Allocation</text>
      <text x="10" y="34" class="mono">Activation Tensors: K, V</text>
      <text x="10" y="50" class="text-reg">Owned by: Inference Serving Engine</text>
      <text x="10" y="66" class="text-reg">Latency: ~10 ns (HBM) / 50 ns (PCIe)</text>

      <rect x="8" y="80" width="226" height="88" rx="3" fill="#faf5ff" stroke="#e9d5ff"/>
      <text x="14" y="96" class="mono-bold" fill="#581c87">Block Table Mapping:</text>
      <text x="14" y="112" class="mono">Logical Page 0 → Phys Frame #402</text>
      <text x="14" y="128" class="mono">Logical Page 1 → Phys Frame #118</text>
      <text x="14" y="144" class="mono">Radix Tree Prefix Node #A7</text>
      <text x="14" y="160" class="mono">Prefix Sharing Across Samples</text>
    </g>

    <g transform="translate(268, 38)">
      <!-- Tier 2 Eviction & Invalidation -->
      <rect width="248" height="178" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Prefix Lifecycle &amp; Paging</text>
      <text x="10" y="36" class="text-reg">Radix Tree Sharing:</text>
      <text x="10" y="52" class="mono">Zero-copy prefix reuse across turns</text>
      <text x="10" y="72" class="text-reg">Host DRAM Swap (PCIe Gen5):</text>
      <text x="10" y="88" class="mono">Suspended trajectories paged out</text>
      <text x="10" y="108" class="text-reg">Prefix Severing Mechanism:</text>
      <text x="10" y="124" class="mono-bold" fill="#b91c1c">Hash mismatch on dirty prompt</text>
      <text x="10" y="140" class="mono-bold" fill="#b91c1c">→ Tree node unlinked &amp; recycled</text>
      <text x="10" y="160" class="text-reg">Capacity: 80–192 GB per GPU</text>
    </g>
  </g>

  <!-- Dataflow Arrow: Logical Context Token Prefill -> KV Cache Projections -->
  <path d="M 560 90 L 598 90" class="arrow-data"/>
  <text x="563" y="82" class="tag" fill="#2563eb">GEMM</text>

  <!-- MIDDLE BAR: SUPERVISOR CACHE COHERENCE & INVALIDATION BUS -->
  <g transform="translate(30, 268)">
    <rect width="1100" height="42" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="20" y="26" class="bus-label">HOST SUPERVISOR CACHE COHERENCE &amp; INVALIDATION FABRIC</text>
    <text x="520" y="26" class="tag" fill="#94a3b8">Protocols: Invalidation Broadcast · Prefix Tree Severing · Write-Through Tombstones</text>
  </g>

  <!-- Invalidation signals from Bus up to Tier 1 and Tier 2 -->
  <line x1="280" y1="268" x2="280" y2="252" class="arrow-inval"/>
  <text x="286" y="263" class="tag" fill="#dc2626">Rewrite Stale Context</text>

  <line x1="860" y1="268" x2="860" y2="252" class="arrow-inval"/>
  <text x="866" y="263" class="tag" fill="#dc2626">Sever Radix KV Prefix</text>

  <!-- BOTTOM ROW: PERSISTENT TIERS (Tiers 3 & 4) -->
  <!-- TIER 3: AUTHORITATIVE EXTERNAL ARTIFACTS -->
  <g transform="translate(30, 330)">
    <rect width="530" height="260" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 0 L 530 0 L 530 28 L 0 28 Z" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="19" class="tier-hdr" fill="#065f46">TIER 3: AUTHORITATIVE EXTERNAL ARTIFACTS</text>
    <text x="350" y="19" class="tag" fill="#059669">Local NVMe / Git · Ground Truth</text>

    <!-- Sub-blocks inside Tier 3 -->
    <g transform="translate(14, 38)">
      <!-- Sandboxed Workspace Ground Truth -->
      <rect width="242" height="206" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Target Workspace Ground Truth</text>
      <text x="10" y="34" class="text-reg">Storage Medium: NVMe / Overlayfs</text>
      <text x="10" y="50" class="text-reg">Latency: 10 µs – 10 ms (I/O bound)</text>
      <text x="10" y="66" class="text-reg">Capacity: Multi-TB / Quota bounded</text>

      <rect x="8" y="80" width="226" height="116" rx="3" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="12" y="96" class="mono-bold" fill="#166534">Authoritative State Entities:</text>
      <text x="12" y="112" class="mono">Git Worktree &amp; Branch Commit</text>
      <text x="12" y="128" class="mono">Source Code Files (src/**/*.rs)</text>
      <text x="12" y="144" class="mono">Relational DB Schema / Tables</text>
      <text x="12" y="160" class="mono">Ephemeral MicroVM Container Rootfs</text>
      <text x="12" y="180" class="mono-bold" fill="#059669">Model holds zero ambient authority</text>
    </g>

    <g transform="translate(268, 38)">
      <!-- Mutation & Oracle Validation -->
      <rect width="248" height="206" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Mutation Boundary &amp; Watchers</text>
      <text x="10" y="36" class="text-reg">Sandboxed Mutation Mechanism:</text>
      <text x="10" y="52" class="mono">Copy-on-Write (CoW) overlay branch</text>
      <text x="10" y="72" class="text-reg">Inotify / Filesystem Watcher:</text>
      <text x="10" y="88" class="mono">Catches tool write events immediately</text>
      <text x="10" y="108" class="text-reg">Deterministic Mechanical Verification:</text>
      <text x="10" y="124" class="mono">cargo test / pytest / rustc build</text>
      <text x="10" y="144" class="text-reg">Coherence Invariant:</text>
      <text x="10" y="160" class="mono-bold" fill="#dc2626">On write(file) → emit Invalidation</text>
      <text x="10" y="176" class="mono-bold" fill="#dc2626">to Supervisor Bus in &lt; 5 ms</text>
    </g>
  </g>

  <!-- Mutation event up from Tier 3 to Supervisor Bus -->
  <line x1="410" y1="330" x2="410" y2="312" class="arrow-inval"/>
  <text x="404" y="324" class="tag" fill="#dc2626" text-anchor="end">Mutation Event (Tool fs_write)</text>

  <!-- TIER 4: DERIVATIVE RETRIEVAL INDEXES & LOGS -->
  <g transform="translate(600, 330)">
    <rect width="530" height="260" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 0 L 530 0 L 530 28 L 0 28 Z" fill="#fffbeb" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="19" class="tier-hdr" fill="#92400e">TIER 4: DERIVATIVE INDEXES &amp; PERSISTENT LOGS</text>
    <text x="350" y="19" class="tag" fill="#d97706">NVMe / SQLite / Vector DB</text>

    <!-- Sub-blocks inside Tier 4 -->
    <g transform="translate(14, 38)">
      <!-- Derivative Indexes -->
      <rect width="242" height="206" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Secondary Derivative Views</text>
      <text x="10" y="34" class="text-reg">Owned by: Retrieval &amp; WAL Subsystems</text>
      <text x="10" y="50" class="text-reg">Query Latency: 2 – 50 ms</text>
      <text x="10" y="66" class="text-reg">Authority: ZERO Intrinsic Authority</text>

      <rect x="8" y="80" width="226" height="116" rx="3" fill="#fefce8" stroke="#fef08a"/>
      <text x="12" y="96" class="mono-bold" fill="#854d0e">Derivative Index Engines:</text>
      <text x="12" y="112" class="mono">Dense Vector DB (HNSW / IVF-PQ)</text>
      <text x="12" y="128" class="mono">Code AST Symbol Graph (Tree-Sitter)</text>
      <text x="12" y="144" class="mono">Lexical Sparse Inverted Index (BM25)</text>
      <text x="12" y="160" class="mono">Radix Trajectory Trace Index</text>
      <text x="12" y="180" class="mono-bold" fill="#b45309">Strict Tombstone Compaction</text>
    </g>

    <g transform="translate(268, 38)">
      <!-- Durable WAL & Saga Logs -->
      <rect width="248" height="206" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="box-hdr" fill="#1e293b">Write-Ahead Log (WAL) &amp; Sagas</text>
      <text x="10" y="36" class="text-reg">Append-Only Intent Journal:</text>
      <text x="10" y="52" class="mono">Pre-execution fsync on disk</text>
      <text x="10" y="72" class="text-reg">Crash-Consistent Trajectory State:</text>
      <text x="10" y="88" class="mono">Enables exact point-in-time recovery</text>
      <text x="10" y="108" class="text-reg">Distributed Saga Ledger:</text>
      <text x="10" y="124" class="mono">Registers compensating action c_t</text>
      <text x="10" y="144" class="text-reg">Re-Indexing Trigger:</text>
      <text x="10" y="160" class="mono-bold" fill="#dc2626">Tombstones dirty vectors;</text>
      <text x="10" y="176" class="mono-bold" fill="#dc2626">Asynchronous background rebuild</text>
    </g>
  </g>

  <!-- Synchronization / Tombstone signal from Bus down to Tier 4 -->
  <line x1="750" y1="310" x2="750" y2="328" class="arrow-inval"/>
  <text x="756" y="324" class="tag" fill="#dc2626">Write-Through Tombstone</text>

  <!-- Recall path from Tier 4 up to Tier 1 -->
  <path d="M 680 330 L 680 300 L 520 300 L 520 252" class="arrow-sync"/>
  <text x="674" y="324" class="tag" fill="#059669" text-anchor="end">Top-k Semantic Recall</text>
</svg>