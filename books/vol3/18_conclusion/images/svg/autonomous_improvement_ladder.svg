<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT SIDEBAR: COST & BLAST RADIUS AXES                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="72" height="382" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Left Axis: Compute & Eng Cost -->
    <line x1="22" y1="362" x2="22" y2="18" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
    <text transform="translate(15, 196) rotate(-90)" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626" letter-spacing="0.3">COMPUTE &amp; ENG COST ($ / GPU-HRS)</text>

    <!-- Right Axis: Blast Radius & Irreversibility -->
    <line x1="50" y1="362" x2="50" y2="18" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
    <text transform="translate(58, 196) rotate(-90)" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569" letter-spacing="0.3">BLAST RADIUS &amp; IRREVERSIBILITY</text>
  </g>

  <!-- ================================================================= -->
  <!-- LADDER RUNGS (5 HIERARCHICAL TIERS)                                -->
  <!-- ================================================================= -->
  <g transform="translate(124, 74)">

    <!-- RUNG 5: Trajectory Post-Training & RLVR (Highest Cost / Weights) -->
    <g transform="translate(0, 0)">
      <rect width="796" height="70" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect width="796" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#991b1b">RUNG 5 · TRAJECTORY POST-TRAINING &amp; RLVR (WEIGHT MODIFICATION)</text>

      <!-- Metadata Badges -->
      <g transform="translate(480, 3)">
        <rect width="96" height="16" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
        <text x="48" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">COST: 10⁴ – 10⁶ $</text>
      </g>
      <g transform="translate(584, 3)">
        <rect width="106" height="16" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
        <text x="53" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">WEIGHT DRIFT</text>
      </g>
      <g transform="translate(698, 3)">
        <rect width="86" height="16" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
        <text x="43" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">LAST RESORT</text>
      </g>

      <text x="12" y="40" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> SFT on curated expert trajectories, Rule-Based RL with Verifiable Rewards (RLVR / GRPO, DeepSeek-R1).</text>
      <text x="12" y="56" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Internalize complex tool syntax, calibrate self-correction heuristics, and compress deliberative search depth into parametric policy.</text>
    </g>

    <!-- RUNG 4: Runtime Verification & Deterministic Sandboxes -->
    <g transform="translate(0, 78)">
      <rect width="796" height="70" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect width="796" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#15803d">RUNG 4 · RUNTIME VERIFICATION &amp; DETERMINISTIC SANDBOXES (SAFETY CORE)</text>

      <!-- Metadata Badges -->
      <g transform="translate(480, 3)">
        <rect width="96" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="48" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">COST: 10² – 10³ $</text>
      </g>
      <g transform="translate(584, 3)">
        <rect width="106" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="53" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">HERMETIC CoW</text>
      </g>
      <g transform="translate(698, 3)">
        <rect width="86" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="43" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">COMPENSATE</text>
      </g>

      <text x="12" y="40" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> MicroVM isolation (Firecracker/Wasm), CoW filesystem snapshots, deterministic test oracles, and Sagas.</text>
      <text x="12" y="56" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Enforce the Reversibility Boundary. Ensures faulty agent actions are contained, rewound, or compensated before mutating prod.</text>
    </g>

    <!-- RUNG 3: Tool ABIs, Schema Validation & Capability Leases -->
    <g transform="translate(0, 156)">
      <rect width="796" height="70" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect width="796" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#b45309">RUNG 3 · TOOL ABIS, SCHEMA VALIDATION &amp; CAPABILITY LEASES</text>

      <!-- Metadata Badges -->
      <g transform="translate(480, 3)">
        <rect width="96" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
        <text x="48" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">COST: 10¹ – 10² $</text>
      </g>
      <g transform="translate(584, 3)">
        <rect width="106" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
        <text x="53" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">STRICT JSON</text>
      </g>
      <g transform="translate(698, 3)">
        <rect width="86" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
        <text x="43" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">MCP SERVER</text>
      </g>

      <text x="12" y="40" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> Model Context Protocol (MCP), Pydantic/JSONSchema validation, idempotent tool interfaces, and least-privilege leases.</text>
      <text x="12" y="56" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Eliminate tool parameter hallucinations, enforce syntactic correctness, and restrict unauthorized operational blast radius.</text>
    </g>

    <!-- RUNG 2: Context Working Sets & Radix Prefix Caching -->
    <g transform="translate(0, 234)">
      <rect width="796" height="70" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <rect width="796" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#6d28d9">RUNG 2 · CONTEXT WORKING SETS &amp; RADIX PREFIX CACHING</text>

      <!-- Metadata Badges -->
      <g transform="translate(480, 3)">
        <rect width="96" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
        <text x="48" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">COST: 10⁰ – 10¹ $</text>
      </g>
      <g transform="translate(584, 3)">
        <rect width="106" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
        <text x="53" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">RADIX TREE</text>
      </g>
      <g transform="translate(698, 3)">
        <rect width="86" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
        <text x="43" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">PAGED KV</text>
      </g>

      <text x="12" y="40" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> Semantic context compaction, sliding observation windows, dynamic tool pruning, and Radix KV-cache reuse.</text>
      <text x="12" y="56" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Prevent context pollution and attention dilution while maximizing prefix reuse (90%+ hit rate) to slash TTFT.</text>
    </g>

    <!-- RUNG 1: System Prompt Engineering & Deliberative Scaffolding -->
    <g transform="translate(0, 312)">
      <rect width="796" height="70" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="796" height="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0369a1">RUNG 1 · SYSTEM PROMPT ENGINEERING &amp; DELIBERATIVE SCAFFOLDING</text>

      <!-- Metadata Badges -->
      <g transform="translate(480, 3)">
        <rect width="96" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="48" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">COST: &lt; 10⁰ $</text>
      </g>
      <g transform="translate(584, 3)">
        <rect width="106" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="53" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">LOCAL DIFF</text>
      </g>
      <g transform="translate(698, 3)">
        <rect width="86" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="43" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">RAPID ITER</text>
      </g>

      <text x="12" y="40" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> Few-shot calibration, structured scratchpads (XML tags), role demarcation, and clear failure taxonomy in instructions.</text>
      <text x="12" y="56" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Rapid hypothesis exploration; easily versioned, tested, and reverted via standard Git pull-request workflows.</text>
    </g>

  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM PRINCIPLE BANNER                                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 468)">
    <rect width="880" height="56" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="880" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="14" font-size="9" font-weight="700" fill="#15803d">THE RUNG INVARIANT (BUILD BEFORE TRAIN)</text>
    <text x="12" y="34" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">"Never ascend to weight adaptation (Rung 5)</tspan> to solve a failure that can be resolved by prompt specification (Rung 1), context management (Rung 2),</text>
    <text x="12" y="46" font-size="8" fill="#334155">strict tool contracts (Rung 3), or runtime sandboxing and verification (Rung 4). Systems scaffolding is deterministic, auditable, and cheap; weights are expensive and drift."</text>
  </g>
</g>
</svg>