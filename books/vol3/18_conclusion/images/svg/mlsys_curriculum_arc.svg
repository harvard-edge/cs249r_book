    <text x="12" y="14" font-size="9" font-weight="700" fill="#0369a1">THE UNIFYING MLSYS PRINCIPLE: THE INVARIANT CLOSURE ACROSS COMPUTING DOMAINS</text>
    <text x="12" y="36" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">While computational mechanisms evolve</tspan> from single-node GPU kernels to distributed clusters, software trajectory runtimes, and embodied robots,</text>
    <text x="12" y="50" font-size="8" fill="#334155">architectural invariants—resource isolation, cache locality, fail-safe verification, and state reversibility—remain the permanent foundations of machine learning engineering.</text>
