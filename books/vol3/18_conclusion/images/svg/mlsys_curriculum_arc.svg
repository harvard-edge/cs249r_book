  <line x1="474" y1="265" x2="486" y2="265" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <line x1="698" y1="265" x2="710" y2="265" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <!-- ================================================================= -->
