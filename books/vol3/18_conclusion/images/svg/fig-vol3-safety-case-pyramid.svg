<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-hdr  { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .tier-hdr   { font-size: 9.5px; font-weight: 700; }
      .item       { font-size: 9px;   fill: #475569; }
      .metric     { font-size: 8px;   fill: #475569; }
      .claim-hdr  { font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .role       { font-size: 8px;   font-weight: 700; fill: #64748b; }
      .ev         { font-size: 9px;   fill: #475569; }
      .mono       { font-family: "Courier New", monospace; font-size: 8px; }
      .panel-bg   { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; }
      .card-bg    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#fff" rx="4"/>

  <!-- ============ PANEL A : evidence pyramid ============ -->
  <g transform="translate(30, 20)">
    <rect class="panel-bg" width="560" height="390" rx="5"/>
    <rect width="560" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text class="panel-hdr" x="14" y="18">PANEL A: Three-Tier Evidence Pyramid</text>

    <!-- Top tier — narrowest: least traffic, least certainty -->
    <g transform="translate(140, 44)">
      <rect width="280" height="86" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text class="tier-hdr" x="12" y="18" fill="#dc2626">TOP TIER &#183; Runtime canary</text>
      <text class="item" x="12" y="35">Circuit breakers</text>
      <text class="item" x="12" y="48">Canary rings &#183; SPRT</text>
      <text class="item" x="12" y="61">OpenTelemetry tracing</text>
      <text class="metric" x="12" y="78">&#60; 100 ms &#183; in-flight</text>
      <text class="mono" x="268" y="78" text-anchor="end" fill="#dc2626">T_react &#60; 50 ms</text>
    </g>

    <!-- Middle tier -->
    <g transform="translate(90, 146)">
      <rect width="380" height="100" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text class="tier-hdr" x="12" y="18" fill="#d97706">MIDDLE TIER &#183; Statistical gyms</text>
      <text class="item" x="12" y="35">Hermetic gyms</text>
      <text class="item" x="12" y="48">Wilson bounds</text>
      <text class="item" x="12" y="61">Compounding reliability</text>
      <text class="item" x="12" y="74">Dirty fixtures</text>
      <text class="metric" x="12" y="91">10 s &#8211; 10 min &#183; statistical</text>
      <text class="mono" x="368" y="91" text-anchor="end" fill="#d97706">N &#8805; 2,400 &#183; &#916;p &#8804; 2.0%</text>
    </g>

    <!-- Base tier — widest: intercepts most transitions -->
    <g transform="translate(40, 262)">
      <rect width="480" height="100" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text class="tier-hdr" x="12" y="18" fill="#16a34a">BASE TIER &#183; Mechanical verifiers</text>
      <text class="item" x="12" y="35">AST linters &#183; compilers</text>
      <text class="item" x="12" y="48">Pushdown automata</text>
      <text class="item" x="12" y="61">seccomp-bpf enclaves</text>
      <text class="item" x="12" y="74">Static taint analysis</text>
      <text class="metric" x="12" y="91">&#60; 1 ms &#183; formal grammars</text>
      <text class="mono" x="468" y="91" text-anchor="end" fill="#16a34a">error rate = 0</text>
    </g>
  </g>

  <!-- ============ PANEL B : claim / argument / evidence ============ -->
  <g transform="translate(610, 20)">
    <rect class="panel-bg" width="560" height="390" rx="5"/>
    <rect width="560" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text class="panel-hdr" x="14" y="18">PANEL B: Claim &#8592; Argument &#8592; Evidence</text>

    <!-- Claim 1 -->
    <g transform="translate(18, 44)">
      <rect class="card-bg" width="524" height="100" rx="4"/>
      <path d="M 0 0 L 524 0 L 524 22 L 0 22 Z" fill="#e2e8f0"/>
      <text class="claim-hdr" x="12" y="15">CLAIM 1 &#183; Zero host privilege escalation</text>
      <text class="role" x="12" y="42">ARGUMENT</text>
      <text class="ev" x="80" y="42">microVM isolation, seccomp-bpf syscall filter</text>
      <text class="role" x="12" y="66">EVIDENCE</text>
      <text class="ev" x="80" y="66">Base tier &#8212; 0 syscall violations</text>
      <text class="ev" x="80" y="83">Mid tier &#8212; 10,000 fuzz runs, 0 escapes</text>
    </g>

    <!-- Claim 2 -->
    <g transform="translate(18, 156)">
      <rect class="card-bg" width="524" height="100" rx="4"/>
      <path d="M 0 0 L 524 0 L 524 22 L 0 22 Z" fill="#e2e8f0"/>
      <text class="claim-hdr" x="12" y="15">CLAIM 2 &#183; Bounded spend <tspan class="mono" font-size="9">(C_task &#8804; B_max)</tspan></text>
      <text class="role" x="12" y="42">ARGUMENT</text>
      <text class="ev" x="80" y="42">Monotonic ledger, non-overlapping escrows</text>
      <text class="role" x="12" y="66">EVIDENCE</text>
      <text class="ev" x="80" y="66">Base tier &#8212; <tspan class="mono" font-size="9">B = E + R + F</tspan> holds</text>
      <text class="ev" x="80" y="83">Top tier &#8212; breaker trips at $2.00/min</text>
    </g>

    <!-- Claim 3 -->
    <g transform="translate(18, 268)">
      <rect class="card-bg" width="524" height="100" rx="4"/>
      <path d="M 0 0 L 524 0 L 524 22 L 0 22 Z" fill="#e2e8f0"/>
      <text class="claim-hdr" x="12" y="15">CLAIM 3 &#183; Deterministic recovery on fault</text>
      <text class="role" x="12" y="42">ARGUMENT</text>
      <text class="ev" x="80" y="42">WAL compensation, reverse-order sagas</text>
      <text class="role" x="12" y="66">EVIDENCE</text>
      <text class="ev" x="80" y="66">Mid tier &#8212; 500 fault seeds, 100% rollback</text>
      <text class="ev" x="80" y="83">Top tier &#8212; MTTR &#60; 3.2 s</text>
    </g>
  </g>
</svg>
