    <text x="12" y="14" font-size="9" font-weight="700" fill="#0369a1">LAMPSON&apos;S PRINCIPLE OF PROGRESSIVE DELEGATION (TRUST CALIBRATION)</text>
    <text x="12" y="35" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">"Autonomous authority is not an all-or-nothing binary toggle.</tspan> Systems runtimes must calibrate delegated capability dynamically:</text>
    <text x="12" y="49" font-size="8" fill="#334155">advancing agents along the spectrum only as empirical verification density accumulates and compensating rollback mechanisms are proven."</text>
