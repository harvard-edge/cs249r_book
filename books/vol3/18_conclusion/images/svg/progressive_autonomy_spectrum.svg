    <text x="12" y="36" class="tier-sub" fill="#16a34a">Human-on-the-Loop (HOTL)</text>

    <g transform="translate(10, 56)">
      <rect x="0" y="0" width="192" height="50" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="14" class="field-label">Trajectory Horizon</text>
      <text x="8" y="28" class="field-val">H ≤ 50 Steps</text>
      <text x="8" y="42" class="field-val">End-to-end issue resolution</text>

      <rect x="0" y="58" width="192" height="50" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="72" class="field-label">Authority Boundary</text>
      <text x="8" y="86" class="field-val">Capability Lease with TTL</text>
      <text x="8" y="100" class="field-val">Pre-authorized tool budget</text>

      <rect x="0" y="116" width="192" height="50" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="130" class="field-label">Verification Gate</text>
      <text x="8" y="144" class="field-val">Automated Regression Oracle</text>
      <text x="8" y="158" class="field-val">Escalate to human on exception</text>

      <rect x="0" y="174" width="192" height="50" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="188" class="field-label">Systems Harness</text>
      <text x="8" y="202" class="field-val">MicroVM (Firecracker/CoW)</text>
      <text x="8" y="216" class="field-val">Compensating Saga log</text>

      <rect x="0" y="232" width="192" height="50" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="8" y="246" class="field-label" fill="#15803d">Production Risk</text>
      <text x="8" y="260" class="field-val" fill="#166534">Medium / Reversible</text>
      <text x="8" y="274" class="field-val" fill="#166534">Automatic rollback on fault</text>
    </g>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(703, 102)">
    <rect width="212" height="348" rx="2" fill="#ffffff" stroke="#fcd34d" stroke-width="1.8" />
    <rect x="0" y="0" width="212" height="46" rx="2" fill="#fefce8"/>
    <path d="M 0 38 L 0 46 L 212 46 L 212 38 Z" fill="#fefce8"/>
    <line x1="0" y1="46" x2="212" y2="46" stroke="#fef08a" stroke-width="1"/>
    <text x="12" y="20" class="tier-title" fill="#a16207">Tier 3: Statistical Canary</text>
    <text x="12" y="36" class="tier-sub" fill="#ca8a04">Autonomous Fleet Operation</text>

    <g transform="translate(10, 56)">
      <rect x="0" y="0" width="192" height="50" rx="4" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
      <text x="8" y="14" class="field-label">Trajectory Horizon</text>
      <text x="8" y="28" class="field-val">H &gt; 100 Steps (Continuous)</text>
      <text x="8" y="42" class="field-val">Autonomous background agents</text>

      <rect x="0" y="58" width="192" height="50" rx="4" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
      <text x="8" y="72" class="field-label">Authority Boundary</text>
      <text x="8" y="86" class="field-val">Autonomous Prod Mutations</text>
      <text x="8" y="100" class="field-val">Restricted by network air-gap</text>

      <rect x="0" y="116" width="192" height="50" rx="4" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
      <text x="8" y="130" class="field-label">Verification Gate</text>
      <text x="8" y="144" class="field-val">SPRT Sequential Testing</text>
      <text x="8" y="158" class="field-val">Cryptographic Merkle audit</text>

      <rect x="0" y="174" width="192" height="50" rx="4" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
      <text x="8" y="188" class="field-label">Systems Harness</text>
      <text x="8" y="202" class="field-val">Hermetic air-gapped cluster</text>
      <text x="8" y="216" class="field-val">Automated canary rollback</text>

      <rect x="0" y="232" width="192" height="50" rx="4" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
      <text x="8" y="246" class="field-label" fill="#a16207">Production Risk</text>
      <text x="8" y="260" class="field-val" fill="#854d0e">High / Statistical Guard</text>
      <text x="8" y="274" class="field-val" fill="#854d0e">Instant kill-switch isolation</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 460)">
    <rect width="890" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="6" height="64" rx="3" fill="#0284c7"/>
    <text x="22" y="24" class="foot-title">Lampson's Principle of Progressive Delegation (Trust Calibration):</text>
    <text x="22" y="42" class="foot-desc">"Autonomous authority is not an all-or-nothing binary toggle. Systems runtimes must calibrate delegated capability dynamically:</text>
    <text x="22" y="56" class="foot-desc">advancing agents along the spectrum only as empirical verification density accumulates and compensating rollback mechanisms are proven."</text>
  </g>
</svg>
