    <text x="12" y="36" class="tier-sub" fill="#06b6d4">Interactive Action Previews</text>

    <g transform="translate(10, 56)">
      <rect x="0" y="0" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="14" class="field-label">Trajectory Horizon</text>
      <text x="8" y="28" class="field-val">H ≤ 5 Steps</text>
      <text x="8" y="42" class="field-val">Single-function refactor</text>

      <rect x="0" y="58" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="72" class="field-label">Authority Boundary</text>
      <text x="8" y="86" class="field-val">Ephemeral Sandboxed Writes</text>
      <text x="8" y="100" class="field-val">Staged workspace edits only</text>

      <rect x="0" y="116" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="130" class="field-label">Verification Gate</text>
      <text x="8" y="144" class="field-val">Diff Inspection Modal</text>
      <text x="8" y="158" class="field-val">Linter + unit test suite</text>

      <rect x="0" y="174" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="188" class="field-label">Systems Harness</text>
      <text x="8" y="202" class="field-val">Docker container sandbox</text>
      <text x="8" y="216" class="field-val">Git worktree isolation</text>

      <rect x="0" y="232" width="192" height="50" rx="4" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
      <text x="8" y="246" class="field-label" fill="#0e7490">Production Risk</text>
      <text x="8" y="260" class="field-val" fill="#155e75">Low / Bounded</text>
      <text x="8" y="274" class="field-val" fill="#155e75">All edits cleanly diffed</text>
    </g>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(477, 102)">
    <rect width="212" height="348" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1.8" />
    <rect x="0" y="0" width="212" height="46" rx="2" fill="#f0fdf4"/>
    <path d="M 0 38 L 0 46 L 212 46 L 212 38 Z" fill="#f0fdf4"/>
    <line x1="0" y1="46" x2="212" y2="46" stroke="#bbf7d0" stroke-width="1"/>
