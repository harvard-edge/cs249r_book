<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .tier-badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; font-weight: 800; }
      .tier-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; }
      .tier-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
      .field-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1e293b; }
      .field-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #334155; }
      .foot-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .foot-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>

    

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE PROGRESSIVE AUTONOMY SPECTRUM: HORIZON, AUTHORITY, AND VERIFICATION GATES</text>
  </g>

  <!-- Spectrum Arrow Bar -->
  <g transform="translate(25, 68)">
    <rect width="890" height="24" rx="4" fill="#e2e8f0"/>
    <!-- Gradient Progress indicator -->
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#93c5fd"/>
    <rect x="220" y="0" width="225" height="24" fill="#67e8f9"/>
    <rect x="445" y="0" width="225" height="24" fill="#86efac"/>
    <rect x="670" y="0" width="220" height="24" rx="4" fill="#fde047"/>
    
    <text x="110" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">TIER 0: SHADOW / SUGGESTION</text>
    <text x="332" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#155e75">TIER 1: GUARDED PREVIEW</text>
    <text x="557" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#166534">TIER 2: TIME-BOUNDED SAGA</text>
    <text x="780" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#854d0e">TIER 3: STATISTICAL CANARY</text>
  </g>

  <!-- 4 Tier Columns -->
  <!-- Tier 0 -->
  <g transform="translate(25, 102)">
    <rect width="212" height="348" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="212" height="46" rx="2" fill="#eff6ff"/>
    <path d="M 0 38 L 0 46 L 212 46 L 212 38 Z" fill="#eff6ff"/>
    <line x1="0" y1="46" x2="212" y2="46" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="20" class="tier-title" fill="#1e40af">Tier 0: Shadow Mode</text>
    <text x="12" y="36" class="tier-sub" fill="#3b82f6">Human-in-the-Loop (100%)</text>

    <g transform="translate(10, 56)">
      <rect x="0" y="0" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="14" class="field-label">Trajectory Horizon</text>
      <text x="8" y="28" class="field-val">H = 1 Step (Turn-scoped)</text>
      <text x="8" y="42" class="field-val">Synchronous request-reply</text>

      <rect x="0" y="58" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="72" class="field-label">Authority Boundary</text>
      <text x="8" y="86" class="field-val">Zero Write Authority</text>
      <text x="8" y="100" class="field-val">Read-only code inspection</text>

      <rect x="0" y="116" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="130" class="field-label">Verification Gate</text>
      <text x="8" y="144" class="field-val">Mandatory Human Review</text>
      <text x="8" y="158" class="field-val">Operator must type/approve</text>

      <rect x="0" y="174" width="192" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="188" class="field-label">Systems Harness</text>
      <text x="8" y="202" class="field-val">Mock tool execution</text>
      <text x="8" y="216" class="field-val">Passive trace shadowing</text>

      <rect x="0" y="232" width="192" height="50" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="8" y="246" class="field-label" fill="#1e40af">Production Risk</text>
      <text x="8" y="260" class="field-val" fill="#1e3a8a">Zero Blast Radius</text>
      <text x="8" y="274" class="field-val" fill="#1e3a8a">Developer copilot mode</text>
    </g>
  </g>

  <!-- Tier 1 -->
  <g transform="translate(251, 102)">
    <rect width="212" height="348" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="212" height="46" rx="2" fill="#ecfeff"/>
    <path d="M 0 38 L 0 46 L 212 46 L 212 38 Z" fill="#ecfeff"/>
    <line x1="0" y1="46" x2="212" y2="46" stroke="#a5f3fc" stroke-width="1"/>
