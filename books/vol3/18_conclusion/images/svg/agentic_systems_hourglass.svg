<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background-color: #ffffff; font-family: Helvetica Neue, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (No Stroke) -->
  <rect width="920" height="400" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- 1. FRONTENDS LAYER                                                -->
  <!-- ================================================================= -->
  <text x="35" y="24" font-size="9.5" font-weight="bold" fill="#0f172a">Frontends</text>

  <!-- Frontend 1: Coding Agents -->
  <g id="fe-coding">
    <rect x="35" y="32" width="130" height="38" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="47" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Coding agents</text>
    <text x="100" y="60" text-anchor="middle" font-size="8" fill="#64748b">repos, tests, CI</text>
  </g>

  <!-- Frontend 2: Cloud Agents -->
  <g id="fe-cloud">
    <rect x="177" y="32" width="130" height="38" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="242" y="47" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Cloud agents</text>
    <text x="242" y="60" text-anchor="middle" font-size="8" fill="#64748b">configs, rollout</text>
  </g>

  <!-- Frontend 3: Data Agents -->
  <g id="fe-data">
    <rect x="319" y="32" width="130" height="38" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="384" y="47" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Data agents</text>
    <text x="384" y="60" text-anchor="middle" font-size="8" fill="#64748b">queries, workflows</text>
  </g>

  <!-- Frontend 4: Physical AI -->
  <g id="fe-physical">
    <rect x="461" y="32" width="130" height="38" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="526" y="47" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Physical AI</text>
    <text x="526" y="60" text-anchor="middle" font-size="8" fill="#64748b">robots, vehicles</text>
  </g>

  <!-- Frontend 5: Edge Agents -->
  <g id="fe-edge">
    <rect x="603" y="32" width="130" height="38" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="668" y="47" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Edge agents</text>
    <text x="668" y="60" text-anchor="middle" font-size="8" fill="#64748b">latency, energy</text>
  </g>

  <!-- Converging Flow Lines into Narrow Waist -->
  <path d="M 100 70 L 320 120" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M 242 70 L 355 120" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M 384 70 L 384 120" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M 526 70 L 413 120" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M 668 70 L 448 120" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <g>
    <rect x="145" y="88" width="130" height="18" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    <text x="210" y="100" text-anchor="middle" font-size="8" font-style="italic" fill="#475569">lower diverse agent work</text>
  </g>
  <g>
    <rect x="475" y="88" width="160" height="18" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    <text x="555" y="100" text-anchor="middle" font-size="8" font-style="italic" fill="#475569">without standardizing internals</text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. THE NARROW WAIST: TRAJECTORY IR / DESCRIPTOR                   -->
  <!-- ================================================================= -->
  <g id="narrow-waist">
    <rect x="35" y="125" width="698" height="66" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="384" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0369a1">Trajectory IR / Descriptor</text>
    <text x="384" y="158" text-anchor="middle" font-size="8.5" fill="#0284c7">IR-like systems record for the trajectory, not a model prompt</text>
    <text x="384" y="176" text-anchor="middle" font-size="8" font-family="Courier New, monospace" font-weight="bold" fill="#0f172a">identity + goal  |  budget + deadline  |  context handles  |  authority  |  effects  |  evidence  |  placement constraints</text>
  </g>

  <!-- Diverging Flow Lines from Waist into Management Passes -->
  <path d="M 320 191 L 100 230" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 355 191 L 242 230" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 384 191 L 384 230" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M 413 191 L 526 230" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M 448 191 L 668 230" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ================================================================= -->
  <!-- 3. MANAGEMENT PASSES                                              -->
  <!-- ================================================================= -->
  <text x="18" y="254" font-size="9" font-weight="bold" fill="#0f172a" transform="rotate(-90 18 254)" text-anchor="middle">Management passes</text>

  <!-- Pass 1: Schedule/place -->
  <g id="pass-schedule">
    <rect x="35" y="235" width="130" height="42" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="100" y="251" text-anchor="middle" font-size="9" font-weight="bold" fill="#0369a1">Schedule / place</text>
    <text x="100" y="266" text-anchor="middle" font-size="8" fill="#0284c7">admit, branch, migrate</text>
  </g>

  <!-- Pass 2: Manage context -->
  <g id="pass-context">
    <rect x="177" y="235" width="130" height="42" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="242" y="251" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">Manage context</text>
    <text x="242" y="266" text-anchor="middle" font-size="8" fill="#16a34a">reuse, compact, evict</text>
  </g>

  <!-- Pass 3: Protect effects -->
  <g id="pass-effects">
    <rect x="319" y="235" width="130" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="384" y="251" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">Protect effects</text>
    <text x="384" y="266" text-anchor="middle" font-size="8" fill="#d97706">approve, attenuate</text>
  </g>

  <!-- Pass 4: Recover/trace -->
  <g id="pass-recover">
    <rect x="461" y="235" width="130" height="42" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="526" y="251" text-anchor="middle" font-size="9" font-weight="bold" fill="#6d28d9">Recover / trace</text>
    <text x="526" y="266" text-anchor="middle" font-size="8" fill="#7c3aed">checkpoint, audit</text>
  </g>

  <!-- Pass 5: Evaluate -->
  <g id="pass-eval">
    <rect x="603" y="235" width="130" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="668" y="251" text-anchor="middle" font-size="9" font-weight="bold" fill="#b91c1c">Evaluate</text>
    <text x="668" y="266" text-anchor="middle" font-size="8" fill="#dc2626">verified work / cost</text>
  </g>

  <!-- Connecting Lines from Passes to Substrates -->
  <line x1="100" y1="277" x2="100" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="242" y1="277" x2="242" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="384" y1="277" x2="384" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="526" y1="277" x2="526" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="668" y1="277" x2="668" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ================================================================= -->
  <!-- 4. SUBSTRATES LAYER                                               -->
  <!-- ================================================================= -->
  <text x="35" y="312" font-size="9.5" font-weight="bold" fill="#0f172a">Substrates</text>

  <!-- Substrate 1: Model Serving -->
  <g id="sub-serving">
    <rect x="35" y="322" width="130" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="343" text-anchor="middle" font-size="8.5" fill="#334155">model serving</text>
  </g>

  <!-- Substrate 2: Context / Storage Tiers -->
  <g id="sub-storage">
    <rect x="177" y="322" width="130" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="242" y="343" text-anchor="middle" font-size="8.5" fill="#334155">context / storage tiers</text>
  </g>

  <!-- Substrate 3: Tool Runtimes -->
  <g id="sub-tools">
    <rect x="319" y="322" width="130" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="384" y="343" text-anchor="middle" font-size="8.5" fill="#334155">tool runtimes</text>
  </g>

  <!-- Substrate 4: OS / Cluster / Fabric -->
  <g id="sub-cluster">
    <rect x="461" y="322" width="130" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="526" y="343" text-anchor="middle" font-size="8.5" fill="#334155">OS / cluster / fabric</text>
  </g>

  <!-- Substrate 5: Accelerators / Edge / World -->
  <g id="sub-hardware">
    <rect x="603" y="322" width="130" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="668" y="343" text-anchor="middle" font-size="8.5" fill="#334155">accelerators / edge / world</text>
  </g>

  <!-- ================================================================= -->
  <!-- 5. COST MODEL (RIGHT PANEL)                                       -->
  <!-- ================================================================= -->
  <g id="cost-model">
    <rect x="765" y="125" width="125" height="231" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="765" y="125" width="125" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="827" y="142" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Cost model</text>

    <!-- Dimension List -->
    <text x="827" y="174" text-anchor="middle" font-size="8.5" fill="#334155">latency</text>
    <text x="827" y="196" text-anchor="middle" font-size="8.5" fill="#334155">energy</text>
    <text x="827" y="218" text-anchor="middle" font-size="8.5" fill="#334155">thermal</text>
    <text x="827" y="240" text-anchor="middle" font-size="8.5" fill="#334155">carbon</text>
    <text x="827" y="262" text-anchor="middle" font-size="8.5" fill="#334155">privacy</text>
    <text x="827" y="284" text-anchor="middle" font-size="8.5" fill="#334155">safety</text>

    <line x1="780" y1="305" x2="875" y2="305" stroke="#cbd5e1" stroke-width="1"/>
    <text x="827" y="325" text-anchor="middle" font-size="8" font-style="italic" fill="#64748b">constrains</text>
    <text x="827" y="337" text-anchor="middle" font-size="8" font-style="italic" fill="#64748b">every layer</text>

    <!-- Dashed constraint connector to waist -->
    <path d="M 765 158 L 733 158" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>
</svg>
