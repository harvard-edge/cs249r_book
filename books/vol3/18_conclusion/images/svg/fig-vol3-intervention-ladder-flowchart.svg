<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 495" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="495" fill="#FFFFFF"/>

  <!-- Top Invariant / Formula Ribbon -->
  <g transform="translate(40, 16)">
    <rect x="0" y="0" width="1070" height="34" rx="4" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.2"/>
    <text x="16" y="21" font-size="10.5" font-weight="700" fill="#581C87">ECONOMIC BREAK-EVEN INVARIANT (SALTZER HIERARCHY):</text>
    <text x="400" y="21" font-size="10.5" font-family="'SF Mono', Consolas, monospace" font-weight="600" fill="#1E293B">N* = C_invest / ΔC_task</text>
    <text x="610" y="21" font-size="9.5" fill="#6B21A8">where C_invest = C_compute + C_data + C_human; ascend only when task volume N &gt; N*</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: 6-LEVEL INTERVENTION STEPPED LADDER                   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="670" height="420" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="670" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#334155">THE 6 INTERVENTION LEVELS (ORDER OF ESCALATION)</text>
    <text x="460" y="20" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">Escalation Cost &amp; Blast Radius</text>

    <!-- Stepped Ladder Tiers (Bottom to Top) -->
    <!-- Level 1: Context & Information (Bottom) -->
    <g transform="translate(20, 348)">
      <rect x="0" y="0" width="630" height="52" rx="3" fill="#F8FAFC" stroke="#166534" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="52" fill="#166534"/>
      <text x="16" y="18" font-size="9.5" font-weight="700" fill="#166534">LEVEL 1 · INFORMATION &amp; CONTEXT ENGINEERING</text>
      <text x="618" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#166534" text-anchor="end">Cost: $0 | Instant | 100% Reversible</text>
      <text x="16" y="34" font-size="8.5" fill="#334155">Prune irrelevant prompt tokens, inject schema documentation, format working sets (Ch 04).</text>
    </g>

    <!-- Level 2: Tool Interface & Schema Redesign -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="630" height="52" rx="3" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="52" fill="#0F766E"/>
      <text x="16" y="18" font-size="9.5" font-weight="700" fill="#0F766E">LEVEL 2 · TOOL INTERFACE &amp; SCHEMA CONTRACTS</text>
      <text x="618" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#0F766E" text-anchor="end">Cost: Hours | Code Edits | High ROI</text>
      <text x="16" y="34" font-size="8.5" fill="#334155">Disaggregate monolithic APIs, add structured return types, emit actionable error diagnostics (Ch 07).</text>
    </g>

    <!-- Level 3: Runtime Harness Hardening -->
    <g transform="translate(20, 232)">
      <rect x="0" y="0" width="630" height="52" rx="3" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="52" fill="#0284C7"/>
      <text x="16" y="18" font-size="9.5" font-weight="700" fill="#0369A1">LEVEL 3 · RUNTIME HARNESS &amp; ISOLATION HARDENING</text>
      <text x="618" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#0284C7" text-anchor="end">Cost: Days | System Logic | High Safety</text>
      <text x="16" y="34" font-size="8.5" fill="#334155">Implement semantic watchdogs, loop circuit breakers, microVM sandboxes, and compensating Sagas (Ch 08-10).</text>
    </g>

    <!-- Level 4: Supervised Policy Adaptation (SFT) -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="630" height="52" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="52" fill="#581C87"/>
      <text x="16" y="18" font-size="9.5" font-weight="700" fill="#581C87">LEVEL 4 · SUPERVISED POLICY COMPILATION (SFT)</text>
      <text x="618" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#581C87" text-anchor="end">Cost: $10^2 - $10^3 | Requires N &gt; N*</text>
      <text x="16" y="34" font-size="8.5" fill="#334155">Internalize rigid tool syntax and recovery paths into weights; shrink context prefixes by 85% (Ch 13).</text>
    </g>

    <!-- Level 5: Verifiable Reinforcement Tuning (RLVR) -->
    <g transform="translate(20, 116)">
      <rect x="0" y="0" width="630" height="52" rx="3" fill="#FFFBEB" stroke="#92400E" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="52" fill="#92400E"/>
      <text x="16" y="18" font-size="9.5" font-weight="700" fill="#92400E">LEVEL 5 · VERIFIABLE REINFORCEMENT TUNING (RLVR)</text>
      <text x="618" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#92400E" text-anchor="end">Cost: $10^3 - $10^5 | GPU Clusters</text>
      <text x="16" y="34" font-size="8.5" fill="#334155">Active policy search in domains with mechanical oracles (Lean 4, pytest, compilers) via GRPO (Ch 14).</text>
    </g>

    <!-- Level 6: Multi-Agent Delegation (Top) -->
    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="630" height="52" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="52" fill="#991B1B"/>
      <text x="16" y="18" font-size="9.5" font-weight="700" fill="#991B1B">LEVEL 6 · MULTI-AGENT DELEGATION &amp; TOPOLOGIES</text>
      <text x="618" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#991B1B" text-anchor="end">Cost: High O(M^2) Risk | Maximum Blast</text>
      <text x="16" y="34" font-size="8.5" fill="#334155">Partition across distributed actors ONLY when context bounds or true parallel search dictate (Ch 15).</text>
    </g>

    <!-- Upward Escalation Arrow Axis on Far Left -->
    <line x1="12" y1="390" x2="12" y2="65" stroke="#991B1B" stroke-width="2" marker-end="url(#arr-red)"/>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: DECISION ARBITRATION TREE                            -->
  <!-- ================================================================= -->
  <g transform="translate(740, 60)">
    <rect x="0" y="0" width="370" height="420" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="370" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#334155">SYSTEMS DECISION TREE</text>
    <text x="240" y="20" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">Escalation Gating</text>

    <!-- Decision 1: Context & Tools Sufficient? -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="330" height="60" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="12" y="17" font-size="9.5" font-weight="700" fill="#1E293B">Question 1: Can harness solve it?</text>
      <text x="12" y="30" font-size="8.5" fill="#475569">Improve prompt schemas, add validator tools,</text>
      <text x="12" y="42" font-size="8.5" fill="#475569">or enforce deterministic runtime circuit breakers.</text>
      <rect x="230" y="32" width="88" height="18" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
      <text x="274" y="44" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">YES: Ship L1-L3</text>
    </g>

    <!-- Downward Arrow 1 -->
    <line x1="185" y1="102" x2="185" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
    <text x="195" y="114" font-size="7.5" font-weight="700" fill="#991B1B">NO (Limit reached)</text>

    <!-- Decision 2: Economic Break-Even? -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="330" height="70" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
      <text x="12" y="17" font-size="9.5" font-weight="700" fill="#581C87">Question 2: Does volume exceed N*?</text>
      <text x="12" y="31" font-size="8.5" fill="#334155">Compare upfront investment C_invest against</text>
      <text x="12" y="43" font-size="8.5" fill="#334155">recurring inference savings ΔC_task · N.</text>
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="145" height="16" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
        <text x="72" y="11" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">N &gt; N*: Ascend to SFT (L4)</text>
      </g>
    </g>

    <!-- Downward Arrow 2 -->
    <line x1="185" y1="192" x2="185" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
    <text x="195" y="204" font-size="7.5" font-weight="700" fill="#991B1B">Deterministic Oracles</text>

    <!-- Decision 3: Verifiable Rewards Available? -->
    <g transform="translate(20, 212)">
      <rect x="0" y="0" width="330" height="70" rx="4" fill="#FFFBEB" stroke="#92400E" stroke-width="1.2"/>
      <text x="12" y="17" font-size="9.5" font-weight="700" fill="#92400E">Question 3: Mechanical Oracle Present?</text>
      <text x="12" y="31" font-size="8.5" fill="#78350F">Are ground-truth compilers, test suites, or</text>
      <text x="12" y="43" font-size="8.5" fill="#78350F">formal logic verifiers available for exploration?</text>
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="145" height="16" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
        <text x="72" y="11" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">YES: Ascend to RLVR (L5)</text>
      </g>
    </g>

    <!-- Downward Arrow 3 -->
    <line x1="185" y1="282" x2="185" y2="300" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
    <text x="195" y="294" font-size="7.5" font-weight="700" fill="#991B1B">Task Exceeds Context</text>

    <!-- Decision 4: Multi-Agent Required? -->
    <g transform="translate(20, 302)">
      <rect x="0" y="0" width="330" height="100" rx="4" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2"/>
      <text x="12" y="17" font-size="9.5" font-weight="700" fill="#991B1B">Question 4: True Concurrency Needed?</text>
      <text x="12" y="31" font-size="8.5" fill="#7F1D1D">Does task exceed single-model context capacity</text>
      <text x="12" y="43" font-size="8.5" fill="#7F1D1D">or require independent sandboxed workers?</text>
      <g transform="translate(12, 50)">
        <rect x="0" y="0" width="220" height="18" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="0.8"/>
        <text x="110" y="12" font-size="7.5" font-weight="700" fill="#581C87" text-anchor="middle">YES: Supervisor Tree / Pipeline (L6)</text>
      </g>
      <text x="12" y="86" font-size="8" font-weight="700" fill="#991B1B">Warning: Avoid unmediated peer mesh chat</text>
    </g>
  </g>
</svg>
