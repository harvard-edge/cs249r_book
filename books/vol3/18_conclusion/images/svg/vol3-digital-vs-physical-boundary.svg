<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; fill: #0f172a; }
      .box-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; }
      .text-reg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; fill: #0f172a; }
      .mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-weight: 700; font-size: 9.5px; }
      .tag { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; font-weight: 600; }
      .arrow-commit { stroke: #059669; stroke-width: 2; fill: none; marker-end: url(#arr-green); }
      .arrow-prune { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-red); }
      .arrow-physical { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#arr-red-phys); }
      .node-commit { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .node-prune { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 3,2; }
      .node-checkpoint { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-red-phys" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#ffffff"/>

  <!-- PANEL A: Digital Trajectory Regime (DAG Search Space & Rollback) -->
  <g transform="translate(30, 20)">
    <rect width="535" height="520" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="535" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text class="section-hdr" x="14" y="21" fill="#166534">PANEL A: DIGITAL REGIME — DISCRETE DAG SEARCH</text>
    <rect x="385" y="6" width="136" height="20" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
    <text x="453" y="19" class="tag" fill="#059669" text-anchor="middle">Reversible · Zero Entropy</text>

    <!-- DAG Visualization Canvas -->
    <g transform="translate(18, 46)">
      <rect width="499" height="290" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" class="box-hdr" fill="#1e293b">Speculative Tree Search &amp; Copy-on-Write Branching</text>

      <!-- DAG Nodes & Connections -->
      <!-- Node S0 (Root) -->
      <circle cx="50" cy="155" r="17" class="node-checkpoint"/>
      <text x="50" y="159" class="mono-bold" fill="#1e40af" text-anchor="middle">S_0</text>
      <text x="50" y="186" class="tag" fill="#475569" text-anchor="middle">Baseline</text>

      <!-- Branch 1: a_0(1) -> S_1 -->
      <path d="M 67 155 L 138 110" class="arrow-commit"/>
      <text x="92" y="122" class="mono" fill="#059669">a_0 [plan]</text>

      <!-- Node S_1 (Checkpoint 1) -->
      <circle cx="155" cy="100" r="17" class="node-checkpoint"/>
      <text x="155" y="104" class="mono-bold" fill="#1e40af" text-anchor="middle">S_1</text>
      <text x="155" y="76" class="tag" fill="#2563eb" text-anchor="middle">CoW Snap 1</text>

      <!-- Branch from S_1: Failed Speculative Fork a_1(failed) -> S_err -->
      <path d="M 172 95 L 250 60" class="arrow-prune"/>
      <text x="205" y="70" class="mono" fill="#dc2626">a_1' [diff]</text>

      <circle cx="268" cy="52" r="16" class="node-prune"/>
      <text x="268" y="56" class="mono-bold" fill="#dc2626" text-anchor="middle">S_err</text>
      <text x="325" y="55" class="tag" fill="#dc2626">rustc build fail</text>

      <!-- Rollback curve from S_err back to S_1 -->
      <path d="M 268 70 Q 230 115 174 105" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-red)"/>
      <text x="245" y="112" class="tag" fill="#dc2626">Rollback &amp; Prune Fork (&lt; 5 ms)</text>

      <!-- Successful Branch from S_1: a_1 -> S_2 -->
      <path d="M 172 105 L 255 150" class="arrow-commit"/>
      <text x="215" y="138" class="mono" fill="#059669">a_1 [patch]</text>

      <!-- Node S_2 (Checkpoint 2) -->
      <circle cx="272" cy="160" r="17" class="node-checkpoint"/>
      <text x="272" y="164" class="mono-bold" fill="#1e40af" text-anchor="middle">S_2</text>
      <text x="272" y="190" class="tag" fill="#2563eb" text-anchor="middle">CoW Snap 2</text>

      <!-- Another pruned fork from S_0: a_0(2) -> S_inv -->
      <path d="M 67 160 L 138 210" class="arrow-prune"/>
      <text x="95" y="198" class="mono" fill="#dc2626">a_0'</text>
      <circle cx="155" cy="220" r="16" class="node-prune"/>
      <text x="155" y="224" class="mono-bold" fill="#dc2626" text-anchor="middle">S_inv</text>
      <text x="155" y="248" class="tag" fill="#dc2626" text-anchor="middle">A=0 Violation Trap</text>

      <!-- Branch from S_2 to Terminal S* -->
      <path d="M 290 160 L 388 160" class="arrow-commit"/>
      <text x="338" y="152" class="mono" fill="#059669">a_2 [test pass]</text>

      <!-- Terminal Goal Node S* -->
      <circle cx="408" cy="160" r="19" class="node-commit"/>
      <circle cx="408" cy="160" r="15" fill="none" stroke="#059669" stroke-width="1.2"/>
      <text x="408" y="164" class="mono-bold" fill="#065f46" text-anchor="middle">S*</text>
      <text x="408" y="192" class="tag" fill="#059669" text-anchor="middle">Verified Goal</text>

      <!-- Commit path indicator -->
      <rect x="14" y="254" width="470" height="24" rx="3" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="24" y="270" class="mono-bold" fill="#166534">Committed Path: τ* = ⟨(S_0, a_0), (S_1, a_1), (S_2, a_2) → S*⟩</text>
    </g>

    <!-- Systems Properties of Digital Domain -->
    <g transform="translate(18, 348)">
      <rect width="499" height="158" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="17" class="box-hdr" fill="#1e293b">Architectural Guarantees</text>
      <text x="12" y="34" class="mono-bold" fill="#059669">Thermodynamic Reversibility:</text>
      <text x="24" y="47" class="text-reg">Reset &lt; 5 ms · no physical residue</text>
      <text x="12" y="64" class="mono-bold" fill="#059669">Ephemeral Copy-on-Write Sandboxing:</text>
      <text x="24" y="77" class="text-reg">OverlayFS / ZFS isolate trials</text>
      <text x="12" y="94" class="mono-bold" fill="#059669">Deterministic Mechanical Verification:</text>
      <text x="24" y="107" class="text-reg">Compilers and tests give binary truth</text>
      <text x="12" y="124" class="mono-bold" fill="#059669">Search Cost Ceiling:</text>
      <text x="24" y="137" class="text-reg">Cost bounded by tokens and vCPU time</text>
    </g>
  </g>

  <!-- PANEL B: Physical Embodied Regime (Continuous Irreversible Trajectory) -->
  <g transform="translate(595, 20)">
    <rect width="535" height="520" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="535" height="32" rx="6" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
    <text class="section-hdr" x="14" y="21" fill="#9f1239">PANEL B: PHYSICAL REGIME — IRREVERSIBLE DYNAMICS</text>
    <rect x="380" y="6" width="141" height="20" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="450" y="19" class="tag" fill="#be123c" text-anchor="middle">Continuous · Irreversible</text>

    <!-- Physical Trajectory Canvas -->
    <g transform="translate(18, 46)">
      <rect width="499" height="290" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" class="box-hdr" fill="#1e293b">Continuous Phase Space x(t) &amp; Safety Barrier Envelope</text>

      <!-- Danger Zone / Unsafe State Boundary -->
      <path d="M 270 30 Q 330 80 340 145 Q 350 210 290 250 L 485 250 L 485 30 Z" fill="#fee2e2" opacity="0.6" stroke="#fca5a5" stroke-dasharray="4,3"/>
      <text x="415" y="55" class="mono-bold" fill="#b91c1c" text-anchor="middle">UNSAFE REGION</text>
      <text x="415" y="70" class="mono" fill="#dc2626" text-anchor="middle">h(x) &lt; 0 (Crash / Damage)</text>

      <!-- Safe Set Boundary (Barrier h(x) = 0) -->
      <path d="M 270 30 Q 330 80 340 145 Q 350 210 290 250" stroke="#dc2626" stroke-width="1.8" fill="none"/>
      <text x="255" y="70" class="tag" fill="#dc2626" text-anchor="end">Barrier h(x) = 0</text>

      <!-- Continuous Physical Trajectory -->
      <!-- Start x(0) -->
      <circle cx="50" cy="180" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="50" y="184" class="mono-bold" fill="#1e40af" text-anchor="middle">x_0</text>
      <text x="50" y="208" class="tag" fill="#475569" text-anchor="middle">t = 0</text>

      <!-- Nominal trajectory under neural planner u_t -> Heading toward danger -->
      <path d="M 64 180 Q 140 170 210 140" class="arrow-physical"/>
      <text x="115" y="160" class="mono" fill="#b91c1c">x(t) via u_neural</text>

      <!-- Errant neural plan trajectory penetrating barrier (Dashed red) -->
      <path d="M 210 140 Q 270 115 350 105" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-red-phys)"/>
      <text x="345" y="128" class="mono-bold" fill="#dc2626">Collision</text>
      <text x="345" y="142" class="tag" fill="#dc2626">T_reversal = ∞ (Hardware Rupture)</text>

      <!-- Hard Real-Time CBF Intervention (at point x_shield) -->
      <circle cx="210" cy="140" r="9" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="175" y="122" class="tag" fill="#ca8a04" font-weight="700">CBF Override (&lt; 1 ms)</text>

      <!-- Corrected Safe Trajectory under u_safe -->
      <path d="M 210 140 Q 250 185 305 210 Q 355 230 420 210" class="arrow-commit"/>
      <text x="285" y="235" class="mono-bold" fill="#059669">Corrected u_safe: ḣ(x) ≥ -γ h(x)</text>

      <!-- Physical Commit Warning Strip -->
      <rect x="14" y="254" width="470" height="24" rx="3" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="24" y="270" class="mono-bold" fill="#9f1239">No Rollback: Thermodynamic dissipation is committed permanently.</text>
    </g>

    <!-- Systems Properties of Embodied Domain -->
    <g transform="translate(18, 348)">
      <rect width="499" height="158" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="17" class="box-hdr" fill="#1e293b">Physical Realities &amp; Constraints</text>
      <text x="12" y="34" class="mono-bold" fill="#b91c1c">Thermodynamic Irreversibility:</text>
      <text x="24" y="47" class="text-reg">Entropy increases monotonically (T_reversal = ∞); physical damage cannot be undone.</text>
      <text x="12" y="64" class="mono-bold" fill="#b91c1c">Hard Real-Time Temporal Invariants:</text>
      <text x="24" y="77" class="text-reg">Dynamics cannot pause for decode</text>
      <text x="12" y="94" class="mono-bold" fill="#b91c1c">Out-of-Band Safety Interlocks:</text>
      <text x="24" y="107" class="text-reg">Estops and CBFs override the model</text>
      <text x="12" y="124" class="mono-bold" fill="#b91c1c">Catastrophic Blast Radius:</text>
      <text x="24" y="137" class="text-reg">Unverified actions risk actuator burning, mechanical collisions, chemical leaks, or injury.</text>
    </g>
  </g>
</svg>