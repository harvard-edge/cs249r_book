<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="540" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE FIVE-PART AGENT RUNTIME ARCHITECTURE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Holistic systems mapping across execution, memory, actuation, policy compilation, and distributed fleets</text>

  <!-- ================================================================= -->
  <!-- PART V: DISTRIBUTED FLEETS & OPERATIONS                           -->
  <!-- ================================================================= -->
  <g transform="translate(95, 74)">
    <rect width="820" height="76" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect width="820" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>

    <g transform="translate(8, 4)">
      <rect width="168" height="16" rx="1" fill="#ffffff" stroke="#475569" stroke-width="1"/>
      <text x="84" y="11.5" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">PART V · DISTRIBUTED FLEETS</text>
    </g>
    <text x="188" y="16" font-size="9.5" font-weight="700" fill="#0f172a">Distributed Fleets &amp; Operations</text>
    <text x="808" y="16" text-anchor="end" font-size="8.5" font-weight="700" fill="#475569">§15 — §17</text>

    <!-- Sub-bullets -->
    <text x="16" y="43" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Topologies:</tspan> Hierarchical Supervisors, Peer Debate, Decentralized Swarms</text>
    <text x="16" y="61" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Fleet Tokenomics:</tspan> Capacity Sizing, Little&apos;s Law Queues, Unit Cost Governance</text>
    <text x="440" y="43" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Telemetry:</tspan> W3C Distributed Tracing, OTel Spans</text>
    <text x="440" y="61" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Evaluation:</tspan> Hermetic Gyms, Invariant Assertions</text>
  </g>

  <!-- Flow V -> I -->
  <line x1="505" y1="150" x2="505" y2="174" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <g transform="translate(435, 154)">
    <rect width="140" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="70" y="11" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">TASK SPEC &amp; LEASES</text>
  </g>

  <!-- ================================================================= -->
  <!-- PART I: THE STOCHASTIC COMPUTE ENGINE                             -->
  <!-- ================================================================= -->
  <g transform="translate(95, 174)">
    <rect width="820" height="76" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="820" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>

    <g transform="translate(8, 4)">
      <rect width="176" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="88" y="11.5" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">PART I · STOCHASTIC ENGINE</text>
    </g>
    <text x="196" y="16" font-size="9.5" font-weight="700" fill="#0369a1">The Stochastic Compute Engine</text>
    <text x="808" y="16" text-anchor="end" font-size="8.5" font-weight="700" fill="#0284c7">§02 — §03</text>

    <!-- Sub-bullets -->
    <text x="16" y="43" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Execution Primitive:</tspan> Autoregressive Forward Pass on Accelerator Silicon</text>
    <text x="16" y="61" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Deterministic Boundary:</tspan> Context-Free Grammar (CFG) Logit Masking (FSM)</text>
    <text x="440" y="43" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Test-Time Search:</tspan> Monte Carlo Tree Search (MCTS), Beam Search</text>
    <text x="440" y="61" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Step Verification:</tspan> Process Reward Models (PRMs)</text>
  </g>

  <!-- Branching Flows I -> II & III -->
  <path d="M 360 250 L 360 262 L 295 262 L 295 274" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr-gray)"/>
  <g transform="translate(230, 254)">
    <rect width="130" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="11" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">STATE PERSISTENCE</text>
  </g>

  <path d="M 650 250 L 650 262 L 715 262 L 715 274" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr-gray)"/>
  <g transform="translate(655, 254)">
    <rect width="120" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="11" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">EFFECTOR ACTION</text>
  </g>

  <!-- ================================================================= -->
  <!-- PART II: CONTEXT MEMORY HIERARCHY                                 -->
  <!-- ================================================================= -->
  <g transform="translate(95, 274)">
    <rect width="400" height="144" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="400" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>

    <g transform="translate(8, 4)">
      <rect width="64" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="32" y="11.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">PART II</text>
    </g>
    <text x="82" y="16" font-size="9.5" font-weight="700" fill="#15803d">Context Memory Hierarchy</text>
    <text x="388" y="16" text-anchor="end" font-size="8.5" font-weight="700" fill="#16a34a">§04 — §08</text>

    <!-- Sub-bullets -->
    <text x="14" y="42" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• L1 Registers:</tspan> Active Context Window (KV Cache in HBM)</text>
    <text x="14" y="58" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• L2 Virtual Cache:</tspan> PagedAttention, Radix Prefix Trees, CXL</text>
    <text x="14" y="74" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• L3 Store:</tspan> Episodic Graphs, Dense Vectors, Sparse BM25</text>
    <text x="14" y="90" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Persistence:</tspan> Agent Control Block (ACB), Event Sagas</text>
    <text x="14" y="106" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Memory Manager:</tspan> Multi-Level Feedback Queue (MLFQ)</text>
    <text x="14" y="122" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Working Set:</tspan> Denning Locality, Zero-Fragmentation</text>
  </g>

  <!-- ================================================================= -->
  <!-- PART III: ACTUATION BOUNDARY & ISOLATION                          -->
  <!-- ================================================================= -->
  <g transform="translate(515, 274)">
    <rect width="400" height="144" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="400" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>

    <g transform="translate(8, 4)">
      <rect width="68" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <text x="34" y="11.5" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">PART III</text>
    </g>
    <text x="86" y="16" font-size="9.5" font-weight="700" fill="#b45309">Actuation &amp; Isolation</text>
    <text x="388" y="16" text-anchor="end" font-size="8.5" font-weight="700" fill="#d97706">§09 — §11</text>

    <!-- Sub-bullets -->
    <text x="14" y="42" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Effector Protocol:</tspan> Model Context Protocol (MCP), JSON-RPC</text>
    <text x="14" y="58" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Security Model:</tspan> Capability Leases, Object-Capabilities (O-Caps)</text>
    <text x="14" y="74" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Isolation Sandboxes:</tspan> Firecracker microVMs, gVisor, Wasm</text>
    <text x="14" y="90" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Policy Enforcement:</tspan> Runtime PEPs, Ephemeral CoW Filesystems</text>
    <text x="14" y="106" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Information Flow:</tspan> Taint Tracking, Injection Firewalls</text>
    <text x="14" y="122" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Boundary Law:</tspan> Reversibility Partitioning, Idempotency Tokens</text>
  </g>

  <!-- Converging Flows II & III -> IV -->
  <path d="M 295 418 L 295 430 L 435 430 L 435 442" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 715 418 L 715 430 L 575 430 L 575 442" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr-gray)"/>
  <g transform="translate(445, 422)">
    <rect width="120" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="11" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">TRAJECTORY LOGS</text>
  </g>

  <!-- ================================================================= -->
  <!-- PART IV: THE POLICY COMPILER                                      -->
  <!-- ================================================================= -->
  <g transform="translate(95, 442)">
    <rect width="820" height="76" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="820" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>

    <g transform="translate(8, 4)">
      <rect width="168" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <text x="84" y="11.5" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">PART IV · POLICY COMPILER</text>
    </g>
    <text x="188" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">The Policy Compiler</text>
    <text x="808" y="16" text-anchor="end" font-size="8.5" font-weight="700" fill="#7c3aed">§12 — §14</text>

    <!-- Sub-bullets -->
    <text x="16" y="43" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Data Flywheels:</tspan> Synthetic Rollouts, Self-Play Rejection Filtering</text>
    <text x="16" y="61" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Trajectory SFT:</tspan> Token Loss Masking (&lt;thought&gt; / &lt;action&gt;)</text>
    <text x="440" y="43" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Reinforcement Learning:</tspan> RLVR, PPO, Group Relative Policy Opt (GRPO)</text>
    <text x="440" y="61" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Verifier Fleets:</tspan> Sandboxed Compilers, Test Suites, Formal Solvers</text>
  </g>

  <!-- ================================================================= -->
  <!-- FLYWHEEL FEEDBACK LOOP: IV -> I / V                               -->
  <!-- ================================================================= -->
  <path d="M 95 480 L 60 480 L 60 112 L 95 112" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-purple)"/>
  <path d="M 60 212 L 95 212" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-purple)"/>
  <text transform="translate(46, 296) rotate(-90)" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9" letter-spacing="0.5">FLYWHEEL FEEDBACK: DISTILLED POLICY WEIGHTS &amp; VERIFIERS</text>

</svg>
