<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .part-badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; font-weight: 700; }
      .part-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; }
      .part-scope { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 600; }
      .item-bullet { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; }
      .item-bold { font-weight: 700; fill: #1e293b; }
      .flow-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8px; font-weight: 700; fill: #64748b; }
      .feedback-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8px; font-weight: 700; fill: #7c3aed; }
    </style>

    

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE FIVE-PART AGENT RUNTIME ARCHITECTURE</text>
  </g>

  <!-- PART V: Distributed Fleets & Operations -->
  <g transform="translate(100, 64)">
    <rect width="740" height="74" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="74" rx="3" fill="#4f46e5"/>
    <rect x="18" y="8" width="168" height="18" rx="4" fill="#e0e7ff"/>
    <text x="24" y="20" class="part-badge" fill="#4338ca">PART V · DISTRIBUTED FLEETS</text>
    <text x="194" y="22" class="part-title" fill="#1e1b4b">Distributed Fleets &amp; Operations</text>
    <text x="635" y="21" class="part-scope" fill="#6366f1">§15 — §17</text>
    <g transform="translate(18, 36)">
      <text x="0" y="10" class="item-bullet"><tspan class="item-bold">• Topologies:</tspan> Hierarchical Supervisors, Peer Debate, Decentralized Swarms</text>
      <text x="0" y="25" class="item-bullet"><tspan class="item-bold">• Fleet Tokenomics:</tspan> Capacity Sizing, Little&apos;s Law Queues, Unit Cost Governance</text>
      <text x="430" y="10" class="item-bullet"><tspan class="item-bold">• Telemetry:</tspan> W3C Distributed Tracing, OTel Spans</text>
      <text x="430" y="25" class="item-bullet"><tspan class="item-bold">• Evaluation:</tspan> Hermetic Gyms, Invariant Assertions</text>
    </g>
  </g>

  <!-- Arrow V -> I -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 470 138 L 470 162"/>
  </g>
  <rect x="408" y="143" width="124" height="14" rx="3" fill="#f1f5f9"/>
  <text x="470" y="153" text-anchor="middle" class="flow-label">TASK SPEC &amp; LEASES</text>

  <!-- PART I: The Stochastic Compute Engine -->
  <g transform="translate(100, 166)">
    <rect width="740" height="74" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="74" rx="3" fill="#2563eb"/>
    <rect x="18" y="8" width="176" height="18" rx="4" fill="#dbeafe"/>
    <text x="24" y="20" class="part-badge" fill="#1d4ed8">PART I · STOCHASTIC ENGINE</text>
    <text x="202" y="22" class="part-title" fill="#172554">The Stochastic Compute Engine</text>
    <text x="635" y="21" class="part-scope" fill="#2563eb">§02 — §03</text>
    <g transform="translate(18, 36)">
      <text x="0" y="10" class="item-bullet"><tspan class="item-bold">• Execution Primitive:</tspan> Autoregressive Forward Pass on Accelerator Silicon</text>
      <text x="0" y="25" class="item-bullet"><tspan class="item-bold">• Deterministic Boundary:</tspan> Context-Free Grammar (CFG) Logit Masking (FSM)</text>
      <text x="430" y="10" class="item-bullet"><tspan class="item-bold">• Test-Time Search:</tspan> Monte Carlo Tree Search (MCTS), Beam Search</text>
      <text x="430" y="25" class="item-bullet"><tspan class="item-bold">• Step Verification:</tspan> Process Reward Models (PRMs)</text>
    </g>
  </g>

  <!-- Branching Arrows I -> II & III -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 330 240 L 330 254 L 255 254 L 255 268"/>
    <path d="M 610 240 L 610 254 L 685 254 L 685 268"/>
  </g>
  <rect x="205" y="249" width="100" height="13" rx="3" fill="#f1f5f9"/>
  <text x="255" y="258" text-anchor="middle" class="flow-label">STATE PERSISTENCE</text>
  <rect x="635" y="249" width="100" height="13" rx="3" fill="#f1f5f9"/>
  <text x="685" y="258" text-anchor="middle" class="flow-label">EFFECTOR ACTION</text>

  <!-- PART II: Context Memory Hierarchy -->
  <g transform="translate(50, 272)">
    <rect width="410" height="136" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="136" rx="1" fill="#16a34a"/>
    <rect x="16" y="8" width="60" height="18" rx="2" fill="#dcfce7"/>
    <text x="46" y="20" text-anchor="middle" class="part-badge" fill="#15803d">PART II</text>
    <text x="86" y="22" class="part-title" fill="#14532d">Context Memory Hierarchy</text>
    <text x="396" y="21" text-anchor="end" class="part-scope" fill="#16a34a">§04 — §08</text>
    <g transform="translate(16, 36)">
      <text x="0" y="12" class="item-bullet"><tspan class="item-bold">• L1 Registers:</tspan> Active Context Window (KV Cache in HBM)</text>
      <text x="0" y="28" class="item-bullet"><tspan class="item-bold">• L2 Virtual Cache:</tspan> PagedAttention, Radix Prefix Trees, Tiered CXL</text>
      <text x="0" y="44" class="item-bullet"><tspan class="item-bold">• L3 Store:</tspan> Episodic Graphs, Dense Vectors, Sparse BM25</text>
      <text x="0" y="60" class="item-bullet"><tspan class="item-bold">• Persistence:</tspan> Agent Control Block (ACB), Event Sagas</text>
      <text x="0" y="76" class="item-bullet"><tspan class="item-bold">• Memory Manager:</tspan> Multi-Level Feedback Queue (MLFQ) Eviction</text>
      <text x="0" y="92" class="item-bullet"><tspan class="item-bold">• Working Set:</tspan> Denning Locality, Compaction, Zero-Fragmentation</text>
    </g>
  </g>

  <!-- PART III: Actuation Boundary & Isolation -->
  <g transform="translate(480, 272)">
    <rect width="410" height="136" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="136" rx="1" fill="#ea580c"/>
    <rect x="16" y="8" width="65" height="18" rx="2" fill="#ffedd5"/>
    <text x="48" y="20" text-anchor="middle" class="part-badge" fill="#c2410c">PART III</text>
    <text x="90" y="22" class="part-title" fill="#7c2d12">Actuation &amp; Isolation</text>
    <text x="396" y="21" text-anchor="end" class="part-scope" fill="#ea580c">§09 — §11</text>
    <g transform="translate(16, 36)">
      <text x="0" y="12" class="item-bullet"><tspan class="item-bold">• Effector Protocol:</tspan> Model Context Protocol (MCP), Typed JSON-RPC</text>
      <text x="0" y="28" class="item-bullet"><tspan class="item-bold">• Security Model:</tspan> Capability Leases, Object-Capabilities (O-Caps)</text>
      <text x="0" y="44" class="item-bullet"><tspan class="item-bold">• Isolation Sandboxes:</tspan> Firecracker microVMs, gVisor, WebAssembly</text>
      <text x="0" y="60" class="item-bullet"><tspan class="item-bold">• Policy Enforcement:</tspan> Runtime PEPs, Ephemeral CoW Filesystems</text>
      <text x="0" y="76" class="item-bullet"><tspan class="item-bold">• Information Flow:</tspan> Taint Tracking, Indirect Injection Firewalls</text>
      <text x="0" y="92" class="item-bullet"><tspan class="item-bold">• Boundary Law:</tspan> Reversibility Partitioning, Idempotency Tokens</text>
    </g>
  </g>

  <!-- Converging Arrows II & III -> IV -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 255 408 L 255 422 L 350 422 L 350 436"/>
    <path d="M 685 408 L 685 422 L 590 422 L 590 436"/>
  </g>
  <rect x="420" y="415" width="100" height="14" rx="3" fill="#f1f5f9"/>
  <text x="470" y="425" text-anchor="middle" class="flow-label">TRAJECTORY LOGS</text>

  <!-- PART IV: The Policy Compiler -->
  <g transform="translate(100, 440)">
    <rect width="740" height="74" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="74" rx="3" fill="#9333ea"/>
    <rect x="18" y="8" width="168" height="18" rx="4" fill="#f3e8ff"/>
    <text x="24" y="20" class="part-badge" fill="#7e22ce">PART IV · POLICY COMPILER</text>
    <text x="194" y="22" class="part-title" fill="#3b0764">The Policy Compiler</text>
    <text x="635" y="21" class="part-scope" fill="#9333ea">§12 — §14</text>
    <g transform="translate(18, 36)">
      <text x="0" y="10" class="item-bullet"><tspan class="item-bold">• Data Flywheels:</tspan> Synthetic Rollouts, Self-Play Rejection Filtering</text>
      <text x="0" y="25" class="item-bullet"><tspan class="item-bold">• Trajectory SFT:</tspan> Token Loss Masking (&lt;thought&gt; / &lt;action&gt;)</text>
      <text x="430" y="10" class="item-bullet"><tspan class="item-bold">• Reinforcement Learning:</tspan> RLVR, PPO, Group Relative Policy Opt (GRPO)</text>
      <text x="430" y="25" class="item-bullet"><tspan class="item-bold">• Verifier Fleets:</tspan> Sandboxed Compilers, Test Suites, Formal Solvers</text>
    </g>
  </g>

  <!-- Flywheel Feedback Loop: IV -> I / V -->
  <g stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-purple)">
    <path d="M 100 477 L 25 477 L 25 101 L 96 101"/>
  </g>
  <text transform="translate(18, 285) rotate(-90)" text-anchor="middle" class="feedback-label">FLYWHEEL FEEDBACK: DISTILLED POLICY WEIGHTS &amp; VERIFIERS</text>
</svg>
