<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .cell { stroke: #334155; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0f172a; }
      .offset { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .bytes { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="340" class="bg" />

  <!-- Diagram Title -->
  <text x="40" y="32" class="title">Binary Write-Ahead Log (WAL) Record Frame Layout</text>
  <text x="40" y="50" class="subtext">Byte-exact frame serialization with direct I/O (O_DIRECT) and explicit fdatasync durability barriers</text>

  <!-- Table Container -->
  <g transform="translate(40, 75)">
    <!-- Header Row -->
    <rect x="0" y="0" width="800" height="26" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
    <text x="12" y="17" class="label">Byte Offset</text>
    <text x="140" y="17" class="label">Field Identifier</text>
    <text x="420" y="17" class="label">Data Type &amp; Encoding</text>
    <text x="710" y="17" class="label">Width</text>

    <!-- Row 1: Magic Header -->
    <rect x="0" y="26" width="800" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="42" class="offset">0x00 - 0x07</text>
    <text x="140" y="42" class="mono" font-weight="600" fill="#0f172a">Magic Header</text>
    <text x="420" y="42" class="mono" fill="#0369a1">0x4147454E5457414C ("AGENTWAL")</text>
    <text x="710" y="42" class="bytes">8 bytes</text>

    <!-- Row 2: Sequence ID -->
    <rect x="0" y="50" width="800" height="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="66" class="offset">0x08 - 0x0F</text>
    <text x="140" y="66" class="mono" font-weight="600" fill="#0f172a">Monotonic Sequence ID</text>
    <text x="420" y="66" class="mono">uint64 (Little-Endian)</text>
    <text x="710" y="66" class="bytes">8 bytes</text>

    <!-- Row 3: Timestamp -->
    <rect x="0" y="74" width="800" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="90" class="offset">0x10 - 0x17</text>
    <text x="140" y="90" class="mono" font-weight="600" fill="#0f172a">UTC Timestamp</text>
    <text x="420" y="90" class="mono">uint64 nanoseconds since Unix epoch</text>
    <text x="710" y="90" class="bytes">8 bytes</text>

    <!-- Row 4: Nonce / UUID -->
    <rect x="0" y="98" width="800" height="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="114" class="offset">0x18 - 0x27</text>
    <text x="140" y="114" class="mono" font-weight="600" fill="#0f172a">Trajectory Nonce</text>
    <text x="420" y="114" class="mono">UUIDv4 binary descriptor</text>
    <text x="710" y="114" class="bytes">16 bytes</text>

    <!-- Row 5: State Hash -->
    <rect x="0" y="122" width="800" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="138" class="offset">0x28 - 0x47</text>
    <text x="140" y="138" class="mono" font-weight="600" fill="#0f172a">State Hash s_t</text>
    <text x="420" y="138" class="mono" fill="#4338ca">SHA-256 Digest of Context Window c_t</text>
    <text x="710" y="138" class="bytes">32 bytes</text>

    <!-- Row 6: Tool Action ID -->
    <rect x="0" y="146" width="800" height="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="162" class="offset">0x48 - 0x4B</text>
    <text x="140" y="162" class="mono" font-weight="600" fill="#0f172a">Tool Action ID</text>
    <text x="420" y="162" class="mono">uint32 schema catalog enumerator</text>
    <text x="710" y="162" class="bytes">4 bytes</text>

    <!-- Row 7: Payload Length -->
    <rect x="0" y="170" width="800" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="186" class="offset">0x4C - 0x4F</text>
    <text x="140" y="186" class="mono" font-weight="600" fill="#0f172a">Payload Length (L)</text>
    <text x="420" y="186" class="mono">uint32 argument buffer byte count</text>
    <text x="710" y="186" class="bytes">4 bytes</text>

    <!-- Row 8: Payload Data -->
    <rect x="0" y="194" width="800" height="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="210" class="offset">0x50 - 0x50+L</text>
    <text x="140" y="210" class="mono" font-weight="600" fill="#0f172a">Action Arguments</text>
    <text x="420" y="210" class="mono" fill="#059669">UTF-8 JSON Tool Call Parameters</text>
    <text x="710" y="210" class="bytes">L bytes</text>

    <!-- Row 9: CRC32-C Checksum -->
    <rect x="0" y="218" width="800" height="24" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <text x="12" y="234" class="offset" fill="#065f46">End - 4</text>
    <text x="140" y="234" class="mono" font-weight="600" fill="#065f46">CRC32-C Checksum</text>
    <text x="420" y="234" class="mono" fill="#065f46">Castagnoli CRC32-C of frame</text>
    <text x="710" y="234" class="bytes" fill="#065f46">4 bytes</text>

    <!-- Outer frame border -->
    <rect x="0" y="0" width="800" height="242" fill="none" stroke="#334155" stroke-width="1.5" />
  </g>

</svg>
