<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: Helvetica Neue, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Clean Canvas Base (No Stroke) -->
  <rect width="1200" height="950" fill="#ffffff" />

  <!-- ================================================================= -->
  <!-- 1. INGRESS TIER                                                   -->
  <!-- ================================================================= -->
  <g id="tier-ingress">
    <rect x="40" y="30" width="1120" height="120" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="30" width="1120" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="49" font-size="12" font-weight="bold" fill="#0f172a">1. Ingress &amp; Client Interface Tier</text>
    
    <rect x="250" y="70" width="280" height="60" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="390" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Client Applications</text>
    <text x="390" y="115" font-size="11" text-anchor="middle" fill="#64748b">API Gateways &amp; SDKs</text>

    <rect x="670" y="70" width="280" height="60" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="810" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Ingress Controller</text>
    <text x="810" y="115" font-size="11" text-anchor="middle" fill="#64748b">TLS Termination, Rate Limiting</text>
    
    <path d="M 530 100 L 660 100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="595" y="92" font-size="10.5" font-family="Courier New, monospace" font-weight="bold" text-anchor="middle" fill="#475569">gRPC / HTTPS</text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. ORCHESTRATION TIER                                             -->
  <!-- ================================================================= -->
  <g id="tier-orchestration">
    <rect x="40" y="170" width="1120" height="155" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="170" width="1120" height="28" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="60" y="189" font-size="12" font-weight="bold" fill="#6d28d9">2. Orchestration &amp; Control Plane Tier</text>

    <rect x="80" y="215" width="300" height="85" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="230" y="243" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Temporal Workflow Engine</text>
    <text x="230" y="263" font-size="11" text-anchor="middle" fill="#6d28d9">Durable Event Sourcing &amp; Sagas</text>
    <text x="230" y="281" font-size="10" text-anchor="middle" fill="#64748b">Deterministic Replay, Signals</text>

    <rect x="450" y="215" width="300" height="85" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="600" y="243" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent Control Block &amp; FSM</text>
    <text x="600" y="263" font-size="11" text-anchor="middle" fill="#0369a1">LangGraph / StateGraph</text>
    <text x="600" y="281" font-size="10" text-anchor="middle" fill="#64748b">Trajectory Descriptor &amp; Leases</text>

    <rect x="820" y="215" width="300" height="85" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="970" y="243" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Context Working Set Governor</text>
    <text x="970" y="263" font-size="11" text-anchor="middle" fill="#15803d">Token Budgets &amp; Compaction</text>
    <text x="970" y="281" font-size="10" text-anchor="middle" fill="#64748b">Attention Sinks, 2PC Pruning</text>

    <path d="M 810 130 L 230 215" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 380 257 L 442 257" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 442 263 L 380 263" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 750 257 L 812 257" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 812 263 L 750 263" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  </g>

  <!-- ================================================================= -->
  <!-- 3. STOCHASTIC PROCESSOR & MEMORY TIER                             -->
  <!-- ================================================================= -->
  <g id="tier-processor">
    <rect x="40" y="345" width="540" height="295" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="345" width="540" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="60" y="364" font-size="12" font-weight="bold" fill="#0369a1">3. Stochastic Processor &amp; Memory Tier (GPU Cluster)</text>

    <rect x="160" y="390" width="300" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="310" y="411" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Continuous In-Flight Scheduler</text>
    <text x="310" y="427" font-size="10.5" text-anchor="middle" fill="#0284c7">Chunked Prefill &amp; Iteration Batching</text>

    <rect x="160" y="450" width="300" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="310" y="471" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Inference Execution Engines</text>
    <text x="310" y="487" font-size="10.5" text-anchor="middle" fill="#0284c7">vLLM / SGLang / TensorRT-LLM</text>

    <rect x="160" y="510" width="300" height="48" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="310" y="531" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Virtual Memory Page Allocator</text>
    <text x="310" y="547" font-size="10.5" text-anchor="middle" fill="#0284c7">PagedAttention &amp; Radix Trie</text>

    <rect x="160" y="570" width="300" height="52" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="591" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Accelerator High-Bandwidth Memory</text>
    <text x="310" y="609" font-size="10.5" text-anchor="middle" fill="#15803d">Model Weights &amp; Dynamic KV Cache</text>

    <path d="M 450 300 L 310 382" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 310 438 L 310 448" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 310 498 L 310 508" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 310 558 L 310 568" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  </g>

  <!-- ================================================================= -->
  <!-- 4. ACTUATION & ISOLATION TIER                                     -->
  <!-- ================================================================= -->
  <g id="tier-actuation">
    <rect x="620" y="345" width="540" height="295" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="620" y="345" width="540" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="640" y="364" font-size="12" font-weight="bold" fill="#b45309">4. Actuation &amp; Isolation Tier</text>

    <rect x="740" y="390" width="300" height="48" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="890" y="411" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Actuation Gateway (MCP)</text>
    <text x="890" y="427" font-size="10.5" text-anchor="middle" fill="#b45309">Typed ABI Validation &amp; Tool Registry</text>

    <rect x="740" y="450" width="300" height="48" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="890" y="471" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Capability &amp; Idempotency Validator</text>
    <text x="890" y="487" font-size="10.5" text-anchor="middle" fill="#b45309">Cryptographic Leases &amp; Trajectory Nonces</text>

    <!-- Isolated Workspaces Sub-container -->
    <rect x="640" y="515" width="500" height="105" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="655" y="534" font-size="11.5" font-weight="bold" fill="#b91c1c">Isolated Workspaces (Execution Sandboxes)</text>
    
    <rect x="655" y="546" width="145" height="60" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="727" y="571" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Firecracker</text>
    <text x="727" y="589" font-size="10" text-anchor="middle" fill="#b91c1c">MicroVMs (KVM)</text>

    <rect x="817" y="546" width="145" height="60" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="889" y="571" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">gVisor</text>
    <text x="889" y="589" font-size="10" text-anchor="middle" fill="#b91c1c">Containers (Sentry)</text>

    <rect x="980" y="546" width="145" height="60" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="1052" y="571" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Wasmtime</text>
    <text x="1052" y="589" font-size="10" text-anchor="middle" fill="#b91c1c">WebAssembly (WASI)</text>

    <path d="M 460 474 L 732 414" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text x="590" y="438" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#b45309">Tool Call Tokens</text>

    <path d="M 890 438 L 890 448" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    
    <path d="M 890 498 L 727 544" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
    <path d="M 890 498 L 889 544" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
    <path d="M 890 498 L 1052 544" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  </g>

  <!-- ================================================================= -->
  <!-- 5. EPISODIC & WORKING STATE TIER                                  -->
  <!-- ================================================================= -->
  <g id="tier-memory">
    <rect x="40" y="660" width="540" height="260" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="660" width="540" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="60" y="679" font-size="12" font-weight="bold" fill="#15803d">5. Episodic &amp; Working State Tier</text>

    <rect x="160" y="705" width="300" height="44" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="726" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Redis In-Memory Tier (Scratchpad)</text>
    <text x="310" y="741" font-size="10" text-anchor="middle" fill="#15803d">Session Locks, Nonces, Intermediate State</text>

    <rect x="160" y="765" width="300" height="44" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="786" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Distributed Vector DB (Milvus / Pinecone)</text>
    <text x="310" y="801" font-size="10" text-anchor="middle" fill="#15803d">HNSW / IVF-PQ Trajectory Embeddings</text>

    <rect x="160" y="825" width="300" height="44" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="846" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Relational &amp; Document Store (PostgreSQL)</text>
    <text x="310" y="861" font-size="10" text-anchor="middle" fill="#15803d">Entity Graphs, AST Maps, Audit Records</text>

    <path d="M 850 300 L 460 720" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
    <path d="M 970 300 L 460 785" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
    <path d="M 600 300 L 460 845" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  </g>

  <!-- ================================================================= -->
  <!-- 6. OBSERVABILITY & CRASH-CONSISTENCY TIER                         -->
  <!-- ================================================================= -->
  <g id="tier-observability">
    <rect x="620" y="660" width="540" height="260" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="620" y="660" width="540" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="640" y="679" font-size="12" font-weight="bold" fill="#0f172a">6. Observability &amp; Crash-Consistency Tier</text>

    <rect x="740" y="705" width="300" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="890" y="726" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">NVMe Write-Ahead Log (WAL)</text>
    <text x="890" y="741" font-size="10" text-anchor="middle" fill="#475569">Synchronous Durability Barrier (O_DIRECT)</text>

    <rect x="740" y="765" width="300" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="890" y="786" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">OpenTelemetry Collector</text>
    <text x="890" y="801" font-size="10" text-anchor="middle" fill="#475569">W3C TraceContext Across MicroVMs</text>

    <rect x="740" y="825" width="300" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="890" y="846" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Metrics &amp; APM (Prometheus / Jaeger)</text>
    <text x="890" y="861" font-size="10" text-anchor="middle" fill="#475569">Trajectory Goodput, CPVG, Audit Trails</text>

    <path d="M 890 498 L 890 703" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 890 749 L 890 763" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 890 809 L 890 823" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  </g>
</svg>
