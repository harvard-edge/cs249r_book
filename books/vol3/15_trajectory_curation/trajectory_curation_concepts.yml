  claims:
    Capability-gap triage: A failure earns a weight update only if it persists with complete context, a well-formed
      interface, and a healthy runtime, so counterfactual probes run up the intervention ladder from context and
      schema to SFT and then RL.
    Learning artifacts from one record: One recorded run can yield imitation material, a preference comparison,
      or a rollout fixture, and each use has its own admission conditions rather than inheriting the run's outcome.
    Task-group splits: With k attempts per task a random trace split puts most tasks on both sides, so partitions
      are assigned to task groups that hold every attempt, paraphrase, fork, and derived record.
    Admission cascade: Admission is a route-specific conjunction of predicate families that each resolve to pass,
      fail, pending, or unknown, a missing check never defaults to pass, and checks are ordered by cost per rejection.
    Recovery demonstrations: A policy trained only on clean prefixes meets off-path states it never saw, so recovery
      demonstrations keep the mistake as conditioning context and select only the assessed correction as the target.
    Self-selection narrowing: A generate-select-train loop carries contrast only on informative tasks, so it narrows
      toward what it already solves, and hard and trivial fixtures cost attempts without teaching.
    Bounded collection flow: Collection is an asynchronous pipeline whose staging must be sized for a verifier service-time
      collapse, not average utilization, with each run holding a collection credit at the record ceiling until durable
      disposition and cost counted per emitted artifact.
    Record lineage: Every record version carries a lineage envelope, and any transformation creates a derived record
      that inherits its source's split group and use permission, so withdrawal reaches every descendant.
    Mixture specification: A trajectory class has different shares by records, processed tokens, and selected target
      tokens, so a mixture is specified in targets and budgeted in processed tokens.
    Test-tampering defense: Grader isolation applied to admission keeps test harnesses, inputs, and verdicts beyond
      the candidate's reach, because an undetected bypass is reinforced across training iterations.
