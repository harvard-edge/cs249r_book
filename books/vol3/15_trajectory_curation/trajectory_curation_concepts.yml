    relationships:
    - id: vol3.field.artifact.trajectory
      source: vol3.artifact
      predicate: is derived from
      target: vol3.trajectory
      explanation: The same interaction supports several learning artifacts only after role-specific admission.
      conditions: Observed errors may remain in conditioning context without being selected as imitation
        targets.
      status: draft
      evidence:
        section: sec-vol3-trajectory-curation-learning-artifacts
        quote: Targeting that residual behavior does not mean keeping only clean, end-to-end successes,
          because a pipeline that discards every flawed run throws away most of its training signal. A trace
          that stumbled on a malformed tool call before recovering still demonstrates how to repair the
          mistake, and a run that failed outright on a subtle race condition still captures a valuable test
          environment. Depending on what evidence a trace preserves, a single recorded interaction can feed
          three distinct learning artifacts, each governed by its own admission criteria.
    - id: vol3.field.split.coverage
      source: vol3.split
      predicate: protects held-out
      target: vol3.coverage
      explanation: Evaluation protection spans collection, retrieval, memory, synthetic generation, and
        learned corpus filters.
      conditions: Derived records inherit their parent task group; renaming or redaction does not remove
        lineage.
      status: draft
      evidence:
        section: sec-vol3-trajectory-curation-heldout-protection
        quote: 'If a synthetic problem generator reads a held-out test specification, it weaves the target
          logic into nominally new training fixtures. If an automated trajectory ranker scores candidates
          by their performance on the final test suite, it tunes the training corpus to that test set without
          copying a single token. A partition boundary is therefore an architectural firewall across information
          paths, not merely a directory tag on a storage volume. Reference patches, ground-truth task specifications,
          hidden unit tests, and final evaluation outcomes must stay isolated from every upstream component:
          trajectory harvesting prompts, vector retrieval indexes, shared cross-session agent memories,
          synthetic generators, and model-based selection filters. During a trial itself, the agent likewise
          receives only the feedback the test protocol permits, such as local development tests, while the
          hidden acceptance suite stays behind the grader isolation of @sec-vol3-evaluation-gyms-grader-isolation.
          Protecting held-out evidence means auditing every one of these access paths across both upstream
          curation pipelines and the trial runtime.'
    - id: vol3.field.intervention.diagnosis
      source: vol3.intervention
      predicate: uses evidence from
      target: vol3.diagnosis
      explanation: Training is appropriate only after diagnostic evidence identifies a capability gap that
        cheaper reversible changes do not resolve.
      conditions: The ordering guides cost and reversibility, not an unconditional mandatory sequence.
      status: draft
      evidence:
        section: sec-vol3-flywheel-intervention-order
        quote: Fine-tuning a model to compensate for an omitted context fact or an ambiguous tool schema
          is **premature fine-tuning**\index{Premature fine-tuning!definition}, an expensive waste of compute
          and curation effort on a defect that a prompt or schema fix cures in minutes. To prevent that
          misallocation, the **intervention ladder**\index{Intervention ladder!definition} orders failure
          remedies by ascending engineering cost and descending reversibility. Its rungs are context retrieval
          and assembly, tool definitions and schemas, runtime execution controls, supervised fine-tuning
          (updating weights to imitate selected demonstrations), and reinforcement learning (updating weights
          to raise a verified reward on fresh rollouts). Engineers test the inexpensive, reversible rungs
          first by default, advancing to a weight update only when diagnostic evidence establishes a genuine
          capability gap and confirms that training improves the behavior rather than masking an interface
          or runtime defect.
