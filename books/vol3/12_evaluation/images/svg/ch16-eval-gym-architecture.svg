<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 490" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6b21a8"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="490" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT: PHYSICAL HOST & FIRECRACKER MICROVM ENCLAVE                 -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <!-- Host Outer Enclosure -->
    <rect x="0" y="0" width="700" height="450" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <rect x="0" y="0" width="700" height="32" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.2">PHYSICAL EVALUATION HOST (Bare-Metal Linux KVM)</text>
    <text x="684" y="21" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">Kernel 6.x /dev/kvm</text>

    <!-- Jailer & MicroVM Container Boundary -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="660" height="382" rx="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
      <rect x="0" y="0" width="660" height="28" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
      <text x="14" y="19" font-size="10" font-weight="700" fill="#581c87" letter-spacing="0.2">FIRECRACKER MICROVM JAILER (cgroups v2 + seccomp-bpf)</text>
      <text x="646" y="19" font-size="9" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#6b21a8">Boot &lt; 5 ms | Zero ambient authority</text>

      <!-- Inside MicroVM Guest -->
      <g transform="translate(16, 38)">
        <rect x="0" y="0" width="628" height="330" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

        <!-- Upper Row: Guest Agent Process & Deterministic PRNG Seed Tap -->
        <g transform="translate(14, 14)">
          <!-- Guest Agent Runtime -->
          <rect x="0" y="0" width="385" height="88" rx="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
          <text x="12" y="20" font-size="10" font-weight="700" fill="#581c87">Guest Agent Runtime (PID 1 Namespace)</text>
          <text x="12" y="38" font-size="8.5" fill="#334155">Resource Quotas: 2 vCPUs pinned | 4 GB RAM ceiling</text>
          <text x="12" y="54" font-size="8.5" font-family="'SF Mono', Consolas, monospace" fill="#6b21a8">Actions: Shell execution, file editing, compiler calls</text>
          <rect x="12" y="62" width="361" height="18" rx="2" fill="#f3e8ff"/>
          <text x="192" y="75" font-size="8" font-weight="600" fill="#581c87" text-anchor="middle">All mutations confined to ephemeral upper layer</text>

          <!-- Deterministic PRNG Seed Tap -->
          <g transform="translate(400, 0)">
            <rect x="0" y="0" width="200" height="88" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text x="12" y="20" font-size="9.5" font-weight="700" fill="#1e293b">Deterministic PRNG Tap</text>
            <text x="12" y="38" font-size="8.5" font-family="'SF Mono', Consolas, monospace" fill="#475569">/dev/urandom -&gt; Seed S</text>
            <text x="12" y="54" font-size="8.5" fill="#475569">Cryptographic hash pinning</text>
            <text x="12" y="70" font-size="8" font-weight="600" fill="#0f766e">Deterministic replay reproducibility</text>
          </g>
        </g>

        <!-- Middle Row: Tiered Storage Subsystem (Copy-on-Write) -->
        <g transform="translate(14, 114)">
          <text x="0" y="12" font-size="9.5" font-weight="700" fill="#1e293b">Tiered Storage Architecture: Copy-on-Write (CoW) Layering</text>

          <g transform="translate(0, 22)">
            <!-- Layer 1: Immutable Golden Base Image -->
            <rect x="0" y="0" width="285" height="62" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
            <text x="12" y="19" font-size="9" font-weight="700" fill="#1e293b">Base Image: rootfs.ext4 (Read-Only)</text>
            <text x="12" y="35" font-size="8.5" fill="#475569">Pre-built toolchains, package cache, git repository</text>
            <text x="12" y="50" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#64748b">Mount: /dev/vda (ro, noatime)</text>

            <!-- Plus Sign -->
            <text x="300" y="37" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">+</text>

            <!-- Layer 2: Ephemeral CoW Overlay -->
            <g transform="translate(315, 0)">
              <rect x="0" y="0" width="285" height="62" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
              <text x="12" y="19" font-size="9" font-weight="700" fill="#92400e">Ephemeral CoW Overlay (Writable)</text>
              <text x="12" y="35" font-size="8.5" fill="#78350f">tmpfs RAM-backed delta storage layer</text>
              <text x="12" y="50" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#b45309">Discard latency: &lt; 50 ms via blkdiscard</text>
            </g>
          </g>
        </g>

        <!-- Bottom Row: Hermetic Network Filter -->
        <g transform="translate(14, 210)">
          <rect x="0" y="0" width="600" height="96" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.1"/>
          <text x="14" y="18" font-size="9.5" font-weight="700" fill="#0f766e">Hermetic Network Isolation (Virtual TAP tap0 + eBPF Packet Filter)</text>

          <g transform="translate(14, 28)">
            <!-- Public Internet Block -->
            <rect x="0" y="0" width="260" height="52" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
            <text x="12" y="19" font-size="8.5" font-weight="700" fill="#991b1b">Public Internet (WAN) Egress</text>
            <text x="12" y="34" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#b91c1c">DROP ALL packets (Zero Leakage)</text>
            <text x="12" y="45" font-size="7.5" fill="#7f1d1d">Blocks PyPI, GitHub API, AWS calls</text>

            <!-- Transfer Arrow -->
            <line x1="268" y1="26" x2="296" y2="26" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>

            <!-- Deterministic Mock Services -->
            <g transform="translate(304, 0)">
              <rect x="0" y="0" width="268" height="52" rx="2" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
              <text x="12" y="19" font-size="8.5" font-weight="700" fill="#0f766e">Deterministic Local Mock Services</text>
              <text x="12" y="34" font-size="8" fill="#115e59">Cryptographic HTTP record-and-replay stubs</text>
              <text x="12" y="45" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#134e4a">Stateful in-memory Git and S3 fixtures</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CROSS-BOUNDARY DATA TRANSFER                                      -->
  <!-- ================================================================= -->
  <g transform="translate(730, 110)">
    <path d="M 0 0 L 40 0" fill="none" stroke="#6b21a8" stroke-width="2" marker-end="url(#arr-purple)"/>
    <rect x="-8" y="-24" width="56" height="18" rx="2" fill="#faf5ff" stroke="#6b21a8" stroke-width="0.8"/>
    <text x="20" y="-12" font-size="7.5" font-weight="700" font-family="'SF Mono', Consolas, monospace" fill="#581c87" text-anchor="middle">patch.diff</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: OUT-OF-BAND GROUND-TRUTH VERIFIER                          -->
  <!-- ================================================================= -->
  <g transform="translate(775, 20)">
    <rect x="0" y="0" width="345" height="450" rx="4" fill="#ffffff" stroke="#166534" stroke-width="1.3"/>
    <rect x="0" y="0" width="345" height="32" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.2">OUT-OF-BAND VERIFIER (Oracle Enclave)</text>
    <text x="330" y="21" font-size="9" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#15803d">Zero Leakage</text>

    <!-- Step 1: Patch Ingestion -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="313" height="74" rx="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#581c87">Patch Artifact Extraction</text>
      <text x="12" y="36" font-size="8.5" fill="#334155">Only git diff output crosses isolation wall:</text>
      <rect x="12" y="44" width="289" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="20" y="59" font-size="8.5" font-family="'SF Mono', Consolas, monospace" fill="#581c87">patch = git diff HEAD..worktree</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="172" y1="126" x2="172" y2="142" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Step 2: Clean Application -->
    <g transform="translate(16, 146)">
      <rect x="0" y="0" width="313" height="82" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#1e293b">Clean Environment Application</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Patch applied to pristine repository snapshot:</text>
      <rect x="12" y="44" width="289" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="20" y="59" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#1e293b">git apply --check &amp;&amp; git apply patch</text>
      <text x="12" y="74" font-size="7.5" fill="#64748b">Agent code never accesses acceptance tests</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="172" y1="232" x2="172" y2="248" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Step 3: Hidden Acceptance Test Oracle -->
    <g transform="translate(16, 252)">
      <rect x="0" y="0" width="313" height="86" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#166534">Hidden Acceptance Test Oracle</text>
      <text x="12" y="36" font-size="8.5" fill="#15803d">Executes out-of-band ground-truth suite:</text>
      <rect x="12" y="44" width="289" height="24" rx="2" fill="#ffffff" stroke="#166534" stroke-width="0.8"/>
      <text x="20" y="60" font-size="8.5" font-family="'SF Mono', Consolas, monospace" fill="#166534">pytest tests/test_acceptance.py</text>
      <text x="12" y="79" font-size="7.5" fill="#14532d">Compiler syntax + AST invariant validation</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="172" y1="342" x2="172" y2="358" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Step 4: Deterministic Verdict Emission -->
    <g transform="translate(16, 362)">
      <rect x="0" y="0" width="313" height="74" rx="3" fill="#ffffff" stroke="#166534" stroke-width="1.4"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#166534">Deterministic Evaluation Verdict</text>
      <rect x="12" y="26" width="289" height="26" rx="2" fill="#f0fdf4" stroke="#166534" stroke-width="1"/>
      <text x="156" y="43" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace" fill="#166534" text-anchor="middle">Verdict V(&#964;) &#8712; {0, 1}</text>
      <text x="12" y="63" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#64748b">Logged to immutable ledger: {pass@1, time, tokens}</text>
    </g>
  </g>
</svg>
