<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="660" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#EDE9FE"/>
    <text x="65" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87" text-anchor="middle" letter-spacing="0.5">FIGURE 8.2</text>
    <text x="145" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Radix Tree Architecture for Dynamic Prefix Caching</text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">RadixAttention token sequence indexing, physical PagedAttention block mapping, and reference-counted LRU eviction</text>
  </g>

  <!-- Main Left Card: Logical Radix Tree Structure -->
  <g transform="translate(45, 115)">
    <rect width="570" height="420" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="570" height="44" rx="14" fill="#F5F3FF"/>
    <path d="M0 30 L0 44 L570 44 L570 30 Z" fill="#F5F3FF"/>
    <text x="25" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#581C87">Logical Radix Tree Index (Token Sequences)</text>

    <!-- Tree Nodes & Edges -->
    <g transform="translate(25, 60)">
      <!-- Root Node -->
      <rect x="170" y="0" width="180" height="46" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="260" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#581C87" text-anchor="middle">Root: System Prompt</text>
      <text x="260" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B21A8" text-anchor="middle">Tokens [0..1840] • ref_count=3</text>

      <!-- Forking Lines -->
      <path d="M 230 46 L 100 95" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 290 46 L 410 95" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Level 1 - Child A -->
      <g transform="translate(10, 95)">
        <rect x="0" y="0" width="185" height="52" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
        <text x="92" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#064E3B" text-anchor="middle">Turn 1: User Goal A</text>
        <text x="92" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#14532D" text-anchor="middle">Tokens [1841..2420] • ref=2</text>
        <text x="92" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#059669" text-anchor="middle">MATCH: 100% Cache Hit</text>
      </g>

      <!-- Level 1 - Child B -->
      <g transform="translate(320, 95)">
        <rect x="0" y="0" width="185" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
        <text x="92" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350F" text-anchor="middle">Turn 1: User Goal B</text>
        <text x="92" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#92400E" text-anchor="middle">Tokens [1841..2180] • ref=1</text>
        <text x="92" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#D97706" text-anchor="middle">INACTIVE (Idle Branch)</text>
      </g>

      <!-- Forking Lines from Child A -->
      <path d="M 60 147 L 30 190" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 140 147 L 175 190" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Level 2 - Child A1 (Turn 2 Step) -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="145" height="50" rx="8" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
        <text x="72" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Step 2: Tool Call</text>
        <text x="72" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857" text-anchor="middle">view_file(cache.py)</text>
        <text x="72" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857" text-anchor="middle">Tokens [2421..2850] • ref=1</text>
      </g>

      <!-- Level 2 - Child A2 (Branch Rollout / MCTS) -->
      <g transform="translate(155, 190)">
        <rect x="0" y="0" width="145" height="50" rx="8" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
        <text x="72" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Branch A2: Search</text>
        <text x="72" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857" text-anchor="middle">grep_search(H2O)</text>
        <text x="72" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857" text-anchor="middle">Tokens [2421..2910] • ref=1</text>
      </g>

      <!-- Forking Line from Child B to Eviction Leaf -->
      <path d="M 410 147 L 410 190" fill="none" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow)"/>
      <g transform="translate(340, 190)">
        <rect x="0" y="0" width="145" height="50" rx="8" fill="#FEE2E2" stroke="#F87171" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="72" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9F1239" text-anchor="middle">Terminated Turn</text>
        <text x="72" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#9F1239" text-anchor="middle">ref_count = 0</text>
        <text x="72" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#E11D48" text-anchor="middle">QUEUED FOR LRU</text>
      </g>
    </g>

    <!-- Bottom Legend / Properties -->
    <g transform="translate(25, 325)">
      <rect x="0" y="0" width="520" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">RadixAttention Invariants:</text>
      <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Prefix lookup overhead is sub-millisecond: O(length) string comparison over token IDs.</text>
      <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Zero redundant prefill: matched prefixes skip compute and map directly to cached KV blocks.</text>
      <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Reference counting: internal nodes pinned while active children exist; leaves evicted via LRU.</text>
    </g>
  </g>

  <!-- Main Right Card: PagedAttention Physical KV Memory Mapping -->
  <g transform="translate(635, 115)">
    <rect width="520" height="420" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="520" height="44" rx="14" fill="#F0FDF4"/>
    <path d="M0 30 L0 44 L520 44 L520 30 Z" fill="#F0FDF4"/>
    <text x="25" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46">Physical PagedAttention Memory Mapping (HBM)</text>

    <!-- Block Mapping Table -->
    <g transform="translate(25, 60)">
      <!-- Page Table Block -->
      <rect x="0" y="0" width="220" height="180" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="28" rx="8" fill="#E2E8F0"/>
      <text x="110" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Logical Block Table</text>

      <g transform="translate(10, 36)">
        <text x="0" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Logical #0  ──►  Phys #4</text>
        <text x="0" y="32" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Logical #1  ──►  Phys #7</text>
        <text x="0" y="50" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Logical #2  ──►  Phys #1</text>
        <text x="0" y="68" font-family="monospace" font-size="9" font-weight="700" fill="#0F172A">Logical #3  ──►  Phys #12</text>
        <text x="0" y="86" font-family="monospace" font-size="9" font-weight="700" fill="#059669">Branch A1   ──►  Phys #9</text>
        <text x="0" y="104" font-family="monospace" font-size="9" font-weight="700" fill="#059669">Branch A2   ──►  Phys #15</text>
        <line x1="0" y1="116" x2="200" y2="116" stroke="#E2E8F0" stroke-width="1"/>
        <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Block size = 16 tokens</text>
      </g>

      <!-- Physical Memory Grid -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="225" height="180" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
        <rect x="0" y="0" width="225" height="28" rx="8" fill="#DCFCE7"/>
        <text x="112" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Physical HBM Blocks</text>

        <!-- Memory slots -->
        <g transform="translate(12, 38)">
          <rect x="0" y="0" width="45" height="30" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
          <text x="22" y="18" font-family="monospace" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">#1</text>
          
          <rect x="52" y="0" width="45" height="30" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
          <text x="74" y="18" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">#2</text>

          <rect x="104" y="0" width="45" height="30" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
          <text x="126" y="18" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">#3</text>

          <rect x="156" y="0" width="45" height="30" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
          <text x="178" y="18" font-family="monospace" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">#4</text>

          <rect x="0" y="38" width="45" height="30" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
          <text x="22" y="56" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">#5</text>

          <rect x="52" y="38" width="45" height="30" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
          <text x="74" y="56" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">#6</text>

          <rect x="104" y="38" width="45" height="30" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
          <text x="126" y="56" font-family="monospace" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">#7</text>

          <rect x="156" y="38" width="45" height="30" rx="4" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>
          <text x="178" y="56" font-family="monospace" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">#9</text>

          <rect x="0" y="76" width="45" height="30" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
          <text x="22" y="94" font-family="monospace" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">#12</text>

          <rect x="52" y="76" width="45" height="30" rx="4" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>
          <text x="74" y="94" font-family="monospace" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">#15</text>

          <rect x="104" y="76" width="97" height="30" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
          <text x="152" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#B45309" text-anchor="middle">Free Pool</text>
        </g>
      </g>
    </g>

    <!-- Allocation Comparison Table -->
    <g transform="translate(25, 260)">
      <rect x="0" y="0" width="470" height="145" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065F46">Static Tensor vs. PagedAttention Allocation:</text>
        
        <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9F1239">• Contiguous Static Allocation:</text>
        <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Requires pre-allocating max sequence length; wastes 60–80%</text>
        <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">of memory on internal/external fragmentation.</text>

        <text x="0" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46">• Dynamic Paged Allocation:</text>
        <text x="0" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Allocates blocks on-demand; eliminates external fragmentation;</text>
        <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">enables copy-on-write sharing across speculative branches.</text>

        <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#581C87">Throughput gain: 2.2x to 4.5x higher serving concurrency.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(45, 550)">
    <rect width="1110" height="85" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="18" y="18" width="90" height="48" rx="6" fill="#581C87"/>
    <text x="63" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SYSTEMS</text>
    <text x="63" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRINCIPLE</text>
    <text x="125" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Radix Trees Exploit Prefix Redundancy; PagedAttention Solves Fragmentation</text>
    <text x="125" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Multi-turn agent trajectories share 85–95% of prompt prefixes. Radix trees index token sequences to skip redundant prefill compute,</text>
    <text x="125" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">while virtual page tables map logical blocks to arbitrary non-contiguous physical GPU pages with copy-on-write sharing.</text>
  </g>
</svg>