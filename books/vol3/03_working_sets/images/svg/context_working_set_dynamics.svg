<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="660" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#EDE9FE"/>
    <text x="65" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87" text-anchor="middle" letter-spacing="0.5">FIGURE 3.1</text>
    <text x="145" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Denning's Working Set Applied to Neural Agent Context</text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">Contrasting unbounded append-only context accumulation against active eviction-driven working set management W(t, Δt)</text>
  </g>

  <!-- Panel 1: Unmanaged Context (Left) -->
  <g transform="translate(45, 110)">
    <rect width="525" height="420" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="525" height="46" rx="14" fill="#FFF1F2"/>
    <path d="M0 32 L0 46 L525 46 L525 32 Z" fill="#FFF1F2"/>
    <circle cx="26" cy="23" r="8" fill="#E11D48"/>
    <text x="26" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✕</text>
    <text x="44" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9F1239">Unmanaged Append-Only Trajectory (Anti-Pattern)</text>

    <!-- Accumulation Curve Chart -->
    <g transform="translate(30, 70)">
      <!-- Axes -->
      <line x1="40" y1="160" x2="450" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="40" y1="20" x2="40" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="450" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="end">Trajectory Steps (t)</text>
      <text x="35" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="end">Tokens</text>

      <!-- Grid ticks -->
      <line x1="36" y1="120" x2="450" y2="120" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="36" y1="70" x2="450" y2="70" stroke="#F1F5F9" stroke-width="1"/>
      <text x="32" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">32k</text>
      <text x="32" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">96k</text>
      <text x="32" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">128k</text>

      <!-- Danger Zone Ceiling -->
      <line x1="40" y1="35" x2="450" y2="35" stroke="#E11D48" stroke-dasharray="4,4" stroke-width="1.5"/>
      <rect x="290" y="22" width="155" height="20" rx="4" fill="#FFE4E6"/>
      <text x="367" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#BE123C" text-anchor="middle">HBM Capacity / TTFT Wall</text>

      <!-- Token Growth Curve -->
      <path d="M 40 155 Q 180 145 260 110 T 430 38" fill="none" stroke="#E11D48" stroke-width="3"/>
      <circle cx="430" cy="38" r="5" fill="#E11D48"/>

      <!-- Annotations -->
      <rect x="90" y="85" width="130" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="155" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F172A" text-anchor="middle">Tool Output Bloat</text>
      <text x="155" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">+15,000 tokens / grep</text>
    </g>

    <!-- Symptoms Breakdown -->
    <g transform="translate(25, 260)">
      <rect x="0" y="0" width="475" height="135" rx="10" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1"/>
      
      <g transform="translate(16, 20)">
        <circle cx="10" cy="8" r="4" fill="#E11D48"/>
        <text x="24" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9F1239">Quadratic Prefill &amp; TTFT Explosion:</text>
        <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Attention compute scales as O(L²). Prefill latency surges from 120ms to >8.5s.</text>
      </g>

      <g transform="translate(16, 58)">
        <circle cx="10" cy="8" r="4" fill="#E11D48"/>
        <text x="24" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9F1239">Memory Wall Bottleneck during Decode:</text>
        <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Every token generation loads multi-GB KV cache from HBM (Operational intensity &lt;&lt; 1).</text>
      </g>

      <g transform="translate(16, 96)">
        <circle cx="10" cy="8" r="4" fill="#E11D48"/>
        <text x="24" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9F1239">"Lost-in-the-Middle" Attention Dispersion:</text>
        <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Rotary position decay &amp; softmax dilution cause early instructions to be ignored.</text>
      </g>
    </g>
  </g>

  <!-- Panel 2: Managed Working Set (Right) -->
  <g transform="translate(630, 110)">
    <rect width="525" height="420" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="525" height="46" rx="14" fill="#F5F3FF"/>
    <path d="M0 32 L0 46 L525 46 L525 32 Z" fill="#F5F3FF"/>
    <circle cx="26" cy="23" r="8" fill="#7C3AED"/>
    <text x="26" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="44" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#581C87">Active Context Working Set W(t, Δt) (Architectural Model)</text>

    <!-- Working Set Architecture Diagram -->
    <g transform="translate(25, 65)">
      <!-- Tier 1: Fixed Anchor -->
      <rect x="0" y="0" width="475" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <rect x="12" y="10" width="75" height="28" rx="5" fill="#581C87"/>
      <text x="49" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">L0 ANCHOR</text>
      <text x="100" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#3B0764">System Invariants &amp; Tool Contracts (Pinned)</text>
      <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#581C87">Fixed instruction prefix, MCP schemas, security envelope (Zero-eviction policy)</text>

      <!-- Dynamic Working Set Bracket -->
      <rect x="0" y="58" width="475" height="96" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
      <rect x="12" y="68" width="75" height="28" rx="5" fill="#059669"/>
      <text x="49" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">W(t, Δt)</text>
      <text x="100" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#064E3B">Dynamic Working Set Window (Bounded Budget ≤ 32k)</text>
      
      <g transform="translate(100, 94)">
        <rect x="0" y="0" width="115" height="48" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="57" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">Active Turn (t)</text>
        <text x="57" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">Observation state,</text>
        <text x="57" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">diff &amp; live AST</text>

        <rect x="125" y="0" width="115" height="48" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="182" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">Recent Context (Δt)</text>
        <text x="182" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">Sliding window</text>
        <text x="182" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">k=4 immediate turns</text>

        <rect x="250" y="0" width="115" height="48" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="307" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">Ephemeral CoT</text>
        <text x="307" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">Scratchpad tokens</text>
        <text x="307" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">pruned post-action</text>
      </g>

      <!-- Eviction / Compaction Boundary -->
      <g transform="translate(0, 164)">
        <line x1="20" y1="8" x2="455" y2="8" stroke="#7C3AED" stroke-dasharray="4,4" stroke-width="1.5"/>
        <rect x="160" y="-3" width="155" height="22" rx="11" fill="#7C3AED"/>
        <text x="237" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">EVICTION / COMPACTION GATE</text>
      </g>

      <!-- Tier 2: Compacted State & Off-Context Hierarchy -->
      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="475" height="66" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
        <rect x="12" y="19" width="75" height="28" rx="5" fill="#D97706"/>
        <text x="49" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">L2 / L3</text>
        <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350F">Structured Compaction &amp; Episodic Tier</text>
        <text x="100" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400E">Lossless git diffs, AST symbol summaries, episodic vector index (HNSW)</text>
        <text x="100" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#B45309">Preserves decision state; prevents hallucination drift across 100+ steps.</text>
      </g>
    </g>

    <!-- Metrics Callout Box -->
    <g transform="translate(25, 338)">
      <rect x="0" y="0" width="475" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="75" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#059669" text-anchor="middle">≤ 180 ms</text>
      <text x="75" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Constant TTFT</text>
      <line x1="155" y1="12" x2="155" y2="48" stroke="#E2E8F0" stroke-width="1"/>
      <text x="235" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#581C87" text-anchor="middle">O(1) Bounded</text>
      <text x="235" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">KV Memory Footprint</text>
      <line x1="315" y1="12" x2="315" y2="48" stroke="#E2E8F0" stroke-width="1"/>
      <text x="395" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#D97706" text-anchor="middle">99.4%</text>
      <text x="395" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Instruction Recall</text>
    </g>
  </g>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(45, 550)">
    <rect width="1110" height="78" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="18" y="16" width="90" height="46" rx="6" fill="#581C87"/>
    <text x="63" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SYSTEMS</text>
    <text x="63" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">INVARIANT</text>
    <text x="125" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Context Window is L1 Cache, Not Durable Storage</text>
    <text x="125" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Treating context as an unbounded dump triggers quadratic prefill penalties and memory bandwidth saturation.</text>
    <text x="125" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Long trajectories require active working set management W(t, Δt): discard scratchpads, skeletonize payloads, and compact state.</text>
  </g>
</svg>