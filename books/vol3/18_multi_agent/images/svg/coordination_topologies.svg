<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
  </defs>
  <rect width="740" height="490" fill="#ffffff"/>
  <g transform="translate(10,10)">

  <!-- ===== (a) Supervisor-worker ===== -->
  <rect x="10" y="10" width="340" height="215" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="10" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="22" y="28" font-size="13" font-weight="700" fill="#0f172a">(a) Supervisor–worker</text>
  <text x="338" y="28" text-anchor="end" font-size="12" fill="#334155">2<tspan font-style="italic">N</tspan> per round</text>
  <rect x="40" y="60" width="280" height="34" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">supervisor</text>
  <!-- workers -->
  <rect x="50" y="160" width="80" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="90" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <rect x="140" y="160" width="80" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="180" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <rect x="230" y="160" width="80" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="270" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <!-- envelope down (solid violet), receipt up (dashed green) -->
  <path d="M80,94 V159" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M100,160 V95" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <path d="M170,94 V159" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M190,160 V95" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <path d="M260,94 V159" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M280,160 V95" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="74" y="131" text-anchor="end" font-size="12" fill="#6d28d9">envelope</text>
  <text x="286" y="131" text-anchor="start" font-size="12" fill="#15803d">receipt</text>

  <!-- ===== (b) Pipeline ===== -->
  <rect x="370" y="10" width="340" height="215" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="370" y="10" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="382" y="28" font-size="13" font-weight="700" fill="#0f172a">(b) Pipeline</text>
  <!-- stages -->
  <rect x="392" y="104" width="60" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="422" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">stage 1</text>
  <rect x="510" y="104" width="60" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="540" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">stage 2</text>
  <rect x="628" y="104" width="60" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="658" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">stage 3</text>
  <!-- queue 1: two of three slots occupied -->
  <rect x="466" y="111" width="10" height="20" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="476" y="111" width="10" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <rect x="486" y="111" width="10" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <!-- queue 2: one of three slots occupied -->
  <rect x="584" y="111" width="10" height="20" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="594" y="111" width="10" height="20" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <rect x="604" y="111" width="10" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <path d="M452,121 H465" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M496,121 H509" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M570,121 H583" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M614,121 H627" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- bounded-queue braces -->
  <path d="M466,140 V145 H496 V140" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <path d="M584,140 V145 H614 V140" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <text x="481" y="162" text-anchor="middle" font-size="12" fill="#334155">bounded</text>
  <text x="481" y="176" text-anchor="middle" font-size="12" fill="#334155">queue</text>
  <text x="599" y="162" text-anchor="middle" font-size="12" fill="#334155">bounded</text>
  <text x="599" y="176" text-anchor="middle" font-size="12" fill="#334155">queue</text>
  <text x="481" y="94" text-anchor="middle" font-size="12" fill="#334155">artifacts</text>
  <text x="599" y="94" text-anchor="middle" font-size="12" fill="#334155">artifacts</text>

  <!-- ===== (c) Shared blackboard ===== -->
  <rect x="10" y="245" width="340" height="215" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="245" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="22" y="263" font-size="13" font-weight="700" fill="#0f172a">(c) Shared blackboard</text>
  <!-- workers -->
  <rect x="30" y="300" width="80" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="70" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <rect x="30" y="350" width="80" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="70" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <rect x="30" y="400" width="80" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="70" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <!-- store -->
  <rect x="190" y="290" width="140" height="154" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">shared store</text>
  <rect x="202" y="324" width="116" height="28" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="202" y="324" width="4" height="28" fill="#16a34a"/>
  <text x="262" y="342" text-anchor="middle" font-size="12" fill="#0f172a">task 2: claimed</text>
  <rect x="202" y="362" width="116" height="28" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#0f172a">artifact v2</text>
  <rect x="202" y="400" width="116" height="28" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="260" y="418" text-anchor="middle" font-size="12" fill="#0f172a">artifact v3</text>
  <!-- claim/publish (solid green) and read (dashed gray) -->
  <path d="M110,312 H189" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M189,323 H111" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <path d="M110,362 H189" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M189,373 H111" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <path d="M110,412 H189" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M189,423 H111" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="150" y="293" text-anchor="middle" font-size="12" fill="#15803d">claim, publish</text>
  <text x="150" y="448" text-anchor="middle" font-size="12" fill="#475569">read</text>

  <!-- ===== (d) Actor messaging ===== -->
  <rect x="370" y="245" width="340" height="215" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="370" y="245" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="382" y="263" font-size="13" font-weight="700" fill="#0f172a">(d) Actor messaging</text>
  <text x="698" y="263" text-anchor="end" font-size="12" fill="#334155">mesh: <tspan font-style="italic">N</tspan>(<tspan font-style="italic">N</tspan> − 1)</text>
  <!-- possible full-mesh links (faint) -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <line x1="440" y1="316" x2="640" y2="410"/>
    <line x1="640" y1="316" x2="440" y2="410"/>
    <line x1="440" y1="316" x2="440" y2="410"/>
    <line x1="640" y1="316" x2="640" y2="410"/>
    <line x1="440" y1="410" x2="640" y2="410"/>
  </g>
  <!-- actors, each with a three-slot mailbox -->
  <rect x="395" y="296" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="425" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">actor 1</text>
  <rect x="595" y="296" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="625" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">actor 2</text>
  <rect x="395" y="390" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="425" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">actor 3</text>
  <rect x="595" y="390" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="625" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">actor 4</text>
  <g stroke="#0284c7" stroke-width="0.8">
    <rect x="461" y="302" width="8" height="28" fill="#ffffff"/><rect x="469" y="302" width="8" height="28" fill="#7dd3fc"/>
    <rect x="661" y="302" width="8" height="28" fill="#ffffff"/><rect x="669" y="302" width="8" height="28" fill="#7dd3fc"/>
    <rect x="461" y="396" width="8" height="28" fill="#ffffff"/><rect x="469" y="396" width="8" height="28" fill="#ffffff"/>
    <rect x="661" y="396" width="8" height="28" fill="#ffffff"/><rect x="669" y="396" width="8" height="28" fill="#7dd3fc"/>
  </g>
  <!-- three addressed messages actually sent -->
  <path d="M485,316 H594" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M640,336 V389" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M440,390 V337" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="540" y="306" text-anchor="middle" font-size="12" fill="#0369a1">message</text>
  <text x="540" y="448" text-anchor="middle" font-size="12" fill="#475569">mailbox per actor</text>
  </g>
</svg>
