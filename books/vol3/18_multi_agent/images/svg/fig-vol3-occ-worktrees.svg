<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="740" height="440" fill="#ffffff"/>
  <g transform="translate(10,10)">

  <!-- ===== (a) Private workspaces ===== -->
  <rect x="10" y="10" width="340" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="10" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="22" y="28" font-size="13" font-weight="700" fill="#0f172a">(a) Private workspaces</text>
  <rect x="30" y="54" width="300" height="34" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">shared repository storage</text>
  <path d="M102,88 V126 M258,88 V126" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <!-- sandboxes (amber, dashed) around each worktree -->
  <rect x="30" y="114" width="144" height="84" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="186" y="114" width="144" height="84" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="38" y="126" width="128" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="102" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">interface worktree</text>
  <text x="102" y="160" text-anchor="middle" font-size="12" fill="#334155">files, index, HEAD</text>
  <rect x="194" y="126" width="128" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="258" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">caller worktree</text>
  <text x="258" y="160" text-anchor="middle" font-size="12" fill="#334155">files, index, HEAD</text>
  <text x="102" y="189" text-anchor="middle" font-size="12" fill="#b45309">sandbox</text>
  <text x="258" y="189" text-anchor="middle" font-size="12" fill="#b45309">sandbox</text>

  <!-- ===== (b) A clean merge with a stale dependency ===== -->
  <rect x="370" y="10" width="340" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="370" y="10" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="382" y="28" font-size="13" font-weight="700" fill="#0f172a">(b) Clean merge, stale dependency</text>
  <!-- edges -->
  <path d="M414,90 H535" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="475" y="82" text-anchor="middle" font-size="12" fill="#334155">interface change</text>
  <path d="M400,104 V160 H515" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="458" y="178" text-anchor="middle" font-size="12" fill="#0369a1">caller edits</text>
  <path d="M564,90 H660 V145" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M544,160 H645" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="595" y="151" text-anchor="middle" font-size="12" fill="#334155">staged merge</text>
  <!-- stale dependency: the worker still points at the base interface -->
  <path d="M530,146 C 505,118 440,116 410,101" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="465" y="145" text-anchor="middle" font-size="12" fill="#b91c1c">stale dependency</text>
  <!-- commit nodes -->
  <circle cx="400" cy="90" r="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="550" cy="90" r="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="530" cy="160" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="660" cy="160" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="66" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#0f172a">h<tspan font-size="11.5" font-style="normal" dy="3">base</tspan></text>
  <text x="550" y="66" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#0f172a">h<tspan font-size="11.5" font-style="normal" dy="3">head</tspan></text>
  <text x="530" y="195" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#0f172a">h<tspan font-size="11.5" font-style="normal" dy="3">worker</tspan></text>
  <text x="660" y="195" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#0f172a">h<tspan font-size="11.5" font-style="normal" dy="3">candidate</tspan></text>

  <!-- ===== (c) Guarded publication ===== -->
  <rect x="10" y="225" width="700" height="185" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="225" width="700" height="26" rx="2" fill="#e2e8f0"/>
  <text x="22" y="243" font-size="13" font-weight="700" fill="#0f172a">(c) Guarded publication</text>
  <!-- moved-head loop back to step 1 -->
  <path d="M510,290 V274 H88 V289" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="299" y="268" text-anchor="middle" font-size="12" fill="#6d28d9">head moved: return to step 1</text>
  <!-- steps -->
  <rect x="30" y="290" width="116" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="88" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan fill="#0369a1">1</tspan><tspan dx="6">revalidate</tspan></text>
  <text x="88" y="324" text-anchor="middle" font-size="12" fill="#334155"><tspan font-style="italic">h</tspan><tspan font-size="11.5" dy="3">base</tspan><tspan dy="-3" dx="4">vs.</tspan><tspan dx="4" font-style="italic">h</tspan><tspan font-size="11.5" dy="3">head</tspan></text>
  <rect x="168" y="290" width="116" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="226" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan fill="#0369a1">2</tspan><tspan dx="6">build candidate</tspan></text>
  <text x="226" y="324" text-anchor="middle" font-size="12" fill="#334155">makes<tspan dx="4" font-style="italic">h</tspan><tspan font-size="11.5" dy="3">candidate</tspan></text>
  <rect x="306" y="290" width="116" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="364" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan fill="#0369a1">3</tspan><tspan dx="6">checks</tspan></text>
  <text x="364" y="324" text-anchor="middle" font-size="12" fill="#334155">on<tspan dx="4" font-style="italic">h</tspan><tspan font-size="11.5" dy="3">candidate</tspan></text>
  <rect x="444" y="290" width="132" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="510" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a"><tspan fill="#0369a1">4</tspan><tspan dx="6">atomic update</tspan></text>
  <text x="510" y="324" text-anchor="middle" font-size="12" fill="#334155">expects<tspan dx="4" font-style="italic">h</tspan><tspan font-size="11.5" dy="3">head</tspan><tspan dy="-3">, guard</tspan></text>
  <rect x="598" y="290" width="92" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="644" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">published</text>
  <text x="644" y="324" text-anchor="middle" font-size="12" fill="#334155">with evidence</text>
  <path d="M146,312 H167" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M284,312 H305" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M422,312 H443" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M576,312 H597" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- explicit-status exits -->
  <path d="M88,334 V359" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="88" y="376" text-anchor="middle" font-size="12" fill="#b91c1c">request</text>
  <text x="88" y="391" text-anchor="middle" font-size="12" fill="#b91c1c">revision</text>
  <path d="M226,334 V359" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="226" y="376" text-anchor="middle" font-size="12" fill="#b91c1c">request</text>
  <text x="226" y="391" text-anchor="middle" font-size="12" fill="#b91c1c">reconciliation</text>
  <path d="M364,334 V359" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="364" y="376" text-anchor="middle" font-size="12" fill="#b91c1c">reject</text>
  <path d="M510,334 V359" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="510" y="376" text-anchor="middle" font-size="12" fill="#b91c1c">reconcile</text>
  <text x="510" y="391" text-anchor="middle" font-size="12" fill="#b91c1c">outcome</text>
  </g>
</svg>
