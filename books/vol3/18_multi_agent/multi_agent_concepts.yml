  claims:
    Delegation adds boundaries: A delegated worker owns a separate child trajectory, and a capable single controller
      already runs tools and candidates concurrently, so delegation buys only separation of context, authority,
      and lifecycle, at the price of new boundaries.
    Coordination overhead: Under Speedup(N) = 1/((1-p) + p/N + c(N)) any gain requires c(N) < p(1 - 1/N), the best
      count sits near sqrt(p/c) for linear overhead, and the serial fraction caps speedup at 1/(1-p).
    Three delegation structures: The dependency graph, the communication topology, and the supervision tree are
      separate structures, and conflating them hides quadratic communication cost and orphaned lifecycles.
    Spawning as admission: Dynamic spawning makes the execution graph nondeterministic, so the runtime enforces
      fan-out, concurrency, depth, and deadline bounds and reserves each child's maximum liability before it starts.
    Typed envelopes and receipts: A typed task envelope binds a child to immutable inputs, a scoped grant, a reservation,
      and required evidence that the runtime resolves, and the receipt carries runtime-populated evidence back,
      so a worker cannot widen either.
    Clean merge is not a valid change: Shared working directories produce lost updates and torn reads, and write
      sets collide with probability 1 - exp(-N(N-1)w^2/2F), so isolation is provided per worker and a merge is validated,
      not trusted.
    Correlated reviewers: Reviewers share each candidate's difficulty, so correlated errors set an irreducible floor
      on majority-vote false approval that adding reviewers cannot remove.
    Matched single-controller baseline: Delegation is justified only if it beats a capable single controller on
      the same tasks, criteria, evidence access, concurrency, and resource ceilings, scored on end-to-end acceptance
      with every initiated task counted.
    Subtree cancellation: Cancellation scope follows delegation lineage and closes admission at each gate, but cancelling
      a subtree does not settle the obligations its admitted work already created.
    Fan-out completion contracts: An all-results barrier meets a deadline with probability F(t)^N, and a k-of-N
      rule recovers most of it only when results are interchangeable.
    Credit-window flow control: A credit window enforces free plus outstanding equal to W, bounding in-flight payload
      and, by Little's law, mean staleness at W/mu, which per-agent token budgets cannot do.
    Attenuated delegation: The runtime assigns each child an identity and a grant contained in its delegator's,
      sharing permissions but partitioning consumable allowances by atomic reservation.
    Slot-pool critical-path bound: With a fixed slot pool, a dependency graph's completion time is bounded below
      by both its critical path and its total slot work divided by the slots.
    Amdahl's law: For a fixed amount of work with no coordination overhead, the serial fraction 1-p caps speedup
      at 1/(1-p) however many workers are added, and the universal scalability law reduces to it when coherency is zero.
