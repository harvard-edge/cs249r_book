  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.delegation
      label: Task delegation
      teaches: Delegation adds boundaries
      summary: A parent assigns bounded work through a typed task envelope and receives a receipt while
        retaining integration and authority obligations.
      section: sec-vol3-multiagent-contracts
    - id: vol3.coordination
      label: Coordination tax
      teaches: Coordination overhead
      summary: Handoffs add context delivery, scheduling, joining, and integration work whose cost can exceed
        the useful concurrency gained.
      section: sec-vol3-multiagent-coordination-tax
      aliases:
      - Delegation overhead
    - id: vol3.integration
      label: Integration validation
      teaches: Clean merge is not a valid change
      summary: Returned work must be checked against its dependencies and the current integration state;
        a clean merge does not certify a valid result.
      section: sec-vol3-multiagent-dependency-validation
    relationships:
    - id: vol3.field.delegation.coordination
      source: vol3.delegation
      predicate: incurs
      target: vol3.coordination
      explanation: Packaging tasks, conveying context, joining, and integration add work that a single controller
        avoids.
      conditions: Useful concurrency must exceed these costs under a matched single-controller baseline.
      status: draft
      evidence:
        section: sec-vol3-multiagent-coordination-tax
        quote: 'Splitting the authentication migration across separate interface and caller workers adds
          work that a single controller never performs: the coordinator spends turns packaging task assignments
          and reconciling returned diffs, both workers ingest shared repository context, and final integration
          waits at the join barrier for the slower child to finish. Every delegation boundary incurs this
          coordination tax (principle \ref{pri-vol3-coordination-tax})\index{Principle!coordination tax}.'
    - id: vol3.field.delegation.integration
      source: vol3.delegation
      predicate: requires
      target: vol3.integration
      explanation: The parent validates returned work and its dependencies against the current integration
        state rather than accepting a worker completion claim.
      conditions: Unknown dependencies require revalidation; a clean textual merge does not establish semantic
        compatibility.
      status: draft
      evidence:
        section: sec-vol3-multiagent-dependency-validation
        quote: 'When a worker signals completion, the centralized integration service evaluates the returned
          execution receipt. The service resolves `runtime.base_ref` and `runtime.candidate_ref`, verifies
          cryptographic commit lineage, and independently derives the modified file paths rather than trusting
          a worker-reported write set. Beyond commit hashes, the service inspects `runtime.dependencies_ref`,
          which records the exact source versions, environmental flags, and file reads underpinning the
          candidate. Reliable dependency tracking requires runtime instrumentation of mediated filesystem
          calls, lockfiles, and configuration manifests; subjective, model-generated self-reports cannot
          be trusted for correctness. Furthermore, negative dependencies require careful tracking: an agent''s
          code generation may depend on the *absence* of a conflicting file, meaning that recording only
          positive file reads yields incomplete dependency graphs. Whenever dependency tracking is partial
          or ambiguous, the integration service treats an empty dependency manifest as unknown rather than
          disjoint, triggering a fresh revalidation of the candidate against the current branch head.'
    - id: vol3.field.delegation.capability
      source: vol3.delegation
      predicate: requires attenuation of
      target: vol3.capability
      explanation: Child grants must be no broader than their parent and are enforced on concrete resource
        access.
      conditions: Children must not inherit broader host credentials or handles.
      status: draft
      evidence:
        section: sec-vol3-multiagent-attenuated-grants
        quote: Passing a parent's full credential or unreserved budget balance to a child lets a single
          compromised subtask modify unrelated files or spend the entire task allowance. To keep each hop
          narrower than the one above it, a delegation tree applies the containment relation $\GrantAllowedAccesses(\ChildCapabilityGrant)\subseteq\GrantAllowedAccesses(\ParentCapabilityGrant)$
          established in @sec-vol3-sandboxes-attenuation at every hop. In a multi-agent tree the relation
          governs concrete operations executed on underlying system resources, rather than superficial labels
          such as tool names or directory prefixes that an agent might attempt to manipulate. For example,
          an inspection child task may hold permission to inspect a specific interface file, but it must
          possess no rights to modify caller source files, exfiltrate repository data, or access the parent
          broker's credentials for external repositories. The execution boundary enforces these perimeter
          restrictions directly; the child environment starts without inheriting broader host credentials
          or open file handles.
    maps: []
