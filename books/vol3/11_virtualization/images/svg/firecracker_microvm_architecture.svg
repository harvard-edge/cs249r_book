<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">AWS FIRECRACKER MICROVM ARCHITECTURE &amp; EPHEMERAL SANDBOX LIFECYCLE</text>
  </g>

  <!-- LEFT: Agent Orchestrator & API Control Plane -->
  <g transform="translate(24, 66)">
    <rect width="210" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="210" height="32" rx="2" fill="#F0F9FF" />
    <text x="12" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Agent Orchestrator (Host)</text>

    <!-- Sub-boxes for Orchestrator Flow -->
    <g transform="translate(10, 42)">
      <rect width="190" height="64" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B">1. Spawn with Jailer</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">Executes jailer binary with strict UID,</text>
      <text x="10" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">GID, cgroup limits, and chroot dir.</text>
      <text x="10" y="54" font-family="monospace" font-size="7.5" fill="#0284C7">jailer --id vm-042 --exec-file ...</text>
    </g>

    <g transform="translate(10, 114)">
      <rect width="190" height="120" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B">2. Configure via Unix Socket</text>
      <text x="10" y="28" font-family="monospace" font-size="7.5" fill="#64748B">PUT /boot-source (vmlinux)</text>
      <text x="10" y="40" font-family="monospace" font-size="7.5" fill="#64748B">PUT /drives/rootfs (OverlayFS)</text>
      <text x="10" y="52" font-family="monospace" font-size="7.5" fill="#64748B">PUT /network-interfaces/eth0</text>
      <text x="10" y="64" font-family="monospace" font-size="7.5" fill="#64748B">PUT /vsock (host-guest IPC)</text>
      <text x="10" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#0284C7">Cold Boot in &lt; 50 ms:</text>
      <rect x="10" y="86" width="170" height="24" rx="4" fill="#E0F2FE" />
      <text x="95" y="101" font-family="monospace" font-size="8.5" font-weight="700" fill="#0369A1" text-anchor="middle">InstanceStart (T_boot: 22ms)</text>
    </g>

    <g transform="translate(10, 242)">
      <rect width="190" height="60" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B">3. Tool Dispatch via Vsock</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">Executes bash commands, tests,</text>
      <text x="10" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">and git patches inside sandbox.</text>
      <text x="10" y="53" font-family="monospace" font-size="7.5" fill="#16A34A">vsock://port=52/exec_command</text>
    </g>

    <g transform="translate(10, 310)">
      <rect width="190" height="68" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991B1B">4. Ephemeral Teardown</text>
      <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#7F1D1D">SendCtrlAltDel / process kill.</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#7F1D1D">UpperDir diff layer deleted.</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#DC2626">Zero Residual Footprint (&lt;2ms)</text>
    </g>
  </g>

  <!-- MIDDLE: Jailer Security Envelope & Firecracker VMM -->
  <g transform="translate(244, 66)">
    <rect width="436" height="390" rx="2" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="4 2"  />
    <rect width="436" height="28" rx="2" fill="#FAF5FF" />
    <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#7E22CE">Jailer Security Envelope (Rootless Isolation)</text>
    <text x="422" y="18" font-family="monospace" font-size="8" fill="#9333EA" text-anchor="end">chroot + cgroups v2 + seccomp-bpf</text>

    <!-- Firecracker VMM Process (Rust) -->
    <g transform="translate(12, 36)">
      <rect width="412" height="150" rx="2" fill="#F8FAFC" stroke="#0284C7" stroke-width="1" />
      <rect width="412" height="24" rx="2" fill="#E0F2FE" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369A1">Firecracker VMM Process (Rust Userspace)</text>
      <text x="400" y="16" font-family="monospace" font-size="7.5" fill="#0284C7" text-anchor="end">PID: 10482 (Unprivileged)</text>

      <g transform="translate(10, 32)">
        <rect width="188" height="106" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
        <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">Minimal VirtIO Devices</text>
        <text x="8" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• <tspan font-weight="600">virtio-net</tspan>: TAP device to host</text>
        <text x="8" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• <tspan font-weight="600">virtio-block</tspan>: Disk I/O backend</text>
        <text x="8" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• <tspan font-weight="600">virtio-vsock</tspan>: Fast zero-TCP IPC</text>
        <text x="8" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• <tspan font-weight="600">serial console</tspan>: TTY / logging</text>
        <rect x="8" y="80" width="172" height="18" rx="3" fill="#FEE2E2" />
        <text x="94" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">No PCI / No ACPI / No IDE</text>
      </g>

      <g transform="translate(208, 32)">
        <rect width="194" height="106" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
        <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">vCPU Execution Threads</text>
        <text x="8" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• 1 Host POSIX thread per guest vCPU</text>
        <text x="8" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Tight loop on <tspan font-family="monospace" font-size="7.5">ioctl(KVM_RUN)</tspan></text>
        <text x="8" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Memory: single <tspan font-family="monospace" font-size="7.5">mmap</tspan> backing slot</text>
        <rect x="8" y="68" width="178" height="30" rx="3" fill="#F1F5F9" />
        <text x="14" y="80" font-family="monospace" font-size="7" fill="#475569">while (ioctl(vcpu_fd, KVM_RUN)) {</text>
        <text x="14" y="90" font-family="monospace" font-size="7" fill="#475569">  handle_exit(vcpu.exit_reason); }</text>
      </g>
    </g>

    <!-- Hardware KVM Hypervisor Boundary -->
    <g transform="translate(12, 194)">
      <rect width="412" height="34" rx="4" fill="#0F172A" />
      <text x="206" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hardware Virtualization Barrier: Linux /dev/kvm (Intel VT-x / AMD-V)</text>
      <text x="206" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">Non-Root CPU Ring 0/3 Execution • Extended Page Tables (EPT) Memory Isolation</text>
    </g>

    <!-- Guest MicroVM Context -->
    <g transform="translate(12, 236)">
      <rect width="412" height="142" rx="2" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2" />
      <rect width="412" height="24" rx="2" fill="#FEE2E2" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#991B1B">Guest MicroVM (Untrusted Agent Execution Zone)</text>
      <text x="400" y="16" font-family="monospace" font-size="7.5" fill="#B91C1C" text-anchor="end">Isolated Kernel Ring 0</text>

      <g transform="translate(10, 32)">
        <rect width="124" height="98" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="0.8" />
        <text x="6" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B">Guest Linux Kernel</text>
        <text x="6" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Stripped uncompressed</text>
        <text x="6" y="37" font-family="monospace" font-size="7" fill="#1E293B">  vmlinux (&lt;10MB)</text>
        <text x="6" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Independent page</text>
        <text x="6" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">  tables &amp; namespaces</text>
        <text x="6" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Full POSIX syscalls</text>
        <text x="6" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">  handled internally</text>
      </g>

      <g transform="translate(142, 32)">
        <rect width="134" height="98" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="0.8" />
        <text x="6" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B">Guest Agent Runner</text>
        <text x="6" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Minimal init system</text>
        <text x="6" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Python / Node runtimes</text>
        <text x="6" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Executes LLM commands:</text>
        <rect x="6" y="58" width="122" height="34" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" />
        <text x="10" y="69" font-family="monospace" font-size="6.8" fill="#0F172A">pytest -v tests/</text>
        <text x="10" y="80" font-family="monospace" font-size="6.8" fill="#0F172A">git checkout -b fix</text>
      </g>

      <g transform="translate(284, 32)">
        <rect width="118" height="98" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="0.8" />
        <rect x="6" y="6" width="70" height="14" rx="3" fill="#FEE2E2" />
        <text x="41" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">CONTAINED</text>
        <text x="6" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B91C1C">Even if an agent</text>
        <text x="6" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B91C1C">executes malicious</text>
        <text x="6" y="54" font-family="monospace" font-size="7" fill="#B91C1C">rm -rf / or exploit,</text>
        <text x="6" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">it damages only its</text>
        <text x="6" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">own guest kernel &amp;</text>
        <text x="6" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">ephemeral rootfs!</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: Copy-on-Write Filesystem Architecture -->
  <g transform="translate(688, 66)">
    <rect width="248" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="248" height="32" rx="2" fill="#F0FDF4" />
    <text x="12" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#166534">Ephemeral CoW Storage</text>

    <!-- OverlayFS Diagram -->
    <g transform="translate(12, 44)">
      <rect width="224" height="42" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#065F46">Merged Mount (Sandbox /)</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857">Unified view seen by agent tool runner</text>

      <line x1="112" y1="46" x2="112" y2="58" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

      <g transform="translate(0, 64)">
        <rect width="224" height="70" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" />
        <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#92400E">UpperDir (Read-Write Diff)</text>
        <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#78350F">• In-memory tmpfs / thin-pool sparse file</text>
        <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#78350F">• Stores agent edits, new files, &amp; logs</text>
        <rect x="8" y="46" width="208" height="18" rx="3" fill="#FEF3C7" />
        <text x="112" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#B45309" text-anchor="middle">Disposed on Task Exit (&lt;1ms)</text>
      </g>

      <line x1="112" y1="138" x2="112" y2="150" stroke="#94A3B8" stroke-width="1.5" />

      <g transform="translate(0, 154)">
        <rect width="224" height="74" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
        <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">LowerDir (Immutable Base OS)</text>
        <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Read-only base rootfs (Ubuntu 24.04)</text>
        <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Pre-warmed toolchains (Python, Rust, Git)</text>
        <text x="10" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Read-only Git repo snapshot</text>
        <text x="10" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#166534">Shared across 10,000+ microVMs</text>
      </g>
    </g>

    <g transform="translate(12, 290)">
      <rect width="224" height="88" rx="2" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Zero-Copy Workspace Cloning</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Instantly clones 10GB repo in &lt;1ms</text>
      <text x="10" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Shared lower layers stay in Linux page cache</text>
      <text x="10" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Zero disk write amplification for base files</text>
      <text x="10" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#0284C7">• Diff extraction: inspects UpperDir only</text>
      <text x="10" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#64748B">  before discarding VM container.</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="234" y1="180" x2="256" y2="180" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="234" y1="310" x2="256" y2="310" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <line x1="656" y1="310" x2="688" y2="310" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Footer Insight Bar -->
  <g transform="translate(24, 468)">
    <rect width="912" height="54" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Jailer + KVM + OverlayFS Multi-Tier Isolation Guarantee:</text>
    <text x="14" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">1. Even if the agent executes hostile code, guest kernel exploits cannot touch host memory due to hardware KVM virtualization.</text>
    <text x="14" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">2. Even if an attacker finds a zero-day VM escape in the VMM, the Jailer cgroups, chroot, and seccomp sandbox prevent host compromise.</text>
  </g>
</svg>
