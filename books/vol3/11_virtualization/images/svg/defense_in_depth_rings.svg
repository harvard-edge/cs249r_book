<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E11D48" />
    </marker>
    <marker id="arrow-blocked" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <circle cx="5" cy="5" r="4" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE THREE DEFENSE-IN-DEPTH RINGS FOR AUTONOMOUS AGENT EXECUTION</text>
  </g>

  <!-- LEFT: Concentric Containment Diagram -->
  <g transform="translate(24, 66)">
    <!-- Ring 3: Network Perimeter (Outer Shell) -->
    <rect x="0" y="0" width="370" height="396" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" stroke-dasharray="6 3"  />
    <rect x="0" y="0" width="370" height="32" rx="16" fill="#CCFBF1" />
    <rect x="0" y="16" width="370" height="16" fill="#CCFBF1" />
    <text x="14" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F766E">RING 3: Zero-Trust Network Perimeter</text>
    <text x="356" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0F766E" text-anchor="end">eBPF + Proxy + DNS</text>

    <!-- Ring 2: OS & Virtualization (Middle Shell) -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="330" height="332" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow-sm)" />
      <rect x="0" y="0" width="330" height="30" rx="2" fill="#E0E7FF" />
      <rect x="0" y="15" width="330" height="15" fill="#E0E7FF" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#3730A3">RING 2: OS &amp; Virtualization Layer</text>
      <text x="318" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#3730A3" text-anchor="end">KVM + Overlays</text>

      <!-- Ring 1: Protocol & Capability (Inner Shell) -->
      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="290" height="270" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow-sm)" />
        <rect x="0" y="0" width="290" height="28" rx="2" fill="#FEF3C7" />
        <rect x="0" y="14" width="290" height="14" fill="#FEF3C7" />
        <text x="10" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#92400E">RING 1: API &amp; Capability Layer</text>
        <text x="280" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#92400E" text-anchor="end">JSON Schema</text>

        <!-- Central Core: Untrusted Agent -->
        <g transform="translate(18, 40)">
          <rect x="0" y="0" width="254" height="210" rx="2" fill="#FFF1F2" stroke="#E11D48" stroke-width="2" filter="url(#shadow-sm)" />
          <rect x="0" y="0" width="254" height="28" rx="2" fill="#FFE4E6" />
          <rect x="0" y="14" width="254" height="14" fill="#FFE4E6" />
          <text x="127" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#BE123C" text-anchor="middle">UNTRUSTED AGENT CORE</text>

          <g transform="translate(12, 38)">
            <!-- Threat Indicators -->
            <rect x="0" y="0" width="230" height="42" rx="2" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1" />
            <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#9F1239">Stochastic Neural Policy</text>
            <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#E11D48">• Shared embedding space (No W⊕X)</text>
            <text x="10" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#64748B">  P(inject) ≈ 1.0 under adversarial inputs</text>
          </g>

          <g transform="translate(12, 88)">
            <rect x="0" y="0" width="230" height="42" rx="2" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1" />
            <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#9F1239">Ambient Authority Risk</text>
            <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#E11D48">• Confused Deputy vulnerability</text>
            <text x="10" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#64748B">  Shell / socket / filesystem privileges</text>
          </g>

          <g transform="translate(12, 138)">
            <rect x="0" y="0" width="230" height="60" rx="2" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1" />
            <text x="10" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#9F1239">Active Execution Sandbox</text>
            <text x="10" y="27" font-family="monospace" font-size="7.5" fill="#0F172A">python3 -c &quot;exec(payload)&quot;</text>
            <text x="10" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B91C1C">Attacker payload trapped inside rings</text>
            <rect x="10" y="44" width="210" height="12" rx="3" fill="#FEE2E2" />
            <text x="115" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#991B1B" text-anchor="middle">CONTAINMENT GUARANTEED EXTERNAL TO MODEL</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT: Detailed Architecture Cards -->
  <g transform="translate(410, 66)">
    <!-- CARD 1: Ring 1 Details -->
    <g transform="translate(0, 0)">
      <rect width="526" height="114" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"  />
      <rect width="526" height="28" rx="2" fill="#FEF3C7" />
      <rect y="14" width="526" height="14" fill="#FEF3C7" />
      <text x="14" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400E">RING 1: Protocol &amp; Capability Layer (Chapters 09 &amp; 10)</text>
      <text x="512" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#B45309" text-anchor="end">Gate: Invariant Leases</text>

      <g transform="translate(14, 36)">
        <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Key Mechanisms:</text>
        <text x="110" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">JSON-RPC / MCP schema validation • Ephemeral single-use capability leases</text>
        <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Enforcement:</text>
        <text x="110" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Human-in-the-loop cryptographic approval escrow for irreversible mutations</text>
        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Information Flow:</text>
        <text x="110" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Dynamic context taint tracking: τ_state ← τ_state ⊔ τ(tool_output)</text>
        <rect x="0" y="54" width="498" height="18" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
        <text x="8" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#B45309">Neutralizes: Unauthorized effector calls, tool parameter poisoning, prompt injection co-optation</text>
      </g>
    </g>

    <!-- CARD 2: Ring 2 Details -->
    <g transform="translate(0, 126)">
      <rect width="526" height="136" rx="2" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.2"  />
      <rect width="526" height="28" rx="2" fill="#EEF2FF" />
      <rect y="14" width="526" height="14" fill="#EEF2FF" />
      <text x="14" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3730A3">RING 2: OS &amp; Virtualization Layer (§§11.2 &amp; 11.3)</text>
      <text x="512" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#4F46E5" text-anchor="end">Gate: Hypervisor Boundary</text>

      <g transform="translate(14, 36)">
        <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Hardware microVM:</text>
        <text x="115" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">AWS Firecracker / KVM; independent guest kernel; Extended Page Tables (EPT)</text>
        <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Jailer Envelope:</text>
        <text x="115" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">pivot_root chroot jail • Unprivileged UID/GID • seccomp-bpf (&lt; 20 host syscalls)</text>
        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Ephemeral Storage:</text>
        <text x="115" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">OverlayFS on tmpfs (LowerDir NVMe + UpperDir RAM) • &lt; 2ms zero-residual wipe</text>
        <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Resource Envelopes:</text>
        <text x="115" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Linux cgroups v2: pids.max = 256 • cpu.max CFS quotas • memory.oom.group = 1</text>
        <rect x="0" y="70" width="498" height="26" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="0.8" />
        <text x="8" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#4338CA">Neutralizes: Host kernel escapes (Dirty COW, io_uring LPE), fork bombs, host OOM crashes</text>
        <text x="8" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#6D28D9">P(escape | inject) ≤ 10⁻⁶ (requires unpatched hardware virtualization hypervisor zero-day)</text>
      </g>
    </g>

    <!-- CARD 3: Ring 3 Details -->
    <g transform="translate(0, 274)">
      <rect width="526" height="136" rx="2" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"  />
      <rect width="526" height="28" rx="2" fill="#F0FDFA" />
      <rect y="14" width="526" height="14" fill="#F0FDFA" />
      <text x="14" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E">RING 3: Zero-Trust Network Perimeter (§11.4)</text>
      <text x="512" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0F766E" text-anchor="end">Gate: Complete Mediation</text>

      <g transform="translate(14, 36)">
        <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Layer 1 (Kernel eBPF):</text>
        <text x="120" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">tc hook drops raw destination IPs &amp; link-local IMDS (169.254.169.254)</text>
        <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Layer 2 (TLS Proxy):</text>
        <text x="120" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Transparent SNI allowlists (*.pypi.org) • Outbound credential regex redaction</text>
        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Layer 3 (DNS Resolver):</text>
        <text x="120" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Shannon entropy filter (H(X) &gt; 4.2 drop) • Label length caps • NRD sinkhole</text>
        <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Air-Gapped Mode:</text>
        <text x="120" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Administrative tap0 down • Local mirror caches • Synthetic mock HAR replay</text>
        <rect x="0" y="70" width="498" height="26" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="0.8" />
        <text x="8" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#0F766E">Neutralizes: Cloud IAM theft, direct TCP reverse shells, covert DNS data exfiltration</text>
        <text x="8" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#0D9488">P(exfil | escape) ≤ 10⁻⁴ (requires bypassing eBPF drops, SNI proxy, and Shannon DNS filter)</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM: Systems Invariant Banner -->
  <g transform="translate(24, 480)">
    <rect width="912" height="38" rx="2" fill="#0F172A"  />
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8">Systems Invariant:</text>
    <text x="126" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#F8FAFC">P_breach = P(inject) × P(escape | inject) × P(exfil | escape) ≤ 1.0 × 10⁻⁶ × 10⁻⁴ = 10⁻¹⁰</text>
    <text x="894" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="end">Deterministic Systems Isolation Outside Probabilistic Neural Weights</text>
  </g>
</svg>