<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="computeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="1184" height="644" rx="14" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <rect x="36" y="26" width="102" height="26" rx="13" fill="#EDE9FE"/>
  <text x="87" y="43" text-anchor="middle" fill="#6B21A8" font-size="11" font-weight="700" letter-spacing="0.8">FIGURE 9.3</text>
  <text x="150" y="45" fill="#0F172A" font-size="19" font-weight="800">Dominant Resource Fairness Across Coupled Agent Resources</text>
  <text x="36" y="73" fill="#64748B" font-size="12.5">Max-min fair allocation across GPU Compute (TFLOPs), Accelerator Memory (KV Blocks), and External Tool API Leases</text>

  <!-- Left: The Three Coupled Cluster Resources (x: 36, y: 92, w: 340, h: 440) -->
  <rect x="36" y="92" width="340" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="36" y="92" width="340" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="116" fill="#1E293B" font-size="12.5" font-weight="700">Cluster Resource Pools</text>
  <text x="360" y="116" text-anchor="end" fill="#64748B" font-size="10.5">Coupled Dimensions</text>

  <!-- Resource 1: GPU Compute -->
  <rect x="52" y="142" width="308" height="114" rx="8" fill="url(#computeGrad)" stroke="#D8B4FE" stroke-width="1"/>
  <rect x="64" y="154" width="22" height="18" rx="4" fill="#7C3AED"/>
  <text x="75" y="167" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">R1</text>
  <text x="94" y="167" fill="#1E293B" font-size="12" font-weight="700">GPU Compute (Tensor Cores)</text>
  <text x="64" y="190" fill="#475569" font-size="10.8">• Total Capacity: <tspan font-weight="700" fill="#0F172A">C_compute = 4.0 PFLOPs</tspan></text>
  <text x="64" y="208" fill="#475569" font-size="10.8">• Consumed by: GEMM prompt prefills &amp; decode</text>
  <text x="64" y="226" fill="#475569" font-size="10.8">• Characteristic: Space-time multiplexed via batching</text>
  <text x="64" y="244" fill="#7C3AED" font-size="10" font-weight="600">Dominant for: Speculative search &amp; MCTS agents</text>

  <!-- Resource 2: Device Memory -->
  <rect x="52" y="266" width="308" height="114" rx="8" fill="url(#memGrad)" stroke="#93C5FD" stroke-width="1"/>
  <rect x="64" y="278" width="22" height="18" rx="4" fill="#2563EB"/>
  <text x="75" y="291" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">R2</text>
  <text x="94" y="291" fill="#1E293B" font-size="12" font-weight="700">Device Memory (HBM KV Blocks)</text>
  <text x="64" y="314" fill="#475569" font-size="10.8">• Total Capacity: <tspan font-weight="700" fill="#0F172A">C_mem = 640 GB (8x H100)</tspan></text>
  <text x="64" y="332" fill="#475569" font-size="10.8">• Consumed by: PagedAttention physical blocks</text>
  <text x="64" y="350" fill="#475569" font-size="10.8">• Characteristic: Non-compressible, hard limits</text>
  <text x="64" y="368" fill="#1D4ED8" font-size="10" font-weight="600">Dominant for: Long-context coding &amp; repo agents</text>

  <!-- Resource 3: External Tool Concurrency -->
  <rect x="52" y="390" width="308" height="126" rx="8" fill="url(#toolGrad)" stroke="#86EFAC" stroke-width="1"/>
  <rect x="64" y="402" width="22" height="18" rx="4" fill="#059669"/>
  <text x="75" y="415" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">R3</text>
  <text x="94" y="415" fill="#1E293B" font-size="12" font-weight="700">External Tool API Leases</text>
  <text x="64" y="438" fill="#475569" font-size="10.8">• Total Capacity: <tspan font-weight="700" fill="#0F172A">C_tool = 100 concurrent leases</tspan></text>
  <text x="64" y="456" fill="#475569" font-size="10.8">• Consumed by: Sandbox containers, API rate limits</text>
  <text x="64" y="474" fill="#475569" font-size="10.8">• Characteristic: Governed by third-party quotas</text>
  <text x="64" y="494" fill="#059669" font-size="10" font-weight="600">Dominant for: Web research &amp; scraping agents</text>

  <!-- Center: Multi-Tenant Allocation Profiles (x: 396, y: 92, w: 420, h: 440) -->
  <rect x="396" y="92" width="420" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="396" y="92" width="420" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="412" y="116" fill="#1E293B" font-size="13" font-weight="700">Heterogeneous Agent Tenant Profiles</text>
  <text x="800" y="116" text-anchor="end" fill="#64748B" font-size="11">Resource Share Vectors</text>

  <!-- Tenant A Card -->
  <rect x="412" y="142" width="388" height="114" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="424" y="162" fill="#581C87" font-size="12" font-weight="700">Tenant A: Speculative Search Agent (MCTS)</text>
  <text x="424" y="180" fill="#475569" font-size="10.5">Demands heavy parallel token generation; small contexts.</text>
  <!-- Bar graphic Tenant A -->
  <text x="424" y="198" fill="#334155" font-size="10">Compute: 60%</text>
  <rect x="500" y="188" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="188" width="108" height="11" rx="4" fill="#7C3AED"/>
  <text x="424" y="215" fill="#334155" font-size="10">Memory: 15%</text>
  <rect x="500" y="205" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="205" width="27" height="11" rx="4" fill="#93C5FD"/>
  <text x="424" y="232" fill="#334155" font-size="10">Tools: 5%</text>
  <rect x="500" y="222" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="222" width="9" height="11" rx="4" fill="#86EFAC"/>
  <text x="690" y="202" fill="#7C3AED" font-size="10.5" font-weight="700">Dominant Share: 60%</text>
  <text x="690" y="218" fill="#64748B" font-size="9.5">(GPU Compute)</text>

  <!-- Tenant B Card -->
  <rect x="412" y="266" width="388" height="114" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="424" y="286" fill="#1D4ED8" font-size="12" font-weight="700">Tenant B: Software Engineering Agent (SWE)</text>
  <text x="424" y="304" fill="#475569" font-size="10.5">Demands massive 128k context buffers; modest compute.</text>
  <!-- Bar graphic Tenant B -->
  <text x="424" y="322" fill="#334155" font-size="10">Compute: 20%</text>
  <rect x="500" y="312" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="312" width="36" height="11" rx="4" fill="#C084FC"/>
  <text x="424" y="339" fill="#334155" font-size="10">Memory: 60%</text>
  <rect x="500" y="329" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="329" width="108" height="11" rx="4" fill="#2563EB"/>
  <text x="424" y="356" fill="#334155" font-size="10">Tools: 25%</text>
  <rect x="500" y="346" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="346" width="45" height="11" rx="4" fill="#86EFAC"/>
  <text x="690" y="326" fill="#1D4ED8" font-size="10.5" font-weight="700">Dominant Share: 60%</text>
  <text x="690" y="342" fill="#64748B" font-size="9.5">(HBM KV Blocks)</text>

  <!-- Tenant C Card -->
  <rect x="412" y="390" width="388" height="126" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="424" y="410" fill="#059669" font-size="12" font-weight="700">Tenant C: Web Research Orchestrator</text>
  <text x="424" y="428" fill="#475569" font-size="10.5">Demands high concurrent browser sandboxes &amp; API leases.</text>
  <!-- Bar graphic Tenant C -->
  <text x="424" y="446" fill="#334155" font-size="10">Compute: 15%</text>
  <rect x="500" y="436" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="436" width="27" height="11" rx="4" fill="#C084FC"/>
  <text x="424" y="463" fill="#334155" font-size="10">Memory: 20%</text>
  <rect x="500" y="453" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="453" width="36" height="11" rx="4" fill="#93C5FD"/>
  <text x="424" y="480" fill="#334155" font-size="10">Tools: 60%</text>
  <rect x="500" y="470" width="180" height="11" rx="4" fill="#E2E8F0"/>
  <rect x="500" y="470" width="108" height="11" rx="4" fill="#059669"/>
  <text x="690" y="450" fill="#059669" font-size="10.5" font-weight="700">Dominant Share: 60%</text>
  <text x="690" y="466" fill="#64748B" font-size="9.5">(Tool API Leases)</text>

  <!-- Right: DRF Formulation & Systems Guarantees (x: 836, y: 92, w: 328, h: 440) -->
  <rect x="836" y="92" width="328" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="836" y="92" width="328" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="852" y="116" fill="#1E293B" font-size="13" font-weight="700">DRF Max-Min Optimization</text>

  <!-- Mathematical Formulation Card -->
  <rect x="852" y="142" width="296" height="154" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="864" y="162" fill="#581C87" font-size="11.5" font-weight="700">Dominant Share Definition</text>
  <text x="864" y="180" fill="#334155" font-size="10.2">For tenant i consuming vector U_i across resources R:</text>
  <rect x="864" y="188" width="272" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1000" y="206" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700" font-family="monospace">s_i = max_{r ∈ R} { U_{i,r} / C_r }</text>
  <text x="864" y="232" fill="#334155" font-size="10.2">DRF scheduler equalizes dominant shares:</text>
  <rect x="864" y="240" width="272" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1000" y="258" text-anchor="middle" fill="#581C87" font-size="11" font-weight="700" font-family="monospace">max min_{i} { s_i }</text>
  <text x="864" y="284" fill="#059669" font-size="9.8" font-weight="600">Allocates next chunk to tenant with smallest s_i</text>

  <!-- Systems Invariants Card -->
  <rect x="852" y="306" width="296" height="210" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="864" y="326" fill="#581C87" font-size="11.5" font-weight="700">Classical Systems Properties (Ghodsi et al.)</text>
  <text x="864" y="348" fill="#334155" font-size="10.2">• <tspan font-weight="700">Sharing Incentive:</tspan> Each of n tenants is guaranteed</text>
  <text x="874" y="362" fill="#475569" font-size="10">at least 1/n share of their dominant resource.</text>
  <text x="864" y="382" fill="#334155" font-size="10.2">• <tspan font-weight="700">Strategy-Proofness:</tspan> Tenants cannot game the</text>
  <text x="874" y="396" fill="#475569" font-size="10">scheduler by inflating unused resource demands.</text>
  <text x="864" y="416" fill="#334155" font-size="10.2">• <tspan font-weight="700">Envy-Freeness:</tspan> No tenant prefers another's bundle.</text>
  <text x="864" y="436" fill="#334155" font-size="10.2">• <tspan font-weight="700">Pareto Efficiency:</tspan> Unused FLOPs are consumed by</text>
  <text x="874" y="450" fill="#475569" font-size="10">compute agents without reducing memory shares.</text>
  <text x="864" y="476" fill="#059669" font-size="10" font-weight="700">✓ Multi-Resource Packing Gains:</text>
  <text x="864" y="494" fill="#475569" font-size="9.8">Increases aggregate cluster utilization by 40%–65%.</text>

  <!-- Systems Principle Callout Banner -->
  <rect x="36" y="548" width="1128" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="52" y="562" width="102" height="58" rx="8" fill="#581C87"/>
  <text x="103" y="587" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SYSTEMS</text>
  <text x="103" y="603" text-anchor="middle" fill="#E9D5FF" font-size="10" font-weight="700">PRINCIPLE</text>
  <text x="172" y="582" fill="#0F172A" font-size="13.5" font-weight="800">Multi-Resource Heterogeneity Precludes Single-Metric Agent Scheduling</text>
  <text x="172" y="604" fill="#475569" font-size="11.5">Agent workloads consume coupled, orthogonal resources: Tensor Core FLOPs, HBM KV blocks, and external API leases.</text>
  <text x="172" y="621" fill="#475569" font-size="11.5">Dominant Resource Fairness guarantees sharing incentives and envy-freeness, packing complementary agent types efficiently.</text>
</svg>
