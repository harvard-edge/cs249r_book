<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1100" height="520" fill="#ffffff" />

  <!-- LEFT PANEL: Whole-Trajectory Cost Decomposition Treemap -->
  <g transform="translate(24, 20)">
    <!-- Container Card -->
    <rect width="510" height="480" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Header Bar -->
    <rect width="510" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="22" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="0.2">SUBSYSTEM COST STACK: C_task = $0.420 BASELINE</text>
    <text x="494" y="22" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#475569" text-anchor="end">K = 10 Turns</text>

    <!-- Formula Ribbon -->
    <g transform="translate(16, 46)">
      <rect width="478" height="28" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="239" y="18" font-size="9.5" font-family="'SF Mono', Consolas, monospace" fill="#1e40af" font-weight="600" text-anchor="middle">C_task = &#8721; (C_prefill + C_decode + C_sandbox + C_tools) + C_verify + C_human</text>
    </g>

    <!-- Proportional Subsystem Stack / Treemap -->
    <g transform="translate(16, 86)">
      <!-- Tier 1: Model Serving (Prefill + Decode) = $0.174 (41.4%) -->
      <g transform="translate(0, 0)">
        <rect width="478" height="114" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
        <rect width="478" height="22" rx="3" fill="#dbeafe" />
        <text x="12" y="15" font-size="10" font-weight="700" fill="#1e40af">FOUNDATION MODEL INFERENCE TIER &#8212; $0.174 (41.4%)</text>
        <text x="466" y="15" font-size="9" font-family="'SF Mono', monospace" fill="#1e40af" text-anchor="end">Model Provider</text>

        <!-- Sub-boxes: Prefill vs Decode -->
        <g transform="translate(10, 30)">
          <!-- Prefill -->
          <rect width="300" height="74" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
          <text x="10" y="18" font-size="9.5" font-weight="700" fill="#1e3a8a">Prompt Prefill (C_prefill)</text>
          <text x="10" y="34" font-size="13" font-weight="700" font-family="'SF Mono', monospace" fill="#1d4ed8">$0.112</text>
          <text x="68" y="34" font-size="9.5" fill="#475569">(26.7% of total)</text>
          <text x="10" y="52" font-size="8.5" fill="#475569">Re-sent context; grows</text>
          <text x="10" y="64" font-size="8.5" fill="#475569">every turn over 10 turns</text>
          <text x="290" y="64" font-size="8" font-family="'SF Mono', monospace" fill="#2563eb" text-anchor="end">Input tokens</text>

          <!-- Decode -->
          <g transform="translate(308, 0)">
            <rect width="150" height="74" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
            <text x="10" y="18" font-size="9.5" font-weight="700" fill="#1e3a8a">Decode (C_decode)</text>
            <text x="10" y="34" font-size="13" font-weight="700" font-family="'SF Mono', monospace" fill="#1d4ed8">$0.062</text>
            <text x="68" y="34" font-size="9" fill="#475569">(14.7%)</text>
            <text x="10" y="52" font-size="8.5" fill="#475569">Reasoning and tool calls</text>
            <text x="10" y="64" font-size="8.5" fill="#475569">Output tokens</text>
          </g>
        </g>
      </g>

      <!-- Tier 2: Isolated Sandbox Runtime = $0.110 (26.2%) -->
      <g transform="translate(0, 122)">
        <rect width="478" height="72" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2" />
        <rect width="478" height="22" rx="3" fill="#dcfce7" />
        <text x="12" y="15" font-size="10" font-weight="700" fill="#166534">ISOLATED SANDBOX RUNTIME (C_sandbox) &#8212; $0.110 (26.2%)</text>
        <text x="466" y="15" font-size="9" font-family="'SF Mono', monospace" fill="#166534" text-anchor="end">MicroVM / Container</text>

        <text x="14" y="38" font-size="9" font-family="'SF Mono', monospace" fill="#15803d" font-weight="700">120 s lifetime &#215; 2 vCPU / 4 GB RAM + Ephemeral Rootfs Overlay</text>
        <text x="14" y="52" font-size="8.5" fill="#334155">Compilation · tests · tool waits</text>
        <text x="14" y="64" font-size="8.5" fill="#64748b">Billed while inference is suspended</text>
      </g>

      <!-- Tier 3: External Tools & Mechanical Verifiers = $0.108 (25.7%) -->
      <g transform="translate(0, 202)">
        <rect width="478" height="96" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" />
        <rect width="478" height="22" rx="3" fill="#fef3c7" />
        <text x="12" y="15" font-size="10" font-weight="700" fill="#92400e">TOOLS &amp; VERIFICATION HARNESSES &#8212; $0.108 (25.7%)</text>
        <text x="466" y="15" font-size="9" font-family="'SF Mono', monospace" fill="#92400e" text-anchor="end">Egress &amp; Host CPU</text>

        <!-- Sub split -->
        <g transform="translate(10, 30)">
          <!-- Tool APIs -->
          <rect width="224" height="56" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
          <text x="10" y="16" font-size="9" font-weight="700" fill="#78350f">Tool API Egress (C_tools)</text>
          <text x="10" y="32" font-size="12" font-weight="700" font-family="'SF Mono', monospace" fill="#b45309">$0.058</text>
          <text x="64" y="32" font-size="8.5" fill="#475569">(13.8% of total)</text>
          <text x="10" y="47" font-size="8.5" fill="#64748b">Vector search indices &amp; web RPCs</text>

          <!-- Verifiers -->
          <g transform="translate(234, 0)">
            <rect width="224" height="56" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
            <text x="10" y="16" font-size="9" font-weight="700" fill="#78350f">Verification Harness (C_verify)</text>
            <text x="10" y="32" font-size="12" font-weight="700" font-family="'SF Mono', monospace" fill="#b45309">$0.050</text>
            <text x="64" y="32" font-size="8.5" fill="#475569">(11.9% of total)</text>
            <text x="10" y="47" font-size="8.5" fill="#64748b">Pytest suites, linters, AST checks</text>
          </g>
        </g>
      </g>

      <!-- Tier 4: Amortized Human Escalation = $0.028 (6.7%) -->
      <g transform="translate(0, 306)">
        <rect width="478" height="66" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2" />
        <rect width="478" height="22" rx="3" fill="#fee2e2" />
        <text x="12" y="15" font-size="10" font-weight="700" fill="#991b1b">AMORTIZED HUMAN ESCALATION (C_human) &#8212; $0.028 (6.7%)</text>
        <text x="466" y="15" font-size="9" font-family="'SF Mono', monospace" fill="#991b1b" text-anchor="end">Operator Triage</text>

        <text x="14" y="38" font-size="9" font-family="'SF Mono', monospace" fill="#b91c1c" font-weight="700">P(escalate) &#215; $3.50 triage labor cost per intervention</text>
        <text x="14" y="52" font-size="8.5" fill="#475569">On deadlock or safety violation</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: Effective Cost Hyperbola vs. Single-Step Accuracy -->
  <g transform="translate(562, 20)">
    <!-- Container Card -->
    <rect width="514" height="480" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Header Bar -->
    <rect width="514" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="22" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="0.2">THE TOKEN-PRICE FALLACY: EFFECTIVE COST PER TASK</text>
    <text x="498" y="22" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#475569" text-anchor="end">K = 8 Steps</text>

    <!-- Formula Ribbon -->
    <g transform="translate(16, 46)">
      <rect width="482" height="28" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="241" y="18" font-size="9.5" font-family="'SF Mono', Consolas, monospace" fill="#1e40af" font-weight="600" text-anchor="middle">C_effective = E[C_attempt] / P(success) = E[C_attempt] / p^K</text>
    </g>

    <!-- Coordinate Plot -->
    <g transform="translate(24, 88)">
      <!-- Plot Background -->
      <rect width="466" height="290" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="2" />

      <!-- Shaded Failure-Cliff Wash (p < 0.75: x=50 to x=247.5) -->
      <rect x="50" y="20" width="197" height="225" fill="#fef2f2" fill-opacity="0.5" />
      
      <!-- Failure Wash Label (Top-Left corner) -->
      <text x="56" y="34" font-size="8" font-weight="700" fill="#dc2626">EXPONENTIAL FAILURE REGIME</text>
      <text x="56" y="45" font-size="7" fill="#991b1b">P(success) = p^8 &lt; 10%</text>
      <text x="56" y="55" font-size="7" fill="#991b1b">High Wasted Sandbox Spend</text>

      <!-- Gridlines -->
      <!-- Y Grid: 0, $0.50, $1.00, $1.50, $2.00 -->
      <line x1="50" y1="245" x2="445" y2="245" stroke="#cbd5e1" stroke-width="1" />
      <line x1="50" y1="190" x2="445" y2="190" stroke="#f1f5f9" stroke-width="1" />
      <line x1="50" y1="135" x2="445" y2="135" stroke="#f1f5f9" stroke-width="1" />
      <line x1="50" y1="80" x2="445" y2="80" stroke="#f1f5f9" stroke-width="1" />
      <line x1="50" y1="25" x2="445" y2="25" stroke="#f1f5f9" stroke-width="1" />

      <!-- Y Axis Labels -->
      <text x="42" y="248" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">$0.00</text>
      <text x="42" y="193" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">$0.50</text>
      <text x="42" y="138" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">$1.00</text>
      <text x="42" y="83" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">$1.50</text>
      <text x="42" y="28" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">$2.00</text>

      <!-- X Axis: p from 0.50 (x=50) to 1.00 (x=445) -->
      <line x1="50" y1="245" x2="50" y2="20" stroke="#cbd5e1" stroke-width="1" />
      <line x1="129" y1="245" x2="129" y2="249" stroke="#94a3b8" stroke-width="1" />
      <line x1="208" y1="245" x2="208" y2="249" stroke="#94a3b8" stroke-width="1" />
      <line x1="287" y1="245" x2="287" y2="249" stroke="#94a3b8" stroke-width="1" />
      <line x1="366" y1="245" x2="366" y2="249" stroke="#94a3b8" stroke-width="1" />
      <line x1="445" y1="245" x2="445" y2="249" stroke="#94a3b8" stroke-width="1" />

      <!-- X Axis Labels -->
      <text x="50" y="260" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">0.50</text>
      <text x="129" y="260" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">0.60</text>
      <text x="208" y="260" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">0.70</text>
      <text x="287" y="260" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">0.80</text>
      <text x="366" y="260" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">0.90</text>
      <text x="445" y="260" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">1.00</text>

      <text x="247" y="276" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Single-Step Tool Execution Success Rate p (Task Length K = 8)</text>

      <!-- Curve 1: Naive Model Cost Function (Red) -->
      <!-- Points: (152, 25), (168.5, 41.5), (195, 85), (235, 160), (287, 206.5), (366, 230), (445, 238.5) -->
      <path d="M 152 25 Q 165 42, 185 80 T 235 160 T 295 210 T 375 234 T 445 238.5" fill="none" stroke="#ef4444" stroke-width="2.2" />

      <!-- Curve 2: Frontier Model Cost Function (Blue) -->
      <!-- Points: (326.5, 122.9), (366, 167.6), (389.7, 185.2), (413.4, 198.8), (445, 211.7) -->
      <path d="M 315 105 Q 345 145, 375 175 T 413.4 198.8 T 445 211.7" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" />

      <!-- Dashed projection lines to x-axis -->
      <line x1="168.5" y1="41.5" x2="168.5" y2="245" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" />
      <line x1="413.4" y1="198.8" x2="413.4" y2="245" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2" />

      <!-- Point A Circle -->
      <circle cx="168.5" cy="41.5" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />

      <!-- Point A Callout Card (shifted to right, cleared from wash header) -->
      <g transform="translate(230, 26)">
        <rect width="215" height="46" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
        <rect width="215" height="15" rx="3" fill="#fee2e2" />
        <text x="8" y="11" font-size="8.5" font-weight="700" fill="#991b1b">POINT A: NAIVE LOW-COST MODEL</text>
        <text x="8" y="27" font-size="8" font-family="'SF Mono', monospace" fill="#dc2626">p = 0.65 &#8594; P(success) = 3.18%</text>
        <text x="8" y="39" font-size="8" font-family="'SF Mono', monospace" fill="#991b1b" font-weight="600">C_effective = $1.85 (31.4 attempts)</text>
      </g>
      <!-- Leader line from Point A to Card -->
      <line x1="174" y1="41.5" x2="230" y2="49" stroke="#dc2626" stroke-width="1" />

      <!-- Point B Circle -->
      <circle cx="413.4" cy="198.8" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5" />

      <!-- Point B Callout Card -->
      <g transform="translate(195, 140)">
        <rect width="195" height="46" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
        <rect width="195" height="15" rx="3" fill="#dcfce7" />
        <text x="8" y="11" font-size="8.5" font-weight="700" fill="#166534">POINT B: FRONTIER MODEL</text>
        <text x="8" y="27" font-size="8" font-family="'SF Mono', monospace" fill="#15803d">p = 0.96 &#8594; P(success) = 72.1%</text>
        <text x="8" y="39" font-size="8" font-family="'SF Mono', monospace" fill="#166534" font-weight="600">C_effective = $0.42 (1.38 attempts)</text>
      </g>
      <!-- Leader line from Card to Point B -->
      <line x1="390" y1="163" x2="408" y2="195" stroke="#16a34a" stroke-width="1" />

      <!-- Curve Legends -->
      <g transform="translate(290, 88)">
        <line x1="0" y1="6" x2="20" y2="6" stroke="#ef4444" stroke-width="2" />
        <text x="26" y="9" font-size="7.5" fill="#991b1b">Naive Model C_eff(p)</text>
        <line x1="0" y1="18" x2="20" y2="18" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,2" />
        <text x="26" y="21" font-size="7.5" fill="#1e40af">Frontier Model C_eff(p)</text>
      </g>
    </g>

    <!-- Bottom Metric Comparison Row -->
    <g transform="translate(16, 396)">
      <rect width="482" height="68" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Col 1: Nominal Tariff -->
      <g transform="translate(12, 10)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#64748b">NOMINAL TARIFF</text>
        <text x="0" y="28" font-size="8" fill="#991b1b">Naive: $0.20 / 1M</text>
        <text x="0" y="42" font-size="8" fill="#166534">Frontier: $15.00 / 1M</text>
        <text x="0" y="54" font-size="7.5" fill="#64748b">(75&#215; tariff premium)</text>
      </g>
      <line x1="126" y1="8" x2="126" y2="60" stroke="#e2e8f0" stroke-width="1" />

      <!-- Col 2: Rollout Success -->
      <g transform="translate(138, 10)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#64748b">TASK SUCCESS P(s)</text>
        <text x="0" y="28" font-size="8" fill="#991b1b">Naive: 0.65^8 = 3.2%</text>
        <text x="0" y="42" font-size="8" fill="#166534">Frontier: 0.96^8 = 72.1%</text>
        <text x="0" y="54" font-size="7.5" fill="#64748b">(22.7&#215; higher yield)</text>
      </g>
      <line x1="258" y1="8" x2="258" y2="60" stroke="#e2e8f0" stroke-width="1" />

      <!-- Col 3: Wasted Overhead -->
      <g transform="translate(270, 10)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#64748b">WASTED OVERHEAD</text>
        <text x="0" y="28" font-size="8" fill="#991b1b">Naive: 30.4 failed runs</text>
        <text x="0" y="42" font-size="8" fill="#166534">Frontier: 0.38 failed runs</text>
        <text x="0" y="54" font-size="7.5" fill="#64748b">(Sandbox &amp; tool waste)</text>
      </g>
      <line x1="390" y1="8" x2="390" y2="60" stroke="#e2e8f0" stroke-width="1" />

      <!-- Col 4: Effective Cost -->
      <g transform="translate(402, 10)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#64748b">EFFECTIVE COST</text>
        <text x="0" y="28" font-size="9" font-family="'SF Mono', monospace" font-weight="700" fill="#dc2626">$1.85 / task</text>
        <text x="0" y="44" font-size="9" font-family="'SF Mono', monospace" font-weight="700" fill="#16a34a">$0.42 / task</text>
        <text x="0" y="56" font-size="7.5" font-weight="700" fill="#166534">&#8594; 4.4&#215; lower cost</text>
      </g>
    </g>
  </g>
</svg>