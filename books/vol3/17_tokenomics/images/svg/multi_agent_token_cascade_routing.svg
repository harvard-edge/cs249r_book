<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="480" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: UNCONSTRAINED SWARM CASCADE (FAILURE MODE)           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Functional Container Card -->
    <rect x="0" y="0" width="420" height="405" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">FAILURE MODE: UNCONSTRAINED MULTI-AGENT CASCADE</text>

    <!-- Step 1: User Request -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="390" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">1. User Request (Direct Input)</text>
      <text x="10" y="30" font-size="8.0" fill="#64748b">Prompt: 50 tokens · Frontier Model ($15.00/M tok) · Initial Cost: $0.00075</text>
    </g>

    <!-- Arrow Down 1 -->
    <g transform="translate(210, 76)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
      <text x="8" y="13" font-size="8.0" font-weight="600" fill="#dc2626">Spawns 5 Unbounded Subagents</text>
    </g>

    <!-- Step 2: Unisolated Conversational Swarm -->
    <g transform="translate(15, 100)">
      <rect x="0" y="0" width="390" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="74" fill="#dc2626"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">2. Unisolated Conversational Swarm (Turns 1–5)</text>
      <text x="10" y="29" font-size="8.0" fill="#475569">Each subagent ingests full prompt + context window (40k tokens).</text>
      <text x="10" y="42" font-size="8.0" fill="#475569">Subagents broadcast raw intermediate outputs across a shared room.</text>
      <rect x="10" y="50" width="370" height="16" rx="1" fill="#fee2e2" stroke="#fecdd3" stroke-width="0.8"/>
      <text x="16" y="62" font-size="8.0" font-weight="700" fill="#991b1b">5 × 40,000 in + 5 × 2,000 out = 210,000 tokens ($4.50)</text>
    </g>

    <!-- Arrow Down 2 -->
    <g transform="translate(210, 174)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
      <text x="8" y="13" font-size="8.0" font-weight="600" fill="#dc2626">Unbounded Retries (Thundering Herd)</text>
    </g>

    <!-- Step 3: Compounding Trajectory Blowup -->
    <g transform="translate(15, 198)">
      <rect x="0" y="0" width="390" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="74" fill="#991b1b"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">3. Exponential Retries &amp; KV Cache Thrashing</text>
      <text x="10" y="29" font-size="8.0" fill="#475569">Minor tool schema parse error triggers 20 recursive repair loops.</text>
      <text x="10" y="42" font-size="8.0" fill="#475569">Zero circuit breaker; subagents repeatedly regenerate full prompt sequences.</text>
      <rect x="10" y="50" width="370" height="16" rx="1" fill="#fee2e2" stroke="#fecdd3" stroke-width="0.8"/>
      <text x="16" y="62" font-size="8.0" font-weight="700" fill="#991b1b">Cumulative Consumption: 4.8 Million tokens ($115.20)</text>
    </g>

    <!-- Arrow Down 3 -->
    <g transform="translate(210, 272)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
      <text x="8" y="12" font-size="8.0" font-weight="600" fill="#dc2626">Cascade Failure</text>
    </g>

    <!-- Outcome Card Bottom -->
    <g transform="translate(15, 294)">
      <rect x="0" y="0" width="390" height="96" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="0" y="0" width="390" height="22" fill="#fee2e2"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">RESULT: 153,600× COST INFLATION ($115.20 vs. $0.00075)</text>
      <text x="10" y="36" font-size="8.0" fill="#7f1d1d">• Cloud budget exhausted; task aborted due to rate limit threshold breach.</text>
      <text x="10" y="49" font-size="8.0" fill="#7f1d1d">• Zero cache reuse; thundering herd evicts KV blocks across GPU cluster.</text>
      <rect x="10" y="58" width="370" height="28" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="18" y="71" font-size="8.0" font-weight="700" fill="#b91c1c">STATUS: CRITICAL EXHAUSTION</text>
      <text x="18" y="81" font-size="8.0" fill="#7f1d1d">Zero verified goodput delivered; runaway financial burn</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: TIERED MODEL ROUTING (OPTIMIZED SOLUTION)            -->
  <!-- ================================================================= -->
  <g transform="translate(480, 75)">
    <!-- Functional Container Card -->
    <rect x="0" y="0" width="420" height="405" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">SOLUTION: TIERED ROUTING &amp; QUOTA LEASES</text>

    <!-- Tier 1: Distilled Router -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="390" height="58" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="7" width="40" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="28" y="17" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">TIER 1</text>
      <text x="54" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Fast Distilled Classifier / Router</text>
      <text x="10" y="33" font-size="8.0" fill="#475569">Categorizes query complexity; enforces rigid token quota allocation.</text>
      <text x="10" y="47" font-size="8.0" font-weight="700" fill="#15803d">Model: 8B Distilled ($0.10/M) · Prefill amortized via KV cache</text>
    </g>

    <!-- Arrow Down 1 -->
    <g transform="translate(210, 92)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="8" y="13" font-size="8.0" font-weight="600" fill="#15803d">Decomposed Worker Tasks</text>
    </g>

    <!-- Tier 2: Domain Specialists -->
    <g transform="translate(15, 116)">
      <rect x="0" y="0" width="390" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="7" width="40" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="28" y="17" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">TIER 2</text>
      <text x="54" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Specialized Workers (Isolated Mailboxes)</text>
      <text x="10" y="32" font-size="8.0" fill="#475569">Private worktrees; shared read-only code prefix KV cache.</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">Monotonic token leases (max 5,000 tokens per subagent).</text>
      <text x="10" y="58" font-size="8.0" font-weight="700" fill="#15803d">Model: 70B MoE ($0.60/M) · Circuit breaker on 2 consecutive errors</text>
    </g>

    <!-- Arrow Down 2 -->
    <g transform="translate(210, 186)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="8" y="13" font-size="8.0" font-weight="600" fill="#15803d">Oracle Gate (Unit Test Pass / Fail)</text>
    </g>

    <!-- Tier 3: Gated Frontier Synthesis -->
    <g transform="translate(15, 210)">
      <rect x="0" y="0" width="390" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="7" width="40" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="28" y="17" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">TIER 3</text>
      <text x="54" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Frontier Reasoning Model (Escalation Only)</text>
      <text x="10" y="32" font-size="8.0" fill="#475569">Invoked strictly when deterministic software oracle fails.</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">Synthesizes verified diffs; bounded to 1 single deliberate turn.</text>
      <text x="10" y="58" font-size="8.0" font-weight="700" fill="#15803d">Model: Frontier ($15.00/M) · Consumes condensed AST delta summary</text>
    </g>

    <!-- Arrow Down 3 -->
    <g transform="translate(210, 280)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    </g>

    <!-- Outcome Card Bottom -->
    <g transform="translate(15, 294)">
      <rect x="0" y="0" width="390" height="96" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="390" height="22" fill="#dcfce7"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">RESULT: 98.4% COST REDUCTION ($1.84 vs. $115.20)</text>
      <text x="10" y="36" font-size="8.0" fill="#166534">• Deterministic oracle gating guarantees bounded CPVG and high goodput.</text>
      <text x="10" y="49" font-size="8.0" fill="#166534">• Shared prefix KV cache eliminates redundant prompt prefill across workers.</text>
      <rect x="10" y="58" width="370" height="28" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="18" y="71" font-size="8.0" font-weight="700" fill="#15803d">STATUS: OPTIMAL EFFICIENCY</text>
      <text x="18" y="81" font-size="8.0" fill="#166534">Verified diff committed within quota lease; predictable latency</text>
    </g>
  </g>
</g>
</svg>