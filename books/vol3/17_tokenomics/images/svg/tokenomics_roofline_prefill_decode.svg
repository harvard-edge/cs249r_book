<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="480" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: ROOFLINE GRAPH                                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Functional Container Card -->
    <rect x="0" y="0" width="540" height="405" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="540" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">OPERATIONAL ROOFLINE MODEL (H100 SXM5 FP16 TENSOR CORES)</text>

    <!-- Graph Interior Area -->
    <g transform="translate(15, 34)">
      <rect width="510" height="358" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Shaded Memory-Bound Region -->
      <path d="M 55 285 L 245 85 L 55 85 Z" fill="#e0f2fe" fill-opacity="0.6"/>
      <text x="68" y="62" font-size="8.5" font-weight="700" fill="#0369a1">Memory-Bandwidth Bound</text>
      <text x="68" y="74" font-size="8.0" fill="#0284c7">Slope = HBM3 Bandwidth (3.35 TB/s)</text>

      <!-- Shaded Compute-Bound Region -->
      <rect x="245" y="35" width="235" height="250" fill="#dcfce7" fill-opacity="0.5"/>
      <text x="280" y="52" font-size="8.5" font-weight="700" fill="#15803d">Compute Bound (Tensor Cores)</text>
      <text x="280" y="64" font-size="8.0" fill="#16a34a">Peak FP16 Ceiling: 989 TFLOP/s</text>

      <!-- Horizontal Grid Lines -->
      <line x1="55" y1="235" x2="480" y2="235" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="55" y1="185" x2="480" y2="185" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="55" y1="135" x2="480" y2="135" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="55" y1="85" x2="480" y2="85" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Axes -->
      <line x1="55" y1="285" x2="495" y2="285" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="55" y1="285" x2="55" y2="22" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <!-- Axis Labels -->
      <text x="270" y="318" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">Arithmetic Intensity (FLOPs / Byte)</text>
      <text x="65" y="24" font-size="8" font-weight="600" fill="#334155">Attained Performance (TFLOP/s)</text>

      <!-- X Ticks -->
      <line x1="55" y1="285" x2="55" y2="289" stroke="#94a3b8"/>
      <text x="55" y="299" font-size="8" fill="#64748b" text-anchor="middle">0.5</text>

      <line x1="115" y1="285" x2="115" y2="289" stroke="#94a3b8"/>
      <text x="115" y="299" font-size="8" fill="#64748b" text-anchor="middle">2</text>

      <line x1="175" y1="285" x2="175" y2="289" stroke="#94a3b8"/>
      <text x="175" y="299" font-size="8" fill="#64748b" text-anchor="middle">8</text>

      <line x1="245" y1="285" x2="245" y2="289" stroke="#94a3b8"/>
      <text x="245" y="299" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">I* = 295</text>

      <line x1="345" y1="285" x2="345" y2="289" stroke="#94a3b8"/>
      <text x="345" y="299" font-size="8" fill="#64748b" text-anchor="middle">1024</text>

      <line x1="450" y1="285" x2="450" y2="289" stroke="#94a3b8"/>
      <text x="450" y="299" font-size="8" fill="#64748b" text-anchor="middle">4096</text>

      <!-- Y Ticks -->
      <text x="48" y="238" font-size="8" fill="#64748b" text-anchor="end">100</text>
      <text x="48" y="188" font-size="8" fill="#64748b" text-anchor="end">300</text>
      <text x="48" y="138" font-size="8" fill="#64748b" text-anchor="end">600</text>
      <text x="48" y="88" font-size="8" fill="#64748b" text-anchor="end">989</text>

      <!-- Roofline Curve -->
      <polyline points="55,285 245,85 480,85" fill="none" stroke="#0f172a" stroke-width="2.5"/>

      <!-- Operational Point 1: Autoregressive Decode (Batch=1) -->
      <circle cx="90" cy="250" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
      <text x="102" y="246" font-size="8.5" font-weight="700" fill="#991b1b">Decode (B=1, GEMV)</text>
      <text x="102" y="257" font-size="8.0" fill="#7f1d1d">Intensity ~ 1 FLOP/B</text>
      <text x="102" y="267" font-size="8.0" font-weight="600" fill="#dc2626">High Cost / Token</text>

      <!-- Operational Point 2: Speculative Decoding Shift -->
      <circle cx="155" cy="180" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 98 240 Q 124 205 148 186" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
      <text x="165" y="177" font-size="8.5" font-weight="700" fill="#0369a1">Speculative Decode (K=4)</text>
      <text x="165" y="188" font-size="8.0" fill="#075985">Verification amortizes weights</text>

      <!-- Operational Point 3: Batched Decode -->
      <circle cx="205" cy="130" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
      <text x="217" y="126" font-size="8.5" font-weight="700" fill="#b45309">Paged Batched Decode (B=64)</text>
      <text x="217" y="137" font-size="8.0" fill="#92400e">Intensity ~ 16 FLOP/B</text>

      <!-- Operational Point 4: Prefill GEMM -->
      <circle cx="390" cy="85" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
      <text x="390" y="108" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Input Prefill (GEMM)</text>
      <text x="390" y="119" font-size="8.0" fill="#166534" text-anchor="middle">Intensity &gt; 1500 FLOP/B</text>
      <text x="390" y="129" font-size="8.0" font-weight="600" fill="#15803d" text-anchor="middle">Low Cost / Token</text>

      <!-- Explanatory Footer inside Plot -->
      <rect x="25" y="328" width="460" height="22" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="255" y="342" text-anchor="middle" font-size="8.0" fill="#475569">Turning point I* = Peak FLOPs / Memory Bandwidth = 989 TFLOP/s / 3.35 TB/s ≈ 295 FLOPs/Byte</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: SIDE SUMMARY CARDS                                   -->
  <!-- ================================================================= -->
  <g transform="translate(600, 75)">
    <!-- Functional Container Card -->
    <rect x="0" y="0" width="300" height="405" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">ECONOMIC &amp; ARCHITECTURAL LEVERS</text>

    <!-- Card 1: Prefill Economics -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="276" height="90" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="90" fill="#16a34a"/>
      <rect x="10" y="10" width="48" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="34" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">PREFILL</text>
      <text x="64" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Input Prefill Phase (GEMM)</text>
      <text x="10" y="38" font-size="8.0" fill="#475569">All prompt tokens processed concurrently in parallel.</text>
      <text x="10" y="51" font-size="8.0" fill="#475569">Weight reading is amortized over sequence length.</text>
      <rect x="10" y="60" width="256" height="20" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.8"/>
      <text x="16" y="73" font-size="8.0" font-weight="700" fill="#15803d">Saturates Tensor ALUs → Economically cheap tokens</text>
    </g>

    <!-- Card 2: Decode Economics -->
    <g transform="translate(12, 132)">
      <rect x="0" y="0" width="276" height="90" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="90" fill="#dc2626"/>
      <rect x="10" y="10" width="48" height="14" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="34" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">DECODE</text>
      <text x="64" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Output Decode Phase (GEMV)</text>
      <text x="10" y="38" font-size="8.0" fill="#475569">Tokens generated sequentially, one by one.</text>
      <text x="10" y="51" font-size="8.0" fill="#475569">Every token re-streams full model weights from HBM.</text>
      <rect x="10" y="60" width="256" height="20" rx="1" fill="#fee2e2" stroke="#fecdd3" stroke-width="0.8"/>
      <text x="16" y="73" font-size="8.0" font-weight="700" fill="#991b1b">ALUs idle waiting on bus → 3×–5× cost per token</text>
    </g>

    <!-- Card 3: Architectural Mitigations -->
    <g transform="translate(12, 230)">
      <rect x="0" y="0" width="276" height="162" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="162" fill="#0284c7"/>
      <rect x="10" y="10" width="48" height="14" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
      <text x="34" y="20" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">LEVERS</text>
      <text x="64" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Architectural Cost Mitigations</text>

      <text x="10" y="39" font-size="8.0" font-weight="700" fill="#0f172a">1. Paged Attention &amp; Continuous Batching</text>
      <text x="10" y="51" font-size="8.0" fill="#475569">Eliminates external fragmentation to maximize batch B,</text>
      <text x="10" y="62" font-size="8.0" fill="#475569">sharing weight reads across concurrent streams.</text>

      <text x="10" y="80" font-size="8.0" font-weight="700" fill="#0f172a">2. Speculative Decoding</text>
      <text x="10" y="92" font-size="8.0" fill="#475569">Uses surplus ALU cycles to verify K draft tokens,</text>
      <text x="10" y="103" font-size="8.0" fill="#475569">reducing memory round-trips by up to 3×.</text>

      <text x="10" y="121" font-size="8.0" font-weight="700" fill="#0f172a">3. Prefix KV-Cache Caching</text>
      <text x="10" y="133" font-size="8.0" fill="#475569">Bypasses prefill compute for repeated prompts,</text>
      <text x="10" y="144" font-size="8.0" fill="#475569">shifting cost model from compute to memory rent.</text>
    </g>
  </g>
</g>
</svg>