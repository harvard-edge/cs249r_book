<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .tick-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; line-height: 1.4; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-shift" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="510" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE TOKENOMICS ROOFLINE: HARDWARE LIMITS OF PREFILL VS. DECODE</text>
  </g>

  <!-- Main Graph Panel (Left) -->
  <g transform="translate(25, 75)">
    <rect width="530" height="415" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>

    <!-- Shaded Memory-Bound Region -->
    <path d="M 60 320 L 260 100 L 60 100 Z" fill="#eff6ff" opacity="0.6"/>
    <text x="75" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1">Memory-Bandwidth Bound</text>
    <text x="75" y="83" font-family="system-ui, sans-serif" font-size="8.5" fill="#0284c7">Slope = HBM Bandwidth (3.35 TB/s)</text>

    <!-- Shaded Compute-Bound Region -->
    <rect x="260" y="35" width="240" height="285" fill="#f0fdf4" opacity="0.5"/>
    <text x="310" y="55" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">Compute Bound (Tensor Cores)</text>
    <text x="310" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#16a34a">Peak FP16 Ceiling: 989 TFLOP/s</text>

    <!-- Grid Lines -->
    <line x1="60" y1="265" x2="500" y2="265" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="210" x2="500" y2="210" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="155" x2="500" y2="155" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="100" x2="500" y2="100" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Axes -->
    <line x1="60" y1="320" x2="515" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <line x1="60" y1="320" x2="60" y2="20" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>

    <!-- Axis Labels -->
    <text x="280" y="360" class="axis-label" text-anchor="middle">Arithmetic Intensity (FLOPs / Byte)</text>
    <text x="70" y="24" class="axis-label">Attained TFLOP/s</text>

    <!-- X Ticks -->
    <text x="60" y="335" class="tick-label" text-anchor="middle">0.5</text>
    <text x="130" y="335" class="tick-label" text-anchor="middle">2</text>
    <text x="200" y="335" class="tick-label" text-anchor="middle">8</text>
    <text x="260" y="335" class="tick-label" text-anchor="middle">I* = 295</text>
    <text x="360" y="335" class="tick-label" text-anchor="middle">1024</text>
    <text x="470" y="335" class="tick-label" text-anchor="middle">4096</text>

    <!-- Y Ticks -->
    <text x="50" y="268" class="tick-label" text-anchor="end">100</text>
    <text x="50" y="213" class="tick-label" text-anchor="end">300</text>
    <text x="50" y="158" class="tick-label" text-anchor="end">600</text>
    <text x="50" y="103" class="tick-label" text-anchor="end">989</text>

    <!-- Roofline Curve -->
    <polyline points="60,320 260,100 500,100" fill="none" stroke="#0f172a" stroke-width="3"/>

    <!-- Operational Point 1: Autoregressive Decode (Batch=1) -->
    <circle cx="95" cy="281" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="106" y="275" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Decode (B=1, GEMV)</text>
    <text x="106" y="287" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">Intensity ~ 1 FLOP/B</text>
    <text x="106" y="297" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#dc2626">High Cost / Token</text>

    <!-- Operational Point 2: Speculative Decoding Shift -->
    <circle cx="165" cy="204" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <path d="M 102 270 Q 130 230 158 210" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-shift)"/>
    <text x="175" y="200" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Speculative Decode (K=4)</text>
    <text x="175" y="212" font-family="system-ui, sans-serif" font-size="8" fill="#075985">Verification amortizes weights</text>

    <!-- Operational Point 3: Batched Decode -->
    <circle cx="215" cy="149" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="228" y="145" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#b45309">Paged Batched Decode (B=64)</text>
    <text x="228" y="157" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Intensity ~ 16 FLOP/B</text>

    <!-- Operational Point 4: Prefill GEMM -->
    <circle cx="420" cy="100" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="420" y="126" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Input Prefill (GEMM)</text>
    <text x="420" y="138" font-family="system-ui, sans-serif" font-size="8" fill="#065f46" text-anchor="middle">Intensity &gt; 1500 FLOP/B</text>
    <text x="420" y="150" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#059669" text-anchor="middle">Low Cost / Token</text>

    <!-- Explanatory footer inside plot -->
    <rect x="70" y="375" width="410" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="275" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">
      Turning point I* = Peak FLOPs / Memory Bandwidth = 989 TFLOPs / 3.35 TB/s ≈ 295 FLOPs/Byte
    </text>
  </g>

  <!-- Side Summary Cards (Right) -->
  <g transform="translate(575, 75)">
    <!-- Card 1: Prefill Economics -->
    <rect x="0" y="0" width="340" height="95" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="6" height="71" rx="3" fill="#10b981"/>
    <text x="28" y="28" class="card-title" fill="#065f46">Input Prefill Phase (GEMM)</text>
    <text x="28" y="44" class="card-desc">All prompt tokens processed concurrently.</text>
    <text x="28" y="58" class="card-desc">Weight reading is amortized over sequence length.</text>
    <text x="28" y="72" class="card-desc">Saturates GPU ALUs → <tspan font-weight="700" fill="#047857">Economically cheap tokens</tspan>.</text>

    <!-- Card 2: Decode Economics -->
    <rect x="0" y="107" width="340" height="95" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="6" height="71" rx="3" fill="#ef4444" transform="translate(0, 107)"/>
    <text x="28" y="135" class="card-title" fill="#991b1b">Output Decode Phase (GEMV)</text>
    <text x="28" y="151" class="card-desc">Tokens generated sequentially, one by one.</text>
    <text x="28" y="165" class="card-desc">Every token re-streams full model weights from HBM.</text>
    <text x="28" y="179" class="card-desc">ALUs idle waiting on bus → <tspan font-weight="700" fill="#b91c1c">3x–5x expensive tokens</tspan>.</text>

    <!-- Card 3: Architectural Mitigations -->
    <rect x="0" y="214" width="340" height="198" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="12" y="12" width="6" height="174" rx="3" fill="#0284c7" transform="translate(0, 214)"/>
    <text x="28" y="242" class="card-title" fill="#0369a1">Architectural Cost Levers</text>

    <text x="28" y="264" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">1. Paged Attention &amp; Continuous Batching</text>
    <text x="28" y="278" class="card-desc">Eliminates external fragmentation to maximize batch B,</text>
    <text x="28" y="290" class="card-desc">sharing weight reads across concurrent streams.</text>

    <text x="28" y="312" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">2. Speculative Decoding</text>
    <text x="28" y="326" class="card-desc">Uses surplus ALU cycles to verify K draft tokens,</text>
    <text x="28" y="338" class="card-desc">reducing memory round-trips by up to 3x.</text>

    <text x="28" y="360" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">3. Prefix KV-Cache Caching</text>
    <text x="28" y="374" class="card-desc">Bypasses prefill compute for repeated prompts,</text>
    <text x="28" y="386" class="card-desc">shifting cost model from compute to memory rent.</text>
  </g>
</svg>
