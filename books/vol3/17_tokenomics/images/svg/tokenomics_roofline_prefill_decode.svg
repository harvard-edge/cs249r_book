<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arr-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#581C87"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0369A1"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- (a) QUANTITATIVE OPERATIONAL ROOFLINE (LEFT: w=540)               -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect width="535" height="440" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <rect width="535" height="24" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0F172A">(a) OPERATIONAL ROOFLINE MODEL (H100 SXM5 FP16 TENSOR CORES)</text>

    <!-- Graph Interior -->
    <g transform="translate(18, 38)">
      <!-- Memory-Bound Region Shading -->
      <path d="M 50 310 L 250 80 L 50 80 Z" fill="#FAF5FF" stroke="none"/>
      <text x="58" y="100" font-size="7.5" font-weight="700" fill="#581C87">Memory-Bandwidth Bound</text>
      <text x="58" y="112" font-size="7.0" fill="#6B21A8">Slope β = 3.35 TB/s (HBM3)</text>

      <!-- Compute-Bound Region Shading -->
      <rect x="250" y="30" width="230" height="280" fill="#F0FDF4" stroke="none"/>
      <text x="265" y="48" font-size="7.5" font-weight="700" fill="#15803D">Compute-Bound Ceiling</text>
      <text x="265" y="60" font-size="7.0" fill="#166534">Peak FP16: Π = 989 TFLOP/s</text>

      <!-- Horizontal Grid Lines -->
      <line x1="50" y1="260" x2="480" y2="260" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="50" y1="200" x2="480" y2="200" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="50" y1="140" x2="480" y2="140" stroke="#F1F5F9" stroke-width="1"/>
      <line x1="50" y1="80" x2="480" y2="80" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Axes -->
      <line x1="50" y1="310" x2="495" y2="310" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="50" y1="310" x2="50" y2="15" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

      <!-- Axis Labels -->
      <text x="265" y="342" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Arithmetic Intensity I (FLOPs / Byte)</text>
      <text x="55" y="18" font-size="7.5" font-weight="700" fill="#334155">Attained Performance P (TFLOP/s)</text>

      <!-- X Ticks & Labels -->
      <line x1="50" y1="310" x2="50" y2="315" stroke="#94A3B8"/>
      <text x="50" y="326" font-size="7.2" fill="#64748B" text-anchor="middle">0.5</text>

      <line x1="105" y1="310" x2="105" y2="315" stroke="#94A3B8"/>
      <text x="105" y="326" font-size="7.2" fill="#64748B" text-anchor="middle">2</text>

      <line x1="160" y1="310" x2="160" y2="315" stroke="#94A3B8"/>
      <text x="160" y="326" font-size="7.2" fill="#64748B" text-anchor="middle">8</text>

      <line x1="210" y1="310" x2="210" y2="315" stroke="#94A3B8"/>
      <text x="210" y="326" font-size="7.2" fill="#64748B" text-anchor="middle">32</text>

      <!-- Inflection line I* = 295 -->
      <line x1="250" y1="310" x2="250" y2="80" stroke="#581C87" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="250" y1="310" x2="250" y2="315" stroke="#581C87"/>
      <text x="250" y="326" font-size="7.5" font-weight="700" fill="#581C87" text-anchor="middle">I* = 295</text>

      <line x1="350" y1="310" x2="350" y2="315" stroke="#94A3B8"/>
      <text x="350" y="326" font-size="7.2" fill="#64748B" text-anchor="middle">1024</text>

      <line x1="450" y1="310" x2="450" y2="315" stroke="#94A3B8"/>
      <text x="450" y="326" font-size="7.2" fill="#64748B" text-anchor="middle">4096</text>

      <!-- Y Ticks -->
      <text x="42" y="263" font-size="7.2" fill="#64748B" text-anchor="end">100</text>
      <text x="42" y="203" font-size="7.2" fill="#64748B" text-anchor="end">300</text>
      <text x="42" y="143" font-size="7.2" fill="#64748B" text-anchor="end">600</text>
      <text x="42" y="83" font-size="7.2" font-weight="700" fill="#0F172A" text-anchor="end">989</text>

      <!-- Roofline Polyline -->
      <polyline points="50,310 250,80 480,80" fill="none" stroke="#0F172A" stroke-width="2.2"/>

      <!-- Operational Point 1: Decode B=1 (GEMV) -->
      <circle cx="75" cy="280" r="4.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="86" y="278" font-size="7.5" font-weight="700" fill="#991B1B">Decode (B=1, GEMV)</text>
      <text x="86" y="288" font-size="7.0" fill="#DC2626">I ≈ 1 FLOP/B | η = 0.34%</text>

      <!-- Operational Point 2: Speculative Decoding (K=4) -->
      <circle cx="140" cy="206" r="4.5" fill="#0369A1" stroke="#FFFFFF" stroke-width="1.2"/>
      <path d="M 85 272 Q 110 235 133 212" fill="none" stroke="#0369A1" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
      <text x="150" y="202" font-size="7.5" font-weight="700" fill="#0369A1">Speculative (K=4)</text>
      <text x="150" y="212" font-size="7.0" fill="#075985">I ≈ 4 FLOP/B | 3× weight reuse</text>

      <!-- Operational Point 3: Batched Decode (B=64) -->
      <circle cx="205" cy="132" r="4.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.2"/>
      <!-- Place text leftward to avoid collision with I*=295 line -->
      <g transform="translate(198, 126)">
        <rect x="-142" y="-10" width="138" height="24" rx="2" fill="#FFFFFF" fill-opacity="0.9" stroke="#FDE68A" stroke-width="0.8"/>
        <text x="-73" y="1" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B45309">Batched (B=64)</text>
        <text x="-73" y="11" text-anchor="middle" font-size="7.0" fill="#92400E">I ≈ 16 FLOP/B | η = 5.4%</text>
      </g>

      <!-- Operational Point 4: Prefill GEMM -->
      <circle cx="390" cy="80" r="4.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="390" y="102" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="middle">Prefill (GEMM)</text>
      <text x="390" y="113" font-size="7.0" fill="#166534" text-anchor="middle">I ≥ 1500 FLOP/B | η ≈ 99%</text>

      <!-- Footnote calculation bar -->
      <rect x="10" y="358" width="475" height="24" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="247" y="374" text-anchor="middle" font-size="7.2" fill="#475569">Turning point I* = Π_peak / β_HBM = (989 × 10¹² FLOP/s) / (3.35 × 10¹² B/s) ≈ 295.2 FLOP/B</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- (b) ARITHMETIC INTENSITY & HARDWARE DATAFLOW (RIGHT: w=375)       -->
  <!-- ================================================================= -->
  <g transform="translate(565, 20)">
    <rect width="375" height="440" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <rect width="375" height="24" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0F172A">(b) EXECUTION REGIME &amp; DATAFLOW ACCOUNTING</text>

    <!-- Table of Regimes -->
    <g transform="translate(14, 34)">
      <!-- Header -->
      <rect width="347" height="20" rx="1" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7.2" font-weight="700" fill="#334155">METRIC / PROPERTY</text>
      <text x="185" y="14" text-anchor="middle" font-size="7.2" font-weight="700" fill="#991B1B">DECODE (GEMV)</text>
      <text x="285" y="14" text-anchor="middle" font-size="7.2" font-weight="700" fill="#15803D">PREFILL (GEMM)</text>

      <!-- Row 1: Kernel Type -->
      <g transform="translate(0, 24)">
        <rect width="347" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">Primary Kernel</text>
        <text x="185" y="16" text-anchor="middle" font-size="7.2" fill="#DC2626">BLAS-2 (GEMV)</text>
        <text x="285" y="16" text-anchor="middle" font-size="7.2" fill="#15803D">BLAS-3 (GEMM)</text>
      </g>

      <!-- Row 2: FLOPs Formula -->
      <g transform="translate(0, 52)">
        <rect width="347" height="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">Compute Work</text>
        <text x="185" y="16" text-anchor="middle" font-size="7.2" fill="#334155">2 · P · 1 FLOPs</text>
        <text x="285" y="16" text-anchor="middle" font-size="7.2" fill="#334155">2 · P · S FLOPs</text>
      </g>

      <!-- Row 3: Memory Transferred -->
      <g transform="translate(0, 80)">
        <rect width="347" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">Bytes Moved</text>
        <text x="185" y="16" text-anchor="middle" font-size="7.2" fill="#334155">2 · P Bytes</text>
        <text x="285" y="16" text-anchor="middle" font-size="7.2" fill="#334155">2 · P Bytes (shared)</text>
      </g>

      <!-- Row 4: Arithmetic Intensity -->
      <g transform="translate(0, 108)">
        <rect width="347" height="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">Intensity I</text>
        <text x="185" y="16" text-anchor="middle" font-size="7.2" font-weight="700" fill="#DC2626">≈ 1 FLOP/B</text>
        <text x="285" y="16" text-anchor="middle" font-size="7.2" font-weight="700" fill="#15803D">≈ S FLOP/B</text>
      </g>

      <!-- Row 5: Limiting Resource -->
      <g transform="translate(0, 136)">
        <rect width="347" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">Hardware Wall</text>
        <text x="185" y="16" text-anchor="middle" font-size="7.2" font-weight="700" fill="#DC2626">HBM3 Bandwidth</text>
        <text x="285" y="16" text-anchor="middle" font-size="7.2" font-weight="700" fill="#15803D">Tensor Core FLOPs</text>
      </g>

      <!-- Row 6: Hardware Utilization -->
      <g transform="translate(0, 164)">
        <rect width="347" height="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
        <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">ALU Utilization η</text>
        <text x="185" y="16" text-anchor="middle" font-size="7.2" fill="#DC2626">&lt; 1% (Idling)</text>
        <text x="285" y="16" text-anchor="middle" font-size="7.2" fill="#15803D">&gt; 90% (Saturated)</text>
      </g>

      <!-- Row 7: Economic Pricing Asymmetry -->
      <g transform="translate(0, 192)">
        <rect width="347" height="26" fill="#FAF5FF" stroke="#581C87" stroke-width="1"/>
        <text x="10" y="17" font-size="7.2" font-weight="700" fill="#581C87">Fleet Unit Cost</text>
        <text x="185" y="17" text-anchor="middle" font-size="7.2" font-weight="700" fill="#991B1B">3×..5× / token</text>
        <text x="285" y="17" text-anchor="middle" font-size="7.2" font-weight="700" fill="#15803D">1× Baseline</text>
      </g>
    </g>

    <!-- Structural Systems Levers Box -->
    <g transform="translate(14, 268)">
      <rect width="347" height="152" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
      <rect width="347" height="20" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1"/>
      <text x="10" y="14" font-size="7.5" font-weight="700" fill="#0F172A">SYSTEMS ARCHITECTURAL MITIGATIONS (CH 05, 11, 17):</text>

      <g transform="translate(10, 28)">
        <text x="0" y="10" font-size="7.2" font-weight="700" fill="#581C87">1. Paged Attention &amp; Continuous Batching (Ch 05):</text>
        <text x="12" y="22" font-size="7.0" fill="#334155">Eliminates external fragmentation to maximize batch B,</text>
        <text x="12" y="32" font-size="7.0" fill="#64748B">sharing weight reads across concurrent streams (I ∝ B).</text>
      </g>

      <g transform="translate(10, 68)">
        <text x="0" y="10" font-size="7.2" font-weight="700" fill="#0369A1">2. Speculative &amp; Medusa Decoding (Ch 17):</text>
        <text x="12" y="22" font-size="7.0" fill="#334155">Emits K candidate tokens per memory step;</text>
        <text x="12" y="32" font-size="7.0" fill="#64748B">reduces memory trips by acceptance rate E[α · K].</text>
      </g>

      <g transform="translate(10, 108)">
        <text x="0" y="10" font-size="7.2" font-weight="700" fill="#15803D">3. Disaggregated Serving (Split Prefill / Decode):</text>
        <text x="12" y="22" font-size="7.0" fill="#334155">Separates compute-bound prefill nodes from memory-bound</text>
        <text x="12" y="32" font-size="7.0" fill="#64748B">decode pools, eliminating cross-engine HOL blocking.</text>
      </g>
    </g>
  </g>
</svg>