<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="600" fill="#ffffff"/>
  <g transform="translate(0, -40)">



  <!-- ========================================================================= -->
  <!-- PANEL 1: TRADITIONAL AI (Stateless Request-Response)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="800" height="180" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="800" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#334155">1. TRADITIONAL AI: STATELESS REQUEST-RESPONSE</text>

    <rect x="670" y="4" width="120" height="16" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="730" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">Open-Loop Inference</text>

    <!-- Pipeline Flow -->
    <!-- Input Box -->
    <g transform="translate(40, 42)">
      <rect width="120" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Input</text>
      <text x="60" y="35" text-anchor="middle" font-size="7.5" fill="#64748b">User Prompt / Query</text>
    </g>

    <!-- Arrow Input -> Model -->
    <line x1="160" y1="65" x2="280" y2="65" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
    <text x="220" y="57" text-anchor="middle" font-size="7.5" fill="#64748b">Prompt Tokens</text>

    <!-- Model Box -->
    <g transform="translate(280, 36)">
      <rect width="190" height="58" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="95" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369a1">Foundation Model</text>
      <text x="95" y="43" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">Forward Pass / KV Cache</text>
    </g>

    <!-- Arrow Model -> Output -->
    <line x1="470" y1="65" x2="590" y2="65" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
    <text x="530" y="57" text-anchor="middle" font-size="7.5" fill="#64748b">Completion Tokens</text>

    <!-- Output Box -->
    <g transform="translate(590, 42)">
      <rect width="120" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Output</text>
      <text x="60" y="35" text-anchor="middle" font-size="7.5" fill="#64748b">Text Stream / JSON</text>
    </g>

    <!-- Optimization Callout Bracket below Model -->
    <g transform="translate(255, 110)">
      <line x1="120" y1="-16" x2="120" y2="0" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="240" height="48" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="120" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">OPTIMIZE THIS (Micro-Efficiency)</text>
      <text x="120" y="35" text-anchor="middle" font-size="8" font-family="Courier, monospace" font-weight="700" fill="#0284c7">FLOPs / token  •  joules / token</text>
    </g>

    <!-- Descriptive Notes on right -->
    <g transform="translate(535, 114)">
      <text x="0" y="16" font-size="7.5" fill="#475569">• Single forward pass; volatile activation reclamation</text>
      <text x="0" y="30" font-size="7.5" fill="#475569">• Zero persistent environment state or self-correction</text>
      <text x="0" y="44" font-size="7.5" fill="#64748b">• Local objective: Minimize TTFT and token generation latency</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: AGENTIC AI (Closed-Loop Trajectory Execution)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 268)">
    <rect width="800" height="332" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="800" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">2. AGENTIC AI: CLOSED-LOOP TRAJECTORY EXECUTION</text>

    <rect x="655" y="4" width="135" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="722" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Stateful Feedback System</text>

    <!-- Overarching Foundation Model Backbone Box -->
    <g transform="translate(165, 34)">
      <rect width="470" height="28" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="235" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Neural Foundation Model Backbone (Cognitive Policy Engine)</text>

      <!-- Downward connector lines to sub-components -->
      <line x1="60" y1="28" x2="60" y2="42" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <line x1="215" y1="28" x2="215" y2="42" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <line x1="375" y1="28" x2="375" y2="42" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    </g>

    <!-- Subsystem Nodes Row 1 -->
    <!-- Input Goal -->
    <g transform="translate(20, 78)">
      <rect width="95" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="47" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Input Goal</text>
      <text x="47" y="35" text-anchor="middle" font-size="7.5" fill="#64748b">User Objective</text>
    </g>

    <!-- Arrow Input -> Planner -->
    <line x1="115" y1="101" x2="165" y2="101" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Planner Node -->
    <g transform="translate(165, 78)">
      <rect width="110" height="46" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="55" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Planner</text>
      <text x="55" y="35" text-anchor="middle" font-size="7.5" fill="#7c3aed">Decomposition</text>
    </g>

    <!-- Arrow Planner -> Retrieval -->
    <line x1="275" y1="101" x2="320" y2="101" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Retrieval Node -->
    <g transform="translate(320, 78)">
      <rect width="120" height="46" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="60" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Retrieval</text>
      <text x="60" y="35" text-anchor="middle" font-size="7.5" fill="#7c3aed">Context &amp; Memory</text>
    </g>

    <!-- Arrow Retrieval -> Tool -->
    <line x1="440" y1="101" x2="480" y2="101" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Tool Execution Node -->
    <g transform="translate(480, 78)">
      <rect width="120" height="46" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="60" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Tool / Action</text>
      <text x="60" y="35" text-anchor="middle" font-size="7.5" fill="#d97706">Sandbox &amp; POSIX</text>
    </g>

    <!-- Row 2: Verification Node -->
    <!-- Downward arrows into Verification -->
    <path d="M 380,124 L 380,150 L 450,150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <line x1="540" y1="124" x2="540" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <g transform="translate(450, 148)">
      <rect width="170" height="48" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="85" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Verification Oracle</text>
      <text x="85" y="36" text-anchor="middle" font-size="7.5" fill="#16a34a">Compilers, Linters &amp; Tests</text>
    </g>

    <!-- Arrow Verification -> Output (Terminal Success) -->
    <line x1="620" y1="172" x2="695" y2="172" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
    <rect x="625" y="156" width="60" height="15" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="655" y="167" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">PASS / OK</text>

    <!-- Terminal Output Node -->
    <g transform="translate(695, 148)">
      <rect width="90" height="48" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
      <text x="45" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Output</text>
      <text x="45" y="36" text-anchor="middle" font-size="7.5" fill="#16a34a">Certified Goal</text>
    </g>

    <!-- Closed-Loop Feedback Path (Verification -> Planner on Retry / Incomplete) -->
    <path d="M 450,172 L 220,172 L 220,126" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

    <!-- Badge on Feedback Path -->
    <rect x="245" y="180" width="180" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="335" y="192" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#991b1b">RETRY / REPLAN FEEDBACK LOOP</text>

    <!-- Optimization Callout for the Whole Loop -->
    <g transform="translate(100, 245)">
      <rect width="600" height="62" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
      <text x="300" y="27" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">OPTIMIZE THIS WHOLE LOOP (Macro-Efficiency)</text>
      <text x="300" y="47" text-anchor="middle" font-size="8.5" font-family="Courier, monospace" font-weight="700" fill="#16a34a">joules / useful task  •  cost / resolved goal  •  Trajectory Goodput</text>
    </g>
  </g>
</g>
</svg>