<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Clean Canvas -->
  <rect width="1100" height="560" fill="#ffffff" />

  <!-- MAIN CONTAINER CARD -->
  <g transform="translate(20, 16)">
    <rect width="1060" height="528" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1060" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#0f172a" letter-spacing="0.2">ARCHITECTURAL AUTONOMY SPECTRUM: 6-DIMENSIONAL SYSTEMS TRADE-OFFS</text>
    <text x="1044" y="21" font-size="9.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Flexibility vs. Cost &amp; Determinism</text>

    <!-- LEFT PANEL: RADAR CHART (y=44..510, width=470) -->
    <g transform="translate(16, 44)">
      <rect width="460" height="466" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect width="460" height="22" rx="3" fill="#f8fafc" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">6-DIMENSIONAL CAPABILITY &amp; RESOURCE PROFILE</text>

      <!-- Radar Web Center: (230, 240), R=130 -->
      <!-- Angles: Axis 1: -90 (top), Axis 2: -30 (top-right), Axis 3: +30 (bottom-right), Axis 4: +90 (bottom), Axis 5: +150 (bottom-left), Axis 6: +210 (top-left) -->
      <!-- For R=130:
           Axis 1 (x, y): (230, 240 - R) = (230, 110)
           Axis 2 (x, y): (230 + R*cos(30), 240 - R*sin(30)) = (230 + 130*0.866, 240 - 130*0.5) = (342.6, 175)
           Axis 3 (x, y): (230 + R*cos(30), 240 + R*sin(30)) = (342.6, 305)
           Axis 4 (x, y): (230, 240 + R) = (230, 370)
           Axis 5 (x, y): (230 - R*cos(30), 240 + R*sin(30)) = (117.4, 305)
           Axis 6 (x, y): (230 - R*cos(30), 240 - R*sin(30)) = (117.4, 175)
      -->
      <g transform="translate(0, 0)">
        <!-- Grid Ring 1 (r=26, 20%) -->
        <polygon points="230,214 252.5,227 252.5,253 230,266 207.5,253 207.5,227" fill="none" stroke="#f1f5f9" stroke-width="1" />
        <!-- Grid Ring 2 (r=52, 40%) -->
        <polygon points="230,188 275.0,214 275.0,266 230,292 185.0,266 185.0,214" fill="none" stroke="#e2e8f0" stroke-width="1" />
        <!-- Grid Ring 3 (r=78, 60%) -->
        <polygon points="230,162 297.5,201 297.5,279 230,318 162.5,279 162.5,201" fill="none" stroke="#e2e8f0" stroke-width="1" />
        <!-- Grid Ring 4 (r=104, 80%) -->
        <polygon points="230,136 320.1,188 320.1,292 230,344 139.9,292 139.9,188" fill="none" stroke="#e2e8f0" stroke-width="1" />
        <!-- Grid Ring 5 (r=130, 100%) -->
        <polygon points="230,110 342.6,175 342.6,305 230,370 117.4,305 117.4,175" fill="none" stroke="#cbd5e1" stroke-width="1.2" />

        <!-- Radial Spokes -->
        <line x1="230" y1="240" x2="230" y2="110" stroke="#cbd5e1" stroke-width="1" />
        <line x1="230" y1="240" x2="342.6" y2="175" stroke="#cbd5e1" stroke-width="1" />
        <line x1="230" y1="240" x2="342.6" y2="305" stroke="#cbd5e1" stroke-width="1" />
        <line x1="230" y1="240" x2="230" y2="370" stroke="#cbd5e1" stroke-width="1" />
        <line x1="230" y1="240" x2="117.4" y2="305" stroke="#cbd5e1" stroke-width="1" />
        <line x1="230" y1="240" x2="117.4" y2="175" stroke="#cbd5e1" stroke-width="1" />

        <!-- Axis Labels -->
        <!-- Axis 1 (Top) -->
        <text x="230" y="88" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Problem Flexibility</text>
        <text x="230" y="99" font-size="7.5" fill="#64748b" text-anchor="middle">&amp; Epistemic Reach</text>

        <!-- Axis 2 (Top-Right) -->
        <text x="352" y="166" font-size="8.5" font-weight="700" fill="#0f172a">Execution Speed</text>
        <text x="352" y="177" font-size="7.5" fill="#64748b">(Low Latency)</text>

        <!-- Axis 3 (Bottom-Right) -->
        <text x="352" y="306" font-size="8.5" font-weight="700" fill="#0f172a">Financial Predictability</text>
        <text x="352" y="317" font-size="7.5" fill="#64748b">(Low Marginal Cost)</text>

        <!-- Axis 4 (Bottom) -->
        <text x="230" y="386" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Operational Determinism</text>
        <text x="230" y="397" font-size="7.5" fill="#64748b" text-anchor="middle">(Bitwise Repeatability)</text>

        <!-- Axis 5 (Bottom-Left) -->
        <text x="108" y="306" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="end">Verification Simplicity</text>
        <text x="108" y="317" font-size="7.5" fill="#64748b" text-anchor="end">(Static / Compile Gates)</text>

        <!-- Axis 6 (Top-Left) -->
        <text x="108" y="166" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="end">Safety &amp; Control</text>
        <text x="108" y="177" font-size="7.5" fill="#64748b" text-anchor="end">(Low Blast Radius)</text>

        <!-- DATA POLYGON 1: Software 1.0 (Procedural) - Green -->
        <!-- Scores: Flex: 0.10 (r=13), Speed: 1.0 (r=130), Cost: 1.0 (r=130), Det: 1.0 (r=130), Ver: 1.0 (r=130), Safe: 0.95 (r=123.5) -->
        <!-- Points:
             Ax1: (230, 227)
             Ax2: (342.6, 175)
             Ax3: (342.6, 305)
             Ax4: (230, 370)
             Ax5: (117.4, 305)
             Ax6: (123.1, 178.3)
        -->
        <polygon points="230,227 342.6,175 342.6,305 230,370 117.4,305 123.1,178.3" fill="#10b981" fill-opacity="0.15" stroke="#059669" stroke-width="2" />

        <!-- DATA POLYGON 2: Software 2.0 (Direct Model) - Blue -->
        <!-- Scores: Flex: 0.45 (r=58.5), Speed: 0.75 (r=97.5), Cost: 0.80 (r=104), Det: 0.70 (r=91), Ver: 0.70 (r=91), Safe: 0.75 (r=97.5) -->
        <!-- Points:
             Ax1: (230, 181.5)
             Ax2: (230 + 97.5*0.866, 240 - 97.5*0.5) = (314.4, 191.3)
             Ax3: (230 + 104*0.866, 240 + 104*0.5) = (320.1, 292.0)
             Ax4: (230, 331.0)
             Ax5: (230 - 91*0.866, 240 + 91*0.5) = (151.2, 285.5)
             Ax6: (230 - 97.5*0.866, 240 - 97.5*0.5) = (145.6, 191.3)
        -->
        <polygon points="230,181.5 314.4,191.3 320.1,292.0 230,331.0 151.2,285.5 145.6,191.3" fill="#3b82f6" fill-opacity="0.15" stroke="#2563eb" stroke-width="2" />

        <!-- DATA POLYGON 3: Bounded Agentic (Amber) -->
        <!-- Scores: Flex: 0.80 (r=104), Speed: 0.40 (r=52), Cost: 0.50 (r=65), Det: 0.55 (r=71.5), Ver: 0.50 (r=65), Safe: 0.60 (r=78) -->
        <!-- Points:
             Ax1: (230, 136)
             Ax2: (230 + 52*0.866, 240 - 26) = (275.0, 214)
             Ax3: (230 + 65*0.866, 240 + 32.5) = (286.3, 272.5)
             Ax4: (230, 311.5)
             Ax5: (230 - 65*0.866, 240 + 32.5) = (173.7, 272.5)
             Ax6: (230 - 78*0.866, 240 - 39) = (162.5, 201)
        -->
        <polygon points="230,136 275.0,214 286.3,272.5 230,311.5 173.7,272.5 162.5,201" fill="#f59e0b" fill-opacity="0.18" stroke="#d97706" stroke-width="2" />

        <!-- DATA POLYGON 4: Autonomous Fleet (Red) -->
        <!-- Scores: Flex: 0.98 (r=127.4), Speed: 0.15 (r=19.5), Cost: 0.15 (r=19.5), Det: 0.20 (r=26), Ver: 0.20 (r=26), Safe: 0.25 (r=32.5) -->
        <!-- Points:
             Ax1: (230, 112.6)
             Ax2: (230 + 19.5*0.866, 240 - 9.8) = (246.9, 230.2)
             Ax3: (230 + 19.5*0.866, 240 + 9.8) = (246.9, 249.8)
             Ax4: (230, 266.0)
             Ax5: (230 - 26*0.866, 240 + 13) = (207.5, 253.0)
             Ax6: (230 - 32.5*0.866, 240 - 16.3) = (201.9, 223.7)
        -->
        <polygon points="230,112.6 246.9,230.2 246.9,249.8 230,266.0 207.5,253.0 201.9,223.7" fill="#ef4444" fill-opacity="0.2" stroke="#dc2626" stroke-width="2" />
      </g>

      <!-- Compact Legend Card (Bottom-Left) -->
      <g transform="translate(14, 412)">
        <rect width="432" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
        <g transform="translate(10, 12)">
          <!-- Item 1: SW 1.0 -->
          <line x1="0" y1="8" x2="16" y2="8" stroke="#059669" stroke-width="2.5" />
          <text x="22" y="11" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#065f46">Software 1.0</text>

          <!-- Item 2: SW 2.0 -->
          <line x1="110" y1="8" x2="126" y2="8" stroke="#2563eb" stroke-width="2.5" />
          <text x="132" y="11" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af">Software 2.0</text>

          <!-- Item 3: Bounded -->
          <line x1="218" y1="8" x2="234" y2="8" stroke="#d97706" stroke-width="2.5" />
          <text x="240" y="11" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#92400e">Bounded Agent</text>

          <!-- Item 4: Fleet -->
          <line x1="332" y1="8" x2="348" y2="8" stroke="#dc2626" stroke-width="2.5" />
          <text x="354" y="11" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#991b1b">Multi-Agent</text>
        </g>
        <text x="216" y="34" font-size="7" fill="#64748b" text-anchor="middle">Outer boundary represents optimal operating score (1.0) along each system dimension</text>
      </g>
    </g>

    <!-- RIGHT PANEL: ARCHITECTURAL SYSTEMS COMPARISON MATRIX (y=44..510, width=548) -->
    <g transform="translate(492, 44)">
      <rect width="552" height="466" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect width="552" height="22" rx="3" fill="#f8fafc" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">SYSTEMS SELECTION MATRIX ACROSS THE AUTONOMY SPECTRUM</text>
      <text x="540" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Production Engineering Rubric</text>

      <!-- 4 Paradigm Cards -->
      <g transform="translate(12, 30)">
        <!-- 1. Software 1.0 -->
        <g transform="translate(0, 0)">
          <rect width="528" height="96" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
          <rect width="528" height="20" rx="2" fill="#dcfce7" />
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#166534">SOFTWARE 1.0: DETERMINISTIC PROCEDURAL CODE</text>
          <text x="518" y="14" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="end">BASELINE SYSTEM</text>

          <g transform="translate(10, 28)">
            <text x="0" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#15803d">Latency: μs – ms</text>
            <text x="130" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#15803d">Cost: $0.00 / call</text>
            <text x="270" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#15803d">Determinism: 100% Bitwise Repeatable</text>

            <text x="0" y="28" font-size="7.5" fill="#334155"><tspan font-weight="700">Verification Gate:</tspan> Static compiler assertions, relational schemas, AST type checkers.</text>
            <text x="0" y="42" font-size="7.5" fill="#334155"><tspan font-weight="700">Production Rule:</tspan> Default for structured, rule-bound tasks; zero natural-language handling.</text>
            <text x="0" y="56" font-size="7.5" font-family="'SF Mono', monospace" fill="#047857">Target Workloads: SQL parsers, financial ledgers, static code linters, AST transforms.</text>
          </g>
        </g>

        <!-- 2. Software 2.0 -->
        <g transform="translate(0, 104)">
          <rect width="528" height="96" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
          <rect width="528" height="20" rx="2" fill="#dbeafe" />
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#1e40af">SOFTWARE 2.0: DIRECT SINGLE-SHOT MODEL INVOCATION</text>
          <text x="518" y="14" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af" text-anchor="end">UNSTRUCTURED PERCEPTION</text>

          <g transform="translate(10, 28)">
            <text x="0" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#1d4ed8">Latency: 100 ms – 2 s</text>
            <text x="145" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#1d4ed8">Cost: $10^-5 – $10^-3</text>
            <text x="290" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#1d4ed8">Determinism: Bounded (Logit Masking)</text>

            <text x="0" y="28" font-size="7.5" fill="#334155"><tspan font-weight="700">Verification Gate:</tspan> Constrained grammar decoding, regex masks, JSON validation.</text>
            <text x="0" y="42" font-size="7.5" fill="#334155"><tspan font-weight="700">Production Rule:</tspan> Single-turn perceptual / translation steps; zero autonomous tool loop.</text>
            <text x="0" y="56" font-size="7.5" font-family="'SF Mono', monospace" fill="#1e40af">Target Workloads: Sentiment analysis, entity classification, docstring summarization.</text>
          </g>
        </g>

        <!-- 3. Bounded Agentic Workflow -->
        <g transform="translate(0, 208)">
          <rect width="528" height="106" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
          <rect width="528" height="20" rx="2" fill="#fef3c7" />
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#92400e">BOUNDED AGENTIC WORKFLOW (K ≤ K_max, ZERO AMBIENT AUTHORITY)</text>
          <text x="518" y="14" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#b45309" text-anchor="end">SYSTEMS SWEET SPOT</text>

          <g transform="translate(10, 28)">
            <text x="0" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#b45309">Latency: 5 s – 120 s</text>
            <text x="145" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#b45309">Cost: $0.01 – $0.50</text>
            <text x="290" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#b45309">Invariants: Hard Step Limit K_max</text>

            <text x="0" y="28" font-size="7.5" fill="#334155"><tspan font-weight="700">Verification Gate:</tspan> Hermetic sandbox test suites, compilers, diff linters, state rollback.</text>
            <text x="0" y="42" font-size="7.5" fill="#334155"><tspan font-weight="700">Production Rule:</tspan> Multi-turn self-correction anchored by deterministic verifiers; zero ambient tokens.</text>
            <text x="0" y="56" font-size="7.5" fill="#334155"><tspan font-weight="700">Safety Policy:</tspan> Authority A=0; isolated container execution with copy-on-write snapshots.</text>
            <text x="0" y="70" font-size="7.5" font-family="'SF Mono', monospace" fill="#78350f">Target Workloads: Automated bug fixing, regression patching, API integrations, CI repair.</text>
          </g>
        </g>

        <!-- 4. Autonomous Fleet -->
        <g transform="translate(0, 322)">
          <rect width="528" height="102" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
          <rect width="528" height="20" rx="2" fill="#fee2e2" />
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#991b1b">AUTONOMOUS MULTI-AGENT FLEET (EMERGENT TOPOLOGY)</text>
          <text x="518" y="14" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#dc2626" text-anchor="end">MECHANISM OF LAST RESORT</text>

          <g transform="translate(10, 28)">
            <text x="0" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#dc2626">Latency: Minutes – Hours</text>
            <text x="165" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#dc2626">Cost: $1.00 – $50.00+</text>
            <text x="310" y="12" font-size="8" font-family="'SF Mono', monospace" fill="#dc2626">Blast Radius: Critical</text>

            <text x="0" y="28" font-size="7.5" fill="#334155"><tspan font-weight="700">Verification Gate:</tspan> Multi-stage escrow ledgers, consensus oracles, human supervisor triage.</text>
            <text x="0" y="42" font-size="7.5" fill="#334155"><tspan font-weight="700">Production Rule:</tspan> Required only for vast search spaces under high epistemic ambiguity.</text>
            <text x="0" y="56" font-size="7.5" fill="#334155"><tspan font-weight="700">Fiscal Governance:</tspan> Mandatory hierarchical budget reservations, circuit breakers, and rate limiters.</text>
            <text x="0" y="68" font-size="7.5" font-family="'SF Mono', monospace" fill="#991b1b">Target Workloads: Greenfield codebase synthesis, automated red-teaming, open-ended research.</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>