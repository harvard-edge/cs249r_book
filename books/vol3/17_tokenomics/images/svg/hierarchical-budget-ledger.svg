<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1100" height="560" fill="#ffffff" />

  <!-- MAIN CONTAINER CARD -->
  <g transform="translate(20, 16)">
    <rect width="1060" height="528" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1060" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#0f172a" letter-spacing="0.2">HIERARCHICAL BUDGET RESERVATION LEDGER PROTOCOL</text>
    <text x="1044" y="21" font-size="9.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Conservation Invariant: B = E + R + F</text>

    <!-- SECTION 1: ROOT AGENT INITIAL LEDGER (y=44..156) -->
    <g transform="translate(16, 44)">
      <rect width="1028" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect width="1028" height="22" rx="3" fill="#eff6ff" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#1e40af">ROOT AGENT LEDGER (INITIAL DISPATCH): L_root = &#9001; Budget B, Settled E, Escrow R, Free F &#9002;</text>
      <text x="1016" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#1e40af" text-anchor="end">Escrow Partitioning Phase</text>

      <!-- 4 State Cards -->
      <g transform="translate(12, 30)">
        <!-- Budget B -->
        <g transform="translate(0, 0)">
          <rect width="238" height="66" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
          <text x="10" y="16" font-size="8.5" font-weight="600" fill="#475569">Allocated Budget (B_root)</text>
          <text x="10" y="38" font-size="16" font-family="'SF Mono', monospace" font-weight="700" fill="#0f172a">$10.00</text>
          <text x="10" y="54" font-size="8" fill="#64748b">Hard spending ceiling for task</text>
        </g>

        <!-- Settled Spend E -->
        <g transform="translate(254, 0)">
          <rect width="238" height="66" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8" />
          <text x="10" y="16" font-size="8.5" font-weight="600" fill="#991b1b">Settled Spend (E_root)</text>
          <text x="10" y="38" font-size="16" font-family="'SF Mono', monospace" font-weight="700" fill="#dc2626">$0.40</text>
          <text x="10" y="54" font-size="8" fill="#64748b">Root planning &amp; supervisor turns</text>
        </g>

        <!-- Active Escrow R -->
        <g transform="translate(508, 0)">
          <rect width="238" height="66" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8" />
          <text x="10" y="16" font-size="8.5" font-weight="600" fill="#1e40af">Active Escrow (R_root)</text>
          <text x="10" y="38" font-size="16" font-family="'SF Mono', monospace" font-weight="700" fill="#2563eb">$6.00</text>
          <text x="10" y="54" font-size="8" fill="#64748b">Committed: Subagent 1 ($2) + 2 ($4)</text>
        </g>

        <!-- Free Balance F -->
        <g transform="translate(762, 0)">
          <rect width="242" height="66" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
          <text x="10" y="16" font-size="8.5" font-weight="600" fill="#166534">Free Capital (F_root)</text>
          <text x="10" y="38" font-size="16" font-family="'SF Mono', monospace" font-weight="700" fill="#16a34a">$3.60</text>
          <text x="10" y="54" font-size="8" fill="#64748b">Available for fallback delegation</text>
        </g>
      </g>
    </g>

    <!-- DELEGATION ARROWS (Down to Children) -->
    <g transform="translate(16, 154)">
      <!-- Left Delegation Arrow -->
      <line x1="250" y1="0" x2="250" y2="28" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
      <rect x="155" y="6" width="190" height="16" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8" />
      <text x="250" y="17" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af" text-anchor="middle">Delegate Escrow: B_1 = $2.00</text>

      <!-- Right Delegation Arrow -->
      <line x1="778" y1="0" x2="778" y2="28" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
      <rect x="683" y="6" width="190" height="16" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8" />
      <text x="778" y="17" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af" text-anchor="middle">Delegate Escrow: B_2 = $4.00</text>
    </g>

    <!-- SECTION 2: CONCURRENT SUBAGENT LEDGERS (y=182..332) -->
    <g transform="translate(16, 182)">
      <!-- CHILD 1: SEARCH SUBAGENT -->
      <g transform="translate(0, 0)">
        <rect width="506" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <rect width="506" height="22" rx="3" fill="#f8fafc" />
        <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">SUBAGENT 1: REPOSITORY SEARCHER (B_1 = $2.00)</text>
        <text x="494" y="15" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="end">STATUS: TERMINATED</text>

        <!-- Subagent 1 Details -->
        <g transform="translate(12, 30)">
          <!-- Row 1: Execution & Spend -->
          <rect width="482" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="10" y="16" font-size="8" font-family="'SF Mono', monospace" fill="#475569">Settled Spend: E_1 = $0.50 (15 Vector queries + 2 SLM parses)</text>
          <text x="10" y="30" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">Unexpended Balance: F_1 = B_1 - E_1 = $2.00 - $0.50 = $1.50</text>

          <!-- Row 2: Refund Action Box -->
          <g transform="translate(0, 46)">
            <rect width="482" height="36" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
            <text x="10" y="15" font-size="8" font-weight="700" fill="#166534">TERMINAL REFUND DISPATCH:</text>
            <text x="10" y="28" font-size="7.5" font-family="'SF Mono', monospace" fill="#15803d">Releases $1.50 unexpended reservation upward to Parent Free Capital (F_root)</text>
          </g>

          <text x="0" y="98" font-size="7.5" fill="#64748b">Local Draw Guarantee: Child draws strictly from local escrow; cannot overdraw root ledger.</text>
        </g>
      </g>

      <!-- CHILD 2: SYNTHESIZER SUBAGENT -->
      <g transform="translate(522, 0)">
        <rect width="506" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <rect width="506" height="22" rx="3" fill="#f8fafc" />
        <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">SUBAGENT 2: CODE PATCH SYNTHESIZER (B_2 = $4.00)</text>
        <text x="494" y="15" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="end">STATUS: TERMINATED</text>

        <!-- Subagent 2 Details -->
        <g transform="translate(12, 30)">
          <!-- Row 1: Execution & Spend -->
          <rect width="482" height="38" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="10" y="16" font-size="8" font-family="'SF Mono', monospace" fill="#475569">Settled Spend: E_2 = $3.10 (4 Model turns + 2 Compiler runs)</text>
          <text x="10" y="30" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">Unexpended Balance: F_2 = B_2 - E_2 = $4.00 - $3.10 = $0.90</text>

          <!-- Row 2: Refund Action Box -->
          <g transform="translate(0, 46)">
            <rect width="482" height="36" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
            <text x="10" y="15" font-size="8" font-weight="700" fill="#166534">TERMINAL REFUND DISPATCH:</text>
            <text x="10" y="28" font-size="7.5" font-family="'SF Mono', monospace" fill="#15803d">Releases $0.90 unexpended reservation upward to Parent Free Capital (F_root)</text>
          </g>

          <text x="0" y="98" font-size="7.5" fill="#64748b">Circuit Breaker Policy: Trajectory aborts if burn velocity exceeds threshold &#952; = $1.50/min.</text>
        </g>
      </g>
    </g>

    <!-- REFUND ARROWS (Upward back to Reconciled Root) -->
    <g transform="translate(16, 332)">
      <!-- Left Refund Arrow -->
      <line x1="250" y1="0" x2="250" y2="28" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)" />
      <rect x="155" y="6" width="190" height="16" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
      <text x="250" y="17" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="middle">Refund Unused: F_1 = $1.50</text>

      <!-- Right Refund Arrow -->
      <line x1="778" y1="0" x2="778" y2="28" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)" />
      <rect x="683" y="6" width="190" height="16" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
      <text x="778" y="17" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="middle">Refund Unused: F_2 = $0.90</text>
    </g>

    <!-- SECTION 3: RECONCILED ROOT LEDGER AT TERMINATION (y=360..510) -->
    <g transform="translate(16, 360)">
      <rect width="1028" height="148" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect width="1028" height="22" rx="3" fill="#f1f5f9" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">RECONCILED ROOT LEDGER &amp; TERMINAL SETTLEMENT: L_root* = &#9001; $10.00, $4.00, $0.00, $6.00 &#9002;</text>
      <text x="1016" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#166534" font-weight="700" text-anchor="end">Terminal Verification Commit</text>

      <!-- Split Left (Accounting) and Right (Guarantees) -->
      <g transform="translate(12, 30)">
        <!-- Left: Financial Reconciliation Waterfall -->
        <g transform="translate(0, 0)">
          <rect width="490" height="106" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
          <text x="12" y="18" font-size="8.5" font-weight="700" fill="#1e40af">FINAL SETTLED ACCOUNTING WATERFALL</text>
          
          <text x="12" y="36" font-size="8" font-family="'SF Mono', monospace" fill="#334155">&#8226; Direct Root Execution Spend:  E_root  = $0.40</text>
          <text x="12" y="50" font-size="8" font-family="'SF Mono', monospace" fill="#334155">&#8226; Subagent 1 Settled Spend:     E_1     = $0.50</text>
          <text x="12" y="64" font-size="8" font-family="'SF Mono', monospace" fill="#334155">&#8226; Subagent 2 Settled Spend:     E_2     = $3.10</text>
          
          <line x1="12" y1="72" x2="470" y2="72" stroke="#e2e8f0" stroke-width="1" />
          
          <text x="12" y="86" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#dc2626">&#8226; Total Settled Spend:          E_final = $4.00 (40.0% of budget)</text>
          <text x="12" y="99" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">&#8226; Restored Tenant Free Capital: F_final = $6.00 (Zero Leakage)</text>
        </g>

        <!-- Right: Formal Protocol Guarantees -->
        <g transform="translate(506, 0)">
          <rect width="500" height="106" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
          <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">DISTRIBUTED FINANCIAL GOVERNANCE GUARANTEES</text>

          <g transform="translate(12, 30)">
            <text x="0" y="10" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af">1. Monotonicity Invariant:</text>
            <text x="195" y="10" font-size="8" fill="#475569">Settled spend E(t) is strictly non-decreasing (dE/dt &#8805; 0).</text>

            <text x="0" y="28" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af">2. Non-Overlapping Escrows:</text>
            <text x="195" y="28" font-size="8" fill="#475569">&#8721; R_child &#8804; R_parent prevents concurrent overdraws.</text>

            <text x="0" y="46" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af">3. Deterministic Tripwires:</text>
            <text x="195" y="46" font-size="8" fill="#475569">Traps OutOfBudgetException instantly if F_k &lt; C_min.</text>

            <text x="0" y="64" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">4. Upward Conservation:</text>
            <text x="195" y="64" font-size="8" fill="#475569">All unexpended reservations atomically return to parent.</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>