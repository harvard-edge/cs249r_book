<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 505" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="505" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM INVARIANT                                         -->
  <!-- ================================================================= -->

  <!-- ================================================================= -->
  <!-- MAIN CASCADE FLOW: 3 TIERS WITH VERIFICATION GATES                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="1070" height="315" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="1070" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#334155">TIERED INFERENCE &amp; ESCALATION PIPELINE</text>
    <text x="845" y="19" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">3-Tier Escalation Topology</text>

    <!-- Ingress Request Box (Far Left) -->
    <g transform="translate(20, 50)">
      <rect x="0" y="35" width="85" height="60" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="42" y="58" font-size="9.5" font-weight="700" fill="#1E293B" text-anchor="middle">Task Request</text>
      <text x="42" y="72" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748B" text-anchor="middle">x ~ Ingress</text>

      <!-- Arrow from Ingress to Tier 1 -->
      <line x1="85" y1="65" x2="115" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
    </g>

    <!-- =============================================================== -->
    <!-- TIER 1: SMALL / DETERMINISTIC MODEL (1B - 3B)                   -->
    <!-- =============================================================== -->
    <g transform="translate(135, 50)">
      <!-- Tier 1 Container -->
      <rect x="0" y="0" width="265" height="150" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.3"/>
      <rect x="0" y="0" width="265" height="24" rx="4" fill="#F3E8FF" stroke="#581C87" stroke-width="1.3"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#581C87">TIER 1: SLM / DETERMINISTIC LINTER</text>
      <text x="210" y="16" font-size="8" font-family="'SF Mono', monospace" fill="#6B21A8">1B - 3B</text>

      <!-- Model specs -->
      <text x="12" y="42" font-size="8.5" font-weight="700" fill="#334155">M_small ($0.05 / 1M tokens | ~25 ms)</text>
      <text x="12" y="56" font-size="8" fill="#64748B">Regex schemas, AST linters, input sanitization</text>

      <!-- Gate 1: Confidence / Syntax Verifier -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="241" height="66" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#581C87">Verification Gate V_1(y_1) >= theta_1</text>
        <text x="10" y="32" font-size="8" fill="#475569">Checks strict JSON syntax &amp; confidence threshold</text>

        <!-- Exit branch if Valid (Downward) -->
        <g transform="translate(10, 42)">
          <rect x="0" y="0" width="105" height="18" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
          <text x="52" y="13" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">PASS (65% Exit)</text>
        </g>
        <g transform="translate(125, 42)">
          <rect x="0" y="0" width="105" height="18" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="0.8"/>
          <text x="52" y="13" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">FAIL (35% Escalate)</text>
        </g>
      </g>
    </g>

    <!-- Downward Exit Line from Tier 1 to Committed Output -->
    <path d="M 197 190 L 197 250 L 980 250" fill="none" stroke="#166534" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
    <text x="210" y="240" font-size="8" font-weight="700" fill="#166534">Fast Exit ($0.00005)</text>

    <!-- Escalation Line from Tier 1 to Tier 2 -->
    <line x1="400" y1="140" x2="445" y2="140" stroke="#991B1B" stroke-width="2" marker-end="url(#arr-red)"/>
    <rect x="408" y="125" width="28" height="14" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="0.8"/>
    <text x="422" y="135" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">fail_1</text>

    <!-- =============================================================== -->
    <!-- TIER 2: MID-TIER GENERALIST (8B - 14B)                          -->
    <!-- =============================================================== -->
    <g transform="translate(450, 50)">
      <!-- Tier 2 Container -->
      <rect x="0" y="0" width="270" height="150" rx="4" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.3"/>
      <rect x="0" y="0" width="270" height="24" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.3"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0F766E">TIER 2: MID-TIER GENERALIST</text>
      <text x="215" y="16" font-size="8" font-family="'SF Mono', monospace" fill="#0F766E">8B - 14B</text>

      <!-- Model specs -->
      <text x="12" y="42" font-size="8.5" font-weight="700" fill="#334155">M_mid ($0.40 / 1M tokens | ~180 ms)</text>
      <text x="12" y="56" font-size="8" fill="#64748B">Routine tool dispatch, code generation, summarization</text>

      <!-- Gate 2: Compiler & Test Verifier -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="246" height="66" rx="3" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0F766E">Verification Gate V_2(y_2) >= theta_2</text>
        <text x="10" y="32" font-size="8" fill="#475569">Executes fast unit tests &amp; linter assertions</text>

        <!-- Exit branch if Valid (Downward) -->
        <g transform="translate(10, 42)">
          <rect x="0" y="0" width="105" height="18" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
          <text x="52" y="13" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">PASS (80% Exit)</text>
        </g>
        <g transform="translate(130, 42)">
          <rect x="0" y="0" width="105" height="18" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="0.8"/>
          <text x="52" y="13" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">FAIL (20% Escalate)</text>
        </g>
      </g>
    </g>

    <!-- Downward Exit Line from Tier 2 to Committed Output -->
    <path d="M 515 190 L 515 265 L 980 265" fill="none" stroke="#166534" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
    <text x="530" y="260" font-size="8" font-weight="700" fill="#166534">Mid Exit ($0.0004)</text>

    <!-- Escalation Line from Tier 2 to Tier 3 -->
    <line x1="720" y1="140" x2="765" y2="140" stroke="#991B1B" stroke-width="2" marker-end="url(#arr-red)"/>
    <rect x="728" y="125" width="28" height="14" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="0.8"/>
    <text x="742" y="135" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">fail_2</text>

    <!-- =============================================================== -->
    <!-- TIER 3: FRONTIER DELIBERATION ENGINE (Frontier MoE)             -->
    <!-- =============================================================== -->
    <g transform="translate(770, 50)">
      <!-- Tier 3 Container -->
      <rect x="0" y="0" width="275" height="150" rx="4" fill="#FFFBEB" stroke="#92400E" stroke-width="1.3"/>
      <rect x="0" y="0" width="275" height="24" rx="4" fill="#FEF3C7" stroke="#92400E" stroke-width="1.3"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#92400E">TIER 3: FRONTIER REASONING ENGINE</text>
      <text x="215" y="16" font-size="8" font-family="'SF Mono', monospace" fill="#B45309">Frontier</text>

      <!-- Model specs -->
      <text x="12" y="42" font-size="8.5" font-weight="700" fill="#334155">M_large ($15.00 / 1M tokens | ~3,500 ms)</text>
      <text x="12" y="56" font-size="8" fill="#64748B">Test-time MCTS deliberation, subtle fault recovery</text>

      <!-- Gate 3: Final Acceptance Oracle -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="251" height="66" rx="3" fill="#FFFFFF" stroke="#92400E" stroke-width="1"/>
        <text x="10" y="18" font-size="8.5" font-weight="700" fill="#92400E">Final Sandbox Verification Oracle V_3</text>
        <text x="10" y="32" font-size="8" fill="#475569">Full integration test suite &amp; invariant diffs</text>

        <g transform="translate(10, 42)">
          <rect x="0" y="0" width="231" height="18" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="0.8"/>
          <text x="115" y="13" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">Final Certified Commit ($0.015)</text>
        </g>
      </g>
    </g>

    <!-- Downward Line from Tier 3 to Committed Output -->
    <path d="M 907 190 L 907 280 L 980 280" fill="none" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Terminal Committed Output Box (Far Right Bottom) -->
    <g transform="translate(980, 185)">
      <rect x="0" y="0" width="75" height="50" rx="3" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>
      <text x="37" y="22" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">Committed</text>
      <text x="37" y="36" font-size="8" font-family="'SF Mono', monospace" fill="#15803D" text-anchor="middle">Output y*</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM PANEL: QUANTITATIVE ECONOMIC IMPACT SUMMARY                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="1070" height="120" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="1070" height="26" rx="6" fill="#EDE9FE" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="18" font-size="10.5" font-weight="700" fill="#581C87">ECONOMIC AUDIT: UNCONSTRAINED FRONTIER VS. 3-TIER CASCADE ROUTING</text>
    <text x="825" y="18" font-size="9" fill="#6B21A8" font-family="'SF Mono', monospace">Napkin Math: 100k Queries/Day</text>

    <!-- Comparison Columns -->
    <g transform="translate(20, 38)">
      <!-- Option A: Unconstrained Frontier Everywhere -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="490" height="68" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#991B1B">Unconstrained Baseline (100% Frontier Model Invocations):</text>
        <text x="12" y="34" font-size="8.5" fill="#334155">100,000 queries * 1,000 tokens/turn = 100M tokens @ $15.00/1M = $1,500.00 / day ($547,500 / year)</text>
        <text x="12" y="52" font-size="8" font-family="'SF Mono', monospace" fill="#7F1D1D">Average Latency: ~3,500 ms  |  HBM Allocation: Massive KV cache footprint</text>
      </g>

      <!-- Option B: 3-Tier Frugal Cascade -->
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="510" height="68" rx="3" fill="#F0FDF4" stroke="#166534" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#166534">FrugalGPT 3-Tier Cascade (65% Tier 1, 28% Tier 2, 7% Tier 3):</text>
        <text x="12" y="34" font-size="8.5" fill="#15803D">Blended rate: (0.65*$0.05) + (0.28*$0.40) + (0.07*$15.00) = $1.19 / 1M tokens ($119.00 / day)</text>
        <text x="12" y="52" font-size="8" font-family="'SF Mono', monospace" fill="#166534">Cost Reduction: 92.1% ($43,435 / yr vs $547.5k)  |  Average Latency: ~310 ms (11x faster)</text>
      </g>
    </g>
  </g>
</svg>
