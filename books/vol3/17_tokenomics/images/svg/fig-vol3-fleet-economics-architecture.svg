        <!-- Box 1 -->
        <g transform="translate(0, 0)">
          <rect width="314" height="52" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#581c87">Tier 1: SLM &amp; AST Linter (1B&#8211;3B)</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">C_1 = $0.0004 &#183; Schema linting &amp; parsing</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534" font-weight="700">60% Tasks Exit Here (Fast 300 ms)</text>
        </g>
        <!-- Box 2 -->
        <g transform="translate(326, 0)">
          <rect width="314" height="52" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Tier 2: Mid-Tier Generalist (8B&#8211;14B)</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">C_2 = $0.0020 &#183; Code edits &amp; fast tests</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534" font-weight="700">28% Tasks Exit Here (1,500 ms)</text>
