<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1100" height="660" fill="#ffffff" />

  <!-- MAIN CONTAINER CARD -->
  <g transform="translate(20, 16)">
    <rect width="1060" height="628" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1060" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#0f172a" letter-spacing="0.2">FLEET ECONOMICS CONTROL LOOP: FIVE-STAGE PIPELINED ARCHITECTURE</text>
    <text x="1044" y="21" font-size="9.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Closed-Loop Telemetry &amp; Goodput Optimization</text>

    <!-- STAGE 1: ADMISSION WORKLOAD PROFILER (y=44..140) -->
    <g transform="translate(56, 44)">
      <rect width="988" height="88" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect width="988" height="20" rx="3" fill="#eff6ff" />
      <text x="10" y="14" font-size="9" font-weight="700" fill="#1e40af">STAGE 1: ADMISSION WORKLOAD PROFILER &amp; ESCROW SIZING</text>
      <text x="978" y="14" font-size="8" font-family="'SF Mono', monospace" fill="#1e40af" text-anchor="end">SLA: Latency &lt; 5 ms</text>

      <g transform="translate(10, 26)">
        <!-- Box 1 -->
        <g transform="translate(0, 0)">
          <rect width="314" height="52" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Task Intent &amp; SLA Classifier</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Inspects prompt, deadline SLA, historical prefix tokens</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#2563eb">Partitions: Interactive vs Trajectory vs Batch</text>
        </g>
        <!-- Box 2 -->
        <g transform="translate(326, 0)">
          <rect width="314" height="52" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Resource Reservation Vector</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Calculates token envelope B_max and turn limit K_max</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#475569">Limits: Memory ceiling, sandboxed container class</text>
        </g>
        <!-- Box 3 -->
        <g transform="translate(652, 0)">
          <rect width="316" height="52" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Initial Escrow Allocation</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Earmarks financial capital in root task ledger</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534">Asserts: R_root + F_root &#8804; B_tenant</text>
