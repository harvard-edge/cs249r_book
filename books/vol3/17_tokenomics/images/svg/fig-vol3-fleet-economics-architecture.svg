          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Queue 1: Multi-Turn Reasoning</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Quantum &#916;_1 = 512 tokens &#183; Medium priority</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#475569">Preemptible by Q_0; grace period &#964;_grace</text>
        </g>
        <!-- Box 3 -->
