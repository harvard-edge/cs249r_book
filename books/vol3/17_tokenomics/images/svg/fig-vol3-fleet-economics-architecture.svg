          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Target Model Parallel Verification Forward Pass</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Target scores γ-block in one GEMM</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534">Preserves exact output distribution</text>
        </g>
