          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#92400e">Tier 3: Frontier Core (&#8805; 70B / MoE)</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">C_3 = $0.0600 &#183; Cross-repo planning &amp; debug</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#dc2626" font-weight="700">12% Escalation Only (6.00 s tail)</text>
        </g>
