      <text x="978" y="14" font-size="8" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Kingman Clamping: &#961; &#8804; 0.70</text>

      <g transform="translate(10, 26)">
        <!-- Box 1 -->
        <g transform="translate(0, 0)">
          <rect width="314" height="52" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#581c87">Queue 0: Interactive &amp; Probes</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Quantum &#916;_0 = 64 tokens &#183; Highest HoL priority</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#581c87">Non-preemptible; minimizes TTFT</text>
