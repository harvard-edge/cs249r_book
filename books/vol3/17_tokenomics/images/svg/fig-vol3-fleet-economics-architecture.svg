          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#92400e">Queue 2: Autonomous Batch Fleets</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Quanta &#916;_2 &#8805; 4,096 tokens &#183; Lowest priority</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#92400e">Host DDR5 swap on memory pressure</text>
        </g>
