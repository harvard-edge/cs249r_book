      <text x="978" y="14" font-size="8" font-family="'SF Mono', monospace" fill="#991b1b" font-weight="700" text-anchor="end">Invariant Closure: A = 0</text>

      <g transform="translate(10, 26)">
        <!-- Box 1 -->
        <g transform="translate(0, 0)">
          <rect width="314" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Hierarchical Escrow Ledger</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Non-overlapping budget reservations to children</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#1e40af">Conservation Invariant: B = E + R + F</text>
        </g>
        <!-- Box 2 -->
        <g transform="translate(326, 0)">
          <rect width="314" height="52" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Automated Circuit Breakers</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Trips on burn velocity &gt; &#952; or loop detection</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#dc2626">Hard clamp: OutOfBudgetException</text>
        </g>
        <!-- Box 3 -->
        <g transform="translate(652, 0)">
          <rect width="316" height="52" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
          <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Deterministic Verification Oracle</text>
          <text x="10" y="28" font-size="7.5" fill="#475569">Hermetic pytest suites, AST diffs, type linters</text>
          <text x="10" y="42" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534">Verified Commit: Output y* accepted</text>
        </g>
      </g>
    </g>

    <!-- LEFT CLOSED-LOOP FEEDBACK BUS (Stage 5 to Stage 1) -->
    <!-- Runs along x=28 from y=520 up to y=88 -->
    <path d="M 56,520 L 26,520 L 26,88 L 52,88" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)" />
    <text x="20" y="304" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" transform="rotate(-90 20 304)" text-anchor="middle">Telemetry Feedback: Goodput per Dollar (GP_$) &amp; p95 Latency Calibration Bus</text>

    <!-- BOTTOM OPTIMIZATION INVARIANT STRIP (y=578..612) -->
    <g transform="translate(56, 578)">
      <rect width="988" height="34" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text x="494" y="21" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="middle">CONTROL PLANE INVARIANT: Maximize Goodput per Dollar (GP_$ = N_acceptable / &#8721; C_task) subject to p95 Latency &#8804; SLA and Verification False Acceptance &#945;_FA = 0</text>
