<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="520" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="900" height="480" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE TOKENOMICS MEMORY HIERARCHY: GPU HBM HOLDING RENT VS. TIERED CACHE OFFLOADING</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Latency-cost tradeoffs across storage tiers and Kingman heavy-traffic queueing headroom reserve</text>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: PHYSICAL STORAGE TIERS & HOLDING RENT                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Functional Container Card -->
    <rect x="0" y="0" width="420" height="405" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PHYSICAL STORAGE TIERS &amp; HOLDING RENT</text>

    <!-- Tier 1: GPU HBM -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="390" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="98" fill="#dc2626"/>
      <rect x="10" y="10" width="44" height="14" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="32" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">TIER 1</text>
      <text x="60" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Accelerator HBM3 (80 GB SXM5)</text>
      <text x="10" y="38" font-size="7.5" fill="#475569">Active KV cache blocks during autoregressive token generation.</text>
      <text x="10" y="52" font-size="7.5" fill="#475569">Bandwidth: 3.35 TB/s · Capital Lease: $4.00/hr ($1.39 × 10⁻⁵ / GB·s)</text>
      <rect x="10" y="64" width="370" height="24" rx="1" fill="#fee2e2" stroke="#fecdd3" stroke-width="0.8"/>
      <text x="18" y="79" font-size="7.5" font-weight="700" fill="#991b1b">Break-even idle duration: T_break-even ≈ 0.07 s (rent exceeds prefill)</text>
    </g>

    <!-- Transfer Arrow 1: HBM -> DRAM -->
    <g transform="translate(210, 131)">
      <line x1="0" y1="0" x2="0" y2="23" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
      <text x="10" y="15" font-size="7.5" font-weight="600" fill="#0284c7">PCIe Gen5 x16 (64 GB/s) · ~195 ms paging latency</text>
    </g>

    <!-- Tier 2: Host System DRAM -->
    <g transform="translate(15, 156)">
      <rect x="0" y="0" width="390" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="98" fill="#16a34a"/>
      <rect x="10" y="10" width="44" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="32" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">TIER 2</text>
      <text x="60" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Host System DRAM (1–2 TB DDR5)</text>
      <text x="10" y="38" font-size="7.5" fill="#475569">Paged KV radix prefix cache for suspended multi-turn agent sessions.</text>
      <text x="10" y="52" font-size="7.5" fill="#475569">Bandwidth: ~53 GB/s DMA (PCIe Gen5) · Holding Cost: $1.20 × 10⁻⁷ / GB·s (115× cheaper)</text>
      <rect x="10" y="64" width="370" height="24" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.8"/>
      <text x="18" y="79" font-size="7.5" font-weight="700" fill="#15803d">Keeps HBM clear during tool execution waits (50 ms – 15 s)</text>
    </g>

    <!-- Transfer Arrow 2: DRAM -> NVMe -->
    <g transform="translate(210, 255)">
      <line x1="0" y1="0" x2="0" y2="23" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
      <text x="10" y="15" font-size="7.5" font-weight="600" fill="#d97706">NVMe Direct I/O (3.5 GB/s)</text>
    </g>

    <!-- Tier 3: Local NVMe SSD & Object Storage -->
    <g transform="translate(15, 280)">
      <rect x="0" y="0" width="390" height="104" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="104" fill="#7c3aed"/>
      <rect x="10" y="10" width="44" height="14" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="32" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">TIER 3</text>
      <text x="60" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Local NVMe SSD &amp; Object Storage</text>
      <text x="10" y="38" font-size="7.5" fill="#475569">Episodic memory checkpoints, trajectory logs, and cold session snapshots.</text>
      <text x="10" y="52" font-size="7.5" fill="#475569">Bandwidth: 3.5 GB/s local NVMe / 100 Gbps network · Cost: $1.50 × 10⁻⁹ / GB·s</text>
      <rect x="10" y="66" width="370" height="26" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="18" y="82" font-size="7.5" font-weight="700" fill="#6d28d9">RTO &lt; 50 ms state reconstitution via WAL replay</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: KINGMAN QUEUEING CLIFF & HEADROOM RESERVE            -->
  <!-- ================================================================= -->
  <g transform="translate(480, 75)">
    <!-- Functional Container Card -->
    <rect x="0" y="0" width="420" height="405" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">KINGMAN QUEUEING CLIFF &amp; HEADROOM RESERVE</text>

    <!-- Queue Curve Illustration Area -->
    <g transform="translate(15, 32)">
      <rect width="390" height="206" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Safe Utilization Shading (0 to 70%) -->
      <rect x="46" y="22" width="189" height="152" fill="#f0fdf4" fill-opacity="0.75"/>
      <text x="56" y="40" font-size="8.5" font-weight="700" fill="#15803d">SAFE OPERATING ZONE</text>
      <text x="56" y="52" font-size="7.5" fill="#16a34a">Utilization clamped &lt; 70%</text>
      <text x="56" y="64" font-size="7" fill="#64748b">Bounded wait times; linear scaling</text>

      <!-- Danger Zone Shading (70% to 100%) -->
      <rect x="235" y="22" width="130" height="152" fill="#fef2f2" fill-opacity="0.75"/>
      <text x="245" y="40" font-size="8.5" font-weight="700" fill="#991b1b">TAIL COLLAPSE</text>
      <text x="245" y="52" font-size="7.5" fill="#dc2626">Heavy-traffic cliff (45× delay)</text>
      <text x="245" y="64" font-size="7" fill="#7f1d1d">W_q ∝ ρ / (1 - ρ) → ∞</text>

      <!-- Axes -->
      <line x1="45" y1="174" x2="365" y2="174" stroke="#64748b" stroke-width="1.2"/>
      <line x1="45" y1="174" x2="45" y2="20" stroke="#64748b" stroke-width="1.2"/>

      <text x="205" y="196" font-size="8.5" font-weight="600" fill="#334155" text-anchor="middle">Aggregate Cluster GPU Utilization (ρ)</text>
      <text x="16" y="18" font-size="8" font-weight="600" fill="#334155">Wait (W_q)</text>

      <!-- Grid Markers -->
      <line x1="150" y1="174" x2="150" y2="178" stroke="#94a3b8"/>
      <text x="150" y="188" font-size="8" fill="#64748b" text-anchor="middle">50%</text>

      <line x1="235" y1="174" x2="235" y2="178" stroke="#94a3b8"/>
      <text x="235" y="188" font-size="8" fill="#64748b" text-anchor="middle">70%</text>

      <line x1="320" y1="174" x2="320" y2="178" stroke="#94a3b8"/>
      <text x="320" y="188" font-size="8" fill="#64748b" text-anchor="middle">90%</text>

      <!-- Kingman Asymptote Curve -->
      <path d="M 45 168 Q 150 162 235 140 Q 285 110 320 60 Q 335 30 345 25" fill="none" stroke="#dc2626" stroke-width="2.5"/>

      <!-- Recommended Clamp Line at 70% -->
      <line x1="235" y1="22" x2="235" y2="174" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
      <circle cx="235" cy="140" r="3.5" fill="#16a34a" stroke="#ffffff" stroke-width="1"/>
      <text x="228" y="132" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="end">Target ρ = 70%</text>
    </g>

    <!-- Key Principles Callouts -->
    <g transform="translate(15, 246)">
      <!-- Rule of Thumb Callout -->
      <rect width="390" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="3" height="66" fill="#16a34a"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">The Headroom Reserve Law (Kingman Multiserver)</text>
      <text x="12" y="30" font-size="7.5" fill="#475569">For heavy-tailed agent workflows (C_s ≥ 3.0), provisioned cluster capacity</text>
      <text x="12" y="43" font-size="7.5" fill="#475569">must clamp steady-state GPU utilization below 65%–70%.</text>
      <text x="12" y="56" font-size="7.5" font-weight="700" fill="#15803d">The remaining 30%–35% is mathematical buffer against queue divergence.</text>

      <!-- Commercial Discount Box -->
      <g transform="translate(0, 72)">
        <rect width="390" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="3" height="70" fill="#0284c7"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Multi-Turn Economic Impact of Prompt Caching</text>
        <text x="12" y="30" font-size="7.5" fill="#475569">Caching factor δ_cache ∈ [0.75, 0.90] slashes multi-turn prefill costs:</text>
        <rect x="12" y="36" width="366" height="17" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
        <text x="18" y="48" font-size="7.5" font-weight="700" fill="#0369a1">Cost_turn = (c_cached · S_prefix + c_in · Δ_obs + c_out · Δ_act) × 10⁻⁶</text>
        <text x="12" y="63" font-size="7.5" fill="#475569">Amortizes quadratic prefill into an in-memory prefix hit across 20+ turns.</text>
      </g>
    </g>
  </g>
</svg>
