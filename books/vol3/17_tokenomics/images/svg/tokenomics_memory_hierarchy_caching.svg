<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #475569; line-height: 1.35; }
      .mono-metric { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 700; }
      .arrow-label { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; fill: #64748b; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="510" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE TOKENOMICS MEMORY HIERARCHY: GPU HBM HOLDING RENT VS. TIERED CACHE OFFLOADING</text>
  </g>

  <!-- Left Panel: The Economic Storage Hierarchy -->
  <g transform="translate(25, 60)">
    <rect width="445" height="430" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="445" height="32" rx="2" fill="#f1f5f9"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">PHYSICAL STORAGE TIERS &amp; HOLDING RENT</text>

    <!-- Tier 1: GPU HBM -->
    <g transform="translate(18, 48)">
      <rect width="409" height="98" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
      <text x="14" y="22" class="box-title" fill="#991b1b">Tier 1: Accelerator HBM3 (80 GB SXM5)</text>
      <text x="14" y="40" class="box-desc">Active KV cache blocks during autoregressive token generation.</text>
      <text x="14" y="56" class="box-desc">Bandwidth: 3.35 TB/s · Capital Lease: $4.00/hr ($1.39 × 10⁻⁵ / GB·s)</text>
      <rect x="14" y="66" width="381" height="22" rx="2" fill="#fee2e2"/>
      <text x="22" y="81" class="mono-metric" fill="#b91c1c">Break-even idle duration: T_break-even ≈ 0.07 s (rent exceeds prefill)</text>
    </g>

    <!-- Transfer Arrow 1: HBM -> DRAM -->
    <g transform="translate(222, 150)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <text x="10" y="16" class="arrow-label" fill="#0284c7">PCIe Gen5 x16 (64 GB/s) · ~195 ms paging</text>
    </g>

    <!-- Tier 2: Host System DRAM -->
    <g transform="translate(18, 178)">
      <rect width="409" height="98" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="14" y="22" class="box-title" fill="#166534">Tier 2: Host System DRAM (1–2 TB DDR5)</text>
      <text x="14" y="40" class="box-desc">Paged KV radix prefix cache for suspended multi-turn agent sessions.</text>
      <text x="14" y="56" class="box-desc">Bandwidth: ~53 GB/s DMA (PCIe Gen5) · Holding Cost: $1.20 × 10⁻⁷ / GB·s (115× cheaper)</text>
      <rect x="14" y="66" width="381" height="22" rx="2" fill="#dcfce7"/>
      <text x="22" y="81" class="mono-metric" fill="#15803d">Keeps HBM clear during tool execution waits (50 ms – 15 s)</text>
    </g>

    <!-- Transfer Arrow 2: DRAM -> NVMe -->
    <g transform="translate(222, 280)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
      <text x="10" y="16" class="arrow-label" fill="#d97706">NVMe Direct I/O (3.5 GB/s)</text>
    </g>

    <!-- Tier 3: Local NVMe / S3 Warm Archive -->
    <g transform="translate(18, 308)">
      <rect width="409" height="104" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="14" y="22" class="box-title" fill="#1e40af">Tier 3: Local NVMe SSD &amp; Object Storage</text>
      <text x="14" y="40" class="box-desc">Episodic memory checkpoints, trajectory logs, and cold session snapshots.</text>
      <text x="14" y="56" class="box-desc">Bandwidth: 3.5 GB/s local NVMe / 100 Gbps network · Cost: $1.50 × 10⁻⁹ / GB·s</text>
      <rect x="14" y="68" width="381" height="24" rx="2" fill="#dbeafe"/>
      <text x="22" y="84" class="mono-metric" fill="#1d4ed8">RTO &lt; 50 ms state reconstitution via WAL replay</text>
    </g>
  </g>

  <!-- Right Panel: Kingman Heavy-Traffic Headroom Reserve -->
  <g transform="translate(485, 60)">
    <rect width="430" height="430" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="430" height="32" rx="2" fill="#f1f5f9"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">KINGMAN QUEUEING CLIFF &amp; HEADROOM RESERVE</text>

    <!-- Queue Curve Illustration Area -->
    <g transform="translate(20, 48)">
      <rect width="390" height="210" rx="2" fill="#fafafa" stroke="#e2e8f0"/>

      <!-- Axes -->
      <line x1="45" y1="175" x2="365" y2="175" stroke="#64748b" stroke-width="1.5"/>
      <line x1="45" y1="175" x2="45" y2="25" stroke="#64748b" stroke-width="1.5"/>

      <text x="205" y="198" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Aggregate Cluster GPU Utilization (ρ)</text>
      <text x="16" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#334155">Wait (W_q)</text>

      <!-- Grid markers -->
      <line x1="150" y1="175" x2="150" y2="179" stroke="#94a3b8"/>
      <text x="150" y="190" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">50%</text>

      <line x1="235" y1="175" x2="235" y2="179" stroke="#94a3b8"/>
      <text x="235" y="190" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">70%</text>

      <line x1="320" y1="175" x2="320" y2="179" stroke="#94a3b8"/>
      <text x="320" y="190" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">90%</text>

      <!-- Safe Utilization Shading (0 to 70%) -->
      <rect x="46" y="26" width="189" height="148" fill="#f0fdf4" opacity="0.6"/>
      <text x="120" y="45" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d">SAFE OPERATING ZONE</text>
      <text x="120" y="58" font-family="system-ui, sans-serif" font-size="8" fill="#16a34a">Utilization clamped &lt; 70%</text>

      <!-- Danger Zone Shading (70% to 100%) -->
      <rect x="235" y="26" width="130" height="148" fill="#fef2f2" opacity="0.6"/>
      <text x="280" y="45" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">TAIL COLLAPSE</text>
      <text x="280" y="58" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">Heavy-traffic cliff (45× delay)</text>

      <!-- Kingman Asymptote Curve -->
      <path d="M 45 168 Q 150 162 235 140 Q 285 110 320 60 Q 335 30 345 25" fill="none" stroke="#e11d48" stroke-width="2.5"/>

      <!-- Recommended Clamp Line at 70% -->
      <line x1="235" y1="26" x2="235" y2="175" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,3"/>
      <circle cx="235" cy="140" r="4" fill="#059669"/>
    </g>

    <!-- Key Principles Callouts -->
    <g transform="translate(20, 275)">
      <!-- Rule of Thumb Callout -->
      <rect width="390" height="66" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="14" y="18" class="box-title" fill="#065f46">The Headroom Reserve Law (Kingman Multiserver)</text>
      <text x="14" y="34" class="box-desc">For heavy-tailed agent workflows (C_s ≥ 3.0), provisioned cluster capacity</text>
      <text x="14" y="48" class="box-desc">must clamp steady-state GPU utilization below 65%–70%.</text>
      <text x="14" y="60" class="mono-metric" fill="#047857">The remaining 30%–35% is mathematical buffer against queue divergence.</text>

      <!-- Commercial Discount Box -->
      <rect y="76" width="390" height="65" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="94" class="box-title" fill="#1e293b">Multi-Turn Economic Impact of Prompt Caching</text>
      <text x="14" y="110" class="box-desc">Caching factor δ_cache ∈ [0.75, 0.90] slashes multi-turn prefill costs</text>
      <text x="14" y="124" class="mono-metric" fill="#0369a1">Cost_turn = (c_cached · S_prefix + c_in · Δ_obs + c_out · Δ_act) × 10⁻⁶</text>
      <text x="14" y="136" class="box-desc">Amortizes quadratic prefill into an in-memory prefix hit across 20+ turns.</text>
    </g>
  </g>
</svg>
