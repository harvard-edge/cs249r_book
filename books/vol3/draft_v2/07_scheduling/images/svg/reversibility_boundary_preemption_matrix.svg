<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="zone1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="zone2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="zone3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="zone4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="1184" height="644" rx="14" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <rect x="36" y="26" width="102" height="26" rx="13" fill="#EDE9FE"/>
  <text x="87" y="43" text-anchor="middle" fill="#6B21A8" font-size="11" font-weight="700" letter-spacing="0.8">FIGURE 7.5</text>
  <text x="150" y="45" fill="#0F172A" font-size="19" font-weight="800">The Reversibility Boundary and Preemption Decision Matrix</text>
  <text x="36" y="73" fill="#64748B" font-size="12.5">Scheduling restrictions, job suspension protocols, and compensating Saga requirements under mutated external state</text>

  <!-- Reversibility Spectrum Container (x: 36, y: 92, w: 1128, h: 440) -->
  <rect x="36" y="92" width="1128" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="36" y="92" width="1128" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="116" fill="#1E293B" font-size="13" font-weight="700">Action Reversibility Spectrum and Preemption Feasibility</text>
  <text x="1148" y="116" text-anchor="end" fill="#64748B" font-size="11">From Ephemeral Compute to Physical Side Effects</text>

  <!-- Four Zone Cards Side-by-Side -->

  <!-- Zone 1: Pure LLM Compute -->
  <rect x="52" y="142" width="256" height="370" rx="10" fill="url(#zone1Grad)" stroke="#86EFAC" stroke-width="1.2"/>
  <rect x="64" y="154" width="70" height="22" rx="4" fill="#059669"/>
  <text x="99" y="169" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">ZONE 1</text>
  <text x="64" y="196" fill="#065F46" font-size="13.5" font-weight="800">Pure Compute</text>
  <text x="64" y="214" fill="#047857" font-size="10.5" font-weight="600">Prompt Prefill &amp; Token Decode</text>

  <rect x="64" y="228" width="232" height="66" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
  <text x="74" y="246" fill="#1E293B" font-size="10.5" font-weight="700">State Residency:</text>
  <text x="74" y="262" fill="#475569" font-size="10">• Ephemeral activations in HBM</text>
  <text x="74" y="278" fill="#475569" font-size="10">• Transient KV cache tensors</text>

  <rect x="64" y="302" width="232" height="74" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
  <text x="74" y="320" fill="#1E293B" font-size="10.5" font-weight="700">Reversibility Degree:</text>
  <text x="74" y="338" fill="#059669" font-size="12" font-weight="800">100% Fully Reversible</text>
  <text x="74" y="356" fill="#475569" font-size="9.8">Pure functional forward pass</text>

  <rect x="64" y="384" width="232" height="116" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
  <text x="74" y="402" fill="#065F46" font-size="10.5" font-weight="800">Preemption Policy:</text>
  <text x="74" y="420" fill="#059669" font-size="11" font-weight="700">Instant Preemption / Kill</text>
  <text x="74" y="438" fill="#475569" font-size="9.8">• Discard or swap KV cache</text>
  <text x="74" y="454" fill="#475569" font-size="9.8">• Zero external corruption</text>
  <text x="74" y="470" fill="#475569" font-size="9.8">• Restart at any iteration</text>
  <text x="74" y="488" fill="#059669" font-size="9.5" font-weight="600">✓ Safest schedulable tier</text>

  <!-- Zone 2: Idempotent Tool Reads -->
  <rect x="324" y="142" width="256" height="370" rx="10" fill="url(#zone2Grad)" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="336" y="154" width="70" height="22" rx="4" fill="#2563EB"/>
  <text x="371" y="169" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">ZONE 2</text>
  <text x="336" y="196" fill="#1E40AF" font-size="13.5" font-weight="800">Idempotent Reads</text>
  <text x="336" y="214" fill="#1D4ED8" font-size="10.5" font-weight="600">File &amp; Web Observations</text>

  <rect x="336" y="228" width="232" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="346" y="246" fill="#1E293B" font-size="10.5" font-weight="700">State Residency:</text>
  <text x="346" y="262" fill="#475569" font-size="10">• read_file, grep, web_search</text>
  <text x="346" y="278" fill="#475569" font-size="10">• Read-only DB SELECT queries</text>

  <rect x="336" y="302" width="232" height="74" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="346" y="320" fill="#1E293B" font-size="10.5" font-weight="700">Reversibility Degree:</text>
  <text x="346" y="338" fill="#2563EB" font-size="12" font-weight="800">Idempotent Read f(x)</text>
  <text x="346" y="356" fill="#475569" font-size="9.8">Zero external state mutation</text>

  <rect x="336" y="384" width="232" height="116" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="346" y="402" fill="#1E40AF" font-size="10.5" font-weight="800">Preemption Policy:</text>
  <text x="346" y="420" fill="#2563EB" font-size="11" font-weight="700">Safe Suspend &amp; Preempt</text>
  <text x="346" y="438" fill="#475569" font-size="9.8">• Abort running network call</text>
  <text x="346" y="454" fill="#475569" font-size="9.8">• Release GPU HBM to pool</text>
  <text x="346" y="470" fill="#475569" font-size="9.8">• Re-run tool upon resumption</text>
  <text x="346" y="488" fill="#2563EB" font-size="9.5" font-weight="600">✓ Bounded delay overhead</text>

  <!-- The Reversibility Boundary Barrier Line -->
  <line x1="595" y1="130" x2="595" y2="520" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="583" y="270" width="24" height="84" rx="6" fill="#DC2626"/>
  <text x="595" y="288" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" transform="rotate(90 595 288)">BOUNDARY</text>

  <!-- Zone 3: Reversible Writes (Compensating Sagas) -->
  <rect x="616" y="142" width="256" height="370" rx="10" fill="url(#zone3Grad)" stroke="#FDE68A" stroke-width="1.2"/>
  <rect x="628" y="154" width="70" height="22" rx="4" fill="#D97706"/>
  <text x="663" y="169" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">ZONE 3</text>
  <text x="628" y="196" fill="#92400E" font-size="13.5" font-weight="800">Reversible Writes</text>
  <text x="628" y="214" fill="#B45309" font-size="10.5" font-weight="600">Compensating Sagas (C_i)</text>

  <rect x="628" y="228" width="232" height="66" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="638" y="246" fill="#1E293B" font-size="10.5" font-weight="700">State Residency:</text>
  <text x="638" y="262" fill="#475569" font-size="10">• Git branch commits, temp files</text>
  <text x="638" y="278" fill="#475569" font-size="10">• SQL transaction with rollback log</text>

  <rect x="628" y="302" width="232" height="74" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="638" y="320" fill="#1E293B" font-size="10.5" font-weight="700">Reversibility Degree:</text>
  <text x="638" y="338" fill="#D97706" font-size="12" font-weight="800">Semi-Reversible (Undoable)</text>
  <text x="638" y="356" fill="#475569" font-size="9.8">Has formal compensating action</text>

  <rect x="628" y="384" width="232" height="116" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="638" y="402" fill="#92400E" font-size="10.5" font-weight="800">Preemption Policy:</text>
  <text x="638" y="420" fill="#D97706" font-size="11" font-weight="700">Conditional Preemption</text>
  <text x="638" y="438" fill="#475569" font-size="9.8">• Must run compensating workflow</text>
  <text x="638" y="454" fill="#475569" font-size="9.8">• Execute git reset --hard</text>
  <text x="638" y="470" fill="#475569" font-size="9.8">• Reverts dirty workspace state</text>
  <text x="638" y="488" fill="#B45309" font-size="9.5" font-weight="600">⚠ High preemption rollback cost</text>

  <!-- Zone 4: Irreversible Real-World Side Effects -->
  <rect x="888" y="142" width="260" height="370" rx="10" fill="url(#zone4Grad)" stroke="#FCA5A5" stroke-width="1.2"/>
  <rect x="900" y="154" width="70" height="22" rx="4" fill="#DC2626"/>
  <text x="935" y="169" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">ZONE 4</text>
  <text x="900" y="196" fill="#991B1B" font-size="13.5" font-weight="800">Irreversible Action</text>
  <text x="900" y="214" fill="#B91C1C" font-size="10.5" font-weight="600">Real-World Side Effects</text>

  <rect x="900" y="228" width="236" height="66" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
  <text x="910" y="246" fill="#1E293B" font-size="10.5" font-weight="700">State Residency:</text>
  <text x="910" y="262" fill="#475569" font-size="10">• External financial wire transfers</text>
  <text x="910" y="278" fill="#475569" font-size="10">• Email / Slack send, robot arm motion</text>

  <rect x="900" y="302" width="236" height="74" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
  <text x="910" y="320" fill="#1E293B" font-size="10.5" font-weight="700">Reversibility Degree:</text>
  <text x="910" y="338" fill="#DC2626" font-size="12" font-weight="800">0% Non-Reversible</text>
  <text x="910" y="356" fill="#475569" font-size="9.8">Permanent external side effect</text>

  <rect x="900" y="384" width="236" height="116" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
  <text x="910" y="402" fill="#991B1B" font-size="10.5" font-weight="800">Preemption Policy:</text>
  <text x="910" y="420" fill="#DC2626" font-size="11" font-weight="700">Strictly Non-Preemptible</text>
  <text x="910" y="438" fill="#475569" font-size="9.8">• Preemption is ILLEGAL</text>
  <text x="910" y="454" fill="#475569" font-size="9.8">• Must run to terminal completion</text>
  <text x="910" y="470" fill="#475569" font-size="9.8">• Resources pinned until finished</text>
  <text x="910" y="488" fill="#DC2626" font-size="9.5" font-weight="600">🛑 Crash requires human recovery</text>

  <!-- Systems Principle Callout Banner -->
  <rect x="36" y="548" width="1128" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="52" y="562" width="102" height="58" rx="8" fill="#581C87"/>
  <text x="103" y="587" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SYSTEMS</text>
  <text x="103" y="603" text-anchor="middle" fill="#E9D5FF" font-size="10" font-weight="700">PRINCIPLE</text>
  <text x="172" y="582" fill="#0F172A" font-size="13.5" font-weight="800">Physical Side Effects Break Arbitrary Operating System Preemption Invariants</text>
  <text x="172" y="604" fill="#475569" font-size="11.5">Classic OS schedulers preempt processes arbitrarily because memory pages can be restored. When an agent acts on external</text>
  <text x="172" y="621" fill="#475569" font-size="11.5">environments, preemption is governed by the Reversibility Boundary, requiring compensating Sagas or non-preemptible pinning.</text>
</svg>
