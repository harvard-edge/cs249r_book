<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- LEFT CONTAINER: TRADITIONAL RLHF                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="430" height="370" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. REINFORCEMENT LEARNING FROM HUMAN FEEDBACK (RLHF)</text>

    <!-- Top Flow Row -->
    <g transform="translate(12, 34)">
      <!-- Prompt -->
      <rect x="0" y="0" width="105" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="52" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Task Prompt x</text>

      <!-- Arrow Prompt -> Actor -->
      <line x1="105" y1="18" x2="132" y2="18" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Actor Policy -->
      <rect x="134" y="0" width="138" height="36" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="203" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Actor Policy π_θ</text>

      <!-- Arrow Actor -> Generation -->
      <line x1="272" y1="18" x2="299" y2="18" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

      <!-- Rollout y -->
      <rect x="301" y="0" width="105" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="353" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Trace y</text>
    </g>

    <!-- Arrow Down to Reward Model -->
    <path d="M 365,70 L 365,88 L 227,88" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Neural Reward Model (RM) -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="406" height="66" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">Neural Reward Model r_ψ(x, y)</text>
      <rect x="290" y="5" width="106" height="15" rx="1" fill="#fee2e2"/>
      <text x="343" y="15" text-anchor="middle" font-size="6.5" font-weight="700" fill="#991b1b">SUBJECTIVE / FALLIBLE</text>
      <text x="10" y="32" font-size="7.2" fill="#7f1d1d">• Trained on pairwise human preferences (y_w &gt; y_l) via Bradley-Terry model</text>
      <text x="10" y="44" font-size="7.2" fill="#7f1d1d">• Unbounded continuous scalar score: r ∈ [-∞, +∞]</text>
      <text x="10" y="56" font-size="7.2" font-weight="700" fill="#b91c1c">• Vulnerable to sycophancy, verbose fluff, and reward hacking</text>
    </g>

    <!-- Arrow RM -> Critic / PPO -->
    <line x1="215" y1="154" x2="215" y2="168" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Critic & PPO Optimization Block -->
    <g transform="translate(12, 168)">
      <rect x="0" y="0" width="406" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">PPO Optimization (Actor + Critic V_ϕ)</text>
      <text x="10" y="30" font-size="7.2" fill="#334155">• Requires explicit Value Network V_ϕ (doubles cluster GPU memory footprint)</text>
      <text x="10" y="42" font-size="7.2" fill="#334155">• Generalized Advantage Estimation (GAE) across dense autoregressive time-steps</text>
    </g>

    <!-- Failure Vulnerabilities of RLHF -->
    <g transform="translate(12, 232)">
      <rect x="0" y="0" width="406" height="126" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">Critical Systems Failure Modes in Agent Workflows:</text>
      <g transform="translate(10, 24)">
        <text x="0" y="12" font-size="7.2" font-weight="700" fill="#b91c1c">• Reward Hacking:</text>
        <text x="0" y="24" font-size="7.2" fill="#7f1d1d">Policy exploits RM neural blind spots; emits confident hallucinated assertions.</text>
        
        <text x="0" y="42" font-size="7.2" font-weight="700" fill="#b91c1c">• Human Evaluation Ceiling:</text>
        <text x="0" y="54" font-size="7.2" fill="#7f1d1d">Human annotators cannot reliably audit 50-turn distributed race condition patches.</text>

        <text x="0" y="72" font-size="7.2" font-weight="700" fill="#b91c1c">• Absence of Ground Truth:</text>
        <text x="0" y="84" font-size="7.2" fill="#7f1d1d">Syntactically clean but fundamentally broken code receives high RM reward.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT CONTAINER: MODERN RLVR                                      -->
  <!-- ================================================================= -->
  <g transform="translate(490, 72)">
    <rect x="0" y="0" width="430" height="370" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">B. REINFORCEMENT LEARNING WITH VERIFIABLE REWARDS (RLVR)</text>

    <!-- Top Flow Row -->
    <g transform="translate(12, 34)">
      <!-- Prompt -->
      <rect x="0" y="0" width="105" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="52" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Task Prompt x</text>

      <!-- Arrow Prompt -> Actor -->
      <line x1="105" y1="18" x2="132" y2="18" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Actor Policy -->
      <rect x="134" y="0" width="138" height="36" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="203" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Actor Policy π_θ</text>

      <!-- Arrow Actor -> Generation -->
      <line x1="272" y1="18" x2="299" y2="18" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Rollout y -->
      <rect x="301" y="0" width="105" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="353" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Trace y</text>
    </g>

    <!-- Arrow Down to Oracle -->
    <path d="M 365,70 L 365,88 L 227,88" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Deterministic Execution Oracle -->
    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="406" height="66" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Execution Oracle O(x, y)</text>
      <rect x="290" y="5" width="106" height="15" rx="1" fill="#dcfce7"/>
      <text x="343" y="15" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">DETERMINISTIC / GROUNDED</text>
      <text x="10" y="32" font-size="7.2" fill="#14532d">• Sandboxed unit tests (pytest), compilers (gcc/rustc), formal theorem provers</text>
      <text x="10" y="44" font-size="7.2" fill="#14532d">• Objective binary reward return: R ∈ {0.0, 1.0}</text>
      <text x="10" y="56" font-size="7.2" font-weight="700" fill="#15803d">• Complete mathematical resistance to sycophancy and verbosity bias</text>
    </g>

    <!-- Arrow Oracle -> GRPO -->
    <line x1="215" y1="154" x2="215" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- GRPO / Critic-Free Optimization Block -->
    <g transform="translate(12, 168)">
      <rect x="0" y="0" width="406" height="54" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Group Relative Policy Optimization (GRPO)</text>
      <text x="10" y="30" font-size="7.2" fill="#14532d">• Normalizes advantages across group G = 8 rollouts without neural value baseline</text>
      <text x="10" y="42" font-size="7.2" fill="#14532d">• Frees 47.1% GPU VRAM, allowing massive rollout batch concurrency</text>
    </g>

    <!-- Structural Advantages of RLVR -->
    <g transform="translate(12, 232)">
      <rect x="0" y="0" width="406" height="126" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Structural Systems Advantages in Agent Workflows:</text>
      <g transform="translate(10, 24)">
        <text x="0" y="12" font-size="7.2" font-weight="700" fill="#15803d">• Unhackable Verification Boundary:</text>
        <text x="0" y="24" font-size="7.2" fill="#14532d">Code either executes and passes assertions or fails; zero sycophancy possible.</text>
        
        <text x="0" y="42" font-size="7.2" font-weight="700" fill="#15803d">• Emergent Deliberation &amp; Self-Correction:</text>
        <text x="0" y="54" font-size="7.2" fill="#14532d">Backtracking and verification tokens emerge naturally from reward pressure.</text>

        <text x="0" y="72" font-size="7.2" font-weight="700" fill="#15803d">• Linearly Scalable Compute:</text>
        <text x="0" y="84" font-size="7.2" fill="#14532d">MicroVM execution scales horizontally on cheap CPU nodes outside GPU memory.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS CONTAINER: THE VERIFIABLE REWARD BOUNDARY        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 452)">
    <rect x="0" y="0" width="880" height="96" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#6d28d9">FUNDAMENTAL INVARIANT: THE VERIFIABLE REWARD BOUNDARY</text>
    <text x="15" y="38" font-size="7.5" fill="#334155">
      While conversational chatbots optimize for perceived human helpfulness, autonomous agents operate in digital state spaces (filesystems, compilers, databases).
    </text>
    <text x="15" y="52" font-size="7.5" fill="#334155">
      Reinforcement learning on agents is mathematically grounded only when the reward oracle is an objective, deterministic transition function: R(τ) ∈ {0, 1}.
    </text>
    <text x="15" y="66" font-size="7.5" fill="#334155">
      Replacing fallible neural reward models with deterministic test harnesses eliminates Goodhart's law vulnerabilities in production post-training.
    </text>
    <text x="15" y="82" font-size="7.5" font-weight="700" fill="#15803d">
      Outcome: Deterministic verifiers enable superhuman domain specialization without human labeling ceilings.
    </text>
  </g>
</g>
</svg>