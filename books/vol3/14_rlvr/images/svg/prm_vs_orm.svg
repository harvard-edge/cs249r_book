<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- TIMELINE: MULTI-STEP AGENT REASONING TRAJECTORY                   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="880" height="150" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">MULTI-STEP AGENT REASONING TRAJECTORY (DEBUG DATABASE SESSION)</text>

    <!-- Step 0: Initial Query -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="145" height="102" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Step 0: Initial State s₀</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">• User reports race</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">  condition in session</text>
      <text x="10" y="56" font-size="8.0" fill="#334155">  invalidation table</text>
      <rect x="10" y="74" width="125" height="18" rx="1" fill="#e2e8f0"/>
      <text x="72" y="86" text-anchor="middle" font-size="8.0" font-weight="700" fill="#475569">ROOT QUERY</text>
    </g>

    <!-- Arrow 0 -> 1 -->
    <line x1="162" y1="85" x2="182" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Step 1: Correct Analysis -->
    <g transform="translate(184, 34)">
      <rect x="0" y="0" width="150" height="102" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Step 1: Inspect Logs</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">• Identifies concurrently</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">  written expiry tokens</text>
      <text x="10" y="56" font-size="8.0" fill="#334155">• Correct deduction</text>
      <rect x="10" y="74" width="130" height="18" rx="1" fill="#dcfce7"/>
      <text x="75" y="86" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">VALID REASONING (+1.0)</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="336" y1="85" x2="356" y2="85" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Step 2: Fatal Logic Flaw -->
    <g transform="translate(358, 34)">
      <rect x="0" y="0" width="150" height="102" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Step 2: Flawed Lock</text>
      <text x="10" y="32" font-size="8.0" fill="#7f1d1d">• Implements table lock</text>
      <text x="10" y="44" font-size="8.0" fill="#7f1d1d">  without re-entrancy</text>
      <text x="10" y="56" font-size="8.0" font-weight="700" fill="#dc2626">• Fatal deadlock bug!</text>
      <rect x="10" y="74" width="130" height="18" rx="1" fill="#fee2e2"/>
      <text x="75" y="86" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">FATAL FLAW (-1.0)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="510" y1="85" x2="530" y2="85" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Step 3: Consequent Execution -->
    <g transform="translate(532, 34)">
      <rect x="0" y="0" width="150" height="102" rx="1" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">Step 3: Add Mutex</text>
      <text x="10" y="32" font-size="8.0" fill="#78350f">• Synthesizes code for</text>
      <text x="10" y="44" font-size="8.0" fill="#78350f">  the flawed lock logic</text>
      <text x="10" y="56" font-size="8.0" fill="#92400e">• Compiles cleanly</text>
      <rect x="10" y="74" width="130" height="18" rx="1" fill="#fef3c7"/>
      <text x="75" y="86" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">POISONED (0.0)</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="684" y1="85" x2="704" y2="85" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

    <!-- Step 4: Terminal Execution -->
    <g transform="translate(706, 34)">
      <rect x="0" y="0" width="159" height="102" rx="1" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Step 4: Test Suite</text>
      <text x="10" y="32" font-size="8.0" fill="#7f1d1d">• pytest timeout</text>
      <text x="10" y="44" font-size="8.0" fill="#7f1d1d">• Deadlock error</text>
      <text x="10" y="56" font-size="8.0" fill="#7f1d1d">• Exit code non-zero</text>
      <rect x="10" y="74" width="139" height="18" rx="1" fill="#fee2e2"/>
      <text x="79" y="86" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">TEST FAILS (R = 0)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COMPARISON: ORM VS PRM                                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 235)">
    <!-- Left Column: Outcome Reward Model (ORM) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="430" height="195" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">1. OUTCOME REWARD MODEL (ORM) EVALUATION</text>

      <!-- ORM Signal Flow -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="406" height="30" rx="1" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text x="12" y="19" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#991b1b">Reward Signal: R_terminal = 0.0 (Evaluated at Step 4 only)</text>
      </g>

      <!-- Critique Points -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="406" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.0" font-weight="700" fill="#991b1b">• Severe Credit Assignment Failure:</text>
        <text x="10" y="28" font-size="8.0" fill="#334155">The optimizer cannot determine whether Step 1, Step 2, or Step 3 caused failure.</text>
        
        <text x="10" y="48" font-size="8.0" font-weight="700" fill="#991b1b">• False Negative Gradient Penalty:</text>
        <text x="10" y="60" font-size="8.0" fill="#334155">Step 1 (flawless root cause analysis) is penalized with negative advantage.</text>

        <text x="10" y="80" font-size="8.0" font-weight="700" fill="#991b1b">• High Search Token Waste:</text>
        <text x="10" y="92" font-size="8.0" fill="#334155">Search tree must execute completely to Step 4 before detecting deadlock.</text>
      </g>
    </g>

    <!-- Right Column: Process Reward Model (PRM) -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="430" height="195" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">2. PROCESS REWARD MODEL (PRM) EVALUATION</text>

      <!-- PRM Signal Flow -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="406" height="30" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="12" y="19" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">Step Scores: r(s₁) = +1.0,  r(s₂) = -1.0 (Flawed),  r(s₃) = PRUNED</text>
      </g>

      <!-- Advantages Points -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="406" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.0" font-weight="700" fill="#15803d">• Pinpoint Credit Attribution:</text>
        <text x="10" y="28" font-size="8.0" fill="#334155">Precisely flags Step 2 as the exact point of divergence and error injection.</text>
        
        <text x="10" y="48" font-size="8.0" font-weight="700" fill="#15803d">• Preserves Valid Exploration:</text>
        <text x="10" y="60" font-size="8.0" fill="#334155">Step 1 receives positive reinforcement, protecting high-quality reasoning.</text>

        <text x="10" y="80" font-size="8.0" font-weight="700" fill="#15803d">• Test-Time Search Early Pruning:</text>
        <text x="10" y="92" font-size="8.0" fill="#334155">MCTS / Best-of-N immediately prunes branch at Step 2, saving 70%+ tokens.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS CONTAINER: SYSTEMS TRADEOFF                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 442)">
    <rect x="0" y="0" width="880" height="102" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#6d28d9">THE SYSTEMS TRADEOFF: ANNOTATION COST VS SAMPLE EFFICIENCY</text>
    <text x="15" y="38" font-size="8.0" fill="#334155">
      While Outcome Reward Models require only a binary success signal at task termination, their sample efficiency is severely hindered by credit assignment noise.
    </text>
    <text x="15" y="52" font-size="8.0" fill="#334155">
      Process Reward Models solve credit assignment and enable aggressive inference-time search pruning, but require high training data curation costs
    </text>
    <text x="15" y="66" font-size="8.0" fill="#334155">
      or automated step-level verification oracles (formal SAT/SMT provers, AST differential analyzers) to grade intermediate steps at scale.
    </text>
    <text x="15" y="84" font-size="8.0" font-weight="700" fill="#15803d">
      In production agentic loops, combining counterfactual branching oracles with lightweight PRMs offers optimal Pareto trade-offs.
    </text>
  </g>
</g>
</svg>