<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #E9D5FF; }
      .sec-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1E1B4B; }
      .step-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .step-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
      .token-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; line-height: 1.35; }
      .arrow { stroke: #64748B; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="grad-head-prm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <marker id="arr-prm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="18" width="910" height="44" rx="6" fill="url(#grad-head-prm)" />
  <text x="42" y="45" class="banner-title">Process Reward Models (PRMs) vs. Outcome Reward Models (ORMs)</text>
  <text x="590" y="45" class="banner-sub">Step-Level Credit Assignment vs. Terminal Outcome Evaluation</text>

  <!-- Trajectory Execution Timeline (Top) -->
  <g transform="translate(25, 75)">
    <rect width="910" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="910" height="28" rx="8" fill="#F8FAFC" />
    <rect y="20" width="910" height="8" fill="#F8FAFC" />
    <text x="16" y="19" class="sec-title">Multi-Step Agent Reasoning Trajectory (Debug Database Session)</text>

    <!-- Step Nodes -->
    <g transform="translate(16, 38)">
      <!-- Step 0: Initial Query -->
      <g transform="translate(0, 0)">
        <rect width="155" height="92" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
        <text x="12" y="20" class="step-title" fill="#334155">Step 0: Initial State s_0</text>
        <text x="12" y="38" class="step-desc">• User reports race</text>
        <text x="12" y="52" class="step-desc">  condition in session</text>
        <text x="12" y="66" class="step-desc">  invalidation table</text>
        <rect x="12" y="72" width="131" height="15" rx="3" fill="#E2E8F0" />
        <text x="77" y="83" class="badge" fill="#64748B">ROOT QUERY</text>
      </g>

      <!-- Arrow 0 -> 1 -->
      <path d="M 155 46 L 180 46" class="arrow" marker-end="url(#arr-prm)" />

      <!-- Step 1: Correct Analysis -->
      <g transform="translate(185, 0)">
        <rect width="165" height="92" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.25" />
        <text x="12" y="20" class="step-title" fill="#15803D">Step 1: Inspect Logs</text>
        <text x="12" y="38" class="step-desc">• Identifies concurrently</text>
        <text x="12" y="52" class="step-desc">  written expiry tokens</text>
        <text x="12" y="66" class="step-desc">• Correct deduction</text>
        <rect x="12" y="72" width="141" height="15" rx="3" fill="#DCFCE7" />
        <text x="82" y="83" class="badge" fill="#15803D">VALID REASONING (+1.0)</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <path d="M 350 46 L 375 46" class="arrow" marker-end="url(#arr-prm)" />

      <!-- Step 2: Fatal Logic Flaw -->
      <g transform="translate(380, 0)">
        <rect width="165" height="92" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
        <text x="12" y="20" class="step-title" fill="#B91C1C">Step 2: Flawed Lock</text>
        <text x="12" y="38" class="step-desc">• Implements table lock</text>
        <text x="12" y="52" class="step-desc">  without re-entrancy</text>
        <text x="12" y="66" class="step-desc">• Fatal deadlock bug!</text>
        <rect x="12" y="72" width="141" height="15" rx="3" fill="#FEE2E2" />
        <text x="82" y="83" class="badge" fill="#B91C1C">FATAL FLAW (-1.0)</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <path d="M 545 46 L 570 46" class="arrow" marker-end="url(#arr-prm)" />

      <!-- Step 3: Consequent Execution -->
      <g transform="translate(575, 0)">
        <rect width="155" height="92" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" />
        <text x="12" y="20" class="step-title" fill="#B45309">Step 3: Add Mutex</text>
        <text x="12" y="38" class="step-desc">• Synthesizes code for</text>
        <text x="12" y="52" class="step-desc">  the flawed lock logic</text>
        <text x="12" y="66" class="step-desc">• Compiles cleanly</text>
        <rect x="12" y="72" width="131" height="15" rx="3" fill="#FEF3C7" />
        <text x="77" y="83" class="badge" fill="#B45309">POISONED (0.0)</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <path d="M 730 46 L 755 46" class="arrow" marker-end="url(#arr-prm)" />

      <!-- Step 4: Terminal Execution -->
      <g transform="translate(760, 0)">
        <rect width="120" height="92" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
        <text x="10" y="20" class="step-title" fill="#DC2626">Step 4: Test Suite</text>
        <text x="10" y="38" class="step-desc">• pytest timeout</text>
        <text x="10" y="52" class="step-desc">• Deadlock error</text>
        <rect x="10" y="72" width="100" height="15" rx="3" fill="#FEE2E2" />
        <text x="60" y="83" class="badge" fill="#DC2626">TEST FAILS (0)</text>
      </g>
    </g>
  </g>

  <!-- Comparison Columns: ORM vs PRM -->
  <g transform="translate(25, 240)">
    <!-- Left Column: Outcome Reward Model (ORM) -->
    <g transform="translate(0, 0)">
      <rect width="445" height="180" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
      <rect width="445" height="26" rx="8" fill="#FFF1F2" />
      <rect y="18" width="445" height="8" fill="#FFF1F2" />
      <text x="14" y="18" class="sec-title" fill="#BE123C">1. Outcome Reward Model (ORM) Evaluation</text>

      <!-- ORM Signal Flow -->
      <g transform="translate(14, 34)">
        <rect width="417" height="34" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1" />
        <text x="12" y="21" class="token-text" fill="#991B1B">Reward Signal: R_terminal = 0.0 (Evaluated at Step 4 only)</text>
      </g>

      <!-- Critique Points -->
      <text x="14" y="86" class="label-text" fill="#9F1239">• Severe Credit Assignment Failure:</text>
      <text x="14" y="100" class="sub-text">The model cannot determine whether Step 1, Step 2, or Step 3 caused the failure.</text>
      
      <text x="14" y="118" class="label-text" fill="#9F1239">• False Negative Gradient Penalty:</text>
      <text x="14" y="132" class="sub-text">Step 1 (flawless root cause analysis) is penalized with negative reward.</text>

      <text x="14" y="150" class="label-text" fill="#9F1239">• High Search Token Waste:</text>
      <text x="14" y="164" class="sub-text">Search tree must execute all the way to Step 4 before detecting deadlock.</text>
    </g>

    <!-- Right Column: Process Reward Model (PRM) -->
    <g transform="translate(465, 0)">
      <rect width="445" height="180" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" />
      <rect width="445" height="26" rx="8" fill="#F0FDF4" />
      <rect y="18" width="445" height="8" fill="#F0FDF4" />
      <text x="14" y="18" class="sec-title" fill="#15803D">2. Process Reward Model (PRM) Evaluation</text>

      <!-- PRM Signal Flow -->
      <g transform="translate(14, 34)">
        <rect width="417" height="34" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
        <text x="12" y="21" class="token-text" fill="#166534">Step Scores: r(s_1) = +1.0,  r(s_2) = -1.0 (Flawed),  r(s_3) = PRUNED</text>
      </g>

      <!-- Advantages Points -->
      <text x="14" y="86" class="label-text" fill="#15803D">• Pinpoint Credit Attribution:</text>
      <text x="14" y="100" class="sub-text">Precisely flags Step 2 as the exact point of divergence and error injection.</text>
      
      <text x="14" y="118" class="label-text" fill="#15803D">• Preserves Valid Exploration:</text>
      <text x="14" y="132" class="sub-text">Step 1 receives positive reinforcement, protecting high-quality reasoning.</text>

      <text x="14" y="150" class="label-text" fill="#15803D">• Test-Time Search Early Pruning:</text>
      <text x="14" y="164" class="sub-text">MCTS / Best-of-N immediately prunes branch at Step 2, saving 70%+ tokens.</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 432)">
    <rect width="910" height="76" rx="8" fill="#EDE9FE" stroke="#A855F7" stroke-width="1.25" />
    <text x="16" y="22" class="sec-title" fill="#581C87">The Systems Trade-off: Annotation Cost vs. Sample Efficiency</text>
    <text x="16" y="42" class="sub-text" fill="#3B0764">
      While Outcome Reward Models require only a binary success signal at task termination, their sample efficiency is severely hindered by credit assignment noise.
    </text>
    <text x="16" y="56" class="sub-text" fill="#3B0764">
      Process Reward Models solve credit assignment and enable aggressive inference-time search pruning, but require high training data curation costs
    </text>
    <text x="16" y="70" class="sub-text" fill="#3B0764">
      or automated step-level verification oracles (formal SAT/SMT provers, AST differential analyzers) to grade intermediate steps at scale.
    </text>
  </g>
</svg>
