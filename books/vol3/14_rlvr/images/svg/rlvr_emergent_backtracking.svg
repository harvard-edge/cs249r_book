<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 525" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <style>
    .panel-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.35; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #0f172a; }
    .code-purple { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #7c3aed; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #059669; font-weight: 600; }
    .code-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #dc2626; font-weight: 600; }
    .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #d97706; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #1e293b; }
  </style>

  <!-- ==================== TOP PANEL: (a) FINITE STATE MACHINE ==================== -->
  <g transform="translate(15, 15)">
    <rect class="panel-card" x="0" y="0" width="1010" height="240"/>
    <rect class="header-box" x="12" y="10" width="986" height="34" fill="#e2e8f0"/>
    <text class="title-text" x="22" y="26">(a) Emergent Deliberation Finite State Machine (Policy Internal Dynamics)</text>
    <text class="subtitle-text" x="22" y="38">Self-Verification, Reversal Token Triggering, and Attention Suppression Loop</text>

    <!-- FSM Canvas Area -->
    <g transform="translate(12, 52)">
      <!-- State 1: S_hyp (Rollout) -->
      <g transform="translate(10, 15)">
        <rect class="inner-box" x="0" y="0" width="145" height="66" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
        <text class="code-purple" x="10" y="18">S_hyp: Rollout</text>
        <text class="code-text" x="10" y="32">a_t ~ π_θ(· | s_t)</text>
        <text class="dim-label" x="10" y="46">Autoregressive candidate</text>
        <text class="dim-label" x="10" y="58">token expansion</text>
      </g>

      <!-- Arrow S_hyp -> S_mon -->
      <path d="M 155 48 L 195 48" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)"/>
      <text class="code-purple" x="175" y="42" text-anchor="middle" font-size="8px">Candidate</text>

      <!-- State 2: S_mon (Verify) -->
      <g transform="translate(200, 15)">
        <rect class="inner-box" x="0" y="0" width="150" height="66" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
        <text class="code-amber" x="10" y="18">S_mon: Verify</text>
        <text class="code-text" x="10" y="32">Attn(a_t, I_spec)</text>
        <text class="dim-label" x="10" y="46">Cross-attention check</text>
        <text class="dim-label" x="10" y="58">against formal invariants</text>
      </g>

      <!-- Arrow S_mon -> S_act (Sound) -->
      <path d="M 350 48 L 430 48" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
      <text class="code-green" x="390" y="42" text-anchor="middle" font-size="8px">I(τ)=1 (Sound)</text>

      <!-- Arrow S_mon Down -> S_back (Violation) -->
      <path d="M 275 81 L 275 108" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
      <text class="code-red" x="281" y="98" font-size="8px">I(τ)=0 (Violation)</text>

      <!-- State 3: S_back (Reversal) -->
      <g transform="translate(200, 112)">
        <rect class="inner-box" x="0" y="0" width="150" height="56" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <text class="code-red" x="10" y="16">S_back: Reversal</text>
        <text class="code-text" x="10" y="30">Emit token κ_rev</text>
        <text class="body-text" x="10" y="44" font-size="8.5px" fill="#b91c1c">"Wait...", "Alternatively..."</text>
      </g>

      <!-- Arrow S_back -> S_inval (Left) -->
      <path d="M 200 140 L 160 140" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
      <text class="code-red" x="180" y="134" text-anchor="middle" font-size="8px">Prune</text>

      <!-- State 4: S_inval (Suppress) -->
      <g transform="translate(10, 112)">
        <rect class="inner-box" x="0" y="0" width="145" height="56" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text class="title-text" x="10" y="16" font-size="10px">S_inval: Suppress</text>
        <text class="code-text" x="10" y="30">α_attn(B_faulty) → 0</text>
        <text class="dim-label" x="10" y="44">Masks out invalid branch</text>
      </g>

      <!-- Arrow S_inval Up -> S_hyp -->
      <path d="M 82 112 L 82 86" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)"/>
      <text class="code-purple" x="88" y="100" font-size="8px">Re-rollout</text>

      <!-- State 5: S_act (Tool Emit) -->
      <g transform="translate(435, 15)">
        <rect class="inner-box" x="0" y="0" width="165" height="66" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text class="code-green" x="10" y="18">S_act: Tool Emit</text>
        <text class="code-text" x="10" y="32">a_perm in A_admissible</text>
        <text class="dim-label" x="10" y="46">Grounded dispatch to</text>
        <text class="dim-label" x="10" y="58">sandbox microVM</text>
      </g>

      <!-- Arrow S_act -> S_oracle -->
      <path d="M 600 48 L 650 48" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
      <text class="code-green" x="625" y="42" text-anchor="middle" font-size="8px">Execute</text>

      <!-- State 6: S_oracle (Verifier Oracle) -->
      <g transform="translate(655, 10)">
        <rect class="inner-box" x="0" y="0" width="325" height="160" rx="3"/>
        <text class="title-text" x="12" y="20" font-size="11px">S_oracle: Deterministic Verifier Oracle</text>

        <!-- Sub-panel Pass -->
        <g transform="translate(10, 30)">
          <rect x="0" y="0" width="305" height="54" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <text class="code-green" x="10" y="16">PASS: R(τ) = +1.0</text>
          <text class="body-text" x="10" y="30" font-size="8.5px">Deterministic test suite passes; compiler exit 0</text>
          <text class="dim-val" x="10" y="44" fill="#15803d">Reinforces successful deliberative repair trajectory</text>
        </g>

        <!-- Sub-panel Fail -->
        <g transform="translate(10, 92)">
          <rect x="0" y="0" width="305" height="54" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
          <text class="code-red" x="10" y="16">FAIL: R(τ) = 0.0</text>
          <text class="body-text" x="10" y="30" font-size="8.5px">Assertion failure, syntax error, crash, or timeout</text>
          <text class="dim-val" x="10" y="44" fill="#991b1b">Penalizes unrecovered error; updates policy gradient</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM PANEL: (b) TOKEN STREAM & ATTENTION DYNAMICS ==================== -->
  <g transform="translate(15, 270)">
    <rect class="panel-card" x="0" y="0" width="1010" height="240"/>
    <rect class="header-box" x="12" y="10" width="986" height="34" fill="#dbeafe"/>
    <text class="title-text" x="22" y="26">(b) Deliberation Token Stream: Attention Suppression Across Reversal Boundaries</text>
    <text class="subtitle-text" x="22" y="38">Dynamic Attention Re-Weighting Shifts Weight from Faulty Tokens to Invariant Specification</text>

    <!-- Token Stream Horizontal Sequence -->
    <g transform="translate(15, 52)">
      <!-- Step 1: Faulty Branch B1 -->
      <g transform="translate(0, 0)">
        <rect class="inner-box" x="0" y="0" width="265" height="82" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <rect x="0" y="0" width="265" height="22" rx="2" fill="#fee2e2"/>
        <text class="title-text" x="10" y="15" font-size="10px" fill="#991b1b">Tokens 1..k: Faulty Rollout Branch B₁</text>
        <text class="code-text" x="10" y="38" font-size="9px">"Let's acquire Mutex_B, then Mutex_A..."</text>
        <rect x="8" y="48" width="249" height="24" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
        <text class="code-red" x="14" y="64" font-size="8.5px">Latent State: AB-BA deadlock hazard</text>
      </g>

      <!-- Arrow B1 -> Rev -->
      <path d="M 267 41 L 285 41" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)"/>

      <!-- Step 2: Reversal Token Boundary -->
      <g transform="translate(290, 0)">
        <rect class="inner-box" x="0" y="0" width="200" height="82" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
        <rect x="0" y="0" width="200" height="22" rx="2" fill="#ede9fe"/>
        <text class="title-text" x="10" y="15" font-size="10px" fill="#6b21a8">Reversal Boundary: κ_rev</text>
        <text class="code-purple" x="10" y="38" font-size="9px">"Wait, lock hierarchy..."</text>
        <rect x="8" y="48" width="184" height="24" rx="2" fill="#ffffff" stroke="#ddd6fe" stroke-width="0.8"/>
        <text class="dim-val" x="14" y="64" fill="#6b21a8" font-size="8.5px">Tokens trigger branch shift</text>
      </g>

      <!-- Arrow Rev -> B2 -->
      <path d="M 492 41 L 510 41" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>

      <!-- Step 3: Repaired Branch B2 -->
      <g transform="translate(515, 0)">
        <rect class="inner-box" x="0" y="0" width="265" height="82" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <rect x="0" y="0" width="265" height="22" rx="2" fill="#dcfce7"/>
        <text class="title-text" x="10" y="15" font-size="10px" fill="#15803d">Tokens k+m..N: Repaired Branch B₂</text>
        <text class="code-text" x="10" y="38" font-size="9px">"Instead: std::scoped_lock(A, B);"</text>
        <rect x="8" y="48" width="249" height="24" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
        <text class="code-green" x="14" y="64" font-size="8.5px">Valid lock ordering invariant</text>
      </g>

      <!-- Arrow B2 -> Act -->
      <path d="M 782 41 L 800 41" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>

      <!-- Step 4: Tool Actuation -->
      <g transform="translate(805, 0)">
        <rect class="inner-box" x="0" y="0" width="175" height="82" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="0" y="0" width="175" height="22" rx="2" fill="#e2e8f0"/>
        <text class="title-text" x="10" y="15" font-size="10px" fill="#0f172a">Tool Action: a_perm</text>
        <text class="code-text" x="10" y="38" font-size="9px">git apply fix.patch</text>
        <rect x="8" y="48" width="159" height="24" rx="2" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.8"/>
        <text class="code-green" x="14" y="64" font-size="8.5px">Pytest: PASS (R=1.0)</text>
      </g>
    </g>

    <!-- Attention Weighting Distribution Box -->
    <g transform="translate(15, 146)">
      <rect class="inner-box" x="0" y="0" width="980" height="78" rx="3"/>
      <text class="dim-label" x="12" y="18">POST-REVERSAL ATTENTION RE-WEIGHTING MAP [α(B₂ → ·)]</text>

      <!-- Block 1: Attn to B1 (Suppressed) -->
      <g transform="translate(12, 26)">
        <rect x="0" y="0" width="270" height="42" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="code-red" x="10" y="16">α(B₂ → B₁) ≈ 0.02 (Suppressed)</text>
        <text class="body-text" x="10" y="32" font-size="8.5px" fill="#64748b">Policy learns to ignore invalidated reasoning</text>
      </g>

      <!-- Block 2: Attn to Reversal Token -->
      <g transform="translate(294, 26)">
        <rect x="0" y="0" width="240" height="42" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text class="code-purple" x="10" y="16">α(B₂ → κ_rev) = 0.41 (Anchor)</text>
        <text class="body-text" x="10" y="32" font-size="8.5px" fill="#64748b">Reversal token grounds search pivot</text>
      </g>

      <!-- Block 3: Attn to Invariant Spec -->
      <g transform="translate(546, 26)">
        <rect x="0" y="0" width="422" height="42" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text class="code-green" x="10" y="16">α(B₂ → I_spec) = 0.54 (Grounded Invariant Alignment)</text>
        <text class="body-text" x="10" y="32" font-size="8.5px" fill="#15803d">Attention shifts to formal contract specification, synthesizing sound code</text>
      </g>
    </g>
  </g>
</svg>