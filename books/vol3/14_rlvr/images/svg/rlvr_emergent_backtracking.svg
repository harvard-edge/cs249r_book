<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- 1. HYPOTHESIS GENERATION (LEFT: x=40, w=265, h=360)               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="265" height="362" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. HYPOTHESIS GENERATION (ROLLOUT)</text>

    <!-- Sub-block 1: Autoregressive Decode -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="241" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Autoregressive Decode Core</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">a_t ~ π_θ(· | q, a_&lt;t)</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Decodes tokens sequentially via GPU GEMV;</text>
      <text x="10" y="56" font-size="8.0" fill="#64748b">Extends reasoning trace in volatile KV RAM</text>
    </g>

    <!-- Arrow Down -->
    <line x1="132" y1="100" x2="132" y2="120" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Sub-block 2: Candidate Synthesis -->
    <g transform="translate(12, 120)">
      <rect x="0" y="0" width="241" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Candidate Deduction Synthesis</text>
      <text x="10" y="30" font-size="8.0" fill="#334155">Emits intermediate reasoning step:</text>
      <text x="10" y="44" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">"Acquire Mutex_B then Mutex_A..."</text>
      <text x="10" y="56" font-size="8.0" fill="#64748b">Proposes action prior to execution</text>
    </g>

    <!-- Arrow Down -->
    <line x1="132" y1="186" x2="132" y2="206" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Sub-block 3: Active Context Expansion -->
    <g transform="translate(12, 206)">
      <rect x="0" y="0" width="241" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Active Context Expansion</text>
      <text x="10" y="30" font-size="8.0" fill="#334155">Appends newly generated tokens into</text>
      <text x="10" y="42" font-size="8.0" fill="#334155">the running KV-cache sequence window.</text>
      <rect x="10" y="48" width="221" height="15" rx="1" fill="#ede9fe"/>
      <text x="120" y="59" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Token Count |τ| Expands</text>
    </g>

    <!-- Bottom note -->
    <g transform="translate(12, 286)">
      <rect x="0" y="0" width="241" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.0" font-weight="700" fill="#0f172a">Inference Compute Allocation</text>
      <text x="10" y="29" font-size="8.0" fill="#64748b">Test-time FLOPs scale dynamically as the</text>
      <text x="10" y="41" font-size="8.0" fill="#64748b">agent deliberates before emitting tool calls.</text>
      <text x="10" y="53" font-size="8.0" font-weight="700" fill="#7c3aed">Zero explicit tree search required</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2: Evaluate Step -->
  <line x1="305" y1="130" x2="330" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <rect x="306" y="112" width="24" height="14" rx="1" fill="#f1f5f9"/>
  <text x="318" y="122" text-anchor="middle" font-size="8.0" font-weight="700" fill="#475569">EVAL</text>

  <!-- ================================================================= -->
  <!-- 2. SELF-MONITORING (CENTER-TOP: x=335, w=280, h=165)              -->
  <!-- ================================================================= -->
  <g transform="translate(335, 72)">
    <rect x="0" y="0" width="280" height="165" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">2. SELF-MONITORING (DEEP ATTENTION)</text>

    <!-- Sub-block 1: Cross-Context Attention -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="256" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">Cross-Context Invariant Attention</text>
      <text x="10" y="29" font-size="8.0" fill="#334155">Self-attention layers attend back to system</text>
      <text x="10" y="41" font-size="8.0" fill="#334155">prompt specifications, type rules, &amp; invariants</text>
    </g>

    <!-- Sub-block 2: Consistency Check -->
    <g transform="translate(12, 94)">
      <rect x="0" y="0" width="256" height="58" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">Deductive Consistency Check</text>
      <text x="10" y="29" font-size="8.0" fill="#334155">Compares proposed action against lock hierarchy</text>
      <rect x="10" y="35" width="236" height="16" rx="1" fill="#fef3c7"/>
      <text x="128" y="46" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">Detects Potential Invariant Violations</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3: Semantic Inconsistency Detected -->
  <line x1="475" y1="237" x2="475" y2="255" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="420" y="238" width="110" height="14" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="475" y="248" text-anchor="middle" font-size="8.0" font-weight="700" fill="#dc2626">Semantic Inconsistency</text>

  <!-- CONNECTOR 2 -> 4: Invariants OK (Direct Route) -->
  <path d="M 615,130 L 640,130" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="617" y="112" width="22" height="14" rx="1" fill="#dcfce7"/>
  <text x="628" y="122" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">OK</text>

  <!-- ================================================================= -->
  <!-- 3. BACKTRACKING PHASE (CENTER-BOTTOM: x=335, w=280, h=175)         -->
  <!-- ================================================================= -->
  <g transform="translate(335, 258)">
    <rect x="0" y="0" width="280" height="176" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">3. BACKTRACKING &amp; SELF-CORRECTION</text>

    <!-- Sub-block 1: Reconsideration Marker -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="256" height="42" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#991b1b">Reconsideration Token Trigger</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">"Wait, acquiring B first causes AB-BA..."</text>
    </g>

    <!-- Sub-block 2: Invalidate Branch -->
    <g transform="translate(12, 79)">
      <rect x="0" y="0" width="256" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">Invalidate Faulty Deductive Branch</text>
      <text x="10" y="30" font-size="8.0" fill="#64748b">Suppresses faulty hypothesis; re-weights attention</text>
    </g>

    <!-- Sub-block 3: Alternative Synthesis -->
    <g transform="translate(12, 126)">
      <rect x="0" y="0" width="256" height="42" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#15803d">Synthesize Alternative Strategy</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#166534">"Instead, use std::scoped_lock(A, B)..."</text>
    </g>
  </g>

  <!-- CONNECTOR 3 -> 4: Repaired Strategy to Actuation -->
  <line x1="615" y1="346" x2="640" y2="346" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="616" y="330" width="23" height="14" rx="1" fill="#dcfce7"/>
  <text x="627" y="340" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">FIX</text>

  <!-- ================================================================= -->
  <!-- 4. TOOL ACTUATION & VERIFICATION (RIGHT: x=645, w=275, h=362)      -->
  <!-- ================================================================= -->
  <g transform="translate(645, 72)">
    <rect x="0" y="0" width="275" height="362" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="275" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">4. TOOL ACTUATION &amp; ORACLE</text>

    <!-- Sub-block 1: Grounded Execution -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="251" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Grounded Sandbox Actuation</text>
      <text x="10" y="30" font-size="8.0" fill="#334155">Commits synthesized patch file into</text>
      <text x="10" y="42" font-size="8.0" fill="#334155">isolated MicroVM container filesystem.</text>
      <rect x="10" y="48" width="231" height="14" rx="1" fill="#e2e8f0"/>
      <text x="125" y="58" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#334155">git apply session_fix.patch</text>
    </g>

    <!-- Arrow Down -->
    <line x1="137" y1="100" x2="137" y2="120" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Sub-block 2: Deterministic Oracle -->
    <g transform="translate(12, 120)">
      <rect x="0" y="0" width="251" height="74" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Deterministic Verification Oracle</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#14532d">pytest -q tests/test_deadlock.py</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">Rigorous execution test harness;</text>
      <rect x="10" y="52" width="231" height="16" rx="1" fill="#dcfce7"/>
      <text x="125" y="63" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">BINARY OUTCOME: R ∈ {0.0, 1.0}</text>
    </g>

    <!-- Arrow Down -->
    <line x1="137" y1="194" x2="137" y2="216" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Sub-block 3: Final Outcomes -->
    <g transform="translate(12, 216)">
      <rect x="0" y="0" width="251" height="134" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Objective Reward Evaluation</text>

      <!-- Pass Card -->
      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="231" height="44" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="18" font-size="8" font-weight="700" fill="#15803d">PASS: R = 1.0</text>
        <text x="10" y="32" font-size="8.0" fill="#166534">Unit tests pass cleanly; reinforces backtrack trace</text>
      </g>

      <!-- Fail Card -->
      <g transform="translate(10, 78)">
        <rect x="0" y="0" width="231" height="44" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
        <text x="10" y="18" font-size="8" font-weight="700" fill="#991b1b">FAIL: R = 0.0</text>
        <text x="10" y="32" font-size="8.0" fill="#7f1d1d">Deadlock or test failure; penalizes trajectory</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS CONTAINER: DELIBERATIVE REASONING EMERGENCE      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 448)">
    <rect x="0" y="0" width="880" height="96" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">SYSTEMS INSIGHT: EMERGENCE OF SYSTEM 2 DELIBERATION VIA VERIFIABLE REWARDS</text>
    <text x="15" y="38" font-size="8.0" fill="#334155">
      Under dense verifier pressure (RLVR with GRPO), reasoning models naturally discover test-time search without explicit tree search or human annotations.
    </text>
    <text x="15" y="52" font-size="8.0" fill="#334155">
      The agent learns to allocate additional inference compute (test-time FLOPs) to self-monitor, backtrack on contradictions, and verify before tool execution.
    </text>
    <text x="15" y="66" font-size="8.0" fill="#334155">
      This bridges the gap between pure autoregressive generation and formal deductive systems verification in complex agentic software workflows.
    </text>
    <text x="15" y="82" font-size="8.0" font-weight="700" fill="#15803d">
      Result: Up to 3.8× higher pass rates on challenging benchmark suites (SWE-bench, LiveCodeBench) via autonomous self-correction loops.
    </text>
  </g>
</g>
</svg>