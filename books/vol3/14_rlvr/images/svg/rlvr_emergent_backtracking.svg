<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arr-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#581C87"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803D"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Clean Background Canvas -->
  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- PANEL (a): EMERGENT DELIBERATION FSM (TOP)                       -->
  <!-- ================================================================= -->
  <g transform="translate(24, 20)">
    <!-- Panel Container -->
    <rect width="912" height="210" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <rect width="912" height="24" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0F172A">(a) EMERGENT DELIBERATION FINITE STATE MACHINE (POLICY π_θ INTERNAL DYNAMICS)</text>

    <!-- State 1: S_hyp (Hypothesis Generation) -->
    <g transform="translate(28, 48)">
      <rect width="144" height="64" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.3"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#581C87">S_hyp: Rollout</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">a_t ~ π_θ(· | s_t)</text>
      <text x="10" y="46" font-size="7.2" fill="#64748B">Autoregressive token</text>
      <text x="10" y="56" font-size="7.2" fill="#64748B">candidate expansion</text>
    </g>

    <!-- Transition: Candidate proposed -> S_mon -->
    <path d="M 172,80 L 222,80" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>
    <text x="197" y="74" text-anchor="middle" font-size="7" font-weight="700" fill="#581C87">Candidate</text>

    <!-- State 2: S_mon (Self-Monitoring) -->
    <g transform="translate(226, 48)">
      <rect width="154" height="64" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#B45309">S_mon: Verify</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">Attn(a_t, I_spec)</text>
      <text x="10" y="46" font-size="7.2" fill="#64748B">Cross-attention to</text>
      <text x="10" y="56" font-size="7.2" fill="#64748B">invariant specification</text>
    </g>

    <!-- Transition: Invariant OK -> S_act (Direct Right) -->
    <path d="M 380,80 L 460,80" fill="none" stroke="#15803D" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="420" y="74" text-anchor="middle" font-size="7" font-weight="700" fill="#15803D">I(τ) = 1 (Sound)</text>

    <!-- Transition: Invariant Violation -> S_reconsider (Downwards) -->
    <path d="M 303,112 L 303,142" fill="none" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
    <text x="309" y="130" font-size="7" font-weight="700" fill="#DC2626">I(τ) = 0 (Violation)</text>

    <!-- State 3: S_reconsider (Backtrack Trigger) -->
    <g transform="translate(226, 146)">
      <rect width="154" height="52" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991B1B">S_back: Reversal</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Emit token κ_rev</text>
      <text x="10" y="42" font-size="7" fill="#7F1D1D">"Wait...", "Alternatively..."</text>
    </g>

    <!-- Transition: S_reconsider -> S_inval (Leftwards) -->
    <path d="M 226,172 L 178,172" fill="none" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
    <text x="202" y="166" text-anchor="middle" font-size="7" font-weight="700" fill="#DC2626">Prune</text>

    <!-- State 4: S_inval (Hypothesis Invalidation) -->
    <g transform="translate(28, 146)">
      <rect width="144" height="52" rx="2" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">S_inval: Suppress</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">α_attn(B_faulty) → 0</text>
      <text x="10" y="42" font-size="7" fill="#64748B">Branch masked out</text>
    </g>

    <!-- Transition: S_inval -> S_hyp (Loop up to re-rollout) -->
    <path d="M 100,146 L 100,118" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>
    <text x="106" y="132" font-size="7" font-weight="700" fill="#581C87">Re-rollout</text>

    <!-- State 5: S_act (Tool Actuation) -->
    <g transform="translate(464, 48)">
      <rect width="154" height="64" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.3"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803D">S_act: Tool Emit</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">a_perm ∈ A_admissible</text>
      <text x="10" y="46" font-size="7.2" fill="#64748B">Grounded dispatch to</text>
      <text x="10" y="56" font-size="7.2" fill="#64748B">sandbox microVM</text>
    </g>

    <!-- Transition: S_act -> S_oracle -->
    <path d="M 618,80 L 664,80" fill="none" stroke="#15803D" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="641" y="74" text-anchor="middle" font-size="7" font-weight="700" fill="#15803D">Execute</text>

    <!-- State 6: S_oracle (Deterministic Verification Oracle) -->
    <g transform="translate(668, 48)">
      <rect width="216" height="150" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
      <rect width="216" height="22" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0F172A">S_oracle: Verifier Oracle</text>

      <!-- Sub-panel R=1 -->
      <g transform="translate(10, 30)">
        <rect width="196" height="48" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803D">PASS: R(τ) = +1.0</text>
        <text x="8" y="27" font-size="7" fill="#166534">Deterministic test suite passes</text>
        <text x="8" y="39" font-size="7" font-weight="700" fill="#15803D">Reinforce successful backtrack</text>
      </g>

      <!-- Sub-panel R=0 -->
      <g transform="translate(10, 88)">
        <rect width="196" height="48" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#991B1B">FAIL: R(τ) = 0.0</text>
        <text x="8" y="27" font-size="7" fill="#7F1D1D">Timeout, crash, or assert failure</text>
        <text x="8" y="39" font-size="7" font-weight="700" fill="#DC2626">Penalize unrecovered error</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL (b): TOKEN STREAM & ATTENTION MASKING TRACE (BOTTOM)       -->
  <!-- ================================================================= -->
  <g transform="translate(24, 242)">
    <!-- Panel Container -->
    <rect width="912" height="216" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <rect width="912" height="24" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0F172A">(b) DELIBERATION TOKEN STREAM: ATTENTION SUPPRESSION ACROSS REVERSAL BOUNDARIES</text>

    <!-- Timeline Axis -->
    <g transform="translate(28, 42)">
      <!-- Step 1: Initial Rollout Branch B1 -->
      <rect x="0" y="0" width="250" height="74" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
      <rect x="0" y="0" width="250" height="18" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#991B1B">Tokens 1..k: Faulty Rollout Branch B₁</text>
      <text x="8" y="32" font-size="7.2" fill="#334155">"Let's acquire Mutex_B, then Mutex_A..."</text>
      <rect x="8" y="42" width="234" height="22" rx="1" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="12" y="56" font-size="7" fill="#DC2626">State: Latent AB-BA deadlock hazard</text>

      <!-- Step 2: Reversal Token Boundary -->
      <g transform="translate(262, 0)">
        <rect x="0" y="0" width="170" height="74" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.3"/>
        <rect x="0" y="0" width="170" height="18" rx="2" fill="#F3E8FF" stroke="#581C87" stroke-width="1.3"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#581C87">Reversal Boundary: κ_rev</text>
        <text x="8" y="32" font-size="7.2" font-weight="700" fill="#581C87">"Wait, lock hierarchy..."</text>
        <rect x="8" y="42" width="154" height="22" rx="1" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="0.8"/>
        <text x="12" y="56" font-size="7" fill="#581C87">Tokens trigger branch shift</text>
      </g>

      <!-- Step 3: Corrected Rollout Branch B2 -->
      <g transform="translate(444, 0)">
        <rect x="0" y="0" width="240" height="74" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.1"/>
        <rect x="0" y="0" width="240" height="18" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#15803D">Tokens k+m..N: Repaired Branch B₂</text>
        <text x="8" y="32" font-size="7.2" fill="#334155">"Instead: std::scoped_lock(A, B);"</text>
        <rect x="8" y="42" width="224" height="22" rx="1" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8"/>
        <text x="12" y="56" font-size="7" fill="#15803D">State: Valid lock ordering invariant</text>
      </g>

      <!-- Step 4: Actuation Commit -->
      <g transform="translate(696, 0)">
        <rect x="0" y="0" width="160" height="74" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <rect x="0" y="0" width="160" height="18" rx="2" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0F172A">Tool Call Emit: a_perm</text>
        <text x="8" y="32" font-size="7.2" fill="#334155">git apply fix.patch</text>
        <rect x="8" y="42" width="144" height="22" rx="1" fill="#DCFCE7" stroke="#15803D" stroke-width="0.8"/>
        <text x="12" y="56" font-size="7" font-weight="700" fill="#15803D">Pytest: PASS (R=1.0)</text>
      </g>
    </g>

    <!-- Attention Matrix Weighting Visual Below -->
    <g transform="translate(28, 126)">
      <rect width="856" height="72" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">ATTENTION RE-WEIGHTING DYNAMICS (POST-REVERSAL TOKEN ATTENTION MAP):</text>

      <!-- Block 1: Attn to B1 (Suppressed) -->
      <g transform="translate(12, 26)">
        <rect width="248" height="36" rx="2" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.9"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#991B1B">α(B₂ → B₁) ≈ 0.02 (Suppressed)</text>
        <text x="10" y="27" font-size="7" fill="#64748B">Policy learns to ignore invalidated reasoning</text>
      </g>

      <!-- Block 2: Attn to Reversal Token -->
      <g transform="translate(272, 26)">
        <rect width="180" height="36" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="0.9"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#581C87">α(B₂ → κ_rev) = 0.41 (Anchor)</text>
        <text x="10" y="27" font-size="7" fill="#64748B">Reversal token grounds backtrack</text>
      </g>

      <!-- Block 3: Attn to Specification -->
      <g transform="translate(464, 26)">
        <rect width="380" height="36" rx="2" fill="#FFFFFF" stroke="#15803D" stroke-width="0.9"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#15803D">α(B₂ → I_spec) = 0.54 (Grounded Invariant Alignment)</text>
        <text x="10" y="27" font-size="7" fill="#64748B">Attention shifts to formal contract specification, synthesizing sound code</text>
      </g>
    </g>
  </g>
</svg>