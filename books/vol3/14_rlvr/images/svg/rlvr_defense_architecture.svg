<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: UNTRUSTED AGENT EXECUTION BOUNDARY                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="270" height="460" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#991b1b">1. UNTRUSTED AGENT BOUNDARY</text>

    <!-- Subtitle Note -->
    <text x="12" y="38" font-size="8.0" fill="#7f1d1d">Ephemeral Sandbox (Untrusted Execution)</text>

    <!-- Policy Box -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="246" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Autonomous Agent Policy π_θ</text>
      <text x="10" y="30" font-size="8.0" fill="#64748b">Autoregressive action generation;</text>
      <text x="10" y="42" font-size="8.0" fill="#dc2626" font-weight="700">Potentially scheming / reward hacking</text>
    </g>

    <!-- Arrow Policy -> Workspace -->
    <line x1="135" y1="108" x2="135" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Mutable Workspace -->
    <g transform="translate(12, 128)">
      <rect x="0" y="0" width="246" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Mutable Workspace (UpperDir Overlay)</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#334155">src/lib.rs, main.py</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">Writable filesystem layer for code edits</text>
    </g>

    <!-- Read-Only Test Mount -->
    <g transform="translate(12, 230)">
      <rect x="0" y="0" width="246" height="65" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">Read-Only Test Mount (LowerDir)</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#b91c1c">tests/test_public.py (:ro bind)</text>
      <rect x="10" y="38" width="226" height="18" rx="1" fill="#fee2e2"/>
      <text x="123" y="50" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">PROTECTED BY KERNEL VFS MOUNT</text>
    </g>

    <!-- Tampering Attempt Indicator -->
    <path d="M 230,108 C 265,140 265,190 230,230" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
    <g transform="translate(150, 195)">
      <rect x="0" y="0" width="105" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="52" y="12" text-anchor="middle" font-size="8.0" font-weight="700" fill="#dc2626">Tampering Attempt</text>
    </g>

    <!-- Bottom Explanatory Card -->
    <g transform="translate(12, 340)">
      <rect x="0" y="0" width="246" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.0" font-weight="700" fill="#0f172a">Sandbox Security Boundaries</text>
      <text x="10" y="30" font-size="8.0" fill="#334155">• Non-root container UID (10001)</text>
      <text x="10" y="44" font-size="8.0" fill="#334155">• seccomp-bpf filter disables ptrace</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">• eBPF cgroup egress block (no WAN)</text>
      <text x="10" y="72" font-size="8.0" fill="#334155">• Read-only rootfs; mutable /tmp overlay</text>
      <rect x="10" y="80" width="226" height="18" rx="1" fill="#e2e8f0"/>
      <text x="123" y="92" text-anchor="middle" font-size="8.0" font-weight="700" fill="#475569">Zero Host Network / PID Leakage</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2: Terminal State Export -->
  <line x1="310" y1="200" x2="335" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="322" y="192" text-anchor="middle" font-size="8.0" font-weight="700" fill="#64748b">git diff</text>

  <line x1="310" y1="300" x2="335" y2="300" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="322" y="292" text-anchor="middle" font-size="8.0" font-weight="700" fill="#64748b">SHA256</text>

  <!-- ================================================================= -->
  <!-- COLUMN 2: HARNESS INTEGRITY VERIFICATION GATE                     -->
  <!-- ================================================================= -->
  <g transform="translate(340, 72)">
    <rect x="0" y="0" width="270" height="460" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0f172a">2. INTEGRITY VERIFICATION GATE</text>

    <!-- Subtitle Note -->
    <text x="12" y="38" font-size="8.0" fill="#64748b">Harness Integrity Verification Gate</text>

    <!-- Hash Auditor -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="246" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Cryptographic Hash Auditor</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#334155">H_term = SHA256(tests/**)</text>
      <text x="10" y="44" font-family="Courier, monospace" font-size="8.0" fill="#334155">H_init = SHA256(golden_tests/**)</text>
      <rect x="10" y="50" width="226" height="16" rx="1" fill="#dcfce7"/>
      <text x="123" y="62" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">Assert: H_term == H_init</text>
    </g>

    <!-- Arrow Hash -> Decision -->
    <line x1="135" y1="122" x2="135" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Patch Extraction -->
    <g transform="translate(12, 148)">
      <rect x="0" y="0" width="246" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Clean Patch Extraction</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#334155">git diff --no-ext-diff src/</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">Extracts minimal source delta;</text>
      <rect x="10" y="50" width="226" height="16" rx="1" fill="#e0f2fe"/>
      <text x="123" y="62" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">REJECT IF DIFF TOUCHES tests/</text>
    </g>

    <!-- Arrow Patch -> Decision Branch -->
    <line x1="135" y1="222" x2="135" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Decision Box: Validation Result -->
    <g transform="translate(12, 255)">
      <rect x="0" y="0" width="246" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Gate Audit Decision</text>
      <text x="10" y="32" font-size="8.0" fill="#15803d">✔ Hash OK &amp; Clean Patch: Forward to Enclave</text>
      <text x="10" y="46" font-size="8.0" fill="#dc2626">✘ Hash Mismatch: Instant Abort &amp; Heavy Penalty</text>
    </g>

    <!-- Arrow Down to Security Fault -->
    <line x1="135" y1="315" x2="135" y2="345" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Security Fault Abort Box -->
    <g transform="translate(12, 345)">
      <rect x="0" y="0" width="246" height="100" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#991b1b">Security Fault Abort (Tamper Trap)</text>
      <text x="10" y="34" font-size="8.0" fill="#7f1d1d">• Halts rollout evaluation immediately</text>
      <text x="10" y="48" font-size="8.0" fill="#7f1d1d">• Emits security audit telemetry</text>
      <text x="10" y="62" font-size="8.0" fill="#7f1d1d">• Flags trajectory for safety review</text>
      <rect x="10" y="70" width="226" height="20" rx="1" fill="#fee2e2"/>
      <text x="123" y="84" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">Adversarial Penalty: R = -1.0</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3: Gate to Out-of-Band Enclave -->
  <line x1="610" y1="185" x2="635" y2="185" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="612" y="168" width="22" height="14" rx="1" fill="#dcfce7"/>
  <text x="623" y="178" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">PASS</text>

  <!-- ================================================================= -->
  <!-- COLUMN 3: OUT-OF-BAND VERIFICATION ENCLAVE                        -->
  <!-- ================================================================= -->
  <g transform="translate(640, 72)">
    <rect x="0" y="0" width="280" height="460" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">3. OUT-OF-BAND VERIFICATION ENCLAVE</text>

    <!-- Subtitle Note -->
    <text x="12" y="38" font-size="8.0" fill="#15803d">Isolated MicroVM Verification Substrate</text>

    <!-- Fresh MicroVM -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="256" height="50" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Fresh Hermetic MicroVM</text>
      <text x="10" y="30" font-size="8.0" fill="#334155">Firecracker / gVisor isolated instance</text>
      <text x="10" y="42" font-size="8.0" fill="#64748b">No network, fresh pristine kernel environment</text>
    </g>

    <!-- Arrow VM -> Apply Patch -->
    <line x1="140" y1="98" x2="140" y2="114" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Apply Patch -->
    <g transform="translate(12, 114)">
      <rect x="0" y="0" width="256" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Apply Verified agent.patch</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#334155">git apply --check &amp;&amp; git apply</text>
    </g>

    <!-- Arrow Patch -> Test Suites -->
    <line x1="140" y1="158" x2="140" y2="174" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Split Evaluation Suites -->
    <g transform="translate(12, 174)">
      <rect x="0" y="0" width="256" height="116" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Dual Split Evaluation Suites</text>

      <!-- Public Diagnostic Tests -->
      <rect x="10" y="24" width="236" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="18" y="38" font-size="8.0" font-weight="700" fill="#334155">Public Diagnostic Test Split</text>
      <text x="18" y="50" font-size="8.0" fill="#64748b">Provided to agent for basic syntax feedback</text>

      <!-- Private Hidden Tests -->
      <rect x="10" y="66" width="236" height="40" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="18" y="80" font-size="8.0" font-weight="700" fill="#15803d">Held-Out Private Test Split (Golden Oracle)</text>
      <text x="18" y="92" font-size="8.0" fill="#14532d">Never mounted in agent sandbox; prevents memorization</text>
      <text x="18" y="102" font-size="8.0" font-weight="700" fill="#15803d">Comprehensive edge-case assertions</text>
    </g>

    <!-- Arrow Tests -> Deterministic Oracle -->
    <line x1="140" y1="290" x2="140" y2="306" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Deterministic Oracle -->
    <g transform="translate(12, 306)">
      <rect x="0" y="0" width="256" height="52" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Deterministic Verification Oracle</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.0" fill="#14532d">pytest -q tests/test_private.py</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">Zero hallucination; binary execution truth</text>
    </g>

    <!-- Arrow Oracle -> Reward -->
    <line x1="140" y1="358" x2="140" y2="376" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Secure Reward Output -->
    <g transform="translate(12, 376)">
      <rect x="0" y="0" width="256" height="70" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="256" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">Secure Reward Signal</text>

      <rect x="10" y="26" width="112" height="34" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="66" y="40" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">R = 1.0</text>
      <text x="66" y="52" text-anchor="middle" font-size="8.0" fill="#14532d">Private Pass</text>

      <rect x="134" y="26" width="112" height="34" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="190" y="40" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#dc2626">R = 0.0</text>
      <text x="190" y="52" text-anchor="middle" font-size="8.0" fill="#7f1d1d">Fail / Timeout</text>
    </g>
  </g>

</g>
</svg>