<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="920" height="540" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">GROUP RELATIVE POLICY OPTIMIZATION (GRPO) ARCHITECTURE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Critic-free policy optimization via in-group advantage normalization and shared KV-cache rollout concurrency</text>

  <!-- ================================================================= -->
  <!-- STEP 1: GROUP GENERATION & DETERMINISTIC ORACLE VERIFICATION       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="880" height="175" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. GROUP GENERATION &amp; DETERMINISTIC ORACLE VERIFICATION</text>

    <!-- Query Prompt Box -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="135" height="126" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Input Query q</text>
      <text x="12" y="36" font-family="Courier, monospace" font-size="7.5" fill="#334155">"Solve bug in</text>
      <text x="12" y="50" font-family="Courier, monospace" font-size="7.5" fill="#334155">distributed</text>
      <text x="12" y="64" font-family="Courier, monospace" font-size="7.5" fill="#334155">cache mutex"</text>
      <rect x="12" y="94" width="111" height="18" rx="1" fill="#e2e8f0"/>
      <text x="67" y="106" text-anchor="middle" font-size="7" font-weight="700" fill="#475569">PROMPT SEED</text>
    </g>

    <!-- Arrow Query -> Policy Rollout -->
    <line x1="155" y1="97" x2="185" y2="97" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Group Outputs (G = 4) -->
    <g transform="translate(190, 34)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#6d28d9">Sample Group G = 4 outputs from π_θ:</text>

      <!-- Candidate Output 1 (Pass) -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="355" height="24" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" fill="#15803d">Output o₁: Replaces lock with atomic CAS</text>
        <rect x="290" y="4" width="55" height="16" rx="1" fill="#dcfce7"/>
        <text x="317" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">r₁ = 1.0</text>
      </g>

      <!-- Candidate Output 2 (Fail) -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="355" height="24" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" fill="#991b1b">Output o₂: Deadlocks on concurrent read</text>
        <rect x="290" y="4" width="55" height="16" rx="1" fill="#fee2e2"/>
        <text x="317" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#dc2626">r₂ = 0.0</text>
      </g>

      <!-- Candidate Output 3 (Fail) -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="355" height="24" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" fill="#991b1b">Output o₃: Syntax error in test harness</text>
        <rect x="290" y="4" width="55" height="16" rx="1" fill="#fee2e2"/>
        <text x="317" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#dc2626">r₃ = 0.0</text>
      </g>

      <!-- Candidate Output 4 (Pass) -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="355" height="24" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" fill="#15803d">Output o₄: Correct patch &amp; test passes</text>
        <rect x="290" y="4" width="55" height="16" rx="1" fill="#dcfce7"/>
        <text x="317" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">r₄ = 1.0</text>
      </g>
    </g>

    <!-- Arrow Group -> Normalization -->
    <line x1="555" y1="97" x2="580" y2="97" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- In-Group Advantage Normalization -->
    <g transform="translate(585, 34)">
      <rect x="0" y="0" width="280" height="126" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#6d28d9">In-Group Advantage Normalization</text>

      <!-- Math Block -->
      <rect x="12" y="26" width="256" height="32" rx="1" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
      <text x="140" y="46" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#6d28d9">
        μ = (1/G)·∑ r_i,   σ = StdDev({r_i})
      </text>

      <!-- Advantage Scores -->
      <text x="12" y="76" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">A₁ = (1.0 - 0.5) / 0.5 = +1.0 (Reinforce)</text>
      <text x="12" y="92" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#dc2626">A₂ = (0.0 - 0.5) / 0.5 = -1.0 (Penalize)</text>
      <text x="12" y="112" font-size="7" fill="#64748b">Relative variance replaces neural value baselines</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 2 & 3: MATHEMATICAL OBJECTIVE & SYSTEMS MEMORY IMPACT         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 260)">
    <!-- Left Box: GRPO Clipped Surrogate Objective -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="430" height="175" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">2. GRPO CLIPPED SURROGATE OBJECTIVE</text>

      <!-- Math Block -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="406" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="203" y="18" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#0f172a">
          L_GRPO(θ) = 𝔼 [ (1/G)·∑ (1/|o_i|)·∑ { L_clip(θ) - β·D_KL } ]
        </text>
        <text x="203" y="34" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#6d28d9">
          L_clip = min( r_t·A_i, clip(r_t, 1-ε, 1+ε)·A_i )
        </text>
      </g>

      <text x="15" y="96" font-size="7.5" fill="#334155">• r_t = π_θ(o_{i,t} | q, o_{i,&lt;t}) / π_old(o_{i,t} | q, o_{i,&lt;t}) (Surrogate Token Ratio)</text>
      <text x="15" y="112" font-size="7.5" fill="#334155">• Length normalization (1/|o_i|) eliminates verbosity bias in agent tool traces</text>
      <text x="15" y="128" font-size="7.5" fill="#334155">• Closed-form reference KL penalty D_KL(π_θ || π_ref) bounds policy drift</text>
      <text x="15" y="144" font-size="7.5" fill="#64748b">• Embarrassingly parallel across sequence lengths and microVM test runners</text>
    </g>

    <!-- Right Box: Systems Comparison - PPO vs GRPO Memory Layout -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="430" height="175" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">3. SYSTEMS MEMORY IMPACT: PPO VS GRPO</text>

      <!-- Comparison Cards -->
      <g transform="translate(12, 34)">
        <!-- PPO Stack -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="195" height="42" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
          <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">PPO: 4 Models in VRAM</text>
          <text x="10" y="30" font-family="Courier, monospace" font-size="7" fill="#b91c1c">Actor + Critic + Ref + Reward</text>
        </g>

        <!-- GRPO Stack -->
        <g transform="translate(211, 0)">
          <rect x="0" y="0" width="195" height="42" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
          <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">GRPO: 2 Models in VRAM</text>
          <text x="10" y="30" font-family="Courier, monospace" font-size="7" fill="#15803d">Actor + Ref (Critic Eliminated!)</text>
        </g>
      </g>

      <!-- Systems Summary Box -->
      <g transform="translate(12, 86)">
        <rect x="0" y="0" width="406" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="7.5" font-weight="700" fill="#0f172a">Key Systems Takeaway: Critic Elimination</text>
        <text x="10" y="30" font-size="7.5" fill="#334155">Eliminating the critic network frees ~50% GPU VRAM, enabling double the batch</text>
        <text x="10" y="44" font-size="7.5" fill="#334155">rollout concurrency on identical cluster hardware (DeepSeekMath, DeepSeek-R1).</text>
        <text x="10" y="58" font-size="7.5" font-weight="700" fill="#0284c7">Prefix KV caches can be shared across all G rollouts via Radix caching.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS CONTAINER: CRITIC ELIMINATION IN LARGE-SCALE RL   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 448)">
    <rect x="0" y="0" width="880" height="96" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#0f172a">CORE SYSTEMS INVARIANT: CRITIC ELIMINATION IN LARGE-SCALE RL</text>
    <text x="15" y="38" font-size="7.5" fill="#334155">
      Traditional actor-critic algorithms (PPO) suffer from extreme communication and memory bottlenecks in LLM regimes, as the critic model
    </text>
    <text x="15" y="52" font-size="7.5" fill="#334155">
      requires identical parameter capacity to the actor. By deriving advantage estimates directly from the empirical distribution of group rollouts,
    </text>
    <text x="15" y="66" font-size="7.5" fill="#334155">
      GRPO transforms policy optimization into an embarrassingly parallel, memory-efficient pipeline with zero value network overhead.
    </text>
    <text x="15" y="82" font-size="7.5" font-weight="700" fill="#6d28d9">
      Combined with out-of-band execution verifiers, GRPO forms the computational foundation for production-grade agentic RLVR.
    </text>
  </g>
</svg>
