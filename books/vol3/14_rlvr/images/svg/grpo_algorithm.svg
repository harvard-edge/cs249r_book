<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #E9D5FF; }
      .sec-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1E1B4B; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; line-height: 1.35; }
      .token-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
      .math-text { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
      .arrow { stroke: #64748B; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-purple { stroke: #7E22CE; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { stroke: #059669; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="grad-head-grpo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <marker id="arr-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#64748B" />
    </marker>
    <marker id="arr-p-grpo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#7E22CE" />
    </marker>
    <marker id="arr-g-grpo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="530" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="18" width="910" height="44" rx="2" fill="url(#grad-head-grpo)" />
  <text x="42" y="45" class="banner-title">Group Relative Policy Optimization (GRPO) Architecture</text>
  <text x="560" y="45" class="banner-sub">Critic-Free Policy Optimization via In-Group Advantage Normalization</text>

  <!-- Step 1 & 2: Group Rollout and Reward Evaluation -->
  <g transform="translate(25, 75)">
    <rect width="910" height="185" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="910" height="28" rx="2" fill="#F8FAFC" />
    <rect y="20" width="910" height="8" fill="#F8FAFC" />
    <text x="16" y="19" class="sec-title">1. Group Generation &amp; Deterministic Oracle Verification</text>

    <!-- Query Prompt Box -->
    <g transform="translate(20, 45)">
      <rect width="130" height="115" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="65" y="24" class="label-text" fill="#1E293B" text-anchor="middle">Input Query q</text>
      <text x="12" y="48" class="token-text" fill="#475569">"Solve bug in</text>
      <text x="12" y="64" class="token-text" fill="#475569">distributed</text>
      <text x="12" y="80" class="token-text" fill="#475569">cache mutex"</text>
      <rect x="12" y="92" width="106" height="16" rx="3" fill="#E2E8F0" />
      <text x="65" y="104" style="font-size: 8.5px; font-weight: 700; fill: #64748B;" text-anchor="middle">Prompt Seed</text>
    </g>

    <!-- Arrow Query -> Policy Rollout -->
    <path d="M 155 102 L 195 102" class="arrow-purple" marker-end="url(#arr-p-grpo)" />

    <!-- Group Outputs (G = 4) -->
    <g transform="translate(205, 40)">
      <text x="0" y="0" class="sub-text" style="font-weight: 700; fill: #581C87;">Sample Group G = 4 outputs from π_θ:</text>

      <!-- Candidate Output 1 (Pass) -->
      <g transform="translate(0, 8)">
        <rect width="320" height="28" rx="4" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.25" />
        <text x="10" y="18" class="token-text" fill="#15803D">Output o_1: Replaces lock with atomic CAS</text>
        <rect x="250" y="5" width="60" height="18" rx="3" fill="#DCFCE7" />
        <text x="280" y="17" class="token-text" fill="#166534" font-weight="700" text-anchor="middle">r_1 = 1.0</text>
      </g>

      <!-- Candidate Output 2 (Fail) -->
      <g transform="translate(0, 42)">
        <rect width="320" height="28" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" />
        <text x="10" y="18" class="token-text" fill="#991B1B">Output o_2: Deadlocks on concurrent read</text>
        <rect x="250" y="5" width="60" height="18" rx="3" fill="#FEE2E2" />
        <text x="280" y="17" class="token-text" fill="#991B1B" font-weight="700" text-anchor="middle">r_2 = 0.0</text>
      </g>

      <!-- Candidate Output 3 (Fail) -->
      <g transform="translate(0, 76)">
        <rect width="320" height="28" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" />
        <text x="10" y="18" class="token-text" fill="#991B1B">Output o_3: Syntax error in test harness</text>
        <rect x="250" y="5" width="60" height="18" rx="3" fill="#FEE2E2" />
        <text x="280" y="17" class="token-text" fill="#991B1B" font-weight="700" text-anchor="middle">r_3 = 0.0</text>
      </g>

      <!-- Candidate Output 4 (Partial/Pass) -->
      <g transform="translate(0, 110)">
        <rect width="320" height="28" rx="4" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.25" />
        <text x="10" y="18" class="token-text" fill="#15803D">Output o_4: Correct patch &amp; test passes</text>
        <rect x="250" y="5" width="60" height="18" rx="3" fill="#DCFCE7" />
        <text x="280" y="17" class="token-text" fill="#166534" font-weight="700" text-anchor="middle">r_4 = 1.0</text>
      </g>
    </g>

    <!-- Arrow Group -> Group Normalization -->
    <path d="M 535 110 L 575 110" class="arrow-green" marker-end="url(#arr-g-grpo)" />

    <!-- Group Statistics & Relative Advantage Computation -->
    <g transform="translate(585, 45)">
      <rect width="305" height="120" rx="2" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" />
      <text x="14" y="22" class="label-text" fill="#581C87">2. In-Group Advantage Normalization</text>
      
      <!-- Math Block -->
      <rect x="12" y="34" width="281" height="34" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1" />
      <text x="152" y="55" class="math-text" fill="#4C1D95" text-anchor="middle">
        μ = (1/G)·Σ r_i,   σ = StdDev({r_i})
      </text>

      <!-- Advantage Scores -->
      <text x="14" y="86" class="token-text" fill="#15803D" font-weight="700">A_1 = (1.0 - 0.5) / 0.5 = +1.0  (Reinforce)</text>
      <text x="14" y="102" class="token-text" fill="#B91C1C" font-weight="700">A_2 = (0.0 - 0.5) / 0.5 = -1.0  (Penalize)</text>
    </g>
  </g>

  <!-- Step 3 & 4: Mathematical Optimization & Memory Architecture -->
  <g transform="translate(25, 275)">
    <!-- Left Box: GRPO Objective Function -->
    <g transform="translate(0, 0)">
      <rect width="445" height="145" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5" />
      <rect width="445" height="26" rx="2" fill="#FAF5FF" />
      <rect y="18" width="445" height="8" fill="#FAF5FF" />
      <text x="14" y="18" class="sec-title" fill="#581C87">3. GRPO Clipped Surrogate Objective</text>

      <g transform="translate(14, 34)">
        <rect width="417" height="46" rx="4" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1" />
        <text x="208" y="18" class="math-text" fill="#3B0764" text-anchor="middle">
          L_GRPO(θ) = E [ (1/G)·Σ (1/|o_i|)·Σ { L_clip(θ) - β·D_KL } ]
        </text>
        <text x="208" y="36" class="token-text" fill="#6B21A8" text-anchor="middle">
          L_clip = min( r_t·A_i, clip(r_t, 1-ε, 1+ε)·A_i )
        </text>
      </g>

      <text x="14" y="96" class="sub-text" style="font-weight: 600;">• r_t = π_θ(o_i,t | q, o_i,&lt;t) / π_old(o_i,t | q, o_i,&lt;t) (Ratio)</text>
      <text x="14" y="112" class="sub-text">• Normalized by token count |o_i| to prevent verbose trace bias</text>
      <text x="14" y="128" class="sub-text">• KL penalty D_KL(π_θ || π_ref) bounds policy drift</text>
    </g>

    <!-- Right Box: Systems Comparison - PPO vs GRPO Memory Layout -->
    <g transform="translate(465, 0)">
      <rect width="445" height="145" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <rect width="445" height="26" rx="2" fill="#EFF6FF" />
      <rect y="18" width="445" height="8" fill="#EFF6FF" />
      <text x="14" y="18" class="sec-title" fill="#1D4ED8">4. Systems Memory Impact: PPO vs. GRPO</text>

      <!-- Comparison Visual -->
      <g transform="translate(14, 34)">
        <!-- PPO Stack -->
        <g transform="translate(0, 0)">
          <rect width="195" height="42" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" />
          <text x="10" y="18" class="label-text" fill="#991B1B">PPO: 4 Models in VRAM</text>
          <text x="10" y="32" class="token-text" fill="#B91C1C">Actor + Critic + Ref + Reward</text>
        </g>

        <!-- GRPO Stack -->
        <g transform="translate(215, 0)">
          <rect width="200" height="42" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
          <text x="10" y="18" class="label-text" fill="#15803D">GRPO: 2 Models in VRAM</text>
          <text x="10" y="32" class="token-text" fill="#15803D">Actor + Ref (Critic Eliminated!)</text>
        </g>
      </g>

      <text x="14" y="98" class="sub-text" style="font-weight: 700; fill: #1E293B;">Key Systems Takeaway:</text>
      <text x="14" y="114" class="sub-text">Eliminating the critic network frees ~50% GPU VRAM, enabling double the batch</text>
      <text x="14" y="128" class="sub-text">rollout concurrency on identical cluster hardware (DeepSeekMath, DeepSeek-R1).</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 432)">
    <rect width="910" height="78" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="16" y="22" class="sec-title" fill="#1E1B4B">Core Systems Invariant: Critic Elimination in Large-Scale RL</text>
    <text x="16" y="42" class="sub-text" fill="#334155">
      Traditional actor-critic algorithms (PPO) suffer from extreme communication and memory bottlenecks in LLM regimes, as the critic model
    </text>
    <text x="16" y="56" class="sub-text" fill="#334155">
      requires identical parameter capacity to the actor. By deriving advantage estimates directly from the empirical distribution of group rollouts,
    </text>
    <text x="16" y="70" class="sub-text" fill="#334155">
      GRPO transforms policy optimization into an embarrassingly parallel, memory-efficient pipeline with zero value network overhead.
    </text>
  </g>
</svg>
