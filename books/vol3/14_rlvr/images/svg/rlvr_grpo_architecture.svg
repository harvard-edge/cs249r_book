<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.05" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" />

  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="260" height="90" rx="2" fill="url(#secondaryGrad)" stroke="#D1D5DB" stroke-width="1.5" />
    <text x="20" y="25" font-weight="600" font-size="14" fill="#374151">Training Data Pipeline</text>
    <rect x="20" y="35" width="220" height="40" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="130" y="55" font-size="12" font-family="monospace" fill="#111827" text-anchor="middle">Prompt Dataset q ~ D</text>
    <text x="130" y="68" font-size="10" fill="#6B7280" text-anchor="middle">System Anchor + Task Specs</text>
  </g>

  <g transform="translate(340, 40)">
    <rect x="0" y="0" width="340" height="260" rx="2" fill="url(#primaryGrad)" stroke="#93C5FD" stroke-width="1.5" />
    <text x="20" y="25" font-weight="600" font-size="14" fill="#1E3A8A">Rollout Inference Fleet (vLLM / SGLang)</text>
    
    <rect x="20" y="40" width="300" height="50" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="170" y="60" font-size="13" font-weight="500" fill="#1E3A8A" text-anchor="middle">Single Prompt Prefill Pass</text>
    <text x="170" y="75" font-size="11" fill="#4B5563" text-anchor="middle">Compute KV-Cache for q once</text>
    
    <rect x="20" y="100" width="300" height="40" rx="4" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4"/>
    <text x="170" y="118" font-size="12" font-weight="500" fill="#1E40AF" text-anchor="middle">Shared Prefix KV-Cache Block Table</text>
    <text x="170" y="132" font-size="10" fill="#3B82F6" text-anchor="middle">(Pinned in GPU HBM, RefCount = G)</text>
    
    <rect x="20" y="160" width="300" height="85" rx="4" fill="rgba(255,255,255,0.6)" stroke="#93C5FD" stroke-width="1"/>
    <text x="30" y="178" font-size="11" font-weight="600" fill="#1E3A8A">Parallel Decode Streams (G Rollouts)</text>
    
    <rect x="30" y="190" width="280" height="20" rx="2" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="40" y="204" font-size="11" font-family="monospace" fill="#1F2937">Stream 1: o_1 ~ pi_old (Delta KV)</text>
    
    <rect x="30" y="215" width="280" height="20" rx="2" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="40" y="229" font-size="11" font-family="monospace" fill="#1F2937">Stream G: o_G ~ pi_old (Delta KV)</text>
    
    <circle cx="170" cy="210" r="1.5" fill="#9CA3AF"/>
    <circle cx="170" cy="214" r="1.5" fill="#9CA3AF"/>
  </g>

  <g transform="translate(720, 40)">
    <rect x="0" y="0" width="240" height="260" rx="2" fill="url(#secondaryGrad)" stroke="#D1D5DB" stroke-width="1.5" />
    <text x="20" y="25" font-weight="600" font-size="14" fill="#374151">Isolated Execution Substrate</text>
    
    <rect x="20" y="45" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="120" y="65" font-size="12" font-weight="500" fill="#111827" text-anchor="middle">MicroVM Sandbox 1</text>
    <text x="120" y="80" font-size="10" fill="#6B7280" text-anchor="middle">Compiler / Pytest</text>
    
    <rect x="20" y="110" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="120" y="130" font-size="12" font-weight="500" fill="#111827" text-anchor="middle">MicroVM Sandbox 2</text>
    <text x="120" y="145" font-size="10" fill="#6B7280" text-anchor="middle">Compiler / Pytest</text>
    
    <circle cx="120" cy="180" r="1.5" fill="#9CA3AF"/>
    <circle cx="120" cy="186" r="1.5" fill="#9CA3AF"/>
    <circle cx="120" cy="192" r="1.5" fill="#9CA3AF"/>
    
    <rect x="20" y="205" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="120" y="222" font-size="12" font-weight="500" fill="#111827" text-anchor="middle">MicroVM Sandbox G</text>
    <text x="120" y="236" font-size="10" fill="#6B7280" text-anchor="middle">Compiler / Pytest</text>
  </g>

  <g transform="translate(340, 360)">
    <rect x="0" y="0" width="620" height="110" rx="2" fill="url(#accentGrad)" stroke="#67E8F9" stroke-width="1.5" />
    <text x="20" y="25" font-weight="600" font-size="14" fill="#0E7490">Advantage Normalization &amp; Replay Buffer</text>
    
    <rect x="20" y="40" width="280" height="55" rx="4" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="160" y="58" font-size="12" font-weight="500" fill="#083344" text-anchor="middle">In-Group Statistics Engine</text>
    <text x="160" y="74" font-size="11" font-family="monospace" fill="#0F766E" text-anchor="middle">μ_q = avg(r_i), σ_q = std(r_i)</text>
    <text x="160" y="88" font-size="11" font-family="monospace" fill="#0F766E" text-anchor="middle">A_i = (r_i - μ_q) / (σ_q + ε)</text>
    
    <path d="M 310 67.5 L 330 67.5" fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="340" y="40" width="260" height="55" rx="4" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="470" y="58" font-size="12" font-weight="500" fill="#083344" text-anchor="middle">Asynchronous FIFO Replay</text>
    <text x="470" y="76" font-size="10" fill="#4B5563" text-anchor="middle">Decouples Heavy-Tailed Tool Latency</text>
    <text x="470" y="88" font-size="10" fill="#4B5563" text-anchor="middle">from GPU Training Loop</text>
  </g>

  <g transform="translate(340, 520)">
    <rect x="0" y="0" width="620" height="90" rx="2" fill="url(#primaryGrad)" stroke="#60A5FA" stroke-width="1.5" />
    <text x="20" y="25" font-weight="600" font-size="14" fill="#1E3A8A">Distributed Policy Training Cluster (Megatron-LM / ZeRO-3)</text>
    
    <rect x="20" y="40" width="580" height="35" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="310" y="56" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">Actor Policy Update (θ) via Clipped Surrogate Loss</text>
    <text x="310" y="70" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="500">Zero Critic Network VRAM Overhead</text>
  </g>

  <path d="M 300 85 L 330 85" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  
  <path d="M 510 130 L 510 140" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  
  <path d="M 680 170 L 710 170" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="160" font-size="10" fill="#6B7280" text-anchor="middle">Trajectory o_1</text>
  
  <path d="M 680 230 L 710 230" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="220" font-size="10" fill="#6B7280" text-anchor="middle">Trajectory o_G</text>

  <path d="M 840 300 L 840 330 L 650 330 L 650 350" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="320" font-size="11" font-weight="500" fill="#047857" text-anchor="middle">Rewards r_i</text>

  <path d="M 650 470 L 650 510" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="495" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">Mini-Batches (q, o_i, A_i)</text>

</svg>
