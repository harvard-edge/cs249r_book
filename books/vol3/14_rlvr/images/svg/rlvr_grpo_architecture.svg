<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="560" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- 1. TRAINING DATA PIPELINE (LEFT: x=40, w=200, h=230)              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="200" height="230" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">1. DATA PIPELINE</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 34)">
      <rect x="0" y="0" width="180" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">Prompt Dataset q ~ D</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="7" fill="#64748b">q = {anchor, spec, code}</text>
      <text x="8" y="44" font-size="7" fill="#334155">SWE-bench, LiveCodeBench</text>
    </g>

    <g transform="translate(10, 96)">
      <rect x="0" y="0" width="180" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">Test Harness Specs</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="7" fill="#64748b">tests/test_spec.py</text>
      <text x="8" y="44" font-size="7" fill="#334155">Golden assertions &amp; checks</text>
    </g>

    <g transform="translate(10, 158)">
      <rect x="0" y="0" width="180" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">Sharded Dispatch Queue</text>
      <text x="8" y="30" font-size="7" fill="#334155">Dispatches prompts to rollout</text>
      <text x="8" y="42" font-size="7" fill="#334155">engine; zero worker starvation</text>
      <rect x="8" y="46" width="164" height="12" rx="1" fill="#e2e8f0"/>
      <text x="90" y="55" text-anchor="middle" font-size="6.5" font-weight="700" fill="#475569">NON-BLOCKING IPC</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2: Prompt Dispatch -->
  <line x1="240" y1="187" x2="258" y2="187" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="249" y="180" text-anchor="middle" font-size="7" font-weight="700" fill="#64748b">q</text>

  <!-- ================================================================= -->
  <!-- 2. ROLLOUT INFERENCE FLEET (CENTER: x=260, w=380, h=230)          -->
  <!-- ================================================================= -->
  <g transform="translate(260, 72)">
    <rect x="0" y="0" width="380" height="230" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. ROLLOUT INFERENCE FLEET (vLLM / SGLang)</text>

    <!-- Sub-block 1: Single Prefill Pass -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="356" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Single Prompt Prefill Pass (FLOP Amortization)</text>
      <text x="10" y="30" font-size="7.2" fill="#334155">Computes initial KV activation tensors for prompt q exactly once across cluster.</text>
    </g>

    <!-- Sub-block 2: Pinned Radix Prefix KV -->
    <g transform="translate(12, 82)">
      <rect x="0" y="0" width="356" height="44" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0284c7">Pinned Radix Prefix KV Block Table</text>
      <text x="10" y="30" font-size="7.2" fill="#334155">Pinned in GPU HBM (Ref Count = G); 3.33× memory footprint reduction.</text>
    </g>

    <!-- Sub-block 3: Parallel Decode Streams -->
    <g transform="translate(12, 132)">
      <rect x="0" y="0" width="356" height="86" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">Parallel Decode Streams (G In-Group Rollouts)</text>

      <g transform="translate(10, 22)">
        <rect x="0" y="0" width="336" height="18" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-family="Courier, monospace" font-size="7" fill="#0369a1">Stream 1: o₁ ~ π_old (Delta KV pages allocated)</text>
      </g>

      <g transform="translate(10, 43)">
        <rect x="0" y="0" width="336" height="18" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-family="Courier, monospace" font-size="7" fill="#0369a1">Stream G: o_G ~ π_old (Delta KV pages allocated)</text>
      </g>

      <text x="10" y="78" font-size="7" fill="#64748b">PagedAttention virtual paging prevents token fragmentation during decode</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3: Trajectory Dispatch -->
  <line x1="640" y1="187" x2="658" y2="187" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="649" y="180" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">{o_i}</text>

  <!-- ================================================================= -->
  <!-- 3. ISOLATED EXECUTION SUBSTRATE (RIGHT: x=660, w=260, h=230)       -->
  <!-- ================================================================= -->
  <g transform="translate(660, 72)">
    <rect x="0" y="0" width="260" height="230" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">3. EXECUTION SUBSTRATE</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 34)">
      <rect x="0" y="0" width="240" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">MicroVM Sandbox 1</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="7" fill="#b45309">pytest -q tests/test_1.py</text>
      <text x="8" y="44" font-size="7" fill="#334155">Returns verified return r₁ ∈ {0, 1}</text>
    </g>

    <g transform="translate(10, 96)">
      <rect x="0" y="0" width="240" height="54" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">MicroVM Sandbox 2</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="7" fill="#b45309">cargo test --test lock_race</text>
      <text x="8" y="44" font-size="7" fill="#334155">Returns verified return r₂ ∈ {0, 1}</text>
    </g>

    <g transform="translate(10, 158)">
      <rect x="0" y="0" width="240" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">MicroVM Sandbox G</text>
      <text x="8" y="30" font-family="Courier, monospace" font-size="7" fill="#b45309">z3 solver verification</text>
      <text x="8" y="42" font-size="7" fill="#334155">Hermetic container boundary</text>
      <rect x="8" y="46" width="224" height="12" rx="1" fill="#fef3c7"/>
      <text x="120" y="55" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">OUT-OF-BAND EXECUTION</text>
    </g>
  </g>

  <!-- CONNECTOR 3 -> 4: Rewards Return downward -->
  <path d="M 790,302 L 790,314 L 790,320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- ================================================================= -->
  <!-- 4. IN-GROUP ADVANTAGE & REPLAY BUFFER (MIDDLE: x=40, w=880, h=118) -->
  <!-- ================================================================= -->
  <g transform="translate(40, 318)">
    <rect x="0" y="0" width="880" height="118" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">4. IN-GROUP ADVANTAGE NORMALIZATION &amp; ASYNCHRONOUS REPLAY BUFFER</text>

    <!-- Sub-block Left: Statistics Engine -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="418" height="76" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">In-Group Statistics Engine (Zero Critic Overhead)</text>
      <rect x="10" y="24" width="398" height="24" rx="1" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
      <text x="209" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#6d28d9">
        μ_q = (1/G)·∑ r_i,   σ_q = StdDev({r_i})  ⟹  Â_i = (r_i - μ_q) / (σ_q + ε)
      </text>
      <text x="10" y="62" font-size="7.2" fill="#334155">Standardized advantage A_i calculated in microseconds without value network passes</text>
    </g>

    <!-- Sub-block Right: Asynchronous Replay Buffer -->
    <g transform="translate(450, 32)">
      <rect x="0" y="0" width="418" height="76" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Asynchronous FIFO Replay Buffer</text>
      <text x="10" y="30" font-size="7.2" fill="#334155">Decouples heavy-tailed sandbox tool evaluation latencies from the GPU training loop.</text>
      <text x="10" y="44" font-size="7.2" fill="#334155">Surrogate policy ratio r_t(θ) safely tolerates off-policy drift up to τ_stale ≤ 4 steps.</text>
      <rect x="10" y="52" width="398" height="18" rx="1" fill="#f1f5f9"/>
      <text x="209" y="64" text-anchor="middle" font-size="7" font-weight="700" fill="#475569">ELIMINATES STRAGGLER GPU BUBBLES</text>
    </g>
  </g>

  <!-- CONNECTOR 4 -> 5: Mini-Batch Downward -->
  <line x1="480" y1="436" x2="480" y2="450" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <rect x="445" y="438" width="70" height="12" rx="1" fill="#ede9fe"/>
  <text x="480" y="447" text-anchor="middle" font-size="6.5" font-weight="700" fill="#6d28d9">Mini-Batches (q, o_i, Â_i)</text>

  <!-- ================================================================= -->
  <!-- 5. DISTRIBUTED POLICY TRAINING CLUSTER (BOTTOM: x=40, w=880, h=106)-->
  <!-- ================================================================= -->
  <g transform="translate(40, 452)">
    <rect x="0" y="0" width="880" height="114" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">5. DISTRIBUTED POLICY TRAINING CLUSTER (Megatron-LM / ZeRO-3 / FSDP)</text>

    <!-- Sub-block Left: Policy Loss -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="418" height="72" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0369a1">Actor Policy Update (θ) via Clipped Surrogate Loss</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="7" fill="#0f172a">L_clip = min( r_t(θ)·Â_i, clip(r_t(θ), 1-ε, 1+ε)·Â_i ) - β·D_KL</text>
      <text x="10" y="44" font-size="7.2" fill="#334155">Single all-reduce communication ring across all training ranks (zero collision).</text>
      <text x="10" y="58" font-size="7" fill="#64748b">Scales across 64+ H100 GPU nodes with near-linear throughput efficiency.</text>
    </g>

    <!-- Sub-block Right: Zero Critic Benefit -->
    <g transform="translate(450, 32)">
      <rect x="0" y="0" width="418" height="72" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Architectural Payoff: 47.1% Persistent VRAM Reclaimed</text>
      <text x="10" y="30" font-size="7.2" fill="#334155">Completely eliminates the critic model network, optimizer states, and gradients.</text>
      <text x="10" y="44" font-size="7.2" fill="#334155">Reclaimed accelerator memory expands KV-cache capacity from 4k to 16k context,</text>
      <text x="10" y="58" font-size="7.2" font-weight="700" fill="#15803d">enabling double the batch rollout concurrency on identical cluster infrastructure.</text>
    </g>
  </g>

</g>
</svg>