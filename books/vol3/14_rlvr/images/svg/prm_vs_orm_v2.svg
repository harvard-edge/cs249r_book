<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="560" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM INVARIANT                                         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 20)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.3">TRAJECTORY CREDIT ASSIGNMENT: OUTCOME (ORM) VS PROCESS REWARDS (PRM)</text>
    <text x="0" y="38" font-size="11" fill="#475569">Sutton-Barto Tree Backup Topologies: Sparse Terminal Signal vs Dense Step-Level Intermediate Credit</text>

    <!-- Formula Box -->
    <rect x="730" y="4" width="380" height="38" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="742" y="20" font-size="10" font-weight="700" fill="#581C87">Credit Trade-Off:</text>
    <text x="850" y="20" font-size="9" font-family="'SF Mono', monospace" fill="#1E293B">Var(ORM) &gt;&gt; Var(PRM)  |  Bias(PRM) &gt;&gt; Bias(ORM)</text>
    <text x="742" y="34" font-size="8.5" fill="#6B21A8">ORMs prevent intermediate gaming; PRMs accelerate search convergence</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: OUTCOME REWARD MODEL (ORM) TREE BACKUP                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="520" height="455" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#334155">A. OUTCOME REWARD MODEL (SPARSE TERMINAL BACKUP)</text>
    <text x="365" y="20" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">G_t = gamma^{T-t} * R(s_T)</text>

    <!-- Time Steps Ladder on Far Left -->
    <g transform="translate(25, 55)">
      <text x="0" y="25" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=0</text>
      <line x1="28" y1="22" x2="475" y2="22" stroke="#F1F5F9" stroke-width="1"/>

      <text x="0" y="105" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=1</text>
      <line x1="28" y1="102" x2="475" y2="102" stroke="#F1F5F9" stroke-width="1"/>

      <text x="0" y="185" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=2</text>
      <line x1="28" y1="182" x2="475" y2="182" stroke="#F1F5F9" stroke-width="1"/>

      <text x="0" y="265" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=T</text>
      <line x1="28" y1="262" x2="475" y2="262" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Tree Nodes -->
    <!-- Root s_0 at (260, 77) -->
    <circle cx="260" cy="77" r="12" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <text x="260" y="81" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">s_0</text>

    <!-- Branches from s_0 to s_1 (left) and s_1' (right) -->
    <line x1="260" y1="89" x2="180" y2="157" stroke="#475569" stroke-width="1.5"/>
    <line x1="260" y1="89" x2="340" y2="157" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="205" y="120" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">a_0 (r=0)</text>

    <!-- Node s_1 at (180, 157) -->
    <circle cx="180" cy="157" r="12" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <text x="180" y="161" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">s_1</text>

    <!-- Node s_1' at (340, 157) (Unexplored) -->
    <circle cx="340" cy="157" r="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="340" y="160" font-size="8" fill="#94A3B8" text-anchor="middle">s_1'</text>

    <!-- Branches from s_1 to s_2 (left: flawed action a_1) and s_2' (right) -->
    <line x1="180" y1="169" x2="140" y2="237" stroke="#991B1B" stroke-width="2"/>
    <line x1="180" y1="169" x2="230" y2="237" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="145" y="200" font-size="8" font-family="'SF Mono', monospace" fill="#991B1B">a_1 (r=0)</text>

    <!-- Node s_2 at (140, 237) - Flawed state -->
    <circle cx="140" cy="237" r="12" fill="#FEF2F2" stroke="#991B1B" stroke-width="2"/>
    <text x="140" y="241" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">s_2</text>
    <text x="140" y="258" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">Defect introduced</text>

    <!-- Node s_2' at (230, 237) -->
    <circle cx="230" cy="237" r="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="230" y="240" font-size="8" fill="#94A3B8" text-anchor="middle">s_2'</text>

    <!-- Branches from s_2 to terminal leaf s_T -->
    <line x1="140" y1="249" x2="140" y2="317" stroke="#991B1B" stroke-width="2"/>
    <text x="155" y="288" font-size="8" font-family="'SF Mono', monospace" fill="#991B1B">a_2 (r=0)</text>

    <!-- Terminal Leaf Node s_T at (140, 317) -->
    <circle cx="140" cy="317" r="13" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
    <text x="140" y="321" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">s_T</text>

    <!-- Terminal Reward Tag: R = 0 (Oracle Test Failure) -->
    <rect x="165" y="307" width="105" height="22" rx="3" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2"/>
    <text x="217" y="322" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#991B1B" text-anchor="middle">R(s_T) = 0</text>

    <!-- Backward Credit Propagation Arcs (Propagating R=0 all the way back) -->
    <path d="M 120 317 C 80 270, 80 200, 120 157" fill="none" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
    <text x="75" y="210" font-size="8" font-weight="700" fill="#991B1B" transform="rotate(-90, 75, 210)" text-anchor="middle">G_t = 0 backup</text>

    <!-- Pathological Credit Assignment Callout -->
    <g transform="translate(20, 375)">
      <rect x="0" y="0" width="480" height="65" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#991B1B">Pathological Variance &amp; Credit Blame:</text>
      <text x="12" y="30" font-size="8.5" fill="#334155">A single defect at turn t=1 causes terminal failure (R=0). The ORM</text>
      <text x="12" y="44" font-size="8.5" fill="#334155">uniformly penalizes the valid deduction at t=0, inflating gradient variance.</text>
      <text x="12" y="58" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">Grad Variance: high  |  Verifier Gaming: zero</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: PROCESS REWARD MODEL (PRM) TREE BACKUP               -->
  <!-- ================================================================= -->
  <g transform="translate(590, 80)">
    <rect x="0" y="0" width="520" height="455" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="30" rx="6" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#166534">B. PROCESS REWARD MODEL (DENSE STEP-LEVEL BACKUP)</text>
    <text x="360" y="20" font-size="9.5" fill="#15803D" font-family="'SF Mono', monospace">r_t = r(s_t, a_t) in [-1, +1]</text>

    <!-- Time Steps Ladder on Far Left -->
    <g transform="translate(25, 55)">
      <text x="0" y="25" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=0</text>
      <line x1="28" y1="22" x2="475" y2="22" stroke="#F1F5F9" stroke-width="1"/>

      <text x="0" y="105" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=1</text>
      <line x1="28" y1="102" x2="475" y2="102" stroke="#F1F5F9" stroke-width="1"/>

      <text x="0" y="185" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=2</text>
      <line x1="28" y1="182" x2="475" y2="182" stroke="#F1F5F9" stroke-width="1"/>

      <text x="0" y="265" font-size="9" font-family="'SF Mono', monospace" fill="#94A3B8">t=T</text>
      <line x1="28" y1="262" x2="475" y2="262" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Tree Nodes -->
    <!-- Root s_0 at (260, 77) -->
    <circle cx="260" cy="77" r="12" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <text x="260" y="81" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">s_0</text>

    <!-- Branch from s_0 to s_1 (Valid deduction) -->
    <line x1="260" y1="89" x2="180" y2="157" stroke="#166534" stroke-width="2.5"/>
    <line x1="260" y1="89" x2="340" y2="157" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Dense Reward Tag for Step 0 -> Step 1: r_0 = +1.0 -->
    <rect x="155" y="112" width="70" height="18" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="1"/>
    <text x="190" y="124" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="middle">r_0 = +1.0</text>

    <!-- Node s_1 at (180, 157) -->
    <circle cx="180" cy="157" r="12" fill="#F0FDF4" stroke="#166534" stroke-width="2"/>
    <text x="180" y="161" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">s_1</text>
    <text x="202" y="161" font-size="8" font-weight="700" fill="#166534">Valid analysis</text>

    <!-- Node s_1' at (340, 157) (Unexplored) -->
    <circle cx="340" cy="157" r="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="340" y="160" font-size="8" fill="#94A3B8" text-anchor="middle">s_1'</text>

    <!-- Branch from s_1 to s_2 (Flawed lock action a_1) -->
    <line x1="180" y1="169" x2="140" y2="237" stroke="#991B1B" stroke-width="2.5"/>
    <!-- Alternative valid branch s_1 -> s_2* (Pruned/Recovered) -->
    <line x1="180" y1="169" x2="230" y2="237" stroke="#166534" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="235" y="210" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534">r_1' = +0.8</text>

    <!-- Dense Penalty Tag for Step 1 -> Step 2: r_1 = -1.0 -->
    <rect x="95" y="192" width="70" height="18" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1"/>
    <text x="130" y="204" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#991B1B" text-anchor="middle">r_1 = -1.0</text>

    <!-- Node s_2 at (140, 237) - Flawed state -->
    <circle cx="140" cy="237" r="12" fill="#FEF2F2" stroke="#991B1B" stroke-width="2"/>
    <text x="140" y="241" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">s_2</text>
    <text x="140" y="258" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">Deadlock fault</text>

    <!-- Node s_2* at (230, 237) -->
    <circle cx="230" cy="237" r="10" fill="#F0FDF4" stroke="#166534" stroke-width="1"/>
    <text x="230" y="240" font-size="8" fill="#166534" text-anchor="middle">s_2*</text>
    <text x="230" y="258" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Recovery path</text>

    <!-- Branch from s_2 to terminal leaf s_T -->
    <line x1="140" y1="249" x2="140" y2="317" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="155" y="288" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">r_2 = 0.0</text>

    <!-- Terminal Leaf Node s_T at (140, 317) -->
    <circle cx="140" cy="317" r="13" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
    <text x="140" y="321" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">s_T</text>

    <!-- Immediate Credit Isolation Arcs -->
    <path d="M 195 145 C 220 125, 235 105, 248 89" fill="none" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="245" y="125" font-size="8" font-weight="700" fill="#166534">Isolated positive credit (+1.0)</text>

    <!-- PRM Search Guidance Callout -->
    <g transform="translate(20, 375)">
      <rect x="0" y="0" width="480" height="65" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#166534">Surgical Step-Level Credit Assignment:</text>
      <text x="12" y="30" font-size="8.5" fill="#15803D">PRM pinpoints the defect at turn t=1. Turn t=0 retains positive</text>
      <text x="12" y="44" font-size="8.5" fill="#15803D">credit; search tree prunes the deadlock branch immediately.</text>
      <text x="12" y="58" font-size="8" font-family="'SF Mono', monospace" fill="#166534">Grad Variance: low  |  Search Guidance: optimal</text>
    </g>
  </g>
</svg>
