<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .panel-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; line-height: 1.4; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
    .code-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #dc2626; font-weight: 600; }
    .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #b45309; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #059669; font-weight: 600; }
    .code-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #2563eb; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #1e293b; }
    .bar-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #0f172a; }
  </style>

  <!-- ==================== LEFT PANEL: PPO TOPOLOGY ==================== -->
  <g transform="translate(15, 15)">
    <rect class="panel-card" x="0" y="0" width="560" height="550"/>
    <rect class="header-box" x="12" y="12" width="536" height="42" fill="#fee2e2"/>
    <text class="title-text" x="22" y="32">Classical PPO Distributed Topology (4 Concurrent Networks)</text>
    <text class="subtitle-text" x="22" y="47">70B Parameter Model | Dual All-Reduce Rings | High VRAM Allocation</text>

    <!-- Block 1: Memory Map (80 GB GPU) -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="536" height="88"/>
      <text class="dim-label" x="12" y="18">ACCELERATOR MEMORY MAP (73.4 GB / 80 GB ALLOCATED : 91.8%)</text>

      <!-- Segmented Bar (512px total width for 80GB -> 6.4 px/GB) -->
      <g transform="translate(12, 28)">
        <!-- Actor (28 GB = 179px) -->
        <rect x="0" y="0" width="179" height="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text class="bar-text" x="89" y="14">Actor π_θ (28.0 GB)</text>

        <!-- Critic (28 GB = 179px) -->
        <rect x="179" y="0" width="179" height="28" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text class="bar-text" x="268" y="14" fill="#991b1b">Critic V_φ (28.0 GB)</text>

        <!-- Ref (8.7 GB = 56px) -->
        <rect x="358" y="0" width="56" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text class="bar-text" x="386" y="14">Ref (8.7G)</text>

        <!-- RM (8.7 GB = 56px) -->
        <rect x="414" y="0" width="56" height="28" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text class="bar-text" x="442" y="14" fill="#92400e">RM (8.7G)</text>

        <!-- Headroom (6.6 GB = 42px) -->
        <rect x="470" y="0" width="42" height="28" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text class="bar-text" x="491" y="14" font-size="8.5px" fill="#dc2626">6.6G</text>
      </g>

      <text class="body-text" x="12" y="76" font-size="10px" fill="#b91c1c">Critical Bottleneck: Only 6.6 GB headroom for KV cache and activation tensors (context &lt;= 4k).</text>
    </g>

    <!-- Block 2: Distributed Topology & Rings -->
    <g transform="translate(12, 166)">
      <rect class="inner-box" x="0" y="0" width="536" height="210"/>
      <text class="dim-label" x="12" y="18">DISTRIBUTED CLUSTER TOPOLOGY &amp; INTERCONNECT</text>

      <!-- Actor Fleet Box -->
      <g transform="translate(16, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text class="code-blue" x="12" y="20">Actor Fleet (32 GPUs)</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Generates rollout trajectories τ</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Forward + backward policy loss</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-blue" x="117" y="62" font-size="8.5px" text-anchor="middle">Ring 1: Actor All-Reduce</text>
      </g>

      <!-- Critic Fleet Box -->
      <g transform="translate(285, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <text class="code-red" x="12" y="20">Critic Fleet (32 GPUs)</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Estimates baseline value V_φ(s_t)</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Forward + backward TD value loss</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text class="code-red" x="117" y="62" font-size="8.5px" text-anchor="middle">Ring 2: Critic All-Reduce</text>
      </g>

      <!-- Interconnect Collision Box -->
      <rect x="16" y="114" width="504" height="40" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text class="code-red" x="22" y="130" font-size="9.5px">Interconnect Contention: Dual All-Reduce Traffic Collision</text>
      <text class="body-text" x="22" y="145" font-size="9px">Actor and Critic gradient broadcasts saturate RoCE fabric; 60%+ wall-clock spent in bubbles.</text>

      <!-- Synchronous Barrier Box -->
      <rect x="16" y="162" width="504" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
      <text class="code-text" x="22" y="178" font-size="9.5px">Synchronous Lockstep Barrier: GAE Value Coupling</text>
      <text class="body-text" x="22" y="193" font-size="9px">Policy gradient updates stall awaiting Critic convergence; single slow node halts all 64 GPUs.</text>
    </g>

    <!-- Block 3: Systems Tradeoff Metrics -->
    <g transform="translate(12, 388)">
      <rect class="inner-box" x="0" y="0" width="536" height="148"/>
      <text class="dim-label" x="14" y="18">SYSTEMS OPERATIONAL PROFILE</text>

      <text class="dim-label" x="14" y="38">Persistent VRAM:</text>
      <text class="code-red" x="135" y="38">73.4 GB / GPU (91.8% allocated)</text>

      <text class="dim-label" x="14" y="58">Active Networks:</text>
      <text class="dim-val" x="135" y="58">4 (Actor, Critic, Reference, Reward Model)</text>

      <text class="dim-label" x="14" y="78">Fabric Traffic:</text>
      <text class="code-red" x="135" y="78">Dual all-reduce rings (high RoCE contention)</text>

      <text class="dim-label" x="14" y="98">Serving Context:</text>
      <text class="dim-val" x="135" y="98">Truncated batch size B=1, max 4k token context</text>

      <line x1="14" y1="108" x2="522" y2="108" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="14" y="126">Verdict:</text>
      <text class="body-text" x="14" y="140" font-size="10px">Severe accelerator memory bottleneck; value fitting induces pipeline bubbles.</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: GRPO TOPOLOGY ==================== -->
  <g transform="translate(605, 15)">
    <rect class="panel-card" x="0" y="0" width="560" height="550"/>
    <rect class="header-box" x="12" y="12" width="536" height="42" fill="#dcfce7"/>
    <text class="title-text" x="22" y="32">GRPO Distributed Topology (Critic-Free Group Advantage)</text>
    <text class="subtitle-text" x="22" y="47">Critic &amp; Reward Model Eliminated | 50.0% VRAM Reclaimed | Single All-Reduce</text>

    <!-- Block 1: Memory Map (80 GB GPU) -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="536" height="88"/>
      <text class="dim-label" x="12" y="18">ACCELERATOR MEMORY MAP (36.7 GB / 80 GB ALLOCATED : 45.9%)</text>

      <!-- Segmented Bar (512px total width -> 6.4 px/GB) -->
      <g transform="translate(12, 28)">
        <!-- Actor (28 GB = 179px) -->
        <rect x="0" y="0" width="179" height="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text class="bar-text" x="89" y="14">Actor π_θ (28.0 GB)</text>

        <!-- Ref (8.7 GB = 56px) -->
        <rect x="179" y="0" width="56" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text class="bar-text" x="207" y="14">Ref (8.7G)</text>

        <!-- Critic Reclaimed Slot (28 GB = 179px) -->
        <rect x="235" y="0" width="179" height="28" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text class="bar-text" x="324" y="14" fill="#15803d">Critic ELIMINATED (-28.0 GB)</text>

        <!-- Reclaimed Headroom (15.3 GB remaining = 98px) -->
        <rect x="414" y="0" width="98" height="28" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
        <text class="bar-text" x="463" y="14" fill="#15803d">Headroom 15.3 GB</text>
      </g>

      <text class="body-text" x="12" y="76" font-size="9.5px" fill="#15803d">50.0% Persistent VRAM Reclaimed: 43.3 GB free for KV cache and 16k–64k context.</text>
    </g>

    <!-- Block 2: Distributed Topology & Execution Fleet -->
    <g transform="translate(12, 166)">
      <rect class="inner-box" x="0" y="0" width="536" height="210"/>
      <text class="dim-label" x="12" y="18">DISTRIBUTED CLUSTER TOPOLOGY &amp; EXECUTION ORACLE</text>

      <!-- Unified Training Fleet Box -->
      <g transform="translate(16, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text class="code-green" x="12" y="20">Training Fleet: π_θ (64 GPUs)</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Unified compute capacity</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Single gradient backprop stage</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text class="code-green" x="117" y="62" font-size="8.5px" text-anchor="middle">Single All-Reduce Ring</text>
      </g>

      <!-- Verifier Execution Sandboxes Box -->
      <g transform="translate(285, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
        <text class="code-amber" x="12" y="20" fill="#b45309">Verifier Fleet: CPU MicroVMs</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Compilers, unit tests, Lean 4</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Hermetic out-of-band execution</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        <text class="code-green" x="117" y="62" font-size="8.5px" text-anchor="middle">Mechanical Return R in {0, 1}</text>
      </g>

      <!-- In-Group Advantage Box -->
      <rect x="16" y="114" width="504" height="40" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text class="code-green" x="22" y="130" font-size="9.5px">In-Group Statistical Normalization: A_i = (R(τ_i) - μ_g) / (σ_g + ε)</text>
      <text class="body-text" x="22" y="145" font-size="9px">Standardized group advantages computed in host DRAM (microseconds); zero critic backprop.</text>

      <!-- Radix Sharing Box -->
      <rect x="16" y="162" width="504" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="22" y="178" font-size="9.5px">Radix-Tree Shared Prefix Caching &amp; Asynchronous Replay</text>
      <text class="body-text" x="22" y="193" font-size="9px">G=8 rollouts share prompt KV blocks (3.3x KV reduction); replay buffer decouples latency.</text>
    </g>

    <!-- Block 3: Systems Tradeoff Metrics -->
    <g transform="translate(12, 388)">
      <rect class="inner-box" x="0" y="0" width="536" height="148"/>
      <text class="dim-label" x="14" y="18">SYSTEMS OPERATIONAL PROFILE</text>

      <text class="dim-label" x="14" y="38">Persistent VRAM:</text>
      <text class="code-green" x="135" y="38">36.7 GB / GPU (45.9% allocated, 50.0% saved)</text>

      <text class="dim-label" x="14" y="58">Active Networks:</text>
      <text class="dim-val" x="135" y="58">2 (Actor, Reference; 0 value networks)</text>

      <text class="dim-label" x="14" y="78">Fabric Traffic:</text>
      <text class="code-green" x="135" y="78">Single all-reduce ring (zero network collision)</text>

      <text class="dim-label" x="14" y="98">Serving Context:</text>
      <text class="dim-val" x="135" y="98">G=8 parallel streams, 16k–64k reasoning context</text>

      <line x1="14" y1="108" x2="522" y2="108" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="14" y="126">Verdict:</text>
      <text class="body-text" x="14" y="140" font-size="10px">Reclaims 36.7 GB VRAM (critic + reward model); eliminates value bubbles and scales exploration.</text>
    </g>
  </g>
</svg>
