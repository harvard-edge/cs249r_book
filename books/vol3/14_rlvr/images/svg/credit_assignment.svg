      <text x="8" y="15" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#991B1B">t₄₀: Pytest</text>
      <text x="8" y="30" font-size="7.5" fill="#7F1D1D">Deadlock timeout</text>
      <rect x="8" y="40" width="96" height="18" rx="1" fill="#FEE2E2"/>
      <text x="56" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#991B1B">R(τ) = 0.00</text>
    </g>

