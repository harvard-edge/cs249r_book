      <line x1="60" y1="21" x2="200" y2="20" stroke="#15803D" stroke-width="2"/>
      <circle cx="60" cy="21" r="3" fill="#15803D"/>

      <line x1="200" y1="20" x2="345" y2="19" stroke="#15803D" stroke-width="2"/>
      <circle cx="200" cy="20" r="3" fill="#15803D"/>

      <!-- Catastrophic Collapse -->
      <line x1="345" y1="19" x2="495" y2="52" stroke="#DC2626" stroke-width="2" stroke-dasharray="3,2"/>
      <circle cx="345" cy="19" r="3.5" fill="#15803D"/>
      <circle cx="495" cy="52" r="3.5" fill="#DC2626"/>

      <line x1="495" y1="52" x2="650" y2="52" stroke="#DC2626" stroke-width="2"/>
      <circle cx="650" cy="52" r="3" fill="#D97706"/>

      <line x1="650" y1="52" x2="800" y2="52" stroke="#DC2626" stroke-width="2"/>
      <circle cx="800" cy="52" r="3" fill="#991B1B"/>

      <!-- Annotations -->
