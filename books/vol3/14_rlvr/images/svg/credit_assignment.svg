        <rect x="-80" y="-8" width="160" height="14" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8"/>
        <text x="0" y="2" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#B91C1C">Pivotal Inflection: Δ₃ = -0.88</text>
      </g>
      <text x="700" y="44" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Latent value remains 0.00 despite passing linters</text>
    </g>
