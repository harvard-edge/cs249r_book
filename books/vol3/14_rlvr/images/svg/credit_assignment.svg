<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #E0E7FF; }
      .sec-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #1E1B4B; }
      .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; }
      .node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
      .token-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; }
      .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; line-height: 1.4; }
      .arrow { stroke: #64748B; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="grad-head-ca" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <marker id="arr-ca" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#64748B" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#F8FAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="16" width="910" height="44" rx="6" fill="url(#grad-head-ca)" />
  <text x="42" y="43" class="banner-title">Figure 5.7: Temporal Credit Assignment &amp; Value Collapse</text>
  <text x="600" y="43" class="banner-sub">Pivotal Failure Localization Across 40 Turns</text>

  <!-- Upper Panel: Trajectory Evolution & State Value Timeline -->
  <g transform="translate(25, 70)">
    <rect width="910" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25" />
    <rect width="910" height="26" rx="8" fill="#F1F5F9" />
    <rect y="18" width="910" height="8" fill="#F1F5F9" />
    <text x="16" y="18" class="sec-title">Execution Trace &amp; Latent State Value Collapse V(s_t)</text>

    <!-- State Value Axis and Curve -->
    <g transform="translate(20, 36)">
      <!-- Value Axis Line -->
      <line x1="0" y1="12" x2="870" y2="12" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" />
      <text x="872" y="15" class="token-text" fill="#94A3B8">V=1.0</text>
      <line x1="0" y1="100" x2="870" y2="100" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" />
      <text x="872" y="103" class="token-text" fill="#94A3B8">V=0.0</text>

      <!-- Step 1 Node -->
      <g transform="translate(10, 8)">
        <rect width="125" height="100" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" />
        <text x="8" y="18" class="node-title" fill="#15803D">Turn 01: Inspect</text>
        <text x="8" y="32" class="node-desc">Grep crash logs &amp;</text>
        <text x="8" y="44" class="node-desc">reproduce deadlock</text>
        <rect x="8" y="52" width="109" height="16" rx="3" fill="#DCFCE7" />
        <text x="62" y="63" class="badge" fill="#15803D">V(s₁) = 0.85</text>
        <text x="8" y="82" class="node-desc" fill="#166534">Correct diagnostic</text>
      </g>

      <!-- Arrow 1->2 -->
      <path d="M 135 58 L 150 58" class="arrow" marker-end="url(#arr-ca)" />

      <!-- Step 2 Node -->
      <g transform="translate(155, 8)">
        <rect width="125" height="100" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" />
        <text x="8" y="18" class="node-title" fill="#15803D">Turn 02: Trace</text>
        <text x="8" y="32" class="node-desc">Locate shared mutex</text>
        <text x="8" y="44" class="node-desc">in session_mgr.py</text>
        <rect x="8" y="52" width="109" height="16" rx="3" fill="#DCFCE7" />
        <text x="62" y="63" class="badge" fill="#15803D">V(s₂) = 0.87</text>
        <text x="8" y="82" class="node-desc" fill="#166534">Pinpoints lock site</text>
      </g>

      <!-- Arrow 2->3 -->
      <path d="M 280 58 L 295 58" class="arrow" marker-end="url(#arr-ca)" />

      <!-- Step 3 Node -->
      <g transform="translate(300, 8)">
        <rect width="130" height="100" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" />
        <text x="8" y="18" class="node-title" fill="#15803D">Turn 03: Plan Fix</text>
        <text x="8" y="32" class="node-desc">Isolates critical race;</text>
        <text x="8" y="44" class="node-desc">proposes lock reorder</text>
        <rect x="8" y="52" width="114" height="16" rx="3" fill="#DCFCE7" />
        <text x="65" y="63" class="badge" fill="#15803D">V(s₃) = 0.88</text>
        <text x="8" y="82" class="node-desc" fill="#166534">Peak solution state</text>
      </g>

      <!-- Arrow 3->4 (Warning Collapse) -->
      <path d="M 430 58 L 448 58" stroke="#DC2626" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-red)" />

      <!-- Step 4 Node: Fatal Inflection -->
      <g transform="translate(452, 8)">
        <rect width="140" height="100" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
        <text x="8" y="18" class="node-title" fill="#B91C1C">Turn 04: Invert Lock</text>
        <text x="8" y="32" class="node-desc">Acquires L2 before L1</text>
        <text x="8" y="44" class="node-desc">Fatal AB-BA deadlock!</text>
        <rect x="8" y="52" width="124" height="16" rx="3" fill="#FEE2E2" />
        <text x="70" y="63" class="badge" fill="#DC2626">V(s₄) = 0.00 (Collapse)</text>
        <rect x="8" y="74" width="124" height="16" rx="3" fill="#B91C1C" />
        <text x="70" y="85" class="badge" fill="#FFFFFF">Δ₃ = -0.88 (Pivotal Error)</text>
      </g>

      <!-- Arrow 4->5 -->
      <path d="M 592 58 L 607 58" class="arrow" marker-end="url(#arr-ca)" />

      <!-- Steps 5-6 Node: Deceptive Intermediate Passes -->
      <g transform="translate(612, 8)">
        <rect width="130" height="100" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
        <text x="8" y="18" class="node-title" fill="#B45309">Turns 05–06: Linter</text>
        <text x="8" y="32" class="node-desc">Runs flake8 &amp; mypy</text>
        <text x="8" y="44" class="node-desc">Exit 0 (Syntax clean)</text>
        <rect x="8" y="52" width="114" height="16" rx="3" fill="#FEF3C7" />
        <text x="65" y="63" class="badge" fill="#B45309">V(s₅) = 0.00 (Poisoned)</text>
        <text x="8" y="82" class="node-desc" fill="#78350F">End-to-End Blind Spot</text>
      </g>

      <!-- Ellipsis Arrow -->
      <path d="M 742 58 L 762 58" class="arrow" stroke-dasharray="2,2" marker-end="url(#arr-ca)" />

      <!-- Step 40 Node: Terminal Failure -->
      <g transform="translate(767, 8)">
        <rect width="100" height="100" rx="6" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5" />
        <text x="8" y="18" class="node-title" fill="#991B1B">Turn 40: Pytest</text>
        <text x="8" y="32" class="node-desc">Integration suite</text>
        <text x="8" y="44" class="node-desc">Deadlock timeout</text>
        <rect x="8" y="52" width="84" height="16" rx="3" fill="#FEE2E2" />
        <text x="50" y="63" class="badge" fill="#991B1B">R = 0.00</text>
        <text x="8" y="82" class="node-desc" fill="#991B1B">FAILED TERMINAL</text>
      </g>
    </g>

    <!-- State Value Trajectory Graph Line at Bottom of Panel -->
    <g transform="translate(30, 145)">
      <text x="0" y="24" class="token-text" fill="#64748B">Latent V(s_t) Curve:</text>
      <line x1="120" y1="18" x2="430" y2="18" stroke="#16A34A" stroke-width="2.5" />
      <circle cx="120" cy="18" r="3.5" fill="#16A34A" />
      <circle cx="260" cy="18" r="3.5" fill="#16A34A" />
      <circle cx="430" cy="18" r="3.5" fill="#16A34A" />
      <line x1="430" y1="18" x2="480" y2="32" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4,2" />
      <circle cx="480" cy="32" r="3.5" fill="#DC2626" />
      <line x1="480" y1="32" x2="840" y2="32" stroke="#DC2626" stroke-width="2.5" />
      <circle cx="640" cy="32" r="3.5" fill="#DC2626" />
      <circle cx="840" cy="32" r="3.5" fill="#DC2626" />
      <text x="495" y="22" class="token-text" fill="#DC2626" font-weight="700">Drop: Δ₃ = -0.88</text>
    </g>
  </g>

  <!-- Lower Comparison Cards: ORM vs Counterfactual Advantage -->
  <g transform="translate(25, 275)">
    <!-- Left Card: Classical Outcome Reward Model (ORM / Trajectory GRPO) -->
    <g transform="translate(0, 0)">
      <rect width="445" height="245" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.25" />
      <rect width="445" height="26" rx="8" fill="#FFF1F2" />
      <rect y="18" width="445" height="8" fill="#FFF1F2" />
      <text x="14" y="18" class="sec-title" fill="#9F1239">Trajectory-Level GRPO (Outcome Reward Oracle)</text>

      <g transform="translate(14, 36)">
        <!-- Reward Bar -->
        <rect width="417" height="32" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1" />
        <text x="12" y="20" class="token-text" fill="#991B1B">Terminal Oracle: R_total(τ) = 0.00  |  Advantages: Â_t = -0.71 (all t)</text>

        <!-- Structural Issues -->
        <g transform="translate(0, 44)">
          <text x="4" y="14" class="node-title" fill="#BE123C">1. Uniform Credit Dilution across 40 Steps:</text>
          <text x="14" y="28" class="body-text">Because R(τ) is evaluated only at Turn 40, the update applies an identical</text>
          <text x="14" y="41" class="body-text">negative policy gradient penalty across all 40 turns uniformly.</text>

          <text x="4" y="62" class="node-title" fill="#BE123C">2. Destructive Gradient Penalties on Flawless Steps:</text>
          <text x="14" y="76" class="body-text">Turns 01–03 performed flawless diagnostic reasoning, yet their log-probs</text>
          <text x="14" y="89" class="body-text">are suppressed just as severely as Turn 04 (false negative updates).</text>

          <text x="4" y="110" class="node-title" fill="#BE123C">3. Saltzer's End-to-End Blind Spot:</text>
          <text x="14" y="124" class="body-text">Intermediate linter passes (Turns 05–06) cannot substitute for terminal</text>
          <text x="14" y="137" class="body-text">oracle verification, masking the true root failure.</text>
        </g>
      </g>
    </g>

    <!-- Right Card: Counterfactual Advantage Estimation via Branching -->
    <g transform="translate(465, 0)">
      <rect width="445" height="245" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.25" />
      <rect width="445" height="26" rx="8" fill="#EFF6FF" />
      <rect y="18" width="445" height="8" fill="#EFF6FF" />
      <text x="14" y="18" class="sec-title" fill="#1E40AF">Counterfactual Branching Advantage Estimation</text>

      <g transform="translate(14, 36)">
        <!-- Formula Box -->
        <rect width="417" height="32" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
        <text x="10" y="20" class="token-text" fill="#1E3A8A">Δ_t = Q̂^π(s_t, a_t) - V̂^π(s_t) = E[V^π(s_{t+1})] - V^π(s_t)</text>

        <!-- Mechanisms -->
        <g transform="translate(0, 44)">
          <text x="4" y="14" class="node-title" fill="#1D4ED8">1. Precise Point-of-Failure Isolation:</text>
          <text x="14" y="28" class="body-text">At Turn 03: Q̂(s₃, a₄) ≈ V(s₄) = 0.00 while baseline V̂(s₃) = 0.88.</text>
          <text x="14" y="41" class="body-text">Action advantage Δ₃ = -0.88 pinpoints Turn 04 as the catastrophic error.</text>

          <text x="4" y="62" class="node-title" fill="#1D4ED8">2. Credit Protection for Valid Reasoning:</text>
          <text x="14" y="76" class="body-text">Turns 01–03 receive near-zero or positive advantages (Δ₁ ≈ +0.02),</text>
          <text x="14" y="89" class="body-text">preserving the policy's exploratory diagnostic and planning circuits.</text>

          <text x="4" y="110" class="node-title" fill="#1D4ED8">3. Hardware Amortization via RadixAttention:</text>
          <text x="14" y="124" class="body-text">Shared KV prefix cache eliminates redundant prefill (TTFT &lt; 1 ms),</text>
          <text x="14" y="137" class="body-text">enabling M=4 counterfactual rollouts without HBM memory explosion.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
