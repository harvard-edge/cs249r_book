      <!-- Baseline Axis -->
      <line x1="60" y1="18" x2="840" y2="18" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="60" y1="52" x2="840" y2="52" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="21" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#64748B">V=1.0</text>
      <text x="12" y="55" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#64748B">V=0.0</text>

