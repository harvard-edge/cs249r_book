    <g transform="translate(444, 32)">
      <rect width="128" height="66" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
      <text x="8" y="15" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#991B1B">t₄: InvertLock()</text>
      <text x="8" y="30" font-size="7.5" font-weight="700" fill="#DC2626">Fatal AB-BA Deadlock</text>
      <rect x="8" y="40" width="112" height="18" rx="1" fill="#FEE2E2"/>
      <text x="64" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#DC2626">V(s₄) = 0.00</text>
    </g>

    <line x1="576" y1="65" x2="596" y2="65" stroke="#D97706" stroke-width="1.3" marker-end="url(#arr-gray)"/>

