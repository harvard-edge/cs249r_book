<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Standard Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748B"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#15803D"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#DC2626"/>
    </marker>
    <marker id="arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="940" height="480" fill="#FFFFFF" rx="2"/>

  <!-- ================================================================= -->
  <!-- (a) 40-TURN AGENT TRAJECTORY & LATENT VALUE COLLAPSE V(s_t)       -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="880" height="190" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
    <rect width="880" height="22" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <text x="14" y="15" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">(a) TRAJECTORY LATENT VALUE COLLAPSE V(s_t) ACROSS 40 TURNS</text>

    <!-- Turn 01 -->
    <g transform="translate(15, 32)">
      <rect width="116" height="66" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.1"/>
      <text x="8" y="15" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">t₁: Inspect(logs)</text>
      <text x="8" y="30" font-size="7.5" fill="#334155">Reproduce deadlock</text>
      <rect x="8" y="40" width="100" height="18" rx="1" fill="#DCFCE7"/>
      <text x="58" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#15803D">V(s₁) = 0.85</text>
    </g>

    <line x1="135" y1="65" x2="155" y2="65" stroke="#15803D" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Turn 02 -->
    <g transform="translate(158, 32)">
      <rect width="116" height="66" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.1"/>
      <text x="8" y="15" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">t₂: Trace(mutex)</text>
      <text x="8" y="30" font-size="7.5" fill="#334155">Locate race in mgr</text>
      <rect x="8" y="40" width="100" height="18" rx="1" fill="#DCFCE7"/>
      <text x="58" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#15803D">V(s₂) = 0.87</text>
    </g>

    <line x1="278" y1="65" x2="298" y2="65" stroke="#15803D" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <!-- Turn 03 -->
    <g transform="translate(301, 32)">
      <rect width="116" height="66" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.1"/>
      <text x="8" y="15" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">t₃: Plan(order)</text>
      <text x="8" y="30" font-size="7.5" fill="#334155">Acquisition plan</text>
      <rect x="8" y="40" width="100" height="18" rx="1" fill="#DCFCE7"/>
      <text x="58" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#15803D">V(s₃) = 0.88</text>
