  <!-- ================================================================= -->
  <!-- (b) TERMINAL ORM CREDIT DILUTION (Left)                           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 225)">
    <rect width="425" height="235" rx="2" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
    <rect width="425" height="22" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#991B1B">(b) TERMINAL ORM: UNIFORM CREDIT DILUTION</text>

    <!-- Formula Bar -->
    <g transform="translate(12, 30)">
      <rect width="401" height="26" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="200" y="17" text-anchor="middle" font-size="7.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">Terminal Oracle: R(τ)=0.00 ⇒ Flat Â_t = -0.71 (∀ t ∈ [1, 40])</text>
    </g>

    <!-- Comparison Table -->
    <g transform="translate(12, 66)">
      <!-- Header -->
      <rect width="401" height="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="24" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#475569">Turn (t)</text>
      <text x="120" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#475569">Action Quality</text>
      <text x="230" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#475569">Assigned Â_t</text>
      <text x="330" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#475569">Gradient Impact</text>

      <!-- Row 1 -->
      <rect y="22" width="401" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="24" y="38" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">t = 1..3</text>
      <text x="120" y="38" font-size="7.5" font-weight="600" fill="#15803D">Sound Diagnostics</text>
      <text x="230" y="38" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#DC2626">-0.71</text>
      <text x="330" y="38" font-size="7.5" font-weight="700" fill="#DC2626">FALSE NEGATIVE</text>

      <!-- Row 2 -->
      <rect y="46" width="401" height="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="24" y="62" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">t = 4</text>
      <text x="120" y="62" font-size="7.5" font-weight="600" fill="#991B1B">Deadlock Bug</text>
      <text x="230" y="62" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#DC2626">-0.71</text>
      <text x="330" y="62" font-size="7.5" font-weight="700" fill="#15803D">TRUE NEGATIVE</text>

      <!-- Row 3 -->
      <rect y="70" width="401" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="24" y="86" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">t = 5..39</text>
      <text x="120" y="86" font-size="7.5" font-weight="600" fill="#B45309">Linter Clean</text>
      <text x="230" y="86" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#DC2626">-0.71</text>
      <text x="330" y="86" font-size="7.5" font-weight="600" fill="#64748B">Zero Information</text>

      <!-- Row 4 -->
      <rect y="94" width="401" height="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="24" y="110" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">t = 40</text>
      <text x="120" y="110" font-size="7.5" font-weight="600" fill="#991B1B">Pytest Timeout</text>
      <text x="230" y="110" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#DC2626">-0.71</text>
      <text x="330" y="110" font-size="7.5" font-weight="700" fill="#991B1B">Terminal Trigger</text>
    </g>

    <text x="212" y="215" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Pathology: Suppresses correct diagnostic steps (t₁..t₃)</text>
  </g>

  <!-- ================================================================= -->
  <!-- (c) COUNTERFACTUAL BRANCHING ADVANTAGE (Right)                    -->
  <!-- ================================================================= -->
  <g transform="translate(485, 225)">
    <rect width="425" height="235" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.2"/>
    <rect width="425" height="22" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">(c) COUNTERFACTUAL ADVANTAGE VIA RADIX PREFIX SHARING</text>

    <!-- Formula Bar -->
    <g transform="translate(12, 30)">
      <rect width="401" height="26" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="200" y="17" text-anchor="middle" font-size="7.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#581C87">Δ_t = Q̂(s_t, a_t) - V̂(s_t) = 𝔼[V(s_{t+1})] - V(s_t)</text>
    </g>

    <!-- Branching Schematic -->
    <g transform="translate(20, 68)">
      <!-- Root state s3 -->
      <rect x="0" y="24" width="48" height="42" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.3"/>
      <text x="24" y="44" text-anchor="middle" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">s₃</text>
      <text x="24" y="56" text-anchor="middle" font-size="6.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">V=0.88</text>

      <!-- Branch 1: Faulty action -->
      <path d="M 48,36 L 90,14" fill="none" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
      <g transform="translate(98, 0)">
        <rect width="165" height="34" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
        <text x="8" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#991B1B">a₄: InvertLock()</text>
        <text x="8" y="26" font-size="7" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#DC2626">Q̂=0.00 ⇒ Δ₃ = -0.88 (Penalized)</text>
      </g>
      <text x="275" y="21" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#DC2626">ISOLATED PENALTY</text>

      <!-- Branch 2: Counterfactual correct action -->
      <path d="M 48,54 L 90,76" fill="none" stroke="#15803D" stroke-width="1.3" marker-end="url(#arr-green)"/>
      <g transform="translate(98, 60)">
        <rect width="165" height="34" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.1"/>
        <text x="8" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">a₄*: ScopedLock(A, B)</text>
        <text x="8" y="26" font-size="7" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#15803D">Q̂=0.95 ⇒ Δ₃ = +0.07 (Reinforced)</text>
      </g>
      <text x="275" y="81" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">CREDIT PROTECTED</text>
    </g>

    <!-- Radix Tree Amortization Banner -->
    <g transform="translate(12, 175)">
      <rect width="401" height="42" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1"/>
      <text x="12" y="16" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">Radix Tree Prefix Amortization (Ch 05):</text>
      <text x="12" y="30" font-size="7.2" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">Prefix t₁..t₃ cached in GPU HBM; branches share KV blocks (TTFT &lt; 1 ms)</text>
    </g>
  </g>
</svg>