    <g transform="translate(599, 32)">
      <rect width="126" height="66" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.1"/>
      <text x="8" y="15" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#B45309">t₅..₃₉: Flake8/Mypy</text>
      <text x="8" y="30" font-size="7.5" fill="#78350F">Syntax 0 (Blind spot)</text>
      <rect x="8" y="40" width="110" height="18" rx="1" fill="#FEF3C7"/>
      <text x="63" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="7.5" font-weight="700" fill="#B45309">V(s_t) = 0.00</text>
