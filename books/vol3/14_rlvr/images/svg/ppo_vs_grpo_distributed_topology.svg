<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- PANEL A: CLASSICAL PPO (LEFT: x=40, w=430)                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="430" height="472" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">PANEL A: PPO DISTRIBUTED TOPOLOGY (4 CONCURRENT MODELS)</text>

    <!-- Cluster Subtitle -->
    <text x="12" y="38" font-size="8.0" fill="#64748b">64 × H100 80GB GPUs | 70B Parameter Policy | Adam FP32 Optimizer</text>

    <!-- Memory Map Section (x=12, y=46) -->
    <g transform="translate(12, 44)">
      <text x="0" y="10" font-size="8.0" font-weight="700" fill="#0f172a">Per-GPU Accelerator Memory Map (73.4 GB / 80 GB Allocated: 91.8%)</text>
      
      <!-- Memory Bar Container (80 GB total = 406 px) -->
      <rect x="0" y="15" width="406" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Actor: 28.0 GB = 142 px -->
      <rect x="0" y="15" width="142" height="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="71" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">Actor (π_θ)</text>
      <text x="71" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0284c7">28.0 GB</text>

      <!-- Critic: 28.0 GB = 142 px -->
      <rect x="142" y="15" width="142" height="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="213" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Critic (V_ϕ)</text>
      <text x="213" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#dc2626">28.0 GB</text>

      <!-- Ref Policy: 8.7 GB = 44 px -->
      <rect x="284" y="15" width="44" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="306" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#334155">Ref π</text>
      <text x="306" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#475569">8.7G</text>

      <!-- Reward Model: 8.7 GB = 44 px -->
      <rect x="328" y="15" width="44" height="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="350" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">RM r_ψ</text>
      <text x="350" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#7c3aed">8.7G</text>

      <!-- Free Headroom: 6.6 GB = 34 px -->
      <rect x="372" y="15" width="34" height="28" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="389" y="32" text-anchor="middle" font-size="8.0" font-weight="700" fill="#dc2626">Free</text>
      
      <!-- Footnote on Headroom -->
      <text x="0" y="54" font-size="8.0" fill="#b91c1c">Critical Bottleneck: Only 6.6 GB remains for KV caches and activation tensors.</text>
    </g>

    <!-- Cluster Nodes & Communications Topology (y: 110) -->
    <g transform="translate(12, 108)">
      <rect x="0" y="0" width="406" height="236" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Top Tier: Actor Fleet (32 GPUs) -->
      <g transform="translate(8, 8)">
        <rect x="0" y="0" width="188" height="58" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0369a1">Actor Fleet: π_θ (32 GPUs)</text>
        <text x="8" y="26" font-size="8.0" fill="#334155">• Generates rollout tokens a_t</text>
        <text x="8" y="37" font-size="8.0" fill="#334155">• Forward + Backward policy loss</text>
        <rect x="8" y="41" width="172" height="13" rx="1" fill="#e0f2fe"/>
        <text x="94" y="50" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0369a1">Ring 1: Actor All-Reduce</text>
      </g>

      <!-- Top Tier: Critic Fleet (32 GPUs) -->
      <g transform="translate(208, 8)">
        <rect x="0" y="0" width="188" height="58" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
        <text x="8" y="14" font-size="8.0" font-weight="700" fill="#b91c1c">Critic Fleet: V_ϕ (32 GPUs)</text>
        <text x="8" y="26" font-size="8.0" fill="#7f1d1d">• Estimates state value V(s_t)</text>
        <text x="8" y="37" font-size="8.0" fill="#7f1d1d">• Forward + Backward TD loss</text>
        <rect x="8" y="41" width="172" height="13" rx="1" fill="#fee2e2"/>
        <text x="94" y="50" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#b91c1c">Ring 2: Critic All-Reduce</text>
      </g>

      <!-- Dual All-Reduce Conflict Warning -->
      <g transform="translate(8, 72)">
        <rect x="0" y="0" width="388" height="30" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
        <text x="10" y="13" font-size="8.0" font-weight="700" fill="#b91c1c">Interconnect Contention: Dual All-Reduce Traffic Collisions</text>
        <text x="10" y="24" font-size="8.0" fill="#7f1d1d">Actor and Critic gradient broadcasts saturate RoCE fabric; 68% wall-clock in bubbles.</text>
      </g>

      <!-- Middle: GAE Advantage Coupling -->
      <g transform="translate(8, 108)">
        <rect x="0" y="0" width="388" height="52" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" font-size="8.0" font-weight="700" fill="#0f172a">Tight Value Coupling &amp; Pipeline Barriers</text>
        <text x="10" y="26" font-family="Courier, monospace" font-size="8.0" fill="#b91c1c">δ_t^V = r_t + γ V_ϕ(s_{t+1}) - V_ϕ(s_t) ⟹ Â_t = ∑ (γλ)^k δ_{t+k}^V</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Lagging Critic predictions inject noise into Â_t, triggering entropy collapse.</text>
      </g>

      <!-- Bottom: Synchronization Barrier -->
      <g transform="translate(8, 166)">
        <rect x="0" y="0" width="388" height="58" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="10" y="15" font-size="8.0" font-weight="700" fill="#dc2626">Synchronous Training Barrier (Straggler Amplification)</text>
        <text x="10" y="28" font-size="8.0" fill="#334155">Every optimization step requires lockstep forward/backward passes across both Actor</text>
        <text x="10" y="40" font-size="8.0" fill="#334155">and Critic fleets. Single-node stragglers halt all 64 GPUs.</text>
      </g>
    </g>

    <!-- Bottom KPI Card -->
    <g transform="translate(12, 354)">
      <rect x="0" y="0" width="406" height="106" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">SYSTEMS VERDICT: PPO AT SCALE</text>
      <text x="10" y="31" font-size="8.0" fill="#334155">• Persistent VRAM: <tspan font-weight="700" fill="#b91c1c">73.4 GB / GPU (91.8%)</tspan></text>
      <text x="10" y="45" font-size="8.0" fill="#334155">• Rollout Concurrency: Truncated to batch size B=1, 4k context</text>
      <text x="10" y="59" font-size="8.0" fill="#334155">• Communication Overhead: Dual all-reduce rings saturate fabric</text>
      <text x="10" y="73" font-size="8.0" fill="#334155">• Failure Mode: Value network divergence on sparse binary returns</text>
      <rect x="10" y="80" width="386" height="20" rx="1" fill="#fee2e2"/>
      <text x="203" y="93" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">High Infrastructure Cost, Severe Stragglers</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: GRPO TOPOLOGY (RIGHT: x=490, w=430)                      -->
  <!-- ================================================================= -->
  <g transform="translate(490, 72)">
    <rect x="0" y="0" width="430" height="472" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PANEL B: GRPO DISTRIBUTED TOPOLOGY (CRITIC-FREE ORACLE SCALING)</text>

    <!-- Cluster Subtitle -->
    <text x="12" y="38" font-size="8.0" fill="#64748b">64 × H100 80GB GPUs | 70B Parameter Policy | Critic Network ELIMINATED</text>

    <!-- Memory Map Section (x=12, y=44) -->
    <g transform="translate(12, 44)">
      <text x="0" y="10" font-size="8.0" font-weight="700" fill="#15803d">Per-GPU Accelerator Memory Map (38.8 GB / 80 GB Allocated: 48.5%)</text>
      
      <!-- Memory Bar Container (80 GB total = 406 px) -->
      <rect x="0" y="15" width="406" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Actor: 28.0 GB = 142 px -->
      <rect x="0" y="15" width="142" height="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="71" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">Actor (π_θ)</text>
      <text x="71" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0284c7">28.0 GB</text>

      <!-- Critic Eliminated: 0 GB (was 142 px) -->
      <rect x="142" y="15" width="142" height="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="213" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#16a34a">Critic V_ϕ ELIMINATED</text>
      <text x="213" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#15803d">-28.0 GB Saved</text>

      <!-- Ref Policy (Quantized/Offloaded): 4.4 GB = 22 px -->
      <rect x="284" y="15" width="22" height="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="295" y="33" text-anchor="middle" font-size="8.0" font-weight="700" fill="#334155">Ref</text>

      <!-- Reward Model: 0 GB (External Oracle) = 38 px -->
      <rect x="306" y="15" width="38" height="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="325" y="33" text-anchor="middle" font-size="8.0" font-weight="700" fill="#16a34a">Oracle</text>

      <!-- Free Headroom for KV & Concurrency: 41.2 GB = 62 px -->
      <rect x="344" y="15" width="62" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="375" y="27" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">Headroom</text>
      <text x="375" y="38" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#166534">41.2 GB</text>
      
      <!-- Footnote on Headroom -->
      <text x="0" y="54" font-size="8.0" fill="#16a34a">47.1% Persistent VRAM Reclaimed: Enables 16k context + Radix KV prefix sharing.</text>
    </g>

    <!-- Cluster Nodes & Communications Topology (y: 110) -->
    <g transform="translate(12, 108)">
      <rect x="0" y="0" width="406" height="236" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Top Tier: Actor Training Fleet (Dedicated full 64 GPUs) -->
      <g transform="translate(8, 8)">
        <rect x="0" y="0" width="188" height="58" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0369a1">Training Fleet: π_θ (64 GPUs)</text>
        <text x="8" y="26" font-size="8.0" fill="#334155">• Unified compute capacity</text>
        <text x="8" y="37" font-size="8.0" fill="#334155">• Single All-Reduce ring (no collision)</text>
        <rect x="8" y="41" width="172" height="13" rx="1" fill="#e0f2fe"/>
        <text x="94" y="50" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0369a1">Single All-Reduce Ring</text>
      </g>

      <!-- Top Tier: Disaggregated Verifier Fleet (MicroVMs) -->
      <g transform="translate(208, 8)">
        <rect x="0" y="0" width="188" height="58" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
        <text x="8" y="14" font-size="8.0" font-weight="700" fill="#15803d">Verifier Fleet: CPU MicroVMs</text>
        <text x="8" y="26" font-size="8.0" fill="#14532d">• pytest, rustc, Z3 solvers</text>
        <text x="8" y="37" font-size="8.0" fill="#14532d">• Out-of-band execution isolation</text>
        <rect x="8" y="41" width="172" height="13" rx="1" fill="#dcfce7"/>
        <text x="94" y="50" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">Deterministic Return R ∈ {0, 1}</text>
      </g>

      <!-- In-Group Standardization Engine (Middle) -->
      <g transform="translate(8, 72)">
        <rect x="0" y="0" width="388" height="42" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="13" font-size="8.0" font-weight="700" fill="#15803d">In-Group Statistical Normalization (Zero Critic Overhead)</text>
        <text x="10" y="25" font-family="Courier, monospace" font-size="8.0" fill="#15803d">μ_q = 1/G ∑ r_i,   σ_q = std(r)  ⟹  Â_i = (r_i - μ_q) / (σ_q + ε)</text>
        <text x="10" y="36" font-size="8.0" fill="#166534">Standardized advantages computed in microseconds without value model backprop.</text>
      </g>

      <!-- Asynchronous FIFO Replay Buffer (Bottom) -->
      <g transform="translate(8, 120)">
        <rect x="0" y="0" width="388" height="48" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="10" y="14" font-size="8.0" font-weight="700" fill="#0369a1">Asynchronous Non-Blocking FIFO Replay Buffer</text>
        <text x="10" y="26" font-size="8.0" fill="#334155">Decouples variable-latency microVM evaluations from GPU training ranks.</text>
        <text x="10" y="38" font-size="8.0" fill="#334155">Clipped surrogate ratio ρ_{i,t}(θ) tolerates up to τ_stale ≤ 4 off-policy steps.</text>
      </g>

      <!-- Pinned Prefix KV Cache Note -->
      <g transform="translate(8, 174)">
        <rect x="0" y="0" width="388" height="48" rx="1" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <text x="10" y="14" font-size="8.0" font-weight="700" fill="#0284c7">Pinned Radix Prefix KV-Cache Sharing</text>
        <text x="10" y="26" font-size="8.0" fill="#334155">Prompt q prefilled once; reference count G=8 pinned in GPU memory.</text>
        <text x="10" y="38" font-size="8.0" font-weight="700" fill="#0284c7">3.33× KV-cache footprint reduction (21.5 GB ⟶ 6.4 GB).</text>
      </g>
    </g>

    <!-- Bottom KPI Card -->
    <g transform="translate(12, 354)">
      <rect x="0" y="0" width="406" height="106" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">SYSTEMS VERDICT: GRPO AT SCALE</text>
      <text x="10" y="31" font-size="8.0" fill="#334155">• Persistent VRAM: <tspan font-weight="700" fill="#15803d">38.8 GB / GPU (47.1% Reduction)</tspan></text>
      <text x="10" y="45" font-size="8.0" fill="#334155">• Rollout Concurrency: G=8 parallel streams with 16k context</text>
      <text x="10" y="59" font-size="8.0" fill="#334155">• Interconnect Traffic: Zero Critic traffic; single linear ring</text>
      <text x="10" y="73" font-size="8.0" fill="#334155">• Optimization Stability: Empirical group baseline prevents divergence</text>
      <rect x="10" y="80" width="386" height="20" rx="1" fill="#dcfce7"/>
      <text x="203" y="93" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">47.1% Memory Reclamation, Zero Value Bubbles</text>
    </g>
  </g>

</g>
</svg>