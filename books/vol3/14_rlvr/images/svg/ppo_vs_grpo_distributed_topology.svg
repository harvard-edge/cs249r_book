<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: CLASSICAL PPO (LEFT: x=20 to 470)                        -->
  <!-- ================================================================= -->
  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="450" height="490" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="450" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#991b1b">PANEL A: PPO DISTRIBUTED TOPOLOGY (4 CONCURRENT MODELS)</text>

    <!-- Cluster Subtitle -->
    <text x="12" y="38" font-size="7.2" fill="#475569">64 × H100 80GB GPUs | 70B Parameter Agent Policy | Adam FP32 Optimizer</text>

    <!-- Memory Map Section (x=12, y=46) -->
    <g transform="translate(12, 48)">
      <text x="0" y="10" font-size="7.5" font-weight="700" fill="#1e293b">Per-GPU Accelerator Memory Map (73.4 GB / 80 GB Allocated: 91.8%)</text>
      
      <!-- Memory Bar Background (80 GB total = 426 px) -->
      <rect x="0" y="16" width="426" height="28" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Actor: 28.0 GB = 149 px -->
      <rect x="0" y="16" width="149" height="28" fill="#0284c7"/>
      <text x="74" y="29" text-anchor="middle" font-size="6.8" font-weight="700" fill="#ffffff">Actor (π_θ)</text>
      <text x="74" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" fill="#e0f2fe">28.0 GB</text>

      <!-- Critic: 28.0 GB = 149 px -->
      <rect x="149" y="16" width="149" height="28" fill="#dc2626"/>
      <text x="223" y="29" text-anchor="middle" font-size="6.8" font-weight="700" fill="#ffffff">Critic (V_ϕ)</text>
      <text x="223" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" fill="#fee2e2">28.0 GB</text>

      <!-- Ref Policy: 8.7 GB = 46 px -->
      <rect x="298" y="16" width="46" height="28" fill="#475569"/>
      <text x="321" y="29" text-anchor="middle" font-size="6" font-weight="700" fill="#ffffff">Ref π</text>
      <text x="321" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="5.8" fill="#f1f5f9">8.7G</text>

      <!-- Reward Model: 8.7 GB = 46 px -->
      <rect x="344" y="16" width="46" height="28" fill="#7c3aed"/>
      <text x="367" y="29" text-anchor="middle" font-size="6" font-weight="700" fill="#ffffff">RM r_ψ</text>
      <text x="367" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="5.8" fill="#f3e8ff">8.7G</text>

      <!-- Free Headroom: 6.6 GB = 36 px -->
      <rect x="390" y="16" width="36" height="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="408" y="34" text-anchor="middle" font-size="6" font-weight="700" fill="#dc2626">Free</text>
      
      <!-- Footnote on Headroom -->
      <text x="0" y="55" font-size="6.8" fill="#b91c1c">Critical Bottleneck: Only 6.6 GB remains for KV caches and activation tensors.</text>
    </g>

    <!-- Cluster Nodes & Communications Topology (y: 118 to 360) -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="426" height="242" rx="1" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Top Tier: Actor Ranks (32 GPUs) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="195" height="62" rx="1" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0369a1">Actor Fleet: π_θ (32 GPUs)</text>
        <text x="8" y="26" font-size="6.5" fill="#334155">• Generates rollout tokens a_t</text>
        <text x="8" y="37" font-size="6.5" fill="#334155">• Forward + Backward policy loss</text>
        <rect x="8" y="43" width="179" height="13" rx="1" fill="#e0f2fe"/>
        <text x="97" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#0369a1">Ring 1: Actor All-Reduce</text>
      </g>

      <!-- Top Tier: Critic Ranks (32 GPUs) -->
      <g transform="translate(221, 10)">
        <rect x="0" y="0" width="195" height="62" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#b91c1c">Critic Fleet: V_ϕ (32 GPUs)</text>
        <text x="8" y="26" font-size="6.5" fill="#7f1d1d">• Estimates state value V(s_t)</text>
        <text x="8" y="37" font-size="6.5" fill="#7f1d1d">• Forward + Backward TD loss</text>
        <rect x="8" y="43" width="179" height="13" rx="1" fill="#fee2e2"/>
        <text x="97" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">Ring 2: Critic All-Reduce</text>
      </g>

      <!-- Dual All-Reduce Conflict Warning -->
      <g transform="translate(10, 80)">
        <rect x="0" y="0" width="406" height="30" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#b91c1c">Interconnect Contention: Dual All-Reduce Traffic Collisions</text>
        <text x="10" y="24" font-size="6.5" fill="#7f1d1d">Actor and Critic gradient broadcasts saturate RoCE fabric; 68% wall-clock spent in bubbles.</text>
      </g>

      <!-- Middle: GAE Advantage Coupling -->
      <g transform="translate(10, 118)">
        <rect x="0" y="0" width="406" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#1e293b">Tight Value Coupling &amp; Pipeline Barriers</text>
        <text x="10" y="26" font-family="Courier, monospace" font-size="6.8" fill="#b91c1c">δ_t^V = r_t + γ V_ϕ(s_{t+1}) - V_ϕ(s_t) ⟹ Â_t = ∑ (γλ)^k δ_{t+k}^V</text>
        <text x="10" y="42" font-size="6.5" fill="#64748b">Lagging Critic predictions inject noise into Â_t, triggering entropy collapse.</text>
      </g>

      <!-- Bottom: Synchronization Barrier -->
      <g transform="translate(10, 178)">
        <rect x="0" y="0" width="406" height="54" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="10" y="15" font-size="7.2" font-weight="700" fill="#dc2626">Synchronous Training Barrier (Straggler Amplification)</text>
        <text x="10" y="28" font-size="6.5" fill="#334155">Every optimization step requires lockstep forward/backward passes across both Actor</text>
        <text x="10" y="39" font-size="6.5" fill="#334155">and Critic fleets. Single node stragglers halt all 64 GPUs.</text>
      </g>
    </g>

    <!-- Bottom KPI Card -->
    <g transform="translate(12, 368)">
      <rect x="0" y="0" width="426" height="110" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#b91c1c">SYSTEMS VERDICT: PPO AT SCALE</text>
      <text x="10" y="32" font-size="7.2" fill="#334155">• Persistent VRAM: <tspan font-weight="700" fill="#b91c1c">73.4 GB / GPU (91.8%)</tspan></text>
      <text x="10" y="46" font-size="7.2" fill="#334155">• Rollout Concurrency: Truncated to batch size B=1, 4k context</text>
      <text x="10" y="60" font-size="7.2" fill="#334155">• Communication Overhead: Dual all-reduce rings saturate fabric</text>
      <text x="10" y="74" font-size="7.2" fill="#334155">• Failure Mode: Value network divergence on sparse binary returns</text>
      <rect x="10" y="82" width="406" height="20" rx="1" fill="#fee2e2"/>
      <text x="213" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">High Infrastructure Cost, Severe Stragglers</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: GRPO TOPOLOGY (RIGHT: x=490 to 940)                      -->
  <!-- ================================================================= -->
  <g transform="translate(490, 15)">
    <rect x="0" y="0" width="450" height="490" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="450" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#15803d">PANEL B: GRPO DISTRIBUTED TOPOLOGY (CRITIC-FREE ORACLE SCALING)</text>

    <!-- Cluster Subtitle -->
    <text x="12" y="38" font-size="7.2" fill="#475569">64 × H100 80GB GPUs | 70B Parameter Agent Policy | Critic Network ELIMINATED</text>

    <!-- Memory Map Section (x=12, y=46) -->
    <g transform="translate(12, 48)">
      <text x="0" y="10" font-size="7.5" font-weight="700" fill="#15803d">Per-GPU Accelerator Memory Map (38.8 GB / 80 GB Allocated: 48.5%)</text>
      
      <!-- Memory Bar Background (80 GB total = 426 px) -->
      <rect x="0" y="16" width="426" height="28" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Actor: 28.0 GB = 149 px -->
      <rect x="0" y="16" width="149" height="28" fill="#0284c7"/>
      <text x="74" y="29" text-anchor="middle" font-size="6.8" font-weight="700" fill="#ffffff">Actor (π_θ)</text>
      <text x="74" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" fill="#e0f2fe">28.0 GB</text>

      <!-- Critic Eliminated: 0 GB (was 149 px) -->
      <rect x="149" y="16" width="149" height="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="223" y="28" text-anchor="middle" font-size="7" font-weight="700" fill="#16a34a">Critic V_ϕ ELIMINATED</text>
      <text x="223" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="6" fill="#15803d">-28.0 GB Saved</text>

      <!-- Ref Policy (Quantized/Offloaded): 4.4 GB = 23 px -->
      <rect x="298" y="16" width="23" height="28" fill="#475569"/>
      <text x="309" y="34" text-anchor="middle" font-size="5.5" font-weight="700" fill="#ffffff">Ref</text>

      <!-- Reward Model: 0 GB (External Oracle) -->
      <rect x="321" y="16" width="40" height="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="341" y="34" text-anchor="middle" font-size="5.5" font-weight="700" fill="#16a34a">Oracle</text>

      <!-- Free Headroom for KV & Concurrency: 41.2 GB = 220 px! -->
      <rect x="361" y="16" width="65" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="393" y="29" text-anchor="middle" font-size="6.5" font-weight="700" fill="#15803d">Headroom</text>
      <text x="393" y="39" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" fill="#166534">41.2 GB</text>
      
      <!-- Footnote on Headroom -->
      <text x="0" y="55" font-size="6.8" fill="#16a34a">47.1% Persistent VRAM Reclaimed: Enables 16k context + Radix KV prefix sharing.</text>
    </g>

    <!-- Cluster Nodes & Communications Topology (y: 118 to 360) -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="426" height="242" rx="1" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Top Tier: Actor Training Fleet (Dedicated full 64 GPUs) -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="195" height="62" rx="1" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0369a1">Training Fleet: π_θ (64 GPUs)</text>
        <text x="8" y="26" font-size="6.5" fill="#334155">• Unified compute capacity</text>
        <text x="8" y="37" font-size="6.5" fill="#334155">• Single All-Reduce ring (no collision)</text>
        <rect x="8" y="43" width="179" height="13" rx="1" fill="#e0f2fe"/>
        <text x="97" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#0369a1">Single All-Reduce Ring</text>
      </g>

      <!-- Top Tier: Disaggregated Verifier Fleet (MicroVMs) -->
      <g transform="translate(221, 10)">
        <rect x="0" y="0" width="195" height="62" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803d">Verifier Fleet: CPU MicroVMs</text>
        <text x="8" y="26" font-size="6.5" fill="#14532d">• pytest, rustc, Z3 solvers</text>
        <text x="8" y="37" font-size="6.5" fill="#14532d">• Out-of-band execution isolation</text>
        <rect x="8" y="43" width="179" height="13" rx="1" fill="#dcfce7"/>
        <text x="97" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#15803d">Deterministic Return R ∈ {0, 1}</text>
      </g>

      <!-- In-Group Standardization Engine (Middle) -->
      <g transform="translate(10, 80)">
        <rect x="0" y="0" width="406" height="44" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#15803d">In-Group Statistical Normalization (Zero Critic Overhead)</text>
        <text x="10" y="26" font-family="Courier, monospace" font-size="6.8" fill="#15803d">μ_q = 1/G ∑ r_i,   σ_q = std(r)  ⟹  Â_i = (r_i - μ_q) / (σ_q + ε)</text>
        <text x="10" y="37" font-size="6.5" fill="#166534">Standardized advantages computed in microseconds without value model backprop.</text>
      </g>

      <!-- Asynchronous FIFO Replay Buffer (Bottom) -->
      <g transform="translate(10, 132)">
        <rect x="0" y="0" width="406" height="48" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#0369a1">Asynchronous Non-Blocking FIFO Replay Buffer</text>
        <text x="10" y="26" font-size="6.5" fill="#334155">Decouples variable-latency microVM evaluations from GPU training ranks.</text>
        <text x="10" y="38" font-size="6.5" fill="#334155">Clipped surrogate ratio ρ_{i,t}(θ) tolerates up to τ_stale ≤ 4 off-policy steps.</text>
      </g>

      <!-- Pinned Prefix KV Cache Note -->
      <g transform="translate(10, 188)">
        <rect x="0" y="0" width="406" height="44" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text x="10" y="14" font-size="7.2" font-weight="700" fill="#1e40af">Pinned Radix Prefix KV-Cache Sharing</text>
        <text x="10" y="26" font-size="6.5" fill="#334155">Prompt q prefilled once; reference count G=8 pinned in memory.</text>
        <text x="10" y="37" font-size="6.5" font-weight="700" fill="#0284c7">3.33× KV-cache footprint reduction (21.5 GB ⟶ 6.4 GB).</text>
      </g>
    </g>

    <!-- Bottom KPI Card -->
    <g transform="translate(12, 368)">
      <rect x="0" y="0" width="426" height="110" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">SYSTEMS VERDICT: GRPO AT SCALE</text>
      <text x="10" y="32" font-size="7.2" fill="#334155">• Persistent VRAM: <tspan font-weight="700" fill="#15803d">38.8 GB / GPU (47.1% Reduction)</tspan></text>
      <text x="10" y="46" font-size="7.2" fill="#334155">• Rollout Concurrency: G=8 parallel streams with 16k context</text>
      <text x="10" y="60" font-size="7.2" fill="#334155">• Interconnect Traffic: Zero Critic traffic; single linear ring</text>
      <text x="10" y="74" font-size="7.2" fill="#334155">• Optimization Stability: Empirical group baseline prevents divergence</text>
      <rect x="10" y="82" width="406" height="20" rx="1" fill="#dcfce7"/>
      <text x="213" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">47.1% Memory Reclamation, Zero Value Bubbles</text>
    </g>
  </g>

</svg>
