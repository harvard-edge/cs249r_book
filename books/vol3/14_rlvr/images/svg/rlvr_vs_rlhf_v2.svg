<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1150" height="560" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM INVARIANT                                         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 20)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.3">REINFORCEMENT LEARNING WITH VERIFIABLE REWARDS (RLVR) VS RLHF</text>
    <text x="0" y="38" font-size="11" fill="#475569">Closed-Loop Control Architecture: Learned Neural Proxy (RLHF) vs Deterministic Mechanical Oracle (RLVR)</text>

    <!-- Top Invariant Box -->
    <rect x="730" y="4" width="380" height="38" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="742" y="20" font-size="10" font-weight="700" fill="#581C87">Verification Invariant:</text>
    <text x="860" y="20" font-size="9" font-family="'SF Mono', monospace" fill="#1E293B">V(tau) in {0, 1} via Hard Assertions</text>
    <text x="742" y="34" font-size="8.5" fill="#6B21A8">Zero reward hacking gap: eliminates proxy divergence</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: RLHF CONTROL LOOP (Subjective Neural Proxy)           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="520" height="455" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="30" rx="6" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#991B1B">A. SUBJECTIVE PROXY FEEDBACK LOOP (RLHF / PPO)</text>
    <text x="365" y="20" font-size="9.5" fill="#B91C1C" font-family="'SF Mono', monospace">Continuous Scalar r in R</text>

    <!-- Planar Loop: Input -> Policy -> Rollout -> RM -> PPO -> Policy -->
    <g transform="translate(20, 48)">
      <!-- Input: Prompt x -->
      <rect x="0" y="20" width="95" height="46" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="47" y="40" font-size="9" font-weight="700" fill="#1E293B" text-anchor="middle">Task Prompt</text>
      <text x="47" y="54" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748B" text-anchor="middle">x ~ D_eval</text>

      <!-- Arrow: Input -> Policy -->
      <line x1="95" y1="43" x2="140" y2="43" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>

      <!-- Actor Policy Block -->
      <rect x="140" y="12" width="180" height="62" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
      <text x="230" y="34" font-size="10" font-weight="700" fill="#581C87" text-anchor="middle">Actor Policy pi_theta</text>
      <text x="230" y="48" font-size="8.5" fill="#6B21A8" text-anchor="middle">Autoregressive LLM</text>
      <text x="230" y="62" font-size="8" font-family="'SF Mono', monospace" fill="#581C87" text-anchor="middle">y ~ pi_theta( . | x )</text>

      <!-- Output Line -> Rollout y -->
      <line x1="320" y1="43" x2="470" y2="43" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
      <circle cx="410" cy="43" r="4" fill="#475569"/>
      <text x="440" y="34" font-size="8.5" font-weight="700" fill="#334155">Trace y</text>

      <!-- Downward feedback branch to Neural Reward Model -->
      <line x1="410" y1="43" x2="410" y2="115" stroke="#991B1B" stroke-width="1.8" marker-end="url(#arr-red)"/>

      <!-- Feedback Sensor: Neural Reward Model r_psi -->
      <rect x="180" y="115" width="290" height="66" rx="4" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.3"/>
      <text x="325" y="136" font-size="9.5" font-weight="700" fill="#991B1B" text-anchor="middle">Learned Reward Model r_psi(x, y)</text>
      <text x="325" y="152" font-size="8.5" fill="#7F1D1D" text-anchor="middle">Pairwise Preference Proxy (Bradley-Terry)</text>
      <text x="325" y="168" font-size="8" font-family="'SF Mono', monospace" fill="#991B1B" text-anchor="middle">score r_hat in R (Subjective &amp; Drift-Prone)</text>

      <!-- Arrow from RM down to PPO Optimizer -->
      <line x1="325" y1="181" x2="325" y2="215" stroke="#991B1B" stroke-width="1.8" marker-end="url(#arr-red)"/>

      <!-- PPO Optimizer + Critic Network Box -->
      <rect x="70" y="215" width="400" height="78" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="85" y="235" font-size="9.5" font-weight="700" fill="#334155">PPO Optimizer + Critic Network V_phi</text>
      <text x="85" y="250" font-size="8.5" fill="#475569">Requires separate critic model (2x HBM); GAE advantage:</text>
      <text x="85" y="268" font-size="8.5" font-family="'SF Mono', monospace" fill="#991B1B">grad J = E [ grad log pi(a|s) * A_hat(r_hat, V_phi) ]</text>

      <!-- Planar Upward Route: From left of PPO (x=70, y=254) -> left to x=40 -> up to y=43 -> into Actor (x=140) -->
      <!-- Wait, into top of actor or bottom of actor! -->
      <!-- From x=70, go left to x=115, up to y=74 (bottom of Actor block)! -->
      <path d="M 70 254 L 118 254 L 118 74 L 140 74" fill="none" stroke="#581C87" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-amethyst)"/>
      <text x="110" y="160" font-size="8" font-weight="700" fill="#581C87" transform="rotate(-90, 110, 160)" text-anchor="middle">grad_theta update</text>
    </g>

    <!-- Structural Vulnerability Callout Box -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="480" height="45" rx="4" fill="#FEF2F2" stroke="#991B1B" stroke-width="1"/>
      <text x="12" y="17" font-size="9" font-weight="700" fill="#991B1B">Failure Vulnerabilities (Goodhart's Law):</text>
      <text x="12" y="32" font-size="8.5" fill="#7F1D1D">Reward hacking (adversarial tokens score high while logic fails); human rating noise on deep code.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: RLVR CONTROL LOOP (Deterministic Mechanical Oracle)  -->
  <!-- ================================================================= -->
  <g transform="translate(590, 80)">
    <rect x="0" y="0" width="520" height="455" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="30" rx="6" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#166534">B. DETERMINISTIC VERIFICATION LOOP (RLVR / GRPO)</text>
    <text x="360" y="20" font-size="9.5" fill="#15803D" font-family="'SF Mono', monospace">Binary Ground Truth R in {0,1}</text>

    <!-- Planar Loop: Contract -> Policy -> Trace -> Sandbox -> GRPO -> Policy -->
    <g transform="translate(20, 48)">
      <!-- Input: Contract -->
      <rect x="0" y="20" width="95" height="46" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="47" y="40" font-size="9" font-weight="700" fill="#1E293B" text-anchor="middle">Task Contract</text>
      <text x="47" y="54" font-size="8" font-family="'SF Mono', monospace" fill="#166534" text-anchor="middle">&lt; x, Assertions &gt;</text>

      <!-- Arrow: Contract -> Policy -->
      <line x1="95" y1="43" x2="140" y2="43" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>

      <!-- Policy Block -->
      <rect x="140" y="12" width="180" height="62" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
      <text x="230" y="34" font-size="10" font-weight="700" fill="#581C87" text-anchor="middle">Agent Policy pi_theta</text>
      <text x="230" y="48" font-size="8.5" fill="#6B21A8" text-anchor="middle">Group Rollout Engine</text>
      <text x="230" y="62" font-size="8" font-family="'SF Mono', monospace" fill="#581C87" text-anchor="middle">{ tau_1, ..., tau_G } ~ pi</text>

      <!-- Output Line -> Trace tau -->
      <line x1="320" y1="43" x2="470" y2="43" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
      <circle cx="410" cy="43" r="4" fill="#475569"/>
      <text x="440" y="34" font-size="8.5" font-weight="700" fill="#334155">Trace tau</text>

      <!-- Downward feedback branch to Verifier Sandbox -->
      <line x1="410" y1="43" x2="410" y2="115" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-green)"/>

      <!-- Feedback Sensor: Verification Sandbox Oracle V(tau) -->
      <rect x="180" y="115" width="290" height="66" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1.3"/>
      <text x="325" y="136" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Verification Sandbox Oracle V(tau)</text>
      <text x="325" y="152" font-size="8.5" fill="#15803D" text-anchor="middle">Compiler, Unit Tests, Proof Checker (Lean 4)</text>
      <text x="325" y="168" font-size="8" font-family="'SF Mono', monospace" fill="#166534" text-anchor="middle">R(tau) in {0, 1} (Objective &amp; Immutable)</text>

      <!-- Arrow from Verifier down to GRPO Optimizer -->
      <line x1="325" y1="181" x2="325" y2="215" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-green)"/>

      <!-- GRPO Optimizer Box -->
      <rect x="70" y="215" width="400" height="78" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1.2"/>
      <text x="85" y="235" font-size="9.5" font-weight="700" fill="#166534">Group Relative Policy Optimization (GRPO)</text>
      <text x="85" y="250" font-size="8.5" fill="#15803D">Zero Critic Network overhead (50% HBM saved); group advantage:</text>
      <text x="85" y="268" font-size="8.5" font-family="'SF Mono', monospace" fill="#14532D">A_i = ( R(tau_i) - mean(R) ) / ( std(R) + eps )</text>

      <!-- Planar Upward Route: From left of GRPO (x=70, y=254) -> left to x=118 -> up to y=74 -> into Actor (x=140) -->
      <path d="M 70 254 L 118 254 L 118 74 L 140 74" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
      <text x="110" y="160" font-size="8" font-weight="700" fill="#166534" transform="rotate(-90, 110, 160)" text-anchor="middle">grad_theta update</text>
    </g>

    <!-- Structural Guarantee Callout Box -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="480" height="45" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1"/>
      <text x="12" y="17" font-size="9" font-weight="700" fill="#166534">Mathematical Guarantees:</text>
      <text x="12" y="32" font-size="8.5" fill="#15803D">Zero proxy hacking gap; policy exploration self-corrects against immutable compiler &amp; unit test ground truth.</text>
    </g>
  </g>
</svg>
