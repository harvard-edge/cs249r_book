<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="530" rx="4" fill="#ffffff"/>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .stage-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .stage-card-active { fill: #f8fafc; stroke: #10b981; stroke-width: 1.8; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .loop-card { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; line-height: 1.4; }
    .body-bold { font-weight: 600; fill: #0f172a; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f172a; }
    .code-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #2563eb; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #059669; font-weight: 600; }
    .code-purple { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #7c3aed; font-weight: 600; }
    .label-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #1e293b; }
  </style>

  <!-- Stage 1: Base Pretraining -->
  <g transform="translate(15, 15)">
    <rect class="stage-card" x="0" y="0" width="330" height="495"/>
    <rect class="header-box" x="12" y="12" width="306" height="42" fill="#e2e8f0"/>
    <text class="title-text" x="22" y="32">Stage 1: Base Pretraining</text>
    <text class="subtitle-text" x="22" y="47">Broad Distributional Priors (Open-Loop)</text>

    <!-- Block 1: Training Objective -->
    <g transform="translate(12, 66)">
      <rect class="inner-card" x="0" y="0" width="306" height="80"/>
      <text class="dim-label" x="12" y="18">OPTIMIZATION OBJECTIVE</text>
      <text class="code-text" x="12" y="38">L_pre(θ) = -Σ log π_θ(x_t | x_&lt;t)</text>
      <text class="body-text" x="12" y="56">Next-token prediction across web-scale data;</text>
      <text class="body-text" x="12" y="70">learns statistical priors and grammar.</text>
    </g>

    <!-- Block 2: Computational Flow -->
    <g transform="translate(12, 158)">
      <rect class="inner-card" x="0" y="0" width="306" height="152"/>
      <text class="dim-label" x="12" y="18">COMPUTATIONAL ARCHITECTURE</text>

      <rect x="12" y="28" width="282" height="34" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text class="body-bold" x="20" y="44" font-size="10.5px">Web-Scale Uncurated Corpus D_pre</text>
      <text class="subtitle-text" x="20" y="56" font-size="9px">Common Crawl, GitHub, Technical Books, ArXiv</text>

      <path d="M 153 62 L 153 76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

      <rect x="12" y="78" width="282" height="34" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text class="code-accent" x="20" y="94" font-size="10.5px">Base Foundation Model: π_θ(x_t | x_&lt;t)</text>
      <text class="subtitle-text" x="20" y="106" font-size="9px">Self-supervised transformer representations</text>

      <path d="M 153 112 L 153 126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

      <rect x="12" y="128" width="282" height="34" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text class="body-text" x="16" y="143" font-size="10px">Open-loop text continuation; lacks execution</text>
      <text class="body-text" x="16" y="155" font-size="10px">discipline or deterministic tool contracts.</text>
    </g>

    <!-- Block 3: Metrics -->
    <g transform="translate(12, 322)">
      <rect class="inner-card" x="0" y="0" width="306" height="155"/>
      <text class="dim-label" x="12" y="18">OPERATIONAL METRICS</text>

      <text class="dim-label" x="12" y="38">Feedback Channel:</text>
      <text class="dim-val" x="125" y="38">None (Self-supervised)</text>

      <text class="dim-label" x="12" y="58">Supervision Granularity:</text>
      <text class="dim-val" x="150" y="58">Dense next-token tokens</text>

      <text class="dim-label" x="12" y="78">Execution Feedback:</text>
      <text class="dim-val" x="135" y="78">Zero sandbox interaction</text>

      <text class="dim-label" x="12" y="98">Reasoning Frontier:</text>
      <text class="dim-val" x="135" y="98">Statistical prior interpolation</text>

      <line x1="12" y1="110" x2="294" y2="110" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="12" y="128">Failure Mode:</text>
      <text class="body-text" x="12" y="143" font-size="10px">Hallucinatory drift; outputs lack causal grounding</text>
      <text class="body-text" x="12" y="155" font-size="10px">in deterministic environment state.</text>
    </g>
  </g>

  <!-- Transition Arrow 1 -> 2 -->
  <g transform="translate(365, 230)">
    <path d="M 0 0 L 50 0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <text class="label-badge" x="25" y="-8">Instruction</text>
    <text class="label-badge" x="25" y="14">Distillation</text>
  </g>

  <!-- Stage 2: Supervised Fine-Tuning (SFT) -->
  <g transform="translate(435, 15)">
    <rect class="stage-card" x="0" y="0" width="330" height="495"/>
    <rect class="header-box" x="12" y="12" width="306" height="42" fill="#dbeafe"/>
    <text class="title-text" x="22" y="32">Stage 2: Supervised Fine-Tuning</text>
    <text class="subtitle-text" x="22" y="47">Interface Adaptation &amp; Schemas (Open-Loop)</text>

    <!-- Block 1: Training Objective -->
    <g transform="translate(12, 66)">
      <rect class="inner-card" x="0" y="0" width="306" height="80"/>
      <text class="dim-label" x="12" y="18">OPTIMIZATION OBJECTIVE</text>
      <text class="code-accent" x="12" y="38">L_sft(θ) = -Σ log π_θ(y*_t | x, y*&lt;t)</text>
      <text class="body-text" x="12" y="56">Teacher-forced imitation of curated traces;</text>
      <text class="body-text" x="12" y="70">aligns model to JSON envelopes and tool contracts.</text>
    </g>

    <!-- Block 2: Computational Flow -->
    <g transform="translate(12, 158)">
      <rect class="inner-card" x="0" y="0" width="306" height="152"/>
      <text class="dim-label" x="12" y="18">COMPUTATIONAL ARCHITECTURE</text>

      <rect x="12" y="28" width="282" height="34" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text class="body-bold" x="20" y="44" font-size="10.5px">Curated Demonstrations D_sft</text>
      <text class="subtitle-text" x="20" y="56" font-size="9px">Expert problem-solution pairs &lt;prompt x, actions y*&gt;</text>

      <path d="M 153 62 L 153 76" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <rect x="12" y="78" width="282" height="34" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text class="code-accent" x="20" y="94" font-size="10.5px">Instruction Model: π_sft(y*_t | x, y*&lt;t)</text>
      <text class="subtitle-text" x="20" y="106" font-size="9px">Teacher-forced token distillation</text>

      <path d="M 153 112 L 153 126" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <rect x="12" y="128" width="282" height="34" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text class="body-text" x="16" y="143" font-size="10px">Compiles procedural syntax; cannot explore</text>
      <text class="body-text" x="16" y="155" font-size="10px">unseen paths or recover from mid-trajectory errors.</text>
    </g>

    <!-- Block 3: Metrics -->
    <g transform="translate(12, 322)">
      <rect class="inner-card" x="0" y="0" width="306" height="155"/>
      <text class="dim-label" x="12" y="18">OPERATIONAL METRICS</text>

      <text class="dim-label" x="12" y="38">Feedback Channel:</text>
      <text class="dim-val" x="125" y="38">Open-loop teacher forcing</text>

      <text class="dim-label" x="12" y="58">Supervision Granularity:</text>
      <text class="dim-val" x="150" y="58">Dense demonstration tokens</text>

      <text class="dim-label" x="12" y="78">Execution Feedback:</text>
      <text class="dim-val" x="135" y="78">Zero sandbox verification</text>

      <text class="dim-label" x="12" y="98">Reasoning Frontier:</text>
      <text class="dim-val" x="135" y="98">Demonstrator competence ceiling</text>

      <line x1="12" y1="110" x2="294" y2="110" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="12" y="128">Compounding Error:</text>
      <text class="code-text" x="125" y="128">P_succ &lt;= exp(-ε̄ · H)</text>
      <text class="body-text" x="12" y="144" font-size="10px">Covariate shift causes exponential degradation</text>
      <text class="body-text" x="12" y="156" font-size="10px">over long multi-step execution horizons.</text>
    </g>
  </g>

  <!-- Transition Arrow 2 -> 3 -->
  <g transform="translate(785, 230)">
    <path d="M 0 0 L 50 0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <text class="label-badge" x="25" y="-8">Closed-Loop</text>
    <text class="label-badge" x="25" y="14">Exploration</text>
  </g>

  <!-- Stage 3: Verifiable RL (RLVR) -->
  <g transform="translate(855, 15)">
    <rect class="stage-card-active" x="0" y="0" width="330" height="495"/>
    <rect class="header-box" x="12" y="12" width="306" height="42" fill="#dcfce7"/>
    <text class="title-text" x="20" y="32">Stage 3: Verifiable RL (RLVR)</text>
    <text class="subtitle-text" x="20" y="47">Closed-Loop Exploration Against Mechanical Oracles</text>

    <!-- Block 1: Training Objective -->
    <g transform="translate(12, 66)">
      <rect class="inner-card" x="0" y="0" width="306" height="80"/>
      <text class="dim-label" x="12" y="18">OPTIMIZATION OBJECTIVE</text>
      <text class="code-green" x="12" y="38">∇_θ J(θ) = E_τ[ Σ ∇ log π_θ · A_hat_t ]</text>
      <text class="body-text" x="12" y="56">Policy reinforced by deterministic execution oracles;</text>
      <text class="body-text" x="12" y="70">eliminates proxy reward gaming (Goodhart's Law).</text>
    </g>

    <!-- Block 2: Computational Flow (Closed Loop) -->
    <g transform="translate(12, 158)">
      <rect class="loop-card" x="0" y="0" width="306" height="152"/>
      <text class="dim-label" x="12" y="18" fill="#15803d">CLOSED-LOOP EXECUTION ENGINE</text>

      <!-- Inside loop elements -->
      <g transform="translate(6, 26)">
        <rect x="16" y="0" width="108" height="34" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
        <text class="code-purple" x="22" y="16" font-size="9.5px">Agent Policy π_θ</text>
        <text class="subtitle-text" x="22" y="27" font-size="8px">Explores multi-turn</text>

        <path d="M 124 17 L 152 17" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
        <text class="code-text" x="138" y="11" font-size="8px" text-anchor="middle">a_t</text>

        <rect x="156" y="0" width="124" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text class="body-bold" x="162" y="16" font-size="9.5px">Execution Sandbox</text>
        <text class="subtitle-text" x="162" y="27" font-size="8px">MicroVM state s_t</text>

        <path d="M 218 34 L 218 46" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

        <rect x="16" y="48" width="264" height="32" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
        <text class="code-green" x="24" y="63" font-size="9.5px">Mechanical Oracle: R(τ) in {0, 1}</text>
        <text class="subtitle-text" x="24" y="74" font-size="8px">Compilers, unit test assertions, formal provers</text>

        <!-- Loopback arrow -->
        <path d="M 16 64 L 6 64 L 6 17 L 14 17" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-emerald)"/>
      </g>

      <rect x="12" y="112" width="282" height="32" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text class="body-text" x="16" y="125" font-size="9.5px">Discovers novel solutions, self-correction, and</text>
      <text class="body-text" x="16" y="137" font-size="9.5px">attention backtracking beyond human demonstration.</text>
    </g>

    <!-- Block 3: Metrics -->
    <g transform="translate(12, 322)">
      <rect class="inner-card" x="0" y="0" width="306" height="155"/>
      <text class="dim-label" x="12" y="18">OPERATIONAL METRICS</text>

      <text class="dim-label" x="12" y="38">Feedback Channel:</text>
      <text class="dim-val" x="120" y="38">Closed-loop physical execution</text>

      <text class="dim-label" x="12" y="58">Supervision Granularity:</text>
      <text class="dim-val" x="145" y="58">Mechanical return R in {0, 1}</text>

      <text class="dim-label" x="12" y="78">Execution Feedback:</text>
      <text class="dim-val" x="130" y="78">Strictly isolated sandbox</text>

      <text class="dim-label" x="12" y="98">Reasoning Frontier:</text>
      <text class="dim-val" x="130" y="98">Autonomous deliberation</text>

      <line x1="12" y1="110" x2="294" y2="110" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="12" y="128">Optimization Invariant:</text>
      <text class="code-green" x="12" y="144">Zero Proxy Divergence Gap</text>
      <text class="body-text" x="12" y="157" font-size="10px">Policy explores actively; rewards cannot be gamed.</text>
    </g>
  </g>
</svg>
