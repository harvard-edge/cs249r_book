<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e40af"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803d"/>
    </marker>
  </defs>

  <style>
    .plot-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #334155; line-height: 1.4; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #0f172a; }
    .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
    .tick-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #64748b; }
    .anno-title { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
    .anno-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; fill: #475569; }
    .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; fill: #334155; }
  </style>

  <!-- ==================== PANEL A: UNREGULARIZED RLVR DYNAMICS ==================== -->
  <g transform="translate(20, 15)">
    <rect class="plot-card" x="0" y="0" width="465" height="410"/>
    <rect x="12" y="12" width="441" height="38" rx="3" fill="#fee2e2"/>
    <text class="title-text" x="22" y="30">(a) Unregularized RLVR Dynamics</text>
    <text class="subtitle-text" x="22" y="44">Entropy Collapse &amp; Runaway Verbosity (No Regularization)</text>

    <!-- Plot Coordinate Frame: X from 65 to 395 (330px), Y from 80 to 320 (240px) -->
    <!-- Grid Lines -->
    <line x1="65" y1="320" x2="395" y2="320" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="65" y1="240" x2="395" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="65" y1="160" x2="395" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="65" y1="80" x2="395" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Left Y-Axis: Sequence Length T (Blue) -->
    <line x1="65" y1="320" x2="65" y2="70" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text class="axis-label" x="65" y="62" fill="#1e40af" text-anchor="middle">Sequence Length T</text>
    <text class="tick-label" x="57" y="323" text-anchor="end">0</text>
    <text class="tick-label" x="57" y="243" text-anchor="end">8k</text>
    <text class="tick-label" x="57" y="163" text-anchor="end">16k</text>
    <text class="tick-label" x="57" y="83" text-anchor="end">32k</text>

    <!-- Right Y-Axis: Entropy H(pi) (Red) -->
    <line x1="395" y1="320" x2="395" y2="70" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text class="axis-label" x="395" y="62" fill="#b91c1c" text-anchor="middle">Entropy H(π)</text>
    <text class="tick-label" x="403" y="323" text-anchor="start">0.0</text>
    <text class="tick-label" x="403" y="243" text-anchor="start">0.4</text>
    <text class="tick-label" x="403" y="163" text-anchor="start">0.8</text>
    <text class="tick-label" x="403" y="83" text-anchor="start">1.2</text>

    <!-- X-Axis Labels -->
    <text class="tick-label" x="65" y="335" text-anchor="middle">0</text>
    <text class="tick-label" x="165" y="335" text-anchor="middle">300</text>
    <text class="tick-label" x="275" y="335" text-anchor="middle">700</text>
    <text class="tick-label" x="395" y="335" text-anchor="middle">1000</text>
    <text class="axis-label" x="230" y="348" fill="#475569" text-anchor="middle">Training Steps</text>

    <!-- Curve 1: Sequence Length T (Surging Blue) -->
    <path d="M 65 305 C 130 295 195 240 250 170 C 300 110 340 90 395 85" fill="none" stroke="#2563eb" stroke-width="2.4"/>

    <!-- Curve 2: Entropy H(pi) (Collapsing Red Dashed) -->
    <path d="M 65 85 C 120 100 180 200 240 270 C 290 305 340 312 395 315" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="5 3"/>

    <!-- Callout 1: Entropy Collapse -->
    <g transform="translate(80, 185)">
      <rect x="0" y="0" width="145" height="38" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text class="anno-title" x="8" y="15" fill="#991b1b">Entropy Collapse</text>
      <text class="anno-desc" x="8" y="28">Mode-locking on early reward path</text>
    </g>

    <!-- Callout 2: Verbosity Explosion -->
    <g transform="translate(190, 95)">
      <rect x="0" y="0" width="145" height="38" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <text class="anno-title" x="8" y="15" fill="#1e40af">Runaway Verbosity</text>
      <text class="anno-desc" x="8" y="28">Padding reasoning; KV blowout</text>
    </g>

    <!-- Legend at bottom -->
    <g transform="translate(65, 370)">
      <rect x="0" y="0" width="330" height="28" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Blue line sample -->
      <line x1="20" y1="14" x2="45" y2="14" stroke="#2563eb" stroke-width="2.4"/>
      <text class="legend-text" x="52" y="17">Token Length T</text>

      <!-- Red dashed line sample -->
      <line x1="180" y1="14" x2="205" y2="14" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="5 3"/>
      <text class="legend-text" x="212" y="17" fill="#991b1b">Entropy H(π)</text>
    </g>
  </g>

  <!-- ==================== PANEL B: CALIBRATED DUAL REGULARIZATION ==================== -->
  <g transform="translate(515, 15)">
    <rect class="plot-card" x="0" y="0" width="465" height="410"/>
    <rect x="12" y="12" width="441" height="38" rx="3" fill="#dcfce7"/>
    <text class="title-text" x="22" y="30">(b) Calibrated Dual-Regularized RLVR</text>
    <text class="subtitle-text" x="22" y="44">Scheduled Entropy Floor &amp; Piecewise Length Penalty</text>

    <!-- Plot Coordinate Frame: X from 65 to 395 (330px), Y from 80 to 320 (240px) -->
    <!-- Grid Lines -->
    <line x1="65" y1="320" x2="395" y2="320" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="65" y1="240" x2="395" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="65" y1="160" x2="395" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="65" y1="80" x2="395" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Left Y-Axis: Sequence Length T (Blue) -->
    <line x1="65" y1="320" x2="65" y2="70" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text class="axis-label" x="65" y="62" fill="#1e40af" text-anchor="middle">Sequence Length T</text>
    <text class="tick-label" x="57" y="323" text-anchor="end">0</text>
    <text class="tick-label" x="57" y="243" text-anchor="end">4k (Target)</text>
    <text class="tick-label" x="57" y="163" text-anchor="end">8k</text>
    <text class="tick-label" x="57" y="83" text-anchor="end">16k</text>

    <!-- Right Y-Axis: Entropy H(pi) (Green) -->
    <line x1="395" y1="320" x2="395" y2="70" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text class="axis-label" x="395" y="62" fill="#15803d" text-anchor="middle">Entropy H(π)</text>
    <text class="tick-label" x="403" y="323" text-anchor="start">0.0</text>
    <text class="tick-label" x="403" y="243" text-anchor="start">0.4</text>
    <text class="tick-label" x="403" y="163" text-anchor="start">0.8 (Floor)</text>
    <text class="tick-label" x="403" y="83" text-anchor="start">1.2</text>

    <!-- Target Band for Token Length (4k Target) -->
    <rect x="65" y="228" width="330" height="24" fill="#eff6ff" opacity="0.8"/>
    <line x1="65" y1="240" x2="395" y2="240" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text class="axis-label" x="385" y="236" font-size="8.5px" fill="#2563eb" text-anchor="end">Target Token Knee T_target</text>

    <!-- Target Band for Entropy (0.8 Stable Exploration) -->
    <rect x="65" y="148" width="330" height="24" fill="#f0fdf4" opacity="0.8"/>
    <line x1="65" y1="160" x2="395" y2="160" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text class="axis-label" x="385" y="156" font-size="8.5px" fill="#16a34a" text-anchor="end">Stable Exploration Band</text>

    <!-- X-Axis Labels -->
    <text class="tick-label" x="65" y="335" text-anchor="middle">0</text>
    <text class="tick-label" x="165" y="335" text-anchor="middle">300</text>
    <text class="tick-label" x="275" y="335" text-anchor="middle">700</text>
    <text class="tick-label" x="395" y="335" text-anchor="middle">1000</text>
    <text class="axis-label" x="230" y="348" fill="#475569" text-anchor="middle">Training Steps</text>

    <!-- Curve 1: Controlled Length T (Blue) -->
    <path d="M 65 300 C 110 285 160 250 200 242 C 260 238 320 240 395 240" fill="none" stroke="#2563eb" stroke-width="2.4"/>

    <!-- Curve 2: Controlled Entropy H(pi) (Green Dashed) -->
    <path d="M 65 100 C 110 115 150 156 190 162 C 250 158 310 160 395 160" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="5 3"/>

    <!-- Callout 1: Length Penalty -->
    <g transform="translate(170, 265)">
      <rect x="0" y="0" width="180" height="38" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <text class="anno-title" x="8" y="15" fill="#1e40af">Piecewise Length Penalty</text>
      <text class="code-text" x="8" y="29" font-size="8.5px">R_len = -λ · max(0, T - T_target)</text>
    </g>

    <!-- Callout 2: Adaptive Entropy Bonus -->
    <g transform="translate(80, 85)">
      <rect x="0" y="0" width="165" height="38" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text class="anno-title" x="8" y="15" fill="#15803d">Adaptive Entropy Bonus</text>
      <text class="anno-desc" x="8" y="28">β_ent schedule maintains exploration</text>
    </g>

    <!-- Legend at bottom -->
    <g transform="translate(65, 370)">
      <rect x="0" y="0" width="330" height="28" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="20" y1="14" x2="45" y2="14" stroke="#2563eb" stroke-width="2.4"/>
      <text class="legend-text" x="52" y="17">Token Length T</text>

      <line x1="180" y1="14" x2="205" y2="14" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="5 3"/>
      <text class="legend-text" x="212" y="17" fill="#15803d">Entropy H(π)</text>
    </g>
  </g>
</svg>
