<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e40af"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="440" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: UNREGULARIZED RLVR (COLLAPSE & VERBOSITY EXPLOSION)     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 30)">
    <!-- Panel Container -->
    <rect x="0" y="0" width="410" height="370" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="21" font-size="11" font-weight="700" fill="#0f172a">(a) Unregularized RLVR: Entropy Collapse &amp; Verbosity Explosion</text>

    <!-- Plot Area (Width 300, Height 230) -->
    <!-- X: 60 to 350, Y: 60 (top) to 290 (bottom) -->
    
    <!-- Grid lines -->
    <line x1="60" y1="290" x2="350" y2="290" stroke="#94a3b8" stroke-width="1"/>
    <line x1="60" y1="213" x2="350" y2="213" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="136" x2="350" y2="136" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="60" x2="350" y2="60" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Left Y-Axis: Token Length T (blue) -->
    <line x1="60" y1="290" x2="60" y2="55" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="55" y="50" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="end">Token Length (T)</text>
    <text x="52" y="293" font-size="8.5" fill="#64748b" text-anchor="end">0</text>
    <text x="52" y="216" font-size="8.5" fill="#64748b" text-anchor="end">8k</text>
    <text x="52" y="139" font-size="8.5" fill="#64748b" text-anchor="end">16k</text>
    <text x="52" y="65" font-size="8.5" fill="#64748b" text-anchor="end">32k (Max)</text>

    <!-- Right Y-Axis: Policy Entropy H(pi) (red) -->
    <line x1="350" y1="290" x2="350" y2="55" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="355" y="50" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="start">Entropy H(π)</text>
    <text x="358" y="293" font-size="8.5" fill="#64748b" text-anchor="start">0.0</text>
    <text x="358" y="216" font-size="8.5" fill="#64748b" text-anchor="start">0.4</text>
    <text x="358" y="139" font-size="8.5" fill="#64748b" text-anchor="start">0.8</text>
    <text x="358" y="65" font-size="8.5" fill="#64748b" text-anchor="start">1.2</text>

    <!-- X-Axis Labels -->
    <text x="60" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">0</text>
    <text x="156" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">300</text>
    <text x="253" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">700</text>
    <text x="350" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">1000</text>
    <text x="205" y="322" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Training Steps</text>

    <!-- Curve 1: Token Length T (Exploding Blue Curve) -->
    <!-- Starts at 2k (y=275), rises exponentially toward 32k (y=65) -->
    <path d="M60,275 C120,265 180,220 230,160 C270,110 300,75 350,65" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    
    <!-- Curve 2: Entropy H(pi) (Collapsing Red Curve) -->
    <!-- Starts at 1.2 (y=65), collapses to 0.05 (y=280) -->
    <path d="M60,65 C110,80 160,170 210,240 C260,275 300,280 350,282" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,2"/>

    <!-- Annotations / Badges -->
    <rect x="75" y="160" width="135" height="36" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="82" y="174" font-size="8" font-weight="700" fill="#991b1b">Entropy Collapse</text>
    <text x="82" y="187" font-size="7.5" fill="#b91c1c">Deterministic Mode Locking</text>

    <rect x="200" y="75" width="135" height="36" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="207" y="89" font-size="8" font-weight="700" fill="#1e40af">Verbosity Divergence</text>
    <text x="207" y="102" font-size="7.5" fill="#1d4ed8">Length-Hacking Policy Drift</text>

    <!-- Footer Takeaway -->
    <rect x="12" y="336" width="386" height="24" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="205" y="352" font-size="8" font-weight="600" fill="#9f1239" text-anchor="middle">Failure Mode: Model maximizes search via discursive padding without penalty</text>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: CALIBRATED RLVR (EQUILIBRIUM)                            -->
  <!-- ================================================================= -->
  <g transform="translate(490, 30)">
    <!-- Panel Container -->
    <rect x="0" y="0" width="410" height="370" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="21" font-size="11" font-weight="700" fill="#0f172a">(b) Calibrated RLVR: Dual-Regularized Equilibrium</text>

    <!-- Grid lines -->
    <line x1="60" y1="290" x2="350" y2="290" stroke="#94a3b8" stroke-width="1"/>
    <line x1="60" y1="213" x2="350" y2="213" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="136" x2="350" y2="136" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="60" y1="60" x2="350" y2="60" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Left Y-Axis: Token Length T (blue) -->
    <line x1="60" y1="290" x2="60" y2="55" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="55" y="50" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="end">Token Length (T)</text>
    <text x="52" y="293" font-size="8.5" fill="#64748b" text-anchor="end">0</text>
    <text x="52" y="216" font-size="8.5" fill="#64748b" text-anchor="end">4k (Target)</text>
    <text x="52" y="139" font-size="8.5" fill="#64748b" text-anchor="end">8k</text>
    <text x="52" y="65" font-size="8.5" fill="#64748b" text-anchor="end">16k</text>

    <!-- Right Y-Axis: Policy Entropy H(pi) (green) -->
    <line x1="350" y1="290" x2="350" y2="55" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="355" y="50" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="start">Entropy H(π)</text>
    <text x="358" y="293" font-size="8.5" fill="#64748b" text-anchor="start">0.0</text>
    <text x="358" y="216" font-size="8.5" fill="#64748b" text-anchor="start">0.4</text>
    <text x="358" y="139" font-size="8.5" fill="#64748b" text-anchor="start">0.8 (Stable)</text>
    <text x="358" y="65" font-size="8.5" fill="#64748b" text-anchor="start">1.2</text>

    <!-- X-Axis Labels -->
    <text x="60" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">0</text>
    <text x="156" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">300</text>
    <text x="253" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">700</text>
    <text x="350" y="306" font-size="8.5" fill="#64748b" text-anchor="middle">1000</text>
    <text x="205" y="322" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Training Steps</text>

    <!-- Target Band for Token Length (4k +/- 10%) -->
    <rect x="60" y="200" width="290" height="26" fill="#eff6ff" opacity="0.8"/>
    <line x1="60" y1="213" x2="350" y2="213" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="340" y="208" font-size="7.5" font-weight="600" fill="#2563eb" text-anchor="end">Target Token Budget</text>

    <!-- Target Band for Entropy (0.75 - 0.85) -->
    <rect x="60" y="125" width="290" height="26" fill="#f0fdf4" opacity="0.8"/>
    <line x1="60" y1="138" x2="350" y2="138" stroke="#86efac" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="340" y="133" font-size="7.5" font-weight="600" fill="#16a34a" text-anchor="end">Stable Exploration Band</text>

    <!-- Curve 1: Token Length T (Controlled Blue Curve) -->
    <!-- Rises from 1k (y=270) and flattens smoothly into 4k band (y=213) -->
    <path d="M60,270 C100,260 140,225 180,215 C230,211 290,213 350,213" fill="none" stroke="#2563eb" stroke-width="2.2"/>

    <!-- Curve 2: Entropy H(pi) (Controlled Green Curve) -->
    <!-- Dips slightly from 1.1 (y=80) into stable band (y=138) and stays -->
    <path d="M60,80 C100,95 130,135 170,140 C220,136 280,138 350,138" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="4,2"/>

    <!-- Annotations / Badges -->
    <rect x="185" y="245" width="150" height="32" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="192" y="258" font-size="8" font-weight="700" fill="#1e40af">Length Penalty Active</text>
    <text x="192" y="270" font-size="7.5" fill="#475569">R_length = -λ_L max(0, T - T_target)</text>

    <rect x="75" y="80" width="150" height="32" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
    <text x="82" y="93" font-size="8" font-weight="700" fill="#15803d">Adaptive Entropy Bonus</text>
    <text x="82" y="105" font-size="7.5" fill="#475569">β_ent scheduled to prevent collapse</text>

    <!-- Footer Takeaway -->
    <rect x="12" y="336" width="386" height="24" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="205" y="352" font-size="8" font-weight="600" fill="#166534" text-anchor="middle">Systems Invariant: Stable exploration sustained without KV-cache blowout</text>
  </g>
</svg>
