<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="600" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="460" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">POSIX Process Control Block (PCB) vs. Agent Control Block (ACB)</text>
  <text x="460" y="48" text-anchor="middle" font-size="9.5" fill="#64748B">Structural contrast between deterministic CPU execution descriptors and stochastic neural agent descriptors</text>

  <!-- LEFT COLUMN: POSIX PCB -->
  <g filter="url(#shadow)">
    <!-- Container Card -->
    <rect x="40" y="70" width="400" height="420" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="40" y="70" width="400" height="34" rx="8" fill="#334155"/>
    <rect x="40" y="96" width="400" height="8" fill="#334155"/>
    <text x="240" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">POSIX PCB (struct task_struct)</text>

    <!-- Field Rows -->
    <!-- Row 1: Identity -->
    <g transform="translate(55, 115)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F172A">Process Identity &amp; Credentials</text>
      <text x="12" y="34" font-size="8.5" fill="#475569"><tspan font-family="monospace">pid_t pid, ppid; uid_t uid, gid;</tspan> • Bit-exact POSIX IDs</text>
    </g>

    <!-- Row 2: CPU Registers -->
    <g transform="translate(55, 167)">
      <rect width="370" height="54" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F172A">Hardware Register Context</text>
      <text x="12" y="32" font-size="8.5" fill="#475569"><tspan font-family="monospace">struct thread_struct thread;</tspan> (RIP, RSP, RAX, CR3)</text>
      <text x="12" y="46" font-size="8" fill="#64748B">Deterministic bit-exact snapshot via CPU context switch</text>
    </g>

    <!-- Row 3: Memory Address Space -->
    <g transform="translate(55, 229)">
      <rect width="370" height="54" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F172A">Memory Management (Address Space)</text>
      <text x="12" y="32" font-size="8.5" fill="#475569"><tspan font-family="monospace">struct mm_struct *mm;</tspan> (Page tables, VMA tree)</text>
      <text x="12" y="46" font-size="8" fill="#64748B">Linear virtual address space; bit-exact memcpy() / CoW fork</text>
    </g>

    <!-- Row 4: File Descriptors & I/O -->
    <g transform="translate(55, 291)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F172A">File Descriptors &amp; Open Handles</text>
      <text x="12" y="34" font-size="8.5" fill="#475569"><tspan font-family="monospace">struct files_struct *files;</tspan> (fd_array[] → VFS inodes)</text>
    </g>

    <!-- Row 5: Process State & Signals -->
    <g transform="translate(55, 343)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F172A">Execution State &amp; Scheduling</text>
      <text x="12" y="34" font-size="8.5" fill="#475569"><tspan font-family="monospace">long state;</tspan> (TASK_RUNNING, INTERRUPTIBLE, ZOMBIE)</text>
    </g>

    <!-- Row 6: Accounting -->
    <g transform="translate(55, 395)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0F172A">Resource Accounting</text>
      <text x="12" y="34" font-size="8.5" fill="#475569"><tspan font-family="monospace">u64 utime, stime;</tspan> CPU clock cycles, RSS memory</text>
    </g>

    <!-- PCB Footer Tag -->
    <rect x="55" y="447" width="370" height="32" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <text x="240" y="467" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Deterministic State: 100% Bit-Exact Reconstructible</text>
  </g>

  <!-- RIGHT COLUMN: AGENT CONTROL BLOCK (ACB) -->
  <g filter="url(#shadow)">
    <!-- Container Card -->
    <rect x="480" y="70" width="400" height="420" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="1.8"/>
    <!-- Header -->
    <rect x="480" y="70" width="400" height="34" rx="8" fill="#581C87"/>
    <rect x="480" y="96" width="400" height="8" fill="#581C87"/>
    <text x="680" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Agent Control Block (ACB)</text>

    <!-- Field Rows -->
    <!-- Row 1: Principal & Goal Envelope -->
    <g transform="translate(495, 115)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">Principal Identity &amp; Goal Envelope</text>
      <text x="12" y="34" font-size="8.5" fill="#3B0764"><tspan font-family="monospace">agent_id, session_uuid; Goal(g), Target Invariants Psi</tspan></text>
    </g>

    <!-- Row 2: Capability Leases -->
    <g transform="translate(495, 167)">
      <rect width="370" height="54" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">Attenuated Capability Leases</text>
      <text x="12" y="32" font-size="8.5" fill="#3B0764"><tspan font-family="monospace">CapabilitySet C_t;</tspan> Allowed Tool ABIs, Sandbox Profiles</text>
      <text x="12" y="46" font-size="8" fill="#7E22CE">Cryptographic HMAC token, Time-To-Live (TTL), Monotonic restriction</text>
    </g>

    <!-- Row 3: Memory Descriptors -->
    <g transform="translate(495, 229)">
      <rect width="370" height="54" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">Memory Descriptors (KV Cache &amp; State)</text>
      <text x="12" y="32" font-size="8.5" fill="#3B0764"><tspan font-family="monospace">L1_kv_blocks[], L2_radix_keys[], L3_vector_session</tspan></text>
      <text x="12" y="46" font-size="8" fill="#7E22CE">Non-stationary state; cannot bit-exact snapshot neural thought</text>
    </g>

    <!-- Row 4: Lineage & Causal Clocks -->
    <g transform="translate(495, 291)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">Lineage Pointers &amp; Vector Clock</text>
      <text x="12" y="34" font-size="8.5" fill="#3B0764"><tspan font-family="monospace">parent_acb, subagent_ids[]; VectorClock V_c(e)</tspan></text>
    </g>

    <!-- Row 5: Lifecycle & Recovery -->
    <g transform="translate(495, 343)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">Lifecycle State &amp; Sagas Recovery</text>
      <text x="12" y="34" font-size="8.5" fill="#3B0764"><tspan font-family="monospace">State: PREFILL, DECODE, TOOL_WAIT; CompensatingStack S_c</tspan></text>
    </g>

    <!-- Row 6: Multi-Dimensional Quotas -->
    <g transform="translate(495, 395)">
      <rect width="370" height="44" rx="4" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">Budget Quotas &amp; Burn Velocity</text>
      <text x="12" y="34" font-size="8.5" fill="#3B0764">Token allowances (prompt/decode), Dollar budget $, Wall-clock SLA</text>
    </g>

    <!-- ACB Footer Tag -->
    <rect x="495" y="447" width="370" height="32" rx="4" fill="#F3E8FF" stroke="#A855F7" stroke-dasharray="3 3"/>
    <text x="680" y="467" text-anchor="middle" font-size="8.5" font-weight="600" fill="#581C87">Stochastic State: Manages External Authority &amp; Resources</text>
  </g>

  <!-- BOTTOM COMPARISON SUMMARY BANNER -->
  <g filter="url(#shadow)">
    <rect x="40" y="508" width="840" height="66" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="460" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">The Fundamental Boundary: Why CPU Metaphors Break</text>
    <text x="460" y="545" text-anchor="middle" font-size="8.5" fill="#334155">A POSIX process can be suspended via bit-exact memory copy because registers and DRAM state are static and self-contained.</text>
    <text x="460" y="560" text-anchor="middle" font-size="8.5" fill="#581C87"><tspan font-weight="700">An agent cannot be snapshotted bit-exact:</tspan> its state is distributed across multi-gigabyte GPU KV caches and mutating external environments.</text>
  </g>
</svg>
