<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="600" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="460" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Context Swapping and Memory Hierarchy in Agent Runtimes</text>
  <text x="460" y="46" text-anchor="middle" font-size="9.5" fill="#64748B">Relieving the Tool-Wait Memory Tax: Multi-tier KV-cache eviction across GPU HBM, Host DDR5, and NVMe SSDs</text>

  <!-- TIER 1: ACCELERATOR HBM (Top) -->
  <g filter="url(#shadow)" transform="translate(60, 68)">
    <rect width="800" height="105" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect width="800" height="24" rx="8" fill="#581C87"/>
    <rect y="16" width="800" height="8" fill="#581C87"/>
    <text x="400" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Tier 1: GPU Accelerator High Bandwidth Memory (HBM3e)</text>
    <text x="30" y="44" font-size="9.5" font-weight="700" fill="#3B0764">Capacity: 80 - 141 GB • Bandwidth: 3.35 TB/s • Latency: ~100 ns</text>
    <text x="30" y="60" font-size="8.5" fill="#581C87">Active Ingress/Egress: Allocated to Active PREFILL &amp; DECODE processes running forward passes.</text>

    <!-- Visual KV Cache Blocks -->
    <g transform="translate(30, 72)">
      <rect width="70" height="20" rx="3" fill="#581C87"/>
      <text x="35" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Block 0 (Sys)</text>
      <rect x="80" width="70" height="20" rx="3" fill="#7E22CE"/>
      <text x="115" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Block 1 (Tools)</text>
      <rect x="160" width="70" height="20" rx="3" fill="#9333EA"/>
      <text x="195" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Block 2 (Hist)</text>
      <rect x="240" width="70" height="20" rx="3" fill="#A855F7"/>
      <text x="275" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Block 3 (Turn)</text>
      <rect x="325" width="130" height="20" rx="3" fill="#F3E8FF" stroke="#A855F7" stroke-dasharray="3 2"/>
      <text x="390" y="14" text-anchor="middle" font-size="8" fill="#581C87">PagedAttention Free Pool</text>
      <rect x="470" width="270" height="20" rx="3" fill="#FEF2F2" stroke="#DC2626"/>
      <text x="605" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#DC2626">HAZARD: Idle KV blocks during 45s tool wait ($$$)</text>
    </g>
  </g>

  <!-- BUS 1: PCIe Gen5 x16 DMA Transfer Channel -->
  <g transform="translate(60, 180)">
    <!-- Downward DMA Arrow -->
    <line x1="160" y1="2" x2="160" y2="46" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="150" y="27" text-anchor="end" font-size="8" font-weight="700" fill="#2563EB">DMA Evict</text>

    <!-- Upward DMA Arrow -->
    <line x1="640" y1="46" x2="640" y2="2" stroke="#581C87" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text x="650" y="27" text-anchor="start" font-size="8" font-weight="700" fill="#581C87">DMA Prefetch</text>

    <!-- Center Bus Label -->
    <rect x="230" y="6" width="340" height="38" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="400" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E293B">PCIe Gen5 x16 Interconnect (64 GB/s Bidirectional DMA)</text>
    <text x="400" y="36" text-anchor="middle" font-size="8" fill="#64748B">Non-blocking background block swapping across PagedAttention pools</text>
  </g>

  <!-- TIER 2: HOST SYSTEM MEMORY (Middle) -->
  <g filter="url(#shadow)" transform="translate(60, 235)">
    <rect width="800" height="105" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <rect width="800" height="24" rx="8" fill="#2563EB"/>
    <rect y="16" width="800" height="8" fill="#2563EB"/>
    <text x="400" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Tier 2: Host System Memory (DDR5 DRAM / CXL Memory Pool)</text>
    <text x="30" y="44" font-size="9.5" font-weight="700" fill="#1E40AF">Capacity: 512 GB - 2 TB • Bandwidth: ~300 GB/s • Latency: ~100 ns</text>
    <text x="30" y="60" font-size="8.5" fill="#1E3A8A">Warm Swap Tier: Stashes KV-cache blocks for agents in SUSPENDED_TOOL_WAIT (1s &lt;= T_wait &lt;= 60s).</text>

    <!-- Visual Swapped Blocks -->
    <g transform="translate(30, 72)">
      <rect width="180" height="20" rx="3" fill="#BFDBFE" stroke="#2563EB"/>
      <text x="90" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">Swapped Agent A (Waiting on Bash)</text>
      <rect x="200" width="180" height="20" rx="3" fill="#BFDBFE" stroke="#2563EB"/>
      <text x="290" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">Swapped Agent B (Waiting on API)</text>
      <rect x="400" width="340" height="20" rx="3" fill="#DBEAFE"/>
      <text x="570" y="14" text-anchor="middle" font-size="8" fill="#1E40AF">10x-20x Cheaper per GB than HBM; eliminates accelerator starvation</text>
    </g>
  </g>

  <!-- BUS 2: Storage Bus -->
  <g transform="translate(60, 348)">
    <line x1="400" y1="2" x2="400" y2="38" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="415" y="22" font-size="8.5" font-weight="600" fill="#475569">NVMe PCIe Gen5 SSD Direct Storage Bus (14 GB/s)</text>
  </g>

  <!-- TIER 3: NON-VOLATILE STORAGE (Bottom) -->
  <g filter="url(#shadow)" transform="translate(60, 395)">
    <rect width="800" height="85" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect width="800" height="22" rx="8" fill="#475569"/>
    <rect y="14" width="800" height="8" fill="#475569"/>
    <text x="400" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Tier 3: Local NVMe SSD &amp; Distributed Object Store</text>
    <text x="30" y="42" font-size="9" font-weight="700" fill="#0F172A">Capacity: 4 - 30 TB • Bandwidth: 14 GB/s • Latency: ~10-100 us</text>
    <text x="30" y="58" font-size="8.5" fill="#475569">Cold Tier: Full ACB state serialization for SUSPENDED_HUMAN_GATE (T_wait &gt; 60s), WAL event logs, and checkpoints.</text>
    <text x="30" y="74" font-size="8" fill="#64748B">Enables zero GPU/host memory consumption while awaiting human review or surviving node reboots.</text>
  </g>

  <!-- MATHEMATICAL BREAKEVEN BOX (Bottom Overlay) -->
  <g filter="url(#shadow)" transform="translate(60, 495)">
    <rect width="800" height="75" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.2"/>
    <text x="400" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#581C87">The Breakeven Swapping Threshold Formula</text>
    <text x="400" y="44" text-anchor="middle" font-size="9" fill="#3B0764">
      <tspan font-family="monospace">tau_{breakeven} = (2 * S_{KV}) / B_{PCIe} + T_{alloc}</tspan> ≈ 1.25 seconds (for a 40 GB KV-cache over PCIe Gen5)
    </text>
    <text x="400" y="62" text-anchor="middle" font-size="8.5" fill="#581C87">
      Operational Rule: When anticipated tool delay exceeds 1.25s, swapping KV blocks to host DRAM strictly improves cluster throughput.
    </text>
  </g>
</svg>
