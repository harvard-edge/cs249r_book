<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="500" fill="#F8FAFC" rx="12"/>

  <!-- Top Header Banner -->
  <rect x="16" y="16" width="928" height="56" rx="8" fill="url(#headerGrad)"/>
  <text x="36" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Test-Time Search Topologies: Structural Comparison</text>
  <text x="36" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#E9D5FF">From Parallel Sampling to Deliberate Lookahead Trees and Graph Synthesis</text>

  <!-- PANE 1: Best-of-N -->
  <rect x="16" y="84" width="220" height="345" rx="8" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="92" width="204" height="24" rx="4" fill="#EDE9FE"/>
  <text x="126" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#581C87" text-anchor="middle">1. Best-of-N Sampling</text>

  <!-- Mini Diagram Best-of-N -->
  <rect x="24" y="122" width="204" height="105" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Root -->
  <circle cx="45" cy="174" r="9" fill="#581C87"/>
  <text x="45" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">s₀</text>

  <!-- Branches -->
  <line x1="54" y1="174" x2="160" y2="138" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="54" y1="174" x2="160" y2="162" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="54" y1="174" x2="160" y2="186" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="54" y1="174" x2="160" y2="210" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Leaves -->
  <rect x="165" y="132" width="48" height="13" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
  <text x="189" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#991B1B" text-anchor="middle">r = 0.1</text>

  <rect x="165" y="156" width="48" height="13" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
  <text x="189" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#991B1B" text-anchor="middle">r = 0.4</text>

  <rect x="165" y="180" width="48" height="13" rx="2" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2"/>
  <text x="189" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">r = 0.95 ★</text>

  <rect x="165" y="204" width="48" height="13" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
  <text x="189" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#991B1B" text-anchor="middle">r = 0.2</text>

  <!-- Best-of-N Text Details -->
  <text x="28" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Execution Topology:</text>
  <text x="28" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Independent 1D rollouts</text>
  <text x="28" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Zero inter-branch communication</text>

  <text x="28" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Evaluation Mechanism:</text>
  <text x="28" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Sparse terminal ORM / Majority vote</text>
  <text x="28" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Argmax selection at horizon end</text>

  <rect x="24" y="332" width="204" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="28" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#166534">✓ High GPU batch saturation</text>
  <text x="28" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B">✗ Massive redundant prefix waste</text>

  <rect x="24" y="382" width="204" height="38" rx="4" fill="#EDE9FE"/>
  <text x="126" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">Serving Profile: Embarrassingly Parallel</text>
  <text x="126" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B21A8" text-anchor="middle">Prefix prefill reused via Radix Attention</text>


  <!-- PANE 2: Beam Search -->
  <rect x="252" y="84" width="220" height="345" rx="8" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="260" y="92" width="204" height="24" rx="4" fill="#EDE9FE"/>
  <text x="362" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#581C87" text-anchor="middle">2. Beam Search</text>

  <!-- Mini Diagram Beam Search -->
  <rect x="260" y="122" width="204" height="105" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Root -->
  <circle cx="280" cy="174" r="8" fill="#581C87"/>
  <!-- Ply 1 -->
  <line x1="288" y1="174" x2="322" y2="150" stroke="#7E22CE" stroke-width="1.5"/>
  <line x1="288" y1="174" x2="322" y2="198" stroke="#7E22CE" stroke-width="1.5"/>
  <circle cx="326" cy="150" r="6" fill="#7E22CE"/>
  <circle cx="326" cy="198" r="6" fill="#7E22CE"/>

  <!-- Ply 2: Pruning low branch -->
  <line x1="332" y1="150" x2="370" y2="136" stroke="#7E22CE" stroke-width="1.5"/>
  <line x1="332" y1="150" x2="370" y2="160" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="332" y1="198" x2="370" y2="188" stroke="#7E22CE" stroke-width="1.5"/>
  <line x1="332" y1="198" x2="370" y2="212" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2,2"/>

  <circle cx="374" cy="136" r="6" fill="#7E22CE"/>
  <circle cx="374" cy="160" r="5" fill="#FCA5A5" stroke="#DC2626" stroke-width="1"/>
  <circle cx="374" cy="188" r="6" fill="#7E22CE"/>
  <circle cx="374" cy="212" r="5" fill="#FCA5A5" stroke="#DC2626" stroke-width="1"/>

  <!-- Ply 3 -->
  <line x1="380" y1="136" x2="430" y2="146" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="380" y1="188" x2="430" y2="180" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <rect x="432" y="139" width="28" height="14" rx="2" fill="#DCFCE7" stroke="#22C55E" stroke-width="1"/>
  <text x="446" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">Top 1</text>

  <!-- Beam Text Details -->
  <text x="264" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Execution Topology:</text>
  <text x="264" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Synchronous width-bounded tree</text>
  <text x="264" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Retains top-B hypotheses per step</text>

  <text x="264" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Evaluation Mechanism:</text>
  <text x="264" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Step-level PRM scoring / log-prob</text>
  <text x="264" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Hard pruning at each step frontier</text>

  <rect x="260" y="332" width="204" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="264" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#166534">✓ Strict linear memory footprint</text>
  <text x="264" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B">✗ Myopic pruning loses global optima</text>

  <rect x="260" y="382" width="204" height="38" rx="4" fill="#EDE9FE"/>
  <text x="362" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">Serving Profile: Lock-Step Barrier</text>
  <text x="362" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B21A8" text-anchor="middle">Requires step synchronization barrier</text>


  <!-- PANE 3: MCTS -->
  <rect x="488" y="84" width="220" height="345" rx="8" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="496" y="92" width="204" height="24" rx="4" fill="#EDE9FE"/>
  <text x="598" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#581C87" text-anchor="middle">3. Monte Carlo Tree Search</text>

  <!-- Mini Diagram MCTS -->
  <rect x="496" y="122" width="204" height="105" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Root -->
  <circle cx="598" cy="136" r="8" fill="#581C87"/>
  <!-- Tree nodes -->
  <line x1="594" y1="142" x2="560" y2="164" stroke="#7E22CE" stroke-width="1.8"/>
  <line x1="602" y1="142" x2="636" y2="164" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="558" cy="166" r="7" fill="#7E22CE"/>
  <circle cx="638" cy="166" r="6" fill="#CBD5E1"/>

  <!-- Selected Child -->
  <line x1="558" y1="173" x2="540" y2="198" stroke="#7E22CE" stroke-width="1.8"/>
  <line x1="558" y1="173" x2="576" y2="198" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="538" cy="202" r="7" fill="#22C55E" stroke="#166534" stroke-width="1.5"/>
  <circle cx="576" cy="200" r="5" fill="#CBD5E1"/>

  <!-- Rollout / Backup curve -->
  <path d="M 545 202 Q 620 205, 660 190" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowGray)"/>
  <path d="M 660 188 Q 630 148, 608 136" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowGray)"/>

  <rect x="500" y="126" width="56" height="13" rx="2" fill="#EDE9FE"/>
  <text x="528" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#581C87" text-anchor="middle">1. Selection</text>

  <rect x="640" y="208" width="56" height="13" rx="2" fill="#FEF3C7"/>
  <text x="668" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#92400E" text-anchor="middle">3. Rollout</text>

  <!-- MCTS Text Details -->
  <text x="500" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Execution Topology:</text>
  <text x="500" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Asymmetric exploratory tree (UCT)</text>
  <text x="500" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Balances exploration vs. exploitation</text>

  <text x="500" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Evaluation Mechanism:</text>
  <text x="500" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Value Network + Rollout simulation</text>
  <text x="500" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Recursive value backup to root</text>

  <rect x="496" y="332" width="204" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="500" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#166534">✓ Asymptotically optimal lookahead</text>
  <text x="500" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B">✗ High inference latency &amp; tree state</text>

  <rect x="496" y="382" width="204" height="38" rx="4" fill="#EDE9FE"/>
  <text x="598" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">Serving Profile: Asynchronous Tree</text>
  <text x="598" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B21A8" text-anchor="middle">Demands Radix tree KV-cache reuse</text>


  <!-- PANE 4: Graph of Thoughts -->
  <rect x="724" y="84" width="220" height="345" rx="8" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="732" y="92" width="204" height="24" rx="4" fill="#EDE9FE"/>
  <text x="834" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#581C87" text-anchor="middle">4. Graph of Thoughts (GoT)</text>

  <!-- Mini Diagram GoT -->
  <rect x="732" y="122" width="204" height="105" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <!-- DAG Nodes -->
  <circle cx="755" cy="174" r="8" fill="#581C87"/>
  <circle cx="795" cy="145" r="7" fill="#7E22CE"/>
  <circle cx="795" cy="200" r="7" fill="#7E22CE"/>
  <circle cx="845" cy="174" r="8" fill="#22C55E" stroke="#166534" stroke-width="1.5"/>
  <circle cx="895" cy="174" r="7" fill="#581C87"/>

  <!-- Directed edges (splitting and merging) -->
  <line x1="763" y1="170" x2="788" y2="148" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="763" y1="178" x2="788" y2="196" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <!-- Merge edges into Node 4 -->
  <line x1="802" y1="148" x2="838" y2="170" stroke="#22C55E" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <line x1="802" y1="196" x2="838" y2="178" stroke="#22C55E" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <!-- Terminal edge -->
  <line x1="853" y1="174" x2="886" y2="174" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="820" y="130" width="50" height="13" rx="2" fill="#DCFCE7"/>
  <text x="845" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">Merge</text>

  <!-- GoT Text Details -->
  <text x="736" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Execution Topology:</text>
  <text x="736" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Arbitrary Directed Acyclic Graph</text>
  <text x="736" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Branching, merging, and synthesis</text>

  <text x="736" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Evaluation Mechanism:</text>
  <text x="736" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Multi-edge relational verification</text>
  <text x="736" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Cross-branch thought distillation</text>

  <rect x="732" y="332" width="204" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="736" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#166534">✓ Expresses thought aggregation</text>
  <text x="736" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#991B1B">✗ Complex dependency scheduling</text>

  <rect x="732" y="382" width="204" height="38" rx="4" fill="#EDE9FE"/>
  <text x="834" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">Serving Profile: Graph Scheduler</text>
  <text x="834" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B21A8" text-anchor="middle">Requires multi-parent KV-cache merges</text>


  <!-- BOTTOM BANNER -->
  <rect x="16" y="440" width="928" height="44" rx="8" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.2"/>
  <text x="36" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#581C87">Systems Trade-off: Parallel Batch Throughput vs. Deliberate Lookahead</text>
  <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#4C1D95">Best-of-N maximizes GPU batch saturation and compute efficiency; MCTS and GoT maximize solution accuracy on intractable problem manifolds.</text>
</svg>