<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7E22CE"/>
    </marker>
    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="75%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">The Architectural Spectrum of Agentic Control</text>
  <text x="480" y="50" text-anchor="middle" font-size="10.5" fill="#64748B">Progression from deterministic pipelines to open-ended autonomous execution loops</text>

  <!-- Spectrum Arrow Bar -->
  <g transform="translate(40, 68)">
    <rect width="880" height="12" rx="6" fill="url(#spectrum-grad)"/>
    <text x="0" y="-8" font-size="9" font-weight="700" fill="#0284C7">DETERMINISTIC CONTROL</text>
    <text x="880" y="-8" text-anchor="end" font-size="9" font-weight="700" fill="#9333EA">AUTONOMOUS SEARCH</text>
  </g>

  <!-- 5 ARCHITECTURAL COLUMNS -->

  <!-- Column 1: Prompt Chaining -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="164" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="164" height="32" rx="8" fill="#0284C7"/>
    <rect y="24" width="164" height="8" fill="#0284C7"/>
    <text x="82" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">1. Prompt Chaining</text>

    <!-- Visual Diagram -->
    <g transform="translate(18, 48)">
      <rect x="14" y="0" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="1"/>
      <text x="64" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">Step A (LLM)</text>

      <line x1="64" y1="28" x2="64" y2="44" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="14" y="44" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="1"/>
      <text x="64" y="62" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">Step B (LLM)</text>

      <line x1="64" y1="72" x2="64" y2="88" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="14" y="88" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="1"/>
      <text x="64" y="106" text-anchor="middle" font-size="9" font-weight="600" fill="#0F172A">Step C (LLM)</text>
    </g>

    <!-- Properties -->
    <g transform="translate(12, 185)">
      <rect width="140" height="102" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0F172A">Characteristics:</text>
      <text x="8" y="32" font-size="8" fill="#475569">• Fixed sequential pipeline</text>
      <text x="8" y="46" font-size="8" fill="#475569">• Static hardcoded edges</text>
      <text x="8" y="60" font-size="8" fill="#475569">• Zero dynamic routing</text>
      <text x="8" y="74" font-size="8" fill="#475569">• Trivial verification</text>
      <text x="8" y="88" font-size="8" fill="#0284C7">Latency: O(1) bounded</text>
    </g>
  </g>

  <!-- Column 2: Routing -->
  <g transform="translate(219, 95)" filter="url(#shadow)">
    <rect width="164" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="164" height="32" rx="8" fill="#2563EB"/>
    <rect y="24" width="164" height="8" fill="#2563EB"/>
    <text x="82" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">2. Routing &amp; Dispatch</text>

    <!-- Visual Diagram -->
    <g transform="translate(18, 48)">
      <polygon points="64,2 118,22 64,42 10,22" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
      <text x="64" y="25" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1E40AF">Router LLM</text>

      <path d="M 30 35 L 15 62" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 64 42 L 64 62" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 98 35 L 113 62" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="0" y="66" width="38" height="24" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
      <text x="19" y="81" text-anchor="middle" font-size="7.5" fill="#0F172A">Path A</text>

      <rect x="45" y="66" width="38" height="24" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
      <text x="64" y="81" text-anchor="middle" font-size="7.5" fill="#0F172A">Path B</text>

      <rect x="90" y="66" width="38" height="24" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
      <text x="109" y="81" text-anchor="middle" font-size="7.5" fill="#0F172A">Path C</text>
    </g>

    <!-- Properties -->
    <g transform="translate(12, 185)">
      <rect width="140" height="102" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0F172A">Characteristics:</text>
      <text x="8" y="32" font-size="8" fill="#475569">• Dynamic single branch</text>
      <text x="8" y="46" font-size="8" fill="#475569">• Domain specialization</text>
      <text x="8" y="60" font-size="8" fill="#475569">• Low failure blast radius</text>
      <text x="8" y="74" font-size="8" fill="#475569">• Deterministic schema</text>
      <text x="8" y="88" font-size="8" fill="#2563EB">Classification gating</text>
    </g>
  </g>

  <!-- Column 3: Parallelization -->
  <g transform="translate(398, 95)" filter="url(#shadow)">
    <rect width="164" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="164" height="32" rx="8" fill="#4F46E5"/>
    <rect y="24" width="164" height="8" fill="#4F46E5"/>
    <text x="82" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">3. Parallel Fan-Out</text>

    <!-- Visual Diagram -->
    <g transform="translate(18, 48)">
      <rect x="24" y="0" width="80" height="20" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
      <text x="64" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#312E81">Dispatch Task</text>

      <path d="M 35 20 L 15 38" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 64 20 L 64 38" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 93 20 L 113 38" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="0" y="42" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
      <text x="19" y="56" text-anchor="middle" font-size="7.5" fill="#0F172A">Worker 1</text>

      <rect x="45" y="42" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
      <text x="64" y="56" text-anchor="middle" font-size="7.5" fill="#0F172A">Worker 2</text>

      <rect x="90" y="42" width="38" height="22" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
      <text x="109" y="56" text-anchor="middle" font-size="7.5" fill="#0F172A">Worker 3</text>

      <path d="M 19 64 L 40 82" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 64 64 L 64 82" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 109 64 L 88 82" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="24" y="86" width="80" height="20" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
      <text x="64" y="100" text-anchor="middle" font-size="8" font-weight="600" fill="#312E81">Aggregator</text>
    </g>

    <!-- Properties -->
    <g transform="translate(12, 185)">
      <rect width="140" height="102" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0F172A">Characteristics:</text>
      <text x="8" y="32" font-size="8" fill="#475569">• Concurrent execution</text>
      <text x="8" y="46" font-size="8" fill="#475569">• Sectioning &amp; voting</text>
      <text x="8" y="60" font-size="8" fill="#475569">• High GPU throughput</text>
      <text x="8" y="74" font-size="8" fill="#475569">• Barrier synchronization</text>
      <text x="8" y="88" font-size="8" fill="#4F46E5">Map-Reduce topology</text>
    </g>
  </g>

  <!-- Column 4: Orchestrator-Workers -->
  <g transform="translate(577, 95)" filter="url(#shadow)">
    <rect width="164" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="164" height="32" rx="8" fill="#7E22CE"/>
    <rect y="24" width="164" height="8" fill="#7E22CE"/>
    <text x="82" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">4. Supervisor-Workers</text>

    <!-- Visual Diagram -->
    <g transform="translate(18, 48)">
      <rect x="14" y="0" width="100" height="26" rx="4" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.2"/>
      <text x="64" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#581C87">Supervisor DAG</text>

      <line x1="34" y1="26" x2="20" y2="52" stroke="#7E22CE" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="20" y1="52" x2="34" y2="26" stroke="#7E22CE" stroke-width="1.2" stroke-dasharray="2 2"/>

      <line x1="94" y1="26" x2="108" y2="52" stroke="#7E22CE" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="108" y1="52" x2="94" y2="26" stroke="#7E22CE" stroke-width="1.2" stroke-dasharray="2 2"/>

      <rect x="0" y="56" width="58" height="24" rx="3" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
      <text x="29" y="71" text-anchor="middle" font-size="7.5" fill="#0F172A">Worker 1</text>

      <rect x="70" y="56" width="58" height="24" rx="3" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
      <text x="99" y="71" text-anchor="middle" font-size="7.5" fill="#0F172A">Worker 2</text>

      <rect x="14" y="90" width="100" height="20" rx="3" fill="#FAF5FF" stroke="#A855F7" stroke-width="1"/>
      <text x="64" y="104" text-anchor="middle" font-size="7.5" font-weight="600" fill="#6B21A8">Context Isolation Barrier</text>
    </g>

    <!-- Properties -->
    <g transform="translate(12, 185)">
      <rect width="140" height="102" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0F172A">Characteristics:</text>
      <text x="8" y="32" font-size="8" fill="#475569">• Dynamic task breakdown</text>
      <text x="8" y="46" font-size="8" fill="#475569">• Unidirectional control</text>
      <text x="8" y="60" font-size="8" fill="#475569">• Isolated subagent contexts</text>
      <text x="8" y="74" font-size="8" fill="#475569">• The Anti-Swarm core</text>
      <text x="8" y="88" font-size="8" fill="#7E22CE">Production standard</text>
    </g>
  </g>

  <!-- Column 5: Autonomous Loops -->
  <g transform="translate(756, 95)" filter="url(#shadow)">
    <rect width="164" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="164" height="32" rx="8" fill="#9333EA"/>
    <rect y="24" width="164" height="8" fill="#9333EA"/>
    <text x="82" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">5. Autonomous Loops</text>

    <!-- Visual Diagram -->
    <g transform="translate(18, 48)">
      <circle cx="64" cy="56" r="44" fill="none" stroke="#E9D5FF" stroke-width="4"/>
      
      <rect x="24" y="4" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1"/>
      <text x="64" y="19" text-anchor="middle" font-size="8" font-weight="700" fill="#581C87">Thought (LLM)</text>

      <rect x="74" y="45" width="52" height="22" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1"/>
      <text x="100" y="60" text-anchor="middle" font-size="8" font-weight="700" fill="#581C87">Action</text>

      <rect x="2" y="45" width="52" height="22" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1"/>
      <text x="28" y="60" text-anchor="middle" font-size="7.5" font-weight="700" fill="#581C87">Observation</text>

      <rect x="24" y="88" width="80" height="20" rx="4" fill="#FDF2F8" stroke="#DB2777" stroke-width="1"/>
      <text x="64" y="102" text-anchor="middle" font-size="7.5" font-weight="700" fill="#9D174D">Env / Sandbox</text>

      <path d="M 64 26 C 90 26 100 40 100 45" fill="none" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <path d="M 100 67 C 90 85 75 88 64 88" fill="none" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <path d="M 64 88 C 45 88 28 80 28 67" fill="none" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <path d="M 28 45 C 28 35 45 26 64 26" fill="none" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    </g>

    <!-- Properties -->
    <g transform="translate(12, 185)">
      <rect width="140" height="102" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="16" font-size="8.5" font-weight="700" fill="#0F172A">Characteristics:</text>
      <text x="8" y="32" font-size="8" fill="#475569">• Cyclic feedback loops</text>
      <text x="8" y="46" font-size="8" fill="#475569">• ReAct &amp; Reflexion</text>
      <text x="8" y="60" font-size="8" fill="#475569">• Risk: semantic livelock</text>
      <text x="8" y="74" font-size="8" fill="#475569">• Requires circuit breakers</text>
      <text x="8" y="88" font-size="8" fill="#9333EA">Heavy-tailed cost O(T)</text>
    </g>
  </g>

  <!-- BOTTOM COMPARATIVE AXES -->
  <g transform="translate(40, 415)" filter="url(#shadow)">
    <rect width="880" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Dimension 1: Autonomy vs Determinism -->
    <g transform="translate(20, 18)">
      <text x="0" y="10" font-size="9" font-weight="700" fill="#0F172A">Model Autonomy</text>
      <rect x="140" y="2" width="700" height="10" rx="5" fill="#E2E8F0"/>
      <rect x="140" y="2" width="700" height="10" rx="5" fill="url(#spectrum-grad)"/>
      <text x="145" y="22" font-size="7.5" fill="#475569">Strictly Hardcoded Flow</text>
      <text x="490" y="22" text-anchor="middle" font-size="7.5" fill="#475569">Supervised Delegation</text>
      <text x="840" y="22" text-anchor="end" font-size="7.5" fill="#475569">Self-Directed Search</text>
    </g>

    <!-- Dimension 2: Verification Complexity -->
    <g transform="translate(20, 52)">
      <text x="0" y="10" font-size="9" font-weight="700" fill="#0F172A">Verification Burden</text>
      <rect x="140" y="2" width="700" height="10" rx="5" fill="#E2E8F0"/>
      <path d="M 140 7 Q 490 7 840 2" stroke="#DC2626" stroke-width="4" fill="none"/>
      <text x="145" y="22" font-size="7.5" fill="#475569">Unit Tests &amp; JSON Schema</text>
      <text x="490" y="22" text-anchor="middle" font-size="7.5" fill="#475569">Contract Invariants &amp; PRM</text>
      <text x="840" y="22" text-anchor="end" font-size="7.5" fill="#DC2626">Watchdogs, Breakers &amp; State Hashing</text>
    </g>

    <!-- Dimension 3: Cost & Latency Risk -->
    <g transform="translate(20, 86)">
      <text x="0" y="10" font-size="9" font-weight="700" fill="#0F172A">Cost &amp; Latency Risk</text>
      <rect x="140" y="2" width="700" height="10" rx="5" fill="#E2E8F0"/>
      <line x1="140" y1="7" x2="840" y2="7" stroke="#64748B" stroke-width="2"/>
      <circle cx="160" cy="7" r="4" fill="#0284C7"/>
      <circle cx="310" cy="7" r="4" fill="#2563EB"/>
      <circle cx="480" cy="7" r="4" fill="#4F46E5"/>
      <circle cx="660" cy="7" r="4" fill="#7E22CE"/>
      <circle cx="820" cy="7" r="4" fill="#9333EA"/>
      <text x="145" y="22" font-size="7.5" fill="#475569">Deterministic O(1) Tokens</text>
      <text x="490" y="22" text-anchor="middle" font-size="7.5" fill="#475569">Predictable Workload Bounds</text>
      <text x="840" y="22" text-anchor="end" font-size="7.5" fill="#7E22CE">Heavy-Tailed Dynamic Variance</text>
    </g>
  </g>
</svg>
