concept_map:
  schema_version: 2
  source: 05_kv_cache.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - KV footprint and resident fit
    - Paged KV allocation
    - Copy-on-write block sharing
    - Radix prefix cache
    - Reusable is not applicable
    - Paused-state policy
    - Residency tax
    - Lossy KV approximation
  secondary_concepts:
    - Chunked prefill
    - Little's law
  claims:
    KV footprint and resident fit: Retained attention state costs 2 x layers x KV heads x head dim x bytes per token,
      so resident fit in the KV pool falls as 1/S with context length, and the attention design fixed at pretraining
      sets the slope.
    Paged KV allocation: Fixed-size blocks mapped by a per-sequence block table remove the stranded memory of full-cap
      reservation and bound tail waste below one block.
    Copy-on-write block sharing: Forked candidates share prefix blocks by reference count, so a fork costs block-table
      entries rather than a payload copy and physical demand is the count of unique blocks.
    Radix prefix cache: A content-keyed radix tree finds the longest retained common prefix, leaf-first eviction
      keeps residency prefix-closed, and efficacy is the token-weighted hit rate after availability, permission,
      and block rounding.
    Reusable is not applicable: A reusable prefix must be compatible, available, and permitted, and none of the
      three says whether the evidence is current, so freshness is enforced by the harness rewriting the prompt.
    Paused-state policy: During a tool wait the engine keeps, moves, or drops only uniquely reclaimable blocks,
      and offloading pays only when the wait exceeds the transfer round trip and memory is contested.
    Residency tax: By Little's law a fixed pool of slots sustains a turn rate inversely proportional to residence,
      so holding state through a synchronous tool wait divides the memory-bound turn rate by 1 + T_tool/T_model.
    Lossy KV approximation: Token eviction, sliding windows, and KV quantization change the computation and must
      be validated against an agent's hard semantic dependencies, such as dormant constraints and exact identifiers,
      rather than perplexity.
    Chunked prefill: Splitting an uncached prompt into chunks under a per-iteration token budget bounds the inter-token
      gap of ongoing streams to one iteration at a modest delay to the new request's first token.
    Little's law: Mean occupancy equals arrival rate times mean residence (L = lambda W), a mean identity that sizes
      slot pools but says nothing about peaks.
