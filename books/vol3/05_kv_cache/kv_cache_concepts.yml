    relationships:
    - id: vol3.field.kv.working-context
      source: vol3.kv
      predicate: is derived from
      target: vol3.working-context
      explanation: Attention state is derived from the delivered token prefix, rather than being a semantic
        record that can be edited independently.
      conditions: Model and token-prefix compatibility are required; prompt partition and physical cache
        allocation remain distinct decisions.
      status: draft
      evidence:
        section: sec-vol3-kv-cache-prefix-compatibility
        quote: 'Attaching cached KV blocks from an earlier turn corrupts generation if a single upstream
          token, adapter weight, or positional encoding differs between the two calls. The reason is that,
          under causal full attention, every token''s keys and values depend on the exact token prefix and
          execution configuration that produced them (principle \ref{pri-vol3-prefix-coherence}). Matching
          token identifiers from the first position of the sequence is only the first prerequisite. The
          cached KV tensors remain mathematically valid only when generated under identical execution parameters:
          the same base model weights, active low-rank adaptation (LoRA) adapters (lightweight fine-tuned
          weight adjustments), positional encodings, and attention masks. For multimodal requests containing
          images, audio, or structured embeddings, matching the synthetic placeholder tokens in the text
          prompt is insufficient; the underlying tensor inputs and projection parameters must match exactly.
          A production serving engine must encode these operational dependencies directly into its cache
          keys or validate them before binding cached blocks to a request.'
    - id: vol3.field.prefix-reuse.kv
      source: vol3.prefix-reuse
      predicate: reuses compatible
      target: vol3.kv
      explanation: An unchanged compatible prefix permits retained attention computation to be reused.
      conditions: Exact token identity is insufficient when model configuration or permitted reuse differs.
      status: draft
      evidence:
        section: sec-vol3-kv-cache-prefix-compatibility
        quote: Even when a cached prefix is mathematically compatible, the engine still has to verify that
          its blocks are physically resident and permitted to the caller. Computationally compatible tensors
          may have already been evicted from accelerator high-bandwidth memory (HBM), or they may reside
          in host memory or on solid-state drives, requiring an explicit page-in transfer before the model
          can consume them. Conversely, tensors residing directly in local accelerator memory may belong
          to a different tenant or security domain, making them ineligible for sharing under isolation rules.
          The reusable prefix length is the longest contiguous token sequence that simultaneously satisfies
          compatibility, physical residency, and access permissions. That sequence is frequently shorter
          than the longest match found in the prefix tree. Furthermore, newly generated tokens qualify for
          subsequent prefix matching only after their corresponding KV blocks have been fully materialized
          in memory and committed to the index.
    - id: vol3.field.residency.kv
      source: vol3.residency
      predicate: governs retention of
      target: vol3.kv
      explanation: A waiting trajectory can retain attention state, offload it, or discard it for later
        recomputation.
      conditions: Compare transfer and prefill costs under memory pressure and uncertain return times.
      status: draft
      evidence:
        section: sec-vol3-kv-cache-keep-move-drop
        quote: 'For those uniquely reclaimable blocks, the serving engine has three choices while the tool
          runs: keep them on the accelerator at the cost of HBM capacity, move them to host memory at the
          cost of interconnect bandwidth, or drop them and rebuild the suffix through prefill when the tool
          returns. @Tbl-vol3-reclamation-policies compares how the three policies trade accelerator memory
          against restoration work.'
    - id: vol3.field.waiting.residency
      source: vol3.waiting
      predicate: can extend
      target: vol3.residency
      explanation: No model computation is needed during a wait even though retained attention state occupies
        scarce memory.
      conditions: Only retained state incurs this residence cost; dropping or moving it changes the trade-off.
      status: draft
      evidence:
        section: sec-vol3-kv-cache-keep-move-drop
        quote: Each policy targets a distinct operational regime. Retaining state on the accelerator is
          optimal when the memory pool has ample headroom and the agent anticipates an immediate return.
          Holding the blocks incurs zero marginal cost if no competing work requires memory, and it guarantees
          zero restoration latency when generation resumes. Under memory pressure, moving state to host
          DRAM releases accelerator capacity without discarding the completed prefill computation. Dropping
          state becomes the preferred choice when the probability of resumption is low, host DRAM is exhausted,
          or the context is short enough that recomputing prefill is faster than transferring the data across
          the bus. Whichever policy runs, the engine must enforce memory isolation boundaries so that retained,
          offloaded, or evicted blocks remain protected from unauthorized access by other tenants.
