<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .card-hdr { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .card-sub { font-family: ui-monospace, monospace; font-size: 9.5px; fill: #64748b; }
      .tier-title { font-size: 10.5px; font-weight: 700; }
      .tier-spec { font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 700; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 8.5px; }
      .mono-bold { font-family: ui-monospace, monospace; font-size: 9px; font-weight: 700; }
      .lbl-sub { font-size: 8px; fill: #64748b; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left Container Card: Multi-Tier Storage Topology -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="510" height="440" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="14" y="14" width="220" height="22" rx="3" fill="#ede9fe"/>
    <text x="22" y="29" class="card-hdr" fill="#6d28d9">PHYSICAL STORAGE HIERARCHY</text>
    <text x="496" y="29" class="card-sub" text-anchor="end">Hardware Memory Tiers</text>

    <!-- Tier 1: Accelerator HBM3e -->
    <g transform="translate(14, 48)">
      <rect width="482" height="84" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="12" y="18" class="tier-title" fill="#6d28d9">Tier 1: Accelerator HBM3e / SRAM</text>
      <text x="470" y="18" class="tier-spec" fill="#6d28d9" text-anchor="end">3.35–4.8 TB/s | 80–141 GB</text>

      <g transform="translate(12, 28)">
        <text x="0" y="11" font-size="8" font-weight="700" fill="#475569">ACTIVE RESIDENT PAGEDATTENTION FRAMES:</text>
        <g transform="translate(0, 16)">
          <rect x="0" y="0" width="60" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
          <text x="30" y="15" class="mono-bold" fill="#1d4ed8" text-anchor="middle">Blk 001</text>

          <rect x="66" y="0" width="60" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
          <text x="96" y="15" class="mono-bold" fill="#1d4ed8" text-anchor="middle">Blk 002</text>

          <rect x="132" y="0" width="60" height="24" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
          <text x="162" y="15" class="mono-bold" fill="#1d4ed8" text-anchor="middle">Blk 003</text>

          <rect x="198" y="0" width="55" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="225" y="15" class="mono-txt" fill="#64748b" text-anchor="middle">Free</text>

          <rect x="259" y="0" width="55" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="286" y="15" class="mono-txt" fill="#64748b" text-anchor="middle">Free</text>

          <text x="328" y="15" class="mono-txt" fill="#64748b">... [4,096 frames]</text>
        </g>
      </g>
    </g>

    <!-- Interconnect 1: PCIe Gen5 x16 Bus -->
    <g transform="translate(14, 140)">
      <rect width="482" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="21" font-size="8.5" font-weight="700" fill="#334155">PCIe Gen5 x16 / CXL 3.0 (64 GB/s)</text>

      <path d="M 230 6 V 26" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
      <text x="236" y="18" class="mono-bold" fill="#b45309">Swap-Out (164 ms)</text>

      <path d="M 370 26 V 6" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>
      <text x="376" y="18" class="mono-bold" fill="#0f766e">Prefetch-In (Async)</text>
    </g>

    <!-- Tier 2: Host System DRAM -->
    <g transform="translate(14, 182)">
      <rect width="482" height="84" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <text x="12" y="18" class="tier-title" fill="#0f766e">Tier 2: Host System DRAM (Pinned Kernel Buffers)</text>
      <text x="470" y="18" class="tier-spec" fill="#0f766e" text-anchor="end">64 GB/s bus | 512 GB–2 TB</text>

      <g transform="translate(12, 28)">
        <text x="0" y="11" font-size="8" font-weight="700" fill="#475569">PAGED SWAP POOL (SUSPENDED TOOL-WAIT SESSIONS):</text>
        <g transform="translate(0, 16)">
          <rect x="0" y="0" width="85" height="24" rx="2" fill="#f0fdf4" stroke="#0f766e"/>
          <text x="42" y="15" class="mono-txt" fill="#0f766e" text-anchor="middle">Agent 1 (Wait)</text>

          <rect x="92" y="0" width="85" height="24" rx="2" fill="#f0fdf4" stroke="#0f766e"/>
          <text x="134" y="15" class="mono-txt" fill="#0f766e" text-anchor="middle">Agent 2 (Wait)</text>

          <rect x="184" y="0" width="85" height="24" rx="2" fill="#f0fdf4" stroke="#0f766e"/>
          <text x="226" y="15" class="mono-txt" fill="#0f766e" text-anchor="middle">Agent 3 (Wait)</text>

          <text x="280" y="15" class="mono-txt" fill="#64748b">... [64k frames buffered]</text>
        </g>
      </g>
    </g>

    <!-- Interconnect 2: NVMe Controller -->
    <g transform="translate(14, 274)">
      <rect width="482" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="21" font-size="8.5" font-weight="700" fill="#334155">PCIe Gen5 NVMe Controller (8–14 GB/s)</text>

      <path d="M 230 6 V 26" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <text x="236" y="18" class="mono-txt" fill="#475569">Flush Dormant Session</text>

      <path d="M 370 26 V 6" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <text x="376" y="18" class="mono-txt" fill="#475569">Restore Session</text>
    </g>

    <!-- Tier 3: Local NVMe SSD / Disaggregated Memory -->
    <g transform="translate(14, 316)">
      <rect width="482" height="106" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
      <text x="12" y="18" class="tier-title" fill="#334155">Tier 3: Local NVMe SSD / Disaggregated Store</text>
      <text x="470" y="18" class="tier-spec" fill="#334155" text-anchor="end">7–14 GB/s | 4–30 TB</text>

      <g transform="translate(12, 30)" font-size="8.5" fill="#475569">
        <text x="0" y="12">Dormant checkpoints · multi-day logs</text>
        <text x="0" y="28">Evict at τ_dram = 0.90</text>
        <text x="0" y="44">KV retained across review pauses</text>
        <text x="0" y="60">Zero accelerator HBM footprint during multi-minute background tasks.</text>
      </g>
    </g>
  </g>

  <!-- Right Container Card: Extended Page Table & Latency Overlap Timeline -->
  <g transform="translate(550, 20)">
    <rect x="0" y="0" width="510" height="440" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="14" y="14" width="240" height="22" rx="3" fill="#e0f2fe"/>
    <text x="22" y="29" class="card-hdr" fill="#0369a1">EXTENDED BLOCK TABLE &amp; TIMELINE</text>
    <text x="496" y="29" class="card-sub" text-anchor="end">Residency &amp; Prefetch</text>

    <!-- Extended Block Table -->
    <g transform="translate(14, 48)">
      <rect width="482" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Dual-Residency Block Table Entries</text>

      <g transform="translate(12, 28)">
        <!-- Table Header -->
        <rect width="458" height="20" rx="2" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8.5" font-weight="700" fill="#475569">LOGICAL BLOCK</text>
        <text x="130" y="14" font-size="8.5" font-weight="700" fill="#475569">PHYSICAL FRAME</text>
        <text x="260" y="14" font-size="8.5" font-weight="700" fill="#475569">RESIDENCY</text>
        <text x="375" y="14" font-size="8.5" font-weight="700" fill="#475569">STATUS</text>

        <!-- Entry 1 -->
        <text x="10" y="38" class="mono-txt" fill="#334155">Block #0001</text>
        <text x="130" y="38" class="mono-bold" fill="#7c3aed">GPU_Frame 0x1A</text>
        <text x="260" y="38" font-size="8.5" fill="#334155">Tier 1 (HBM)</text>
        <text x="375" y="38" class="mono-bold" fill="#15803d">ACTIVE_DECODE</text>

        <!-- Entry 2 -->
        <text x="10" y="60" class="mono-txt" fill="#334155">Block #0002</text>
        <text x="130" y="60" class="mono-bold" fill="#0f766e">Host_Buf 0x88F</text>
        <text x="260" y="60" font-size="8.5" fill="#334155">Tier 2 (DRAM)</text>
        <text x="375" y="60" class="mono-bold" fill="#b45309">TOOL_WAIT (SWAP)</text>

        <!-- Entry 3 -->
        <text x="10" y="82" class="mono-txt" fill="#334155">Block #0003</text>
        <text x="130" y="82" class="mono-bold" fill="#7c3aed">GPU_Frame 0x3C</text>
        <text x="260" y="82" font-size="8.5" fill="#334155">Tier 1 (HBM)</text>
        <text x="375" y="82" class="mono-bold" fill="#0284c7">PREFETCH_DMA</text>

        <!-- Entry 4 -->
        <text x="10" y="104" class="mono-txt" fill="#334155">Block #0004</text>
        <text x="130" y="104" class="mono-bold" fill="#475569">NVMe_Sec 0x410</text>
        <text x="260" y="104" font-size="8.5" fill="#334155">Tier 3 (NVMe)</text>
        <text x="375" y="104" class="mono-bold" fill="#64748b">COLD_STORE</text>
      </g>
    </g>

    <!-- Latency Overlap Timeline Diagram -->
    <g transform="translate(14, 212)">
      <rect width="482" height="210" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Asynchronous Prefetch Latency Overlap</text>

      <!-- Tool Execution Timeline -->
      <g transform="translate(12, 34)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#334155">External Tool Execution Window (T_tool = 5,000 ms):</text>
        <rect x="0" y="18" width="458" height="30" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="229" y="37" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Blocking External Tool Execution (pytest unit tests)</text>
      </g>

      <!-- DMA Overlap Datapath -->
      <g transform="translate(12, 94)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#334155">Asynchronous PCIe DMA Operations (T_swap = 164 ms):</text>
        
        <!-- Swap-out block -->
        <rect x="0" y="18" width="55" height="32" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="27" y="32" class="mono-bold" fill="#b45309" text-anchor="middle">Swap</text>
        <text x="27" y="44" font-size="7.5" fill="#92400e" text-anchor="middle">164 ms</text>

        <!-- Overlapped Free HBM Interval -->
        <line x1="60" y1="34" x2="398" y2="34" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
        <rect x="110" y="24" width="240" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="230" y="38" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">HBM Allocated to Concurrent Requests (4,672 ms)</text>

        <!-- Prefetch-in block -->
        <rect x="403" y="18" width="55" height="32" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
        <text x="430" y="32" class="mono-bold" fill="#0f766e" text-anchor="middle">Fetch</text>
        <text x="430" y="44" font-size="7.5" fill="#0f766e" text-anchor="middle">164 ms</text>
      </g>

      <text x="12" y="178" font-size="8.5" fill="#475569">Formula: T_swap = M_KV / B_PCIe = 10.49 GB / (64 GB/s) = 164 ms.</text>
      <text x="12" y="194" font-size="8.5" font-weight="700" fill="#15803d">Because T_tool &gt;&gt; T_swap, 100% of transfer latency is hidden behind tool execution.</text>
    </g>
  </g>
</svg>
