<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="680" height="320" fill="#ffffff"/>

  <!-- Outer boundary card -->
  <rect x="10" y="10" width="660" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Regime regions (plot area x 90..610, y 40..260) -->
  <!-- Retain: left of the round-trip line -->
  <polygon points="90,40 266.5,40 123.2,260 90,260" fill="#dcfce7" stroke="none"/>
  <!-- Offload: between round-trip line and host-memory pressure boundary -->
  <polygon points="266.5,40 468.9,40 468.9,260 123.2,260" fill="#f3e8ff" stroke="none"/>
  <!-- Park or drop: long waits -->
  <rect x="468.9" y="40" width="141.1" height="220" fill="#f1f5f9" stroke="none"/>

  <!-- Round-trip boundary (slanted: grows with context length) -->
  <line x1="123.2" y1="260" x2="266.5" y2="40" stroke="#16a34a" stroke-width="1.6"/>
  <!-- Host-memory pressure boundary (dashed) -->
  <line x1="468.9" y1="40" x2="468.9" y2="260" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Axes -->
  <line x1="90" y1="260" x2="90" y2="30" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-axis)"/>
  <line x1="90" y1="260" x2="625" y2="260" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-axis)"/>

  <!-- X ticks -->
  <g font-size="8.5" fill="#475569" text-anchor="middle">
    <line x1="90" y1="260" x2="90" y2="264" stroke="#334155"/><text x="90" y="275">1 ms</text>
    <line x1="169.3" y1="260" x2="169.3" y2="264" stroke="#334155"/><text x="169.3" y="275">10 ms</text>
    <line x1="248.6" y1="260" x2="248.6" y2="264" stroke="#334155"/><text x="248.6" y="275">100 ms</text>
    <line x1="327.9" y1="260" x2="327.9" y2="264" stroke="#334155"/><text x="327.9" y="275">1 s</text>
    <line x1="407.2" y1="260" x2="407.2" y2="264" stroke="#334155"/><text x="407.2" y="275">10 s</text>
    <line x1="468.9" y1="260" x2="468.9" y2="264" stroke="#334155"/><text x="468.9" y="275">1 min</text>
    <line x1="548.2" y1="260" x2="548.2" y2="264" stroke="#334155"/><text x="548.2" y="275">10 min</text>
    <line x1="610" y1="260" x2="610" y2="264" stroke="#334155"/><text x="610" y="275">1 h</text>
  </g>
  <text x="350" y="296" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Expected tool wait (log scale)</text>

  <!-- Y ticks -->
  <g font-size="8.5" fill="#475569" text-anchor="end">
    <line x1="86" y1="260" x2="90" y2="260" stroke="#334155"/><text x="82" y="263">2,048</text>
    <line x1="86" y1="186.7" x2="90" y2="186.7" stroke="#334155"/><text x="82" y="189.7">8,192</text>
    <line x1="86" y1="113.3" x2="90" y2="113.3" stroke="#334155"/><text x="82" y="116.3">32,768</text>
    <line x1="86" y1="40" x2="90" y2="40" stroke="#334155"/><text x="82" y="43">131,072</text>
  </g>
  <text x="30" y="150" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90, 30, 150)">Context length (tokens, log scale)</text>

  <!-- Region labels -->
  <text x="140" y="62" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">RETAIN</text>
  <text x="140" y="75" font-size="8" fill="#166534" text-anchor="middle">wait shorter than</text>
  <text x="140" y="86" font-size="8" fill="#166534" text-anchor="middle">the reload round trip</text>

  <text x="372" y="62" font-size="9.5" font-weight="700" fill="#6d28d9" text-anchor="middle">OFFLOAD TO HOST MEMORY</text>
  <text x="372" y="75" font-size="8" fill="#5b21b6" text-anchor="middle">wait exceeds the round trip; reload beats recompute</text>
  <text x="372" y="86" font-size="8" fill="#5b21b6" text-anchor="middle">prefetch before the tool returns hides reload</text>

  <text x="539" y="62" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">PARK OR DROP</text>
  <text x="539" y="75" font-size="8" fill="#475569" text-anchor="middle">human approvals, long jobs</text>
  <text x="539" y="86" font-size="8" fill="#475569" text-anchor="middle">flash tier, or recompute</text>
  <text x="539" y="97" font-size="8" fill="#475569" text-anchor="middle">on resume</text>

  <!-- Boundary annotations -->
  <text x="206" y="200" font-size="8" fill="#15803d" text-anchor="start">round trip = 2 · M_KV / B_link</text>
  <text x="206" y="211" font-size="8" fill="#15803d" text-anchor="start">(grows with context length)</text>
  <text x="464" y="236" font-size="8" fill="#6d28d9" text-anchor="end">host memory pressure</text>
  <text x="464" y="247" font-size="8" fill="#6d28d9" text-anchor="end">sets this boundary</text>

  <!-- Worked scenario marker: 32,768-token trajectory, 45 s test run -->
  <circle cx="459" cy="113.3" r="4" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <line x1="455" y1="116" x2="425" y2="140" stroke="#b45309" stroke-width="0.9"/>
  <text x="422" y="150" font-size="8" font-weight="700" fill="#b45309" text-anchor="end">worked example:</text>
  <text x="422" y="161" font-size="8" fill="#b45309" text-anchor="end">32,768 tokens, 45 s test run</text>

</svg>
