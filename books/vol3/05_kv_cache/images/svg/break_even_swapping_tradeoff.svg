      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#ffffff"/>
  <!-- ===== Regimes ===== -->
  <polygon points="110,30 293.2,30 144.5,270 110,270" fill="#dcfce7"/>
