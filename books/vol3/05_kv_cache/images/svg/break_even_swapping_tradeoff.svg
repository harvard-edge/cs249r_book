  <line x1="503.5" y1="30" x2="503.5" y2="270" stroke="#334155" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- ===== Axes ===== -->
  <path d="M110,270 V18" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-axis)"/>
  <path d="M110,270 H664" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-axis)"/>
  <line x1="110.0" y1="270" x2="110.0" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="110.0" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 ms</text>
  <line x1="192.4" y1="270" x2="192.4" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="192.4" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">10 ms</text>
  <line x1="274.7" y1="270" x2="274.7" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="274.7" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">100 ms</text>
  <line x1="357.1" y1="270" x2="357.1" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="357.1" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 s</text>
  <line x1="439.5" y1="270" x2="439.5" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="439.5" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">10 s</text>
  <line x1="503.5" y1="270" x2="503.5" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="503.5" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 min</text>
  <line x1="585.9" y1="270" x2="585.9" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="585.9" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">10 min</text>
  <line x1="650.0" y1="270" x2="650.0" y2="274" stroke="#334155" stroke-width="1.0"/>
  <text x="650.0" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 h</text>
  <text x="380.0" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Expected tool wait (log scale)</text>
  <line x1="106" y1="270.0" x2="110" y2="270.0" stroke="#334155" stroke-width="1.0"/>
  <text x="102" y="274.0" text-anchor="end" font-size="12" font-weight="400" fill="#475569">2,048</text>
  <line x1="106" y1="190.0" x2="110" y2="190.0" stroke="#334155" stroke-width="1.0"/>
  <text x="102" y="194.0" text-anchor="end" font-size="12" font-weight="400" fill="#475569">8,192</text>
  <line x1="106" y1="110.0" x2="110" y2="110.0" stroke="#334155" stroke-width="1.0"/>
  <text x="102" y="114.0" text-anchor="end" font-size="12" font-weight="400" fill="#475569">32,768</text>
  <line x1="106" y1="30.0" x2="110" y2="30.0" stroke="#334155" stroke-width="1.0"/>
  <text x="102" y="34.0" text-anchor="end" font-size="12" font-weight="400" fill="#475569">131,072</text>
  <text x="24" y="150.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform="rotate(-90, 24, 150.0)">Context length (tokens, log scale)</text>
  <!-- ===== Region labels ===== -->
  <text x="170" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Retain</text>
  <text x="170" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#15803d">wait &lt; round trip</text>
  <text x="408.35" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Offload to host memory</text>
  <text x="408.35" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#6d28d9">wait &gt; round trip</text>
  <text x="576.75" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Park or drop</text>
  <text x="576.75" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">flash or recompute</text>
  <!-- ===== Boundary labels ===== -->
  <text x="186.24" y="222" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">round trip = 2 · <tspan font-style="italic">M</tspan><tspan baseline-shift="sub" font-size="11.5">KV</tspan> / BW<tspan baseline-shift="sub" font-size="11.5">link</tspan></text>
  <text x="495.5" y="260" text-anchor="end" font-size="12" font-weight="400" fill="#0f172a">host-memory pressure</text>
  <!-- ===== Worked example: 32,768 tokens, 45 s test ===== -->
  <line x1="243.6" y1="110.0" x2="487.3" y2="110.0" stroke="#0f172a" stroke-width="1.0" stroke-dasharray="2,3"/>
  <circle cx="243.6" cy="110.0" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <path d="M488.3,114.0 L463.3,134.0" fill="none" stroke="#0f172a" stroke-width="0.9"/>
  <circle cx="493.3" cy="110.0" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
  <text x="459.3" y="142.0" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">worked example</text>
  <text x="459.3" y="158.0" text-anchor="end" font-size="12" font-weight="400" fill="#0f172a">32,768 tokens, 45 s</text>
