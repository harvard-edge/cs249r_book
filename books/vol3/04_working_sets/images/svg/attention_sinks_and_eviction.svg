<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Base Canvas -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: DENSE UNBOUNDED KV CACHE (ANTI-PATTERN / UNBOUNDED)     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="350" height="445" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">DENSE UNBOUNDED KV CACHE (Full Attention)</text>

    <!-- Visual Token Sequence -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="320" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Memory Allocation across Length N</text>
      <text x="10" y="25" font-size="8.0" fill="#64748b">Unbounded linear retention of all key-value state in HBM</text>

      <!-- Continuous Block of Retained Tokens -->
      <rect x="10" y="34" width="300" height="34" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="160" y="55" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">All Tokens Retained in HBM (0 to N)</text>

      <!-- Scale indicators -->
      <text x="10" y="82" font-size="8.0" fill="#64748b">t=0 (Prompt Anchor)</text>
      <text x="310" y="82" font-size="8.0" fill="#64748b" text-anchor="end">t=N (Current Decode)</text>
    </g>

    <!-- Characteristics Breakdown -->
    <g transform="translate(15, 136)">
      <rect x="0" y="0" width="320" height="236" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Sub-block 1: Footprint -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="300" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Footprint: O(N) Unbounded</text>
        <text x="10" y="28" font-size="8.0" font-family="Courier, monospace" font-weight="700" fill="#0f172a">2 · b · L · h_kv · d_head · N bytes</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Linear growth across turns; a 128k context stream requires</text>
        <text x="10" y="54" font-size="8.0" fill="#64748b">up to 42.9 GB HBM per stream in 70B models.</text>
      </g>

      <!-- Sub-block 2: Decode Intensity -->
      <g transform="translate(10, 82)">
        <rect x="0" y="0" width="300" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Decode Intensity: Memory-Bound</text>
        <text x="10" y="28" font-size="8.0" font-weight="700" fill="#0f172a">Operational Intensity &lt; 0.5 FLOP/Byte</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Single-token autoregression reads entire KV cache from HBM;</text>
        <text x="10" y="54" font-size="8.0" fill="#64748b">generation rate is severely throttled by memory bandwidth.</text>
      </g>

      <!-- Sub-block 3: Failure Mode -->
      <g transform="translate(10, 154)">
        <rect x="0" y="0" width="300" height="72" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Failure Mode: OOM Crash &amp; Prefill Thrash</text>
        <text x="10" y="28" font-size="8.0" font-weight="700" fill="#b91c1c">Physical Capacity Exhaustion</text>
        <text x="10" y="42" font-size="8.0" fill="#7f1d1d">Context exceeds physical accelerator HBM capacity;</text>
        <text x="10" y="54" font-size="8.0" fill="#7f1d1d">prefill compute latency scales quadratically O(N²),</text>
        <text x="10" y="66" font-size="8.0" fill="#7f1d1d">triggering catastrophic time-to-first-token surges.</text>
      </g>
    </g>

    <!-- Bottom Badge Card -->
    <g transform="translate(15, 382)">
      <rect x="0" y="0" width="320" height="50" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="160" y="20" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">CRITICAL BOTTLENECK: UNMANAGED TRAJECTORY</text>
      <text x="160" y="35" font-size="8.0" fill="#7f1d1d" text-anchor="middle">Unscalable for multi-turn autonomous agent loops</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: STREAMINGLLM (ATTENTION SINKS + SLIDING WINDOW)         -->
  <!-- ================================================================= -->
  <g transform="translate(425, 75)">
    <rect x="0" y="0" width="350" height="445" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">STREAMINGLLM (Attention Sinks + Window)</text>

    <!-- Visual Token Sequence -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="320" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Sinks + Rolling Sliding Window</text>
      <text x="10" y="25" font-size="8.0" fill="#64748b">Preserves initial sink tokens; evicts middle; retains recent window</text>

      <!-- Sinks -->
      <rect x="10" y="34" width="55" height="34" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="37" y="49" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Sinks</text>
      <text x="37" y="60" font-size="8.0" fill="#7c3aed" text-anchor="middle">(S ≈ 4)</text>

      <!-- Evicted Gap -->
      <rect x="73" y="34" width="95" height="34" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="120" y="49" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Evicted Tokens</text>
      <text x="120" y="60" font-size="8.0" fill="#94a3b8" text-anchor="middle">(Pruned mid-flight)</text>

      <!-- Rolling Window -->
      <rect x="176" y="34" width="134" height="34" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="243" y="49" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Sliding Window</text>
      <text x="243" y="60" font-size="8.0" fill="#16a34a" text-anchor="middle">Recent W=1024 tokens</text>

      <!-- Scale indicators -->
      <text x="10" y="82" font-size="8.0" fill="#64748b">t=0 (Sinks)</text>
      <text x="310" y="82" font-size="8.0" fill="#64748b" text-anchor="end">t=N (Current)</text>
    </g>

    <!-- Characteristics Breakdown -->
    <g transform="translate(15, 136)">
      <rect x="0" y="0" width="320" height="236" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Sub-block 1: Footprint -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="300" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">Footprint: O(S + W) Bounded</text>
        <text x="10" y="28" font-size="8.0" font-family="Courier, monospace" font-weight="700" fill="#0f172a">Fixed Capacity = 2 · b · L · h_kv · d · (S+W)</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Memory consumption remains strictly constant even across</text>
        <text x="10" y="54" font-size="8.0" fill="#64748b">millions of generated tokens; zero OOM risk.</text>
      </g>

      <!-- Sub-block 2: Sink Phenomenon -->
      <g transform="translate(10, 82)">
        <rect x="0" y="0" width="300" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">Sink Phenomenon: Stable Softmax</text>
        <text x="10" y="28" font-size="8.0" font-weight="700" fill="#15803d">Perplexity Stabilization</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Initial tokens absorb massive unnormalized softmax mass;</text>
        <text x="10" y="54" font-size="8.0" fill="#64748b">retaining just 4 sink tokens prevents perplexity explosion.</text>
      </g>

      <!-- Sub-block 3: Limitation -->
      <g transform="translate(10, 154)">
        <rect x="0" y="0" width="300" height="72" rx="1" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#b45309">Primary Limitation: Middle Amnesia</text>
        <text x="10" y="28" font-size="8.0" font-weight="700" fill="#92400E">Loss of Intermediate Execution History</text>
        <text x="10" y="42" font-size="8.0" fill="#78350f">Discards prior turn observations, file schemas, and tool results;</text>
        <text x="10" y="54" font-size="8.0" fill="#78350f">agent loses awareness of intermediate reasoning states</text>
        <text x="10" y="66" font-size="8.0" fill="#78350f">unless supplemented by external episodic storage.</text>
      </g>
    </g>

    <!-- Bottom Badge Card -->
    <g transform="translate(15, 382)">
      <rect x="0" y="0" width="320" height="50" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="160" y="20" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">STREAMING SPECIALIST: BOUNDED STREAMING</text>
      <text x="160" y="35" font-size="8.0" fill="#5b21b6" text-anchor="middle">Ideal for infinite conversational loops; prone to amnesia</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: H2O / HEAVY-HITTER ORACLE (SPARSE ATTENTION)            -->
  <!-- ================================================================= -->
  <g transform="translate(810, 75)">
    <rect x="0" y="0" width="350" height="445" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">H2O (Heavy-Hitter Oracle) / FastGen</text>

    <!-- Visual Token Sequence -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="320" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Sinks + Sparse Heavy Hitters + Window</text>
      <text x="10" y="25" font-size="8.0" fill="#64748b">Dynamic retention of top cumulative attention mass tokens</text>

      <!-- Sinks -->
      <rect x="10" y="34" width="45" height="34" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="32" y="55" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">Sinks</text>

      <!-- Sparse H2 tokens in middle -->
      <g transform="translate(62, 34)">
        <rect x="0" y="0" width="118" height="34" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="8" y="5" width="28" height="24" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="22" y="20" font-size="8.0" font-weight="700" fill="#b45309" text-anchor="middle">H₁</text>

        <rect x="44" y="5" width="28" height="24" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="58" y="20" font-size="8.0" font-weight="700" fill="#b45309" text-anchor="middle">H₂</text>

        <rect x="80" y="5" width="28" height="24" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="94" y="20" font-size="8.0" font-weight="700" fill="#b45309" text-anchor="middle">H₃</text>
      </g>

      <!-- Window -->
      <rect x="186" y="34" width="124" height="34" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="248" y="49" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Sliding Window</text>
      <text x="248" y="60" font-size="8.0" fill="#16a34a" text-anchor="middle">Recent tokens</text>

      <!-- Scale indicators -->
      <text x="10" y="82" font-size="8.0" fill="#64748b">t=0 (Sinks)</text>
      <text x="310" y="82" font-size="8.0" fill="#64748b" text-anchor="end">t=N (Current)</text>
    </g>

    <!-- Characteristics Breakdown -->
    <g transform="translate(15, 136)">
      <rect x="0" y="0" width="320" height="236" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Sub-block 1: Footprint -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="300" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">Footprint: O(S + H + W) Bounded</text>
        <text x="10" y="28" font-size="8.0" font-family="Courier, monospace" font-weight="700" fill="#0f172a">Retains ~20% of KV Cache with &gt;99% Accuracy</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Saves 4x to 5x physical HBM footprint while maintaining</text>
        <text x="10" y="54" font-size="8.0" fill="#64748b">full generation quality across long-horizon agent reasoning.</text>
      </g>

      <!-- Sub-block 2: Heavy Hitter Metric -->
      <g transform="translate(10, 82)">
        <rect x="0" y="0" width="300" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">Heavy Hitter Metric: Dynamic Tracking</text>
        <text x="10" y="28" font-size="8.0" font-family="Courier, monospace" font-weight="700" fill="#0f172a">Cumulative Score: s_i = Σ_t α_ti</text>
        <text x="10" y="42" font-size="8.0" fill="#64748b">Maintains running score per token; dynamically preserves</text>
        <text x="10" y="54" font-size="8.0" fill="#64748b">critical AST symbols, code identifiers, and prompt constraints.</text>
      </g>

      <!-- Sub-block 3: Agent Advantage -->
      <g transform="translate(10, 154)">
        <rect x="0" y="0" width="300" height="72" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">Agent Advantage: High State Fidelity</text>
        <text x="10" y="28" font-size="8.0" font-weight="700" fill="#14532d">Prunes Noise while Grounding Key Decisions</text>
        <text x="10" y="42" font-size="8.0" fill="#14532d">Allows 4x higher serving concurrency on existing GPUs;</text>
        <text x="10" y="54" font-size="8.0" fill="#14532d">mitigates "Lost-in-the-Middle" amnesia by locking</text>
        <text x="10" y="66" font-size="8.0" fill="#14532d">high-attention middle tokens directly into memory.</text>
      </g>
    </g>

    <!-- Bottom Badge Card -->
    <g transform="translate(15, 382)">
      <rect x="0" y="0" width="320" height="50" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="160" y="20" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">PRODUCTION OPTIMAL: GROUNDED COMPRESSION</text>
      <text x="160" y="35" font-size="8.0" fill="#14532d" text-anchor="middle">Optimal for complex multi-turn reasoning and agent workflows</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 538)">
    <rect x="0" y="0" width="1120" height="98" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">ARCHITECTURAL SYNTHESIS: ATTENTION SINKS &amp; HEAVY-HITTER RETENTION</text>

    <!-- Inner Callout Card -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="130" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="22" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">SYSTEMS</text>
      <text x="65" y="36" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PRINCIPLE</text>
    </g>

    <g transform="translate(160, 36)">
      <text x="0" y="14" font-size="9" font-weight="700" fill="#0f172a">Attention Sinks Prevent Perplexity Catastrophe; Heavy Hitters Retain Semantic Grounding</text>
      <text x="0" y="30" font-size="8" fill="#475569">Standard window attention collapses because transformers allocate massive unnormalized attention mass to initial token 0 (the sink).</text>
      <text x="0" y="44" font-size="8" fill="#475569">Combining sink preservation with dynamic heavy-hitter retention (H2O) delivers 4x–5x KV memory reduction without losing critical state.</text>
    </g>
  </g>
</g>
</svg>