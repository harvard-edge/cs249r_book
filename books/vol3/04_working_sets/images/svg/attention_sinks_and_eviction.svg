<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    
  </defs>

  <!-- Background -->
  <rect width="1200" height="670" rx="0" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Header -->
  <!-- Textbook Header Bar -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="1110" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="15" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e293b">DYNAMIC KV CACHE SPARSIFICATION &amp; EVICTION TOPOLOGIES</text>
  </g>

  <!-- 3 Comparison Columns -->
  <!-- Column 1: Dense Full Attention -->
  <g transform="translate(45, 115)">
    <rect width="350" height="425" rx="2" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#FFF1F2"/>
    <path d="M0 28 L0 42 L350 42 L350 28 Z" fill="#FFF1F2"/>
    <text x="175" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">Dense Unbounded KV Cache</text>

    <!-- Visual Token Sequence -->
    <g transform="translate(20, 56)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Memory Allocation across Length N:</text>
      
      <!-- Continuous Block of Retained Tokens -->
      <rect x="0" y="24" width="310" height="42" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1.2"/>
      <text x="155" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">All Tokens Retained in HBM (0 to N)</text>
      
      <!-- Scale indicator -->
      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">t=0 (Prompt)</text>
      <text x="310" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">t=N (Current)</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="310" height="195" rx="2" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239">• Footprint:</text>
        <text x="75" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">O(N) Unbounded</text>
        <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">2 · b · L · h_kv · d_head · N bytes</text>

        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239">• Decode Intensity:</text>
        <text x="110" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Memory-Bound</text>
        <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Arithmetic intensity drops below 0.5 FLOP/B;</text>
        <text x="0" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">memory bandwidth throttles generation rate.</text>

        <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239">• Failure Mode:</text>
        <text x="85" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#E11D48">OOM Crash / Thrash</text>
        <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Context exceeds physical HBM capacity;</text>
        <text x="0" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">prefill latency scales quadratically O(N²).</text>
      </g>
    </g>

    <!-- Bottom Badge -->
    <g transform="translate(20, 368)">
      <rect x="0" y="0" width="310" height="38" rx="2" fill="#FEE2E2"/>
      <text x="155" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239" text-anchor="middle">Unscalable for multi-step agents</text>
    </g>
  </g>

  <!-- Column 2: StreamingLLM Attention Sinks -->
  <g transform="translate(425, 115)">
    <rect width="350" height="425" rx="2" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#F5F3FF"/>
    <path d="M0 28 L0 42 L350 42 L350 28 Z" fill="#F5F3FF"/>
    <text x="175" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#581C87" text-anchor="middle">StreamingLLM (Attention Sinks)</text>

    <!-- Visual Token Sequence -->
    <g transform="translate(20, 56)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Sinks + Rolling Sliding Window:</text>
      
      <!-- Sinks -->
      <rect x="0" y="24" width="55" height="42" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="27" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#581C87" text-anchor="middle">Sinks</text>
      <text x="27" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B21A8" text-anchor="middle">(S ≈ 4)</text>

      <!-- Evicted Gap -->
      <rect x="63" y="24" width="105" height="42" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="115" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">Evicted Tokens</text>
      <text x="115" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">(Pruned mid-flight)</text>

      <!-- Rolling Window -->
      <rect x="176" y="24" width="134" height="42" rx="2" fill="#DCFCE7" stroke="#10B981" stroke-width="1.2"/>
      <text x="243" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Sliding Window</text>
      <text x="243" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857" text-anchor="middle">Recent W=1024 tokens</text>

      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">t=0</text>
      <text x="310" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">t=N</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="310" height="195" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87">• Footprint:</text>
        <text x="75" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">O(S + W) Bounded</text>
        <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Memory constant across infinite sequence stream.</text>

        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87">• Sink Phenomenon:</text>
        <text x="125" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">Stable Softmax</text>
        <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Initial tokens absorb unnormalized attention mass;</text>
        <text x="0" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">retaining S prevents perplexity explosion.</text>

        <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87">• Primary Limitation:</text>
        <text x="125" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D97706">Middle Amnesia</text>
        <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Discards prior turn observations and tool results;</text>
        <text x="0" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">requires external episodic store for recall.</text>
      </g>
    </g>

    <!-- Bottom Badge -->
    <g transform="translate(20, 368)">
      <rect x="0" y="0" width="310" height="38" rx="2" fill="#EDE9FE"/>
      <text x="155" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87" text-anchor="middle">Ideal for infinite streaming loops</text>
    </g>
  </g>

  <!-- Column 3: H2O / Heavy-Hitter Oracle -->
  <g transform="translate(805, 115)">
    <rect width="350" height="425" rx="2" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#F0FDF4"/>
    <path d="M0 28 L0 42 L350 42 L350 28 Z" fill="#F0FDF4"/>
    <text x="175" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">H2O (Heavy-Hitter Oracle) / FastGen</text>

    <!-- Visual Token Sequence -->
    <g transform="translate(20, 56)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Sinks + Sparse Heavy Hitters + Window:</text>
      
      <!-- Sinks -->
      <rect x="0" y="24" width="45" height="42" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="22" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">Sinks</text>

      <!-- Sparse H2 tokens in middle -->
      <g transform="translate(50, 24)">
        <rect x="0" y="0" width="130" height="42" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
        <rect x="12" y="6" width="22" height="30" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="23" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#B45309" text-anchor="middle">H₁</text>
        <rect x="52" y="6" width="22" height="30" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="63" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#B45309" text-anchor="middle">H₂</text>
        <rect x="94" y="6" width="22" height="30" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="105" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#B45309" text-anchor="middle">H₃</text>
      </g>

      <!-- Window -->
      <rect x="186" y="24" width="124" height="42" rx="2" fill="#DCFCE7" stroke="#10B981" stroke-width="1.2"/>
      <text x="248" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Sliding Window</text>
      <text x="248" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#047857" text-anchor="middle">Recent tokens</text>

      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">t=0</text>
      <text x="310" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">t=N</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="310" height="195" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065F46">• Footprint:</text>
        <text x="75" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">O(S + H + W) Bounded</text>
        <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Retains only ~20% of KV cache with negligible loss.</text>

        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065F46">• Heavy Hitter Metric:</text>
        <text x="135" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">Dynamic Tracking</text>
        <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Maintains running score s_i = Σ_t α_ti; dynamically</text>
        <text x="0" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">preserves symbols and critical variable definitions.</text>

        <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065F46">• Agent Advantage:</text>
        <text x="120" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">High State Fidelity</text>
        <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Saves 3x–5x HBM memory while maintaining</text>
        <text x="0" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">accurate long-range reasoning &amp; task resolution.</text>
      </g>
    </g>

    <!-- Bottom Badge -->
    <g transform="translate(20, 368)">
      <rect x="0" y="0" width="310" height="38" rx="2" fill="#DCFCE7"/>
      <text x="155" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">Optimal for complex multi-turn reasoning</text>
    </g>
  </g>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(45, 555)">
    <rect width="1110" height="85" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="18" y="18" width="90" height="48" rx="2" fill="#581C87"/>
    <text x="63" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARCHITECTURAL</text>
    <text x="63" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">TAKEAWAY</text>
    <text x="125" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Attention Sinks Prevent Perplexity Catastrophe; Heavy Hitters Retain Semantic Grounding</text>
    <text x="125" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Standard window attention collapses because transformers allocate massive unnormalized attention mass to initial token 0 (the sink).</text>
    <text x="125" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Combining sink preservation with dynamic heavy-hitter retention (H2O) delivers 4x KV memory reduction without losing critical state.</text>
  </g>
</svg>