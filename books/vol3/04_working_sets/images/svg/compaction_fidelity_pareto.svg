<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .axis-lbl { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .pt-title { font-size: 10px; font-weight: 700; }
      .pt-sub { font-size: 8.5px; fill: #475569; }
      .regime-title { font-size: 9.5px; font-weight: 700; }
      .regime-desc { font-size: 8.5px; }
    </style>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1080" height="430" rx="4" fill="#ffffff"/>

  <!-- Plot Card Boundary -->
  <rect x="24" y="16" width="1032" height="398" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Grid lines (Y scale: 0.0 at y=300, 1.0 at y=40, height=260px, 26px per 0.10) -->
  <g transform="translate(0, 0)">
    <line x1="110" y1="248" x2="1010" y2="248" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="110" y1="196" x2="1010" y2="196" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="110" y1="144" x2="1010" y2="144" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="110" y1="92" x2="1010" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Critical Fidelity Threshold Line (0.70 at y = 300 - 0.7*260 = 118) -->
    <line x1="110" y1="118" x2="1010" y2="118" stroke="#fca5a5" stroke-dasharray="4,4" stroke-width="1.2"/>
    <text x="1005" y="113" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" fill="#dc2626">Minimum Viable Task Fidelity (0.70)</text>
  </g>

  <!-- Pareto Frontier Curve passing through (180, 131) [0.65], (420, 53) [0.95], (710, 183) [0.45], (970, 248) [0.20] -->
  <path d="M 180 131 C 260 65, 340 50, 420 53 C 510 56, 620 135, 710 183 C 790 225, 890 242, 970 248" 
        fill="none" stroke="#2563eb" stroke-width="2.8" stroke-dasharray="5,4"/>

  <!-- Operating Point 1: Full Log (x=180, y=131) -->
  <circle cx="180" cy="131" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="110" y="145" width="165" height="52" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="120" y="162" class="pt-title" fill="#b45309">Full Log (1.0×)</text>
  <text x="120" y="176" class="pt-sub">Fidelity: ~65%</text>
  <text x="120" y="188" class="pt-sub">Stale-state accumulation &amp; bloat</text>

  <!-- Operating Point 2: Structured Checkpointing (x=420, y=53) -->
  <circle cx="420" cy="53" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="325" y="68" width="220" height="56" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="338" y="86" class="pt-title" fill="#047857">Structured Checkpoints (3.0×)</text>
  <text x="338" y="101" class="pt-sub" font-weight="600" fill="#065f46">Fidelity: ~95% (Pareto Optimal)</text>
  <text x="338" y="114" class="pt-sub">Preserves exact ASTs, diffs &amp; errors</text>

  <!-- Operating Point 3: Lossy Narrative Summary (x=710, y=183) -->
  <circle cx="710" cy="183" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <rect x="620" y="106" width="195" height="54" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <text x="632" y="123" class="pt-title" fill="#b91c1c">Lossy Summary (6.0×)</text>
  <text x="632" y="137" class="pt-sub">Fidelity: ~45% (Sub-threshold)</text>
  <text x="632" y="150" class="pt-sub">Constraint shedding (flags &amp; offsets lost)</text>

  <!-- Operating Point 4: Sliding Window (x=970, y=248) -->
  <circle cx="970" cy="248" r="6" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <rect x="855" y="186" width="165" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="867" y="203" class="pt-title" fill="#475569">Sliding Window (10.0×)</text>
  <text x="867" y="217" class="pt-sub">Fidelity: ~20%</text>
  <text x="867" y="229" class="pt-sub">Horizon truncation amnesia</text>

  <!-- Axes -->
  <path d="M 110 300 L 1025 300" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-axis)"/>
  <path d="M 110 300 L 110 32" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-axis)"/>

  <!-- Y-Axis Labels -->
  <text x="42" y="165" class="axis-lbl" transform="rotate(-90 42,165)" text-anchor="middle">Task Success Fidelity</text>
  <text x="100" y="303" class="tick-lbl" text-anchor="end">0.0</text>
  <text x="100" y="251" class="tick-lbl" text-anchor="end">0.2</text>
  <text x="100" y="199" class="tick-lbl" text-anchor="end">0.4</text>
  <text x="100" y="147" class="tick-lbl" text-anchor="end">0.6</text>
  <text x="100" y="95" class="tick-lbl" text-anchor="end">0.8</text>
  <text x="100" y="43" class="tick-lbl" text-anchor="end">1.0</text>

  <!-- X-Axis Labels -->
  <text x="560" y="342" class="axis-lbl" text-anchor="middle">Token Compression Ratio (C_r)</text>
  <text x="180" y="318" class="tick-lbl" text-anchor="middle">1.0×</text>
  <text x="420" y="318" class="tick-lbl" font-weight="700" fill="#047857" text-anchor="middle">3.0×</text>
  <text x="710" y="318" class="tick-lbl" text-anchor="middle">6.0×</text>
  <text x="970" y="318" class="tick-lbl" text-anchor="middle">10.0×</text>

  <!-- Operational Regime Telemetry Indicators (Lower Row) -->
  <g transform="translate(110, 355)">
    <!-- Syntactic Retention Zone -->
    <rect x="0" y="0" width="410" height="42" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <text x="12" y="17" class="regime-title" fill="#15803d">Syntactic Constraint Retention Zone [C_r ≤ 3.5×]</text>
    <text x="12" y="31" class="regime-desc" fill="#166534">Preserves paths · exit codes · diff hunks</text>

    <!-- Constraint Shedding Zone -->
    <rect x="430" y="0" width="470" height="42" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="12" y="17" class="regime-title" transform="translate(430,0)" fill="#991b1b">Constraint Shedding &amp; Regression Zone [C_r &gt; 5.0×]</text>
    <text x="12" y="31" class="regime-desc" transform="translate(430,0)" fill="#7f1d1d">Lossy narrative summarization sheds precise parameters, inducing stochastic guessing loops</text>
  </g>
</svg>