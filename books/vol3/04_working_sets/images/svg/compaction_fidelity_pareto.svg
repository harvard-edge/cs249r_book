<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .axis-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .point-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .point-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="1080" height="470" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">THE COMPACTION-FIDELITY PARETO FRONTIER IN CONTEXT MANAGEMENT</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">Trade-off Between Token Reduction and Structural Invariant Retention</text>

  <!-- Plot Area Grid -->
  <rect x="110" y="75" width="930" height="250" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M 110 275 L 1040 275" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 225 L 1040 225" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 175 L 1040 175" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 125 L 1040 125" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Pareto Frontier Curve (Smooth curve that stays strictly above y=325) -->
  <path d="M 190 200 C 270 120, 340 90, 420 90 C 520 90, 620 180, 710 225 C 800 270, 890 280, 970 285" 
        fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,4"/>

  <!-- 1. Full Log Point (x=190, y=200) -->
  <circle cx="190" cy="200" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="130" y="215" width="165" height="52" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="140" y="233" class="point-title" fill="#b45309">1. Full Log (1.0×)</text>
  <text x="140" y="248" class="point-desc">Fidelity: ~65%</text>
  <text x="140" y="260" class="point-desc">Stale-State Poisoning</text>

  <!-- 2. Structured Checkpointing Point (x=420, y=90) -->
  <circle cx="420" cy="90" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="335" y="105" width="230" height="62" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="348" y="125" class="point-title" fill="#047857">2. Structured Checkpoints (3.0×) ★</text>
  <text x="348" y="141" class="point-desc" font-weight="600" fill="#065f46">Fidelity: ~95% (Pareto Optimal)</text>
  <text x="348" y="154" class="point-desc">Preserved ASTs, Schemas &amp; Diffs</text>

  <!-- 3. Lossy Narrative Summary Point (x=710, y=225) -->
  <circle cx="710" cy="225" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <rect x="630" y="155" width="195" height="55" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <text x="642" y="173" class="point-title" fill="#b91c1c">3. Lossy Summary (6.0×)</text>
  <text x="642" y="188" class="point-desc">Fidelity: ~45%</text>
  <text x="642" y="201" class="point-desc">Constraint Shedding (Flags lost)</text>

  <!-- 4. Sliding Window Point (x=970, y=285) -->
  <circle cx="970" cy="285" r="7" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <rect x="870" y="220" width="165" height="52" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="882" y="238" class="point-title" fill="#475569">4. Sliding Window (10.0×)</text>
  <text x="882" y="253" class="point-desc">Fidelity: ~20%</text>
  <text x="882" y="265" class="point-desc">Blind Horizon Amnesia</text>

  <!-- Axes -->
  <path d="M 110 325 L 1050 325" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <path d="M 110 325 L 110 70" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Y-Axis Labels -->
  <text x="45" y="200" class="axis-lbl" transform="rotate(-90 45,200)" text-anchor="middle">Task Success Fidelity</text>
  <text x="100" y="329" class="tick-lbl" text-anchor="end">0.0</text>
  <text x="100" y="279" class="tick-lbl" text-anchor="end">0.2</text>
  <text x="100" y="229" class="tick-lbl" text-anchor="end">0.4</text>
  <text x="100" y="179" class="tick-lbl" text-anchor="end">0.6</text>
  <text x="100" y="129" class="tick-lbl" text-anchor="end">0.8</text>
  <text x="100" y="89" class="tick-lbl" text-anchor="end">1.0</text>

  <!-- X-Axis Labels -->
  <text x="580" y="358" class="axis-lbl" text-anchor="middle">Compression Ratio (C_r)</text>
  <text x="190" y="342" class="tick-lbl" text-anchor="middle">1.0×</text>
  <text x="420" y="342" class="tick-lbl" text-anchor="middle" font-weight="700" fill="#047857">3.0×</text>
  <text x="710" y="342" class="tick-lbl" text-anchor="middle">6.0×</text>
  <text x="970" y="342" class="tick-lbl" text-anchor="middle">10.0×</text>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="380" width="1040" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="403" class="card-text" font-weight="700" fill="#0f172a">Compaction Invariant:</text>
  <text x="35" y="421" class="card-text">Structured extraction and lossless filtering retain 100% of syntactic constraints (exact paths, diff hunks, flags) at a ~3× compression ratio.</text>
  <text x="35" y="437" class="card-text">Aggressive lossy narrative summarization beyond 5× sheds low-frequency operational constraints, triggering catastrophic agentic regressions.</text>
</svg>