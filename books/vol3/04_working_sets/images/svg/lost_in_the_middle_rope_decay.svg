<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>

    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Textbook Header Bar -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="1110" height="26" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="15" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" letter-spacing="0.05em">ATTENTION DISPERSION, ROPE HARMONIC DECAY, AND THE LOST-IN-THE-MIDDLE U-CURVE</text>
  </g>

  <!-- Panel 1: Softmax Denominator Dilution (Left, x=45) -->
  <g transform="translate(45, 75)">
    <rect width="350" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">1. Softmax Denominator Dilution</text>

    <!-- Mathematical Formula Box -->
    <g transform="translate(16, 56)">
      <rect width="318" height="68" rx="2" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="22" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#1E293B">α[target] = exp(z_target) / Σ exp(z_j)</text>
      <text x="12" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Target logit z = 6 (exp(6) ≈ 403.4)</text>
      <text x="12" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Background tokens logit z = -2 (exp(-2) ≈ 0.135)</text>
    </g>

    <!-- Case A: Compact Prompt (N=100) -->
    <g transform="translate(16, 140)">
      <rect width="318" height="180" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="12" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065F46">Case A: Compact Prompt (N = 100 tokens)</text>
      
      <!-- Math Breakdown -->
      <text x="12" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#047857">Denominator = 403.4 + (100 × 0.135) = 416.9</text>
      <text x="12" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">Target Share: 403.4 / 416.9 = 96.8%</text>

      <!-- Bar Chart A -->
      <g transform="translate(12, 78)">
        <rect x="0" y="0" width="294" height="24" rx="2" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
        <rect x="0" y="0" width="284" height="24" rx="2" fill="#059669"/>
        <text x="140" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Target Token: 96.8% Mass</text>
        <text x="290" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">Noise: 3.2%</text>
      </g>
      
      <text x="12" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#065F46" font-weight="600">✓ Sharp attention concentration</text>
      <text x="12" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#047857">Target cleanly activates downstream FFN logic</text>
    </g>

    <!-- Case B: Unmanaged Long Prompt (N=100,000) -->
    <g transform="translate(16, 335)">
      <rect width="318" height="215" rx="2" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
      <text x="12" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9F1239">Case B: Unmanaged Prompt (N = 100k tokens)</text>
      
      <!-- Math Breakdown -->
      <text x="12" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#BE123C">Denominator = 403.4 + (100k × 0.135) = 13,903.4</text>
      <text x="12" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E11D48">Target Share: 403.4 / 13,903.4 = 2.9%</text>

      <!-- Bar Chart B -->
      <g transform="translate(12, 78)">
        <rect x="0" y="0" width="294" height="24" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
        <rect x="0" y="0" width="9" height="24" rx="2" fill="#E11D48"/>
        <text x="20" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#BE123C">Target: 2.9%</text>
        <text x="160" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9F1239">Accumulated Noise Mass: 97.1%</text>
      </g>
      
      <rect x="12" y="118" width="294" height="42" rx="2" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1"/>
      <text x="20" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9F1239">33× Attention Attenuation Collapse!</text>
      <text x="20" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569">Target token submerged beneath background noise.</text>
      
      <text x="12" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#BE123C">✕ Cognitive thrashing: retrieval fails completely.</text>
      <text x="12" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">Downstream layers treat signal as unweighted noise.</text>
    </g>
  </g>

  <!-- Panel 2: RoPE Harmonic Distance Decay (Middle, x=415) -->
  <g transform="translate(415, 75)">
    <rect width="350" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">2. RoPE Harmonic Phase Decay</text>

    <!-- Mathematical Equation Box -->
    <g transform="translate(16, 56)">
      <rect width="318" height="68" rx="2" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="12" y="22" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#312E81">E[q^T R(Θ, Δ) k] ∝ 1 / Δ^γ</text>
      <text x="12" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#4338CA">Δ = |m - n| (Relative Token Distance)</text>
      <text x="12" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#4338CA">θ_i = b^(-2(i-1)/d) (Harmonic Frequencies)</text>
    </g>

    <!-- Destructive Interference Waveform Chart -->
    <g transform="translate(16, 140)">
      <rect width="318" height="225" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Expected Inner Product vs. Offset Δ</text>
      
      <!-- Coordinate Axis -->
      <line x1="35" y1="180" x2="300" y2="180" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowSlate)"/>
      <line x1="35" y1="180" x2="35" y2="35" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowSlate)"/>
      <text x="300" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">Distance Δ</text>
      <text x="30" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">Attn</text>

      <!-- Gridlines -->
      <line x1="35" y1="70" x2="295" y2="70" stroke="#E2E8F0" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="35" y1="125" x2="295" y2="125" stroke="#E2E8F0" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Decay Envelope Curve: 1 / Δ^gamma -->
      <path d="M 40 45 Q 65 60 90 110 T 170 160 T 290 174" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
      
      <!-- High Frequency Oscillations within envelope -->
      <path d="M 40 45 Q 46 38 52 52 T 64 68 T 76 90 T 88 115 T 105 138 T 130 152 T 165 163 T 210 171 T 280 174" fill="none" stroke="#818CF8" stroke-width="1.2"/>

      <!-- Region Callouts -->
      <rect x="42" y="75" width="70" height="34" rx="2" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
      <text x="77" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#312E81" text-anchor="middle">Local Window</text>
      <text x="77" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#4338CA" text-anchor="middle">Δ &lt; 1,024 toks</text>

      <rect x="175" y="120" width="105" height="36" rx="2" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
      <text x="227" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9F1239" text-anchor="middle">Destructive Phase</text>
      <text x="227" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#BE123C" text-anchor="middle">Harmonic cancellation</text>
    </g>

    <!-- Detailed Insights -->
    <g transform="translate(16, 380)">
      <rect width="318" height="170" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Mechanics of Rotary Interference</text>
      
      <text x="12" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">• Multi-frequency Channels:</text>
      <text x="12" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Head dimension d_h is split into d_h/2 2D planes,</text>
      <text x="12" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">each oscillating at geometric frequency θ_i.</text>

      <text x="12" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">• Phase Cancellation at Distance:</text>
      <text x="12" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">At large relative offsets Δ, high frequencies interfere</text>
      <text x="12" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">destructively, pushing expected dot-product to zero.</text>

      <text x="12" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#4F46E5">Result: Imposes hard recency bias by construction.</text>
    </g>
  </g>

  <!-- Panel 3: Lost-in-the-Middle U-Curve (Right, x=785) -->
  <g transform="translate(785, 75)">
    <rect width="370" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="370" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">3. Lost-in-the-Middle U-Curve</text>

    <!-- Empirical U-Curve Chart -->
    <g transform="translate(16, 56)">
      <rect width="338" height="235" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Empirical Fact Retrieval Accuracy vs. Depth</text>

      <!-- Axes -->
      <line x1="45" y1="185" x2="315" y2="185" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowSlate)"/>
      <line x1="45" y1="185" x2="45" y2="35" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowSlate)"/>
      <text x="315" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">Relative Position in Context (%)</text>
      <text x="40" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="end">Accuracy</text>

      <!-- Ticks -->
      <text x="45" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">0%</text>
      <text x="110" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">25%</text>
      <text x="180" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">50%</text>
      <text x="250" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">75%</text>
      <text x="305" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">100%</text>

      <text x="38" y="55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">100%</text>
      <text x="38" y="115" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">50%</text>
      <text x="38" y="165" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">20%</text>

      <!-- Grid lines -->
      <line x1="45" y1="52" x2="305" y2="52" stroke="#E2E8F0" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="45" y1="112" x2="305" y2="112" stroke="#E2E8F0" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="45" y1="162" x2="305" y2="162" stroke="#FECDD3" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Deep Valley Shading (30% to 70%) -->
      <rect x="120" y="52" width="120" height="133" fill="#FFF1F2" opacity="0.7"/>
      <text x="180" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#BE123C" text-anchor="middle">The Valley of Amnesia</text>
      <text x="180" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#E11D48" text-anchor="middle">&lt; 30% Retrieval</text>

      <!-- The U-Curve Path -->
      <path d="M 45 58 Q 75 62 105 105 T 180 165 T 255 105 T 305 65" fill="none" stroke="#E11D48" stroke-width="3"/>
      <circle cx="45" cy="58" r="4" fill="#059669"/>
      <circle cx="180" cy="165" r="5" fill="#E11D48"/>
      <circle cx="305" cy="65" r="4" fill="#059669"/>

      <!-- Prefix Callout -->
      <rect x="52" y="32" width="76" height="22" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="90" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle">&gt; 95% (Sink / Anchor)</text>

      <!-- Suffix Callout -->
      <rect x="225" y="32" width="76" height="22" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="263" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle">&gt; 90% (Local Bias)</text>
    </g>

    <!-- Systems Implications Breakdown -->
    <g transform="translate(16, 305)">
      <rect width="338" height="245" rx="2" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1"/>
      <text x="14" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9F1239">Production Systems Vulnerabilities</text>

      <g transform="translate(14, 34)">
        <text x="0" y="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#BE123C">1. The Middle Context Trap:</text>
        <text x="0" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Earlier tool outputs, file contents, and API schemas</text>
        <text x="0" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">naturally get pushed into the 30%–70% middle zone.</text>

        <text x="0" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#BE123C">2. False Sense of Security from Benchmarks:</text>
        <text x="0" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Synthetic NIAH tests achieve 100% because keys have</text>
        <text x="0" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">extreme contrast against Wikipedia text; real agents fail.</text>

        <text x="0" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#BE123C">3. Systems Invariant Mitigation:</text>
        <text x="0" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Reposition critical negative constraints to prompt anchors.</text>
        <text x="0" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Use Heavy-Hitter Oracle (H2O) to retain load-bearing keys.</text>
        <text x="0" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Synthesize middle execution history into State Ledgers.</text>
      </g>
    </g>
  </g>
</svg>
