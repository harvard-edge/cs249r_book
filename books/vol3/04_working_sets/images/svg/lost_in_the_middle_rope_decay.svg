<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="640" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL 1: SOFTMAX DENOMINATOR DILUTION (LEFT)                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="350" height="565" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">1. SOFTMAX DENOMINATOR DILUTION</text>

    <!-- Formula Box -->
    <g transform="translate(15, 34)">
      <rect width="320" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-family="Courier, monospace" font-size="10.5" font-weight="700" fill="#0f172a">α[target] = exp(z_target) / Σ exp(z_j)</text>
      <text x="12" y="38" font-size="7.5" fill="#64748b">Target logit z = 6 (exp(6) ≈ 403.4)</text>
      <text x="12" y="52" font-size="7.5" fill="#64748b">Background tokens logit z = -2 (exp(-2) ≈ 0.135)</text>
    </g>

    <!-- Case A: Compact Prompt -->
    <g transform="translate(15, 110)">
      <rect width="320" height="190" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect width="320" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#15803d">Case A: Compact Prompt (N = 100 tokens)</text>

      <text x="12" y="42" font-size="8" fill="#166534">Denominator = 403.4 + (100 × 0.135) = 416.9</text>
      <text x="12" y="58" font-size="9" font-weight="700" fill="#15803d">Target Attention Share: 403.4 / 416.9 = 96.8%</text>

      <!-- Bar Chart A -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="296" height="24" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <rect x="0" y="0" width="286" height="24" rx="1" fill="#16a34a"/>
        <text x="143" y="16" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Target Token: 96.8% Mass</text>
        <text x="292" y="36" font-size="7.5" fill="#64748b" text-anchor="end">Noise: 3.2%</text>
      </g>

      <g transform="translate(12, 122)">
        <rect width="296" height="52" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="10" y="18" font-size="8" font-weight="700" fill="#15803d">✓ Sharp Attention Concentration</text>
        <text x="10" y="32" font-size="7.5" fill="#166534">Target cleanly activates downstream FFN logic;</text>
        <text x="10" y="44" font-size="7.5" fill="#166534">high signal-to-noise ratio drives accurate tool arguments.</text>
      </g>
    </g>

    <!-- Case B: Unmanaged Long Prompt -->
    <g transform="translate(15, 310)">
      <rect width="320" height="240" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <rect width="320" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Case B: Unmanaged Long Prompt (N = 100k tokens)</text>

      <text x="12" y="42" font-size="8" fill="#991b1b">Denominator = 403.4 + (100k × 0.135) = 13,903.4</text>
      <text x="12" y="58" font-size="9" font-weight="700" fill="#dc2626">Target Attention Share: 403.4 / 13,903.4 = 2.9%</text>

      <!-- Bar Chart B -->
      <g transform="translate(12, 72)">
        <rect x="0" y="0" width="296" height="24" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect x="0" y="0" width="9" height="24" rx="1" fill="#dc2626"/>
        <text x="18" y="16" font-size="7.5" font-weight="700" fill="#991b1b">Target: 2.9%</text>
        <text x="160" y="16" font-size="8" font-weight="700" fill="#7f1d1d">Accumulated Noise Mass: 97.1%</text>
      </g>

      <g transform="translate(12, 114)">
        <rect width="296" height="42" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="148" y="18" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">33× Attention Attenuation Collapse!</text>
        <text x="148" y="32" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Target token completely submerged beneath background noise</text>
      </g>

      <g transform="translate(12, 166)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#991b1b">✕ Cognitive Thrashing &amp; Reasoning Breakdown</text>
        <text x="0" y="28" font-size="7.5" fill="#7f1d1d">Downstream layers treat signal as unweighted noise;</text>
        <text x="0" y="40" font-size="7.5" fill="#7f1d1d">agent hallucinates missing variable names and falsifies tool outputs.</text>
        <text x="0" y="54" font-size="7.5" fill="#7f1d1d">Unbounded accumulation triggers catastrophic dilution.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: ROPE HARMONIC PHASE DECAY (MIDDLE)                       -->
  <!-- ================================================================= -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="565" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. ROPE HARMONIC PHASE DECAY</text>

    <!-- Formula Box -->
    <g transform="translate(15, 34)">
      <rect width="320" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-family="Courier, monospace" font-size="10.5" font-weight="700" fill="#0369a1">E[q^T R(Θ, Δ) k] ∝ 1 / Δ^γ</text>
      <text x="12" y="38" font-size="7.5" fill="#64748b">Δ = |m - n| (Relative Token Distance)</text>
      <text x="12" y="52" font-size="7.5" fill="#64748b">θ_i = b^(-2(i-1)/d) (Harmonic Geometric Frequencies)</text>
    </g>

    <!-- Destructive Interference Waveform Chart -->
    <g transform="translate(15, 110)">
      <rect width="320" height="240" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Expected Inner Product vs. Offset Δ</text>

      <!-- Coordinate Axis -->
      <line x1="35" y1="190" x2="300" y2="190" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="35" y1="190" x2="35" y2="35" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="300" y="205" font-size="7.5" fill="#64748b" text-anchor="end">Distance Δ</text>
      <text x="30" y="30" font-size="7.5" fill="#64748b" text-anchor="end">Attn</text>

      <!-- Gridlines -->
      <line x1="35" y1="75" x2="295" y2="75" stroke="#e2e8f0" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="35" y1="130" x2="295" y2="130" stroke="#e2e8f0" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Decay Envelope Curve: 1 / Δ^gamma -->
      <path d="M 40 50 Q 65 65 90 115 T 170 165 T 290 180" fill="none" stroke="#0284c7" stroke-width="2.5"/>

      <!-- High Frequency Oscillations within envelope -->
      <path d="M 40 50 Q 46 42 52 56 T 64 72 T 76 94 T 88 119 T 105 142 T 130 156 T 165 168 T 210 176 T 280 180" fill="none" stroke="#38bdf8" stroke-width="1.2"/>

      <!-- Region Callouts -->
      <rect x="45" y="80" width="75" height="34" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="82" y="94" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">Local Window</text>
      <text x="82" y="106" font-size="7" fill="#0284c7" text-anchor="middle">Δ &lt; 1,024 toks</text>

      <rect x="175" y="125" width="115" height="34" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="232" y="139" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Destructive Phase</text>
      <text x="232" y="151" font-size="7" fill="#dc2626" text-anchor="middle">Harmonic cancellation</text>
    </g>

    <!-- Detailed Insights -->
    <g transform="translate(15, 360)">
      <rect width="320" height="190" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Mechanics of Rotary Interference</text>

      <g transform="translate(12, 30)">
        <text x="0" y="12" font-size="8" font-weight="700" fill="#334155">• Multi-frequency Channels:</text>
        <text x="0" y="26" font-size="7.5" fill="#475569">Head dimension d_h is split into d_h/2 orthogonal 2D planes,</text>
        <text x="0" y="38" font-size="7.5" fill="#475569">each rotating at exponential frequency θ_i.</text>

        <text x="0" y="60" font-size="8" font-weight="700" fill="#334155">• Phase Cancellation at Distance:</text>
        <text x="0" y="74" font-size="7.5" fill="#475569">At large relative offsets Δ, high frequencies interfere</text>
        <text x="0" y="86" font-size="7.5" fill="#475569">destructively, driving expected dot-product toward zero.</text>

        <rect x="0" y="100" width="296" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="148" y="118" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">Intrinsic Inductive Bias</text>
        <text x="148" y="132" font-size="7.5" fill="#0284c7" text-anchor="middle">RoPE mathematically enforces strong recency preference</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 3: LOST-IN-THE-MIDDLE U-CURVE (RIGHT)                       -->
  <!-- ================================================================= -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="360" height="565" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">3. LOST-IN-THE-MIDDLE U-CURVE</text>

    <!-- Empirical U-Curve Chart -->
    <g transform="translate(15, 34)">
      <rect width="330" height="240" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Empirical Fact Retrieval Accuracy vs. Depth</text>

      <!-- Axes -->
      <line x1="45" y1="190" x2="310" y2="190" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="45" y1="190" x2="45" y2="35" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="310" y="206" font-size="7.5" fill="#64748b" text-anchor="end">Relative Position in Context (%)</text>
      <text x="40" y="30" font-size="7.5" fill="#64748b" text-anchor="end">Acc</text>

      <!-- Ticks -->
      <text x="45" y="202" font-size="7" fill="#64748b" text-anchor="middle">0%</text>
      <text x="110" y="202" font-size="7" fill="#64748b" text-anchor="middle">25%</text>
      <text x="175" y="202" font-size="7" fill="#64748b" text-anchor="middle">50%</text>
      <text x="240" y="202" font-size="7" fill="#64748b" text-anchor="middle">75%</text>
      <text x="300" y="202" font-size="7" fill="#64748b" text-anchor="middle">100%</text>

      <text x="38" y="55" font-size="7" fill="#64748b" text-anchor="end">100%</text>
      <text x="38" y="115" font-size="7" fill="#64748b" text-anchor="end">50%</text>
      <text x="38" y="165" font-size="7" fill="#64748b" text-anchor="end">20%</text>

      <!-- Grid lines -->
      <line x1="45" y1="52" x2="295" y2="52" stroke="#e2e8f0" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="45" y1="112" x2="295" y2="112" stroke="#e2e8f0" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="45" y1="162" x2="295" y2="162" stroke="#fca5a5" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Deep Valley Shading (30% to 70%) -->
      <rect x="115" y="52" width="120" height="138" fill="#fee2e2" opacity="0.6"/>
      <text x="175" y="140" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Valley of Amnesia</text>
      <text x="175" y="152" font-size="7" font-weight="700" fill="#dc2626" text-anchor="middle">&lt; 30% Retrieval</text>

      <!-- The U-Curve Path -->
      <path d="M 45 58 Q 75 62 105 105 T 175 165 T 245 105 T 295 65" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="45" cy="58" r="4" fill="#16a34a"/>
      <circle cx="175" cy="165" r="5" fill="#dc2626"/>
      <circle cx="295" cy="65" r="4" fill="#16a34a"/>

      <!-- Prefix Callout -->
      <rect x="50" y="32" width="76" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="88" y="45" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">&gt; 95% (Sink / Anchor)</text>

      <!-- Suffix Callout -->
      <rect x="220" y="32" width="76" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="258" y="45" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">&gt; 90% (Local Bias)</text>
    </g>

    <!-- Systems Implications Breakdown -->
    <g transform="translate(15, 285)">
      <rect width="330" height="265" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" font-size="8.5" font-weight="700" fill="#991b1b">Production Systems Vulnerabilities</text>

      <g transform="translate(14, 32)">
        <text x="0" y="12" font-size="8" font-weight="700" fill="#991b1b">1. The Middle Context Trap:</text>
        <text x="0" y="26" font-size="7.5" fill="#475569">Earlier tool outputs, file contents, and API schemas</text>
        <text x="0" y="38" font-size="7.5" fill="#475569">naturally get pushed into the 30%–70% middle zone.</text>

        <text x="0" y="60" font-size="8" font-weight="700" fill="#991b1b">2. False Sense of Security from Benchmarks:</text>
        <text x="0" y="74" font-size="7.5" fill="#475569">Synthetic needle-in-a-haystack tests achieve 100%</text>
        <text x="0" y="86" font-size="7.5" fill="#475569">due to high lexical contrast; realistic workflows fail.</text>

        <text x="0" y="108" font-size="8" font-weight="700" fill="#15803d">3. Systems Invariant Mitigations:</text>
        <text x="0" y="122" font-size="7.5" fill="#334155">• Pin safety &amp; negative rules at L0 prompt anchors.</text>
        <text x="0" y="136" font-size="7.5" fill="#334155">• Use Heavy-Hitter Oracle (H2O) to retain load-bearing keys.</text>
        <text x="0" y="150" font-size="7.5" fill="#334155">• Synthesize middle execution history into State Ledgers.</text>
        <text x="0" y="164" font-size="7.5" fill="#334155">• Enforce strict 2PC eviction on ephemeral scratchpads.</text>

        <rect x="0" y="180" width="302" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="151" y="195" font-size="7.5" font-weight="700" fill="#0f172a" text-anchor="middle">Context Compaction Eliminates the Valley</text>
        <text x="151" y="206" font-size="7" fill="#64748b" text-anchor="middle">Pruning middle clutter shifts operational accuracy &gt;95%</text>
      </g>
    </g>
  </g>
</g>
</svg>