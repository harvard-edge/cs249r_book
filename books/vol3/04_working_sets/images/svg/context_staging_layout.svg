<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1000" height="410" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="40" y="32" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="0.2">THREE-ZONE CONTEXT MEMORY LAYOUT &amp; ATTENTION SALIENCE</text>
  <text x="40" y="48" font-size="9" fill="#64748b">Mapping Process Address Space Segments to Causal Attention Geometry and Serving Prefix Cache Boundaries</text>

  <!-- Top Coordinate Axis (Token Offsets) -->
  <g transform="translate(40, 75)">
    <!-- Main Address Bar Container -->
    <rect x="0" y="20" width="920" height="70" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Zone 1: Static Prefix -->
    <rect x="0" y="20" width="220" height="70" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Zone 1: Static Prefix (Z₁)</text>
    <text x="110" y="59" text-anchor="middle" font-size="8.5" fill="#475569">System Invariants &amp; Tool Schemas</text>
    <text x="110" y="74" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Pinned Prefix Cache (Radix Hit)</text>

    <!-- Zone 2: Dynamic Working Heap -->
    <rect x="220" y="20" width="480" height="70" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="460" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Zone 2: Dynamic Working Body (Z₂)</text>
    <text x="460" y="59" text-anchor="middle" font-size="8.5" fill="#78350f">Historical Trajectory (aᵢ, oᵢ) + Staged Documents D_retrieved</text>
    <text x="460" y="74" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#b45309">Volatile Working Set (Lossy Compaction &amp; Eviction Target)</text>

    <!-- Zone 3: Recency Suffix -->
    <rect x="700" y="20" width="220" height="70" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="810" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Zone 3: Recency Suffix (Z₃)</text>
    <text x="810" y="59" text-anchor="middle" font-size="8.5" fill="#166534">Goal g_t + Observation o_t + Schema Γ</text>
    <text x="810" y="74" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#15803d">High-Salience Generation Frontier</text>

    <!-- Token Offset Markers -->
    <line x1="0" y1="12" x2="0" y2="18" stroke="#64748b" stroke-width="1.2"/>
    <text x="0" y="8" text-anchor="start" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">Pos 0</text>

    <line x1="220" y1="12" x2="220" y2="18" stroke="#64748b" stroke-width="1.2"/>
    <text x="220" y="8" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">N₁ (~8k)</text>

    <line x1="700" y1="12" x2="700" y2="18" stroke="#64748b" stroke-width="1.2"/>
    <text x="700" y="8" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">T - δ (~124k)</text>

    <line x1="920" y1="12" x2="920" y2="18" stroke="#64748b" stroke-width="1.2"/>
    <text x="920" y="8" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">T (Tokens)</text>

    <!-- Boundary Annotations -->
    <line x1="220" y1="90" x2="220" y2="106" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="220" y="118" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">PREFIX CACHE BOUNDARY</text>

    <line x1="700" y1="90" x2="700" y2="106" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="700" y="118" text-anchor="middle" font-size="7.5" font-weight="600" fill="#166534">RECENCY BOUNDARY</text>

    <!-- Generation Frontier Pointer -->
    <line x1="920" y1="90" x2="920" y2="106" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <text x="920" y="120" text-anchor="end" font-size="7.5" font-weight="700" fill="#0f172a">Generation Frontier (q_T)</text>
  </g>

  <!-- Attention Salience U-Curve (Lower Panel) -->
  <g transform="translate(40, 225)">
    <!-- Curve Axis Box -->
    <rect x="0" y="0" width="920" height="140" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="16" y="18" font-size="9" font-weight="700" fill="#334155">ATTENTION LOGIT WEIGHT ALLOCATION &amp; LOST-IN-THE-MIDDLE PROFILE</text>
    <text x="904" y="18" text-anchor="end" font-size="8" fill="#64748b">E_j [ α_{T, j} ] across sequence index j</text>

    <!-- Reference Grid -->
    <line x1="40" y1="115" x2="880" y2="115" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="40" y1="30" x2="40" y2="115" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Y-axis labels -->
    <text x="34" y="34" text-anchor="end" font-size="7" fill="#64748b">High</text>
    <text x="34" y="113" text-anchor="end" font-size="7" fill="#64748b">Low</text>

    <!-- Zone 1 High Attention Sink Shading -->
    <rect x="40" y="30" width="180" height="85" fill="#3b82f6" fill-opacity="0.06"/>
    <text x="130" y="55" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1d4ed8">Attention Sink &amp; Invariant Anchoring</text>

    <!-- Zone 2 Lost-in-the-Middle Trough -->
    <rect x="220" y="30" width="480" height="85" fill="#ef4444" fill-opacity="0.04"/>
    <text x="460" y="72" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">"Lost-in-the-Middle" Attenuation Trough</text>
    <text x="460" y="86" text-anchor="middle" font-size="7.5" fill="#991b1b">Unmanaged context here experiences severe recall degradation</text>

    <!-- Zone 3 Recency Bias Spike -->
    <rect x="700" y="30" width="180" height="85" fill="#16a34a" fill-opacity="0.06"/>
    <text x="790" y="55" text-anchor="middle" font-size="7.5" font-weight="600" fill="#15803d">Recency Bias &amp; Schema Coupling</text>

    <!-- U-Curve Path -->
    <path d="M 40,42 C 120,45 180,60 220,85 C 300,108 420,112 540,110 C 640,106 680,90 700,75 C 740,55 800,36 880,32" fill="none" stroke="#2563eb" stroke-width="2"/>
  </g>
</svg>
