<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Textbook Header Bar -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="1110" height="26" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="15" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" letter-spacing="0.05em">TWO-PHASE COMMIT PROTOCOL FOR EPHEMERAL COT REASONING &amp; RADIX CACHE RECLAMATION</text>
  </g>

  <!-- Phase 1: Deliberation (Left Panel, x=45, width=350) -->
  <g transform="translate(45, 75)">
    <rect width="350" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Phase 1: Deliberation &amp; Proposal</text>

    <!-- Context Buffer Layout at Phase 1 -->
    <g transform="translate(16, 56)">
      <rect width="318" height="48" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">Persistent Prefix (τ_t-1)</text>
      <text x="12" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#64748B">System prompt, task spec, validated tool history</text>
      <rect x="250" y="12" width="56" height="22" rx="2" fill="#E2E8F0"/>
      <text x="278" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">PINNED</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="112" x2="175" y2="128" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>

    <!-- Ephemeral Reasoning Scratchpad -->
    <g transform="translate(16, 134)">
      <rect width="318" height="150" rx="2" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
      <text x="12" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B45309">Ephemeral Scratchpad z_t (&lt;thought&gt;)</text>
      <text x="12" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#92400E">Model emits 4,000–12,000 deliberative reasoning tokens:</text>

      <!-- Mock Thinking Text -->
      <rect x="12" y="48" width="294" height="60" rx="2" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
      <text x="20" y="65" font-family="Courier, monospace" font-size="9" fill="#78350F">"Hypothesis 1: connection deadlock...</text>
      <text x="20" y="79" font-family="Courier, monospace" font-size="9" fill="#78350F"> Checking mutex in pool.py line 48...</text>
      <text x="20" y="93" font-family="Courier, monospace" font-size="9" fill="#78350F"> Rejecting patch A; proceeding with patch B..."</text>

      <rect x="12" y="116" width="294" height="24" rx="2" fill="#FEF3C7"/>
      <text x="159" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Transient KV Page Allocation (Ref Count = 1)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="292" x2="175" y2="308" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>

    <!-- Emitted Action Proposal -->
    <g transform="translate(16, 314)">
      <rect width="318" height="96" rx="2" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
      <text x="12" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#312E81">Action Proposal a_t (&lt;call:tool&gt;)</text>
      <rect x="12" y="32" width="294" height="38" rx="2" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1"/>
      <text x="20" y="48" font-family="Courier, monospace" font-size="9.5" fill="#1E1B4B">patch_file(path="pool.py", diff="...")</text>
      <text x="20" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#4338CA">Action tokens: 100 tokens</text>
      <text x="12" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#4F46E5">Dispatched to Isolated Sandbox Execution Queue</text>
    </g>

    <!-- Phase 1 Invariant Note -->
    <g transform="translate(16, 424)">
      <rect width="318" height="126" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Systems Invariant (Proposal Phase):</text>
      <text x="12" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Reasoning tokens z_t are marked EPHEMERAL.</text>
      <text x="12" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• In-flight memory is leased from scratchpad pool.</text>
      <text x="12" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Action a_t has NOT mutated persistent state yet.</text>
      <text x="12" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• If runtime crashes, zero rollback required.</text>
      <text x="12" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#059669">Status: Speculative Isolation Maintained</text>
    </g>
  </g>

  <!-- Phase 2: Commit & Purge (Middle Panel, x=415, width=350) -->
  <g transform="translate(415, 75)">
    <rect width="350" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="350" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Phase 2: Execution, Validation &amp; Commit</text>

    <!-- Sandbox Execution Step -->
    <g transform="translate(16, 56)">
      <rect width="318" height="85" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065F46">Isolated Sandbox Execution</text>
      <text x="12" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#047857">Action a_t executed in Linux container (cgroups / tmpfs)</text>
      <rect x="12" y="44" width="294" height="28" rx="2" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
      <text x="20" y="62" font-family="Courier, monospace" font-size="9.5" fill="#065F46">pytest tests/test_db.py → PASS (exit 0)</text>
      <text x="12" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#059669">Environment Observation o_t Captured</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="148" x2="175" y2="164" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowRose)"/>

    <!-- The 2PC Purge Action -->
    <g transform="translate(16, 170)">
      <rect width="318" height="110" rx="2" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2"/>
      <text x="12" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9F1239">2PC COMMIT: Forceful Scratchpad Purge</text>
      <text x="12" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#BE123C">De-allocate ephemeral KV pages: C_ref ← C_ref - 1 = 0</text>
      
      <!-- Strikethrough box showing purged thought -->
      <rect x="12" y="48" width="294" height="34" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
      <text x="20" y="68" font-family="Courier, monospace" font-size="9" fill="#991B1B" text-decoration="line-through">&lt;thought&gt; 6,000 ephemeral tokens &lt;/thought&gt;</text>
      <line x1="16" y1="65" x2="300" y2="65" stroke="#E11D48" stroke-width="2"/>

      <text x="12" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E11D48">Reclaimed: 6,000 tokens (1.92 GB HBM freed immediately)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="288" x2="175" y2="304" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>

    <!-- Persistent Context Buffer Updated -->
    <g transform="translate(16, 310)">
      <rect width="318" height="115" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="12" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">New Persistent Trajectory τ_t</text>
      <text x="12" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">Only canonical transitions sealed into context:</text>

      <rect x="12" y="44" width="294" height="42" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
      <text x="20" y="60" font-family="Courier, monospace" font-size="9" fill="#1E293B">τ_t = τ_t-1 ∘ (action: a_t, obs: o_t)</text>
      <text x="20" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#059669">Net delta added: ~150 tokens (0.048 GB)</text>

      <rect x="12" y="92" width="294" height="16" rx="2" fill="#D1FAE5"/>
      <text x="159" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Canonical Working Set Maintained Lean</text>
    </g>

    <!-- Phase 2 Invariant Note -->
    <g transform="translate(16, 436)">
      <rect width="318" height="114" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Systems Invariant (Commit Phase):</text>
      <text x="12" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Ephemeral scratchpads NEVER enter persistent state.</text>
      <text x="12" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Eliminates 75% to 90% of trajectory token accumulation.</text>
      <text x="12" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Subsequent turns attend only to verified facts.</text>
      <text x="12" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#059669">Result: Zero Cognitive Dilution in Downstream Turns</text>
    </g>
  </g>

  <!-- Panel 3: RadixAttention Tree & Math Economics (Right, x=785, width=370) -->
  <g transform="translate(785, 75)">
    <rect width="370" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="370" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">3. RadixAttention &amp; Hardware Savings</text>

    <!-- Radix Tree Diagram -->
    <g transform="translate(16, 56)">
      <rect width="338" height="230" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Radix Prefix Tree Mechanics in vLLM / SGLang</text>

      <!-- Tree Nodes -->
      <!-- Root Node (Prompt Prefix) -->
      <g transform="translate(110, 30)">
        <rect width="120" height="34" rx="2" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/>
        <text x="60" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#312E81" text-anchor="middle">Root Prefix (τ_0)</text>
        <text x="60" y="28" font-family="Courier, monospace" font-size="8.5" fill="#4338CA" text-anchor="middle">Ref Count: 2</text>
      </g>

      <!-- Branch A: Ephemeral CoT (Pruned) -->
      <line x1="140" y1="64" x2="70" y2="100" stroke="#E11D48" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrowRose)"/>
      <g transform="translate(15, 100)">
        <rect width="115" height="52" rx="2" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.2"/>
        <text x="57" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9F1239" text-anchor="middle">Scratchpad z_t</text>
        <text x="57" y="28" font-family="Courier, monospace" font-size="8" fill="#BE123C" text-anchor="middle">6,000 tokens</text>
        <rect x="15" y="32" width="85" height="15" rx="2" fill="#E11D48"/>
        <text x="57" y="43" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">EVICTED (LRU)</text>
      </g>

      <!-- Branch B: Canonical Turn (Retained) -->
      <line x1="200" y1="64" x2="260" y2="100" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
      <g transform="translate(205, 100)">
        <rect width="120" height="52" rx="2" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
        <text x="60" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Committed (a_t, o_t)</text>
        <text x="60" y="28" font-family="Courier, monospace" font-size="8" fill="#047857" text-anchor="middle">150 tokens</text>
        <rect x="15" y="32" width="90" height="15" rx="2" fill="#059669"/>
        <text x="60" y="43" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ACTIVE PREFIX</text>
      </g>

      <!-- Next Turn Generation -->
      <line x1="265" y1="152" x2="265" y2="180" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
      <g transform="translate(205, 180)">
        <rect width="120" height="34" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
        <text x="60" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">Turn t+1 Proposal</text>
        <text x="60" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#166534" text-anchor="middle">Reuses clean prefix</text>
      </g>

      <text x="12" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569">Prompt simply omits &lt;thought&gt; tag; Radix tree auto-reclaims dead branch.</text>
    </g>

    <!-- Quantitative Napkin Math Box -->
    <g transform="translate(16, 298)">
      <rect width="338" height="252" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">30-Turn Trajectory Economics (70B Model)</text>

      <!-- Comparison Rows -->
      <g transform="translate(14, 38)">
        <rect width="310" height="82" rx="2" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
        <text x="10" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9F1239">Unmanaged Append-Only Trajectory:</text>
        <text x="10" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• 30 turns × 6,000 thought tokens = 180,000 tokens</text>
        <text x="10" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• KV Cache Footprint: 180k × 320 KB = 57.6 GB HBM</text>
        <text x="10" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#BE123C">✕ Single stream exhausts &gt; 50% of 2× H100 node!</text>
      </g>

      <g transform="translate(14, 128)">
        <rect width="310" height="82" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="10" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">With Two-Phase Commit Protocol:</text>
        <text x="10" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• 30 turns × 100 committed tokens = 3,000 tokens</text>
        <text x="10" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• KV Cache Footprint: 3k × 320 KB = 0.96 GB HBM</text>
        <text x="10" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669">✓ 60× Memory Reduction; Zero Deliberative Loss!</text>
      </g>

      <rect x="14" y="218" width="310" height="24" rx="2" fill="#1E293B"/>
      <text x="169" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Enables 60× higher concurrency per accelerator</text>
    </g>
  </g>
</svg>
