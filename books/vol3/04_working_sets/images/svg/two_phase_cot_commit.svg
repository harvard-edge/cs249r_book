<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="640" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PHASE 1: DELIBERATION & PROPOSAL (LEFT)                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="350" height="565" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">PHASE 1: DELIBERATION &amp; PROPOSAL</text>

    <!-- Context Buffer Layout at Phase 1 -->
    <g transform="translate(15, 34)">
      <rect width="320" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Persistent Prefix (τ_t-1)</text>
      <text x="12" y="32" font-size="8.0" fill="#64748b">System prompt, task spec, validated tool history</text>
      <rect x="250" y="14" width="58" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="279" y="29" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">PINNED</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="92" x2="175" y2="108" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Ephemeral Reasoning Scratchpad -->
    <g transform="translate(15, 114)">
      <rect width="320" height="152" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#b45309">Ephemeral Scratchpad z_t (&lt;thought&gt;)</text>
      <text x="12" y="32" font-size="8.0" fill="#78350f">Model emits 4,000–12,000 deliberative reasoning tokens:</text>

      <!-- Mock Thinking Text -->
      <rect x="10" y="42" width="300" height="66" rx="1" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
      <text x="18" y="58" font-family="Courier, monospace" font-size="8.5" fill="#78350f">"Hypothesis 1: connection deadlock...</text>
      <text x="18" y="74" font-family="Courier, monospace" font-size="8.5" fill="#78350f"> Checking mutex in pool.py line 48...</text>
      <text x="18" y="90" font-family="Courier, monospace" font-size="8.5" fill="#78350f"> Rejecting patch A; proceeding with patch B..."</text>

      <rect x="10" y="116" width="300" height="24" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <text x="160" y="132" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">Transient KV Page Allocation (Ref Count = 1)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="272" x2="175" y2="288" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Emitted Action Proposal -->
    <g transform="translate(15, 294)">
      <rect width="320" height="98" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0369a1">Action Proposal a_t (&lt;call:tool&gt;)</text>

      <rect x="10" y="28" width="300" height="38" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="18" y="44" font-family="Courier, monospace" font-size="9" fill="#0f172a">patch_file(path="pool.py", diff="...")</text>
      <text x="18" y="56" font-size="8.0" fill="#0284c7">Action tokens: 100 tokens</text>

      <text x="12" y="82" font-size="8.0" font-weight="700" fill="#0369a1">Dispatched to Isolated Sandbox Execution Queue</text>
    </g>

    <!-- Phase 1 Invariant Note -->
    <g transform="translate(15, 404)">
      <rect width="320" height="145" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Systems Invariant (Proposal Phase):</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8.0" fill="#475569">• Reasoning tokens z_t are explicitly marked EPHEMERAL.</text>
        <text x="0" y="26" font-size="8.0" fill="#475569">• In-flight memory is leased from speculative scratchpad pool.</text>
        <text x="0" y="40" font-size="8.0" fill="#475569">• Action a_t has NOT mutated persistent state yet.</text>
        <text x="0" y="54" font-size="8.0" fill="#475569">• If runtime crashes, zero rollback required.</text>

        <rect x="0" y="68" width="296" height="34" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="148" y="84" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Status: Speculative Isolation Maintained</text>
        <text x="148" y="94" font-size="8.0" fill="#166534" text-anchor="middle">Zero external state mutation</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 2: EXECUTION, VALIDATION & COMMIT (MIDDLE)                  -->
  <!-- ================================================================= -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="565" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PHASE 2: EXECUTION, VALIDATION &amp; COMMIT</text>

    <!-- Sandbox Execution Step -->
    <g transform="translate(15, 34)">
      <rect width="320" height="88" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">Isolated Sandbox Execution</text>
      <text x="12" y="32" font-size="8.0" fill="#166534">Action a_t executed in Linux container (cgroups / tmpfs)</text>

      <rect x="10" y="40" width="300" height="26" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <text x="18" y="56" font-family="Courier, monospace" font-size="8.5" fill="#15803d">pytest tests/test_db.py → PASS (exit 0)</text>

      <text x="12" y="80" font-size="8.0" font-weight="700" fill="#15803d">Environment Observation o_t Captured</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="128" x2="175" y2="144" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- The 2PC Purge Action -->
    <g transform="translate(15, 150)">
      <rect width="320" height="114" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">2PC COMMIT: Forceful Scratchpad Purge</text>
      <text x="12" y="32" font-size="8.0" fill="#7f1d1d">De-allocate ephemeral KV pages: C_ref ← C_ref - 1 = 0</text>

      <!-- Strikethrough Box -->
      <rect x="10" y="42" width="300" height="34" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="150" y="62" font-family="Courier, monospace" font-size="8.5" fill="#dc2626" text-anchor="middle">&lt;thought&gt; 6,000 ephemeral tokens &lt;/thought&gt;</text>
      <line x1="20" y1="59" x2="280" y2="59" stroke="#dc2626" stroke-width="1.5"/>

      <text x="12" y="96" font-size="8" font-weight="700" fill="#991b1b">Reclaimed: 6,000 tokens (1.92 GB HBM freed immediately)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="175" y1="270" x2="175" y2="286" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Persistent Context Buffer Updated -->
    <g transform="translate(15, 292)">
      <rect width="320" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">New Persistent Trajectory τ_t</text>
      <text x="12" y="32" font-size="8.0" fill="#64748b">Only canonical transitions sealed into context:</text>

      <rect x="10" y="40" width="300" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="18" y="55" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">τ_t = τ_t-1 ∘ (action: a_t, obs: o_t)</text>
      <text x="18" y="67" font-size="8.0" fill="#16a34a">Net delta added: ~150 tokens (0.048 GB)</text>

      <rect x="10" y="80" width="300" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="160" y="93" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">Canonical Working Set Maintained Lean</text>
    </g>

    <!-- Phase 2 Invariant Note -->
    <g transform="translate(15, 410)">
      <rect width="320" height="138" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Systems Invariant (Commit Phase):</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8.0" fill="#475569">• Ephemeral scratchpads NEVER enter persistent state.</text>
        <text x="0" y="26" font-size="8.0" fill="#475569">• Eliminates 75% to 90% of trajectory token accumulation.</text>
        <text x="0" y="40" font-size="8.0" fill="#475569">• Subsequent turns attend strictly to verified facts.</text>

        <rect x="0" y="54" width="296" height="38" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="148" y="70" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Result: Zero Cognitive Dilution</text>
        <text x="148" y="82" font-size="8.0" fill="#166534" text-anchor="middle">Radix tree preserves clean prefix for turn t+1</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 3: RADIXATTENTION & HARDWARE SAVINGS (RIGHT)                -->
  <!-- ================================================================= -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="360" height="565" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">3. RADIXATTENTION &amp; HARDWARE SAVINGS</text>

    <!-- Radix Tree Diagram -->
    <g transform="translate(15, 34)">
      <rect width="330" height="236" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Radix Prefix Tree Mechanics (vLLM / SGLang)</text>

      <!-- Root Node (Prompt Prefix) -->
      <g transform="translate(105, 30)">
        <rect width="120" height="34" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="60" y="16" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Root Prefix (τ_0)</text>
        <text x="60" y="27" font-family="Courier, monospace" font-size="8.0" fill="#4c1d95" text-anchor="middle">Ref Count: 2</text>
      </g>

      <!-- Branch A: Ephemeral CoT (Pruned) -->
      <line x1="135" y1="64" x2="70" y2="98" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arr-red)"/>
      <g transform="translate(15, 98)">
        <rect width="110" height="52" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
        <text x="55" y="16" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Scratchpad z_t</text>
        <text x="55" y="28" font-family="Courier, monospace" font-size="8.0" fill="#7f1d1d" text-anchor="middle">6,000 tokens</text>
        <rect x="15" y="32" width="80" height="15" rx="1" fill="#dc2626"/>
        <text x="55" y="43" font-size="8.0" font-weight="700" fill="#ffffff" text-anchor="middle">EVICTED (LRU)</text>
      </g>

      <!-- Branch B: Canonical Turn (Retained) -->
      <line x1="195" y1="64" x2="260" y2="98" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
      <g transform="translate(205, 98)">
        <rect width="115" height="52" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="57" y="16" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Committed (a_t, o_t)</text>
        <text x="57" y="28" font-family="Courier, monospace" font-size="8.0" fill="#166534" text-anchor="middle">150 tokens</text>
        <rect x="15" y="32" width="85" height="15" rx="1" fill="#16a34a"/>
        <text x="57" y="43" font-size="8.0" font-weight="700" fill="#ffffff" text-anchor="middle">ACTIVE PREFIX</text>
      </g>

      <!-- Next Turn Generation -->
      <line x1="262" y1="150" x2="262" y2="178" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <g transform="translate(205, 178)">
        <rect width="115" height="34" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="57" y="16" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Turn t+1 Proposal</text>
        <text x="57" y="27" font-size="8.0" fill="#166534" text-anchor="middle">Reuses clean prefix</text>
      </g>

      <text x="12" y="226" font-size="8.0" fill="#64748b">Prompt simply omits &lt;thought&gt; tag; Radix tree auto-reclaims dead branch.</text>
    </g>

    <!-- Quantitative Napkin Math Box -->
    <g transform="translate(15, 282)">
      <rect width="330" height="266" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" font-size="8.5" font-weight="700" fill="#0f172a">30-Turn Trajectory Economics (70B Model)</text>

      <!-- Comparison Rows -->
      <g transform="translate(12, 30)">
        <rect width="306" height="80" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">Unmanaged Append-Only Trajectory:</text>
        <text x="10" y="30" font-size="8.0" fill="#475569">• 30 turns × 6,000 thought tokens = 180,000 tokens</text>
        <text x="10" y="44" font-size="8.0" fill="#475569">• KV Cache Footprint: 180k × 320 KB = 57.6 GB HBM</text>
        <text x="10" y="64" font-size="8" font-weight="700" fill="#dc2626">✕ Single stream exhausts &gt; 50% of 2× H100 node!</text>
      </g>

      <g transform="translate(12, 120)">
        <rect width="306" height="80" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">With Two-Phase Commit Protocol:</text>
        <text x="10" y="30" font-size="8.0" fill="#475569">• 30 turns × 100 committed tokens = 3,000 tokens</text>
        <text x="10" y="44" font-size="8.0" fill="#475569">• KV Cache Footprint: 3k × 320 KB = 0.96 GB HBM</text>
        <text x="10" y="64" font-size="8" font-weight="700" fill="#15803d">✓ 60× Memory Reduction; Zero Deliberative Loss!</text>
      </g>

      <g transform="translate(12, 210)">
        <rect width="306" height="34" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="153" y="22" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">Enables 60× higher serving concurrency per accelerator</text>
      </g>
    </g>
  </g>
</g>
</svg>