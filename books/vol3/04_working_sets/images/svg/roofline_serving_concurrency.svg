<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>

    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Textbook Header Bar -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="1110" height="26" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="15" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" letter-spacing="0.05em">ACCELERATOR ROOFLINE MODEL &amp; CONCURRENT AGENT SERVING CAPACITY</text>
  </g>

  <!-- Panel 1: Accelerator Roofline Model (Left, x=45, width=540) -->
  <g transform="translate(45, 75)">
    <rect width="540" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="540" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">1. NVIDIA H100 SXM5 Decode Roofline</text>

    <!-- Roofline Log-Log Chart -->
    <g transform="translate(20, 56)">
      <rect width="500" height="340" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Chart Axes -->
      <line x1="50" y1="290" x2="475" y2="290" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
      <line x1="50" y1="290" x2="50" y2="25" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
      <text x="475" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="end">Operational Intensity (FLOPs / Byte)</text>
      <text x="45" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="end">Performance (TFLOP/s)</text>

      <!-- Grid Ticks (Log Scale Simulation) -->
      <text x="50" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">0.1</text>
      <text x="130" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">1.0</text>
      <text x="210" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">10</text>
      <text x="320" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">295 (Knee)</text>
      <text x="450" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">1,000</text>

      <text x="42" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">1</text>
      <text x="42" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">10</text>
      <text x="42" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">100</text>
      <text x="42" y="65" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="end">989</text>

      <!-- Compute Ceiling (Horizontal Line at y=60) -->
      <line x1="320" y1="60" x2="470" y2="60" stroke="#0284C7" stroke-width="3"/>
      <rect x="330" y="42" width="135" height="18" rx="2" fill="#E0F2FE"/>
      <text x="397" y="55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">Compute Ceiling: 989 TFLOP/s</text>

      <!-- Memory Bandwidth Slanted Line (from (50, 280) to (320, 60)) -->
      <line x1="50" y1="280" x2="320" y2="60" stroke="#059669" stroke-width="3"/>
      <rect x="130" y="145" width="130" height="20" rx="2" fill="#D1FAE5"/>
      <text x="195" y="159" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Memory Bus: 3.35 TB/s</text>

      <!-- Roofline Knee Dashed Line -->
      <line x1="320" y1="60" x2="320" y2="290" stroke="#94A3B8" stroke-dasharray="3,3" stroke-width="1.2"/>

      <!-- Memory-Bound Shaded Region -->
      <polygon points="50,290 50,280 320,60 320,290" fill="#FEF2F2" opacity="0.6"/>
      <text x="140" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#BE123C">Memory-Bandwidth Bound</text>
      <text x="140" y="265" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#E11D48">(Autoregressive Decode Zone)</text>

      <!-- Plotted Points -->
      <!-- MHA Point (I ≈ 0.8, y ≈ 222) -->
      <circle cx="115" cy="227" r="5" fill="#E11D48"/>
      <text x="125" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9F1239">MHA (0.8 FLOP/B)</text>
      <text x="125" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#BE123C">2.68 TFLOP/s (&lt;0.3% duty)</text>

      <!-- GQA Point (I ≈ 2.4, y ≈ 188) -->
      <circle cx="150" cy="198" r="5" fill="#4F46E5"/>
      <text x="160" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#312E81">GQA (2.4 FLOP/B)</text>
      <text x="160" y="207" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#4338CA">8.04 TFLOP/s (0.8% duty)</text>

      <!-- MLA Point (I ≈ 3.6, y ≈ 172) -->
      <circle cx="175" cy="178" r="6" fill="#059669"/>
      <text x="185" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#065F46">MLA (3.6 FLOP/B)</text>
      <text x="185" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#047857">12.06 TFLOP/s (1.2% duty)</text>
    </g>

    <!-- Roofline Implication Explanation -->
    <g transform="translate(20, 410)">
      <rect width="500" height="140" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">The Hardware Reality of Autoregressive Decoding</text>
      <text x="14" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Single-token decode operates strictly along the memory-bandwidth slope.</text>
      <text x="14" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Modern tensor cores run at &lt; 1.5% duty cycle during single-batch decode.</text>
      <text x="14" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Compressing KV cache raises operational intensity and slashes memory bus traffic.</text>
      <text x="14" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• B_max is bounded by memory capacity: B_max = ⌊(C_HBM - M_weights) / M_KV⌋.</text>
      
      <rect x="14" y="104" width="472" height="24" rx="2" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="250" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#312E81" text-anchor="middle">Key Rule: Concurrency is the ONLY way to move rightward toward the Roofline Knee</text>
    </g>
  </g>

  <!-- Panel 2: Concurrency & Infrastructure Economics (Right, x=610, width=545) -->
  <g transform="translate(610, 75)">
    <rect width="545" height="570" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="545" height="42" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="15" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">2. Multi-Agent Serving Concurrency Comparison</text>

    <!-- Case 1: Single 80 GB GPU Limits -->
    <g transform="translate(20, 56)">
      <rect width="505" height="150" rx="2" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1.2"/>
      <text x="14" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9F1239">Single 80 GB H100 GPU (70B Model in FP8, 128k Context)</text>
      <text x="14" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Weights = 70 GB | Remaining Free Memory for KV Cache = 10 GB</text>

      <g transform="translate(14, 52)">
        <!-- GQA Failure Bar -->
        <rect x="0" y="0" width="475" height="36" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
        <text x="12" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9F1239">GQA (1 Stream = 21.47 GB):</text>
        <text x="12" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#BE123C">Demands 21.47 GB &gt; 10 GB Free Capacity</text>
        <rect x="350" y="6" width="115" height="24" rx="2" fill="#E11D48"/>
        <text x="407" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 STREAMS (OOM)</text>

        <!-- MLA Success Bar -->
        <rect x="0" y="44" width="475" height="36" rx="2" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
        <text x="12" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#065F46">MLA (1 Stream = 4.53 GB):</text>
        <text x="12" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#047857">Demands 4.53 GB per stream into 10 GB</text>
        <rect x="350" y="50" width="115" height="24" rx="2" fill="#059669"/>
        <text x="407" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 STREAMS (PASS)</text>
      </g>
    </g>

    <!-- Case 2: Dual GPU Node Concurrency Scaling -->
    <g transform="translate(20, 220)">
      <rect width="505" height="195" rx="2" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
      <text x="14" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#312E81">Dual GPU Node (160 GB HBM3, 90 GB Free Memory)</text>
      <text x="14" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">Weights = 70 GB (TP=2) | Remaining Free Memory for KV Cache = 90 GB</text>

      <g transform="translate(14, 52)">
        <!-- GQA Bar -->
        <text x="0" y="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Grouped-Query Attention (GQA): 4 Streams</text>
        <rect x="0" y="20" width="475" height="28" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
        <rect x="0" y="20" width="100" height="28" rx="2" fill="#64748B"/>
        <text x="50" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 Streams</text>
        <text x="110" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569">B_max = ⌊90 / 21.47⌋ = 4 concurrent agents</text>

        <!-- MLA Bar -->
        <text x="0" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Multi-Head Latent Attention (MLA): 19 Streams (4.75× Density!)</text>
        <rect x="0" y="74" width="475" height="28" rx="2" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
        <rect x="0" y="74" width="475" height="28" rx="2" fill="#059669"/>
        <text x="237" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">19 Concurrent Agent Streams (B_max = ⌊90 / 4.53⌋ = 19)</text>
      </g>

      <!-- Multiplier Badge -->
      <g transform="translate(14, 162)">
        <rect width="475" height="24" rx="2" fill="#1E1B4B"/>
        <text x="237" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">4.75× Concurrency Multiplier on Identical Physical Hardware</text>
      </g>
    </g>

    <!-- Capital Economics Takeaway -->
    <g transform="translate(20, 430)">
      <rect width="505" height="120" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Infrastructure Cost &amp; Capex Implication</text>
      <text x="14" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• To host 100 concurrent 128k agent streams under standard GQA requires</text>
      <text x="14" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">  25 dual-GPU nodes (50× H100 GPUs ≈ $1.5M in capital equipment).</text>
      <text x="14" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">• Under MLA, the exact same 100-stream workload is served by just 6 nodes</text>
      <text x="14" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">  (12× H100 GPUs ≈ $360k) — saving over $1.1M in server infrastructure.</text>
      <text x="14" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#059669">Conclusion: KV Compression Directly Dictates Agent Production Economics</text>
    </g>
  </g>
</svg>
