<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="1160" height="640" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">ACCELERATOR ROOFLINE MODEL &amp; CONCURRENT AGENT SERVING CAPACITY</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Operational intensity, memory bandwidth ceilings, and multi-agent concurrency limits on NVIDIA H100 SXM5</text>

  <!-- ================================================================= -->
  <!-- PANEL 1: ACCELERATOR ROOFLINE MODEL (LEFT)                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="545" height="565" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="545" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">1. NVIDIA H100 SXM5 DECODE ROOFLINE</text>

    <!-- Roofline Log-Log Chart -->
    <g transform="translate(15, 34)">
      <rect width="515" height="340" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Chart Axes -->
      <line x1="50" y1="290" x2="480" y2="290" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="50" y1="290" x2="50" y2="25" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="480" y="306" font-size="8" fill="#64748b" text-anchor="end">Operational Intensity (FLOPs / Byte)</text>
      <text x="45" y="20" font-size="8" fill="#64748b" text-anchor="end">Perf (TFLOP/s)</text>

      <!-- Grid Ticks (Log Scale Simulation) -->
      <text x="50" y="302" font-size="7.5" fill="#64748b" text-anchor="middle">0.1</text>
      <text x="130" y="302" font-size="7.5" fill="#64748b" text-anchor="middle">1.0</text>
      <text x="210" y="302" font-size="7.5" fill="#64748b" text-anchor="middle">10</text>
      <text x="320" y="302" font-size="7.5" font-weight="700" fill="#0f172a" text-anchor="middle">295 (Knee)</text>
      <text x="450" y="302" font-size="7.5" fill="#64748b" text-anchor="middle">1,000</text>

      <text x="42" y="275" font-size="7.5" fill="#64748b" text-anchor="end">1</text>
      <text x="42" y="210" font-size="7.5" fill="#64748b" text-anchor="end">10</text>
      <text x="42" y="140" font-size="7.5" fill="#64748b" text-anchor="end">100</text>
      <text x="42" y="65" font-size="7.5" fill="#64748b" text-anchor="end">989</text>

      <!-- Compute Ceiling (Horizontal Line at y=60) -->
      <line x1="320" y1="60" x2="475" y2="60" stroke="#0284c7" stroke-width="2.5"/>
      <rect x="330" y="40" width="140" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="400" y="52" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">Compute Ceiling: 989 TFLOP/s (FP8)</text>

      <!-- Memory Bandwidth Slanted Line -->
      <line x1="50" y1="280" x2="320" y2="60" stroke="#16a34a" stroke-width="2.5"/>
      <rect x="130" y="140" width="130" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="195" y="154" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Memory Bus: 3.35 TB/s (HBM3)</text>

      <!-- Roofline Knee Dashed Line -->
      <line x1="320" y1="60" x2="320" y2="290" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Memory-Bound Shaded Region -->
      <polygon points="50,290 50,280 320,60 320,290" fill="#fee2e2" opacity="0.4"/>
      <text x="140" y="245" font-size="10" font-weight="700" fill="#991b1b">Memory-Bandwidth Bound</text>
      <text x="140" y="260" font-size="8" fill="#dc2626">(Autoregressive Decode Zone)</text>

      <!-- Plotted Points -->
      <!-- MHA Point -->
      <circle cx="115" cy="227" r="4" fill="#dc2626"/>
      <text x="125" y="222" font-size="8" font-weight="700" fill="#991b1b">MHA (0.8 FLOP/B)</text>
      <text x="125" y="234" font-size="7" fill="#dc2626">2.68 TFLOP/s (&lt;0.3% duty cycle)</text>

      <!-- GQA Point -->
      <circle cx="150" cy="198" r="4" fill="#0284c7"/>
      <text x="160" y="195" font-size="8" font-weight="700" fill="#0369a1">GQA (2.4 FLOP/B)</text>
      <text x="160" y="207" font-size="7" fill="#0284c7">8.04 TFLOP/s (0.8% duty cycle)</text>

      <!-- MLA Point -->
      <circle cx="175" cy="178" r="5" fill="#16a34a"/>
      <text x="185" y="172" font-size="8.5" font-weight="700" fill="#15803d">MLA (3.6 FLOP/B)</text>
      <text x="185" y="184" font-size="7" fill="#16a34a">12.06 TFLOP/s (1.2% duty cycle)</text>
    </g>

    <!-- Roofline Implication Explanation -->
    <g transform="translate(15, 388)">
      <rect width="515" height="162" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" font-size="8.5" font-weight="700" fill="#0f172a">The Hardware Reality of Autoregressive Decoding</text>

      <g transform="translate(14, 30)">
        <text x="0" y="12" font-size="7.5" fill="#475569">• Single-token decode operates strictly along the memory-bandwidth slope.</text>
        <text x="0" y="26" font-size="7.5" fill="#475569">• Modern tensor cores run at &lt; 1.5% duty cycle during single-batch decode.</text>
        <text x="0" y="40" font-size="7.5" fill="#475569">• Compressing KV cache raises operational intensity and slashes memory bus traffic.</text>
        <text x="0" y="54" font-size="7.5" fill="#475569">• Maximum batch size B_max is strictly capacity-bounded: B_max = ⌊(C_HBM - M_weights) / M_KV⌋.</text>

        <rect x="0" y="72" width="487" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="243" y="90" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">Key Rule: Concurrency is the ONLY way to move rightward toward the Roofline Knee</text>
        <text x="243" y="104" font-size="7.5" fill="#0284c7" text-anchor="middle">Batching multiple concurrent agent streams amortizes weight loading and unlocks tensor compute</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: CONCURRENCY & INFRASTRUCTURE ECONOMICS (RIGHT)           -->
  <!-- ================================================================= -->
  <g transform="translate(615, 75)">
    <rect x="0" y="0" width="545" height="565" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="545" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">2. MULTI-AGENT SERVING CONCURRENCY COMPARISON</text>

    <!-- Case 1: Single 80 GB GPU Limits -->
    <g transform="translate(15, 34)">
      <rect width="515" height="154" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="14" y="20" font-size="8.5" font-weight="700" fill="#991b1b">Single 80 GB H100 GPU (70B Model in FP8, 128k Context)</text>
      <text x="14" y="34" font-size="7.5" fill="#7f1d1d">Weights = 70 GB | Remaining Free Memory for KV Cache = 10 GB</text>

      <g transform="translate(14, 46)">
        <!-- GQA Failure Bar -->
        <rect x="0" y="0" width="487" height="38" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">GQA (1 Stream = 21.47 GB):</text>
        <text x="10" y="28" font-size="7.5" fill="#dc2626">Demands 21.47 GB &gt; 10 GB Free Capacity</text>
        <rect x="360" y="7" width="117" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="418" y="23" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">0 STREAMS (OOM)</text>

        <!-- MLA Success Bar -->
        <rect x="0" y="46" width="487" height="38" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="10" y="16+46" font-size="8" font-weight="700" fill="#15803d">MLA (1 Stream = 4.53 GB):</text>
        <text x="10" y="28+46" font-size="7.5" fill="#166534">Demands 4.53 GB per stream into 10 GB</text>
        <rect x="360" y="53" width="117" height="24" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="418" y="69" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">2 STREAMS (PASS)</text>
      </g>
    </g>

    <!-- Case 2: Dual GPU Node Concurrency Scaling -->
    <g transform="translate(15, 202)">
      <rect width="515" height="198" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="14" y="20" font-size="8.5" font-weight="700" fill="#15803d">Dual GPU Node (160 GB HBM3, 90 GB Free Memory)</text>
      <text x="14" y="34" font-size="7.5" fill="#166534">Weights = 70 GB (TP=2) | Remaining Free Memory for KV Cache = 90 GB</text>

      <g transform="translate(14, 46)">
        <!-- GQA Bar -->
        <text x="0" y="12" font-size="8" font-weight="700" fill="#334155">Grouped-Query Attention (GQA): 4 Streams</text>
        <rect x="0" y="18" width="487" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="18" width="102" height="26" rx="1" fill="#64748b"/>
        <text x="51" y="35" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">4 Streams</text>
        <text x="112" y="35" font-size="7.5" fill="#475569">B_max = ⌊90 / 21.47⌋ = 4 concurrent agents</text>

        <!-- MLA Bar -->
        <text x="0" y="64" font-size="8" font-weight="700" fill="#15803d">Multi-Head Latent Attention (MLA): 19 Streams (4.75× Density!)</text>
        <rect x="0" y="70" width="487" height="26" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <rect x="0" y="70" width="487" height="26" rx="1" fill="#16a34a"/>
        <text x="243" y="87" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">19 Concurrent Agent Streams (B_max = ⌊90 / 4.53⌋ = 19)</text>

        <!-- Multiplier Badge -->
        <rect x="0" y="108" width="487" height="28" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="243" y="126" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">4.75× Concurrency Multiplier on Identical Physical Hardware</text>
      </g>
    </g>

    <!-- Capital Economics Takeaway -->
    <g transform="translate(15, 414)">
      <rect width="515" height="136" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Infrastructure Cost &amp; Capex Implication</text>

      <g transform="translate(14, 30)">
        <text x="0" y="12" font-size="7.5" fill="#475569">• To host 100 concurrent 128k agent streams under standard GQA requires</text>
        <text x="0" y="24" font-size="7.5" fill="#475569">  25 dual-GPU nodes (50× H100 GPUs ≈ $1.5M in capital equipment).</text>
        <text x="0" y="42" font-size="7.5" fill="#475569">• Under MLA, the exact same 100-stream workload is served by just 6 nodes</text>
        <text x="0" y="54" font-size="7.5" fill="#475569">  (12× H100 GPUs ≈ $360k) — saving over $1.1M in server infrastructure.</text>

        <rect x="0" y="68" width="487" height="26" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="243" y="85" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Conclusion: KV Compression Directly Dictates Agent Production Economics</text>
      </g>
    </g>
  </g>
</svg>
