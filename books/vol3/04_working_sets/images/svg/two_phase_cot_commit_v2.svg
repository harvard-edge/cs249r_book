<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="tpc-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
    <marker id="tpc-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="tpc-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
    <marker id="tpc-arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.2">TWO-PHASE COMMIT (2PC) CONTEXT COMPACTION &amp; RADIX RECLAMATION</text>
    <text x="0" y="15" font-size="10" font-weight="400" fill="#475569">Lifecycle of Ephemeral Chain-of-Thought Scratchpads Across Deliberation, Commit, and Virtual Memory Eviction</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3-PANEL SYSTEM LIFECYCLE                                                  -->
  <!-- ========================================================================= -->

  <!-- Panel 1: Phase 1 Proposal (Ephemeral Deliberation) -->
  <g transform="translate(40, 62)">
    <rect width="300" height="424" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="300" height="28" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="18" font-size="9.5" font-weight="700" fill="#334155">1. PHASE 1: EPHEMERAL PROPOSAL</text>

    <!-- Context Buffer Layout -->
    <g transform="translate(16, 40)">
      <!-- Pinned Prefix Segment -->
      <g transform="translate(0, 0)">
        <rect width="268" height="50" rx="2" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F172A">Pinned Trajectory Prefix: tau_(t-1)</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">System Prompt + Tool Schemas + History</text>
        <rect x="194" y="8" width="64" height="16" rx="2" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1"/>
        <text x="226" y="19" text-anchor="middle" font-size="7" font-weight="700" fill="#475569">PINNED HBM</text>
      </g>

      <!-- Autoregressive Generation Datapath -->
      <line x1="134" y1="50" x2="134" y2="70" stroke="#581C87" stroke-width="1.2" marker-end="url(#tpc-arr-amethyst)"/>

      <!-- Ephemeral Scratchpad Segment -->
      <g transform="translate(0, 72)">
        <rect width="268" height="68" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4" stroke-dasharray="4 2"/>
        <text x="12" y="18" font-size="8.5" font-weight="700" fill="#581C87">Reasoning Scratchpad z_t</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#581C87">&lt;thought&gt; Multi-step CoT derivation ...&lt;/thought&gt;</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Volume: 2,000 - 6,000 ephemeral tokens</text>
        <rect x="180" y="8" width="78" height="16" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1"/>
        <text x="219" y="19" text-anchor="middle" font-size="7" font-weight="700" fill="#581C87">ACTIVE DECODE</text>
      </g>

      <!-- Action Generation Datapath -->
      <line x1="134" y1="140" x2="134" y2="158" stroke="#0F766E" stroke-width="1.2" marker-end="url(#tpc-arr-teal)"/>

      <!-- Proposed Tool Action Segment -->
      <g transform="translate(0, 160)">
        <rect width="268" height="46" rx="2" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F766E">Action Proposal: a_t ~ pi</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">&lt;call:patch_file&gt;{"diff": ...}&lt;/call&gt;</text>
      </g>
    </g>

    <!-- Phase 1 System State Summary -->
    <g transform="translate(16, 280)">
      <rect width="268" height="128" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#475569">MEMORY RESIDENCY</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Transient Allocation Pool</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#475569">RADIX NODE STATUS</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Active Child Branch v_scratch</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#475569">TOKEN OVERHEAD</text>
        <text x="0" y="82" font-size="8.5" font-family="ui-monospace, monospace" fill="#991B1B">+4,000 tokens in-flight</text>

        <text x="0" y="100" font-size="7.5" font-style="italic" fill="#64748B">Deliberative capacity maximized.</text>
      </g>
    </g>
  </g>

  <!-- Panel 2: Phase 2 Commit (Sandbox & Context Excision) -->
  <g transform="translate(370, 62)">
    <rect width="300" height="424" rx="3" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
    <rect width="300" height="28" rx="3" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
    <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0F766E">2. PHASE 2: CANONICAL COMMIT</text>

    <!-- Actuation & Pruning Datapath -->
    <g transform="translate(16, 40)">
      <!-- Sandbox Execution Block -->
      <g transform="translate(0, 0)">
        <rect width="268" height="56" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#0F172A">Isolated Sandbox Execution (Env E)</text>
        <text x="12" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Execute a_t → Exit code 0, test output</text>
        <text x="12" y="46" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Observation captured: o_t</text>
      </g>

      <!-- Downward Intercept Line -->
      <line x1="134" y1="56" x2="134" y2="76" stroke="#991B1B" stroke-width="1.2" marker-end="url(#tpc-arr-red)"/>

      <!-- Purged Scratchpad Block (Red Strikethrough Box) -->
      <g transform="translate(0, 78)">
        <rect width="268" height="54" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="12" y="20" font-size="9" font-weight="700" fill="#991B1B">Ephemeral Scratchpad z_t</text>
        <text x="12" y="36" font-size="8" font-family="ui-monospace, monospace" fill="#991B1B">Purged from Context Ledger (Omitted)</text>
        <!-- Strikethrough line across block -->
        <line x1="10" y1="28" x2="258" y2="28" stroke="#991B1B" stroke-width="1.5"/>
      </g>

      <!-- Promotion to Persistent Context -->
      <line x1="134" y1="132" x2="134" y2="152" stroke="#0F766E" stroke-width="1.2" marker-end="url(#tpc-arr-teal)"/>

      <!-- Canonical Committed Transition -->
      <g transform="translate(0, 154)">
        <rect width="268" height="52" rx="2" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.4"/>
        <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0F766E">Committed State: tau_t = tau_(t-1) o (a_t, o_t)</text>
        <text x="12" y="34" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">Lean Canonical Trace (150 tokens)</text>
      </g>
    </g>

    <!-- Phase 2 System State Summary -->
    <g transform="translate(16, 280)">
      <rect width="268" height="128" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#475569">PERSISTENT WORKING SET</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">Appended (a_t, o_t) Strictly</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#475569">EXCISION RATIO</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">85% - 95% Token Bloat Eliminated</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#475569">PROMPT CONSTRUCTION t+1</text>
        <text x="0" y="82" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">Omit &lt;thought&gt; block completely</text>

        <text x="0" y="100" font-size="7.5" font-style="italic" fill="#64748B">Zero cognitive noise propagated forward.</text>
      </g>
    </g>
  </g>

  <!-- Panel 3: Radix Tree Virtual Memory Reclamation -->
  <g transform="translate(700, 62)">
    <rect width="300" height="424" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.4"/>
    <rect width="300" height="28" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
    <text x="12" y="18" font-size="9.5" font-weight="700" fill="#581C87">3. RADIX CACHE RECLAMATION</text>

    <!-- Radix Tree Memory Datapath -->
    <g transform="translate(16, 40)">
      <!-- Root Prefix Node -->
      <g transform="translate(44, 0)">
        <rect width="180" height="44" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
        <text x="90" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Prefix Node: tau_(t-1)</text>
        <text x="90" y="32" text-anchor="middle" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">100% Cache Hit (0 Prefill FLOPs)</text>
      </g>

      <!-- Bifurcation in Radix Tree -->
      <!-- Left branch: Abandoned scratchpad -->
      <path d="M84,44 L84,70 L34,70 L34,92" fill="none" stroke="#991B1B" stroke-width="1.4" marker-end="url(#tpc-arr-red)"/>
      <!-- Right branch: Active commit -->
      <path d="M184,44 L184,70 L234,70 L234,92" fill="none" stroke="#0F766E" stroke-width="1.4" marker-end="url(#tpc-arr-teal)"/>

      <!-- Abandoned Node (LRU Reclaimed) -->
      <g transform="translate(0, 94)">
        <rect width="128" height="76" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991B1B">Branch: &lt;thought&gt; z_t</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">C_ref = 0 (Unreferenced)</text>
        <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Physical KV Blocks:</text>
        <rect x="10" y="52" width="108" height="16" rx="1" fill="#FFFFFF" stroke="#991B1B" stroke-width="1"/>
        <text x="64" y="63" text-anchor="middle" font-size="7" font-weight="700" fill="#991B1B">LRU EVICTED</text>
      </g>

      <!-- Committed Suffix Node -->
      <g transform="translate(140, 94)">
        <rect width="128" height="76" rx="2" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#0F766E">Branch: (a_t, o_t)</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">C_ref = 1 (Active)</text>
        <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Physical KV Blocks:</text>
        <rect x="10" y="52" width="108" height="16" rx="1" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
        <text x="64" y="63" text-anchor="middle" font-size="7" font-weight="700" fill="#0F766E">ALLOCATED HBM</text>
      </g>

      <!-- Physical Memory Footprint Banner -->
      <g transform="translate(0, 182)">
        <rect width="268" height="34" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
        <text x="134" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#581C87">MEMORY COMPRESSION GAIN</text>
        <text x="134" y="27" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#0F766E">60x Reduction (57.6 GB → 0.96 GB)</text>
      </g>
    </g>

    <!-- Radix Architecture Metrics Summary -->
    <g transform="translate(16, 280)">
      <rect width="268" height="128" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#581C87">PREFIX CACHE HIT RATE</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">100% Reuse on Shared Trunk</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#581C87">GPU HBM SAVINGS (50 TURNS)</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F172A">32 GB (Uncompacted) → 2.4 GB</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#581C87">PAGE RECLAMATION LATENCY</text>
        <text x="0" y="82" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">Zero Overhead (Async Kernel Free)</text>

        <text x="0" y="100" font-size="7.5" font-style="italic" fill="#64748B">RadixAttention garbage collection.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Invariant Banner -->
  <g transform="translate(40, 498)">
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0F172A">THE 2PC CONTEXT INVARIANT:</text>
    <text x="160" y="12" font-size="8.5" font-style="italic" fill="#334155">"Reasoning tokens are transient scratchpads. By omitting thought blocks on turn t+1, systems preserve 100% prefix reuse while reclaiming GPU HBM."</text>
  </g>

</svg>
