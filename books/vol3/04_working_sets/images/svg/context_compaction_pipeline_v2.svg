      <text x="10" y="42" font-size="7" font-family="ui-monospace, monospace" fill="#0F172A">goal: "Migrate pool to async driver"</text>
      <text x="10" y="54" font-size="7" font-family="ui-monospace, monospace" fill="#0F766E">hypotheses: [H1: CONFIRMED]</text>
      <text x="10" y="16" font-size="7" font-family="ui-monospace, monospace" fill="#475569">mutated: ["src/db/pool.py:acquire"]</text>
      <text x="10" y="30" font-size="7" font-family="ui-monospace, monospace" fill="#166534">tests_passing: 42 / 42 (100%)</text>

