    <text x="260" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#475569">──[Log/Diff]──&gt;</text>
    <text x="390" y="12" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0F766E">24k tokens</text>
    <text x="495" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#475569">──[AST Skeleton]──&gt;</text>
    <text x="655" y="12" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0F766E">6k tokens</text>
    <text x="745" y="12" font-size="8" font-family="ui-monospace, monospace" fill="#475569">──[State Ledger]──&gt;</text>
    <text x="895" y="12" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#166534">1.2k tokens (99.1%)</text>
