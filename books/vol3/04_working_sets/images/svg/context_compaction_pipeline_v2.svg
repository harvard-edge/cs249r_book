        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">User Constraint Set I_spec:</text>
        <text x="10" y="44" font-size="7" font-family="ui-monospace, monospace" fill="#0F172A">• Zero Breaking Public API Changes</text>
        <text x="10" y="56" font-size="7" font-family="ui-monospace, monospace" fill="#0F172A">• Python 3.10+ Asyncio Invariant</text>
        <text x="10" y="18" font-size="7" font-style="italic" fill="#581C87">Permanently protected against drift</text>
