        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">1,200 tokens (99.1% Compaction)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#581C87">COMPACTION RATIO</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#0F766E">106.7× Global Reduction</text>

        <text x="0" y="18" font-size="8" font-weight="700" fill="#581C87">DRIFT RESISTANCE</text>
        <text x="0" y="32" font-size="8.5" font-family="ui-monospace, monospace" fill="#166534">Invariant Enclosure Enforced</text>

        <text x="0" y="54" font-size="7.5" font-style="italic" fill="#581C87">Autonomous multi-week survival.</text>
