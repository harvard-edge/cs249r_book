    <rect width="220" height="28" rx="3" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="18" font-size="9.5" font-weight="700" fill="#991B1B">1. RAW TRAJECTORY INGESTION</text>

    <!-- Schematic: Raw Trajectory Bloat -->
    <g transform="translate(14, 40)">
      <!-- Unfiltered Stream Card -->
      <rect width="192" height="60" rx="2" fill="#F8FAFC" stroke="#991B1B" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991B1B">Verbose Tool Logs</text>
      <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">stdout/stderr stacktraces</text>
      <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">8,000+ tokens per failure</text>

      <!-- Raw File Payloads -->
      <g transform="translate(0, 18)">
        <rect width="192" height="60" rx="2" fill="#F8FAFC" stroke="#991B1B" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991B1B">Raw Source Payloads</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Full files dumped for edits</text>
        <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">20,000+ tokens per file</text>
