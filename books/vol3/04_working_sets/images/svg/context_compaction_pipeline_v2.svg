      <text x="10" y="46" font-size="7.5" font-family="ui-monospace, monospace" fill="#991B1B">Grep: FAIL|ERROR|Exception</text>
      <text x="10" y="60" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">Keep: Tail 25 lines (Exit)</text>
      <text x="10" y="24" font-size="7.5" font-style="italic" fill="#64748B">[... 4,200 lines omitted ...]</text>

