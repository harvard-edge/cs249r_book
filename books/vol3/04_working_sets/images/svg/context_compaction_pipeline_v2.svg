        <rect width="192" height="50" rx="2" fill="#F8FAFC" stroke="#991B1B" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991B1B">Conversational Scaffolding</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Multi-turn natural dialogue</text>
      </g>
