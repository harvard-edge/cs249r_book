        <text x="10" y="32" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Purge raw file contents</text>
        <text x="10" y="46" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">Replace with git diff -U3</text>
        <text x="10" y="60" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">2,000 LOC → 12 LOC patch</text>
        <text x="10" y="24" font-size="7.5" font-weight="700" fill="#0F766E">98% File Delta Compaction</text>
