<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: UNMANAGED APPEND-ONLY TRAJECTORY                      -->
  <!-- ================================================================= -->
  <g transform="translate(30, 24)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="555" height="472" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="555" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#0f172a">Unmanaged Append-Only Trajectory</text>
    <text x="538" y="23" text-anchor="end" font-size="9.5" font-family="ui-monospace, monospace" fill="#dc2626">Anti-Pattern: Context Sprawl</text>

    <!-- Subplot: Growth Curve -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="523" height="236" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#334155">Trajectory Accumulation vs. Accelerator Limits</text>

      <!-- Axes -->
      <line x1="55" y1="190" x2="495" y2="190" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="55" y1="190" x2="55" y2="35" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="495" y="206" font-size="9" fill="#64748b" text-anchor="end">Execution Turn Index (t)</text>
      <text x="50" y="28" font-size="9" fill="#64748b" text-anchor="end">Tokens (L)</text>

      <!-- Grid Ticks and Values -->
      <line x1="50" y1="150" x2="485" y2="150" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="50" y1="110" x2="485" y2="110" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="50" y1="70" x2="485" y2="70" stroke="#f1f5f9" stroke-width="1"/>
      <text x="46" y="153" font-size="9" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">32k</text>
      <text x="46" y="113" font-size="9" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">64k</text>
      <text x="46" y="73" font-size="9" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">128k</text>

      <!-- Hardware Capacity Ceiling -->
      <line x1="55" y1="68" x2="485" y2="68" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.4"/>
      <rect x="290" y="54" width="190" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="385" y="68" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Nominal Context Cap S_max (128k)</text>

      <!-- Growth Trajectory Curve -->
      <path d="M 55 186 C 160 182, 230 170, 290 135 C 350 100, 420 80, 470 69" fill="none" stroke="#dc2626" stroke-width="2.4"/>
      <circle cx="470" cy="69" r="4.5" fill="#dc2626"/>

      <!-- Annotations for Bursts -->
      <g transform="translate(130, 84)">
        <rect x="0" y="0" width="145" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="72" y="14" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Raw Tool Outputs</text>
        <text x="72" y="26" font-size="8" font-family="ui-monospace, monospace" fill="#b91c1c" text-anchor="middle">+15,000 toks / build log</text>
      </g>
    </g>

    <!-- Failure Mechanisms Breakdown -->
    <g transform="translate(16, 296)">
      <!-- Item 1: Quadratic Prefill -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="523" height="48" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="17" font-size="9.5" font-weight="700" fill="#991b1b">Quadratic Prefill Compute Wall</text>
        <text x="12" y="33" font-size="8.5" fill="#475569">O(L²) attention · TTFT 280 ms to 6.5 s</text>
      </g>

      <!-- Item 2: Memory Bandwidth Saturation -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="523" height="48" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="17" font-size="9.5" font-weight="700" fill="#991b1b">HBM Memory Bandwidth Saturation</text>
        <text x="12" y="33" font-size="8.5" fill="#475569">Whole KV cache streamed per token</text>
      </g>

      <!-- Item 3: Attentional Dispersion -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="523" height="48" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
        <text x="12" y="17" font-size="9.5" font-weight="700" fill="#991b1b">Attentional Dispersion &amp; Lost-in-the-Middle Decay</text>
        <text x="12" y="33" font-size="8.5" fill="#7f1d1d">Softmax dilution swamps the target</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: MANAGED CONTEXT WORKING SET W(t)                     -->
  <!-- ================================================================= -->
  <g transform="translate(615, 24)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="555" height="472" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="555" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#0f172a">Managed Context Working Set W(t)</text>
    <text x="538" y="23" text-anchor="end" font-size="9.5" font-family="ui-monospace, monospace" fill="#16a34a">Runtime Principle: Bounded Context</text>

    <!-- Architecture Schematic -->
    <g transform="translate(16, 48)">
      <!-- Tier 1: Pinned Root Invariants -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="523" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="8" y="8" width="90" height="36" rx="2" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
        <text x="53" y="22" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">Pinned Root</text>
        <text x="53" y="35" font-size="8" font-family="ui-monospace, monospace" fill="#7c3aed" text-anchor="middle">[0, L_root]</text>

        <text x="110" y="22" font-size="9.5" font-weight="700" fill="#0f172a">System Invariants &amp; Tool Contracts</text>
        <text x="110" y="36" font-size="8.5" fill="#475569">Immutable supervisory directives, MCP interface schemas (Zero-eviction prefix hit)</text>
      </g>

      <!-- Tier 2: Dynamic Working Set Window -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="523" height="114" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="8" y="8" width="90" height="98" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="53" y="36" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">W(t)</text>
        <text x="53" y="50" font-size="8" fill="#047857" text-anchor="middle">Active Window</text>
        <text x="53" y="64" font-size="8" font-family="ui-monospace, monospace" fill="#065f46" text-anchor="middle">|W| ≤ M*</text>
        <text x="53" y="86" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">Budget Bounded</text>

        <text x="110" y="23" font-size="9.5" font-weight="700" fill="#0f172a">Dynamic Working Set Window (|W(t)| ≤ M*)</text>

        <!-- Sub-blocks -->
        <g transform="translate(110, 32)">
          <!-- Block 1: Active Turn -->
          <rect x="0" y="0" width="126" height="68" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="63" y="16" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Active Turn (t)</text>
          <text x="63" y="29" font-size="8" fill="#475569" text-anchor="middle">Observation state</text>
          <text x="63" y="41" font-size="8" fill="#475569" text-anchor="middle">AST diff hunk</text>
          <text x="63" y="55" font-size="7.5" font-family="ui-monospace, monospace" fill="#16a34a" text-anchor="middle">Current execution</text>

          <!-- Block 2: Recent Context -->
          <rect x="136" y="0" width="126" height="68" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="199" y="16" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Recent Context (Δt)</text>
          <text x="199" y="29" font-size="8" fill="#475569" text-anchor="middle">Sliding window</text>
          <text x="199" y="41" font-size="8" fill="#475569" text-anchor="middle">k immediate turns</text>
          <text x="199" y="55" font-size="7.5" font-family="ui-monospace, monospace" fill="#2563eb" text-anchor="middle">Local conversation</text>

          <!-- Block 3: Ephemeral CoT -->
          <rect x="272" y="0" width="131" height="68" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="337" y="16" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Ephemeral CoT</text>
          <text x="337" y="29" font-size="8" fill="#475569" text-anchor="middle">Scratchpad tokens</text>
          <text x="337" y="41" font-size="8" fill="#475569" text-anchor="middle">pruned post-action</text>
          <text x="337" y="55" font-size="7.5" font-family="ui-monospace, monospace" fill="#7c3aed" text-anchor="middle">Two-phase lease</text>
        </g>
      </g>

      <!-- Eviction / Compaction Transition Line -->
      <g transform="translate(0, 182)">
        <line x1="8" y1="12" x2="515" y2="12" stroke="#7c3aed" stroke-dasharray="3,3" stroke-width="1.2"/>
        <rect x="150" y="2" width="223" height="20" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
        <text x="261" y="15" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">EVICTION &amp; COMPACTION GATE</text>
      </g>

      <!-- Tier 3: Structured State Ledger & Off-Context Store -->
      <g transform="translate(0, 212)">
        <rect x="0" y="0" width="523" height="68" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="8" y="8" width="90" height="52" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="53" y="24" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Host Archive</text>
        <text x="53" y="37" font-size="8" font-family="ui-monospace, monospace" fill="#b45309" text-anchor="middle">H_{1:t-1}</text>
        <text x="53" y="50" font-size="8" fill="#92400e" text-anchor="middle">Off-Context</text>

        <text x="110" y="23" font-size="9.5" font-weight="700" fill="#0f172a">Structured State Ledger &amp; Archival Storage</text>
        <text x="110" y="38" font-size="8.5" fill="#475569">Diff hunks · AST skeletons · episodic index</text>
        <text x="110" y="52" font-size="8" fill="#64748b">Provenance kept off the attention layers</text>
      </g>

      <!-- Systems Telemetry Row -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="523" height="64" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- Metric 1 -->
        <g transform="translate(20, 14)">
          <text x="60" y="16" font-size="13" font-weight="700" font-family="ui-monospace, monospace" fill="#065f46" text-anchor="middle">≤ TTFT_target</text>
          <text x="60" y="32" font-size="8.5" fill="#64748b" text-anchor="middle">Interactive Latency Budget</text>
        </g>
        <line x1="165" y1="12" x2="165" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Metric 2 -->
        <g transform="translate(180, 14)">
          <text x="80" y="16" font-size="13" font-weight="700" font-family="ui-monospace, monospace" fill="#1e40af" text-anchor="middle">Bounded O(M*)</text>
          <text x="80" y="32" font-size="8.5" fill="#64748b" text-anchor="middle">Physical KV Tensor Footprint</text>
        </g>
        <line x1="355" y1="12" x2="355" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Metric 3 -->
        <g transform="translate(370, 14)">
          <text x="70" y="16" font-size="13" font-weight="700" font-family="ui-monospace, monospace" fill="#7c3aed" text-anchor="middle">High Salience</text>
          <text x="70" y="32" font-size="8.5" fill="#64748b" text-anchor="middle">Invariant Instruction Recall</text>
        </g>
      </g>
    </g>
  </g>
</svg>