<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL 1: UNMANAGED CONTEXT ACCUMULATION (ANTI-PATTERN)            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="545" height="455" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="545" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">UNMANAGED APPEND-ONLY TRAJECTORY (Anti-Pattern)</text>

    <!-- Accumulation Curve Chart -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="515" height="230" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Trajectory Growth vs. Hardware Wall</text>

      <!-- Axes -->
      <line x1="50" y1="185" x2="490" y2="185" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="50" y1="185" x2="50" y2="30" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="490" y="200" font-size="8" fill="#64748b" text-anchor="end">Trajectory Steps (t)</text>
      <text x="44" y="24" font-size="8" fill="#64748b" text-anchor="end">Tokens</text>

      <!-- Grid ticks -->
      <line x1="46" y1="145" x2="480" y2="145" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="46" y1="95" x2="480" y2="95" stroke="#e2e8f0" stroke-width="1"/>
      <text x="42" y="148" font-size="7.5" fill="#64748b" text-anchor="end">32k</text>
      <text x="42" y="98" font-size="7.5" fill="#64748b" text-anchor="end">96k</text>
      <text x="42" y="48" font-size="7.5" fill="#64748b" text-anchor="end">128k</text>

      <!-- Danger Zone Ceiling -->
      <line x1="50" y1="52" x2="480" y2="52" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.5"/>
      <rect x="300" y="38" width="170" height="20" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="385" y="52" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">HBM Capacity / TTFT Wall (128k)</text>

      <!-- Token Growth Curve -->
      <path d="M 50 180 Q 200 170 290 125 T 465 54" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="465" cy="54" r="4" fill="#dc2626"/>

      <!-- Annotations -->
      <g transform="translate(110, 85)">
        <rect x="0" y="0" width="145" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="72" y="14" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Tool Output Bloat</text>
        <text x="72" y="26" font-size="7.5" fill="#dc2626" text-anchor="middle">+15,000 tokens / grep</text>
      </g>
    </g>

    <!-- Symptoms Breakdown -->
    <g transform="translate(15, 274)">
      <rect x="0" y="0" width="515" height="166" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Item 1 -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="491" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Quadratic Prefill &amp; TTFT Explosion</text>
        <text x="10" y="28" font-size="7.5" fill="#475569">Attention compute scales as O(L²). Prefill latency surges from 120ms to &gt;8.5s per turn.</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(12, 60)">
        <rect x="0" y="0" width="491" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Memory Wall Bottleneck during Decode</text>
        <text x="10" y="28" font-size="7.5" fill="#475569">Every token generation loads multi-GB KV cache from HBM (Operational intensity &lt;&lt; 1 FLOP/B).</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(12, 108)">
        <rect x="0" y="0" width="491" height="46" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">"Lost-in-the-Middle" Attention Dispersion</text>
        <text x="10" y="28" font-size="7.5" fill="#7f1d1d">Rotary position decay &amp; softmax dilution cause early instructions to be ignored;</text>
        <text x="10" y="39" font-size="7.5" fill="#7f1d1d">model suffers cognitive amnesia and hallucination cascades.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: MANAGED ACTIVE WORKING SET W(t, Δt)                      -->
  <!-- ================================================================= -->
  <g transform="translate(615, 75)">
    <rect x="0" y="0" width="545" height="455" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="545" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">ACTIVE CONTEXT WORKING SET W(t, Δt) (Bounded Architecture)</text>

    <!-- Working Set Architecture Diagram -->
    <g transform="translate(15, 34)">
      <!-- Tier 1: Fixed Anchor -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="515" height="54" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <rect x="10" y="10" width="75" height="34" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="47" y="24" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">L0 ANCHOR</text>
        <text x="47" y="36" font-size="7" fill="#7c3aed" text-anchor="middle">Pinned</text>

        <text x="95" y="22" font-size="8.5" font-weight="700" fill="#4c1d95">System Invariants &amp; Tool Contracts (Pinned L0)</text>
        <text x="95" y="38" font-size="7.5" fill="#6d28d9">Fixed instruction prefix, MCP schemas, security envelope (Zero-eviction policy)</text>
      </g>

      <!-- Dynamic Working Set Bracket -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="515" height="110" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <rect x="10" y="10" width="75" height="90" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="47" y="35" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">W(t, Δt)</text>
        <text x="47" y="50" font-size="7" fill="#166534" text-anchor="middle">Working</text>
        <text x="47" y="62" font-size="7" fill="#166534" text-anchor="middle">Window</text>
        <text x="47" y="80" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">≤ 32k toks</text>

        <text x="95" y="22" font-size="8.5" font-weight="700" fill="#14532d">Dynamic Working Set Window (Bounded Budget ≤ 32k)</text>

        <g transform="translate(95, 32)">
          <rect x="0" y="0" width="130" height="68" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
          <text x="65" y="16" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Active Turn (t)</text>
          <text x="65" y="30" font-size="7.5" fill="#166534" text-anchor="middle">Observation state,</text>
          <text x="65" y="42" font-size="7.5" fill="#166534" text-anchor="middle">diff &amp; live AST</text>
          <text x="65" y="56" font-size="7" fill="#64748b" text-anchor="middle">Immediate execution</text>

          <rect x="140" y="0" width="130" height="68" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
          <text x="205" y="16" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Recent Context (Δt)</text>
          <text x="205" y="30" font-size="7.5" fill="#166534" text-anchor="middle">Sliding window</text>
          <text x="205" y="42" font-size="7.5" fill="#166534" text-anchor="middle">k=4 immediate turns</text>
          <text x="205" y="56" font-size="7" fill="#64748b" text-anchor="middle">Local dialogue history</text>

          <rect x="280" y="0" width="130" height="68" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
          <text x="345" y="16" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Ephemeral CoT</text>
          <text x="345" y="30" font-size="7.5" fill="#166534" text-anchor="middle">Scratchpad tokens</text>
          <text x="345" y="42" font-size="7.5" fill="#166534" text-anchor="middle">pruned post-action</text>
          <text x="345" y="56" font-size="7" fill="#64748b" text-anchor="middle">Transient 2PC lease</text>
        </g>
      </g>

      <!-- Eviction / Compaction Boundary -->
      <g transform="translate(0, 180)">
        <line x1="10" y1="11" x2="505" y2="11" stroke="#7c3aed" stroke-dasharray="4,4" stroke-width="1.5"/>
        <rect x="175" y="0" width="165" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="257" y="15" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">EVICTION / COMPACTION GATE</text>
      </g>

      <!-- Tier 2: Compacted State & Off-Context Hierarchy -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="515" height="70" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <rect x="10" y="10" width="75" height="50" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="47" y="28" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">L2 / L3</text>
        <text x="47" y="42" font-size="7" fill="#d97706" text-anchor="middle">Episodic</text>

        <text x="95" y="22" font-size="8.5" font-weight="700" fill="#78350f">Structured Compaction &amp; Episodic Tier (L2 / L3)</text>
        <text x="95" y="38" font-size="7.5" fill="#92400e">Lossless git diffs, AST symbol summaries, episodic vector index (HNSW / SQLite)</text>
        <text x="95" y="52" font-size="7.5" fill="#b45309">Preserves decision state; prevents hallucination drift across 100+ steps.</text>
      </g>

      <!-- Metrics Callout Box -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="515" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

        <g transform="translate(45, 12)">
          <text x="45" y="16" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">≤ 180 ms</text>
          <text x="45" y="32" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">Constant TTFT</text>
        </g>

        <line x1="170" y1="10" x2="170" y2="50" stroke="#cbd5e1" stroke-width="1"/>

        <g transform="translate(210, 12)">
          <text x="45" y="16" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">O(1) Bounded</text>
          <text x="45" y="32" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">KV Memory Footprint</text>
        </g>

        <line x1="340" y1="10" x2="340" y2="50" stroke="#cbd5e1" stroke-width="1"/>

        <g transform="translate(385, 12)">
          <text x="45" y="16" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">99.4%</text>
          <text x="45" y="32" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">Instruction Recall</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 545)">
    <rect x="0" y="0" width="1120" height="80" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">SYSTEMS INVARIANT: THE CONTEXT WINDOW AS L1 CACHE</text>

    <!-- Inner Callout Card -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="130" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="18" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">SYSTEMS</text>
      <text x="65" y="32" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="middle">INVARIANT</text>
    </g>

    <g transform="translate(160, 32)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0f172a">Context Window is L1 Cache, Not Durable Storage</text>
      <text x="0" y="26" font-size="7.5" fill="#334155">Treating context as an unbounded log triggers quadratic prefill penalties and memory bandwidth saturation.</text>
      <text x="0" y="38" font-size="7.5" fill="#334155">Long trajectories require active working set management W(t, Δt): discard scratchpads, skeletonize payloads, and compact state.</text>
    </g>
  </g>
</g>
</svg>