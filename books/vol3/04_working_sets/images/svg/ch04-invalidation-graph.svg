<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="530" fill="#ffffff"/>

  <!-- Main Frame Card -->
  <rect x="20" y="16" width="1160" height="498" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ========================================================================= -->
  <!-- LEFT PARTITION: AUTHORITATIVE ENVIRONMENTAL STATE Ω_env                   -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 32)">
    <!-- Column Outer Box -->
    <rect width="360" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">Authoritative Environment (Ω_env)</text>
    <text x="346" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#475569">Physical Ground Truth</text>

    <!-- Entity 1: Modified Source File -->
    <g transform="translate(14, 48)">
      <rect width="332" height="74" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#991b1b">Entity E₁: Local Source File</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#dc2626">MUTATED (WAR)</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#7f1d1d">URI: file:///repo/src/network/buffer.c</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">v_env: (inode=89412, mtime=17:23:04.912)</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#dc2626">Hash: BLAKE3('...9b4f') != H(o₁)</text>
      </g>
    </g>

    <!-- Entity 2: Compiler Diagnostic Target -->
    <g transform="translate(14, 134)">
      <rect width="332" height="74" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#92400e">Entity E₂: Build Diagnostic Target</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#d97706">DIRTY DEPS</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#78350f">URI: diag://compiler/libnetwork.a</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Deps: {E₁: buffer.c, config.h}</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#b45309">Status: Stale due to E₁ file modification</text>
      </g>
    </g>

    <!-- Entity 3: Active Process Table -->
    <g transform="translate(14, 220)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Entity E₃: Process Table Entry</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">ACTIVE</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">URI: proc://4092</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Command: pytest tests/test_network.py</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Status: Running · Exit: null</text>
      </g>
    </g>

    <!-- Entity 4: Directory Manifest -->
    <g transform="translate(14, 306)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Entity E₄: Directory Tree Node</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">CLEAN</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">URI: dir:///repo/src/network/</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Dentry Hash: BLAKE3('...c92b')</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a">fsevents: No change in directory entries</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER COLUMN: RUNTIME DEPENDENCY MEDIATOR & INGESTION HOOKS               -->
  <!-- ========================================================================= -->
  <g transform="translate(440, 32)">
    <rect width="320" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="320" height="34" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#1e40af">Host Runtime Dependency Tracker</text>
    <text x="306" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#2563eb">Mediation Layer</text>

    <!-- Mediation Engine Card 1: Tool Write Intercept -->
    <g transform="translate(14, 48)">
      <rect width="292" height="106" rx="3" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Write-After-Read (WAR) Intercept</text>
      <text x="10" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Action: Tool("patch", buffer.c)</text>
      <text x="10" y="44" font-size="8" fill="#334155">Supervisor executes patch on host disk</text>
      <text x="10" y="58" font-size="8" fill="#334155">Intercept checks URI(buffer.c) in graph</text>
      <text x="10" y="72" font-size="8" font-weight="700" fill="#dc2626">Cascades invalidation along bipartite edges:</text>
      <text x="10" y="86" font-size="8" font-family="ui-monospace, monospace" fill="#991b1b">   all o_k: URI(o_k)==URI(u) -> MarkStale(o_k)</text>
      <text x="10" y="98" font-size="8" font-family="ui-monospace, monospace" fill="#d97706">   all o_dep: E₁ in InDeps(o_dep) -> MarkDirty</text>
    </g>

    <!-- Mediation Engine Card 2: Invariant Check & TTL -->
    <g transform="translate(14, 166)">
      <rect width="292" height="96" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Pre-Prefill Coherence Verification</text>
      <text x="10" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#2563eb">Invariant: H_content(E_k) == H(o_i)</text>
      <text x="10" y="48" font-size="8" fill="#475569">Traverses bipartite edges before token assembly.</text>
      <text x="10" y="62" font-size="8" fill="#475569">Strips execution authority from stale spans.</text>
      <text x="10" y="76" font-size="8" fill="#475569">Injects semantic tombstone or triggers JIT refresh.</text>
      <text x="10" y="88" font-size="7.5" font-family="ui-monospace, monospace" fill="#64748b">Monotonic TTL check: (t_now - τ_read) &lt; τ_ttl</text>
    </g>

    <!-- Mediation Engine Card 3: Out-of-Band FS Events -->
    <g transform="translate(14, 274)">
      <rect width="292" height="106" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Out-of-Band Kernel Event Interceptor</text>
      <text x="10" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Platform: inotify (Linux) / FSEvents (macOS)</text>
      <text x="10" y="48" font-size="8" fill="#475569">Captures background compiler / git rebase writes.</text>
      <text x="10" y="62" font-size="8" fill="#475569">Recomputes BLAKE3 on touched file descriptors.</text>
      <text x="10" y="76" font-size="8" fill="#475569">• Guarantees zero stale state leaks to neural prefill.</text>
      <text x="10" y="94" font-size="8" font-weight="700" fill="#166534">Enforces Zero Ambient Authority (A = 0)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PARTITION: STAGED LOGICAL WORKING SET O ⊂ S                         -->
  <!-- ========================================================================= -->
  <g transform="translate(800, 32)">
    <rect width="360" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">Staged Logical Working Set (O ⊂ S)</text>
    <text x="346" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#475569">Receptive Field Spans</text>

    <!-- Observation 1: Staged Buffer Source -->
    <g transform="translate(14, 48)">
      <rect width="332" height="74" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#991b1b">Observation o₁: Staged Code Span</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#dc2626">STALE TOMBSTONE</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#7f1d1d">Span: [L₁, L₂] (dispatch_packet)</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#b91c1c">Binding: λ(o₁) → E₁ (src/network/buffer.c)</text>
        <text x="0" y="44" font-size="8" font-weight="700" fill="#991b1b">Action: Invalidate span &amp; trigger JIT re-read</text>
      </g>
    </g>

    <!-- Observation 2: Compiler Warnings -->
    <g transform="translate(14, 134)">
      <rect width="332" height="74" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#92400e">Observation o₂: Build Diagnostic Span</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#d97706">DIRTY CACHE</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#78350f">Span: [L₃, L₄] (compiler warning log)</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#b45309">Binding: λ(o₂) → {E₁, E₂}</text>
        <text x="0" y="44" font-size="8" font-weight="700" fill="#b45309">Action: Diagnostic invalid; purge from prompt</text>
      </g>
    </g>

    <!-- Observation 3: Process Telemetry -->
    <g transform="translate(14, 220)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Observation o₃: Test Runner Status</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">VALID (TTL)</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Span: [L₅, L₆] ("pytest: Running...")</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Binding: λ(o₃) → E₃ (proc://4092)</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#475569">TTL: 18s remaining of τ_ttl=30s</text>
      </g>
    </g>

    <!-- Observation 4: Directory Listing -->
    <g transform="translate(14, 306)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Observation o₄: Staged Repo Manifest</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">VALID</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Span: [L₇, L₈] (file tree list)</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a">Binding: λ(o₄) → E₄ (dir:///repo/...)</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a">Match: H_content(E₄) == H(o₄)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BIPARTITE DEPENDENCY EDGES                                                -->
  <!-- ========================================================================= -->
  <!-- Edge E1 -> Mediator -> o1 (STALE) -->
  <path d="M 386 117 L 440 100" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 746 100 L 800 117" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Edge E1 -> Mediator -> o2 (DIRTY) -->
  <path d="M 386 125 L 440 120" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>
  <path d="M 746 120 L 800 203" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>

  <!-- Edge E2 -> o2 -->
  <path d="M 386 203 L 440 135" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>

  <!-- Edge E3 -> Mediator -> o3 (VALID) -->
  <path d="M 386 289 L 440 214" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 746 214 L 800 289" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Edge E4 -> Mediator -> o4 (VALID) -->
  <path d="M 386 375 L 440 327" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 746 327 L 800 375" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ========================================================================= -->
  <!-- FOOTER PRINCIPLE BAR: FORMAL PROVENANCE BINDING                           -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 452)">
    <rect width="1120" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="9" font-weight="700" fill="#0f172a">Bipartite Provenance Binding Function:</text>
    <text x="240" y="18" font-size="8.5" font-family="ui-monospace, monospace" fill="#1e40af">λ(o_i) = [ URI, EntityKind, v_env, τ_read, H_content ]</text>

    <text x="14" y="34" font-size="8.5" fill="#475569">Coherence Invariant: H_content(E_k) == H(o_i) -> VALID (Retained in Prompt). Mismatch or Write Action -> STALE (Tombstoned or JIT Refreshed).</text>
  </g>
</svg>
