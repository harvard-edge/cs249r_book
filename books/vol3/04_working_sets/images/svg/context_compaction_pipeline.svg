<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFE"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="660" rx="0" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Header -->
  <!-- Textbook Header Bar -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="1110" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="15" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e293b">HIERARCHICAL SEMANTIC CONTEXT COMPACTION PIPELINE</text>
  </g>

  <!-- Flow Diagram: 4 Stages Left to Right -->

  <!-- Stage 1: Bloated Trajectory Buffer -->
  <g transform="translate(45, 115)">
    <rect width="240" height="415" rx="2" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="42" rx="2" fill="#FFF1F2"/>
    <path d="M0 28 L0 42 L240 42 L240 28 Z" fill="#FFF1F2"/>
    <text x="120" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">1. Trajectory Bloat</text>

    <g transform="translate(16, 56)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="208" height="74" rx="2" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1"/>
      <text x="12" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239">Verbose Tool Output</text>
      <text x="12" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Full stdout/stderr dumps,</text>
      <text x="12" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">compiler stacktraces (8k+ toks)</text>
      <text x="12" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E11D48">High noise-to-signal ratio</text>

      <!-- Item 2 -->
      <rect x="0" y="86" width="208" height="74" rx="2" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1"/>
      <text x="12" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239">Raw File Payloads</text>
      <text x="12" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Entire files dumped into context</text>
      <text x="12" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">for minor edits (20k+ toks)</text>
      <text x="12" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E11D48">Redundant token waste</text>

      <!-- Item 3 -->
      <rect x="0" y="172" width="208" height="74" rx="2" fill="#FFF8F8" stroke="#FFE4E6" stroke-width="1"/>
      <text x="12" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9F1239">In-Flight CoT Reasoning</text>
      <text x="12" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Extended scratchpads,</text>
      <text x="12" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">backtracking deliberations</text>
      <text x="12" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E11D48">Ephemeral utility only</text>
    </g>

    <!-- Trigger callout -->
    <g transform="translate(16, 335)">
      <rect x="0" y="0" width="208" height="64" rx="2" fill="#FEE2E2" stroke="#F87171" stroke-width="1"/>
      <text x="104" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9F1239" text-anchor="middle">COMPACTION TRIGGER</text>
      <text x="104" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="middle">Buffer ≥ 75% Budget</text>
      <text x="104" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7F1D1D" text-anchor="middle">(e.g. 24k / 32k tokens reached)</text>
    </g>
  </g>

  <!-- Connector Arrow 1 -->
  <line x1="290" y1="320" x2="318" y2="320" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Dual Compaction Engines -->
  <g transform="translate(325, 115)">
    <rect width="280" height="415" rx="2" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="42" rx="2" fill="#F5F3FF"/>
    <path d="M0 28 L0 42 L280 42 L280 28 Z" fill="#F5F3FF"/>
    <text x="140" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#581C87" text-anchor="middle">2. Compaction Engines</text>

    <!-- Track A: Structural Extractive -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="252" height="152" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
      <rect x="10" y="10" width="105" height="20" rx="4" fill="#059669"/>
      <text x="62" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">DETERMINISTIC</text>
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#064E3B">Structural Pruning</text>

      <g transform="translate(10, 40)">
        <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D">• Head/Tail Slicing:</text>
        <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534">Retain 20 head + 20 tail lines + error grep</text>

        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D">• Tree-Sitter AST Repomap:</text>
        <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534">Extract symbol signatures &amp; hierarchy</text>

        <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D">• Git Diff Representation:</text>
        <text x="0" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534">Compact delta hunks replace file reads</text>
      </g>
    </g>

    <!-- Track B: Semantic Synthesis -->
    <g transform="translate(14, 222)">
      <rect x="0" y="0" width="252" height="175" rx="2" fill="#FDF4FF" stroke="#F0ABFC" stroke-width="1.2"/>
      <rect x="10" y="10" width="105" height="20" rx="4" fill="#A21CAF"/>
      <text x="62" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">SYNTHESIS</text>
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#701A75">State Synthesis</text>

      <g transform="translate(10, 40)">
        <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4A044E">• Step State Distillation:</text>
        <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#701A75">Map 10 reasoning turns into 1 state ledger</text>

        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4A044E">• Ephemeral Scratchpad Eviction:</text>
        <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#701A75">Strip internal CoT; commit only (action, obs)</text>

        <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4A044E">• Invariant Enclosure Preservation:</text>
        <text x="0" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#701A75">Lock user goals, constraints, and test suite</text>
        <text x="0" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#701A75">criteria against paraphrasing drift</text>
      </g>
    </g>
  </g>

  <!-- Connector Arrow 2 -->
  <line x1="610" y1="320" x2="638" y2="320" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Verification & Drift Control -->
  <g transform="translate(645, 115)">
    <rect width="240" height="415" rx="2" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="42" rx="2" fill="#FEF3C7"/>
    <path d="M0 28 L0 42 L240 42 L240 28 Z" fill="#FEF3C7"/>
    <text x="120" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">3. Drift Verification</text>

    <g transform="translate(16, 56)">
      <!-- Check 1 -->
      <rect x="0" y="0" width="208" height="95" rx="2" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <text x="12" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350F">Semantic Entropy Check</text>
      <text x="12" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Measures cross-entropy loss</text>
      <text x="12" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">between original instructions</text>
      <text x="12" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">and condensed state summary</text>
      <text x="12" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D97706">Rejects mutating paraphrases</text>

      <!-- Check 2 -->
      <rect x="0" y="110" width="208" height="95" rx="2" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <text x="12" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350F">State Consistency Gate</text>
      <text x="12" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Verifies file modification</text>
      <text x="12" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">ledger against git status</text>
      <text x="12" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">and disk reality</text>
      <text x="12" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D97706">Prevents hallucinated edits</text>

      <!-- Check 3 -->
      <rect x="0" y="220" width="208" height="110" rx="2" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
      <text x="12" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350F">L3 Archival Flush</text>
      <text x="12" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Evicted raw turns flushed</text>
      <text x="12" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">to external vector database</text>
      <text x="12" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">(HNSW / SQLite episodic log)</text>
      <text x="12" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#059669">Accessible via tool query</text>
    </g>
  </g>

  <!-- Connector Arrow 3 -->
  <line x1="890" y1="320" x2="918" y2="320" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Compacted Next-Turn Working Set -->
  <g transform="translate(925, 115)">
    <rect width="230" height="415" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="42" rx="2" fill="#DCFCE7"/>
    <path d="M0 28 L0 42 L230 42 L230 28 Z" fill="#DCFCE7"/>
    <text x="115" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">4. Compacted Working Set</text>

    <!-- Assembled State Layout -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="202" height="44" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
      <text x="101" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#581C87" text-anchor="middle">Pinned System Anchor</text>
      <text x="101" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B21A8" text-anchor="middle">Goal, rules &amp; tool schemas</text>

      <rect x="0" y="52" width="202" height="48" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
      <text x="101" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#78350F" text-anchor="middle">Condensed State Ledger</text>
      <text x="101" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#92400E" text-anchor="middle">Completed steps &amp; findings</text>

      <rect x="0" y="108" width="202" height="48" rx="2" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
      <text x="101" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Structured Git Diff</text>
      <text x="101" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#047857" text-anchor="middle">Patch hunks of modified files</text>

      <rect x="0" y="164" width="202" height="44" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
      <text x="101" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Tree-Sitter Repomap</text>
      <text x="101" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Active symbol hierarchy</text>

      <rect x="0" y="216" width="202" height="44" rx="2" fill="#DCFCE7" stroke="#059669" stroke-width="1.2"/>
      <text x="101" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D" text-anchor="middle">Immediate Turn Window</text>
      <text x="101" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534" text-anchor="middle">Active step observation &amp; action</text>
    </g>

    <!-- Metrics Callout -->
    <g transform="translate(14, 335)">
      <rect x="0" y="0" width="202" height="64" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="101" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">RESULTING METRICS</text>
      <text x="101" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#059669" text-anchor="middle">78% Token Reduction</text>
      <text x="101" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#15803D" text-anchor="middle">TTFT &lt; 160ms • Zero Drift</text>
    </g>
  </g>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(45, 550)">
    <rect width="1110" height="85" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="18" y="18" width="90" height="48" rx="2" fill="#581C87"/>
    <text x="63" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SYSTEMS</text>
    <text x="63" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRINCIPLE</text>
    <text x="125" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Deterministic Representation Trumps Lossy Paraphrasing</text>
    <text x="125" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Repeated natural-language summarization causes semantic entropy and hallucination cascades. Production agents preserve code state via</text>
    <text x="125" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">deterministic git diffs and AST repomaps, reserving lossy summarization strictly for high-level decision rationale.</text>
  </g>
</svg>