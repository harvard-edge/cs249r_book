<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="1160" height="620" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">HIERARCHICAL SEMANTIC CONTEXT COMPACTION PIPELINE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Mitigating context rot and prompt bloat through deterministic structural pruning and semantic synthesis</text>

  <!-- ================================================================= -->
  <!-- STAGE 1: TRAJECTORY BLOAT (RAW BUFFER)                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="245" height="445" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">1. TRAJECTORY BLOAT</text>

    <!-- Sub-blocks -->
    <g transform="translate(12, 34)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="221" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Verbose Tool Output</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Full stdout/stderr dumps,</text>
      <text x="10" y="42" font-size="7.5" fill="#64748b">compiler stacktraces (8k+ toks)</text>
      <rect x="10" y="52" width="201" height="22" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="66" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">High noise-to-signal ratio</text>

      <!-- Item 2 -->
      <rect x="0" y="94" width="221" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Raw File Payloads</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Entire source files dumped into</text>
      <text x="10" y="42" font-size="7.5" fill="#64748b">context for minor edits (20k+ toks)</text>
      <rect x="10" y="52" width="201" height="22" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="66" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Redundant token waste</text>

      <!-- Item 3 -->
      <rect x="0" y="188" width="221" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">In-Flight CoT Reasoning</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Extended scratchpads,</text>
      <text x="10" y="42" font-size="7.5" fill="#64748b">backtracking deliberations</text>
      <rect x="10" y="52" width="201" height="22" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="66" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Ephemeral utility only</text>

      <!-- Compaction Trigger -->
      <rect x="0" y="282" width="221" height="118" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="110" y="20" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">COMPACTION TRIGGER</text>
      <text x="110" y="42" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Buffer ≥ 75% Budget</text>
      <text x="110" y="58" font-size="7.5" fill="#7f1d1d" text-anchor="middle">(e.g., 24k / 32k tokens reached)</text>
      <rect x="10" y="70" width="201" height="38" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="105" y="85" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Prevents Quadratic TTFT Surge</text>
      <text x="105" y="98" font-size="7" fill="#64748b" text-anchor="middle">Forces execution of compaction pipeline</text>
    </g>
  </g>

  <!-- Connector 1 -->
  <line x1="285" y1="297" x2="313" y2="297" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- STAGE 2: DUAL COMPACTION ENGINES                                  -->
  <!-- ================================================================= -->
  <g transform="translate(313, 75)">
    <rect x="0" y="0" width="290" height="445" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">2. DUAL COMPACTION ENGINES</text>

    <!-- Track A: Structural Extractive Pruning -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="266" height="186" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="266" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">DETERMINISTIC: Structural Pruning</text>

      <g transform="translate(10, 30)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#14532d">• Head/Tail Slicing:</text>
        <text x="0" y="24" font-size="7.5" fill="#166534">Retain 20 head + 20 tail lines + error grep</text>

        <text x="0" y="46" font-size="8.5" font-weight="700" fill="#14532d">• Tree-Sitter AST Repomap:</text>
        <text x="0" y="58" font-size="7.5" fill="#166534">Extract symbol signatures &amp; hierarchy</text>

        <text x="0" y="80" font-size="8.5" font-weight="700" fill="#14532d">• Git Diff Representation:</text>
        <text x="0" y="92" font-size="7.5" fill="#166534">Compact delta hunks replace full file dumps</text>

        <rect x="0" y="108" width="246" height="34" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="123" y="122" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Zero Semantic Drift Risk</text>
        <text x="123" y="134" font-size="7" fill="#64748b" text-anchor="middle">Code symbols &amp; syntax preserved bit-for-bit</text>
      </g>
    </g>

    <!-- Track B: Semantic Synthesis -->
    <g transform="translate(12, 230)">
      <rect x="0" y="0" width="266" height="200" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="0" y="0" width="266" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">SYNTHESIS: State Ledger Distillation</text>

      <g transform="translate(10, 30)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#4c1d95">• Step State Distillation:</text>
        <text x="0" y="24" font-size="7.5" fill="#6d28d9">Map 10 reasoning turns into 1 state ledger</text>

        <text x="0" y="46" font-size="8.5" font-weight="700" fill="#4c1d95">• Ephemeral Scratchpad Eviction:</text>
        <text x="0" y="58" font-size="7.5" fill="#6d28d9">Strip internal CoT; commit only (action, obs)</text>

        <text x="0" y="80" font-size="8.5" font-weight="700" fill="#4c1d95">• Invariant Enclosure Preservation:</text>
        <text x="0" y="92" font-size="7.5" fill="#6d28d9">Lock user goals, constraints, and test suite</text>
        <text x="0" y="104" font-size="7.5" fill="#6d28d9">criteria against paraphrasing drift</text>

        <rect x="0" y="118" width="246" height="38" rx="1" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
        <text x="123" y="132" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Bounded Cognitive Overhead</text>
        <text x="123" y="146" font-size="7" fill="#64748b" text-anchor="middle">Recovers 80%+ tokens while preserving intent</text>
      </g>
    </g>
  </g>

  <!-- Connector 2 -->
  <line x1="603" y1="297" x2="631" y2="297" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- STAGE 3: VERIFICATION & DRIFT CONTROL                             -->
  <!-- ================================================================= -->
  <g transform="translate(631, 75)">
    <rect x="0" y="0" width="250" height="445" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">3. DRIFT VERIFICATION</text>

    <!-- Sub-blocks -->
    <g transform="translate(12, 34)">
      <!-- Check 1 -->
      <rect x="0" y="0" width="226" height="114" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">Semantic Entropy Check</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Measures cross-entropy loss</text>
      <text x="10" y="42" font-size="7.5" fill="#64748b">between original instructions</text>
      <text x="10" y="54" font-size="7.5" fill="#64748b">and condensed state summary</text>
      <rect x="10" y="66" width="206" height="36" rx="1" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="103" y="81" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Entropy Threshold: H &lt; 0.12</text>
      <text x="103" y="93" font-size="7" fill="#78350f" text-anchor="middle">Rejects mutating paraphrases</text>

      <!-- Check 2 -->
      <rect x="0" y="124" width="226" height="114" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">State Consistency Gate</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Verifies file modification</text>
      <text x="10" y="42" font-size="7.5" fill="#64748b">ledger against git status</text>
      <text x="10" y="54" font-size="7.5" fill="#64748b">and disk reality</text>
      <rect x="10" y="66" width="206" height="36" rx="1" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="103" y="81" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Deterministic Inode Check</text>
      <text x="103" y="93" font-size="7" fill="#78350f" text-anchor="middle">Prevents hallucinated file edits</text>

      <!-- Check 3 -->
      <rect x="0" y="248" width="226" height="152" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">L3 Archival Flush</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Evicted raw turns flushed</text>
      <text x="10" y="42" font-size="7.5" fill="#64748b">to external vector database</text>
      <text x="10" y="54" font-size="7.5" fill="#64748b">(HNSW / SQLite episodic log)</text>
      <rect x="10" y="66" width="206" height="42" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="103" y="82" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Zero Information Loss</text>
      <text x="103" y="96" font-size="7" fill="#166534" text-anchor="middle">Available via tool query on-demand</text>
      <text x="10" y="122" font-size="7" fill="#64748b">Working context retains pointers</text>
      <text x="10" y="134" font-size="7" fill="#64748b">instead of full unpruned payloads</text>
    </g>
  </g>

  <!-- Connector 3 -->
  <line x1="881" y1="297" x2="910" y2="297" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- ================================================================= -->
  <!-- STAGE 4: COMPACTED WORKING SET                                    -->
  <!-- ================================================================= -->
  <g transform="translate(910, 75)">
    <rect x="0" y="0" width="250" height="445" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">4. COMPACTED WORKING SET</text>

    <!-- Assembled State Layout -->
    <g transform="translate(12, 34)">
      <!-- Tier 1 -->
      <rect x="0" y="0" width="226" height="44" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="113" y="18" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Pinned System Anchor</text>
      <text x="113" y="32" font-size="7.5" fill="#5b21b6" text-anchor="middle">Goal, safety envelope &amp; schemas</text>

      <!-- Tier 2 -->
      <rect x="0" y="52" width="226" height="44" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="113" y="18+52" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Condensed State Ledger</text>
      <text x="113" y="32+52" font-size="7.5" fill="#92400e" text-anchor="middle">Completed steps &amp; verified facts</text>

      <!-- Tier 3 -->
      <rect x="0" y="104" width="226" height="44" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="113" y="18+104" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Structured Git Diff</text>
      <text x="113" y="32+104" font-size="7.5" fill="#166534" text-anchor="middle">Patch hunks of modified files</text>

      <!-- Tier 4 -->
      <rect x="0" y="156" width="226" height="44" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="113" y="18+156" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Tree-Sitter Repomap</text>
      <text x="113" y="32+156" font-size="7.5" fill="#64748b" text-anchor="middle">Active symbol hierarchy</text>

      <!-- Tier 5 -->
      <rect x="0" y="208" width="226" height="44" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="113" y="18+208" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Immediate Turn Window</text>
      <text x="113" y="32+208" font-size="7.5" fill="#14532d" text-anchor="middle">Active step observation &amp; action</text>

      <!-- Resulting Metrics Box -->
      <g transform="translate(0, 262)">
        <rect x="0" y="0" width="226" height="138" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="113" y="20" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">RESULTING METRICS</text>
        <text x="113" y="44" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">78% Token Reduction</text>
        <text x="113" y="60" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">TTFT &lt; 160ms • Zero Drift</text>
        <line x1="15" y1="72" x2="211" y2="72" stroke="#86efac" stroke-width="1"/>
        <text x="113" y="88" font-size="7.5" fill="#166534" text-anchor="middle">• Prefill compute scales as O(L²)</text>
        <text x="113" y="102" font-size="7.5" fill="#166534" text-anchor="middle">• 4.5x faster generation turnaround</text>
        <text x="113" y="116" font-size="7.5" fill="#166534" text-anchor="middle">• Preserves full context semantics</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 535)">
    <rect x="0" y="0" width="1120" height="90" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">ARCHITECTURAL PRINCIPLE: DETERMINISTIC CODE STATE VS LOSSY PARAPHRASING</text>

    <!-- Inner Callout Card -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="130" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="20" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">SYSTEMS</text>
      <text x="65" y="34" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PRINCIPLE</text>
    </g>

    <g transform="translate(160, 34)">
      <text x="0" y="14" font-size="9" font-weight="700" fill="#0f172a">Deterministic Representation Trumps Lossy Paraphrasing</text>
      <text x="0" y="28" font-size="7.5" fill="#475569">Repeated natural-language summarization causes semantic entropy and hallucination cascades. Production agents preserve code state via</text>
      <text x="0" y="40" font-size="7.5" fill="#475569">deterministic git diffs and AST repomaps, reserving lossy summarization strictly for high-level decision rationale.</text>
    </g>
  </g>
</svg>