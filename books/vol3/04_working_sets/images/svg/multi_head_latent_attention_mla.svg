<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="490" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- PANEL A: KV CACHE MEMORY FOOTPRINT PER TOKEN                              -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">KV Cache Memory Footprint</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Per Token Cost</text>

    <!-- Content Area -->
    <g transform="translate(14, 46)">
      <!-- Row 1: MHA -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-size="9.5" font-weight="700" fill="#0f172a">Multi-Head Attention (MHA)</text>
        <text x="340" y="12" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#991b1b" text-anchor="end">2,560 B / tok</text>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#dc2626"/>
        <text x="170" y="34" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">64 Key + 64 Value Heads (1.0× Baseline)</text>
      </g>

      <!-- Row 2: GQA -->
      <g transform="translate(0, 56)">
        <text x="0" y="12" font-size="9.5" font-weight="700" fill="#0f172a">Grouped-Query Attention (GQA)</text>
        <text x="340" y="12" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#1e40af" text-anchor="end">320 B / tok</text>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <rect x="0" y="18" width="42.5" height="24" rx="2" fill="#2563eb"/>
        <text x="50" y="34" font-size="8.5" font-weight="700" fill="#1e40af">8 KV Heads (8× Reduction)</text>
      </g>

      <!-- Row 3: MLA -->
      <g transform="translate(0, 112)">
        <text x="0" y="12" font-size="9.5" font-weight="700" fill="#0f172a">Multi-Head Latent Attention (MLA)</text>
        <text x="340" y="12" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#166534" text-anchor="end">67.5 B / tok</text>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <rect x="0" y="18" width="9" height="24" rx="2" fill="#16a34a"/>
        <text x="18" y="34" font-size="8.5" font-weight="700" fill="#166534">Latent d_c = 512 + RoPE 64 (38× vs MHA)</text>
      </g>

      <!-- Serving Density Comparison Card -->
      <g transform="translate(0, 170)">
        <rect width="340" height="206" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="20" font-size="9.5" font-weight="700" fill="#334155">Serving Density at 128k Context (70B Model)</text>

        <!-- Metric comparison grid -->
        <g transform="translate(12, 34)">
          <text x="0" y="12" font-size="8" font-weight="700" fill="#64748b">PARAMETER</text>
          <text x="135" y="12" font-size="8" font-weight="700" fill="#64748b">GQA (LLaMA-3)</text>
          <text x="240" y="12" font-size="8" font-weight="700" fill="#64748b">MLA (DeepSeek)</text>
          <line x1="0" y1="18" x2="316" y2="18" stroke="#e2e8f0" stroke-width="1"/>

          <text x="0" y="34" font-size="8.5" fill="#334155">128k Stream KV</text>
          <text x="135" y="34" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">42.95 GB</text>
          <text x="240" y="34" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">9.06 GB</text>

          <text x="0" y="54" font-size="8.5" fill="#334155">Decode Intensity</text>
          <text x="135" y="54" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">2.4 FLOP/B</text>
          <text x="240" y="54" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">3.6 FLOP/B</text>

          <text x="0" y="74" font-size="8.5" fill="#334155">80GB Concurrency</text>
          <text x="135" y="74" font-size="8.5" font-family="ui-monospace, monospace" fill="#dc2626">0 (OOM)</text>
          <text x="240" y="74" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">2 streams</text>

          <text x="0" y="94" font-size="8.5" fill="#334155">2×80GB Concurr.</text>
          <text x="135" y="94" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">4 streams</text>
          <text x="240" y="94" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">19 streams</text>

          <line x1="0" y1="104" x2="316" y2="104" stroke="#e2e8f0" stroke-width="1"/>
          <text x="0" y="122" font-size="8" fill="#475569">• 4.74× reduction in per-token KV footprint over GQA.</text>
          <text x="0" y="136" font-size="8" fill="#475569">• Allows 4.75× higher concurrent agent serving streams.</text>
          <text x="0" y="150" font-size="8" fill="#475569">• Eliminates HBM capacity wall on 80GB accelerator nodes.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: LOW-RANK PROJECTION & DECOUPLED ROPE                             -->
  <!-- ========================================================================= -->
  <g transform="translate(416, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Low-Rank Latent Down-Projection</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Compression</text>

    <!-- Schematic Content -->
    <g transform="translate(14, 46)">
      <!-- Input Activation -->
      <rect width="340" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="170" y="22" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Input Activation x_t (dim = 8,192)</text>
      <text x="170" y="38" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">Hidden Dimension d_model = 8,192</text>

      <!-- Splitting Arrows -->
      <path d="M 120 54 L 85 88" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <path d="M 220 54 L 255 88" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Projection Boxes -->
      <!-- Left: Down-projection -->
      <g transform="translate(0, 92)">
        <rect width="162" height="98" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
        <text x="81" y="18" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">Path A: KV Latent</text>
        <text x="81" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#2563eb" text-anchor="middle">c_t^{KV} = x_t · W_{DKV}</text>
        <text x="81" y="44" font-size="7.5" fill="#64748b" text-anchor="middle">W_{DKV} size 8192 × 512</text>
        <rect x="12" y="54" width="138" height="34" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="81" y="68" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">Compressed Latent</text>
        <text x="81" y="81" font-size="8" font-family="ui-monospace, monospace" fill="#1d4ed8" text-anchor="middle">c_t^{KV} (512 dims)</text>
      </g>

      <!-- Right: Decoupled RoPE Key -->
      <g transform="translate(178, 92)">
        <rect width="162" height="98" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
        <text x="81" y="18" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Path B: Decoupled RoPE</text>
        <text x="81" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a" text-anchor="middle">k_t^R = RoPE(x_t · W_{KR})</text>
        <text x="81" y="44" font-size="7.5" fill="#64748b" text-anchor="middle">Rotary Key d_R = 64</text>
        <rect x="12" y="54" width="138" height="34" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="81" y="68" font-size="8.5" font-weight="700" fill="#065f46" text-anchor="middle">Positional Key</text>
        <text x="81" y="81" font-size="8" font-family="ui-monospace, monospace" fill="#047857" text-anchor="middle">k_t^R (64 dims)</text>
      </g>

      <!-- Down Arrow into HBM -->
      <path d="M 170 194 L 170 216" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Resident in Accelerator HBM Box -->
      <g transform="translate(0, 222)">
        <rect width="340" height="74" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <text x="170" y="18" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">RESIDENT IN ACCELERATOR HBM (CACHED)</text>

        <rect x="14" y="26" width="148" height="38" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="88" y="42" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">c_t^{KV} (512 dims)</text>
        <text x="88" y="55" font-size="7.5" fill="#64748b" text-anchor="middle">Content &amp; Value Latent</text>

        <rect x="178" y="26" width="148" height="38" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="252" y="42" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">k_t^R (64 dims)</text>
        <text x="252" y="55" font-size="7.5" fill="#64748b" text-anchor="middle">Rotary Positional Key</text>
      </g>

      <!-- Why Decoupled RoPE Note Card -->
      <g transform="translate(0, 306)">
        <rect width="340" height="70" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Mathematical Necessity of Decoupled RoPE:</text>
        <text x="10" y="30" font-size="8" fill="#475569">• RoPE applies position-dependent rotation: R(θ, m) W_{UK} ≠ W_{UK} R(θ, m).</text>
        <text x="10" y="44" font-size="8" fill="#475569">• Rotating compressed latent breaks matrix associativity during decode.</text>
        <text x="10" y="58" font-size="8" fill="#475569">• Isolating RoPE to tiny 64-dim vector keeps 512-dim latent position-invariant.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL C: MATRIX ASSOCIATIVITY TRICK IN DECODE                             -->
  <!-- ========================================================================= -->
  <g transform="translate(808, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Matrix Associativity &amp; SRAM GEMM</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Serving Acceleration</text>

    <!-- Content Area -->
    <g transform="translate(14, 46)">
      <!-- Math Inversion Box -->
      <rect width="340" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Standard Inner Product vs. Associative Absorption</text>

      <text x="12" y="34" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">Standard:  q_t · (k_i^C)^T = q_t · (c_i^{KV} W_{UK})^T</text>

      <rect x="8" y="42" width="324" height="26" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="170" y="58" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#6b21a8" text-anchor="middle">Score = (q_t · W_{UK}^T) · (c_i^{KV})^T</text>

      <!-- Hardware Execution Pipeline Steps -->
      <g transform="translate(0, 86)">
        <!-- Step 1 -->
        <g transform="translate(0, 0)">
          <rect width="340" height="54" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#15803d">Step 1: Project Query into Latent Space in On-Chip SRAM</text>
          <text x="12" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#0f172a">q_{latent} = q_t · W_{UK}^T (dim = 512)</text>
          <text x="12" y="44" font-size="8" fill="#64748b">Computed ONCE per decode step in fast processor registers (negligible FLOPs).</text>
        </g>

        <!-- Step 2 -->
        <g transform="translate(0, 60)">
          <rect width="340" height="54" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#1e40af">Step 2: Stream Only 512-dim Latents Across Memory Bus</text>
          <text x="12" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#1d4ed8">HBM Bus Traffic: 512 elements instead of 8,192 elements</text>
          <text x="12" y="44" font-size="8" fill="#64748b">Slashes memory bandwidth demand by 4.74× over Grouped-Query Attention.</text>
        </g>

        <!-- Step 3 -->
        <g transform="translate(0, 120)">
          <rect width="340" height="54" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#b45309">Step 3: Direct Dot-Product in Tensor Cores</text>
          <text x="12" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#92400e">Attn Score = q_{latent} · (c_i^{KV})^T + q_t^R · (k_i^R)^T</text>
          <text x="12" y="44" font-size="8" fill="#64748b">Uncompressed Key/Value tensors are NEVER materialized in accelerator HBM.</text>
        </g>

        <!-- Summary note -->
        <g transform="translate(0, 180)">
          <rect width="340" height="42" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Systems Efficiency Principle:</text>
          <text x="12" y="30" font-size="8" fill="#475569">Trades cheap SRAM matrix operations for scarce, expensive HBM bus bandwidth.</text>
        </g>
      </g>
    </g>
  </g>
</svg>