<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="640" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL 1: MEMORY FOOTPRINT PER TOKEN (LEFT)                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="350" height="565" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">1. MEMORY FOOTPRINT PER TOKEN</text>

    <!-- Bar Chart Comparison -->
    <g transform="translate(15, 34)">
      <!-- Row 1: MHA -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#991b1b">Multi-Head Attention (MHA)</text>
        <text x="320" y="12" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="end">2,560 KB / tok</text>
        <rect x="0" y="18" width="320" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <rect x="0" y="18" width="320" height="22" rx="1" fill="#dc2626"/>
        <text x="12" y="33" font-size="8" font-weight="700" fill="#ffffff">64 Key Heads + 64 Value Heads (1.0× Baseline)</text>
      </g>

      <!-- Row 2: GQA -->
      <g transform="translate(0, 50)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0369a1">Grouped-Query Attention (GQA)</text>
        <text x="320" y="12" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="end">320 KB / tok</text>
        <rect x="0" y="18" width="320" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <rect x="0" y="18" width="40" height="22" rx="1" fill="#0284c7"/>
        <text x="48" y="33" font-size="8" font-weight="700" fill="#0369a1">8 KV Heads (8× Reduction vs MHA)</text>
      </g>

      <!-- Row 3: MLA -->
      <g transform="translate(0, 100)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#15803d">Multi-Head Latent Attention (MLA)</text>
        <text x="320" y="12" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="end">67.5 KB / tok</text>
        <rect x="0" y="18" width="320" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <rect x="0" y="18" width="8.4" height="22" rx="1" fill="#16a34a"/>
        <text x="16" y="33" font-size="8" font-weight="700" fill="#15803d">Latent d_c = 512 + RoPE 64 (38× Reduction!)</text>
      </g>
    </g>

    <!-- Table of Exact Specs -->
    <g transform="translate(15, 185)">
      <rect width="320" height="185" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Quantitative Architecture Metrics (70B Model)</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8" font-weight="700" fill="#475569">Metric</text>
        <text x="120" y="12" font-size="8" font-weight="700" fill="#475569">GQA (Llama-3)</text>
        <text x="210" y="12" font-size="8" font-weight="700" fill="#475569">MLA (DeepSeek)</text>
        <line x1="0" y1="18" x2="296" y2="18" stroke="#cbd5e1" stroke-width="1"/>

        <text x="0" y="34" font-size="8.0" fill="#334155">KV / Token</text>
        <text x="120" y="34" font-size="8.0" fill="#334155">320 KB</text>
        <text x="210" y="34" font-size="8.0" font-weight="700" fill="#15803d">67.5 KB (4.74× ↓)</text>

        <text x="0" y="52" font-size="8.0" fill="#334155">128k KV Stream</text>
        <text x="120" y="52" font-size="8.0" fill="#334155">42.95 GB</text>
        <text x="210" y="52" font-size="8.0" font-weight="700" fill="#15803d">9.06 GB</text>

        <text x="0" y="70" font-size="8.0" fill="#334155">Decode Intensity</text>
        <text x="120" y="70" font-size="8.0" fill="#334155">2.4 FLOP/Byte</text>
        <text x="210" y="70" font-size="8.0" font-weight="700" fill="#15803d">3.6 FLOP/Byte</text>

        <text x="0" y="88" font-size="8.0" fill="#334155">80GB Concurrency</text>
        <text x="120" y="88" font-size="8.0" fill="#dc2626">0 streams (OOM)</text>
        <text x="210" y="88" font-size="8.0" font-weight="700" fill="#15803d">2 streams</text>

        <text x="0" y="106" font-size="8.0" fill="#334155">Dual-GPU Concurr.</text>
        <text x="120" y="106" font-size="8.0" fill="#334155">4 streams</text>
        <text x="210" y="106" font-size="8.0" font-weight="700" fill="#15803d">19 streams (4.75×)</text>

        <line x1="0" y1="116" x2="296" y2="116" stroke="#cbd5e1" stroke-width="1"/>
        <text x="0" y="132" font-size="8.0" fill="#64748b">Serving Density</text>
        <text x="120" y="132" font-size="8.0" fill="#64748b">Baseline</text>
        <text x="210" y="132" font-size="8.0" font-weight="700" fill="#15803d">+375% capacity</text>
      </g>
    </g>

    <!-- Systems Takeaway Box -->
    <g transform="translate(15, 385)">
      <rect width="320" height="165" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">The Memory Compression Takeaway</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8.0" fill="#166534">• MLA achieves 38× compression over baseline MHA.</text>
        <text x="0" y="26" font-size="8.0" fill="#166534">• Delivers 4.74× memory reduction over production GQA.</text>
        <text x="0" y="40" font-size="8.0" fill="#166534">• Maintains full expressivity of 128 attention heads.</text>
        <text x="0" y="54" font-size="8.0" fill="#166534">• Multiplies cluster serving concurrency by 4.75×.</text>

        <rect x="0" y="70" width="296" height="42" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="148" y="88" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Frontier Serving Standard</text>
        <text x="148" y="100" font-size="8.0" fill="#166534" text-anchor="middle">Enables multi-agent long-horizon reasoning on affordable hardware</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: LOW-RANK PROJECTION & DECOUPLED ROPE (MIDDLE)            -->
  <!-- ================================================================= -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="350" height="565" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. LOW-RANK PROJECTION &amp; DECOUPLED ROPE</text>

    <!-- Input Activation -->
    <g transform="translate(15, 34)">
      <rect width="320" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="160" y="18" font-family="Courier, monospace" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Input Hidden Activation x_t ∈ R^d_model</text>
      <text x="160" y="32" font-size="8.0" fill="#64748b" text-anchor="middle">(d_model = 8,192)</text>
    </g>

    <!-- Dual Down-Projection Branches -->
    <line x1="120" y1="84" x2="90" y2="105" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="260" y1="84" x2="280" y2="105" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Path A: Compressed Latent Vector -->
    <g transform="translate(15, 108)">
      <rect width="180" height="114" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">Path A: Down-Projection</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.5" fill="#0284c7">c_t^KV = x_t W_DKV</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">W_DKV ∈ R^(d_model × d_c)</text>

      <rect x="8" y="56" width="164" height="46" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="90" y="74" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">Compressed Latent Vector</text>
      <text x="90" y="90" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="middle">c_t^KV ∈ R^512</text>
    </g>

    <!-- Path B: Decoupled RoPE Key -->
    <g transform="translate(205, 108)">
      <rect width="130" height="114" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Path B: RoPE Key</text>
      <text x="10" y="30" font-family="Courier, monospace" font-size="8.5" fill="#16a34a">k_t^R = RoPE(...)</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">d_h^R = 64 dims</text>

      <rect x="8" y="56" width="114" height="46" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="65" y="74" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Decoupled Key</text>
      <text x="65" y="90" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="middle">k_t^R ∈ R^64</text>
    </g>

    <!-- Resident HBM Cache Box -->
    <g transform="translate(15, 234)">
      <rect width="320" height="106" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="320" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="160" y="15" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">RESIDENT IN ACCELERATOR HBM (CACHED)</text>

      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="168" height="58" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="84" y="18" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">c_t^KV (512 dims)</text>
        <text x="84" y="34" font-size="8.0" fill="#475569" text-anchor="middle">Holds both Key &amp; Value info</text>
        <text x="84" y="46" font-size="8.0" fill="#64748b" text-anchor="middle">Position-independent latent</text>

        <rect x="178" y="0" width="118" height="58" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
        <text x="237" y="18" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">k_t^R (64 dims)</text>
        <text x="237" y="34" font-size="8.0" fill="#475569" text-anchor="middle">Rotary Positional</text>
        <text x="237" y="46" font-size="8.0" fill="#64748b" text-anchor="middle">Signal vector</text>
      </g>
    </g>

    <!-- Why Decoupled RoPE is Essential -->
    <g transform="translate(15, 352)">
      <rect width="320" height="198" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Why Decoupled RoPE is Required</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8.0" fill="#475569">• Rotary position embeddings rotate vectors based on absolute position.</text>
        <text x="0" y="26" font-size="8.0" fill="#475569">• If RoPE is applied directly to latent c_t^KV, matrix associativity</text>
        <text x="0" y="38" font-size="8.0" font-family="Courier, monospace" fill="#dc2626">  breaks: R(Θ, m) W_UK ≠ W_UK R(Θ, m).</text>
        <text x="0" y="56" font-size="8.0" fill="#475569">• By isolating RoPE onto a tiny dedicated 64-dim vector k_t^R,</text>
        <text x="0" y="68" font-size="8.0" fill="#475569">  the latent vector c_t^KV remains completely position-independent!</text>
        <text x="0" y="86" font-size="8.0" fill="#475569">• This enables the critical matrix multiplication re-ordering</text>
        <text x="0" y="98" font-size="8.0" fill="#475569">  in on-chip SRAM during token generation.</text>

        <rect x="0" y="112" width="296" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="148" y="128" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">Preserves Matrix Associativity Trick</text>
        <text x="148" y="142" font-size="8.0" fill="#0284c7" text-anchor="middle">Enables zero HBM expansion during token decode</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 3: MATRIX ASSOCIATIVITY TRICK (RIGHT)                       -->
  <!-- ================================================================= -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="360" height="565" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">3. THE MATRIX ASSOCIATIVITY TRICK</text>

    <!-- Derivation Block -->
    <g transform="translate(15, 34)">
      <rect width="330" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">The Mathematical Inversion</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8.0" fill="#475569">Standard attention inner product against reconstructed Key:</text>
        <rect x="0" y="18" width="306" height="24" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="34" font-family="Courier, monospace" font-size="8.5" fill="#0f172a">Score = q_t · (k_i^C)^T = q_t · (c_i^KV · W_UK)^T</text>

        <text x="0" y="58" font-size="8.0" fill="#475569">Exploiting associative property of matrix multiplication:</text>
        <rect x="0" y="64" width="306" height="26" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="10" y="81" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#6d28d9">Score = (q_t · W_UK^T) · (c_i^KV)^T</text>

        <text x="0" y="106" font-size="8.0" fill="#64748b">Key reconstruction is absorbed into Query projection!</text>
      </g>
    </g>

    <!-- Execution Hardware Flow -->
    <g transform="translate(15, 196)">
      <rect width="330" height="354" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Decode Hardware Execution Flow</text>

      <!-- Step 1 -->
      <g transform="translate(12, 28)">
        <rect width="306" height="70" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Step 1: Invert Query Once in On-Chip SRAM</text>
        <text x="10" y="30" font-family="Courier, monospace" font-size="8.5" fill="#166534">q_latent = q_t · W_UK^T  [∈ R^512]</text>
        <text x="10" y="44" font-size="8.0" fill="#475569">Executed ONCE per decode step on fast tensor core registers.</text>
        <text x="10" y="56" font-size="8.0" fill="#64748b">Negligible compute cost (&lt; 0.1% total FLOPs).</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(12, 108)">
        <rect width="306" height="80" rx="1" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#6d28d9">Step 2: Stream Only 512 Latent Dims from HBM</text>
        <text x="10" y="30" font-size="8.0" fill="#475569">Memory bus streams 512 numbers instead of 8,192!</text>
        <rect x="8" y="38" width="290" height="24" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="153" y="54" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">Slashes HBM Memory Bus Traffic by 4.74×</text>
        <text x="10" y="74" font-size="8.0" fill="#64748b">Dramatically raises operational intensity along roofline.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(12, 198)">
        <rect width="306" height="72" rx="1" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#b45309">Step 3: Direct Dot-Product in Tensor Cores</text>
        <text x="10" y="30" font-family="Courier, monospace" font-size="8" fill="#92400e">Attn = q_latent · (c_i^KV)^T + q_R · (k_i^R)^T</text>
        <text x="10" y="44" font-size="8.0" fill="#78350f">High-dimensional Keys/Values are NEVER materialized in HBM!</text>
        <text x="10" y="58" font-size="8.0" fill="#b45309">SRAM GEMM operates directly on compressed latents.</text>
      </g>

      <!-- Bottom Hardware Summary -->
      <g transform="translate(12, 280)">
        <rect width="306" height="60" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
        <text x="153" y="24" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">The Fundamental Efficiency Win</text>
        <text x="153" y="40" font-size="8.0" fill="#475569" text-anchor="middle">Trades cheap on-chip SRAM FLOPs</text>
        <text x="153" y="52" font-size="8.0" fill="#475569" text-anchor="middle">for scarce, expensive off-chip HBM bandwidth</text>
      </g>
    </g>
  </g>
</g>
</svg>