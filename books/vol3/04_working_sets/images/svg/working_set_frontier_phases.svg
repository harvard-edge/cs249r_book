<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .axis-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .phase-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .phase-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .peak-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #047857; text-anchor: middle; }
    </style>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="1080" height="450" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Plot Area Backgrounds for 3 Phases -->
  <rect x="110" y="25" width="230" height="240" fill="#fef2f2" opacity="0.6"/>
  <text x="225" y="48" class="phase-title" fill="#991b1b">PHASE I: INFORMATION DEFICIT</text>
  <text x="225" y="64" class="phase-desc">M &lt; M_min · Model Hallucinates Interfaces</text>

  <rect x="340" y="25" width="280" height="240" fill="#ecfdf5" opacity="0.6"/>
  <text x="480" y="48" class="phase-title" fill="#065f46">PHASE II: SUFFICIENT EVIDENCE</text>
  <text x="480" y="64" class="phase-desc">M_min ≤ M ≤ M* · High Signal-to-Noise Ratio</text>

  <rect x="620" y="25" width="390" height="240" fill="#fff7ed" opacity="0.6"/>
  <text x="815" y="48" class="phase-title" fill="#9a3412">PHASE III: ATTENTIONAL SATURATION</text>
  <text x="815" y="64" class="phase-desc">M &gt; M* · Softmax Mass Dilution &amp; Lost-in-the-Middle</text>

  <!-- Grid lines -->
  <path d="M 110 255 L 1010 255" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 195 L 1010 195" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 135 L 1010 135" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 340 75 L 340 315" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <path d="M 500 75 L 500 315" stroke="#10b981" stroke-dasharray="3,3" stroke-width="1.5"/>
  <path d="M 620 75 L 620 315" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Curve Path -->
  <path d="M 110 300 C 200 290, 280 240, 340 195 C 400 150, 450 130, 500 130 C 560 130, 620 160, 680 180 C 780 215, 900 245, 1010 260" 
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Peak Point -->
  <circle cx="500" cy="130" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="420" y="95" width="160" height="24" rx="4" fill="#ffffff" stroke="#10b981"/>
  <text x="500" y="111" class="peak-lbl">Optimal Frontier M* ★</text>

  <!-- Axes -->
  <path d="M 110 315 L 1030 315" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <path d="M 110 315 L 110 70" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- Y-Axis Labels -->
  <text x="45" y="145" class="axis-lbl" transform="rotate(-90 45,195)" text-anchor="middle">Task Success (Pass@1)</text>
  <text x="100" y="268" class="tick-lbl" text-anchor="end">0%</text>
  <text x="100" y="208" class="tick-lbl" text-anchor="end">25%</text>
  <text x="100" y="148" class="tick-lbl" text-anchor="end">50%</text>
  <text x="100" y="88" class="tick-lbl" text-anchor="end">75%</text>

  <!-- X-Axis Labels -->
  <text x="560" y="310" class="axis-lbl" text-anchor="middle">Nominal Sequence Length (Tokens M)</text>
  <text x="110" y="285" class="tick-lbl">0</text>
  <text x="340" y="285" class="tick-lbl">M_min</text>
  <text x="500" y="285" class="tick-lbl" font-weight="700" fill="#047857">M* (Sweet Spot)</text>
  <text x="620" y="285" class="tick-lbl">Saturation</text>
  <text x="1010" y="285" class="tick-lbl">S_max (Nominal Cap)</text>

  <!-- Latency / Compute Floor Indicators -->
  <rect x="110" y="325" width="410" height="36" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="120" y="341" class="card-text" font-weight="700" fill="#15803d">Interactive Latency Regime:</text>
  <text x="120" y="354" class="card-text" fill="#166534">Sub-second TTFT · Linear projection dominates · High attention salience</text>

  <rect x="535" y="325" width="475" height="36" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="545" y="341" class="card-text" font-weight="700" fill="#991b1b">Quadratic Degradation Regime:</text>
  <text x="545" y="354" class="card-text" fill="#b91c1c">Multi-second TTFT stalls (O(M²)) · Distractor interference · Net negative returns</text>

  <!-- Bottom Architectural Invariant -->
  <rect x="20" y="375" width="1040" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="397" class="card-text" font-weight="700" fill="#0f172a">Working-Set Invariant:</text>
  <text x="35" y="415" class="card-text">Never scale context length blindly. Active working memory must be strictly bounded within Phase II (M_min ≤ M ≤ M*);</text>
  <text x="35" y="428" class="card-text">exceeding M* increases inference latency and accelerator cost while actively degrading empirical task completion.</text>
</svg>