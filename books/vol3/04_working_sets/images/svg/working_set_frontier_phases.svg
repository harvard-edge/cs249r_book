<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .axis-lbl { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .phase-hdr { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .phase-sub { font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .regime-title { font-size: 9.5px; font-weight: 700; }
      .regime-desc { font-size: 8.5px; }
    </style>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1080" height="430" rx="4" fill="#ffffff"/>

  <!-- Plot Card Boundary -->
  <rect x="24" y="16" width="1032" height="398" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Plot Area Backgrounds for 3 Operational Phases -->
  <!-- Phase 1: Information Deficit -->
  <rect x="110" y="32" width="240" height="268" fill="#fef2f2" fill-opacity="0.6"/>
  <text x="230" y="54" class="phase-hdr" fill="#991b1b">Phase I: Information Deficit</text>
  <text x="230" y="70" class="phase-sub" fill="#7f1d1d">M &lt; M_min · Missing interfaces trigger hallucination</text>

  <!-- Phase 2: Sufficient Evidence -->
  <rect x="350" y="32" width="270" height="268" fill="#ecfdf5" fill-opacity="0.6"/>
  <text x="485" y="54" class="phase-hdr" fill="#065f46">Phase II: Sufficient Evidence</text>
  <text x="485" y="70" class="phase-sub" fill="#047857">M_min ≤ M ≤ M* · High attention salience &amp; low TTFT</text>

  <!-- Phase 3: Attentional Saturation -->
  <rect x="620" y="32" width="390" height="268" fill="#fff7ed" fill-opacity="0.6"/>
  <text x="815" y="54" class="phase-hdr" fill="#9a3412">Phase III: Attentional Saturation</text>
  <text x="815" y="70" class="phase-sub" fill="#7c2d12">M &gt; M* · Softmax dilution &amp; quadratic TTFT stalls</text>

  <!-- Grid lines -->
  <path d="M 110 240 L 1010 240" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 180 L 1010 180" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 120 L 1010 120" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Phase Boundary Dividers -->
  <path d="M 350 32 L 350 300" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1.2"/>
  <path d="M 485 32 L 485 300" stroke="#10b981" stroke-dasharray="3,3" stroke-width="1.5"/>
  <path d="M 620 32 L 620 300" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1.2"/>

  <!-- Curve Path -->
  <path d="M 110 285 C 190 275, 270 230, 350 180 C 400 145, 445 118, 485 118 C 535 118, 585 145, 635 170 C 740 210, 880 240, 1010 255" 
        fill="none" stroke="#2563eb" stroke-width="2.8"/>

  <!-- Optimal Frontier Point at Peak -->
  <circle cx="485" cy="118" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="405" y="132" width="160" height="24" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="485" y="148" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Optimal Frontier M*</text>

  <!-- Axes -->
  <path d="M 110 300 L 1025 300" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-axis)"/>
  <path d="M 110 300 L 110 28" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-axis)"/>

  <!-- Y-Axis Labels -->
  <text x="42" y="165" class="axis-lbl" transform="rotate(-90 42,165)" text-anchor="middle">Task Success (Pass@1)</text>
  <text x="100" y="303" class="tick-lbl" text-anchor="end">0%</text>
  <text x="100" y="243" class="tick-lbl" text-anchor="end">25%</text>
  <text x="100" y="183" class="tick-lbl" text-anchor="end">50%</text>
  <text x="100" y="123" class="tick-lbl" text-anchor="end">75%</text>

  <!-- X-Axis Labels -->
  <text x="560" y="342" class="axis-lbl" text-anchor="middle">Nominal Sequence Length (Tokens M)</text>
  <text x="110" y="318" class="tick-lbl" text-anchor="middle">0</text>
  <text x="350" y="318" class="tick-lbl" text-anchor="middle">M_min</text>
  <text x="485" y="318" class="tick-lbl" font-weight="700" fill="#047857" text-anchor="middle">M* (Optimal)</text>
  <text x="620" y="318" class="tick-lbl" text-anchor="middle">Saturation</text>
  <text x="1010" y="318" class="tick-lbl" text-anchor="middle">S_max (Capacity Limit)</text>

  <!-- Operational Regime Telemetry Indicators (Lower Row) -->
  <g transform="translate(110, 355)">
    <!-- Interactive Sub-second Regime -->
    <rect x="0" y="0" width="375" height="42" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <text x="12" y="17" class="regime-title" fill="#15803d">Interactive Latency Regime [0 ≤ M ≤ M*]</text>
    <text x="12" y="31" class="regime-desc" fill="#166534">Sub-second TTFT · Linear projection compute dominates · High attentional salience</text>

    <!-- Quadratic Saturation Regime -->
    <rect x="390" y="0" width="510" height="42" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="12" y="17" class="regime-title" transform="translate(390,0)" fill="#991b1b">Quadratic Degradation Regime [M &gt; M*]</text>
    <text x="12" y="31" class="regime-desc" transform="translate(390,0)" fill="#7f1d1d">Multi-second TTFT stalls (O(M²)) · Softmax denominator dilution · Distractor amnesia</text>
  </g>
</svg>