<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="580" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4px; }
      .card-severed { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,3; rx: 4px; }
      .card-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.2; rx: 4px; }
      .card-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; rx: 4px; }
      .card-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; rx: 4px; }
      .card-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; rx: 4px; }
      .card-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.2; rx: 4px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #64748b; }
      .text-mono { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; fill: #0f172a; }
      .text-mono-bold { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arr-blue); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.5; fill: none; marker-end: url(#arr-purple); }
      .arrow-green { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arr-green); }
      .sever-line { stroke: #dc2626; stroke-width: 2.2; stroke-linecap: round; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="580" class="bg" />

  <!-- ============================================================== -->
  <!-- TOP PANEL: LIVE TRAJECTORY EXECUTION LOOP                      -->
  <!-- ============================================================== -->
  <rect x="25" y="16" width="1010" height="265" class="frame-box" />
  <rect x="35" y="24" width="280" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="37" class="text-mono-bold" fill="#334155">MODE 1: LIVE TRAJECTORY EXECUTION</text>
  <text x="1020" y="37" class="text-mono" font-size="9.5" fill="#0284c7" text-anchor="end">Interactive Execution Closed Loop</text>

  <!-- Return loop arrow from Event Store back to ACB_t (routed cleanly above cards) -->
  <path d="M 955 65 L 955 48 L 125 48 L 125 65" class="arrow-blue" stroke-dasharray="4,3" />
  <rect x="350" y="38" width="300" height="19" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
  <text x="500" y="51" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">Feed e_obs into delta(ACB[t], e) to advance state</text>

  <!-- Node 1: Supervisor Control State ACB_t -->
  <g transform="translate(45, 65)">
    <rect x="0" y="0" width="160" height="195" class="card" />
    <rect x="0" y="0" width="160" height="24" rx="3" class="card-blue" />
    <text x="8" y="16" class="text-title" fill="#0369a1">Supervisor State ACB[t]</text>
    
    <text x="8" y="42" class="text-mono-bold">Turn: <tspan fill="#0284c7">t</tspan></text>
    <text x="8" y="58" class="text-body">Constructs prompt context</text>
    <text x="8" y="72" class="text-body">from working memory buffer</text>
    <text x="8" y="86" class="text-body">and task specification.</text>
    
    <line x1="6" y1="96" x2="154" y2="96" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="8" y="112" class="text-mono-bold">State Machine Step:</text>
    <rect x="6" y="120" width="148" height="42" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
    <text x="10" y="136" class="text-mono" font-size="8.5" fill="#0284c7">ACB[t+1] = delta(</text>
    <text x="16" y="152" class="text-mono" font-size="8.5" fill="#0284c7">  ACB[t], e_auth, e_obs)</text>

    <text x="8" y="180" class="text-mono-bold" font-size="8.5" fill="#059669">Live Dispatch Active</text>
  </g>

  <!-- Arrow: Supervisor to Model -->
  <path d="M 205 110 L 245 110" class="arrow-blue" />
  <text x="225" y="103" class="text-mono" font-size="8" fill="#0284c7" text-anchor="middle">Prompt</text>

  <!-- Node 2: Foundation Model Inference -->
  <g transform="translate(250, 65)">
    <rect x="0" y="0" width="170" height="195" class="card" />
    <rect x="0" y="0" width="170" height="24" rx="3" class="card-amber" />
    <text x="8" y="16" class="text-title" fill="#b45309">Foundation Model (M)</text>
    
    <text x="8" y="42" class="text-mono-bold">Autoregressive Decode:</text>
    <text x="8" y="58" class="text-body">P(token | context)</text>
    <text x="8" y="74" class="text-body">Evaluates GEMM / attention</text>
    <text x="8" y="88" class="text-body">on remote GPU cluster.</text>
    
    <rect x="6" y="104" width="158" height="48" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8" />
    <text x="10" y="120" class="text-mono-bold" font-size="8.5" fill="#b45309">Proposes Action:</text>
    <text x="10" y="134" class="text-mono" font-size="8" fill="#92400e">e_prop: candidate call</text>
    <text x="10" y="146" class="text-muted" font-size="7.5">Stochastic token sampling</text>

    <text x="8" y="174" class="text-mono" font-size="8.5" fill="#d97706">High GPU compute cost</text>
    <text x="8" y="188" class="text-mono" font-size="8.5" fill="#64748b">Latency: 5 to 20 seconds</text>
  </g>

  <!-- Arrow: Model to Policy Escrow -->
  <path d="M 420 130 L 460 130" class="arrow" />
  <text x="440" y="123" class="text-mono" font-size="8" fill="#475569" text-anchor="middle">e_prop</text>

  <!-- Node 3: Escrow Policy Gate -->
  <g transform="translate(465, 65)">
    <rect x="0" y="0" width="165" height="195" class="card" />
    <rect x="0" y="0" width="165" height="24" rx="3" class="card-purple" />
    <text x="8" y="16" class="text-title" fill="#6d28d9">Escrow Policy Gate</text>
    
    <text x="8" y="42" class="text-mono-bold">Zero Authority (A = 0):</text>
    <text x="8" y="58" class="text-body">Interposes on proposal.</text>
    <text x="8" y="74" class="text-body">Validates schema, security</text>
    <text x="8" y="88" class="text-body">policies, and token quotas.</text>
    
    <rect x="6" y="104" width="153" height="48" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8" />
    <text x="10" y="120" class="text-mono-bold" font-size="8.5" fill="#6d28d9">Generates e_auth:</text>
    <text x="10" y="134" class="text-mono" font-size="8" fill="#7c3aed">Synchronizes to WAL</text>
    <text x="10" y="146" class="text-mono-bold" font-size="7.5" fill="#059669">Barrier: e_flush &lt; a_ext</text>

    <text x="8" y="174" class="text-mono-bold" font-size="8.5" fill="#6d28d9">Permit / Deny Gate</text>
  </g>

  <!-- Arrow: Escrow to Sandbox Tool Dispatch -->
  <path d="M 630 130 L 670 130" class="arrow-green" />
  <text x="650" y="123" class="text-mono" font-size="8" fill="#059669" text-anchor="middle">a_ext</text>

  <!-- Node 4: Sandboxed Tool Execution -->
  <g transform="translate(675, 65)">
    <rect x="0" y="0" width="170" height="195" class="card" />
    <rect x="0" y="0" width="170" height="24" rx="3" class="card-green" />
    <text x="8" y="16" class="text-title" fill="#047857">Sandbox &amp; Real World</text>
    
    <text x="8" y="42" class="text-mono-bold">Physical Execution:</text>
    <text x="8" y="58" class="text-body">Dispatches command across</text>
    <text x="8" y="74" class="text-body">NIC to container / APIs.</text>
    <text x="8" y="88" class="text-mono-bold" font-size="8.5" fill="#dc2626">Irrevocable side effect</text>
    
    <rect x="6" y="104" width="158" height="48" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <text x="10" y="120" class="text-mono-bold" font-size="8.5" fill="#047857">Returns Observation:</text>
    <text x="10" y="134" class="text-mono" font-size="8" fill="#065f46">e_obs: stdout, exit_code</text>
    <text x="10" y="146" class="text-muted" font-size="7.5">Captured before truncation</text>

    <text x="8" y="174" class="text-mono" font-size="8.5" fill="#047857">Mutates real world</text>
  </g>

  <!-- Arrow: Sandbox to WAL append -->
  <path d="M 845 130 L 885 130" class="arrow" />

  <!-- Node 5: Append-Only Event Log -->
  <g transform="translate(890, 65)">
    <rect x="0" y="0" width="130" height="195" class="card" />
    <rect x="0" y="0" width="130" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="8" y="16" class="text-title" fill="#334155">Event Store (E)</text>
    
    <text x="8" y="42" class="text-mono-bold">Append-Only:</text>
    <text x="8" y="58" class="text-mono" font-size="8.5">e0: TaskInit</text>
    <text x="8" y="72" class="text-mono" font-size="8.5">e1: Staged</text>
    <text x="8" y="86" class="text-mono" font-size="8.5">e2: Proposed</text>
    <text x="8" y="100" class="text-mono" font-size="8.5">e3: Authorized</text>
    <text x="8" y="114" class="text-mono" font-size="8.5">e4: Dispatched</text>
    <text x="8" y="128" class="text-mono" font-size="8.5">e5: ObsIngested</text>
    <line x1="6" y1="138" x2="124" y2="138" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="8" y="154" class="text-mono-bold" font-size="8.5" fill="#0284c7">NVMe fsync()</text>
    <text x="8" y="174" class="text-muted" font-size="8">Durable audit trail</text>
  </g>


  <!-- ============================================================== -->
  <!-- BOTTOM PANEL: REPLAY RECONSTRUCTION MODE                       -->
  <!-- ============================================================== -->
  <rect x="25" y="295" width="1010" height="268" class="frame-box" />
  <rect x="35" y="303" width="370" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="316" class="text-mono-bold" fill="#334155">MODE 2: DETERMINISTIC REPLAY RECONSTRUCTION</text>
  <text x="1020" y="316" class="text-mono-bold" font-size="9.5" fill="#059669" text-anchor="end">A = 0 · state rebuilt by delta fold</text>

  <!-- Replay Node 1: Recovering Supervisor -->
  <g transform="translate(45, 335)">
    <rect x="0" y="0" width="175" height="210" class="card" />
    <rect x="0" y="0" width="175" height="24" rx="3" class="card-green" />
    <text x="8" y="16" class="text-title" fill="#047857">Replaying Supervisor</text>
    
    <text x="8" y="42" class="text-mono-bold">Hydration Base State:</text>
    <text x="8" y="58" class="text-body">Deserializes checkpoint S_tau</text>
    <text x="8" y="72" class="text-body">or boots from ACB[0].</text>
    
    <line x1="6" y1="82" x2="169" y2="82" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="8" y="98" class="text-mono-bold">Sequential Delta Fold:</text>
    <rect x="6" y="106" width="163" height="44" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <text x="10" y="122" class="text-mono-bold" font-size="8.5" fill="#047857">ACB[i] = delta(ACB[i-1], e[i])</text>
    <text x="10" y="138" class="text-muted" font-size="8">Evaluates pure FSM transition</text>

    <text x="8" y="172" class="text-mono-bold" font-size="8.5" fill="#059669">Bit-Exact State Reconstructed</text>
    <text x="8" y="188" class="text-mono" font-size="8.5" fill="#475569">Recovery Latency: &lt; 40 ms</text>
    <text x="8" y="202" class="text-mono-bold" font-size="8" fill="#047857">Speedup: ~27,000x over LLM</text>
  </g>

  <!-- Arrow: Replay Event Stream to Supervisor -->
  <path d="M 885 435 L 225 435" class="arrow-green" />
  <rect x="390" y="418" width="330" height="30" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
  <text x="555" y="432" class="text-mono-bold" font-size="9" fill="#047857" text-anchor="middle">STREAM HISTORICAL EVENTS DIRECTLY TO delta()</text>
  <text x="555" y="443" class="text-muted" font-size="7.5" text-anchor="middle">e_prop, e_auth, and e_obs streamed sequentially from durable disk</text>

  <!-- Severed Node 2: Model Inference Severed -->
  <g transform="translate(250, 335)">
    <rect x="0" y="0" width="170" height="75" class="card-severed" />
    <text x="8" y="18" class="text-title" fill="#94a3b8">Foundation Model (M)</text>
    <text x="8" y="34" class="text-muted">Inference Client STUBBED</text>
    <text x="8" y="48" class="text-mono-bold" font-size="8.5" fill="#dc2626">ZERO GPU INVOCATION</text>
    <text x="8" y="62" class="text-muted">No prompt tokens submitted</text>
    
    <!-- Red Severance Cross -->
    <line x1="15" y1="15" x2="155" y2="65" class="sever-line" />
    <line x1="15" y1="65" x2="155" y2="15" class="sever-line" />
  </g>

  <!-- Severed Node 3: Policy Network Transport Severed -->
  <g transform="translate(465, 335)">
    <rect x="0" y="0" width="165" height="75" class="card-severed" />
    <text x="8" y="18" class="text-title" fill="#94a3b8">Network Tool Dispatch</text>
    <text x="8" y="34" class="text-muted">RPC Transport SEVERED</text>
    <text x="8" y="48" class="text-mono-bold" font-size="8.5" fill="#dc2626">ZERO EXTERNAL MUTATIONS</text>
    <text x="8" y="62" class="text-muted">Zero packets leave NIC</text>
    
    <!-- Red Severance Cross -->
    <line x1="15" y1="15" x2="150" y2="65" class="sever-line" />
    <line x1="15" y1="65" x2="150" y2="15" class="sever-line" />
  </g>

  <!-- Observation Mocker Box -->
  <g transform="translate(675, 335)">
    <rect x="0" y="0" width="170" height="75" class="card" stroke="#059669" stroke-width="1.2" />
    <text x="8" y="18" class="text-title" fill="#047857">Observation Mocker</text>
    <text x="8" y="34" class="text-body" font-size="9.5">Intercepts tool dispatch.</text>
    <text x="8" y="48" class="text-body" font-size="9.5">Injects historical e_obs</text>
    <text x="8" y="62" class="text-mono" font-size="8.5" fill="#047857">without executing action.</text>
  </g>

  <!-- Replay Node 5: Event Store Input -->
  <g transform="translate(890, 335)">
    <rect x="0" y="0" width="130" height="210" class="card" />
    <rect x="0" y="0" width="130" height="24" rx="3" class="card-green" />
    <text x="8" y="16" class="text-title" fill="#047857">Event Store (E)</text>
    
    <text x="8" y="42" class="text-mono-bold">Read-Only Stream:</text>
    <text x="8" y="58" class="text-mono" font-size="8.5" fill="#047857">e0 -&gt; delta()</text>
    <text x="8" y="72" class="text-mono" font-size="8.5" fill="#047857">e1 -&gt; delta()</text>
    <text x="8" y="86" class="text-mono" font-size="8.5" fill="#047857">e2 -&gt; delta()</text>
    <text x="8" y="100" class="text-mono" font-size="8.5" fill="#047857">e3 -&gt; delta()</text>
    <text x="8" y="114" class="text-mono" font-size="8.5" fill="#047857">e4 -&gt; delta()</text>
    <text x="8" y="128" class="text-mono" font-size="8.5" fill="#047857">e5 -&gt; delta()</text>
    <line x1="6" y1="138" x2="124" y2="138" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="8" y="154" class="text-mono-bold" font-size="8.5" fill="#047857">Sequential Scan</text>
    <text x="8" y="170" class="text-muted" font-size="8">Immutable ground truth</text>
    <text x="8" y="186" class="text-muted" font-size="8">Authoritative log</text>
  </g>

  <!-- Replay Invariant Footer Banner -->
  <g transform="translate(250, 480)">
    <rect x="0" y="0" width="595" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="18" class="text-mono-bold" font-size="9" fill="#dc2626">REPLAY INVARIANT (A = 0):</text>
    <text x="175" y="18" class="text-body" font-size="9">Isolated from network and inference</text>
    <text x="12" y="36" class="text-body" font-size="9">Unlogged side effect raises an A = 0 violation</text>
    
  </g>

</svg>
