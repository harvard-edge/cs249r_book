<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="960" height="580" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE ASYMMETRIC LATENCY DISPARITY AND KV-CACHE HOLDING COST</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Comparison of synchronous blocking versus asynchronous hierarchical memory swapping under Pareto-distributed human delays</text>

  <!-- ================================================================= -->
  <!-- PANEL A: NAIVE SYNCHRONOUS RUNTIME (MEMORY STARVATION)            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="920" height="235" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. NAIVE SYNCHRONOUS RUNTIME (ACCELERATOR MEMORY STARVATION ANTIPATTERN)</text>
    <text x="908" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#991b1b">HOLDING COST: 100% MAXIMUM PENALTY</text>

    <!-- Step 1: Active Inference -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="170" height="190" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Step t: Token Decode</text>
      <text x="12" y="36" font-size="7.5" fill="#475569">• Latency: ~500 ms</text>
      <text x="12" y="50" font-size="7.5" fill="#475569">• FLOP Util: 65% (Active)</text>
      <text x="12" y="64" font-size="7.5" fill="#475569">• Alloc: 21.5 GB KV Cache</text>
      <g transform="translate(10, 85)">
        <rect x="0" y="0" width="150" height="52" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="75" y="18" text-anchor="middle" font-size="7.5" font-weight="600" fill="#64748b">HBM Allocated</text>
        <text x="75" y="34" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284c7">21.5 GB Resident</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="185" y1="127" x2="218" y2="127" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Step 2: Blocking Human Gate -->
    <g transform="translate(220, 32)">
      <rect x="0" y="0" width="270" height="190" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Blocking Human Gate (IDLE)</text>
      <text x="12" y="36" font-size="7.5" fill="#475569">• Duration: 30 min – 24 hours (Heavy-tailed Pareto)</text>
      <text x="12" y="50" font-size="7.5" font-weight="700" fill="#dc2626">• FLOP Util: 0.0% (Processor completely frozen)</text>
      <text x="12" y="64" font-size="7.5" font-weight="700" fill="#991b1b">• HBM Status: 21.5 GB PINNED IN SILICON</text>
      <g transform="translate(10, 85)">
        <rect x="0" y="0" width="250" height="52" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
        <text x="125" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">HAZARD: 27% of 80 GB GPU Stranded</text>
        <text x="125" y="34" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Blocks other requests from allocating physical pages</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="490" y1="127" x2="523" y2="127" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Step 3: Cascading Crisis -->
    <g transform="translate(525, 32)">
      <rect x="0" y="0" width="250" height="190" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Cascading Cluster Crisis</text>
      <text x="12" y="36" font-size="7.5" fill="#7f1d1d">• Multiple agents enter approval wait</text>
      <text x="12" y="50" font-size="7.5" fill="#7f1d1d">• PagedAttention free pool exhausted</text>
      <text x="12" y="64" font-size="7.5" fill="#7f1d1d">• Inbound user requests stall or crash</text>
      <text x="12" y="78" font-size="7.5" font-weight="700" fill="#dc2626">• Severe Out-Of-Memory (OOM) aborts</text>
      <g transform="translate(10, 95)">
        <rect x="0" y="0" width="230" height="42" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="115" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">ZERO CLUSTER GOODPUT</text>
        <text x="115" y="32" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Cluster throughput drops to 0 tokens/sec</text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="775" y1="127" x2="808" y2="127" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-slate)"/>

    <!-- Step 4: Resume -->
    <g transform="translate(810, 32)">
      <rect x="0" y="0" width="95" height="190" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Step t+1</text>
      <text x="10" y="36" font-size="7.5" fill="#64748b">• Resumes</text>
      <text x="10" y="48" font-size="7.5" fill="#64748b">  after delay</text>
      <text x="10" y="70" font-size="7.5" font-weight="700" fill="#dc2626">• Tens of</text>
      <text x="10" y="82" font-size="7.5" font-weight="700" fill="#dc2626">  dollars</text>
      <text x="10" y="94" font-size="7.5" font-weight="700" fill="#dc2626">  wasted in</text>
      <text x="10" y="106" font-size="7.5" font-weight="700" fill="#dc2626">  idle HBM</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: ASYNCHRONOUS RUNTIME (MEMORY EVACUATION)                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="920" height="255" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">B. ASYNCHRONOUS EVENT-DRIVEN RUNTIME (HIERARCHICAL MEMORY SWAPPING)</text>
    <text x="908" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">HOLDING COST ELIMINATION: 96.8% TO 99.8%</text>

    <!-- Step 1: Active Token Generation -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="150" height="210" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Step t: Decode</text>
      <text x="10" y="34" font-size="7.5" fill="#475569">• Active forward pass</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• Generates tool call</text>
      <text x="10" y="62" font-size="7.5" fill="#475569">• Context: 21.5 GB</text>
      <g transform="translate(8, 80)">
        <rect x="0" y="0" width="134" height="75" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="67" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Accelerator HBM</text>
        <text x="67" y="32" text-anchor="middle" font-size="7.5" fill="#64748b">Allocated Page Frames</text>
        <rect x="12" y="44" width="110" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="67" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">21.5 GB Active</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="165" y1="137" x2="188" y2="137" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Step 2: SYS_ESCALATE Trap -->
    <g transform="translate(190, 32)">
      <rect x="0" y="0" width="170" height="210" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#6d28d9">Trap: SYS_ESCALATE</text>
      <text x="10" y="34" font-size="7.5" fill="#475569">• Irreversible action trap</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• Evaluates threshold:</text>
      <text x="10" y="62" font-size="7.5" font-weight="700" fill="#6d28d9">  T_wait ≫ T_breakeven</text>
      <g transform="translate(8, 80)">
        <rect x="0" y="0" width="154" height="75" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
        <text x="77" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Swapping Breakeven</text>
        <text x="77" y="30" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5b21b6">T_breakeven = 835 ms</text>
        <text x="77" y="44" text-anchor="middle" font-size="7" fill="#64748b">PCIe Gen5 x16 DMA</text>
        <text x="77" y="58" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Human: ~1,800 s → Evict!</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="360" y1="137" x2="383" y2="137" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Step 3: DMA Evacuation -->
    <g transform="translate(385, 32)">
      <rect x="0" y="0" width="175" height="210" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0369a1">DMA Stream Evac</text>
      <text x="10" y="34" font-size="7.5" fill="#475569">• DMA to Host DRAM</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• Throughput: ~54 GB/s</text>
      <text x="10" y="62" font-size="7.5" fill="#475569">• Duration: 397.6 ms</text>
      <g transform="translate(8, 80)">
        <rect x="0" y="0" width="159" height="75" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="79" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">HBM Memory Reclaimed</text>
        <text x="79" y="32" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">0 GB GPU RESIDENT</text>
        <text x="79" y="46" text-anchor="middle" font-size="7.5" fill="#334155">ACB &amp; KV parked in DRAM</text>
        <text x="79" y="60" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">(Holding cost cut: 96.8%)</text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="560" y1="137" x2="583" y2="137" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Step 4: Human Review & Cluster Sharing -->
    <g transform="translate(585, 32)">
      <rect x="0" y="0" width="180" height="210" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#15803d">Promise Pending (Shared)</text>
      <text x="10" y="34" font-size="7.5" fill="#475569">• Human deliberates</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• Watchdog timer active</text>
      <text x="10" y="62" font-size="7.5" font-weight="700" fill="#15803d">• GPU completely freed</text>
      <g transform="translate(8, 80)">
        <rect x="0" y="0" width="164" height="75" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="82" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Cluster Efficiency</text>
        <text x="82" y="32" text-anchor="middle" font-size="7.5" fill="#334155">Accelerator executes other</text>
        <text x="82" y="44" text-anchor="middle" font-size="7.5" fill="#334155">active batch workloads</text>
        <text x="82" y="60" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">100% FLOP UTILIZATION</text>
      </g>
    </g>

    <!-- Arrow 4 -> 5 -->
    <line x1="765" y1="137" x2="788" y2="137" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Step 5: Signed Lease & Rehydration -->
    <g transform="translate(790, 32)">
      <rect x="0" y="0" width="115" height="210" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Rehydrate</text>
      <text x="10" y="34" font-size="7.5" fill="#475569">• Lease signed</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• DMA return: 397 ms</text>
      <text x="10" y="62" font-size="7.5" font-weight="700" fill="#15803d">• 0 recompute</text>
      <g transform="translate(8, 80)">
        <rect x="0" y="0" width="99" height="75" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="49" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Fast Resume</text>
        <text x="49" y="32" text-anchor="middle" font-size="7" fill="#64748b">Prefix aligned</text>
        <text x="49" y="44" text-anchor="middle" font-size="7" fill="#64748b">at step boundary</text>
        <text x="49" y="60" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Immediate TTFT</text>
      </g>
    </g>
  </g>

</svg>
