<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="580" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="984" height="564" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title Header -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="952" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE ASYMMETRIC LATENCY DISPARITY AND KV-CACHE HOLDING COST</text>
  </g>

  <!-- PANEL A: Naive Synchronous Runtime (Memory Wall Antipattern) -->
  <g transform="translate(24, 66)" >
    <rect width="952" height="215" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" />
    <rect width="952" height="28" rx="2" fill="#FEE2E2" />
    <rect y="20" width="952" height="8" fill="#FEE2E2" />
    <text x="16" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">A. Naive Synchronous Runtime (Accelerator Memory Starvation Antipattern)</text>
    <text x="936" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="end">HOLDING COST: 100% MAXIMUM PENALTY</text>

    <!-- Step 1: Active Inference -->
    <g transform="translate(16, 40)">
      <rect width="170" height="150" rx="2" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
      <rect width="170" height="22" rx="2" fill="#F1F5F9" />
      <rect y="16" width="170" height="6" fill="#F1F5F9" />
      <text x="85" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="middle">Step t: Token Decode</text>
      <text x="14" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">• Latency: ~500 ms</text>
      <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">• FLOP Util: 65% (Active)</text>
      <text x="14" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">• Alloc: 21.5 GB KV Cache</text>
      <rect x="12" y="94" width="146" height="42" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="85" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">HBM Allocated</text>
      <text x="85" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">21.5 GB Resident</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 194,115 L 220,115" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)" />

    <!-- Step 2: Blocking Human Gate -->
    <g transform="translate(228, 40)">
      <rect width="260" height="150" rx="2" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
      <rect width="260" height="22" rx="2" fill="#FEE2E2" />
      <rect y="16" width="260" height="6" fill="#FEE2E2" />
      <text x="130" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">Blocking Human Gate (IDLE)</text>
      <text x="14" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">• Duration: 30 min – 24 hours (Heavy-tailed Pareto)</text>
      <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#DC2626">• FLOP Util: 0.0% (Processor completely frozen)</text>
      <text x="14" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991B1B">• HBM Status: 21.5 GB PINNED IN SILICON</text>
      <rect x="12" y="90" width="236" height="46" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-dasharray="3 2" />
      <text x="130" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">HAZARD: 27% of 80 GB GPU Stranded</text>
      <text x="130" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#7F1D1D" text-anchor="middle">Blocks other requests from allocating pages</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 496,115 L 522,115" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)" />

    <!-- Step 3: Cascading Crisis -->
    <g transform="translate(530, 40)">
      <rect width="240" height="150" rx="2" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1" />
      <rect width="240" height="22" rx="2" fill="#FFE4E6" />
      <rect y="16" width="240" height="6" fill="#FFE4E6" />
      <text x="120" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9F1239" text-anchor="middle">Cascading Cluster Crisis</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#881337">• Multiple agents enter approval wait</text>
      <text x="14" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#881337">• PagedAttention free pool exhausted</text>
      <text x="14" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#881337">• Inbound user requests stall or crash</text>
      <text x="14" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#BE123C">• Severe Out-Of-Memory (OOM) aborts</text>
      <rect x="12" y="112" width="216" height="24" rx="4" fill="#BE123C" />
      <text x="120" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">ZERO CLUSTER GOODPUT</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 778,115 L 804,115" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowGray)" />

    <!-- Step 4: Resume -->
    <g transform="translate(812, 40)">
      <rect width="124" height="150" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <rect width="124" height="22" rx="2" fill="#F1F5F9" />
      <rect y="16" width="124" height="6" fill="#F1F5F9" />
      <text x="62" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Step t+1 Infer</text>
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">• Resumes after</text>
      <text x="12" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">  hours of delay</text>
      <text x="12" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#DC2626">• Tens of dollars</text>
      <text x="12" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#DC2626">  wasted in idle</text>
      <text x="12" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#DC2626">  HBM lease</text>
    </g>
  </g>

  <!-- PANEL B: Asynchronous Runtime (Hierarchical Memory Evacuation) -->
  <g transform="translate(24, 296)" >
    <rect width="952" height="260" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <rect width="952" height="28" rx="2" fill="#DCFCE7" />
    <rect y="20" width="952" height="8" fill="#DCFCE7" />
    <text x="16" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#166534">B. Asynchronous Event-Driven Runtime (Hierarchical Memory Swapping)</text>
    <text x="936" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="end">HOLDING COST ELIMINATION: 96.8% TO 99.8%</text>

    <!-- Step 1: Active Token Generation -->
    <g transform="translate(16, 40)">
      <rect width="144" height="195" rx="2" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <rect width="144" height="22" rx="2" fill="#F1F5F9" />
      <rect y="16" width="144" height="6" fill="#F1F5F9" />
      <text x="72" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">Step t: Decode</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Active forward pass</text>
      <text x="12" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Generates tool call</text>
      <text x="12" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Context: 21.5 GB</text>
      <rect x="10" y="98" width="124" height="82" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="72" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Accelerator HBM</text>
      <text x="72" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Allocated Page Frames</text>
      <rect x="18" y="146" width="108" height="22" rx="3" fill="#581C87" />
      <text x="72" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">21.5 GB Active</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 168,138 L 192,138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)" />

    <!-- Step 2: SYS_ESCALATE Trap -->
    <g transform="translate(200, 40)">
      <rect width="160" height="195" rx="2" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1" />
      <rect width="160" height="22" rx="2" fill="#EDE9FE" />
      <rect y="16" width="160" height="6" fill="#EDE9FE" />
      <text x="80" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#581C87" text-anchor="middle">Trap: SYS_ESCALATE</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Irreversible action trap</text>
      <text x="12" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Evaluates threshold:</text>
      <text x="12" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#581C87">  T_wait &gt;&gt; T_breakeven</text>
      <rect x="10" y="88" width="140" height="96" rx="4" fill="#FAF5FF" stroke="#D8B4FE" />
      <text x="80" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8" text-anchor="middle">Swapping Breakeven</text>
      <text x="80" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#7C3AED" text-anchor="middle">T_breakeven = 835 ms</text>
      <text x="80" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Over PCIe Gen5 x16</text>
      <text x="80" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#15803D" text-anchor="middle">Human wait: 1,800 s</text>
      <text x="80" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#16A34A" text-anchor="middle">→ Proactive Eviction!</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 368,138 L 392,138" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowPurple)" />

    <!-- Step 3: DMA Evacuation -->
    <g transform="translate(400, 40)">
      <rect width="170" height="195" rx="2" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
      <rect width="170" height="22" rx="2" fill="#DBEAFE" />
      <rect y="16" width="170" height="6" fill="#DBEAFE" />
      <text x="85" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle">DMA Stream Evac</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• DMA to Host DRAM</text>
      <text x="12" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Throughput: ~54 GB/s</text>
      <text x="12" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Duration: 397.6 ms</text>
      <rect x="10" y="86" width="150" height="98" rx="4" fill="#EFF6FF" stroke="#93C5FD" />
      <text x="85" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">HBM Memory Reclaimed</text>
      <rect x="20" y="114" width="130" height="24" rx="3" fill="#16A34A" />
      <text x="85" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 GB GPU RESIDENT</text>
      <text x="85" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569" text-anchor="middle">ACB &amp; KV parked in DRAM</text>
      <text x="85" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#15803D" text-anchor="middle">(Holding cost cut: 96.8%)</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 578,138 L 602,138" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Step 4: Human Review & Cluster Sharing -->
    <g transform="translate(610, 40)">
      <rect width="170" height="195" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
      <rect width="170" height="22" rx="2" fill="#DCFCE7" />
      <rect y="16" width="170" height="6" fill="#DCFCE7" />
      <text x="85" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Promise Pending (Shared)</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Human deliberates</text>
      <text x="12" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">• Watchdog timer active</text>
      <text x="12" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534">• GPU completely freed</text>
      <rect x="10" y="86" width="150" height="98" rx="4" fill="#F0FDF4" stroke="#86EFAC" />
      <text x="85" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#14532D" text-anchor="middle">Cluster Efficiency</text>
      <text x="85" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155" text-anchor="middle">Accelerator executes</text>
      <text x="85" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155" text-anchor="middle">other active workloads</text>
      <rect x="18" y="148" width="134" height="24" rx="3" fill="#166534" />
      <text x="85" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">100% FLOP UTILIZATION</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 788,138 L 812,138" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- Step 5: Signed Lease & Rehydration -->
    <g transform="translate(820, 40)">
      <rect width="116" height="195" rx="2" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <rect width="116" height="22" rx="2" fill="#F1F5F9" />
      <rect y="16" width="116" height="6" fill="#F1F5F9" />
      <text x="58" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">Rehydrate</text>
      <text x="10" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Lease signed</text>
      <text x="10" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• DMA return</text>
      <text x="10" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">  latency: 397 ms</text>
      <text x="10" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#15803D">• 0 recompute</text>
      <rect x="8" y="106" width="100" height="78" rx="4" fill="#F0FDF4" stroke="#86EFAC" />
      <text x="58" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#14532D" text-anchor="middle">Fast Resume</text>
      <text x="58" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Prefix aligned</text>
      <text x="58" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569" text-anchor="middle">at step boundary</text>
      <text x="58" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#15803D" text-anchor="middle">Immediate TTFT</text>
    </g>
  </g>
</svg>
