<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT DOMAIN: REVERSIBLE INTERNAL STATE (BLUE)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="415" height="378" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">REVERSIBLE INTERNAL STATE DOMAIN</text>
    <text x="403" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#0369a1">100% INVERTIBLE</text>

    <!-- Card 1: Context Window -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">1. Context Working Set &amp; Attention KV Cache</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Ephemeral transformer activations stored in GPU HBM / Host RAM</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Zero-copy tree branching via Radix prefix trees (SGLang / vLLM)</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#0284c7">Rollback Mechanism: Pop context turn, trim KV cache tree (Latency: &lt; 1 ms)</text>
    </g>

    <!-- Card 2: Git Worktrees -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">2. Git Worktrees &amp; Detached HEAD Sandboxes</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Local filesystem workspace branched off integration HEAD</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Unchecked AST mutations, speculative refactorings, test runs</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#0284c7">Rollback Mechanism: git checkout . ; git clean -fd (Latency: 2–5 ms)</text>
    </g>

    <!-- Card 3: MicroVM CoW -->
    <g transform="translate(12, 204)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">3. MicroVM Copy-on-Write Filesystems (OverlayFS)</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Ephemeral UpperDir capturing mutations atop immutable LowerDir</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Arbitrary package installs, compiler builds, intermediate files</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#0284c7">Rollback Mechanism: rm -rf UpperDir / Discard microVM (Latency: &lt; 2 ms)</text>
    </g>

    <!-- Card 4: Speculative Search -->
    <g transform="translate(12, 290)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">4. Speculative Trajectory Search (Best-of-N, MCTS)</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Parallel candidate trajectories explored concurrently</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Evaluated by deterministic oracles before external commit</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#0284c7">Rollback Mechanism: Discard losing branches; zero persistent side-effects</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER: THE REVERSIBILITY BOUNDARY (RED DASHED & GATEWAY)          -->
  <!-- ================================================================= -->
  <line x1="480" y1="75" x2="480" y2="453" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Forward Flow Arrow Across Boundary -->
  <path d="M440,125 L520,125" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <rect x="454" y="105" width="52" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
  <text x="480" y="116" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">DISPATCH</text>

  <!-- Gatekeeper Card: Human Approval & State Suspension -->
  <g transform="translate(440, 195)">
    <rect x="0" y="0" width="80" height="152" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="80" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="40" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">GATEWAY</text>

    <!-- Sub-boxes -->
    <g transform="translate(6, 28)">
      <rect x="0" y="0" width="68" height="32" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="34" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">Human</text>
      <text x="34" y="25" text-anchor="middle" font-size="7" fill="#64748b">Approval</text>
    </g>

    <g transform="translate(6, 66)">
      <rect x="0" y="0" width="68" height="42" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="34" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Suspend</text>
      <text x="34" y="26" text-anchor="middle" font-size="7" fill="#78350f">Free HBM</text>
      <text x="34" y="36" text-anchor="middle" font-size="6.5" fill="#d97706">DMA Evict</text>
    </g>

    <g transform="translate(6, 114)">
      <rect x="0" y="0" width="68" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="34" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">10⁶× Latency</text>
      <text x="34" y="24" text-anchor="middle" font-size="6.5" fill="#64748b">Disparity</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT DOMAIN: IRREVERSIBLE EXTERNAL ACTUATION (RED)               -->
  <!-- ================================================================= -->
  <g transform="translate(505, 75)">
    <rect x="0" y="0" width="415" height="378" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">IRREVERSIBLE EXTERNAL ACTUATION DOMAIN</text>
    <text x="403" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#991b1b">NON-INVERTIBLE</text>

    <!-- Card 1: Production Databases -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">1. Production Relational &amp; Document Stores</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Direct SQL mutations: UPDATE balances, DELETE FROM users</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• No 2-phase commit (2PC) possible across heterogeneous services</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#dc2626">Recovery: Compensating transaction handler (A⁻¹) or point-in-time restore</text>
    </g>

    <!-- Card 2: Cloud Infrastructure -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">2. Cloud Infrastructure &amp; Fleet Provisioning</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• AWS API: ec2:TerminateInstances, terraform apply, Route53 updates</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Physical storage deletion, IAM permission mutations</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#dc2626">Recovery: Complex redeployment saga; data loss may be unrecoverable</text>
    </g>

    <!-- Card 3: External Communications -->
    <g transform="translate(12, 204)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">3. External Communications &amp; Customer Notifications</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• SMTP email dispatch, Slack messages, Twilio SMS alerts, Webhooks</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Once dispatched over internet, packets cannot be recalled</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#dc2626">Recovery: Send apology / retraction email (compensating semantic action)</text>
    </g>

    <!-- Card 4: Financial & Physical APIs -->
    <g transform="translate(12, 290)">
      <rect x="0" y="0" width="391" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">4. Financial Transactions &amp; Cyber-Physical Actuators</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Stripe credit card charge, banking ACH transfer, crypto asset swap</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Robotic arm motion, physical warehouse sorter, CNC cutting</text>
      <text x="10" y="64" font-size="7.5" font-weight="600" fill="#dc2626">Recovery: Refund API (fees lost); physical real-world actions are final</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM ARCHITECTURAL INVARIANT FOOTER                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 465)">
    <rect x="0" y="0" width="880" height="58" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">CORE SYSTEMS INVARIANT: THE REVERSIBILITY BOUNDARY REQUIRES ASYMMETRIC ARCHITECTURE</text>
    <text x="12" y="34" font-size="7.5" fill="#475569">Internal errors are cheap and resolved by speculative rollbacks. External actions have no mathematical inverse:</text>
    <text x="12" y="47" font-size="7.5" fill="#475569">they require typed deterministic Sagas (A⁻¹) or runtime state suspension behind human approval gates.</text>
  </g>

</g>
</svg>