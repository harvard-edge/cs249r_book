<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="510" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PIPELINE STAGES (TOP ROW)                                         -->
  <!-- ================================================================= -->
  <!-- 0. Candidate Action Card -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="140" height="225" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="10" y="16" font-size="8.5" font-weight="700" fill="#334155">CANDIDATE ACTION</text>

    <text x="10" y="40" font-size="7.5" font-weight="700" fill="#0f172a">Generator:</text>
    <text x="10" y="52" font-size="7.5" fill="#475569">Stochastic LLM</text>
    <text x="10" y="64" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#64748b">a_t ~ pi(a | s_t)</text>

    <g transform="translate(8, 72)">
      <rect x="0" y="0" width="124" height="38" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#991b1b">Fail-Plausible Risk</text>
      <text x="8" y="24" font-size="7" fill="#7f1d1d">Syntactically confident,</text>
      <text x="8" y="33" font-size="7" fill="#7f1d1d">semantically flawed</text>
    </g>

    <text x="10" y="126" font-size="7.5" font-weight="700" fill="#0f172a">Payload Types:</text>
    <text x="10" y="138" font-size="7" fill="#475569">• Tool JSON call</text>
    <text x="10" y="149" font-size="7" fill="#475569">• Git code diff</text>
    <text x="10" y="160" font-size="7" fill="#475569">• SQL query / Bash</text>

    <g transform="translate(8, 175)">
      <rect x="0" y="0" width="124" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="62" y="16" text-anchor="middle" font-size="7" fill="#64748b">Latency: ~500–1500 ms</text>
      <text x="62" y="30" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">Non-Deterministic</text>
    </g>
  </g>

  <!-- Arrow from Generator to Stage 1 -->
  <line x1="180" y1="187" x2="203" y2="187" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Stage 1: Syntax & Schema Gate -->
  <g transform="translate(205, 75)">
    <rect x="0" y="0" width="160" height="225" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">1. SYNTAX &amp; SCHEMA</text>
    <text x="152" y="16" text-anchor="end" font-size="7.5" font-weight="700" fill="#0369a1">&lt; 2 ms</text>

    <text x="10" y="40" font-size="7.5" font-weight="700" fill="#0f172a">Oracles (Deterministic):</text>
    <text x="10" y="53" font-size="7" fill="#334155">• JSON-RPC schema (MCP)</text>
    <text x="10" y="65" font-size="7" fill="#334155">• Tree-sitter AST parser</text>
    <text x="10" y="77" font-size="7" fill="#334155">• Pydantic type validator</text>

    <text x="10" y="96" font-size="7.5" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="109" font-size="7" fill="#475569">• Unclosed string/bracket</text>
    <text x="10" y="121" font-size="7" fill="#475569">• Missing required params</text>
    <text x="10" y="133" font-size="7" fill="#475569">• Unknown tool identifier</text>

    <g transform="translate(8, 185)">
      <rect x="0" y="0" width="144" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="72" y="17" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#0369a1">Schema.validate(a_t)</text>
    </g>
  </g>

  <!-- Arrow Stage 1 to Stage 2 -->
  <line x1="365" y1="187" x2="383" y2="187" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Stage 2: Static Analysis & Type Gate -->
  <g transform="translate(385, 75)">
    <rect x="0" y="0" width="160" height="225" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">2. STATIC ANALYSIS</text>
    <text x="152" y="16" text-anchor="end" font-size="7.5" font-weight="700" fill="#6d28d9">10–50 ms</text>

    <text x="10" y="40" font-size="7.5" font-weight="700" fill="#0f172a">Oracles (Deterministic):</text>
    <text x="10" y="53" font-size="7" fill="#334155">• TypeScript compiler (tsc)</text>
    <text x="10" y="65" font-size="7" fill="#334155">• Python typechecker (mypy)</text>
    <text x="10" y="77" font-size="7" fill="#334155">• AST linters (ruff, eslint)</text>

    <text x="10" y="96" font-size="7.5" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="109" font-size="7" fill="#475569">• Undefined symbols/imports</text>
    <text x="10" y="121" font-size="7" fill="#475569">• Type mismatches (int/str)</text>
    <text x="10" y="133" font-size="7" fill="#475569">• Dead code / unreachable</text>

    <g transform="translate(8, 185)">
      <rect x="0" y="0" width="144" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="72" y="17" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#6d28d9">mypy --strict patch.py</text>
    </g>
  </g>

  <!-- Arrow Stage 2 to Stage 3 -->
  <line x1="545" y1="187" x2="563" y2="187" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Stage 3: Dynamic Sandbox Test Oracle -->
  <g transform="translate(565, 75)">
    <rect x="0" y="0" width="160" height="225" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">3. DYNAMIC SANDBOX</text>
    <text x="152" y="16" text-anchor="end" font-size="7.5" font-weight="700" fill="#b45309">100–2000 ms</text>

    <text x="10" y="40" font-size="7.5" font-weight="700" fill="#0f172a">Oracles (Isolated VM):</text>
    <text x="10" y="53" font-size="7" fill="#334155">• Test runners (pytest, cargo)</text>
    <text x="10" y="65" font-size="7" fill="#334155">• Regression test suites</text>
    <text x="10" y="77" font-size="7" fill="#334155">• Property invariant assertions</text>

    <text x="10" y="96" font-size="7.5" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="109" font-size="7" fill="#475569">• Functional regression bugs</text>
    <text x="10" y="121" font-size="7" fill="#475569">• Non-zero exit codes</text>
    <text x="10" y="133" font-size="7" fill="#475569">• Out-of-memory / Segfaults</text>

    <g transform="translate(8, 185)">
      <rect x="0" y="0" width="144" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="72" y="17" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" font-weight="700" fill="#b45309">pytest -q test_core.py</text>
    </g>
  </g>

  <!-- Arrow Stage 3 to Stage 4 -->
  <line x1="725" y1="187" x2="743" y2="187" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Semantic Invariant & Safety Gate -->
  <g transform="translate(745, 75)">
    <rect x="0" y="0" width="175" height="225" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">4. INVARIANT &amp; SAFETY</text>
    <text x="167" y="16" text-anchor="end" font-size="7.5" font-weight="700" fill="#15803d">5–20 ms</text>

    <text x="10" y="40" font-size="7.5" font-weight="700" fill="#0f172a">Oracles (Policy Gate):</text>
    <text x="10" y="53" font-size="7" fill="#334155">• Pre/post-condition contracts</text>
    <text x="10" y="65" font-size="7" fill="#334155">• Reversibility boundary check</text>
    <text x="10" y="77" font-size="7" fill="#334155">• Token &amp; cost budget guard</text>

    <text x="10" y="96" font-size="7.5" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="109" font-size="7" fill="#475569">• Unauthorized file deletion</text>
    <text x="10" y="121" font-size="7" fill="#475569">• Uncompensated side-effects</text>
    <text x="10" y="133" font-size="7" fill="#475569">• Infinite trajectory drift</text>

    <g transform="translate(8, 185)">
      <rect x="0" y="0" width="159" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="79" y="17" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" font-weight="700" fill="#15803d">assert policy.is_safe(delta)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FAIL PATHWAY (DOWNWARD RED LINES & RECOVERY BOX)                   -->
  <!-- ================================================================= -->
  <!-- Downward drops from gates -->
  <line x1="285" y1="300" x2="285" y2="330" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="465" y1="300" x2="465" y2="330" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="645" y1="300" x2="645" y2="330" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="832" y1="300" x2="832" y2="330" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Failure Bus Line -->
  <line x1="285" y1="330" x2="832" y2="330" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="560" y1="330" x2="560" y2="368" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Any Rejection Badge -->
  <g transform="translate(505, 320)">
    <rect x="0" y="0" width="110" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="55" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">ANY REJECTION</text>
  </g>

  <!-- Failure Recovery Box -->
  <g transform="translate(235, 370)">
    <rect x="0" y="0" width="685" height="74" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="685" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#991b1b">DETERMINISTIC ERROR RECOVERY ROUTINE (FORK-ON-ERROR &amp; ROLLBACK)</text>
    <text x="12" y="36" font-size="7.5" fill="#7f1d1d">1. Structured Error Diff: Extract exact compiler line or failing test traceback (discard noisy conversational prose).</text>
    <text x="12" y="49" font-size="7.5" fill="#7f1d1d">2. Prune Poisoned Context: Remove hallucinated turn from active KV working set to prevent confirmation bias.</text>
    <text x="12" y="62" font-size="7.5" fill="#7f1d1d">3. Counterfactual Branching: Fork stategraph from last verified checkpoint; invoke alternative search branch or compensating Saga.</text>
  </g>

  <!-- ================================================================= -->
  <!-- PASS PATHWAY (GREEN FORWARD COMMIT)                               -->
  <!-- ================================================================= -->
  <path d="M920,187 L935,187 L935,320 L130,320 L130,368" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <g transform="translate(85, 310)">
    <rect x="0" y="0" width="90" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="45" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">ALL PASS</text>
  </g>

  <!-- Pass Box -->
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="180" height="74" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">COMMIT &amp; ADVANCE</text>
    <text x="10" y="38" font-size="7.5" fill="#15803d">• State verified in working set</text>
    <text x="10" y="51" font-size="7.5" fill="#15803d">• Advance trajectory to step t+1</text>
    <text x="10" y="64" font-size="7" fill="#64748b">• Persist checkpoint delta</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM ARCHITECTURAL INVARIANT FOOTER                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 456)">
    <rect x="0" y="0" width="880" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">KEY ARCHITECTURAL INVARIANT: NEVER USE PROBABILISTIC MODELS AS EXCLUSIVE SAFETY ORACLES</text>
    <text x="12" y="32" font-size="7.5" fill="#475569">"LLM-as-a-judge" critics suffer from sycophancy, context dilution, and non-deterministic false negatives.</text>
    <text x="12" y="44" font-size="7.5" fill="#475569">Rigorous systems correctness requires deterministic compilers, AST validators, isolated microVM test execution, and hard invariant policies.</text>
  </g>

</g>
</svg>