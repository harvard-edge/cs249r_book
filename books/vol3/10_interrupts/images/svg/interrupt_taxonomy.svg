<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="660" fill="#FFFFFF" rx="12" />
  <rect x="8" y="8" width="984" height="644" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title Header -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="96" height="22" rx="4" fill="#581C87" />
    <text x="48" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FIGURE 10.1</text>
    <text x="110" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Hardware Interrupt and Trap Taxonomy in Agent Operating Systems</text>
    <text x="110" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Architectural classification of agent interrupts across origin (internal vs. external) and synchronicity quadrants</text>
  </g>

  <!-- Axis Labels / Indicators -->
  <g transform="translate(24, 66)">
    <rect x="30" y="0" width="430" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="245" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">EXTERNAL ORIGIN (Environment &amp; Human Supervisor)</text>

    <rect x="492" y="0" width="430" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="707" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">INTERNAL ORIGIN (Stochastic Model &amp; Tool Engine)</text>
  </g>

  <!-- Quadrant 1: Top-Left - Asynchronous External IRQs -->
  <g transform="translate(54, 102)" filter="url(#shadow)">
    <rect width="430" height="240" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <rect width="430" height="30" rx="8" fill="#DCFCE7" />
    <rect y="22" width="430" height="8" fill="#DCFCE7" />
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">Asynchronous External Interrupts (Hardware IRQs)</text>
    <rect x="340" y="6" width="76" height="18" rx="4" fill="#BBF7D0" />
    <text x="378" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="middle">MASKABLE</text>

    <!-- Subcards -->
    <g transform="translate(14, 38)">
      <rect width="402" height="34" rx="5" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <circle cx="14" cy="17" r="4" fill="#16A34A" />
      <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Human Supervisory Approval / Rejection Webhook</text>
      <text x="26" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Out-of-band resolution of pending permission leases (Slack, UI modal)</text>

      <rect y="40" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <circle cx="14" cy="57" r="4" fill="#16A34A" />
      <text x="26" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">User Steering Interjection (SIGINT)</text>
      <text x="26" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Operator injects context correction; yields at next step boundary</text>

      <rect y="80" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <circle cx="14" cy="97" r="4" fill="#16A34A" />
      <text x="26" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Asynchronous Tool Return Event</text>
      <text x="26" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Long-running compilation, batch SQL job, or remote CI webhook return</text>

      <!-- Handling Policy Box -->
      <rect y="122" width="402" height="42" rx="5" fill="#DCFCE7" stroke="#86EFAC" stroke-dasharray="3 2" />
      <text x="14" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D">Handling: Maskable, Drained at Token / Step Boundary</text>
      <text x="14" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#166534">Action: Transition ACB to Wakeup / Rehydration; rehydrate KV cache</text>
    </g>
  </g>

  <!-- Quadrant 2: Top-Right - Synchronous Traps -->
  <g transform="translate(516, 102)" filter="url(#shadow)">
    <rect width="430" height="240" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
    <rect width="430" height="30" rx="8" fill="#DBEAFE" />
    <rect y="22" width="430" height="8" fill="#DBEAFE" />
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E40AF">Synchronous Traps (AI System Calls)</text>
    <rect x="320" y="6" width="96" height="18" rx="4" fill="#BFDBFE" />
    <text x="368" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">PROGRAMMED</text>

    <!-- Subcards -->
    <g transform="translate(14, 38)">
      <rect width="402" height="34" rx="5" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="14" cy="17" r="4" fill="#2563EB" />
      <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">SYS_ESCALATE (Reversibility Boundary Crossing)</text>
      <text x="26" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Action lacks local inverse (wire transfer, DB drop); awaits signed lease</text>

      <rect y="40" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="14" cy="57" r="4" fill="#2563EB" />
      <text x="26" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">SYS_YIELD (Asynchronous Tool Wait Delegation)</text>
      <text x="26" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Voluntarily yield execution core while waiting on heavy peripheral</text>

      <rect y="80" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="14" cy="97" r="4" fill="#2563EB" />
      <text x="26" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">SYS_FORK (Subagent Tree Spawn &amp; Speculation)</text>
      <text x="26" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Attenuate capabilities, clone ACB state, spawn parallel sandboxes</text>

      <!-- Handling Policy Box -->
      <rect y="122" width="402" height="42" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-dasharray="3 2" />
      <text x="14" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A">Handling: Synchronous, Programmed Execution Yield</text>
      <text x="14" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#1E40AF">Action: Context Freeze &amp; Memory Evacuation (DMA swap if pause &gt; T_break)</text>
    </g>
  </g>

  <!-- Quadrant 3: Bottom-Left - Synchronous Faults -->
  <g transform="translate(54, 370)" filter="url(#shadow)">
    <rect width="430" height="240" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" />
    <rect width="430" height="30" rx="8" fill="#FEE2E2" />
    <rect y="22" width="430" height="8" fill="#FEE2E2" />
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Synchronous Faults &amp; Exceptions</text>
    <rect x="316" y="6" width="100" height="18" rx="4" fill="#FECACA" />
    <text x="366" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">RECOVERABLE</text>

    <!-- Subcards -->
    <g transform="translate(14, 38)">
      <rect width="402" height="34" rx="5" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
      <circle cx="14" cy="17" r="4" fill="#DC2626" />
      <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Tool Return Schema Violation (Malformed JSON)</text>
      <text x="26" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Deterministic decoding failure; rejected before external dispatch</text>

      <rect y="40" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
      <circle cx="14" cy="57" r="4" fill="#DC2626" />
      <text x="26" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Safety Invariant Breach / Taint Escape Detection</text>
      <text x="26" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Policy Enforcement Point intercepts unauthorized capability request</text>

      <rect y="80" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
      <circle cx="14" cy="97" r="4" fill="#DC2626" />
      <text x="26" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Cyclic Trajectory Livelock / Repetition Anomaly</text>
      <text x="26" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Agent loops on identical failed tool calls; retry budget exhausted</text>

      <!-- Handling Policy Box -->
      <rect y="122" width="402" height="42" rx="5" fill="#FEE2E2" stroke="#FCA5A5" stroke-dasharray="3 2" />
      <text x="14" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#7F1D1D">Handling: Synchronous, Software-Detected Exception</text>
      <text x="14" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#991B1B">Action: In-context reflection retry or backward-compensating Saga rollback</text>
    </g>
  </g>

  <!-- Quadrant 4: Bottom-Right - NMIs -->
  <g transform="translate(516, 370)" filter="url(#shadow)">
    <rect width="430" height="240" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5" />
    <rect width="430" height="30" rx="8" fill="#FEF3C7" />
    <rect y="22" width="430" height="8" fill="#FEF3C7" />
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400E">Non-Maskable Interrupts (Hardware NMIs)</text>
    <rect x="312" y="6" width="104" height="18" rx="4" fill="#FDE68A" />
    <text x="364" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">UNMASKABLE</text>

    <!-- Subcards -->
    <g transform="translate(14, 38)">
      <rect width="402" height="34" rx="5" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <circle cx="14" cy="17" r="4" fill="#D97706" />
      <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Authoritative Administrator Kill Switch (SIGKILL)</text>
      <text x="26" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Hard-stop override dispatched via out-of-band management network</text>

      <rect y="40" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <circle cx="14" cy="57" r="4" fill="#D97706" />
      <text x="26" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Hard Token Quota / Budget Wall Breach (SIGBUDGET)</text>
      <text x="26" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Monetary cap B_$ reached; immediate halt to prevent runaway billing</text>

      <rect y="80" width="402" height="34" rx="5" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <circle cx="14" cy="97" r="4" fill="#D97706" />
      <text x="26" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Watchdog Deadline Expiry (SIGDEADLINE)</text>
      <text x="26" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Hardware timer expires; revokes locks and triggers compensating Sagas</text>

      <!-- Handling Policy Box -->
      <rect y="122" width="402" height="42" rx="5" fill="#FEF3C7" stroke="#FCD34D" stroke-dasharray="3 2" />
      <text x="14" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#78350F">Handling: Unmaskable, Immediate Force Halting (&lt; 5 ms)</text>
      <text x="14" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#92400E">Action: Sever network sockets, destroy microVMs, burn capability leases</text>
    </g>
  </g>
</svg>
