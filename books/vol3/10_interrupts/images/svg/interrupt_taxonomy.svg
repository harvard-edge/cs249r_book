<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <!-- Clean White Canvas -->
  <rect width="960" height="615" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="575" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">HARDWARE INTERRUPT AND TRAP TAXONOMY IN AGENT OPERATING SYSTEMS</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Classification of asynchronous external signals, synchronous AI system traps, software faults, and hardware NMIs</text>

  <!-- Column Header Bands -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="430" height="24" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="215" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">EXTERNAL ORIGIN (Environment &amp; Human Supervisor)</text>
  </g>
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="430" height="24" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="215" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">INTERNAL ORIGIN (Stochastic Model &amp; Execution Engine)</text>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT 1: TOP-LEFT - ASYNCHRONOUS EXTERNAL IRQS (GREEN)         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 107)">
    <rect x="0" y="0" width="430" height="235" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">ASYNCHRONOUS EXTERNAL INTERRUPTS (IRQs)</text>
    <text x="418" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">MASKABLE</text>

    <!-- Subcards -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Human Supervisory Approval / Rejection Webhook</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Out-of-band resolution of pending permission leases (Slack, UI modal)</text>
    </g>

    <g transform="translate(12, 74)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">User Steering Interjection (SIGINT)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Operator injects context correction; yields at next step boundary</text>
    </g>

    <g transform="translate(12, 116)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Asynchronous Tool Return Event</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Long-running compilation, batch SQL job, or remote CI webhook return</text>
    </g>

    <!-- Handling Policy Box -->
    <g transform="translate(12, 158)">
      <rect x="0" y="0" width="406" height="65" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#15803d">Handling Policy: Maskable, Drained at Token / Step Boundary</text>
      <text x="10" y="32" font-size="7.5" fill="#166534">Action: Transition ACB to Wakeup / Rehydration; rehydrate KV cache</text>
      <text x="10" y="46" font-size="7" fill="#64748b">Guarantees atomic instruction retirement without corrupting GEMV state</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT 2: TOP-RIGHT - SYNCHRONOUS TRAPS (BLUE)                  -->
  <!-- ================================================================= -->
  <g transform="translate(490, 107)">
    <rect x="0" y="0" width="430" height="235" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">SYNCHRONOUS TRAPS (AI SYSTEM CALLS)</text>
    <text x="418" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#0369a1">PROGRAMMED</text>

    <!-- Subcards -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">SYS_ESCALATE (Reversibility Boundary Crossing)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Action lacks local inverse (wire transfer, DB drop); awaits signed lease</text>
    </g>

    <g transform="translate(12, 74)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">SYS_YIELD (Asynchronous Tool Wait Delegation)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Voluntarily yield execution core while waiting on heavy peripheral</text>
    </g>

    <g transform="translate(12, 116)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">SYS_FORK (Subagent Tree Spawn &amp; Speculation)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Attenuate capabilities, clone ACB state, spawn parallel sandboxes</text>
    </g>

    <!-- Handling Policy Box -->
    <g transform="translate(12, 158)">
      <rect x="0" y="0" width="406" height="65" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#0369a1">Handling Policy: Synchronous, Programmed Execution Yield</text>
      <text x="10" y="32" font-size="7.5" fill="#0284c7">Action: Context Freeze &amp; Memory Evacuation (DMA swap if pause &gt; tau_swap)</text>
      <text x="10" y="46" font-size="7" fill="#64748b">Saves volatile GPU memory, registers turn continuation promise</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT 3: BOTTOM-LEFT - SYNCHRONOUS FAULTS (RED)                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="430" height="235" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">SYNCHRONOUS FAULTS &amp; EXCEPTIONS</text>
    <text x="418" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#991b1b">RECOVERABLE</text>

    <!-- Subcards -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Tool Return Schema Violation (Malformed JSON)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Deterministic decoding failure; rejected before external dispatch</text>
    </g>

    <g transform="translate(12, 74)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Safety Invariant Breach / Taint Escape Detection</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Policy Enforcement Point intercepts unauthorized capability request</text>
    </g>

    <g transform="translate(12, 116)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Cyclic Trajectory Livelock / Repetition Anomaly</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Agent loops on identical failed tool calls; retry budget exhausted</text>
    </g>

    <!-- Handling Policy Box -->
    <g transform="translate(12, 158)">
      <rect x="0" y="0" width="406" height="65" rx="1" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#991b1b">Handling Policy: Synchronous, Software-Detected Exception</text>
      <text x="10" y="32" font-size="7.5" fill="#b91c1c">Action: In-context reflection retry or backward-compensating Saga rollback</text>
      <text x="10" y="46" font-size="7" fill="#64748b">Prunes poisoned context window, restores verified parent snapshot</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT 4: BOTTOM-RIGHT - NON-MASKABLE INTERRUPTS (AMBER)        -->
  <!-- ================================================================= -->
  <g transform="translate(490, 350)">
    <rect x="0" y="0" width="430" height="235" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">NON-MASKABLE INTERRUPTS (HARDWARE NMIs)</text>
    <text x="418" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#b45309">UNMASKABLE</text>

    <!-- Subcards -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Authoritative Administrator Kill Switch (SIGKILL)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Hard-stop override dispatched via out-of-band management network</text>
    </g>

    <g transform="translate(12, 74)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Hard Token Quota / Budget Wall Breach (SIGBUDGET)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Monetary cap B_$ reached; immediate halt to prevent runaway billing</text>
    </g>

    <g transform="translate(12, 116)">
      <rect x="0" y="0" width="406" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Watchdog Deadline Expiry (SIGDEADLINE)</text>
      <text x="10" y="27" font-size="7.5" fill="#64748b">Hardware timer expires; revokes locks and triggers compensating Sagas</text>
    </g>

    <!-- Handling Policy Box -->
    <g transform="translate(12, 158)">
      <rect x="0" y="0" width="406" height="65" rx="1" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#b45309">Handling Policy: Unmaskable, Immediate Force Halting (&lt; 5 ms)</text>
      <text x="10" y="32" font-size="7.5" fill="#d97706">Action: Sever network sockets, destroy microVMs, burn capability leases</text>
      <text x="10" y="46" font-size="7" fill="#64748b">Preempts active GEMM kernels, forces terminal transition immediately</text>
    </g>
  </g>

</svg>
