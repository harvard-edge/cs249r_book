<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .col-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .inner-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .col-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 700; }
      .box-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .arrow-blue { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#arrow-blue-m); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2; fill: none; marker-end: url(#arrow-purple-m); }
    </style>
    <marker id="arrow-blue-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" class="bg" />

  <!-- ==================== COLUMN 1: SOURCE WORKER ==================== -->
  <rect x="20" y="20" width="285" height="520" rx="6" class="col-box" />

  <!-- Column Header -->
  <rect x="30" y="30" width="265" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
  <text x="162" y="47" class="col-hdr" fill="#991b1b" text-anchor="middle">SOURCE WORKER (EVACUATING)</text>

  <!-- Top Box: Phase 1 Drain & Freeze -->
  <g transform="translate(30, 66)">
    <rect x="0" y="0" width="265" height="105" rx="5" class="inner-box" />
    <rect x="10" y="8" width="160" height="18" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#b91c1c">PHASE 1: DRAIN &amp; FREEZE</text>

    <text x="12" y="42" class="mono" font-size="9.5" fill="#991b1b">&#x2022; SIGTERM caught (Delta_t = 30s)</text>
    <text x="12" y="58" class="subtext">Wait socket drain: t_tool &lt;= 1.8s</text>
    <text x="12" y="74" class="subtext">Append final e_obs to WAL (fsync)</text>
    <text x="12" y="92" class="mono" font-size="9.5" fill="#475569">cgroup v2 freezer: suspend CPU</text>
  </g>

  <!-- Middle Box: Phase 2 Tripartite Serialization -->
  <g transform="translate(30, 181)">
    <rect x="0" y="0" width="265" height="185" rx="5" class="inner-box" />
    <rect x="10" y="8" width="215" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#0369a1">PHASE 2: TRIPARTITE SERIALIZE</text>

    <!-- Layer 1 -->
    <text x="12" y="42" class="label" font-size="11">1. Control Plane (ACB_t)</text>
    <text x="12" y="56" class="subtext">FSM state, PRNG seeds, token tally</text>
    <text x="12" y="68" class="mono" font-size="9" fill="#0284c7">ProtoBuf serialize: 128 KiB (3 ms)</text>

    <!-- Layer 2 -->
    <text x="12" y="90" class="label" font-size="11">2. Causal Log Tail (E)</text>
    <text x="12" y="104" class="subtext">Validated events e_0..e_t, proofs</text>
    <text x="12" y="116" class="mono" font-size="9" fill="#0284c7">Unflushed tail: 4.5 MiB (8 ms)</text>

    <!-- Layer 3 -->
    <text x="12" y="138" class="label" font-size="11">3. Filesystem Delta (S_t)</text>
    <text x="12" y="152" class="subtext">OverlayFS upperdir (dirty blocks)</text>
    <text x="12" y="164" class="mono" font-size="9" fill="#0284c7">LZ4 stream: 133.3 MiB (0.70s)</text>
    <text x="12" y="176" class="mono" font-size="8.5" fill="#64748b">[lowerdir 14 GiB omitted]</text>
  </g>

  <!-- Bottom Box: Phase 3 Channel Detach -->
  <g transform="translate(30, 376)">
    <rect x="0" y="0" width="265" height="154" rx="5" class="inner-box" />
    <rect x="10" y="8" width="175" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#b45309">PHASE 3: DETACH &amp; FENCE</text>

    <text x="12" y="44" class="label" font-size="11">Virtual Channel Detach</text>
    <text x="12" y="60" class="subtext">Send MIGRATION_DETACH packet</text>
    <text x="12" y="76" class="subtext">Tear down proxy UNIX domain sockets</text>
    <text x="12" y="92" class="subtext">Invalidate ephemeral mTLS session</text>

    <rect x="10" y="106" width="245" height="36" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8" />
    <text x="18" y="122" class="mono-bold" font-size="10" fill="#b45309">Relinquish Lease: kappa</text>
    <text x="18" y="134" class="subtext">Yield token to consensus leader</text>
  </g>


  <!-- ==================== COLUMN 2: COORDINATION & STORAGE FABRIC ==================== -->
  <rect x="335" y="20" width="290" height="520" rx="6" class="col-box" />

  <!-- Column Header -->
  <rect x="345" y="30" width="270" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="480" y="47" class="col-hdr" fill="#0369a1" text-anchor="middle">SHARED FABRIC &amp; COORDINATOR</text>

  <!-- Top Box: Preemption Budget Envelope -->
  <g transform="translate(345, 66)">
    <rect x="0" y="0" width="270" height="106" rx="5" class="inner-box" />
    <rect x="10" y="8" width="205" height="18" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#047857">PREEMPTION BUDGET ENVELOPE</text>

    <text x="12" y="38" class="subtext">Host Grace Window: Delta_t = 30.0 s</text>
    <text x="12" y="52" class="mono" font-size="8.5">t_quiesce(1.82s) + t_ser(0.71s)</text>
    <text x="12" y="65" class="mono" font-size="8.5">+ t_xfer(1.38s) + t_restore(0.68s)</text>

    <text x="12" y="82" class="mono-bold" font-size="9.5" fill="#047857">T_mig = 4.59 s &lt;&lt; 30.0 s budget</text>
    <text x="12" y="96" class="subtext" font-size="9.5">Safety margin: 25.41 s buffer</text>
  </g>

  <!-- Middle Box: High-Speed Fabric Transport -->
  <g transform="translate(345, 181)">
    <rect x="0" y="0" width="270" height="185" rx="5" class="inner-box" />
    <rect x="10" y="8" width="195" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#0369a1">NVMe-oF / FABRIC TRANSPORT</text>

    <text x="12" y="44" class="label" font-size="11.5">Tripartite Payload Stream</text>
    <text x="12" y="62" class="mono" font-size="9.5">ACB_t ProtoBuf:    0.13 MiB</text>
    <text x="12" y="78" class="mono" font-size="9.5">WAL Segment Tail:  4.50 MiB</text>
    <text x="12" y="94" class="mono" font-size="9.5">OverlayFS upper: 133.33 MiB</text>

    <line x1="12" y1="102" x2="258" y2="102" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="12" y="118" class="mono-bold" font-size="10" fill="#0284c7">Total Payload:   137.96 MiB</text>
    <text x="12" y="136" class="mono" font-size="9.5">Bandwidth B_avail = 100 MB/s</text>
    <text x="12" y="152" class="mono-bold" font-size="10" fill="#059669">Network Transfer: t_xfer = 1.38s</text>
    <text x="12" y="170" class="subtext">Zero base image retransmission</text>
  </g>

  <!-- Bottom Box: Lease Coordinator -->
  <g transform="translate(345, 376)">
    <rect x="0" y="0" width="270" height="154" rx="5" class="inner-box" />
    <rect x="10" y="8" width="210" height="18" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#6d28d9">LEASE COORDINATOR (RAFT / ETCD)</text>

    <text x="12" y="44" class="label" font-size="11.5">Monotonic Epoch Fencing</text>
    <text x="12" y="62" class="mono" font-size="10" fill="#b45309">Relinquished:  kappa</text>
    <text x="12" y="78" class="mono-bold" font-size="10.5" fill="#6d28d9">Handoff Token: kappa + 1</text>
    <text x="12" y="98" class="subtext">Guarantees mutual exclusion across</text>
    <text x="12" y="110" class="subtext">physical nodes; prevents split-brain.</text>
    <text x="12" y="128" class="mono" font-size="9" fill="#475569">Source node write lease revoked</text>
  </g>


  <!-- ==================== COLUMN 3: TARGET WORKER ==================== -->
  <rect x="655" y="20" width="285" height="520" rx="6" class="col-box" />

  <!-- Column Header -->
  <rect x="665" y="30" width="265" height="26" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="797" y="47" class="col-hdr" fill="#065f46" text-anchor="middle">DESTINATION WORKER (RESUMING)</text>

  <!-- Top Box: Pre-Warmed Runtime -->
  <g transform="translate(665, 66)">
    <rect x="0" y="0" width="265" height="105" rx="5" class="inner-box" />
    <rect x="10" y="8" width="165" height="18" rx="3" fill="#ecfdf5" stroke="#34d399" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#065f46">PRE-WARMED RUNTIME</text>

    <text x="12" y="42" class="mono" font-size="9.5" fill="#065f46">&#x2022; lowerdir (14 GiB) pre-cached</text>
    <text x="12" y="58" class="subtext">Container namespace &amp; cgroups ready</text>
    <text x="12" y="74" class="subtext">Zero OS download delay over fabric</text>
    <text x="12" y="92" class="mono" font-size="9.5" fill="#475569">Standby worker awaiting delta</text>
  </g>

  <!-- Middle Box: Phase 5 Filesystem Delta Restoration -->
  <g transform="translate(665, 181)">
    <rect x="0" y="0" width="265" height="185" rx="5" class="inner-box" />
    <rect x="10" y="8" width="210" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#0369a1">PHASE 5: DELTA RESTORATION</text>

    <text x="12" y="44" class="label" font-size="11">OverlayFS Union Mount</text>
    <text x="12" y="62" class="subtext">Bind pre-cached lowerdir (14 GiB)</text>
    <text x="12" y="78" class="subtext">Decompress upperdir delta (0.11s)</text>
    <text x="12" y="96" class="mono" font-size="9.5" fill="#0284c7">mount -t overlay (t_mount = 0.45s)</text>

    <line x1="12" y1="106" x2="253" y2="106" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="12" y="124" class="subtext">Local NVMe populated with agent</text>
    <text x="12" y="138" class="subtext">modified working tree, git repos,</text>
    <text x="12" y="152" class="subtext">and tool intermediate artifacts.</text>
    <text x="12" y="170" class="mono" font-size="9" fill="#059669">Storage delta ready for execution</text>
  </g>

  <!-- Bottom Box: Phase 6 Hydrate & Resume -->
  <g transform="translate(665, 376)">
    <rect x="0" y="0" width="265" height="154" rx="5" class="inner-box" />
    <rect x="10" y="8" width="190" height="18" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#5b21b6">PHASE 6: HYDRATE &amp; RESUME</text>

    <text x="12" y="42" class="label" font-size="11">Claim Lease &amp; Replay Tail</text>
    <text x="12" y="58" class="mono" font-size="9.5" fill="#5b21b6">Claim Token kappa + 1 &gt; kappa</text>
    <text x="12" y="74" class="subtext">Deserialize ACB_t (3 ms) + replay WAL</text>
    <text x="12" y="90" class="subtext">Re-bind UNIX domain sockets &amp; mTLS</text>

    <rect x="10" y="104" width="245" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <text x="132" y="120" class="mono-bold" font-size="10.5" fill="#047857" text-anchor="middle">LIVE FORWARD RESUMPTION</text>
    <text x="132" y="134" class="mono" font-size="9" fill="#065f46" text-anchor="middle">Dispatch next turn prefill (A = 0)</text>
  </g>


  <!-- ==================== CONNECTING INTER-COLUMN ARROWS ==================== -->
  <!-- Middle Row Data Migration Arrows -->
  <line x1="305" y1="273" x2="333" y2="273" class="arrow-blue" />
  <line x1="625" y1="273" x2="653" y2="273" class="arrow-blue" />

  <!-- Bottom Row Lease Fencing Arrows -->
  <line x1="305" y1="453" x2="333" y2="453" class="arrow-purple" />
  <line x1="625" y1="453" x2="653" y2="453" class="arrow-purple" />

</svg>
