<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4px; }
      .card-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.2; rx: 4px; }
      .card-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; rx: 4px; }
      .card-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; rx: 4px; }
      .card-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; rx: 4px; }
      .card-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.2; rx: 4px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #64748b; }
      .text-mono { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; fill: #0f172a; }
      .text-mono-bold { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arr-blue); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.5; fill: none; marker-end: url(#arr-purple); }
      .arrow-green { stroke: #059669; stroke-width: 1.6; fill: none; marker-end: url(#arr-green); }
      .arrow-red-dash { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 4,3; marker-end: url(#arr-red); }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="610" class="bg" />

  <!-- ============================================================== -->
  <!-- TOP SECTION: DETERMINISTIC REPLAY GRAPH & STATE CHECKPOINT TREE-->
  <!-- ============================================================== -->
  <rect x="25" y="16" width="1010" height="280" class="frame-box" />
  <rect x="35" y="24" width="370" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="37" class="text-mono-bold" fill="#334155">SECTION A: TIERED CHECKPOINT TREE AND REPLAY LATENCY</text>
  <text x="1020" y="37" class="text-mono" font-size="9.5" fill="#64748b" text-anchor="end">Decoupling Recovery Time O(tau) from Lifetime Trajectory Length O(t)</text>

  <!-- Macro Trajectory Timeline Bar -->
  <g transform="translate(50, 60)">
    <!-- Base Axis Line -->
    <line x1="0" y1="40" x2="960" y2="40" stroke="#cbd5e1" stroke-width="2" />

    <!-- Base Snapshot S_0 -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="80" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
      <text x="40" y="18" class="text-mono-bold" font-size="9.5" fill="#0369a1" text-anchor="middle">Base S_0</text>
      <text x="40" y="32" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">Turn 0</text>
      <text x="40" y="48" class="text-muted" font-size="7.5" text-anchor="middle">Genesis ACB</text>
    </g>

    <!-- Delta Chain 0 -> 50 -->
    <path d="M 85 40 L 255 40" class="arrow-blue" />
    <text x="170" y="32" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">Deltas Delta_1 ... Delta_50</text>

    <!-- Base Snapshot S_50 -->
    <g transform="translate(260, 10)">
      <rect x="0" y="0" width="80" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
      <text x="40" y="18" class="text-mono-bold" font-size="9.5" fill="#0369a1" text-anchor="middle">Base S_50</text>
      <text x="40" y="32" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">Turn 50</text>
      <text x="40" y="48" class="text-muted" font-size="7.5" text-anchor="middle">Full Image 64MB</text>
    </g>

    <!-- Delta Chain 50 -> 100 -->
    <path d="M 345 40 L 515 40" class="arrow-blue" />
    <text x="430" y="32" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">Deltas Delta_51 ... Delta_100</text>

    <!-- Base Snapshot S_100 (Nearest Checkpoint) -->
    <g transform="translate(520, 10)">
      <rect x="0" y="0" width="85" height="60" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
      <text x="42" y="18" class="text-mono-bold" font-size="9.5" fill="#047857" text-anchor="middle">Base S_100</text>
      <text x="42" y="32" class="text-mono" font-size="8.5" fill="#059669" text-anchor="middle">Turn 100 [tau]</text>
      <text x="42" y="48" class="text-mono-bold" font-size="7.5" fill="#047857" text-anchor="middle">Restoration Base</text>
    </g>

    <!-- Delta Segment: 101 to 138 with clear spacing -->
    <g transform="translate(620, 18)">
      <!-- Delta 101-110 -->
      <rect x="0" y="12" width="40" height="22" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="0.8" />
      <text x="20" y="26" class="text-mono" font-size="8" fill="#7c3aed" text-anchor="middle">Delta_1</text>

      <!-- Delta 111-120 -->
      <rect x="48" y="12" width="40" height="22" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="0.8" />
      <text x="68" y="26" class="text-mono" font-size="8" fill="#7c3aed" text-anchor="middle">Delta_2</text>

      <!-- Delta 121-130 -->
      <rect x="96" y="12" width="40" height="22" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="0.8" />
      <text x="116" y="26" class="text-mono" font-size="8" fill="#7c3aed" text-anchor="middle">Delta_3</text>

      <!-- Delta 131-138 -->
      <rect x="144" y="12" width="40" height="22" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="0.8" />
      <text x="164" y="26" class="text-mono" font-size="8" fill="#7c3aed" text-anchor="middle">Delta_k</text>
    </g>

    <!-- Crash Point Marker at Turn 138 -->
    <g transform="translate(820, 0)">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />
      <rect x="-45" y="-12" width="90" height="20" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
      <text x="0" y="2" class="text-mono-bold" font-size="8.5" fill="#b91c1c" text-anchor="middle">CRASH (t = 138)</text>
    </g>

    <!-- Recovery Path Comparison (Below Axis) -->
    <!-- Path 1: Checkpoint Replay Path (Fast Bounded) -->
    <g transform="translate(520, 85)">
      <path d="M 45 0 L 45 35 L 300 35" class="arrow-green" />
      <rect x="60" y="24" width="220" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
      <text x="170" y="38" class="text-mono-bold" font-size="9" fill="#047857" text-anchor="middle">BOUNDED REPLAY: T_rec = 38.2 ms</text>
      <text x="170" y="60" class="text-body" font-size="9" text-anchor="middle">O(1) NVMe base hydrate (20 ms) + O(tau) delta fold across 38 turns (18.2 ms)</text>
    </g>

    <!-- Path 2: Naive Unbounded Replay Path (Slow) -->
    <g transform="translate(40, 155)">
      <path d="M 0 0 L 0 35 L 780 35" class="arrow-red-dash" />
      <rect x="230" y="24" width="310" height="22" rx="3" fill="#fff5f5" stroke="#fca5a5" stroke-width="1" />
      <text x="385" y="38" class="text-mono-bold" font-size="9" fill="#b91c1c" text-anchor="middle">UNBOUNDED SCAN WITHOUT CHECKPOINT: T_re-exec = 17.5 min</text>
      <text x="385" y="60" class="text-body" font-size="9" text-anchor="middle">O(t) recomputation over 138 turns: GPU prefill stalls + API quota consumption</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM SECTION: YOUNG-DALY OPTIMAL CADENCE ANALYTICAL CURVE    -->
  <!-- ============================================================== -->
  <rect x="25" y="306" width="1010" height="288" class="frame-box" />
  <rect x="35" y="314" width="410" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="327" class="text-mono-bold" fill="#334155">SECTION B: YOUNG-DALY ANALYTICAL CHECKPOINT CADENCE MODEL</text>

  <!-- Coordinate Plane for Young-Daly Curves -->
  <g transform="translate(65, 345)">
    <!-- Axes -->
    <line x1="55" y1="185" x2="475" y2="185" stroke="#475569" stroke-width="1.5" />
    <line x1="55" y1="20" x2="55" y2="185" stroke="#475569" stroke-width="1.5" />
    <text x="475" y="202" class="text-mono-bold" font-size="9" fill="#334155" text-anchor="end">Checkpoint Cadence T (Interval)</text>
    <text x="55" y="12" class="text-mono-bold" font-size="9" fill="#334155">Fractional Overhead U(T)</text>

    <!-- Curve 1: Snapshot Overhead delta_snap / T (Blue Dashed Hyperbola) -->
    <path d="M 70 40 Q 100 95 160 130 T 450 170" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" fill="none" />
    <text x="75" y="32" class="text-mono-bold" font-size="8.5" fill="#0284c7">L_snap = delta_snap / T</text>

    <!-- Curve 2: Recomputation Waste T / (2 MTBF) (Red Dashed Linear) -->
    <line x1="55" y1="175" x2="450" y2="85" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="360" y="75" class="text-mono-bold" font-size="8.5" fill="#dc2626">L_fault = T / (2 * MTBF)</text>

    <!-- Curve 3: Total Overhead U(T) (Purple Solid U-Shape) -->
    <path d="M 70 62 Q 140 162 230 150 T 450 95" stroke="#7c3aed" stroke-width="2.2" fill="none" />
    <text x="240" y="95" class="text-mono-bold" font-size="9" fill="#6d28d9">Total: U(T) = L_snap + L_fault</text>

    <!-- Optimal Point Mark: T_opt = sqrt(2 * delta * MTBF) -->
    <line x1="225" y1="25" x2="225" y2="185" stroke="#059669" stroke-width="1.4" stroke-dasharray="3,3" />
    <circle cx="225" cy="151" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
    
    <g transform="translate(150, 192)">
      <rect x="0" y="0" width="150" height="26" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
      <text x="75" y="12" class="text-mono-bold" font-size="8.5" fill="#047857" text-anchor="middle">T_opt = sqrt(2*delta*MTBF)</text>
      <text x="75" y="22" class="text-muted" font-size="7.5" text-anchor="middle">Minimum Overhead Cadence</text>
    </g>
  </g>

  <!-- Right Cards: Concrete Systems Evaluations -->
  <!-- Card 1: NVMe Tier -->
  <g transform="translate(570, 350)">
    <rect x="0" y="0" width="220" height="225" class="card" />
    <rect x="0" y="0" width="220" height="24" rx="3" class="card-blue" />
    <text x="10" y="16" class="text-title" fill="#0369a1">Tier 1: Direct NVMe Flash</text>
    
    <text x="10" y="42" class="text-mono-bold">Parameters:</text>
    <text x="10" y="58" class="text-mono">delta_snap = 20 ms (1.6 GB/s)</text>
    <text x="10" y="74" class="text-mono">MTBF = 4 hours (14,400 s)</text>
    <text x="10" y="90" class="text-mono">mu_turn = 12 s / turn</text>
    <line x1="8" y1="100" x2="212" y2="100" stroke="#e2e8f0" stroke-width="1" />

    <text x="10" y="118" class="text-mono-bold" fill="#0369a1">Analytical Cadence:</text>
    <rect x="8" y="126" width="204" height="42" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
    <text x="14" y="142" class="text-mono-bold" font-size="9" fill="#0284c7">T_opt = 24.0 seconds</text>
    <text x="14" y="158" class="text-mono-bold" font-size="9" fill="#0284c7">tau_opt = ceil(24/12) = 2 turns</text>

    <text x="10" y="186" class="text-body" font-size="9">Total Runtime Overhead:</text>
    <text x="10" y="202" class="text-mono-bold" font-size="10" fill="#059669">U(T_opt) = 0.166% (Negligible)</text>
    <text x="10" y="216" class="text-muted" font-size="8">Aggressive snapshots bound blast radius</text>
  </g>

  <!-- Card 2: Network Object Store Tier -->
  <g transform="translate(805, 350)">
    <rect x="0" y="0" width="220" height="225" class="card" />
    <rect x="0" y="0" width="220" height="24" rx="3" class="card-amber" />
    <text x="10" y="16" class="text-title" fill="#b45309">Tier 2: Network Object Store</text>
    
    <text x="10" y="42" class="text-mono-bold">Parameters:</text>
    <text x="10" y="58" class="text-mono">delta_snap = 4.5 s (HTTP S3)</text>
    <text x="10" y="74" class="text-mono">MTBF = 4 hours (14,400 s)</text>
    <text x="10" y="90" class="text-mono">mu_turn = 12 s / turn</text>
    <line x1="8" y1="100" x2="212" y2="100" stroke="#e2e8f0" stroke-width="1" />

    <text x="10" y="118" class="text-mono-bold" fill="#b45309">Analytical Cadence:</text>
    <rect x="8" y="126" width="204" height="42" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8" />
    <text x="14" y="142" class="text-mono-bold" font-size="9" fill="#b45309">T_opt = 360.0 s (6.0 min)</text>
    <text x="14" y="158" class="text-mono-bold" font-size="9" fill="#b45309">tau_opt = ceil(360/12) = 30 turns</text>

    <text x="10" y="186" class="text-body" font-size="9">Total Runtime Overhead:</text>
    <text x="10" y="202" class="text-mono-bold" font-size="10" fill="#d97706">U(T_opt) = 2.50% (Acceptable)</text>
    <text x="10" y="216" class="text-muted" font-size="8">High latency forces relaxed cadence</text>
  </g>

</svg>
