<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4px; }
      .card-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.2; rx: 4px; }
      .card-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; rx: 4px; }
      .card-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; rx: 4px; }
      .card-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; rx: 4px; }
      .card-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.2; rx: 4px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #64748b; }
      .text-mono { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; fill: #0f172a; }
      .text-mono-bold { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.8; fill: none; marker-end: url(#arr-blue); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.8; fill: none; marker-end: url(#arr-purple); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.8; fill: none; marker-end: url(#arr-red); }
      .arrow-green { stroke: #059669; stroke-width: 1.8; fill: none; marker-end: url(#arr-green); }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="610" class="bg" />

  <!-- ============================================================== -->
  <!-- TOP TIMELINE: ARIES LOG STREAM & RECOVERY PHASES              -->
  <!-- ============================================================== -->
  <rect x="25" y="16" width="1010" height="295" class="frame-box" />
  <rect x="35" y="24" width="310" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="37" class="text-mono-bold" fill="#334155">ARIES 3-PHASE RECOVERY PROTOCOL OVER WAL</text>
  <text x="1020" y="37" class="text-mono" font-size="9.5" fill="#64748b" text-anchor="end">Mohan et al. (1992): Analysis, Redo ("Repeating History"), and Undo</text>

  <!-- Log Timeline Axis -->
  <g transform="translate(50, 62)">
    <!-- Base Timeline Bar -->
    <rect x="0" y="25" width="960" height="18" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Milestone 1: Oldest Dirty Page RecLSN = 80 -->
    <line x1="160" y1="15" x2="160" y2="52" stroke="#7c3aed" stroke-width="2" />
    <rect x="110" y="0" width="100" height="18" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8" />
    <text x="160" y="13" class="text-mono-bold" font-size="9" fill="#6d28d9" text-anchor="middle">RedoLSN (80)</text>
    <text x="160" y="65" class="text-muted" font-size="8" text-anchor="middle">Min RecLSN in DPT</text>

    <!-- Milestone 2: Checkpoint Record LSN = 110 -->
    <line x1="380" y1="15" x2="380" y2="52" stroke="#0284c7" stroke-width="2" />
    <rect x="320" y="0" width="120" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
    <text x="380" y="13" class="text-mono-bold" font-size="9" fill="#0369a1" text-anchor="middle">Checkpoint (LSN 110)</text>
    <text x="380" y="65" class="text-muted" font-size="8" text-anchor="middle">Snapshot DPT &amp; TxTable</text>

    <!-- Milestone 3: Crash Point LSN = 160 -->
    <line x1="820" y1="15" x2="820" y2="52" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />
    <rect x="765" y="0" width="110" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
    <text x="820" y="13" class="text-mono-bold" font-size="9" fill="#b91c1c" text-anchor="middle">SYSTEM CRASH (160)</text>
    <text x="820" y="65" class="text-muted" font-size="8" text-anchor="middle">Volatile DRAM Lost</text>

    <!-- Phase 1: Analysis Pass (Forward Scan: 110 -> 160) -->
    <g transform="translate(0, 78)">
      <path d="M 380 14 L 815 14" class="arrow-blue" />
      <rect x="520" y="3" width="160" height="20" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="600" y="17" class="text-mono-bold" font-size="9" fill="#0369a1" text-anchor="middle">PHASE 1: ANALYSIS (FORWARD)</text>
      <text x="600" y="35" class="text-body" font-size="9" text-anchor="middle">Scans forward from checkpoint. Reconstructs Dirty Page Table (DPT) &amp; Transaction Table.</text>
      <text x="600" y="47" class="text-mono" font-size="8.5" fill="#475569" text-anchor="middle">Identifies smallest RecLSN in DPT =&gt; Sets RedoLSN = 80</text>
    </g>

    <!-- Phase 2: Redo Pass (Repeating History: 80 -> 160) -->
    <g transform="translate(0, 134)">
      <path d="M 160 14 L 815 14" class="arrow-purple" />
      <rect x="420" y="3" width="200" height="20" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
      <text x="520" y="17" class="text-mono-bold" font-size="9" fill="#6d28d9" text-anchor="middle">PHASE 2: REDO ("REPEATING HISTORY")</text>
      <text x="520" y="35" class="text-body" font-size="9" text-anchor="middle">Scans forward from RedoLSN to Crash. Reapplies ALL logged operations (winners &amp; losers).</text>
      <text x="520" y="47" class="text-mono" font-size="8.5" fill="#475569" text-anchor="middle">If PageLSN &lt; Record.LSN =&gt; Reapply write; PageLSN = Record.LSN</text>
    </g>

    <!-- Phase 3: Undo Pass (Backward Scan: 160 -> earliest active) -->
    <g transform="translate(0, 190)">
      <path d="M 820 14 L 165 14" class="arrow-red" />
      <rect x="420" y="3" width="200" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" />
      <text x="520" y="17" class="text-mono-bold" font-size="9" fill="#b91c1c" text-anchor="middle">PHASE 3: UNDO (BACKWARD SCAN)</text>
      <text x="520" y="35" class="text-body" font-size="9" text-anchor="middle">Scans backward following PrevLSN for active "loser" transactions. Rolls back dirty updates.</text>
      <text x="520" y="47" class="text-mono-bold" font-size="8.5" fill="#dc2626" text-anchor="middle">Writes Compensation Log Records (CLRs) with UndoNextLSN</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM SECTION: THREE DETAIL CARDS & AGENT RECOVERY CONTRAST   -->
  <!-- ============================================================== -->
  <rect x="25" y="325" width="1010" height="268" class="frame-box" />
  <rect x="35" y="333" width="410" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="346" class="text-mono-bold" fill="#334155">SECTION B: ARIES MECHANISMS VS AGENT TRAJECTORY PERSISTENCE</text>

  <!-- Card 1: Analysis & Redo Details -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="310" height="215" class="card" />
    <rect x="0" y="0" width="310" height="24" rx="3" class="card-blue" />
    <text x="10" y="16" class="text-title" fill="#0369a1">1. LSN Invariants &amp; Redo Pass</text>
    
    <text x="10" y="42" class="text-mono-bold">PageLSN vs FlushedLSN:</text>
    <text x="10" y="58" class="text-body">A dirty page in volatile memory holds</text>
    <text x="10" y="72" class="text-mono" fill="#0284c7">PageLSN = LSN of latest update.</text>
    <text x="10" y="88" class="text-body">Steal policy allows flushing dirty page</text>
    <text x="10" y="102" class="text-body">to disk ONLY IF:</text>
    <rect x="8" y="110" width="294" height="26" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
    <text x="155" y="127" class="text-mono-bold" font-size="9" fill="#0369a1" text-anchor="middle">PageLSN &lt;= FlushedLSN (Classical WAL)</text>

    <text x="10" y="152" class="text-mono-bold">Repeating History Invariant:</text>
    <text x="10" y="168" class="text-body">Redo reapplies both committed and</text>
    <text x="10" y="182" class="text-body">uncommitted actions to bring DB to exact</text>
    <text x="10" y="196" class="text-body">state at crash, enabling fine-grained lock recovery.</text>
  </g>

  <!-- Card 2: Compensation Log Records (CLRs) in Undo -->
  <g transform="translate(365, 360)">
    <rect x="0" y="0" width="325" height="215" class="card" />
    <rect x="0" y="0" width="325" height="24" rx="3" class="card-purple" />
    <text x="10" y="16" class="text-title" fill="#6d28d9">2. CLRs &amp; Bounded Crash During Recovery</text>
    
    <text x="10" y="42" class="text-mono-bold">Compensation Log Record (CLR):</text>
    <text x="10" y="58" class="text-body">When Phase 3 undos an update, it appends a</text>
    <text x="10" y="72" class="text-body">CLR to the log with pointer:</text>
    <rect x="8" y="80" width="309" height="26" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8" />
    <text x="162" y="97" class="text-mono-bold" font-size="9" fill="#7c3aed" text-anchor="middle">CLR.UndoNextLSN = UndoneRecord.PrevLSN</text>

    <text x="10" y="122" class="text-mono-bold">Crash-During-Recovery Guarantee:</text>
    <text x="10" y="138" class="text-body">If the host crashes AGAIN while executing</text>
    <text x="10" y="152" class="text-body">Undo pass, subsequent recovery does not repeat</text>
    <text x="10" y="166" class="text-body">undo operations. It jumps directly to UndoNextLSN.</text>
    <rect x="8" y="176" width="309" height="28" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8" />
    <text x="162" y="194" class="text-mono-bold" font-size="8.5" fill="#6d28d9" text-anchor="middle">Prevents Cascading Recovery Loops</text>
  </g>

  <!-- Card 3: Why Agent Systems Cannot Use Page Undo -->
  <g transform="translate(705, 360)">
    <rect x="0" y="0" width="315" height="215" class="card-red" />
    <rect x="0" y="0" width="315" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
    <text x="10" y="16" class="text-title" fill="#b91c1c">3. The Agent Irrevocability Divide</text>
    
    <text x="10" y="42" class="text-mono-bold" fill="#991b1b">Why ARIES Undo Fails for Agents:</text>
    <text x="10" y="58" class="text-body">ARIES relies on physical before-images to</text>
    <text x="10" y="72" class="text-body">rewrite dirty database disk blocks.</text>
    <text x="10" y="88" class="text-body">In an agent runtime, external actions</text>
    <text x="10" y="102" class="text-mono" fill="#b91c1c">a_ext: HTTP POST, shell exec, git push</text>
    <text x="10" y="118" class="text-body">mutate external physical state irrevocably.</text>

    <rect x="8" y="128" width="299" height="74" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
    <text x="12" y="144" class="text-mono-bold" font-size="8.5" fill="#dc2626">Agent Systems Resolution:</text>
    <text x="12" y="160" class="text-body" font-size="9">1. Zero Ambient Authority escrow (A = 0).</text>
    <text x="12" y="174" class="text-body" font-size="9">2. Pre-mutation storage barrier: e_flush &lt; a_ext.</text>
    <text x="12" y="188" class="text-body" font-size="9">3. Forward compensating actions (Sagas), not page undo.</text>
  </g>

</svg>
