<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="530" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="490" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">DISTRIBUTED AGENT SAGAS: FORWARD EXECUTION AND BACKWARD COMPENSATING ACTIONS</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Deterministic forward-recovery and reverse compensation restore consistency when heterogeneous tool steps fail</text>

  <!-- ================================================================= -->
  <!-- FORWARD TRAJECTORY EXECUTION (TOP ROW)                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="880" height="135" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">FORWARD TRAJECTORY EXECUTION: T_1 → T_2 → T_3 → T_4 (FAILED)</text>
    <text x="868" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">FORWARD SAGA (SPECULATIVE)</text>

    <!-- Step T1 -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="180" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">STEP T_1: Git Scratch Branch</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Creates git worktree branch</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Registers compensating C_1</text>
      <rect x="8" y="60" width="164" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="90" y="74" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">✓ CHECKPOINT SAVED</text>
    </g>

    <!-- Arrow T1 -> T2 -->
    <line x1="195" y1="78" x2="233" y2="78" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Step T2 -->
    <g transform="translate(235, 32)">
      <rect x="0" y="0" width="180" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">STEP T_2: Reserve Cloud VM</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Provisions AWS EC2 instance</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Registers compensating C_2</text>
      <rect x="8" y="60" width="164" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="90" y="74" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">✓ CHECKPOINT SAVED</text>
    </g>

    <!-- Arrow T2 -> T3 -->
    <line x1="415" y1="78" x2="453" y2="78" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Step T3 -->
    <g transform="translate(455, 32)">
      <rect x="0" y="0" width="180" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">STEP T_3: Stripe Auth Hold</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Authorizes $50 compute fee</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Registers compensating C_3</text>
      <rect x="8" y="60" width="164" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="90" y="74" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">✓ CHECKPOINT SAVED</text>
    </g>

    <!-- Arrow T3 -> T4 -->
    <line x1="635" y1="78" x2="673" y2="78" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Step T4 (Failed) -->
    <g transform="translate(675, 32)">
      <rect x="0" y="0" width="190" height="92" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">STEP T_4: Deploy &amp; Execute</text>
      <text x="10" y="32" font-size="7.5" fill="#7f1d1d">• Docker run fails in microVM</text>
      <text x="10" y="46" font-size="7.5" fill="#7f1d1d">• Exit Code: 137 (OOM killed)</text>
      <rect x="8" y="60" width="174" height="22" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
      <text x="95" y="74" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">✗ VERIFICATION FAILED!</text>
    </g>
  </g>

  <!-- Arrow down from T4 to Coordinator -->
  <line x1="810" y1="210" x2="810" y2="223" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ================================================================= -->
  <!-- COORDINATOR BAND (MIDDLE ROW)                                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 224)">
    <rect x="0" y="0" width="880" height="34" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="12" y="21" font-size="8.5" font-weight="700" fill="#0f172a">SAGA EXECUTION COORDINATOR:</text>
    <text x="195" y="21" font-size="8" fill="#334155">Traps failure on T_4. Halts forward progress. Invokes reverse compensating sequence: C_3 → C_2 → C_1</text>
    <rect x="745" y="6" width="125" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="807" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">INITIATE ROLLBACK</text>
  </g>

  <!-- Arrow down to C3 -->
  <path d="M807,258 L807,335 L695,335" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ================================================================= -->
  <!-- BACKWARD COMPENSATING SAGA (BOTTOM ROW)                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="880" height="135" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">BACKWARD COMPENSATING ACTIONS: C_3 → C_2 → C_1 (DETERMINISTIC CODE HANDLERS)</text>
    <text x="868" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#b45309">REVERSE RECOVERY (IDEMPOTENT)</text>

    <!-- Step C3 -->
    <g transform="translate(505, 32)">
      <rect x="0" y="0" width="180" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">ACTION C_3: Release Stripe Auth</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Invokes: stripe.Refund()</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Idempotency key verified</text>
      <rect x="8" y="60" width="164" height="22" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="90" y="74" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#b45309">✓ HOLD RELEASED ($0)</text>
    </g>

    <!-- Arrow C3 -> C2 -->
    <line x1="505" y1="78" x2="467" y2="78" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

    <!-- Step C2 -->
    <g transform="translate(285, 32)">
      <rect x="0" y="0" width="180" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">ACTION C_2: Terminate Cloud VM</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Invokes: ec2.Terminate()</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Releases IP &amp; EBS storage</text>
      <rect x="8" y="60" width="164" height="22" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="90" y="74" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#b45309">✓ INSTANCE TERMINATED</text>
    </g>

    <!-- Arrow C2 -> C1 -->
    <line x1="285" y1="78" x2="247" y2="78" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

    <!-- Step C1 -->
    <g transform="translate(65, 32)">
      <rect x="0" y="0" width="180" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">ACTION C_1: Clean Git Scratch</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• git worktree remove -f</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• Prunes dangling branches</text>
      <rect x="8" y="60" width="164" height="22" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="90" y="74" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" font-weight="700" fill="#b45309">✓ WORKTREE PURGED</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM ARCHITECTURAL INVARIANT CALLOUT                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 417)">
    <rect x="0" y="0" width="880" height="72" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">KEY INVARIANT: COMPENSATING ACTIONS MUST BE DETERMINISTIC CODE, NEVER PROMPTED LLM TEXT</text>
    <text x="12" y="40" font-size="8" fill="#475569">Prompting a failing model to "undo" an action triggers hallucination compounding. Compensating actions (A⁻¹) must be</text>
    <text x="12" y="55" font-size="8" fill="#475569">pre-compiled, idempotent API handlers registered in advance at forward action dispatch.</text>
  </g>

</svg>