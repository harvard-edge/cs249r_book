<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .col-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .inner-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .tier-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="550" class="bg" />

  <!-- ==================== LEFT SECTION: THREE-TIER STORAGE HIERARCHY ==================== -->

  <!-- TIER 1: HOT TIER -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="510" height="124" rx="6" class="col-box" />
    <rect x="0" y="0" width="510" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#991b1b">HOT TIER: LIVE EXECUTION (0 - 24 HOURS)</text>

    <!-- Sub-boxes -->
    <rect x="12" y="34" width="235" height="78" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Physical Media &amp; Engine</text>
    <text x="20" y="66" class="mono" font-size="9.5">Local Host NVMe SSD / DRAM</text>
    <text x="20" y="80" class="mono" font-size="9.5">Embedded LSM-Tree (RocksDB)</text>
    <text x="20" y="96" class="mono-bold" font-size="9.5" fill="#dc2626">Latency: &lt; 1 ms (Append + fsync)</text>

    <rect x="257" y="34" width="241" height="78" rx="4" class="inner-box" />
    <text x="265" y="50" class="label">Payload State &amp; Footprint</text>
    <text x="265" y="66" class="subtext">Raw uncompacted bytes (bit-for-bit)</text>
    <text x="265" y="80" class="mono" font-size="9.5">Turn payload: 365 KB / turn</text>
    <text x="265" y="96" class="mono-bold" font-size="9.5" fill="#991b1b">Fleet: 164.25 GB/day (177 TB 3x/yr)</text>
  </g>

  <!-- Transition 1: Hot to Warm Demotion -->
  <g transform="translate(20, 144)">
    <rect x="0" y="0" width="510" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8" />
    <path d="M 20, 7 L 20, 19 M 17, 16 L 20, 19 L 23, 16" stroke="#b45309" stroke-width="1.5" fill="none" />
    <text x="32" y="17" class="mono-bold" font-size="9.5" fill="#b45309">Epistemic Pruning (Phi_compact): 19.2x Space Reduction (94.8% Savings)</text>
  </g>

  <!-- TIER 2: WARM TIER -->
  <g transform="translate(20, 174)">
    <rect x="0" y="0" width="510" height="124" rx="6" class="col-box" />
    <rect x="0" y="0" width="510" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#b45309">WARM TIER: TRIAGE &amp; EVALUATION (1 - 30 DAYS)</text>

    <!-- Sub-boxes -->
    <rect x="12" y="34" width="235" height="78" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Physical Media &amp; Engine</text>
    <text x="20" y="66" class="mono" font-size="9.5">Distributed SSD Cluster</text>
    <text x="20" y="80" class="mono" font-size="9.5">PostgreSQL / ClickHouse DB</text>
    <text x="20" y="96" class="mono-bold" font-size="9.5" fill="#b45309">Latency: 10 - 100 ms (Query)</text>

    <rect x="257" y="34" width="241" height="78" rx="4" class="inner-box" />
    <text x="265" y="50" class="label">Payload State &amp; Footprint</text>
    <text x="265" y="66" class="subtext">Selectively pruned error traces</text>
    <text x="265" y="80" class="mono" font-size="9.5">Turn payload: 19.03 KB / turn</text>
    <text x="265" y="96" class="mono-bold" font-size="9.5" fill="#b45309">Fleet: 8.56 GB/day (256.8 GB/mo)</text>
  </g>

  <!-- Transition 2: Warm to Cold Demotion -->
  <g transform="translate(20, 302)">
    <rect x="0" y="0" width="510" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
    <path d="M 20, 7 L 20, 19 M 17, 16 L 20, 19 L 23, 16" stroke="#0284c7" stroke-width="1.5" fill="none" />
    <text x="32" y="17" class="mono-bold" font-size="9.5" fill="#0284c7">Columnar Lakehouse Conversion: Parquet + Zstd (3.2x further compression)</text>
  </g>

  <!-- TIER 3: COLD TIER -->
  <g transform="translate(20, 332)">
    <rect x="0" y="0" width="510" height="198" rx="6" class="col-box" />
    <rect x="0" y="0" width="510" height="26" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#0369a1">COLD TIER: AUDIT &amp; COMPLIANCE (30 DAYS - 7 YEARS)</text>

    <!-- Sub-boxes -->
    <rect x="12" y="34" width="235" height="82" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Physical Media &amp; Engine</text>
    <text x="20" y="66" class="mono" font-size="9.5">Global Object Store (S3 / Glacier)</text>
    <text x="20" y="80" class="mono" font-size="9.5">Apache Parquet + Zstandard</text>
    <text x="20" y="96" class="mono-bold" font-size="9.5" fill="#0284c7">Latency: 1 - 5 s (Batch Read)</text>

    <rect x="257" y="34" width="241" height="82" rx="4" class="inner-box" />
    <text x="265" y="50" class="label">Payload State &amp; Footprint</text>
    <text x="265" y="66" class="subtext">Compressed causal spine + proofs</text>
    <text x="265" y="80" class="mono" font-size="9.5">Turn payload: ~5.95 KB / turn</text>
    <text x="265" y="96" class="mono-bold" font-size="9.5" fill="#0284c7">Fleet: 963 GB / yr (164M turns)</text>

    <!-- Cold Tier Security & Governance Card -->
    <rect x="12" y="122" width="486" height="66" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="140" class="mono-bold" font-size="9.5" fill="#0369a1">GOVERNANCE &amp; RETENTION POLICY</text>
    <text x="20" y="156" class="subtext">WORM (Write-Once-Read-Many) storage; zero in-place mutations permitted.</text>
    <text x="20" y="172" class="mono" font-size="8.5" fill="#334155">Enforces regulatory audits, regression evaluations, and GDPR crypto-shredding.</text>
  </g>


  <!-- ==================== RIGHT SECTION: ARCHITECTURAL MECHANISMS ==================== -->

  <!-- PANEL A: SELECTIVE PAYLOAD COMPACTION -->
  <g transform="translate(550, 16)">
    <rect x="0" y="0" width="390" height="248" rx="6" class="col-box" />
    <rect x="0" y="0" width="390" height="26" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#6d28d9">SELECTIVE PAYLOAD COMPACTION (PHI_COMPACT)</text>

    <!-- Raw Input -->
    <rect x="12" y="34" width="366" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="50" class="label">Raw Observation: S_obs (350 KB)</text>
    <text x="20" y="66" class="mono" font-size="9" fill="#dc2626">14,800 lines unpruned stdout/stderr (e.g. cargo build)</text>

    <!-- Compaction Transformation -->
    <rect x="12" y="82" width="366" height="98" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="20" y="98" class="mono-bold" font-size="9.5" fill="#6d28d9">Epistemic Filter Decomposition</text>
    <text x="20" y="114" class="mono" font-size="9">&#x2022; Head(k): 5 lines (compiler invocation &amp; flags)</text>
    <text x="20" y="128" class="mono" font-size="9">&#x2022; Filter_err: 4 KB extracted diagnostic trace</text>
    <text x="20" y="142" class="mono" font-size="9">&#x2022; Tail(k): 20 lines (final panic / exit summary)</text>
    <text x="20" y="156" class="mono" font-size="9">&#x2022; SHA-256(Phi_raw): 32-byte immutable Merkle proof</text>
    <text x="20" y="170" class="mono" font-size="8.5" fill="#6b7280">Dropped: 14,775 intermediate compilation lines (1.25 MB)</text>

    <!-- Compacted Output -->
    <rect x="12" y="186" width="366" height="48" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1" />
    <text x="20" y="202" class="mono-bold" font-size="9.5" fill="#059669">Compacted Output: S_obs,compact = 4.032 KB</text>
    <text x="20" y="218" class="subtext">86.8x reduction on tool payload; 100% causal fidelity preserved</text>
  </g>

  <!-- PANEL B: CRYPTOGRAPHIC SHREDDING -->
  <g transform="translate(550, 276)">
    <rect x="0" y="0" width="390" height="254" rx="6" class="col-box" />
    <rect x="0" y="0" width="390" height="26" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#047857">CRYPTOGRAPHIC SHREDDING GOVERNANCE</text>

    <!-- Key Management & Storage Hierarchy -->
    <rect x="12" y="34" width="366" height="66" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Two-Tier Envelope Encryption</text>
    <text x="20" y="66" class="mono" font-size="9">KMS Master Key (KEK) wraps per-trajectory DEK_tau</text>
    <text x="20" y="80" class="mono" font-size="9">Trajectory data stored encrypted in Parquet row-groups</text>
    <text x="20" y="93" class="subtext">Session queries unwrap DEK_tau on demand via mTLS</text>

    <!-- Shredding Action -->
    <rect x="12" y="106" width="366" height="66" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="20" y="122" class="mono-bold" font-size="9.5" fill="#dc2626">GDPR Art. 17 Erasure ("Right to be Forgotten")</text>
    <text x="20" y="138" class="subtext">Multi-TB Parquet lakehouse files reside on immutable WORM.</text>
    <text x="20" y="152" class="mono-bold" font-size="9" fill="#991b1b">KMS irreversibly purges DEK_tau from key catalog</text>
    <text x="20" y="165" class="subtext">Parquet ciphertext becomes permanently unreadable (2^256)</text>

    <!-- Invariant Card without badge -->
    <rect x="12" y="178" width="366" height="62" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1" />
    <text x="20" y="196" class="label" fill="#065f46">Zero Write Amplification</text>
    <text x="20" y="212" class="subtext">Instantaneous, verifiable compliance expungement achieved</text>
    <text x="20" y="226" class="subtext">without rewriting multi-gigabyte immutable object store files.</text>
  </g>

</svg>
