<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="580" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 6px; }
      .frame-box-dashed { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,4; rx: 6px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4px; }
      .card-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.2; rx: 4px; }
      .card-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; rx: 4px; }
      .card-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; rx: 4px; }
      .card-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; rx: 4px; }
      .card-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.2; rx: 4px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #64748b; }
      .text-mono { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9.5px; fill: #0f172a; }
      .text-mono-bold { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-green { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arr-green); }
      .arrow-red-dash { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 4,3; marker-end: url(#arr-red); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.4; fill: none; marker-end: url(#arr-purple); }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="580" class="bg" />

  <!-- ============================================================== -->
  <!-- TOP SECTION: PHYSICAL WAL RECORD BINARY MEMORY LAYOUT          -->
  <!-- ============================================================== -->
  <rect x="25" y="16" width="1010" height="155" class="frame-box" />
  <rect x="35" y="24" width="280" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="37" class="text-mono-bold" fill="#334155">SECTION A: WAL BINARY RECORD FRAME FORMAT</text>
  <text x="1020" y="37" class="text-mono" font-size="9.5" fill="#64748b" text-anchor="end">42-Byte Fixed Header + Variable Structured Payload</text>

  <!-- Memory Byte Field Strips -->
  <g transform="translate(45, 52)">
    <!-- Magic 4B -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="85" height="42" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" />
      <text x="42" y="18" class="text-mono-bold" fill="#6d28d9" text-anchor="middle">MAGIC</text>
      <text x="42" y="32" class="text-mono" font-size="8.5" fill="#4c1d95" text-anchor="middle">0x57414C31 (4B)</text>
      <text x="42" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 0</text>
    </g>
    <!-- TotalLen 4B -->
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="85" height="42" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="42" y="18" class="text-mono-bold" fill="#334155" text-anchor="middle">TOTAL_LEN</text>
      <text x="42" y="32" class="text-mono" font-size="8.5" fill="#475569" text-anchor="middle">uint32 (4B)</text>
      <text x="42" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 4</text>
    </g>
    <!-- CRC32 4B -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="90" height="42" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1" />
      <text x="45" y="18" class="text-mono-bold" fill="#b91c1c" text-anchor="middle">CRC32</text>
      <text x="45" y="32" class="text-mono" font-size="8.5" fill="#991b1b" text-anchor="middle">Checksum (4B)</text>
      <text x="45" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 8</text>
    </g>
    <!-- LSN 8B -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="115" height="42" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
      <text x="57" y="18" class="text-mono-bold" fill="#0369a1" text-anchor="middle">LSN (Current)</text>
      <text x="57" y="32" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">uint64 (8B)</text>
      <text x="57" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 12</text>
    </g>
    <!-- PrevLSN 8B -->
    <g transform="translate(395, 0)">
      <rect x="0" y="0" width="115" height="42" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
      <text x="57" y="18" class="text-mono-bold" fill="#0369a1" text-anchor="middle">PREV_LSN</text>
      <text x="57" y="32" class="text-mono" font-size="8.5" fill="#0284c7" text-anchor="middle">Back-Link (8B)</text>
      <text x="57" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 20</text>
    </g>
    <!-- TurnID 8B -->
    <g transform="translate(515, 0)">
      <rect x="0" y="0" width="105" height="42" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="52" y="18" class="text-mono-bold" fill="#334155" text-anchor="middle">TURN_ID</text>
      <text x="52" y="32" class="text-mono" font-size="8.5" fill="#475569" text-anchor="middle">uint64 (8B)</text>
      <text x="52" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 28</text>
    </g>
    <!-- Type 2B -->
    <g transform="translate(625, 0)">
      <rect x="0" y="0" width="85" height="42" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
      <text x="42" y="18" class="text-mono-bold" fill="#b45309" text-anchor="middle">TYPE</text>
      <text x="42" y="32" class="text-mono" font-size="8.5" fill="#92400e" text-anchor="middle">enum (2B)</text>
      <text x="42" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 36</text>
    </g>
    <!-- PayloadLen 4B -->
    <g transform="translate(715, 0)">
      <rect x="0" y="0" width="85" height="42" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="42" y="18" class="text-mono-bold" fill="#334155" text-anchor="middle">PAYLOAD_LEN</text>
      <text x="42" y="32" class="text-mono" font-size="8.5" fill="#475569" text-anchor="middle">uint32 (4B)</text>
      <text x="42" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 38</text>
    </g>
    <!-- Structured Payload Variable -->
    <g transform="translate(805, 0)">
      <rect x="0" y="0" width="165" height="42" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" />
      <text x="82" y="18" class="text-mono-bold" fill="#047857" text-anchor="middle">STRUCTURED PAYLOAD</text>
      <text x="82" y="32" class="text-mono" font-size="8.5" fill="#065f46" text-anchor="middle">Protobuf / FlatBuffer (Var)</text>
      <text x="82" y="54" class="text-muted" font-size="8" text-anchor="middle">Offset 42 ... TotalLen</text>
    </g>
  </g>

  <!-- Explanation note for Layout -->
  <g transform="translate(45, 122)">
    <rect x="0" y="0" width="970" height="36" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="16" class="text-mono-bold" font-size="9" fill="#0284c7">Sequential Append Guarantee:</text>
    <text x="175" y="16" class="text-body" font-size="9.5">Monotonic LSN · PrevLSN back-link for undo</text>
    <text x="12" y="30" class="text-mono-bold" font-size="9" fill="#b91c1c">Torn Write Detection:</text>
    <text x="175" y="30" class="text-body" font-size="9.5">CRC32 rejects torn sectors</text>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM SECTION: EXECUTION PIPELINE AND PHYSICAL STORAGE BARRIER-->
  <!-- ============================================================== -->
  <rect x="25" y="182" width="1010" height="380" class="frame-box" />
  <rect x="35" y="190" width="370" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="203" class="text-mono-bold" fill="#334155">SECTION B: PHYSICAL WRITE-AHEAD LOGGING ORDERING</text>
  <text x="1020" y="203" class="text-mono-bold" font-size="9.5" fill="#0369a1" text-anchor="end">e[prop] &lt; e[auth] &lt; e[flush] &lt; a[ext] &lt; e[obs]</text>

  <!-- Step 1: Model Proposal -->
  <g transform="translate(40, 225)">
    <rect x="0" y="0" width="145" height="180" class="card" />
    <rect x="0" y="0" width="145" height="24" rx="3" class="card-amber" />
    <text x="8" y="16" class="text-title" fill="#b45309">Proposal (e_prop)</text>
    <text x="8" y="38" class="text-mono-bold">Layer: <tspan fill="#64748b">LLM Runtime</tspan></text>
    <text x="8" y="52" class="text-mono-bold">Medium: <tspan fill="#64748b">Host DRAM</tspan></text>
    <line x1="6" y1="60" x2="139" y2="60" stroke="#f1f5f9" stroke-width="1" />
    <text x="8" y="76" class="text-body">Autoregressive token</text>
    <text x="8" y="90" class="text-body">generation emits raw</text>
    <text x="8" y="104" class="text-body">tool call proposal:</text>
    <rect x="6" y="114" width="133" height="36" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8" />
    <text x="10" y="128" class="text-mono" font-size="8.5" fill="#b45309">rm -rf ./build</text>
    <text x="10" y="142" class="text-muted" font-size="8">Volatile token buffer</text>
    <text x="8" y="168" class="text-mono" font-size="8.5" fill="#64748b">Status: UNVERIFIED</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 185 315 L 210 315" class="arrow" />

  <!-- Step 2: Supervisor Escrow -->
  <g transform="translate(215, 225)">
    <rect x="0" y="0" width="150" height="180" class="card" />
    <rect x="0" y="0" width="150" height="24" rx="3" class="card-purple" />
    <text x="8" y="16" class="text-title" fill="#6d28d9">Escrow (e_auth)</text>
    <text x="8" y="38" class="text-mono-bold">Layer: <tspan fill="#64748b">Supervisor</tspan></text>
    <text x="8" y="52" class="text-mono-bold">Authority: <tspan fill="#7c3aed">A = 0</tspan></text>
    <line x1="6" y1="60" x2="144" y2="60" stroke="#f1f5f9" stroke-width="1" />
    <text x="8" y="76" class="text-body">Policy validator checks</text>
    <text x="8" y="90" class="text-body">schema, ACLs &amp; quota.</text>
    <text x="8" y="104" class="text-body">Generates record:</text>
    <rect x="6" y="114" width="138" height="36" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8" />
    <text x="10" y="128" class="text-mono" font-size="8.5" fill="#6d28d9">ActionLSN: 0x2048</text>
    <text x="10" y="142" class="text-muted" font-size="8">Held in process memory</text>
    <text x="8" y="168" class="text-mono" font-size="8.5" fill="#7c3aed">Action locked in escrow</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 365 315 L 390 315" class="arrow-purple" />

  <!-- Step 3: Kernel Page Cache -->
  <g transform="translate(395, 225)">
    <rect x="0" y="0" width="155" height="180" class="card" />
    <rect x="0" y="0" width="155" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
    <text x="8" y="16" class="text-title" fill="#b91c1c">Page Cache Write</text>
    <text x="8" y="38" class="text-mono-bold">Syscall: <tspan fill="#b91c1c">write(fd, buf)</tspan></text>
    <text x="8" y="52" class="text-mono-bold">Medium: <tspan fill="#b91c1c">Kernel DRAM</tspan></text>
    <line x1="6" y1="60" x2="149" y2="60" stroke="#f1f5f9" stroke-width="1" />
    <text x="8" y="76" class="text-body">Copies bytes into dirty</text>
    <text x="8" y="90" class="text-body">OS page cache buffer.</text>
    <rect x="6" y="104" width="143" height="46" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8" />
    <text x="10" y="118" class="text-mono-bold" font-size="8.5" fill="#dc2626">PageLSN: 0x2048</text>
    <text x="10" y="132" class="text-mono" font-size="8" fill="#991b1b">FlushedLSN: 0x2047</text>
    <text x="10" y="144" class="text-muted" font-size="7.5">DRAM volatile - NOT safe!</text>
    <text x="8" y="168" class="text-mono-bold" font-size="8.5" fill="#dc2626">Vulnerable to Panic</text>
  </g>

  <!-- Arrow 3 -> 4 (Physical Barrier) -->
  <path d="M 550 315 L 580 315" class="arrow-blue" />

  <!-- Step 4: Storage Synchronization Barrier -->
  <g transform="translate(585, 225)">
    <rect x="0" y="0" width="165" height="180" class="card-blue" />
    <rect x="0" y="0" width="165" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="8" y="16" class="text-title" fill="#0369a1">Storage Barrier (e_flush)</text>
    <text x="8" y="38" class="text-mono-bold">Syscall: <tspan fill="#0284c7">fdatasync(fd)</tspan></text>
    <text x="8" y="52" class="text-mono-bold">Hardware: <tspan fill="#0284c7">NVMe Flush (0x35)</tspan></text>
    <line x1="6" y1="60" x2="159" y2="60" stroke="#bae6fd" stroke-width="1" />
    <text x="8" y="76" class="text-body">Blocks process until SSD</text>
    <text x="8" y="90" class="text-body">controller commits page</text>
    <text x="8" y="104" class="text-body">to non-volatile flash.</text>
    <rect x="6" y="112" width="153" height="38" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
    <text x="10" y="126" class="text-mono-bold" font-size="8.5" fill="#0369a1">FlushedLSN = 0x2048</text>
    <text x="10" y="140" class="text-mono" font-size="8" fill="#059669">FlushedLSN &gt;= PageLSN [OK]</text>
    <text x="8" y="168" class="text-mono-bold" font-size="8.5" fill="#0284c7">DURABILITY LOCKED</text>
  </g>

  <!-- Physical Boundary Line: Storage Barrier Gate -->
  <line x1="765" y1="215" x2="765" y2="415" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(755, 305)">
    <circle cx="10" cy="10" r="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
    <path d="M 6 10 L 9 13 L 15 6" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 750 315 L 795 315" class="arrow-green" />

  <!-- Step 5: Network Tool Dispatch -->
  <g transform="translate(800, 225)">
    <rect x="0" y="0" width="110" height="180" class="card" />
    <rect x="0" y="0" width="110" height="24" rx="3" class="card-green" />
    <text x="6" y="16" class="text-title" font-size="11" fill="#047857">Tool Dispatch</text>
    <text x="6" y="38" class="text-mono-bold" font-size="9">NIC DMA wire</text>
    <text x="6" y="52" class="text-mono" font-size="8.5" fill="#059669">a_ext sent</text>
    <line x1="4" y1="60" x2="106" y2="60" stroke="#f1f5f9" stroke-width="1" />
    <text x="6" y="76" class="text-body" font-size="9.5">TCP packet</text>
    <text x="6" y="90" class="text-body" font-size="9.5">leaves host.</text>
    <text x="6" y="106" class="text-body" font-size="9.5">Irrevocable</text>
    <text x="6" y="120" class="text-body" font-size="9.5">physical side</text>
    <text x="6" y="134" class="text-body" font-size="9.5">effect executed.</text>
    <rect x="6" y="144" width="98" height="26" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <text x="55" y="160" class="text-mono-bold" font-size="8" fill="#047857" text-anchor="middle">IRREVOCABLE</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 910 315 L 935 315" class="arrow" />

  <!-- Step 6: Observation Ingest -->
  <g transform="translate(940, 225)">
    <rect x="0" y="0" width="85" height="180" class="card" />
    <rect x="0" y="0" width="85" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="6" y="16" class="text-title" font-size="10.5" fill="#334155">Ingestion</text>
    <text x="6" y="38" class="text-mono-bold" font-size="9">e_obs</text>
    <text x="6" y="52" class="text-mono" font-size="8" fill="#64748b">stdout/exit</text>
    <line x1="4" y1="60" x2="81" y2="60" stroke="#f1f5f9" stroke-width="1" />
    <text x="6" y="78" class="text-body" font-size="9">Receives raw</text>
    <text x="6" y="92" class="text-body" font-size="9">bytes before</text>
    <text x="6" y="106" class="text-body" font-size="9">truncation.</text>
    <rect x="5" y="120" width="75" height="50" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="8" y="136" class="text-mono" font-size="8" fill="#475569">Next LSN:</text>
    <text x="8" y="152" class="text-mono-bold" font-size="8.5" fill="#0284c7">0x2049</text>
  </g>

  <!-- Bottom Phantom Mutation Warning Banner / Contrast Box -->
  <g transform="translate(40, 422)">
    <rect x="0" y="0" width="985" height="125" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    
    <!-- Left column: Classical DB WAL -->
    <g transform="translate(15, 12)">
      <rect x="0" y="0" width="465" height="100" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="18" class="text-title" fill="#334155">Classical Database ARIES WAL Invariant (Internal Boundary)</text>
      <text x="12" y="36" class="text-mono" font-size="9" fill="#0284c7">PageLSN &lt;= FlushedLSN before dirty page written to disk (Steal Policy)</text>
      <text x="12" y="52" class="text-body" font-size="9.5">Mutation target is a disk block</text>
      <text x="12" y="68" class="text-body" font-size="9.5">Undo pass uses before-images</text>
      <text x="12" y="86" class="text-mono-bold" font-size="9" fill="#059669">Physical Undo possible via disk block restore.</text>
    </g>

    <!-- Right column: Agentic WAL -->
    <g transform="translate(505, 12)">
      <rect x="0" y="0" width="465" height="100" rx="3" fill="#fff5f5" stroke="#fca5a5" stroke-width="1" />
      <text x="12" y="18" class="text-title" fill="#b91c1c">Agentic Systems WAL Invariant (External Boundary)</text>
      <text x="12" y="36" class="text-mono-bold" font-size="9" fill="#dc2626">ActionLSN &lt;= FlushedLSN before NIC network packet transmission</text>
      <text x="12" y="52" class="text-body" font-size="9.5">Mutation target is the real world</text>
      <text x="12" y="68" class="text-body" font-size="9.5">Packet before fsync gives a phantom mutation</text>
      <text x="12" y="86" class="text-mono-bold" font-size="9" fill="#b91c1c">Physical Undo is IMPOSSIBLE: Network packet cannot be recalled.</text>
    </g>
  </g>

</svg>
