<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .plane-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,4; rx: 6px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4px; }
      .card-hdr-blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; }
      .card-hdr-purple { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1; }
      .card-hdr-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1; }
      .card-hdr-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .text-mono { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10px; fill: #0f172a; }
      .text-mono-bold { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .text-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; }
      .arrow { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr-slate); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.4; fill: none; marker-end: url(#arr-purple); }
      .arrow-green { stroke: #059669; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
      .arrow-dashed-red { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 4,3; marker-end: url(#arr-red); }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="540" class="bg" />

  <!-- ============================================================== -->
  <!-- TOP REGION: VOLATILE SUPERVISOR MEMORY PLANE (HOST DRAM)       -->
  <!-- ============================================================== -->
  <rect x="25" y="20" width="1010" height="215" class="plane-box" />
  <rect x="35" y="28" width="220" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="41" class="text-mono-bold" fill="#334155">PLANE 1: SUPERVISOR MEMORY (DRAM)</text>
  <text x="1020" y="41" class="text-mono" font-size="9.5" fill="#dc2626" text-anchor="end">Transient State — Annihilated on Process Fault</text>

  <!-- Box 1A: Base State ACB[0] -->
  <g transform="translate(45, 58)">
    <rect x="0" y="0" width="155" height="160" class="card" />
    <rect x="0" y="0" width="155" height="24" rx="3" class="card-hdr-blue" />
    <text x="10" y="16" class="text-title" fill="#0369a1">Initial State ACB[0]</text>
    
    <text x="10" y="42" class="text-mono-bold">task_id: <tspan fill="#64748b">"task-842"</tspan></text>
    <text x="10" y="60" class="text-mono-bold">turn_step: <tspan fill="#0284c7">0</tspan></text>
    <text x="10" y="78" class="text-mono-bold">fsm_state: <tspan fill="#0284c7">INITIALIZED</tspan></text>
    <text x="10" y="96" class="text-mono-bold">token_used: <tspan fill="#0284c7">0</tspan></text>
    <text x="10" y="114" class="text-mono-bold">escrow_caps: <tspan fill="#64748b">{"auth": 0}</tspan></text>
    <rect x="8" y="130" width="139" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="77" y="144" class="text-muted" text-anchor="middle">Base In-Memory State</text>
  </g>

  <!-- Transition Arrow to Delta Fold -->
  <path d="M 200 138 L 255 138" class="arrow-blue" />
  <rect x="206" y="116" width="44" height="14" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8" />
  <text x="228" y="126" class="text-mono" font-size="8" fill="#0284c7" text-anchor="middle">e1</text>

  <!-- Box 1B: Transition Function Delta Fold Operator -->
  <g transform="translate(260, 58)">
    <rect x="0" y="0" width="215" height="160" class="card" />
    <rect x="0" y="0" width="215" height="24" rx="3" class="card-hdr-purple" />
    <text x="10" y="16" class="text-title" fill="#6d28d9">Fold: delta(ACB[k-1], e[k])</text>
    
    <text x="10" y="44" class="text-body" font-weight="600">Deterministic State Machine</text>
    <text x="10" y="62" class="text-muted">ACB[t] = fold(ACB[0], [e1, ..., et])</text>
    
    <rect x="8" y="74" width="199" height="42" rx="3" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8" />
    <text x="14" y="90" class="text-mono" font-size="9" fill="#7c3aed">match event.type:</text>
    <text x="22" y="104" class="text-mono" font-size="9" fill="#7c3aed">ObsIngested =&gt; update_ctx()</text>

    <text x="10" y="134" class="text-mono-bold" font-size="9.5" fill="#475569">Pure function: Zero I/O</text>
    <text x="10" y="148" class="text-muted" font-size="9">Evaluates identical state every run</text>
  </g>

  <!-- Transition Arrow to Live Projection -->
  <path d="M 475 138 L 530 138" class="arrow-purple" />
  <rect x="481" y="116" width="44" height="14" rx="2" fill="#ffffff" stroke="#e9d5ff" stroke-width="0.8" />
  <text x="503" y="126" class="text-mono" font-size="8" fill="#7c3aed" text-anchor="middle">e[t]</text>

  <!-- Box 1C: Active Projected State ACB[t] -->
  <g transform="translate(535, 58)">
    <rect x="0" y="0" width="180" height="160" class="card" />
    <rect x="0" y="0" width="180" height="24" rx="3" class="card-hdr-green" />
    <text x="10" y="16" class="text-title" fill="#047857">Current Projection ACB[t]</text>
    
    <text x="10" y="42" class="text-mono-bold">task_id: <tspan fill="#64748b">"task-842"</tspan></text>
    <text x="10" y="60" class="text-mono-bold">turn_step: <tspan fill="#059669">42</tspan></text>
    <text x="10" y="78" class="text-mono-bold">fsm_state: <tspan fill="#059669">TOOL_EXECUTED</tspan></text>
    <text x="10" y="96" class="text-mono-bold">token_used: <tspan fill="#059669">18,450</tspan></text>
    <text x="10" y="114" class="text-mono-bold">workspace: <tspan fill="#64748b">"sha256:d8a1..."</tspan></text>
    <rect x="8" y="130" width="164" height="20" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <text x="90" y="144" class="text-badge" fill="#047857" text-anchor="middle">Mutable Working View</text>
  </g>

  <!-- Crash & Recovery Replay Box -->
  <g transform="translate(745, 58)">
    <rect x="0" y="0" width="270" height="160" class="card" stroke="#f87171" stroke-width="1.4" />
    <rect x="0" y="0" width="270" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
    <text x="10" y="16" class="text-title" fill="#b91c1c">Deterministic Crash Recovery</text>
    
    <text x="10" y="44" class="text-body" font-weight="600" fill="#991b1b">Host Panic at Turn t = 42</text>
    <text x="10" y="60" class="text-muted">Volatile DRAM is lost</text>
    <text x="10" y="76" class="text-muted">Read log from LSN 0x1000 to 0x1005</text>
    <text x="10" y="92" class="text-muted">Fold events sequentially into ACB</text>
    <rect x="8" y="106" width="254" height="42" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8" />
    <text x="135" y="122" class="text-mono-bold" font-size="9" fill="#dc2626" text-anchor="middle">RECOVERY TIME: 1.5 ms</text>
    <text x="135" y="138" class="text-muted" font-size="8.5" text-anchor="middle">Zero Stochastic LLM Invocations</text>
  </g>

  <!-- ============================================================== -->
  <!-- MIDDLE REGION: CHANNELS (LIVE APPEND VS CRASH RECOVERY)        -->
  <!-- ============================================================== -->
  <!-- Live Append Path -->
  <path d="M 632 218 L 632 295" class="arrow-blue" />
  <rect x="548" y="246" width="170" height="20" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="633" y="260" class="text-mono-bold" font-size="9" fill="#0284c7" text-anchor="middle">Live: fsync() Barrier Append</text>

  <!-- Recovery Replay Stream Path -->
  <path d="M 880 310 L 880 225" class="arrow-green" />
  <rect x="795" y="246" width="175" height="20" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="882" y="260" class="text-mono-bold" font-size="9" fill="#047857" text-anchor="middle">Recovery: Sequential Log Read</text>

  <!-- Horizontal Divider / Plane Label -->
  <line x1="25" y1="280" x2="520" y2="280" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6,4" />
  <rect x="180" y="270" width="160" height="20" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text x="260" y="284" class="text-mono" font-size="9.5" fill="#475569" text-anchor="middle">Operating System I/O Boundary</text>

  <!-- ============================================================== -->
  <!-- BOTTOM REGION: PERSISTENCE PLANE (APPEND-ONLY LOG / NVMe)      -->
  <!-- ============================================================== -->
  <rect x="25" y="300" width="1010" height="220" class="plane-box" />
  <rect x="35" y="308" width="280" height="18" rx="3" fill="#e2e8f0" />
  <text x="42" y="321" class="text-mono-bold" fill="#334155">PLANE 2: IMMUTABLE EVENT LOG (NON-VOLATILE FLASH)</text>
  <text x="1020" y="321" class="text-mono" font-size="9.5" fill="#047857" text-anchor="end">Authoritative Ground Truth — Append-Only Sequence E</text>

  <!-- Event Blocks in Log -->
  <!-- e0 -->
  <g transform="translate(45, 338)">
    <rect x="0" y="0" width="130" height="160" class="card" />
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="8" y="15" class="text-mono-bold" fill="#0284c7">e0: TaskInit</text>
    <text x="10" y="38" class="text-mono" font-size="9">LSN: <tspan font-weight="700">0x1000</tspan></text>
    <text x="10" y="54" class="text-mono" font-size="9">PrevLSN: <tspan fill="#64748b">null</tspan></text>
    <text x="10" y="70" class="text-mono" font-size="9">Turn: <tspan font-weight="700">0</tspan></text>
    <line x1="8" y1="80" x2="122" y2="80" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="10" y="96" class="text-muted" font-size="9">User instruction</text>
    <text x="10" y="110" class="text-muted" font-size="9">Root context staged</text>
    <rect x="8" y="132" width="114" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6" />
    <text x="65" y="145" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">CRC: 0x82f1b4</text>
  </g>

  <!-- e1 -->
  <g transform="translate(185, 338)">
    <rect x="0" y="0" width="130" height="160" class="card" />
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="8" y="15" class="text-mono-bold" fill="#0284c7">e1: WorkingSet</text>
    <text x="10" y="38" class="text-mono" font-size="9">LSN: <tspan font-weight="700">0x1001</tspan></text>
    <text x="10" y="54" class="text-mono" font-size="9">PrevLSN: <tspan fill="#64748b">0x1000</tspan></text>
    <text x="10" y="70" class="text-mono" font-size="9">Turn: <tspan font-weight="700">1</tspan></text>
    <line x1="8" y1="80" x2="122" y2="80" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="10" y="96" class="text-muted" font-size="9">Prompt templates</text>
    <text x="10" y="110" class="text-muted" font-size="9">KV-cache tokens</text>
    <rect x="8" y="132" width="114" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6" />
    <text x="65" y="145" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">CRC: 0x93a2c0</text>
  </g>

  <!-- e2 -->
  <g transform="translate(325, 338)">
    <rect x="0" y="0" width="130" height="160" class="card" />
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8" />
    <text x="8" y="15" class="text-mono-bold" fill="#b45309">e2: ActionProp</text>
    <text x="10" y="38" class="text-mono" font-size="9">LSN: <tspan font-weight="700">0x1002</tspan></text>
    <text x="10" y="54" class="text-mono" font-size="9">PrevLSN: <tspan fill="#64748b">0x1001</tspan></text>
    <text x="10" y="70" class="text-mono" font-size="9">Turn: <tspan font-weight="700">1</tspan></text>
    <line x1="8" y1="80" x2="122" y2="80" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="10" y="96" class="text-muted" font-size="9">Model tokens</text>
    <text x="10" y="110" class="text-muted" font-size="9">Candidate call</text>
    <rect x="8" y="132" width="114" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6" />
    <text x="65" y="145" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">CRC: 0x11c7d2</text>
  </g>

  <!-- e3 -->
  <g transform="translate(465, 338)">
    <rect x="0" y="0" width="130" height="160" class="card" />
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8" />
    <text x="8" y="15" class="text-mono-bold" fill="#b45309">e3: ActionGate</text>
    <text x="10" y="38" class="text-mono" font-size="9">LSN: <tspan font-weight="700">0x1003</tspan></text>
    <text x="10" y="54" class="text-mono" font-size="9">PrevLSN: <tspan fill="#64748b">0x1002</tspan></text>
    <text x="10" y="70" class="text-mono" font-size="9">Turn: <tspan font-weight="700">1</tspan></text>
    <line x1="8" y1="80" x2="122" y2="80" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="10" y="96" class="text-muted" font-size="9">Policy: ALLOW (A=0)</text>
    <text x="10" y="110" class="text-muted" font-size="9">Capability escrow</text>
    <rect x="8" y="132" width="114" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6" />
    <text x="65" y="145" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">CRC: 0x4f88e9</text>
  </g>

  <!-- e4 -->
  <g transform="translate(605, 338)">
    <rect x="0" y="0" width="130" height="160" class="card" />
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8" />
    <text x="8" y="15" class="text-mono-bold" fill="#6d28d9">e4: Dispatched</text>
    <text x="10" y="38" class="text-mono" font-size="9">LSN: <tspan font-weight="700">0x1004</tspan></text>
    <text x="10" y="54" class="text-mono" font-size="9">PrevLSN: <tspan fill="#64748b">0x1003</tspan></text>
    <text x="10" y="70" class="text-mono" font-size="9">Turn: <tspan font-weight="700">1</tspan></text>
    <line x1="8" y1="80" x2="122" y2="80" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="10" y="96" class="text-muted" font-size="9">RPC Nonce &amp; Wire</text>
    <text x="10" y="110" class="text-muted" font-size="9">Storage sync barrier</text>
    <rect x="8" y="132" width="114" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6" />
    <text x="65" y="145" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">CRC: 0x3d02aa</text>
  </g>

  <!-- e5 -->
  <g transform="translate(745, 338)">
    <rect x="0" y="0" width="130" height="160" class="card" />
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <text x="8" y="15" class="text-mono-bold" fill="#047857">e5: ObsIngested</text>
    <text x="10" y="38" class="text-mono" font-size="9">LSN: <tspan font-weight="700">0x1005</tspan></text>
    <text x="10" y="54" class="text-mono" font-size="9">PrevLSN: <tspan fill="#64748b">0x1004</tspan></text>
    <text x="10" y="70" class="text-mono" font-size="9">Turn: <tspan font-weight="700">1</tspan></text>
    <line x1="8" y1="80" x2="122" y2="80" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="10" y="96" class="text-muted" font-size="9">Exit code: 0</text>
    <text x="10" y="110" class="text-muted" font-size="9">stdout: 420 bytes</text>
    <rect x="8" y="132" width="114" height="18" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.6" />
    <text x="65" y="145" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">CRC: 0x76b51e</text>
  </g>

  <!-- Append Pointer & Monotonic Chain -->
  <path d="M 175 418 L 183 418" class="arrow" />
  <path d="M 315 418 L 323 418" class="arrow" />
  <path d="M 455 418 L 463 418" class="arrow" />
  <path d="M 595 418 L 603 418" class="arrow" />
  <path d="M 735 418 L 743 418" class="arrow" />
  <path d="M 875 418 L 905 418" class="arrow" />
  <g transform="translate(915, 403)">
    <rect x="0" y="0" width="105" height="30" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" />
    <text x="52" y="14" class="text-mono-bold" font-size="9.5" fill="#0284c7" text-anchor="middle">AppendHead</text>
    <text x="52" y="25" class="text-mono" font-size="8.5" fill="#64748b" text-anchor="middle">LSN: 0x1006</text>
  </g>

</svg>
