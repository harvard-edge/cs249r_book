<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- ROW 1: FORWARD EXECUTION PATH (y = 50 to 110)                     -->
  <!-- ================================================================= -->
  <!-- 1. INITIALIZED -->
  <g transform="translate(35, 50)">
    <rect x="0" y="0" width="150" height="60" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">INITIALIZED</text>
    <text x="10" y="34" font-size="7.5" fill="#475569">• Alloc ACB &amp; UUIDv7</text>
    <text x="10" y="48" font-size="7.5" fill="#475569">• Verify Leases / TTL</text>
  </g>

  <!-- Arrow: INITIALIZED -> ACTIVE_PREFILL -->
  <path d="M185,80 L235,80" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="210" y="73" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">dispatch()</text>

  <!-- 2. ACTIVE_PREFILL -->
  <g transform="translate(235, 50)">
    <rect x="0" y="0" width="165" height="60" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">ACTIVE_PREFILL</text>
    <text x="10" y="34" font-size="7.5" fill="#0c4a6e">• Ingest Prompt Context</text>
    <text x="10" y="48" font-size="7.5" fill="#0c4a6e">• Compute-Bound GEMM</text>
  </g>

  <!-- Arrow: ACTIVE_PREFILL -> ACTIVE_DECODE -->
  <path d="M400,80 L450,80" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="425" y="73" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">first_token</text>

  <!-- 3. ACTIVE_DECODE -->
  <g transform="translate(450, 50)">
    <rect x="0" y="0" width="165" height="60" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">ACTIVE_DECODE</text>
    <text x="10" y="34" font-size="7.5" fill="#0c4a6e">• Autoregressive Step</text>
    <text x="10" y="48" font-size="7.5" fill="#0c4a6e">• Grammar Mask (DFA)</text>
  </g>

  <!-- Self-loop on ACTIVE_DECODE (Thought Generation) -->
  <path d="M515,50 C515,22 560,22 560,50" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="537" y="19" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#0369a1">emit_thought</text>

  <!-- Arrow: ACTIVE_DECODE -> TERMINATED (Success) -->
  <path d="M615,80 L665,80" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="640" y="73" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#15803d">goal_done</text>

  <!-- 4. TERMINATED (Terminal State) -->
  <g transform="translate(665, 50)">
    <rect x="0" y="0" width="165" height="60" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">TERMINATED</text>
    <text x="10" y="34" font-size="7.5" font-weight="700" fill="#16a34a">SUCCESS: Goal Verified</text>
    <text x="10" y="48" font-size="7.5" font-weight="700" fill="#b91c1c">ABORT: Fatal Quota / Invariant</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 2: SUSPENSION & RECOVERY (y = 180 to 245)                     -->
  <!-- ================================================================= -->
  <!-- 5. COMPENSATING_ROLLBACK -->
  <g transform="translate(35, 180)">
    <rect x="0" y="0" width="150" height="65" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">COMPENSATING_ROLLBACK</text>
    <text x="10" y="34" font-size="7.5" fill="#7f1d1d">• Unwind Sagas LIFO</text>
    <text x="10" y="46" font-size="7.5" fill="#7f1d1d">• Execute Inverses C_k(s)</text>
    <text x="10" y="58" font-size="7.5" fill="#dc2626">• Restore Safe Snapshot</text>
  </g>

  <!-- Arrow: COMPENSATING_ROLLBACK -> ACTIVE_PREFILL (Rollback Succeeded) -->
  <path d="M140,180 L140,128 L245,128 L245,110" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="185" y="123" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">rollback_ok</text>

  <!-- 6. SUSPENDED_TOOL_WAIT -->
  <g transform="translate(235, 180)">
    <rect x="0" y="0" width="165" height="65" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_TOOL_WAIT</text>
    <text x="10" y="34" font-size="7.5" fill="#78350f">• MicroVM / Sandbox Run</text>
    <text x="10" y="46" font-size="7.5" fill="#78350f">• If T_wait &lt; tau_swap: Pin HBM</text>
    <text x="10" y="58" font-size="7.5" fill="#b91c1c">• If T_wait &gt;= tau_swap: Evict</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_TOOL_WAIT -->
  <path d="M475,110 L475,145 L365,145 L365,180" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="420" y="139" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#b45309">tool_call()</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> ACTIVE_PREFILL (Tool Return) -->
  <path d="M300,180 L300,110" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="292" y="145" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#15803d">tool_return(obs)</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> COMPENSATING_ROLLBACK (Invariant Failed) -->
  <path d="M235,212 L185,212" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="210" y="205" text-anchor="middle" font-family="Courier, monospace" font-size="6" fill="#b91c1c">invariant_failed</text>

  <!-- 7. SUSPENDED_SWAPPED -->
  <g transform="translate(450, 180)">
    <rect x="0" y="0" width="165" height="65" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_SWAPPED</text>
    <text x="10" y="34" font-size="7.5" fill="#78350f">• KV Evicted to Host RAM</text>
    <text x="10" y="46" font-size="7.5" fill="#78350f">• HBM Freed for Other Jobs</text>
    <text x="10" y="58" font-size="7.5" fill="#64748b">• DMA Prefetch on Wake</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> SUSPENDED_SWAPPED -->
  <path d="M400,212 L450,212" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>
  <text x="425" y="205" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">dma_evict</text>

  <!-- Arrow: SUSPENDED_SWAPPED -> ACTIVE_PREFILL (DMA Prefetch) -->
  <path d="M515,180 L515,128 L385,128 L385,110" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="450" y="123" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#15803d">dma_prefetch(KV)</text>

  <!-- 8. SUSPENDED_HUMAN_GATE -->
  <g transform="translate(665, 180)">
    <rect x="0" y="0" width="165" height="65" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_HUMAN_GATE</text>
    <text x="10" y="34" font-size="7.5" fill="#78350f">• Reversibility Barrier Trap</text>
    <text x="10" y="46" font-size="7.5" fill="#78350f">• 100% KV Paged to NVMe</text>
    <text x="10" y="58" font-size="7.5" fill="#78350f">• Awaiting Signature / Token</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_HUMAN_GATE -->
  <path d="M590,110 L590,145 L730,145 L730,180" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="660" y="140" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">escalate_privilege()</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> ACTIVE_PREFILL (Approval via Upper Corridor) -->
  <path d="M700,180 L700,160 L410,160 L410,95 L400,95" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="560" y="155" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">approved()</text>

  <!-- ================================================================= -->
  <!-- ROW 3: PERSISTENCE (y = 320 to 385)                               -->
  <!-- ================================================================= -->
  <!-- 9. CHECKPOINTING -->
  <g transform="translate(235, 320)">
    <rect x="0" y="0" width="165" height="65" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="82" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">CHECKPOINTING</text>
    <text x="10" y="34" font-size="7.5" fill="#475569">• WAL Fsync &amp; CoW Snapshot</text>
    <text x="10" y="46" font-size="7.5" fill="#475569">• Vector Clock &amp; Burn Update</text>
    <text x="10" y="58" font-size="7.5" fill="#475569">• Flush KV Delta to Staging</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> CHECKPOINTING (Committed Step) -->
  <path d="M317,245 L317,320" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="325" y="280" font-family="Courier, monospace" font-size="7" fill="#475569">step_commit</text>

  <!-- Arrow: CHECKPOINTING -> ACTIVE_PREFILL (Resume Next Step) -->
  <path d="M235,352 L205,352 L205,150 L270,150 L270,110" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="198" y="270" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#15803d">committed</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> COMPENSATING_ROLLBACK (Rejection via Lower Channel) -->
  <path d="M747,245 L747,415 L110,415 L110,245" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="450" y="410" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b91c1c">rejected()</text>

  <!-- Arrow: COMPENSATING_ROLLBACK -> TERMINATED (Fatal Abort via Outer Perimeter) -->
  <path d="M75,245 L75,445 L855,445 L855,80 L830,80" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="470" y="440" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#b91c1c">rollback_exhausted (Fatal ABORT)</text>

</svg>