<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="520" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="880" height="480" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">AGENT CONTROL BLOCK (ACB) LIFECYCLE STATE MACHINE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">State transitions, memory paging triggers, and compensation rollback paths across agent execution</text>

  <!-- ================================================================= -->
  <!-- ROW 1: FORWARD EXECUTION PATH (y = 80)                            -->
  <!-- ================================================================= -->
  <!-- 1. INITIALIZED -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="160" height="75" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#334155">INITIALIZED</text>
    <text x="12" y="42" font-size="8" font-weight="700" fill="#0f172a">• Alloc ACB &amp; UUIDv7</text>
    <text x="12" y="58" font-size="7.5" fill="#64748b">• Verify Leases / TTL</text>
  </g>

  <!-- Arrow: INITIALIZED -> ACTIVE_PREFILL -->
  <path d="M200,117.5 L248,117.5" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="225" y="110" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" fill="#0369a1">dispatch()</text>

  <!-- 2. ACTIVE_PREFILL -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="175" height="75" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">ACTIVE_PREFILL</text>
    <text x="12" y="42" font-size="8" font-weight="700" fill="#0f172a">• Ingest Prompt Context</text>
    <text x="12" y="58" font-size="7.5" fill="#64748b">• Compute-Bound GEMM</text>
  </g>

  <!-- Arrow: ACTIVE_PREFILL -> ACTIVE_DECODE -->
  <path d="M425,117.5 L473,117.5" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="450" y="110" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" fill="#0369a1">first_token</text>

  <!-- 3. ACTIVE_DECODE -->
  <g transform="translate(475, 80)">
    <rect x="0" y="0" width="175" height="75" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">ACTIVE_DECODE</text>
    <text x="12" y="42" font-size="8" font-weight="700" fill="#0f172a">• Autoregressive Step</text>
    <text x="12" y="58" font-size="7.5" fill="#64748b">• Grammar Mask (DFA)</text>
  </g>

  <!-- Self-loop on ACTIVE_DECODE (Thought Generation) -->
  <path d="M540,80 C540,58 585,58 585,78" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="562" y="54" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#0369a1">emit_thought</text>

  <!-- Arrow: ACTIVE_DECODE -> TERMINATED (Success) -->
  <path d="M650,117.5 L703,117.5" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="677" y="110" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" fill="#15803d">goal_done</text>

  <!-- 4. TERMINATED (Terminal State) -->
  <g transform="translate(705, 80)">
    <rect x="0" y="0" width="175" height="75" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">TERMINATED</text>
    <text x="12" y="42" font-size="7.5" font-weight="700" fill="#15803d">SUCCESS: Goal Verified</text>
    <text x="12" y="58" font-size="7.5" font-weight="700" fill="#991b1b">ABORT: Fatal Quota / Invariant</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 2: SUSPENSION & RECOVERY (y = 210)                            -->
  <!-- ================================================================= -->
  <!-- 5. COMPENSATING_ROLLBACK -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="160" height="80" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">COMPENSATING_ROLLBACK</text>
    <text x="12" y="40" font-size="7.5" fill="#7f1d1d">• Unwind Sagas LIFO</text>
    <text x="12" y="54" font-size="7.5" fill="#7f1d1d">• Execute Inverses C_k(s)</text>
    <text x="12" y="68" font-size="7.5" font-weight="700" fill="#dc2626">• Restore Safe Snapshot</text>
  </g>

  <!-- Arrow: COMPENSATING_ROLLBACK -> ACTIVE_PREFILL (Rollback Succeeded) -->
  <path d="M140,210 L140,168 L265,168 L265,157" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="195" y="163" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#15803d">rollback_ok</text>

  <!-- 6. SUSPENDED_TOOL_WAIT -->
  <g transform="translate(250, 210)">
    <rect x="0" y="0" width="175" height="80" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">SUSPENDED_TOOL_WAIT</text>
    <text x="12" y="40" font-size="7.5" fill="#78350f">• MicroVM / Sandbox Run</text>
    <text x="12" y="54" font-size="7.5" fill="#78350f">• If T_wait &lt; tau_swap: Pin HBM</text>
    <text x="12" y="68" font-size="7.5" font-weight="700" fill="#dc2626">• If T_wait &gt;= tau_swap: Evict</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_TOOL_WAIT -->
  <path d="M505,155 L505,185 L365,185 L365,208" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="435" y="180" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" fill="#b45309">tool_call()</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> ACTIVE_PREFILL (Tool Return) -->
  <path d="M305,210 L305,157" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="297" y="185" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#15803d">tool_return(obs)</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> COMPENSATING_ROLLBACK (Invariant Failed) -->
  <path d="M250,250 L202,250" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="226" y="243" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="6.5" fill="#991b1b">invariant_failed</text>

  <!-- 7. SUSPENDED_SWAPPED -->
  <g transform="translate(475, 210)">
    <rect x="0" y="0" width="175" height="80" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">SUSPENDED_SWAPPED</text>
    <text x="12" y="40" font-size="7.5" fill="#78350f">• KV Evicted to Host RAM</text>
    <text x="12" y="54" font-size="7.5" fill="#78350f">• HBM Freed for Other Jobs</text>
    <text x="12" y="68" font-size="7.5" fill="#64748b">• DMA Prefetch on Wake</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> SUSPENDED_SWAPPED -->
  <path d="M425,250 L473,250" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>
  <text x="450" y="243" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#b45309">dma_evict</text>

  <!-- Arrow: SUSPENDED_SWAPPED -> ACTIVE_PREFILL (DMA Prefetch) -->
  <path d="M535,210 L535,175 L385,175 L385,157" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="460" y="170" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="6.8" fill="#15803d">dma_prefetch(KV)</text>

  <!-- 8. SUSPENDED_HUMAN_GATE -->
  <g transform="translate(705, 210)">
    <rect x="0" y="0" width="175" height="80" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">SUSPENDED_HUMAN_GATE</text>
    <text x="12" y="40" font-size="7.5" fill="#78350f">• Reversibility Barrier Trap</text>
    <text x="12" y="54" font-size="7.5" fill="#78350f">• 100% KV Paged to NVMe</text>
    <text x="12" y="68" font-size="7.5" fill="#78350f">• Awaiting Signature / Token</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_HUMAN_GATE -->
  <path d="M620,155 L620,185 L760,185 L760,208" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="690" y="180" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#b45309">escalate_privilege()</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> ACTIVE_PREFILL (Approval via Upper Corridor) -->
  <path d="M725,210 L725,168 L410,168 L410,157" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="570" y="163" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#15803d">approved()</text>

  <!-- ================================================================= -->
  <!-- ROW 3: PERSISTENCE & FAULT CORRIDORS                              -->
  <!-- ================================================================= -->
  <!-- 9. CHECKPOINTING -->
  <g transform="translate(250, 345)">
    <rect x="0" y="0" width="175" height="80" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">CHECKPOINTING</text>
    <text x="12" y="40" font-size="7.5" fill="#5b21b6">• WAL Fsync &amp; CoW Snapshot</text>
    <text x="12" y="54" font-size="7.5" fill="#5b21b6">• Vector Clock &amp; Burn Update</text>
    <text x="12" y="68" font-size="7.5" fill="#5b21b6">• Flush KV Delta to Staging</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> CHECKPOINTING (Committed Step) -->
  <path d="M337,290 L337,343" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="345" y="320" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#6d28d9">step_commit</text>

  <!-- Arrow: CHECKPOINTING -> ACTIVE_PREFILL (Resume Next Step) -->
  <path d="M250,385 L215,385 L215,180 L250,180 L250,157" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="208" y="285" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#15803d">committed</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> COMPENSATING_ROLLBACK (Rejection via Lower Channel) -->
  <path d="M770,290 L770,440 L120,440 L120,292" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="450" y="434" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7" fill="#991b1b">rejected()</text>

  <!-- Arrow: COMPENSATING_ROLLBACK -> TERMINATED (Fatal Abort via Outer Perimeter) -->
  <path d="M75,290 L75,465 L865,465 L865,117.5 L882,117.5" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="470" y="460" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier, monospace" font-size="7.5" fill="#991b1b">rollback_exhausted (Fatal ABORT)</text>

</svg>