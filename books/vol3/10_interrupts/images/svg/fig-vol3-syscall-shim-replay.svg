<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 425" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .box-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .panel-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #059669; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green-m); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-green-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="425" class="bg" />

  <!-- PANEL A: RECORDING MODE -->
  <g transform="translate(40, 16)">
    <rect x="0" y="0" width="800" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Mode Badge -->
    <rect x="16" y="14" width="285" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="26" y="29" class="panel-hdr" fill="#0369a1">MODE 1: RECORDING (LIVE EXECUTION)</text>

    <!-- Agent Supervisor Box -->
    <rect x="25" y="50" width="170" height="75" rx="5" class="box" />
    <text x="110" y="78" class="label" text-anchor="middle">Agent Process</text>
    <text x="110" y="98" class="subtext" text-anchor="middle">Policy &amp; State Machine</text>
    <text x="110" y="112" class="mono" font-size="9" fill="#64748b" text-anchor="middle">Sandbox / User Code</text>

    <!-- Syscall Shim Box -->
    <rect x="275" y="44" width="250" height="88" rx="5" class="box-blue" />
    <text x="400" y="68" class="label" fill="#0369a1" text-anchor="middle">Syscall Interception Shim</text>
    <text x="400" y="85" class="subtext" text-anchor="middle">LD_PRELOAD / eBPF Tracepoint</text>
    <text x="400" y="103" class="mono" font-size="10" fill="#475569" text-anchor="middle">Traps: clock, random, pid, readdir</text>
    <text x="400" y="120" class="mono" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">Passthrough &amp; Record to Trace</text>

    <!-- Host OS Kernel Box -->
    <rect x="600" y="50" width="175" height="75" rx="5" class="box" />
    <text x="687" y="78" class="label" text-anchor="middle">Host OS Kernel</text>
    <text x="687" y="98" class="subtext" text-anchor="middle">Hardware Clock &amp; Inodes</text>
    <text x="687" y="112" class="mono" font-size="9" fill="#64748b" text-anchor="middle">Physical Host State</text>

    <!-- Append Event Log Box -->
    <rect x="300" y="150" width="200" height="28" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2" />
    <text x="400" y="168" class="mono" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Append to Event Log / WAL</text>

    <!-- Arrows in Panel A -->
    <!-- Supervisor to Shim -->
    <line x1="195" y1="78" x2="273" y2="78" class="arrow" />
    <text x="235" y="71" class="mono" font-size="10" text-anchor="middle">Syscall</text>

    <!-- Shim to Kernel -->
    <line x1="525" y1="78" x2="598" y2="78" class="arrow" />
    <text x="562" y="71" class="mono" font-size="10" text-anchor="middle">Forward</text>

    <!-- Kernel to Shim -->
    <line x1="600" y1="98" x2="527" y2="98" class="arrow" />
    <text x="562" y="111" class="mono" font-size="10" fill="#64748b" text-anchor="middle">Return</text>

    <!-- Downward to Event Log -->
    <line x1="400" y1="132" x2="400" y2="148" class="arrow" />
  </g>

  <!-- PANEL B: REPLAY MODE -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="800" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Mode Badge -->
    <rect x="16" y="14" width="390" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <text x="26" y="29" class="panel-hdr" fill="#047857">MODE 2: DETERMINISTIC REPLAY (STATE RECONSTRUCTION)</text>

    <!-- Agent Supervisor Box -->
    <rect x="25" y="50" width="170" height="75" rx="5" class="box" />
    <text x="110" y="78" class="label" text-anchor="middle">Agent Process</text>
    <text x="110" y="98" class="subtext" text-anchor="middle">Replaying delta() Transition</text>
    <text x="110" y="112" class="mono" font-size="9" fill="#059669" text-anchor="middle">Deterministic State Step</text>

    <!-- Syscall Shim Box -->
    <rect x="275" y="44" width="250" height="88" rx="5" class="box-green" />
    <text x="400" y="68" class="label" fill="#047857" text-anchor="middle">Syscall Interception Shim</text>
    <text x="400" y="85" class="subtext" text-anchor="middle">Virtualization Active (A = 0)</text>
    <text x="400" y="103" class="mono" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Kernel Dispatch Trapped</text>
    <text x="400" y="120" class="mono" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Injects Recorded Event Stream</text>

    <!-- Host OS Kernel Box (Blocked) -->
    <rect x="600" y="50" width="175" height="75" rx="5" class="box-red" stroke-dasharray="4,3" />
    <text x="687" y="78" class="label" fill="#991b1b" text-anchor="middle">Host OS Kernel</text>
    <text x="687" y="98" class="subtext" fill="#b91c1c" text-anchor="middle">Hardware Disconnected</text>
    <text x="687" y="112" class="mono" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">ISOLATED / NO-OP</text>

    <!-- Event Log Box (Source) -->
    <rect x="300" y="150" width="200" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <text x="400" y="168" class="mono" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Recorded Event Stream / WAL</text>

    <!-- Arrows in Panel B -->
    <!-- Supervisor to Shim -->
    <line x1="195" y1="78" x2="273" y2="78" class="arrow" />
    <text x="235" y="71" class="mono" font-size="10" text-anchor="middle">Syscall</text>

    <!-- Shim towards Kernel (Blocked) -->
    <line x1="525" y1="87" x2="575" y2="87" class="arrow-red" />
    <g transform="translate(585, 87)">
      <circle cx="0" cy="0" r="10" fill="#dc2626" />
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffffff" stroke-width="2.2" />
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ffffff" stroke-width="2.2" />
    </g>
    <text x="560" y="75" class="mono" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">TRAPPED</text>

    <!-- Event Log Up to Shim -->
    <line x1="400" y1="150" x2="400" y2="134" class="arrow-green" />

    <!-- Shim back to Supervisor -->
    <line x1="275" y1="98" x2="197" y2="98" class="arrow-green" />
    <text x="235" y="112" class="mono" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Replayed</text>
  </g>
</svg>
