  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.acceptance
      label: Task acceptance
      teaches: Task acceptance contract
      summary: A verdict checks the artifact, process, authority, and evidence against a declared task contract;
        it is distinct from full semantic correctness.
      section: sec-vol3-evaluation-contract
    - id: vol3.grader
      label: Grader isolation
      teaches: Grader isolation
      summary: The authoritative test definitions and verdict channel remain outside the reach of the candidate
        code being assessed.
      section: sec-vol3-evaluation-gyms-grader-isolation
      aliases:
      - Isolated grader
    - id: vol3.repeatability
      label: Repeated-run consistency
      teaches: Repeated-run consistency
      summary: Reliability across repeated executions of the same task differs from the chance of finding
        at least one passing candidate in a pool.
      section: sec-vol3-evaluation-pass-k
      aliases:
      - Repeated-run reliability
    - id: vol3.coverage
      label: Evidence coverage
      teaches: Coverage rule
      summary: Each test or evaluation instrument supports named properties under stated conditions; passing
        finite tests does not establish a universal proof.
      section: sec-vol3-evaluation-contract-instruments
    relationships:
    - id: vol3.field.grader.acceptance
      source: vol3.grader
      predicate: protects measurement for
      target: vol3.acceptance
      explanation: The candidate must not be able to rewrite the tests or authoritative verdict path used
        to accept it.
      conditions: Isolation preserves measurement integrity but does not supply missing test coverage.
      status: draft
      evidence:
        section: sec-vol3-evaluation-gyms-grader-isolation
        quote: Resetting the sandbox between runs protects the starting state, but a trial can still corrupt
          its own verdict if the agent or its submitted code can reach the tests that grade it. Visible
          unit tests are useful during iterative problem-solving to give the agent intermediate feedback,
          whereas held-out acceptance tests, which act as the sealed tests of the closure evidence levels,
          must judge the final submission without becoming an optimization target themselves. **Grader isolation**\index{Grader
          isolation!definition} keeps reference solutions, secret test suites, grading scripts, and authoritative
          score registries outside the agent's execution environment, and cryptographically binds the resulting
          score to the exact artifact digest (such as the SHA-256 hash of workspace snapshot `ws_r19`) captured
          at completion.
    - id: vol3.field.coverage.acceptance
      source: vol3.coverage
      predicate: limits claims from
      target: vol3.acceptance
      explanation: An evaluation instrument supports particular properties rather than all semantic correctness.
      conditions: A finite test pass is evidence under tested conditions, not a proof of a universal specification.
      status: draft
      evidence:
        section: sec-vol3-evaluation-contract-instruments
        quote: 'All three instruments obey the **coverage rule**\index{Coverage rule!definition}: an evaluation
          check establishes only those properties that its scope, input vectors, and underlying assumptions
          directly support. Isolating an automated grader from agent tampering protects the integrity of
          its measurements, but it cannot expand its coverage. A test suite can pass completely yet still
          miss a critical defect if the test cases fail to exercise that execution path.'
    - id: vol3.field.repeatability.search
      source: vol3.repeatability
      predicate: differs from coverage under
      target: vol3.search
      explanation: Candidate-pool success and consistency across repeated deployments answer different reliability
        questions.
      conditions: Compare the same task population and declared budgets; independent-attempt assumptions
        need justification.
      status: draft
      evidence:
        section: sec-vol3-evaluation-pass-k
        quote: 'Permitting multiple attempts means one thing when a repair agent can generate eight candidate
          patches offline and let a test suite pick a winner, and quite another when a support agent must
          answer the same compliance question across thousands of live customer sessions without a single
          wrong reply. Across those workloads, three engineering achievements remain distinct: producing
          a candidate pool that contains at least one correct patch, deploying an automated selector that
          reliably extracts that patch, and operating an agent that solves the problem consistently on every
          execution. @Sec-vol3-test-time-compute-pass-at-k defined pass@$\IndependentAttemptCount$ as candidate
          availability: the probability that a pool of $\IndependentAttemptCount$ independent runs contains
          at least one acceptable solution. For automated workloads that recur continuously in production
          without a checker between the agent and the user, availability alone is insufficient. Production
          deployment demands the opposite quantifier: repeated-run consistency, where all $\IndependentAttemptCount$
          independent executions must pass. These two metrics anchor opposite ends of system reliability,
          and they diverge sharply as $\IndependentAttemptCount$ scales.'
    maps: []
