  claims:
    Task acceptance contract: A trial is credited as an accepted task only when evidence on the exact candidate
      bytes satisfies its declared outcome, process, resource, and residual-duty criteria, and every verdict is
      pass, fail, pending, or unknown, with no default to pass.
    Hermetic evaluation gym: Comparable trials need a hermetic boundary that declares which dependencies are provisioned,
      simulated, or blocked, a versioned task fixture, and a reset that leaves no state for the next trial.
    Grader isolation: Sealed tests protect evidence only if a trusted controller outside both the live agent's reach
      and the submitted artifact's execution keeps the reference solutions, hidden tests, and score store and binds
      each verdict to the artifact hash.
    Grader calibration: A grader is characterized only against an independent reference assessment, and its false-acceptance
      rate and the failure share among accepted results answer different questions.
    Task sampling and score intervals: Repeats shrink only the run-variance term while new tasks shrink both, so
      evaluation samples tasks rather than runs and reports score intervals instead of point estimates.
    Paired comparison: Configurations are compared on the same sampled tasks with outcome pairs kept together, which
      cuts the variance of the difference, and noninferiority margins are planned before data.
    Matched-budget evaluation: Policies are compared on a fixed task distribution, criteria, and resource envelope,
      and budgeted acceptance and observed cost per accepted task charge every initiated trial.
    Contamination: Benchmark tasks or solutions that appeared in pretraining corpora or retrieval indices before
      the trial invalidate the claim the benchmark supports, and no similarity threshold proves independence.
    Repeated-run consistency: pass@k measures candidate availability while pass^k = E[p_i^k] measures whether all
      k runs pass, and the two diverge as k grows.
    Coverage rule: A check certifies only the behavior its assertions exercise, so acceptance criteria name what
      each check covers and what it leaves unverified.
