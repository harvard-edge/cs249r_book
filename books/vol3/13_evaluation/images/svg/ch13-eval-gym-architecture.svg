<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- ===== Task sandbox (one per trial) ===== -->
  <rect x="20" y="20" width="420" height="360" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <rect x="20" y="20" width="420" height="24" rx="2" fill="#fef3c7"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Task sandbox (one per trial)</text>

  <!-- Agent under test -->
  <rect x="40" y="60" width="380" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="230" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Agent under test</text>
  <text x="230" y="97" text-anchor="middle" font-size="8.5" fill="#475569">model, prompt, tools, harness: <tspan font-family="Courier New, monospace">candidate_v2</tspan></text>

  <!-- agent edits and runs inside the fixture -->
  <line x1="230" y1="110" x2="230" y2="128" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="238" y="123" font-size="8" fill="#475569">edits, runs checks</text>

  <!-- Fixture -->
  <rect x="40" y="130" width="380" height="110" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="147" font-size="9" font-weight="700" fill="#0f172a">Fixture <tspan font-family="Courier New, monospace" font-weight="400">pool_fixture_v1</tspan></text>
  <rect x="56" y="158" width="168" height="66" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="187" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Base image</text>
  <text x="140" y="203" text-anchor="middle" font-size="8" fill="#475569">read-only, shared</text>
  <rect x="236" y="158" width="168" height="66" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="320" y="187" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Copy-on-write layer</text>
  <text x="320" y="203" text-anchor="middle" font-size="8" fill="#475569">this trial's writes</text>

  <!-- Interaction boundary -->
  <rect x="40" y="256" width="380" height="84" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="273" font-size="9" font-weight="700" fill="#0f172a">Interaction boundary</text>
  <rect x="56" y="284" width="168" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="140" y="307" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">External egress blocked</text>
  <rect x="236" y="284" width="168" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="320" y="300" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Service fixtures</text>
  <text x="320" y="315" text-anchor="middle" font-size="8" fill="#475569">emulators, recorded replies</text>

  <text x="230" y="362" text-anchor="middle" font-size="8" fill="#475569">seed fixed where supported; versions and provenance recorded</text>

  <!-- ===== Captured candidate artifact ===== -->
  <path d="M 404 191 H 427 V 220 H 448" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="450" y="198" width="76" height="44" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="488" y="217" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Courier New, monospace" fill="#0f172a">ws_r19</text>
  <text x="488" y="232" text-anchor="middle" font-size="8" fill="#475569">exact bytes</text>
  <text x="488" y="190" text-anchor="middle" font-size="8" fill="#475569">captured</text>

  <!-- ===== Grading boundary ===== -->
  <rect x="540" y="20" width="400" height="360" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="540" y="20" width="400" height="24" rx="2" fill="#e2e8f0"/>
  <text x="552" y="36" font-size="10" font-weight="700" fill="#0f172a">Grading boundary</text>

  <!-- Trusted controller -->
  <rect x="560" y="60" width="340" height="84" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="730" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Trusted controller</text>
  <text x="730" y="97" text-anchor="middle" font-size="8.5" fill="#475569">held-out tests, criteria <tspan font-family="Courier New, monospace">repair_accept_v1</tspan></text>
  <text x="730" y="112" text-anchor="middle" font-size="8.5" fill="#475569">decision logic, authoritative result store</text>
  <text x="730" y="131" text-anchor="middle" font-size="8" font-style="italic" fill="#6d28d9">outside the candidate's reach</text>

  <!-- controller <-> candidate execution -->
  <line x1="680" y1="144" x2="680" y2="178" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="674" y="165" text-anchor="end" font-size="8" fill="#475569">selected tests</text>
  <line x1="790" y1="180" x2="790" y2="146" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="796" y="165" font-size="8" fill="#475569">outputs, logs (untrusted)</text>

  <!-- Candidate execution -->
  <rect x="560" y="180" width="340" height="80" rx="3" fill="#fef3c7" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="730" y="200" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Candidate execution (limited)</text>
  <text x="730" y="217" text-anchor="middle" font-size="8.5" fill="#475569">submitted code runs with the tests it receives</text>
  <rect x="685" y="229" width="90" height="18" rx="3" fill="#dc2626"/>
  <text x="730" y="241" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">attack surface</text>

  <!-- captured artifact enters candidate execution -->
  <line x1="526" y1="220" x2="558" y2="220" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- controller -> verdict record (routed in the right gutter) -->
  <path d="M 900 102 H 920 V 320 H 902" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

  <!-- Verdict record -->
  <rect x="560" y="286" width="340" height="68" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="730" y="305" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Criterion-level verdicts</text>
  <text x="730" y="323" text-anchor="middle" font-size="9" font-family="Courier New, monospace" fill="#0f172a">pass | fail | pending | unknown</text>
  <text x="730" y="341" text-anchor="middle" font-size="8" fill="#475569">bound to <tspan font-family="Courier New, monospace">ws_r19</tspan> and the criteria version</text>
</svg>
