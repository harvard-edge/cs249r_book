<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="390" fill="#ffffff"/>

  <!-- ===== Trials ===== -->
  <rect x="20" y="130" width="130" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="85" y="156" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Admitted trials</text>
  <text x="85" y="172" text-anchor="middle" font-size="8" fill="#475569">spans, observations</text>

  <line x1="150" y1="160" x2="188" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Capture boundary ===== -->
  <rect x="190" y="130" width="150" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="265" y="156" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Capture boundary</text>
  <text x="265" y="172" text-anchor="middle" font-size="8" fill="#475569">minimize, redact (fallible)</text>

  <line x1="340" y1="160" x2="378" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Bounded buffer ===== -->
  <rect x="380" y="120" width="180" height="80" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="470" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Bounded buffer</text>
  <text x="470" y="158" text-anchor="middle" font-size="8" fill="#475569">held until the verdict window</text>
  <rect x="398" y="169" width="144" height="18" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="470" y="181" text-anchor="middle" font-size="8" fill="#6d28d9">evicts lowest priority first</text>

  <line x1="560" y1="160" x2="598" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Task verdicts (can arrive late) ===== -->
  <rect x="600" y="20" width="200" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="700" y="39" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Task verdicts (can arrive late)</text>
  <line x1="700" y1="50" x2="700" y2="68" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Verdict-aware selection ===== -->
  <rect x="600" y="70" width="200" height="200" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="600" y="70" width="200" height="24" rx="2" fill="#e2e8f0"/>
  <text x="700" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Verdict-aware selection</text>

  <rect x="612" y="102" width="176" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="620" y="116" font-size="8.5" font-weight="700" fill="#0f172a">1  Failed criterion or violation</text>
  <text x="620" y="129" font-size="8" fill="#475569">high priority, not guaranteed</text>

  <rect x="612" y="142" width="176" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="156" font-size="8.5" font-weight="700" fill="#0f172a">2  Pending or unknown</text>
  <text x="620" y="169" font-size="8" fill="#475569">provisional, until its deadline</text>

  <rect x="612" y="182" width="176" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="196" font-size="8.5" font-weight="700" fill="#0f172a">3  Accepted, slow or costly</text>
  <text x="620" y="209" font-size="8" fill="#475569">declared diagnostic thresholds</text>

  <rect x="612" y="222" width="176" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="620" y="236" font-size="8.5" font-weight="700" fill="#0f172a">4  Ordinary accepted</text>
  <text x="620" y="249" font-size="8" fill="#475569">random control sample</text>

  <!-- ===== Sinks ===== -->
  <line x1="800" y1="145" x2="828" y2="145" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="830" y="110" width="110" height="70" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="885" y="134" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Detailed</text>
  <text x="885" y="147" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">trace store</text>
  <text x="885" y="166" text-anchor="middle" font-size="8" fill="#475569">inclusion probability</text>

  <line x1="800" y1="240" x2="828" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="830" y="220" width="110" height="40" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="885" y="237" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Discarded</text>
  <text x="885" y="251" text-anchor="middle" font-size="8" fill="#475569">unselected bodies</text>

  <!-- ===== Accounting record: every trial, outside sampling ===== -->
  <line x1="85" y1="190" x2="85" y2="308" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="91" y="252" font-size="8" fill="#475569">every trial</text>
  <line x1="470" y1="200" x2="470" y2="308" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="476" y="252" font-size="8" fill="#475569">drops, evictions, truncation</text>

  <rect x="20" y="310" width="920" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="480" y="333" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Evaluation accounting record</text>
  <text x="480" y="351" text-anchor="middle" font-size="8.5" fill="#475569">complete cohort: identity, configuration, verdict, costs, and recorded capture losses</text>
</svg>
