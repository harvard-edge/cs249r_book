<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- ===== Admitted trials ===== -->
  <rect x="20" y="140" width="100" height="70" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Admitted</text>
  <text x="70" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">trials</text>

  <!-- ===== Capture boundary: a fallible filter the traces pass through ===== -->
  <line x1="120" y1="175" x2="188" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="150" y="120" width="10" height="110" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="155" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Capture boundary</text>
  <text x="155" y="248" text-anchor="middle" font-size="12" fill="#475569">minimize, redact</text>

  <!-- ===== Bounded buffer: slots held until the verdict window ===== -->
  <rect x="190" y="130" width="200" height="90" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="290" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Bounded buffer</text>
  <!-- slots: fill encodes the selection class (matches the rungs on the right) -->
  <rect x="202" y="164" width="18" height="30" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="224" y="164" width="18" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="246" y="164" width="18" height="30" rx="0" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="268" y="164" width="18" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="290" y="164" width="18" height="30" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="312" y="164" width="18" height="30" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <rect x="334" y="164" width="18" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="356" y="164" width="18" height="30" rx="0" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="290" y="210" text-anchor="middle" font-size="12" fill="#475569">held until verdict</text>

  <!-- evicted body (lowest priority first) -->
  <rect x="334" y="232" width="18" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
  <line x1="343" y1="220" x2="343" y2="230" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="360" y="252" font-size="12" fill="#b91c1c">evicted</text>

  <!-- ===== Task verdicts arrive late ===== -->
  <rect x="445" y="20" width="180" height="40" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="535" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Task verdicts, late</text>
  <line x1="535" y1="60" x2="535" y2="78" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Verdict-aware selection: a precedence ladder ===== -->
  <line x1="390" y1="175" x2="428" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="430" y="80" width="210" height="194" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M430,104 V84 Q430,80 434,80 H636 Q640,80 640,84 V104 Z" fill="#e2e8f0"/>
  <line x1="430" y1="104" x2="640" y2="104" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="535" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Selection precedence</text>
  <rect x="442" y="114" width="186" height="32" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="452" y="134" font-size="12" font-weight="700" fill="#0f172a">1  Failed or violation</text>
  <rect x="442" y="152" width="186" height="32" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="452" y="172" font-size="12" font-weight="700" fill="#0f172a">2  Pending or unknown</text>
  <rect x="442" y="190" width="186" height="32" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="452" y="210" font-size="12" font-weight="700" fill="#0f172a">3  Accepted, slow or costly</text>
  <rect x="442" y="228" width="186" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="452" y="248" font-size="12" font-weight="700" fill="#0f172a">4  Ordinary accepted</text>

  <!-- ===== Outputs ===== -->
  <line x1="640" y1="140" x2="658" y2="140" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="660" y="98" width="80" height="84" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="700" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Trace</text>
  <text x="700" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">store</text>
  <text x="700" y="156" text-anchor="middle" font-size="12" fill="#475569">inclusion</text>
  <text x="700" y="171" text-anchor="middle" font-size="12" fill="#475569">probability</text>
  <path d="M535,274 V300 H648" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="545" y="292" font-size="12" fill="#475569">unselected</text>
  <rect x="650" y="282" width="90" height="36" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="695" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Discarded</text>

  <!-- ===== Accounting record: outside the buffer ===== -->
  <line x1="70" y1="210" x2="70" y2="338" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="80" y="300" font-size="12" fill="#475569">every trial</text>
  <line x1="343" y1="262" x2="343" y2="338" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="353" y="300" font-size="12" fill="#475569">drops, evictions, truncation</text>
  <rect x="20" y="340" width="720" height="60" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Evaluation accounting record</text>
  <text x="380" y="386" text-anchor="middle" font-size="12" fill="#475569">complete cohort: verdicts, costs, recorded losses</text>
</svg>
