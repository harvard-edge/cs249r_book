<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- ===== Live exposure: share of eligible live tasks assigned to the candidate ===== -->
  <text x="20" y="28" font-size="12" font-weight="700" fill="#475569">Live tasks assigned to the candidate</text>
  <rect x="20" y="40" width="156" height="22" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="98" y="55" text-anchor="middle" font-size="12" fill="#475569">none</text>
  <rect x="208" y="40" width="156" height="22" rx="0" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="286" y="55" text-anchor="middle" font-size="12" fill="#b45309">copies only</text>
  <rect x="396" y="40" width="156" height="22" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="396" y="40" width="36" height="22" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="442" y="56" font-size="14" font-style="italic" fill="#b45309">&#961;</text>
  <rect x="584" y="40" width="156" height="22" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="584" y="40" width="110" height="22" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="639" y="55" text-anchor="middle" font-size="12" fill="#b45309">scoped</text>

  <!-- ===== Stage cards ===== -->
  <!-- 1 Offline -->
  <rect x="20" y="80" width="156" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M20,106 V84 Q20,80 24,80 H172 Q176,80 176,84 V106 Z" fill="#e2e8f0"/>
  <line x1="20" y1="106" x2="176" y2="106" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="32" y="98" font-size="13" font-weight="700" fill="#0f172a">1  Offline trials</text>
  <rect x="30" y="130" width="136" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="98" y="157" text-anchor="middle" font-size="16" fill="#0f172a"><tspan font-style="italic">L</tspan><tspan dy="4" font-size="12">&#916;</tspan><tspan dx="4" dy="-4">&gt; &#8722;</tspan><tspan font-style="italic">&#948;</tspan><tspan dy="4" font-size="12">tol</tspan></text>
  <text x="98" y="198" text-anchor="middle" font-size="12" fill="#475569">paired interval</text>

  <!-- 2 Shadow -->
  <rect x="208" y="80" width="156" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M208,106 V84 Q208,80 212,80 H360 Q364,80 364,84 V106 Z" fill="#e2e8f0"/>
  <line x1="208" y1="106" x2="364" y2="106" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="220" y="98" font-size="13" font-weight="700" fill="#0f172a">2  Shadow execution</text>
  <rect x="218" y="130" width="136" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="286" y="157" text-anchor="middle" font-size="16" fill="#0f172a">&#119967;<tspan dy="4" font-size="12">JS</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">p</tspan><tspan dy="4" font-size="12">b</tspan><tspan dx="3" dy="-4">&#8214;</tspan><tspan dx="3" font-style="italic">p</tspan><tspan dy="4" font-size="12">c</tspan><tspan dy="-4">)</tspan></text>
  <text x="286" y="198" text-anchor="middle" font-size="12" fill="#475569">tool-call drift</text>

  <!-- 3 Canary -->
  <rect x="396" y="80" width="156" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M396,106 V84 Q396,80 400,80 H548 Q552,80 552,84 V106 Z" fill="#e2e8f0"/>
  <line x1="396" y1="106" x2="552" y2="106" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="408" y="98" font-size="13" font-weight="700" fill="#0f172a">3  Canary</text>
  <rect x="406" y="130" width="136" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="474" y="157" text-anchor="middle" font-size="16" fill="#0f172a">&#923;<tspan dy="4" font-size="12">n</tspan><tspan dx="4" dy="-4">vs.</tspan><tspan dx="4" font-style="italic">b</tspan><tspan dy="4" font-size="12">low</tspan><tspan dy="-4">,</tspan><tspan dx="4" font-style="italic">u</tspan></text>
  <text x="474" y="198" text-anchor="middle" font-size="12" fill="#475569">sequential monitor</text>
  <text x="474" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">+ hard tripwires</text>

  <!-- 4 Release -->
  <rect x="584" y="80" width="156" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M584,106 V84 Q584,80 588,80 H736 Q740,80 740,84 V106 Z" fill="#e2e8f0"/>
  <line x1="584" y1="106" x2="740" y2="106" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="596" y="98" font-size="13" font-weight="700" fill="#0f172a">4  Release decision</text>
  <rect x="594" y="130" width="136" height="44" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="662" y="157" text-anchor="middle" font-size="16" fill="#0f172a">1<tspan dy="4" font-size="12">ship</tspan><tspan dx="4" dy="-4">= 1</tspan></text>
  <text x="662" y="198" text-anchor="middle" font-size="12" fill="#475569">every gate criterion</text>
  <text x="662" y="222" text-anchor="middle" font-size="12" fill="#475569">scoped next step</text>

  <!-- ===== met: advance ===== -->
  <line x1="176" y1="152" x2="206" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="192" y="144" text-anchor="middle" font-size="12" fill="#475569">met</text>
  <line x1="364" y1="152" x2="394" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="380" y="144" text-anchor="middle" font-size="12" fill="#475569">met</text>
  <line x1="552" y1="152" x2="582" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="568" y="144" text-anchor="middle" font-size="12" fill="#475569">met</text>

  <!-- ===== Failure routes: every stage drains to the same hold ===== -->
  <line x1="98" y1="240" x2="98" y2="298" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="106" y="274" font-size="12" fill="#475569">not met or inconclusive</text>
  <line x1="286" y1="240" x2="286" y2="298" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="294" y="274" font-size="12" fill="#475569">problem found</text>
  <line x1="474" y1="240" x2="474" y2="298" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="482" y="274" font-size="12" fill="#475569">alarm or tripwire</text>

  <!-- ===== Hold ===== -->
  <rect x="20" y="300" width="720" height="100" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M20,326 V304 Q20,300 24,300 H736 Q740,300 740,304 V326 Z" fill="#fee2e2"/>
  <line x1="20" y1="326" x2="740" y2="326" stroke="#dc2626" stroke-width="0.8"/>
  <text x="32" y="318" font-size="13" font-weight="700" fill="#0f172a">Hold: candidate routing stops</text>
  <rect x="36" y="338" width="332" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="202" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Stop new candidate admission</text>
  <text x="202" y="376" text-anchor="middle" font-size="12" fill="#475569">enforced at admission boundaries</text>
  <rect x="392" y="338" width="332" height="48" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="558" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Outstanding candidate work</text>
  <text x="558" y="376" text-anchor="middle" font-size="12" fill="#475569">keeps owners; recovery, not rollback</text>
</svg>
