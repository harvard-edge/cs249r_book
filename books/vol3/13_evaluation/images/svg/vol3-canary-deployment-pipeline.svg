<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="390" fill="#ffffff"/>

  <!-- ===== Stage 1: offline paired comparison ===== -->
  <rect x="20" y="20" width="200" height="190" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="200" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="36" font-size="9.5" font-weight="700" fill="#0f172a">1</text>
  <text x="48" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Offline comparison</text>
  <text x="120" y="64" text-anchor="middle" font-size="8.5" fill="#475569">paired tasks, declared fixtures</text>
  <text x="120" y="78" text-anchor="middle" font-size="8.5" fill="#475569">matched criteria and budgets</text>
  <rect x="36" y="94" width="168" height="54" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">L<tspan dy="3" font-size="8">&#916;</tspan><tspan dx="3" dy="-3">&gt; &#8722;&#948;</tspan><tspan dy="3" font-size="8">tol</tspan></text>
  <text x="120" y="137" text-anchor="middle" font-size="8" fill="#475569">paired interval, declared margin</text>
  <text x="120" y="182" text-anchor="middle" font-size="8.5" fill="#475569">inconclusive counts as not met</text>

  <!-- ===== Stage 2: shadow execution ===== -->
  <rect x="260" y="20" width="200" height="190" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="260" y="20" width="200" height="24" rx="2" fill="#e2e8f0"/>
  <text x="272" y="36" font-size="9.5" font-weight="700" fill="#0f172a">2</text>
  <text x="288" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Shadow execution</text>
  <text x="360" y="64" text-anchor="middle" font-size="8.5" fill="#475569">authorized copy of live inputs</text>
  <text x="360" y="78" text-anchor="middle" font-size="8.5" fill="#475569">output withheld from the task</text>
  <rect x="276" y="94" width="168" height="54" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="360" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">D<tspan dy="3" font-size="8">JS</tspan><tspan dy="-3">(P</tspan><tspan dy="3" font-size="8">b</tspan><tspan dx="2" dy="-3">&#8214;</tspan><tspan dx="2">P</tspan><tspan dy="3" font-size="8">c</tspan><tspan dy="-3">)</tspan></text>
  <text x="360" y="137" text-anchor="middle" font-size="8" fill="#475569">tool-call drift, beyond threshold</text>
  <text x="360" y="182" text-anchor="middle" font-size="8.5" fill="#475569">difference is not regression</text>

  <!-- ===== Stage 3: canary ===== -->
  <rect x="500" y="20" width="200" height="190" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="20" width="200" height="24" rx="2" fill="#e2e8f0"/>
  <text x="512" y="36" font-size="9.5" font-weight="700" fill="#0f172a">3</text>
  <text x="528" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Canary</text>
  <text x="600" y="64" text-anchor="middle" font-size="8.5" fill="#475569">allocation &#961; of eligible live tasks</text>
  <text x="600" y="78" text-anchor="middle" font-size="8.5" fill="#475569">assignment sticky per trajectory</text>
  <rect x="516" y="94" width="168" height="54" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="600" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">&#923;<tspan dy="3" font-size="8">n</tspan><tspan dx="3" dy="-3">vs. &#8467; and u</tspan></text>
  <text x="600" y="137" text-anchor="middle" font-size="8" fill="#475569">sequential monitor, mature labels</text>
  <rect x="555" y="166" width="90" height="18" rx="3" fill="#dc2626"/>
  <text x="600" y="178" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">hard tripwires</text>
  <text x="600" y="198" text-anchor="middle" font-size="8" fill="#475569">forbidden dispatch, exhausted limits</text>

  <!-- ===== Stage 4: wider release decision ===== -->
  <rect x="740" y="20" width="200" height="190" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="740" y="20" width="200" height="24" rx="2" fill="#e2e8f0"/>
  <text x="752" y="36" font-size="9.5" font-weight="700" fill="#0f172a">4</text>
  <text x="768" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Release decision</text>
  <text x="840" y="64" text-anchor="middle" font-size="8.5" fill="#475569">every declared criterion holds</text>
  <text x="840" y="78" text-anchor="middle" font-size="8.5" fill="#475569">for the stated scope</text>
  <rect x="756" y="94" width="168" height="54" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="840" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">G = 1</text>
  <text x="840" y="137" text-anchor="middle" font-size="8" fill="#475569">paired margin, &#920;, p99, V<tspan dy="2" font-size="7">c</tspan><tspan dx="3" dy="-2">= 0</tspan></text>
  <text x="840" y="182" text-anchor="middle" font-size="8.5" fill="#475569">permits a scoped next step</text>

  <!-- ===== Forward arrows (criterion met) ===== -->
  <line x1="220" y1="121" x2="258" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="239" y="113" text-anchor="middle" font-size="8" fill="#475569">met</text>
  <line x1="460" y1="121" x2="498" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="479" y="113" text-anchor="middle" font-size="8" fill="#475569">met</text>
  <line x1="700" y1="121" x2="738" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="719" y="113" text-anchor="middle" font-size="8" fill="#475569">met</text>

  <!-- ===== Down arrows into the hold ===== -->
  <line x1="120" y1="210" x2="120" y2="268" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="126" y="243" font-size="8" fill="#475569">not met</text>
  <line x1="360" y1="210" x2="360" y2="268" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="366" y="243" font-size="8" fill="#475569">review finds a problem</text>
  <line x1="600" y1="210" x2="600" y2="268" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="606" y="243" font-size="8" fill="#475569">alarm (&#923;<tspan dy="2" font-size="7">n</tspan><tspan dx="3" dy="-2">&#8805; u) or tripwire</tspan></text>

  <!-- ===== Hold ===== -->
  <rect x="20" y="270" width="920" height="100" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="32" y="289" font-size="9.5" font-weight="700" fill="#0f172a">Hold: candidate routing stops</text>
  <rect x="36" y="300" width="430" height="56" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="251" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Stop new candidate admission</text>
  <text x="251" y="340" text-anchor="middle" font-size="8.5" fill="#475569">record the hold and confirm enforcement at admission boundaries</text>
  <rect x="494" y="300" width="430" height="56" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="709" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Outstanding candidate work</text>
  <text x="709" y="340" text-anchor="middle" font-size="8.5" fill="#475569">keeps its identities and owners; recovery settles effects, rollback does not undo them</text>
</svg>
