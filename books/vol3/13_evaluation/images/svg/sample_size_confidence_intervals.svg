<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 490" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="490" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: ERROR MARGIN CONTRACTION CURVES                          -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="540" height="450" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="540" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.2">PANEL A: 95% Wilson Score Error Margin (&#177;&#916;p) vs. Sample Size N</text>

    <!-- Plot Area: x from 60 to 500, y from 60 to 390 -->
    <!-- Horizontal Grid Lines & Y Ticks (0% at y=380, 25% at y=80; 12 px per 1%) -->
    <!-- y = 380 - (pct * 12) -->
    <!-- 0%: y = 380 -->
    <line x1="60" y1="380" x2="510" y2="380" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="52" y="384" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">&#177;0%</text>

    <!-- 5%: y = 320 -->
    <line x1="60" y1="320" x2="510" y2="320" stroke="#f1f5f9" stroke-width="1"/>
    <text x="52" y="324" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">&#177;5%</text>

    <!-- 10%: y = 260 -->
    <line x1="60" y1="260" x2="510" y2="260" stroke="#f1f5f9" stroke-width="1"/>
    <text x="52" y="264" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">&#177;10%</text>

    <!-- 15%: y = 200 -->
    <line x1="60" y1="200" x2="510" y2="200" stroke="#f1f5f9" stroke-width="1"/>
    <text x="52" y="204" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">&#177;15%</text>

    <!-- 20%: y = 140 -->
    <line x1="60" y1="140" x2="510" y2="140" stroke="#f1f5f9" stroke-width="1"/>
    <text x="52" y="144" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">&#177;20%</text>

    <!-- 25%: y = 80 -->
    <line x1="60" y1="80" x2="510" y2="80" stroke="#f1f5f9" stroke-width="1"/>
    <text x="52" y="84" font-size="9" text-anchor="end" fill="#64748b" font-family="'SF Mono', Consolas, monospace">&#177;25%</text>

    <!-- Vertical Grid Lines & X Ticks (N=0 at x=60, N=2500 at x=510; 0.18 px per N) -->
    <!-- x = 60 + N * 0.18 -->
    <!-- N=250: x = 105 -->
    <line x1="105" y1="80" x2="105" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="105" y="396" font-size="8.5" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">250</text>

    <!-- N=500: x = 150 -->
    <line x1="150" y1="80" x2="150" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="150" y="396" font-size="8.5" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">500</text>

    <!-- N=1000: x = 240 -->
    <line x1="240" y1="80" x2="240" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="240" y="396" font-size="8.5" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">1000</text>

    <!-- N=1500: x = 330 -->
    <line x1="330" y1="80" x2="330" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="330" y="396" font-size="8.5" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">1500</text>

    <!-- N=2000: x = 420 -->
    <line x1="420" y1="80" x2="420" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="420" y="396" font-size="8.5" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">2000</text>

    <!-- N=2500: x = 510 -->
    <line x1="510" y1="80" x2="510" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="510" y="396" font-size="8.5" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">2500</text>

    <!-- Axes Lines -->
    <line x1="60" y1="80" x2="60" y2="380" stroke="#475569" stroke-width="1.2"/>
    <line x1="60" y1="380" x2="510" y2="380" stroke="#475569" stroke-width="1.2"/>

    <!-- Axis Labels -->
    <text x="285" y="415" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Evaluation Suite Sample Size N (Independent Fixtures)</text>
    <text x="18" y="230" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 18 230)">Wilson Error Margin (&#177;&#916;p at 95% Confidence)</text>

    <!-- Canary Resolution Threshold Line at +/- 2.0% (y = 380 - 2*12 = 356) -->
    <line x1="60" y1="356" x2="510" y2="356" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="68" y="350" font-size="8" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#dc2626">Target Resolution: &#177;2.0%</text>

    <!-- Curve 1: p = 0.50 (Max Variance) -->
    <!-- Points: N=50: x=69, y=214; N=100: x=78, y=265; N=250: x=105, y=306; N=500: x=150, y=328; N=1000: x=240, y=343; N=1500: x=330, y=350; N=2000: x=420, y=354; N=2400: x=492, y=356; N=2500: x=510, y=356.5 -->
    <polyline points="69,214 78,265 105,306 150,328 200,338 240,343 285,347 330,350 375,352.5 420,354 465,355.2 492,356 510,356.5"
              fill="none" stroke="#2563eb" stroke-width="2.2"/>

    <!-- Curve 2: p = 0.20 (Hard Benchmark, e.g. SWE-bench) -->
    <!-- N=50: x=69, y=248; N=100: x=78, y=286; N=250: x=105, y=320; N=500: x=150, y=338; N=1000: x=240, y=350; N=1500: x=330, y=356; N=2000: x=420, y=359; N=2500: x=510, y=361 -->
    <polyline points="69,248 78,286 105,320 150,338 200,346 240,350 285,353.5 330,356 375,357.5 420,359 465,360.2 510,361"
              fill="none" stroke="#059669" stroke-width="2.2"/>

    <!-- Curve 3: p = 0.05 (Rare Event Regime) -->
    <!-- N=50: x=69, y=308; N=100: x=78, y=330; N=250: x=105, y=348; N=500: x=150, y=358; N=1000: x=240, y=365; N=1500: x=330, y=368; N=2000: x=420, y=370; N=2500: x=510, y=371 -->
    <polyline points="69,308 78,330 105,348 150,358 200,362.5 240,365 285,366.8 330,368 375,369.2 420,370 465,370.7 510,371.2"
              fill="none" stroke="#d97706" stroke-width="2.2"/>

    <!-- Key Callout 1: N=100, p=0.50 (x=78, y=265) -->
    <circle cx="78" cy="265" r="3.5" fill="#2563eb"/>
    <rect x="88" y="250" width="105" height="18" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="140" y="262" font-size="7.5" font-family="'SF Mono', Consolas, monospace" font-weight="600" fill="#1e40af" text-anchor="middle">N=100: &#177;9.8% span</text>

    <!-- Key Callout 2: N=2400, p=0.50 (x=492, y=356) -->
    <circle cx="492" cy="356" r="3.5" fill="#dc2626"/>
    <rect x="345" y="325" width="145" height="18" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="417" y="337" font-size="7.5" font-family="'SF Mono', Consolas, monospace" font-weight="600" fill="#991b1b" text-anchor="middle">N &#8805; 2,400 to resolve &#177;2.0%</text>

    <!-- Legend -->
    <g transform="translate(245, 52)">
      <rect x="0" y="0" width="250" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
      <line x1="12" y1="16" x2="36" y2="16" stroke="#2563eb" stroke-width="2.2"/>
      <text x="44" y="19" font-size="8.5" font-weight="600" fill="#1e293b">p = 0.50 (Maximum Variance)</text>

      <line x1="12" y1="34" x2="36" y2="34" stroke="#059669" stroke-width="2.2"/>
      <text x="44" y="37" font-size="8.5" font-weight="600" fill="#1e293b">p = 0.20 (Hard Agent Benchmark)</text>

      <line x1="12" y1="52" x2="36" y2="52" stroke="#d97706" stroke-width="2.2"/>
      <text x="44" y="55" font-size="8.5" font-weight="600" fill="#1e293b">p = 0.05 (Rare-Event Regime)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: WALD BREAKDOWN VS. WILSON REGULARIZATION                 -->
  <!-- ================================================================= -->
  <g transform="translate(590, 20)">
    <rect x="0" y="0" width="530" height="450" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="530" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.2">PANEL B: Empirical Coverage: Wald Approximation vs. Wilson Score (N = 50)</text>

    <!-- Legend Bar at Top -->
    <g transform="translate(16, 44)">
      <rect x="0" y="0" width="498" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <line x1="20" y1="12" x2="44" y2="12" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="32" cy="12" r="3" fill="#dc2626"/>
      <text x="52" y="15" font-size="8.5" font-weight="600" fill="#991b1b">Wald Normal Approx (&#177;1.96 SE)</text>

      <line x1="260" y1="12" x2="284" y2="12" stroke="#059669" stroke-width="2.5"/>
      <circle cx="272" cy="12" r="3" fill="#059669"/>
      <text x="292" y="15" font-size="8.5" font-weight="600" fill="#065f46">Wilson Score Interval</text>
    </g>

    <!-- REGIME 1: Boundary Catastrophe (X = 0 / 50) -->
    <g transform="translate(16, 78)">
      <rect x="0" y="0" width="498" height="106" rx="3" fill="#faf5ff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="498" height="22" rx="3" fill="#f3e8ff"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#581c87">Regime 1: Boundary Catastrophe (X = 0 / 50, Empirical Rate p&#770; = 0.0%)</text>

      <!-- Axis: 0% to 15% (Scale: 20 px per 1%) -->
      <g transform="translate(30, 32)">
        <!-- Axis Line -->
        <line x1="0" y1="52" x2="430" y2="52" stroke="#94a3b8" stroke-width="1"/>
        <line x1="0" y1="52" x2="0" y2="56" stroke="#94a3b8" stroke-width="1"/>
        <text x="0" y="66" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">0%</text>
        <line x1="60" y1="52" x2="60" y2="56" stroke="#94a3b8" stroke-width="1"/>
        <text x="60" y="66" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">3%</text>
        <line x1="120" y1="52" x2="120" y2="56" stroke="#94a3b8" stroke-width="1"/>
        <text x="120" y="66" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">6%</text>
        <line x1="180" y1="52" x2="180" y2="56" stroke="#94a3b8" stroke-width="1"/>
        <text x="180" y="66" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">9%</text>
        <line x1="240" y1="52" x2="240" y2="56" stroke="#94a3b8" stroke-width="1"/>
        <text x="240" y="66" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">12%</text>

        <!-- Wald Whisker: degenerate point [0, 0] -->
        <line x1="0" y1="16" x2="0" y2="16" stroke="#dc2626" stroke-width="3"/>
        <circle cx="0" cy="16" r="3.5" fill="#dc2626"/>
        <text x="12" y="19" font-size="8.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#dc2626">[0.0%, 0.0%]</text>
        <text x="110" y="19" font-size="8" fill="#991b1b">Degenerate: SE = 0 asserts false certainty of 0%</text>

        <!-- Wilson Whisker: [0.0%, 7.1%], p_mid = 3.6% (7.1% = 142 px, 3.6% = 72 px) -->
        <line x1="0" y1="36" x2="142" y2="36" stroke="#059669" stroke-width="2.2"/>
        <line x1="0" y1="32" x2="0" y2="40" stroke="#059669" stroke-width="2"/>
        <line x1="142" y1="32" x2="142" y2="40" stroke="#059669" stroke-width="2"/>
        <circle cx="72" cy="36" r="3.5" fill="#059669"/>
        <text x="152" y="39" font-size="8.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#059669">[0.0%, 7.1%]</text>
        <text x="245" y="39" font-size="8" fill="#065f46">Regularized: true performance ceiling is 7.1%</text>
      </g>
    </g>

    <!-- REGIME 2: Negative Probability Trap (X = 2 / 50) -->
    <g transform="translate(16, 194)">
      <rect x="0" y="0" width="498" height="114" rx="3" fill="#fef9f3" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="498" height="22" rx="3" fill="#fef3c7"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#92400e">Regime 2: Negative Probability Trap (X = 2 / 50, Empirical Rate p&#770; = 4.0%)</text>

      <!-- Axis: -3% to 15% (Scale: 18 px per 1%, 0% at x=54) -->
      <g transform="translate(30, 32)">
        <line x1="0" y1="60" x2="430" y2="60" stroke="#94a3b8" stroke-width="1"/>
        <!-- -3%: x=0 -->
        <line x1="0" y1="60" x2="0" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="0" y="74" font-size="8" text-anchor="middle" fill="#dc2626" font-family="'SF Mono', Consolas, monospace">-3%</text>
        <!-- 0%: x=54 -->
        <line x1="54" y1="60" x2="54" y2="64" stroke="#475569" stroke-width="1.5"/>
        <text x="54" y="74" font-size="8" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">0%</text>
        <!-- 5%: x=144 -->
        <line x1="144" y1="60" x2="144" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="144" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">5%</text>
        <!-- 10%: x=234 -->
        <line x1="234" y1="60" x2="234" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="234" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">10%</text>
        <!-- 15%: x=324 -->
        <line x1="324" y1="60" x2="324" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="324" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">15%</text>

        <!-- Zero Boundary Shading for Negative Domain -->
        <rect x="0" y="0" width="54" height="60" fill="#fee2e2" opacity="0.4"/>
        <line x1="54" y1="0" x2="54" y2="60" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>

        <!-- Wald Whisker: [-1.4%, 9.4%] (-1.4% = 54 - 25 = 29; 9.4% = 54 + 169 = 223; center = 54 + 72 = 126) -->
        <line x1="29" y1="18" x2="223" y2="18" stroke="#dc2626" stroke-width="2.2"/>
        <line x1="29" y1="14" x2="29" y2="22" stroke="#dc2626" stroke-width="2"/>
        <line x1="223" y1="14" x2="223" y2="22" stroke="#dc2626" stroke-width="2"/>
        <circle cx="126" cy="18" r="3.5" fill="#dc2626"/>
        <text x="232" y="21" font-size="8.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#dc2626">[-1.4%, 9.4%]</text>
        <text x="232" y="32" font-size="7.5" fill="#991b1b">Violates boundary: lower bound &lt; 0%</text>

        <!-- Wilson Whisker: [1.1%, 13.5%] (1.1% = 54 + 20 = 74; 13.5% = 54 + 243 = 297; center = 54 + 131 = 185) -->
        <line x1="74" y1="44" x2="297" y2="44" stroke="#059669" stroke-width="2.2"/>
        <line x1="74" y1="40" x2="74" y2="48" stroke="#059669" stroke-width="2"/>
        <line x1="297" y1="40" x2="297" y2="48" stroke="#059669" stroke-width="2"/>
        <circle cx="185" cy="44" r="3.5" fill="#059669"/>
        <text x="306" y="47" font-size="8.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#059669">[1.1%, 13.5%]</text>
        <text x="306" y="58" font-size="7.5" fill="#065f46">Asymmetric, strictly positive lower bound</text>
      </g>
    </g>

    <!-- REGIME 3: Maximum Variance (X = 25 / 50) -->
    <g transform="translate(16, 318)">
      <rect x="0" y="0" width="498" height="114" rx="3" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="498" height="22" rx="3" fill="#dcfce7"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#166534">Regime 3: Maximum Variance (X = 25 / 50, Empirical Rate p&#770; = 50.0%)</text>

      <!-- Axis: 30% to 70% (Scale: 9.5 px per 1%, 30% at x=0, 50% at x=190, 70% at x=380) -->
      <g transform="translate(30, 32)">
        <line x1="0" y1="60" x2="430" y2="60" stroke="#94a3b8" stroke-width="1"/>
        <line x1="0" y1="60" x2="0" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="0" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">30%</text>
        <line x1="95" y1="60" x2="95" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="95" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">40%</text>
        <line x1="190" y1="60" x2="190" y2="64" stroke="#475569" stroke-width="1.5"/>
        <text x="190" y="74" font-size="8" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">50%</text>
        <line x1="285" y1="60" x2="285" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="285" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">60%</text>
        <line x1="380" y1="60" x2="380" y2="64" stroke="#94a3b8" stroke-width="1"/>
        <text x="380" y="74" font-size="8" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace">70%</text>

        <!-- Wald Whisker: [36.1%, 63.9%] (36.1% = 58 px, 63.9% = 322 px, center = 190 px) -->
        <line x1="58" y1="18" x2="322" y2="18" stroke="#dc2626" stroke-width="2.2"/>
        <line x1="58" y1="14" x2="58" y2="22" stroke="#dc2626" stroke-width="2"/>
        <line x1="322" y1="14" x2="322" y2="22" stroke="#dc2626" stroke-width="2"/>
        <circle cx="190" cy="18" r="3.5" fill="#dc2626"/>
        <text x="330" y="21" font-size="8.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#dc2626">[36.1%, 63.9%]</text>
        <text x="330" y="32" font-size="7.5" fill="#991b1b">Symmetric wide uncertainty: &#177;13.9%</text>

        <!-- Wilson Whisker: [36.6%, 63.4%] (36.6% = 63 px, 63.4% = 317 px, center = 190 px) -->
        <line x1="63" y1="44" x2="317" y2="44" stroke="#059669" stroke-width="2.2"/>
        <line x1="63" y1="40" x2="63" y2="48" stroke="#059669" stroke-width="2"/>
        <line x1="317" y1="40" x2="317" y2="48" stroke="#059669" stroke-width="2"/>
        <circle cx="190" cy="44" r="3.5" fill="#059669"/>
        <text x="330" y="47" font-size="8.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#059669">[36.6%, 63.4%]</text>
        <text x="330" y="58" font-size="7.5" fill="#065f46">Nearly equal width at p = 0.5</text>
      </g>
    </g>
  </g>
</svg>