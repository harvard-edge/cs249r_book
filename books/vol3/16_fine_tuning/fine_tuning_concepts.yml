concept_map:
  schema_version: 2
  source: 16_fine_tuning.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Three homes for behavior
    - Delivered-prefix serialization
    - Loss masking
    - Loss normalization
    - Exposure bias
    - Preference training
    - Trajectory distillation
    - Adapter state and modularity
  secondary_concepts:
    - Schema augmentation
    - Closed-loop release criterion
  claims:
    Three homes for behavior: Fine-tuning changes only the proposal distribution, so stable procedure can move into
      weights, deployment-varying contracts stay in context, and enforcement stays in the runtime.
    Delivered-prefix serialization: A training example reconstructs each selected response's input exactly as the
      model received it, truncations and redactions included, under a recorded tokenizer and template configuration.
    Loss masking: Loss is placed only on selected policy-response positions while prompts, refused proposals, and
      observations stay as attended context with zero loss, because a trajectory has two authors and only one is
      trained.
    Loss normalization: Token averaging and example averaging weight trajectories differently, so segmentation and
      microbatching silently re-weight the corpus unless the normalization rule is fixed.
    Exposure bias: A disagreement rate measured on reference prefixes bounds excess task cost only by min(H, H^2
      eps), while the same rate on learner states with bounded recovery cost gives a linear bound, so where imitation
      error is measured sets the horizon penalty.
    Preference training: When several admissible continuations succeed but differ in cost or risk, DPO over selected
      spans raises the preferred record's reference-relative score against the dispreferred one from an identical
      context.
    Trajectory distillation: A costly teacher configuration generates trajectories that pass the same admission
      as any demonstration, so distillation from sampled tokens is imitation rather than soft-target matching.
    Adapter state and modularity: LoRA cuts trainable parameters but parameter state falls only by the byte ratio
      of trainable to frozen state, and adapters give modularity, not isolation.
    Schema augmentation: A corpus with one static tool signature lets the policy memorize argument keys, so augmentation
      transforms the whole decision context coherently and robustness is measured on held-out schemas.
    Closed-loop release criterion: Loss values are comparable only under identical split, serialization, mask, and
      normalization, and promotion requires closed-loop task acceptance under the serving configuration, not lower
      loss.
