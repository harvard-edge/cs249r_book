    concepts:
    - id: vol3.mask
      label: Loss mask
      teaches: Loss masking
      summary: A supervised objective selects demonstrated policy outputs as targets while keeping observations
        and unselected actions as conditioning context.
      section: sec-vol3-fine-tuning-loss-masking
      aliases:
      - Observation loss masking
    - id: vol3.exposure-bias
      label: Exposure bias
      teaches: Exposure bias
      summary: A policy trained on recorded reference prefixes encounters a different state distribution
        when its own actions determine future inputs.
      section: sec-vol3-fine-tuning-exposure-bias
    - id: vol3.closed-loop
      label: Closed-loop evaluation
      teaches: Closed-loop release criterion
      summary: A policy is assessed on the task outcomes produced by its own actions under a fixed contract
        and budget, independently of teacher-forced loss.
      section: sec-vol3-fine-tuning-eval-decoupling
    relationships:
    - id: vol3.field.mask.artifact
      source: vol3.mask
      predicate: selects targets within
      target: vol3.artifact
      explanation: Serialization preserves the interaction while the loss mask selects which policy outputs
        receive supervised updates.
      conditions: Observations and unselected actions can remain in conditioning context without becoming
        targets.
      status: draft
      evidence:
        section: sec-vol3-fine-tuning-loss-masking
        quote: In `serialization_v1`, the token array for the repair trajectory still contains the prompt,
          the malformed proposal `e2`, the runtime refusal, the returned schema, and the check summary `e5`
          alongside the selected responses `e3`, `e4`, and `e6`. A loader that selects every assistant token
          trains the model on the malformed proposal `e2` alongside its correction `e4`, undoing curation,
          while a loader that computes loss across all tokens trains the policy to predict environment replies.
          Serialization turns the interaction into tokens; the loss mask decides which of those tokens drive
          gradient updates.
    - id: vol3.field.exposure-bias.closed-loop
      source: vol3.exposure-bias
      predicate: motivates
      target: vol3.closed-loop
      explanation: Own-action prefixes can reach states absent from reference demonstrations, so teacher-forced
        loss misses deployment failures.
      conditions: Closed-loop testing must retain the declared environment, contract, and budget.
      status: draft
      evidence:
        section: sec-vol3-fine-tuning-exposure-bias
        quote: Suppose a repair policy trained on this corpus is placed in a fresh bounded trial and meets
          a version conflict instead of the malformed-argument rejection recorded in `trace_r19_01_redacted_v1`.
          A plausible failure is that the policy repeats its previously accepted edit without first querying
          compatible state evidence. The runtime's conditional-update guard then blocks the stale write,
          and the trial exhausts its execution allowance without completing the repair. The training corpus
          never included that state, so nothing in it taught a correction. While serialization and loss
          masking preserve the demonstrated decision problem, production deployment dictates which states
          the agent actually encounters. A policy trained only under teacher forcing never observes its
          own compounding errors during optimization. In standard text generation, an unexpected token merely
          drifts stylistic phrasing. In an autonomous agent, an errant action mutates the external environment
          and pushes the agent into states that the demonstration corpus never covered.
    - id: vol3.field.closed-loop.acceptance
      source: vol3.closed-loop
      predicate: measures deployed
      target: vol3.acceptance
      explanation: A lower token loss does not imply a higher task completion rate under an actual action
        loop.
      conditions: Offline losses are comparable only under a common tokenization, mask, normalization, and
        validation contract.
      status: draft
      evidence:
        section: sec-vol3-fine-tuning-eval-decoupling
        quote: 'Held-out token loss measures prediction accuracy under teacher forcing, where recorded prefixes
          are supplied at every step, whereas closed-loop task completion runs the policy on the context
          history its own actions create under a fixed time and token budget. Even as an offline check for
          optimization bugs, token losses from two training runs are comparable only when computed under
          an identical measurement contract: if one run uses an all-token loss and another masks observations,
          their dashboard losses average over different token sets. In notebook \ref{nbk-15-gradient-budget-and-compute-allocation},
          an unmasked causal loss averages across `{python} SelectedTargetAccounting.predicted_str` prediction
          terms (of which read-only observations make up `{python} SelectedTargetAccounting.observation_share_str`
          of the stored input), whereas the masked objective averages over the `{python} SelectedTargetAccounting.selected_response_str`
          selected response tokens. Comparing raw training losses across those two runs rewards the unmasked
          checkpoint for predicting repetitive compiler boilerplate rather than choosing better actions.
          Valid offline comparison requires recomputing held-out loss on a common validation split under
          the exact same prompt contexts, tokenizer, serialization template, target mask, and normalization
          rule, logging both the active-target count and the split version. If two checkpoints use different
          tokenizers, their per-token losses do not even share a common unit.'
    maps: []
