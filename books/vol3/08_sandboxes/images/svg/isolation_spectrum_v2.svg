<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 340" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="750" height="340" fill="#ffffff"/>

  <!-- ===== Shared-kernel container ===== -->
  <rect x="20" y="20" width="170" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="170" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="105" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Shared-kernel container</text>

  <!-- ===== User-space kernel ===== -->
  <rect x="200" y="20" width="170" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="200" y="20" width="170" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="285" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">User-space kernel</text>

  <!-- ===== MicroVM ===== -->
  <rect x="380" y="20" width="170" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="380" y="20" width="170" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="465" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">MicroVM</text>

  <!-- ===== Restricted bytecode ===== -->
  <rect x="560" y="20" width="170" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="560" y="20" width="170" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="645" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Restricted bytecode</text>
  <rect x="32" y="64" width="146" height="36" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="105" y="85" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Workload process</text>
  <path d="M 60 100 V 261" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="68" y="184" font-size="8" fill="#475569">every call, filtered</text>
  <rect x="32" y="262" width="146" height="40" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <text x="105" y="279" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Host kernel</text>
  <text x="105" y="292" text-anchor="middle" font-size="8" fill="#475569">filters, then serves</text>
  <rect x="212" y="64" width="146" height="36" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="285" y="85" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Workload process</text>
  <path d="M 240 100 V 189" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="248" y="148" font-size="8" fill="#475569">every call, trapped</text>
  <rect x="212" y="190" width="146" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="285" y="206" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">User-space kernel</text>
  <text x="285" y="219" text-anchor="middle" font-size="8" fill="#475569">emulates the call</text>
  <path d="M 240 230 V 261" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="248" y="249" font-size="8" fill="#475569">reduced host calls</text>
  <rect x="212" y="262" width="146" height="40" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <text x="285" y="279" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Host kernel</text>
  <text x="285" y="292" text-anchor="middle" font-size="8" fill="#475569">serves the emulator</text>
  <rect x="388" y="52" width="154" height="116" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="534" y="64" text-anchor="end" font-size="8" font-weight="700" fill="#b45309" font-style="italic">guest</text>
  <rect x="398" y="70" width="134" height="28" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="465" y="87" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Guest processes</text>
  <path d="M 420 98 V 129" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="428" y="117" font-size="8" fill="#475569">native system call</text>
  <rect x="398" y="130" width="134" height="28" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="465" y="147" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Guest kernel</text>
  <path d="M 420 168 V 189" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="428" y="183" font-size="8" fill="#475569">VM exit (device I/O)</text>
  <rect x="392" y="190" width="146" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="465" y="206" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Monitor and hypervisor</text>
  <text x="465" y="219" text-anchor="middle" font-size="8" fill="#475569">virtual devices</text>
  <path d="M 420 230 V 261" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="428" y="249" font-size="8" fill="#475569">host calls</text>
  <rect x="392" y="262" width="146" height="40" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <text x="465" y="279" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Host kernel</text>
  <text x="465" y="292" text-anchor="middle" font-size="8" fill="#475569">serves the monitor</text>
  <rect x="572" y="64" width="146" height="36" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="645" y="85" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Module (linear memory)</text>
  <path d="M 600 100 V 189" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="608" y="148" font-size="8" fill="#475569">imported functions only</text>
  <rect x="572" y="190" width="146" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="645" y="206" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Runtime and host imports</text>
  <text x="645" y="219" text-anchor="middle" font-size="8" fill="#475569">bounds-checked calls</text>
  <path d="M 600 230 V 261" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="608" y="249" font-size="8" fill="#475569">host calls for imports</text>
  <rect x="572" y="262" width="146" height="40" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <text x="645" y="279" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Host kernel</text>
  <text x="645" y="292" text-anchor="middle" font-size="8" fill="#475569">serves the runtime</text>
</svg>
