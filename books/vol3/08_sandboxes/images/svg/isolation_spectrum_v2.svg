<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="700" height="372" fill="#ffffff"/>

  <!-- ===== Column grounds (one per envelope) ===== -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8">
    <rect x="20" y="52" width="160" height="266" rx="4"/>
    <rect x="186" y="52" width="160" height="266" rx="4"/>
    <rect x="352" y="52" width="160" height="266" rx="4"/>
    <rect x="518" y="52" width="160" height="266" rx="4"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="100" y="38">Shared-kernel container</text>
    <text x="266" y="38">User-space kernel</text>
    <text x="432" y="38">MicroVM</text>
    <text x="598" y="38">Restricted bytecode</text>
  </g>

  <!-- ===== Trust boundary: above runs untrusted code, below are trusted layers ===== -->
  <path d="M 20 214 H 678" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="672" y="231" text-anchor="end" font-size="11" font-style="italic" fill="#475569">trust boundary</text>

  <!-- ===== Untrusted code (amber) ===== -->
  <g stroke="#d97706" stroke-width="1.2" fill="#fef3c7">
    <rect x="30" y="66" width="140" height="36" rx="3"/>
    <rect x="196" y="66" width="140" height="36" rx="3"/>
    <rect x="362" y="66" width="140" height="36" rx="3"/>
    <rect x="362" y="146" width="140" height="36" rx="3"/>
    <rect x="528" y="66" width="140" height="36" rx="3"/>
  </g>
  <rect x="357" y="60" width="150" height="126" rx="4" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <g font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">
    <text x="100" y="88">Workload process</text>
    <text x="266" y="88">Workload process</text>
    <text x="432" y="88">Guest processes</text>
    <text x="432" y="168">Guest kernel</text>
    <text x="598" y="82">Module</text>
  </g>
  <text x="598" y="96" text-anchor="middle" font-size="11" fill="#475569">linear memory</text>

  <!-- ===== Trusted mediators (purple) ===== -->
  <g stroke="#7c3aed" stroke-width="1.2" fill="#f3e8ff">
    <rect x="196" y="240" width="140" height="40" rx="3"/>
    <rect x="362" y="240" width="140" height="40" rx="3"/>
    <rect x="528" y="240" width="140" height="40" rx="3"/>
  </g>
  <g font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">
    <text x="266" y="257">User-space kernel</text>
    <text x="432" y="257">Monitor</text>
    <text x="598" y="257">Runtime</text>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="266" y="272">emulates the call</text>
    <text x="432" y="272">virtual devices</text>
    <text x="598" y="272">host imports</text>
  </g>
  <!-- container: no mediator, only a filter in front of the host kernel -->
  <rect x="26" y="252" width="28" height="8" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="62" y="260" font-size="11" fill="#475569">filter</text>

  <!-- ===== Host kernel closes every column ===== -->
  <rect x="20" y="318" width="658" height="34" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="349" y="339" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Host kernel</text>

  <!-- ===== System-call paths ===== -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M 40 102 V 250" marker-end="url(#arr-gray)"/>
    <path d="M 40 260 V 316" marker-end="url(#arr-gray)"/>
    <path d="M 206 102 V 238" marker-end="url(#arr-gray)"/>
    <path d="M 372 102 V 144" marker-end="url(#arr-gray)"/>
    <path d="M 372 182 V 238" marker-end="url(#arr-gray)"/>
    <path d="M 538 102 V 238" marker-end="url(#arr-gray)"/>
  </g>
  <g fill="none" stroke="#7c3aed" stroke-width="1.5">
    <path d="M 206 280 V 316" marker-end="url(#arr-purple)"/>
    <path d="M 372 280 V 316" marker-end="url(#arr-purple)"/>
    <path d="M 538 280 V 316" marker-end="url(#arr-purple)"/>
  </g>

  <!-- what crosses each boundary -->
  <g font-size="11" fill="#334155">
    <text x="48" y="204">every call, filtered</text>
    <text x="214" y="204">every call, trapped</text>
    <text x="380" y="128">native system call</text>
    <text x="380" y="204">VM exit (device I/O)</text>
    <text x="546" y="204">imported functions only</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="214" y="302">reduced host calls</text>
    <text x="380" y="302">host calls</text>
    <text x="546" y="302">host calls for imports</text>
  </g>
</svg>
