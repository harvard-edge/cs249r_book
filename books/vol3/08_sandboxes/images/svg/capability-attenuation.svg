<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-ochre" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT: SUPERVISORY REFERENCE MONITOR & COMPLETE MEDIATION GATE        -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 20)">
    <rect width="310" height="420" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="310" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="14" y="19" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">REFERENCE MONITOR (COMPLETE MEDIATION)</text>

    <!-- Sub-box 1: Ingestion -->
    <g transform="translate(10, 38)">
      <rect width="290" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="290" height="18" rx="3" fill="#f1f5f9"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#1e293b">Tool Proposal Interception</text>
      <text x="8" y="32" font-family="monospace" font-size="7.5" fill="#334155">Proposal a = (op, target, args)</text>
      <text x="8" y="46" font-family="monospace" font-size="7.5" fill="#334155">Token C    = (R, O, P, E) + HMAC_Ksys</text>
      <text x="8" y="58" font-size="7" fill="#64748b">Intercepted before host execution environment</text>
    </g>

    <!-- Sub-box 2: Verification Predicate -->
    <g transform="translate(10, 114)">
      <rect width="290" height="114" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="290" height="18" rx="3" fill="#f1f5f9"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#1e293b">Mediation Decision Predicate</text>
      
      <g transform="translate(8, 26)">
        <text x="0" y="10" font-size="7.5" font-weight="600" fill="#0f766e">✓ Token Integrity:</text>
        <text x="95" y="10" font-family="monospace" font-size="7" fill="#334155">VerifySig(C, K_sys) == VALID</text>

        <text x="0" y="26" font-size="7.5" font-weight="600" fill="#0f766e">✓ Rights Conformance:</text>
        <text x="95" y="26" font-family="monospace" font-size="7" fill="#334155">a.op ∈ C.R</text>

        <text x="0" y="42" font-size="7.5" font-weight="600" fill="#0f766e">✓ Resource Scope:</text>
        <text x="95" y="42" font-family="monospace" font-size="7" fill="#334155">a.target ⊑ C.O</text>

        <text x="0" y="58" font-size="7.5" font-weight="600" fill="#0f766e">✓ Temporal Lease:</text>
        <text x="95" y="58" font-family="monospace" font-size="7" fill="#334155">t_now &lt; C.E (Monotonic Clock)</text>

        <text x="0" y="74" font-size="7.5" font-weight="600" fill="#0f766e">✓ Quota Bound:</text>
        <text x="95" y="74" font-family="monospace" font-size="7" fill="#334155">Cost(a) ≤ C.P</text>
      </g>
    </g>

    <!-- Sub-box 3: Enforcement Verdicts -->
    <g transform="translate(10, 238)">
      <rect width="290" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="290" height="18" rx="3" fill="#f1f5f9"/>
      <text x="8" y="13" font-size="8" font-weight="700" fill="#1e293b">Enforcement Dispatch</text>

      <g transform="translate(8, 26)">
        <rect width="132" height="38" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="66" y="14" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">APPROVE</text>
        <text x="66" y="26" font-size="6.8" fill="#15803d" text-anchor="middle">Mint restricted openat() fd</text>
        <text x="66" y="34" font-size="6.8" fill="#15803d" text-anchor="middle">Dispatch to scoped driver</text>

        <rect x="142" width="132" height="38" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="208" y="14" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">REJECT</text>
        <text x="208" y="26" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Raise SecurityFault</text>
        <text x="208" y="34" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Drop proposal; 0 writes</text>
      </g>
    </g>

    <!-- Sub-box 4: Formal Lattice Invariant -->
    <g transform="translate(10, 322)">
      <rect width="290" height="88" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#1e293b">Monotonic Attenuation Invariant</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#0f766e">C_child ⊑ C_parent ⇔</text>
      <text x="16" y="44" font-family="monospace" font-size="7" fill="#334155">(R_c ⊆ R_p) ∧ (O_c ⊆ O_p) ∧</text>
      <text x="16" y="56" font-family="monospace" font-size="7" fill="#334155">(P_c ≤ P_p) ∧ (E_c ≤ E_p)</text>
      <rect x="6" y="64" width="278" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="145" y="76" font-size="7" font-weight="600" fill="#1e293b" text-anchor="middle">Privilege Amplification Impossible by Construction</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT: DELEGATION HIERARCHY TREE (x=350 to 936)                       -->
  <!-- ===================================================================== -->

  <!-- NODE 0: ROOT SUPERVISOR -->
  <g transform="translate(420, 20)">
    <rect width="440" height="96" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="440" height="24" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="14" y="16" font-size="9" font-weight="700" fill="#1e293b">ROOT TASK (Principal Authority)</text>
    <text x="426" y="16" font-family="monospace" font-size="7.5" font-weight="600" fill="#0f766e" text-anchor="end">Token C_0 (Root Grant)</text>

    <g transform="translate(12, 32)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#334155">Rights R_0:</text>
      <text x="75" y="12" font-family="monospace" font-size="7.5" fill="#1e293b">{ Read, Write, Exec, NetHTTP, GitCommit, CloudDeploy }</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#334155">Scope O_0:</text>
      <text x="75" y="26" font-family="monospace" font-size="7.5" fill="#1e293b">{ /* } (Full host project tree &amp; network)</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Quota P_0:</text>
      <text x="75" y="40" font-family="monospace" font-size="7.5" fill="#475569">Budget: $50.00 • 500,000 Tokens • Monotonic Clock E_0: 24h</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Signature:</text>
      <text x="75" y="54" font-family="monospace" font-size="7.5" fill="#0f766e">HMAC_SHA256(C_0, K_sys) [Minted by the runtime]</text>
    </g>
  </g>

  <!-- Branch 1: Root -> Child 1A -->
  <path d="M 530 116 V 140 H 430 V 162" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="366" y="132" width="128" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="430" y="143" font-family="monospace" font-size="7" font-weight="600" fill="#0f766e" text-anchor="middle">delegate(C_1A, $5, 30m)</text>

  <!-- Branch 2: Root -> Child 1B -->
  <path d="M 750 116 V 140 H 810 V 162" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="746" y="132" width="128" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="810" y="143" font-family="monospace" font-size="7" font-weight="600" fill="#0f766e" text-anchor="middle">delegate(C_1B, $20, 2h)</text>

  <!-- NODE 1A: CHILD SUBAGENT 1A -->
  <g transform="translate(350, 164)">
    <rect width="250" height="128" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
    <rect width="250" height="22" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f766e">SUBAGENT 1A: Research Worker</text>
    <text x="240" y="15" font-family="monospace" font-size="7" font-weight="600" fill="#0f766e" text-anchor="end">C_1A ⊏ C_0</text>

    <g transform="translate(10, 28)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#0f766e">Granted R_1A:</text>
      <text x="70" y="12" font-family="monospace" font-size="7" fill="#1e293b">{ Read, NetHTTP }</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#991b1b">Stripped:</text>
      <text x="70" y="26" font-family="monospace" font-size="7" fill="#991b1b">{ Write, Exec, Deploy }</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Scope O_1A:</text>
      <text x="70" y="40" font-family="monospace" font-size="7" fill="#334155">{ /repo/docs/*, *.pypi.org }</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Quota P_1A:</text>
      <text x="70" y="54" font-family="monospace" font-size="7" fill="#475569">Budget: $5.00 • 50k Tokens</text>

      <text x="0" y="68" font-size="7.5" font-weight="700" fill="#334155">Lease E_1A:</text>
      <text x="70" y="68" font-family="monospace" font-size="7" fill="#475569">TTL: 30 min (Hard deadline)</text>

      <rect y="78" width="230" height="16" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="115" y="89" font-size="6.8" font-weight="600" fill="#166534" text-anchor="middle">Read-Only Egress • Zero Mutation Authority</text>
    </g>
  </g>

  <!-- NODE 1B: CHILD SUBAGENT 1B -->
  <g transform="translate(620, 164)">
    <rect width="320" height="128" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
    <rect width="320" height="22" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f766e">SUBAGENT 1B: Implementation Worker</text>
    <text x="310" y="15" font-family="monospace" font-size="7" font-weight="600" fill="#0f766e" text-anchor="end">C_1B ⊏ C_0</text>

    <g transform="translate(10, 28)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#0f766e">Granted R_1B:</text>
      <text x="70" y="12" font-family="monospace" font-size="7" fill="#1e293b">{ Read, Write, Exec }</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#991b1b">Stripped:</text>
      <text x="70" y="26" font-family="monospace" font-size="7" fill="#991b1b">{ NetHTTP, GitCommit, CloudDeploy }</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Scope O_1B:</text>
      <text x="70" y="40" font-family="monospace" font-size="7" fill="#334155">{ /repo/src/* } (Scoped git branch)</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Quota P_1B:</text>
      <text x="70" y="54" font-family="monospace" font-size="7" fill="#475569">Budget: $20.00 • 200k Tokens</text>

      <text x="0" y="68" font-size="7.5" font-weight="700" fill="#334155">Lease E_1B:</text>
      <text x="70" y="68" font-family="monospace" font-size="7" fill="#475569">TTL: 2 hours (Max execution epoch)</text>

      <rect y="78" width="300" height="16" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="150" y="89" font-size="6.8" font-weight="600" fill="#166534" text-anchor="middle">Ephemeral Sandbox • Zero Network Egress</text>
    </g>
  </g>

  <!-- Branch 3: Subagent 1B -> Grandchild 2A -->
  <path d="M 780 292 V 314" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="716" y="296" width="128" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="780" y="307" font-family="monospace" font-size="7" font-weight="600" fill="#0f766e" text-anchor="middle">delegate(C_2A, $2, 5m)</text>

  <!-- NODE 2A: GRANDCHILD SUBAGENT 2A -->
  <g transform="translate(620, 318)">
    <rect width="320" height="122" rx="4" fill="#f8fafc" stroke="#92400e" stroke-width="1.3"/>
    <rect width="320" height="22" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.3"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#92400e">SUBAGENT 2A: Ephemeral Test Runner</text>
    <text x="310" y="15" font-family="monospace" font-size="7" font-weight="600" fill="#92400e" text-anchor="end">C_2A ⊏ C_1B ⊏ C_0</text>

    <g transform="translate(10, 28)">
      <text x="0" y="12" font-size="7.5" font-weight="700" fill="#0f766e">Granted R_2A:</text>
      <text x="70" y="12" font-family="monospace" font-size="7" fill="#1e293b">{ Read, Exec(pytest) }</text>

      <text x="0" y="26" font-size="7.5" font-weight="700" fill="#991b1b">Stripped:</text>
      <text x="70" y="26" font-family="monospace" font-size="7" fill="#991b1b">{ WriteFS } (Mutation revoked during test)</text>

      <text x="0" y="40" font-size="7.5" font-weight="700" fill="#334155">Scope O_2A:</text>
      <text x="70" y="40" font-family="monospace" font-size="7" fill="#334155">{ /repo/src/*, /repo/tests/*, bin/pytest }</text>

      <text x="0" y="54" font-size="7.5" font-weight="700" fill="#334155">Quota P_2A:</text>
      <text x="70" y="54" font-family="monospace" font-size="7" fill="#475569">Budget: $2.00 • 20,000 Tokens</text>

      <text x="0" y="68" font-size="7.5" font-weight="700" fill="#334155">Lease E_2A:</text>
      <text x="70" y="68" font-family="monospace" font-size="7" fill="#475569">TTL: 5 minutes (Ephemeral lease timeout)</text>

      <rect y="76" width="300" height="16" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="150" y="87" font-size="6.8" font-weight="700" fill="#92400e" text-anchor="middle">Write Revocation Guarantees Test Idempotence</text>
    </g>
  </g>
</svg>