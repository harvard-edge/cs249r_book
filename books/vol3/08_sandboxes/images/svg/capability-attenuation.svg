<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="700" height="520" fill="#ffffff"/>

  <!-- ===== Panel A: deriving children from the edit grant ===== -->
  <rect x="20" y="20" width="660" height="246" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="660" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="34" y="38" font-size="12.5" font-weight="700" fill="#0f172a">A  Deriving a grant</text>

  <!-- column heads -->
  <g font-size="12" fill="#475569">
    <text x="260" y="70" text-anchor="middle">rights ℛ<tspan baseline-shift="sub" font-size="11">Γ</tspan></text>
    <text x="372" y="70">objects 𝒪<tspan baseline-shift="sub" font-size="11">Γ</tspan></text>
    <text x="520" y="70">expiry <tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="11">exp</tspan></text>
  </g>
  <!-- T0 reference line for the expiry bars -->
  <path d="M 520 78 V 250" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- derivation tree: trunk from the parent, branch to each child -->
  <path d="M 70 106 H 46 V 228 H 68" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M 46 172 H 68" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>

  <!-- ── Row: parent Gamma_edit ── -->
  <rect x="70" y="84" width="80" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Γ<tspan baseline-shift="sub" font-size="11">edit</tspan></text>
  <text x="110" y="119" text-anchor="middle" font-size="11" fill="#0f172a">still usable</text>
  <rect x="170" y="95" width="56" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="198" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">read</text>
  <rect x="232" y="95" width="56" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="260" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">write</text>
  <rect x="294" y="95" width="56" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="322" y="110" text-anchor="middle" font-size="11" fill="#64748b">execute</text>
  <text x="372" y="110" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">repo/</text>
  <rect x="520" y="100" width="70" height="12" rx="0" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="596" y="110" font-size="12" fill="#0f172a"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="11">0</tspan> + 300 s</text>

  <!-- ── Row: rejected child Gamma_test ── -->
  <rect x="70" y="150" width="80" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Γ<tspan baseline-shift="sub" font-size="11">test</tspan></text>
  <text x="110" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">rejected</text>
  <rect x="170" y="161" width="56" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="198" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">read</text>
  <rect x="232" y="161" width="56" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#64748b">write</text>
  <rect x="294" y="161" width="56" height="22" rx="2" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <text x="322" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">execute</text>
  <text x="372" y="176" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">repo/</text>
  <rect x="520" y="166" width="28" height="12" rx="0" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="554" y="176" font-size="12" fill="#0f172a"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="11">0</tspan> + 120 s</text>

  <!-- ── Row: valid child Gamma_scan ── -->
  <rect x="70" y="206" width="80" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Γ<tspan baseline-shift="sub" font-size="11">scan</tspan></text>
  <text x="110" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">valid</text>
  <rect x="170" y="217" width="56" height="22" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="198" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">read</text>
  <rect x="232" y="217" width="56" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#64748b">write</text>
  <rect x="294" y="217" width="56" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="322" y="232" text-anchor="middle" font-size="11" fill="#64748b">execute</text>
  <text x="372" y="232" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">repo/src/pool.py</text>
  <rect x="520" y="222" width="28" height="12" rx="0" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="554" y="232" font-size="12" fill="#0f172a"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="11">0</tspan> + 120 s</text>

  <!-- ===== Panel B: chained caveats ===== -->
  <rect x="20" y="284" width="660" height="216" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="284" width="660" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="34" y="302" font-size="12.5" font-weight="700" fill="#0f172a">B  Appending a caveat</text>

  <!-- holder sequence: the token passes down -->
  <g fill="none" stroke="#7c3aed" stroke-width="1.5">
    <path d="M 110 348 V 364" marker-end="url(#arr-purple)"/>
    <path d="M 110 394 V 410" marker-end="url(#arr-purple)"/>
  </g>
  <path d="M 110 440 V 456" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- role cells -->
  <rect x="70" y="320" width="80" height="28" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="110" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Issuer</text>
  <rect x="70" y="366" width="80" height="28" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="110" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Holder</text>
  <rect x="70" y="412" width="80" height="28" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="110" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Holder</text>
  <rect x="70" y="458" width="80" height="28" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="110" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Verifier</text>

  <!-- tokens drawn as growing byte strings: id | caveats | code -->
  <g font-size="11.5" font-family="Courier New, monospace" text-anchor="middle">
    <!-- root token -->
    <rect x="170" y="323" width="40" height="22" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="190" y="338" fill="#0f172a">id</text>
    <rect x="210" y="323" width="40" height="22" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="230" y="338" font-weight="700" fill="#0f172a">σ0</text>
    <!-- after c1 -->
    <rect x="170" y="369" width="40" height="22" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="190" y="384" fill="#0f172a">id</text>
    <rect x="210" y="369" width="40" height="22" rx="0" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="230" y="384" fill="#6d28d9">c1</text>
    <rect x="250" y="369" width="40" height="22" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="270" y="384" font-weight="700" fill="#0f172a">σ1</text>
    <!-- after c2 -->
    <rect x="170" y="415" width="40" height="22" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="190" y="430" fill="#0f172a">id</text>
    <rect x="210" y="415" width="40" height="22" rx="0" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="230" y="430" fill="#6d28d9">c1</text>
    <rect x="250" y="415" width="40" height="22" rx="0" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="270" y="430" fill="#6d28d9">c2</text>
    <rect x="290" y="415" width="40" height="22" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="310" y="430" font-weight="700" fill="#0f172a">σ2</text>
  </g>

  <!-- the keyed hash that produced each code, and the caveat it folded in -->
  <g font-size="11.5" font-family="Courier New, monospace" fill="#0f172a">
    <text x="372" y="338">σ0 = HMAC(k, id)</text>
    <text x="372" y="384">σ1 = HMAC(σ0, c1)</text>
    <text x="372" y="430">σ2 = HMAC(σ1, c2)</text>
    <text x="170" y="476">k → σ0 → σ1 → σ2</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="530" y="338">holds key <tspan font-style="italic">k</tspan></text>
    <text x="530" y="384">c1: prefix <tspan font-family="Courier New, monospace">repo/src/</tspan></text>
    <text x="530" y="430">c2: rights {read}</text>
    <text x="372" y="476">recomputes from <tspan font-style="italic">k</tspan>, checks every caveat</text>
  </g>
</svg>
