<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>

  <!-- ===== Panel A: deriving children from the edit grant ===== -->
  <rect x="20" y="20" width="440" height="290" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="440" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="32" y="36" font-size="9.5" font-weight="700" fill="#0f172a">A  Deriving a grant</text>
  <rect x="150" y="56" width="160" height="78" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="150" y="56" width="160" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="160" y="70" font-size="9" font-weight="700" fill="#6d28d9">Γ<tspan baseline-shift="sub" font-size="75%">edit</tspan> (parent)</text>
  <text x="160" y="92" font-size="8" fill="#1e293b">ℛ<tspan baseline-shift="sub" font-size="75%">Γ</tspan> = {read, write}</text>
  <text x="160" y="105" font-size="8" fill="#1e293b">𝒪<tspan baseline-shift="sub" font-size="75%">Γ</tspan> = <tspan font-family="Courier New, monospace">repo/</tspan></text>
  <text x="160" y="118" font-size="8" fill="#1e293b"><tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="75%">exp</tspan> = <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="75%">0</tspan> + 300 s</text>
  <rect x="40" y="170" width="180" height="78" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="40" y="170" width="180" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="50" y="184" font-size="9" font-weight="700" fill="#b91c1c">Γ<tspan baseline-shift="sub" font-size="75%">test</tspan></text>
  <text x="50" y="206" font-size="8" font-weight="700" fill="#b91c1c">ℛ<tspan baseline-shift="sub" font-size="75%">Γ</tspan> = {read, execute}</text>
  <text x="50" y="219" font-size="8" fill="#1e293b">𝒪<tspan baseline-shift="sub" font-size="75%">Γ</tspan> = <tspan font-family="Courier New, monospace">repo/</tspan></text>
  <text x="50" y="232" font-size="8" fill="#1e293b"><tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="75%">exp</tspan> = <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="75%">0</tspan> + 120 s</text>
  <rect x="260" y="170" width="180" height="78" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="260" y="170" width="180" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="270" y="184" font-size="9" font-weight="700" fill="#6d28d9">Γ<tspan baseline-shift="sub" font-size="75%">scan</tspan></text>
  <text x="270" y="206" font-size="8" fill="#1e293b">ℛ<tspan baseline-shift="sub" font-size="75%">Γ</tspan> = {read}</text>
  <text x="270" y="219" font-size="8" fill="#1e293b">𝒪<tspan baseline-shift="sub" font-size="75%">Γ</tspan> = <tspan font-family="Courier New, monospace">repo/src/pool.py</tspan></text>
  <text x="270" y="232" font-size="8" fill="#1e293b"><tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="75%">exp</tspan> = <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="75%">0</tspan> + 120 s</text>
  <path d="M 230 134 V 150" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M 230 150 H 130 V 168" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <path d="M 230 150 H 350 V 168" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="135" y="147" text-anchor="end" font-size="8" fill="#475569" font-style="italic">derive</text>
  <text x="355" y="147" font-size="8" fill="#475569" font-style="italic">derive</text>
  <rect x="50" y="254" width="160" height="18" rx="3" fill="#dc2626"/>
  <text x="130" y="266.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">rejected: execute not in ℛ<tspan baseline-shift="sub" font-size="75%">Γ</tspan> of Γ<tspan baseline-shift="sub" font-size="75%">edit</tspan></text>
  <rect x="270" y="254" width="160" height="18" rx="3" fill="#e2e8f0"/>
  <text x="350" y="266.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">valid: Γ<tspan baseline-shift="sub" font-size="75%">scan</tspan> within Γ<tspan baseline-shift="sub" font-size="75%">edit</tspan></text>
  <rect x="40" y="282" width="400" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="240" y="296" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Worker keeps Γ<tspan baseline-shift="sub" font-size="75%">edit</tspan>: write stays usable until it is withdrawn</text>

  <!-- ===== Panel B: chained caveats (macaroon) ===== -->
  <rect x="490" y="20" width="250" height="290" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="490" y="20" width="250" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="502" y="36" font-size="9.5" font-weight="700" fill="#0f172a">B  Appending a caveat</text>
  <rect x="510" y="56" width="170" height="44" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="518" y="72" font-size="8.5" font-weight="700" fill="#0f172a">Issuer (holds key k)</text>
  <text x="518" y="89" font-size="8.5" fill="#1e293b" font-family="Courier New, monospace">σ0 = HMAC(k, id)</text>
  <rect x="510" y="126" width="170" height="44" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="518" y="142" font-size="8.5" font-weight="700" fill="#0f172a">Holder appends c1</text>
  <text x="518" y="159" font-size="8.5" fill="#1e293b" font-family="Courier New, monospace">σ1 = HMAC(σ0, c1)</text>
  <rect x="510" y="196" width="170" height="44" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="518" y="212" font-size="8.5" font-weight="700" fill="#0f172a">Holder appends c2</text>
  <text x="518" y="229" font-size="8.5" fill="#1e293b" font-family="Courier New, monospace">σ2 = HMAC(σ1, c2)</text>
  <path d="M 595 100 V 124" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="603" y="116" font-size="8" fill="#475569" font-family="Courier New, monospace">c1: prefix repo/src/</text>
  <path d="M 595 170 V 194" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="603" y="186" font-size="8" fill="#475569" font-family="Courier New, monospace">c2: rights {read}</text>
  <path d="M 595 240 V 262" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="510" y="264" width="170" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="518" y="278" font-size="8.5" font-weight="700" fill="#0f172a">Verifier recomputes from k</text>
  <text x="518" y="291" font-size="8" fill="#475569">and checks every caveat</text>
</svg>
