<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="180" height="116" fill="#ffffff"/>
  <!-- Zero baseline -->
  <line x1="12" y1="10" x2="12" y2="92" stroke="#94a3b8" stroke-width="1"/>
  <!-- Bottom axis -->
  <line x1="12" y1="92" x2="168.0" y2="92" stroke="#cbd5e1" stroke-width="0.9"/>
  <line x1="12" y1="92" x2="12" y2="95" stroke="#94a3b8" stroke-width="0.9"/>
  <line x1="90.00" y1="92" x2="90.00" y2="95" stroke="#94a3b8" stroke-width="0.9"/>
  <line x1="168.00" y1="92" x2="168.00" y2="95" stroke="#94a3b8" stroke-width="0.9"/>
  <text x="12" y="106" text-anchor="middle" font-size="9.5" fill="#64748b">0</text>
  <text x="90.00" y="106" text-anchor="middle" font-size="9.5" fill="#64748b">40 GB</text>
  <text x="168.00" y="106" text-anchor="end" font-size="9.5" fill="#64748b">80 GB</text>

  <!-- Full copy bar (76.8 GB) -->
  <rect x="12" y="15" width="149.76" height="29" rx="1.5" fill="#006395" opacity="0.92"/>
  <text x="155.76" y="27.5" text-anchor="end" font-size="10" font-weight="600" fill="#ffffff">Full copy</text>
  <text x="155.76" y="39.5" text-anchor="end" font-size="9.5" fill="#ffffff">76.8 GB (32 workspaces)</text>

  <!-- Copy-on-write bar (1.28 GB, true linear 1/60 width) -->
  <rect x="12" y="54" width="2.50" height="29" rx="0.8" fill="#006395" opacity="0.92"/>
  <text x="20.50" y="66.5" text-anchor="start" font-size="10" font-weight="600" fill="#1e293b">Copy-on-write</text>
  <text x="20.50" y="78.5" text-anchor="start" font-size="9.5" fill="#475569">1.28 GB (60× less)</text>
</svg>
