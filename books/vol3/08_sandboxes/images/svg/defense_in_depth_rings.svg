<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="700" height="270" fill="#ffffff"/>

  <!-- ===== Column headers ===== -->
  <g text-anchor="middle">
    <text x="85" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Model proposal</text>
    <text x="85" y="57" font-size="11" font-style="italic" fill="#475569">steered by README</text>
    <text x="235" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Mediation</text>
    <text x="235" y="57" font-size="11" fill="#475569">tool admission</text>
    <text x="365" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Execution envelope</text>
    <text x="365" y="57" font-size="11" fill="#475569">filesystem policy</text>
    <text x="495" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Egress</text>
    <text x="495" y="57" font-size="11" fill="#475569">destination policy</text>
    <text x="615" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Outside the runtime</text>
    <text x="615" y="57" font-size="11" font-style="italic" fill="#475569">effect or disclosure</text>
  </g>

  <!-- ===== Boundaries as walls; a gap is a passed check ===== -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1">
    <!-- Mediation: both requests admitted -->
    <rect x="230" y="80" width="10" height="30" rx="1"/>
    <rect x="230" y="130" width="10" height="70" rx="1"/>
    <rect x="230" y="220" width="10" height="30" rx="1"/>
    <!-- Execution envelope: lane 1 blocked, lane 2 open -->
    <rect x="360" y="80" width="10" height="120" rx="1"/>
    <rect x="360" y="220" width="10" height="30" rx="1"/>
    <!-- Egress: lane 1 would be blocked, lane 2 open -->
    <rect x="490" y="80" width="10" height="120" rx="1"/>
    <rect x="490" y="220" width="10" height="30" rx="1"/>
  </g>
  <rect x="359" y="104" width="12" height="32" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <rect x="489" y="104" width="12" height="32" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- ===== Lane 1: injected run_shell ===== -->
  <rect x="20" y="94" width="130" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="85" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Injected request</text>
  <text x="85" y="134" text-anchor="middle" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">run_shell</text>
  <path d="M 150 120 H 359" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 371 120 H 489" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="246" y="137" font-size="11" fill="#475569">admitted</text>
  <text x="352" y="111" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">read denied</text>
  <text x="482" y="111" text-anchor="end" font-size="11" fill="#b91c1c">upload denied</text>
  <rect x="550" y="96" width="130" height="48" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="615" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">Diagnostics</text>
  <text x="615" y="133" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">not reached</text>

  <!-- ===== Lane 2: permitted submit_report ===== -->
  <rect x="20" y="184" width="130" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="85" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Permitted channel</text>
  <text x="85" y="224" text-anchor="middle" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">submit_report</text>
  <path d="M 150 210 H 548" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="246" y="227" font-size="11" fill="#475569">admitted</text>
  <text x="376" y="227" font-size="11" fill="#475569">read allowed</text>
  <text x="506" y="227" font-size="11" fill="#475569">sent</text>
  <rect x="550" y="186" width="130" height="48" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Approved service</text>
  <text x="615" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">disclosure</text>
</svg>
