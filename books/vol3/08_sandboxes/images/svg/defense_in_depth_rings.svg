<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="780" height="262" fill="#ffffff"/>

  <!-- ===== Column bands ===== -->
  <rect x="20" y="20" width="160" height="222" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="160" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Model proposal</text>
  <text x="100" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">steered by README text</text>
  <rect x="210" y="20" width="120" height="222" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="210" y="20" width="120" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Mediation</text>
  <text x="270" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">before dispatch</text>
  <rect x="350" y="20" width="120" height="222" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350" y="20" width="120" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="410" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Execution envelope</text>
  <text x="410" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">while code runs</text>
  <rect x="490" y="20" width="120" height="222" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="490" y="20" width="120" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="550" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Egress</text>
  <text x="550" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">outbound path</text>
  <rect x="640" y="20" width="120" height="222" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="640" y="20" width="120" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Outside the runtime</text>
  <text x="700" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">effect or disclosure</text>

  <!-- ===== Lane 1: Injected request ===== -->
  <rect x="28" y="70" width="144" height="64" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="36" y="85" font-size="8.5" font-weight="700" fill="#0369a1">Injected request</text>
  <text x="36" y="100" font-size="8.5" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">run_shell</text>
  <text x="36" y="113" font-size="8" fill="#475569">read credential file,</text>
  <text x="36" y="125" font-size="8" fill="#475569">post to endpoint</text>
  <rect x="218" y="70" width="104" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Tool admission</text>
  <rect x="226" y="102" width="88" height="18" rx="3" fill="#e2e8f0"/>
  <text x="270" y="114.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">admitted</text>
  <rect x="358" y="70" width="104" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="410" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Filesystem policy</text>
  <rect x="366" y="102" width="88" height="18" rx="3" fill="#dc2626"/>
  <text x="410" y="114.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">read denied</text>
  <rect x="498" y="70" width="104" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Destination policy</text>
  <rect x="506" y="102" width="88" height="18" rx="3" fill="#dc2626"/>
  <text x="550" y="114.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">upload denied</text>
  <rect x="648" y="70" width="104" height="64" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="700" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">Diagnostics endpoint</text>
  <rect x="656" y="102" width="88" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="700" y="114.5" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b">not reached</text>

  <!-- ===== Lane 2: Permitted channel ===== -->
  <rect x="28" y="160" width="144" height="64" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="36" y="175" font-size="8.5" font-weight="700" fill="#0369a1">Permitted channel</text>
  <text x="36" y="190" font-size="8.5" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">submit_report</text>
  <text x="36" y="203" font-size="8" fill="#475569">private source</text>
  <text x="36" y="215" font-size="8" fill="#475569">in the body</text>
  <rect x="218" y="160" width="104" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Operation grant</text>
  <rect x="226" y="192" width="88" height="18" rx="3" fill="#e2e8f0"/>
  <text x="270" y="204.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">admitted</text>
  <rect x="358" y="160" width="104" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="410" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Filesystem policy</text>
  <rect x="366" y="192" width="88" height="18" rx="3" fill="#e2e8f0"/>
  <text x="410" y="204.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">read allowed</text>
  <rect x="498" y="160" width="104" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Destination policy</text>
  <rect x="506" y="192" width="88" height="18" rx="3" fill="#e2e8f0"/>
  <text x="550" y="204.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">sent</text>
  <rect x="648" y="160" width="104" height="64" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="700" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Approved service</text>
  <rect x="656" y="192" width="88" height="18" rx="3" fill="#dc2626"/>
  <text x="700" y="204.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">disclosure</text>

  <!-- ===== Lane 1 arrows: admitted, then stopped at the envelope (egress would stop the upload too) ===== -->
  <path d="M 172 94 H 216" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 322 94 H 356" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 462 94 H 496" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>

  <!-- ===== Lane 2 arrows: every check passes, harm flows through the allowed channel ===== -->
  <path d="M 172 184 H 216" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M 322 184 H 356" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M 462 184 H 496" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M 602 184 H 646" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
