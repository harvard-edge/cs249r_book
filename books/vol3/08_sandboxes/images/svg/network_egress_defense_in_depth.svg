<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="780" height="300" fill="#ffffff"/>

  <!-- ===== Guest ===== -->
  <rect x="20" y="20" width="170" height="262" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="170" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="105" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Guest</text>
  <text x="105" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">no default route</text>

  <!-- ===== Packet filter ===== -->
  <rect x="220" y="20" width="130" height="262" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="220" y="20" width="130" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="285" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Packet filter</text>
  <text x="285" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">sees addresses and ports</text>

  <!-- ===== Mediator ===== -->
  <rect x="380" y="20" width="150" height="262" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="380" y="20" width="150" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="455" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Mediator</text>
  <text x="455" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">binds name, operation, fields</text>

  <!-- ===== Outside the guest ===== -->
  <rect x="560" y="20" width="200" height="262" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="560" y="20" width="200" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="660" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Outside the guest</text>
  <text x="660" y="49" text-anchor="middle" font-size="8" fill="#475569" font-style="italic"> </text>

  <!-- ===== Lane: Fetch approved repo via the adapter ===== -->
  <rect x="30" y="70" width="150" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="38" y="86" font-size="8.5" font-weight="700" fill="#b45309">Fetch approved repo</text>
  <text x="38" y="100" font-size="8" fill="#475569">via the adapter</text>
  <rect x="230" y="81" width="110" height="18" rx="3" fill="#e2e8f0"/>
  <text x="285" y="93.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">to adapter</text>
  <path d="M 180 90 H 228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 340 90 H 388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="390" y="81" width="130" height="18" rx="3" fill="#e2e8f0"/>
  <text x="455" y="93.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">fetch admitted</text>
  <path d="M 520 90 H 568" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="570" y="70" width="180" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="660" y="86" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Approved repository</text>
  <text x="660" y="100" text-anchor="middle" font-size="8" fill="#475569">credential added by mediator</text>

  <!-- ===== Lane: Push, or another repo via the adapter ===== -->
  <rect x="30" y="124" width="150" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="38" y="140" font-size="8.5" font-weight="700" fill="#b45309">Push, or another repo</text>
  <text x="38" y="154" font-size="8" fill="#475569">via the adapter</text>
  <rect x="230" y="135" width="110" height="18" rx="3" fill="#e2e8f0"/>
  <text x="285" y="147.5" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">to adapter</text>
  <path d="M 180 144 H 228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 340 144 H 388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="390" y="135" width="130" height="18" rx="3" fill="#dc2626"/>
  <text x="455" y="147.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">operation denied</text>

  <!-- ===== Lane: Direct socket to a literal address ===== -->
  <rect x="30" y="178" width="150" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="38" y="194" font-size="8.5" font-weight="700" fill="#b45309">Direct socket</text>
  <text x="38" y="208" font-size="8" fill="#475569">to a literal address</text>
  <rect x="230" y="189" width="110" height="18" rx="3" fill="#dc2626"/>
  <text x="285" y="201.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">dropped</text>
  <path d="M 180 198 H 228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="570" y="178" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="660" y="194" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">Metadata or other host</text>
  <text x="660" y="208" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">not reached</text>

  <!-- ===== Lane: Arbitrary name lookup from the guest ===== -->
  <rect x="30" y="232" width="150" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="38" y="248" font-size="8.5" font-weight="700" fill="#b45309">Arbitrary name lookup</text>
  <text x="38" y="262" font-size="8" fill="#475569">from the guest</text>
  <rect x="230" y="243" width="110" height="18" rx="3" fill="#dc2626"/>
  <text x="285" y="255.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">no resolver route</text>
  <path d="M 180 252 H 228" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="570" y="232" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="660" y="248" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">External DNS server</text>
  <text x="660" y="262" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">not reached</text>
</svg>
