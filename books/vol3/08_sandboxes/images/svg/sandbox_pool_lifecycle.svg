<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 700 344" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
    <marker id="arr-step" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="20" width="700" height="344" fill="#ffffff"/>

  <!-- ===== Lifecycle states ===== -->
  <rect x="20" y="40" width="110" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="75" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Trusted baseline</text>
  <text x="75" y="74" text-anchor="middle" font-size="11" fill="#475569">snapshot</text>

  <rect x="180" y="40" width="110" height="44" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="235" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Standby</text>
  <text x="235" y="74" text-anchor="middle" font-size="11" fill="#475569">clean, unassigned</text>

  <rect x="340" y="40" width="110" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="395" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Leased</text>
  <text x="395" y="74" text-anchor="middle" font-size="11" fill="#475569">one trajectory</text>

  <rect x="500" y="40" width="180" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="590" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Tainted</text>
  <text x="590" y="74" text-anchor="middle" font-size="11" fill="#475569">not ready for reuse</text>

  <g fill="none" stroke-width="1.5">
    <path d="M 130 62 H 178" stroke="#7c3aed" marker-end="url(#arr-purple)"/>
    <path d="M 290 62 H 338" stroke="#64748b" marker-end="url(#arr-gray)"/>
    <path d="M 450 62 H 498" stroke="#64748b" marker-end="url(#arr-gray)"/>
    <path d="M 590 84 V 108" stroke="#64748b" marker-end="url(#arr-gray)"/>
  </g>
  <g font-size="11" font-style="italic" fill="#475569" text-anchor="middle">
    <text x="155" y="55">restore</text>
    <text x="315" y="55">lease</text>
    <text x="475" y="55">ends</text>
  </g>

  <!-- ===== Reclaiming: the reset contract in order ===== -->
  <rect x="500" y="110" width="180" height="218" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="500" y="110" width="180" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Reclaiming</text>

  <g fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2">
    <rect x="512" y="144" width="156" height="26" rx="2"/>
    <rect x="512" y="180" width="156" height="26" rx="2"/>
    <rect x="512" y="216" width="156" height="26" rx="2"/>
    <rect x="512" y="252" width="156" height="26" rx="2"/>
  </g>
  <rect x="512" y="288" width="156" height="26" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <g font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="590" y="161">Fence authority</text>
    <text x="590" y="197">Quiesce owned work</text>
    <text x="590" y="233">Export permitted outputs</text>
    <text x="590" y="269">Discard or restore state</text>
    <text x="590" y="305">Verify reset contract</text>
  </g>
  <g fill="none" stroke="#7c3aed" stroke-width="1">
    <path d="M 590 170 V 179" marker-end="url(#arr-step)"/>
    <path d="M 590 206 V 215" marker-end="url(#arr-step)"/>
    <path d="M 590 242 V 251" marker-end="url(#arr-step)"/>
    <path d="M 590 278 V 287" marker-end="url(#arr-step)"/>
  </g>

  <!-- ===== Failure drain: any step can end in destruction ===== -->
  <g fill="none" stroke="#dc2626" stroke-width="1.2">
    <path d="M 512 157 H 476"/>
    <path d="M 512 193 H 476"/>
    <path d="M 512 229 H 476"/>
    <path d="M 512 265 H 476"/>
    <path d="M 512 301 H 476"/>
    <path d="M 476 157 V 301"/>
  </g>
  <path d="M 476 229 H 442" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="468" y="150" text-anchor="end" font-size="11" font-style="italic" fill="#b91c1c">fails</text>
  <rect x="320" y="207" width="120" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Destroyed</text>
  <text x="380" y="241" text-anchor="middle" font-size="11" fill="#475569">removed from service</text>

  <!-- ===== The only way back to standby ===== -->
  <path d="M 590 314 V 344 H 235 V 86" fill="none" stroke="#008F45" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="380" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#166534">contract checks pass</text>
</svg>
