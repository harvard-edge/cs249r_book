<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="760" height="326" fill="#ffffff"/>
  <g transform="translate(0, -24)">

  <!-- ===== Top row: provisioning and lease ===== -->
  <rect x="20" y="50" width="130" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="85" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Trusted baseline</text>
  <text x="85" y="86" text-anchor="middle" font-size="8" fill="#475569">snapshot</text>
  <rect x="200" y="50" width="140" height="50" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="270" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Standby</text>
  <text x="270" y="86" text-anchor="middle" font-size="8" fill="#475569">clean, unassigned</text>
  <rect x="390" y="50" width="140" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="460" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Leased</text>
  <text x="460" y="86" text-anchor="middle" font-size="8" fill="#475569">one trajectory</text>
  <rect x="580" y="50" width="160" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="660" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Tainted</text>
  <text x="660" y="86" text-anchor="middle" font-size="8" fill="#475569">not ready for reuse</text>
  <path d="M 150 75 H 198" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="174" y="68" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">restore</text>
  <path d="M 340 75 H 388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="364" y="68" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">lease</text>
  <path d="M 530 75 H 578" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="554" y="68" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">ends</text>

  <!-- ===== Reclaiming: the reset contract in order ===== -->
  <rect x="580" y="120" width="160" height="212" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="580" y="120" width="160" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="660" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Reclaiming</text>
  <path d="M 660 100 V 118" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="594" y="154" width="132" height="24" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="660" y="169.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Fence authority</text>
  <path d="M 660 178 V 189" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="594" y="190" width="132" height="24" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="660" y="205.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Quiesce owned work</text>
  <path d="M 660 214 V 225" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="594" y="226" width="132" height="24" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="660" y="241.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Export permitted outputs</text>
  <path d="M 660 250 V 261" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="594" y="262" width="132" height="24" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="660" y="277.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Discard or restore state</text>
  <path d="M 660 286 V 297" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="594" y="298" width="132" height="24" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="660" y="313.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Verify reset contract</text>

  <!-- ===== Exits: pass returns to standby; failure removes the instance ===== -->
  <path d="M 594 310 H 270 V 102" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="430" y="304" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">contract checks pass</text>
  <rect x="390" y="200" width="140" height="50" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="460" y="223" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Destroyed</text>
  <text x="460" y="236" text-anchor="middle" font-size="8" fill="#475569">removed from service</text>
  <path d="M 580 225 H 532" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="556" y="218" text-anchor="middle" font-size="8" fill="#475569" font-style="italic">fails</text>
  </g>
</svg>
