  claims:
    Containment beneath the model: Admitting a well-typed call does not bound what the code it starts can reach,
      so the limit must be enforced below the executing process by a mechanism the code cannot modify.
    In-process restriction fails: Pruning an interpreter's globals is an interface filter, not an execution boundary,
      because reachable object references, shared native libraries, and inherited authority leave the supervisor's
      full power within reach.
    Capability grants: A capability is an unforgeable reference that designates a resource and authorizes operations
      on it, and a grant admits an access only if the reference is authentic and the operation, object, condition,
      and expiry all match.
    Attenuation and revocation: A derived grant may only narrow its parent, and chained-caveat tokens let any holder
      narrow offline but never widen, while attenuation never withdraws the parent grant it came from.
    Isolation envelopes: Shared-kernel containers, user-space kernels, microVMs, and restricted bytecode differ
      first in where a system call lands, which sets the trusted components and the per-call tax each envelope pays.
    Copy-on-write workspace: A task workspace separates immutable baseline, private modifications, scratch, and
      exportable artifacts, and copy-on-write makes provisioning cost track what the agent writes rather than what
      it can see.
    Egress control: Outbound reach is enforced on the host data path with a packet filter and an operation-aware
      mediator that cover each other's blind spots, never by guest proxy settings.
    Reset contract: A used environment may serve a new tenant only after a reset that fences authority, quiesces
      owned work, exports permitted outputs, and clears four state domains in order.
    Credential brokering: A host-side broker holds the credential outside the guest and performs only the authorized
      operation on its behalf, which removes the most valuable target from an injected environment.
    Sandbox pool sizing: Mean active leases follow N_active = lambda * T_hold over the whole trajectory, so pool
      cost is driven by memory residency over the horizon, and the standby reserve is set by the replenishment window.
    Least privilege: Each component receives only the authority its current task needs, which capabilities make
      enforceable rather than aspirational.
    Ambient authority: Authority that comes from where a program runs rather than from the request it serves is
      what an injected or buggy process inherits, and capabilities replace it with explicit grants.
    Blast radius: The set of state and principals an action can damage if it goes wrong bounds the worst-case cost
      of containment failure and sets how strong a boundary must be.
