    relationships:
    - id: vol3.field.capability.authority
      source: vol3.capability
      predicate: bounds
      target: vol3.authority
      explanation: A grant specifies concrete rights, objects, conditions, and expiry for its permitted
        effect authority.
      conditions: The abstract grant must be enforced by the actual execution environment and validated
        at dispatch.
      status: draft
      evidence:
        section: sec-vol3-sandboxes-scoped-grants
        quote: 'Use $\CapabilityGrant = (\GrantRights, \mathcal{O}_\CapabilityGrant, \GrantCondition, \GrantExpiryTime)$
          as an abstract description of a grant: rights $\GrantRights$, objects $\mathcal{O}_\CapabilityGrant$,
          condition predicate $\GrantCondition$, and expiry time $\GrantExpiryTime$. The tuple describes
          authority independent of any token encoding. Its conditions can pair different operations with
          different objects and bind use to a task or recipient, so read and write listed among the rights
          need not both apply to every listed object.'
    - id: vol3.field.isolation.capability
      source: vol3.isolation
      predicate: enforces the boundary of
      target: vol3.capability
      explanation: Containment places enforcement beneath generated code so it cannot enlarge its grant
        by changing its own instructions.
      conditions: The selected isolation mechanism and allowed host interfaces determine the residual escape
        surface.
      status: draft
      evidence:
        section: sec-vol3-sandboxes-microvms
        quote: '1. **Significance**: It makes the permitted reach of an operation a property of its execution
          environment rather than a request to the model or program.

          2. **Distinction**: A grant specifies permitted authority, whereas the envelope enforces that
          boundary against executing code. Enforcing confinement guarantees that code cannot exceed its
          assigned reach, but it does not validate whether every permitted operation aligns with the agent''s
          intended task.

          3. **Common pitfall**: Treating the high-level label of a container, virtual machine, or language
          runtime as a complete isolation policy without auditing its concrete configuration, host mounts,
          and exposed system interfaces.'
    - id: vol3.field.egress.isolation
      source: vol3.egress
      predicate: restricts channels across
      target: vol3.isolation
      explanation: Network policy must be enforced outside the untrusted guest rather than depending on
        guest cooperation.
      conditions: Allowing a destination alone does not authorize every operation or disclosure to it.
      status: draft
      evidence:
        section: sec-vol3-sandboxes-egress-enforcement
        quote: 'A complete network boundary covers direct IPv4 and IPv6 sockets, recursive DNS lookups,
          and host services reachable across local virtual bridges by combining two enforcement layers outside
          the guest. At the transport and network layer, a packet filter checks IP addresses and port numbers,
          admitting traffic only toward the designated mediator and dropping direct connections to raw IP
          literals or outside resolvers. At the application layer, the mediator inspects the protocol, service
          path, and operation. Testing this setup requires verifying that attempted bypasses, such as direct
          socket connections and unbrokered DNS queries, are dropped, not merely that cooperative HTTP clients
          work. Each layer covers the other''s blind spot (@fig-vol3-network-egress): the packet filter
          cannot distinguish a repository fetch from a push to the same IP address, while the application
          mediator never sees a raw socket connection that the packet filter has already dropped.'
