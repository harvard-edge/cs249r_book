<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#ffffff"/>

  <!-- ===== Panel frames ===== -->
  <rect x="20" y="20" width="213" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="213" height="26" rx="2" fill="#e2e8f0"/>
  <text x="126.5" y="38" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Depth</text>

  <rect x="273" y="20" width="213" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="273" y="20" width="213" height="26" rx="2" fill="#e2e8f0"/>
  <text x="379.5" y="38" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Breadth</text>

  <rect x="527" y="20" width="213" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="527" y="20" width="213" height="26" rx="2" fill="#e2e8f0"/>
  <text x="633.5" y="38" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Feedback</text>

  <!-- ===== Depth: one long serial chain ===== -->
  <rect x="46" y="60" width="120" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="106" y="77" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Input</text>
  <path d="M106,86 V102" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="56" y="104" width="100" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M106,128 V140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="56" y="142" width="100" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M106,166 V178" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="56" y="180" width="100" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M106,204 V216" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="56" y="218" width="100" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <!-- brace naming the segments -->
  <path d="M164,104 H170 V242 H164" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="176" y="170" font-size="12" fill="#475569">reasoning</text>
  <text x="176" y="185" font-size="12" fill="#475569">segments</text>
  <path d="M106,242 V254" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="46" y="256" width="120" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="106" y="273" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Candidate</text>

  <!-- ===== Breadth: independent samples, then selection ===== -->
  <rect x="292" y="60" width="120" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="352" y="77" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Input</text>
  <path d="M352,86 V94 M310,94 H394" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M310,94 V102" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M352,94 V102" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M394,94 V102" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <!-- three sample paths, no edges between them -->
  <rect x="293" y="104" width="34" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="335" y="104" width="34" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="377" y="104" width="34" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M310,128 V140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M352,128 V140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M394,128 V140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="293" y="142" width="34" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="335" y="142" width="34" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="377" y="142" width="34" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <!-- bracket naming the sampled paths (matches the Depth bracket) -->
  <path d="M419,104 H425 V166 H419" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="431" y="132" font-size="12" fill="#475569">sampled</text>
  <text x="431" y="147" font-size="12" fill="#475569">paths</text>
  <path d="M310,166 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M352,166 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M394,166 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="282" y="216" width="140" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="352" y="233" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Selector</text>
  <path d="M352,242 V254" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="292" y="256" width="120" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="352" y="273" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Candidate</text>

  <!-- ===== Feedback: the revision depends on an observation from outside the model ===== -->
  <rect x="563.5" y="60" width="140" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="633.5" y="77" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Candidate</text>
  <!-- sandbox boundary -->
  <rect x="613.5" y="102" width="106" height="110" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="711.5" y="118" font-size="12" fill="#b45309" text-anchor="end">sandbox</text>
  <path d="M646.5,86 V124" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="626.5" y="126" width="80" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="666.5" y="143" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Check</text>
  <path d="M666.5,152 V166" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <rect x="621.5" y="168" width="90" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="666.5" y="185" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Observation</text>
  <path d="M666.5,194 V254" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- the prior candidate still feeds the revision -->
  <path d="M583.5,86 V254" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="563.5" y="256" width="140" height="26" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="633.5" y="273" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Revised candidate</text>
</svg>
