<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#ffffff"/>
  <rect x="20" y="20" width="200" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Depth</text>
  <rect x="260" y="20" width="200" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="360" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Breadth</text>
  <rect x="500" y="20" width="200" height="300" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="600" y="43" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Feedback</text>
  <!-- Depth: each generated segment conditions the next. -->
  <rect x="60" y="60" width="120" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="120" y="83" text-anchor="middle" font-size="9" fill="#0f172a">Input</text>
  <rect x="60" y="120" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="120" y="143" text-anchor="middle" font-size="9" fill="#0f172a">Reasoning segment</text>
  <rect x="60" y="180" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="120" y="203" text-anchor="middle" font-size="9" fill="#0f172a">Reasoning segment</text>
  <rect x="60" y="260" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="120" y="283" text-anchor="middle" font-size="9" fill="#0f172a">Candidate</text>
  <path d="M120,100 V120" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M120,160 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M120,220 V260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- Breadth: samples share an input, not generated continuations. -->
  <rect x="300" y="60" width="120" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="360" y="83" text-anchor="middle" font-size="9" fill="#0f172a">Input</text>
  <rect x="280" y="140" width="40" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="300" y="166" text-anchor="middle" font-size="9" fill="#0f172a">Sample</text>
  <text x="300" y="180" text-anchor="middle" font-size="9" fill="#0f172a">1</text>
  <rect x="340" y="140" width="40" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="360" y="166" text-anchor="middle" font-size="9" fill="#0f172a">Sample</text>
  <text x="360" y="180" text-anchor="middle" font-size="9" fill="#0f172a">2</text>
  <rect x="400" y="140" width="40" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="420" y="166" text-anchor="middle" font-size="9" fill="#0f172a">Sample</text>
  <text x="420" y="180" text-anchor="middle" font-size="9" fill="#0f172a">3</text>
  <rect x="300" y="260" width="120" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="360" y="283" text-anchor="middle" font-size="9" fill="#0f172a">Selector</text>
  <path d="M360,100 V120 H300 V140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M360,100 V140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M360,100 V120 H420 V140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M300,200 V230 H340 V260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M360,200 V260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M420,200 V230 H380 V260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- Feedback: revision depends on an observation, not a guaranteed verdict. -->
  <rect x="540" y="60" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="600" y="83" text-anchor="middle" font-size="9" fill="#0f172a">Candidate</text>
  <rect x="540" y="120" width="120" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="600" y="143" text-anchor="middle" font-size="9" fill="#0f172a">Governed check/tool</text>
  <rect x="540" y="180" width="120" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="600" y="203" text-anchor="middle" font-size="9" fill="#0f172a">Observation</text>
  <rect x="540" y="260" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="600" y="283" text-anchor="middle" font-size="9" fill="#0f172a">Revised candidate</text>
  <path d="M600,100 V120" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M600,160 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M600,220 V260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
</svg>
