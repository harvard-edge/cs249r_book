<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Nodes generated through depth 3 (b = 5, 68% per-child rejection).
       Scale: 168 px = 155 nodes (1.0839 px per node), bars start at x = 4.
       Middle bar = a flat 68% cut of 155 (155 x 0.32 = 49.6 -> 53.8 px), the
       reference the prose compares against. -->
  <rect x="0" y="0" width="180" height="170" fill="#ffffff"/>
  <text x="4" y="14" font-size="12" fill="#333333">Nodes generated</text>
  <!-- Unpruned: 155 -->
  <rect x="4" y="24" width="168" height="34" fill="#e67817" fill-opacity="0.92"/>
  <text x="166" y="45.5" font-size="13" fill="#ffffff" text-anchor="end">Unpruned: 155</text>
  <!-- Flat 68% cut reference: 49.6 -->
  <rect x="4.75" y="72.75" width="53.05" height="32.5" fill="#e67817" fill-opacity="0.22" stroke="#e67817" stroke-width="1.5" stroke-dasharray="4 2.5"/>
  <text x="63" y="93.5" font-size="13" fill="#333333">Flat 68% cut</text>
  <!-- Pruned: 25.8 -->
  <rect x="4" y="120" width="27.96" height="34" fill="#e67817" fill-opacity="0.92"/>
  <text x="37" y="141.5" font-size="13" fill="#333333">Pruned: 25.8</text>
  <!-- baseline -->
  <line x1="3" y1="164" x2="177" y2="164" stroke="#cccccc" stroke-width="1.5"/>
</svg>
