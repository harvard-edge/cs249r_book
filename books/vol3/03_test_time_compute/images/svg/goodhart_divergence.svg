<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .axis-title { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .tick-lbl { font-size: 10.5px; fill: #475569; }
      .legend-txt { font-size: 10.5px; font-weight: 600; fill: #1e293b; }
      .math-txt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <pattern id="hatch-red" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fca5a5" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="940" height="410" fill="#ffffff"/>

  <!-- Plot Area Background: x=80 to 900 (width 820), y=36 to 346 (height 310) -->
  <rect x="80" y="36" width="374" height="310" fill="#f0fdf4" fill-opacity="0.45"/>
  <rect x="454" y="36" width="446" height="310" fill="#fff1f2" fill-opacity="0.45"/>

  <!-- Zone boundary header labels (above the 1.0 line, in margin space y=22) -->
  <text x="267" y="24" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Benign Optimization: ΔU &gt; 0</text>
  <text x="677" y="24" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Adversarial Exploitation (Goodhart Collapse)</text>

  <!-- Horizontal Grid Lines & Y-ticks (y: 346=0.0, 284=0.2, 222=0.4, 160=0.6, 98=0.8, 36=1.0) -->
  <line x1="80" y1="346" x2="900" y2="346" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="284" x2="900" y2="284" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="222" x2="900" y2="222" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="160" x2="900" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="98"  x2="900" y2="98"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="36"  x2="900" y2="36"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="70" y="350" class="tick-lbl" text-anchor="end">0.0</text>
  <text x="70" y="288" class="tick-lbl" text-anchor="end">0.2</text>
  <text x="70" y="226" class="tick-lbl" text-anchor="end">0.4</text>
  <text x="70" y="164" class="tick-lbl" text-anchor="end">0.6</text>
  <text x="70" y="102" class="tick-lbl" text-anchor="end">0.8</text>
  <text x="70" y="40"  class="tick-lbl" text-anchor="end">1.0</text>

  <!-- Vertical Grid Lines & X-ticks -->
  <!-- N=1 (x=80), N=8 (x=304), N=32 (x=454), N=128 (x=603), N=751 (N=512), N=2048 (x=900) -->
  <line x1="304" y1="36" x2="304" y2="346" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="454" y1="36" x2="454" y2="346" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="603" y1="36" x2="603" y2="346" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="751" y1="36" x2="751" y2="346" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="80"  y="364" class="tick-lbl" text-anchor="middle">1 (Greedy)</text>
  <text x="304" y="364" class="tick-lbl" text-anchor="middle">8</text>
  <text x="454" y="364" class="tick-lbl" font-weight="700" fill="#15803d" text-anchor="middle">N* = 32</text>
  <text x="603" y="364" class="tick-lbl" text-anchor="middle">128</text>
  <text x="751" y="364" class="tick-lbl" text-anchor="middle">512</text>
  <text x="900" y="364" class="tick-lbl" text-anchor="middle">2,048</text>

  <!-- Axes Lines -->
  <line x1="80" y1="346" x2="915" y2="346" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <line x1="80" y1="346" x2="80"  y2="20"  stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>

  <!-- Axis Titles -->
  <text x="-191" y="24" class="axis-title" transform="rotate(-90)" text-anchor="middle">Normalized Utility / Score</text>
  <text x="490" y="390" class="axis-title" text-anchor="middle">Candidate Search Intensity N (Sampled Trajectories, log scale)</text>

  <!-- Hatched Area between curves beyond N*=32 (x=454) -->
  <path d="M 454 86 C 485 96, 545 132, 603 160 C 670 208, 710 244, 751 254 C 800 264, 850 298, 900 311 L 900 44 C 850 48, 800 50, 751 53 C 700 57, 650 63, 603 70 C 550 79, 500 93, 454 110 Z"
        fill="url(#hatch-red)" opacity="0.55"/>

  <!-- Curve 1: Proxy Verifier Score U_hat(tau*) (Blue Dashed) -->
  <path d="M 80 238 C 190 215, 250 190, 304 175 C 380 152, 410 126, 454 110 C 510 90, 550 76, 603 70 C 670 62, 710 55, 751 53 C 810 49, 850 46, 900 44"
        fill="none" stroke="#0284c7" stroke-width="2.8" stroke-dasharray="6,4"/>

  <!-- Curve 2: True System Utility U(tau*) (Solid Red) -->
  <path d="M 80 238 C 190 215, 250 190, 304 175 C 370 154, 415 86, 454 86 C 495 86, 555 126, 603 160 C 670 208, 710 244, 751 254 C 800 264, 850 298, 900 311"
        fill="none" stroke="#dc2626" stroke-width="3.2"/>

  <!-- Peak Point N* -->
  <circle cx="454" cy="86" r="5.5" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>

  <!-- Callout 1: Optimal Ceiling N* -->
  <g transform="translate(230, 60)">
    <rect width="186" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="12" y="17" font-size="10" font-weight="700" fill="#15803d">Optimal Frontier N* = 32</text>
    <text x="12" y="32" font-size="9" fill="#166534">Peak True Utility: U(τ*) = 84%</text>
    <path d="M 186 24 L 214 24" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-emerald)"/>
  </g>

  <!-- Legend in Lower Left -->
  <g transform="translate(98, 256)">
    <rect width="216" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="12" y1="18" x2="36" y2="18" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,3"/>
    <text x="44" y="22" class="legend-txt">Proxy Verifier Û(τ*) [Saturation]</text>
    <line x1="12" y1="36" x2="36" y2="36" stroke="#dc2626" stroke-width="2.8"/>
    <text x="44" y="40" class="legend-txt">True Utility U(τ*) [Collapse]</text>
  </g>

  <!-- Callout 2: Goodhart Divergence Gap -->
  <g transform="translate(520, 96)">
    <rect width="190" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#b91c1c">Goodhart Divergence ΔU</text>
    <text x="10" y="31" font-size="9" font-family="ui-monospace, monospace" fill="#7f1d1d">ΔU = Û(τ*) - U(τ*) &gt; 0</text>
  </g>
  <path d="M 615 136 L 615 158" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-crimson)"/>

  <!-- Callout 3: Exploit Formula Box -->
  <g transform="translate(585, 262)">
    <rect width="280" height="48" rx="4" fill="#fff1f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="12" y="19" class="math-txt" font-weight="700" fill="#991b1b">E[N_exploits] = N(1-θ)·ε_FP &gt; Nθ</text>
    <text x="12" y="36" font-size="9" fill="#7f1d1d">Adversarial distractors outnumber valid paths</text>
  </g>
</svg>
