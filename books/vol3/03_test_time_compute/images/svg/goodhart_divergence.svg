<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="tick-red-end" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="tick-red-start" markerWidth="7" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="680" height="320" fill="#ffffff"/>

  <!-- Axes -->
  <path d="M70,260 H646" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-axis)"/>
  <path d="M70,260 V24" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-axis)"/>
  <text x="358" y="290" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Candidates selected from, N (log scale)</text>
  <text x="40" y="142" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 40 142)">Score of the selected candidate</text>

  <!-- Gap between curves (light fill) -->
  <path d="M70,240 C 190,160 380,82 630,58 L630,172 C 540,152 450,128 380,124 C 300,120 180,166 70,240 Z" fill="#fee2e2" fill-opacity="0.55" stroke="none"/>

  <!-- Proxy score: keeps rising -->
  <path d="M70,240 C 190,160 380,82 630,58" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Held-out reference score: rises, then declines -->
  <path d="M70,240 C 180,166 300,120 380,124 C 450,128 540,152 630,172" fill="none" stroke="#16a34a" stroke-width="2"/>

  <!-- Gap marker -->
  <path d="M600,66 V160" fill="none" stroke="#dc2626" stroke-width="1.2" marker-start="url(#tick-red-start)" marker-end="url(#tick-red-end)"/>
  <text x="590" y="104" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="end">Scoring error</text>
  <text x="590" y="117" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="end">of the winner</text>

  <!-- Peak annotation -->
  <path d="M360,122 V196" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="360" y="210" font-size="8.5" fill="#475569" text-anchor="middle">Where the decline begins</text>
  <text x="360" y="222" font-size="8.5" fill="#475569" text-anchor="middle">depends on the task</text>

  <!-- Legend -->
  <g transform="translate(96, 36)">
    <rect width="220" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M12,16 H40" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="48" y="19" font-size="8.5" fill="#0f172a">Proxy score being maximized</text>
    <path d="M12,32 H40" stroke="#16a34a" stroke-width="2"/>
    <text x="48" y="35" font-size="8.5" fill="#0f172a">Held-out reference score</text>
  </g>
</svg>
