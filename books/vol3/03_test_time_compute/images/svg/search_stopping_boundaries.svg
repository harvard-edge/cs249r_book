<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="640" height="270" fill="#ffffff"/>

  <!-- Entry -->
  <rect x="20" y="90" width="100" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="107" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Before admitting</text>
  <text x="70" y="119" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">more work</text>
  <path d="M120,110 H136" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Decision 1: hard ceilings -->
  <polygon points="210,75 280,110 210,145 140,110" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="210" y="100" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">1</text>
  <text x="210" y="112" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Hard ceiling</text>
  <text x="210" y="123" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">reached?</text>

  <!-- Decision 2: satisficing -->
  <polygon points="380,75 450,110 380,145 310,110" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="380" y="100" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">2</text>
  <text x="380" y="112" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Acceptance</text>
  <text x="380" y="123" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">criteria met?</text>

  <!-- Decision 3: marginal rule -->
  <polygon points="550,75 620,110 550,145 480,110" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="550" y="100" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">3</text>
  <text x="550" y="112" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Gain per cost</text>
  <text x="550" y="123" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">below ε<tspan font-size="7" dy="2">stop</tspan><tspan dy="-2">?</tspan></text>

  <!-- No arrows between decisions -->
  <path d="M280,110 H306" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="293" y="103" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">No</text>
  <path d="M450,110 H476" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="463" y="103" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">No</text>

  <!-- Loop: continue within the remaining allowance -->
  <path d="M550,75 V40 H426" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="558" y="62" font-size="8.5" font-weight="700" fill="#0369a1">No</text>
  <rect x="300" y="26" width="120" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="360" y="44" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Admit next work</text>
  <path d="M300,40 H70 V86" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Yes arrows to outcomes -->
  <path d="M210,145 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="218" y="165" font-size="8.5" font-weight="700" fill="#475569">Yes</text>
  <path d="M380,145 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="388" y="165" font-size="8.5" font-weight="700" fill="#475569">Yes</text>
  <path d="M550,145 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="558" y="165" font-size="8.5" font-weight="700" fill="#475569">Yes</text>

  <!-- Outcome 1 -->
  <g transform="translate(140, 180)">
    <rect width="140" height="70" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="140" height="22" rx="3" fill="#fee2e2"/>
    <text x="70" y="15" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Stop new work</text>
    <text x="70" y="37" font-size="8" fill="#475569" text-anchor="middle">tokens, calls, depth, time</text>
    <text x="70" y="50" font-size="8" fill="#475569" text-anchor="middle">Keep acceptable candidate;</text>
    <text x="70" y="62" font-size="8" fill="#475569" text-anchor="middle">else incomplete or escalate</text>
  </g>

  <!-- Outcome 2 -->
  <g transform="translate(310, 180)">
    <rect width="140" height="70" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect width="140" height="22" rx="3" fill="#dcfce7"/>
    <text x="70" y="15" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Stop search</text>
    <text x="70" y="37" font-size="8" fill="#475569" text-anchor="middle">Return the candidate</text>
    <text x="70" y="50" font-size="8" fill="#475569" text-anchor="middle">for the acceptance</text>
    <text x="70" y="62" font-size="8" fill="#475569" text-anchor="middle">decision</text>
  </g>

  <!-- Outcome 3 -->
  <g transform="translate(480, 180)">
    <rect width="140" height="70" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="140" height="22" rx="3" fill="#e0f2fe"/>
    <text x="70" y="15" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Stop early</text>
    <text x="70" y="37" font-size="8" fill="#475569" text-anchor="middle">Further work not worth</text>
    <text x="70" y="50" font-size="8" fill="#475569" text-anchor="middle">its cost; report incomplete</text>
    <text x="70" y="62" font-size="8" fill="#475569" text-anchor="middle">or escalate</text>
  </g>
</svg>
