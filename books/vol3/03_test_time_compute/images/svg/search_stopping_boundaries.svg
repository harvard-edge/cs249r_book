<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>

  <!-- ===== Nested envelopes: outer test dominates everything inside it ===== -->
  <!-- 1: hard ceilings, the outer envelope (heaviest stroke) -->
  <rect x="22" y="22" width="466" height="296" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="36" y="44" font-size="13" font-weight="700" fill="#b91c1c">1<tspan dx="8">Within hard ceilings</tspan></text>
  <text x="36" y="62" font-size="12" fill="#475569">tokens, calls, depth, time</text>

  <!-- 2: acceptance criteria not yet met -->
  <rect x="50" y="80" width="410" height="220" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="66" y="104" font-size="13" font-weight="700" fill="#15803d">2<tspan dx="8">Acceptance criteria unmet</tspan></text>

  <!-- 3: marginal rule still favors continuing -->
  <rect x="80" y="124" width="350" height="156" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="96" y="148" font-size="13" font-weight="700" fill="#0369a1">3<tspan dx="8">Gain per cost ≥ ε</tspan><tspan font-size="12" dy="3">stop</tspan></text>

  <!-- ===== The search loop lives only in the innermost region ===== -->
  <path d="M340,218 H380 V180 H130 V218 H166" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="255" y="172" font-size="12" fill="#475569" text-anchor="middle">before admitting more work</text>
  <rect x="168" y="200" width="172" height="36" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="254" y="223" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Admit next work</text>

  <!-- ===== Exits: crossing a boundary stops search ===== -->
  <path d="M488,63 H524" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M460,163 H524" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M430,263 H524" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="528" y="30" width="210" height="66" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="528.75" y="30.75" width="208.5" height="26" rx="2" fill="#fee2e2"/>
  <text x="633" y="48" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Stop unconditionally</text>
  <text x="633" y="80" font-size="12" fill="#475569" text-anchor="middle">report incomplete or escalate</text>

  <rect x="528" y="130" width="210" height="66" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="528.75" y="130.75" width="208.5" height="26" rx="2" fill="#dcfce7"/>
  <text x="633" y="148" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Stop search</text>
  <text x="633" y="180" font-size="12" fill="#475569" text-anchor="middle">to the acceptance decision</text>

  <rect x="528" y="230" width="210" height="66" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="528.75" y="230.75" width="208.5" height="26" rx="2" fill="#e0f2fe"/>
  <text x="633" y="248" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Stop early</text>
  <text x="633" y="280" font-size="12" fill="#475569" text-anchor="middle">report incomplete or escalate</text>
</svg>
