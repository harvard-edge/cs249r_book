<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="680" height="480" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- PANEL A: a new observation removes support                    -->
  <!-- ============================================================ -->
  <g transform="translate(10, 10)">
    <rect width="660" height="220" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="660" height="24" rx="2" fill="#e2e8f0"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">A · A new observation removes support</text>

    <!-- Column 1: recorded inputs -->
    <rect x="20" y="40" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="80" y="55" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Source excerpt</text>
    <text x="80" y="67" font-size="8" fill="#475569" text-anchor="middle">recorded input</text>

    <rect x="20" y="84" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="80" y="99" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Failure observation</text>
    <text x="80" y="111" font-size="8" fill="#475569" text-anchor="middle">recorded input</text>

    <rect x="20" y="128" width="120" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="80" y="143" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Waiter-return test</text>
    <text x="80" y="155" font-size="8" fill="#475569" text-anchor="middle">new observation</text>

    <rect x="20" y="172" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="80" y="187" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">API declaration</text>
    <text x="80" y="199" font-size="8" fill="#475569" text-anchor="middle">task constraints</text>

    <!-- Column 2 -->
    <rect x="180" y="84" width="120" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="240" y="99" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Diagnosis</text>
    <text x="240" y="111" font-size="8" fill="#991b1b" text-anchor="middle">timeout too short</text>

    <rect x="180" y="172" width="120" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="240" y="187" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">API notes</text>
    <text x="240" y="199" font-size="8" fill="#475569" text-anchor="middle">support kept</text>

    <!-- Column 3 and 4: descendants of the diagnosis -->
    <rect x="340" y="84" width="120" height="34" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="400" y="99" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Patch candidate</text>
    <text x="400" y="111" font-size="8" fill="#991b1b" text-anchor="middle">needs review</text>

    <rect x="500" y="84" width="120" height="34" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="560" y="99" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Check selection</text>
    <text x="560" y="111" font-size="8" fill="#991b1b" text-anchor="middle">needs review</text>

    <!-- Edges -->
    <path d="M140,57 H160 V91 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M140,101 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M140,145 H160 V111 H176" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
    <text x="164" y="140" font-size="8" font-weight="700" fill="#b91c1c">contradicts</text>
    <path d="M160,57 H400 V80" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M300,101 H336" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
    <path d="M460,101 H496" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
    <path d="M140,189 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Reachability annotation -->
    <text x="340" y="160" font-size="8.5" font-family="Courier New, monospace" font-weight="700" fill="#b91c1c">Desc(diagnosis) = {patch, check selection}</text>
    <text x="340" y="176" font-size="8.5" fill="#475569">Artifacts outside Desc keep their support</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL B: scoped regeneration from the supported frontier      -->
  <!-- ============================================================ -->
  <g transform="translate(10, 250)">
    <rect width="660" height="220" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="660" height="24" rx="2" fill="#e2e8f0"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">B · Scoped regeneration from the supported frontier</text>

    <!-- Regenerated region -->
    <rect x="170" y="76" width="470" height="50" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="630" y="70" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="end">Regenerated</text>

    <!-- Column 1: retained inputs -->
    <rect x="20" y="40" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="80" y="55" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Source excerpt</text>
    <text x="80" y="67" font-size="8" fill="#475569" text-anchor="middle">retained</text>

    <rect x="20" y="84" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="80" y="99" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Failure observation</text>
    <text x="80" y="111" font-size="8" fill="#475569" text-anchor="middle">retained</text>

    <rect x="20" y="128" width="120" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="80" y="143" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Waiter-return test</text>
    <text x="80" y="155" font-size="8" fill="#475569" text-anchor="middle">supplied as evidence</text>

    <rect x="20" y="172" width="120" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="80" y="187" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">API declaration</text>
    <text x="80" y="199" font-size="8" fill="#475569" text-anchor="middle">retained</text>

    <!-- Column 2 -->
    <rect x="180" y="84" width="120" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="240" y="99" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Diagnosis′</text>
    <text x="240" y="111" font-size="8" fill="#0369a1" text-anchor="middle">missed notification</text>

    <rect x="180" y="172" width="120" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="240" y="187" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">API notes</text>
    <text x="240" y="199" font-size="8" fill="#475569" text-anchor="middle">retained</text>

    <!-- Column 3 and 4 -->
    <rect x="340" y="84" width="120" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="400" y="99" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Patch candidate′</text>
    <text x="400" y="111" font-size="8" fill="#0369a1" text-anchor="middle">notify on return</text>

    <rect x="500" y="84" width="120" height="34" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="560" y="99" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Check selection′</text>
    <text x="560" y="111" font-size="8" fill="#0369a1" text-anchor="middle">ordering test</text>

    <!-- Edges -->
    <path d="M140,57 H160 V91 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M140,101 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M140,145 H160 V111 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M160,57 H400 V80" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
    <path d="M300,101 H336" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M460,101 H496" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M140,189 H176" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <text x="340" y="160" font-size="8.5" fill="#475569">Replacements are still candidates</text>
    <text x="340" y="176" font-size="8.5" fill="#475569">and must pass their own checks</text>
  </g>
</svg>
