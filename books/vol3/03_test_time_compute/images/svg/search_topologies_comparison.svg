<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .pane-hdr { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .spec-key { font-size: 8.5px; font-weight: 700; fill: #475569; }
      .spec-val { font-size: 8.5px; fill: #0f172a; }
      .mono-val { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8.5px; }
      .node-txt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1020" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: Best-of-N Sampling                                      -->
  <!-- ================================================================= -->
  <g transform="translate(16, 16)">
    <rect width="232" height="396" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="232" height="28" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="116" y="18" class="pane-hdr" fill="#0369a1">Best-of-N Sampling</text>

    <!-- Topological Schematic -->
    <g transform="translate(10, 36)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Shared Prefix Header Tag -->
      <rect x="12" y="8" width="188" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="106" y="20" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Shared Prompt Prefix (Radix KV)</text>

      <!-- Root node s0 -->
      <circle cx="28" cy="90" r="11" fill="#0284c7"/>
      <text x="28" y="93" class="node-txt">s₀</text>

      <!-- Parallel Rollout Branches -->
      <!-- Branch 1 (Low) -->
      <path d="M 39,85 L 142,42" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr-slate)"/>
      <rect x="148" y="34" width="52" height="16" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="174" y="45" font-size="7.5" font-family="ui-monospace, monospace" fill="#991b1b" text-anchor="middle">r = 0.12</text>

      <!-- Branch 2 (Low) -->
      <path d="M 39,88 L 142,74" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr-slate)"/>
      <rect x="148" y="66" width="52" height="16" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="174" y="77" font-size="7.5" font-family="ui-monospace, monospace" fill="#991b1b" text-anchor="middle">r = 0.45</text>

      <!-- Branch 3 (Winner) -->
      <path d="M 39,92 L 142,106" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
      <rect x="148" y="98" width="52" height="16" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
      <text x="174" y="109" font-size="7.5" font-weight="700" font-family="ui-monospace, monospace" fill="#15803d" text-anchor="middle">r = 0.94</text>

      <!-- Branch 4 (Low) -->
      <path d="M 39,95 L 142,138" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr-slate)"/>
      <rect x="148" y="130" width="52" height="16" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="174" y="141" font-size="7.5" font-family="ui-monospace, monospace" fill="#991b1b" text-anchor="middle">r = 0.28</text>

      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#0369a1" text-anchor="middle">Terminal Argmax Selector</text>
    </g>

    <!-- Systems Specifications Card -->
    <g transform="translate(10, 214)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Systems Architecture</text>
      
      <text x="10" y="38" class="spec-key">Topology:</text>
      <text x="76" y="38" class="spec-val">Independent 1D paths</text>

      <text x="10" y="56" class="spec-key">Pruning:</text>
      <text x="76" y="56" class="spec-val">Terminal token horizon only</text>

      <text x="10" y="74" class="spec-key">Evaluation:</text>
      <text x="76" y="74" class="spec-val">Sparse terminal verifier / voting</text>

      <text x="10" y="92" class="spec-key">Serving:</text>
      <text x="76" y="92" class="spec-val">Batched parallel decodes</text>

      <text x="10" y="110" class="spec-key">Prefix Cache:</text>
      <text x="76" y="110" class="spec-val">Shared Radix cache for P</text>

      <text x="10" y="128" class="spec-key">Memory:</text>
      <text x="76" y="128" class="mono-val" fill="#0284c7">O(P + N · L)</text>

      <text x="10" y="146" class="spec-key">Bottleneck:</text>
      <text x="76" y="146" class="spec-val" fill="#dc2626">Dead-end token FLOP waste</text>

      <rect x="8" y="152" width="196" height="14" rx="2" fill="#f0f9ff"/>
      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#0369a1" text-anchor="middle">High GPU batch saturation</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: Beam Search                                             -->
  <!-- ================================================================= -->
  <g transform="translate(268, 16)">
    <rect width="232" height="396" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="232" height="28" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="116" y="18" class="pane-hdr" fill="#92400e">Beam Search</text>

    <!-- Topological Schematic -->
    <g transform="translate(10, 36)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Step Header Tags -->
      <rect x="12" y="8" width="188" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="106" y="20" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Step-Synchronized Frontier (B = 2)</text>

      <!-- Root s0 -->
      <circle cx="26" cy="90" r="10" fill="#d97706"/>
      <text x="26" y="93" class="node-txt">s₀</text>

      <!-- Step 1 Nodes (B=2 retained, 2 pruned) -->
      <circle cx="88" cy="60" r="8" fill="#d97706"/>
      <line x1="36" y1="85" x2="80" y2="64" stroke="#d97706" stroke-width="1.4"/>

      <circle cx="88" cy="80" r="5.5" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <line x1="36" y1="88" x2="82" y2="81" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,2"/>

      <circle cx="88" cy="115" r="8" fill="#d97706"/>
      <line x1="36" y1="95" x2="80" y2="112" stroke="#d97706" stroke-width="1.4"/>

      <circle cx="88" cy="135" r="5.5" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <line x1="36" y1="98" x2="82" y2="133" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Step 1 Barrier -->
      <line x1="108" y1="34" x2="108" y2="152" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Step 2 Nodes -->
      <circle cx="168" cy="46" r="9" fill="#16a34a"/>
      <text x="168" y="49" class="node-txt">★</text>
      <line x1="96" y1="58" x2="159" y2="48" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

      <circle cx="168" cy="72" r="5.5" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <line x1="96" y1="62" x2="162" y2="70" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,2"/>

      <circle cx="168" cy="108" r="8" fill="#d97706"/>
      <line x1="96" y1="114" x2="160" y2="110" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>

      <circle cx="168" cy="132" r="5.5" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <line x1="96" y1="117" x2="162" y2="130" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,2"/>

      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#92400e" text-anchor="middle">Step 1 PRM &amp; Prune Discard</text>
    </g>

    <!-- Systems Specifications Card -->
    <g transform="translate(10, 214)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Systems Architecture</text>

      <text x="10" y="38" class="spec-key">Topology:</text>
      <text x="76" y="38" class="spec-val">Synchronous width-bounded tree</text>

      <text x="10" y="56" class="spec-key">Pruning:</text>
      <text x="76" y="56" class="spec-val">Synchronous at step frontier</text>

      <text x="10" y="74" class="spec-key">Evaluation:</text>
      <text x="76" y="74" class="spec-val">Step-level PRM scoring / log-prob</text>

      <text x="10" y="92" class="spec-key">Serving:</text>
      <text x="76" y="92" class="spec-val">Lock-step barrier stalls</text>

      <text x="10" y="110" class="spec-key">Prefix Cache:</text>
      <text x="76" y="110" class="spec-val">Retains top-B branch KV</text>

      <text x="10" y="128" class="spec-key">Memory:</text>
      <text x="76" y="128" class="mono-val" fill="#d97706">O(B · L) [strictly linear]</text>

      <text x="10" y="146" class="spec-key">Bottleneck:</text>
      <text x="76" y="146" class="spec-val" fill="#dc2626">Irreversible myopic pruning</text>

      <rect x="8" y="152" width="196" height="14" rx="2" fill="#fffbeb"/>
      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#92400e" text-anchor="middle">Bounded memory; step barrier wait</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: Monte Carlo Tree Search                                 -->
  <!-- ================================================================= -->
  <g transform="translate(520, 16)">
    <rect width="232" height="396" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="232" height="28" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="116" y="18" class="pane-hdr" fill="#166534">Monte Carlo Tree Search</text>

    <!-- Topological Schematic -->
    <g transform="translate(10, 36)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Header Tag -->
      <rect x="12" y="8" width="188" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="106" y="20" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Asymmetric Tree (UCT Policy)</text>

      <!-- Root -->
      <circle cx="48" cy="56" r="10" fill="#16a34a"/>
      <text x="48" y="59" class="node-txt">s₀</text>

      <!-- Child 1 (Exploited) -->
      <circle cx="108" cy="46" r="8" fill="#16a34a"/>
      <line x1="58" y1="54" x2="100" y2="48" stroke="#16a34a" stroke-width="1.8"/>

      <!-- Child 2 (Unexplored) -->
      <circle cx="98" cy="88" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="56" y1="62" x2="92" y2="84" stroke="#94a3b8" stroke-width="1"/>

      <!-- Expanded Node -->
      <circle cx="152" cy="62" r="7" fill="#0284c7"/>
      <line x1="116" y1="49" x2="145" y2="59" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Simulation Arc -->
      <path d="M 159,62 Q 186,88 174,120" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
      <rect x="146" y="122" width="54" height="14" rx="2" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8"/>
      <text x="173" y="132" font-size="7" font-weight="600" fill="#92400e" text-anchor="middle">Rollout leaf</text>

      <!-- Backprop Arrow -->
      <path d="M 150,72 Q 106,84 55,68" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
      <text x="102" y="82" font-size="7" font-weight="700" fill="#b91c1c" text-anchor="middle">Backup Q, N</text>

      <!-- Phases Labels -->
      <text x="12" y="142" font-size="7" font-weight="700" fill="#16a34a">Selection</text>
      <text x="68" y="142" font-size="7" font-weight="700" fill="#0284c7">Expand</text>
      <text x="12" y="154" font-size="7" font-weight="700" fill="#d97706">Rollout</text>
      <text x="68" y="154" font-size="7" font-weight="700" fill="#dc2626">Backprop</text>

      <text x="150" y="162" font-size="7.5" font-weight="600" fill="#166534" text-anchor="middle">Value Guided</text>
    </g>

    <!-- Systems Specifications Card -->
    <g transform="translate(10, 214)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Systems Architecture</text>

      <text x="10" y="38" class="spec-key">Topology:</text>
      <text x="76" y="38" class="spec-val">Asymmetric exploratory tree</text>

      <text x="10" y="56" class="spec-key">Pruning:</text>
      <text x="76" y="56" class="spec-val">Adaptive UCT search allocation</text>

      <text x="10" y="74" class="spec-key">Evaluation:</text>
      <text x="76" y="74" class="spec-val">Value network + rollout sim</text>

      <text x="10" y="92" class="spec-key">Serving:</text>
      <text x="76" y="92" class="spec-val">Asynchronous tree worker</text>

      <text x="10" y="110" class="spec-key">Prefix Cache:</text>
      <text x="76" y="110" class="spec-val">Dynamic tree Radix cache</text>

      <text x="10" y="128" class="spec-key">Memory:</text>
      <text x="76" y="128" class="mono-val" fill="#16a34a">O(|Tree| · L_node)</text>

      <text x="10" y="146" class="spec-key">Bottleneck:</text>
      <text x="76" y="146" class="spec-val" fill="#dc2626">High invocation latency</text>

      <rect x="8" y="152" width="196" height="14" rx="2" fill="#f0fdf4"/>
      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#166534" text-anchor="middle">Asymptotically optimal exploration</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 4: Graph of Thoughts (GoT)                                 -->
  <!-- ================================================================= -->
  <g transform="translate(772, 16)">
    <rect width="232" height="396" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="232" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="116" y="18" class="pane-hdr" fill="#5b21b6">Graph of Thoughts (GoT)</text>

    <!-- Topological Schematic -->
    <g transform="translate(10, 36)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Header Tag -->
      <rect x="12" y="8" width="188" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="106" y="20" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">Arbitrary DAG &amp; Thought Join</text>

      <!-- Root -->
      <circle cx="26" cy="90" r="10" fill="#7c3aed"/>
      <text x="26" y="93" class="node-txt">s₀</text>

      <!-- Fork Thoughts: t1 and t2 -->
      <circle cx="74" cy="54" r="7.5" fill="#a78bfa"/>
      <line x1="36" y1="83" x2="67" y2="58" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

      <circle cx="74" cy="126" r="7.5" fill="#a78bfa"/>
      <line x1="36" y1="97" x2="67" y2="122" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

      <!-- Subsequent Thoughts -->
      <circle cx="120" cy="54" r="7.5" fill="#a78bfa"/>
      <line x1="82" y1="54" x2="112" y2="54" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

      <circle cx="120" cy="126" r="7.5" fill="#a78bfa"/>
      <line x1="82" y1="126" x2="112" y2="126" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

      <!-- Thought Merge Node -->
      <circle cx="162" cy="90" r="10" fill="#16a34a"/>
      <line x1="127" y1="60" x2="154" y2="82" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>
      <line x1="127" y1="120" x2="154" y2="98" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green)"/>

      <!-- Merge Label -->
      <rect x="142" y="108" width="40" height="14" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="162" y="118" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">Merge</text>

      <!-- Final Synthesized Thought -->
      <circle cx="196" cy="90" r="7.5" fill="#7c3aed"/>
      <line x1="172" y1="90" x2="188" y2="90" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)"/>

      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#5b21b6" text-anchor="middle">Multi-Parent Aggregation</text>
    </g>

    <!-- Systems Specifications Card -->
    <g transform="translate(10, 214)">
      <rect width="212" height="170" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Systems Architecture</text>

      <text x="10" y="38" class="spec-key">Topology:</text>
      <text x="76" y="38" class="spec-val">Directed acyclic thought graph</text>

      <text x="10" y="56" class="spec-key">Pruning:</text>
      <text x="76" y="56" class="spec-val">Relational multi-edge checks</text>

      <text x="10" y="74" class="spec-key">Evaluation:</text>
      <text x="76" y="74" class="spec-val">Cross-branch thought fusion</text>

      <text x="10" y="92" class="spec-key">Serving:</text>
      <text x="76" y="92" class="spec-val">Dynamic graph DAG scheduler</text>

      <text x="10" y="110" class="spec-key">Prefix Cache:</text>
      <text x="76" y="110" class="spec-val">Multi-parent KV concatenation</text>

      <text x="10" y="128" class="spec-key">Memory:</text>
      <text x="76" y="128" class="mono-val" fill="#7c3aed">O(|V_thoughts| · L)</text>

      <text x="10" y="146" class="spec-key">Bottleneck:</text>
      <text x="76" y="146" class="spec-val" fill="#dc2626">DAG scheduling overhead</text>

      <rect x="8" y="152" width="196" height="14" rx="2" fill="#ede9fe"/>
      <text x="106" y="162" font-size="7.5" font-weight="600" fill="#5b21b6" text-anchor="middle">Expresses thought aggregation</text>
    </g>
  </g>
</svg>