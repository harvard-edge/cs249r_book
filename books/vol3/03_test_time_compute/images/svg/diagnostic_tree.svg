<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="590" fill="#ffffff"/>

  <!-- ===== Shared starting point ===== -->
  <rect x="220" y="20" width="320" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="380" y="41" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Observed failure</text>
  <text x="380" y="59" font-size="12" fill="#475569" text-anchor="middle">request waits after a connection frees</text>

  <!-- Fork -->
  <path d="M380,70 V90 M200,90 H560" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M200,90 V128" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M560,90 V128" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="190" y="115" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Commit first</text>
  <text x="570" y="115" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Check first</text>

  <!-- ===== Row 1: hypotheses in hand ===== -->
  <!-- left: H1 carried, H2 never separated (ghosted) -->
  <rect x="40" y="130" width="320" height="70" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="60" y="143" width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="78" y="158" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">H<tspan font-size="12" dy="3">1</tspan></text>
  <text x="108" y="158" font-size="12" fill="#0f172a">timeout too short</text>
  <rect x="60" y="169" width="36" height="20" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="78" y="184" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">H<tspan font-size="12" dy="3">2</tspan></text>
  <text x="108" y="184" font-size="12" fill="#94a3b8">missed notification</text>

  <!-- right: both held -->
  <rect x="400" y="130" width="320" height="70" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="420" y="143" width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="438" y="158" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">H<tspan font-size="12" dy="3">1</tspan></text>
  <text x="468" y="158" font-size="12" fill="#0f172a">timeout too short</text>
  <rect x="420" y="169" width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="438" y="184" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">H<tspan font-size="12" dy="3">2</tspan></text>
  <text x="468" y="184" font-size="12" fill="#0f172a">missed notification</text>

  <!-- ===== Row 2 ===== -->
  <path d="M200,200 V228" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="40" y="230" width="320" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="200" y="251" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Generate on H<tspan font-size="12" dy="3">1</tspan></text>
  <text x="200" y="269" font-size="12" fill="#475569" text-anchor="middle">no new evidence</text>

  <path d="M560,200 V228" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="400" y="230" width="320" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="251" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Targeted test</text>
  <text x="560" y="269" font-size="12" fill="#475569" text-anchor="middle">waiter still blocked after return</text>

  <!-- ===== Row 3 (right only): the observation separates the hypotheses ===== -->
  <path d="M560,280 V308" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="400" y="310" width="320" height="70" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="420" y="323" width="36" height="20" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="438" y="338" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">H<tspan font-size="12" dy="3">1</tspan></text>
  <text x="468" y="338" font-size="12" fill="#94a3b8">timeout too short</text>
  <path d="M416,333 H578" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="704" y="338" font-size="12" fill="#475569" text-anchor="end">contradicted</text>
  <rect x="420" y="349" width="36" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="438" y="364" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">H<tspan font-size="12" dy="3">2</tspan></text>
  <text x="468" y="364" font-size="12" font-weight="700" fill="#0f172a">missed notification</text>

  <!-- ===== The first file edit ===== -->
  <path d="M200,280 V428" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M560,380 V428" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M20,405 H740" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="380" y="398" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">first edit</text>

  <!-- ===== Row 4: the patch ===== -->
  <rect x="40" y="430" width="320" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="200" y="451" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Timeout patch</text>
  <text x="200" y="469" font-size="12" fill="#475569" text-anchor="middle">applied unchecked</text>

  <rect x="400" y="430" width="320" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="560" y="451" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Notify on return</text>
  <text x="560" y="469" font-size="12" fill="#475569" text-anchor="middle">revised candidate from H<tspan font-size="12" dy="3">2</tspan></text>

  <!-- ===== Row 5: outcome ===== -->
  <path d="M200,480 V508" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="40" y="510" width="320" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="533" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Symptom masked</text>
  <text x="200" y="551" font-size="12" fill="#b91c1c" text-anchor="middle">notification defect remains</text>

  <path d="M560,480 V508" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="400" y="510" width="320" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="533" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Reproducer passes</text>
  <text x="560" y="551" font-size="12" fill="#475569" text-anchor="middle">acceptance still pending</text>
</svg>
