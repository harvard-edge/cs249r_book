<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#ffffff"/>

  <!-- Root: the observed failure with two candidate explanations -->
  <g transform="translate(250, 16)">
    <rect width="380" height="52" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="190" y="22" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Observed failure</text>
    <text x="190" y="39" font-size="9.5" fill="#475569" text-anchor="middle">A request waits after a connection becomes available</text>
  </g>

  <!-- Split paths -->
  <path d="M 370,68 L 370,90 L 220,90 L 220,116" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <path d="M 510,68 L 510,90 L 660,90 L 660,116" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <!-- Branch badges -->
  <rect x="135" y="80" width="170" height="22" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="220" y="95" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Commit to the first hypothesis</text>

  <rect x="575" y="80" width="170" height="22" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="660" y="95" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">Check before committing</text>

  <!-- LEFT COLUMN: one hypothesis carried forward without a check -->
  <g transform="translate(50, 120)">
    <rect width="340" height="284" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

    <g transform="translate(16, 16)">
      <rect width="308" height="62" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#0f172a">One hypothesis: H₁</text>
      <text x="12" y="37" font-size="9.5" fill="#475569">H₁: the timeout is too short</text>
      <text x="12" y="52" font-size="9" font-style="italic" fill="#b91c1c">Plausible, but no observation separates it from H₂</text>
    </g>

    <path d="M 170,78 L 170,98" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>

    <g transform="translate(16, 98)">
      <rect width="308" height="64" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#991b1b">Generation builds on H₁</text>
      <text x="12" y="37" font-size="9.5" fill="#475569">Later tokens condition on the earlier text</text>
      <text x="12" y="52" font-size="9" font-style="italic" fill="#7f1d1d">No new evidence enters the context</text>
    </g>

    <path d="M 170,162 L 170,182" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>

    <g transform="translate(16, 182)">
      <rect width="308" height="86" rx="3" fill="#fff5f5" stroke="#f87171" stroke-width="1"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#991b1b">Timeout patch, applied unchecked</text>
      <text x="12" y="36" font-size="9" font-family="Courier New, monospace" fill="#475569">patch: increase the pool timeout</text>
      <rect x="10" y="46" width="288" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="154" y="64" font-size="9.5" font-weight="600" fill="#991b1b" text-anchor="middle">Symptom masked; notification defect remains</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: hold both hypotheses until a targeted test separates them -->
  <g transform="translate(490, 120)">
    <rect width="340" height="284" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

    <g transform="translate(16, 16)">
      <rect width="308" height="62" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#0f172a">Two hypotheses held: H₁, H₂</text>
      <text x="12" y="37" font-size="9.5" fill="#475569">H₁: timeout too short · H₂: missed notification</text>
      <text x="12" y="52" font-size="9" font-style="italic" fill="#0284c7">No edit until a check separates them</text>
    </g>

    <path d="M 170,78 L 170,98" fill="none" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>

    <g transform="translate(16, 98)">
      <rect width="308" height="64" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#92400e">Targeted test (a governed action)</text>
      <text x="12" y="36" font-size="9" font-family="Courier New, monospace" fill="#475569">order: waiter blocks, connection returns</text>
      <text x="12" y="52" font-size="9" font-weight="600" fill="#b45309">Observation: waiter still blocked after return</text>
    </g>

    <path d="M 170,162 L 170,182" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-green)"/>

    <g transform="translate(16, 182)">
      <rect width="308" height="86" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#166534">Revised candidate from H₂</text>
      <text x="12" y="36" font-size="9" font-family="Courier New, monospace" fill="#475569">patch: notify a waiter on return</text>
      <rect x="10" y="46" width="288" height="28" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="154" y="64" font-size="9.5" font-weight="600" fill="#15803d" text-anchor="middle">Reproducer passes; acceptance still pending</text>
    </g>
  </g>

  <!-- Cross-link: the observation contradicts H1 -->
  <g transform="translate(390, 226)">
    <path d="M 100,12 L 8,12" fill="none" stroke="#d97706" stroke-dasharray="3,3" stroke-width="1.3" marker-end="url(#arr-amber)"/>
    <rect x="12" y="-4" width="76" height="32" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/>
    <text x="50" y="9" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">Contradicts</text>
    <text x="50" y="21" font-size="8.5" fill="#b45309" text-anchor="middle">H₁</text>
  </g>
</svg>
