<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="680" height="330" fill="#ffffff"/>

  <!-- Trigger -->
  <rect x="30" y="20" width="180" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="120" y="37" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">New evidence removes</text>
  <text x="120" y="50" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">support from an artifact</text>
  <path d="M120,60 V76" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Decision 1 -->
  <polygon points="120,80 210,115 120,150 30,115" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="120" y="112" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Dependents' needs</text>
  <text x="120" y="124" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">still met?</text>

  <!-- Decision 2 -->
  <polygon points="340,80 430,115 340,150 250,115" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="340" y="112" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Task premises</text>
  <text x="340" y="124" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">still hold?</text>

  <!-- D1 -> D2 (No) -->
  <path d="M210,115 H246" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="228" y="108" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">No</text>

  <!-- D1 -> Card 1 (Yes) -->
  <path d="M120,150 V186" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="128" y="172" font-size="8.5" font-weight="700" fill="#15803d">Yes</text>

  <!-- D2 -> Card 2 (Yes) -->
  <path d="M340,150 V186" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="348" y="172" font-size="8.5" font-weight="700" fill="#15803d">Yes</text>

  <!-- D2 -> Card 3 (No) -->
  <path d="M430,115 H560 V186" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="495" y="108" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">No</text>

  <!-- Card 1: local repair -->
  <g transform="translate(30, 190)">
    <rect width="180" height="90" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="180" height="24" rx="3" fill="#e0f2fe"/>
    <text x="90" y="16" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Local repair</text>
    <text x="90" y="44" font-size="8.5" fill="#475569" text-anchor="middle">Replace one artifact</text>
    <text x="90" y="59" font-size="8.5" fill="#475569" text-anchor="middle">Dependency graph unchanged</text>
    <text x="90" y="74" font-size="8" font-style="italic" fill="#64748b" text-anchor="middle">corrected command, same output</text>
  </g>

  <!-- Card 2: subgraph resynthesis -->
  <g transform="translate(250, 190)">
    <rect width="180" height="90" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="180" height="24" rx="3" fill="#e0f2fe"/>
    <text x="90" y="16" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Subgraph resynthesis</text>
    <text x="90" y="44" font-size="8.5" fill="#475569" text-anchor="middle">Replace artifact and descendants</text>
    <text x="90" y="59" font-size="8.5" fill="#475569" text-anchor="middle">Bridge from supported frontier</text>
    <text x="90" y="74" font-size="8" font-style="italic" fill="#64748b" text-anchor="middle">the connection-pool repair</text>
  </g>

  <!-- Card 3: stop and report -->
  <g transform="translate(470, 190)">
    <rect width="180" height="90" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="180" height="24" rx="3" fill="#fee2e2"/>
    <text x="90" y="16" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Stop deliberation</text>
    <text x="90" y="44" font-size="8.5" fill="#475569" text-anchor="middle">No revision restores support</text>
    <text x="90" y="59" font-size="8.5" fill="#475569" text-anchor="middle">Report unresolved, or</text>
    <text x="90" y="74" font-size="8.5" fill="#475569" text-anchor="middle">escalate under the contract</text>
  </g>

  <!-- Ordering axis -->
  <path d="M30,305 H646" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="30" y="320" font-size="8" fill="#64748b">less support removed</text>
  <text x="650" y="320" font-size="8" fill="#64748b" text-anchor="end">more support removed</text>
</svg>
