  claims:
    Allocation axes: Depth, breadth, and feedback can spend the same output ceiling yet differ in critical path,
      retained KV state, and bill, and only feedback adds information the prompt and weights lack.
    Budgeted deliberation: Test-time compute is a per-decision allowance that sets the attempt cost in C_eff, so
      it pays only when it raises acceptance faster than cost, and difficulty should route the budget.
    Coverage is not selection: pass@k = 1-(1-p)^k caps any selector that returns an unchanged pool member, while
      realized accuracy is set by the selector, so coverage near 98 percent can coexist with a vote that plateaus
      near half.
    Ranking is not acceptance: Voting and learned ranking both return the best failure from a defective pool, so
      only selection by a check the candidate cannot modify justifies returning a candidate instead of abstaining.
    Verifier precision: The precision of a passing verdict depends on the valid-candidate base rate and the check's
      error rates, not on pool size, so a larger pool raises both the chance of a selection and the chance of a
      false pass.
    Selection pressure: Argmax over N noisy scores selects positive error growing like sigma*sqrt(2 ln N) and crowns
      any exploit present in the pool, so check accuracy must be re-measured on selected candidates.
    Step-level evidence: Outcome checks execute a finished candidate while reward models only predict quality, and
      step checks prune failing branches early at the cost of false rejections and scorer input that grows quadratically
      without prefix reuse.
    Revisable candidate plans: Recording a candidate as a dependency graph of artifacts with evidence provenance
      lets a refuting observation invalidate exactly its descendants while retained branches keep their support.
    Search tree pruning: A step check that rejects a fraction r of b children gives an effective branching factor
      b(1-r), so a tree stays finite on its own only when r > 1-1/b and otherwise needs hard caps.
    Search ledger: A search tracks money, non-interchangeable work, wall time, and peak live state in separate accounts
      and reserves each request's maximum charge before dispatch, releasing it only on settlement.
    Stopping precedence: Before admitting more work, apply hard ceilings, then satisficing, then marginal stopping,
      and an exhausted budget returns unresolved or escalates rather than lowering the acceptance threshold.
    Deliberation operating point: A deliberation policy's operating point is chosen on the cost-acceptance-deadline
      frontier, with false acceptance, abstention, and deadline exhaustion reported separately.
