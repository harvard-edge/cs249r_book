  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.search
      label: Test-time search
      teaches: Allocation axes
      summary: A bounded deliberation policy allocates generation across depth, breadth, and feedback before
        choosing a candidate.
      section: sec-vol3-test-time-compute-computation-allocation
    - id: vol3.selection
      label: Candidate selection
      teaches: Coverage is not selection
      summary: A selection procedure chooses among generated candidates; candidate availability alone does
        not guarantee that the chosen result is valid.
      section: sec-vol3-test-time-compute-candidate-diversity
    - id: vol3.precision
      label: Verifier precision
      teaches: Verifier precision
      summary: The fraction of passing candidates that meet the stated validity specification depends on
        candidate base rates and verifier error rates.
      section: sec-vol3-test-time-compute-check-precision
    relationships:
    - id: vol3.field.search.selection
      source: vol3.search
      predicate: produces candidates for
      target: vol3.selection
      explanation: Generation determines whether useful candidates exist; selection determines which candidate
        is returned.
      conditions: Pool size alone says nothing about the reliability of the selected output.
      status: draft
      evidence:
        section: sec-vol3-test-time-compute-candidate-diversity
        quote: 'Two questions separate generation from selection: whether the pool holds at least one candidate
          that solves the task, and whether the selector can pick that candidate without accepting a broken
          one. A generator can flood the pool with proposals without making selection any easier; conversely,
          a sharper selector can raise end-to-end reliability without sampling a single extra candidate.'
    - id: vol3.field.selection.precision
      source: vol3.selection
      predicate: depends on
      target: vol3.precision
      explanation: A passing check can still select a defective candidate, depending on base rates and verifier
        errors.
      conditions: Precision refers to the stated validity specification and candidate distribution; internal
        PASS is not deployment authority.
      status: draft
      evidence:
        section: sec-vol3-test-time-compute-check-precision
        quote: 'When only 5 percent of generated patches actually fix a bug, even a test suite that falsely
          passes just 2 percent of broken patches leaves nearly a third of all passing candidates defective.
          The reliability question for any check is what share of the candidates that pass it are genuinely
          valid. Call meeting the full task specification $\text{Valid}$ and receiving a positive check
          verdict $\text{PASS}$. Let $\ValidCandidateRate = \Pr(\text{Valid})$ be the base rate of valid
          candidates in the generator''s output distribution, $\VerifierFalseAcceptanceRate = \Pr(\text{PASS}\mid\neg\text{Valid})$
          the **false acceptance rate**\index{False acceptance rate!definition}, and $\VerifierFalseRejectionRate
          = \Pr(\neg\text{PASS}\mid\text{Valid})$ the **false rejection rate**\index{False rejection rate!definition}.
          Here "acceptance" means passing the internal verifier, not authorization to ship to production.
          The valid-candidate rate $\ValidCandidateRate$ is not the test-pass probability $\AttemptPassProbability$
          used in pass@$\IndependentAttemptCount$: $\ValidCandidateRate$ is the chance of meeting the full
          task specification, whereas $\AttemptPassProbability$ is the chance of passing the stated tests.
          A perfect check makes the two coincide; an imperfect check separates them, and the precision formula
          below measures the gap.'
    - id: vol3.field.search.coverage
      source: vol3.search
      predicate: can expose gaps in
      target: vol3.coverage
      explanation: Adaptive optimization can exploit an evaluator blind spot or test-tampering path.
      conditions: Passive error-rate estimates need not remain valid after selection pressure changes the
        candidate distribution.
      status: draft
      evidence:
        section: sec-vol3-test-time-compute-selection-pressure
        quote: The more candidates a search generates and ranks against an imperfect scorer or test suite,
          the more likely the winning candidate is one that exploited a scorer blind spot or deleted a failing
          assertion rather than fixing the bug. Fixed error rates describe passive sampling from a fixed
          distribution, but adaptive search changes the candidates themselves. When a search policy steers
          generation or picks the maximum of a noisy score, it pushes candidates into regions where the
          evaluator is poorly calibrated, so the baseline rates $\ValidCandidateRate$, $\VerifierFalseAcceptanceRate$,
          and $\VerifierFalseRejectionRate$ no longer hold for the candidates that reach the end of the
          search. Optimizing against an imperfect proxy breaks down in three distinct ways [@manheim2018categorizing].
          Manheim and Garrabrant classify them as forms of Goodhart's law.[^fn-goodhart-law-origin] In *regressional*
          Goodhart, picking the highest score selects for positive measurement noise. In *extremal* Goodhart,
          correlations that hold on typical candidates break down in the tail reached by search. In *adversarial*
          Goodhart, candidate code tampers with or bypasses the test harness.
