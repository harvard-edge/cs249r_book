  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BANNER                                           -->
  <!-- ================================================================= -->
  <g transform="translate(36, 437)">
    <rect width="869" height="63" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="869" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="5" height="63" fill="#0284c7"/>
    <text x="14" y="14" font-size="8.5" font-weight="700" fill="#0369a1">THE UNIFYING MLSYS PRINCIPLE: INVARIANT CLOSURE ACROSS COMPUTING DOMAINS</text>
    <text x="14" y="36" font-size="8" fill="#334155">While computational mechanisms evolve from single-node GPU kernels to distributed clusters, software trajectory runtimes, and embodied robots,</text>
    <text x="14" y="50" font-size="8" fill="#334155">architectural invariants—resource isolation, cache locality, fail-safe verification, and state reversibility—remain the permanent foundations of machine learning engineering.</text>
