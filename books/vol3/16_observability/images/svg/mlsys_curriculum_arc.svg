        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Hardware &amp; Execution</text>
        <text x="8" y="27" font-size="7.5" fill="#334155">MicroVM Sandboxes, Wasm</text>
        <text x="8" y="40" font-size="7.5" fill="#64748b">OpenTelemetry GenAI Traces</text>
      </g>

