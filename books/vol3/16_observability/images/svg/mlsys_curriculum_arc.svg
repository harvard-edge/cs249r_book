    <text x="12" y="26" font-size="7.5" fill="#d97706">Embodied &amp; Real-Time Systems</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 40)">
      <!-- Primary Abstraction -->
      <rect x="0" y="0" width="180" height="50" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Primary Abstraction</text>
