        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Governing Physics</text>
        <text x="8" y="27" font-size="7.5" fill="#334155">Hard Real-Time Deadlines (τ)</text>
        <text x="8" y="40" font-size="7.5" fill="#64748b">Newtonian Dynamics &amp; Safety</text>
      </g>

      <!-- Fundamental Triad -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="180" height="50" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Fundamental Triad</text>
        <text x="8" y="27" font-size="7.5" fill="#334155">S · A · E Triad</text>
        <text x="8" y="40" font-size="7.5" fill="#64748b">(Sensation, Actuation, Energy)</text>
      </g>

      <!-- Hardware Focus -->
      <g transform="translate(0, 168)">
        <rect x="0" y="0" width="180" height="50" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Hardware &amp; Execution</text>
        <text x="8" y="27" font-size="7.5" fill="#334155">Edge NPUs, Neuromorphic</text>
        <text x="8" y="40" font-size="7.5" fill="#64748b">EtherCAT, CAN Bus, RTOS</text>
      </g>

      <!-- Binding Bottleneck -->
      <g transform="translate(0, 224)">
        <rect x="0" y="0" width="180" height="52" rx="1" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#991b1b">Binding Bottleneck</text>
        <text x="8" y="27" font-size="7.5" fill="#991b1b">Actuator Latency Jitter</text>
