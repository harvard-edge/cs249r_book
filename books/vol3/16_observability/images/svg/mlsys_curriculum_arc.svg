      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Primary Abstraction</text>
      <text x="8" y="27" font-size="7.5" fill="#334155">Static Compute Graph (DAG)</text>
      <text x="8" y="40" font-size="7.5" fill="#64748b">Stateless Tensor Operators</text>

      <!-- Governing Physics -->
      <g transform="translate(0, 56)">
