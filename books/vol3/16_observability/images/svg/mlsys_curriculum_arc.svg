<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="900" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE MACHINE LEARNING SYSTEMS PARADIGM ARC: INVARIANT EVOLUTION</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Architectural invariants, governing physics, and system bottlenecks across the four computing frontiers</text>

  <!-- Evolution Connector Arrows between columns -->
  <line x1="237" y1="245" x2="257" y2="245" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="460" y1="245" x2="480" y2="245" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="683" y1="245" x2="703" y2="245" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: SINGLE-NODE SYSTEMS (THE MODEL)                         -->
  <!-- ================================================================= -->
  <g transform="translate(36, 75)">
