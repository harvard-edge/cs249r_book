<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .rung-num { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 800; }
      .rung-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .rung-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono-tag { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; font-weight: 700; }
      .desc-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
      .law-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .law-body { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>

    

    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">THE AUTONOMOUS IMPROVEMENT LADDER: SYSTEMS SCAFFOLDING VS. WEIGHT ADAPTATION</text>
  </g>

  <!-- Left Sidebar: Cost & Blast Radius Axis -->
  <g transform="translate(25, 68)">
    <rect width="70" height="382" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="35" y1="360" x2="35" y2="30" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="25" y1="30" x2="35" y2="16" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="45" y1="30" x2="35" y2="16" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Rotated Axis Labels -->
    <text transform="translate(22, 210) rotate(-90)" text-anchor="middle" class="axis-label" fill="#dc2626">COMPUTE &amp; ENGINEERING COST ($ / GPU-hrs)</text>
    <text transform="translate(52, 210) rotate(-90)" text-anchor="middle" class="axis-label" fill="#475569">BLAST RADIUS &amp; IRREVERSIBILITY</text>
  </g>

  <!-- Ladder Rungs (5 horizontal tiers) -->
  <g transform="translate(105, 68)">

    <!-- RUNG 5: Trajectory Post-Training & RLVR (Highest Cost / Weights) -->
    <g transform="translate(0, 0)">
      <rect width="810" height="70" rx="7" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="70" rx="3" fill="#e11d48"/>
      <text x="24" y="25" class="rung-num" fill="#be123c">RUNG 5</text>
      <text x="85" y="24" class="rung-title" fill="#9f1239">Trajectory Post-Training &amp; RLVR (Weight Modification)</text>
      
      <!-- Badges -->
      <rect x="520" y="12" width="90" height="18" rx="4" fill="#ffe4e6"/>
      <text x="565" y="24" text-anchor="middle" class="mono-tag" fill="#be123c">COST: 10⁴ - 10⁶ $</text>
      <rect x="620" y="12" width="85" height="18" rx="4" fill="#fee2e2"/>
      <text x="662" y="24" text-anchor="middle" class="mono-tag" fill="#991b1b">WEIGHT DRIFT</text>
      <rect x="715" y="12" width="80" height="18" rx="4" fill="#f1f5f9"/>
      <text x="755" y="24" text-anchor="middle" class="mono-tag" fill="#475569">LAST RESORT</text>

      <text x="24" y="48" class="desc-text"><strong>Mechanism:</strong> SFT on curated expert trajectories, Rule-Based RL with Verifiable Rewards (RLVR / GRPO, DeepSeek-R1).</text>
      <text x="24" y="60" class="desc-text"><strong>Role:</strong> Internalize complex tool syntax, calibrate self-correction heuristics, and compress deliberative search depth into parametric policy.</text>
    </g>

    <!-- RUNG 4: Runtime Verification & Hermetic Sandboxes -->
    <g transform="translate(0, 78)">
      <rect width="810" height="70" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="70" rx="3" fill="#16a34a"/>
      <text x="24" y="25" class="rung-num" fill="#15803d">RUNG 4</text>
      <text x="85" y="24" class="rung-title" fill="#14532d">Runtime Verification &amp; Deterministic Sandboxes (Safety Core)</text>
      
      <!-- Badges -->
      <rect x="520" y="12" width="90" height="18" rx="4" fill="#dcfce7"/>
      <text x="565" y="24" text-anchor="middle" class="mono-tag" fill="#15803d">COST: 10² - 10³ $</text>
      <rect x="620" y="12" width="85" height="18" rx="4" fill="#dcfce7"/>
      <text x="662" y="24" text-anchor="middle" class="mono-tag" fill="#15803d">HERMETIC CoW</text>
      <rect x="715" y="12" width="80" height="18" rx="4" fill="#dcfce7"/>
      <text x="755" y="24" text-anchor="middle" class="mono-tag" fill="#15803d">COMPENSATE</text>

      <text x="24" y="48" class="desc-text"><strong>Mechanism:</strong> MicroVM isolation (Firecracker/Wasm), CoW filesystem snapshots, deterministic test oracles, and Sagas.</text>
      <text x="24" y="60" class="desc-text"><strong>Role:</strong> Enforce the Reversibility Boundary. Ensures faulty agent actions are contained, rewound, or compensated before mutating prod.</text>
    </g>

    <!-- RUNG 3: Tool Contracts, Schemas & MCP ABIs -->
    <g transform="translate(0, 156)">
      <rect width="810" height="70" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <rect x="0" y="0" width="8" height="70" rx="3" fill="#0284c7"/>
      <text x="24" y="25" class="rung-num" fill="#0369a1">RUNG 3</text>
      <text x="85" y="24" class="rung-title" fill="#0c4a6e">Tool ABIs, Schema Validation &amp; Capability Leases</text>
      
      <!-- Badges -->
      <rect x="520" y="12" width="90" height="18" rx="4" fill="#e0f2fe"/>
      <text x="565" y="24" text-anchor="middle" class="mono-tag" fill="#0369a1">COST: 10¹ - 10² $</text>
      <rect x="620" y="12" width="85" height="18" rx="4" fill="#e0f2fe"/>
      <text x="662" y="24" text-anchor="middle" class="mono-tag" fill="#0369a1">STRICT JSON</text>
      <rect x="715" y="12" width="80" height="18" rx="4" fill="#e0f2fe"/>
      <text x="755" y="24" text-anchor="middle" class="mono-tag" fill="#0369a1">MCP SERVER</text>

      <text x="24" y="48" class="desc-text"><strong>Mechanism:</strong> Model Context Protocol (MCP), Pydantic/JSONSchema validation, idempotent tool interfaces, and least-privilege leases.</text>
      <text x="24" y="60" class="desc-text"><strong>Role:</strong> Eliminate tool parameter hallucinations, enforce syntactic correctness, and restrict unauthorized operational blast radius.</text>
    </g>

    <!-- RUNG 2: Context Working Sets & Prefix Caching -->
    <g transform="translate(0, 234)">
      <rect width="810" height="70" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <rect x="0" y="0" width="8" height="70" rx="3" fill="#6366f1"/>
      <text x="24" y="25" class="rung-num" fill="#4338ca">RUNG 2</text>
      <text x="85" y="24" class="rung-title" fill="#312e81">Context Working Sets &amp; Radix Prefix Caching</text>
      
      <!-- Badges -->
      <rect x="520" y="12" width="90" height="18" rx="4" fill="#e0e7ff"/>
      <text x="565" y="24" text-anchor="middle" class="mono-tag" fill="#4338ca">COST: 10⁰ - 10¹ $</text>
      <rect x="620" y="12" width="85" height="18" rx="4" fill="#e0e7ff"/>
      <text x="662" y="24" text-anchor="middle" class="mono-tag" fill="#4338ca">RADIX TREE</text>
      <rect x="715" y="12" width="80" height="18" rx="4" fill="#e0e7ff"/>
      <text x="755" y="24" text-anchor="middle" class="mono-tag" fill="#4338ca">PAGED KV</text>

      <text x="24" y="48" class="desc-text"><strong>Mechanism:</strong> Semantic context compaction, sliding observation windows, dynamic tool pruning, and Radix KV-cache reuse.</text>
      <text x="24" y="60" class="desc-text"><strong>Role:</strong> Prevent context pollution and attention dilution while maximizing prefix reuse (90%+ hit rate) to slash TTFT.</text>
    </g>

    <!-- RUNG 1: Prompt & System Engineering -->
    <g transform="translate(0, 312)">
      <rect width="810" height="70" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <rect x="0" y="0" width="8" height="70" rx="3" fill="#64748b"/>
      <text x="24" y="25" class="rung-num" fill="#334155">RUNG 1</text>
      <text x="85" y="24" class="rung-title" fill="#0f172a">System Prompt Engineering &amp; Deliberative Scaffolding</text>
      
      <!-- Badges -->
      <rect x="520" y="12" width="90" height="18" rx="4" fill="#f1f5f9"/>
      <text x="565" y="24" text-anchor="middle" class="mono-tag" fill="#475569">COST: &lt; 10⁰ $</text>
      <rect x="620" y="12" width="85" height="18" rx="4" fill="#f1f5f9"/>
      <text x="662" y="24" text-anchor="middle" class="mono-tag" fill="#475569">LOCAL DIFF</text>
      <rect x="715" y="12" width="80" height="18" rx="4" fill="#f1f5f9"/>
      <text x="755" y="24" text-anchor="middle" class="mono-tag" fill="#475569">RAPID ITER</text>

      <text x="24" y="48" class="desc-text"><strong>Mechanism:</strong> Few-shot calibration, structured scratchpads (XML tags), role demarcation, and clear failure taxonomy in instructions.</text>
      <text x="24" y="60" class="desc-text"><strong>Role:</strong> Rapid hypothesis exploration; easily versioned, tested, and reverted via standard Git pull-request workflows.</text>
    </g>

  </g>

  <!-- Bottom Principle Banner -->
  <g transform="translate(25, 460)">
    <rect width="890" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="6" height="64" rx="3" fill="#16a34a"/>
    <text x="22" y="24" class="law-title">The Rung Invariant (Build Before Train):</text>
    <text x="22" y="42" class="law-body">"Never ascend to weight adaptation (Rung 5) to solve a failure that can be resolved by prompt specification (Rung 1), context management (Rung 2),</text>
    <text x="22" y="56" class="law-body">strict tool contracts (Rung 3), or runtime sandboxing and verification (Rung 4). Systems scaffolding is deterministic, auditable, and cheap; weights are expensive and drift."</text>
  </g>
</svg>
