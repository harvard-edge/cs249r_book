<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="900" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE AUTONOMOUS IMPROVEMENT LADDER: SYSTEMS SCAFFOLDING VS. WEIGHT ADAPTATION</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Hierarchy of intervention mechanisms ordered by compute cost, blast radius, and irreversibility</text>

  <!-- Left Sidebar: Cost & Blast Radius Axis -->
  <g transform="translate(35, 75)">
    <rect width="65" height="348" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="65" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="32.5" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">METRICS</text>

    <!-- Vertical Axis Lines -->
    <line x1="22" y1="334" x2="22" y2="34" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <line x1="44" y1="334" x2="44" y2="34" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Rotated Axis Labels -->
    <text transform="translate(16, 185) rotate(-90)" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626" letter-spacing="0.3">COMPUTE &amp; ENG COST ($ / GPU-hrs)</text>
    <text transform="translate(54, 185) rotate(-90)" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569" letter-spacing="0.3">BLAST RADIUS &amp; IRREVERSIBILITY</text>
  </g>

  <!-- Ladder Rungs (5 horizontal tiers) -->
  <g transform="translate(112, 75)">

    <!-- RUNG 5: Trajectory Post-Training & RLVR (Highest Cost / Weights) -->
    <g transform="translate(0, 0)">
      <rect width="793" height="62" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="0" y="0" width="793" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="62" fill="#dc2626"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#991b1b">RUNG 5</text>
      <text x="64" y="15" font-size="9" font-weight="700" fill="#0f172a">Trajectory Post-Training &amp; RLVR (Weight Modification)</text>

      <!-- Badges -->
      <g transform="translate(485, 3)">
        <rect x="0" y="0" width="95" height="16" rx="1" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
        <text x="47.5" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">COST: $10⁴ – $10⁶</text>
        <rect x="103" y="0" width="102" height="16" rx="1" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
        <text x="154" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">WEIGHT DRIFT</text>
        <rect x="213" y="0" width="90" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="258" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">LAST RESORT</text>
      </g>

      <text x="14" y="36" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> SFT on curated expert trajectories, Rule-Based RL with Verifiable Rewards (RLVR / GRPO, DeepSeek-R1).</text>
      <text x="14" y="49" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Internalize complex tool syntax, calibrate self-correction heuristics, and compress deliberative search depth into parametric policy.</text>
    </g>

    <!-- RUNG 4: Runtime Verification & Deterministic Sandboxes -->
    <g transform="translate(0, 71)">
      <rect width="793" height="62" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="793" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="62" fill="#16a34a"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#15803d">RUNG 4</text>
      <text x="64" y="15" font-size="9" font-weight="700" fill="#0f172a">Runtime Verification &amp; Deterministic Sandboxes (Safety Core)</text>

      <!-- Badges -->
      <g transform="translate(485, 3)">
        <rect x="0" y="0" width="95" height="16" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <text x="47.5" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">COST: $10² – $10³</text>
        <rect x="103" y="0" width="102" height="16" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <text x="154" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">HERMETIC CoW</text>
        <rect x="213" y="0" width="90" height="16" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <text x="258" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">COMPENSATE</text>
      </g>

      <text x="14" y="36" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> MicroVM isolation (Firecracker/Wasm), CoW filesystem snapshots, deterministic test oracles, and Sagas.</text>
      <text x="14" y="49" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Enforce the Reversibility Boundary. Ensures faulty agent actions are contained, rewound, or compensated before mutating prod.</text>
    </g>

    <!-- RUNG 3: Tool ABIs, Schema Validation & Capability Leases -->
    <g transform="translate(0, 142)">
      <rect width="793" height="62" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="793" height="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="62" fill="#0284c7"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#0369a1">RUNG 3</text>
      <text x="64" y="15" font-size="9" font-weight="700" fill="#0f172a">Tool ABIs, Schema Validation &amp; Capability Leases</text>

      <!-- Badges -->
      <g transform="translate(485, 3)">
        <rect x="0" y="0" width="95" height="16" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <text x="47.5" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">COST: $10¹ – $10²</text>
        <rect x="103" y="0" width="102" height="16" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <text x="154" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">STRICT JSON</text>
        <rect x="213" y="0" width="90" height="16" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <text x="258" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">MCP SERVER</text>
      </g>

      <text x="14" y="36" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> Model Context Protocol (MCP), Pydantic/JSONSchema validation, idempotent tool interfaces, and least-privilege leases.</text>
      <text x="14" y="49" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Eliminate tool parameter hallucinations, enforce syntactic correctness, and restrict unauthorized operational blast radius.</text>
    </g>

    <!-- RUNG 2: Context Working Sets & Radix Prefix Caching -->
    <g transform="translate(0, 213)">
      <rect width="793" height="62" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="0" y="0" width="793" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="62" fill="#7c3aed"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#6d28d9">RUNG 2</text>
      <text x="64" y="15" font-size="9" font-weight="700" fill="#0f172a">Context Working Sets &amp; Radix Prefix Caching</text>

      <!-- Badges -->
      <g transform="translate(485, 3)">
        <rect x="0" y="0" width="95" height="16" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
        <text x="47.5" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">COST: $10⁰ – $10¹</text>
        <rect x="103" y="0" width="102" height="16" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
        <text x="154" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">RADIX TREE</text>
        <rect x="213" y="0" width="90" height="16" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
        <text x="258" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">PAGED KV</text>
      </g>

      <text x="14" y="36" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> Semantic context compaction, sliding observation windows, dynamic tool pruning, and Radix KV-cache reuse.</text>
      <text x="14" y="49" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Prevent context pollution and attention dilution while maximizing prefix reuse (90%+ hit rate) to slash TTFT.</text>
    </g>

    <!-- RUNG 1: System Prompt Engineering & Deliberative Scaffolding -->
    <g transform="translate(0, 284)">
      <rect width="793" height="62" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <rect x="0" y="0" width="793" height="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <rect x="0" y="0" width="5" height="62" fill="#64748b"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#334155">RUNG 1</text>
      <text x="64" y="15" font-size="9" font-weight="700" fill="#0f172a">System Prompt Engineering &amp; Deliberative Scaffolding</text>

      <!-- Badges -->
      <g transform="translate(485, 3)">
        <rect x="0" y="0" width="95" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="47.5" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">COST: &lt; $10⁰</text>
        <rect x="103" y="0" width="102" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="154" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">LOCAL DIFF</text>
        <rect x="213" y="0" width="90" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="258" y="11.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">RAPID ITER</text>
      </g>

      <text x="14" y="36" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Mechanism:</tspan> Few-shot calibration, structured scratchpads (XML tags), role demarcation, and clear failure taxonomy in instructions.</text>
      <text x="14" y="49" font-size="8" fill="#334155"><tspan font-weight="700" fill="#0f172a">Role:</tspan> Rapid hypothesis exploration; easily versioned, tested, and reverted via standard Git pull-request workflows.</text>
    </g>

  </g>

  <!-- Bottom Principle Banner -->
  <g transform="translate(35, 435)">
    <rect width="870" height="65" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="870" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="5" height="65" fill="#16a34a"/>
    <text x="14" y="15" font-size="9" font-weight="700" fill="#15803d">THE RUNG INVARIANT (BUILD BEFORE TRAIN)</text>
    <text x="14" y="37" font-size="8" fill="#334155">"Never ascend to weight adaptation (Rung 5) to solve a failure that can be resolved by prompt specification (Rung 1), context management (Rung 2),</text>
    <text x="14" y="51" font-size="8" fill="#334155">strict tool contracts (Rung 3), or runtime sandboxing and verification (Rung 4). Systems scaffolding is deterministic, auditable, and cheap; weights are expensive and drift."</text>
  </g>
</svg>
