  <!-- TIER 2: BOUNDED SAGAS -->
  <g transform="translate(478, 102)">
    <rect width="206" height="326" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="0" y="0" width="206" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#15803d">Tier 2: Bounded Sagas</text>
    <text x="12" y="26" font-size="7.5" fill="#16a34a">Human-on-the-Loop (HOTL)</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 40)">
      <!-- Trajectory Horizon -->
      <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Trajectory Horizon</text>
      <text x="8" y="26" font-size="7.5" fill="#334155">H ≤ 50 Steps</text>
      <text x="8" y="38" font-size="7.5" fill="#64748b">End-to-end issue resolution</text>

      <!-- Authority Boundary -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Authority Boundary</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Capability Lease with TTL</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Pre-authorized tool budget</text>
      </g>

      <!-- Verification Gate -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Verification Gate</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Automated Regression Oracle</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Escalate to human on exception</text>
      </g>

      <!-- Systems Harness -->
      <g transform="translate(0, 162)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Systems Harness</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">MicroVM (Firecracker/CoW)</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Compensating Saga log</text>
      </g>

      <!-- Production Risk -->
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="186" height="50" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803d">Production Risk</text>
        <text x="8" y="27" font-size="7.5" font-weight="700" fill="#15803d">Medium / Reversible Risk</text>
        <text x="8" y="40" font-size="7.5" fill="#15803d">Automatic rollback on fault</text>
      </g>
    </g>
  </g>

  <!-- TIER 3: STATISTICAL CANARY -->
  <g transform="translate(699, 102)">
    <rect width="206" height="326" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <rect x="0" y="0" width="206" height="32" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#b45309">Tier 3: Statistical Canary</text>
    <text x="12" y="26" font-size="7.5" fill="#d97706">Autonomous Fleet Operation</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 40)">
      <!-- Trajectory Horizon -->
      <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Trajectory Horizon</text>
      <text x="8" y="26" font-size="7.5" fill="#334155">H &gt; 100 Steps (Continuous)</text>
      <text x="8" y="38" font-size="7.5" fill="#64748b">Autonomous background agents</text>

      <!-- Authority Boundary -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Authority Boundary</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Autonomous Prod Mutations</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Restricted by network air-gap</text>
      </g>

      <!-- Verification Gate -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Verification Gate</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">SPRT Sequential Testing</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Cryptographic Merkle audit</text>
      </g>

      <!-- Systems Harness -->
      <g transform="translate(0, 162)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Systems Harness</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Hermetic air-gapped cluster</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Automated canary rollback</text>
      </g>

      <!-- Production Risk -->
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="186" height="50" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#b45309">Production Risk</text>
        <text x="8" y="27" font-size="7.5" font-weight="700" fill="#b45309">High / Statistical Guard</text>
        <text x="8" y="40" font-size="7.5" fill="#b45309">Instant kill-switch isolation</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM PRINCIPLE BANNER                                           -->
  <!-- ================================================================= -->
  <g transform="translate(36, 437)">
    <rect width="869" height="63" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="869" height="20" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="5" height="63" fill="#0284c7"/>
    <text x="14" y="14" font-size="8.5" font-weight="700" fill="#0369a1">LAMPSON'S PRINCIPLE OF PROGRESSIVE DELEGATION (TRUST CALIBRATION)</text>
    <text x="14" y="36" font-size="8" fill="#334155">"Autonomous authority is not an all-or-nothing binary toggle. Systems runtimes must calibrate delegated capability dynamically:</text>
    <text x="14" y="50" font-size="8" fill="#334155">advancing agents along the spectrum only as empirical verification density accumulates and compensating rollback mechanisms are proven."</text>
  </g>
</svg>
