<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="900" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE PROGRESSIVE AUTONOMY SPECTRUM: HORIZON, AUTHORITY, AND VERIFICATION GATES</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Delegating operational capabilities across four graduated tiers with corresponding systems harnesses and safety boundaries</text>

  <!-- Spectrum Gradient Bar -->
  <g transform="translate(36, 72)">
    <rect width="869" height="22" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="1" y="1" width="216" height="20" rx="1" fill="#e0f2fe"/>
    <rect x="218" y="1" width="216" height="20" rx="1" fill="#ede9fe"/>
    <rect x="435" y="1" width="216" height="20" rx="1" fill="#dcfce7"/>
    <rect x="652" y="1" width="216" height="20" rx="1" fill="#fef3c7"/>
    <text x="109" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">TIER 0: SHADOW / SUGGESTION</text>
    <text x="326" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">TIER 1: GUARDED PREVIEW</text>
    <text x="543" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">TIER 2: TIME-BOUNDED SAGA</text>
    <text x="760" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">TIER 3: STATISTICAL CANARY</text>
  </g>

  <!-- ================================================================= -->
  <!-- 4 TIER COLUMNS                                                    -->
  <!-- ================================================================= -->

  <!-- TIER 0: SHADOW MODE -->
  <g transform="translate(36, 102)">
    <rect width="206" height="326" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="206" height="32" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0369a1">Tier 0: Shadow Mode</text>
    <text x="12" y="26" font-size="7.5" fill="#0284c7">Human-in-the-Loop (100%)</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 40)">
      <!-- Trajectory Horizon -->
      <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Trajectory Horizon</text>
      <text x="8" y="26" font-size="7.5" fill="#334155">H = 1 Step (Turn-scoped)</text>
      <text x="8" y="38" font-size="7.5" fill="#64748b">Synchronous request-reply</text>

      <!-- Authority Boundary -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Authority Boundary</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Zero Write Authority</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Read-only code inspection</text>
      </g>

      <!-- Verification Gate -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Verification Gate</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Mandatory Human Review</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Operator must type/approve</text>
      </g>

      <!-- Systems Harness -->
      <g transform="translate(0, 162)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Systems Harness</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Mock tool execution</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Passive trace shadowing</text>
      </g>

      <!-- Production Risk -->
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="186" height="50" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0369a1">Production Risk</text>
        <text x="8" y="27" font-size="7.5" font-weight="700" fill="#0369a1">Zero Blast Radius</text>
        <text x="8" y="40" font-size="7.5" fill="#0369a1">Developer copilot mode</text>
      </g>
    </g>
  </g>

  <!-- TIER 1: GUARDED LEASES -->
  <g transform="translate(257, 102)">
    <rect width="206" height="326" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="206" height="32" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#6d28d9">Tier 1: Guarded Leases</text>
    <text x="12" y="26" font-size="7.5" fill="#7c3aed">Interactive Action Previews</text>

    <!-- Sub-blocks -->
    <g transform="translate(10, 40)">
      <!-- Trajectory Horizon -->
      <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Trajectory Horizon</text>
      <text x="8" y="26" font-size="7.5" fill="#334155">H ≤ 5 Steps</text>
      <text x="8" y="38" font-size="7.5" fill="#64748b">Single-function refactor</text>

      <!-- Authority Boundary -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Authority Boundary</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Ephemeral Sandboxed Writes</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Staged workspace edits only</text>
      </g>

      <!-- Verification Gate -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Verification Gate</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Diff Inspection Modal</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Linter + unit test suite</text>
      </g>

      <!-- Systems Harness -->
      <g transform="translate(0, 162)">
        <rect x="0" y="0" width="186" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0f172a">Systems Harness</text>
        <text x="8" y="26" font-size="7.5" fill="#334155">Docker container sandbox</text>
        <text x="8" y="38" font-size="7.5" fill="#64748b">Git worktree isolation</text>
      </g>

      <!-- Production Risk -->
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="186" height="50" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#6d28d9">Production Risk</text>
        <text x="8" y="27" font-size="7.5" font-weight="700" fill="#6d28d9">Low / Bounded Risk</text>
        <text x="8" y="40" font-size="7.5" fill="#6d28d9">All edits cleanly diffed</text>
      </g>
    </g>
