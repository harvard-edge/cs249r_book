      <text x="14" y="32" class="attr-key">parent_id:</text>
      <text x="72" y="32" class="mono-code">root-001</text>
      <text x="150" y="32" class="attr-key">hypothesis:</text>
      <text x="220" y="32" class="attr-val">&quot;Add null check before headers.get()&quot;</text>
