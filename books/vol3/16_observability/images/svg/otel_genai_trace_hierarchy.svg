      <text x="240" y="15" class="mono-code" fill="#64748b">model: gemini-1.5-pro (MoE)</text>
      <text x="498" y="15" text-anchor="end" class="mono-bold" fill="#047857">2.82 s</text>
      <text x="12" y="29" class="attr-key">tokens:</text>
      <text x="56" y="29" class="attr-val">prompt=6,280 / comp=320</text>
