      <line x1="-12" y1="24" x2="0" y2="24" stroke="#cbd5e1" stroke-width="2"/>
      <rect width="532" height="40" rx="5" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="40" rx="2" fill="#a855f7"/>
