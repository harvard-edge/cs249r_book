      <text x="14" y="17" class="mono-bold" fill="#1e3a8a">SPAN: agent.step [index=1, role=&quot;triage&quot;]</text>
      <text x="516" y="17" text-anchor="end" class="mono-bold" fill="#1e3a8a">1.25 s</text>
      <text x="14" y="32" class="attr-key">parent_id:</text>
      <text x="72" y="32" class="mono-code">root-001</text>
      <text x="150" y="32" class="attr-key">gen_ai.agent.state:</text>
      <text x="250" y="32" class="attr-val">&quot;inspect_workspace&quot;</text>
