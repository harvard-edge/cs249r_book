    <rect x="0" y="0" width="300" height="28" rx="2" fill="#f8fafc"/>
    <path d="M 0 20 L 0 28 L 300 28 L 300 20 Z" fill="#f8fafc"/>
    <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" class="header-title" fill="#0f172a">W3C TraceContext Propagation</text>

    <g transform="translate(12, 38)">
      <text x="0" y="12" class="mono-code" fill="#64748b">Header: traceparent</text>
      <rect x="0" y="18" width="276" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="8" y="34" class="mono-code" fill="#0f172a">00-4bf92f3577b3...-00f067aa...-01</text>
      <text x="0" y="56" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">Binds disparate asynchronous tool processes,</text>
      <text x="0" y="68" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569">microservices, and subagents to root trace.</text>
      <line x1="0" y1="76" x2="276" y2="76" stroke="#f1f5f9"/>
      <text x="0" y="88" class="mono-code" fill="#64748b">Context: baggage</text>
      <text x="0" y="100" class="attr-val">session.tenant_id=corp_42, budget=$2.50</text>
    </g>

    <!-- Callout 2: OpenTelemetry GenAI Conventions -->
    <g transform="translate(0, 154)">
      <rect width="300" height="174" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect x="0" y="0" width="300" height="28" rx="2" fill="#f8fafc"/>
      <path d="M 0 20 L 0 28 L 300 28 L 300 20 Z" fill="#f8fafc"/>
      <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="19" class="header-title" fill="#0f172a">OpenTelemetry GenAI Conventions</text>

      <g transform="translate(12, 36)">
        <text x="0" y="12" class="attr-key">gen_ai.system:</text>
        <text x="96" y="12" class="attr-val">openai | anthropic | vllm</text>
        <text x="0" y="27" class="attr-key">gen_ai.request.model:</text>
        <text x="130" y="27" class="attr-val">string identifier</text>
        <text x="0" y="42" class="attr-key">gen_ai.usage.prompt_tokens:</text>
        <text x="156" y="42" class="attr-val">integer count</text>
        <text x="0" y="57" class="attr-key">gen_ai.usage.completion_tokens:</text>
        <text x="174" y="57" class="attr-val">integer</text>
        <text x="0" y="72" class="attr-key">gen_ai.token_type:</text>
        <text x="110" y="72" class="attr-val">prefill | decode</text>
        <text x="0" y="87" class="attr-key">gen_ai.agent.step:</text>
        <text x="114" y="87" class="attr-val">monotonic loop counter</text>
        <text x="0" y="102" class="attr-key">gen_ai.usage.cost_usd:</text>
        <text x="130" y="102" class="mono-bold" fill="#16a34a">calculated metric</text>
        <text x="0" y="118" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">Enables fleet-level OLAP aggregation across</text>
        <text x="0" y="130" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">model costs, prefill/decode latency, and errors.</text>
      </g>
    </g>

    <!-- Callout 3: Latency Decomposition -->
    <g transform="translate(0, 338)">
      <rect width="300" height="136" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect x="0" y="0" width="300" height="28" rx="2" fill="#f8fafc"/>
      <path d="M 0 20 L 0 28 L 300 28 L 300 20 Z" fill="#f8fafc"/>
      <line x1="0" y1="28" x2="300" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="19" class="header-title" fill="#0f172a">Trajectory Latency Bottlenecks</text>

      <g transform="translate(12, 38)">
        <text x="0" y="12" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#334155">Inference (Prefill + Decode): 36.2%</text>
        <rect x="0" y="18" width="276" height="12" rx="3" fill="#e2e8f0"/>
        <rect x="0" y="18" width="100" height="12" rx="3" fill="#3b82f6"/>

        <text x="0" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#334155">Tool I/O &amp; Test Oracle: 55.4%</text>
        <rect x="0" y="50" width="276" height="12" rx="3" fill="#e2e8f0"/>
        <rect x="0" y="50" width="153" height="12" rx="3" fill="#e11d48"/>

        <text x="0" y="76" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#334155">Runtime Dispatch &amp; Serialization: 8.4%</text>
        <rect x="0" y="82" width="276" height="12" rx="3" fill="#e2e8f0"/>
        <rect x="0" y="82" width="23" height="12" rx="3" fill="#64748b"/>
      </g>
