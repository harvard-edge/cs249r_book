    <text x="14" y="20" class="header-title" fill="#0f172a">Distributed Trace Tree &amp; Span Timeline</text>
    <text x="350" y="20" class="mono-code" fill="#64748b">TraceID: 4bf92f3577b34da6a3ce929d0e0e4736</text>

    <!-- ROOT SPAN: agent.trajectory -->
    <g transform="translate(14, 42)">
      <rect width="552" height="46" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="46" rx="2" fill="#475569"/>
      <text x="16" y="18" class="mono-bold" fill="#0f172a">SPAN: agent.trajectory</text>
      <rect x="180" y="7" width="92" height="15" rx="3" fill="#e2e8f0"/>
      <text x="226" y="18" text-anchor="middle" class="mono-code" fill="#334155">Kind: SERVER</text>
      <rect x="280" y="7" width="115" height="15" rx="3" fill="#dcfce7"/>
      <text x="337" y="18" text-anchor="middle" class="mono-code" fill="#15803d">Status: SUCCESS</text>
      <text x="536" y="18" text-anchor="end" class="mono-bold" fill="#0f172a">14.82 s</text>

      <text x="16" y="36" class="attr-key">task.goal:</text>
      <text x="76" y="36" class="attr-val">&quot;Fix issue #402: Null pointer in auth router&quot;</text>
      <text x="340" y="36" class="attr-key">gen_ai.usage.cost:</text>
      <text x="445" y="36" class="mono-bold" fill="#16a34a">$0.0428</text>
    </g>

    <!-- STEP 1 SPAN -->
    <g transform="translate(34, 100)">
