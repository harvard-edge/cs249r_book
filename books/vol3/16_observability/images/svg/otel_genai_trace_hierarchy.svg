      <text x="12" y="29" class="attr-key">tokens:</text>
      <text x="56" y="29" class="attr-val">prompt=1,420 / comp=86</text>
      <text x="240" y="29" class="attr-key">routing:</text>
      <text x="290" y="29" class="attr-val">small_triage_tier (cache_hit=91%)</text>
    </g>

    <g transform="translate(54, 188)">
