<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .header-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
      .mono-bold { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
      .mono-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #1e293b; }
      .attr-key { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; fill: #0369a1; font-weight: 600; }
      .attr-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; fill: #0f172a; }
      .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; font-weight: 600; }
    </style>

    
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="560" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">HIERARCHICAL OPENTELEMETRY GENAI DISTRIBUTED TRACE GRAPH</text>
  </g>

  <!-- Main Trace Tree (Left 580px) -->
  <g transform="translate(25, 68)">
    <rect width="580" height="474" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Header bar for Gantt / Tree -->
    <rect x="0" y="0" width="580" height="30" rx="2" fill="#f1f5f9"/>
    <path d="M 0 22 L 0 30 L 580 30 L 580 22 Z" fill="#f1f5f9"/>
