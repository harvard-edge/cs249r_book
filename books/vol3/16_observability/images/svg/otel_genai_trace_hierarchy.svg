      <text x="498" y="15" text-anchor="end" class="mono-bold" fill="#be123c">4.75 s</text>
      <text x="12" y="29" class="attr-key">tool.exit_code:</text>
      <text x="96" y="29" class="mono-bold" fill="#e11d48">1 (FAIL)</text>
      <text x="150" y="29" class="attr-key">assertion:</text>
      <text x="210" y="29" class="attr-val">&quot;AssertionError: Expected 401, got 500&quot;</text>
