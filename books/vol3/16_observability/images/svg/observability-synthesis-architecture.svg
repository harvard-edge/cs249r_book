      <text x="10" y="30" font-size="7.5" fill="#334155">Wilson score interval bounds (N ≥ 2,500)</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Inverts null test; prevents Wald bounds</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Ground-truth acceptance tests: V(τ) ∈ {0,1}</text>
