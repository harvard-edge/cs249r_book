      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Automated Tripwire Circuit Breakers</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Hard tripwires: Cost &gt; 1.5× | Context sat &gt; 1%</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Repetitive tool loops (consecutive calls &gt; 3)</text>
      <text x="10" y="58" font-size="7.5" font-weight="700" fill="#dc2626">
