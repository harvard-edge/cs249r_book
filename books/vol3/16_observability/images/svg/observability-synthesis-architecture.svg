      <text x="10" y="30" font-size="7.5" fill="#334155">Stage 1: Hermetic Gyms (p ≥ p_base - δ)</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Stage 2: Shadow Escrow (A = 0; D_sem ≤ ε)</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Stage 3: Live Canary Traffic (ρ = 1% → 5%)</text>
      <text x="10" y="68" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#2563eb">
