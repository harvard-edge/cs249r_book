<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: EMPIRICAL PARETO FRONTIER CHART                       -->
  <!-- ================================================================= -->
  <g transform="translate(35, 75)">
    <rect width="570" height="425" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">EMPIRICAL PARETO FRONTIER &amp; REGIME ANALYSIS</text>

    <!-- Chart Grid: Origin (75, 370), Max (540, 50) -->
    <!-- Horizontal Gridlines -->
    <line x1="75" y1="370" x2="540" y2="370" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="75" y1="295" x2="540" y2="295" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="75" y1="220" x2="540" y2="220" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="75" y1="145" x2="540" y2="145" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="75" y1="70" x2="540" y2="70" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Vertical Gridlines (X log scale ticks) -->
    <line x1="105" y1="50" x2="105" y2="370" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="195" y1="50" x2="195" y2="370" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="295" y1="50" x2="295" y2="370" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="405" y1="50" x2="405" y2="370" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="505" y1="50" x2="505" y2="370" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Diminishing Returns Shading -->
    <rect x="415" y="50" width="125" height="320" fill="#fee2e2" fill-opacity="0.32"/>
    <rect x="425" y="58" width="105" height="16" rx="1" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
    <text x="477.5" y="69.5" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">DIMINISHING RETURNS</text>
    <text x="477.5" y="86" text-anchor="middle" font-size="8.0" fill="#991b1b">4x cost for +2.8% Pass</text>

    <!-- Axes -->
    <line x1="75" y1="370" x2="545" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
    <line x1="75" y1="370" x2="75" y2="45" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>

    <!-- Y-Axis Ticks & Labels -->
    <text x="65" y="373" text-anchor="end" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">0%</text>
    <text x="65" y="298" text-anchor="end" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">20%</text>
    <text x="65" y="223" text-anchor="end" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">40%</text>
    <text x="65" y="148" text-anchor="end" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">60%</text>
    <text x="65" y="73" text-anchor="end" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">80%</text>
    <text transform="translate(24, 210) rotate(-90)" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Benchmark Success Rate (Pass@k %)</text>

    <!-- X-Axis Ticks & Labels -->
    <text x="105" y="388" text-anchor="middle" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">$0.05</text>
    <text x="195" y="388" text-anchor="middle" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">$0.20</text>
    <text x="295" y="388" text-anchor="middle" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">$1.00</text>
    <text x="405" y="388" text-anchor="middle" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">$5.00</text>
    <text x="505" y="388" text-anchor="middle" font-size="8" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace">$20.00</text>
    <text x="305" y="410" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Cost per Goal ($ / Task, Logarithmic Scale)</text>

    <!-- Pareto Frontier Area & Curve -->
    <path d="M 125 305 Q 195 225, 285 175 T 385 130 T 495 113 L 495 370 L 125 370 Z" fill="#e0f2fe" fill-opacity="0.3"/>
    <path d="M 125 305 Q 195 225, 285 175 T 385 130 T 495 113" fill="none" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Data Points -->
    <!-- Point A: Greedy Dense ($0.15, 12%) -->
    <g transform="translate(200, 333)">
      <circle r="5" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
      <text x="10" y="-2" font-size="8" font-weight="700" fill="#334155">A. Greedy Dense 70B</text>
      <text x="10" y="10" font-size="8.0" fill="#64748b">$0.15 | Pass@1: 12.0%</text>
    </g>

    <!-- Point B: Sparse MoE Fast ($0.09, 18.2%) [MAX GOODPUT] -->
    <g transform="translate(140, 302)">
      <circle r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
      <rect x="10" y="-28" width="80" height="14" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
      <text x="50" y="-18" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">MAX GOODPUT</text>
      <text x="10" y="-3" font-size="8" font-weight="700" fill="#15803d">B. Sparse MoE Cascade</text>
      <text x="10" y="9" font-size="8.0" fill="#16a34a">$0.09 | Pass@1: 18.2%</text>
    </g>

    <!-- Point C: Best-of-8 Dense ($0.75, 34%) -->
    <g transform="translate(270, 240)">
      <circle r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="10" y="-2" font-size="8" font-weight="700" fill="#0369a1">C. Best-of-8 Sampling</text>
      <text x="10" y="10" font-size="8.0" fill="#64748b">$0.75 | Pass@8: 34.0%</text>
    </g>

    <!-- Point D: Cascade + Verifier ($1.80, 52.4%) -->
    <g transform="translate(335, 168)">
      <circle r="6" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
      <text x="-10" y="-6" text-anchor="end" font-size="8" font-weight="700" fill="#6d28d9">D. Cascade + Verifier</text>
      <text x="-10" y="6" text-anchor="end" font-size="8.0" fill="#64748b">$1.80 | Pass: 52.4%</text>
    </g>

    <!-- Point E: Full MCTS Agent ($4.80, 62.1%) -->
    <g transform="translate(405, 126)">
      <circle r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="-10" y="-8" text-anchor="end" font-size="8" font-weight="700" fill="#0369a1">E. MCTS + Rollback</text>
      <text x="-10" y="4" text-anchor="end" font-size="8.0" fill="#64748b">$4.80 | Pass: 62.1%</text>
    </g>

    <!-- Point F: Unbounded Swarm ($18.50, 64.9%) -->
    <g transform="translate(495, 115)">
      <circle r="5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
      <text x="-10" y="18" text-anchor="end" font-size="8" font-weight="700" fill="#991b1b">F. Unbounded Swarm</text>
      <text x="-10" y="30" text-anchor="end" font-size="8.0" fill="#64748b">$18.50 | Pass: 64.9%</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: SYSTEMS MODELS & FLEET INVARIANTS                   -->
  <!-- ================================================================= -->
  <g transform="translate(620, 75)">

    <!-- CARD 1: Trajectory Goodput Equation -->
    <g transform="translate(0, 0)">
      <rect width="285" height="136" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="285" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#15803d">TRAJECTORY GOODPUT INVARIANT</text>

      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="261" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="130.5" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-style="italic" fill="#0f172a">G = N_success / ( C_tokens + C_compute )</text>
        <text x="0" y="40" font-size="8.0" fill="#334155">Measures productive tasks completed per economic unit.</text>
        <text x="0" y="52" font-size="8.0" fill="#334155">Penalizes runaway loops, hallucinations, and dead ends.</text>
        <text x="0" y="70" font-size="8.0" font-weight="700" fill="#15803d">Key Empirical Finding:</text>
        <text x="0" y="82" font-size="8.0" fill="#475569">Peak Goodput occurs at Point B (Sparse MoE Cascade),</text>
        <text x="0" y="94" font-size="8.0" fill="#475569">yielding 3.2x higher tasks/$ than brute sampling.</text>
      </g>
    </g>

    <!-- CARD 2: Cost-per-Goal Economics -->
    <g transform="translate(0, 144)">
      <rect width="285" height="136" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="285" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0369a1">COST-PER-GOAL ECONOMICS</text>

      <g transform="translate(12, 30)">
        <text x="0" y="10" font-size="8.0" font-weight="700" fill="#0f172a">Dense vs. MoE Serving Footprint:</text>
        <text x="0" y="22" font-size="8.0" fill="#334155">• Dense 70B: Activates all 70B FLOPs every token.</text>
        <text x="0" y="34" font-size="8.0" fill="#334155">• MoE 8x7B (2 active): Activates ~13B FLOPs/tok.</text>
        <text x="0" y="46" font-size="8.0" fill="#334155">• 5.4x compute reduction on long agent context.</text>

        <line x1="0" y1="54" x2="261" y2="54" stroke="#e2e8f0" stroke-width="1"/>
        <text x="0" y="66" font-size="8.0" font-weight="700" fill="#0f172a">Unbiased Pass@k Estimator:</text>
        <rect x="0" y="72" width="261" height="22" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="130.5" y="87" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" font-style="italic" fill="#0f172a">Pass@k = E[ 1 - C(n-c, k) / C(n, k) ]</text>
      </g>
    </g>

    <!-- CARD 3: Production Fleet Policy -->
    <g transform="translate(0, 288)">
      <rect width="285" height="137" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="0" y="0" width="285" height="22" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#b45309">PRODUCTION FLEET POLICY</text>

      <g transform="translate(12, 30)">
        <text x="0" y="10" font-size="8.0" font-weight="700" fill="#b45309">1. Dynamic Cascade Routing:</text>
        <text x="0" y="22" font-size="8.0" fill="#334155">Dispatch 80% trivial steps to small fast models.</text>
        <text x="0" y="38" font-size="8.0" font-weight="700" fill="#b45309">2. Verifier-Gated Search Escalation:</text>
        <text x="0" y="50" font-size="8.0" fill="#334155">Trigger expensive frontier MoE / MCTS on test oracle failure.</text>
        <text x="0" y="66" font-size="8.0" font-weight="700" fill="#b45309">3. Strict Cost Circuit Breakers:</text>
        <text x="0" y="78" font-size="8.0" fill="#334155">Terminate trajectories entering Diminishing Returns (&gt; $3.00).</text>
        <text x="0" y="94" font-size="8.0" font-weight="700" fill="#15803d">Enforces Pareto-optimal Goodput across fleet.</text>
      </g>
    </g>

  </g>
</g>
</svg>