<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; }
      .mono-bold { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
      .mono-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; fill: #1e293b; }
      .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>

    
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">HERMETIC ENVIRONMENT GYM ARCHITECTURE FOR AGENT EVALUATION</text>
  </g>

  <!-- 3 Main Columns: Orchestrator -> Hermetic Sandbox Gym -> Verification & Oracles -->

  <!-- COLUMN 1: Benchmark Orchestration (230px) -->
  <g transform="translate(25, 68)">
    <rect width="230" height="448" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="230" height="32" rx="2" fill="#f1f5f9"/>
    <path d="M 0 24 L 0 32 L 230 32 L 230 24 Z" fill="#f1f5f9"/>
    <line x1="0" y1="32" x2="230" y2="32" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="21" class="box-title" fill="#0f172a">1. Evaluation Orchestrator</text>

    <!-- Task Manifest -->
    <g transform="translate(12, 44)">
      <rect width="206" height="74" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#0284c7">Task Instance Registry</text>
      <text x="10" y="32" class="box-desc">Manifest of frozen evaluation items</text>
      <text x="10" y="46" class="mono-code" fill="#64748b">SWE-bench (n=2,294 issues)</text>
      <text x="10" y="60" class="mono-code" fill="#64748b">WebArena (n=812 web goals)</text>
    </g>

    <!-- Golden Snapshot Repo -->
    <g transform="translate(12, 128)">
      <rect width="206" height="84" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#4338ca">Golden State Repositories</text>
      <text x="10" y="32" class="box-desc">Base container images &amp; environments</text>
      <text x="10" y="48" class="mono-code" fill="#475569">• Python 3.10 + deps locked</text>
      <text x="10" y="62" class="mono-code" fill="#475569">• Git commit checkout pre-bug</text>
      <text x="10" y="74" class="mono-code" fill="#475569">• Seeded SQLite / mock DBs</text>
    </g>

    <!-- Dispatch & Lifecycle Controller -->
    <g transform="translate(12, 222)">
      <rect width="206" height="110" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#0f172a">Worker Lifecycle Manager</text>
      <text x="10" y="32" class="box-desc">Concurrent worker pool control:</text>
      <text x="10" y="50" class="box-desc">• Spin up isolated micro-VM</text>
      <text x="10" y="66" class="box-desc">• Mount ephemeral CoW layer</text>
      <text x="10" y="82" class="box-desc">• Enforce timeout &amp; memory caps</text>
      <text x="10" y="98" class="box-desc">• Tear down &amp; collect diff patch</text>
    </g>

    <!-- Run Status & Parallelism -->
    <g transform="translate(12, 342)">
      <rect width="206" height="92" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#1e40af">Parallel Evaluation Pool</text>
      <text x="10" y="34" class="mono-code" fill="#2563eb">Workers: 64 concurrent pods</text>
      <text x="10" y="50" class="mono-code" fill="#2563eb">Timeout: 300s / task limit</text>
      <text x="10" y="66" class="mono-code" fill="#2563eb">Host: Firecracker micro-VMs</text>
      <text x="10" y="80" class="mono-code" fill="#15803d">Zero state leakage between runs</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <path d="M 255 240 L 285 240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="270" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#2563eb">SPAWN</text>

  <!-- COLUMN 2: The Hermetic Sandbox Gym (380px) -->
  <g transform="translate(295, 68)">
    <rect width="380" height="448" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Outer Security Boundary -->
    <rect x="0" y="0" width="380" height="32" rx="2" fill="#fdf2f8"/>
    <path d="M 0 24 L 0 32 L 380 32 L 380 24 Z" fill="#fdf2f8"/>
    <line x1="0" y1="32" x2="380" y2="32" stroke="#fbcfe8" stroke-width="1"/>
    <text x="14" y="21" class="box-title" fill="#9d174d">2. Hermetic Sandbox Gym (Zero-Trust Isolation)</text>

    <!-- Network Isolation Wall -->
    <g transform="translate(14, 44)">
      <rect width="352" height="66" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="66" rx="2" fill="#e11d48"/>
      <text x="16" y="18" class="mono-bold" fill="#be123c">Network Virtualization &amp; Air Gap</text>
      <text x="16" y="32" class="box-desc">Strict network policy: loopback only (127.0.0.1)</text>
      <text x="16" y="46" class="box-desc">DNS blackholed to prevent fetching public GitHub fixes</text>
      <text x="16" y="58" class="mono-code" fill="#9f1239">Mock Server: Stubbed HTTP APIs &amp; internal mirrors</text>
    </g>

    <!-- Storage Stack: CoW Overlays -->
    <g transform="translate(14, 120)">
      <rect width="352" height="136" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="18" class="mono-bold" fill="#0f172a">Filesystem &amp; State Stack (Copy-on-Write)</text>

      <!-- Ephemeral Overlay -->
      <g transform="translate(14, 28)">
        <rect width="324" height="42" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" fill="#7e22ce">Ephemeral Write Layer (OverlayFS / ZFS Clone)</text>
        <text x="10" y="30" class="box-desc">Captures git commits, modified source files, build artifacts</text>
      </g>

      <!-- Read-Only Base Image -->
      <g transform="translate(14, 78)">
        <rect width="324" height="46" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" fill="#1e40af">Base Golden Image (Read-Only RootFS)</text>
        <text x="10" y="30" class="box-desc">Shared immutable snapshot across all runs; reset latency &lt; 50ms</text>
      </g>
    </g>

    <!-- Execution Harness -->
    <g transform="translate(14, 266)">
      <rect width="352" height="168" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="18" class="mono-bold" fill="#0f172a">Runtime Actuation &amp; Observation Bridge</text>

      <!-- Agent Actuator -->
      <g transform="translate(12, 28)">
        <rect width="328" height="40" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" fill="#0369a1">Actuator Sandbox (pty / bash / REPL)</text>
        <text x="10" y="30" class="box-desc">Executes tool commands within unprivileged cgroup namespace</text>
      </g>

      <!-- Observation Sanitizer -->
      <g transform="translate(12, 74)">
        <rect width="328" height="40" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" fill="#0f172a">Observation Interceptor &amp; Sanitizer</text>
        <text x="10" y="30" class="box-desc">Trims massive terminal outputs (10k+ lines) to avoid context exhaustion</text>
      </g>

      <!-- Event Sourced Replay Log -->
      <g transform="translate(12, 120)">
        <rect width="328" height="38" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" fill="#15803d">Deterministic Event Log (Append-Only)</text>
        <text x="10" y="28" class="box-desc">Records every stdin, stdout, exit code, and seed for bit-exact replay</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <path d="M 675 240 L 705 240" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="690" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#16a34a">VERIFY</text>

  <!-- COLUMN 3: Verification & Test Oracles (210px) -->
  <g transform="translate(705, 68)">
    <rect width="210" height="448" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="210" height="32" rx="2" fill="#f0fdf4"/>
    <path d="M 0 24 L 0 32 L 210 32 L 210 24 Z" fill="#f0fdf4"/>
    <line x1="0" y1="32" x2="210" y2="32" stroke="#bbf7d0" stroke-width="1"/>
    <text x="14" y="21" class="box-title" fill="#166534">3. Verification &amp; Oracles</text>

    <!-- Test Patch Application -->
    <g transform="translate(12, 44)">
      <rect width="186" height="74" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#047857">Golden Eval Harness</text>
      <text x="10" y="32" class="box-desc">Applies hidden test patch</text>
      <text x="10" y="46" class="mono-code" fill="#64748b">eval.patch (hidden)</text>
      <text x="10" y="60" class="mono-code" fill="#64748b">Runs pytest regression suite</text>
    </g>

    <!-- Result Evaluator -->
    <g transform="translate(12, 128)">
      <rect width="186" height="84" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#15803d">Oracle Verdict Engine</text>
      <text x="10" y="32" class="box-desc">Independent evaluation:</text>
      <text x="10" y="48" class="mono-code" fill="#16a34a">✓ PASS_TO_PASS tests pass</text>
      <text x="10" y="62" class="mono-code" fill="#16a34a">✓ FAIL_TO_PASS tests flip</text>
      <text x="10" y="74" class="mono-code" fill="#be123c">✗ No regression side effects</text>
    </g>

    <!-- Artifact Capture -->
    <g transform="translate(12, 222)">
      <rect width="186" height="100" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#0f172a">Artifact Collector</text>
      <text x="10" y="32" class="box-desc">Preserves for post-mortem:</text>
      <text x="10" y="50" class="box-desc">• Git diff patch generated</text>
      <text x="10" y="66" class="box-desc">• Complete trajectory trace</text>
      <text x="10" y="82" class="box-desc">• Terminal stdout/stderr logs</text>
    </g>

    <!-- Statistical Aggregator -->
    <g transform="translate(12, 332)">
      <rect width="186" height="102" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="18" class="mono-bold" fill="#166534">Fleet Aggregator</text>
      <text x="10" y="34" class="mono-bold" fill="#15803d">Metric: Pass@k (Chen et al.)</text>
      <text x="10" y="50" class="box-desc">Bootstrap 95% Confidence</text>
      <text x="10" y="66" class="box-desc">Goodput: solved / $1.00</text>
      <text x="10" y="82" class="box-desc">Cost-per-Goal attribution</text>
    </g>
  </g>
</svg>