<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="900" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">HERMETIC ENVIRONMENT GYM ARCHITECTURE FOR AGENT EVALUATION</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Isolated evaluation harness with air-gapped MicroVMs, CoW overlay filesystems, and deterministic test oracles</text>

  <!-- ================================================================= -->
  <!-- COLUMN 1: EVALUATION ORCHESTRATOR                                 -->
  <!-- ================================================================= -->
  <g transform="translate(35, 75)">
    <rect width="230" height="425" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">1. EVALUATION ORCHESTRATOR</text>

    <!-- Task Instance Registry -->
    <g transform="translate(12, 34)">
      <rect width="206" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0284c7">Task Instance Registry</text>
      <text x="10" y="28" font-size="7.5" fill="#64748b">Manifest of frozen evaluation items</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• SWE-bench (n=2,294 issues)</text>
      <text x="10" y="60" font-size="7.5" fill="#334155">• WebArena (n=812 web goals)</text>
    </g>

    <!-- Golden State Repositories -->
    <g transform="translate(12, 114)">
      <rect width="206" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Golden State Repositories</text>
      <text x="10" y="28" font-size="7.5" fill="#64748b">Base container images &amp; environments</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Python 3.10 + locked dependency tree</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">• Git commit checkout pre-bug state</text>
      <text x="10" y="72" font-size="7.5" fill="#334155">• Seeded SQLite / mock databases</text>
    </g>

    <!-- Worker Lifecycle Manager -->
    <g transform="translate(12, 206)">
      <rect width="206" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Worker Lifecycle Manager</text>
      <text x="10" y="28" font-size="7.5" fill="#64748b">Concurrent worker pool control:</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Spin up isolated microVM (Firecracker)</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">• Mount ephemeral CoW filesystem layer</text>
      <text x="10" y="72" font-size="7.5" fill="#334155">• Enforce timeout (300s) &amp; memory caps</text>
      <text x="10" y="86" font-size="7.5" fill="#334155">• Tear down &amp; collect patch diff</text>
    </g>

    <!-- Parallel Evaluation Pool -->
    <g transform="translate(12, 312)">
      <rect width="206" height="100" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">Parallel Evaluation Pool</text>
      <text x="10" y="32" font-size="7.5" fill="#0369a1">• Concurrency: 64 parallel worker pods</text>
      <text x="10" y="48" font-size="7.5" fill="#0369a1">• Task timeout: 300s hard wall-clock</text>
      <text x="10" y="64" font-size="7.5" fill="#0369a1">• Host runtime: Firecracker MicroVMs</text>
      <text x="10" y="80" font-size="7.5" font-weight="700" fill="#15803d">Zero state leakage between task runs</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <g transform="translate(265, 280)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <text x="15" y="-8" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">SPAWN</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: HERMETIC SANDBOX GYM (ZERO-TRUST ISOLATION)             -->
  <!-- ================================================================= -->
  <g transform="translate(295, 75)">
    <rect width="350" height="425" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">2. HERMETIC SANDBOX GYM (Zero-Trust Isolation)</text>

    <!-- Network Isolation Wall -->
    <g transform="translate(12, 34)">
      <rect width="326" height="68" rx="1" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="68" fill="#dc2626"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Network Virtualization &amp; Air Gap</text>
      <text x="12" y="29" font-size="7.5" fill="#334155">Strict network policy: loopback interface only (127.0.0.1)</text>
      <text x="12" y="43" font-size="7.5" fill="#334155">DNS blackholed to prevent fetching external web fixes or ground truth</text>
      <text x="12" y="57" font-size="7.5" font-weight="700" fill="#991b1b">Mock Server: Stubbed HTTP endpoints &amp; internal offline package mirrors</text>
    </g>

    <!-- Storage Stack: CoW Overlays -->
    <g transform="translate(12, 110)">
      <rect width="326" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Filesystem &amp; State Stack (Copy-on-Write)</text>

      <!-- Ephemeral Overlay -->
      <g transform="translate(12, 26)">
        <rect width="302" height="46" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#6d28d9">Ephemeral Write Layer (OverlayFS / ZFS Clone)</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Captures git commits, modified source files, and build artifacts</text>
      </g>

      <!-- Read-Only Base Image -->
      <g transform="translate(12, 80)">
        <rect width="302" height="46" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#0369a1">Base Golden Image (Read-Only RootFS)</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Shared immutable snapshot across runs; CoW reset latency &lt; 50ms</text>
      </g>
    </g>

    <!-- Execution Harness -->
    <g transform="translate(12, 254)">
      <rect width="326" height="158" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Runtime Actuation &amp; Observation Bridge</text>

      <!-- Agent Actuator -->
      <g transform="translate(12, 26)">
        <rect width="302" height="36" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0369a1">Actuator Sandbox (pty / bash / REPL)</text>
        <text x="10" y="26" font-size="7.5" fill="#64748b">Executes tool commands within unprivileged cgroup namespace</text>
      </g>

      <!-- Observation Sanitizer -->
      <g transform="translate(12, 68)">
        <rect width="302" height="36" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0f172a">Observation Interceptor &amp; Sanitizer</text>
        <text x="10" y="26" font-size="7.5" fill="#64748b">Trims massive terminal outputs (&gt;10k lines) to avoid context exhaustion</text>
      </g>

      <!-- Event Sourced Replay Log -->
      <g transform="translate(12, 110)">
        <rect width="302" height="36" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">Deterministic Event Log (Append-Only)</text>
        <text x="10" y="26" font-size="7.5" fill="#15803d">Records every stdin, stdout, exit code, and seed for bit-exact replay</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <g transform="translate(645, 280)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="15" y="-8" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">VERIFY</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: VERIFICATION & TEST ORACLES                             -->
  <!-- ================================================================= -->
  <g transform="translate(675, 75)">
    <rect width="230" height="425" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. VERIFICATION &amp; ORACLES</text>

    <!-- Golden Eval Harness -->
    <g transform="translate(12, 34)">
      <rect width="206" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">Golden Eval Harness</text>
      <text x="10" y="28" font-size="7.5" fill="#64748b">Applies hidden test patch</text>
      <text x="10" y="46" font-size="7.5" fill="#334155">• eval.patch (isolated from agent)</text>
      <text x="10" y="60" font-size="7.5" fill="#334155">• Runs pytest regression test suite</text>
    </g>

    <!-- Oracle Verdict Engine -->
    <g transform="translate(12, 114)">
      <rect width="206" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Oracle Verdict Engine</text>
      <text x="10" y="28" font-size="7.5" fill="#64748b">Independent automated evaluation:</text>
      <text x="10" y="44" font-size="7.5" fill="#15803d">• ✓ PASS_TO_PASS tests continue</text>
      <text x="10" y="58" font-size="7.5" fill="#15803d">• ✓ FAIL_TO_PASS tests flip</text>
      <text x="10" y="72" font-size="7.5" fill="#991b1b">• ✗ Zero regression side effects</text>
    </g>

    <!-- Artifact Collector -->
    <g transform="translate(12, 206)">
      <rect width="206" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Artifact Collector</text>
      <text x="10" y="28" font-size="7.5" fill="#64748b">Preserves telemetry for post-mortem:</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Git diff patch artifact generated</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">• Complete trajectory trace &amp; spans</text>
      <text x="10" y="72" font-size="7.5" fill="#334155">• Terminal stdout/stderr streams</text>
      <text x="10" y="86" font-size="7.5" fill="#334155">• Resource consumption telemetry</text>
    </g>

    <!-- Fleet Aggregator & Metrics -->
    <g transform="translate(12, 312)">
      <rect width="206" height="100" rx="1" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Fleet Statistical Aggregator</text>
      <text x="10" y="32" font-size="7.5" font-weight="700" fill="#15803d">• Metric: Pass@k (Chen et al.)</text>
      <text x="10" y="48" font-size="7.5" fill="#15803d">• Bootstrap 95% confidence intervals</text>
      <text x="10" y="64" font-size="7.5" fill="#15803d">• Goodput: solved tasks / $1.00</text>
      <text x="10" y="80" font-size="7.5" fill="#15803d">• Cost-per-Goal economic attribution</text>
    </g>
  </g>
</svg>