<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 505" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1150" height="505" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM INVARIANT                                         -->
  <!-- ================================================================= -->

  <!-- ================================================================= -->
  <!-- LEFT: HOST HYPERVISOR & GUEST MICROVM ENCLAVE                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 25)">
    <!-- Host Outer Enclosure -->
    <rect x="0" y="0" width="670" height="455" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
    <rect x="0" y="0" width="670" height="30" rx="6" fill="#F8FAFC" stroke="#334155" stroke-width="1.3"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#1E293B">PHYSICAL EVALUATION HOST (Bare Metal Linux / KVM)</text>
    <text x="510" y="20" font-size="9.5" fill="#64748B" font-family="'SF Mono', monospace">Kernel 6.x + /dev/kvm</text>

    <!-- Jailer & Sandbox Container Boundary -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="630" height="335" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
      <rect x="0" y="0" width="630" height="26" rx="4" fill="#F3E8FF" stroke="#581C87" stroke-width="1.5"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#581C87">FIRECRACKER MICROVM JAILER BOUNDARY (cgroups v2 + seccomp-bpf)</text>
      <text x="505" y="18" font-size="8.5" font-family="'SF Mono', monospace" fill="#6B21A8">Boot &lt; 5ms</text>

      <!-- Inside MicroVM Guest -->
      <g transform="translate(15, 36)">
        <rect x="0" y="0" width="600" height="275" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

        <!-- Upper Row: Runtime Process & Deterministic PRNG -->
        <g transform="translate(15, 15)">
          <!-- Agent Runtime Process -->
          <rect x="0" y="0" width="365" height="75" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
          <text x="12" y="18" font-size="9.5" font-weight="700" fill="#581C87">Guest Agent Runtime (PID 1 Namespace)</text>
          <text x="12" y="34" font-size="8.5" fill="#334155">Resource limits: 2 vCPUs pinned | 4 GB RAM hard ceiling</text>
          <text x="12" y="50" font-size="8.5" font-family="'SF Mono', monospace" fill="#581C87">Actions: Tool executions, bash invocations, code editing</text>
          <rect x="12" y="56" width="341" height="12" rx="1" fill="#F3E8FF"/>
          <text x="182" y="65" font-size="7.5" font-weight="700" fill="#581C87" text-anchor="middle">All mutations constrained to ephemeral mount</text>

          <!-- Deterministic PRNG Seed Tap -->
          <g transform="translate(380, 0)">
            <rect x="0" y="0" width="190" height="75" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
            <text x="10" y="18" font-size="9" font-weight="700" fill="#334155">PRNG Seed Tap</text>
            <text x="10" y="34" font-size="8" font-family="'SF Mono', monospace" fill="#475569">/dev/urandom -&gt; Seed S</text>
            <text x="10" y="50" font-size="8" fill="#64748B">Deterministic hashing</text>
            <text x="10" y="64" font-size="8" font-weight="700" fill="#0F766E">Reproducible trajectories</text>
          </g>
        </g>

        <!-- Middle Row: Tiered Storage Subsystem -->
        <g transform="translate(15, 47)">
          <text x="0" y="12" font-size="9" font-weight="700" fill="#334155">Storage Architecture: Copy-on-Write (CoW) Layering</text>

          <g transform="translate(0, 20)">
            <!-- Layer 1: Immutable Golden Base Image -->
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="275" height="50" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
              <text x="12" y="18" font-size="8.5" font-weight="700" fill="#334155">Base Image: rootfs.ext4 (Read-Only)</text>
              <text x="12" y="32" font-size="8" fill="#64748B">Pre-bug repository commit + locked deps</text>
              <text x="12" y="44" font-size="7.5" font-family="'SF Mono', monospace" fill="#475569">Mount: /dev/vda (ro, noatime)</text>
            </g>

            <!-- Plus Sign -->
            <text x="290" y="30" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">+</text>

            <!-- Layer 2: Ephemeral CoW Overlay (Properly Grouped) -->
            <g transform="translate(305, 0)">
              <rect x="0" y="0" width="265" height="50" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
              <text x="12" y="18" font-size="8.5" font-weight="700" fill="#92400E">Ephemeral CoW Overlay (Writable)</text>
              <text x="12" y="32" font-size="8" fill="#78350F">tmpfs RAM-backed delta storage</text>
              <text x="12" y="44" font-size="7.5" font-family="'SF Mono', monospace" fill="#B45309">Reset latency: &lt; 50ms via blkdiscard</text>
            </g>
          </g>
        </g>

        <!-- Bottom Row: Hermetic Network Filter -->
        <g transform="translate(15, 129)">
          <rect x="0" y="0" width="570" height="75" rx="3" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.2"/>
          <text x="12" y="18" font-size="9" font-weight="700" fill="#0F766E">Hermetic Network Isolation (Virtual TAP tap0 + eBPF Policy)</text>

          <g transform="translate(12, 28)">
            <!-- WAN Filter Block -->
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="250" height="36" rx="2" fill="#FEF2F2" stroke="#991B1B" stroke-width="1"/>
              <text x="10" y="15" font-size="8" font-weight="700" fill="#991B1B">Public Internet (WAN) Egress</text>
              <text x="10" y="28" font-size="8" font-family="'SF Mono', monospace" fill="#7F1D1D">DROP ALL packets (Zero Leakage)</text>
            </g>

            <!-- Arrow to Mock -->
            <line x1="255" y1="18" x2="285" y2="18" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr-teal)"/>

            <!-- Mock Service Proxy (Properly Grouped) -->
            <g transform="translate(290, 0)">
              <rect x="0" y="0" width="255" height="36" rx="2" fill="#F0FDFA" stroke="#0F766E" stroke-width="1"/>
              <text x="10" y="15" font-size="8" font-weight="700" fill="#0F766E">Local Mock Services / Web Proxy</text>
              <text x="10" y="28" font-size="8" fill="#115E59">Deterministic playback of HTTP fixtures</text>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Host Invariant Footer -->
    <g transform="translate(20, 335)">
      <rect x="0" y="0" width="630" height="50" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Lifecycle Automation Contract:</text>
      <text x="12" y="32" font-size="8.5" fill="#475569">On task completion: Extract git diff patch -&gt; Destroy overlay layer -&gt; Release memory back to host pool.</text>
      <text x="12" y="44" font-size="8" font-family="'SF Mono', monospace" fill="#166534">Guarantees zero contamination across sequential benchmark evaluations</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: OUT-OF-BAND VERIFICATION ENCLAVE                           -->
  <!-- ================================================================= -->
  <g transform="translate(745, 25)">
    <rect x="0" y="0" width="365" height="455" rx="6" fill="#FFFFFF" stroke="#166534" stroke-width="1.3"/>
    <rect x="0" y="0" width="365" height="30" rx="6" fill="#F0FDF4" stroke="#166534" stroke-width="1.3"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#166534">OUT-OF-BAND VERIFIER</text>
    <text x="250" y="20" font-size="9.5" fill="#15803D" font-family="'SF Mono', monospace">Zero Leakage</text>

    <!-- Pipeline Step 1: Ingestion of Agent Patch -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="335" height="70" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#581C87">1. Artifact Patch Extraction</text>
      <text x="12" y="34" font-size="8.5" fill="#334155">Only git diff output crosses isolation wall:</text>
      <text x="12" y="52" font-size="8.5" font-family="'SF Mono', monospace" fill="#581C87">patch = git diff HEAD..worktree</text>
    </g>

    <!-- Downward Arrow 1 -->
    <line x1="182" y1="115" x2="182" y2="135" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-green)"/>

    <!-- Pipeline Step 2: Fresh Pristine Environment -->
    <g transform="translate(15, 82)">
      <rect x="0" y="0" width="335" height="75" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#334155">2. Clean Environment Application</text>
      <text x="12" y="34" font-size="8.5" fill="#475569">Patch applied to pristine repository snapshot:</text>
      <text x="12" y="52" font-size="8.5" font-family="'SF Mono', monospace" fill="#1E293B">git apply --check &amp;&amp; git apply patch</text>
      <text x="12" y="66" font-size="8" fill="#64748B">Agent code never accesses acceptance tests</text>
    </g>

    <!-- Downward Arrow 2 -->
    <line x1="182" y1="212" x2="182" y2="232" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-green)"/>

    <!-- Pipeline Step 3: Hidden Test Oracle Execution -->
    <g transform="translate(15, 179)">
      <rect x="0" y="0" width="335" height="90" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1.3"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#166534">3. Hidden Acceptance Test Oracle</text>
      <text x="12" y="34" font-size="8.5" fill="#15803D">Executes out-of-band ground-truth suite:</text>
      <rect x="12" y="42" width="311" height="34" rx="2" fill="#FFFFFF" stroke="#166534" stroke-width="0.8"/>
      <text x="20" y="56" font-size="8.5" font-family="'SF Mono', monospace" fill="#166534">pytest tests/test_acceptance.py</text>
      <text x="20" y="68" font-size="8" fill="#14532D">Compiler syntax + AST invariant validation</text>
    </g>

    <!-- Downward Arrow 3 -->
    <line x1="182" y1="324" x2="182" y2="344" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-green)"/>

    <!-- Pipeline Step 4: Deterministic Binary Verdict -->
    <g transform="translate(15, 291)">
      <rect x="0" y="0" width="335" height="94" rx="4" fill="#FFFFFF" stroke="#166534" stroke-width="1.5"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#166534">4. Deterministic Evaluation Score</text>
      <rect x="12" y="26" width="311" height="32" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="1"/>
      <text x="167" y="46" font-size="11" font-weight="700" font-family="'SF Mono', monospace" fill="#166534" text-anchor="middle">Verdict V(tau) in {0, 1}</text>
      <text x="12" y="74" font-size="8" fill="#475569">Logged to immutable run ledger with telemetry metadata</text>
      <text x="12" y="86" font-size="8" font-family="'SF Mono', monospace" fill="#64748B">{ pass@1, exec_time, token_cost }</text>
    </g>
  </g>

  <!-- Connective Data Bus: From MicroVM Guest to Out-of-Band Verifier -->
  <path d="M 670 160 L 745 160" fill="none" stroke="#581C87" stroke-width="2.2" marker-end="url(#arr-amethyst)"/>
  <rect x="678" y="142" width="58" height="18" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="0.8"/>
  <text x="707" y="154" font-size="7.5" font-weight="700" fill="#581C87" text-anchor="middle">patch.diff</text>
</svg>
