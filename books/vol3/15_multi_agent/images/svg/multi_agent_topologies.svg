<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; }
      .badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; font-weight: 700; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8px; text-anchor: middle; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="550" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">MULTI-AGENT COORDINATION TOPOLOGIES</text>
  </g>

  <!-- ==================== QUADRANT 1: PEER-TO-PEER SWARM ==================== -->
  <g transform="translate(25, 72)">
    <!-- Outer Card -->
    <rect width="435" height="220" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect width="435" height="28" rx="2" fill="#fff1f2"/>
    <text x="14" y="19" class="box-title" fill="#9f1239">(a) Peer-to-Peer Conversational Swarm</text>
    <rect x="315" y="5" width="108" height="18" rx="4" fill="#ffe4e6"/>
    <text x="369" y="17" text-anchor="middle" class="badge" fill="#be123c">O(M²) Complexity</text>

    <!-- Mesh Diagram -->
    <g transform="translate(20, 48)">
      <!-- Bidirectional edges -->
      <line x1="50" y1="30" x2="150" y2="30" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-rose)" marker-start="url(#arrow-rose)"/>
      <line x1="50" y1="105" x2="150" y2="105" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-rose)" marker-start="url(#arrow-rose)"/>
      <line x1="50" y1="30" x2="50" y2="105" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-rose)" marker-start="url(#arrow-rose)"/>
      <line x1="150" y1="30" x2="150" y2="105" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-rose)" marker-start="url(#arrow-rose)"/>
      <line x1="50" y1="30" x2="150" y2="105" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-rose)"/>
      <line x1="150" y1="30" x2="50" y2="105" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-rose)"/>

      <!-- Node A -->
      <circle cx="50" cy="30" r="21" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="50" y="32" class="node-text" fill="#9f1239">Agent A</text>
      <text x="50" y="42" class="node-sub" fill="#be123c">LLM-1</text>

      <!-- Node B -->
      <circle cx="150" cy="30" r="21" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="150" y="32" class="node-text" fill="#9f1239">Agent B</text>
      <text x="150" y="42" class="node-sub" fill="#be123c">LLM-2</text>

      <!-- Node C -->
      <circle cx="50" cy="105" r="21" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="50" y="107" class="node-text" fill="#9f1239">Agent C</text>
      <text x="50" y="117" class="node-sub" fill="#be123c">LLM-3</text>

      <!-- Node D -->
      <circle cx="150" cy="105" r="21" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="150" y="107" class="node-text" fill="#9f1239">Agent D</text>
      <text x="150" y="117" class="node-sub" fill="#be123c">LLM-4</text>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(225, 38)">
      <rect width="195" height="168" rx="2" fill="#fff5f5" stroke="#fecdd3" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#9f1239">Operational Characteristics:</text>
      <text x="10" y="40" class="box-desc">• Fully connected natural language debate</text>
      <text x="10" y="58" class="box-desc">• Quadratic token tax: M(M-1) chats</text>
      <text x="10" y="76" class="box-desc">• Susceptible to cyclic semantic deadlocks</text>
      <text x="10" y="94" class="box-desc">• Correlated hallucination reinforcement</text>
      <line x1="10" y1="108" x2="185" y2="108" stroke="#fecdd3" stroke-width="1"/>
      <text x="10" y="124" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#be123c">Verdict: Unviable in Production</text>
      <text x="10" y="140" class="box-desc" fill="#881337">High blast radius, nondeterministic exit,</text>
      <text x="10" y="154" class="box-desc" fill="#881337">unbounded token consumption</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: HIERARCHICAL SUPERVISOR TREE ==================== -->
  <g transform="translate(480, 72)">
    <!-- Outer Card -->
    <rect width="435" height="220" rx="2" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect width="435" height="28" rx="2" fill="#eef2ff"/>
    <text x="14" y="19" class="box-title" fill="#3730a3">(b) Hierarchical Supervisor Tree</text>
    <rect x="315" y="5" width="108" height="18" rx="4" fill="#e0e7ff"/>
    <text x="369" y="17" text-anchor="middle" class="badge" fill="#4338ca">O(M) Complexity</text>

    <!-- Tree Diagram -->
    <g transform="translate(15, 42)">
      <!-- Root Supervisor -->
      <rect x="65" y="4" width="80" height="32" rx="5" fill="#312e81" stroke="#1e1b4b" stroke-width="1.2"/>
      <text x="105" y="19" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Supervisor</text>
      <text x="105" y="30" class="node-sub" fill="#e0e7ff">Actor Root</text>

      <!-- Connectors down -->
      <path d="M 105 36 L 105 52 L 40 52 L 40 68" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <path d="M 105 36 L 105 68" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <path d="M 105 36 L 105 52 L 170 52 L 170 68" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

      <!-- Level 2 Sub-Supervisors / Workers -->
      <rect x="10" y="70" width="60" height="26" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
      <text x="40" y="84" class="node-text" fill="#312e81">Planner</text>
      <text x="40" y="93" class="node-sub" fill="#6366f1">Actor</text>

      <rect x="75" y="70" width="60" height="26" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
      <text x="105" y="84" class="node-text" fill="#312e81">Coder</text>
      <text x="105" y="93" class="node-sub" fill="#6366f1">Actor</text>

      <rect x="140" y="70" width="60" height="26" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
      <text x="170" y="84" class="node-text" fill="#312e81">Tester</text>
      <text x="170" y="93" class="node-sub" fill="#6366f1">Actor</text>

      <!-- Worker nodes under Coder -->
      <path d="M 105 96 L 105 110 L 80 110 L 80 118" fill="none" stroke="#818cf8" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <path d="M 105 96 L 105 110 L 130 110 L 130 118" fill="none" stroke="#818cf8" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

      <rect x="58" y="120" width="44" height="22" rx="3" fill="#f5f3ff" stroke="#818cf8" stroke-width="1"/>
      <text x="80" y="134" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#4338ca" text-anchor="middle">Worker 1</text>

      <rect x="108" y="120" width="44" height="22" rx="3" fill="#f5f3ff" stroke="#818cf8" stroke-width="1"/>
      <text x="130" y="134" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#4338ca" text-anchor="middle">Worker 2</text>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(225, 38)">
      <rect width="195" height="168" rx="2" fill="#f8faff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#3730a3">Operational Characteristics:</text>
      <text x="10" y="40" class="box-desc">• Strict unidirectional delegation</text>
      <text x="10" y="58" class="box-desc">• Erlang one-for-one restart policies</text>
      <text x="10" y="76" class="box-desc">• Private mailbox context isolation</text>
      <text x="10" y="94" class="box-desc">• Monotonic capability attenuation</text>
      <line x1="10" y1="108" x2="185" y2="108" stroke="#c7d2fe" stroke-width="1"/>
      <text x="10" y="124" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#4338ca">Verdict: Production Standard</text>
      <text x="10" y="140" class="box-desc" fill="#1e1b4b">Bounded blast radius, deterministic</text>
      <text x="10" y="154" class="box-desc" fill="#1e1b4b">supervision, isolated actor failures</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: SEQUENTIAL PIPELINE ==================== -->
  <g transform="translate(25, 304)">
    <!-- Outer Card -->
    <rect width="435" height="224" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect width="435" height="28" rx="2" fill="#ecfdf5"/>
    <text x="14" y="19" class="box-title" fill="#065f46">(c) Sequential Assembly Pipeline</text>
    <rect x="315" y="5" width="108" height="18" rx="4" fill="#d1fae5"/>
    <text x="369" y="17" text-anchor="middle" class="badge" fill="#047857">O(M) Complexity</text>

    <!-- Pipeline Diagram -->
    <g transform="translate(15, 48)">
      <!-- Stage 1 -->
      <rect x="5" y="10" width="75" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="42" y="27" class="node-text" fill="#065f46">Spec Stage</text>
      <text x="42" y="40" class="node-sub" fill="#047857">Requirements</text>

      <!-- Arrow 1 with Gate -->
      <line x1="80" y1="31" x2="110" y2="31" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <circle cx="95" cy="31" r="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
      <text x="95" y="20" font-family="ui-monospace, monospace" font-size="7" fill="#047857" text-anchor="middle">Gate 1</text>

      <!-- Stage 2 -->
      <rect x="112" y="10" width="75" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="149" y="27" class="node-text" fill="#065f46">Code Stage</text>
      <text x="149" y="40" class="node-sub" fill="#047857">Implementation</text>

      <!-- Arrow 2 with Gate -->
      <line x1="149" y1="52" x2="149" y2="78" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <circle cx="149" cy="65" r="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
      <text x="172" y="68" font-family="ui-monospace, monospace" font-size="7" fill="#047857">Gate 2</text>

      <!-- Stage 3 -->
      <rect x="112" y="80" width="75" height="42" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="149" y="97" class="node-text" fill="#065f46">Test Stage</text>
      <text x="149" y="110" class="node-sub" fill="#047857">Unit / Oracle</text>

      <!-- Arrow 3 with Gate -->
      <line x1="112" y1="101" x2="82" y2="101" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <circle cx="97" cy="101" r="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
      <text x="97" y="92" font-family="ui-monospace, monospace" font-size="7" fill="#047857" text-anchor="middle">Gate 3</text>

      <!-- Stage 4 -->
      <rect x="5" y="80" width="75" height="42" rx="5" fill="#059669" stroke="#047857" stroke-width="1.2"/>
      <text x="42" y="97" class="node-text" fill="#ffffff">Deploy Stage</text>
      <text x="42" y="110" class="node-sub" fill="#d1fae5">PR Merge</text>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(225, 38)">
      <rect width="195" height="172" rx="2" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46">Operational Characteristics:</text>
      <text x="10" y="40" class="box-desc">• Linear baton handoff of typed artifacts</text>
      <text x="10" y="58" class="box-desc">• Deterministic execution and verification</text>
      <text x="10" y="76" class="box-desc">• Early-exit aborts save downstream tokens</text>
      <text x="10" y="94" class="box-desc">• Zero concurrency race conditions</text>
      <line x1="10" y1="108" x2="185" y2="108" stroke="#a7f3d0" stroke-width="1"/>
      <text x="10" y="124" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#059669">Verdict: High Reliability, Low Fanout</text>
      <text x="10" y="140" class="box-desc" fill="#064e3b">Ideal for well-specified workflows</text>
      <text x="10" y="154" class="box-desc" fill="#064e3b">(code review, vulnerability triage,</text>
      <text x="10" y="166" class="box-desc" fill="#064e3b">automated release staging)</text>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: SHARED BLACKBOARD (TUPLE SPACE) ==================== -->
  <g transform="translate(480, 304)">
    <!-- Outer Card -->
    <rect width="435" height="224" rx="2" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect width="435" height="28" rx="2" fill="#fff7ed"/>
    <text x="14" y="19" class="box-title" fill="#9a3412">(d) Shared Blackboard (Tuple Space)</text>
    <rect x="290" y="5" width="133" height="18" rx="4" fill="#ffedd5"/>
    <text x="356" y="17" text-anchor="middle" class="badge" fill="#c2410c">Decoupled Asynchronous</text>

    <!-- Blackboard Diagram -->
    <g transform="translate(15, 42)">
      <!-- Central Blackboard -->
      <rect x="42" y="46" width="124" height="58" rx="2" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
      <text x="104" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#9a3412" text-anchor="middle">Central Blackboard</text>
      <text x="104" y="78" class="node-sub" fill="#7c2d12">Linda Tuple Space (Redis)</text>
      <text x="104" y="92" font-family="ui-monospace, monospace" font-size="7.5" fill="#c2410c" text-anchor="middle">[("task", id), ("claim", lease)]</text>

      <!-- Worker 1 (Top Left) -->
      <rect x="5" y="4" width="60" height="26" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="35" y="18" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#9a3412" text-anchor="middle">Agent 1</text>
      <path d="M 45 30 L 65 44" fill="none" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>

      <!-- Worker 2 (Top Right) -->
      <rect x="142" y="4" width="60" height="26" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="172" y="18" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#9a3412" text-anchor="middle">Agent 2</text>
      <path d="M 160 30 L 140 44" fill="none" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>

      <!-- Worker 3 (Bottom Left) -->
      <rect x="5" y="120" width="60" height="26" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="35" y="134" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#9a3412" text-anchor="middle">Agent 3</text>
      <path d="M 45 120 L 65 106" fill="none" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>

      <!-- Worker 4 (Bottom Right) -->
      <rect x="142" y="120" width="60" height="26" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="172" y="134" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#9a3412" text-anchor="middle">Agent 4</text>
      <path d="M 160 120 L 140 106" fill="none" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(225, 38)">
      <rect width="195" height="172" rx="2" fill="#fffaf5" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#9a3412">Operational Characteristics:</text>
      <text x="10" y="40" class="box-desc">• Fully decoupled pub/sub pattern</text>
      <text x="10" y="58" class="box-desc">• Time &amp; space asynchronous coordination</text>
      <text x="10" y="76" class="box-desc">• Requires distributed leases &amp; TTLs</text>
      <text x="10" y="94" class="box-desc">• Optimistic concurrency control (OCC)</text>
      <line x1="10" y1="108" x2="185" y2="108" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="124" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#c2410c">Verdict: Flexible for Dynamic Search</text>
      <text x="10" y="140" class="box-desc" fill="#7c2d12">High scale, but requires distributed lock</text>
      <text x="10" y="154" class="box-desc" fill="#7c2d12">manager (DLM) to prevent lost updates</text>
      <text x="10" y="166" class="box-desc" fill="#7c2d12">and concurrent write corruption</text>
    </g>
  </g>
</svg>