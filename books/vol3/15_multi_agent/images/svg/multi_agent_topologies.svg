<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Base Canvas -->
  <rect width="940" height="530" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Framing Card -->

  <!-- ================================================================= -->
  <!-- QUADRANT A: PEER-TO-PEER CONVERSATIONAL SWARM                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Container Card with Header Band -->
    <rect width="435" height="218" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="435" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">(A) PEER-TO-PEER CONVERSATIONAL SWARM</text>
    <rect x="315" y="4" width="108" height="16" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="369" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">O(M²) Complexity</text>

    <!-- Mesh Diagram -->
    <g transform="translate(18, 44)">
      <!-- Bidirectional Edges -->
      <line x1="45" y1="30" x2="145" y2="30" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
      <line x1="45" y1="110" x2="145" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
      <line x1="45" y1="30" x2="45" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
      <line x1="145" y1="30" x2="145" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
      <line x1="45" y1="30" x2="145" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
      <line x1="145" y1="30" x2="45" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

      <!-- Node A -->
      <circle cx="45" cy="30" r="20" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="45" y="27" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Agent A</text>
      <text x="45" y="38" font-size="8.0" fill="#64748b" text-anchor="middle">LLM-1</text>

      <!-- Node B -->
      <circle cx="145" cy="30" r="20" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="145" y="27" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Agent B</text>
      <text x="145" y="38" font-size="8.0" fill="#64748b" text-anchor="middle">LLM-2</text>

      <!-- Node C -->
      <circle cx="45" cy="110" r="20" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="45" y="107" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Agent C</text>
      <text x="45" y="118" font-size="8.0" fill="#64748b" text-anchor="middle">LLM-3</text>

      <!-- Node D -->
      <circle cx="145" cy="110" r="20" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="145" y="107" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Agent D</text>
      <text x="145" y="118" font-size="8.0" fill="#64748b" text-anchor="middle">LLM-4</text>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(222, 34)">
      <rect width="201" height="172" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Operational Characteristics:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Fully connected natural language debate</text>
      <text x="10" y="49" font-size="8.0" fill="#334155">• Quadratic token tax: M(M-1) chats</text>
      <text x="10" y="64" font-size="8.0" fill="#334155">• Susceptible to cyclic semantic deadlocks</text>
      <text x="10" y="79" font-size="8.0" fill="#334155">• Correlated hallucination reinforcement</text>
      <line x1="10" y1="94" x2="191" y2="94" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="110" font-size="8" font-weight="700" fill="#991b1b">Verdict: Unviable in Production</text>
      <text x="10" y="125" font-size="8.0" fill="#64748b">High blast radius, nondeterministic exit,</text>
      <text x="10" y="137" font-size="8.0" fill="#64748b">and unbounded token consumption.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT B: HIERARCHICAL SUPERVISOR TREE                          -->
  <!-- ================================================================= -->
  <g transform="translate(485, 75)">
    <!-- Container Card with Header Band -->
    <rect width="435" height="218" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="435" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">(B) HIERARCHICAL SUPERVISOR TREE</text>
    <rect x="315" y="4" width="108" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="369" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">O(M) Complexity</text>

    <!-- Tree Diagram -->
    <g transform="translate(15, 38)">
      <!-- Root Supervisor -->
      <rect x="65" y="4" width="80" height="30" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="105" y="16" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">Supervisor</text>
      <text x="105" y="27" font-size="8.0" fill="#64748b" text-anchor="middle">Actor Root</text>

      <!-- Connectors Down -->
      <path d="M 105 34 L 105 50 L 40 50 L 40 64" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <path d="M 105 34 L 105 64" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <path d="M 105 34 L 105 50 L 170 50 L 170 64" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <!-- Level 2 Actors -->
      <rect x="10" y="66" width="60" height="26" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="40" y="78" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Planner</text>
      <text x="40" y="88" font-size="8.0" fill="#64748b" text-anchor="middle">Actor</text>

      <rect x="75" y="66" width="60" height="26" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="105" y="78" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Coder</text>
      <text x="105" y="88" font-size="8.0" fill="#64748b" text-anchor="middle">Actor</text>

      <rect x="140" y="66" width="60" height="26" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="170" y="78" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Tester</text>
      <text x="170" y="88" font-size="8.0" fill="#64748b" text-anchor="middle">Actor</text>

      <!-- Worker Nodes under Coder -->
      <path d="M 105 92 L 105 106 L 80 106 L 80 114" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <path d="M 105 92 L 105 106 L 130 106 L 130 114" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <rect x="58" y="116" width="44" height="22" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="130" font-size="8.0" font-weight="700" fill="#0f172a" text-anchor="middle">Worker 1</text>

      <rect x="108" y="116" width="44" height="22" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="130" y="130" font-size="8.0" font-weight="700" fill="#0f172a" text-anchor="middle">Worker 2</text>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(222, 34)">
      <rect width="201" height="172" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Operational Characteristics:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Strict unidirectional delegation</text>
      <text x="10" y="49" font-size="8.0" fill="#334155">• Erlang one-for-one restart policies</text>
      <text x="10" y="64" font-size="8.0" fill="#334155">• Private mailbox context isolation</text>
      <text x="10" y="79" font-size="8.0" fill="#334155">• Monotonic capability attenuation</text>
      <line x1="10" y1="94" x2="191" y2="94" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="110" font-size="8" font-weight="700" fill="#0369a1">Verdict: Production Standard</text>
      <text x="10" y="125" font-size="8.0" fill="#64748b">Bounded blast radius, deterministic</text>
      <text x="10" y="137" font-size="8.0" fill="#64748b">supervision, isolated actor failures.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT C: SEQUENTIAL ASSEMBLY PIPELINE                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 307)">
    <!-- Container Card with Header Band -->
    <rect width="435" height="223" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="435" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">(C) SEQUENTIAL ASSEMBLY PIPELINE</text>
    <rect x="315" y="4" width="108" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="369" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">O(M) Complexity</text>

    <!-- Pipeline Diagram -->
    <g transform="translate(15, 42)">
      <!-- Stage 1 -->
      <rect x="5" y="10" width="75" height="42" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="42" y="27" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Spec Stage</text>
      <text x="42" y="40" font-size="8.0" fill="#64748b" text-anchor="middle">Requirements</text>

      <!-- Arrow 1 with Verification Gate -->
      <line x1="80" y1="31" x2="110" y2="31" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <circle cx="95" cy="31" r="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="95" y="21" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">Gate 1</text>

      <!-- Stage 2 -->
      <rect x="112" y="10" width="75" height="42" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="149" y="27" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Code Stage</text>
      <text x="149" y="40" font-size="8.0" fill="#64748b" text-anchor="middle">Implementation</text>

      <!-- Arrow 2 with Verification Gate -->
      <line x1="149" y1="52" x2="149" y2="78" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <circle cx="149" cy="65" r="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="170" y="68" font-size="8.0" font-weight="700" fill="#15803d">Gate 2</text>

      <!-- Stage 3 -->
      <rect x="112" y="80" width="75" height="42" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="149" y="97" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Test Stage</text>
      <text x="149" y="110" font-size="8.0" fill="#64748b" text-anchor="middle">Unit / Oracle</text>

      <!-- Arrow 3 with Verification Gate -->
      <line x1="112" y1="101" x2="82" y2="101" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <circle cx="97" cy="101" r="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="97" y="92" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">Gate 3</text>

      <!-- Stage 4 -->
      <rect x="5" y="80" width="75" height="42" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="42" y="97" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Deploy Stage</text>
      <text x="42" y="110" font-size="8.0" fill="#16a34a" text-anchor="middle">PR Merge</text>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(222, 34)">
      <rect width="201" height="177" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Operational Characteristics:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Linear baton handoff of typed artifacts</text>
      <text x="10" y="49" font-size="8.0" fill="#334155">• Deterministic execution and verification</text>
      <text x="10" y="64" font-size="8.0" fill="#334155">• Early-exit aborts save downstream tokens</text>
      <text x="10" y="79" font-size="8.0" fill="#334155">• Zero concurrency race conditions</text>
      <line x1="10" y1="94" x2="191" y2="94" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="110" font-size="8" font-weight="700" fill="#15803d">Verdict: High Reliability, Low Fanout</text>
      <text x="10" y="125" font-size="8.0" fill="#64748b">Ideal for well-specified workflows</text>
      <text x="10" y="137" font-size="8.0" fill="#64748b">(code review, vulnerability triage,</text>
      <text x="10" y="149" font-size="8.0" fill="#64748b">automated release staging).</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- QUADRANT D: SHARED BLACKBOARD (TUPLE SPACE)                       -->
  <!-- ================================================================= -->
  <g transform="translate(485, 307)">
    <!-- Container Card with Header Band -->
    <rect width="435" height="223" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="435" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">(D) SHARED BLACKBOARD (TUPLE SPACE)</text>
    <rect x="290" y="4" width="133" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="356" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">Decoupled Asynchronous</text>

    <!-- Blackboard Diagram -->
    <g transform="translate(15, 38)">
      <!-- Central Blackboard -->
      <rect x="36" y="44" width="136" height="58" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="104" y="62" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Central Blackboard</text>
      <text x="104" y="75" font-size="8.0" fill="#64748b" text-anchor="middle">Linda Tuple Space (Redis)</text>
      <text x="104" y="89" font-size="8.0" font-weight="700" fill="#b45309" text-anchor="middle">[(&quot;task&quot;, id), (&quot;claim&quot;, lease)]</text>

      <!-- Worker 1 (Top Left) -->
      <rect x="5" y="4" width="60" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="35" y="20" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Agent 1</text>
      <path d="M 45 30 L 65 44" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)" marker-start="url(#arr-orange)"/>

      <!-- Worker 2 (Top Right) -->
      <rect x="142" y="4" width="60" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="172" y="20" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Agent 2</text>
      <path d="M 160 30 L 140 44" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)" marker-start="url(#arr-orange)"/>

      <!-- Worker 3 (Bottom Left) -->
      <rect x="5" y="116" width="60" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="35" y="132" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Agent 3</text>
      <path d="M 45 116 L 65 102" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)" marker-start="url(#arr-orange)"/>

      <!-- Worker 4 (Bottom Right) -->
      <rect x="142" y="116" width="60" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="172" y="132" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Agent 4</text>
      <path d="M 160 116 L 140 102" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)" marker-start="url(#arr-orange)"/>
    </g>

    <!-- Properties Panel -->
    <g transform="translate(222, 34)">
      <rect width="201" height="177" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Operational Characteristics:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Fully decoupled pub/sub pattern</text>
      <text x="10" y="49" font-size="8.0" fill="#334155">• Time &amp; space asynchronous coordination</text>
      <text x="10" y="64" font-size="8.0" fill="#334155">• Requires distributed leases &amp; TTLs</text>
      <text x="10" y="79" font-size="8.0" fill="#334155">• Optimistic concurrency control (OCC)</text>
      <line x1="10" y1="94" x2="191" y2="94" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="110" font-size="8" font-weight="700" fill="#b45309">Verdict: Flexible for Dynamic Search</text>
      <text x="10" y="125" font-size="8.0" fill="#64748b">High scale, but requires distributed lock</text>
      <text x="10" y="137" font-size="8.0" fill="#64748b">manager (DLM) to prevent lost updates</text>
      <text x="10" y="149" font-size="8.0" fill="#64748b">and concurrent write corruption.</text>
    </g>
  </g>
</g>
</svg>