<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .tick-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: #64748b; }
      .curve-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; line-height: 1.4; }
      .math-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="510" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <g transform="translate(25, 18)">
    <rect x="0" y="0" width="890" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="12" y="11" width="76" height="20" rx="4" fill="#e0e7ff"/>
    <text x="50" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4338ca">FIGURE 14.5</text>
    <text x="98" y="22" class="title">The Coordination Tax and Multi-Agent Amdahl’s Law</text>
    <text x="98" y="34" class="subtitle">Effective speedup versus agent scaling under communication overhead, serialization lag, and sequential bottlenecks</text>
  </g>

  <!-- Main Graph Panel (Left) -->
  <g transform="translate(25, 75)">
    <rect width="530" height="415" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>

    <!-- Negative Return Shaded Region -->
    <rect x="230" y="35" width="270" height="285" fill="#fff1f2" opacity="0.45"/>
    <line x1="230" y1="35" x2="230" y2="320" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="236" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#e11d48">Negative Return Collapse Zone</text>
    <text x="236" y="65" font-family="system-ui, sans-serif" font-size="8.5" fill="#be123c">Coordination Tax dominates; latency &amp; cost explode</text>

    <!-- Grid Lines -->
    <line x1="60" y1="264" x2="500" y2="264" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="208" x2="500" y2="208" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="152" x2="500" y2="152" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="96" x2="500" y2="96" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="40" x2="500" y2="40" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Axes -->
    <line x1="60" y1="320" x2="515" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <line x1="60" y1="320" x2="60" y2="20" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>

    <!-- Axis Labels -->
    <text x="280" y="380" class="axis-label" text-anchor="middle">Number of Concurrent Subagents (M)</text>
    <text x="20" y="24" class="axis-label">Speedup S(M)</text>

    <!-- X Ticks -->
    <text x="60" y="338" class="tick-label" text-anchor="middle">1</text>
    <text x="116" y="338" class="tick-label" text-anchor="middle">3</text>
    <text x="172" y="338" class="tick-label" text-anchor="middle">5</text>
    <text x="228" y="338" class="tick-label" text-anchor="middle">7</text>
    <text x="284" y="338" class="tick-label" text-anchor="middle">9</text>
    <text x="340" y="338" class="tick-label" text-anchor="middle">11</text>
    <text x="396" y="338" class="tick-label" text-anchor="middle">13</text>
    <text x="480" y="338" class="tick-label" text-anchor="middle">16</text>

    <!-- Y Ticks: 1x, 2x, 4x, 6x, 8x, 10x -->
    <text x="52" y="324" class="tick-label" text-anchor="end">1×</text>
    <text x="52" y="268" class="tick-label" text-anchor="end">2×</text>
    <text x="52" y="212" class="tick-label" text-anchor="end">4×</text>
    <text x="52" y="156" class="tick-label" text-anchor="end">6×</text>
    <text x="52" y="100" class="tick-label" text-anchor="end">8×</text>
    <text x="52" y="44" class="tick-label" text-anchor="end">10×</text>

    <!-- Curve 1: Ideal Linear Speedup S = M (Dashed slate) -->
    <line x1="60" y1="320" x2="340" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="310" y="32" class="curve-label" fill="#64748b">Ideal Linear: S(M) = M</text>

    <!-- Curve 2: Classical Amdahl’s Law (s = 0.12) -->
    <path d="M 60 320 Q 140 225 228 165 T 480 80" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="405" y="74" class="curve-label" fill="#1d4ed8">Amdahl’s Law (s = 0.12)</text>

    <!-- Curve 3: Hierarchical Supervisor (s = 0.12, linear tax O(M)) -->
    <path d="M 60 320 C 110 245, 155 198, 195 198 C 250 198, 340 225, 480 260" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <text x="340" y="248" class="curve-label" fill="#047857">Hierarchical Tree (O(M) Tax)</text>

    <!-- Curve 4: Peer-to-Peer Swarm (quadratic tax O(M²)) -->
    <!-- Curves gracefully into the collapse zone, ending at y=355 without touching label -->
    <path d="M 60 320 C 90 260, 115 235, 140 235 C 170 240, 210 285, 250 330 C 275 350, 310 355, 360 356" fill="none" stroke="#e11d48" stroke-width="2.5"/>
    <text x="85" y="225" class="curve-label" fill="#be123c">Peer-to-Peer Debate: O(M²) Tax</text>
    <text x="366" y="358" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#be123c">S(M) &lt; 1× (Thrashing)</text>

    <!-- Optimal Point Marker on Hierarchical Curve -->
    <circle cx="195" cy="198" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <rect x="142" y="152" width="106" height="34" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="195" y="165" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#065f46" text-anchor="middle">Optimal Scaling Point</text>
    <text x="195" y="178" font-family="ui-monospace, monospace" font-size="8" fill="#047857" text-anchor="middle">M* = 4 to 6 Agents</text>
    <line x1="195" y1="186" x2="195" y2="193" stroke="#10b981" stroke-width="1.2"/>
  </g>

  <!-- Explanatory Decomposition Cards (Right) -->
  <g transform="translate(575, 75)">
    <!-- Card 1: The Governing Formula -->
    <rect width="340" height="102" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect width="340" height="25" rx="8" fill="#eef2ff"/>
    <text x="12" y="17" class="card-title" fill="#3730a3">Multi-Agent Amdahl’s Law Formulation</text>
    <rect x="14" y="34" width="312" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="170" y="54" text-anchor="middle" class="math-text" fill="#1e1b4b" font-weight="700">S(M) = 1 / [ s + (1-s)/M + α·M² + β·M ]</text>
    <text x="14" y="80" class="card-desc">• s: Strictly sequential fraction (task spec, root merge)</text>
    <text x="14" y="93" class="card-desc">• α·M²: Pairwise debate &amp; consensus sync tax (P2P)</text>
  </g>

  <g transform="translate(575, 190)">
    <!-- Card 2: Sources of the Coordination Tax -->
    <rect width="340" height="154" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect width="340" height="25" rx="8" fill="#fff7ed"/>
    <text x="12" y="17" class="card-title" fill="#9a3412">The Three Pillars of Coordination Tax</text>
    
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c2d12">1. Attention KV Re-Encoding Overhead (β·M):</text>
    <text x="12" y="57" class="card-desc">Every subagent requires prompt preamble, schemas, and history.</text>
    <text x="12" y="69" class="card-desc">Prefix cache misses multiply token load across inference engines.</text>

    <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c2d12">2. Communication Serialization Latency (α·M²):</text>
    <text x="12" y="99" class="card-desc">Translating internal states into JSON-RPC messages and waiting</text>
    <text x="12" y="111" class="card-desc">for round-trip HTTP turns introduces massive network jitter.</text>

    <text x="12" y="128" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c2d12">3. Correlated Failure Amplification:</text>
    <text x="12" y="141" class="card-desc">Shared base model weights induce identical systematic errors.</text>
  </g>

  <g transform="translate(575, 356)">
    <!-- Card 3: Systems Takeaways -->
    <rect width="340" height="134" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect width="340" height="25" rx="8" fill="#ecfdf5"/>
    <text x="12" y="17" class="card-title" fill="#065f46">Core Systems Invariants for Multi-Agent Scale</text>
    <text x="12" y="43" class="card-desc"><tspan font-weight="700" fill="#064e3b">✔ Bound Subagent Fanout:</tspan> Keep M ≤ 4–6 per supervisor.</text>
    <text x="12" y="59" class="card-desc"><tspan font-weight="700" fill="#064e3b">✔ Partition Independent Sub-tasks:</tspan> Minimize shared state.</text>
    <text x="12" y="75" class="card-desc"><tspan font-weight="700" fill="#064e3b">✔ Replace Debate with Oracles:</tspan> Use compilers &amp; test suites</text>
    <text x="12" y="89" class="card-desc">rather than cross-agent LLM consensus voting.</text>
    <text x="12" y="105" class="card-desc"><tspan font-weight="700" fill="#064e3b">✔ Enforce Early-Exit Aborts:</tspan> Prune failing branches instantly</text>
    <text x="12" y="119" class="card-desc">to protect the cluster token and financial budget.</text>
  </g>
</svg>