<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Base Canvas -->
  <rect width="940" height="480" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Framing Card -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: SPEEDUP SCALING GRAPH                                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Container Card with Header Band -->
    <rect x="0" y="0" width="525" height="410" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">SPEEDUP SCALING CURVES VS. CONCURRENT SUBAGENT FANOUT</text>

    <!-- Negative Return Shaded Collapse Zone -->
    <rect x="228" y="45" width="252" height="285" fill="#fee2e2" opacity="0.5"/>
    <line x1="228" y1="45" x2="228" y2="330" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="236" y="60" font-size="8.5" font-weight="700" fill="#991b1b">Negative Return Collapse Zone</text>
    <text x="236" y="72" font-size="8.0" fill="#dc2626">Coordination tax dominates; latency &amp; cost explode</text>

    <!-- Background Grid Lines -->
    <line x1="60" y1="274" x2="480" y2="274" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="218" x2="480" y2="218" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="162" x2="480" y2="162" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="106" x2="480" y2="106" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="50" x2="480" y2="50" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Coordinate Axes -->
    <line x1="60" y1="330" x2="495" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <line x1="60" y1="330" x2="60" y2="35" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Axis Labels -->
    <text x="270" y="380" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Number of Concurrent Subagents (M)</text>
    <text x="20" y="38" font-size="9" font-weight="600" fill="#334155">Speedup S(M)</text>

    <!-- X-Axis Ticks -->
    <text x="60" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">1</text>
    <text x="116" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">3</text>
    <text x="172" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">5</text>
    <text x="228" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">7</text>
    <text x="284" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">9</text>
    <text x="340" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">11</text>
    <text x="396" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">13</text>
    <text x="480" y="346" font-size="8.5" fill="#64748b" text-anchor="middle">16</text>

    <!-- Y-Axis Ticks -->
    <text x="52" y="333" font-size="8.5" fill="#64748b" text-anchor="end">1×</text>
    <text x="52" y="277" font-size="8.5" fill="#64748b" text-anchor="end">2×</text>
    <text x="52" y="221" font-size="8.5" fill="#64748b" text-anchor="end">4×</text>
    <text x="52" y="165" font-size="8.5" fill="#64748b" text-anchor="end">6×</text>
    <text x="52" y="109" font-size="8.5" fill="#64748b" text-anchor="end">8×</text>
    <text x="52" y="53" font-size="8.5" fill="#64748b" text-anchor="end">10×</text>

    <!-- Curve 1: Ideal Linear Speedup -->
    <line x1="60" y1="330" x2="340" y2="50" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="310" y="42" font-size="8" font-weight="700" fill="#64748b">Ideal Linear: S(M) = M</text>

    <!-- Curve 2: Classical Amdahl's Law (s = 0.12) -->
    <path d="M 60 330 Q 140 235 228 175 T 480 90" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="400" y="84" font-size="8" font-weight="700" fill="#0369a1">Amdahl's Law (s = 0.12)</text>

    <!-- Curve 3: Hierarchical Supervisor Tree (O(M) Tax) -->
    <path d="M 60 330 C 110 255, 155 208, 195 208 C 250 208, 340 235, 480 270" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="340" y="258" font-size="8" font-weight="700" fill="#15803d">Hierarchical Tree (O(M) Tax)</text>

    <!-- Optimal Operating Point Marker -->
    <circle cx="195" cy="208" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
    <rect x="142" y="162" width="106" height="34" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
    <text x="195" y="175" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Optimal Scaling Point</text>
    <text x="195" y="188" font-size="8.0" fill="#16a34a" text-anchor="middle">M* = 4 to 6 Agents</text>
    <line x1="195" y1="196" x2="195" y2="203" stroke="#16a34a" stroke-width="1.2"/>

    <!-- Curve 4: Peer-to-Peer Swarm (O(M²) Tax) -->
    <path d="M 60 330 C 90 270, 115 245, 140 245 C 170 250, 210 295, 250 340 C 275 360, 310 365, 360 366" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="85" y="235" font-size="8" font-weight="700" fill="#991b1b">Peer-to-Peer Debate: O(M²) Tax</text>
    <text x="366" y="368" font-size="8" font-weight="700" fill="#991b1b">S(M) &lt; 1× (Thrashing)</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: MATHEMATICAL FORMULATION & SYSTEMS INVARIANTS       -->
  <!-- ================================================================= -->
  <g transform="translate(580, 75)">
    <!-- Card 1: The Governing Formula -->
    <g transform="translate(0, 0)">
      <rect width="340" height="114" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <rect width="340" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">MULTI-AGENT AMDAHL'S LAW FORMULATION</text>
      
      <!-- Formula Inner Block -->
      <rect x="12" y="32" width="316" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="170" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">S(M) = 1 / [ s + (1-s)/M + α·M² + β·M ]</text>
      
      <!-- Parameter Definitions -->
      <text x="14" y="74" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#0f172a">• s:</tspan> Strictly sequential fraction (task spec, root merge)</text>
      <text x="14" y="88" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#0f172a">• α·M²:</tspan> Pairwise debate &amp; consensus sync tax (P2P)</text>
      <text x="14" y="102" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#0f172a">• β·M:</tspan> Context broadcast &amp; per-agent token preamble overhead</text>
    </g>

    <!-- Card 2: Sources of the Coordination Tax -->
    <g transform="translate(0, 126)">
      <rect width="340" height="136" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect width="340" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">THE THREE PILLARS OF COORDINATION TAX</text>

      <g transform="translate(14, 32)">
        <text x="0" y="10" font-size="8" font-weight="700" fill="#b45309">1. Attention KV Re-Encoding Overhead (β·M):</text>
        <text x="0" y="21" font-size="8.0" fill="#64748b">Prompt preamble &amp; history re-encoded per subagent; cache misses multiply load.</text>

        <text x="0" y="42" font-size="8" font-weight="700" fill="#b45309">2. Communication Serialization Latency (α·M²):</text>
        <text x="0" y="53" font-size="8.0" fill="#64748b">Translating state to JSON-RPC across round-trip HTTP turns causes network jitter.</text>

        <text x="0" y="74" font-size="8" font-weight="700" fill="#b45309">3. Correlated Failure Amplification:</text>
        <text x="0" y="85" font-size="8.0" fill="#64748b">Shared base model weights induce identical systematic errors and collective drift.</text>
      </g>
    </g>

    <!-- Card 3: Core Systems Invariants -->
    <g transform="translate(0, 274)">
      <rect width="340" height="136" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect width="340" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">CORE SYSTEMS INVARIANTS FOR SCALE</text>

      <g transform="translate(14, 34)">
        <text x="0" y="10" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#15803d">✔ Bound Subagent Fanout:</tspan> Keep M ≤ 4–6 per supervisor.</text>
        <text x="0" y="26" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#15803d">✔ Partition Independent Sub-tasks:</tspan> Minimize shared mutable context.</text>
        <text x="0" y="42" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#15803d">✔ Replace Debate with Oracles:</tspan> Use compilers &amp; test suites, not voting.</text>
        <text x="0" y="58" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#15803d">✔ Enforce Early-Exit Aborts:</tspan> Prune failing branches instantly to save tokens.</text>
        <text x="0" y="74" font-size="8.0" fill="#334155"><tspan font-weight="700" fill="#15803d">✔ Attenuate Tool Leases:</tspan> Monotonic cryptographic authority scoping.</text>
      </g>
    </g>
  </g>
</g>
</svg>