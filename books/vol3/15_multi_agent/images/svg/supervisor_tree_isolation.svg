<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; text-anchor: middle; }
      .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #334155; }
      .badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; font-weight: 700; }
      .code-mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-tree" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="550" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <!-- Top Title Header -->
  <g transform="translate(25, 16)">
    <rect x="0" y="0" width="890" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">ERLANG-STYLE SUPERVISOR TREES AND FAULT-ISOLATION FIREWALLS</text>
  </g>

  <!-- Left Column: The Supervisor Tree & Actor Mailboxes -->
  <g transform="translate(25, 75)">
    <rect width="470" height="455" rx="2" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect width="470" height="28" rx="2" fill="#eef2ff"/>
    <text x="14" y="19" class="panel-title" fill="#3730a3">Hierarchical Actor Tree with Private Mailboxes</text>
    <rect x="360" y="5" width="98" height="18" rx="4" fill="#e0e7ff"/>
    <text x="409" y="17" text-anchor="middle" class="badge" fill="#4338ca">Erlang Pattern</text>

    <!-- Root Supervisor -->
    <g transform="translate(170, 38)">
      <rect x="0" y="0" width="130" height="38" rx="2" fill="#312e81" stroke="#1e1b4b" stroke-width="1.5"/>
      <text x="65" y="16" class="node-title" fill="#ffffff">Root Supervisor</text>
      <text x="65" y="29" class="node-sub" fill="#c7d2fe">Task Lifecycle &amp; Leases</text>
    </g>

    <!-- Connectors from Root to Sub-Supervisors -->
    <path d="M 235 76 L 235 96 L 115 96 L 115 110" fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrow-tree)"/>
    <path d="M 235 76 L 235 96 L 355 96 L 355 110" fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrow-tree)"/>

    <!-- Sub-Supervisor 1: Code Subsystem -->
    <g transform="translate(50, 112)">
      <rect x="0" y="0" width="130" height="36" rx="5" fill="#4338ca" stroke="#312e81" stroke-width="1.2"/>
      <text x="65" y="15" class="node-title" fill="#ffffff">Code Supervisor</text>
      <text x="65" y="27" class="node-sub" fill="#e0e7ff">Policy: one_for_one</text>
    </g>

    <!-- Sub-Supervisor 2: Verification Subsystem -->
    <g transform="translate(290, 112)">
      <rect x="0" y="0" width="130" height="36" rx="5" fill="#4338ca" stroke="#312e81" stroke-width="1.2"/>
      <text x="65" y="15" class="node-title" fill="#ffffff">Verify Supervisor</text>
      <text x="65" y="27" class="node-sub" fill="#e0e7ff">Policy: one_for_all</text>
    </g>

    <!-- Connectors to Worker Actors -->
    <path d="M 115 148 L 115 166 L 65 166 L 65 178" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-tree)"/>
    <path d="M 115 148 L 115 166 L 165 166 L 165 178" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-tree)"/>
    <path d="M 355 148 L 355 166 L 305 166 L 305 178" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-tree)"/>
    <path d="M 355 148 L 355 166 L 405 166 L 405 178" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-tree)"/>

    <!-- Worker 1: AST Parser -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="90" height="58" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1.2"/>
      <rect x="0" y="0" width="90" height="15" rx="4" fill="#e0e7ff"/>
      <text x="45" y="11" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#312e81" text-anchor="middle">Worker: AST</text>
      <rect x="6" y="20" width="78" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="30" class="code-mono" fill="#475569" text-anchor="middle">[Mailbox: 1 msg]</text>
      <text x="45" y="48" class="node-sub" fill="#059669">State: IDLE</text>
    </g>

    <!-- Worker 2: Code Editor -->
    <g transform="translate(120, 180)">
      <rect x="0" y="0" width="90" height="58" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1.2"/>
      <rect x="0" y="0" width="90" height="15" rx="4" fill="#e0e7ff"/>
      <text x="45" y="11" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#312e81" text-anchor="middle">Worker: Coder</text>
      <rect x="6" y="20" width="78" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="30" class="code-mono" fill="#475569" text-anchor="middle">[Mailbox: 0 msg]</text>
      <text x="45" y="48" class="node-sub" fill="#d97706">State: INFER</text>
    </g>

    <!-- Worker 3: Linter/Typecheck -->
    <g transform="translate(260, 180)">
      <rect x="0" y="0" width="90" height="58" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1.2"/>
      <rect x="0" y="0" width="90" height="15" rx="4" fill="#e0e7ff"/>
      <text x="45" y="11" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#312e81" text-anchor="middle">Worker: Types</text>
      <rect x="6" y="20" width="78" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="30" class="code-mono" fill="#475569" text-anchor="middle">[Mailbox: 2 msg]</text>
      <text x="45" y="48" class="node-sub" fill="#059669">State: IDLE</text>
    </g>

    <!-- Worker 4: Test Runner (FAILS) -->
    <g transform="translate(360, 180)">
      <rect x="0" y="0" width="90" height="58" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="0" y="0" width="90" height="15" rx="4" fill="#ffe4e6"/>
      <text x="45" y="11" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#9f1239" text-anchor="middle">Worker: Pytest</text>
      <rect x="6" y="20" width="78" height="14" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
      <text x="45" y="30" class="code-mono" fill="#dc2626" text-anchor="middle">[CRASH: OOM]</text>
      <text x="45" y="48" class="node-sub" fill="#e11d48">Exit Code 137</text>
    </g>

    <!-- Supervisor Explanation Sub-Panel with proper line wrapping -->
    <g transform="translate(15, 252)">
      <rect width="440" height="190" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e1b4b">Actor Invariants in Production:</text>

      <text x="12" y="36" class="body-text" font-weight="700" fill="#312e81">1. Zero Shared State:</text>
      <text x="24" y="49" class="body-text">Actors never share memory or prompt contexts. All coordination occurs</text>
      <text x="24" y="61" class="body-text">via immutable, serialized JSON-RPC messages across private channels.</text>

      <text x="12" y="78" class="body-text" font-weight="700" fill="#312e81">2. Private Mailbox Queues:</text>
      <text x="24" y="91" class="body-text">Messages buffer in FIFO actor mailboxes. Slow generation turns in Coder</text>
      <text x="24" y="103" class="body-text">do not block or freeze concurrent AST parsing or Typechecker workers.</text>

      <text x="12" y="120" class="body-text" font-weight="700" fill="#312e81">3. Fail-Stop Encapsulation:</text>
      <text x="24" y="133" class="body-text">When Pytest crashes (OOM / exit code 137), supervisor traps the signal.</text>
      <text x="24" y="145" class="body-text">Fatal worker exceptions are contained and never propagate unhandled.</text>

      <text x="12" y="162" class="body-text" font-weight="700" fill="#312e81">4. Monotonic Capability Attenuation:</text>
      <text x="24" y="175" class="body-text">Child subagents receive strictly attenuated cryptographic tokens,</text>
      <text x="24" y="187" class="body-text">preventing unauthorized filesystem access or privilege escalation.</text>
    </g>
  </g>

  <!-- Right Column: Restart Policies & Isolation Firewalls -->
  <g transform="translate(515, 75)">
    <!-- Top Card: Restart Strategies -->
    <rect width="400" height="215" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect width="400" height="28" rx="2" fill="#f1f5f9"/>
    <text x="14" y="19" class="panel-title" fill="#1e293b">Supervision Restart Strategies</text>
    <rect x="295" y="5" width="95" height="18" rx="4" fill="#e2e8f0"/>
    <text x="342" y="17" text-anchor="middle" class="badge" fill="#334155">Fault Policies</text>

    <!-- Strategy 1: one_for_one -->
    <g transform="translate(15, 38)">
      <rect width="370" height="74" rx="5" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Policy: one_for_one (Localized Worker Restart)</text>
      <text x="12" y="34" class="body-text">• <tspan font-weight="600">Action:</tspan> If Worker X crashes, restart ONLY Worker X with empty context.</text>
      <text x="12" y="48" class="body-text">• <tspan font-weight="600">Peers:</tspan> Sibling workers continue running with zero state interruption.</text>
      <text x="12" y="62" class="body-text">• <tspan font-weight="600">Use Case:</tspan> Stateless tasks, independent file linting, unit test executions.</text>
    </g>

    <!-- Strategy 2: one_for_all -->
    <g transform="translate(15, 122)">
      <rect width="370" height="74" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">Policy: one_for_all (Atomic Group Reset)</text>
      <text x="12" y="34" class="body-text">• <tspan font-weight="600">Action:</tspan> If Worker X crashes, terminate ALL sibling workers in group.</text>
      <text x="12" y="48" class="body-text">• <tspan font-weight="600">Rollback:</tspan> Execute compensating transactions (Saga) to restore clean state.</text>
      <text x="12" y="62" class="body-text">• <tspan font-weight="600">Use Case:</tspan> Interdependent refactoring where tainted partial code ruins tests.</text>
    </g>
  </g>

  <!-- Bottom Right Card: Concurrency Leases & Circuit Breakers -->
  <g transform="translate(515, 305)">
    <rect width="400" height="225" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect width="400" height="28" rx="2" fill="#fff1f2"/>
    <text x="14" y="19" class="panel-title" fill="#9f1239">Concurrency Leases &amp; Isolation Firewalls</text>
    <rect x="295" y="5" width="95" height="18" rx="4" fill="#ffe4e6"/>
    <text x="342" y="17" text-anchor="middle" class="badge" fill="#be123c">Firewalls</text>

    <g transform="translate(15, 38)">
      <!-- Feature 1: Distributed Workspace Leases -->
      <rect width="370" height="78" rx="5" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Distributed Workspace Leases (TTL Locks):</text>
      <text x="12" y="34" class="body-text">When parallel agents access a git workspace or database row, they acquire</text>
      <text x="12" y="48" class="body-text">a time-bounded lease (e.g., 30s TTL). If an agent livelocks or crashes,</text>
      <text x="12" y="62" class="body-text">the lease automatically expires, preventing indefinite cluster deadlock.</text>
    </g>

    <g transform="translate(15, 126)">
      <!-- Feature 2: Rate Limiters & Circuit Breakers -->
      <rect width="370" height="84" rx="5" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Adaptive Circuit Breakers &amp; Backoff Jitter:</text>
      <text x="12" y="34" class="body-text">If an upstream foundation model or external tool API returns 429 / 503,</text>
      <text x="12" y="48" class="body-text">the circuit opens immediately. Subagent retries apply exponential backoff</text>
      <text x="12" y="62" class="body-text">with Decorrelated Jitter, preventing thundering herd cascading collapse.</text>
    </g>
  </g>
</svg>