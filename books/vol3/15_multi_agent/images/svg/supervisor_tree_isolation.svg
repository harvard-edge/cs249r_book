<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers matching Figure 1.10 standard -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Base Canvas -->
  <rect width="940" height="570" fill="#ffffff"/>

  <!-- Outer Architecture Framing Card -->
  <rect x="20" y="20" width="900" height="530" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">ERLANG-STYLE SUPERVISOR TREES AND FAULT-ISOLATION FIREWALLS</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Supervisory actor hierarchies, private mailbox queues, one-for-one / one-for-all restart semantics, and distributed locks</text>

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: HIERARCHICAL ACTOR TREE & MAILBOX QUEUES              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Subsystem Container Card with Header Band -->
    <rect width="445" height="455" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="445" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">HIERARCHICAL ACTOR TREE WITH PRIVATE MAILBOXES</text>
    <rect x="335" y="4" width="98" height="16" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="384" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Erlang Pattern</text>

    <!-- Root Supervisor -->
    <rect x="152" y="36" width="141" height="32" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="222" y="49" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Root Supervisor</text>
    <text x="222" y="60" font-size="7.5" fill="#64748b" text-anchor="middle">Task Lifecycle &amp; Leases</text>

    <!-- Connectors from Root to Sub-Supervisors -->
    <path d="M 222 68 L 222 82 L 113 82 L 113 96" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 222 68 L 222 82 L 332 82 L 332 96" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

    <!-- Sub-Supervisor 1: Code Subsystem -->
    <rect x="43" y="96" width="140" height="32" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="113" y="109" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Code Supervisor</text>
    <text x="113" y="120" font-size="7.5" fill="#6d28d9" text-anchor="middle">Policy: one_for_one</text>

    <!-- Sub-Supervisor 2: Verification Subsystem -->
    <rect x="262" y="96" width="140" height="32" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="332" y="109" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Verify Supervisor</text>
    <text x="332" y="120" font-size="7.5" fill="#6d28d9" text-anchor="middle">Policy: one_for_all</text>

    <!-- Connectors from Sub-Supervisors to Worker Actors -->
    <path d="M 113 128 L 113 140 L 58 140 L 58 152" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 113 128 L 113 140 L 168 140 L 168 152" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 332 128 L 332 140 L 277 140 L 277 152" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 332 128 L 332 140 L 387 140 L 387 152" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

    <!-- Worker 1: AST Parser -->
    <g transform="translate(12, 152)">
      <rect width="92" height="62" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="92" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="46" y="12" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Worker: AST</text>
      <rect x="7" y="22" width="78" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="46" y="33" font-size="7.5" fill="#64748b" text-anchor="middle">[Mailbox: 1 msg]</text>
      <text x="46" y="52" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle">State: IDLE</text>
    </g>

    <!-- Worker 2: Code Editor -->
    <g transform="translate(122, 152)">
      <rect width="92" height="62" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="92" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="46" y="12" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Worker: Coder</text>
      <rect x="7" y="22" width="78" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="46" y="33" font-size="7.5" fill="#64748b" text-anchor="middle">[Mailbox: 0 msg]</text>
      <text x="46" y="52" font-size="7.5" font-weight="700" fill="#d97706" text-anchor="middle">State: INFER</text>
    </g>

    <!-- Worker 3: Linter/Types -->
    <g transform="translate(231, 152)">
      <rect width="92" height="62" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="92" height="16" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="46" y="12" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Worker: Types</text>
      <rect x="7" y="22" width="78" height="15" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="46" y="33" font-size="7.5" fill="#64748b" text-anchor="middle">[Mailbox: 2 msg]</text>
      <text x="46" y="52" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle">State: IDLE</text>
    </g>

    <!-- Worker 4: Test Runner (FAILS) -->
    <g transform="translate(341, 152)">
      <rect width="92" height="62" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect width="92" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="46" y="12" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Worker: Pytest</text>
      <rect x="7" y="22" width="78" height="15" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="46" y="33" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">[CRASH: OOM]</text>
      <text x="46" y="52" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">Exit Code 137</text>
    </g>

    <!-- Actor Invariants Sub-Panel -->
    <g transform="translate(12, 228)">
      <rect width="421" height="215" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="421" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="12" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">ACTOR INVARIANTS IN PRODUCTION</text>

      <g transform="translate(12, 34)">
        <text x="0" y="8" font-size="8" font-weight="700" fill="#0f172a">1. Zero Shared State:</text>
        <text x="0" y="20" font-size="7.5" fill="#64748b">Actors never share memory or prompt contexts. All coordination occurs</text>
        <text x="0" y="31" font-size="7.5" fill="#64748b">via immutable, serialized JSON-RPC messages across private channels.</text>

        <text x="0" y="49" font-size="8" font-weight="700" fill="#0f172a">2. Private Mailbox Queues:</text>
        <text x="0" y="61" font-size="7.5" fill="#64748b">Messages buffer in FIFO actor mailboxes. Slow generation turns in Coder</text>
        <text x="0" y="72" font-size="7.5" fill="#64748b">do not block or freeze concurrent AST parsing or Typechecker workers.</text>

        <text x="0" y="90" font-size="8" font-weight="700" fill="#0f172a">3. Fail-Stop Encapsulation:</text>
        <text x="0" y="102" font-size="7.5" fill="#64748b">When Pytest crashes (OOM / exit code 137), supervisor traps the signal.</text>
        <text x="0" y="113" font-size="7.5" fill="#64748b">Fatal worker exceptions are contained and never propagate unhandled.</text>

        <text x="0" y="131" font-size="8" font-weight="700" fill="#0f172a">4. Monotonic Capability Attenuation:</text>
        <text x="0" y="143" font-size="7.5" fill="#64748b">Child subagents receive strictly attenuated cryptographic tokens,</text>
        <text x="0" y="154" font-size="7.5" fill="#64748b">preventing unauthorized filesystem access or privilege escalation.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: RESTART POLICIES & CONCURRENCY FIREWALLS           -->
  <!-- ================================================================= -->
  <g transform="translate(500, 75)">
    <!-- Top Card: Supervision Restart Strategies -->
    <g transform="translate(0, 0)">
      <rect width="400" height="220" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="400" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">SUPERVISION RESTART STRATEGIES</text>
      <rect x="290" y="4" width="98" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="339" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">Fault Policies</text>

      <!-- Strategy 1: one_for_one -->
      <g transform="translate(12, 34)">
        <rect width="376" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="376" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">POLICY: one_for_one (Localized Worker Restart)</text>
        <text x="10" y="34" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Action:</tspan> If Worker X crashes, restart ONLY Worker X with empty context.</text>
        <text x="10" y="48" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Peers:</tspan> Sibling workers continue running with zero state interruption.</text>
        <text x="10" y="62" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Use Case:</tspan> Stateless tasks, independent file linting, unit test executions.</text>
      </g>

      <!-- Strategy 2: one_for_all -->
      <g transform="translate(12, 126)">
        <rect width="376" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="376" height="20" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#b45309">POLICY: one_for_all (Atomic Group Reset)</text>
        <text x="10" y="34" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Action:</tspan> If Worker X crashes, terminate ALL sibling workers in group.</text>
        <text x="10" y="48" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Rollback:</tspan> Execute compensating transactions (Saga) to restore clean state.</text>
        <text x="10" y="62" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">• Use Case:</tspan> Interdependent refactoring where tainted partial code ruins tests.</text>
      </g>
    </g>

    <!-- Bottom Card: Concurrency Leases & Isolation Firewalls -->
    <g transform="translate(0, 235)">
      <rect width="400" height="220" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect width="400" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">CONCURRENCY LEASES &amp; ISOLATION FIREWALLS</text>
      <rect x="290" y="4" width="98" height="16" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <text x="339" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Firewalls</text>

      <!-- Feature 1: Distributed Workspace Leases -->
      <g transform="translate(12, 34)">
        <rect width="376" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Distributed Workspace Leases (TTL Locks):</text>
        <text x="10" y="32" font-size="7.5" fill="#64748b">When parallel agents access a git workspace or database row, they acquire</text>
        <text x="10" y="44" font-size="7.5" fill="#64748b">a time-bounded lease (e.g., 30s TTL). If an agent livelocks or crashes,</text>
        <text x="10" y="56" font-size="7.5" fill="#64748b">the lease automatically expires, preventing indefinite cluster deadlock.</text>
      </g>

      <!-- Feature 2: Rate Limiters & Circuit Breakers -->
      <g transform="translate(12, 126)">
        <rect width="376" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Adaptive Circuit Breakers &amp; Backoff Jitter:</text>
        <text x="10" y="32" font-size="7.5" fill="#64748b">If an upstream foundation model or external tool API returns 429 / 503,</text>
        <text x="10" y="44" font-size="7.5" fill="#64748b">the circuit opens immediately. Subagent retries apply exponential backoff</text>
        <text x="10" y="56" font-size="7.5" fill="#64748b">with Decorrelated Jitter, preventing thundering herd cascading collapse.</text>
      </g>
    </g>
  </g>
</svg>