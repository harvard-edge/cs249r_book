<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1160" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL (a): HIERARCHICAL SUPERVISION TREE & FAULT CONTAINMENT      -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Container Card -->
    <rect width="670" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 666 0 Q 670 0 670 4 L 670 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(a) Erlang-Style Actor Supervision Tree &amp; Fault Boundary</text>
    <text x="654" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">OTP Supervision Hierarchy</text>

    <!-- Root Supervisor (A_0) -->
    <g transform="translate(225, 45)">
      <rect width="220" height="56" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <rect width="220" height="20" rx="4" fill="#eff6ff"/>
      <text x="110" y="14" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">Root Supervisor (A_0)</text>
      <text x="110" y="34" font-size="8.5" fill="#334155" text-anchor="middle">Process Group Leader • Lease Manager</text>
      <text x="110" y="47" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="middle">Intensity: Max 3 Restarts / 60s</text>
    </g>

    <!-- Branch Arrows to Sub-Supervisors -->
    <path d="M 280 101 L 280 122 L 145 122 L 145 143" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
    <path d="M 390 101 L 390 122 L 525 122 L 525 143" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

    <!-- Sub-Supervisor 1: Code Subsystem -->
    <g transform="translate(35, 145)">
      <rect width="220" height="52" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
      <rect width="220" height="20" rx="4" fill="#f5f3ff"/>
      <text x="110" y="14" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">Code Supervisor (S_code)</text>
      <text x="110" y="33" font-size="8.5" font-weight="600" fill="#15803d" text-anchor="middle">Policy: one_for_one</text>
      <text x="110" y="45" font-size="7.5" fill="#64748b" text-anchor="middle">Isolated restarts of failed child</text>
    </g>

    <!-- Sub-Supervisor 2: Verification Subsystem -->
    <g transform="translate(415, 145)">
      <rect width="220" height="52" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
      <rect width="220" height="20" rx="4" fill="#f5f3ff"/>
      <text x="110" y="14" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">Verify Supervisor (S_test)</text>
      <text x="110" y="33" font-size="8.5" font-weight="600" fill="#b45309" text-anchor="middle">Policy: one_for_all</text>
      <text x="110" y="45" font-size="7.5" fill="#64748b" text-anchor="middle">Cascades restart across sibling fleet</text>
    </g>

    <!-- Connectors to Leaf Workers -->
    <!-- From S_code to W_ast & W_coder -->
    <path d="M 100 197 L 100 238" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 190 197 L 190 238" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

    <!-- From S_test to W_types & W_pytest -->
    <path d="M 480 197 L 480 238" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <path d="M 570 197 L 570 238" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

    <!-- Leaf Worker 1: AST Worker -->
    <g transform="translate(45, 240)">
      <rect width="110" height="110" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <rect width="110" height="20" rx="4" fill="#f1f5f9"/>
      <text x="55" y="14" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Worker: AST</text>
      <!-- Mailbox -->
      <rect x="10" y="27" width="90" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="55" y="41" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569" text-anchor="middle">Mailbox: 1 msg</text>
      <!-- Status Badge -->
      <rect x="10" y="52" width="90" height="18" rx="2" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="55" y="65" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">State: IDLE</text>
      <text x="55" y="86" font-size="7.5" fill="#64748b" text-anchor="middle">cgroup v2 sandbox</text>
      <text x="55" y="99" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="middle">PID: 10482</text>
    </g>

    <!-- Leaf Worker 2: Coder Worker -->
    <g transform="translate(165, 240)">
      <rect width="110" height="110" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <rect width="110" height="20" rx="4" fill="#f1f5f9"/>
      <text x="55" y="14" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Worker: Coder</text>
      <!-- Mailbox -->
      <rect x="10" y="27" width="90" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="55" y="41" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569" text-anchor="middle">Mailbox: 0 msg</text>
      <!-- Status Badge -->
      <rect x="10" y="52" width="90" height="18" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="55" y="65" font-size="8" font-weight="700" fill="#1d4ed8" text-anchor="middle">State: INFER</text>
      <text x="55" y="86" font-size="7.5" fill="#64748b" text-anchor="middle">Private git worktree</text>
      <text x="55" y="99" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="middle">PID: 10485</text>
    </g>

    <!-- Leaf Worker 3: Types Worker -->
    <g transform="translate(415, 240)">
      <rect width="115" height="110" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <rect width="115" height="20" rx="4" fill="#fffbeb"/>
      <text x="57" y="14" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Worker: Types</text>
      <!-- Mailbox -->
      <rect x="10" y="27" width="95" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="57" y="41" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569" text-anchor="middle">Mailbox: 2 msgs</text>
      <!-- Status Badge -->
      <rect x="10" y="52" width="95" height="18" rx="2" fill="#fffbeb" stroke="#fde68a"/>
      <text x="57" y="65" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">SIGKILL Pending</text>
      <text x="57" y="86" font-size="7.5" fill="#b45309" text-anchor="middle">Group reset via S_test</text>
      <text x="57" y="99" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="middle">PID: 10490</text>
    </g>

    <!-- Leaf Worker 4: Pytest Worker (CRASHED) -->
    <g transform="translate(545, 240)">
      <rect width="115" height="110" rx="4" fill="#fff1f2" stroke="#ef4444" stroke-width="1.5"/>
      <rect width="115" height="20" rx="4" fill="#fee2e2"/>
      <text x="57" y="14" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Worker: Pytest</text>
      <!-- Mailbox -->
      <rect x="10" y="27" width="95" height="20" rx="2" fill="#ffffff" stroke="#fca5a5"/>
      <text x="57" y="41" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">CRASH: OOM</text>
      <!-- Status Badge -->
      <rect x="10" y="52" width="95" height="18" rx="2" fill="#dc2626"/>
      <text x="57" y="65" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">EXIT CODE 137</text>
      <text x="57" y="86" font-size="7.5" fill="#991b1b" text-anchor="middle">Memory quota exceeded</text>
      <text x="57" y="99" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b" text-anchor="middle">PID: 10492 (Dead)</text>
    </g>

    <!-- Trapped Signal Arrow: Pytest -> S_test (Routed cleanly on the right side) -->
    <path d="M 640 240 L 640 180 L 635 180" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>
    <rect x="585" y="208" width="70" height="16" rx="2" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="620" y="219" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">Exit 137</text>

    <!-- Signal Propagation: S_test -> Types (one_for_all kill cleanly on the left) -->
    <path d="M 430 197 L 430 238" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-amber)"/>
    <rect x="388" y="208" width="52" height="16" rx="2" fill="#fffbeb" stroke="#fde68a"/>
    <text x="414" y="219" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#b45309" text-anchor="middle">SIGKILL</text>

    <!-- Bottom Isolation Firewall -->
    <g transform="translate(25, 365)">
      <rect width="620" height="98" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="620" height="20" rx="3" fill="#f1f5f9"/>
      <text x="12" y="14" font-size="9" font-weight="700" fill="#334155">Operating System &amp; Runtime Isolation Boundary</text>

      <!-- 3 Columns -->
      <!-- Col 1 -->
      <g transform="translate(15, 28)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0f172a">Zero Shared Memory:</text>
        <text x="0" y="26" font-size="8" fill="#475569">MicroVM / namespace isolation</text>
        <text x="0" y="39" font-size="8" fill="#475569">Dedicated prompt KV cache</text>
        <text x="0" y="52" font-size="8" fill="#475569">Immutable JSON-RPC envelopes</text>
      </g>
      <!-- Col 2 -->
      <g transform="translate(225, 28)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0f172a">Private Mailboxes:</text>
        <text x="0" y="26" font-size="8" fill="#475569">Bounded FIFO ingress queues</text>
        <text x="0" y="39" font-size="8" fill="#475569">Slow inference doesn't block</text>
        <text x="0" y="52" font-size="8" fill="#475569">Backpressure on mailbox saturation</text>
      </g>
      <!-- Col 3 -->
      <g transform="translate(435, 28)">
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0f172a">Fail-Stop Containment:</text>
        <text x="0" y="26" font-size="8" fill="#475569">OOM / fatal exit trapped by parent</text>
        <text x="0" y="39" font-size="8" fill="#475569">GPU memory instantly reclaimed</text>
        <text x="0" y="52" font-size="8" fill="#475569">Parent WAL logs crash event</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL (b): CONCURRENCY LEASES & RESTART POLICIES                  -->
  <!-- ================================================================= -->
  <g transform="translate(710, 20)">
    <!-- Container Card -->
    <rect width="430" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 426 0 Q 430 0 430 4 L 430 30 L 0 30 Z" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#15803d">(b) Concurrency Leases &amp; Restart Mechanics</text>
    <text x="414" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#16a34a" text-anchor="end">Runtime Leases</text>

    <!-- Concurrency Lease Protocol -->
    <g transform="translate(15, 45)">
      <rect width="400" height="175" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="400" height="20" rx="3" fill="#f8fafc"/>
      <text x="12" y="14" font-size="9.5" font-weight="700" fill="#1e293b">Distributed Workspace Lease Protocol (TTL Locks)</text>

      <!-- Protocol Sequence -->
      <!-- Step 1 -->
      <g transform="translate(15, 30)">
        <circle cx="10" cy="10" r="9" fill="#eff6ff" stroke="#2563eb"/>
        <text x="10" y="13" font-size="8" font-weight="700" fill="#1e40af" text-anchor="middle">1</text>
        <text x="28" y="13" font-size="8.5" font-weight="600" fill="#0f172a">Grant Lease:</text>
        <text x="95" y="13" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#2563eb">⟨LeaseID, τ_lease = 30s, Token⟩</text>
        <text x="28" y="26" font-size="7.5" fill="#64748b">Supervisor delegates task with temporal lock on branch/files.</text>
      </g>
      <!-- Step 2 -->
      <g transform="translate(15, 66)">
        <circle cx="10" cy="10" r="9" fill="#ecfdf5" stroke="#16a34a"/>
        <text x="10" y="13" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">2</text>
        <text x="28" y="13" font-size="8.5" font-weight="600" fill="#0f172a">Periodic Heartbeat:</text>
        <text x="135" y="13" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Worker &lt;-&gt; Heartbeat Ping (5s)</text>
        <text x="28" y="26" font-size="7.5" fill="#64748b">Maintains lease active during normal token generation.</text>
      </g>
      <!-- Step 3 -->
      <g transform="translate(15, 102)">
        <circle cx="10" cy="10" r="9" fill="#fff1f2" stroke="#dc2626"/>
        <text x="10" y="13" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">3</text>
        <text x="28" y="13" font-size="8.5" font-weight="600" fill="#dc2626">Lease Expiration / Crash:</text>
        <text x="165" y="13" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">t &gt; τ_lease (Timeout)</text>
        <text x="28" y="26" font-size="7.5" fill="#64748b">Worker stalls or dies; heartbeat fails; supervisor traps timeout.</text>
      </g>
      <!-- Step 4 -->
      <g transform="translate(15, 138)">
        <circle cx="10" cy="10" r="9" fill="#eff6ff" stroke="#7c3aed"/>
        <text x="10" y="13" font-size="8" font-weight="700" fill="#7c3aed" text-anchor="middle">4</text>
        <text x="28" y="13" font-size="8.5" font-weight="600" fill="#7c3aed">Forced Resource Reclaim:</text>
        <text x="165" y="13" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#7c3aed">SIGKILL + Worktree Pruned</text>
        <text x="28" y="26" font-size="7.5" fill="#64748b">Lease manager unlocks resources; prevents cluster deadlock.</text>
      </g>
    </g>

    <!-- Supervision Strategy Comparison -->
    <g transform="translate(15, 232)">
      <rect width="400" height="230" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="400" height="20" rx="3" fill="#f8fafc"/>
      <text x="12" y="14" font-size="9.5" font-weight="700" fill="#1e293b">Restart Policies: one_for_one vs. one_for_all</text>

      <!-- Strategy 1: one_for_one -->
      <g transform="translate(12, 28)">
        <rect width="376" height="85" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">POLICY: one_for_one (Isolated Worker Restart)</text>
        <text x="12" y="32" font-size="8" fill="#166534">• Action: If Worker X crashes, restart ONLY Worker X with empty context.</text>
        <text x="12" y="46" font-size="8" fill="#166534">• Sibling State: Sibling workers continue running with zero interruption.</text>
        <text x="12" y="60" font-size="8" fill="#166534">Optimal Workload: Independent, stateless sub-tasks (file linting,</text>
        <text x="18" y="72" font-size="8" fill="#166534">isolated unit tests, AST symbol resolution).</text>
      </g>

      <!-- Strategy 2: one_for_all -->
      <g transform="translate(12, 125)">
        <rect width="376" height="92" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">POLICY: one_for_all (Atomic Fleet Reset)</text>
        <text x="12" y="32" font-size="8" fill="#92400e">• Action: If Worker X crashes, terminate ALL sibling workers in group.</text>
        <text x="12" y="46" font-size="8" fill="#92400e">Rollback: Execute compensating transaction (Saga) to restore clean base.</text>
        <text x="12" y="60" font-size="8" fill="#92400e">• Optimal Workload: Coupled refactoring where a dirty intermediate diff</text>
        <text x="18" y="72" font-size="8" fill="#92400e">produced by Worker X poisons the operational premise of sibling tests.</text>
      </g>
    </g>
  </g>
</svg>