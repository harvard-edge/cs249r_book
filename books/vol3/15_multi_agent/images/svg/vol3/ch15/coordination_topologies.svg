<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#92400E"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="560" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM CONTEXT                                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 20)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.3">MULTI-AGENT COORDINATION TOPOLOGIES: GRAPH COMPLEXITY &amp; BOUNDARIES</text>
    <text x="0" y="38" font-size="11" fill="#475569">Architectural Trade-Offs in Communication Edge Density, State Isolation, and Failure Containment</text>

    <!-- Formula Box -->
    <rect x="730" y="4" width="380" height="38" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="742" y="20" font-size="10" font-weight="700" fill="#581C87">Coordination Theorem:</text>
    <text x="880" y="20" font-size="9" font-family="'SF Mono', monospace" fill="#1E293B">|E_mesh| = O(M^2)  vs  |E_tree| = M - 1</text>
    <text x="742" y="34" font-size="8.5" fill="#6B21A8">Centralized dispatch reduces semantic deadlock entropy</text>
  </g>

  <!-- ================================================================= -->
  <!-- TOP-LEFT: (A) FULLY CONNECTED PEER MESH                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="520" height="215" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="26" rx="6" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="18" font-size="10.5" font-weight="700" fill="#991B1B">(A) PEER-TO-PEER MESH (UNCONSTRAINED CHAT)</text>
    <text x="375" y="18" font-size="9" fill="#B91C1C" font-family="'SF Mono', monospace">|E| = M(M-1)/2 = O(M^2)</text>

    <!-- Graph Visualization (Left side of card) -->
    <g transform="translate(30, 42)">
      <!-- All-to-all bidirectional lines -->
      <line x1="60" y1="30" x2="160" y2="30" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="60" y1="110" x2="160" y2="110" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="60" y1="30" x2="60" y2="110" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="160" y1="30" x2="160" y2="110" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="60" y1="30" x2="160" y2="110" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="160" y1="30" x2="60" y2="110" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>

      <!-- 4 Agent Nodes -->
      <circle cx="60" cy="30" r="16" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5"/>
      <text x="60" y="34" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">A_1</text>

      <circle cx="160" cy="30" r="16" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5"/>
      <text x="160" y="34" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">A_2</text>

      <circle cx="60" cy="110" r="16" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5"/>
      <text x="60" y="114" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">A_3</text>

      <circle cx="160" cy="110" r="16" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5"/>
      <text x="160" y="114" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">A_4</text>
    </g>

    <!-- Formal Schematic Metrics (Right side of card) -->
    <g transform="translate(250, 42)">
      <rect x="0" y="0" width="250" height="155" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Systems Architecture Profile:</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Edge Topology: Fully connected digraph</text>
      <text x="12" y="52" font-size="8.5" fill="#475569">Message Overhead: M * (M - 1) channels</text>
      <text x="12" y="68" font-size="8.5" fill="#475569">Coordination: Free-form conversational</text>
      <text x="12" y="84" font-size="8.5" fill="#475569">Failure Boundary: Global blast radius</text>
      <line x1="12" y1="96" x2="238" y2="96" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="112" font-size="8.5" font-weight="700" fill="#991B1B">Hazard: Semantic Deadlocks</text>
      <text x="12" y="126" font-size="8" fill="#7F1D1D">Mutual waiting without authority arbitration;</text>
      <text x="12" y="138" font-size="8" fill="#7F1D1D">token expenditure explodes quadratically.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- TOP-RIGHT: (B) HIERARCHICAL SUPERVISOR TREE                       -->
  <!-- ================================================================= -->
  <g transform="translate(590, 80)">
    <rect x="0" y="0" width="520" height="215" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="26" rx="6" fill="#FAF5FF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="18" font-size="10.5" font-weight="700" fill="#581C87">(B) HIERARCHICAL SUPERVISOR TREE (ERLANG/OTP)</text>
    <text x="395" y="18" font-size="9" fill="#6B21A8" font-family="'SF Mono', monospace">|E| = M - 1 = O(M)</text>

    <!-- Graph Visualization (Left side) -->
    <g transform="translate(30, 42)">
      <!-- Root Supervisor -->
      <circle cx="110" cy="22" r="16" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
      <text x="110" y="26" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">Root</text>

      <!-- Directed tree edges -->
      <line x1="110" y1="38" x2="50" y2="95" stroke="#581C87" stroke-width="1.5" marker-end="url(#arr-amethyst)"/>
      <line x1="110" y1="38" x2="110" y2="95" stroke="#581C87" stroke-width="1.5" marker-end="url(#arr-amethyst)"/>
      <line x1="110" y1="38" x2="170" y2="95" stroke="#581C87" stroke-width="1.5" marker-end="url(#arr-amethyst)"/>

      <!-- Leaf Workers -->
      <circle cx="50" cy="108" r="14" fill="#F8FAFC" stroke="#581C87" stroke-width="1.3"/>
      <text x="50" y="112" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">W_1</text>

      <circle cx="110" cy="108" r="14" fill="#F8FAFC" stroke="#581C87" stroke-width="1.3"/>
      <text x="110" y="112" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">W_2</text>

      <circle cx="170" cy="108" r="14" fill="#F8FAFC" stroke="#581C87" stroke-width="1.3"/>
      <text x="170" y="112" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">W_3</text>

      <text x="110" y="142" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Isolated Leaf Enclaves</text>
    </g>

    <!-- Formal Schematic Metrics (Right side) -->
    <g transform="translate(250, 42)">
      <rect x="0" y="0" width="250" height="155" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Systems Architecture Profile:</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Edge Topology: Directed rooted tree</text>
      <text x="12" y="52" font-size="8.5" fill="#475569">Message Overhead: Strict typed envelopes</text>
      <text x="12" y="68" font-size="8.5" fill="#475569">Coordination: Master-worker delegation</text>
      <text x="12" y="84" font-size="8.5" fill="#475569">Failure Boundary: Contained by supervisor</text>
      <line x1="12" y1="96" x2="238" y2="96" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="112" font-size="8.5" font-weight="700" fill="#581C87">Supervision Policies:</text>
      <text x="12" y="126" font-size="8" fill="#475569">One-for-one (restart failed worker);</text>
      <text x="12" y="138" font-size="8" fill="#475569">one-for-all (abort cascade upon fatal fault).</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM-LEFT: (C) SEQUENTIAL PHASE PIPELINE                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="520" height="215" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="26" rx="6" fill="#F0FDFA" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="18" font-size="10.5" font-weight="700" fill="#0F766E">(C) SEQUENTIAL ASSEMBLY PIPELINE (STAGE GATED)</text>
    <text x="395" y="18" font-size="9" fill="#0D9488" font-family="'SF Mono', monospace">|E| = M - 1 = O(M)</text>

    <!-- Graph Visualization (Left side) -->
    <g transform="translate(30, 42)">
      <!-- Pipeline stages -->
      <circle cx="35" cy="50" r="15" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
      <text x="35" y="54" font-size="8" font-weight="700" fill="#0F766E" text-anchor="middle">Plan</text>

      <line x1="50" y1="50" x2="85" y2="50" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arr-teal)"/>

      <circle cx="102" cy="50" r="15" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
      <text x="102" y="54" font-size="8" font-weight="700" fill="#0F766E" text-anchor="middle">Code</text>

      <line x1="117" y1="50" x2="152" y2="50" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arr-teal)"/>

      <circle cx="169" cy="50" r="15" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
      <text x="169" y="54" font-size="8" font-weight="700" fill="#0F766E" text-anchor="middle">Test</text>

      <!-- Compensating rollback arc (Backward arrow from Test to Plan) -->
      <path d="M 169 65 C 169 110, 35 110, 35 68" fill="none" stroke="#92400E" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr-ochre)"/>
      <text x="102" y="122" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">Rollback A^{-1}</text>
    </g>

    <!-- Formal Schematic Metrics (Right side) -->
    <g transform="translate(250, 42)">
      <rect x="0" y="0" width="250" height="155" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Systems Architecture Profile:</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Edge Topology: Linear directed acyclic chain</text>
      <text x="12" y="52" font-size="8.5" fill="#475569">Message Overhead: Minimum O(M) transfers</text>
      <text x="12" y="68" font-size="8.5" fill="#475569">Coordination: Phase-gated contracts</text>
      <text x="12" y="84" font-size="8.5" fill="#475569">Failure Boundary: Explicit upstream rollbacks</text>
      <line x1="12" y1="96" x2="238" y2="96" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="112" font-size="8.5" font-weight="700" fill="#0F766E">Deterministic Gates:</text>
      <text x="12" y="126" font-size="8" fill="#475569">Stage k verifies input artifacts before committing;</text>
      <text x="12" y="138" font-size="8" fill="#475569">failures trigger compensating Sagas.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM-RIGHT: (D) SHARED BLACKBOARD (TUPLE SPACE)                 -->
  <!-- ================================================================= -->
  <g transform="translate(590, 315)">
    <rect x="0" y="0" width="520" height="215" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="26" rx="6" fill="#FFFBEB" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="12" y="18" font-size="10.5" font-weight="700" fill="#92400E">(D) SHARED BLACKBOARD (DECOUPLED TUPLE SPACE)</text>
    <text x="390" y="18" font-size="9" fill="#B45309" font-family="'SF Mono', monospace">Asynchronous Pub/Sub</text>

    <!-- Graph Visualization (Left side) -->
    <g transform="translate(30, 42)">
      <!-- Central Blackboard / State Store -->
      <rect x="50" y="50" width="105" height="42" rx="3" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
      <text x="102" y="68" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Shared Ledger</text>
      <text x="102" y="82" font-size="7.5" font-family="'SF Mono', monospace" fill="#B45309" text-anchor="middle">Atomic Tuple Space</text>

      <!-- Surrounding Independent Agents -->
      <circle cx="20" cy="30" r="14" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
      <text x="20" y="34" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">A_1</text>
      <line x1="33" y1="38" x2="52" y2="52" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <circle cx="185" cy="30" r="14" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
      <text x="185" y="34" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">A_2</text>
      <line x1="172" y1="38" x2="153" y2="52" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <circle cx="102" cy="125" r="14" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
      <text x="102" y="129" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">A_3</text>
      <line x1="102" y1="110" x2="102" y2="95" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    </g>

    <!-- Formal Schematic Metrics (Right side) -->
    <g transform="translate(250, 42)">
      <rect x="0" y="0" width="250" height="155" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Systems Architecture Profile:</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Edge Topology: Star / bipartite to storage</text>
      <text x="12" y="52" font-size="8.5" fill="#475569">Message Overhead: Zero direct agent-to-agent</text>
      <text x="12" y="68" font-size="8.5" fill="#475569">Coordination: Asynchronous pattern matching</text>
      <text x="12" y="84" font-size="8.5" fill="#475569">Failure Boundary: Isolated by transactions</text>
      <line x1="12" y1="96" x2="238" y2="96" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="112" font-size="8.5" font-weight="700" fill="#92400E">State Concurrency:</text>
      <text x="12" y="126" font-size="8" fill="#475569">Optimistic concurrency control with version tags;</text>
      <text x="12" y="138" font-size="8" fill="#475569">decouples agent lifetimes from data persistence.</text>
    </g>
  </g>
</svg>
