<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1160" height="520" fill="#ffffff" />

  <!-- ================================================================= -->
  <!-- PANEL (a): THREE-TIER CAPABILITY DELEGATION LATTICE               -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Container Card -->
    <rect width="650" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 646 0 Q 650 0 650 4 L 650 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(a) Cryptographic Capability Delegation Lattice</text>
    <text x="634" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">C₂ ⊆ C₁ ⊆ C₀</text>

    <!-- NODE 0: ROOT SUPERVISOR (A_0) -->
    <g transform="translate(20, 45)">
      <rect width="610" height="85" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" />
      <rect width="610" height="22" rx="3" fill="#eff6ff" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#1e40af">TIER 0: ROOT ORCHESTRATOR (Agent A_0)</text>
      <text x="598" y="15" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#2563eb" text-anchor="end">Master Secret: K_0</text>

      <text x="12" y="38" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a">Capability Envelope C_0 (Unattenuated Global Authority):</text>
      <text x="20" y="52" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Tools  T_0 = {read, write, bash, git, deploy, rm, grep, test}</text>
      <text x="20" y="66" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Scope  F_0 = /   ·   Network  full WAN egress</text>
      <text x="20" y="80" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Budget  B_0 = $50.00 / 500k tok   ·   Lease  3600 s</text>
    </g>

    <!-- ATTENUATION STEP 1: CAVEAT INJECTION -->
    <path d="M 325 130 L 325 168" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)" />
    <g transform="translate(170, 137)">
      <rect width="310" height="24" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="155" y="16" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e40af" text-anchor="middle">Caveat 1: σ₁ = HMAC(K₀, Caveats₁) [Strip deploy/rm]</text>
    </g>

    <!-- NODE 1: WORKER AGENT (A_1) -->
    <g transform="translate(20, 172)">
      <rect width="610" height="92" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" />
      <rect width="610" height="22" rx="3" fill="#f5f3ff" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#6d28d9">TIER 1: WORKER AGENT (Agent A_1) - Scoped Subtask</text>
      <text x="598" y="15" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#7c3aed" text-anchor="end">Macaroon M₁ [σ₁]</text>

      <text x="12" y="38" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a">Attenuated Capability C_1 (C₁ ⊂ C₀):</text>
      <text x="20" y="52" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Tools  T_1 = {read, write, grep, test}   deploy, rm stripped</text>
      <text x="20" y="66" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Scope  F_1 = /tmp/workspaces/task-102/   ·   Network  blocked</text>
      <text x="20" y="80" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Budget  B_1 = $5.00 / 50k tok   ·   Lease  600 s</text>
    </g>

    <!-- ATTENUATION STEP 2: CAVEAT INJECTION -->
    <path d="M 325 264 L 325 302" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)" />
    <g transform="translate(170, 271)">
      <rect width="310" height="24" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
      <text x="155" y="16" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#6d28d9" text-anchor="middle">Caveat 2: σ₂ = HMAC(σ₁, Caveats₂) [Compile only]</text>
    </g>

    <!-- NODE 2: COMPILER WORKER (A_2) -->
    <g transform="translate(20, 306)">
      <rect width="610" height="85" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.4" />
      <rect width="610" height="22" rx="3" fill="#ecfdf5" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#065f46">TIER 2: COMPILER AGENT (Agent A_2) - Build Specialist</text>
      <text x="598" y="15" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#059669" text-anchor="end">Macaroon M₂ [σ₂]</text>

      <text x="12" y="38" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a">Leaf Capability C_2 (C₂ ⊂ C₁ ⊂ C₀):</text>
      <text x="20" y="52" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Tools  T_2 = {compile}   read, write, grep stripped</text>
      <text x="20" y="66" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Scope  F_2 = /tmp/workspaces/task-102/build/</text>
      <text x="20" y="80" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Budget  B_2 = $0.50 / 5k tok   ·   Lease  60 s</text>
    </g>

    <!-- Invariant Strip -->
    <g transform="translate(20, 403)">
      <rect width="610" height="60" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Monotonic Attenuation Invariant:</text>
      <text x="12" y="34" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#2563eb">C_{i+1} ⊆ C_i  ⇔  (T_{i+1} ⊆ T_i) ∧ (F_{i+1} ⊆ F_i) ∧ (N_{i+1} ⊆ N_i) ∧ (B_{i+1} ≤ B_i)</text>
      
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL (b): HOST RUNTIME VERIFICATION GATEWAY                      -->
  <!-- ================================================================= -->
  <g transform="translate(690, 20)">
    <!-- Container Card -->
    <rect width="450" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 446 0 Q 450 0 450 4 L 450 30 L 0 30 Z" fill="#fff1f2" stroke="#94a3b8" stroke-width="1.2" />
    <text x="16" y="20" font-size="12" font-weight="700" fill="#991b1b">(b) Host Runtime Verification Gateway (A = 0)</text>
    <text x="434" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#dc2626" text-anchor="end">Gate Enforcement</text>

    <!-- Step 1: Protected RPC Ingestion -->
    <g transform="translate(15, 42)">
      <rect width="420" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">1  RPC ingestion</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">Agent A_2 attempts unprivileged actuation request:</text>
      <text x="10" y="46" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">request = {tool: "deploy", token: M_2, payload: "..."}</text>
      <text x="10" y="60" font-size="7.5" fill="#dc2626" font-weight="600">Notice: Agent A_2 attempting unauthorized ambient escalation</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 225 112 L 225 125" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)" />

    <!-- Step 2: Cryptographic Chain Recomputation -->
    <g transform="translate(15, 128)">
      <rect width="420" height="88" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">2  HMAC chain recomputation</text>
      <text x="10" y="31" font-size="7.5" fill="#475569">Gateway holds root secret K_0</text>
      <text x="15" y="45" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">σ₀' = K₀</text>
      <text x="15" y="58" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">σ₁' = HMAC(σ₀', Caveats₁)  →  σ₂' = HMAC(σ₁', Caveats₂)</text>
      <text x="15" y="73" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d">Assert: σ₂' == M₂.signature  [PASSED: Token is untampered]</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 225 216 L 225 229" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)" />

    <!-- Step 3: Caveat Predicate Evaluation -->
    <g transform="translate(15, 232)">
      <rect width="420" height="105" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
      <text x="10" y="16" font-size="9" font-weight="700" fill="#92400e">3  Caveat predicate evaluation</text>
      <text x="15" y="33" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626" font-weight="700">Check 1: tool ∈ T₂?  ("deploy" ∈ {compile}?)  → FALSE [VIOLATION]</text>
      <text x="15" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Check 2: path ∈ F₂?  (/tmp/.../build)         → PASS</text>
      <text x="15" y="63" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Check 3: epoch ≤ τ_lease? (now ≤ epoch)        → PASS</text>
      <text x="15" y="78" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Check 4: budget ≤ B₂?  (cost ≤ $0.50)         → PASS</text>
      <rect x="15" y="85" width="390" height="15" rx="2" fill="#fff1f2" stroke="#fca5a5" />
      <text x="210" y="96" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">Gate Verdict: CAPABILITY VIOLATION DETECTED</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 225 337 L 225 350" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)" />

    <!-- Step 4: Hard Isolation Enforcement -->
    <g transform="translate(15, 353)">
      <rect width="420" height="110" rx="3" fill="#fff1f2" stroke="#ef4444" stroke-width="1.3" />
      <rect width="420" height="20" rx="3" fill="#fee2e2" />
      <text x="10" y="14" font-size="9" font-weight="700" fill="#991b1b">4  Host isolation enforcement</text>
      
      <text x="12" y="34" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b">EPERM / 403 to A_2   ·   execution halted</text>
      <text x="12" y="48" font-size="8" fill="#991b1b">Host filesystem untouched</text>
      <text x="12" y="62" font-size="8" fill="#991b1b">Violation appended to A_0 WAL</text>
      <text x="12" y="76" font-size="8" fill="#991b1b">Container quarantined   ·   lease revoked</text>
      
      <rect x="10" y="86" width="400" height="18" rx="2" fill="#ffffff" stroke="#fca5a5" />
      
    </g>
  </g>
</svg>