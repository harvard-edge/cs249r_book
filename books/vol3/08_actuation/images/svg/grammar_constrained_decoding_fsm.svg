<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: AHEAD-OF-TIME GRAMMAR COMPILATION                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="280" height="376" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">1. Ahead-of-Time Grammar Compilation</text>

    <!-- Subcard 1: Pydantic Schema -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="256" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Pydantic Tool Schema</text>
      <rect x="190" y="6" width="56" height="14" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="218" y="16" text-anchor="middle" font-size="8.0" font-weight="600" fill="#6d28d9">Input Spec</text>
      <text x="10" y="32" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">class SQLQuery(BaseModel):</text>
      <text x="20" y="46" font-family="Courier, monospace" font-size="8.0" fill="#b45309">  query: str = Field(min_length=1)</text>
      <text x="20" y="60" font-family="Courier, monospace" font-size="8.0" fill="#b45309">  limit: int = Field(ge=1, le=500)</text>
      <text x="20" y="74" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">  timeout_s: float = 30.0</text>
    </g>

    <!-- Subcard 2: Regex & DFA State Construction -->
    <g transform="translate(12, 132)">
      <rect x="0" y="0" width="256" height="122" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Regex &amp; DFA State Construction</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">• Converts JSON grammar to regular regex</text>
      <text x="10" y="43" font-size="8.0" fill="#475569">• Constructs DFA: Q = {q0, q1, ..., qK}</text>
      <text x="10" y="56" font-size="8.0" fill="#475569">• Identifies valid token transitions δ(q, v)</text>

      <!-- Mini DFA Graph -->
      <g transform="translate(24, 66)">
        <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="20" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">q0</text>
        <line x1="34" y1="20" x2="68" y2="20" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
        <text x="51" y="14" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">"{"</text>

        <circle cx="84" cy="20" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="84" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">q1</text>
        <line x1="98" y1="20" x2="132" y2="20" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
        <text x="115" y="14" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">"sql"</text>

        <circle cx="148" cy="20" r="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
        <circle cx="148" cy="20" r="11" fill="none" stroke="#6d28d9" stroke-width="1"/>
        <text x="148" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">qF</text>
      </g>
    </g>

    <!-- Subcard 3: Precomputed Vocabulary Index -->
    <g transform="translate(12, 262)">
      <rect x="0" y="0" width="256" height="102" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Precomputed Vocabulary Index</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">For each state q, precomputes bitmask:</text>
      <rect x="10" y="40" width="236" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="55" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#0f172a">Bitmask[q] = [1, 0, 0, 1, 1, 0, ...]</text>
      <text x="10" y="78" font-size="8.0" font-weight="700" fill="#15803d">✓ Memory: O(|Q| · |V| / 8) ~ few MBs</text>
      <text x="10" y="92" font-size="8.0" fill="#64748b">Instant GPU constant memory lookup</text>
    </g>
  </g>

  <!-- Flow Arrow from Section 1 to Section 2 -->
  <line x1="320" y1="262" x2="338" y2="262" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: REAL-TIME GPU LOGIT MASKING KERNEL                      -->
  <!-- ================================================================= -->
  <g transform="translate(340, 74)">
    <rect x="0" y="0" width="310" height="376" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">2. Real-Time GPU Logit Masking Kernel</text>

    <!-- Subcard 1: Transformer Forward Pass Output -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="286" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Transformer Forward Pass Output</text>
      <text x="10" y="28" font-size="8.0" fill="#475569">Unconstrained logits from LM projection head z_t:</text>

      <g transform="translate(10, 46)">
        <text x="18" y="-4" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#64748b">"SELECT"</text>
        <rect x="0" y="0" width="36" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="18" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">+14.2</text>

        <text x="60" y="-4" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#64748b">"I think"</text>
        <rect x="42" y="0" width="36" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="60" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">+18.5</text>

        <text x="102" y="-4" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#64748b">"{"</text>
        <rect x="84" y="0" width="36" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="102" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">+8.1</text>

        <text x="144" y="-4" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#64748b">"Sure"</text>
        <rect x="126" y="0" width="36" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="144" y="15" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">+12.0</text>

        <text x="175" y="15" font-family="Courier, monospace" font-size="8" fill="#64748b">... 128k tokens</text>
      </g>
    </g>

    <!-- Subcard 2: Allowlist Masking (CUDA Kernel) -->
    <g transform="translate(12, 118)">
      <rect x="0" y="0" width="286" height="142" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">Active Token Allowlist Masking (CUDA Kernel)</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">Current state q_0 expects opening brace `{` only:</text>

      <g transform="translate(10, 42)">
        <rect x="0" y="0" width="36" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="18" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#991b1b">-∞</text>
        <line x1="0" y1="0" x2="36" y2="24" stroke="#dc2626" stroke-width="1"/>

        <rect x="42" y="0" width="36" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="60" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#991b1b">-∞</text>
        <line x1="42" y1="0" x2="78" y2="24" stroke="#dc2626" stroke-width="1"/>

        <rect x="84" y="0" width="36" height="24" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <text x="102" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">+8.1</text>
        <text x="102" y="34" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">ALLOWED</text>

        <rect x="126" y="0" width="36" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="144" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#991b1b">-∞</text>
        <line x1="126" y1="0" x2="162" y2="24" stroke="#dc2626" stroke-width="1"/>

        <text x="175" y="16" font-family="Courier, monospace" font-size="8" fill="#64748b">... invalid -∞</text>
      </g>

      <rect x="10" y="92" width="266" height="38" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="106" font-size="8.0" font-weight="700" fill="#0369a1">Mathematical Guarantee:</text>
      <text x="16" y="120" font-family="Courier, monospace" font-size="8.0" fill="#334155">p(v ∉ Allowed | q) = softmax(-∞) ≡ 0.000000%</text>
    </g>

    <!-- Subcard 3: State Advance -->
    <g transform="translate(12, 268)">
      <rect x="0" y="0" width="286" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Sampled Token &amp; State Advance</text>
      <text x="10" y="32" font-size="8.0" fill="#475569">Sampled token: <tspan font-family="Courier, monospace" font-weight="700" fill="#15803d">"{"</tspan></text>
      <text x="10" y="48" font-size="8.0" fill="#475569">Automaton transition: <tspan font-family="Courier, monospace" fill="#0369a1">q_next = δ(q_0, "{") → q_1</tspan></text>
      <text x="10" y="64" font-size="8.0" fill="#475569">Next allowed tokens: <tspan font-family="Courier, monospace" fill="#0f172a">&quot;query&quot;, &quot;limit&quot;</tspan></text>
      <text x="10" y="82" font-size="8.0" font-weight="700" fill="#15803d">✓ Latency overhead: &lt; 0.2% of step runtime (sub-ms)</text>
    </g>
  </g>

  <!-- Flow Arrow from Section 2 to Section 3 -->
  <line x1="650" y1="262" x2="668" y2="262" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: SYSTEMS PERFORMANCE                                     -->
  <!-- ================================================================= -->
  <g transform="translate(670, 74)">
    <rect x="0" y="0" width="250" height="376" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">3. Systems Performance</text>

    <!-- Subcard 1: Comparison Table -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="226" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <rect width="226" height="22" rx="1" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.0" font-weight="700" fill="#475569">METRIC</text>
      <text x="100" y="15" font-size="8.0" font-weight="700" fill="#991b1b">PROMPT ONLY</text>
      <text x="175" y="15" font-size="8.0" font-weight="700" fill="#15803d">FSM MASK</text>

      <line x1="0" y1="22" x2="226" y2="22" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="38" font-size="8.0" fill="#334155">Syntax Error Rate</text>
      <text x="105" y="38" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">12.4% - 28%</text>
      <text x="180" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">0.00%</text>

      <line x1="0" y1="48" x2="226" y2="48" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="64" font-size="8.0" fill="#334155">Correction Turns</text>
      <text x="105" y="64" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">1 - 3 extra</text>
      <text x="180" y="64" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">0 extra</text>

      <line x1="0" y1="74" x2="226" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="90" font-size="8.0" fill="#334155">Token Waste</text>
      <text x="105" y="90" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">+1,420 tok</text>
      <text x="180" y="90" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">+0 tok</text>

      <line x1="0" y1="100" x2="226" y2="100" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="116" font-size="8.0" fill="#334155">Latency Overhead</text>
      <text x="105" y="116" font-family="Courier, monospace" font-size="8.0" fill="#64748b">0 ms</text>
      <text x="180" y="116" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">&lt; 0.8 ms</text>

      <line x1="0" y1="126" x2="226" y2="126" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="140" font-size="8.0" fill="#334155">Context Tax</text>
      <text x="105" y="140" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">High bloat</text>
      <text x="180" y="140" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">Zero bloat</text>
    </g>

    <!-- Subcard 2: Architectural Takeaways -->
    <g transform="translate(12, 190)">
      <rect x="0" y="0" width="226" height="174" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Architectural Takeaways</text>
      
      <text x="10" y="34" font-size="8" font-weight="700" fill="#0f172a">1. Zero Parsing Regret:</text>
      <text x="10" y="47" font-size="8.0" fill="#475569">Runtime never encounters malformed</text>
      <text x="10" y="58" font-size="8.0" fill="#475569">JSON or unescaped quotes.</text>

      <text x="10" y="76" font-size="8" font-weight="700" fill="#0f172a">2. Context Window Savings:</text>
      <text x="10" y="89" font-size="8.0" fill="#475569">Eliminates diagnostic error correction</text>
      <text x="10" y="100" font-size="8.0" fill="#475569">turns that bloat KV caches.</text>

      <text x="10" y="118" font-size="8" font-weight="700" fill="#0f172a">3. Production Adoption:</text>
      <text x="10" y="131" font-size="8.0" fill="#475569">Implemented in Outlines, Guidance,</text>
      <text x="10" y="142" font-size="8.0" fill="#475569">vLLM, and SGLang decode engines.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYSTEMS PRINCIPLE CALLOUT                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="880" height="66" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="12" y="12" width="120" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">SYSTEMS PRINCIPLE</text>
    <text x="144" y="25" font-size="9.5" font-weight="700" fill="#0f172a">Enforce Syntax Invariants at the Logit Surface, Not Post-Hoc via Parsing Regret</text>
    <text x="144" y="44" font-size="8" fill="#475569">Treating tool schemas as prompt instructions invites non-deterministic syntax failures. Compiling schemas to finite automata guarantees 100% compliance at the tensor level.</text>
  </g>

</g>
</svg>