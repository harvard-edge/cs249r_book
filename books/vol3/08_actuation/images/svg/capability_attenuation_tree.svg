<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="440" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- LEVEL 0: ROOT SUPERVISOR                                          -->
  <!-- ================================================================= -->
  <g transform="translate(240, 74)">
    <rect x="0" y="0" width="440" height="96" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="220" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">ROOT SUPERVISOR (Principal Authority)</text>

    <text x="14" y="40" font-size="8" font-weight="700" fill="#334155">Full Authority C_0:</text>
    <text x="115" y="40" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">{ ReadFS, WriteFS, ExecBash, NetHTTP, GitCommit, CloudDeploy }</text>

    <text x="14" y="58" font-size="8" font-weight="700" fill="#334155">Resource Quota:</text>
    <text x="115" y="58" font-family="Courier, monospace" font-size="8.0" fill="#475569">Budget: $50.00 • 500,000 Tokens • TTL: 24h</text>

    <text x="14" y="76" font-size="8" font-weight="700" fill="#334155">Lease Token:</text>
    <text x="115" y="76" font-family="Courier, monospace" font-size="8.0" fill="#64748b">HMAC_SHA256(principal_id, C_0, TTL, k_sys)</text>

    <rect x="14" y="85" width="412" height="3" rx="1" fill="#0284c7"/>
  </g>

  <!-- Delegation Line 1: Root -> Child 1A -->
  <path d="M350,170 L350,195 L225,195 L225,214" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="287" y="190" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0369a1">delegate(C_1A, $5, 30m)</text>

  <!-- Delegation Line 2: Root -> Child 1B -->
  <path d="M570,170 L570,195 L695,195 L695,214" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="632" y="190" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#15803d">delegate(C_1B, $20, 2h)</text>

  <!-- ================================================================= -->
  <!-- LEVEL 1: SUBAGENTS                                                -->
  <!-- ================================================================= -->
  <!-- CHILD 1A: Repository Research Agent -->
  <g transform="translate(40, 214)">
    <rect x="0" y="0" width="370" height="110" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">CHILD SUBAGENT 1A: Repository Research</text>

    <text x="12" y="40" font-size="8" font-weight="700" fill="#0369a1">Granted (C_1A ⊂ C_0):</text>
    <rect x="120" y="29" width="238" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="125" y="41" font-family="Courier, monospace" font-size="8.0" fill="#15803d">ReadFS, NetHTTP(allowlist: [docs, git])</text>

    <text x="12" y="60" font-size="8" font-weight="700" fill="#991b1b">Revoked / Stripped:</text>
    <rect x="120" y="49" width="238" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="125" y="61" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">WriteFS, ExecBash, GitCommit, CloudDeploy</text>

    <text x="12" y="80" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="120" y="80" font-family="Courier, monospace" font-size="8.0" fill="#334155">Budget: $5.00 • 50k Tokens • TTL: 30m</text>

    <text x="12" y="98" font-size="8.0" fill="#64748b">Isolation Boundary: Read-only network egress; zero FS write access</text>
  </g>

  <!-- CHILD 1B: Code Implementation Agent -->
  <g transform="translate(510, 214)">
    <rect x="0" y="0" width="370" height="110" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">CHILD SUBAGENT 1B: Code Implementation</text>

    <text x="12" y="40" font-size="8" font-weight="700" fill="#15803d">Granted (C_1B ⊂ C_0):</text>
    <rect x="120" y="29" width="238" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="125" y="41" font-family="Courier, monospace" font-size="8.0" fill="#15803d">ReadFS, WriteFS(/src/*), ExecBash(gVisor)</text>

    <text x="12" y="60" font-size="8" font-weight="700" fill="#991b1b">Revoked / Stripped:</text>
    <rect x="120" y="49" width="238" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="125" y="61" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">NetHTTP, GitCommit, CloudDeploy</text>

    <text x="12" y="80" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="120" y="80" font-family="Courier, monospace" font-size="8.0" fill="#334155">Budget: $20.00 • 200k Tokens • TTL: 2h</text>

    <text x="12" y="98" font-size="8.0" fill="#64748b">Isolation Boundary: Ephemeral sandbox; zero external network ingress</text>
  </g>

  <!-- Delegation Line 3: Child 1B -> Grandchild 2A -->
  <path d="M695,324 L695,348" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="705" y="339" font-family="Courier, monospace" font-size="8.0" fill="#15803d">spawn_tester(C_2A)</text>

  <!-- ================================================================= -->
  <!-- LEVEL 2: GRANDCHILD SUBAGENT & FORMAL INVARIANTS                  -->
  <!-- ================================================================= -->
  <!-- FORMAL SPECIFICATION INVARIANTS -->
  <g transform="translate(40, 348)">
    <rect x="0" y="0" width="450" height="96" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="450" height="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">FORMAL CAPABILITY ATTENUATION INVARIANTS</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#334155">1. Monotonicity:</text>
    <text x="110" y="38" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">C_{child} ⊆ C_{parent}</text>
    <text x="240" y="38" font-size="8.0" fill="#64748b">(Privilege escalation impossible)</text>

    <text x="12" y="56" font-size="8" font-weight="700" fill="#334155">2. Quota Boundedness:</text>
    <text x="110" y="56" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">∑ Quota_{child} ≤ RemainingQuota_{parent}</text>

    <text x="12" y="74" font-size="8" font-weight="700" fill="#334155">3. Temporal Bound:</text>
    <text x="110" y="74" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">TTL_{child} ≤ TTL_{parent}</text>
    <text x="250" y="74" font-size="8.0" fill="#64748b">(Orphaned runaway agents impossible)</text>

    <text x="12" y="88" font-size="8.0" font-weight="700" fill="#7c3aed">Enforcement: Cryptographic lease signatures validated at runtime kernel barrier outside neural context.</text>
  </g>

  <!-- GRANDCHILD 2A: Unit Test Runner -->
  <g transform="translate(510, 348)">
    <rect x="0" y="0" width="370" height="96" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#15803d">GRANDCHILD 2A: Ephemeral Test Runner</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#15803d">Granted (C_2A ⊂ C_1B):</text>
    <rect x="120" y="27" width="238" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="125" y="38" font-family="Courier, monospace" font-size="8.0" fill="#15803d">ReadFS(/src/*), ExecBash(pytest tests/)</text>

    <text x="12" y="56" font-size="8" font-weight="700" fill="#991b1b">Revoked / Stripped:</text>
    <rect x="120" y="45" width="238" height="15" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="125" y="56" font-family="Courier, monospace" font-size="8.0" fill="#991b1b">WriteFS (Filesystem mutation revoked)</text>

    <text x="12" y="74" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="120" y="74" font-family="Courier, monospace" font-size="8.0" fill="#334155">Budget: $2.00 • 20k Tokens • TTL: 5m</text>

    <text x="12" y="88" font-size="8.0" fill="#64748b">Isolation: Ephemeral disposable microVM container</text>
  </g>

</g>
</svg>