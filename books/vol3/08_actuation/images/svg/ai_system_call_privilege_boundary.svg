      <text x="10" y="46" font-size="7.5" fill="#475569">• Elementwise logit masking kernel</text>
      <text x="10" y="60" font-size="7.5" fill="#475569">• Drives invalid tokens to -∞</text>
      <rect x="10" y="70" width="190" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="105" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">100% Syntactic Compliance</text>
