      <text x="299" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">TRAP EMISSION</text>
      <text x="299" y="58" text-anchor="middle" font-size="7" fill="#b91c1c">SYS_TOOL_TRAP</text>
      <text x="299" y="72" text-anchor="middle" font-size="7" fill="#64748b">Control Yielded</text>
    </g>
