      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">gVisor Container Sandbox</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">• Intercepts user-space syscalls</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• Sealed network namespaces</text>
      <text x="10" y="64" font-size="7.5" fill="#64748b">• Sentry application kernel isolation</text>
    </g>

    <!-- Subcard 3: Enterprise SaaS -->
