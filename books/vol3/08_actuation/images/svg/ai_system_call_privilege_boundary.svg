      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">2. Strict ABI Deserialization</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">• Rust Serde typed parsing</text>
      <text x="10" y="46" font-size="7.5" fill="#475569">• Bounds &amp; range invariants checked</text>
      <text x="10" y="60" font-size="7.5" fill="#475569">• Memory pointer sandboxing</text>
      <rect x="10" y="70" width="190" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="105" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Rejects Malformed Buffers</text>
    </g>

    <!-- Step 3: Capability Token Verification -->
    <g transform="translate(461, 32)">
      <rect x="0" y="0" width="220" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">3. Capability Lease Verification</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">• HMAC-SHA256 signature check</text>
      <text x="10" y="46" font-size="7.5" fill="#475569">• Monotonic attenuation verified</text>
      <text x="10" y="60" font-size="7.5" fill="#475569">• Path allowlist: /workspace/* only</text>
