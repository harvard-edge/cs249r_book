      <text x="12" y="34" font-size="7.5" fill="#475569">• Autoregressive token sampling over unified vocabulary V</text>
      <text x="12" y="48" font-size="7.5" fill="#475569">• Violates W ⊕ X paradigm: data (retrieved text) and instructions share token stream</text>
