      <text x="18" y="40" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">&lt;|tool_call|&gt; {</text>
      <text x="26" y="52" font-family="Courier, monospace" font-size="7.5" fill="#b45309">  "name": "mutate_file",</text>
      <text x="26" y="64" font-family="Courier, monospace" font-size="7.5" fill="#b45309">  "params": {"path": "/etc/shadow", "mode": "w"}</text>
      <text x="18" y="76" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">}</text>

