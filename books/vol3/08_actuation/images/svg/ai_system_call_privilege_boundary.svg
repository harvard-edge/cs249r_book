      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Enterprise SaaS &amp; DB Gateway</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">• Scoped OAuth &amp; mTLS tokens</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• Compensating Saga logs recorded</text>
      <text x="10" y="64" font-size="7.5" fill="#64748b">• Read-only replica query routing</text>
    </g>

    <!-- Subcard 4: Filesystem -->
    <g transform="translate(694, 32)">
      <rect x="0" y="0" width="211" height="88" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Local Filesystem Isolation</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">• pivot_root and chroot jail</text>
      <text x="10" y="48" font-size="7.5" fill="#475569">• CoW overlayfs atomic snapshots</text>
      <text x="10" y="64" font-size="7.5" fill="#64748b">• Ephemeral tmpfs mount points</text>
