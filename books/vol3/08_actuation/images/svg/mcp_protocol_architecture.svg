<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: MCP HOST APPLICATION & CLIENT                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="270" height="376" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">MCP Host Application</text>
    <text x="258" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#6d28d9">Agent Runtime</text>

    <!-- Subcard 1: LLM Inference Core & Context -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="246" height="88" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">LLM Inference Core &amp; Context</text>
      <text x="10" y="30" font-size="7.5" fill="#475569">• Formats tool schemas into prompt</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">• Emits structured calls via constrained logits</text>
      <text x="10" y="58" font-size="7.5" fill="#475569">• Ingests tool outputs as observation turns</text>
      <rect x="10" y="66" width="84" height="14" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="52" y="76" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#6d28d9">Context Window</text>
    </g>

    <!-- Subcard 2: MCP Client Protocol Manager -->
    <g transform="translate(12, 126)">
      <rect x="0" y="0" width="246" height="124" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">MCP Client Protocol Manager</text>

      <rect x="10" y="24" width="226" height="26" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="35" font-size="7.5" font-weight="700" fill="#0f172a">1. Handshake &amp; Initialize</text>
      <text x="16" y="45" font-family="Courier, monospace" font-size="7" fill="#64748b">client/initialize (protocol: 2024-11-05)</text>

      <rect x="10" y="54" width="226" height="26" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="65" font-size="7.5" font-weight="700" fill="#0f172a">2. Dynamic Discovery</text>
      <text x="16" y="75" font-family="Courier, monospace" font-size="7" fill="#64748b">tools/list, resources/list, prompts/list</text>

      <rect x="10" y="84" width="226" height="26" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="95" font-size="7.5" font-weight="700" fill="#0f172a">3. Invocation &amp; Sampling</text>
      <text x="16" y="105" font-family="Courier, monospace" font-size="7" fill="#64748b">tools/call, sampling/createMessage</text>
    </g>

    <!-- Subcard 3: Host Policy & Approval Gateway -->
    <g transform="translate(12, 256)">
      <rect x="0" y="0" width="246" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Host Policy &amp; Approval Gateway</text>
      <text x="10" y="30" font-size="7.5" fill="#475569">• Human-in-the-loop approval interception</text>
      <text x="10" y="44" font-size="7.5" fill="#475569">• Idempotency key tracking &amp; nonce store</text>
      <text x="10" y="58" font-size="7.5" fill="#475569">• Secret redaction &amp; credential injection</text>
      <rect x="10" y="72" width="226" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="123" y="86" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">True Authorization Boundary</text>
    </g>
  </g>

  <!-- Bi-directional arrows between Col 1 and Col 2 -->
  <line x1="310" y1="252" x2="328" y2="252" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="328" y1="272" x2="310" y2="272" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: DUPLEX TRANSPORT LAYER                                  -->
  <!-- ================================================================= -->
  <g transform="translate(330, 74)">
    <rect x="0" y="0" width="340" height="376" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">Duplex Transport Layer</text>
    <text x="328" y="16" text-anchor="end" font-family="Courier, monospace" font-size="8" font-weight="600" fill="#0369a1">JSON-RPC 2.0</text>

    <!-- Subcard 1: Transports: stdio vs SSE -->
    <g transform="translate(12, 32)">
      <!-- stdio Transport -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="152" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">stdio Transport</text>
        <text x="8" y="28" font-size="7" fill="#475569">• Local Subprocess</text>
        <text x="8" y="40" font-size="7" fill="#475569">• stdin / stdout pipes</text>
        <text x="8" y="54" font-size="7" font-weight="700" fill="#15803d">✓ Zero network latency</text>
      </g>

      <!-- SSE / HTTP Transport -->
      <g transform="translate(164, 0)">
        <rect x="0" y="0" width="152" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">SSE / HTTP Transport</text>
        <text x="8" y="28" font-size="7" fill="#475569">• Remote Microservice</text>
        <text x="8" y="40" font-size="7" fill="#475569">• SSE stream + POST</text>
        <text x="8" y="54" font-size="7" font-weight="700" fill="#0284c7">✓ Distributed nodes</text>
      </g>
    </g>

    <!-- Subcard 2: Client Request Wire Payload -->
    <g transform="translate(12, 106)">
      <rect x="0" y="0" width="316" height="126" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0369a1">Client Request (tools/call)</text>
      <rect x="236" y="6" width="70" height="14" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
      <text x="271" y="16" text-anchor="middle" font-size="6.8" font-weight="600" fill="#0369a1">Typed Schema</text>

      <rect x="10" y="24" width="296" height="92" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="37" font-family="Courier, monospace" font-size="7.2" fill="#64748b">{</text>
      <text x="24" y="49" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">  "jsonrpc": "2.0", "id": "req-42",</text>
      <text x="24" y="61" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">  "method": "tools/call",</text>
      <text x="24" y="73" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">  "params": { "name": "query_db",</text>
      <text x="32" y="85" font-family="Courier, monospace" font-size="7.2" fill="#b45309">    "arguments": {"sql": "SELECT * FROM users;"}}</text>
      <text x="16" y="97" font-family="Courier, monospace" font-size="7.2" fill="#64748b">}</text>
    </g>

    <!-- Subcard 3: Server Response Wire Payload -->
    <g transform="translate(12, 240)">
      <rect x="0" y="0" width="316" height="124" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Server Response (result)</text>
      <rect x="220" y="6" width="86" height="14" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="263" y="16" text-anchor="middle" font-size="6.8" font-weight="600" fill="#15803d">Deterministic State</text>

      <rect x="10" y="24" width="296" height="90" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="37" font-family="Courier, monospace" font-size="7.2" fill="#64748b">{</text>
      <text x="24" y="49" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">  "jsonrpc": "2.0", "id": "req-42",</text>
      <text x="24" y="61" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">  "result": {</text>
      <text x="32" y="73" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">    "content": [{"type": "text", "text": "[... 3 rows]" }],</text>
      <text x="32" y="85" font-family="Courier, monospace" font-size="7.2" fill="#15803d">    "isError": false</text>
      <text x="24" y="97" font-family="Courier, monospace" font-size="7.2" fill="#0f172a">  }</text>
      <text x="16" y="107" font-family="Courier, monospace" font-size="7.2" fill="#64748b">}</text>
    </g>
  </g>

  <!-- Bi-directional arrows between Col 2 and Col 3 -->
  <line x1="670" y1="252" x2="688" y2="252" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="688" y1="272" x2="670" y2="272" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: MCP SERVER ENDPOINTS                                    -->
  <!-- ================================================================= -->
  <g transform="translate(690, 74)">
    <rect x="0" y="0" width="230" height="376" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">MCP Server Endpoints</text>
    <text x="218" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#b45309">Providers</text>

    <!-- Subcard 1: Core Protocol Primitives -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="206" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">Three Core Protocol Primitives</text>
      
      <rect x="8" y="22" width="190" height="20" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="35" font-size="7.5" font-weight="700" fill="#b45309">Tools:</text>
      <text x="44" y="35" font-size="7" fill="#475569">Callable routines with side-effects</text>

      <rect x="8" y="45" width="190" height="20" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="58" font-size="7.5" font-weight="700" fill="#b45309">Resources:</text>
      <text x="62" y="58" font-size="7" fill="#475569">URI data &amp; client subs</text>

      <rect x="8" y="68" width="190" height="20" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="81" font-size="7.5" font-weight="700" fill="#b45309">Prompts:</text>
      <text x="54" y="81" font-size="7" fill="#475569">Parameterized server templates</text>
    </g>

    <!-- Subcard 2: JSON Schema Engine -->
    <g transform="translate(12, 134)">
      <rect x="0" y="0" width="206" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">JSON Schema Engine</text>
      <text x="8" y="28" font-size="7" fill="#475569">• Synthesizes type contracts (Pydantic / Zod)</text>
      <text x="8" y="40" font-size="7" fill="#475569">• Validates payloads prior to dispatch</text>
      <text x="8" y="56" font-size="7" font-weight="700" fill="#b45309">⚠ Validates types only, NOT safety intent!</text>
    </g>

    <!-- Subcard 3: Backend Integration Services -->
    <g transform="translate(12, 214)">
      <rect x="0" y="0" width="206" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">Backend Integration Services</text>

      <rect x="8" y="22" width="91" height="28" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="34" font-size="7" font-weight="700" fill="#0f172a">PostgreSQL DB</text>
      <text x="12" y="44" font-size="6.5" fill="#64748b">SQL read/write</text>

      <rect x="107" y="22" width="91" height="28" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="111" y="34" font-size="7" font-weight="700" fill="#0f172a">Docker Daemon</text>
      <text x="111" y="44" font-size="6.5" fill="#64748b">Containers</text>

      <rect x="8" y="54" width="91" height="28" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="66" font-size="7" font-weight="700" fill="#0f172a">Filesystem IO</text>
      <text x="12" y="76" font-size="6.5" fill="#64748b">Disk read/write</text>

      <rect x="107" y="54" width="91" height="28" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="111" y="66" font-size="7" font-weight="700" fill="#0f172a">GitHub API</text>
      <text x="111" y="76" font-size="6.5" fill="#64748b">PRs &amp; commits</text>

      <!-- Danger Zone -->
      <rect x="8" y="88" width="190" height="52" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="103" y="104" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">DANGER ZONE: Arbitrary Execution</text>
      <text x="103" y="118" text-anchor="middle" font-size="7" fill="#b91c1c">Server executes DROP TABLE if sent!</text>
      <text x="103" y="130" text-anchor="middle" font-size="6.8" fill="#64748b">Requires external supervisor mediation</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYSTEMS PRINCIPLE CALLOUT                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="880" height="66" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="12" y="12" width="120" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">SYSTEMS PRINCIPLE</text>
    <text x="144" y="25" font-size="9.5" font-weight="700" fill="#0f172a">Wire Protocols Standardize Serialization, Not Authorization or Isolation Boundaries</text>
    <text x="144" y="44" font-size="8" fill="#475569">MCP provides a typed ABI contract across heterogeneous runtimes. Security isolation must be enforced below the wire via kernel sandboxes and hardware microVMs.</text>
  </g>

</g>
</svg>