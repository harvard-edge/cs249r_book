<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="480" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- AGENT TOOL CALL DISPATCH (TOP LEVEL)                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="840" height="54" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="10" y="10" width="160" height="34" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="90" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">AGENT STEP t INVOCATION</text>
    
    <rect x="180" y="10" width="648" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="195" y="31" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#0f172a">ToolCall(<tspan fill="#6d28d9">"compile"</tspan>, {<tspan fill="#b45309">"commit": "9a4f2b", "target": "//engine:runtime", "opt": "O3"</tspan>})</text>
  </g>

  <!-- Downward Connector to Gateway -->
  <line x1="460" y1="128" x2="460" y2="150" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- ACTUATION GATEWAY CONTENT-ADDRESSED CACHE (MIDDLE LEVEL)          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="840" height="130" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">ACTUATION GATEWAY CONTENT-ADDRESSED CACHE</text>
    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#6d28d9">Deterministic Tool Memoization</text>

    <!-- Subcard 1: Key Derivation -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="460" height="86" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">Canonical Content Hash Computation</text>
      <text x="12" y="32" font-family="Courier, monospace" font-size="8" fill="#0f172a">Key = SHA256( tool_name || version || canonical_json(args) )</text>
      <text x="12" y="48" font-size="8.0" fill="#64748b">Key: <tspan font-family="Courier, monospace" fill="#0f172a">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</tspan></text>
      <rect x="12" y="58" width="436" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="20" y="72" font-size="8" font-weight="700" fill="#15803d">CACHE HIT: Instant Return (0.8 ms)</text>
      <text x="210" y="72" font-size="8.0" fill="#166534">• Bypasses 14.5s physical compilation sandbox</text>
    </g>

    <!-- Subcard 2: Cache Hit Observation Payload -->
    <g transform="translate(490, 32)">
      <rect x="0" y="0" width="335" height="86" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#15803d">Cached Deterministic Observation Text</text>
      <rect x="12" y="24" width="311" height="38" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="18" y="38" font-family="Courier, monospace" font-size="8.0" fill="#14532d">"Build complete. 48 targets up-to-date."</text>
      <text x="18" y="52" font-family="Courier, monospace" font-size="8.0" fill="#14532d">"Binary output hash: 0x8a91c0e (1,400 tokens)"</text>
      <text x="12" y="74" font-size="8.0" font-weight="700" fill="#15803d">Byte-for-byte identical: Invariant Prefix String</text>
    </g>
  </g>

  <!-- Downward Connector with Invariant Label -->
  <line x1="460" y1="280" x2="460" y2="306" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="475" y="297" font-size="8" font-weight="700" fill="#15803d">Deterministic Serialized Observation Bytes Appended</text>

  <!-- ================================================================= -->
  <!-- GPU SERVING RADIX KV-CACHE (BOTTOM LEVEL)                         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 308)">
    <rect x="0" y="0" width="840" height="142" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">GPU RADIX-TREE PROMPT PREFIX CACHE (vLLM / SGLang Engine)</text>
    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#0369a1">Zero-Prefill KV Reuse</text>

    <!-- Token Stream Segment Blocks -->
    <g transform="translate(15, 32)">
      <!-- Block 1: System Prompt -->
      <rect x="0" y="0" width="165" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="82" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">System Prompt</text>
      <text x="82" y="34" text-anchor="middle" font-size="8.0" fill="#64748b">KV Cached (Node 1)</text>

      <!-- Plus -->
      <text x="180" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">+</text>

      <!-- Block 2: Trajectory History -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="220" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="110" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Trajectory History (Turns 1..t-1)</text>
        <text x="110" y="34" text-anchor="middle" font-size="8.0" fill="#64748b">KV Cached (Node 2 - 4,200 tokens)</text>
      </g>

      <!-- Plus -->
      <text x="430" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">+</text>

      <!-- Block 3: Memoized Observation -->
      <g transform="translate(445, 0)">
        <rect x="0" y="0" width="235" height="46" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="117" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Memoized Observation Bytes</text>
        <text x="117" y="34" text-anchor="middle" font-size="8.0" font-weight="600" fill="#15803d">Exact Match (Node 3 - 1,400 tokens)</text>
      </g>

      <!-- Arrow to Result -->
      <line x1="688" y1="23" x2="714" y2="23" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

      <!-- Block 4: Hit Result -->
      <g transform="translate(722, 0)">
        <rect x="0" y="0" width="88" height="46" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="44" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#0369a1">100% HIT</text>
        <text x="44" y="34" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0284c7">Zero Prefill</text>
      </g>
    </g>

    <!-- Metrics Comparison Grid -->
    <g transform="translate(15, 86)">
      <rect x="0" y="0" width="810" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0369a1">Hardware Acceleration Impact:</text>
      <text x="12" y="32" font-size="8.0" fill="#475569">Uncached Prefill Latency: <tspan font-weight="700" fill="#dc2626">450 ms</tspan> (Compute-Bound FLOPs)  ➜  Prefix-Cached Latency: <tspan font-weight="700" fill="#16a34a">1.8 ms</tspan> (HBM Pointer Reuse)</text>
      
      <rect x="630" y="8" width="168" height="28" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="714" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">TTFT Speedup: 250× Faster</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM ARCHITECTURAL PRINCIPLE                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 458)">
    <rect x="0" y="0" width="840" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="21" font-size="8.5" font-weight="700" fill="#0f172a">Core Architectural Principle:</text>
    <text x="162" y="21" font-size="8" fill="#475569">Deterministic tool output caching compounds throughput gains by converting compute-heavy LLM attention prefills into O(1) Radix tree traversals.</text>
  </g>

</g>
</svg>