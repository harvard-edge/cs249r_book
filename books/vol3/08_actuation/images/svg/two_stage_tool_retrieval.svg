  <!-- Connector: Top to Middle -->
  <line x1="460" y1="156" x2="460" y2="182" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="472" y="172" font-size="7.5" font-weight="700" fill="#64748b">HNSW Graph Synced</text>

  <!-- ================================================================= -->
  <!-- STAGE 1: COARSE MIPS RETRIEVAL (MIDDLE LAYER)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 182)">
    <rect x="0" y="0" width="840" height="114" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
