<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- OFFLINE TOOL REGISTRY & DENSE VECTOR INDEX (TOP LAYER)             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="840" height="82" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0f172a">OFFLINE TOOL REGISTRY &amp; DENSE VECTOR INDEX (M = 3,200+ Catalog Tools)</text>
    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#475569">Global Catalog</text>

    <!-- Tool Badges -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="115" height="26" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="57" y="17" text-anchor="middle" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#6d28d9">T_1: GitCommit</text>

      <rect x="125" y="0" width="115" height="26" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="182" y="17" text-anchor="middle" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#6d28d9">T_2: DockerRun</text>

      <rect x="250" y="0" width="115" height="26" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="307" y="17" text-anchor="middle" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#6d28d9">T_3: K8sDeploy</text>

      <text x="390" y="17" font-size="12" font-weight="700" fill="#94a3b8">...</text>

      <rect x="425" y="0" width="125" height="26" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="487" y="17" text-anchor="middle" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#6d28d9">T_M: S3PutObject</text>
    </g>

    <text x="580" y="46" font-size="8.5" font-weight="700" fill="#0f172a">Offline Dense Embedding:</text>
    <text x="580" y="60" font-size="7.5" font-family="Courier, monospace" fill="#475569">e_i = Embed(Name || Docstring || Signature)</text>
