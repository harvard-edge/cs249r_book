    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#6d28d9">Candidate Pruning</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 32)">
      <!-- Left: Agent Query Formulation -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="245" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">Agent Trajectory State s_t</text>
        <text x="12" y="32" font-size="7.5" fill="#475569">Deliberative Thought / Context:</text>
        <text x="12" y="46" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">"Rollback failed canary pod"</text>
        <text x="12" y="60" font-family="Courier, monospace" font-size="7.5" fill="#6d28d9">e_q = DenseEmbed(s_t)</text>
      </g>

      <!-- Arrow -->
      <line x1="252" y1="35" x2="278" y2="35" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>

      <!-- Center: ANN Search -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="250" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">HNSW Graph Traversal</text>
        <text x="12" y="32" font-family="Courier, monospace" font-size="7.5" fill="#475569">score(T_i, q) = cos(e_q, e_i)</text>
        <text x="12" y="46" font-size="7.5" font-weight="700" fill="#15803d">Search Latency: &lt; 1.2 ms</text>
        <text x="12" y="60" font-size="7.5" fill="#64748b">Explores top-layer entry points</text>
      </g>

      <!-- Arrow -->
      <line x1="542" y1="35" x2="568" y2="35" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>

      <!-- Right: Candidate Subset -->
      <g transform="translate(575, 0)">
        <rect x="0" y="0" width="235" height="70" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#15803d">Selected Active Subset (K &lt;&lt; M)</text>
        <text x="12" y="32" font-size="7.5" font-weight="700" fill="#15803d">Top-K Tools (K = 4):</text>
        <text x="12" y="46" font-family="Courier, monospace" font-size="7.5" fill="#14532d">1. K8sRollback   2. K8sStatus</text>
        <text x="12" y="60" font-family="Courier, monospace" font-size="7.5" fill="#14532d">3. PodLogs       4. AlertQuery</text>
      </g>
    </g>
  </g>

  <!-- Connector: Middle to Bottom -->
  <line x1="460" y1="296" x2="460" y2="322" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="472" y="312" font-size="7.5" font-weight="700" fill="#6d28d9">Bind Active Tools (K=4)</text>

  <!-- ================================================================= -->
  <!-- STAGE 2: JUST-IN-TIME SCHEMA BINDING & MASKING (BOTTOM LAYER)     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 322)">
    <rect x="0" y="0" width="840" height="136" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">STAGE 2: JUST-IN-TIME SCHEMA BINDING &amp; RUNTIME LOGIT MASKING</text>
    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#0369a1">GPU Enforcement</text>

    <!-- Sub-steps -->
    <g transform="translate(15, 32)">
      <!-- Step 2A -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="260" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0369a1">1. Context Budget Injection</text>
        <text x="12" y="32" font-size="7.5" fill="#475569">Inject ONLY the K=4 JSON schemas:</text>
        <text x="12" y="48" font-size="8.5" font-weight="700" fill="#0284c7">1,200 tokens context tax</text>
        <text x="12" y="64" font-size="7.5" fill="#15803d">Saves 78,800 tokens vs. all M schemas</text>
        <text x="12" y="78" font-size="7.5" font-weight="700" fill="#15803d">(98.5% prompt tax reduction)</text>
      </g>

      <!-- Step 2B -->
      <g transform="translate(275, 0)">
        <rect x="0" y="0" width="260" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0369a1">2. Runtime DFA Masking</text>
        <text x="12" y="32" font-size="7.5" fill="#475569">Compile K schemas into state machine:</text>
        <text x="12" y="48" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">M_t = BuildLogitBitmask(DFA_K)</text>
        <text x="12" y="64" font-size="7.5" fill="#475569">Zero-overhead GPU tensor mask</text>
        <text x="12" y="78" font-size="7.5" font-weight="700" fill="#15803d">100% syntactically valid parameters</text>
      </g>

      <!-- Step 2C -->
      <g transform="translate(550, 0)">
        <rect x="0" y="0" width="260" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0369a1">3. Accelerated Forward Pass</text>
        <text x="12" y="32" font-size="7.5" fill="#475569">Autoregressive GPU execution:</text>
        <text x="12" y="48" font-size="8.5" font-weight="700" fill="#0284c7">Sub-millisecond TTFT prefill</text>
        <text x="12" y="64" font-size="7.5" fill="#475569">Eliminates attention haystack noise</text>
        <text x="12" y="78" font-size="7.5" font-weight="700" fill="#15803d">Zero out-of-catalog hallucinations</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM METRIC BAR                                                 -->
  <!-- ================================================================= -->
  <g transform="translate(40, 466)">
    <rect x="0" y="0" width="840" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="21" font-size="8.5" font-weight="700" fill="#0f172a">System Performance Gains:</text>
    <text x="160" y="21" font-size="8" fill="#475569"><tspan font-weight="700" fill="#16a34a">98.5% Prompt Tax Reduction</tspan> (1.2k vs 80k tokens) • <tspan font-weight="700" fill="#0284c7">1.2 ms Retrieval Overhead</tspan> • <tspan font-weight="700" fill="#7c3aed">100% Guaranteed JSON ABI Adherence</tspan></text>
  </g>

