<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7C3AED" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="640" fill="#FFFFFF" rx="12" />
  <rect x="8" y="8" width="984" height="624" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="88" height="20" rx="4" fill="#581C87" />
    <text x="44" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FIGURE 9.1</text>
    <text x="100" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">The AI System Call Privilege Boundary and Complete Mediation Gate</text>
    <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Hardware-style protection rings separating stochastic user-space models from deterministic kernel dispatchers</text>
  </g>

  <!-- ZONE 1: Unprivileged User Space (Ring 3) -->
  <g transform="translate(24, 66)">
    <rect width="952" height="150" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" filter="url(#shadow)" />
    <rect width="952" height="28" rx="8" fill="#FEE2E2" />
    <rect y="20" width="952" height="8" fill="#FEE2E2" />
    <text x="16" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">Unprivileged User Space (Protection Ring 3)</text>
    <text x="936" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="end">Untrusted Stochastic Execution Core</text>

    <!-- Subcard 1: Foundation Model Core -->
    <g transform="translate(16, 38)">
      <rect width="520" height="98" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
      <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Stochastic Neural Processor (Foundation Model Engine)</text>
      <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">• Autoregressive token sampling over unified vocabulary V</text>
      <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">• Violates W ⊕ X paradigm: data (retrieved text) and instructions share token stream</text>
      <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#DC2626">• Susceptible to indirect prompt injection, parameter drift, and hallucinated syntax</text>
      <text x="14" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#991B1B">Security Posture: Untrusted, fail-plausible user application (never granted ambient authority)</text>
    </g>

    <!-- Subcard 2: Emitted Tool Call Token Stream -->
    <g transform="translate(552, 38)">
      <rect width="384" height="98" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">Unprivileged AI System Call Trap</text>
      <text x="14" y="38" font-family="monospace" font-size="8.5" fill="#F1F5F9">&lt;|tool_call|&gt; {</text>
      <text x="24" y="52" font-family="monospace" font-size="8.5" fill="#FBBF24">  "name": "mutate_file",</text>
      <text x="24" y="66" font-family="monospace" font-size="8.5" fill="#FBBF24">  "params": {"path": "/etc/shadow", "mode": "w"}</text>
      <text x="14" y="80" font-family="monospace" font-size="8.5" fill="#F1F5F9">}</text>
      <rect x="230" y="72" width="140" height="18" rx="3" fill="#DC2626" />
      <text x="300" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRAP EMISSION</text>
    </g>
  </g>

  <!-- Trap Instruction Downward Arrow -->
  <path d="M 744,216 L 744,250" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <text x="756" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#DC2626">SYS_TOOL_TRAP (Control Yield)</text>

  <!-- MEDIATION BOUNDARY GATEWAY -->
  <g transform="translate(180, 252)">
    <rect width="640" height="52" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8" filter="url(#shadow-sm)" />
    <text x="320" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400E" text-anchor="middle">Actuation Boundary: Complete Mediation Gateway (Saltzer &amp; Schroeder 1975)</text>
    <text x="320" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350F" text-anchor="middle">Every mutation request intercepted • No ambient credentials • Zero unvetted bypass paths</text>
  </g>

  <!-- Arrow into Kernel -->
  <path d="M 500,304 L 500,332" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrowGreen)" />

  <!-- ZONE 2: Supervisor Kernel Space (Ring 0) -->
  <g transform="translate(24, 334)">
    <rect width="952" height="142" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" filter="url(#shadow)" />
    <rect width="952" height="28" rx="8" fill="#DCFCE7" />
    <rect y="20" width="952" height="8" fill="#DCFCE7" />
    <text x="16" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Supervisor Kernel Space (Protection Ring 0)</text>
    <text x="936" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#15803D" text-anchor="end">Deterministic Mediation, Verification &amp; State Locking</text>

    <!-- Kernel Pipeline Steps (4 columns) -->
    <!-- Step 1: CUDA Logit DFA -->
    <g transform="translate(16, 38)">
      <rect width="218" height="90" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">1. Tensor-Level DFA Masking</text>
      <text x="12" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Ahead-of-Time schema DFA</text>
      <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Elementwise logit masking kernel</text>
      <text x="12" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Drives invalid tokens to -inf</text>
      <text x="12" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#15803D">100% Syntactic Compliance</text>
    </g>

    <!-- Step 2: Serde Schema Validation -->
    <g transform="translate(250, 38)">
      <rect width="218" height="90" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">2. Strict ABI Deserialization</text>
      <text x="12" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Rust Serde typed parsing</text>
      <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Bounds &amp; range invariants checked</text>
      <text x="12" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Memory pointer sandboxing</text>
      <text x="12" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#15803D">Rejects Malformed Buffers</text>
    </g>

    <!-- Step 3: Capability Token Verification -->
    <g transform="translate(484, 38)">
      <rect width="218" height="90" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">3. Capability Lease Verification</text>
      <text x="12" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• HMAC-SHA256 signature check</text>
      <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Monotonic attenuation verified</text>
      <text x="12" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Path allowlist: /workspace/* only</text>
      <text x="12" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#DC2626">Blocks /etc/shadow Exploit</text>
    </g>

    <!-- Step 4: Distributed Idempotency Lock -->
    <g transform="translate(718, 38)">
      <rect width="218" height="90" rx="6" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">4. Idempotency &amp; Replay Engine</text>
      <text x="12" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Computes trajectory nonce η</text>
      <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Redis atomic SETNX lock</text>
      <text x="12" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Replays cached result on duplicate</text>
      <text x="12" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#15803D">Guarantees At-Most-Once</text>
    </g>
  </g>

  <!-- Arrow into Sandboxes -->
  <path d="M 500,476 L 500,504" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <text x="512" y="494" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#7C3AED">Authorized RPC / IPC Dispatch</text>

  <!-- ZONE 3: Isolated Execution Sandboxes -->
  <g transform="translate(24, 506)">
    <rect width="952" height="114" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#shadow)" />
    <rect width="952" height="26" rx="8" fill="#DBEAFE" />
    <rect y="18" width="952" height="8" fill="#DBEAFE" />
    <text x="16" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1E40AF">Isolated Execution Domains (Sandboxed Environments)</text>
    <text x="936" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="end">Containment &amp; Real-World Actuation</text>

    <g transform="translate(16, 36)">
      <rect width="218" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E40AF">Firecracker MicroVMs</text>
      <text x="12" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Ephemeral Linux kernel instance</text>
      <text x="12" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Hardened KVM boundary</text>
    </g>

    <g transform="translate(250, 36)">
      <rect width="218" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E40AF">gVisor Container Sandbox</text>
      <text x="12" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Intercepts user-space syscalls</text>
      <text x="12" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Sealed network namespaces</text>
    </g>

    <g transform="translate(484, 36)">
      <rect width="218" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E40AF">Enterprise SaaS &amp; Database Gateway</text>
      <text x="12" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Scoped OAuth &amp; mTLS tokens</text>
      <text x="12" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Compensating Saga logs recorded</text>
    </g>

    <g transform="translate(718, 36)">
      <rect width="218" height="66" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E40AF">Local Filesystem Isolation</text>
      <text x="12" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• pivot_root and chroot jail</text>
      <text x="12" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• CoW overlayfs atomic snapshots</text>
    </g>
  </g>

</svg>
