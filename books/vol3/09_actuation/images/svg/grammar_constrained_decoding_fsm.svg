<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="grad-card-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">GRAMMAR-CONSTRAINED LOGIT DECODING VIA FINITE STATE AUTOMATA (FSMS)</text>
  </g>

  <!-- SECTION 1: Offline Compilation Phase (Left Card) -->
  <g transform="translate(24, 66)">
    <rect width="280" height="380" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="280" height="36" rx="2" fill="url(#grad-card-header)" />
    <rect y="28" width="280" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="280" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">1. Ahead-of-Time Grammar Compilation</text>

    <!-- Pydantic / Schema Box -->
    <g transform="translate(14, 46)">
      <rect width="252" height="92" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#38BDF8">Pydantic Tool Schema</text>
      <text x="12" y="30" font-family="monospace" font-size="7.5" fill="#F1F5F9">class SQLQuery(BaseModel):</text>
      <text x="24" y="44" font-family="monospace" font-size="7.5" fill="#FBBF24">query: str = Field(min_length=1)</text>
      <text x="24" y="58" font-family="monospace" font-size="7.5" fill="#FBBF24">limit: int = Field(ge=1, le=500)</text>
      <text x="24" y="72" font-family="monospace" font-size="7.5" fill="#A855F7">timeout_s: float = 30.0</text>
      <rect x="180" y="8" width="60" height="14" rx="3" fill="#1E293B" stroke="#475569" stroke-width="0.5" />
      <text x="210" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">Input Spec</text>
    </g>

    <!-- FSM Compiler Box -->
    <g transform="translate(14, 150)">
      <rect width="252" height="110" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#581C87">Regex &amp; DFA State Construction</text>
      <text x="12" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">• Converts JSON grammar to regular regex</text>
      <text x="12" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">• Constructs DFA: Q = {q0, q1, ..., qK}</text>
      <text x="12" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">• Identifies valid token transitions δ(q, v)</text>
      
      <!-- Mini DFA Visual -->
      <g transform="translate(20, 72)">
        <circle cx="20" cy="18" r="14" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.5" />
        <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">q0</text>
        <line x1="34" y1="18" x2="70" y2="18" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)" />
        <text x="52" y="12" font-family="monospace" font-size="7.5" fill="#6B21A8" text-anchor="middle">"{"</text>

        <circle cx="84" cy="18" r="14" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.5" />
        <text x="84" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">q1</text>
        <line x1="98" y1="18" x2="134" y2="18" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)" />
        <text x="116" y="12" font-family="monospace" font-size="7" fill="#6B21A8" text-anchor="middle">"sql"</text>

        <circle cx="148" cy="18" r="14" fill="#F3E8FF" stroke="#581C87" stroke-width="2" />
        <circle cx="148" cy="18" r="11" fill="none" stroke="#581C87" stroke-width="1" />
        <text x="148" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#581C87" text-anchor="middle">qF</text>
      </g>
    </g>

    <!-- Tokenizer Index Table -->
    <g transform="translate(14, 272)">
      <rect width="252" height="96" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Precomputed Vocabulary Index</text>
      <text x="12" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">For each state q, precomputes bitmask:</text>
      <rect x="12" y="42" width="228" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="20" y="58" font-family="monospace" font-size="8.5" font-weight="600" fill="#0F172A">Bitmask[q] = [1, 0, 0, 1, 1, 0, ...]</text>
      <text x="12" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#059669">✓ Memory footprint: O(|Q| · |V| / 8) ~ few MBs</text>
    </g>
  </g>

  <!-- Flow Arrow from Section 1 to Section 2 -->
  <line x1="304" y1="240" x2="330" y2="240" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- SECTION 2: Online Autoregressive GPU Decoding (Middle Card) -->
  <g transform="translate(330, 66)">
    <rect width="330" height="380" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="330" height="36" rx="2" fill="url(#grad-card-header)" />
    <rect y="28" width="330" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="330" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">2. Real-Time GPU Logit Masking Kernel</text>

    <!-- Raw Logits from LM Head -->
    <g transform="translate(14, 46)">
      <rect width="302" height="78" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E293B">Transformer Forward Pass Output</text>
      <text x="12" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">Unconstrained logits from LM projection head z_t:</text>
      
      <!-- Visual Logit Vector with clear spacing -->
      <g transform="translate(12, 46)">
        <text x="18" y="-4" font-family="monospace" font-size="7" fill="#64748B" text-anchor="middle">"SELECT"</text>
        <rect x="0" y="0" width="36" height="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
        <text x="18" y="16" font-family="monospace" font-size="8" fill="#1E40AF" text-anchor="middle">+14.2</text>

        <text x="60" y="-4" font-family="monospace" font-size="7" fill="#64748B" text-anchor="middle">"I think"</text>
        <rect x="42" y="0" width="36" height="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
        <text x="60" y="16" font-family="monospace" font-size="8" fill="#1E40AF" text-anchor="middle">+18.5</text>

        <text x="102" y="-4" font-family="monospace" font-size="7" fill="#64748B" text-anchor="middle">"{"</text>
        <rect x="84" y="0" width="36" height="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
        <text x="102" y="16" font-family="monospace" font-size="8" fill="#1E40AF" text-anchor="middle">+8.1</text>

        <text x="144" y="-4" font-family="monospace" font-size="7" fill="#64748B" text-anchor="middle">"Sure"</text>
        <rect x="126" y="0" width="36" height="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
        <text x="144" y="16" font-family="monospace" font-size="8" fill="#1E40AF" text-anchor="middle">+12.0</text>

        <text x="180" y="16" font-family="monospace" font-size="9" fill="#64748B">... 128k tokens</text>
      </g>
    </g>

    <!-- Bitmask & Dynamic Masking Operation -->
    <g transform="translate(14, 134)">
      <rect width="302" height="136" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#581C87">Active Token Allowlist Masking (CUDA Kernel)</text>
      <text x="12" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Current state q_0 expects opening brace `{` only:</text>

      <!-- Masked Result Vector -->
      <g transform="translate(12, 42)">
        <rect x="0" y="0" width="36" height="26" fill="#FEE2E2" stroke="#F87171" stroke-width="1" />
        <text x="18" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#B91C1C" text-anchor="middle">-∞</text>
        <line x1="0" y1="0" x2="36" y2="26" stroke="#EF4444" stroke-width="1" />

        <rect x="42" y="0" width="36" height="26" fill="#FEE2E2" stroke="#F87171" stroke-width="1" />
        <text x="60" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#B91C1C" text-anchor="middle">-∞</text>
        <line x1="42" y1="0" x2="78" y2="26" stroke="#EF4444" stroke-width="1" />

        <rect x="84" y="0" width="36" height="26" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.5" />
        <text x="102" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">+8.1</text>
        <text x="102" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#15803D" text-anchor="middle">ALLOWED</text>

        <rect x="126" y="0" width="36" height="26" fill="#FEE2E2" stroke="#F87171" stroke-width="1" />
        <text x="144" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#B91C1C" text-anchor="middle">-∞</text>
        <line x1="126" y1="0" x2="162" y2="26" stroke="#EF4444" stroke-width="1" />

        <text x="180" y="16" font-family="monospace" font-size="9" fill="#64748B">... all invalid -∞</text>
      </g>

      <rect x="12" y="90" width="278" height="34" rx="4" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1" />
      <text x="20" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#581C87">Mathematical Guarantee:</text>
      <text x="20" y="116" font-family="monospace" font-size="8" fill="#334155">p(v ∉ Allowed | q) = softmax(-∞) ≡ 0.000000%</text>
    </g>

    <!-- State Transition -->
    <g transform="translate(14, 282)">
      <rect width="302" height="84" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Sampled Token &amp; State Advance</text>
      <text x="12" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">Sampled token: <tspan font-family="monospace" font-weight="700" fill="#15803D">"{"</tspan></text>
      <text x="12" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">Automaton transition: <tspan font-family="monospace" fill="#581C87">q_next = δ(q_0, "{") → q_1</tspan></text>
      <text x="12" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">Next allowed tokens: <tspan font-family="monospace" fill="#0F172A">&quot;query&quot;, &quot;limit&quot;</tspan></text>
      <text x="12" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#059669">✓ Latency overhead: &lt; 0.2% of step runtime (sub-millisecond)</text>
    </g>
  </g>

  <!-- Flow Arrow from Section 2 to Section 3 -->
  <line x1="660" y1="240" x2="684" y2="240" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- SECTION 3: Systems Impact & Benchmark Reality (Right Card) -->
  <g transform="translate(684, 66)">
    <rect width="252" height="380" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="252" height="36" rx="2" fill="url(#grad-card-header)" />
    <rect y="28" width="252" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="252" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">3. Systems Performance</text>

    <!-- Comparison Table -->
    <g transform="translate(12, 46)">
      <rect width="228" height="144" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      
      <rect width="228" height="24" rx="2" fill="#F1F5F9" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569">METRIC</text>
      <text x="104" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#DC2626">PROMPT ONLY</text>
      <text x="180" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#15803D">FSM MASK</text>

      <line x1="0" y1="24" x2="228" y2="24" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">Syntax Error Rate</text>
      <text x="110" y="40" font-family="monospace" font-size="7.5" fill="#DC2626">12.4% - 28%</text>
      <text x="188" y="40" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803D">0.00%</text>

      <line x1="0" y1="50" x2="228" y2="50" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">Correction Turns</text>
      <text x="110" y="66" font-family="monospace" font-size="7.5" fill="#DC2626">1 - 3 extra</text>
      <text x="188" y="66" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803D">0 extra</text>

      <line x1="0" y1="76" x2="228" y2="76" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">Token Waste</text>
      <text x="110" y="92" font-family="monospace" font-size="7.5" fill="#DC2626">+1,420 tok</text>
      <text x="188" y="92" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803D">+0 tok</text>

      <line x1="0" y1="102" x2="228" y2="102" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">Latency Overhead</text>
      <text x="110" y="118" font-family="monospace" font-size="7.5" fill="#64748B">0 ms</text>
      <text x="188" y="118" font-family="monospace" font-size="7.5" fill="#15803D">&lt; 0.8 ms</text>

      <line x1="0" y1="128" x2="228" y2="128" stroke="#E2E8F0" stroke-width="1" />
    </g>

    <!-- Deep Invariant Callout with wrap -->
    <g transform="translate(12, 204)">
      <rect width="228" height="162" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="10" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#581C87">Architectural Takeaways</text>
      
      <text x="10" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#1E293B">1. Zero Parsing Regret:</text>
      <text x="10" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Runtime never encounters malformed</text>
      <text x="10" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">JSON or unescaped quotes.</text>

      <text x="10" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#1E293B">2. Context Window Savings:</text>
      <text x="10" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Eliminates diagnostic error correction</text>
      <text x="10" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">turns that bloat KV caches.</text>

      <text x="10" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#1E293B">3. Production Adoption:</text>
      <text x="10" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Implemented in Outlines, Guidance,</text>
      <text x="10" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">vLLM, and SGLang decode engines.</text>
    </g>
  </g>

  <!-- Bottom Systems Principle Banner -->
  <g transform="translate(24, 458)">
    <rect width="912" height="54" rx="2" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" filter="url(#shadow-sm)" />
    <rect x="12" y="12" width="76" height="30" rx="4" fill="#581C87" />
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#E9D5FF" text-anchor="middle">SYSTEMS</text>
    <text x="50" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRINCIPLE</text>
    <text x="100" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF">Enforce Syntax Invariants at the Logit Surface, Not Post-Hoc via Parsing Regret</text>
    <text x="100" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#C7D2FE">Treating tool schemas as prompt instructions invites non-deterministic syntax failures. Compiling schemas to finite automata guarantees 100% compliance at the tensor level.</text>
  </g>
</svg>