<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="grad-card-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">MODEL CONTEXT PROTOCOL (MCP) ARCHITECTURE AND CAPABILITY NEGOTIATION</text>
  </g>

  <!-- COLUMN 1: MCP Host Application & Client -->
  <g transform="translate(24, 66)">
    <rect width="270" height="380" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="270" height="36" rx="2" fill="url(#grad-card-header)" />
    <rect y="28" width="270" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="270" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">MCP Host Application</text>
    <text x="256" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7E22CE" text-anchor="end">Agent Runtime</text>

    <!-- Subcomponent: LLM Engine & Context Window -->
    <g transform="translate(14, 48)">
      <rect width="242" height="82" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87">LLM Inference Core &amp; Context</text>
      <text x="12" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#334155">• Formats tool schemas into system prompt</text>
      <text x="12" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#334155">• Emits structured tool calls via constrained logits</text>
      <text x="12" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#334155">• Ingests tool outputs as observation turns</text>
      <rect x="12" y="68" width="84" height="10" rx="3" fill="#E9D5FF" />
      <text x="54" y="76" font-family="monospace" font-size="7" fill="#581C87" text-anchor="middle">Context Window</text>
    </g>

    <!-- Subcomponent: MCP Client Core -->
    <g transform="translate(14, 140)">
      <rect width="242" height="122" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">MCP Client Protocol Manager</text>

      <rect x="12" y="26" width="218" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="18" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#0F172A">1. Handshake &amp; Initialize</text>
      <text x="18" y="48" font-family="monospace" font-size="7.5" fill="#64748B">client/initialize (protocol: 2024-11-05)</text>

      <rect x="12" y="56" width="218" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="18" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#0F172A">2. Dynamic Discovery</text>
      <text x="18" y="78" font-family="monospace" font-size="7.5" fill="#64748B">tools/list, resources/list, prompts/list</text>

      <rect x="12" y="86" width="218" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="18" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#0F172A">3. Invocation &amp; Sampling</text>
      <text x="18" y="108" font-family="monospace" font-size="7.5" fill="#64748B">tools/call, sampling/createMessage</text>
    </g>

    <!-- Subcomponent: Host Security & Policy Envelope -->
    <g transform="translate(14, 272)">
      <rect width="242" height="96" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">Host Policy &amp; Approval Gateway</text>
      <text x="12" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#7F1D1D">• Human-in-the-loop approval interception</text>
      <text x="12" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#7F1D1D">• Idempotency key tracking &amp; nonce store</text>
      <text x="12" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#7F1D1D">• Secret redaction &amp; credential injection</text>
      <rect x="12" y="70" width="218" height="18" rx="3" fill="#DC2626" />
      <text x="121" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">True Authorization Boundary Here</text>
    </g>
  </g>

  <!-- COLUMN 2: Transport & Wire Protocol -->
  <g transform="translate(310, 66)">
    <rect width="330" height="380" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="330" height="36" rx="2" fill="#F1F5F9" />
    <rect y="28" width="330" height="8" fill="#F1F5F9" />
    <line x1="0" y1="36" x2="330" y2="36" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Duplex Transport Layer</text>
    <text x="316" y="23" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="end">JSON-RPC 2.0</text>

    <!-- Transports: stdio vs SSE -->
    <g transform="translate(14, 46)">
      <rect width="144" height="64" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">stdio Transport</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">• Local Subprocess</text>
      <text x="10" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">• stdin / stdout pipes</text>
      <text x="10" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#059669">✓ Zero network latency</text>

      <rect x="158" y="0" width="144" height="64" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="168" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">SSE / HTTP Transport</text>
      <text x="168" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">• Remote Microservice</text>
      <text x="168" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">• SSE stream + POST</text>
      <text x="168" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3B82F6">✓ Distributed nodes</text>
    </g>

    <!-- Wire Payloads -->
    <g transform="translate(14, 120)">
      <rect width="302" height="116" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" font-family="monospace" font-size="8.5" font-weight="700" fill="#38BDF8">Client Request (tools/call)</text>
      <text x="12" y="30" font-family="monospace" font-size="7.5" fill="#94A3B8">{</text>
      <text x="22" y="42" font-family="monospace" font-size="7.5" fill="#F1F5F9">"jsonrpc": "2.0", "id": "req-42",</text>
      <text x="22" y="54" font-family="monospace" font-size="7.5" fill="#F1F5F9">"method": "tools/call",</text>
      <text x="22" y="66" font-family="monospace" font-size="7.5" fill="#F1F5F9">"params": { "name": "query_db",</text>
      <text x="32" y="78" font-family="monospace" font-size="7.5" fill="#FBBF24">"arguments": {"sql": "SELECT * FROM users;"}}</text>
      <text x="12" y="90" font-family="monospace" font-size="7.5" fill="#94A3B8">}</text>
      <rect x="220" y="92" width="70" height="16" rx="3" fill="#1E293B" stroke="#475569" stroke-width="0.5" />
      <text x="255" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#38BDF8" text-anchor="middle">Typed Schema</text>
    </g>

    <g transform="translate(14, 246)">
      <rect width="302" height="122" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" font-family="monospace" font-size="8.5" font-weight="700" fill="#4ADE80">Server Response (result)</text>
      <text x="12" y="30" font-family="monospace" font-size="7.5" fill="#94A3B8">{</text>
      <text x="22" y="42" font-family="monospace" font-size="7.5" fill="#F1F5F9">"jsonrpc": "2.0", "id": "req-42",</text>
      <text x="22" y="54" font-family="monospace" font-size="7.5" fill="#F1F5F9">"result": {</text>
      <text x="32" y="66" font-family="monospace" font-size="7.5" fill="#F1F5F9">"content": [{"type": "text", "text": "[... 3 rows]" }],</text>
      <text x="32" y="78" font-family="monospace" font-size="7.5" fill="#F1F5F9">"isError": false</text>
      <text x="22" y="90" font-family="monospace" font-size="7.5" fill="#F1F5F9">}</text>
      <text x="12" y="102" font-family="monospace" font-size="7.5" fill="#94A3B8">}</text>
      <rect x="200" y="96" width="90" height="16" rx="3" fill="#1E293B" stroke="#475569" stroke-width="0.5" />
      <text x="245" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#4ADE80" text-anchor="middle">Deterministic State</text>
    </g>
  </g>

  <!-- COLUMN 3: MCP Server & Backends -->
  <g transform="translate(656, 66)">
    <rect width="280" height="380" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"  />
    <rect width="280" height="36" rx="2" fill="url(#grad-card-header)" />
    <rect y="28" width="280" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="280" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">MCP Server Endpoints</text>
    <text x="266" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7E22CE" text-anchor="end">Capability Providers</text>

    <!-- MCP Primitives: Tools, Resources, Prompts -->
    <g transform="translate(14, 46)">
      <rect width="252" height="96" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#581C87">Three Core Protocol Primitives</text>
      
      <rect x="10" y="24" width="232" height="20" rx="3" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1" />
      <text x="14" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8">Tools:</text>
      <text x="48" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">Callable routines with model side-effects</text>

      <rect x="10" y="47" width="232" height="20" rx="3" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1" />
      <text x="14" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8">Resources:</text>
      <text x="68" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">URI data reads &amp; client subscriptions</text>

      <rect x="10" y="70" width="232" height="20" rx="3" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1" />
      <text x="14" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8">Prompts:</text>
      <text x="60" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">Parameterized server context templates</text>
    </g>

    <!-- Schema Engine -->
    <g transform="translate(14, 150)">
      <rect width="252" height="74" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">JSON Schema Draft 2020-12 Engine</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">• Synthesizes type contracts (Pydantic / Zod)</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#475569">• Validates argument payloads prior to dispatch</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#D97706">⚠ Validates types only, NOT safety intent!</text>
    </g>

    <!-- Subsystems & Backends -->
    <g transform="translate(14, 232)">
      <rect width="252" height="136" rx="2" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400E">Backend Integration Services</text>

      <rect x="10" y="24" width="112" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <text x="16" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#78350F">PostgreSQL DB</text>
      <text x="16" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B45309">SQL read/write engine</text>

      <rect x="130" y="24" width="112" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <text x="136" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#78350F">Docker Daemon</text>
      <text x="136" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B45309">Container lifecycles</text>

      <rect x="10" y="58" width="112" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <text x="16" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#78350F">Filesystem IO</text>
      <text x="16" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B45309">Disk read/write ops</text>

      <rect x="130" y="58" width="112" height="30" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <text x="136" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#78350F">GitHub API</text>
      <text x="136" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B45309">PRs, issues, commits</text>

      <rect x="10" y="94" width="232" height="32" rx="4" fill="#EF4444" />
      <text x="126" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">DANGER ZONE: Arbitrary Execution</text>
      <text x="126" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#FEE2E2" text-anchor="middle">Server will execute DROP TABLE if client sends it!</text>
    </g>
  </g>

  <!-- Flow Arrows connecting columns -->
  <line x1="294" y1="180" x2="310" y2="180" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />
  <line x1="310" y1="210" x2="294" y2="210" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />

  <line x1="640" y1="180" x2="656" y2="180" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />
  <line x1="656" y1="210" x2="640" y2="210" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- Bottom Systems Principle Banner -->
  <g transform="translate(24, 458)">
    <rect width="912" height="54" rx="2" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" filter="url(#shadow-sm)" />
    <rect x="12" y="12" width="76" height="30" rx="4" fill="#581C87" />
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#E9D5FF" text-anchor="middle">SYSTEMS</text>
    <text x="50" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRINCIPLE</text>
    <text x="100" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF">Wire Protocols Standardize Serialization, Not Authorization or Isolation Boundaries</text>
    <text x="100" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#C7D2FE">MCP provides a typed ABI contract across heterogeneous runtimes. Security isolation must be enforced below the wire via kernel sandboxes and hardware microVMs.</text>
  </g>
</svg>