<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" fill="#FFFFFF"/>

  <!-- Figure Badge & Title -->
  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">SYNERGISTIC ACCELERATION BETWEEN TOOL CACHING AND RADIX PREFIX CACHING</text>
  </g>

  <!-- AGENT TOOL CALL DISPATCH (Top Level) -->
  <g  transform="translate(160, 65)">
    <rect width="600" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="20" y="24" font-size="10" font-weight="700" fill="#475569">Agent Step t Tool Invocation:</text>
    <text x="20" y="42" font-family="monospace" font-size="9.5" font-weight="600" fill="#581C87">ToolCall("compile", {"commit": "9a4f2b", "target": "//engine:runtime", "opt": "O3"})</text>
  </g>

  <!-- Downward Arrow to Actuation Gateway -->
  <path d="M 460,121 L 460,150" fill="none" stroke="#581C87" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- ACTUATION GATEWAY CONTENT-ADDRESSED CACHE (Middle Level) -->
  <g  transform="translate(40, 155)">
    <rect width="840" height="135" rx="2" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
    <rect width="840" height="24" rx="2" fill="#581C87"/>
    <rect y="16" width="840" height="8" fill="#581C87"/>
    <text x="420" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">ACTUATION GATEWAY CONTENT-ADDRESSED CACHE</text>

    <!-- Key Derivation -->
    <g transform="translate(20, 36)">
      <rect width="440" height="85" rx="2" fill="#FFFFFF" stroke="#D8B4FE"/>
      <text x="15" y="18" font-size="9.5" font-weight="700" fill="#581C87">Canonical Content Hash Computation</text>
      <text x="15" y="36" font-family="monospace" font-size="8.5" fill="#3B0764">Key = SHA256( tool_name || version || canonical_json(args) )</text>
      <text x="15" y="52" font-size="8" fill="#64748B">Key: <tspan font-family="monospace" fill="#0F172A">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</tspan></text>
      <text x="15" y="72" font-size="8.5" font-weight="600" fill="#16A34A">CACHE HIT: Instant Return (0.8 ms)</text>
      <text x="210" y="72" font-size="8" fill="#64748B">Bypasses 14.5s physical compilation sandbox</text>
    </g>

    <!-- Cache Hit Observation Payload -->
    <g transform="translate(480, 36)">
      <rect width="340" height="85" rx="2" fill="#F0FDF4" stroke="#16A34A"/>
      <text x="15" y="18" font-size="9.5" font-weight="700" fill="#15803D">Cached Deterministic Observation Text</text>
      <rect x="15" y="26" width="310" height="42" rx="4" fill="#FFFFFF" stroke="#BBF7D0"/>
      <text x="25" y="42" font-family="monospace" font-size="8" fill="#14532D">"Build complete. 48 targets up-to-date."</text>
      <text x="25" y="56" font-family="monospace" font-size="8" fill="#14532D">"Binary output hash: 0x8a91c0e (1,400 tokens)"</text>
      <text x="15" y="80" font-size="8" font-weight="700" fill="#15803D">Byte-for-byte identical across runs: Invariant Prefix String</text>
    </g>
  </g>

  <!-- Downward Arrow with Invariant Label -->
  <path d="M 460,290 L 460,325" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="475" y="312" font-size="8.5" font-weight="700" fill="#16A34A">Deterministic Serialized Observation Bytes Appended</text>

  <!-- GPU SERVING RADIX KV-CACHE (Bottom Level) -->
  <g  transform="translate(40, 330)">
    <rect width="840" height="150" rx="2" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
    <rect width="840" height="24" rx="2" fill="#0369A1"/>
    <rect y="16" width="840" height="8" fill="#0369A1"/>
    <text x="420" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">GPU RADIX-TREE PROMPT PREFIX CACHE (vLLM / SGLang Engine)</text>

    <!-- Token Stream Segment Blocks -->
    <g transform="translate(20, 36)">
      <!-- Block 1: System Prompt -->
      <rect x="0" y="0" width="180" height="50" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
      <text x="90" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">System Prompt</text>
      <text x="90" y="36" text-anchor="middle" font-size="8" fill="#64748B">KV Cached (Node 1)</text>

      <!-- Plus -->
      <text x="190" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">+</text>

      <!-- Block 2: Trajectory History -->
      <rect x="200" y="0" width="220" height="50" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
      <text x="310" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Trajectory History (Turns 1..t-1)</text>
      <text x="310" y="36" text-anchor="middle" font-size="8" fill="#64748B">KV Cached (Node 2 - 4,200 tokens)</text>

      <!-- Plus -->
      <text x="430" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">+</text>

      <!-- Block 3: Memoized Observation -->
      <rect x="440" y="0" width="230" height="50" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
      <text x="555" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">Memoized Observation Bytes</text>
      <text x="555" y="36" text-anchor="middle" font-size="8" font-weight="600" fill="#15803D">Exact Byte Match (Node 3 - 1,400 tokens)</text>

      <!-- Arrow to Result -->
      <path d="M 675,25 L 705,25" fill="none" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow)"/>

      <!-- Block 4: Hit Result -->
      <rect x="710" y="0" width="90" height="50" rx="4" fill="#0284C7"/>
      <text x="755" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">100% HIT</text>
      <text x="755" y="36" text-anchor="middle" font-size="8" font-weight="600" fill="#BAE6FD">Zero Prefill</text>
    </g>

    <!-- Metrics Comparison Grid -->
    <g transform="translate(20, 96)">
      <rect width="800" height="42" rx="4" fill="#FFFFFF" stroke="#BAE6FD"/>
      <text x="15" y="18" font-size="9" font-weight="700" fill="#0369A1">Hardware Acceleration Impact:</text>
      <text x="15" y="32" font-size="8.5" fill="#475569">Uncached Prefill Latency: <tspan font-weight="700" fill="#DC2626">450 ms</tspan> (Compute-Bound FLOPs)  ➜  Prefix-Cached Latency: <tspan font-weight="700" fill="#16A34A">1.8 ms</tspan> (HBM Pointer Reuse)</text>
      <text x="540" y="26" font-size="9.5" font-weight="700" fill="#15803D">TTFT Speedup: 250× Faster</text>
    </g>
  </g>

  <!-- Bottom System Takeaway -->
  <g transform="translate(40, 498)">
    <text x="0" y="18" font-size="9.5" font-weight="700" fill="#334155">Core Architectural Principle:</text>
    <text x="175" y="18" font-size="9" fill="#0F172A">Deterministic tool output caching compounds throughput gains by converting compute-heavy LLM attention prefills into O(1) Radix tree traversals.</text>
  </g>
</svg>
