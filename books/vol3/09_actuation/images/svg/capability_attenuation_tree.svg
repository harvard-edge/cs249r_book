<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEVEL 0: ROOT SUPERVISOR (x: 230, y: 18, w: 440, h: 92)          -->
  <!-- ================================================================= -->
  <g transform="translate(230, 18)">
    <rect x="0" y="0" width="440" height="92" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="22" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="220" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">ROOT SUPERVISOR (Principal Authority)</text>

    <text x="14" y="38" font-size="8" font-weight="700" fill="#334155">Full Authority C_0:</text>
    <text x="110" y="38" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">{ ReadFS, WriteFS, ExecBash, NetHTTP, GitCommit, CloudDeploy }</text>

    <text x="14" y="55" font-size="8" font-weight="700" fill="#334155">Resource Quota:</text>
    <text x="110" y="55" font-family="Courier, monospace" font-size="7.8" fill="#475569">Budget: $50.00 • 500,000 Tokens • TTL: 24h</text>

    <text x="14" y="72" font-size="8" font-weight="700" fill="#334155">Lease Token:</text>
    <text x="110" y="72" font-family="Courier, monospace" font-size="7.5" fill="#64748b">HMAC_SHA256(principal_id, C_0, TTL, k_sys)</text>

    <rect x="14" y="80" width="412" height="4" rx="1" fill="#0284c7"/>
  </g>

  <!-- Delegation Line 1: Root -> Child 1A -->
  <path d="M340,110 L340,145 L190,145 L190,170" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="265" y="139" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">delegate(C_1A, $5, 30m)</text>

  <!-- Delegation Line 2: Root -> Child 1B -->
  <path d="M560,110 L560,145 L710,145 L710,170" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="635" y="139" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#15803d">delegate(C_1B, $20, 2h)</text>

  <!-- ================================================================= -->
  <!-- LEVEL 1: SUBAGENTS                                                -->
  <!-- ================================================================= -->
  <!-- CHILD 1A: Repository Research Agent (x: 20, y: 170, w: 340, h: 108) -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="340" height="108" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="170" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">CHILD SUBAGENT 1A: Repository Research</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#0369a1">Granted (C_1A ⊂ C_0):</text>
    <rect x="110" y="27" width="218" height="15" rx="1" fill="#dcfce7"/>
    <text x="115" y="38" font-family="Courier, monospace" font-size="7.5" fill="#15803d">ReadFS, NetHTTP(allowlist: [docs, git])</text>

    <text x="12" y="58" font-size="8" font-weight="700" fill="#b91c1c">Revoked / Stripped:</text>
    <rect x="110" y="47" width="218" height="15" rx="1" fill="#fee2e2"/>
    <text x="115" y="58" font-family="Courier, monospace" font-size="7.5" fill="#b91c1c">WriteFS, ExecBash, GitCommit, CloudDeploy</text>

    <text x="12" y="78" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="110" y="78" font-family="Courier, monospace" font-size="7.8" fill="#334155">Budget: $5.00 • 50k Tokens • TTL: 30m</text>

    <text x="12" y="96" font-size="7.5" fill="#64748b">Isolation Boundary: Read-only network egress; zero FS write access</text>
  </g>

  <!-- CHILD 1B: Code Implementation Agent (x: 540, y: 170, w: 340, h: 108) -->
  <g transform="translate(540, 170)">
    <rect x="0" y="0" width="340" height="108" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="170" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">CHILD SUBAGENT 1B: Code Implementation</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#15803d">Granted (C_1B ⊂ C_0):</text>
    <rect x="110" y="27" width="218" height="15" rx="1" fill="#dcfce7"/>
    <text x="115" y="38" font-family="Courier, monospace" font-size="7.5" fill="#15803d">ReadFS, WriteFS(/src/*), ExecBash(gVisor)</text>

    <text x="12" y="58" font-size="8" font-weight="700" fill="#b91c1c">Revoked / Stripped:</text>
    <rect x="110" y="47" width="218" height="15" rx="1" fill="#fee2e2"/>
    <text x="115" y="58" font-family="Courier, monospace" font-size="7.5" fill="#b91c1c">NetHTTP, GitCommit, CloudDeploy</text>

    <text x="12" y="78" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="110" y="78" font-family="Courier, monospace" font-size="7.8" fill="#334155">Budget: $20.00 • 200k Tokens • TTL: 2h</text>

    <text x="12" y="96" font-size="7.5" fill="#64748b">Isolation Boundary: Ephemeral sandbox; zero external network ingress</text>
  </g>

  <!-- Delegation Line 3: Child 1B -> Grandchild 2A -->
  <path d="M710,278 L710,312" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="718" y="298" font-family="Courier, monospace" font-size="7.5" fill="#15803d">spawn_tester(C_2A)</text>

  <!-- ================================================================= -->
  <!-- LEVEL 2: GRANDCHILD SUBAGENT & FORMAL INVARIANTS                  -->
  <!-- ================================================================= -->
  <!-- FORMAL SPECIFICATION INVARIANTS (x: 20, y: 312, w: 480, h: 92)    -->
  <g transform="translate(20, 312)">
    <rect x="0" y="0" width="480" height="92" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="0" width="480" height="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">FORMAL CAPABILITY ATTENUATION INVARIANTS</text>

    <text x="12" y="36" font-size="8" font-weight="700" fill="#334155">1. Monotonicity:</text>
    <text x="110" y="36" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">C_{child} ⊆ C_{parent}</text>
    <text x="240" y="36" font-size="7.5" fill="#64748b">(Privilege escalation mathematically impossible)</text>

    <text x="12" y="54" font-size="8" font-weight="700" fill="#334155">2. Quota Boundedness:</text>
    <text x="110" y="54" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">∑ Quota_{child} ≤ RemainingQuota_{parent}</text>
    <text x="320" y="54" font-size="7.5" fill="#64748b">(Strict budget sub-allocation)</text>

    <text x="12" y="72" font-size="8" font-weight="700" fill="#334155">3. Temporal Bound:</text>
    <text x="110" y="72" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">TTL_{child} ≤ TTL_{parent}</text>
    <text x="255" y="72" font-size="7.5" fill="#64748b">(Orphaned runaway subagents impossible)</text>

    <text x="12" y="86" font-size="7" font-weight="700" fill="#0284c7">Enforcement: Cryptographic lease signatures validated at runtime kernel barrier outside neural context.</text>
  </g>

  <!-- GRANDCHILD 2A: Unit Test Runner (x: 540, y: 312, w: 340, h: 92)  -->
  <g transform="translate(540, 312)">
    <rect x="0" y="0" width="340" height="92" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="170" y="14" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">GRANDCHILD 2A: Ephemeral Test Runner</text>

    <text x="12" y="36" font-size="8" font-weight="700" fill="#15803d">Granted (C_2A ⊂ C_1B):</text>
    <rect x="115" y="25" width="213" height="15" rx="1" fill="#dcfce7"/>
    <text x="120" y="36" font-family="Courier, monospace" font-size="7.5" fill="#15803d">ReadFS(/src/*), ExecBash(pytest tests/)</text>

    <text x="12" y="54" font-size="8" font-weight="700" fill="#b91c1c">Revoked / Stripped:</text>
    <rect x="115" y="43" width="213" height="15" rx="1" fill="#fee2e2"/>
    <text x="120" y="54" font-family="Courier, monospace" font-size="7.5" fill="#b91c1c">WriteFS (Filesystem mutation revoked)</text>

    <text x="12" y="72" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="115" y="72" font-family="Courier, monospace" font-size="7.8" fill="#334155">Budget: $2.00 • 20k Tokens • TTL: 5m</text>

    <text x="12" y="85" font-size="7.2" fill="#64748b">Isolation: Ephemeral disposable microVM container</text>
  </g>

</svg>
