<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="grad-card-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="12" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="88" height="20" rx="4" fill="#581C87" />
    <text x="44" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FIGURE 9.5</text>
    <text x="100" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Idempotency Nonce Engine and Distributed Side-Effect Commit Pipeline</text>
    <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Deterministic trajectory hashing, distributed lock acquisition, and cached replay protection against duplicate execution</text>
  </g>

  <!-- STEP 1: Nonce Generation at Agent Runtime (Left Card) -->
  <g transform="translate(24, 66)">
    <rect width="270" height="380" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="270" height="36" rx="8" fill="url(#grad-card-header)" />
    <rect y="28" width="270" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="270" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">1. Trajectory Nonce Synthesis</text>

    <!-- Side-effecting Tool Invocation -->
    <g transform="translate(14, 46)">
      <rect width="242" height="96" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">Mutating Tool Call Emitted</text>
      <text x="12" y="30" font-family="monospace" font-size="7.5" fill="#7F1D1D">{ "tool": "transfer_funds",</text>
      <text x="20" y="42" font-family="monospace" font-size="7.5" fill="#7F1D1D">  "amount": 5000,</text>
      <text x="20" y="54" font-family="monospace" font-size="7.5" fill="#7F1D1D">  "recipient": "acct-9842" }</text>
      <rect x="12" y="66" width="218" height="20" rx="3" fill="#EF4444" />
      <text x="121" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Non-Idempotent Real-World Action</text>
    </g>

    <!-- Deterministic Hash Formula -->
    <g transform="translate(14, 152)">
      <rect width="242" height="114" rx="6" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#581C87">Cryptographic Nonce Generator</text>
      <text x="12" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">Combines trajectory context invariants:</text>
      
      <rect x="12" y="42" width="218" height="34" rx="4" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1" />
      <text x="18" y="56" font-family="monospace" font-size="7.5" fill="#581C87">η = SHA256(SessionID || StepNum ||</text>
      <text x="32" y="68" font-family="monospace" font-size="7.5" fill="#581C87">ToolName || CanonicalJSON(args))</text>

      <text x="12" y="90" font-family="monospace" font-size="8" font-weight="600" fill="#0F172A">Key: <tspan fill="#7E22CE">idem_8f3d1b94...</tspan></text>
      <text x="12" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#059669">✓ Survives agent retry and crash loops</text>
    </g>

    <!-- Outbound RPC Envelope -->
    <g transform="translate(14, 276)">
      <rect width="242" height="90" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Outbound RPC with Header</text>
      <text x="12" y="34" font-family="monospace" font-size="8" fill="#475569">POST /mcp/tools/call</text>
      <text x="12" y="48" font-family="monospace" font-size="8" font-weight="700" fill="#7E22CE">Idempotency-Key: idem_8f3d1b94</text>
      <text x="12" y="62" font-family="monospace" font-size="8" fill="#475569">Payload: { tool: "transfer_funds" }</text>
      <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3B82F6">Transmitted over stdio / HTTP SSE</text>
    </g>
  </g>

  <!-- Flow Arrow from Step 1 to Step 2 -->
  <line x1="294" y1="240" x2="318" y2="240" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- STEP 2: Distributed Idempotency Filter & Lock Manager (Middle Card) -->
  <g transform="translate(318, 66)">
    <rect width="330" height="380" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="330" height="36" rx="8" fill="url(#grad-card-header)" />
    <rect y="28" width="330" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="330" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">2. Idempotency Filter &amp; Lock Gateway</text>

    <!-- State Machine & Redis / Memory Store -->
    <g transform="translate(14, 46)">
      <rect width="302" height="110" rx="6" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#581C87">Distributed State Store Lookup (Redis / DynamoDB)</text>
      
      <rect x="12" y="24" width="278" height="24" rx="3" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1" />
      <text x="20" y="38" font-family="monospace" font-size="8" font-weight="600" fill="#6B21A8">GET idem_8f3d1b94 → Check State</text>

      <!-- Three Branches -->
      <g transform="translate(12, 54)">
        <rect x="0" y="0" width="88" height="46" rx="4" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
        <text x="44" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#065F46" text-anchor="middle">NOT FOUND</text>
        <text x="44" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#047857" text-anchor="middle">First Execution</text>
        <text x="44" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#047857" text-anchor="middle">→ Acquire Lock</text>

        <rect x="94" y="0" width="88" height="46" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <text x="138" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">IN_FLIGHT</text>
        <text x="138" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#B45309" text-anchor="middle">Concurrent Retry</text>
        <text x="138" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#B45309" text-anchor="middle">→ Wait / 409</text>

        <rect x="188" y="0" width="90" height="46" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
        <text x="233" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#1E40AF" text-anchor="middle">COMPLETED</text>
        <text x="233" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#1D4ED8" text-anchor="middle">Previous Success</text>
        <text x="233" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">→ Return Cache</text>
      </g>
    </g>

    <!-- Deduplication Fast-Path -->
    <g transform="translate(14, 166)">
      <rect width="302" height="96" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#166534">Deduplication Replay Fast-Path (Cache Hit)</text>
      <text x="12" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532D">If state is <tspan font-weight="700">COMPLETED</tspan>, bypass tool sandbox completely:</text>
      
      <rect x="12" y="38" width="278" height="34" rx="4" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1" />
      <text x="20" y="52" font-family="monospace" font-size="7.5" fill="#15803D">HTTP 200 OK: {"status": "success", "tx_id": "9842"}</text>
      <text x="20" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#166534">X-Cache-Lookup: HIT (Zero external calls executed)</text>

      <rect x="12" y="76" width="278" height="16" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.5" />
      <text x="151" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="middle">PROTECTED: PREVENTS DUPLICATE $5,000 TRANSFER</text>
    </g>

    <!-- Atomic Lock Acquisition -->
    <g transform="translate(14, 272)">
      <rect width="302" height="94" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Atomic Lock Lease Acquisition</text>
      <text x="12" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">For first attempt, acquire distributed lease:</text>
      <rect x="12" y="40" width="278" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="20" y="55" font-family="monospace" font-size="8" fill="#0F172A">SET key "IN_FLIGHT" NX PX 30000</text>
      <text x="12" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#059669">✓ Heartbeat watchdog extends lease during long tasks</text>
    </g>
  </g>

  <!-- Flow Arrow from Step 2 to Step 3 -->
  <line x1="648" y1="240" x2="674" y2="240" stroke="#7E22CE" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- STEP 3: Execution, WAL & State Commit (Right Card) -->
  <g transform="translate(674, 66)">
    <rect width="262" height="380" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="262" height="36" rx="8" fill="url(#grad-card-header)" />
    <rect y="28" width="262" height="8" fill="#F3E8FF" />
    <line x1="0" y1="36" x2="262" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581C87">3. Execution &amp; WAL Commit</text>

    <!-- Write Ahead Log -->
    <g transform="translate(12, 46)">
      <rect width="238" height="82" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Write-Ahead Log (WAL)</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Appends intent record before mutate</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Stores compensating saga inverse C_i</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#D97706">⚠ Enables crash recovery on reboot</text>
      <rect x="10" y="66" width="100" height="10" rx="3" fill="#E2E8F0" />
      <text x="60" y="74" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle">WAL Append-Only</text>
    </g>

    <!-- Sandbox Execution Engine -->
    <g transform="translate(12, 138)">
      <rect width="238" height="96" rx="6" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#581C87">Isolated Sandbox Execution</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">• Dispatches to physical backend</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">• Captures stdout, stderr, exit code</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">• Enforces timeout budgets (e.g. 30s)</text>
      <rect x="10" y="68" width="218" height="20" rx="3" fill="#9333EA" />
      <text x="119" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Single Physical Side-Effect Triggered</text>
    </g>

    <!-- Atomic State Commit -->
    <g transform="translate(12, 244)">
      <rect width="238" height="122" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#166534">Atomic State Transition</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532D">1. Commit transaction in backend DB</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532D">2. Transition key to <tspan font-weight="700">COMPLETED</tspan></text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532D">3. Cache response payload (TTL 24h)</text>
      <text x="10" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#14532D">4. Release distributed lease lock</text>
      <rect x="10" y="84" width="218" height="26" rx="4" fill="#15803D" />
      <text x="119" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Exactly-Once Semantics Guaranteed</text>
    </g>
  </g>

  <!-- Bottom Systems Principle Banner -->
  <g transform="translate(24, 458)">
    <rect width="912" height="54" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" filter="url(#shadow-sm)" />
    <rect x="12" y="12" width="76" height="30" rx="4" fill="#581C87" />
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#E9D5FF" text-anchor="middle">SYSTEMS</text>
    <text x="50" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRINCIPLE</text>
    <text x="100" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FAF5FF">Autonomous Retry Loops Demand Distributed Idempotency at the Wire Layer</text>
    <text x="100" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#C7D2FE">Because stochastic models spontaneously retry ambiguous returns, tools must bind execution to deterministic trajectory nonces to prevent catastrophic duplicate mutations.</text>
  </g>
</svg>