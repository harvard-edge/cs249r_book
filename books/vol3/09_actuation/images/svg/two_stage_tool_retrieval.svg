<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" fill="#FFFFFF"/>

  <!-- Figure Badge & Title -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="88" height="20" rx="4" fill="#581C87" />
    <text x="44" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FIGURE 9.6</text>
    <text x="100" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Two-Stage Dynamic Tool Retrieval and Schema Binding Pipeline</text>
    <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Decoupling offline M-tool vector catalogs from runtime inference context via sub-millisecond MIPS and dynamic DFA logit masking</text>
  </g>

  <!-- OFFLINE INDEXING (Top Layer) -->
  <g filter="url(#shadow)" transform="translate(40, 65)">
    <rect width="840" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="840" height="24" rx="8" fill="#475569"/>
    <rect y="16" width="840" height="8" fill="#475569"/>
    <text x="420" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">OFFLINE TOOL REGISTRY &amp; DENSE VECTOR INDEX (M = 3,200+ Tools)</text>
    
    <!-- Tool Badges -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="115" height="26" rx="4" fill="#EDE9FE" stroke="#8B5CF6"/>
      <text x="57" y="17" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="600" fill="#5B21B6">T_1: GitCommit</text>
      
      <rect x="125" y="0" width="115" height="26" rx="4" fill="#EDE9FE" stroke="#8B5CF6"/>
      <text x="182" y="17" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="600" fill="#5B21B6">T_2: DockerRun</text>
      
      <rect x="250" y="0" width="115" height="26" rx="4" fill="#EDE9FE" stroke="#8B5CF6"/>
      <text x="307" y="17" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="600" fill="#5B21B6">T_3: K8sDeploy</text>
      
      <text x="390" y="18" font-size="12" font-weight="700" fill="#94A3B8">...</text>
      
      <rect x="425" y="0" width="115" height="26" rx="4" fill="#EDE9FE" stroke="#8B5CF6"/>
      <text x="482" y="17" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="600" fill="#5B21B6">T_M: S3PutObject</text>
    </g>

    <text x="580" y="52" font-size="9" font-weight="600" fill="#334155">Offline Dense Embedding:</text>
    <text x="580" y="68" font-size="8.5" font-family="monospace" fill="#64748B">e_i = Embed(Name || Docstring || Signature)</text>
  </g>

  <!-- Connector: Top to Middle -->
  <path d="M 460,155 L 460,190" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="475" y="176" font-size="8.5" font-weight="600" fill="#64748B">HNSW Index Synced</text>

  <!-- STAGE 1: COARSE MIPS RETRIEVAL (Middle Layer) -->
  <g filter="url(#shadow)" transform="translate(40, 195)">
    <rect width="840" height="110" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
    <rect width="840" height="24" rx="8" fill="#581C87"/>
    <rect y="16" width="840" height="8" fill="#581C87"/>
    <text x="420" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">STAGE 1: COARSE MAXIMUM INNER PRODUCT SEARCH (MIPS)</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 34)">
      <!-- Left: Agent Query Formulation -->
      <rect x="0" y="0" width="250" height="64" rx="6" fill="#FFFFFF" stroke="#D8B4FE"/>
      <text x="125" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581C87">Agent Trajectory State s_t</text>
      <text x="12" y="34" font-size="8.5" fill="#475569">Deliberative Thought / Context:</text>
      <text x="12" y="48" font-size="8" font-family="monospace" fill="#1E293B">"Rollback failed canary pod"</text>
      <text x="12" y="60" font-size="7.5" fill="#6B21A8">e_q = DenseEmbed(s_t)</text>

      <!-- Arrow -->
      <path d="M 255,32 L 285,32" fill="none" stroke="#581C87" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

      <!-- Center: ANN Search -->
      <rect x="290" y="0" width="250" height="64" rx="6" fill="#FFFFFF" stroke="#D8B4FE"/>
      <text x="415" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581C87">HNSW Graph Traversal</text>
      <text x="302" y="34" font-size="8.5" font-family="monospace" fill="#475569">score(T_i, q) = cos(e_q, e_i)</text>
      <text x="302" y="48" font-size="8.5" fill="#15803D">Search Latency: &lt; 1.2 ms</text>
      <text x="302" y="60" font-size="7.5" fill="#64748B">Explores top-layer entry points</text>

      <!-- Arrow -->
      <path d="M 545,32 L 575,32" fill="none" stroke="#581C87" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

      <!-- Right: Candidate Subset -->
      <rect x="580" y="0" width="220" height="64" rx="6" fill="#F0FDF4" stroke="#16A34A"/>
      <text x="690" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803D">Selected Active Subset (K &lt;&lt; M)</text>
      <text x="592" y="34" font-size="8.5" font-weight="600" fill="#166534">Top-K Tools (K = 4):</text>
      <text x="592" y="48" font-size="8" font-family="monospace" fill="#14532D">1. K8sRollback  2. K8sStatus</text>
      <text x="592" y="60" font-size="8" font-family="monospace" fill="#14532D">3. PodLogs      4. AlertQuery</text>
    </g>
  </g>

  <!-- Connector: Middle to Bottom -->
  <path d="M 460,305 L 460,340" fill="none" stroke="#581C87" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="475" y="326" font-size="8.5" font-weight="600" fill="#581C87">Bind Active Tools</text>

  <!-- STAGE 2: JUST-IN-TIME SCHEMA BINDING & DFA MASKING (Bottom Layer) -->
  <g filter="url(#shadow)" transform="translate(40, 345)">
    <rect width="840" height="135" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
    <rect width="840" height="24" rx="8" fill="#0369A1"/>
    <rect y="16" width="840" height="8" fill="#0369A1"/>
    <text x="420" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">STAGE 2: JUST-IN-TIME SCHEMA BINDING &amp; RUNTIME LOGIT MASKING</text>

    <!-- Sub-steps -->
    <g transform="translate(20, 36)">
      <!-- Step 2A -->
      <rect x="0" y="0" width="250" height="85" rx="6" fill="#FFFFFF" stroke="#BAE6FD"/>
      <text x="15" y="18" font-size="9.5" font-weight="700" fill="#0369A1">1. Context Budget Injection</text>
      <text x="15" y="36" font-size="8.5" fill="#475569">Inject ONLY the K=4 JSON schemas:</text>
      <text x="15" y="52" font-size="9" font-weight="700" fill="#0284C7">1,200 tokens context tax</text>
      <text x="15" y="68" font-size="8" fill="#16A34A">Saves 78,800 tokens vs. all M schemas</text>
      <text x="15" y="80" font-size="8" font-weight="600" fill="#16A34A">(98.5% prompt tax reduction)</text>

      <!-- Step 2B -->
      <rect x="275" y="0" width="250" height="85" rx="6" fill="#FFFFFF" stroke="#BAE6FD"/>
      <text x="290" y="18" font-size="9.5" font-weight="700" fill="#0369A1">2. Runtime DFA Masking</text>
      <text x="290" y="36" font-size="8.5" fill="#475569">Compile K schemas into state machine:</text>
      <text x="290" y="52" font-size="8.5" font-family="monospace" fill="#0369A1">M_t = BuildLogitBitmask(DFA_K)</text>
      <text x="290" y="68" font-size="8" fill="#475569">Zero-overhead GPU tensor mask</text>
      <text x="290" y="80" font-size="8" font-weight="600" fill="#16A34A">100% syntactically valid parameters</text>

      <!-- Step 2C -->
      <rect x="550" y="0" width="250" height="85" rx="6" fill="#FFFFFF" stroke="#BAE6FD"/>
      <text x="565" y="18" font-size="9.5" font-weight="700" fill="#0369A1">3. Accelerated Forward Pass</text>
      <text x="565" y="36" font-size="8.5" fill="#475569">Autoregressive GPU execution:</text>
      <text x="565" y="52" font-size="8.5" font-weight="700" fill="#0284C7">Sub-millisecond TTFT prefill</text>
      <text x="565" y="68" font-size="8" fill="#475569">Eliminates attention haystack noise</text>
      <text x="565" y="80" font-size="8" font-weight="600" fill="#16A34A">Zero out-of-catalog hallucinations</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(40, 498)">
    <text x="0" y="18" font-size="9.5" font-weight="700" fill="#334155">System Performance Gains:</text>
    <text x="160" y="18" font-size="9" fill="#0F172A"><tspan font-weight="700" fill="#16A34A">98.5% Prompt Tax Reduction</tspan> (1.2k vs 80k tokens) • <tspan font-weight="700" fill="#2563EB">1.2 ms Retrieval Overhead</tspan> • <tspan font-weight="700" fill="#581C87">100% Guaranteed JSON ABI Adherence</tspan></text>
  </g>
</svg>
