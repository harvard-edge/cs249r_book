<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#7E22CE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowHeadPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7E22CE"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrowHeadAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="620" fill="#FFFFFF"/>

  <!-- Triangulation Perimeter Polygon -->
  <polygon points="420,95 170,485 670,485" fill="url(#triGrad)" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="6,4"/>

  <!-- Directed Convergence Flow Vectors into Center -->
  <line x1="420" y1="155" x2="420" y2="235" stroke="#7E22CE" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowHeadPurple)"/>
  <line x1="285" y1="420" x2="355" y2="355" stroke="#2563EB" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowHeadBlue)"/>
  <line x1="555" y1="420" x2="485" y2="355" stroke="#D97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowHeadAmber)"/>

  <!-- Perimeter Edge Labels (Outside Triangle) -->
  <text x="240" y="265" transform="rotate(-57, 240, 265)" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">COMPUTATIONAL BOUNDS &amp; ROOFLINES</text>
  <text x="600" y="265" transform="rotate(57, 600, 265)" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">DEPLOYED VERIFICATION &amp; REPLAY</text>
  <text x="420" y="585" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">HARDWARE TELEMETRY &amp; BOTTLENECK AUDITING</text>

  <!-- ============================================================ -->
  <!-- CENTER CORE: Grounded Agentic MLSys Engineering             -->
  <!-- ============================================================ -->
  <g filter="url(#cardShadow)">
    <rect x="290" y="240" width="260" height="115" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2.2"/>
    <rect x="290" y="240" width="260" height="28" rx="8" fill="#581C87"/>
    <rect x="290" y="260" width="260" height="8" fill="#581C87"/>
    <text x="420" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">EMPIRICAL TRIANGULATION</text>
    <text x="420" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3B0764">Grounded Agentic MLSys</text>
    <text x="420" y="306" text-anchor="middle" font-size="9.5" fill="#581C87" font-weight="600">• Zero Hallucination Invariants</text>
    <text x="420" y="322" text-anchor="middle" font-size="9.5" fill="#581C87" font-weight="600">• Measured Systems Physics</text>
    <text x="420" y="338" text-anchor="middle" font-size="9.5" fill="#581C87" font-weight="600">• Production Reliability at Scale</text>
  </g>

  <!-- ============================================================ -->
  <!-- VERTEX 1 (TOP): Academic Foundations                        -->
  <!-- ============================================================ -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="25" width="300" height="125" rx="8" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.6"/>
    <rect x="270" y="25" width="300" height="26" rx="8" fill="#F3E8FF"/>
    <rect x="270" y="43" width="300" height="8" fill="#F3E8FF"/>
    <circle cx="288" cy="38" r="5" fill="#7E22CE"/>
    <text x="302" y="42" font-size="11" font-weight="700" fill="#581C87">1. Academic Foundations</text>
    <text x="420" y="69" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">Peer-Reviewed Rigor &amp; Invariant Proofs</text>
    <text x="420" y="85" text-anchor="middle" font-size="8.5" fill="#6B7280">NeurIPS, ICML, ICLR, ASPLOS, OSDI, SOSP</text>
    <text x="420" y="101" text-anchor="middle" font-size="8.5" fill="#4B5563">Algorithmic complexity, state-action proofs,</text>
    <text x="420" y="115" text-anchor="middle" font-size="8.5" fill="#4B5563">formal fault models, and verified invariants</text>
    <text x="420" y="132" text-anchor="middle" font-size="8.5" font-style="italic" fill="#7E22CE">Guarantees theoretical soundness &amp; durable concepts</text>
  </g>

  <!-- ============================================================ -->
  <!-- VERTEX 2 (BOTTOM LEFT): Systems Physics                     -->
  <!-- ============================================================ -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="420" width="290" height="135" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="25" y="420" width="290" height="26" rx="8" fill="#EFF6FF"/>
    <rect x="25" y="438" width="290" height="8" fill="#EFF6FF"/>
    <circle cx="43" cy="433" r="5" fill="#2563EB"/>
    <text x="57" y="437" font-size="11" font-weight="700" fill="#1E40AF">2. Systems Physics</text>
    <text x="170" y="464" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">Silicon &amp; Hardware Execution Limits</text>
    <text x="170" y="480" text-anchor="middle" font-size="8.5" fill="#1E3A8A">Memory Wall &amp; HBM Streaming Bandwidth</text>
    <text x="170" y="495" text-anchor="middle" font-size="8.5" fill="#4B5563">Roofline arithmetic intensity constraints</text>
    <text x="170" y="509" text-anchor="middle" font-size="8.5" fill="#4B5563">Quadratic attention memory &amp; KV cache growth</text>
    <text x="170" y="523" text-anchor="middle" font-size="8.5" fill="#4B5563">PCIe Gen5 / CXL interconnect latencies</text>
    <text x="170" y="540" text-anchor="middle" font-size="8.5" font-style="italic" fill="#2563EB">Dictates what physical hardware permits</text>
  </g>

  <!-- ============================================================ -->
  <!-- VERTEX 3 (BOTTOM RIGHT): Production Reality                 -->
  <!-- ============================================================ -->
  <g filter="url(#cardShadow)">
    <rect x="525" y="420" width="290" height="135" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
    <rect x="525" y="420" width="290" height="26" rx="8" fill="#FFFBEB"/>
    <rect x="525" y="438" width="290" height="8" fill="#FFFBEB"/>
    <circle cx="543" cy="433" r="5" fill="#D97706"/>
    <text x="557" y="437" font-size="11" font-weight="700" fill="#92400E">3. Production Reality</text>
    <text x="670" y="464" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">Frontier Deployments &amp; Failure Modes</text>
    <text x="670" y="480" text-anchor="middle" font-size="8.5" fill="#78350F">OpenAI, Anthropic, Google Frontier Reports</text>
    <text x="670" y="495" text-anchor="middle" font-size="8.5" fill="#4B5563">Fail-plausible semantic defect containment</text>
    <text x="670" y="509" text-anchor="middle" font-size="8.5" fill="#4B5563">Hardware sandbox isolation (Firecracker/gVisor)</text>
    <text x="670" y="523" text-anchor="middle" font-size="8.5" fill="#4B5563">SWE-bench, live telemetry &amp; trace replay</text>
    <text x="670" y="540" text-anchor="middle" font-size="8.5" font-style="italic" fill="#D97706">Grounds systems in operational truth</text>
  </g>
</svg>
