<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 615" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="615" fill="#ffffff"/>
  <g transform="translate(0, -40)">



  <!-- Triangulation Perimeter Polygon -->
  <polygon points="440,135 190,535 690,535" fill="#f1f5f9" fill-opacity="0.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Directed Convergence Flow Vectors into Center -->
  <line x1="440" y1="200" x2="440" y2="278" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <line x1="280" y1="470" x2="348" y2="400" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <line x1="600" y1="470" x2="532" y2="400" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>

  <!-- Perimeter Edge Labels (Outside Triangle) -->
  <text x="245" y="300" transform="rotate(-57, 245, 300)" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.5">COMPUTATIONAL BOUNDS &amp; ROOFLINES</text>
  <text x="635" y="300" transform="rotate(57, 635, 300)" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.5">DEPLOYED VERIFICATION &amp; REPLAY</text>
  <text x="440" y="618" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.5">HARDWARE TELEMETRY &amp; BOTTLENECK AUDITING</text>

  <!-- ============================================================ -->
  <!-- CENTER CORE: Grounded Agentic MLSys Engineering             -->
  <!-- ============================================================ -->
  <g transform="translate(300, 278)">
    <rect x="0" y="0" width="280" height="120" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a" letter-spacing="0.5">EMPIRICAL TRIANGULATION</text>
    <text x="140" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Grounded Agentic MLSys</text>
    <text x="140" y="64" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">• Zero Hallucination Invariants</text>
    <text x="140" y="80" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">• Measured Systems Physics</text>
    <text x="140" y="96" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">• Production Reliability at Scale</text>
  </g>

  <!-- ============================================================ -->
  <!-- VERTEX 1 (TOP): Academic Foundations                        -->
  <!-- ============================================================ -->
  <g transform="translate(290, 75)">
    <rect x="0" y="0" width="300" height="125" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. ACADEMIC FOUNDATIONS</text>
    <text x="150" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Peer-Reviewed Rigor &amp; Invariant Proofs</text>
    <text x="150" y="60" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">NeurIPS, ICML, ICLR, ASPLOS, OSDI, SOSP</text>
    <text x="150" y="76" text-anchor="middle" font-size="8" fill="#64748b">Algorithmic complexity, state-action proofs,</text>
    <text x="150" y="90" text-anchor="middle" font-size="8" fill="#64748b">formal fault models, and verified invariants</text>
    <text x="150" y="108" text-anchor="middle" font-size="8" font-style="italic" fill="#7c3aed">Guarantees theoretical soundness &amp; durable concepts</text>
  </g>

  <!-- ============================================================ -->
  <!-- VERTEX 2 (BOTTOM LEFT): Systems Physics                     -->
  <!-- ============================================================ -->
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="300" height="135" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. SYSTEMS PHYSICS</text>
    <text x="150" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Silicon &amp; Hardware Execution Limits</text>
    <text x="150" y="60" text-anchor="middle" font-size="8" font-weight="600" fill="#0369a1">Memory Wall &amp; HBM Streaming Bandwidth</text>
    <text x="150" y="75" text-anchor="middle" font-size="8" fill="#64748b">Roofline arithmetic intensity constraints</text>
    <text x="150" y="89" text-anchor="middle" font-size="8" fill="#64748b">Quadratic attention memory &amp; KV cache growth</text>
    <text x="150" y="103" text-anchor="middle" font-size="8" fill="#64748b">PCIe Gen5 / CXL interconnect latencies</text>
    <text x="150" y="120" text-anchor="middle" font-size="8" font-style="italic" fill="#0284c7">Dictates what physical hardware permits</text>
  </g>

  <!-- ============================================================ -->
  <!-- VERTEX 3 (BOTTOM RIGHT): Production Reality                 -->
  <!-- ============================================================ -->
  <g transform="translate(540, 470)">
    <rect x="0" y="0" width="300" height="135" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">3. PRODUCTION REALITY</text>
    <text x="150" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Frontier Deployments &amp; Failure Modes</text>
    <text x="150" y="60" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">OpenAI, Anthropic, Google Frontier Reports</text>
    <text x="150" y="75" text-anchor="middle" font-size="8" fill="#64748b">Fail-plausible semantic defect containment</text>
    <text x="150" y="89" text-anchor="middle" font-size="8" fill="#64748b">Hardware sandbox isolation (Firecracker/gVisor)</text>
    <text x="150" y="103" text-anchor="middle" font-size="8" fill="#64748b">SWE-bench, live telemetry &amp; trace replay</text>
    <text x="150" y="120" text-anchor="middle" font-size="8" font-style="italic" fill="#d97706">Grounds systems in operational truth</text>
  </g>
</g>
</svg>