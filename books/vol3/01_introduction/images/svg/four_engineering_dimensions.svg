<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dim" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#FFFFFF"/>

  <!-- Root Header Box -->
  <g transform="translate(140, 16)">
    <rect width="600" height="42" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
    <text x="300" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="0.5">THE FOUR ENGINEERING DIMENSIONS OF AN AGENTIC TRAJECTORY</text>
  </g>

  <!-- Distribution Bus Lines -->
  <line x1="440" y1="58" x2="440" y2="78" stroke="#475569" stroke-width="1.4"/>
  <line x1="120" y1="78" x2="760" y2="78" stroke="#475569" stroke-width="1.4"/>

  <!-- Drop Lines to Cards -->
  <line x1="120" y1="78" x2="120" y2="96" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dim)"/>
  <line x1="333" y1="78" x2="333" y2="96" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dim)"/>
  <line x1="547" y1="78" x2="547" y2="96" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dim)"/>
  <line x1="760" y1="78" x2="760" y2="96" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dim)"/>

  <!-- Card 1: DURATION -->
  <g transform="translate(20, 98)">
    <rect width="200" height="142" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="200" height="32" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">1. DURATION</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1E293B">Wall-Clock Latency Sum</text>
    <text x="100" y="70" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803D">T_task = Σ(T_m + T_t + T_w)</text>
    <line x1="15" y1="84" x2="185" y2="84" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="102" font-size="8.5" fill="#475569">• Model TTFT + Decode ITL</text>
    <text x="20" y="118" font-size="8.5" fill="#475569">• Tool runtime &amp; build latency</text>
    <text x="20" y="132" font-size="8.5" fill="#475569">• Network RTT &amp; human queues</text>
  </g>

  <!-- Card 2: STATE -->
  <g transform="translate(233, 98)">
    <rect width="200" height="142" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="200" height="32" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">2. STATE</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1E293B">Working vs. Persistent</text>
    <text x="100" y="70" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" fill="#1D4ED8">S_active ⊆ S_context ⊆ S_log</text>
    <line x1="15" y1="84" x2="185" y2="84" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="102" font-size="8.5" fill="#475569">• Ephemeral KV cache pages</text>
    <text x="20" y="118" font-size="8.5" fill="#475569">• Working context window limits</text>
    <text x="20" y="132" font-size="8.5" fill="#475569">• Append-only durable WAL logs</text>
  </g>

  <!-- Card 3: AUTHORITY -->
  <g transform="translate(447, 98)">
    <rect width="200" height="142" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="200" height="32" rx="5" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">3. AUTHORITY</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1E293B">Permitted Blast Radius</text>
    <text x="100" y="70" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" fill="#C2410C">A = 0 (Zero Ambient Priv.)</text>
    <line x1="15" y1="84" x2="185" y2="84" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="102" font-size="8.5" fill="#475569">• Read-only vs. mutating capabilities</text>
    <text x="20" y="118" font-size="8.5" fill="#475569">• Hardened microVM sandboxing</text>
    <text x="20" y="132" font-size="8.5" fill="#475569">• Isolated ephemeral worktrees</text>
  </g>

  <!-- Card 4: EVIDENCE -->
  <g transform="translate(660, 98)">
    <rect width="200" height="142" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="200" height="32" rx="5" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21A8">4. EVIDENCE</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1E293B">Verification Closure</text>
    <text x="100" y="70" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" fill="#7E22CE">V(τ) ∈ {0, 1} (Endpoint Oracle)</text>
    <line x1="15" y1="84" x2="185" y2="84" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="102" font-size="8.5" fill="#475569">• Deterministic compiler exit codes</text>
    <text x="20" y="118" font-size="8.5" fill="#475569">• AST linters &amp; formal schemas</text>
    <text x="20" y="132" font-size="8.5" fill="#475569">• Sealed ground-truth test suites</text>
  </g>
</svg>
