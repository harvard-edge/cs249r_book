<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-trans" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="440" fill="#ffffff" rx="4"/>

  <!-- Column Headers -->
  <text x="195" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.3">TRADITIONAL SYSTEMS STACK</text>
  <text x="685" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="0.3">AGENTIC SYSTEMS STACK (VOL III)</text>

  <!-- Central Dashed Divider Line -->
  <line x1="440" y1="38" x2="440" y2="425" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- LAYER 1: Request vs Goal -->
  <g transform="translate(25, 44)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">User Request / API Call</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">Short-lived, synchronous request-response unit</text>
  </g>
  <line x1="372" y1="71" x2="508" y2="71" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="63" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed">request to goal</text>
  <g transform="translate(515, 44)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">User Goal / Delegated Task</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#7c3aed">Long-horizon intent, constraints, and policy context</text>
  </g>

  <!-- LAYER 2: Service/RPC vs Trajectory -->
  <g transform="translate(25, 106)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Service / RPC / Function</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">Stateless admission, distributed tracing, retries</text>
  </g>
  <line x1="372" y1="133" x2="508" y2="133" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="125" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed">request to trajectory</text>
  <g transform="translate(515, 106)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Agentic Trajectory</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#7c3aed">Model calls, tool actuation, memory, waits, repairs</text>
  </g>

  <!-- LAYER 3: Process/Thread vs Agent Runtime -->
  <g transform="translate(25, 168)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Process / Thread / Container</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">Scheduling, address space, file tables, isolation</text>
  </g>
  <line x1="372" y1="195" x2="508" y2="195" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="187" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed">process to runtime state</text>
  <g transform="translate(515, 168)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">Agent Runtime &amp; Control Plane</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#0284c7">Context assembly, sandboxing, guardrails, ACB</text>
  </g>

  <!-- LAYER 4: OS Kernel vs Managed Trajectory Control -->
  <g transform="translate(25, 230)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Operating System Kernel</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">Virtual memory, POSIX protection rings, network</text>
  </g>
  <line x1="372" y1="257" x2="508" y2="257" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="249" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed">kernel to trajectory control</text>
  <g transform="translate(515, 230)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Managed Trajectory Control Layer</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#7c3aed">Descriptor fields, invariant verifiers, capability leases</text>
  </g>

  <!-- LAYER 5: ISA/Drivers vs AI-Native Infrastructure -->
  <g transform="translate(25, 292)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">ISA, Runtimes, Drivers</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">Hardware-software opcodes, system call boundary</text>
  </g>
  <line x1="372" y1="319" x2="508" y2="319" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="311" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed">syscalls to tools/context</text>
  <g transform="translate(515, 292)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">AI-Native Infrastructure</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#92400e">Model serving, Radix KV cache, tool protocols (MCP)</text>
  </g>

  <!-- LAYER 6: Hardware Substrate vs Heterogeneous Substrate -->
  <g transform="translate(25, 354)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Hardware Substrate</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">CPU cores, DRAM, local storage, network, power</text>
  </g>
  <line x1="372" y1="381" x2="508" y2="381" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="373" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed">counters to physical cost</text>
  <g transform="translate(515, 354)">
    <rect x="0" y="0" width="340" height="54" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <text x="170" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Heterogeneous Substrate</text>
    <text x="170" y="40" text-anchor="middle" font-size="8.5" fill="#475569">GPU, NPU, CPU, HBM3e, CXL fabric, energy, carbon</text>
  </g>
</svg>
