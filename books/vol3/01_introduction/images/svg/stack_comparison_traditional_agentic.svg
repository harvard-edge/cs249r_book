<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-amethyst" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="460" fill="#FFFFFF" rx="2"/>

  <!-- Column Headers -->
  <text x="200" y="28" text-anchor="middle" font-size="10" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#334155" letter-spacing="0.5">TRADITIONAL SYSTEMS STACK</text>
  <text x="700" y="28" text-anchor="middle" font-size="10" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87" letter-spacing="0.5">AGENTIC SYSTEMS STACK (VOLUME III)</text>

  <!-- Central Dashed Boundary -->
  <line x1="450" y1="40" x2="450" y2="445" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="450" y="32" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#94A3B8" letter-spacing="0.3">SYSTEMS REFACTORING</text>

  <!-- ==================== LAYER 5 ==================== -->
  <!-- Left: Request -->
  <g transform="translate(25, 48)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect width="350" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">L5: USER REQUEST / API CALL</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">τ ~ 10⁻¹ s</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#334155">Synchronous Request-Response Unit</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Stateless admission • transient memory lease</text>
  </g>
  <!-- Connector -->
  <line x1="385" y1="76" x2="515" y2="76" stroke="#581C87" stroke-width="1.3" marker-end="url(#arrow-amethyst)"/>
  <text x="450" y="70" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">Request → Goal</text>
  <!-- Right: Goal -->
  <g transform="translate(525, 48)">
    <rect width="350" height="56" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <rect width="350" height="20" rx="2" fill="#F3E8FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">L5: DELEGATED GOAL &amp; CONTRACT (g)</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">τ ~ 10¹–10⁴ s</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#581C87">Long-Horizon Task Intent &amp; Policy Scope</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">Authority bounds • completion acceptance criteria</text>
  </g>

  <!-- ==================== LAYER 4 ==================== -->
  <!-- Left: Service/RPC -->
  <g transform="translate(25, 114)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect width="350" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">L4: SERVICE / RPC PIPELINE</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">gRPC / REST</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#334155">Stateless Call Graphs &amp; Retries</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Idempotent retry • independent trace spans</text>
  </g>
  <!-- Connector -->
  <line x1="385" y1="142" x2="515" y2="142" stroke="#581C87" stroke-width="1.3" marker-end="url(#arrow-amethyst)"/>
  <text x="450" y="136" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">RPC → Trajectory</text>
  <!-- Right: Trajectory -->
  <g transform="translate(525, 114)">
    <rect width="350" height="56" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <rect width="350" height="20" rx="2" fill="#F3E8FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">L4: STATEFUL AGENTIC TRAJECTORY (τ)</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">Part I &amp; VI</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#581C87">Iterative Closed-Loop Execution Unit</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">Model deliberation • tool waits • compensating Sagas</text>
  </g>

  <!-- ==================== LAYER 3 ==================== -->
  <!-- Left: Process/Container -->
  <g transform="translate(25, 180)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect width="350" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">L3: PROCESS / THREAD CONTAINER</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">PID / cgroup</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#334155">OS Address Space &amp; File Descriptor Tables</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Process Control Block (PCB) • memory paging</text>
  </g>
  <!-- Connector -->
  <line x1="385" y1="208" x2="515" y2="208" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-amethyst)"/>
  <text x="450" y="202" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0284C7">PCB → ACB State</text>
  <!-- Right: Agent Runtime -->
  <g transform="translate(525, 180)">
    <rect width="350" height="56" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <rect width="350" height="20" rx="2" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0369A1">L3: AGENT RUNTIME &amp; CONTROL PLANE</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#0284C7">Part IV: OS</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#0369A1">Agent Control Block (ACB) Execution Engine</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#0284C7">Context assembly • MicroVM sandbox • preemption loops</text>
  </g>

  <!-- ==================== LAYER 2 ==================== -->
  <!-- Left: OS Kernel -->
  <g transform="translate(25, 246)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect width="350" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">L2: OPERATING SYSTEM KERNEL</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Ring 0 / VMM</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#334155">Virtual Memory, Inode Tables, POSIX Rings</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Deterministic hardware traps • complete mediation</text>
  </g>
  <!-- Connector -->
  <line x1="385" y1="274" x2="515" y2="274" stroke="#581C87" stroke-width="1.3" marker-end="url(#arrow-amethyst)"/>
  <text x="450" y="268" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">Kernel → Invariant</text>
  <!-- Right: Managed Trajectory Control Layer -->
  <g transform="translate(525, 246)">
    <rect width="350" height="56" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <rect width="350" height="20" rx="2" fill="#F3E8FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">L2: MANAGED TRAJECTORY CONTROL LAYER</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">Part IV: Ch 09–11</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#581C87">Invariant Closure &amp; Fail-Plausible Mitigation</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">WAL event sourcing • capability attenuation • watchdog timers</text>
  </g>

  <!-- ==================== LAYER 1 ==================== -->
  <!-- Left: ISA / Drivers -->
  <g transform="translate(25, 312)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect width="350" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">L1: HARDWARE ISA &amp; DEVICE DRIVERS</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">x86 / ARM / PCIe</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#334155">Hardware-Software Opcodes &amp; Syscall Boundary</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Deterministic opcode decoding • memory MMIO</text>
  </g>
  <!-- Connector -->
  <line x1="385" y1="340" x2="515" y2="340" stroke="#D97706" stroke-width="1.3" marker-end="url(#arrow-amethyst)"/>
  <text x="450" y="334" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">Syscall → MCP / FSM</text>
  <!-- Right: AI-Native Infrastructure -->
  <g transform="translate(525, 312)">
    <rect width="350" height="56" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <rect width="350" height="20" rx="2" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#B45309">L1: AI-NATIVE PERIPHERALS &amp; PROTOCOLS</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#92400E">Part II &amp; III</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#B45309">Model Context Protocol (MCP) &amp; Grammar Decoding</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#92400E">Radix prefix KV-cache • CFG logit masks • typed tool schema</text>
  </g>

  <!-- ==================== LAYER 0 ==================== -->
  <!-- Left: Silicon Substrate -->
  <g transform="translate(25, 378)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect width="350" height="20" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">L0: HOMOGENEOUS SILICON HARDWARE</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">CPU / DDR</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#334155">Host Processors, Symmetric DRAM, Ethernet</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Fixed clock cycles • microsecond hardware latency</text>
  </g>
  <!-- Connector -->
  <line x1="385" y1="406" x2="515" y2="406" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-amethyst)"/>
  <text x="450" y="400" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#475569">Hardware → Goodput</text>
  <!-- Right: Heterogeneous Accelerator Substrate -->
  <g transform="translate(525, 378)">
    <rect width="350" height="56" rx="2" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
    <rect width="350" height="20" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#1E293B">L0: HETEROGENEOUS ACCELERATOR SUBSTRATE</text>
    <text x="336" y="14" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#475569">Part VI: Fleet</text>
    <text x="14" y="36" font-size="8" font-weight="600" fill="#1E293B">Accelerators, HBM3e, CXL Fabric, Energy Economics</text>
    <text x="14" y="48" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#475569">Disaggregated prefill/decode • trajectory goodput ($/task)</text>
  </g>
</svg>
