<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-trans" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7e22ce"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Column Headers -->
  <text x="200" y="28" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155" letter-spacing="0.2">TRADITIONAL SYSTEMS STACK</text>
  <text x="680" y="28" text-anchor="middle" font-size="11.5" font-weight="700" fill="#581C87" letter-spacing="0.2">AGENTIC SYSTEMS STACK (VOL III)</text>

  <!-- Central Dashed Divider Line -->
  <line x1="440" y1="42" x2="440" y2="425" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- LAYER 1: Request vs Goal -->
  <g transform="translate(30, 46)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">User Request / API Call</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Short-lived, synchronous request-response unit</text>
  </g>
  <line x1="375" y1="72" x2="500" y2="72" stroke="#7e22ce" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="65" text-anchor="middle" font-size="6.8" font-weight="600" fill="#7e22ce">request to goal</text>
  <g transform="translate(510, 46)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#faf5ff" stroke="#581C87" stroke-width="1.4"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">User Goal / Delegated Task</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#6b21a8">Long-horizon intent, constraints, and policy context</text>
  </g>

  <!-- LAYER 2: Service/RPC vs Trajectory -->
  <g transform="translate(30, 108)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Service / RPC / Function</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Stateless admission, distributed tracing, retries</text>
  </g>
  <line x1="375" y1="134" x2="500" y2="134" stroke="#7e22ce" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="127" text-anchor="middle" font-size="6.8" font-weight="600" fill="#7e22ce">request to trajectory</text>
  <g transform="translate(510, 108)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#faf5ff" stroke="#581C87" stroke-width="1.4"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Agentic Trajectory</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#6b21a8">Model calls, tool actuation, memory, waits, repairs</text>
  </g>

  <!-- LAYER 3: Process/Thread vs Agent Runtime -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Process / Thread / Container</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Scheduling, address space, file tables, isolation</text>
  </g>
  <line x1="375" y1="196" x2="500" y2="196" stroke="#7e22ce" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="189" text-anchor="middle" font-size="6.8" font-weight="600" fill="#7e22ce">process to runtime state</text>
  <g transform="translate(510, 170)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#faf5ff" stroke="#581C87" stroke-width="1.4"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Agent Runtime &amp; Control Plane</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#6b21a8">Context assembly, sandboxing, guardrails, ACB</text>
  </g>

  <!-- LAYER 4: OS Kernel vs Managed Trajectory Control -->
  <g transform="translate(30, 232)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Operating System Kernel</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Virtual memory, POSIX protection rings, network</text>
  </g>
  <line x1="375" y1="258" x2="500" y2="258" stroke="#7e22ce" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="251" text-anchor="middle" font-size="6.8" font-weight="600" fill="#7e22ce">kernel to trajectory control</text>
  <g transform="translate(510, 232)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f3e8ff" stroke="#581C87" stroke-width="1.6"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Managed Trajectory Control Layer</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#581C87">Descriptor fields, invariant verifiers, capability leases</text>
  </g>

  <!-- LAYER 5: ISA/Drivers vs AI-Native Infrastructure -->
  <g transform="translate(30, 294)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">ISA, Runtimes, Drivers</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Hardware-software opcodes, system call boundary</text>
  </g>
  <line x1="375" y1="320" x2="500" y2="320" stroke="#7e22ce" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="313" text-anchor="middle" font-size="6.8" font-weight="600" fill="#7e22ce">syscalls to tools/context</text>
  <g transform="translate(510, 294)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#faf5ff" stroke="#581C87" stroke-width="1.4"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">AI-Native Infrastructure</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#6b21a8">Model serving, Radix KV cache, tool protocols (MCP)</text>
  </g>

  <!-- LAYER 6: Hardware Substrate vs Heterogeneous Substrate -->
  <g transform="translate(30, 356)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Hardware Substrate</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">CPU cores, DRAM, local storage, network, power</text>
  </g>
  <line x1="375" y1="382" x2="500" y2="382" stroke="#7e22ce" stroke-width="1.4" marker-end="url(#arrow-trans)"/>
  <text x="440" y="375" text-anchor="middle" font-size="6.8" font-weight="600" fill="#7e22ce">counters to physical cost</text>
  <g transform="translate(510, 356)">
    <rect x="0" y="0" width="340" height="52" rx="3" fill="#f5f3ff" stroke="#581C87" stroke-width="1.4"/>
    <text x="170" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Heterogeneous Substrate</text>
    <text x="170" y="38" text-anchor="middle" font-size="7.5" fill="#6b21a8">GPU, NPU, CPU, HBM3e, CXL fabric, energy, carbon</text>
  </g>
</svg>
