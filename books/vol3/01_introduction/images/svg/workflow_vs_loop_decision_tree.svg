<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16A34A"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#D97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#FFFFFF"/>

  <!-- Root: Task Evaluation -->
  <g transform="translate(40, 20)">
    <rect width="260" height="42" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
    <text x="130" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">TASK EVALUATION</text>
  </g>

  <!-- Line from Root to Decision 1 -->
  <line x1="170" y1="62" x2="170" y2="92" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-gray)"/>

  <!-- Decision 1: Is Path Deterministic? -->
  <g transform="translate(40, 94)">
    <rect width="260" height="64" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="130" y="26" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E40AF">Is Execution Path Deterministic?</text>
    <text x="130" y="46" text-anchor="middle" font-size="9" fill="#3B82F6">Can dependency DAG be pre-computed?</text>
  </g>

  <!-- Decision 1 YES -> Fixed Workflow -->
  <line x1="300" y1="126" x2="480" y2="126" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <rect x="360" y="112" width="46" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="383" y="125" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">YES</text>

  <!-- Destination 1: Fixed Workflow (DAG) -->
  <g transform="translate(490, 80)">
    <rect width="350" height="92" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.4"/>
    <rect width="350" height="26" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
    <text x="175" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532D">FIXED WORKFLOW (DAG)</text>
    <text x="20" y="44" font-size="9" font-weight="600" fill="#1E293B">• Deterministic state transitions &amp; zero drift</text>
    <text x="20" y="60" font-size="8.5" fill="#475569">• Sub-second execution latency; zero token cost</text>
    <text x="20" y="76" font-size="8.5" fill="#475569">• Best for: Schematized transforms, pipelines, ETL</text>
  </g>

  <!-- Line from Decision 1 to Decision 2 (NO) -->
  <line x1="170" y1="158" x2="170" y2="202" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="148" y="168" width="44" height="18" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="170" y="181" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">NO</text>

  <!-- Decision 2: Are Actions Reversible? -->
  <g transform="translate(40, 204)">
    <rect width="260" height="64" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="130" y="26" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">Are Tool Actions Reversible?</text>
    <text x="130" y="46" text-anchor="middle" font-size="9" fill="#B45309">Can mutations be contained &amp; undone?</text>
  </g>

  <!-- Decision 2 NO -> Human-Gated Workflow -->
  <line x1="300" y1="236" x2="480" y2="216" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <rect x="360" y="214" width="46" height="18" rx="3" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="383" y="227" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">NO</text>

  <!-- Destination 2: Human-Gated Workflow -->
  <g transform="translate(490, 182)">
    <rect width="350" height="60" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
    <rect width="350" height="22" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="175" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">HUMAN-GATED ESCROW WORKFLOW</text>
    <text x="20" y="38" font-size="8.5" fill="#475569">• Read-only exploration; draft mutations held in escrow</text>
    <text x="20" y="52" font-size="8.5" fill="#475569">• Requires explicit human signature before commit</text>
  </g>

  <!-- Decision 2 YES -> Autonomous Model-Directed Loop -->
  <line x1="300" y1="256" x2="480" y2="280" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="360" y="258" width="46" height="18" rx="3" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
  <text x="383" y="271" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">YES</text>

  <!-- Destination 3: Autonomous Model-Directed Loop -->
  <g transform="translate(490, 250)">
    <rect width="350" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
    <rect width="350" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <text x="175" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">AUTONOMOUS MODEL-DIRECTED LOOP</text>
    <text x="20" y="38" font-size="8.5" fill="#475569">• Dynamic hypothesis testing &amp; multi-turn deliberation</text>
    <text x="20" y="52" font-size="8.5" fill="#475569">• Closed-loop error recovery inside sealed sandboxes</text>
  </g>
</svg>
