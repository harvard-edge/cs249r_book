<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="840" height="440" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE TWO INFERENCE REGIMES: PREFILL VS. DECODE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Radically distinct hardware bottlenecks governing prompt evaluation and autoregressive token generation</text>

  <!-- Left Panel: Context Prefill -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="385" height="365" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="385" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">PHASE 1: CONTEXT PREFILL</text>

    <!-- Subheader badge -->
    <rect x="235" y="4" width="140" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="305" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">COMPUTE-BOUND (FLOPs)</text>

    <!-- Inner Item 1 -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Workload Input</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">All T_prompt accumulated tokens ingested simultaneously</text>
    </g>

    <!-- Inner Item 2 -->
    <g transform="translate(15, 84)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Silicon Computation</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Dense Matrix-Matrix Multiplications (GEMM)</text>
    </g>

    <!-- Inner Item 3 -->
    <g transform="translate(15, 134)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Arithmetic Intensity</text>
      <text x="10" y="30" font-size="7.5" font-weight="600" fill="#0284c7">High: &gt; 100 FLOP/Byte (Tensor Cores saturated)</text>
    </g>

    <!-- Inner Item 4 -->
    <g transform="translate(15, 184)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Hardware Bottleneck</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Peak FP8/FP16 Tensor Core FLOPS capability</text>
    </g>

    <!-- Bottom summary box -->
    <g transform="translate(15, 236)">
      <rect x="0" y="0" width="355" height="114" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="20" font-size="8.5" font-weight="700" fill="#0369a1">Agent Systems Implication:</text>
      <text x="12" y="42" font-size="8" fill="#334155">• Grows as O(T²) across long multi-turn trajectory histories</text>
      <text x="12" y="62" font-size="8" fill="#334155">• Requires Radix Prefix Caching to avoid recomputing prompt</text>
      <text x="12" y="82" font-size="8" fill="#334155">• Chunked prefill (Sarathi) prevents starvation of decode tokens</text>
      <text x="12" y="100" font-size="8" fill="#334155">• Disaggregated prefill/decode clusters isolate arithmetic interference</text>
    </g>
  </g>

  <!-- Right Panel: Autoregressive Decode -->
  <g transform="translate(455, 75)">
    <rect x="0" y="0" width="385" height="365" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="385" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PHASE 2: AUTOREGRESSIVE DECODE</text>

    <!-- Subheader badge -->
    <rect x="225" y="4" width="150" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="300" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">MEMORY-BANDWIDTH BOUND</text>

    <!-- Inner Item 1 -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Workload Input</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Exactly one generated token at a time (t = 1)</text>
    </g>

    <!-- Inner Item 2 -->
    <g transform="translate(15, 84)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Silicon Computation</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">Matrix-Vector Multiplications (GEMV)</text>
    </g>

    <!-- Inner Item 3 -->
    <g transform="translate(15, 134)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Arithmetic Intensity</text>
      <text x="10" y="30" font-size="7.5" font-weight="600" fill="#dc2626">Abysmal: ~ 1–2 FLOP/Byte (Severe memory stall)</text>
    </g>

    <!-- Inner Item 4 -->
    <g transform="translate(15, 184)">
      <rect x="0" y="0" width="355" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Hardware Bottleneck</text>
      <text x="10" y="30" font-size="7.5" fill="#64748b">High-Bandwidth Memory (HBM) streaming transfer rate</text>
    </g>

    <!-- Bottom summary box -->
    <g transform="translate(15, 236)">
      <rect x="0" y="0" width="355" height="114" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="12" y="20" font-size="8.5" font-weight="700" fill="#15803d">Agent Systems Implication:</text>
      <text x="12" y="42" font-size="8" fill="#334155">• Streams entire parameter set (W) and KV cache per token</text>
      <text x="12" y="62" font-size="8" fill="#334155">• Multi-turn trajectories pin massive KV caches in GPU memory</text>
      <text x="12" y="82" font-size="8" fill="#334155">• Idles GPU compute during long tool wait times (I/O tax)</text>
      <text x="12" y="100" font-size="8" fill="#334155">• Speculative decoding mitigates memory bandwidth bottlenecks</text>
    </g>
  </g>
</svg>
