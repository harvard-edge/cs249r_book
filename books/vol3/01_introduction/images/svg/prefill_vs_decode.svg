<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="panelShadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="840" height="430" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="420" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">The Two Inference Regimes: Prefill vs. Decode</text>
  <text x="420" y="48" text-anchor="middle" font-size="9" fill="#64748B">Radically distinct hardware bottlenecks governing prompt evaluation and autoregressive token generation</text>

  <!-- Left Panel: Context Prefill -->
  <g filter="url(#panelShadow)">
    <rect x="35" y="70" width="370" height="330" rx="8" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.8"/>
    <rect x="35" y="70" width="370" height="32" rx="8" fill="#2563EB"/>
    <rect x="35" y="94" width="370" height="8" fill="#2563EB"/>
    <text x="220" y="91" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">PHASE 1: CONTEXT PREFILL</text>

    <!-- Subheader badge -->
    <rect x="55" y="115" width="160" height="22" rx="4" fill="#DBEAFE"/>
    <text x="135" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">COMPUTE-BOUND (FLOPs)</text>

    <!-- Content Items -->
    <text x="55" y="160" font-size="10" font-weight="700" fill="#1E293B">Workload Input:</text>
    <text x="55" y="176" font-size="9" fill="#475569">All T_prompt accumulated tokens ingested simultaneously</text>

    <text x="55" y="202" font-size="10" font-weight="700" fill="#1E293B">Silicon Computation:</text>
    <text x="55" y="218" font-size="9" fill="#475569">Dense Matrix-Matrix Multiplications (GEMM)</text>

    <text x="55" y="244" font-size="10" font-weight="700" fill="#1E293B">Arithmetic Intensity:</text>
    <text x="55" y="260" font-size="9" font-weight="600" fill="#2563EB">High: &gt; 100 FLOP/Byte (Tensor Cores saturated)</text>

    <text x="55" y="286" font-size="10" font-weight="700" fill="#1E293B">Hardware Bottleneck:</text>
    <text x="55" y="302" font-size="9" fill="#475569">Peak FP8/FP16 Tensor Core FLOPS capability</text>

    <!-- Bottom summary box -->
    <rect x="55" y="325" width="330" height="58" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="70" y="345" font-size="8.5" font-weight="700" fill="#1E3A8A">Agent Systems Implication:</text>
    <text x="70" y="360" font-size="8" fill="#334155">• Grows as O(T²) across long multi-turn trajectory histories</text>
    <text x="70" y="373" font-size="8" fill="#334155">• Requires Radix Prefix Caching to avoid recomputing prompt</text>
  </g>

  <!-- Right Panel: Autoregressive Decode -->
  <g filter="url(#panelShadow)">
    <rect x="435" y="70" width="370" height="330" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="1.8"/>
    <rect x="435" y="70" width="370" height="32" rx="8" fill="#581C87"/>
    <rect x="435" y="94" width="370" height="8" fill="#581C87"/>
    <text x="620" y="91" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">PHASE 2: AUTOREGRESSIVE DECODE</text>

    <!-- Subheader badge -->
    <rect x="455" y="115" width="185" height="22" rx="4" fill="#F3E8FF"/>
    <text x="547" y="130" text-anchor="middle" font-size="9" font-weight="700" fill="#6B21A8">MEMORY-BANDWIDTH BOUND</text>

    <!-- Content Items -->
    <text x="455" y="160" font-size="10" font-weight="700" fill="#1E293B">Workload Input:</text>
    <text x="455" y="176" font-size="9" fill="#475569">Exactly one generated token at a time (t = 1)</text>

    <text x="455" y="202" font-size="10" font-weight="700" fill="#1E293B">Silicon Computation:</text>
    <text x="455" y="218" font-size="9" fill="#475569">Matrix-Vector Multiplications (GEMV)</text>

    <text x="455" y="244" font-size="10" font-weight="700" fill="#1E293B">Arithmetic Intensity:</text>
    <text x="455" y="260" font-size="9" font-weight="600" fill="#7E22CE">Abysmal: ~ 1–2 FLOP/Byte (Severe memory stall)</text>

    <text x="455" y="286" font-size="10" font-weight="700" fill="#1E293B">Hardware Bottleneck:</text>
    <text x="455" y="302" font-size="9" fill="#475569">High-Bandwidth Memory (HBM) streaming transfer rate</text>

    <!-- Bottom summary box -->
    <rect x="455" y="325" width="330" height="58" rx="6" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="470" y="345" font-size="8.5" font-weight="700" fill="#581C87">Agent Systems Implication:</text>
    <text x="470" y="360" font-size="8" fill="#334155">• Streams entire parameter set (W) and KV cache per token</text>
    <text x="470" y="373" font-size="8" fill="#334155">• Multi-turn trajectories pin massive KV caches in GPU memory</text>
  </g>
</svg>
