<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 132" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="170" height="132" fill="#ffffff"/>
<rect x="2" y="3" width="166" height="39" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="9" y="15" font-size="10" font-weight="bold" fill="#0f172a">Fail-stop</text>
<text x="9" y="27" font-size="9" fill="#475569">halts; missing progress</text>
<text x="9" y="37" font-size="9" fill="#475569">reveals it</text>
<rect x="2" y="46" width="166" height="39" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="9" y="58" font-size="10" font-weight="bold" fill="#0f172a">Byzantine</text>
<text x="9" y="70" font-size="9" fill="#475569">arbitrary faults;</text>
<text x="9" y="80" font-size="9" fill="#475569">agreement within bound</text>
<rect x="2" y="89" width="166" height="39" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="9" y="101" font-size="10" font-weight="bold" fill="#0f172a">Fail-plausible</text>
<text x="9" y="113" font-size="9" fill="#475569">looks like success;</text>
<text x="9" y="123" font-size="9" fill="#475569">needs an outside check</text>
</svg>
