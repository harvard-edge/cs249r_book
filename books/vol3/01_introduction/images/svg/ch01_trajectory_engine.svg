<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 630" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="630" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- DOMAIN 1 (TOP LEFT): HOST AGENT RUNTIME SUPERVISOR                    -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 20)">
    <rect width="450" height="240" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="450" height="24" rx="3" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">HOST AGENT RUNTIME SUPERVISOR (A = 0 ESCROW)</text>
    <text x="436" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#166534">Kernel Control Plane</text>

    <!-- Sub-block 1: Context Staging & Memory Register -->
    <g transform="translate(15, 32)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Context Assembly and Staging Register (c_t)</text>
      <text x="10" y="28" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">c_t = [ SystemPrompt, g, ToolSchemas, (a_0, o_1, v_1), ..., (a_{t-1}, o_t, v_t) ]</text>
      <text x="10" y="39" font-size="7.5" fill="#475569">Token buffer bounded by S_max</text>
    </g>

    <!-- Sub-block 2: Action Authorization Gate P(a_prop) -->
    <g transform="translate(15, 84)">
      <rect width="420" height="48" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Action Authorization Gate: P(a_prop) → a_perm ∨ ⊥</text>
      <text x="10" y="28" font-size="7.5" fill="#334155">JSON Schema · Pydantic AST</text>
      <text x="10" y="40" font-size="7.5" fill="#334155">Capability mask · realpath containment</text>
    </g>

    <!-- Sub-block 3: Write-Ahead Log & Fault Recovery -->
    <g transform="translate(15, 138)">
      <rect width="420" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Write-Ahead Log (WAL) and Trajectory State Manager</text>
      <text x="10" y="29" font-size="7.5" fill="#475569">Pre-actuation fsync journal; coordinates compensating Saga transactions</text>
    </g>

    <!-- Sub-block 4: Completion Predicate -->
    <g transform="translate(15, 186)">
      <rect width="420" height="42" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1.1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Completion Assessment Predicate: Ω(c_{t+1}, v_{t+1})</text>
      <text x="10" y="29" font-size="7.5" fill="#475569">Claims checked against v_{t+1}</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- DOMAIN 2 (TOP RIGHT): STOCHASTIC INFERENCE CORE                       -->
  <!-- ===================================================================== -->
  <g transform="translate(540, 20)">
    <rect width="450" height="240" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="450" height="24" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#0f766e" letter-spacing="0.3">STOCHASTIC INFERENCE ENGINE (π_θ)</text>
    <text x="436" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#475569">Accelerator HBM Substrate</text>

    <!-- Sub-blocks inside Inference Core -->
    <g transform="translate(15, 32)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Autoregressive Generation Pipeline: M(c_t) → a_prop</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">Prefill Phase (Compute-Bound GEMM) over context history c_t</text>
      <text x="10" y="39" font-size="7.5" fill="#475569">Decode Phase (Memory-Bandwidth-Bound GEMV) sampling tokens</text>
    </g>

    <g transform="translate(15, 84)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Grammar-Constrained Vocabulary Masking</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">DFA logit mask before softmax</text>
      <text x="10" y="39" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f766e">Forces syntactic validity: p_{t, i} = 0 for prohibited tokens</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="420" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Paged Key-Value (KV) Cache Virtual Paging</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">Paged blocks · radix prefix cache</text>
      
    </g>

    <g transform="translate(15, 186)">
      <rect width="420" height="42" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f766e">Candidate Action Proposal Register</text>
      <text x="10" y="29" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">a_prop = { tool: "shell_exec", args: { cmd: "pytest -q" } }</text>
    </g>
  </g>

  <!-- Connectors in Center Corridor (between x=480 and x=540) -->
  <!-- Context dispatch: Supervisor -> Inference Core -->
  <path d="M 480,55 L 532,55" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <rect x="492" y="44" width="36" height="16" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="0.8"/>
  <text x="510" y="55" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e293b">c<tspan dy="2" font-size="6">t</tspan></text>

  <!-- Proposal emission: Inference Core -> Supervisor -->
  <path d="M 540,150 L 488,150" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="490" y="139" width="40" height="16" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="0.8"/>
  <text x="510" y="150" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f766e">a<tspan dy="2" font-size="6">prop</tspan></text>

  <!-- Evidence feedback: Oracle (Bottom Right) -> Supervisor (Top Left) through center corridor -->
  <path d="M 540,360 L 510,360 L 510,227 L 488,227" fill="none" stroke="#166534" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arr-sage)"/>
  <rect x="490" y="278" width="40" height="18" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1"/>
  <text x="510" y="290" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">v<tspan dy="2" font-size="6">t+1</tspan></text>

  <!-- ===================================================================== -->
  <!-- DOMAIN BOUNDARY / ACTUATION BUS                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 292)">
    <!-- Segment 1 (left of a_perm) -->
    <line x1="0" y1="0" x2="115" y2="0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <!-- Segment 2 (between a_perm and o_t+1) -->
    <line x1="205" y1="0" x2="275" y2="0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <!-- Segment 3 (right of o_t+1 to center gap) -->
    <line x1="365" y1="0" x2="480" y2="0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <!-- Segment 4 (right side) -->
    <line x1="540" y1="0" x2="960" y2="0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

    <!-- Central Isolation Banner -->
    <rect x="580" y="-10" width="370" height="20" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    <text x="765" y="4" text-anchor="middle" font-size="8" font-weight="700" fill="#334155" letter-spacing="0.5">ISOLATION BOUNDARY: ZERO AMBIENT AUTHORITY (A = 0)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- DOMAIN 3 (BOTTOM LEFT): ISOLATED EXECUTION SANDBOX                    -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 325)">
    <rect width="450" height="265" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="450" height="24" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#334155" letter-spacing="0.3">ISOLATED EXECUTION SANDBOX (DETERMINISTIC TOOLS)</text>
    <text x="436" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#0f766e">microVM / Container</text>

    <!-- Sub-block 1: Runtime Dispatch Hook -->
    <g transform="translate(15, 32)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Runtime Dispatch Backend: D(a_perm) → o_{t+1}</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">Ephemeral OverlayFS worktree</text>
      <text x="10" y="39" font-size="7.5" fill="#475569">Namespace isolation · egress control</text>
    </g>

    <!-- Sub-block 2: Tool Backends -->
    <g transform="translate(15, 84)">
      <rect width="420" height="58" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Deterministic Effector Backends</text>
      <text x="10" y="29" font-size="7.5" fill="#334155">Shell and Compilers: /bin/bash, clang++, cmake, python -m pytest</text>
      <text x="10" y="42" font-size="7.5" fill="#334155">MCP bridges · JSON-RPC stdio</text>
      <text x="10" y="52" font-size="7" font-style="italic" fill="#64748b">Mutations held in transaction worktree before commit</text>
    </g>

    <!-- Sub-block 3: Watchdog Timers & Quarantine -->
    <g transform="translate(15, 148)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Watchdog Timers and Resource Quarantine</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">Wall-clock timer trips SIGKILL</text>
      <text x="10" y="39" font-size="7.5" fill="#475569">cgroup memory limits</text>
    </g>

    <!-- Sub-block 4: Observation Packaging -->
    <g transform="translate(15, 200)">
      <rect width="420" height="52" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#334155">Structured Observation Packaging (o_{t+1})</text>
      <text x="10" y="28" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f172a">Status: COMPLETED | TRUNCATED | REFUSED | TRANSPORT_FAILURE</text>
      <text x="10" y="40" font-size="7.5" fill="#475569">Standard output/error streams, integer exit codes, and sanitized diffs</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- DOMAIN 4 (BOTTOM RIGHT): SEALED VERIFICATION ORACLE                   -->
  <!-- ===================================================================== -->
  <g transform="translate(540, 325)">
    <rect width="450" height="265" rx="3" fill="#f8fafc" stroke="#166534" stroke-width="1.5"/>
    <rect width="450" height="24" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#166534" letter-spacing="0.3">SEALED VERIFICATION ENCLAVE (GROUND-TRUTH ORACLE)</text>
    <text x="436" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#166534">Out-of-Band Integrity</text>

    <!-- Sub-block 1: Immutable Evaluator -->
    <g transform="translate(15, 32)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Sealed Evaluation Harness: V(s_{t+1}) → v_{t+1}</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">Hidden from model observation</text>
      
    </g>

    <!-- Sub-block 2: Multi-tier Verifiers -->
    <g transform="translate(15, 84)">
      <rect width="420" height="58" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Deterministic Invariant Checkers</text>
      <text x="10" y="29" font-size="7.5" fill="#334155">Static Linters &amp; Typecheckers: mypy, ruff, AST grammar invariance</text>
      <text x="10" y="42" font-size="7.5" fill="#334155">Read-only assertions · test matrices</text>
      <text x="10" y="52" font-size="7" font-style="italic" fill="#64748b">Zero evidential weight given to model self-report</text>
    </g>

    <!-- Sub-block 3: Fail-Plausible Defect Trap -->
    <g transform="translate(15, 148)">
      <rect width="420" height="46" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Fail-Plausible Defect Interception</text>
      <text x="10" y="28" font-size="7.5" fill="#475569">Catches exit-0 regressions</text>
      
    </g>

    <!-- Sub-block 4: Verification Evidence Payload -->
    <g transform="translate(15, 200)">
      <rect width="420" height="52" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1.1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#166534">Authoritative Verification Evidence (v_{t+1})</text>
      <text x="10" y="28" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">v_{t+1} = { assertions_passed: 48, failed: 0, lint_errors: 0 }</text>
      <text x="10" y="40" font-size="7.5" fill="#475569">Evidence to supervisor</text>
    </g>
  </g>

  <!-- Vertical Connectors Across the Isolation Boundary -->
  <!-- Authorized Dispatch: Supervisor -> Sandbox -->
  <path d="M 160,260 L 160,317" fill="none" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-sage)"/>
  <rect x="120" y="282" width="80" height="18" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1"/>
  <text x="160" y="294" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">a<tspan dy="2" font-size="6">perm</tspan></text>

  <!-- Observation feedback: Sandbox -> Supervisor -->
  <path d="M 320,325 L 320,268" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <rect x="280" y="282" width="80" height="18" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="320" y="294" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">o<tspan dy="2" font-size="6">t+1</tspan></text>

  <!-- Environment State Mutation: Sandbox -> Oracle -->
  <path d="M 480,455 L 532,455" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="510" y="447" text-anchor="middle" font-size="7.5" font-weight="600" fill="#334155">s<tspan dy="2" font-size="6">t+1</tspan></text>
</svg>