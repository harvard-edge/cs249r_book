<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="diagonalHatchRed" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.8" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="510" fill="#ffffff"/>
  <g transform="translate(0, -40)">



  <!-- Timeline Axis Line -->
  <line x1="40" y1="76" x2="805" y2="76" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="812,76 804,72 804,80" fill="#94a3b8"/>
  <text x="822" y="79" font-size="8.5" font-weight="700" fill="#64748b">Time</text>

  <!-- SECTION 1: NAIVE RUNTIME (CRISIS) -->
  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="800" height="225" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#991b1b">A. NAIVE RUNTIME: PERSISTENT KV CACHE PINNING IN GPU HBM (CRISIS)</text>

    <!-- Step 1: Active Inference -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="80" height="60" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="40" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">Step 1 Infer</text>
      <text x="40" y="37" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">1.2s (Active)</text>
      <text x="40" y="49" text-anchor="middle" font-size="7.5" fill="#64748b">+20 GB HBM</text>
    </g>

    <!-- Step 1 Tool: Blocking 30s Wait (IDLE CRISIS) -->
    <g transform="translate(100, 34)">
      <rect x="0" y="0" width="320" height="60" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <rect x="0" y="0" width="320" height="60" rx="1" fill="url(#diagonalHatchRed)"/>
      <text x="160" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">TOOL EXECUTION: Shell Build &amp; Test Suite (30 seconds)</text>
      <text x="160" y="36" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">20 GB GPU HBM Pinned &amp; 100% Idle during POSIX waitpid()</text>
      <text x="160" y="49" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Zero GPU FLOPs utilized • Other trajectories starved of HBM allocation</text>
    </g>

    <!-- Step 2: Active Inference -->
    <g transform="translate(425, 34)">
      <rect x="0" y="0" width="80" height="60" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="40" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">Step 2 Infer</text>
      <text x="40" y="37" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0284c7">1.5s (Active)</text>
      <text x="40" y="49" text-anchor="middle" font-size="7.5" fill="#64748b">+24 GB HBM</text>
    </g>

    <!-- Step 2 Tool: Blocking 15s Wait (IDLE CRISIS) -->
    <g transform="translate(510, 34)">
      <rect x="0" y="0" width="275" height="60" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <rect x="0" y="0" width="275" height="60" rx="1" fill="url(#diagonalHatchRed)"/>
      <text x="137" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">TOOL: REST API Query (15s)</text>
      <text x="137" y="36" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">24 GB HBM Pinned &amp; Idle</text>
      <text x="137" y="49" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Network latency blocking accelerator</text>
    </g>

    <!-- Impact Callout -->
    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="770" height="104" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="15" y="24" font-size="8.5" font-weight="700" fill="#991b1b">Severe Cluster Throughput Degradation:</text>
      <text x="15" y="44" font-size="8" fill="#334155">• Holding $40,000 GPU accelerators idle for 70–90% of end-to-end wall-clock trajectory time destroys data center economics.</text>
      <text x="15" y="64" font-size="8" fill="#334155">• Total Goodput plummets because concurrent request batches are blocked by memory capacity limits (OOM crashes).</text>
      <text x="15" y="84" font-size="8" fill="#dc2626">• Trajectory stall cycles create cascading tail latencies across multi-tenant scheduling queues.</text>
    </g>
  </g>

  <!-- SECTION 2: THE SYSTEMS SOLUTION -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="800" height="185" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">B. SYSTEMS SOLUTION: RADIX CACHING &amp; ASYNCHRONOUS HIERARCHICAL OFFLOADING</text>

    <!-- Sub-card 1: Radix Prefix Caching -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="375" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="22" font-size="8.5" font-weight="700" fill="#15803d">1. Radix Prefix Caching (Chapter 8)</text>
      <text x="14" y="44" font-size="8" fill="#334155">• Immutable prompt and tool definition tokens are stored in a</text>
      <text x="24" y="58" font-size="8" fill="#334155">global radix tree across turns, eliminating redundant prefill FLOPs.</text>
      <text x="14" y="78" font-size="8" fill="#334155">• Trajectory branch sharing enables multi-agent prefix reuse.</text>
      <text x="14" y="98" font-size="8" fill="#334155">• LRU cache eviction reclaims memory only under high pressure.</text>
      <text x="14" y="118" font-size="7.5" font-weight="600" fill="#16a34a">Saves up to 85% redundant prompt ingestion compute.</text>
    </g>

    <!-- Sub-card 2: Asynchronous Host DRAM Offloading -->
    <g transform="translate(410, 34)">
      <rect x="0" y="0" width="375" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="22" font-size="8.5" font-weight="700" fill="#15803d">2. Asynchronous Host DRAM Offload (Chapter 9)</text>
      <text x="14" y="44" font-size="8" fill="#334155">• The moment a blocking tool call is issued, the runtime asynchronously</text>
      <text x="24" y="58" font-size="8" fill="#334155">streams trajectory KV cache over PCIe Gen5 DMA (64 GB/s).</text>
      <text x="14" y="78" font-size="8" fill="#334155">• CXL memory fabrics swap cache into cheap host DDR5 DRAM.</text>
      <text x="14" y="98" font-size="8" fill="#334155">• Frees 100% of GPU HBM for other active inference trajectories.</text>
      <text x="14" y="118" font-size="7.5" font-weight="600" fill="#16a34a">Eliminates GPU HBM idleness during external I/O waits.</text>
    </g>
  </g>
</g>
</svg>