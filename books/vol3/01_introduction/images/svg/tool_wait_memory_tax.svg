<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="taxShadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <pattern id="diagonalHatchRed" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#EF4444" stroke-width="2.5" stroke-opacity="0.25"/>
    </pattern>
    <marker id="arrPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
  </defs>

  <rect width="860" height="490" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="430" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">The Tool-Wait Memory Tax: GPU HBM Idleness</text>
  <text x="430" y="46" text-anchor="middle" font-size="9" fill="#64748B">Holding scarce high-bandwidth memory allocated while blocking on asynchronous operating system and network I/O</text>

  <!-- Timeline Axis Line -->
  <line x1="60" y1="90" x2="800" y2="90" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="805,90 795,85 795,95" fill="#CBD5E1"/>
  <text x="815" y="94" font-size="9.5" font-weight="700" fill="#64748B">Time</text>

  <!-- SECTION 1: NAIVE UNPAGED ALLOCATION (CRISIS) -->
  <g filter="url(#taxShadow)">
    <rect x="50" y="115" width="760" height="190" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="50" y="115" width="760" height="26" rx="2" fill="#F8FAFC"/>
    <rect x="50" y="133" width="760" height="8" fill="#F8FAFC"/>
    <text x="65" y="133" font-size="10.5" font-weight="700" fill="#334155">A. Naive Runtime: Persistent KV Cache Pinning in GPU HBM</text>

    <!-- Step 1: Active Inference -->
    <rect x="70" y="155" width="80" height="60" rx="4" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2"/>
    <text x="110" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#3730A3">Step 1 Infer</text>
    <text x="110" y="195" text-anchor="middle" font-size="7.5" fill="#4338CA">1.2s (Active)</text>
    <text x="110" y="206" text-anchor="middle" font-size="7.5" fill="#6B7280">+20 GB HBM</text>

    <!-- Step 1 Tool: Blocking 30s Wait (IDLE CRISIS) -->
    <rect x="155" y="155" width="310" height="60" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
    <rect x="155" y="155" width="310" height="60" rx="4" fill="url(#diagonalHatchRed)"/>
    <text x="310" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">TOOL EXECUTION: Shell Build &amp; Test Suite (30 seconds)</text>
    <text x="310" y="196" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">20 GB GPU HBM Pinned &amp; 100% Idle during POSIX waitpid()</text>
    <text x="310" y="208" text-anchor="middle" font-size="7.5" fill="#7F1D1D">Zero GPU FLOPs utilized • Other trajectories starved of HBM allocation</text>

    <!-- Step 2: Active Inference -->
    <rect x="470" y="155" width="85" height="60" rx="4" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2"/>
    <text x="512" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#3730A3">Step 2 Infer</text>
    <text x="512" y="195" text-anchor="middle" font-size="7.5" fill="#4338CA">1.5s (Active)</text>
    <text x="512" y="206" text-anchor="middle" font-size="7.5" fill="#6B7280">+24 GB HBM</text>

    <!-- Step 2 Tool: Blocking 15s Wait (IDLE CRISIS) -->
    <rect x="560" y="155" width="230" height="60" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
    <rect x="560" y="155" width="230" height="60" rx="4" fill="url(#diagonalHatchRed)"/>
    <text x="675" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">TOOL: REST API Query (15s)</text>
    <text x="675" y="196" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">24 GB HBM Pinned &amp; Idle</text>
    <text x="675" y="208" text-anchor="middle" font-size="7.5" fill="#7F1D1D">Network latency waste</text>

    <!-- Impact Callout -->
    <rect x="70" y="230" width="720" height="60" rx="2" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
    <text x="85" y="252" font-size="9" font-weight="700" fill="#9F1239">Severe Cluster Throughput Degradation:</text>
    <text x="85" y="268" font-size="8.5" fill="#4C0519">Holding $40,000 GPU accelerators idle for 70–90% of end-to-end wall-clock trajectory time destroys data center economics.</text>
    <text x="85" y="280" font-size="8.5" fill="#4C0519">Total Goodput plummets because concurrent request batches are blocked by memory capacity limits (OOM crashes).</text>
  </g>

  <!-- SECTION 2: THE SYSTEMS SOLUTION -->
  <g filter="url(#taxShadow)">
    <rect x="50" y="325" width="760" height="145" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.8"/>
    <rect x="50" y="325" width="760" height="26" rx="2" fill="#581C87"/>
    <rect x="50" y="343" width="760" height="8" fill="#581C87"/>
    <text x="65" y="343" font-size="10.5" font-weight="700" fill="#FFFFFF">B. Systems Solution: Radix Caching &amp; Asynchronous Hierarchical Offloading</text>

    <text x="75" y="375" font-size="9.5" font-weight="700" fill="#3B0764">1. Radix Prefix Caching (Chapter 8):</text>
    <text x="75" y="390" font-size="8.5" fill="#4B5563">Immutable prompt and tool definition tokens are stored in a global radix tree across turns, eliminating redundant prefill FLOPs.</text>

    <text x="75" y="415" font-size="9.5" font-weight="700" fill="#3B0764">2. Asynchronous Offload to Host DRAM (Chapter 9):</text>
    <text x="75" y="430" font-size="8.5" fill="#4B5563">The moment a blocking tool call is issued, the runtime asynchronously streams the trajectory KV cache over PCIe Gen5 (64 GB/s)</text>
    <text x="75" y="443" font-size="8.5" fill="#4B5563">or CXL memory fabrics into cheap host DDR5 DRAM, freeing 100% of GPU HBM for other active trajectories.</text>
  </g>
</svg>
