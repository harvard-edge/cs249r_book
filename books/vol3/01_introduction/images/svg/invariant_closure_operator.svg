<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#15803D"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B91C1C"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#FFFFFF"/>

  <!-- Top Box: Unprivileged Foundation Model -->
  <g transform="translate(140, 20)">
    <rect width="600" height="60" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
    <text x="300" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#581C87">UNPRIVILEGED FOUNDATION MODEL (A = 0)</text>
    <text x="300" y="48" text-anchor="middle" font-size="9.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#6D28D9">Emits Candidate Action Proposal: a_prop ∈ A_cand</text>
  </g>

  <!-- Downward arrow -->
  <line x1="440" y1="80" x2="440" y2="108" stroke="#581C87" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="450" y="98" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#581C87">a_prop</text>

  <!-- Middle Box: Deterministic Runtime Supervisor -->
  <g transform="translate(100, 110)">
    <rect width="680" height="130" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
    <rect width="680" height="28" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="340" y="19" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">DETERMINISTIC RUNTIME SUPERVISOR (MECHANICAL CLOSURE)</text>
    <text x="340" y="48" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#581C87">Invariant Closure Operator: I(a_prop, S_sys) → a_perm ∪ { ⊥ }</text>

    <!-- Three Gate Columns -->
    <g transform="translate(20, 60)">
      <rect width="195" height="55" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="97" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">1. Syntactic Gate</text>
      <text x="97" y="34" text-anchor="middle" font-size="7.5" fill="#64748B">JSON Schema Validation</text>
      <text x="97" y="47" text-anchor="middle" font-size="7.5" fill="#64748B">Grammar-constrained DFAs</text>
    </g>

    <g transform="translate(242, 60)">
      <rect width="195" height="55" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="97" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">2. Resource Gate</text>
      <text x="97" y="34" text-anchor="middle" font-size="7.5" fill="#64748B">Monotonic Step Limits (T_max)</text>
      <text x="97" y="47" text-anchor="middle" font-size="7.5" fill="#64748B">Token Bucket Quotas ($)</text>
    </g>

    <g transform="translate(465, 60)">
      <rect width="195" height="55" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="97" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">3. Isolation Gate</text>
      <text x="97" y="34" text-anchor="middle" font-size="7.5" fill="#64748B">Read-Only Bind Mounts</text>
      <text x="97" y="47" text-anchor="middle" font-size="7.5" fill="#64748B">Network Egress Filter (Proxy)</text>
    </g>
  </g>

  <!-- Left Branch: Permitted Action -->
  <path d="M 280,240 L 280,278" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="210" y="262" font-size="8.5" font-weight="600" fill="#15803D">(Passes Invariants)</text>

  <g transform="translate(130, 280)">
    <rect width="300" height="70" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1.3"/>
    <text x="150" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#14532D">ISOLATED EFFECTOR DISPATCH</text>
    <text x="150" y="42" text-anchor="middle" font-size="8.5" fill="#166534">Dispatched to microVM Sandbox (a_perm)</text>
    <text x="150" y="58" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803D">Filesystem • Terminal Shell • Network RPC</text>
  </g>

  <!-- Right Branch: Escrow Fault -->
  <path d="M 600,240 L 600,278" stroke="#B91C1C" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="610" y="262" font-size="8.5" font-weight="600" fill="#B91C1C">(Violates Invariant)</text>

  <g transform="translate(470, 280)">
    <rect width="300" height="70" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/>
    <text x="150" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">ESCROW FAULT TRAP ( ⊥ )</text>
    <text x="150" y="42" text-anchor="middle" font-size="8.5" fill="#991B1B">Action Aborted Before Execution</text>
    <text x="150" y="58" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#B91C1C">Typed Diagnostic Record Appended to Context</text>
  </g>
</svg>
