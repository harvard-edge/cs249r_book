<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="620" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- TOP SECTION: SOFTWARE 3.0 SUPERVISORY CONTROL LOOP                    -->
  <!-- ===================================================================== -->

  <!-- Left: Stochastic Policy Engine (Software 2.0) -->
  <g transform="translate(30, 24)">
    <rect width="280" height="180" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.4"/>
    <rect width="280" height="24" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
    <text x="14" y="16" font-size="9" font-weight="700" fill="#0f766e" letter-spacing="0.3">SOFTWARE 2.0: STOCHASTIC POLICY</text>
    <text x="266" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#475569">A = 0 Core</text>

    <!-- Sub-blocks inside Policy Engine -->
    <g transform="translate(15, 34)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#1e293b">Autoregressive Weights (W_θ)</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Transformer prefill (GEMM) &amp; decode (GEMV)</text>
    </g>

    <g transform="translate(15, 76)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#1e293b">Grammar Masking Filter (DFA)</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Constrains next-token sampling to typed schemas</text>
    </g>

    <g transform="translate(15, 118)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#0f766e">Candidate Action Proposal (a_prop)</text>
      <text x="10" y="27" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">a_prop ~ π_θ(· | c_t)  [Unprivileged]</text>
    </g>
  </g>

  <!-- Center: Host Runtime Supervisor (Control Plane) -->
  <g transform="translate(370, 24)">
    <rect width="280" height="180" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="24" rx="3" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
    <text x="14" y="16" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">HOST RUNTIME SUPERVISOR</text>
    <text x="266" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#166534">Kernel Space</text>

    <!-- Sub-blocks inside Supervisor -->
    <g transform="translate(15, 34)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#1e293b">Agent Control Block (ACB)</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Trajectory PID, monotonic token budget, timer</text>
    </g>

    <g transform="translate(15, 76)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#991b1b">Authorization Gate P(a_prop)</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Validates ACL, capability mask, path canonicalization</text>
    </g>

    <g transform="translate(15, 118)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#166534">Invariant Monitor &amp; Saga Engine</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Two-phase commit, timeout watchdog, rollback</text>
    </g>
  </g>

  <!-- Right: Software 1.0 Effectors (Deterministic Sandbox) -->
  <g transform="translate(710, 24)">
    <rect width="280" height="180" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
    <rect width="280" height="24" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
    <text x="14" y="16" font-size="9" font-weight="700" fill="#334155" letter-spacing="0.3">SOFTWARE 1.0: EFFECTORS</text>
    <text x="266" y="16" text-anchor="end" font-size="8" font-weight="600" fill="#0f766e">Sandbox</text>

    <!-- Sub-blocks inside Effectors -->
    <g transform="translate(15, 34)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#1e293b">POSIX Subprocess &amp; Compiler</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">clang++, make, pytest, git worktree diffs</text>
    </g>

    <g transform="translate(15, 76)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#1e293b">Model Context Protocol (MCP) Tools</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">JSON-RPC stdio drivers, database queries</text>
    </g>

    <g transform="translate(15, 118)">
      <rect width="250" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="600" fill="#166534">Authoritative Verifier Oracles (V)</text>
      <text x="10" y="27" font-size="7.5" fill="#475569">Sealed unit test suites, AST parsers, exit codes</text>
    </g>
  </g>

  <!-- Connectors between Top Blocks -->
  <!-- Proposal: Policy -> Supervisor -->
  <line x1="310" y1="90" x2="368" y2="90" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <text x="340" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f766e">a_prop</text>

  <!-- Context Dispatch: Supervisor -> Policy -->
  <line x1="370" y1="130" x2="312" y2="130" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-navy)"/>
  <text x="340" y="143" text-anchor="middle" font-size="7.5" font-weight="600" fill="#1e293b">c_t</text>

  <!-- Authorized Dispatch: Supervisor -> Effectors -->
  <line x1="650" y1="90" x2="708" y2="90" stroke="#166534" stroke-width="1.6" marker-end="url(#arr-sage)"/>
  <text x="680" y="83" text-anchor="middle" font-size="7.5" font-weight="600" fill="#166534">a_perm</text>

  <!-- Observation & Evidence: Effectors -> Supervisor -->
  <line x1="710" y1="130" x2="652" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="680" y="143" text-anchor="middle" font-size="7.5" font-weight="600" fill="#475569">o_t+1, v_t+1</text>

  <!-- ===================================================================== -->
  <!-- MIDDLE DIVIDER / INTERCONNECT BUS                                     -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 222)">
    <rect width="960" height="24" rx="2" fill="#1e293b"/>
    <text x="480" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#f8fafc" letter-spacing="0.5">STATE MANAGEMENT BUS: SYNCHRONIZING MEMORY HIERARCHIES ACROSS PHYSICAL TIERS</text>
  </g>

  <!-- Downward Arrows from Bus to Tiers -->
  <line x1="150" y1="246" x2="150" y2="270" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
  <line x1="390" y1="246" x2="390" y2="270" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
  <line x1="630" y1="246" x2="630" y2="270" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
  <line x1="870" y1="246" x2="870" y2="270" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>

  <!-- ===================================================================== -->
  <!-- BOTTOM SECTION: THE FOUR MEMORY AND STATE TIERS                       -->
  <!-- ===================================================================== -->

  <!-- Tier 1: Working Attention KV Cache (Accelerator HBM) -->
  <g transform="translate(30, 272)">
    <rect width="225" height="320" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
    <rect width="225" height="26" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#0f766e">TIER 1: WORKING KV CACHE</text>
    <text x="213" y="17" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f766e">S_active</text>

    <!-- Content -->
    <g transform="translate(10, 36)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Physical Substrate</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Accelerator High-Bandwidth Memory</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f766e">HBM3e @ 3.35 TB/s</text>
    </g>

    <g transform="translate(10, 88)">
      <rect width="205" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="600" fill="#1e293b">State Abstraction</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">Attention key-value tensors</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Size = 2 · L · H_kv · d · dtype · T</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Active sliding window &amp; sinks</text>
    </g>

    <g transform="translate(10, 150)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Volatility &amp; Lifetime</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Ephemeral (turn duration: ~0.1–5s)</text>
      <text x="8" y="38" font-size="7.5" fill="#991b1b">High Tool-Wait stranding tax</text>
    </g>

    <g transform="translate(10, 202)">
      <rect width="205" height="105" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Systems Management</text>
      <text x="8" y="30" font-size="7.5" fill="#475569">• PagedAttention block allocation</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">• Asynchronous offload on wait</text>
      <text x="8" y="58" font-size="7.5" fill="#475569">• Dynamic KV block eviction</text>
      <text x="8" y="72" font-size="7.5" fill="#475569">• Zero-copy tensor pointers</text>
      <text x="8" y="90" font-size="7" font-style="italic" fill="#0f766e">Governs inference latency</text>
    </g>
  </g>

  <!-- Tier 2: Host Context Working Memory (Host RAM) -->
  <g transform="translate(275, 272)">
    <rect width="225" height="320" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.3"/>
    <rect width="225" height="26" rx="3" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#1e293b">TIER 2: HOST CONTEXT MEMORY</text>
    <text x="213" y="17" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#1e293b">S_context</text>

    <!-- Content -->
    <g transform="translate(10, 36)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Physical Substrate</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Host CPU Dynamic RAM (DDR5 / CXL)</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#1e293b">PCIe Gen5 DMA @ 64–128 GB/s</text>
    </g>

    <g transform="translate(10, 88)">
      <rect width="205" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="600" fill="#1e293b">State Abstraction</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">Tokenized execution transcript</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">c_t = [g, o_0, a_0, v_1, ...]</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Radix prefix cache trie</text>
    </g>

    <g transform="translate(10, 150)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Volatility &amp; Lifetime</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Session lifetime (10¹–10³ s)</text>
      <text x="8" y="38" font-size="7.5" fill="#475569">Reclaimable on process tear-down</text>
    </g>

    <g transform="translate(10, 202)">
      <rect width="205" height="105" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Systems Management</text>
      <text x="8" y="30" font-size="7.5" fill="#475569">• Window truncation &amp; compaction</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">• AST observation pruning</text>
      <text x="8" y="58" font-size="7.5" fill="#475569">• Prefix tree hash verification</text>
      <text x="8" y="72" font-size="7.5" fill="#475569">• Token budgeting &amp; cost caps</text>
      <text x="8" y="90" font-size="7" font-style="italic" fill="#1e293b">Prevents context exhaustion</text>
    </g>
  </g>

  <!-- Tier 3: Durable Write-Ahead Log (WAL / NVMe) -->
  <g transform="translate(520, 272)">
    <rect width="225" height="320" rx="3" fill="#f8fafc" stroke="#92400e" stroke-width="1.3"/>
    <rect width="225" height="26" rx="3" fill="#fffbeb" stroke="#92400e" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#92400e">TIER 3: WRITE-AHEAD LOG (WAL)</text>
    <text x="213" y="17" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#92400e">S_log</text>

    <!-- Content -->
    <g transform="translate(10, 36)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Physical Substrate</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Non-Volatile NVMe SSD / Durable DB</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#92400e">fsync direct I/O @ 3–7 GB/s</text>
    </g>

    <g transform="translate(10, 88)">
      <rect width="205" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="600" fill="#1e293b">State Abstraction</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">Append-only event journal</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Record = &lt;t, a_perm, o, v, hash&gt;</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Checkpoint delta snapshots</text>
    </g>

    <g transform="translate(10, 150)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Volatility &amp; Lifetime</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Persistent &amp; Crash-Consistent</text>
      <text x="8" y="38" font-size="7.5" fill="#166534">Survives node crash &amp; power cut</text>
    </g>

    <g transform="translate(10, 202)">
      <rect width="205" height="105" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Systems Management</text>
      <text x="8" y="30" font-size="7.5" fill="#475569">• Pre-actuation fsync logging</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">• Deterministic trajectory replay</text>
      <text x="8" y="58" font-size="7.5" fill="#475569">• Distributed Saga compensation</text>
      <text x="8" y="72" font-size="7.5" fill="#475569">• Audit ledger &amp; telemetry trace</text>
      <text x="8" y="90" font-size="7" font-style="italic" fill="#92400e">Enforces crash-recovery</text>
    </g>
  </g>

  <!-- Tier 4: External Sandbox Environment (Git / FS / OS) -->
  <g transform="translate(765, 272)">
    <rect width="225" height="320" rx="3" fill="#f8fafc" stroke="#991b1b" stroke-width="1.3"/>
    <rect width="225" height="26" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#991b1b">TIER 4: PERSISTENT ENVIRONMENT</text>
    <text x="213" y="17" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b">S_env</text>

    <!-- Content -->
    <g transform="translate(10, 36)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Physical Substrate</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Target Workspace Filesystem / DB</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b">OverlayFS &amp; Copy-on-Write Mount</text>
    </g>

    <g transform="translate(10, 88)">
      <rect width="205" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="600" fill="#1e293b">State Abstraction</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">Ground-truth domain mutations</text>
      <text x="8" y="38" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Git repo trees, DB rows, processes</text>
      <text x="8" y="48" font-size="7.5" fill="#475569">Reversibility boundary barrier</text>
    </g>

    <g transform="translate(10, 150)">
      <rect width="205" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Volatility &amp; Lifetime</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Durable &amp; External (10³–10⁶ s)</text>
      <text x="8" y="38" font-size="7.5" fill="#991b1b">Irreversible mutation hazard</text>
    </g>

    <g transform="translate(10, 202)">
      <rect width="205" height="105" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="600" fill="#1e293b">Systems Management</text>
      <text x="8" y="30" font-size="7.5" fill="#475569">• Container boundary isolation</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">• Ephemeral worktree branch reset</text>
      <text x="8" y="58" font-size="7.5" fill="#475569">• Compensating inverse actions</text>
      <text x="8" y="72" font-size="7.5" fill="#475569">• Sealed regression test runner</text>
      <text x="8" y="90" font-size="7" font-style="italic" fill="#991b1b">Enforces environmental safety</text>
    </g>
  </g>
</svg>
