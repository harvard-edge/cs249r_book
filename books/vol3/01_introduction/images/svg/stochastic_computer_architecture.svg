<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas (no outer border) -->
  <rect width="900" height="548" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- LIVE LOOP BOUNDARY                                           -->
  <!-- ============================================================ -->
  <rect x="40" y="20" width="840" height="386" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="56" y="40" font-size="9.5" font-weight="700" fill="#0f172a">THE LIVE LOOP</text>
  <text x="864" y="40" font-size="8.5" fill="#64748b" text-anchor="end">one trajectory, turn by turn</text>

  <!-- THE MODEL (Part I) -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="370" height="96" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">THE MODEL · Part I</text>
    <text x="358" y="16" font-size="8.5" font-style="italic" fill="#0369a1" text-anchor="end">≈ processor</text>
    <text x="12" y="44" font-size="8.5" fill="#475569">context in, proposal out</text>
    <text x="12" y="62" font-size="8.5" fill="#475569">sampling · structured output</text>
    <text x="12" y="80" font-size="8.5" fill="#475569">test-time compute</text>
  </g>

  <!-- AGENT MEMORY (Part II) -->
  <g transform="translate(490, 56)">
    <rect x="0" y="0" width="370" height="96" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">AGENT MEMORY · Part II</text>
    <text x="358" y="16" font-size="8.5" font-style="italic" fill="#15803d" text-anchor="end">≈ memory</text>
    <text x="12" y="44" font-size="8.5" fill="#475569">context engineering</text>
    <text x="12" y="62" font-size="8.5" fill="#475569">KV cache management</text>
    <text x="12" y="80" font-size="8.5" fill="#475569">long-term memory · retrieval</text>
  </g>

  <!-- Model <-> Runtime arrows -->
  <line x1="170" y1="152" x2="170" y2="198" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="178" y="179" font-size="8.5" fill="#0369a1">proposal</text>
  <line x1="330" y1="202" x2="330" y2="156" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="338" y="179" font-size="8.5" fill="#15803d">context</text>

  <!-- Memory <-> Runtime arrows -->
  <line x1="600" y1="152" x2="600" y2="198" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="608" y="179" font-size="8.5" fill="#15803d">stored state</text>
  <line x1="760" y1="202" x2="760" y2="156" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="768" y="179" font-size="8.5" fill="#6d28d9">record</text>

  <!-- THE AGENT RUNTIME (Part IV) -->
  <g transform="translate(60, 202)">
    <rect x="0" y="0" width="800" height="78" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">THE AGENT RUNTIME · Part IV</text>
    <text x="788" y="16" font-size="8.5" font-style="italic" fill="#6d28d9" text-anchor="end">≈ operating system</text>
    <text x="12" y="44" font-size="8.5" fill="#475569">validate · dispatch · record · budget · approve</text>
    <text x="12" y="62" font-size="8.5" fill="#475569">harness · durable execution · failure recovery · evaluation</text>
  </g>

  <!-- Runtime <-> Tools arrows -->
  <line x1="170" y1="280" x2="170" y2="310" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="178" y="299" font-size="8.5" fill="#b45309">validated call</text>
  <line x1="420" y1="314" x2="420" y2="284" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="428" y="299" font-size="8.5" fill="#b45309">observation</text>

  <!-- TOOL USE (Part III) -->
  <g transform="translate(60, 314)">
    <rect x="0" y="0" width="520" height="76" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">TOOL USE · Part III</text>
    <text x="508" y="16" font-size="8.5" font-style="italic" fill="#b45309" text-anchor="end">≈ input and output</text>
    <text x="12" y="44" font-size="8.5" fill="#475569">tool calling · settled effects</text>
    <text x="12" y="62" font-size="8.5" fill="#475569">sandboxes the runtime can reset</text>
  </g>

  <!-- Tools <-> Environment arrows -->
  <line x1="580" y1="340" x2="646" y2="340" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="614" y="333" font-size="8.5" fill="#b45309" text-anchor="middle">effect</text>
  <line x1="650" y1="370" x2="584" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="617" y="384" font-size="8.5" fill="#475569" text-anchor="middle">result</text>

  <!-- ENVIRONMENT -->
  <g transform="translate(650, 314)">
    <rect x="0" y="0" width="210" height="76" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="12" y="18" font-size="9.5" font-weight="700" fill="#1e293b">ENVIRONMENT</text>
    <text x="12" y="42" font-size="8.5" fill="#475569">repositories · services</text>
    <text x="12" y="60" font-size="8.5" fill="#475569">databases</text>
  </g>

  <!-- ============================================================ -->
  <!-- ACROSS-TASK BAND                                             -->
  <!-- ============================================================ -->
  <rect x="40" y="428" width="840" height="110" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="56" y="446" font-size="9.5" font-weight="700" fill="#0f172a">ACROSS TASKS</text>
  <text x="864" y="446" font-size="8.5" fill="#64748b" text-anchor="end">many trajectories, over time</text>

  <line x1="330" y1="406" x2="330" y2="456" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="338" y="421" font-size="8.5" fill="#0369a1">verified trajectories</text>
  <line x1="640" y1="406" x2="640" y2="456" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="648" y="421" font-size="8.5" fill="#475569">many trajectories at once</text>

  <!-- LEARNING FROM TRAJECTORIES (Part V) -->
  <g transform="translate(60, 460)">
    <rect x="0" y="0" width="370" height="66" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">LEARNING FROM TRAJECTORIES · Part V</text>
    <text x="358" y="16" font-size="8.5" font-style="italic" fill="#0369a1" text-anchor="end">≈ recompiling</text>
    <text x="12" y="46" font-size="8.5" fill="#475569">curation · fine-tuning · RL with verifiers</text>
  </g>

  <!-- AGENTS AT SCALE (Part VI) -->
  <g transform="translate(490, 460)">
    <rect x="0" y="0" width="370" height="66" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">AGENTS AT SCALE · Part VI</text>
    <text x="358" y="16" font-size="8.5" font-style="italic" fill="#475569" text-anchor="end">≈ scale-out</text>
    <text x="12" y="46" font-size="8.5" fill="#475569">multi-agent coordination · cost per accepted task</text>
  </g>

  <!-- Feedback: updated weights back to the model -->
  <path d="M 60 493 H 22 V 104 H 59" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="15" y="300" font-size="8.5" fill="#0369a1" text-anchor="middle" transform="rotate(-90 15 300)">updated weights</text>
</svg>
