<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="800" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- ===== Live loop band ===== -->
  <rect x="60" y="20" width="720" height="350" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="80" y="44" font-size="13" font-weight="700" fill="#334155">Live loop</text>
  <text x="760" y="44" text-anchor="end" font-size="13" fill="#475569">one trajectory, turn by turn</text>

  <!-- Model (Part I) -->
  <rect x="80" y="60" width="300" height="56" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="84" font-size="15" font-weight="700" fill="#0f172a">Model</text>
  <text x="364" y="84" text-anchor="end" font-size="13" fill="#475569">Part I</text>
  <text x="96" y="104" font-size="13" font-style="italic" fill="#0369a1">≈ processor</text>

  <!-- Agent memory (Part II) -->
  <rect x="460" y="60" width="300" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="476" y="84" font-size="15" font-weight="700" fill="#0f172a">Agent memory</text>
  <text x="744" y="84" text-anchor="end" font-size="13" fill="#475569">Part II</text>
  <text x="476" y="104" font-size="13" font-style="italic" fill="#15803d">≈ memory hierarchy</text>

  <!-- Agent runtime (Part IV), spans the band: every edge passes through it -->
  <rect x="80" y="176" width="680" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="96" y="200" font-size="15" font-weight="700" fill="#0f172a">Agent runtime</text>
  <text x="744" y="200" text-anchor="end" font-size="13" fill="#475569">Part IV</text>
  <text x="96" y="220" font-size="13" font-style="italic" fill="#6d28d9">≈ operating system</text>

  <!-- Tool use (Part III) -->
  <rect x="80" y="292" width="380" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="96" y="316" font-size="15" font-weight="700" fill="#0f172a">Tool use</text>
  <text x="444" y="316" text-anchor="end" font-size="13" fill="#475569">Part III</text>
  <text x="96" y="336" font-size="13" font-style="italic" fill="#b45309">≈ input and output</text>

  <!-- Environment (outside the agent) -->
  <rect x="540" y="292" width="220" height="56" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="556" y="316" font-size="15" font-weight="700" fill="#0f172a">Environment</text>
  <text x="556" y="336" font-size="13" fill="#475569">repositories, services</text>

  <!-- Model <-> runtime -->
  <path d="M160,116 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="168" y="150" font-size="13" fill="#334155">proposal</text>
  <path d="M300,176 V116" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="308" y="150" font-size="13" fill="#334155">context</text>
  <!-- Memory <-> runtime -->
  <path d="M540,116 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="548" y="150" font-size="13" fill="#334155">stored state</text>
  <path d="M680,176 V116" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="688" y="150" font-size="13" fill="#334155">record</text>
  <!-- Runtime <-> tools -->
  <path d="M160,232 V292" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="168" y="266" font-size="13" fill="#334155">validated call</text>
  <path d="M340,292 V232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="348" y="266" font-size="13" fill="#334155">observation</text>
  <!-- Tools <-> environment -->
  <path d="M460,308 H540" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="500" y="301" text-anchor="middle" font-size="13" fill="#334155">effect</text>
  <path d="M540,332 H460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="500" y="350" text-anchor="middle" font-size="13" fill="#334155">result</text>

  <!-- ===== Across-tasks band ===== -->
  <rect x="60" y="420" width="720" height="96" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="80" y="444" font-size="13" font-weight="700" fill="#334155">Across tasks</text>

  <!-- Learning from trajectories (Part V) -->
  <rect x="80" y="452" width="300" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="474" font-size="15" font-weight="700" fill="#0f172a">Learning from trajectories</text>
  <text x="364" y="474" text-anchor="end" font-size="13" fill="#475569">Part V</text>
  <text x="96" y="493" font-size="13" font-style="italic" fill="#0369a1">≈ recompiling</text>

  <!-- Agents at scale (Part VI): a stack of live loops -->
  <rect x="480" y="436" width="280" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="470" y="444" width="280" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="460" y="452" width="280" height="50" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="476" y="474" font-size="15" font-weight="700" fill="#0f172a">Agents at scale</text>
  <text x="724" y="474" text-anchor="end" font-size="13" fill="#475569">Part VI</text>
  <text x="476" y="493" font-size="13" font-style="italic" fill="#475569">≈ scale-out</text>

  <!-- Live loop -> across tasks -->
  <path d="M230,370 V452" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="238" y="400" font-size="13" fill="#334155">evaluated trajectories</text>
  <path d="M620,370 V436" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="628" y="400" font-size="13" fill="#334155">many at once</text>

  <!-- Updated weights: perimeter feedback to the model -->
  <path d="M80,477 H40 V88 H80" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <text x="30" y="282" text-anchor="middle" font-size="13" fill="#0369a1" transform="rotate(-90 30 282)">updated weights</text>
</svg>
