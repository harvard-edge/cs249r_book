<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#FFFFFF"/>

  <!-- Epoch 1 -->
  <g transform="translate(40, 25)">
    <rect width="800" height="74" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="200" height="74" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="100" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Era 1: Static Tensors</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748B">τ ~ 10⁻² s</text>
    <text x="225" y="30" font-size="10" font-weight="600" fill="#1E293B">Opcodes &amp; Computation: <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#581C87">Dense GEMM, 2D Conv, Static DAG</tspan></text>
    <text x="225" y="52" font-size="9" fill="#475569">Pre-allocated static memory buffers • High arithmetic intensity • Completely deterministic pass</text>
    <rect x="670" y="24" width="115" height="26" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="727" y="41" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Compute-Bound</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="440" y1="99" x2="440" y2="123" stroke="#581C87" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Epoch 2 -->
  <g transform="translate(40, 125)">
    <rect width="800" height="74" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="200" height="74" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="100" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Era 2: Distributed Tokens</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748B">τ ~ 10⁻¹ – 10¹ s</text>
    <text x="225" y="30" font-size="10" font-weight="600" fill="#1E293B">Decoupled Serving: <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#581C87">Prefill (GEMM) / Decode (GEMV) Loops</tspan></text>
    <text x="225" y="52" font-size="9" fill="#475569">Dynamic KV cache allocation • Continuous batching queues • Memory-bandwidth-bound cluster scaling</text>
    <rect x="670" y="24" width="115" height="26" rx="3" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1"/>
    <text x="727" y="41" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Bandwidth-Bound</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="440" y1="199" x2="440" y2="223" stroke="#581C87" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Epoch 3 -->
  <g transform="translate(40, 225)">
    <rect width="800" height="74" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
    <rect width="200" height="74" rx="4" fill="#F3E8FF" stroke="#581C87" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#581C87">Era 3: Stateful Trajectories</text>
    <text x="100" y="52" text-anchor="middle" font-size="9.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#6D28D9">τ ~ 10¹ – 10⁴ s</text>
    <text x="225" y="30" font-size="10" font-weight="600" fill="#581C87">Closed-Loop Governance: <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#0F172A">Invocations + Sandboxed Tools + Oracles</tspan></text>
    <text x="225" y="52" font-size="9" fill="#334155">Effectful filesystem &amp; network mutations • Non-zero failure compounding • Deterministic verification oracles</text>
    <rect x="670" y="24" width="115" height="26" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <text x="727" y="41" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">Invariant-Bound</text>
  </g>
</svg>
