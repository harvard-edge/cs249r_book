<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1020" height="540" fill="#ffffff"/>

  <!-- Top Progression Axis -->
  <g transform="translate(40, 20)">
    <line x1="120" y1="20" x2="820" y2="20" stroke="#334155" stroke-width="2" marker-end="url(#arr-navy)"/>
    <text x="470" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#334155" letter-spacing="0.5">EVOLUTION OF MACHINE LEARNING SYSTEMS EXECUTION UNITS</text>
    <circle cx="160" cy="20" r="4" fill="#334155"/>
    <circle cx="480" cy="20" r="4" fill="#0f766e"/>
    <circle cx="800" cy="20" r="4" fill="#166534"/>
    <text x="160" y="36" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Epoch 1: Static Graphs (2012–2020)</text>
    <text x="480" y="36" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0f766e">Epoch 2: Token Serving (2020–2024)</text>
    <text x="800" y="36" text-anchor="middle" font-size="8.5" font-weight="600" fill="#166534">Epoch 3: Closed-Loop Trajectories (2024+)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMN 1: EPOCH 1 - STATIC TENSOR GRAPHS                              -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 75)">
    <!-- Container Card -->
    <rect width="300" height="300" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
    <rect width="300" height="26" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="14" y="17" font-size="9.5" font-weight="700" fill="#1e293b">EPOCH 1: COMPILED TENSOR GRAPHS</text>
    <text x="286" y="17" text-anchor="end" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">τ ~ 10⁻² s</text>

    <!-- Schematic: AOT Static Dataflow DAG -->
    <g transform="translate(15, 38)">
      <!-- Input tensor -->
      <rect x="15" y="6" width="70" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="50" y="21" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f172a">X [B, C, H, W]</text>

      <!-- Arrow -->
      <line x1="85" y1="18" x2="110" y2="18" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Conv/GEMM Kernel -->
      <rect x="112" y="4" width="76" height="28" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
      <text x="150" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#1e293b">Conv2D / GEMM</text>
      <text x="150" y="27" text-anchor="middle" font-size="7" fill="#64748b">Fused Kernel</text>

      <!-- Arrow -->
      <line x1="188" y1="18" x2="213" y2="18" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- ReLU/Norm Kernel -->
      <rect x="215" y="6" width="50" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="240" y="21" text-anchor="middle" font-size="8" font-weight="600" fill="#0f172a">Activation</text>

      <!-- Downward Arrow -->
      <line x1="240" y1="30" x2="240" y2="52" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Output Tensor -->
      <rect x="195" y="54" width="75" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="232" y="69" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f172a">Y [B, Classes]</text>
    </g>

    <!-- Structural Breakdown Box -->
    <g transform="translate(15, 130)">
      <rect width="270" height="155" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#1e293b">Systems Characteristics</text>

      <text x="12" y="38" font-size="8" font-weight="600" fill="#334155">Execution Unit:</text>
      <text x="12" y="50" font-size="8" fill="#475569">Single kernel pass / compiled sub-graph</text>

      <text x="12" y="70" font-size="8" font-weight="600" fill="#334155">Memory Model:</text>
      <text x="12" y="82" font-size="8" fill="#475569">Static pre-allocated buffers (XLA, TVM)</text>

      <text x="12" y="102" font-size="8" font-weight="600" fill="#334155">Control Flow:</text>
      <text x="12" y="114" font-size="8" fill="#475569">Compile-time fixed DAG; zero dynamic branch</text>

      <text x="12" y="134" font-size="8" font-weight="600" fill="#334155">Physical Bottleneck:</text>
      <text x="12" y="146" font-size="8" fill="#475569">Compute-bound matrix math (Peak TFLOPS)</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMN 2: EPOCH 2 - DISTRIBUTED TOKEN SERVING                         -->
  <!-- ===================================================================== -->
  <g transform="translate(360, 75)">
    <!-- Container Card -->
    <rect width="300" height="300" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
    <rect width="300" height="26" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
    <text x="14" y="17" font-size="9.5" font-weight="700" fill="#0f766e">EPOCH 2: DECOUPLED TOKEN SERVING</text>
    <text x="286" y="17" text-anchor="end" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f766e">τ ~ 10⁻¹–10¹ s</text>

    <!-- Schematic: Continuous Batching & KV Cache Pool -->
    <g transform="translate(15, 38)">
      <!-- Prefill Worker -->
      <rect x="10" y="4" width="85" height="30" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <text x="52" y="17" text-anchor="middle" font-size="8" font-weight="600" fill="#0f766e">Prefill Engine</text>
      <text x="52" y="27" text-anchor="middle" font-size="7" fill="#64748b">Compute-Bound GEMM</text>

      <!-- Arrow to KV Cache Pool -->
      <line x1="95" y1="19" x2="120" y2="19" stroke="#0f766e" stroke-width="1.2" marker-end="url(#arr-teal)"/>

      <!-- KV Cache Paged Pool -->
      <rect x="122" y="4" width="80" height="30" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
      <text x="162" y="17" text-anchor="middle" font-size="8" font-weight="600" fill="#1e293b">Paged KV Cache</text>
      <text x="162" y="27" text-anchor="middle" font-size="7" fill="#64748b">Virtual Memory Pool</text>

      <!-- Arrow to Decode -->
      <line x1="202" y1="19" x2="225" y2="19" stroke="#0f766e" stroke-width="1.2" marker-end="url(#arr-teal)"/>

      <!-- Decode Engine -->
      <rect x="227" y="4" width="60" height="30" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <text x="257" y="17" text-anchor="middle" font-size="8" font-weight="600" fill="#0f766e">Decode</text>
      <text x="257" y="27" text-anchor="middle" font-size="7" fill="#64748b">GEMV Loop</text>

      <!-- Return Loop for autoregression -->
      <path d="M 257,34 L 257,48 L 162,48 L 162,36" fill="none" stroke="#0f766e" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-teal)"/>
      <text x="210" y="58" text-anchor="middle" font-size="7" fill="#0f766e">Autoregressive token loop</text>
    </g>

    <!-- Structural Breakdown Box -->
    <g transform="translate(15, 130)">
      <rect width="270" height="155" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f766e">Systems Characteristics</text>

      <text x="12" y="38" font-size="8" font-weight="600" fill="#334155">Execution Unit:</text>
      <text x="12" y="50" font-size="8" fill="#475569">Autoregressive request / token generation turn</text>

      <text x="12" y="70" font-size="8" font-weight="600" fill="#334155">Memory Model:</text>
      <text x="12" y="82" font-size="8" fill="#475569">Dynamic KV blocks (PagedAttention, Radix tree)</text>

      <text x="12" y="102" font-size="8" font-weight="600" fill="#334155">Control Flow:</text>
      <text x="12" y="114" font-size="8" fill="#475569">Decoupled iteration loops, continuous batching</text>

      <text x="12" y="134" font-size="8" font-weight="600" fill="#334155">Physical Bottleneck:</text>
      <text x="12" y="146" font-size="8" fill="#475569">Memory bandwidth (GB/s) &amp; TTFT/ITL latency</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMN 3: EPOCH 3 - STATEFUL AGENT TRAJECTORIES                       -->
  <!-- ===================================================================== -->
  <g transform="translate(690, 75)">
    <!-- Container Card -->
    <rect width="300" height="300" rx="3" fill="#f8fafc" stroke="#166534" stroke-width="1.3"/>
    <rect width="300" height="26" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.3"/>
    <text x="14" y="17" font-size="9.5" font-weight="700" fill="#166534">EPOCH 3: CLOSED-LOOP TRAJECTORIES</text>
    <text x="286" y="17" text-anchor="end" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">τ ~ 10¹–10⁴ s</text>

    <!-- Schematic: Closed-Loop Trajectory Engine -->
    <g transform="translate(15, 38)">
      <!-- Host Supervisor -->
      <rect x="5" y="4" width="85" height="30" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
      <text x="47" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e293b">Host Supervisor</text>
      <text x="47" y="26" text-anchor="middle" font-size="7" fill="#475569">ACB &amp; A = 0 Escrow</text>

      <!-- Bidirectional Model Arrow -->
      <line x1="90" y1="14" x2="115" y2="14" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-navy)"/>
      <line x1="115" y1="22" x2="90" y2="22" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Neural Core -->
      <rect x="117" y="4" width="75" height="30" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <text x="154" y="16" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0f766e">Neural Core</text>
      <text x="154" y="26" text-anchor="middle" font-size="7" fill="#64748b">Proposal a_prop</text>

      <!-- Dispatch to Sandbox -->
      <line x1="154" y1="34" x2="154" y2="48" stroke="#166534" stroke-width="1.2" marker-end="url(#arr-sage)"/>

      <!-- Sandbox & Oracle Box -->
      <rect x="50" y="50" width="200" height="24" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1.2"/>
      <text x="150" y="65" text-anchor="middle" font-size="7.5" font-weight="600" fill="#166534">Isolated Sandbox + Verification Oracle (V)</text>
    </g>

    <!-- Structural Breakdown Box -->
    <g transform="translate(15, 130)">
      <rect width="270" height="155" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#166534">Systems Characteristics</text>

      <text x="12" y="38" font-size="8" font-weight="600" fill="#334155">Execution Unit:</text>
      <text x="12" y="50" font-size="8" fill="#475569">Stateful trajectory τ = ((a_0, o_1, v_1), ..., (a_N, o_N, v_N))</text>

      <text x="12" y="70" font-size="8" font-weight="600" fill="#334155">Memory Model:</text>
      <text x="12" y="82" font-size="8" fill="#475569">4-tier hierarchy: KV, Host RAM, WAL, Sandbox FS</text>

      <text x="12" y="102" font-size="8" font-weight="600" fill="#334155">Control Flow:</text>
      <text x="12" y="114" font-size="8" fill="#475569">Closed-loop FSM mediated by runtime supervisor</text>

      <text x="12" y="134" font-size="8" font-weight="600" fill="#334155">Physical Bottleneck:</text>
      <text x="12" y="146" font-size="8" fill="#475569">Invariant closure, fail-plausible faults, tool stranding</text>
    </g>
  </g>

  <!-- Bottom Synthesis Box -->
  <g transform="translate(30, 395)">
    <rect width="960" height="125" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
    <rect width="960" height="22" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="15" font-size="8.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">SYSTEMS ABSTRACTION COMPARISON MATRIX</text>

    <!-- Table Header Line -->
    <line x1="0" y1="46" x2="960" y2="46" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Row Labels -->
    <text x="16" y="38" font-size="8" font-weight="700" fill="#334155">Dimension</text>
    <text x="16" y="66" font-size="8" font-weight="600" fill="#334155">State Invariant</text>
    <text x="16" y="88" font-size="8" font-weight="600" fill="#334155">Failure Model</text>
    <text x="16" y="110" font-size="8" font-weight="600" fill="#334155">Supervisor Contract</text>

    <!-- Column 1: Epoch 1 -->
    <text x="180" y="38" font-size="8" font-weight="700" fill="#334155">Epoch 1: Static Graphs</text>
    <text x="180" y="66" font-size="7.8" fill="#475569">Stateless tensor activations</text>
    <text x="180" y="88" font-size="7.8" fill="#475569">Fail-Stop (NaN / Kernel Crash)</text>
    <text x="180" y="110" font-size="7.8" fill="#475569">Graph execution engine (C++ runtime)</text>

    <!-- Column 2: Epoch 2 -->
    <text x="440" y="38" font-size="8" font-weight="700" fill="#0f766e">Epoch 2: Token Serving</text>
    <text x="440" y="66" font-size="7.8" fill="#475569">Session KV cache in accelerator HBM</text>
    <text x="440" y="88" font-size="7.8" fill="#475569">OOM / Timeout / Distributional drift</text>
    <text x="440" y="110" font-size="7.8" fill="#475569">Token scheduler (continuous batching)</text>

    <!-- Column 3: Epoch 3 -->
    <text x="730" y="38" font-size="8" font-weight="700" fill="#166534">Epoch 3: Stateful Trajectories</text>
    <text x="730" y="66" font-size="7.8" fill="#475569">Distributed 4-tier state + external environment</text>
    <text x="730" y="88" font-size="7.8" fill="#991b1b">Fail-Plausible (valid syntax, broken semantics)</text>
    <text x="730" y="110" font-size="7.8" fill="#166534">High-integrity OS supervisor + verifier oracles</text>
  </g>
</svg>
