<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== Panel headers ===== -->
  <text x="30" y="30" font-size="14" font-weight="700" fill="#0f172a">A. A person closes the loop</text>
  <text x="390" y="30" font-size="14" font-weight="700" fill="#0f172a">B. A runtime closes the loop</text>
  <line x1="360" y1="14" x2="360" y2="356" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Proposal / action boundary (both panels) ===== -->
  <line x1="20" y1="140" x2="340" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="380" y1="140" x2="700" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="340" y="132" font-size="12" fill="#475569" text-anchor="end">proposes</text>
  <text x="340" y="157" font-size="12" fill="#475569" text-anchor="end">acts</text>
  <text x="700" y="132" font-size="12" fill="#475569" text-anchor="end">proposes</text>
  <text x="700" y="157" font-size="12" fill="#475569" text-anchor="end">acts</text>

  <!-- ===== Panel A ===== -->
  <!-- model endpoint -->
  <rect x="100" y="56" width="150" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="175" y="78" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Model endpoint</text>
  <text x="175" y="96" font-size="12" fill="#0369a1" text-anchor="middle">answers only</text>
  <!-- developer (hub) -->
  <rect x="100" y="180" width="150" height="50" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="175" y="202" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Developer</text>
  <text x="175" y="220" font-size="12" fill="#475569" text-anchor="middle">carries everything</text>
  <!-- local terminal -->
  <rect x="30" y="290" width="150" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="105" y="312" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Local terminal</text>
  <text x="105" y="330" font-size="12" fill="#b45309" text-anchor="middle">make test</text>

  <!-- A arrows -->
  <path d="M140,180 V106" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="132" y="172" font-size="12" fill="#334155" text-anchor="end">prompt + error</text>
  <path d="M210,106 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="218" y="124" font-size="12" fill="#334155">patch</text>
  <path d="M120,230 V290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="112" y="264" font-size="12" fill="#334155" text-anchor="end">runs</text>
  <path d="M160,290 V230" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="168" y="264" font-size="12" fill="#334155">error</text>

  <!-- ===== Panel B ===== -->
  <!-- foundation model -->
  <rect x="460" y="56" width="150" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="535" y="78" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Foundation model</text>
  <text x="535" y="96" font-size="12" fill="#0369a1" text-anchor="middle">holds no authority</text>
  <!-- agent runtime (hub, focal) -->
  <rect x="460" y="180" width="150" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="535" y="202" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Agent runtime</text>
  <text x="535" y="220" font-size="12" fill="#6d28d9" text-anchor="middle">grants each action</text>
  <!-- sandbox -->
  <rect x="390" y="290" width="140" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="460" y="312" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Sandbox</text>
  <text x="460" y="330" font-size="12" fill="#b45309" text-anchor="middle">isolated</text>
  <!-- verifiers -->
  <rect x="560" y="290" width="140" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="630" y="312" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Verifiers</text>
  <text x="630" y="330" font-size="12" fill="#b45309" text-anchor="middle">tests, linters</text>

  <!-- B arrows -->
  <path d="M500,180 V106" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="492" y="172" font-size="12" fill="#334155" text-anchor="end">context</text>
  <path d="M570,106 V180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="578" y="124" font-size="12" fill="#334155">proposal</text>
  <path d="M470,230 V290" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="462" y="264" font-size="12" fill="#6d28d9" text-anchor="end">dispatch</text>
  <path d="M500,290 V230" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="506" y="264" font-size="12" fill="#334155">observation</text>
  <path d="M530,315 H560" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M600,290 V230" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="608" y="264" font-size="12" fill="#334155">evidence</text>
</svg>
