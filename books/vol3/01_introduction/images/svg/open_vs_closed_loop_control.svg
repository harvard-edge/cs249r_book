<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Canonical Academic Arrowhead Markers -->
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
    <marker id="arr-navy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#0f766e"/>
    </marker>
    <marker id="arr-sage" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#166534"/>
    </marker>
  </defs>

  <rect width="880" height="380" fill="#FFFFFF"/>

  <!-- Panel A: Human-in-the-Loop Serving (Era 2) -->
  <g transform="translate(30, 20)">
    <rect width="390" height="340" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#334155">A. Human-in-the-Loop Serving (Era 2)</text>
    <text x="20" y="48" font-size="8.5" fill="#64748B">Human closes the loop</text>

    <!-- Developer box -->
    <rect x="30" y="80" width="130" height="80" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="95" y="115" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Developer</text>
    <text x="95" y="132" text-anchor="middle" font-size="8" fill="#64748B">(Manual Runtime)</text>

    <!-- Serving Cluster box -->
    <rect x="230" y="80" width="130" height="80" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="295" y="115" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Serving Cluster</text>
    <text x="295" y="132" text-anchor="middle" font-size="8" fill="#64748B">(Passive Engine)</text>

    <!-- Arrows between dev and cluster -->
    <line x1="160" y1="105" x2="223" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="195" y="98" text-anchor="middle" font-size="7.5" fill="#475569">Prompt</text>
    <line x1="230" y1="135" x2="167" y2="135" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="195" y="148" text-anchor="middle" font-size="7.5" fill="#475569">Patch</text>

    <!-- Local Terminal box -->
    <rect x="30" y="230" width="130" height="65" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="95" y="260" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">Local Terminal</text>
    <text x="95" y="276" text-anchor="middle" font-size="8" fill="#64748B">make test • git diff</text>

    <line x1="95" y1="160" x2="95" y2="223" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="105" y="195" font-size="8" fill="#475569">Executes</text>

    <path d="M 160,262 C 220,262 280,240 280,165" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
    <text x="285" y="215" font-size="7.5" fill="#64748B">Compiler error re-pasted</text>
  </g>

  <!-- Panel B: Autonomous Agent Architecture (Era 3) -->
  <g transform="translate(460, 20)">
    <rect width="390" height="340" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.4"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#1E293B">B. Autonomous Agent Architecture (Era 3)</text>
    <text x="20" y="48" font-size="8.5" fill="#475569">Host supervisor provides programmatic, closed-loop mediation</text>

    <!-- Host Supervisor box -->
    <rect x="30" y="80" width="140" height="80" rx="3" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
    <text x="100" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Host Supervisor</text>
    <text x="100" y="124" text-anchor="middle" font-size="8" fill="#475569">Context Buffer &amp; WAL</text>
    <text x="100" y="140" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">Zero Ambient Auth (A = 0)</text>

    <!-- Foundation Model box -->
    <rect x="230" y="80" width="130" height="80" rx="3" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
    <text x="295" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#0F766E">Foundation Model</text>
    <text x="295" y="128" text-anchor="middle" font-size="8" fill="#475569">Unprivileged Core</text>
    <text x="295" y="142" text-anchor="middle" font-size="7.5" fill="#0F766E">Proposal a_prop</text>

    <!-- Arrows between supervisor and model -->
    <line x1="170" y1="105" x2="223" y2="105" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <text x="198" y="98" text-anchor="middle" font-size="7.5" fill="#1E293B">Context c_t</text>
    <line x1="230" y1="135" x2="177" y2="135" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr-teal)"/>
    <text x="200" y="148" text-anchor="middle" font-size="7.5" fill="#0F766E">a_prop</text>

    <!-- Isolated Sandbox box -->
    <rect x="30" y="230" width="140" height="65" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
    <text x="100" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E293B">Isolated Sandbox</text>
    <text x="100" y="274" text-anchor="middle" font-size="8" fill="#475569">microVM / Container</text>

    <!-- Actuates arrow down -->
    <line x1="75" y1="160" x2="75" y2="223" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="45" y="195" font-size="7.5" fill="#334155">Actuates</text>

    <!-- Observation / Exit code arrow up -->
    <line x1="125" y1="223" x2="125" y2="167" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="130" y="195" font-size="7.5" fill="#334155">Obs o_(t+1)</text>

    <!-- Oracle Verifier box -->
    <rect x="230" y="230" width="130" height="65" rx="3" fill="#FFFFFF" stroke="#166534" stroke-width="1.3"/>
    <text x="295" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Verifier Oracles</text>
    <text x="295" y="274" text-anchor="middle" font-size="8" fill="#475569">Tests, Linters, AST</text>

    <!-- Verify trigger line -->
    <line x1="170" y1="262" x2="223" y2="262" stroke="#166534" stroke-width="1.2" marker-end="url(#arr-sage)"/>
    <text x="196" y="255" text-anchor="middle" font-size="7.5" fill="#166534">Evaluate</text>

    <!-- Evidence feedback path back to Host Supervisor bottom -->
    <path d="M 295,230 L 295,190 L 150,190 L 150,167" fill="none" stroke="#166534" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-sage)"/>
    <text x="225" y="185" text-anchor="middle" font-size="7.5" font-weight="600" fill="#166534">Evidence v_(t+1)</text>
  </g>
</svg>
