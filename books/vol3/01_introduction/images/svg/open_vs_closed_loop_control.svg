<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748B"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#581C87"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#FFFFFF"/>

  <!-- Panel A: Human-in-the-Loop Serving (Era 2) -->
  <g transform="translate(30, 20)">
    <rect width="390" height="340" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#334155">A. Human-in-the-Loop Serving (Era 2)</text>
    <text x="20" y="48" font-size="8.5" fill="#64748B">Human developer provides closed-loop state tracking &amp; arbitration</text>

    <!-- Developer box -->
    <rect x="30" y="80" width="130" height="80" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="95" y="115" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Developer</text>
    <text x="95" y="132" text-anchor="middle" font-size="8" fill="#64748B">(Manual Runtime)</text>

    <!-- Serving Cluster box -->
    <rect x="230" y="80" width="130" height="80" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="295" y="115" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Serving Cluster</text>
    <text x="295" y="132" text-anchor="middle" font-size="8" fill="#64748B">(Passive Engine)</text>

    <!-- Arrows between dev and cluster -->
    <line x1="160" y1="105" x2="223" y2="105" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="195" y="98" text-anchor="middle" font-size="7.5" fill="#475569">Prompt</text>
    <line x1="230" y1="135" x2="167" y2="135" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="195" y="148" text-anchor="middle" font-size="7.5" fill="#475569">Patch</text>

    <!-- Local OS box -->
    <rect x="30" y="230" width="130" height="65" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="95" y="260" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">Local Terminal</text>
    <text x="95" y="276" text-anchor="middle" font-size="8" fill="#64748B">make test • git diff</text>

    <line x1="95" y1="160" x2="95" y2="223" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="105" y="195" font-size="8" fill="#475569">Executes</text>

    <path d="M 160,262 C 220,262 280,240 280,165" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
    <text x="285" y="225" font-size="7.5" fill="#64748B">Compiler Error re-pasted</text>
  </g>

  <!-- Panel B: Autonomous Agent Architecture (Era 3) -->
  <g transform="translate(460, 20)">
    <rect width="390" height="340" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#581C87">B. Autonomous Agent Architecture (Era 3)</text>
    <text x="20" y="48" font-size="8.5" fill="#6D28D9">Host supervisor provides programmatic, closed-loop mediation</text>

    <!-- Host Supervisor box -->
    <rect x="30" y="80" width="140" height="80" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5"/>
    <text x="100" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#581C87">Host Supervisor</text>
    <text x="100" y="128" text-anchor="middle" font-size="8" fill="#6D28D9">Context &amp; Invariants</text>
    <text x="100" y="142" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803D">Zero Ambient Auth (A=0)</text>

    <!-- Foundation Model box -->
    <rect x="230" y="80" width="130" height="80" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/>
    <text x="295" y="115" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Foundation Model</text>
    <text x="295" y="132" text-anchor="middle" font-size="8" fill="#64748B">(Unprivileged Core)</text>

    <!-- Arrows between supervisor and model -->
    <line x1="170" y1="105" x2="223" y2="105" stroke="#581C87" stroke-width="1.5" marker-end="url(#arr-purple)"/>
    <text x="198" y="98" text-anchor="middle" font-size="7.5" fill="#581C87">Context h_t</text>
    <line x1="230" y1="135" x2="177" y2="135" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-purple)"/>
    <text x="200" y="148" text-anchor="middle" font-size="7.5" fill="#7C3AED">Proposal a_prop</text>

    <!-- Isolated Sandbox box -->
    <rect x="30" y="230" width="140" height="65" rx="3" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3"/>
    <text x="100" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803D">Isolated Sandbox</text>
    <text x="100" y="274" text-anchor="middle" font-size="8" fill="#166534">microVM / OverlayFS</text>

    <line x1="75" y1="160" x2="75" y2="223" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="45" y="195" font-size="7.5" fill="#15803D">Actuates</text>

    <line x1="125" y1="223" x2="125" y2="167" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="130" y="195" font-size="7.5" fill="#15803D">Exit Code</text>

    <!-- Oracle Verifier box -->
    <rect x="230" y="230" width="130" height="65" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.2"/>
    <text x="295" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581C87">Verifier Oracles</text>
    <text x="295" y="274" text-anchor="middle" font-size="8" fill="#64748B">AST Diff • Unit Tests</text>

    <line x1="170" y1="262" x2="223" y2="262" stroke="#581C87" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <text x="196" y="255" text-anchor="middle" font-size="7.5" fill="#581C87">Verify</text>
  </g>
</svg>
