<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Canonical Academic Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="580" fill="#ffffff"/>

  <!-- Shift all content 25px right for balanced margins -->
  <g transform="translate(25, 0)">
    <!-- 1. Goal Input Box (Top Center) -->
    <g transform="translate(300, 24)">
      <rect x="0" y="0" width="280" height="46" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
      <rect x="0" y="0" width="280" height="20" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
      <text x="140" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">DELEGATED GOAL SPECIFICATION (g)</text>
      <text x="140" y="36" text-anchor="middle" font-size="8.5" fill="#475569">Task Objective, Invariant Contract, and Acceptance Gates</text>
    </g>

    <!-- Downward Arrow from Goal to Context Assembly -->
    <line x1="440" y1="70" x2="440" y2="92" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>

    <!-- 2. Context Assembly Layer -->
    <g transform="translate(220, 94)">
      <rect x="0" y="0" width="440" height="62" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
      <rect x="0" y="0" width="440" height="22" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">PERCEPTION AND CONTEXT ASSEMBLY LAYER</text>
      <text x="220" y="37" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Trajectory History Serialization and Window Compaction</text>
      <text x="220" y="51" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">c_t = [ g, o_0, a_0, v_1, ..., a_{t-1}, o_t, v_t ]</text>
    </g>

    <!-- Downward Arrow to Neural Policy Engine -->
    <line x1="440" y1="156" x2="440" y2="182" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
    <text x="448" y="172" font-size="8" font-weight="600" fill="#1e293b">context c_t</text>

    <!-- 3. Neural Policy Engine (Central Box) -->
    <g transform="translate(190, 184)">
      <rect x="0" y="0" width="500" height="66" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="500" height="22" rx="3" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
      <text x="14" y="15" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">NEURAL POLICY ENGINE (π_θ)</text>
      <text x="486" y="15" text-anchor="end" font-size="8" font-weight="600" fill="#475569">Unprivileged Stochastic Core (A = 0)</text>
      <text x="250" y="39" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0f172a">Prefill GEMM · decode GEMV · grammar mask</text>
      <text x="250" y="54" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#1e293b">Action Proposal: a_t ~ π_θ(· | c_t)</text>
    </g>

    <!-- Split Paths: Left = Internal Deliberation, Right = External Tool Action -->
    <!-- Left Path Line -->
    <path d="M 315,250 L 315,280 L 180,280 L 180,302" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
    <text x="245" y="274" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">Deliberation Action (a_thought)</text>

    <!-- Right Path Line -->
    <path d="M 565,250 L 565,280 L 670,280 L 670,302" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
    <text x="620" y="274" text-anchor="middle" font-size="8" font-weight="600" fill="#0f766e">Tool Action Proposal (a_prop)</text>

    <!-- 4A. Left Box: Internal Scratchpad -->
    <g transform="translate(60, 304)">
      <rect x="0" y="0" width="240" height="76" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
      <rect x="0" y="0" width="240" height="22" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#334155" letter-spacing="0.3">INTERNAL SCRATCHPAD BUFFER</text>
      <g transform="translate(10, 30)">
        <rect x="0" y="0" width="220" height="38" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="600" fill="#0f172a">Chain-of-Thought Reflection</text>
        <text x="10" y="28" font-size="8" fill="#475569">Pure cognitive state; zero environment mutation</text>
      </g>
    </g>

    <!-- 4B. Right Box: Tool Execution Sandbox -->
    <g transform="translate(520, 304)">
      <rect x="0" y="0" width="300" height="76" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
      <rect x="0" y="0" width="300" height="22" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#0f766e" letter-spacing="0.3">TOOL EXECUTION SANDBOX (A = 0)</text>
      <g transform="translate(10, 30)">
        <rect x="0" y="0" width="280" height="38" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="600" fill="#0f172a">Isolated Effector Container (microVM / gVisor)</text>
        <text x="10" y="28" font-size="8" fill="#475569">Path canonicalization, capability check, resource budget</text>
      </g>
    </g>

    <!-- Downward Line from Sandbox to Environment -->
    <line x1="670" y1="380" x2="670" y2="402" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
    <text x="678" y="395" font-size="8" font-weight="600" fill="#0f766e">Authorized Dispatch D(a_perm)</text>

    <!-- 5. Ground-Truth Environment State -->
    <g transform="translate(520, 404)">
      <rect x="0" y="0" width="300" height="66" rx="3" fill="#f8fafc" stroke="#991b1b" stroke-width="1.3"/>
      <rect x="0" y="0" width="300" height="22" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="1.3"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#991b1b" letter-spacing="0.3">GROUND-TRUTH ENVIRONMENT STATE (S)</text>
      <g transform="translate(10, 28)">
        <rect x="0" y="0" width="280" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="13" font-size="8.5" font-weight="600" fill="#0f172a">Filesystem, Operating System Processes, Git Trees</text>
        <text x="10" y="24" font-size="7.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b">Reversibility Boundary: s_(t+1) ~ T(s_t, a_perm)</text>
      </g>
    </g>

    <!-- Downward Line to Runtime Verification Oracle -->
    <line x1="670" y1="470" x2="670" y2="492" stroke="#166534" stroke-width="1.6" marker-end="url(#arr-sage)"/>

    <!-- 6. Runtime Verification Oracle -->
    <g transform="translate(520, 494)">
      <rect x="0" y="0" width="300" height="66" rx="3" fill="#f8fafc" stroke="#166534" stroke-width="1.3"/>
      <rect x="0" y="0" width="300" height="22" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.3"/>
      <text x="12" y="15" font-size="9" font-weight="700" fill="#166534" letter-spacing="0.3">RUNTIME VERIFICATION ORACLE (V)</text>
      <g transform="translate(10, 28)">
        <rect x="0" y="0" width="280" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="13" font-size="8.5" font-weight="600" fill="#0f172a">Immutable Test Suites, Static Linters, AST Evaluators</text>
        <text x="10" y="24" font-size="7.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">Emits Observation o_(t+1) and Evidence v_(t+1)</text>
      </g>
    </g>

    <!-- Loop Closure Paths Back to Context Assembly Layer -->
    <!-- From Scratchpad (Left) -->
    <path d="M 60,342 L 30,342 L 30,125 L 218,125" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-slate)"/>
    <text x="20" y="245" transform="rotate(-90, 20, 245)" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">Append Thought Trace to Context c_(t+1)</text>

    <!-- From Verification Oracle (Right) -->
    <path d="M 670,560 L 670,572 L 840,572 L 840,125 L 662,125" fill="none" stroke="#166534" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-sage)"/>
    <text x="852" y="350" transform="rotate(90, 852, 350)" font-size="8" font-weight="600" fill="#166534" text-anchor="middle">Verified Evidence v_(t+1) and Observation o_(t+1) Closes Loop into Context c_(t+1)</text>
  </g>
</svg>