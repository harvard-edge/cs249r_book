<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="640" fill="#ffffff"/>

  <text x="40" y="38" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE CLOSED-LOOP AGENTIC EXECUTION ARCHITECTURE</text>
  <text x="40" y="52" font-size="8.5" fill="#64748b">Formal interaction loop between neural policy proposal and external environment mutation</text>

  <!-- 1. Goal Input Box (Top Center) -->
  <g transform="translate(300, 72)">
    <rect x="0" y="0" width="280" height="42" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="280" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="140" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">DELEGATED OBJECTIVE / GOAL (g)</text>
    <text x="140" y="32" text-anchor="middle" font-size="8" fill="#64748b">User Prompt • API Trigger • Sub-goal Task Specification</text>
  </g>

  <!-- Downward Arrow from Goal to Context Assembly -->
  <line x1="440" y1="114" x2="440" y2="132" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <!-- 2. Context Assembly Layer -->
  <g transform="translate(220, 132)">
    <rect x="0" y="0" width="440" height="60" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="15" font-size="9" font-weight="700" fill="#334155">PERCEPTION &amp; CONTEXT ASSEMBLY LAYER</text>
    <text x="220" y="37" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">History Serialization • Dynamic Window Compaction • Tokenization</text>
    <text x="220" y="50" text-anchor="middle" font-size="7.5" fill="#64748b">Assembles full trajectory context: h_t = (g, o_0, a_0, ..., o_t)</text>
  </g>

  <!-- Downward Arrow to Neural Policy Engine -->
  <line x1="440" y1="192" x2="440" y2="216" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="450" y="207" font-size="8" font-weight="700" fill="#6d28d9">h_t context</text>

  <!-- 3. Neural Policy Engine (Central Box) -->
  <g transform="translate(190, 216)">
    <rect x="0" y="0" width="500" height="70" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">NEURAL POLICY ENGINE (π_θ)</text>
    <text x="250" y="42" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Autoregressive Prefill &amp; Decode • Structured Grammar-Constrained Decoding</text>
    <text x="250" y="58" text-anchor="middle" font-size="8" fill="#6d28d9">Emits Action Proposal: a_t ~ π_θ(· | h_t)</text>
  </g>

  <!-- Split Paths: Left = Internal Thought, Right = External Tool -->
  <!-- Left Path Line -->
  <path d="M 315,286 L 315,314 L 180,314 L 180,336" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="245" y="310" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Thought Action (a_thought)</text>

  <!-- Right Path Line -->
  <path d="M 565,286 L 565,314 L 670,314 L 670,336" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="620" y="310" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">Tool Action (a_tool)</text>

  <!-- 4A. Left Box: Internal Scratchpad -->
  <g transform="translate(60, 338)">
    <rect x="0" y="0" width="240" height="74" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">INTERNAL SCRATCHPAD</text>

    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="220" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Chain-of-Thought (CoT) / Reflection</text>
      <text x="10" y="26" font-size="7.5" fill="#64748b">Pure cognitive state (no environment mutation)</text>
    </g>
  </g>

  <!-- 4B. Right Box: Tool Execution Sandbox -->
  <g transform="translate(520, 338)">
    <rect x="0" y="0" width="300" height="74" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">TOOL EXECUTION SANDBOX</text>
    <!-- Tag badge -->
    <rect x="226" y="4" width="64" height="16" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="258" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">ISOLATION</text>

    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="280" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Model Context Protocol (MCP) • MicroVM / gVisor</text>
      <text x="10" y="26" font-size="7.5" fill="#64748b">Capability checks • AST validation • Resource budgets</text>
    </g>
  </g>

  <!-- Downward Line from Sandbox to Environment -->
  <line x1="670" y1="412" x2="670" y2="432" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="678" y="425" font-size="7.5" font-weight="700" fill="#0369a1">Side Effects</text>

  <!-- 5. Ground-Truth Environment State -->
  <g transform="translate(520, 434)">
    <rect x="0" y="0" width="300" height="66" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">GROUND-TRUTH ENVIRONMENT STATE (S)</text>

    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="280" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="12" font-size="8" font-weight="700" fill="#0f172a">Filesystem, OS Processes, Git Repository, Network APIs</text>
      <text x="10" y="22" font-size="7.5" fill="#dc2626">Crossing Reversibility Boundary: s_{t+1} ~ T(s_t, a_tool)</text>
    </g>
  </g>

  <!-- Downward Line to Runtime Verification Oracle -->
  <line x1="670" y1="500" x2="670" y2="520" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- 6. Runtime Verification Oracle -->
  <g transform="translate(520, 522)">
    <rect x="0" y="0" width="300" height="66" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">RUNTIME VERIFICATION ORACLE</text>

    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="280" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="12" font-size="8" font-weight="700" fill="#0f172a">Deterministic Test Suites • Linter Exit Codes • AST Parsers</text>
      <text x="10" y="22" font-size="7.5" fill="#15803d">Emits Ground-Truth Observation &amp; Pass/Fail Verdict (o_{t+1})</text>
    </g>
  </g>

  <!-- Loop Closure Paths Back to Context Assembly Layer -->
  <!-- From Scratchpad (Left) -->
  <path d="M 60,375 L 36,375 L 36,162 L 218,162" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="28" y="280" transform="rotate(-90, 28, 280)" font-size="8" font-weight="700" fill="#7c3aed" text-anchor="middle">Append Thought to h_{t+1}</text>

  <!-- From Verification Oracle (Right) -->
  <path d="M 670,588 L 670,604 L 842,604 L 842,162 L 662,162" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="852" y="380" transform="rotate(90, 852, 380)" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">Verified Feedback Closes Loop into h_{t+1}</text>
</svg>
