<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead marker for trajectory -->
    <marker id="traj-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="340" fill="#ffffff" rx="4"/>

  <!-- Guardrail Envelope / Corridor -->
  <path d="M 185,85 C 310,40 550,40 690,80 L 690,165 C 550,225 310,215 185,150 Z"
        fill="#fbf7ff" opacity="0.8"/>
  <path d="M 185,85 C 310,40 550,40 690,80"
        fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 185,150 C 310,215 550,225 690,165"
        fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="440" y="34" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7c3aed" letter-spacing="0.5">ENFORCEABLE GUARDRAIL ENVELOPE (POLICIES • BUDGETS • CONSTRAINTS)</text>

  <!-- Left Anchor: Delegated Goal (Vol III pastel standard) -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="160" height="76" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="80" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Delegated Goal</text>
    <text x="80" y="42" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Task intent &amp; success criteria</text>
    <text x="80" y="58" text-anchor="middle" font-size="8" fill="#64748b">Owner identity • policy bounds</text>
  </g>

  <!-- Right Anchor: Verified Outcome (Vol III pastel standard) -->
  <g transform="translate(695, 68)">
    <rect x="0" y="0" width="160" height="76" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="80" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Verified Outcome</text>
    <text x="80" y="42" text-anchor="middle" font-size="8.5" font-weight="600" fill="#166534">Audited objective completion</text>
    <text x="80" y="58" text-anchor="middle" font-size="8" fill="#15803d">Proof of correctness • total cost</text>
  </g>

  <!-- The Central Trajectory Curve -->
  <path d="M 185,115 C 265,75 375,80 435,122 C 495,164 610,165 688,107"
        fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#traj-arrow)"/>

  <!-- Subevent 1: Request (Neutral) -->
  <line x1="250" y1="94" x2="250" y2="70" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="250" cy="94" r="3.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(214, 46)">
    <rect x="0" y="0" width="72" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="36" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">request</text>
  </g>

  <!-- Subevent 2: Model Call (Compute Blue) -->
  <line x1="330" y1="87" x2="330" y2="65" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="330" cy="87" r="3.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(288, 41)">
    <rect x="0" y="0" width="84" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="42" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">model call</text>
  </g>

  <!-- Subevent 3: Context Retrieval (Memory Green) -->
  <line x1="435" y1="122" x2="435" y2="84" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="435" cy="122" r="4" fill="#16a34a" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(399, 60)">
    <rect x="0" y="0" width="72" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="36" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">context</text>
  </g>

  <!-- Subevent 4: Tool Call (Actuation Amber - NOT Red!) -->
  <line x1="515" y1="152" x2="515" y2="182" stroke="#d97706" stroke-width="1.2"/>
  <circle cx="515" cy="152" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(477, 182)">
    <rect x="0" y="0" width="76" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="38" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">tool call</text>
  </g>

  <!-- Subevent 5: Human/Audit Approval (Supervisor Purple) -->
  <line x1="590" y1="162" x2="590" y2="192" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="590" cy="162" r="4" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(551, 192)">
    <rect x="0" y="0" width="78" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="39" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">approval</text>
  </g>

  <!-- Subevent 6: Physical/Environment Effect (Mutation Orange) -->
  <line x1="645" y1="135" x2="645" y2="74" stroke="#ea580c" stroke-width="1.2"/>
  <circle cx="645" cy="135" r="4" fill="#ea580c" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(614, 50)">
    <rect x="0" y="0" width="62" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
    <text x="31" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c2410c">effect</text>
  </g>

  <!-- Bottom Panel: Managed Trajectory Descriptor -->
  <g transform="translate(25, 236)">
    <rect x="0" y="0" width="830" height="88" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="830" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="415" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a" letter-spacing="0.4">MANAGED TRAJECTORY DESCRIPTOR (CROSS-LAYER SYSTEM HANDLE)</text>

    <!-- Field 1: identity + goal -->
    <g transform="translate(12, 30)">
      <rect x="0" y="0" width="108" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="54" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">identity + goal</text>
      <text x="54" y="34" text-anchor="middle" font-size="8" fill="#64748b">principal • intent</text>
    </g>

    <!-- Field 2: budget + deadline -->
    <g transform="translate(128, 30)">
      <rect x="0" y="0" width="108" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="54" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">budget + deadline</text>
      <text x="54" y="34" text-anchor="middle" font-size="8" fill="#64748b">tokens • $, J • time</text>
    </g>

    <!-- Field 3: memory handles -->
    <g transform="translate(244, 30)">
      <rect x="0" y="0" width="108" height="48" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="54" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">memory handles</text>
      <text x="54" y="34" text-anchor="middle" font-size="8" fill="#166534">context • KV • files</text>
    </g>

    <!-- Field 4: authority -->
    <g transform="translate(360, 30)">
      <rect x="0" y="0" width="108" height="48" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <text x="54" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">authority</text>
      <text x="54" y="34" text-anchor="middle" font-size="8" fill="#92400e">tools • scopes • leases</text>
    </g>

    <!-- Field 5: effects + recovery -->
    <g transform="translate(476, 30)">
      <rect x="0" y="0" width="108" height="48" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="54" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">effects + recovery</text>
      <text x="54" y="34" text-anchor="middle" font-size="8" fill="#7c3aed">logs • Saga • rollback</text>
    </g>

    <!-- Field 6: trace + evidence -->
    <g transform="translate(592, 30)">
      <rect x="0" y="0" width="108" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="54" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">trace + evidence</text>
      <text x="54" y="34" text-anchor="middle" font-size="8" fill="#64748b">spans • proof • evals</text>
    </g>

    <!-- Field 7: placement + cost -->
    <g transform="translate(708, 30)">
      <rect x="0" y="0" width="110" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="55" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">placement + cost</text>
      <text x="55" y="34" text-anchor="middle" font-size="8" fill="#64748b">locality • energy • SLA</text>
    </g>
  </g>
</svg>
