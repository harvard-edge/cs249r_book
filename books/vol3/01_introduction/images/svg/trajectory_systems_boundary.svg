<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead marker for trajectory -->
    <marker id="traj-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#581C87"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Guardrail Envelope / Corridor -->
  <path d="M 185,85 C 310,40 550,40 690,80 L 690,165 C 550,225 310,215 185,150 Z"
        fill="#fbf7ff" opacity="0.8"/>
  <path d="M 185,85 C 310,40 550,40 690,80"
        fill="none" stroke="#7e22ce" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 185,150 C 310,215 550,225 690,165"
        fill="none" stroke="#7e22ce" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="440" y="38" text-anchor="middle" font-size="8" font-weight="600" fill="#9333ea" letter-spacing="0.5">ENFORCEABLE GUARDRAIL ENVELOPE (POLICIES • BUDGETS • CONSTRAINTS)</text>

  <!-- Left Anchor: Delegated Goal -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="155" height="74" rx="3" fill="#faf5ff" stroke="#581C87" stroke-width="1.8"/>
    <rect x="0" y="0" width="155" height="22" rx="3" fill="#581C87"/>
    <text x="77.5" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">Delegated Goal</text>
    <text x="77.5" y="40" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Task intent &amp; success criteria</text>
    <text x="77.5" y="55" text-anchor="middle" font-size="7.5" fill="#64748b">Owner identity • policy bounds</text>
  </g>

  <!-- Right Anchor: Verified Outcome -->
  <g transform="translate(695, 68)">
    <rect x="0" y="0" width="155" height="74" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="0" y="0" width="155" height="22" rx="3" fill="#16a34a"/>
    <text x="77.5" y="15" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">Verified Outcome</text>
    <text x="77.5" y="40" text-anchor="middle" font-size="8.5" font-weight="600" fill="#166534">Audited objective completion</text>
    <text x="77.5" y="55" text-anchor="middle" font-size="7.5" fill="#15803d">Proof of correctness • total cost</text>
  </g>

  <!-- The Central Trajectory Curve -->
  <path d="M 185,115 C 265,75 375,80 435,122 C 495,164 610,165 688,107"
        fill="none" stroke="#581C87" stroke-width="3" marker-end="url(#traj-arrow)"/>

  <!-- Subevent 1: Request -->
  <line x1="250" y1="94" x2="250" y2="72" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="250" cy="94" r="3.5" fill="#581C87" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(215, 48)">
    <rect x="0" y="0" width="70" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="35" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">request</text>
  </g>

  <!-- Subevent 2: Model Call -->
  <line x1="330" y1="87" x2="330" y2="67" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="330" cy="87" r="3.5" fill="#581C87" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(290, 43)">
    <rect x="0" y="0" width="80" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="40" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">model call</text>
  </g>

  <!-- Subevent 3: Context Retrieval -->
  <line x1="435" y1="122" x2="435" y2="86" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="435" cy="122" r="4" fill="#16a34a" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(400, 62)">
    <rect x="0" y="0" width="70" height="24" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="35" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">context</text>
  </g>

  <!-- Subevent 4: Tool Call -->
  <line x1="515" y1="152" x2="515" y2="182" stroke="#e11d48" stroke-width="1.2"/>
  <circle cx="515" cy="152" r="4" fill="#e11d48" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(478, 182)">
    <rect x="0" y="0" width="74" height="24" rx="2" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="37" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#be123c">tool call</text>
  </g>

  <!-- Subevent 5: Human/Audit Approval -->
  <line x1="590" y1="162" x2="590" y2="192" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="590" cy="162" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(552, 192)">
    <rect x="0" y="0" width="76" height="24" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="38" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">approval</text>
  </g>

  <!-- Subevent 6: Physical Effect -->
  <line x1="645" y1="135" x2="645" y2="76" stroke="#ea580c" stroke-width="1.2"/>
  <circle cx="645" cy="135" r="4" fill="#ea580c" stroke="#ffffff" stroke-width="1.2"/>
  <g transform="translate(615, 52)">
    <rect x="0" y="0" width="60" height="24" rx="2" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="30" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#c2410c">effect</text>
  </g>

  <!-- Bottom Panel: Managed Trajectory Descriptor -->
  <g transform="translate(30, 240)">
    <rect x="0" y="0" width="820" height="82" rx="3" fill="#f8fafc" stroke="#581C87" stroke-width="1.5"/>
    <text x="410" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87" letter-spacing="0.5">MANAGED TRAJECTORY DESCRIPTOR (CROSS-LAYER SYSTEM HANDLE)</text>

    <!-- Field 1: identity + goal -->
    <g transform="translate(14, 26)">
      <rect x="0" y="0" width="106" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="53" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">identity + goal</text>
      <text x="53" y="32" text-anchor="middle" font-size="6.8" fill="#64748b">principal • intent</text>
    </g>

    <!-- Field 2: budget + deadline -->
    <g transform="translate(128, 26)">
      <rect x="0" y="0" width="106" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="53" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">budget + deadline</text>
      <text x="53" y="32" text-anchor="middle" font-size="6.8" fill="#64748b">tokens • $, J • time</text>
    </g>

    <!-- Field 3: memory handles -->
    <g transform="translate(242, 26)">
      <rect x="0" y="0" width="106" height="44" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="53" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">memory handles</text>
      <text x="53" y="32" text-anchor="middle" font-size="6.8" fill="#166534">context • KV • files</text>
    </g>

    <!-- Field 4: authority -->
    <g transform="translate(356, 26)">
      <rect x="0" y="0" width="106" height="44" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="53" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">authority</text>
      <text x="53" y="32" text-anchor="middle" font-size="6.8" fill="#1e40af">tools • scopes • leases</text>
    </g>

    <!-- Field 5: effects + recovery -->
    <g transform="translate(470, 26)">
      <rect x="0" y="0" width="106" height="44" rx="2" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
      <text x="53" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#be123c">effects + recovery</text>
      <text x="53" y="32" text-anchor="middle" font-size="6.8" fill="#9f1239">logs • saga • rollback</text>
    </g>

    <!-- Field 6: trace + evidence -->
    <g transform="translate(584, 26)">
      <rect x="0" y="0" width="106" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="53" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">trace + evidence</text>
      <text x="53" y="32" text-anchor="middle" font-size="6.8" fill="#64748b">spans • proof • evals</text>
    </g>

    <!-- Field 7: placement + cost -->
    <g transform="translate(698, 26)">
      <rect x="0" y="0" width="108" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
      <text x="54" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">placement + cost</text>
      <text x="54" y="32" text-anchor="middle" font-size="6.8" fill="#64748b">locality • energy • SLA</text>
    </g>
  </g>
</svg>
