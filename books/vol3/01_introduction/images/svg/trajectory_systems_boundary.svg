<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead marker for trajectory -->
    <marker id="traj-arrow" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#581C87"/>
    </marker>
    <marker id="bus-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="360" fill="#FFFFFF" rx="2"/>

  <!-- Guardrail Envelope / Corridor -->
  <path d="M 185,85 C 310,38 560,38 700,80 L 700,165 C 560,225 310,215 185,150 Z"
        fill="#FAF5FF" opacity="0.85"/>
  <path d="M 185,85 C 310,38 560,38 700,80"
        fill="none" stroke="#581C87" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 185,150 C 310,215 560,225 700,165"
        fill="none" stroke="#581C87" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="445" y="32" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87" letter-spacing="0.5">ENFORCEABLE GUARDRAIL ENVELOPE: S_admissible ⊂ S (BUDGETS • LEASES • INVARIANTS)</text>

  <!-- Left Anchor: Delegated Goal g -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="155" height="76" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.2"/>
    <rect x="0" y="0" width="155" height="22" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="77" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Delegated Goal (g)</text>
    <text x="77" y="40" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">Task Intent &amp; SLA</text>
    <text x="77" y="56" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Owner Principal UID</text>
  </g>

  <!-- Right Anchor: Verified Outcome (Acceptance Evidence) -->
  <g transform="translate(705, 68)">
    <rect x="0" y="0" width="165" height="76" rx="2" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
    <rect x="0" y="0" width="165" height="22" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
    <text x="82" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">Verified Deliverable (τ*)</text>
    <text x="82" y="40" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#166534">Acceptance Evidence Pass</text>
    <text x="82" y="56" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#15803D">Audited State &amp; Ledger</text>
  </g>

  <!-- The Central Trajectory Curve -->
  <path d="M 180,115 C 265,75 375,78 435,120 C 495,162 615,164 698,107"
        fill="none" stroke="#581C87" stroke-width="2.6" marker-end="url(#traj-arrow)"/>

  <!-- Subevent 1: Request r_t -->
  <line x1="250" y1="94" x2="250" y2="68" stroke="#94A3B8" stroke-width="1"/>
  <circle cx="250" cy="94" r="3.5" fill="#581C87" stroke="#FFFFFF" stroke-width="1.2"/>
  <g transform="translate(212, 44)">
    <rect x="0" y="0" width="76" height="24" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="38" y="16" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#334155">r_t (Request)</text>
  </g>

  <!-- Subevent 2: Model Call M(c_t) -->
  <line x1="330" y1="87" x2="330" y2="62" stroke="#0284C7" stroke-width="1"/>
  <circle cx="330" cy="87" r="3.5" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.2"/>
  <g transform="translate(290, 38)">
    <rect x="0" y="0" width="80" height="24" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.1"/>
    <text x="40" y="16" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0369A1">M(c_t) (Model)</text>
  </g>

  <!-- Subevent 3: Context Retrieval c_t -->
  <line x1="435" y1="120" x2="435" y2="82" stroke="#15803D" stroke-width="1"/>
  <circle cx="435" cy="120" r="3.5" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
  <g transform="translate(395, 58)">
    <rect x="0" y="0" width="80" height="24" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
    <text x="40" y="16" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">c_t (Context)</text>
  </g>

  <!-- Subevent 4: Tool Call a_perm -->
  <line x1="515" y1="150" x2="515" y2="182" stroke="#D97706" stroke-width="1"/>
  <circle cx="515" cy="150" r="3.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.2"/>
  <g transform="translate(475, 182)">
    <rect x="0" y="0" width="80" height="24" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
    <text x="40" y="16" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#B45309">a_perm (Tool)</text>
  </g>

  <!-- Subevent 5: Audit Gate alpha_t -->
  <line x1="595" y1="162" x2="595" y2="194" stroke="#581C87" stroke-width="1"/>
  <circle cx="595" cy="162" r="3.5" fill="#581C87" stroke="#FFFFFF" stroke-width="1.2"/>
  <g transform="translate(555, 194)">
    <rect x="0" y="0" width="80" height="24" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.1"/>
    <text x="40" y="16" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">α_t (Audit)</text>
  </g>

  <!-- Subevent 6: Environment Mutation e_t -->
  <line x1="655" y1="135" x2="655" y2="72" stroke="#EA580C" stroke-width="1"/>
  <circle cx="655" cy="135" r="3.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.2"/>
  <g transform="translate(615, 48)">
    <rect x="0" y="0" width="80" height="24" rx="2" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.1"/>
    <text x="40" y="16" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#C2410C">e_t (Effect)</text>
  </g>

  <!-- Vertical binding lines connecting Trajectory to Descriptor Handle -->
  <path d="M 445,215 L 445,238" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#bus-arrow)"/>

  <!-- Bottom Panel: Managed Trajectory Descriptor Struct -->
  <g transform="translate(25, 240)">
    <rect x="0" y="0" width="850" height="96" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
    <rect x="0" y="0" width="850" height="22" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="425" y="15" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A" letter-spacing="0.5">MANAGED TRAJECTORY DESCRIPTOR STRUCT (CROSS-LAYER SYSTEM HANDLE)</text>

    <!-- Field 1: identity + goal -->
    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="112" height="54" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="56" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">identity_t</text>
      <line x1="8" y1="22" x2="104" y2="22" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="56" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">uint64_t uid</text>
      <text x="56" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">sha256(goal_g)</text>
    </g>

    <!-- Field 2: budget + deadline -->
    <g transform="translate(130, 30)">
      <rect x="0" y="0" width="112" height="54" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="56" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">budget_t</text>
      <line x1="8" y1="22" x2="104" y2="22" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="56" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">monotonic token_ctr</text>
      <text x="56" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">t_expire, cost_max</text>
    </g>

    <!-- Field 3: memory handles -->
    <g transform="translate(250, 30)">
      <rect x="0" y="0" width="112" height="54" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.1"/>
      <text x="56" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">mem_handles_t</text>
      <line x1="8" y1="22" x2="104" y2="22" stroke="#E9D5FF" stroke-width="0.8"/>
      <text x="56" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#581C87">*kv_block_table</text>
      <text x="56" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">prefix_radix_root</text>
    </g>

    <!-- Field 4: authority -->
    <g transform="translate(370, 30)">
      <rect x="0" y="0" width="112" height="54" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
      <text x="56" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#B45309">authority_t</text>
      <line x1="8" y1="22" x2="104" y2="22" stroke="#FDE68A" stroke-width="0.8"/>
      <text x="56" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#92400E">cap_tokens[mcp]</text>
      <text x="56" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#B45309">attenuation_mask</text>
    </g>

    <!-- Field 5: effects + recovery -->
    <g transform="translate(490, 30)">
      <rect x="0" y="0" width="112" height="54" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="56" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">recovery_t</text>
      <line x1="8" y1="22" x2="104" y2="22" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="56" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">*wal_journal_log</text>
      <text x="56" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">saga_compensations</text>
    </g>

    <!-- Field 6: trace + evidence -->
    <g transform="translate(610, 30)">
      <rect x="0" y="0" width="112" height="54" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.1"/>
      <text x="56" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">evidence_t</text>
      <line x1="8" y1="22" x2="104" y2="22" stroke="#BBF7D0" stroke-width="0.8"/>
      <text x="56" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#166534">otel_trace_id</text>
      <text x="56" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#15803D">oracle_assertions</text>
    </g>

    <!-- Field 7: placement + cost -->
    <g transform="translate(730, 30)">
      <rect x="0" y="0" width="110" height="54" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">placement_t</text>
      <line x1="8" y1="22" x2="102" y2="22" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="55" y="34" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#334155">gpu_numa_node</text>
      <text x="55" y="46" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">joules, rent_rate</text>
    </g>
  </g>
</svg>
