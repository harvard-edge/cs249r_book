<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- H·S·A EXPOSURE SPACE (Origin at 240, 420). Three axes only.           -->
  <!-- Closure is the runtime's answer to the exposure, not a fourth axis.  -->
  <!-- ===================================================================== -->

  <!-- Authority Axis (Vertical: Y up) -->
  <line x1="240" y1="420" x2="240" y2="54" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="butt"/>
  <polygon points="240,40 245.5,54 234.5,54" fill="#6D28D9"/>
  <text x="240" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#581C87">Authority (A)</text>

  <line x1="235" y1="90" x2="245" y2="90" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="93" text-anchor="end" font-size="7.5" font-weight="600" fill="#991b1b">A<tspan dy="2" font-size="5.5">3</tspan><tspan dx="3" dy="-2">Irreversible external action</tspan></text>

  <line x1="235" y1="180" x2="245" y2="180" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="183" text-anchor="end" font-size="7.5" font-weight="600" fill="#475569">A<tspan dy="2" font-size="5.5">2</tspan><tspan dx="3" dy="-2">Retry-safe or compensable external</tspan></text>

  <line x1="235" y1="270" x2="245" y2="270" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="273" text-anchor="end" font-size="7.5" font-weight="600" fill="#166534">A<tspan dy="2" font-size="5.5">1</tspan><tspan dx="3" dy="-2">Reversible, confined to sandbox</tspan></text>

  <line x1="235" y1="360" x2="245" y2="360" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="363" text-anchor="end" font-size="7.5" font-weight="600" fill="#334155">A<tspan dy="2" font-size="5.5">0</tspan><tspan dx="3" dy="-2">Read access (can still leak)</tspan></text>

  <!-- Horizon Axis (Horizontal: X right) -->
  <line x1="240" y1="420" x2="731" y2="420" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="butt"/>
  <polygon points="745,420 731,425.5 731,414.5" fill="#6D28D9"/>
  <text x="755" y="424" font-size="10" font-weight="700" fill="#581C87">Horizon (H, turns)</text>

  <line x1="310" y1="415" x2="310" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="310" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H = 1</text>

  <line x1="440" y1="415" x2="440" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="440" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H ≈ 10</text>

  <line x1="580" y1="415" x2="580" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="580" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H ≈ 100</text>

  <line x1="710" y1="415" x2="710" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="710" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H ≥ 1,000</text>

  <!-- State Axis (Diagonal: Depth down-left) -->
  <line x1="240" y1="420" x2="91.87" y2="512.58" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="butt"/>
  <polygon points="80,520 94.78,517.24 88.96,507.92" fill="#6D28D9"/>
  <text x="65" y="530" text-anchor="end" font-size="10" font-weight="700" fill="#581C87">State (S)</text>

  <line x1="202" y1="440" x2="208" y2="448" stroke="#1e293b" stroke-width="1.5"/>
  <text x="214" y="456" text-anchor="start" font-size="7.5" font-weight="600" fill="#475569">S<tspan dy="2" font-size="5.5">0</tspan><tspan dx="3" dy="-2">Stateless</tspan></text>

  <line x1="165" y1="463" x2="171" y2="471" stroke="#1e293b" stroke-width="1.5"/>
  <text x="177" y="479" text-anchor="start" font-size="7.5" font-weight="600" fill="#475569">S<tspan dy="2" font-size="5.5">1</tspan><tspan dx="3" dy="-2">Context and KV cache</tspan></text>

  <line x1="128" y1="486" x2="134" y2="494" stroke="#1e293b" stroke-width="1.5"/>
  <text x="140" y="502" text-anchor="start" font-size="7.5" font-weight="600" fill="#475569">S<tspan dy="2" font-size="5.5">2</tspan><tspan dx="3" dy="-2">Sandbox files</tspan></text>

  <line x1="99" y1="504" x2="105" y2="512" stroke="#1e293b" stroke-width="1.5"/>
  <text x="111" y="520" text-anchor="start" font-size="7.5" font-weight="600" fill="#475569">S<tspan dy="2" font-size="5.5">3</tspan><tspan dx="3" dy="-2">Durable, shared</tspan></text>

  <!-- Origin: one model call (H = 1, S0, A0) -->
  <circle cx="240" cy="420" r="5" fill="#0F172A"/>
  <text x="231" y="410" text-anchor="end" font-size="7.5" font-weight="700" fill="#0F172A">one model call</text>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 1: CONVERSATIONAL COPILOT  (H <= 3, S1, A0)                  -->
  <!-- ===================================================================== -->
  <line x1="372" y1="360" x2="372" y2="420" stroke="#92400e" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="372" cy="360" r="7" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="372" cy="360" r="3.5" fill="#92400e"/>

  <g transform="translate(245, 285)">
    <rect width="170" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="170" height="17" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="8" y="12" font-size="7.5" font-weight="700" fill="#1e293b">Conversational Copilot</text>
    <text x="8" y="28" font-size="6.8" font-weight="600" fill="#475569">(H ≤ 3, S<tspan dy="1.5" font-size="5">1</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">0</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="8" y="40" font-size="6.5" fill="#475569">Short horizon • context only • read access</text>
    <text x="8" y="52" font-size="6.5" font-weight="600" fill="#92400e">Closure: a person reviews each answer</text>
  </g>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 2: CLOUD SRE REMEDIATION AGENT  (H ~ 20, S3, A3)             -->
  <!-- ===================================================================== -->
  <line x1="470" y1="90" x2="470" y2="420" stroke="#991b1b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="470" cy="90" r="7.5" fill="none" stroke="#991b1b" stroke-width="1.8"/>
  <circle cx="470" cy="90" r="4" fill="#991b1b"/>

  <g transform="translate(485, 58)">
    <rect width="230" height="64" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
    <rect width="230" height="18" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1.2"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#991b1b">Cloud SRE Remediation Agent</text>
    <text x="10" y="30" font-size="7" font-weight="600" fill="#991b1b">(H ≈ 20, S<tspan dy="1.5" font-size="5">3</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">3</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="10" y="43" font-size="6.8" fill="#475569">Production authority • durable shared state</text>
    <text x="10" y="56" font-size="6.8" font-weight="600" fill="#991b1b">Closure: escrow, human approval, sealed checks</text>
  </g>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 3: SOFTWARE ENGINEERING AGENT  (H ~ 100, S2, A1)             -->
  <!-- ===================================================================== -->
  <line x1="580" y1="270" x2="580" y2="420" stroke="#166534" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="580" cy="270" r="8" fill="none" stroke="#166534" stroke-width="2"/>
  <circle cx="580" cy="270" r="4" fill="#166534"/>

  <line x1="580" y1="262" x2="580" y2="245" stroke="#166534" stroke-width="1.2"/>
  <g transform="translate(482, 175)">
    <rect width="240" height="68" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1.3"/>
    <rect width="240" height="18" rx="2" fill="#f0fdf4" stroke="#166534" stroke-width="1.3"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#166534">Software Engineering Agent</text>
    <text x="10" y="30" font-size="7" font-weight="600" fill="#166534">(H ≈ 100, S<tspan dy="1.5" font-size="5">2</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">1</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="10" y="43" font-size="6.8" fill="#334155">Long horizon • worktree state • sandboxed edits</text>
    <text x="10" y="57" font-size="6.8" font-weight="700" fill="#166534">Closure: step budget, sandbox reset, sealed tests</text>
  </g>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 4: AUTONOMOUS RESEARCH CRAWLER  (H >= 1,000, S3, A0)         -->
  <!-- ===================================================================== -->
  <line x1="710" y1="360" x2="710" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="710" cy="360" r="7" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="710" cy="360" r="3.5" fill="#334155"/>

  <g transform="translate(725, 322)">
    <rect width="220" height="62" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <rect width="220" height="18" rx="2" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#1e293b">Autonomous Research Crawler</text>
    <text x="10" y="29" font-size="7" font-weight="600" fill="#334155">(H ≥ 1,000, S<tspan dy="1.5" font-size="5">3</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">0</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="10" y="42" font-size="6.8" fill="#475569">Unbounded horizon • growing index • read access</text>
    <text x="10" y="55" font-size="6.8" font-weight="600" fill="#334155">Closure: budgets, egress limits, stale-copy rules</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CLOSURE NOTE (Bottom Right): closure is the answer, not an axis       -->
  <!-- ===================================================================== -->
  <g transform="translate(530, 455)">
    <rect width="410" height="65" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="410" height="20" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8" font-weight="700" fill="#1e293b" letter-spacing="0.3">CLOSURE IS NOT A FOURTH AXIS</text>
    <text x="12" y="36" font-size="7.5" font-weight="600" fill="#334155">A task's (H, S, A) position says how exposed it is. Higher exposure demands more closure:</text>
    <text x="12" y="52" font-size="7.5" font-weight="600" fill="#334155">mechanical bounds below the model and a stronger evidence level above it.</text>
  </g>

</svg>
