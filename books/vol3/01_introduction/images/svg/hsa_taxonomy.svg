<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="524" fill="#ffffff"/>
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <g transform="translate(0,48)">
  <!-- ===== Authority levels as bands; A3 tinted as danger ===== -->
  <rect x="190" y="260" width="500" height="80" fill="#f8fafc"/>
  <rect x="190" y="180" width="500" height="80" fill="#f1f5f9"/>
  <rect x="190" y="100" width="500" height="80" fill="#f8fafc"/>
  <rect x="190" y="20" width="500" height="80" fill="#fef2f2"/>
  <line x1="190" y1="260" x2="690" y2="260" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="190" y1="180" x2="690" y2="180" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="190" y1="100" x2="690" y2="100" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="190" y1="20" x2="690" y2="20" stroke="#fecaca" stroke-width="0.8"/>
  <!-- ===== Axes ===== -->
  <path d="M190,340 H710" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <path d="M190,340 V0" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <path d="M190,340 L124,432.4" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <!-- horizon ticks: log scale, 140 px per decade from H = 1 at the origin -->
  <line x1="190" y1="340" x2="190" y2="346" stroke="#334155" stroke-width="1.2"/>
  <text x="190" y="362" text-anchor="middle" font-size="13" fill="#475569">1</text>
  <line x1="330" y1="340" x2="330" y2="346" stroke="#334155" stroke-width="1.2"/>
  <text x="330" y="362" text-anchor="middle" font-size="13" fill="#475569">10</text>
  <line x1="470" y1="340" x2="470" y2="346" stroke="#334155" stroke-width="1.2"/>
  <text x="470" y="362" text-anchor="middle" font-size="13" fill="#475569">100</text>
  <line x1="610" y1="340" x2="610" y2="346" stroke="#334155" stroke-width="1.2"/>
  <text x="610" y="362" text-anchor="middle" font-size="13" fill="#475569">1,000</text>
  <text x="710" y="386" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">Horizon H (turns)</text>
  <text x="190" y="-16" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Authority A</text>
  <text x="180" y="305" text-anchor="end" font-size="14" fill="#334155">A<tspan font-size="12" dy="4">0</tspan><tspan dx="5" dy="-4">read only</tspan></text>
  <text x="180" y="225" text-anchor="end" font-size="14" fill="#334155">A<tspan font-size="12" dy="4">1</tspan><tspan dx="5" dy="-4">workspace</tspan></text>
  <text x="180" y="145" text-anchor="end" font-size="14" fill="#334155">A<tspan font-size="12" dy="4">2</tspan><tspan dx="5" dy="-4">compensable</tspan></text>
  <text x="180" y="65" text-anchor="end" font-size="14" fill="#b91c1c">A<tspan font-size="12" dy="4">3</tspan><tspan dx="5" dy="-4">irreversible</tspan></text>
  <!-- state ticks along the depth axis: 22 px down, 15.7 px left per level -->
  <text x="178" y="345" text-anchor="end" font-size="14" fill="#334155">S<tspan font-size="12" dy="4">0</tspan><tspan dx="5" dy="-4">stateless</tspan></text>
  <line x1="169.3" y1="362" x2="179.3" y2="362" stroke="#334155" stroke-width="1.2"/>
  <text x="162.3" y="367" text-anchor="end" font-size="14" fill="#334155">S<tspan font-size="12" dy="4">1</tspan><tspan dx="5" dy="-4">context</tspan></text>
  <line x1="153.6" y1="384" x2="163.6" y2="384" stroke="#334155" stroke-width="1.2"/>
  <text x="146.6" y="389" text-anchor="end" font-size="14" fill="#334155">S<tspan font-size="12" dy="4">2</tspan><tspan dx="5" dy="-4">working copy</tspan></text>
  <line x1="137.9" y1="406" x2="147.9" y2="406" stroke="#334155" stroke-width="1.2"/>
  <text x="130.9" y="411" text-anchor="end" font-size="14" fill="#334155">S<tspan font-size="12" dy="4">3</tspan><tspan dx="5" dy="-4">durable</tspan></text>
  <text x="134" y="448" font-size="14" font-weight="700" fill="#0f172a">State S</text>
  <!-- origin: one model call (H = 1, S0, A0) -->
  <circle cx="190" cy="340" r="5" fill="#0f172a"/>
  <text x="200" y="331" font-size="13" font-style="italic" fill="#475569">one model call</text>
  <!-- ===== Workloads: marker at (H, A); depth tail of S levels ===== -->
  <!-- Remediation agent (A3) -->
  <line x1="372.1" y1="30" x2="325" y2="96" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="356.4" cy="52" r="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="340.7" cy="74" r="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="325" cy="96" r="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="372.1" cy="30" r="6" fill="#dc2626"/>
  <text x="386.1" y="36" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c">Remediation agent</text>
  <text x="386.1" y="53" text-anchor="start" font-size="13" fill="#475569">H ≈ 20<tspan dx="4">·</tspan><tspan dx="4">S</tspan><tspan font-size="12" dy="4">3</tspan><tspan dx="4" dy="-4">·</tspan><tspan dx="4">A</tspan><tspan font-size="12" dy="4">3</tspan></text>
  <!-- Repair agent (A1) -->
  <line x1="470" y1="212" x2="438.6" y2="256" stroke="#334155" stroke-width="1.2"/>
  <circle cx="454.3" cy="234" r="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <circle cx="438.6" cy="256" r="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <circle cx="470" cy="212" r="6" fill="#334155"/>
  <text x="484" y="213" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Repair agent</text>
  <text x="484" y="230" text-anchor="start" font-size="13" fill="#475569">H ≈ 100<tspan dx="4">·</tspan><tspan dx="4">S</tspan><tspan font-size="12" dy="4">2</tspan><tspan dx="4" dy="-4">·</tspan><tspan dx="4">A</tspan><tspan font-size="12" dy="4">1</tspan></text>
  <!-- Support agent (A0) -->
  <line x1="256.8" y1="272" x2="241.1" y2="294" stroke="#334155" stroke-width="1.2"/>
  <circle cx="241.1" cy="294" r="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <circle cx="256.8" cy="272" r="6" fill="#334155"/>
  <text x="270.8" y="273" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Support agent</text>
  <text x="270.8" y="290" text-anchor="start" font-size="13" fill="#475569">H ≤ 3<tspan dx="4">·</tspan><tspan dx="4">S</tspan><tspan font-size="12" dy="4">1</tspan><tspan dx="4" dy="-4">·</tspan><tspan dx="4">A</tspan><tspan font-size="12" dy="4">0</tspan></text>
  <!-- Research agent (A0) -->
  <line x1="610" y1="268" x2="562.9" y2="334" stroke="#334155" stroke-width="1.2"/>
  <circle cx="594.3" cy="290" r="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <circle cx="578.6" cy="312" r="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <circle cx="562.9" cy="334" r="3" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <circle cx="610" cy="268" r="6" fill="#334155"/>
  <text x="580" y="277" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">Research agent</text>
  <text x="580" y="294" text-anchor="end" font-size="13" fill="#475569">H ≥ 1,000<tspan dx="4">·</tspan><tspan dx="4">S</tspan><tspan font-size="12" dy="4">3</tspan><tspan dx="4" dy="-4">·</tspan><tspan dx="4">A</tspan><tspan font-size="12" dy="4">0</tspan></text>
  </g>
</svg>
