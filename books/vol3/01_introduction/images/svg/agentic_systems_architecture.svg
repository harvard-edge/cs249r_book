<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#ffffff"/>

  <!-- The contract governs runtime decisions, not model-generated permissions. -->
  <rect x="270" y="20" width="140" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Task contract</text>
  <path d="M340,60 V100" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Live loop: context, proposal, authorization, effect, and returned evidence. -->
  <rect x="40" y="100" width="150" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="115" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Agent memory</text>
  <text x="115" y="145" text-anchor="middle" font-size="8.5" fill="#475569">Context and stores</text>

  <rect x="40" y="220" width="150" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="115" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Foundation model</text>
  <text x="115" y="265" text-anchor="middle" font-size="8.5" fill="#475569">Candidate generation</text>
  <path d="M115,160 V220" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="125" y="194" font-size="8.5" fill="#475569">Context</text>

  <rect x="270" y="100" width="140" height="110" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="123" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Agent runtime</text>
  <text x="340" y="145" text-anchor="middle" font-size="8.5" fill="#475569">Limits and permissions</text>
  <text x="340" y="165" text-anchor="middle" font-size="8.5" fill="#475569">Execution record</text>
  <text x="340" y="190" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Acceptance decision</text>
  <path d="M270,130 H190" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="230" y="113" text-anchor="middle" font-size="8" fill="#475569">Selection</text>
  <path d="M190,250 H240 V175 H270" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="215" y="240" text-anchor="middle" font-size="8.5" fill="#475569">Proposal</text>

  <rect x="490" y="100" width="150" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="565" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Tools</text>
  <text x="565" y="145" text-anchor="middle" font-size="8.5" fill="#475569">Bounded execution</text>
  <path d="M410,130 H490" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="450" y="113" text-anchor="middle" font-size="8.5" fill="#475569">Authorized action</text>

  <rect x="490" y="220" width="150" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="565" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Environment</text>
  <text x="565" y="265" text-anchor="middle" font-size="8.5" fill="#475569">Workspace and services</text>
  <path d="M565,160 V220" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="575" y="194" font-size="8.5" fill="#475569">Effects</text>
  <path d="M490,250 H450 V190 H410" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="450" y="274" text-anchor="middle" font-size="8.5" fill="#475569">Observations</text>
  <text x="450" y="289" text-anchor="middle" font-size="8.5" fill="#475569">and evidence</text>

  <!-- Evaluation consumes task records; learning and delegation are optional extensions. -->
  <path d="M340,210 V320 H150 V350" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="255" y="310" text-anchor="middle" font-size="8.5" fill="#475569">Task records</text>
  <path d="M340,320 H565 V350" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="505" y="337" text-anchor="middle" font-size="8.5" fill="#475569">Delegation</text>

  <rect x="80" y="350" width="140" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="150" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Evaluation</text>
  <rect x="270" y="350" width="140" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="340" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Trajectory learning</text>
  <text x="340" y="395" text-anchor="middle" font-size="8.5" fill="#475569">Future model behavior</text>
  <path d="M220,380 H270" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <rect x="490" y="350" width="150" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="565" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Coordination</text>
  <text x="565" y="395" text-anchor="middle" font-size="8.5" fill="#475569">Agents and resources</text>
</svg>
