<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="840" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE EVOLUTION OF SYSTEMS EXECUTION UNITS</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">From nanosecond silicon primitives to multi-hour autonomous stateful trajectories</text>

  <!-- Row 1: Machine Instruction -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="800" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="60" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="85" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">1. Machine Instruction</text>
    <text x="85" y="42" text-anchor="middle" font-size="8" fill="#64748b">Clock: 10⁻⁹ s (1 ns)</text>

    <text x="185" y="26" font-size="8.5" font-weight="600" fill="#334155">Execution Primitives: <tspan font-family="Courier, monospace" font-weight="700" fill="#0f172a">ADD, SUB, LOAD, STORE, JMP</tspan></text>
    <text x="185" y="42" font-size="7.5" fill="#64748b">Hardware ALU &amp; registers • Completely deterministic • Atomic state transition</text>

    <rect x="685" y="17" width="100" height="26" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="735" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Hardware Core</text>
  </g>

  <!-- Row 2: POSIX Process -->
  <g transform="translate(40, 142)">
    <rect x="0" y="0" width="800" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="60" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="85" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">2. OS Process &amp; Thread</text>
    <text x="85" y="42" text-anchor="middle" font-size="8" fill="#64748b">Cadence: 10⁻⁶ s (1 μs)</text>

    <text x="185" y="26" font-size="8.5" font-weight="600" fill="#334155">Kernel Abstractions: <tspan font-family="Courier, monospace" font-weight="700" fill="#0f172a">fork(), exec(), context switch, mmap()</tspan></text>
    <text x="185" y="42" font-size="7.5" fill="#64748b">Operating system kernel &amp; MMU • Hardware page tables • POSIX protection rings</text>

    <rect x="685" y="17" width="100" height="26" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="735" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">OS Kernel</text>
  </g>

  <!-- Row 3: Distributed RPC / HTTP -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="800" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="60" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="85" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">3. Distributed RPC / HTTP</text>
    <text x="85" y="42" text-anchor="middle" font-size="8" fill="#64748b">Latency: 10⁻³ s (1 ms)</text>

    <text x="185" y="26" font-size="8.5" font-weight="600" fill="#334155">Stateless Transactions: <tspan font-family="Courier, monospace" font-weight="700" fill="#0f172a">POST /api/v1/resource {"payload"} -&gt; 200 OK</tspan></text>
    <text x="185" y="42" font-size="7.5" fill="#64748b">Network gateways &amp; REST protocols • Idempotent retries • Stateless client-server</text>

    <rect x="685" y="17" width="100" height="26" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="735" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Network Fabric</text>
  </g>

  <!-- Row 4: Foundation Model Inference Pass -->
  <g transform="translate(40, 278)">
    <rect x="0" y="0" width="800" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="60" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="85" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">4. Model Inference Pass</text>
    <text x="85" y="42" text-anchor="middle" font-size="8" fill="#64748b">Latency: 10⁻¹ s (100 ms)</text>

    <text x="185" y="26" font-size="8.5" font-weight="600" fill="#334155">Stateless Neural Query: <tspan font-family="Courier, monospace" font-weight="700" fill="#0f172a">f_θ(prompt) -&gt; token stream (Oracle)</tspan></text>
    <text x="185" y="42" font-size="7.5" fill="#64748b">GPU GEMM matrix engines • Ephemeral KV cache • Unchanged physical world</text>

    <rect x="685" y="17" width="100" height="26" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="735" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Inference Server</text>
  </g>

  <!-- Row 5: Autonomous Agent Trajectory (FEATURED) -->
  <g transform="translate(40, 346)">
    <rect x="0" y="0" width="800" height="135" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="135" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="85" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">5. Autonomous Trajectory</text>
    <text x="85" y="62" text-anchor="middle" font-size="8" font-weight="600" fill="#7c3aed">Horizon: 10¹ – 10⁴ s (Hours)</text>
    <text x="85" y="80" text-anchor="middle" font-size="7.5" fill="#6d28d9">Stateful Closed Loop</text>

    <text x="185" y="30" font-size="9" font-weight="700" fill="#0f172a">Closed-Loop System: <tspan font-family="Courier, monospace" font-weight="700" fill="#6d28d9">Goal -&gt; [Act -&gt; Observe -&gt; Verify]ᴺ -&gt; Outcome</tspan></text>
    <text x="185" y="55" font-size="8" fill="#334155">• Non-stationary belief state updates (h_{t+1}) and compounding covariate drift</text>
    <text x="185" y="75" font-size="8" fill="#334155">• Side-effect mutations crossing the Reversibility Boundary (Sagas &amp; compensation)</text>
    <text x="185" y="95" font-size="8" fill="#334155">• Managed by Agent Control Block (ACB), tool sandboxes, and verification oracles</text>

    <rect x="685" y="52" width="100" height="28" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="735" y="70" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Agent Runtime</text>
  </g>
</svg>
