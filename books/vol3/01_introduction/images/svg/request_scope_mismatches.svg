<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean Canvas -->
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Top Banner / Title -->
  <text x="440" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="0.2">WHERE REQUESTS LOSE THE TRAJECTORY: SIX SCOPE MISMATCHES</text>
  <text x="440" y="44" text-anchor="middle" font-size="8" font-weight="500" fill="#64748b">Each systems surface is semantically valid only when attached to the entire execution trajectory</text>

  <!-- Row 1: Cost, Memory, Authority -->

  <!-- Card 1: Cost -->
  <g transform="translate(30, 58)">
    <rect x="0" y="0" width="260" height="118" rx="3" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.3"/>
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#1d4ed8">1. Cost Accumulation</text>
    <text x="248" y="17" text-anchor="end" font-size="7.5" font-weight="600" fill="#3b82f6">tokens • $ • joules</text>
    <text x="12" y="42" font-size="7.8" fill="#334155" line-height="1.4">
      <tspan x="12" dy="0">Request infrastructure meters individual calls.</tspan>
      <tspan x="12" dy="14">Agent budgets accumulate monotonically across</tspan>
      <tspan x="12" dy="14">dozens of steps, risking unbounded financial</tspan>
      <tspan x="12" dy="14">and energy waste on degenerative loops</tspan>
      <tspan x="12" dy="14">without global trajectory spending ceilings.</tspan>
    </text>
  </g>

  <!-- Card 2: Memory -->
  <g transform="translate(310, 58)">
    <rect x="0" y="0" width="260" height="118" rx="3" fill="#f8fafc" stroke="#16a34a" stroke-width="1.3"/>
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#15803d">2. Memory Span</text>
    <text x="248" y="17" text-anchor="end" font-size="7.5" font-weight="600" fill="#16a34a">context • KV • artifacts</text>
    <text x="12" y="42" font-size="7.8" fill="#334155" line-height="1.4">
      <tspan x="12" dy="0">Request runtimes reclaim memory upon return.</tspan>
      <tspan x="12" dy="14">Trajectories require KV cache and working</tspan>
      <tspan x="12" dy="14">state persistence across blocking tool waits,</tspan>
      <tspan x="12" dy="14">spanning L1 GPU HBM, L2 host DRAM, and</tspan>
      <tspan x="12" dy="14">L3 persistent episodic secondary storage.</tspan>
    </text>
  </g>

  <!-- Card 3: Authority -->
  <g transform="translate(590, 58)">
    <rect x="0" y="0" width="260" height="118" rx="3" fill="#f8fafc" stroke="#e11d48" stroke-width="1.3"/>
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#be123c">3. Persisting Authority</text>
    <text x="248" y="17" text-anchor="end" font-size="7.5" font-weight="600" fill="#e11d48">tools • credentials • scopes</text>
    <text x="12" y="42" font-size="7.8" fill="#334155" line-height="1.4">
      <tspan x="12" dy="0">Request gateways check ambient credentials.</tspan>
      <tspan x="12" dy="14">Trajectories require dynamic capability scoping,</tspan>
      <tspan x="12" dy="14">time-decay leases, and instant revocation</tspan>
      <tspan x="12" dy="14">to prevent confused-deputy attacks and</tspan>
      <tspan x="12" dy="14">unauthorized privilege escalation over time.</tspan>
    </text>
  </g>

  <!-- Row 2: Recovery, Evidence, Placement -->

  <!-- Card 4: Recovery -->
  <g transform="translate(30, 188)">
    <rect x="0" y="0" width="260" height="118" rx="3" fill="#f8fafc" stroke="#9333ea" stroke-width="1.3"/>
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#faf5ff" stroke="#9333ea" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#7e22ce">4. Semantic Recovery</text>
    <text x="248" y="17" text-anchor="end" font-size="7.5" font-weight="600" fill="#9333ea">sagas • rollback • repair</text>
    <text x="12" y="42" font-size="7.8" fill="#334155" line-height="1.4">
      <tspan x="12" dy="0">Request systems rely on idempotent retry.</tspan>
      <tspan x="12" dy="14">Mutating tool actions produce irreversible</tspan>
      <tspan x="12" dy="14">external side effects; recovery demands backward</tspan>
      <tspan x="12" dy="14">compensating transactions (distributed Sagas)</tspan>
      <tspan x="12" dy="14">rather than blind request re-execution.</tspan>
    </text>
  </g>

  <!-- Card 5: Evidence -->
  <g transform="translate(310, 188)">
    <rect x="0" y="0" width="260" height="118" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#334155">5. Causal Evidence</text>
    <text x="248" y="17" text-anchor="end" font-size="7.5" font-weight="600" fill="#64748b">traces • proof • audit</text>
    <text x="12" y="42" font-size="7.8" fill="#334155" line-height="1.4">
      <tspan x="12" dy="0">Request systems log isolated latency spans.</tspan>
      <tspan x="12" dy="14">Trajectories require end-to-end causal lineage</tspan>
      <tspan x="12" dy="14">connecting delegated user intent to intermediate</tspan>
      <tspan x="12" dy="14">prompts, tool outputs, human approvals,</tspan>
      <tspan x="12" dy="14">and deterministic verification oracles.</tspan>
    </text>
  </g>

  <!-- Card 6: Placement -->
  <g transform="translate(590, 188)">
    <rect x="0" y="0" width="260" height="118" rx="3" fill="#f8fafc" stroke="#d97706" stroke-width="1.3"/>
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#b45309">6. Physical Placement</text>
    <text x="248" y="17" text-anchor="end" font-size="7.5" font-weight="600" fill="#d97706">data gravity • locality • cost</text>
    <text x="12" y="42" font-size="7.8" fill="#334155" line-height="1.4">
      <tspan x="12" dy="0">Request load balancers route to idle servers.</tspan>
      <tspan x="12" dy="14">Trajectories possess state gravity: migrating</tspan>
      <tspan x="12" dy="14">multi-gigabyte KV cache blocks and local</tspan>
      <tspan x="12" dy="14">filesystems across nodes incurs severe PCIe/NIC</tspan>
      <tspan x="12" dy="14">penalties, demanding state-aware co-location.</tspan>
    </text>
  </g>
</svg>
