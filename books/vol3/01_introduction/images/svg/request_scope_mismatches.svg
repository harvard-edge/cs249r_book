<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean Canvas -->
  <rect width="880" height="290" fill="#ffffff" rx="4"/>

  <!-- Row 1: Cost, Memory, Authority -->

  <!-- Card 1: Cost Accumulation (Compute/Budget) -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="268" height="122" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="0" y="0" width="268" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#0369a1">1. Cost Accumulation</text>
    <text x="256" y="17" text-anchor="end" font-size="8.5" font-weight="600" fill="#0284c7">tokens • $ • Joules</text>
    <text x="12" y="42" font-size="8.5" fill="#334155">
      <tspan x="12" dy="0">Request infrastructure meters individual calls.</tspan>
      <tspan x="12" dy="14.5">Agent budgets accumulate monotonically across</tspan>
      <tspan x="12" dy="14.5">dozens of steps, risking unbounded financial</tspan>
      <tspan x="12" dy="14.5">and energy waste on degenerative loops</tspan>
      <tspan x="12" dy="14.5">without global trajectory spending ceilings.</tspan>
    </text>
  </g>

  <!-- Card 2: Memory Span (Context/KV) -->
  <g transform="translate(306, 16)">
    <rect x="0" y="0" width="268" height="122" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
    <rect x="0" y="0" width="268" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#15803d">2. Memory Span</text>
    <text x="256" y="17" text-anchor="end" font-size="8.5" font-weight="600" fill="#16a34a">context • KV • artifacts</text>
    <text x="12" y="42" font-size="8.5" fill="#334155">
      <tspan x="12" dy="0">Request runtimes reclaim memory upon return.</tspan>
      <tspan x="12" dy="14.5">Trajectories require KV cache and working</tspan>
      <tspan x="12" dy="14.5">state persistence across blocking tool waits,</tspan>
      <tspan x="12" dy="14.5">spanning L1 GPU HBM, L2 host DRAM, and</tspan>
      <tspan x="12" dy="14.5">L3 persistent episodic secondary storage.</tspan>
    </text>
  </g>

  <!-- Card 3: Persisting Authority (Actuation/Privilege) -->
  <g transform="translate(592, 16)">
    <rect x="0" y="0" width="268" height="122" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
    <rect x="0" y="0" width="268" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#b45309">3. Persisting Authority</text>
    <text x="256" y="17" text-anchor="end" font-size="8.5" font-weight="600" fill="#d97706">tools • credentials • scopes</text>
    <text x="12" y="42" font-size="8.5" fill="#334155">
      <tspan x="12" dy="0">Request gateways check ambient credentials.</tspan>
      <tspan x="12" dy="14.5">Trajectories require dynamic capability scoping,</tspan>
      <tspan x="12" dy="14.5">time-decay leases, and instant revocation</tspan>
      <tspan x="12" dy="14.5">to prevent confused-deputy attacks and</tspan>
      <tspan x="12" dy="14.5">unauthorized privilege escalation over time.</tspan>
    </text>
  </g>

  <!-- Row 2: Recovery, Evidence, Placement -->

  <!-- Card 4: Semantic Recovery (State/Storage/Sagas) -->
  <g transform="translate(20, 152)">
    <rect x="0" y="0" width="268" height="122" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
    <rect x="0" y="0" width="268" height="26" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#6d28d9">4. Semantic Recovery</text>
    <text x="256" y="17" text-anchor="end" font-size="8.5" font-weight="600" fill="#7c3aed">Sagas • rollback • repair</text>
    <text x="12" y="42" font-size="8.5" fill="#334155">
      <tspan x="12" dy="0">Request systems rely on idempotent retry.</tspan>
      <tspan x="12" dy="14.5">Mutating tool actions produce irreversible</tspan>
      <tspan x="12" dy="14.5">external side effects; recovery demands backward</tspan>
      <tspan x="12" dy="14.5">compensating transactions (distributed Sagas)</tspan>
      <tspan x="12" dy="14.5">rather than blind request re-execution.</tspan>
    </text>
  </g>

  <!-- Card 5: Causal Evidence (Lineage/Audit) -->
  <g transform="translate(306, 152)">
    <rect x="0" y="0" width="268" height="122" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <rect x="0" y="0" width="268" height="26" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#334155">5. Causal Evidence</text>
    <text x="256" y="17" text-anchor="end" font-size="8.5" font-weight="600" fill="#64748b">traces • proof • audit</text>
    <text x="12" y="42" font-size="8.5" fill="#334155">
      <tspan x="12" dy="0">Request systems log isolated latency spans.</tspan>
      <tspan x="12" dy="14.5">Trajectories require end-to-end causal lineage</tspan>
      <tspan x="12" dy="14.5">connecting delegated user intent to intermediate</tspan>
      <tspan x="12" dy="14.5">prompts, tool outputs, human approvals,</tspan>
      <tspan x="12" dy="14.5">and deterministic verification oracles.</tspan>
    </text>
  </g>

  <!-- Card 6: Physical Placement (Hardware/Locality) -->
  <g transform="translate(592, 152)">
    <rect x="0" y="0" width="268" height="122" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="0" y="0" width="268" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#0369a1">6. Physical Placement</text>
    <text x="256" y="17" text-anchor="end" font-size="8.5" font-weight="600" fill="#0284c7">data gravity • locality • cost</text>
    <text x="12" y="42" font-size="8.5" fill="#334155">
      <tspan x="12" dy="0">Request load balancers route to idle servers.</tspan>
      <tspan x="12" dy="14.5">Trajectories possess state gravity: migrating</tspan>
      <tspan x="12" dy="14.5">multi-gigabyte KV cache blocks and local</tspan>
      <tspan x="12" dy="14.5">filesystems across nodes incurs severe PCIe/NIC</tspan>
      <tspan x="12" dy="14.5">penalties, demanding state-aware co-location.</tspan>
    </text>
  </g>
</svg>
