<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="560" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT COLUMN: STATELESS MICROSERVICE PARADIGM                          -->
  <!-- ===================================================================== -->
  <g transform="translate(25, 20)">
    <rect width="365" height="515" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <rect width="365" height="26" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">STATELESS REQUEST CONTAINER</text>
    <text x="353" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#475569">RPC / HTTP / Serverless</text>

    <!-- Substrate Description -->
    <g transform="translate(12, 36)">
      <rect width="341" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7.5" font-weight="700" fill="#334155">Lifecycle: Ephemeral Invocations</text>
      <text x="10" y="26" font-size="7" fill="#64748b">Client Request → Execution Thread → Response → Teardown</text>
    </g>

    <!-- 6 Architectural Dimensions -->
    <!-- 1. Cost -->
    <g transform="translate(12, 78)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Cost &amp; Compute Bounds</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#0f766e">O(1) Constant Bound per Request</text>
      <text x="10" y="42" font-size="7" fill="#475569">Meters individual isolated invocations; fixed millisecond</text>
      <text x="10" y="54" font-size="7" fill="#475569">timeouts prevent unbounded compute allocation.</text>
    </g>

    <!-- 2. Memory -->
    <g transform="translate(12, 149)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Memory Span &amp; Lifetime</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#0f766e">Ephemeral Process Heap &amp; Stack</text>
      <text x="10" y="42" font-size="7" fill="#475569">Stack and heap reclaimed on connection termination;</text>
      <text x="10" y="54" font-size="7" fill="#475569">zero cross-call working memory retention.</text>
    </g>

    <!-- 3. Authority -->
    <g transform="translate(12, 220)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Authority &amp; Privilege Scope</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#0f766e">Short-Lived Ambient Bearer Token</text>
      <text x="10" y="42" font-size="7" fill="#475569">Thread possesses static ambient credentials (OAuth/JWT);</text>
      <text x="10" y="54" font-size="7" fill="#475569">authority evaporates immediately when request terminates.</text>
    </g>

    <!-- 4. Recovery -->
    <g transform="translate(12, 291)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Failure &amp; Semantic Recovery</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#0f766e">Idempotent Network Replay</text>
      <text x="10" y="42" font-size="7" fill="#475569">Transparent retry on HTTP 503 / packet drop; resending</text>
      <text x="10" y="54" font-size="7" fill="#475569">identical payload to alternate replica is safe.</text>
    </g>

    <!-- 5. Evidence -->
    <g transform="translate(12, 362)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Causal Evidence &amp; Verification</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#0f766e">Binary Protocol Status (HTTP 200 / Exit 0)</text>
      <text x="10" y="42" font-size="7" fill="#475569">Header status code 200 or clean exit code 0 directly</text>
      <text x="10" y="54" font-size="7" fill="#475569">certifies operational success to downstream clients.</text>
    </g>

    <!-- 6. Placement -->
    <g transform="translate(12, 433)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Physical Hardware Placement</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#0f766e">Stateless Round-Robin Routing</text>
      <text x="10" y="42" font-size="7" fill="#475569">Arbitrary node dispatch; zero locality penalty since nodes</text>
      <text x="10" y="54" font-size="7" fill="#475569">hold no persistent resident state.</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- CENTER COLUMN: THE 6 STRUCTURAL SCOPE MISMATCHES                      -->
  <!-- ===================================================================== -->
  <g transform="translate(405, 20)">
    <rect width="250" height="515" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="250" height="26" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="125" y="17" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">ARCHITECTURAL MISMATCHES</text>

    <!-- Subtitle indicator -->
    <text x="125" y="54" text-anchor="middle" font-size="7" font-weight="600" fill="#991b1b">FUNDAMENTAL RUNTIME TENSIONS</text>

    <!-- Connector Mismatch 1: Cost -->
    <g transform="translate(10, 78)">
      <rect width="230" height="64" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">COST MISMATCH</text>
      <text x="115" y="30" text-anchor="middle" font-size="6.8" fill="#334155">O(1) Per-Call Ceiling</text>
      <path d="M 115,38 L 52,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <path d="M 115,38 L 178,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <text x="115" y="52" text-anchor="middle" font-size="6.8" font-weight="600" fill="#991b1b">Compounding O(L²) FLOPs</text>
    </g>

    <!-- Connector Mismatch 2: Memory -->
    <g transform="translate(10, 149)">
      <rect width="230" height="64" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">MEMORY MISMATCH</text>
      <text x="115" y="30" text-anchor="middle" font-size="6.8" fill="#334155">Ephemeral Heap Teardown</text>
      <path d="M 115,38 L 52,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <path d="M 115,38 L 178,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <text x="115" y="52" text-anchor="middle" font-size="6.8" font-weight="600" fill="#991b1b">Tiered Cross-Turn KV Cache</text>
    </g>

    <!-- Connector Mismatch 3: Authority -->
    <g transform="translate(10, 220)">
      <rect width="230" height="64" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">AUTHORITY MISMATCH</text>
      <text x="115" y="30" text-anchor="middle" font-size="6.8" fill="#334155">Static Ambient Credentials</text>
      <path d="M 115,38 L 52,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <path d="M 115,38 L 178,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <text x="115" y="52" text-anchor="middle" font-size="6.8" font-weight="600" fill="#991b1b">Zero Ambient (A = 0) Leases</text>
    </g>

    <!-- Connector Mismatch 4: Recovery -->
    <g transform="translate(10, 291)">
      <rect width="230" height="64" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">RECOVERY MISMATCH</text>
      <text x="115" y="30" text-anchor="middle" font-size="6.8" fill="#334155">Blind Idempotent Retry</text>
      <path d="M 115,38 L 52,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <path d="M 115,38 L 178,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <text x="115" y="52" text-anchor="middle" font-size="6.8" font-weight="600" fill="#991b1b">Saga Rollback &amp; Pruning</text>
    </g>

    <!-- Connector Mismatch 5: Evidence -->
    <g transform="translate(10, 362)">
      <rect width="230" height="64" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">EVIDENCE MISMATCH</text>
      <text x="115" y="30" text-anchor="middle" font-size="6.8" fill="#334155">Shallow POSIX Exit Code 0</text>
      <path d="M 115,38 L 52,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <path d="M 115,38 L 178,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <text x="115" y="52" text-anchor="middle" font-size="6.8" font-weight="600" fill="#991b1b">Out-of-Band Sealed Oracle</text>
    </g>

    <!-- Connector Mismatch 6: Placement -->
    <g transform="translate(10, 433)">
      <rect width="230" height="64" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">PLACEMENT MISMATCH</text>
      <text x="115" y="30" text-anchor="middle" font-size="6.8" fill="#334155">Stateless Round-Robin</text>
      <path d="M 115,38 L 52,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <path d="M 115,38 L 178,38" stroke="#991b1b" stroke-width="1.2" marker-end="url(#arr-burgundy)"/>
      <text x="115" y="52" text-anchor="middle" font-size="6.8" font-weight="600" fill="#991b1b">KV Cache &amp; FS Affinity</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT COLUMN: STATEFUL AGENT TRAJECTORY RUNTIME                       -->
  <!-- ===================================================================== -->
  <g transform="translate(670, 20)">
    <rect width="365" height="515" rx="3" fill="#f8fafc" stroke="#166534" stroke-width="1.5"/>
    <rect width="365" height="26" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#166534" letter-spacing="0.3">STATEFUL AGENT TRAJECTORY RUNTIME</text>
    <text x="353" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#166534">Software 3.0 Engine</text>

    <!-- Substrate Description -->
    <g transform="translate(12, 36)">
      <rect width="341" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7.5" font-weight="700" fill="#166534">Lifecycle: Multi-Turn Trajectory (t = 0 ... N)</text>
      <text x="10" y="26" font-size="7" fill="#475569">Context Assembly → Model Decode → Authorization → Sandbox → Oracle</text>
    </g>

    <!-- 6 Architectural Dimensions -->
    <!-- 1. Cost -->
    <g transform="translate(12, 78)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Cost &amp; Compute Bounds</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#166534">Superlinear Compounding FLOPs (Σ<tspan dy="2" font-size="5">i</tspan><tspan dy="-2"> |c</tspan><tspan dy="2" font-size="5">i</tspan><tspan dy="-2">|)</tspan></text>
      <text x="10" y="42" font-size="7" fill="#475569">Context window grows monotonically; prompt prefill FLOPs scale</text>
      <text x="10" y="54" font-size="7" fill="#475569">superlinearly; requires global trajectory-level spending caps.</text>
    </g>

    <!-- 2. Memory -->
    <g transform="translate(12, 149)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Memory Span &amp; Lifetime</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#166534">Tiered Multi-Level Memory Hierarchy</text>
      <text x="10" y="42" font-size="7" fill="#475569">Retains active KV cache in HBM, staged context in host DRAM,</text>
      <text x="10" y="54" font-size="7" fill="#475569">and writes execution journal to local NVMe write-ahead log.</text>
    </g>

    <!-- 3. Authority -->
    <g transform="translate(12, 220)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Authority &amp; Privilege Scope</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#166534">Zero Ambient Authority (A = 0) &amp; Leases</text>
      <text x="10" y="42" font-size="7" fill="#475569">Neural core possesses zero ambient power; runtime grants</text>
      <text x="10" y="54" font-size="7" fill="#475569">ephemeral time-decay leases with monotonic attenuation.</text>
    </g>

    <!-- 4. Recovery -->
    <g transform="translate(12, 291)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Failure &amp; Semantic Recovery</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#166534">Compensating Sagas &amp; Context Pruning</text>
      <text x="10" y="42" font-size="7" fill="#475569">Blind retry causes context poisoning; runtime must execute</text>
      <text x="10" y="54" font-size="7" fill="#475569">semantic rollback and prune hallucinatory loops.</text>
    </g>

    <!-- 5. Evidence -->
    <g transform="translate(12, 362)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Causal Evidence &amp; Verification</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#166534">Out-of-Band Sealed Verification (v<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2">)</tspan></text>
      <text x="10" y="42" font-size="7" fill="#475569">Zero evidential weight given to model self-report; runtime runs</text>
      <text x="10" y="54" font-size="7" fill="#475569">sealed invariant tests to verify state mutation (s<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2"> ∈ I).</tspan></text>
    </g>

    <!-- 6. Placement -->
    <g transform="translate(12, 433)">
      <rect width="341" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#1e293b">Physical Hardware Placement</text>
      <text x="10" y="28" font-size="7" font-weight="600" fill="#166534">Strict KV-Cache &amp; Sandbox Affinity</text>
      <text x="10" y="42" font-size="7" fill="#475569">Multi-gigabyte KV cache and sandbox filesystem mutations</text>
      <text x="10" y="54" font-size="7" fill="#475569">mandate pinning trajectory execution to local GPU/host nodes.</text>
    </g>
  </g>

</svg>
