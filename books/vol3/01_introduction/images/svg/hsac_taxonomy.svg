<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="530" fill="#ffffff"/>
  <g transform="translate(0, -40)">



  <!-- 3D Axes System (Origin at 240, 430) -->

  <!-- Authority Axis (Vertical: Y up) -->
  <line x1="240" y1="430" x2="240" y2="90" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-axis)"/>
  <text x="240" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Authority Level (A)</text>
  <text x="225" y="125" text-anchor="end" font-size="8" fill="#64748b">Irreversible Physical / Prod</text>
  <text x="225" y="215" text-anchor="end" font-size="8" fill="#64748b">Reversible Database / API</text>
  <text x="225" y="305" text-anchor="end" font-size="8" fill="#64748b">Ephemeral Sandbox (MCP)</text>
  <text x="225" y="395" text-anchor="end" font-size="8" fill="#64748b">Read-Only Advisory</text>

  <!-- Horizon Axis (Horizontal: X right) -->
  <line x1="240" y1="430" x2="680" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-axis)"/>
  <text x="695" y="434" font-size="10" font-weight="700" fill="#0f172a">Horizon (H)</text>
  <text x="310" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 1–5</text>
  <text x="430" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 10–50</text>
  <text x="550" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 100–500</text>
  <text x="650" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 1,000+ steps</text>

  <!-- State Complexity Axis (Diagonal: Depth down-left) -->
  <line x1="240" y1="430" x2="90" y2="525" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-axis)"/>
  <text x="80" y="540" font-size="10" font-weight="700" fill="#0f172a">State (S)</text>
  <text x="145" y="510" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">Distributed</text>
  <text x="190" y="470" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">External</text>

  <!-- Workload Cluster 1: Conversational Assistant -->
  <g transform="translate(280, 370)">
    <circle cx="0" cy="22" r="5" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="15" y="0" width="170" height="44" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="25" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Conversational Copilot</text>
    <text x="25" y="32" font-size="7.5" fill="#64748b">Short H (1–3), Minimal A, In-Context S</text>
  </g>

  <!-- Workload Cluster 2: Cloud SRE Operator -->
  <g transform="translate(340, 110)">
    <line x1="0" y1="24" x2="0" y2="320" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="24" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="15" y="0" width="195" height="52" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="15" y="0" width="195" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="23" y="13" font-size="8" font-weight="700" fill="#991b1b">Cloud SRE Remediation Agent</text>
    <text x="23" y="32" font-size="7.5" font-weight="600" fill="#dc2626">Critical Authority (Prod Mutation)</text>
    <text x="23" y="44" font-size="7.5" fill="#64748b">Moderate Horizon (H ≈ 10–30), Distributed S</text>
  </g>

  <!-- Workload Cluster 3: Autonomous Coding Agent (SWE-bench) -->
  <g transform="translate(560, 205)">
    <line x1="0" y1="85" x2="0" y2="225" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="0" cy="85" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <g transform="translate(-40, 0)">
      <rect x="0" y="0" width="225" height="68" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="12" y="14" font-size="8.5" font-weight="700" fill="#6d28d9">Autonomous Coding Agent</text>
      <text x="12" y="34" font-size="8" fill="#334155">High Horizon (H = 50–250 steps)</text>
      <text x="12" y="46" font-size="8" fill="#334155">Sandbox Authority • External Filesystem S</text>
      <text x="12" y="58" font-size="7.5" font-weight="700" fill="#15803d">High Verifiable Closure (Test Suite Oracle)</text>
    </g>
  </g>

  <!-- Workload Cluster 4: Deep Research Web Crawler -->
  <g transform="translate(660, 340)">
    <line x1="0" y1="55" x2="0" y2="90" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="55" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="210" height="46" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">Autonomous Research Crawler</text>
      <text x="10" y="29" font-size="7.5" fill="#334155">Massive Horizon (H = 500–2,000+)</text>
      <text x="10" y="40" font-size="7.5" fill="#64748b">Read-Only Authority • Large External S</text>
    </g>
  </g>

  <!-- Dimension 4: Closure Legend Box (Bottom Right) -->
  <g transform="translate(520, 475)">
    <rect x="0" y="0" width="320" height="70" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="320" height="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">4TH DIMENSION: INVARIANT CLOSURE (C)</text>

    <circle cx="20" cy="34" r="4" fill="#16a34a"/>
    <text x="32" y="37" font-size="7.5" font-weight="600" fill="#15803d">Closed Verification: Deterministic oracle, reproducible test or proof</text>

    <circle cx="20" cy="52" r="4" fill="#d97706"/>
    <text x="32" y="55" font-size="7.5" font-weight="600" fill="#b45309">Open Verification: Subjective heuristic, human feedback, fail-plausible risk</text>
  </g>
</g>
</svg>