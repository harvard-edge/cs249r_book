<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="taxShadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="430" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">The H-S-A-C Systems Taxonomy</text>
  <text x="430" y="46" text-anchor="middle" font-size="9" fill="#64748B">A four-dimensional coordinate space classifying autonomous agent architectures and risk envelopes</text>

  <!-- 3D Axes System -->
  <!-- Origin at (240, 420) -->

  <!-- Authority Axis (Vertical: Y up) -->
  <line x1="240" y1="420" x2="240" y2="90" stroke="#334155" stroke-width="2.5" marker-end="url(#axisArrow)"/>
  <text x="240" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#1E293B">Authority Level (A)</text>
  <text x="225" y="125" text-anchor="end" font-size="8" fill="#64748B">Irreversible Physical / Prod</text>
  <text x="225" y="215" text-anchor="end" font-size="8" fill="#64748B">Reversible Database / API</text>
  <text x="225" y="305" text-anchor="end" font-size="8" fill="#64748B">Ephemeral Sandbox (MCP)</text>
  <text x="225" y="395" text-anchor="end" font-size="8" fill="#64748B">Read-Only Advisory</text>

  <!-- Horizon Axis (Horizontal: X right) -->
  <line x1="240" y1="420" x2="680" y2="420" stroke="#334155" stroke-width="2.5" marker-end="url(#axisArrow)"/>
  <text x="700" y="424" font-size="11" font-weight="700" fill="#1E293B">Horizon (H)</text>
  <text x="310" y="438" text-anchor="middle" font-size="8" fill="#64748B">H = 1–5</text>
  <text x="430" y="438" text-anchor="middle" font-size="8" fill="#64748B">H = 10–50</text>
  <text x="550" y="438" text-anchor="middle" font-size="8" fill="#64748B">H = 100–500</text>
  <text x="650" y="438" text-anchor="middle" font-size="8" fill="#64748B">H = 1,000+ steps</text>

  <!-- State Complexity Axis (Diagonal: Depth down-left) -->
  <line x1="240" y1="420" x2="90" y2="520" stroke="#334155" stroke-width="2.5" marker-end="url(#axisArrow)"/>
  <text x="80" y="535" font-size="11" font-weight="700" fill="#1E293B">State (S)</text>
  <text x="145" y="505" text-anchor="end" font-size="8.5" font-weight="600" fill="#64748B">Distributed</text>
  <text x="190" y="465" text-anchor="end" font-size="8.5" font-weight="600" fill="#64748B">External</text>

  <!-- Workload Cluster 1: Conversational Assistant -->
  <g filter="url(#taxShadow)">
    <circle cx="280" cy="380" r="7" fill="#64748B"/>
    <rect x="295" y="360" width="165" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="305" y="376" font-size="9" font-weight="700" fill="#1E293B">Conversational Copilot</text>
    <text x="305" y="392" font-size="7.5" fill="#64748B">Short H (1–3), Minimal A, In-Context S</text>
  </g>

  <!-- Workload Cluster 2: Cloud SRE Operator -->
  <g filter="url(#taxShadow)">
    <circle cx="340" cy="140" r="8" fill="#EF4444"/>
    <line x1="340" y1="140" x2="340" y2="420" stroke="#EF4444" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="355" y="120" width="180" height="46" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
    <text x="365" y="137" font-size="9.5" font-weight="700" fill="#991B1B">Cloud SRE Remediation Agent</text>
    <text x="365" y="150" font-size="8" fill="#7F1D1D">Critical Authority (Prod Cluster Mutation)</text>
    <text x="365" y="160" font-size="7.5" fill="#DC2626">Moderate Horizon (H ≈ 10–30), Distributed S</text>
  </g>

  <!-- Workload Cluster 3: Autonomous Coding Agent (SWE-bench) -->
  <g filter="url(#taxShadow)">
    <circle cx="560" cy="280" r="9" fill="#581C87"/>
    <line x1="560" y1="280" x2="560" y2="420" stroke="#581C87" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="520" y="200" width="220" height="64" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.6"/>
    <text x="630" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#3B0764">Autonomous Coding Agent</text>
    <text x="630" y="235" text-anchor="middle" font-size="8" fill="#581C87">High Horizon (H = 50–250 steps)</text>
    <text x="630" y="247" text-anchor="middle" font-size="8" fill="#581C87">Sandbox Authority • External Filesystem S</text>
    <text x="630" y="258" text-anchor="middle" font-size="7.5" font-weight="600" fill="#7E22CE">High Verifiable Closure (Test Suite Oracle)</text>
  </g>

  <!-- Workload Cluster 4: Deep Research Web Crawler -->
  <g filter="url(#taxShadow)">
    <circle cx="660" cy="380" r="8" fill="#2563EB"/>
    <line x1="660" y1="380" x2="660" y2="420" stroke="#2563EB" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="580" y="330" width="200" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="680" y="348" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">Autonomous Research Crawler</text>
    <text x="680" y="362" text-anchor="middle" font-size="8" fill="#1E3A8A">Massive Horizon (H = 500–2,000+)</text>
    <text x="680" y="371" text-anchor="middle" font-size="7.5" fill="#4B5563">Read-Only Authority • Large External S</text>
  </g>

  <!-- Dimension 4: Closure Legend Box (Bottom Right) -->
  <g filter="url(#taxShadow)">
    <rect x="520" y="470" width="310" height="75" rx="2" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="535" y="488" font-size="9.5" font-weight="700" fill="#1E293B">4th Dimension: Invariant Closure (C)</text>
    <circle cx="545" cy="505" r="5" fill="#059669"/>
    <text x="558" y="509" font-size="8" font-weight="600" fill="#065F46">Closed Verification: Deterministic oracle, reproducible test or proof</text>
    <circle cx="545" cy="525" r="5" fill="#D97706"/>
    <text x="558" y="529" font-size="8" font-weight="600" fill="#92400E">Open Verification: Subjective heuristic, human feedback, fail-plausible risk</text>
  </g>
</svg>
