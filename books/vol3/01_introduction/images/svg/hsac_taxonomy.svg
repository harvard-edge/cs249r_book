<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- 3D COORDINATE SYSTEM (Origin at 240, 420)                             -->
  <!-- ===================================================================== -->

  <!-- Authority Axis (Vertical: Y up) -->
  <line x1="240" y1="420" x2="240" y2="45" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-axis)"/>
  <text x="240" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Authority Level (A)</text>
  
  <line x1="235" y1="90" x2="245" y2="90" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="93" text-anchor="end" font-size="7.5" font-weight="600" fill="#991b1b">Level 3: Irreversible Mutation (Prod)</text>
  
  <line x1="235" y1="180" x2="245" y2="180" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="183" text-anchor="end" font-size="7.5" font-weight="600" fill="#475569">Level 2: Idempotent External Action</text>
  
  <line x1="235" y1="270" x2="245" y2="270" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="273" text-anchor="end" font-size="7.5" font-weight="600" fill="#166534">Level 1: Sandboxed Reversible (microVM)</text>
  
  <line x1="235" y1="360" x2="245" y2="360" stroke="#1e293b" stroke-width="1.2"/>
  <text x="228" y="363" text-anchor="end" font-size="7.5" font-weight="600" fill="#334155">Level 0: Read-Only Passive (A = 0)</text>

  <!-- Horizon Axis (Horizontal: X right) -->
  <line x1="240" y1="420" x2="740" y2="420" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-axis)"/>
  <text x="755" y="424" font-size="10" font-weight="700" fill="#1e293b">Horizon (H: Steps / Duration)</text>
  
  <line x1="310" y1="415" x2="310" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="310" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H ≤ 5</text>
  
  <line x1="440" y1="415" x2="440" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="440" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H = 10–50</text>
  
  <line x1="580" y1="415" x2="580" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="580" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H = 50–250</text>
  
  <line x1="710" y1="415" x2="710" y2="425" stroke="#1e293b" stroke-width="1.2"/>
  <text x="710" y="438" text-anchor="middle" font-size="7.5" fill="#475569">H ≥ 1,000</text>

  <!-- State Complexity Axis (Diagonal: Depth down-left) -->
  <line x1="240" y1="420" x2="80" y2="520" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-axis)"/>
  <text x="65" y="530" text-anchor="end" font-size="10" font-weight="700" fill="#1e293b">State (S)</text>

  <line x1="187" y1="453" x2="193" y2="461" stroke="#1e293b" stroke-width="1.5"/>
  <text x="180" y="468" text-anchor="end" font-size="7.5" font-weight="600" fill="#475569">S<tspan dy="2" font-size="5.5">repo</tspan><tspan dy="-2"> (Local Worktree)</tspan></text>

  <line x1="133" y1="487" x2="139" y2="495" stroke="#1e293b" stroke-width="1.5"/>
  <text x="125" y="502" text-anchor="end" font-size="7.5" font-weight="600" fill="#475569">S<tspan dy="2" font-size="5.5">dist</tspan><tspan dy="-2"> (Distributed / DB)</tspan></text>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 1: CONVERSATIONAL COPILOT                                    -->
  <!-- Coordinates: H <= 3, A = 0, S_ctx, C = Open                           -->
  <!-- Position: x = 310, y = 360                                            -->
  <!-- ===================================================================== -->
  <!-- Projection line down to H axis -->
  <line x1="310" y1="360" x2="310" y2="420" stroke="#92400e" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Point Symbol: Open Closure (dashed outer ring + amber center) -->
  <circle cx="310" cy="360" r="7" fill="none" stroke="#92400e" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="310" cy="360" r="3.5" fill="#92400e"/>
  
  <!-- Card placed above and slightly left: x = 245 to 415 -->
  <g transform="translate(245, 285)">
    <rect width="170" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="170" height="17" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="8" y="12" font-size="7.5" font-weight="700" fill="#1e293b">Conversational Copilot</text>
    <text x="8" y="28" font-size="6.8" font-weight="600" fill="#475569">Coords: (H ≤ 3, S<tspan dy="1.5" font-size="5">ctx</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">0</tspan><tspan dy="-1.5">, C</tspan><tspan dy="1.5" font-size="5">open</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="8" y="40" font-size="6.5" fill="#475569">Short Horizon • Read-Only (A=0)</text>
    <text x="8" y="52" font-size="6.5" font-weight="600" fill="#92400e">C: Open (Inline Human Supervision)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 2: CLOUD SRE REMEDIATION AGENT                               -->
  <!-- Coordinates: H ~ 20, A = 3, S_dist, C = Hybrid                        -->
  <!-- Position: x = 440, y = 90                                             -->
  <!-- ===================================================================== -->
  <!-- Vertical Projection Line to ground -->
  <line x1="440" y1="90" x2="440" y2="420" stroke="#991b1b" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Point Symbol: Level 3 Prod Mutation -->
  <circle cx="440" cy="90" r="7.5" fill="none" stroke="#991b1b" stroke-width="1.8"/>
  <circle cx="440" cy="90" r="4" fill="#991b1b"/>
  
  <!-- Card placed to the right of point: x = 455 to 665 -->
  <g transform="translate(455, 60)">
    <rect width="210" height="62" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
    <rect width="210" height="18" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1.2"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#991b1b">Cloud SRE Remediation Agent</text>
    <text x="10" y="30" font-size="7" font-weight="600" fill="#991b1b">Coords: (H ≈ 20, S<tspan dy="1.5" font-size="5">dist</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">3</tspan><tspan dy="-1.5">, C</tspan><tspan dy="1.5" font-size="5">hybrid</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="10" y="42" font-size="6.8" fill="#475569">Irreversible Prod Authority (A=3) • Distributed S</text>
    <text x="10" y="54" font-size="6.8" font-weight="600" fill="#92400e">C: Hybrid (Telemetry Oracles vs Blast Risk)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 3: AUTONOMOUS SOFTWARE ENGINEERING AGENT                    -->
  <!-- Coordinates: H = 50-250, A = 1, S_repo, C = Closed                    -->
  <!-- Position: x = 580, y = 270                                            -->
  <!-- ===================================================================== -->
  <!-- Vertical Projection Line to ground -->
  <line x1="580" y1="270" x2="580" y2="420" stroke="#166534" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Point Symbol: Closed Invariant (double green concentric ring) -->
  <circle cx="580" cy="270" r="8" fill="none" stroke="#166534" stroke-width="2"/>
  <circle cx="580" cy="270" r="4" fill="#166534"/>
  
  <!-- Card placed above point: x = 490 to 715, y = 180 to 244 -->
  <line x1="580" y1="262" x2="580" y2="245" stroke="#166534" stroke-width="1.2"/>
  <g transform="translate(485, 175)">
    <rect width="225" height="66" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1.3"/>
    <rect width="225" height="18" rx="2" fill="#f0fdf4" stroke="#166534" stroke-width="1.3"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#166534">Software Engineering Agent</text>
    <text x="10" y="30" font-size="7" font-weight="600" fill="#166534">Coords: (H = 50–250, S<tspan dy="1.5" font-size="5">repo</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">1</tspan><tspan dy="-1.5">, C</tspan><tspan dy="1.5" font-size="5">closed</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="10" y="43" font-size="6.8" fill="#334155">Deep Horizon • Sandbox Isolation (A=1) • Worktree S</text>
    <text x="10" y="57" font-size="6.8" font-weight="700" fill="#166534">C: Closed (Unit Tests, AST Linters, Compilers)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- WORKLOAD 4: AUTONOMOUS RESEARCH CRAWLER                               -->
  <!-- Coordinates: H >= 1,000, A = 0, S_web, C = Open                       -->
  <!-- Position: x = 710, y = 360                                            -->
  <!-- ===================================================================== -->
  <!-- Vertical Projection Line to ground -->
  <line x1="710" y1="360" x2="710" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Point Symbol: Open Closure -->
  <circle cx="710" cy="360" r="7" fill="none" stroke="#92400e" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="710" cy="360" r="3.5" fill="#334155"/>
  
  <!-- Card placed to the right: x = 725 to 945 -->
  <g transform="translate(725, 325)">
    <rect width="215" height="58" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <rect width="215" height="18" rx="2" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#1e293b">Autonomous Research Crawler</text>
    <text x="10" y="29" font-size="7" font-weight="600" fill="#334155">Coords: (H ≥ 1,000, S<tspan dy="1.5" font-size="5">web</tspan><tspan dy="-1.5">, A</tspan><tspan dy="1.5" font-size="5">0</tspan><tspan dy="-1.5">, C</tspan><tspan dy="1.5" font-size="5">open</tspan><tspan dy="-1.5">)</tspan></text>
    <text x="10" y="41" font-size="6.8" fill="#475569">Massive Horizon • Read-Only (A=0) • Web State</text>
    <text x="10" y="52" font-size="6.8" font-weight="600" fill="#92400e">C: Open (Heuristic Relevance, High Drift Risk)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- 4TH DIMENSION LEGEND BOX (Bottom Right)                               -->
  <!-- ===================================================================== -->
  <g transform="translate(530, 455)">
    <rect width="410" height="65" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="410" height="20" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8" font-weight="700" fill="#1e293b" letter-spacing="0.3">4TH DIMENSION: INVARIANT CLOSURE (C)</text>

    <!-- Closed definition -->
    <circle cx="22" cy="34" r="6" fill="none" stroke="#166534" stroke-width="1.8"/>
    <circle cx="22" cy="34" r="3" fill="#166534"/>
    <text x="35" y="37" font-size="7.5" font-weight="600" fill="#166534">Closed (C<tspan dy="2" font-size="5.5">closed</tspan><tspan dy="-2">): Deterministic oracle (tests/linter) resets p</tspan><tspan dy="-3" font-size="5.5">N</tspan><tspan dy="3">&#160;error decay</tspan></text>

    <!-- Open definition -->
    <circle cx="22" cy="51" r="6" fill="none" stroke="#92400e" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="22" cy="51" r="3" fill="#92400e"/>
    <text x="35" y="54" font-size="7.5" font-weight="600" fill="#92400e">Open (C<tspan dy="2" font-size="5.5">open</tspan><tspan dy="-2">): Heuristic feedback; errors compound under P</tspan><tspan dy="2" font-size="5.5">success</tspan><tspan dy="-2">&#160;≤ p</tspan><tspan dy="-3" font-size="5.5">N</tspan></text>
  </g>

</svg>