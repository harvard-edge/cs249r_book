<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="530" fill="#ffffff"/>
  <g transform="translate(0, -40)">

  <!-- 3D Axes System (Origin at 240, 430) -->

  <!-- Authority Axis (Vertical: Y up) -->
  <line x1="240" y1="430" x2="240" y2="90" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-axis)"/>
  <text x="240" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Authority Level (A)</text>
  <text x="225" y="125" text-anchor="end" font-size="8" fill="#64748b">Irreversible Physical / Prod</text>
  <text x="225" y="215" text-anchor="end" font-size="8" fill="#64748b">Reversible Database / API</text>
  <text x="225" y="305" text-anchor="end" font-size="8" fill="#64748b">Ephemeral Sandbox (MCP)</text>
  <text x="225" y="395" text-anchor="end" font-size="8" fill="#64748b">Read-Only Advisory</text>

  <!-- Horizon Axis (Horizontal: X right) -->
  <line x1="240" y1="430" x2="680" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-axis)"/>
  <text x="695" y="434" font-size="10" font-weight="700" fill="#0f172a">Horizon (H)</text>
  <text x="310" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 1–5</text>
  <text x="430" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 10–50</text>
  <text x="550" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 100–500</text>
  <text x="650" y="448" text-anchor="middle" font-size="8" fill="#64748b">H = 1,000+ steps</text>

  <!-- State Complexity Axis (Diagonal: Depth down-left) -->
  <line x1="240" y1="430" x2="90" y2="525" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-axis)"/>
  <text x="80" y="540" font-size="10" font-weight="700" fill="#0f172a">State (S)</text>
  <text x="145" y="510" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">Distributed</text>
  <text x="190" y="470" text-anchor="end" font-size="8" font-weight="600" fill="#64748b">External</text>

  <!-- Workload Cluster 1: Conversational Copilot -->
  <g transform="translate(280, 362)">
    <circle cx="0" cy="22" r="7" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="0" cy="22" r="4.5" fill="#64748b" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="15" y="0" width="185" height="52" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Conversational Copilot</text>
    <text x="24" y="26" font-size="7.5" font-weight="600" fill="#475569">Coords: (H ≤ 3, S_ctx, A_0, C_open)</text>
    <text x="24" y="37" font-size="7" fill="#64748b">Short Horizon • Read-Only • In-Context S</text>
    <text x="24" y="47" font-size="7" font-weight="700" fill="#b45309">C: Open (Inline Human Supervision)</text>
  </g>

  <!-- Workload Cluster 2: Cloud SRE Remediation Agent -->
  <g transform="translate(340, 105)">
    <line x1="0" y1="24" x2="0" y2="325" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="24" r="7" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="0" cy="24" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="15" y="0" width="205" height="58" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="15" y="0" width="205" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="23" y="13" font-size="8" font-weight="700" fill="#991b1b">Cloud SRE Remediation Agent</text>
    <text x="23" y="30" font-size="7.5" font-weight="600" fill="#991b1b">Coords: (H ≈ 20, S_dist, A_3, C_hybrid)</text>
    <text x="23" y="42" font-size="7" font-weight="600" fill="#dc2626">Critical Authority (Prod Mutation) • Distributed S</text>
    <text x="23" y="53" font-size="7" font-weight="700" fill="#b45309">C: Hybrid (Telemetry Oracles vs Root-Cause Risk)</text>
  </g>

  <!-- Workload Cluster 3: Autonomous Coding Agent (SWE-bench) -->
  <g transform="translate(560, 195)">
    <line x1="0" y1="85" x2="0" y2="235" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="0" cy="85" r="7.5" fill="none" stroke="#16a34a" stroke-width="2"/>
    <circle cx="0" cy="85" r="4.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
    <g transform="translate(-40, 0)">
      <rect x="0" y="0" width="235" height="74" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="12" y="13" font-size="8.5" font-weight="700" fill="#6d28d9">Autonomous Coding Agent (SWE-bench)</text>
      <text x="12" y="31" font-size="7.5" font-weight="600" fill="#6d28d9">Coords: (H = 50–250, S_repo, A_1, C_closed)</text>
      <text x="12" y="44" font-size="7.5" fill="#334155">High Horizon • Sandbox Authority • Local Repo S</text>
      <text x="12" y="56" font-size="7.5" font-weight="700" fill="#15803d">C: Closed (Unit Tests, Compilers, AST Linters)</text>
      <text x="12" y="67" font-size="6.8" fill="#166534">Enables saw-tooth error resets to beat p^N decay</text>
    </g>
  </g>

  <!-- Workload Cluster 4: Deep Research Web Crawler -->
  <g transform="translate(660, 335)">
    <line x1="0" y1="55" x2="0" y2="95" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="55" r="7" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="0" cy="55" r="4.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="215" height="54" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0369a1">Autonomous Research Crawler</text>
      <text x="10" y="27" font-size="7.5" font-weight="600" fill="#0369a1">Coords: (H = 500–2,000+, S_web, A_0, C_open)</text>
      <text x="10" y="38" font-size="7" fill="#334155">Massive Horizon • Read-Only Authority • Web S</text>
      <text x="10" y="49" font-size="7" font-weight="700" fill="#b45309">C: Open (Heuristic Relevance, High Drift Risk)</text>
    </g>
  </g>

  <!-- Dimension 4: Closure Legend Box (Bottom Right) -->
  <g transform="translate(510, 465)">
    <rect x="0" y="0" width="345" height="74" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="14" font-size="8.5" font-weight="700" fill="#0f172a">4TH DIMENSION: INVARIANT CLOSURE (C)</text>

    <circle cx="20" cy="35" r="5" fill="none" stroke="#16a34a" stroke-width="2"/>
    <circle cx="20" cy="35" r="2.5" fill="#16a34a"/>
    <text x="32" y="38" font-size="7.5" font-weight="600" fill="#15803d">Closed (C_closed): Deterministic oracle (tests/compiler) resets p^N decay</text>

    <circle cx="20" cy="54" r="5" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="20" cy="54" r="2.5" fill="#d97706"/>
    <text x="32" y="57" font-size="7.5" font-weight="600" fill="#b45309">Open (C_open): Subjective/heuristic; errors compound under P_success ≤ p^N</text>
  </g>
</g>
</svg>