<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1060" height="560" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- ENTRY TRANSITION                                                      -->
  <!-- ===================================================================== -->
  <circle cx="25" cy="125" r="7" fill="#1e293b"/>
  <path d="M 32,125 L 58,125" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <text x="25" y="105" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e293b">Entry</text>
  <text x="25" y="145" text-anchor="middle" font-size="7" fill="#475569">Goal g</text>

  <!-- ===================================================================== -->
  <!-- ROW 1: PHASES 1 to 3 (Left-to-Right Forward Path)                      -->
  <!-- ===================================================================== -->

  <!-- PHASE 1: CONTEXT ASSEMBLY -->
  <g transform="translate(60, 65)">
    <rect width="275" height="120" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="275" height="25" rx="3" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">PHASE 1: CONTEXT ASSEMBLY</text>
    <text x="263" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#475569">t = 0, 1, 2...</text>
    
    <text x="12" y="44" font-size="8" font-weight="600" fill="#1e293b">Evaluate Trajectory Limits</text>
    <text x="22" y="57" font-size="7.5" fill="#475569">Guard step budget: t &lt; T<tspan dy="2" font-size="6">max</tspan><tspan dy="-2">, token &amp; cost limits</tspan></text>
    <text x="12" y="74" font-size="8" font-weight="600" fill="#1e293b">Active Context Compaction</text>
    <text x="22" y="87" font-size="7.5" fill="#475569">Compress/truncate previous stdout, format tool schemas</text>
    <text x="12" y="104" font-size="8" font-weight="600" fill="#0f766e">Staged Prompt Buffer: c<tspan dy="2" font-size="6">t</tspan> ∈ Σ*</text>
  </g>

  <!-- Forward Connector: Phase 1 -> Phase 2 -->
  <path d="M 335,125 L 393,125" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <rect x="347" y="114" width="34" height="16" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="0.8"/>
  <text x="364" y="125" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e293b">c<tspan dy="2" font-size="5.5">t</tspan></text>

  <!-- PHASE 2: MODEL INVOCATION -->
  <g transform="translate(395, 65)">
    <rect width="275" height="120" rx="3" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="275" height="25" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#0f766e" letter-spacing="0.3">PHASE 2: MODEL INVOCATION</text>
    <text x="263" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#0f766e">M(c<tspan dy="2" font-size="6">t</tspan>)</text>

    <text x="12" y="44" font-size="8" font-weight="600" fill="#1e293b">Prefix KV Cache Reuse &amp; Prefill</text>
    <text x="22" y="57" font-size="7.5" fill="#475569">Compute-bound matrix multiplication over delta tokens</text>
    <text x="12" y="74" font-size="8" font-weight="600" fill="#1e293b">Autoregressive Decode Loop</text>
    <text x="22" y="87" font-size="7.5" fill="#475569">Memory-bandwidth-bound GEMV; DFA grammar masking</text>
    <text x="12" y="104" font-size="8" font-weight="600" fill="#0f766e">Emitted Action Proposal: a<tspan dy="2" font-size="6">prop</tspan></text>
  </g>

  <!-- Forward Connector: Phase 2 -> Phase 3 -->
  <path d="M 670,125 L 728,125" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="679" y="114" width="40" height="16" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="0.8"/>
  <text x="699" y="125" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f766e">a<tspan dy="2" font-size="5.5">prop</tspan></text>

  <!-- PHASE 3: ACTION AUTHORIZATION -->
  <g transform="translate(730, 65)">
    <rect width="275" height="120" rx="3" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="275" height="25" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#991b1b" letter-spacing="0.3">PHASE 3: ACTION AUTHORIZATION</text>
    <text x="263" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#991b1b">P(a<tspan dy="2" font-size="6">prop</tspan>)</text>

    <text x="12" y="44" font-size="8" font-weight="600" fill="#1e293b">Zero Ambient Authority Check (A = 0)</text>
    <text x="22" y="57" font-size="7.5" fill="#475569">Capability whitelist verification; AST parameter parsing</text>
    <text x="12" y="74" font-size="8" font-weight="600" fill="#1e293b">Sandbox Path &amp; Realpath Invariants</text>
    <text x="22" y="87" font-size="7.5" fill="#475569">Blocks path traversal</text>
    <text x="12" y="104" font-size="8" font-weight="600" fill="#166534">Permitted Mutation: a<tspan dy="2" font-size="6">perm</tspan> ∨ Refusal: ⊥</text>
  </g>

  <!-- ===================================================================== -->
  <!-- DOWNWARD / BYPASS CONNECTORS                                          -->
  <!-- ===================================================================== -->

  <!-- Authorized Transition: Phase 3 -> Phase 4 (Straight Down) -->
  <path d="M 868,185 L 868,298" fill="none" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-sage)"/>
  <rect x="828" y="232" width="80" height="18" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1"/>
  <text x="868" y="244" text-anchor="middle" font-size="7" font-weight="700" fill="#166534">Authorized: a<tspan dy="2" font-size="5.5">perm</tspan></text>

  <!-- Rejection Bypass Arc: Phase 3 -> Phase 5 (Bypasses Dispatch) -->
  <!-- Clean route in the gap between Phase 4 and Phase 5 -->
  <path d="M 750,185 C 750,225 700,245 700,270 L 700,345 L 678,345" fill="none" stroke="#991b1b" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-burgundy)"/>
  <rect x="645" y="258" width="110" height="18" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="0.8"/>
  <text x="700" y="270" text-anchor="middle" font-size="6.8" font-weight="700" fill="#991b1b">Rejected: o<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2"> = REFUSED</tspan></text>

  <!-- ===================================================================== -->
  <!-- CENTER TRANSIENT PAUSE BLOCK                                          -->
  <!-- ===================================================================== -->
  <g transform="translate(395, 205)">
    <rect width="235" height="72" rx="3" fill="#f8fafc" stroke="#92400e" stroke-width="1.2" stroke-dasharray="3,2"/>
    <rect width="235" height="18" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
    <text x="10" y="13" font-size="7.5" font-weight="700" fill="#92400e" letter-spacing="0.3">TRANSIENT PAUSES (NON-TERMINAL)</text>
    
    <text x="10" y="32" font-size="7" fill="#334155"><tspan font-weight="600">Approval Gate:</tspan> Operator escrow on sensitive actions</text>
    <text x="10" y="45" font-size="7" fill="#334155"><tspan font-weight="600">Backoff / Throttle:</tspan> Rate-limit sleep (HTTP 429)</text>
    <text x="10" y="58" font-size="7" fill="#334155"><tspan font-weight="600">Clarification Request:</tspan> Trajectory awaits human feedback</text>
  </g>

  <!-- Pause transition: Bidirectional link between Phase 3 and Transient Pause -->
  <path d="M 730,150 C 685,150 635,175 620,205" fill="none" stroke="#92400e" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
  <rect x="635" y="162" width="68" height="14" rx="2" fill="#ffffff" stroke="#92400e" stroke-width="0.7"/>
  <text x="669" y="172" text-anchor="middle" font-size="6" font-weight="600" fill="#92400e">await_approval()</text>

  <!-- ===================================================================== -->
  <!-- ROW 2: PHASES 4 to 6 (Right-to-Left Reverse Path)                      -->
  <!-- ===================================================================== -->

  <!-- PHASE 4: RUNTIME DISPATCH -->
  <g transform="translate(730, 305)">
    <rect width="275" height="120" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="275" height="25" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#334155" letter-spacing="0.3">PHASE 4: RUNTIME DISPATCH</text>
    <text x="263" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#334155">D(a<tspan dy="2" font-size="6">perm</tspan>)</text>

    <text x="12" y="44" font-size="8" font-weight="600" fill="#1e293b">Isolated Process Execution</text>
    <text x="22" y="57" font-size="7.5" fill="#475569">Container / microVM / subprocess namespace invocation</text>
    <text x="12" y="74" font-size="8" font-weight="600" fill="#1e293b">Watchdog Wall-Clock Timer</text>
    <text x="22" y="87" font-size="7.5" fill="#475569">SIGKILL on hang; returns TRANSPORT_FAILURE</text>
    <text x="12" y="104" font-size="8" font-weight="600" fill="#334155">Effector Side Effects &amp; Raw Streams</text>
  </g>

  <!-- Reverse Connector: Phase 4 -> Phase 5 -->
  <path d="M 730,380 L 678,380" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <rect x="686" y="370" width="38" height="16" rx="2" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
  <text x="705" y="381" text-anchor="middle" font-size="6.8" font-weight="700" fill="#334155">Output</text>

  <!-- PHASE 5: EVIDENCE CAPTURE -->
  <g transform="translate(395, 305)">
    <rect width="275" height="120" rx="3" fill="#f8fafc" stroke="#166534" stroke-width="1.5"/>
    <rect width="275" height="25" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#166534" letter-spacing="0.3">PHASE 5: EVIDENCE CAPTURE</text>
    <text x="263" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#166534">o<tspan dy="2" font-size="6">t+1</tspan><tspan dy="-2">, v</tspan><tspan dy="2" font-size="6">t+1</tspan></text>

    <text x="12" y="44" font-size="8" font-weight="600" fill="#1e293b">Structured Observation Packaging</text>
    <text x="22" y="57" font-size="7.5" fill="#475569">Status: COMPLETED | TRUNCATED | TRANSPORT_FAILURE</text>
    <text x="12" y="74" font-size="8" font-weight="600" fill="#1e293b">Out-of-Band Verification Oracle</text>
    <text x="22" y="87" font-size="7.5" fill="#475569">Sealed unit assertions, static linters, type checks</text>
    <text x="12" y="104" font-size="8" font-weight="600" fill="#166534">Ground-Truth Evidence Payload: v<tspan dy="2" font-size="6">t+1</tspan></text>
  </g>

  <!-- Reverse Connector: Phase 5 -> Phase 6 -->
  <path d="M 395,365 L 343,365" fill="none" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-sage)"/>
  <rect x="350" y="354" width="38" height="16" rx="2" fill="#ffffff" stroke="#166534" stroke-width="0.8"/>
  <text x="369" y="365" text-anchor="middle" font-size="6.8" font-weight="700" fill="#166534">o<tspan dy="1.5" font-size="5">t+1</tspan><tspan dy="-1.5">,v</tspan><tspan dy="1.5" font-size="5">t+1</tspan></text>

  <!-- PHASE 6: COMPLETION ASSESSMENT -->
  <g transform="translate(60, 305)">
    <rect width="275" height="120" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="275" height="25" rx="3" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="17" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">PHASE 6: COMPLETION ASSESSMENT</text>
    <text x="263" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#1e293b">Ω(c<tspan dy="2" font-size="6">t+1</tspan><tspan dy="-2">, v</tspan><tspan dy="2" font-size="6">t+1</tspan><tspan dy="-2">)</tspan></text>

    <text x="12" y="44" font-size="8" font-weight="600" fill="#1e293b">Verification-Gated Completion Predicate</text>
    <text x="22" y="57" font-size="7.5" fill="#475569">Self-reports rejected if v<tspan dy="2" font-size="6">t+1</tspan><tspan dy="-2"> indicates failing invariants</tspan></text>
    <text x="12" y="74" font-size="8" font-weight="600" fill="#1e293b">Termination vs. Loop Continuation</text>
    <text x="22" y="87" font-size="7.5" fill="#475569">Halt on goal or budget</text>
    <text x="12" y="104" font-size="8" font-weight="600" fill="#1e293b">State Transition Decision</text>
  </g>

  <!-- ===================================================================== -->
  <!-- LOOP BACK CONNECTOR: PHASE 6 -> PHASE 1                               -->
  <!-- ===================================================================== -->
  <path d="M 110,305 L 110,193" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>
  <rect x="80" y="235" width="60" height="26" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
  <text x="110" y="246" text-anchor="middle" font-size="7" font-weight="700" fill="#1e293b">Loop Continue</text>
  <text x="110" y="256" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f766e">t ← t + 1</text>

  <!-- ===================================================================== -->
  <!-- TERMINAL STATES                                                       -->
  <!-- ===================================================================== -->

  <!-- Terminal SUCCESS -->
  <path d="M 150,425 L 150,465" fill="none" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-sage)"/>
  <g transform="translate(90, 470)">
    <!-- Double border for terminal state -->
    <rect width="120" height="42" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.8"/>
    <rect x="3" y="3" width="114" height="36" rx="2" fill="none" stroke="#166534" stroke-width="0.8"/>
    <text x="60" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">SUCCESS</text>
    <text x="60" y="32" text-anchor="middle" font-size="6.8" fill="#166534">Ω = true ∧ v<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2"> pass</tspan></text>
  </g>

  <!-- Terminal FAILURE / EXHAUSTION -->
  <path d="M 270,425 L 270,465" fill="none" stroke="#991b1b" stroke-width="1.8" marker-end="url(#arr-burgundy)"/>
  <g transform="translate(210, 470)">
    <!-- Double border for terminal state -->
    <rect width="120" height="42" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="1.8"/>
    <rect x="3" y="3" width="114" height="36" rx="2" fill="none" stroke="#991b1b" stroke-width="0.8"/>
    <text x="60" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">FAILURE</text>
    <text x="60" y="32" text-anchor="middle" font-size="6.8" fill="#991b1b">t ≥ T<tspan dy="2" font-size="5">max</tspan><tspan dy="-2"> ∨ budget spent</tspan></text>
  </g>

</svg>