<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Six-phase turn lifecycle (ch01, @sec-vol3-intro-execution-lifecycle).
       Color encodes owner: purple = runtime, blue = model, amber = tool.
       Labels follow the chapter's numbered phase list. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#ffffff"/>

  <!-- ============ ROW 1: phases 1 to 3 ============ -->

  <!-- Phase 1: context assembly (runtime) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="220" height="120" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">1  Context assembly</text>
    <text x="210" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#6d28d9">RUNTIME</text>
    <text x="10" y="44" font-size="8.5" fill="#475569">Selects the contract, working state,</text>
    <text x="10" y="57" font-size="8.5" fill="#475569">and relevant observations</text>
    <text x="10" y="76" font-size="8.5" fill="#475569">Checks remaining turn, time, and cost</text>
    <text x="10" y="89" font-size="8.5" fill="#475569">limits before another call</text>
    <text x="10" y="108" font-size="8.5" font-weight="700" fill="#0f172a">Separates current from earlier workspace</text>
  </g>

  <!-- 1 -> 2 -->
  <path d="M 240,80 L 288,80" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="265" y="72" text-anchor="middle" font-size="8" fill="#475569">context</text>

  <!-- Phase 2: model invocation (model) -->
  <g transform="translate(290, 20)">
    <rect x="0" y="0" width="220" height="120" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">2  Model invocation</text>
    <text x="210" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#0369a1">MODEL</text>
    <text x="10" y="44" font-size="8.5" fill="#475569">Reads the assembled context</text>
    <text x="10" y="63" font-size="8.5" fill="#475569">Returns a proposal together with the</text>
    <text x="10" y="76" font-size="8.5" fill="#475569">invocation's completion status</text>
    <text x="10" y="95" font-size="8.5" fill="#475569">A partial response or failed call is</text>
    <text x="10" y="108" font-size="8.5" fill="#475569">not a complete tool request</text>
  </g>

  <!-- 2 -> 3 -->
  <path d="M 510,80 L 558,80" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="535" y="72" text-anchor="middle" font-size="8" fill="#0369a1">proposal</text>

  <!-- Phase 3: validate and authorize (runtime) -->
  <g transform="translate(560, 20)">
    <rect x="0" y="0" width="220" height="120" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">3  Validate and authorize</text>
    <text x="210" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#6d28d9">RUNTIME</text>
    <text x="10" y="44" font-size="8.5" fill="#475569">Checks the request against the tool</text>
    <text x="10" y="57" font-size="8.5" fill="#475569">interface and the task's grant</text>
    <text x="10" y="76" font-size="8.5" fill="#475569">Target workspace and allowed files</text>
    <text x="10" y="95" font-size="8.5" fill="#475569">Rejects invalid or out-of-scope requests;</text>
    <text x="10" y="108" font-size="8.5" font-weight="700" fill="#0f172a">waits for approval before an effect</text>
  </g>

  <!-- ============ MIDDLE BAND: loop, waits, rejection, dispatch ============ -->

  <!-- 6 -> 1: another turn -->
  <path d="M 60,250 L 60,142" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="30" y="187" width="60" height="16" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
  <text x="60" y="198" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Another turn</text>

  <!-- Non-terminal wait -->
  <rect x="110" y="162" width="320" height="64" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="120" y="178" font-size="8.5" font-weight="700" fill="#0f172a">Non-terminal wait</text>
  <text x="120" y="192" font-size="8.5" fill="#475569">From 3: required approval before dispatching an effect</text>
  <text x="120" y="205" font-size="8.5" fill="#475569">From 6: outstanding tool work or a clarification request</text>
  <text x="120" y="218" font-size="8" fill="#64748b">Resumes the phase that paused; not an exit</text>

  <!-- 3 -> wait (approval) -->
  <path d="M 590,140 L 590,185 L 432,185" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="510" y="179" text-anchor="middle" font-size="8" fill="#475569">needs approval</text>

  <!-- 6 -> wait -->
  <path d="M 200,250 L 200,228" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="206" y="242" font-size="8" fill="#475569">wait</text>

  <!-- 3 -> 5: rejected, no tool execution -->
  <path d="M 630,140 L 630,212 L 470,212 L 470,248" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="550" y="226" text-anchor="middle" font-size="8" fill="#b91c1c">rejected: feedback, no execution</text>

  <!-- 3 -> 4: authorized -->
  <path d="M 700,140 L 700,248" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="706" y="182" font-size="8" fill="#6d28d9">authorized</text>

  <!-- ============ ROW 2: phases 4 to 6 (right to left) ============ -->

  <!-- Phase 4: tool execution (tool) -->
  <g transform="translate(560, 250)">
    <rect x="0" y="0" width="220" height="120" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">4  Tool execution</text>
    <text x="210" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#b45309">TOOL</text>
    <text x="10" y="44" font-size="8.5" fill="#475569">Runs the authorized operation within</text>
    <text x="10" y="57" font-size="8.5" fill="#475569">its assigned limits</text>
    <text x="10" y="76" font-size="8.5" fill="#475569">Applying a patch changes the working</text>
    <text x="10" y="89" font-size="8.5" fill="#475569">copy before any test has passed</text>
    <text x="10" y="108" font-size="8.5" font-weight="700" fill="#0f172a">Dispatch is not completion</text>
  </g>

  <!-- 4 -> 5 -->
  <path d="M 560,310 L 512,310" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="535" y="302" text-anchor="middle" font-size="8" fill="#b45309">outcome</text>

  <!-- Phase 5: observation and evidence (runtime) -->
  <g transform="translate(290, 250)">
    <rect x="0" y="0" width="220" height="120" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">5  Observation and evidence</text>
    <text x="210" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#6d28d9">RUNTIME</text>
    <text x="10" y="44" font-size="8.5" fill="#475569">Records the tool outcome: completed,</text>
    <text x="10" y="57" font-size="8.5" fill="#475569">failed, or timed out (outcome unknown)</text>
    <text x="10" y="76" font-size="8.5" fill="#475569">Obtains the checks the next decision needs</text>
    <text x="10" y="95" font-size="8.5" font-weight="700" fill="#0f172a">Evidence payload (with coverage limits)</text>
    <text x="10" y="108" font-size="8.5" fill="#475569">Missing results stay unresolved</text>
  </g>

  <!-- 5 -> 6 -->
  <path d="M 290,310 L 242,310" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="265" y="302" text-anchor="middle" font-size="8" fill="#6d28d9">evidence</text>

  <!-- Phase 6: assess against the contract (runtime) -->
  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="220" height="120" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#0f172a">6  Assess against contract</text>
    <text x="210" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#6d28d9">RUNTIME</text>
    <text x="10" y="44" font-size="8.5" font-weight="700" fill="#0f172a">Acceptance requires independent</text>
    <text x="10" y="57" font-size="8.5" font-weight="700" fill="#0f172a">evidence; self-reports are not evidence</text>
    <text x="10" y="76" font-size="8.5" fill="#475569">Weighs relevant external effects and</text>
    <text x="10" y="89" font-size="8.5" fill="#475569">the remaining resource limits</text>
    <text x="10" y="108" font-size="8.5" fill="#475569">Continue, wait, stop, or accept</text>
  </g>

  <!-- ============ EXITS ============ -->

  <!-- 6 -> accept -->
  <path d="M 90,370 L 90,398" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="20" y="400" width="150" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="95" y="416" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Accept deliverable</text>
  <text x="95" y="430" text-anchor="middle" font-size="8" fill="#15803d">evidence meets the contract</text>

  <!-- 6 -> stop without acceptance -->
  <path d="M 215,370 L 215,398" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="190" y="400" width="200" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="290" y="416" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">Stop without acceptance</text>
  <text x="290" y="430" text-anchor="middle" font-size="8" fill="#b91c1c">unresolved outcome or escalate</text>
</svg>
