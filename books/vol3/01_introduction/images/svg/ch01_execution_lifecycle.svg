<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="860" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== Top row: 1 -> 2 -> 3 ===== -->
  <rect x="30" y="30" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1  Context assembly</text>
  <text x="140" y="79" text-anchor="middle" font-size="14" fill="#6d28d9">runtime</text>

  <rect x="320" y="30" width="220" height="64" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="430" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2  Model invocation</text>
  <text x="430" y="79" text-anchor="middle" font-size="14" fill="#0369a1">model</text>

  <rect x="610" y="30" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3  Validate and authorize</text>
  <text x="720" y="79" text-anchor="middle" font-size="14" fill="#6d28d9">runtime</text>

  <path d="M250,62 H320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="285" y="54" text-anchor="middle" font-size="14" fill="#334155">context</text>
  <path d="M540,62 H610" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="575" y="54" text-anchor="middle" font-size="14" fill="#334155">proposal</text>

  <!-- ===== Bottom row: 4 -> 5 -> 6 (right to left) ===== -->
  <rect x="610" y="250" width="220" height="64" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4  Tool execution</text>
  <text x="720" y="299" text-anchor="middle" font-size="14" fill="#b45309">tool</text>

  <rect x="320" y="250" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">5  Observation and evidence</text>
  <text x="430" y="299" text-anchor="middle" font-size="14" fill="#6d28d9">runtime</text>

  <rect x="30" y="250" width="220" height="64" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">6  Assess against contract</text>
  <text x="140" y="299" text-anchor="middle" font-size="14" fill="#6d28d9">runtime</text>

  <path d="M610,282 H540" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="575" y="274" text-anchor="middle" font-size="14" fill="#334155">outcome</text>
  <line x1="575" y1="288" x2="575" y2="324" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="575" y="342" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">unknown if timed out</text>
  <path d="M320,282 H250" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="285" y="274" text-anchor="middle" font-size="14" fill="#334155">evidence</text>

  <!-- ===== The only path to a tool: authorized ===== -->
  <path d="M740,94 V250" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="750" y="176" font-size="14" font-weight="700" fill="#6d28d9">authorized</text>

  <!-- rejected: error feedback, never reaches a tool -->
  <path d="M660,94 V200 H500 V250" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="580" y="192" text-anchor="middle" font-size="14" fill="#b91c1c">rejected, no execution</text>

  <!-- ===== Non-terminal wait ===== -->
  <rect x="170" y="126" width="220" height="48" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="280" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Wait</text>
  <text x="280" y="164" text-anchor="middle" font-size="14" fill="#475569">resumes; not an exit</text>
  <path d="M630,94 V150 H390" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="510" y="143" text-anchor="middle" font-size="14" fill="#334155">needs approval</text>
  <path d="M210,250 V174" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="218" y="216" font-size="14" fill="#334155">wait</text>

  <!-- ===== Another turn ===== -->
  <path d="M60,250 V94" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="68" y="176" font-size="14" fill="#334155">next turn</text>

  <!-- ===== Terminal outcomes ===== -->
  <rect x="30" y="370" width="190" height="54" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="125" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Accept deliverable</text>
  <text x="125" y="412" text-anchor="middle" font-size="14" fill="#15803d">evidence meets contract</text>
  <path d="M125,314 V370" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="270" y="370" width="210" height="54" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="375" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Stop without acceptance</text>
  <text x="375" y="412" text-anchor="middle" font-size="14" fill="#b91c1c">unresolved or escalate</text>
  <path d="M235,314 V397 H270" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
