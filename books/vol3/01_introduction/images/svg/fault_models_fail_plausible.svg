<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="520" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT PANEL: PHASE-SPACE TRAJECTORY CORRIDORS                          -->
  <!-- ===================================================================== -->
  <g transform="translate(25, 20)">
    <rect width="610" height="475" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="610" height="26" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="17" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">TRAJECTORY PHASE-SPACE: SYNTACTIC CONFORMANCE VS. INVARIANT CLOSURE</text>
    <text x="596" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#475569">State Evolution (s<tspan dy="2" font-size="6">t</tspan><tspan dy="-2"> → s</tspan><tspan dy="2" font-size="6">t+1</tspan><tspan dy="-2">)</tspan></text>

    <!-- Phase Space Grid and Regions -->
    <!-- Safe Semantic Envelope (Top Right / Center) -->
    <rect x="290" y="55" width="290" height="145" rx="3" fill="#f0fdf4" fill-opacity="0.8" stroke="#166534" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="302" y="74" font-size="8" font-weight="700" fill="#166534">CORRECT CONVERGENCE REGION (s ∈ I<tspan dy="2" font-size="6">spec</tspan><tspan dy="-2">)</tspan></text>
    <text x="302" y="87" font-size="7" fill="#166534">Syntactically valid AND satisfies ground-truth test oracle v<tspan dy="2" font-size="5">t</tspan></text>

    <!-- Fail-Plausible Danger Zone (Bottom Right) -->
    <rect x="290" y="235" width="290" height="185" rx="3" fill="#fef2f2" fill-opacity="0.8" stroke="#991b1b" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="302" y="254" font-size="8" font-weight="700" fill="#991b1b">FAIL-PLAUSIBLE REGIME (SHALLOW BLINDSPOT)</text>
    <text x="302" y="267" font-size="7" fill="#991b1b">• Syntactic Grammar Valid: a<tspan dy="2" font-size="5">prop</tspan><tspan dy="-2"> ∈ L(G), JSON Schema OK</tspan></text>
    <text x="302" y="279" font-size="7" fill="#991b1b">• Process Exit Code = 0 (No OS trap / unhandled exception)</text>
    <text x="302" y="291" font-size="7" font-weight="600" fill="#991b1b">• Invariants Violated: s<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2"> ∉ I (Deletes tests / mocks returns)</tspan></text>

    <!-- Coordinate Axes -->
    <!-- Y Axis: Invariant Conformance -->
    <path d="M 65,430 L 65,48" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <text x="75" y="46" font-size="7.5" font-weight="700" fill="#1e293b">Semantic Invariant Validity (I<tspan dy="2" font-size="5.5">spec</tspan><tspan dy="-2">)</tspan></text>

    <!-- X Axis: Syntactic Conformance -->
    <path d="M 60,425 L 590,425" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <text x="585" y="440" text-anchor="end" font-size="7.5" font-weight="700" fill="#1e293b">Syntactic &amp; Structural Validity (L(G), Exit Code = 0)</text>

    <!-- Invariant Threshold Line (y = 215) -->
    <line x1="65" y1="215" x2="580" y2="215" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="72" y="210" font-size="7" font-weight="600" fill="#64748b">Invariant Threshold (I)</text>

    <!-- Syntactic Boundary Line (x = 290) -->
    <line x1="290" y1="55" x2="290" y2="425" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="295" y="210" font-size="7" font-weight="600" fill="#64748b">Syntactic Boundary (Schema OK)</text>

    <!-- Initial Trajectory State Point -->
    <circle cx="130" cy="200" r="5" fill="#1e293b"/>
    <text x="130" y="190" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e293b">Start: s<tspan dy="2" font-size="5.5">0</tspan></text>

    <!-- =================================================================== -->
    <!-- PATH 1: FAIL-STOP (Crash / Halt)                                    -->
    <!-- =================================================================== -->
    <path d="M 130,200 C 160,200 170,230 170,260 L 170,320" fill="none" stroke="#475569" stroke-width="2"/>
    <!-- Halt Marker (Cross) -->
    <circle cx="170" cy="325" r="9" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <line x1="165" y1="320" x2="175" y2="330" stroke="#475569" stroke-width="1.5"/>
    <line x1="175" y1="320" x2="165" y2="330" stroke="#475569" stroke-width="1.5"/>
    
    <g transform="translate(80, 345)">
      <rect width="135" height="42" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
      <text x="67" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">1. FAIL-STOP (CRASH)</text>
      <text x="67" y="26" text-anchor="middle" font-size="6.8" fill="#475569">OS traps SIGSEGV / exit ≠ 0</text>
      <text x="67" y="37" text-anchor="middle" font-size="6.5" font-weight="600" fill="#166534">Clean deterministic signal</text>
    </g>

    <!-- =================================================================== -->
    <!-- PATH 2: BYZANTINE (Arbitrary Deviation)                             -->
    <!-- =================================================================== -->
    <path d="M 130,200 C 140,150 170,120 200,140 C 225,160 215,220 230,250 C 240,270 235,300 240,320" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="240" cy="320" r="5" fill="#92400e"/>
    
    <g transform="translate(145, 75)">
      <rect width="130" height="42" rx="2" fill="#ffffff" stroke="#92400e" stroke-width="1"/>
      <text x="65" y="14" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">2. BYZANTINE FAULT</text>
      <text x="65" y="26" text-anchor="middle" font-size="6.8" fill="#78350f">Arbitrary / malicious output</text>
      <text x="65" y="37" text-anchor="middle" font-size="6.5" font-weight="600" fill="#92400e">Fenced by quorum (f &lt; n/3)</text>
    </g>

    <!-- =================================================================== -->
    <!-- PATH 3: FAIL-PLAUSIBLE (The Danger Corridor)                        -->
    <!-- =================================================================== -->
    <!-- Enters high-syntactic zone, then plunges into invariant violation -->
    <path d="M 130,200 C 200,200 270,175 340,165 C 410,155 450,190 480,245 C 505,290 520,335 530,365" fill="none" stroke="#991b1b" stroke-width="2.5" marker-end="url(#arr-burgundy)"/>
    <circle cx="340" cy="165" r="3.5" fill="#166534"/>
    <circle cx="480" cy="245" r="3.5" fill="#991b1b"/>
    <circle cx="530" cy="365" r="5" fill="#991b1b"/>

    <g transform="translate(305, 335)">
      <rect width="195" height="52" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <text x="97" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">3. FAIL-PLAUSIBLE FAULT</text>
      <text x="97" y="28" text-anchor="middle" font-size="6.8" fill="#475569">Syntactically pristine: exit code = 0</text>
      <text x="97" y="39" text-anchor="middle" font-size="6.8" fill="#475569">Silent invariant corruption (s<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2"> ∉ I)</tspan></text>
      <text x="97" y="49" text-anchor="middle" font-size="6.5" font-weight="700" fill="#991b1b">UNDETECTED by shallow supervisors</text>
    </g>

    <!-- Correct Target Path (for visual contrast) -->
    <path d="M 130,200 C 180,180 240,130 330,115 C 380,105 440,105 500,105" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-sage)"/>
    <circle cx="500" cy="105" r="4" fill="#166534"/>
    <text x="510" y="108" font-size="7.5" font-weight="700" fill="#166534">Correct Trajectory</text>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT PANEL: SUPERVISOR DETECTION & FENCING TAXONOMY                  -->
  <!-- ===================================================================== -->
  <g transform="translate(650, 20)">
    <rect width="385" height="475" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="385" height="26" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="17" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">DISTRIBUTED FAULT MODELS COMPARISON</text>
    <text x="371" y="17" text-anchor="end" font-size="8" font-weight="600" fill="#475569">Supervisory Fencing</text>

    <!-- Card 1: Fail-Stop -->
    <g transform="translate(15, 38)">
      <rect width="355" height="115" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="355" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">FAIL-STOP REGIME (Schlichting &amp; Schneider 1983)</text>
      
      <text x="10" y="34" font-size="7.5" font-weight="600" fill="#1e293b">Fault Manifestation:</text>
      <text x="10" y="46" font-size="7" fill="#475569">Process halts abruptly; SIGSEGV, OOM panic, socket drop.</text>
      
      <text x="10" y="62" font-size="7.5" font-weight="600" fill="#1e293b">Supervisory Detection Mechanism:</text>
      <text x="10" y="74" font-size="7" fill="#475569">OS kernel exit status (status ≠ 0), heartbeat timeout, dead socket.</text>
      
      <text x="10" y="90" font-size="7.5" font-weight="600" fill="#1e293b">Fencing &amp; Recovery Efficacy:</text>
      <text x="10" y="102" font-size="7" font-weight="600" fill="#166534">Deterministic OS recovery; automatic container restart &amp; retry.</text>
    </g>

    <!-- Card 2: Byzantine -->
    <g transform="translate(15, 163)">
      <rect width="355" height="115" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="355" height="20" rx="2" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#92400e">BYZANTINE REGIME (Lamport et al. 1982)</text>
      
      <text x="10" y="34" font-size="7.5" font-weight="600" fill="#1e293b">Fault Manifestation:</text>
      <text x="10" y="46" font-size="7" fill="#475569">Arbitrary, colluding, or maliciously deceptive communication.</text>
      
      <text x="10" y="62" font-size="7.5" font-weight="600" fill="#1e293b">Supervisory Detection Mechanism:</text>
      <text x="10" y="74" font-size="7" fill="#475569">Cryptographic digest mismatch, contradictory replica messages.</text>
      
      <text x="10" y="90" font-size="7.5" font-weight="600" fill="#1e293b">Fencing &amp; Recovery Efficacy:</text>
      <text x="10" y="102" font-size="7" font-weight="600" fill="#92400e">Replicated state machines &amp; quorum consensus (tolerates f &lt; n/3).</text>
    </g>

    <!-- Card 3: Fail-Plausible -->
    <g transform="translate(15, 288)">
      <rect width="355" height="135" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="355" height="20" rx="2" fill="#fef2f2" stroke="#991b1b" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#991b1b">FAIL-PLAUSIBLE REGIME (Agentic ML Systems)</text>
      
      <text x="10" y="34" font-size="7.5" font-weight="600" fill="#1e293b">Fault Manifestation:</text>
      <text x="10" y="46" font-size="7" fill="#475569">Syntactic perfection (L(G)), status code 0, but destroys invariants (s ∉ I).</text>
      
      <text x="10" y="62" font-size="7.5" font-weight="600" fill="#1e293b">Supervisory Blindspot:</text>
      <text x="10" y="74" font-size="7" fill="#991b1b">Shallow monitors register 100% SUCCESS; model self-reports valid.</text>
      
      <text x="10" y="90" font-size="7.5" font-weight="600" fill="#1e293b">Authoritative Fencing Requirement:</text>
      <text x="10" y="102" font-size="7" font-weight="600" fill="#166534">Out-of-band sealed verification oracle: V(s<tspan dy="2" font-size="5">t+1</tspan><tspan dy="-2">) → v</tspan><tspan dy="2" font-size="5">t+1</tspan></text>
      <text x="10" y="115" font-size="7" fill="#334155">Immutable test suites; model granted zero ambient authority (A = 0).</text>
    </g>
  </g>

</svg>