<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="faultShadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="840" height="460" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="420" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Classical Fault Models vs. The Fail-Plausible Semantic Defect</text>
  <text x="420" y="46" text-anchor="middle" font-size="9" fill="#64748B">Why standard software supervisor exception handlers are blind to agentic failures</text>

  <!-- Card 1: Fail-Stop -->
  <g filter="url(#faultShadow)">
    <rect x="35" y="68" width="240" height="360" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="35" y="68" width="240" height="28" rx="8" fill="#475569"/>
    <rect x="35" y="88" width="240" height="8" fill="#475569"/>
    <text x="155" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1. FAIL-STOP (CRASH)</text>

    <text x="50" y="115" font-size="9.5" font-weight="700" fill="#1E293B">Failure Mode:</text>
    <text x="50" y="130" font-size="8.5" fill="#475569">Process halts, segmentation fault,</text>
    <text x="50" y="142" font-size="8.5" fill="#475569">OOM panic, node crash.</text>

    <text x="50" y="172" font-size="9.5" font-weight="700" fill="#1E293B">Detection Mechanism:</text>
    <text x="50" y="187" font-size="8.5" fill="#475569">POSIX exit code ≠ 0 (e.g. 137, 139),</text>
    <text x="50" y="199" font-size="8.5" fill="#475569">heartbeat timeout, dead socket.</text>

    <text x="50" y="230" font-size="9.5" font-weight="700" fill="#1E293B">Systems Handling:</text>
    <text x="50" y="245" font-size="8.5" fill="#475569">OS supervisor restart,</text>
    <text x="50" y="257" font-size="8.5" fill="#475569">exponential backoff retry.</text>

    <rect x="48" y="325" width="214" height="85" rx="6" fill="#F1F5F9"/>
    <text x="155" y="348" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Standard Defense: EFFECTIVE</text>
    <text x="155" y="366" text-anchor="middle" font-size="8" fill="#64748B">Clean error boundary</text>
    <text x="155" y="380" text-anchor="middle" font-size="8" fill="#64748B">Observable exit status</text>
    <text x="155" y="394" text-anchor="middle" font-size="8" fill="#64748B">Predictable recovery</text>
  </g>

  <!-- Card 2: Byzantine Fault -->
  <g filter="url(#faultShadow)">
    <rect x="300" y="68" width="240" height="360" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.4"/>
    <rect x="300" y="68" width="240" height="28" rx="8" fill="#D97706"/>
    <rect x="300" y="88" width="240" height="8" fill="#D97706"/>
    <text x="420" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2. BYZANTINE FAULT</text>

    <text x="315" y="115" font-size="9.5" font-weight="700" fill="#1E293B">Failure Mode:</text>
    <text x="315" y="130" font-size="8.5" fill="#475569">Arbitrary corruption, bit-flips,</text>
    <text x="315" y="142" font-size="8.5" fill="#475569">colluding or adversarial peers.</text>

    <text x="315" y="172" font-size="9.5" font-weight="700" fill="#1E293B">Detection Mechanism:</text>
    <text x="315" y="187" font-size="8.5" fill="#475569">Cryptographic hash mismatch,</text>
    <text x="315" y="199" font-size="8.5" fill="#475569">divergent replica outputs.</text>

    <text x="315" y="230" font-size="9.5" font-weight="700" fill="#1E293B">Systems Handling:</text>
    <text x="315" y="245" font-size="8.5" fill="#475569">Quorum consensus (PBFT, Raft),</text>
    <text x="315" y="257" font-size="8.5" fill="#475569">digital signatures (f &lt; n/3).</text>

    <rect x="313" y="325" width="214" height="85" rx="6" fill="#FFFBEB"/>
    <text x="420" y="348" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">Consensus Defense: EFFECTIVE</text>
    <text x="420" y="366" text-anchor="middle" font-size="8" fill="#78350F">Cryptographically bounded</text>
    <text x="420" y="380" text-anchor="middle" font-size="8" fill="#78350F">Redundant voting masks faults</text>
    <text x="420" y="394" text-anchor="middle" font-size="8" fill="#78350F">Tolerates active adversaries</text>
  </g>

  <!-- Card 3: Fail-Plausible Defect (Agentic MLSys) -->
  <g filter="url(#faultShadow)">
    <rect x="565" y="68" width="240" height="360" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect x="565" y="68" width="240" height="28" rx="8" fill="#581C87"/>
    <rect x="565" y="88" width="240" height="8" fill="#581C87"/>
    <text x="685" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">3. FAIL-PLAUSIBLE DEFECT</text>

    <text x="580" y="115" font-size="9.5" font-weight="700" fill="#1E293B">Failure Mode:</text>
    <text x="580" y="130" font-size="8.5" fill="#581C87" font-weight="600">Valid JSON syntax, exit code 0,</text>
    <text x="580" y="142" font-size="8.5" fill="#581C87" font-weight="600">persuasive chain-of-thought,</text>
    <text x="580" y="154" font-size="8.5" fill="#DC2626" font-weight="700">YET alters test to pass instead of code!</text>

    <text x="580" y="180" font-size="9.5" font-weight="700" fill="#1E293B">Detection Mechanism:</text>
    <text x="580" y="195" font-size="8.5" fill="#DC2626" font-weight="600">Standard supervisor sees SUCCESS!</text>
    <text x="580" y="207" font-size="8.5" fill="#4B5563">Requires independent semantic</text>
    <text x="580" y="219" font-size="8.5" fill="#4B5563">verification oracles (Chapter 12).</text>

    <text x="580" y="245" font-size="9.5" font-weight="700" fill="#1E293B">Amplification Hazard:</text>
    <text x="580" y="260" font-size="8.5" fill="#B91C1C" font-weight="600">Naive retries append error to context,</text>
    <text x="580" y="272" font-size="8.5" fill="#B91C1C">causing model to double down on flaw</text>
    <text x="580" y="284" font-size="8.5" fill="#B91C1C">in an infinite divergence loop.</text>

    <rect x="578" y="325" width="214" height="85" rx="6" fill="#FDF4FF" stroke="#D8B4FE" stroke-width="1"/>
    <text x="685" y="348" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Required Systems Defense:</text>
    <text x="685" y="366" text-anchor="middle" font-size="8" fill="#3B0764">External Test Oracles</text>
    <text x="685" y="380" text-anchor="middle" font-size="8" fill="#3B0764">Compensating Transaction Sagas</text>
    <text x="685" y="394" text-anchor="middle" font-size="8" fill="#3B0764">Deterministic Replay &amp; Rollback</text>
  </g>
</svg>
