<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="840" height="460" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">CLASSICAL FAULT MODELS VS. THE FAIL-PLAUSIBLE SEMANTIC DEFECT</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Why standard software supervisor exception handlers are blind to agentic failures</text>

  <!-- Card 1: Fail-Stop -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="254" height="385" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="254" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#334155">1. FAIL-STOP (CRASH)</text>

    <text x="14" y="48" font-size="8.5" font-weight="700" fill="#0f172a">Failure Mode:</text>
    <text x="14" y="64" font-size="8" fill="#475569">Process halts, segmentation fault,</text>
    <text x="14" y="78" font-size="8" fill="#475569">OOM panic, node crash.</text>

    <text x="14" y="112" font-size="8.5" font-weight="700" fill="#0f172a">Detection Mechanism:</text>
    <text x="14" y="128" font-size="8" fill="#475569">POSIX exit code ≠ 0 (e.g. 137, 139),</text>
    <text x="14" y="142" font-size="8" fill="#475569">heartbeat timeout, dead socket.</text>

    <text x="14" y="176" font-size="8.5" font-weight="700" fill="#0f172a">Systems Handling:</text>
    <text x="14" y="192" font-size="8" fill="#475569">OS supervisor restart,</text>
    <text x="14" y="206" font-size="8" fill="#475569">exponential backoff retry.</text>

    <!-- Defense Sub-card -->
    <g transform="translate(14, 280)">
      <rect x="0" y="0" width="226" height="88" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="113" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Standard Defense: EFFECTIVE</text>
      <text x="20" y="42" font-size="8" fill="#64748b">• Clean error boundary</text>
      <text x="20" y="58" font-size="8" fill="#64748b">• Observable exit status</text>
      <text x="20" y="74" font-size="8" fill="#64748b">• Predictable recovery</text>
    </g>
  </g>

  <!-- Card 2: Byzantine Fault -->
  <g transform="translate(313, 75)">
    <rect x="0" y="0" width="254" height="385" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="254" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">2. BYZANTINE FAULT</text>

    <text x="14" y="48" font-size="8.5" font-weight="700" fill="#0f172a">Failure Mode:</text>
    <text x="14" y="64" font-size="8" fill="#475569">Arbitrary corruption, bit-flips,</text>
    <text x="14" y="78" font-size="8" fill="#475569">colluding or adversarial peers.</text>

    <text x="14" y="112" font-size="8.5" font-weight="700" fill="#0f172a">Detection Mechanism:</text>
    <text x="14" y="128" font-size="8" fill="#475569">Cryptographic hash mismatch,</text>
    <text x="14" y="142" font-size="8" fill="#475569">divergent replica outputs.</text>

    <text x="14" y="176" font-size="8.5" font-weight="700" fill="#0f172a">Systems Handling:</text>
    <text x="14" y="192" font-size="8" fill="#475569">Quorum consensus (PBFT, Raft),</text>
    <text x="14" y="206" font-size="8" fill="#475569">digital signatures (f &lt; n/3).</text>

    <!-- Defense Sub-card -->
    <g transform="translate(14, 280)">
      <rect x="0" y="0" width="226" height="88" rx="1" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="113" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">Consensus Defense: EFFECTIVE</text>
      <text x="20" y="42" font-size="8" fill="#78350f">• Cryptographically bounded</text>
      <text x="20" y="58" font-size="8" fill="#78350f">• Redundant voting masks faults</text>
      <text x="20" y="74" font-size="8" fill="#78350f">• Tolerates active adversaries</text>
    </g>
  </g>

  <!-- Card 3: Fail-Plausible Defect (Agentic MLSys) -->
  <g transform="translate(586, 75)">
    <rect x="0" y="0" width="254" height="385" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="254" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#991b1b">3. FAIL-PLAUSIBLE DEFECT</text>

    <text x="14" y="48" font-size="8.5" font-weight="700" fill="#0f172a">Failure Mode:</text>
    <text x="14" y="64" font-size="8" font-weight="600" fill="#dc2626">Valid JSON syntax, exit code 0,</text>
    <text x="14" y="78" font-size="8" font-weight="600" fill="#dc2626">persuasive chain-of-thought,</text>
    <text x="14" y="92" font-size="8" font-weight="700" fill="#991b1b">YET alters test to pass instead of code!</text>

    <text x="14" y="118" font-size="8.5" font-weight="700" fill="#0f172a">Detection Mechanism:</text>
    <text x="14" y="134" font-size="8" font-weight="700" fill="#dc2626">Standard supervisor sees SUCCESS!</text>
    <text x="14" y="148" font-size="8" fill="#475569">Requires independent semantic</text>
    <text x="14" y="160" font-size="8" fill="#475569">verification oracles (Chapter 12).</text>

    <text x="14" y="186" font-size="8.5" font-weight="700" fill="#0f172a">Amplification Hazard:</text>
    <text x="14" y="202" font-size="8" font-weight="600" fill="#991b1b">Naive retries append error to context,</text>
    <text x="14" y="216" font-size="8" fill="#991b1b">causing model to double down on flaw</text>
    <text x="14" y="228" font-size="8" fill="#991b1b">in an infinite divergence loop.</text>

    <!-- Defense Sub-card -->
    <g transform="translate(14, 280)">
      <rect x="0" y="0" width="226" height="88" rx="1" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="113" y="22" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Required Systems Defense:</text>
      <text x="20" y="42" font-size="8" fill="#7f1d1d">• External Test Oracles</text>
      <text x="20" y="58" font-size="8" fill="#7f1d1d">• Compensating Transaction Sagas</text>
      <text x="20" y="74" font-size="8" fill="#7f1d1d">• Deterministic Replay &amp; Rollback</text>
    </g>
  </g>
</svg>
