    concepts:
    - id: vol3.trajectory
      label: Trajectory
      teaches: Trajectory as the unit of engineering
      summary: The governed sequence of model proposals, mediated actions, observations, and completion
        evidence for one task.
      section: sec-vol3-intro-trajectory-systems-boundary
    - id: vol3.contract
      label: Task contract
      teaches: Task contract
