    - id: vol3.field.closure.proposal
      source: vol3.closure
      predicate: constrains
      target: vol3.proposal
      explanation: A mechanical path check bounds the proposed edit, and external checks supply evidence
        about its result.
      conditions: Each bound and check certifies its named property only.
      status: draft
      evidence:
        section: sec-vol3-intro-trajectory-systems-boundary
        quote: 'Guided by this inspection, the model proposes a patch. As @sec-vol3-intro-stochastic-computer
          established, that patch is a candidate rather than a certified computation. Before modifying the
          working copy, the runtime checks that the edit targets permitted files. That path check is a mechanical
          bound below the model, and it keeps this $\AuthorityExposureLevel_1$ edit inside the $\StateExposureLevel_2$
          working copy. The step also separates three things that a single-call view conflates: the model''s
          generated diff is a proposal, the modified file is an effect, and the tool''s execution report
          is an observation. When the next build reports an unclosed bracket, that observation steers the
          following turn. The model proposes a corrected patch, which the runtime applies before rerunning
          the build. The compiler has acted as an intermediate check in the sense of the horizon notebook
          (\ref{nbk-01-horizon-compounding}), catching the syntax error one turn after it happened; the
          corrected patch and clean rebuild keep that error from carrying into the remaining turns. Once
          compilation succeeds and visible unit tests pass, the runtime collects regression evidence from
          the contract''s sealed suite, which the editing tools cannot touch, raising the closure evidence
          above the model from visible tests to sealed tests. It then records the resulting deliverable
          alongside these verification records. If the results satisfy the contract''s completion criteria,
          the runtime submits the repair; otherwise, it can continue iterating, abort, or escalate to a
          human engineer.'
