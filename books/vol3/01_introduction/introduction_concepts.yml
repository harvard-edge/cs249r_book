  claims:
    Agency is a property of the closed loop: A system is agentic when a runtime, not a human, closes the proposal-action-observation
      loop, so the model's output is a proposal with no standing authority and enforcement, isolation, persistence,
      and completion checks belong to the runtime.
    Trajectory as the unit of engineering: The ordered record of states, proposals, runtime decisions, and observations
      from initial context to acceptance, termination, or escalation is the accounting boundary for cost, latency,
      state lifetime, quotas, and permissions, so resources are managed per task rather than per call.
    H·S·A exposures: A task's coordinate is its horizon H in turns, carried state S0 to S3, and authority A0 to
      A3, each level set by operational consequence rather than command syntax, and the coordinate names the exposure
      that closure must answer.
    Invariant closure: 'Constraints never rest on the model: bounds close mechanically below it and acceptance rests
      on external evidence above it, and greater exposure demands stronger closure.'
    Task contract: A goal with negative scope, an environment, permitted actions, available observations, and completion
      criteria turn intent into something the runtime can enforce, and each omitted field produces a specific, predictable
      failure.
    Horizon compounding: With independent unchecked steps Pr(success) = (1-eps)^H, so the product eps*H rather than
      step accuracy sets reliability, and a check plus restoration that shortens the unchecked segment is the cheaper
      lever.
    Cost per accepted task: Under retry-until-accept, C_eff = E[C_attempt]/p_acc, so acceptance divides the whole
      attempt cost and any mechanism pays for its overhead only if it lowers this ratio.
    Six-phase turn lifecycle: Every turn passes context assembly, model invocation, validate-and-authorize, tool
      execution, observation, and assessment against the contract, and only the second phase belongs to the model.
    Fail-plausible fault: The characteristic agent failure is well-formed, credible, and wrong, so fail-stop monitors
      record success and agreement among samples from one model sets no bound on wrong answers.
    Zero ambient authority: Every side effect passes an explicit runtime-checked grant and evidence comes only from
      tools and deterministic checks, never from model text.
    Closure evidence levels: Self-report, static analysis, visible tests, sealed tests, and formal verification
      form a default ordering of acceptance evidence that coverage can override, and every check is a bounded claim
      narrower than the task.
    Fixed workflow vs model-directed loop: A model-directed loop is justified only where open-ended evidence must
      be interpreted and it raises acceptance by more than it inflates attempt cost under the same contract and
      verifier.
    Side-effect classes: Authority levels A0 to A3 (read-only, disposable workspace, compensable, irreversible)
      classify an action by its consequence in the environment, and the same command can change class when the environment
      changes.
    Lighthouse workloads: The repair, research, remediation, and support agents each bind on a different constraint
      (compounding and resend, untrusted input and fan-out, blast radius and approval latency, tail latency and
      session state) and recur as the volume's running cases.
    Tool-wait problem: A trajectory that waits on a tool must decouple task lifetime from the serving allocation,
      or retained state occupies scarce memory while no tokens are produced.
    Outcome taxonomy: Every trajectory ends accepted, failed, unresolved, or escalated, budget exhaustion is unresolved
      rather than failure, and silent termination is a defect.
