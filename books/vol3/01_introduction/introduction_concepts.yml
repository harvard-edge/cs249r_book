      section: sec-vol3-intro-hsa
      aliases:
      - State exposure
    - id: vol3.authority
      label: Effect authority
      teaches: H·S·A exposures
      summary: The permitted reach of tool actions exposes resources to effects, including disclosure through
        read access.
      section: sec-vol3-intro-hsa
      aliases:
      - Authority exposure
    - id: vol3.closure
      label: Invariant closure
      teaches: Invariant closure
      summary: Runtime-enforced bounds and property-specific evidence constrain proposals; a plausible model
        response does not establish correctness.
      section: sec-vol3-intro-invariant-closure
    relationships:
    - id: vol3.field.trajectory.contract
      source: vol3.trajectory
      predicate: is governed by
      target: vol3.contract
      explanation: The task specification fixes the permitted effects and evidence required across the trajectory.
      conditions: The contract must be adopted before execution and cover the resources the task may affect.
      status: draft
      evidence:
        section: sec-vol3-intro-five-part-contract
        quote: Even with invariant closure in place, the runtime cannot enforce bounds or check completion
          against a bare instruction such as "repair the race condition." Left to that five-word prompt,
          a proposed patch can delete the lock altogether, passing a sequential regression check while worsening
          concurrency failures under production load. A cleanup step can likewise wipe out uncommitted source
          files in a shared repository alongside scratch build artifacts. Before an execution engine dispatches
          any action, it needs an explicit specification of what resources may be modified and what evidence
          is required to accept the result.[^fn-wiener-machine-purpose]
    - id: vol3.field.trajectory.horizon
      source: vol3.trajectory
      predicate: extends across
      target: vol3.horizon
      explanation: A model-directed loop stretches execution across decision turns, allowing errors to compound.
      conditions: Horizon counts turns; more turns do not imply better task completion.
      status: draft
      evidence:
        section: sec-vol3-intro-hsa
        quote: A single model call reads a static prompt, returns one completion, and leaves the outside
          world untouched. When a runtime instead stretches execution across dozens of turns, carries files
          and memory forward, and invokes tools that modify external systems, a single mistaken proposal
          can compound across steps, corrupt shared state, or trigger an irreversible outage. Sizing the
          runtime's defenses to a task therefore starts from the book's central runtime artifact, the **trajectory**,
          which records the complete sequence of steps the runtime must govern.
    - id: vol3.field.trajectory.state
      source: vol3.trajectory
      predicate: carries
      target: vol3.state
      explanation: Files and memory survive between model invocations in an acting loop.
      conditions: State exposure depends on the persistence and sharing of carried state.
      status: draft
      evidence:
