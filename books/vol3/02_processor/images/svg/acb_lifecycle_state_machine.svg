<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="440" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- ROW 1: FORWARD EXECUTION PATH (y = 80 to 142)                     -->
  <!-- ================================================================= -->
  <!-- 1. INITIALIZED -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="150" height="62" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0f172a">INITIALIZED</text>
    <text x="10" y="38" font-size="7.5" fill="#475569">• Alloc ACB &amp; UUIDv7</text>
    <text x="10" y="51" font-size="7.5" fill="#475569">• Verify Leases / TTL</text>
  </g>

  <!-- Arrow: INITIALIZED -> ACTIVE_PREFILL -->
  <path d="M190,111 L240,111" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="215" y="104" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">dispatch()</text>

  <!-- 2. ACTIVE_PREFILL -->
  <g transform="translate(240, 80)">
    <rect x="0" y="0" width="165" height="62" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">ACTIVE_PREFILL</text>
    <text x="10" y="38" font-size="7.5" fill="#334155">• Ingest Prompt Context</text>
    <text x="10" y="51" font-size="7.5" fill="#334155">• Compute-Bound GEMM</text>
  </g>

  <!-- Arrow: ACTIVE_PREFILL -> ACTIVE_DECODE -->
  <path d="M405,111 L455,111" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="430" y="104" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">first_token</text>

  <!-- 3. ACTIVE_DECODE -->
  <g transform="translate(455, 80)">
    <rect x="0" y="0" width="165" height="62" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">ACTIVE_DECODE</text>
    <text x="10" y="38" font-size="7.5" fill="#334155">• Autoregressive Step</text>
    <text x="10" y="51" font-size="7.5" fill="#334155">• Grammar Mask (DFA)</text>
  </g>

  <!-- Self-loop on ACTIVE_DECODE (Thought Generation) -->
  <path d="M525,80 C525,58 565,58 565,80" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="545" y="55" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#0369a1">emit_thought</text>

  <!-- Arrow: ACTIVE_DECODE -> TERMINATED (Success) -->
  <path d="M620,111 L670,111" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="645" y="104" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#15803d">goal_done</text>

  <!-- 4. TERMINATED (Terminal State) -->
  <g transform="translate(670, 80)">
    <rect x="0" y="0" width="170" height="62" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">TERMINATED</text>
    <text x="10" y="38" font-size="7.5" font-weight="700" fill="#16a34a">SUCCESS: Goal Verified</text>
    <text x="10" y="51" font-size="7.5" font-weight="700" fill="#b91c1c">ABORT: Fatal Quota / Invariant</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 2: SUSPENSION & RECOVERY (y = 200 to 268)                     -->
  <!-- ================================================================= -->
  <!-- 5. COMPENSATING_ROLLBACK -->
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="150" height="68" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#991b1b">COMPENSATING_ROLLBACK</text>
    <text x="10" y="38" font-size="7.5" fill="#7f1d1d">• Unwind Sagas LIFO</text>
    <text x="10" y="49" font-size="7.5" fill="#7f1d1d">• Execute Inverses C_k(s)</text>
    <text x="10" y="60" font-size="7.5" font-weight="700" fill="#dc2626">• Restore Safe Snapshot</text>
  </g>

  <!-- Arrow: COMPENSATING_ROLLBACK -> ACTIVE_PREFILL (Rollback Succeeded) -->
  <path d="M140,200 L140,152 L250,152 L250,142" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="190" y="147" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">rollback_ok</text>

  <!-- 6. SUSPENDED_TOOL_WAIT -->
  <g transform="translate(240, 200)">
    <rect x="0" y="0" width="165" height="68" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_TOOL_WAIT</text>
    <text x="10" y="38" font-size="7.5" fill="#78350f">• MicroVM / Sandbox Run</text>
    <text x="10" y="49" font-size="7.5" fill="#78350f">• If T_wait &lt; tau_swap: Pin HBM</text>
    <text x="10" y="60" font-size="7.5" font-weight="700" fill="#b91c1c">• If T_wait &gt;= tau_swap: Evict</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_TOOL_WAIT -->
  <path d="M480,142 L480,172 L370,172 L370,200" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="425" y="167" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#b45309">tool_call()</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> ACTIVE_PREFILL (Tool Return) -->
  <path d="M305,200 L305,142" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="297" y="172" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#15803d">tool_return(obs)</text>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> COMPENSATING_ROLLBACK (Invariant Failed) -->
  <path d="M240,234 L190,234" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="215" y="227" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">invariant_failed</text>

  <!-- 7. SUSPENDED_SWAPPED -->
  <g transform="translate(455, 200)">
    <rect x="0" y="0" width="165" height="68" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_SWAPPED</text>
    <text x="10" y="38" font-size="7.5" fill="#78350f">• KV Evicted to Host RAM</text>
    <text x="10" y="49" font-size="7.5" fill="#78350f">• HBM Freed for Other Jobs</text>
    <text x="10" y="60" font-size="7.5" fill="#64748b">• DMA Prefetch on Wake</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> SUSPENDED_SWAPPED -->
  <path d="M405,234 L455,234" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>
  <text x="430" y="227" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">dma_evict</text>

  <!-- Arrow: SUSPENDED_SWAPPED -> ACTIVE_PREFILL (DMA Prefetch) -->
  <path d="M520,200 L520,152 L390,152 L390,142" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="455" y="147" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#15803d">dma_prefetch(KV)</text>

  <!-- 8. SUSPENDED_HUMAN_GATE -->
  <g transform="translate(670, 200)">
    <rect x="0" y="0" width="170" height="68" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#b45309">SUSPENDED_HUMAN_GATE</text>
    <text x="10" y="38" font-size="7.5" fill="#78350f">• Reversibility Barrier Trap</text>
    <text x="10" y="49" font-size="7.5" fill="#78350f">• 100% KV Paged to NVMe</text>
    <text x="10" y="60" font-size="7.5" fill="#78350f">• Awaiting Signature / Token</text>
  </g>

  <!-- Arrow: ACTIVE_DECODE -> SUSPENDED_HUMAN_GATE -->
  <path d="M595,142 L595,172 L735,172 L735,200" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="665" y="167" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#b45309">escalate_privilege()</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> ACTIVE_PREFILL (Approval) -->
  <path d="M705,200 L705,182 L418,182 L418,135 L405,135" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="560" y="178" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#15803d">approved()</text>

  <!-- ================================================================= -->
  <!-- ROW 3: PERSISTENCE (y = 330 to 395)                               -->
  <!-- ================================================================= -->
  <!-- 9. CHECKPOINTING -->
  <g transform="translate(240, 330)">
    <rect x="0" y="0" width="165" height="65" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">CHECKPOINTING</text>
    <text x="10" y="38" font-size="7.5" fill="#475569">• WAL Fsync &amp; CoW Snapshot</text>
    <text x="10" y="49" font-size="7.5" fill="#475569">• Vector Clock &amp; Burn Update</text>
    <text x="10" y="60" font-size="7.5" fill="#475569">• Flush KV Delta to Staging</text>
  </g>

  <!-- Arrow: SUSPENDED_TOOL_WAIT -> CHECKPOINTING (Committed Step) -->
  <path d="M322,268 L322,330" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="330" y="302" font-family="Courier, monospace" font-size="7" fill="#6d28d9">step_commit</text>

  <!-- Arrow: CHECKPOINTING -> ACTIVE_PREFILL (Resume Next Step) -->
  <path d="M240,362 L215,362 L215,160 L275,160 L275,142" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="208" y="270" text-anchor="end" font-family="Courier, monospace" font-size="7" fill="#15803d">committed</text>

  <!-- Arrow: SUSPENDED_HUMAN_GATE -> COMPENSATING_ROLLBACK (Rejection via Lower Channel) -->
  <path d="M755,268 L755,420 L115,420 L115,268" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="450" y="415" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#991b1b">rejected()</text>

  <!-- Arrow: COMPENSATING_ROLLBACK -> TERMINATED (Fatal Abort via Outer Perimeter) -->
  <path d="M75,268 L75,440 L860,440 L860,111 L840,111" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="470" y="436" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#991b1b">rollback_exhausted (Fatal ABORT)</text>

</g>
</svg>