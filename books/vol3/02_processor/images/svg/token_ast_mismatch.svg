<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: DETERMINISTIC COMPILER PIPELINE                          -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="820" height="175" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="820" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">1. DETERMINISTIC COMPILER PIPELINE (Python Lexer &amp; AST Parser)</text>

    <!-- Source Input -->
    <g transform="translate(16, 36)">
      <rect width="180" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#64748b">SOURCE CODE STRING</text>
      <text x="8" y="32" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#0f172a">def get_user_id():</text>
    </g>

    <!-- Arrow to Lexer -->
    <path d="M 200,57 L 230,57" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Lexical Analysis -->
    <g transform="translate(235, 36)">
      <rect width="280" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#64748b">LEXICAL TOKENS (Deterministic Regex Grammar)</text>
      <text x="8" y="32" font-family="Courier New, monospace" font-size="8.5" fill="#0284c7">KEYWORD("def") IDENT("get_user_id") OP("():")</text>
    </g>

    <!-- Arrow to Parser -->
    <path d="M 520,57 L 550,57" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- AST Construction -->
    <g transform="translate(555, 36)">
      <rect width="250" height="42" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#15803d">ABSTRACT SYNTAX TREE (AST Node)</text>
      <text x="8" y="32" font-family="Courier New, monospace" font-size="8.5" font-weight="600" fill="#166534">FunctionDef(name="get_user_id")</text>
    </g>

    <!-- Systems Takeaway Banner Panel A -->
    <g transform="translate(16, 90)">
      <rect width="788" height="68" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#334155">Grammar Invariants in Classical Software:</text>
      <text x="12" y="34" font-size="8" fill="#64748b">• Indentation and whitespace are tracked deterministically via an INDENT/DEDENT lexical state machine.</text>
      <text x="12" y="48" font-size="8" fill="#64748b">• Keywords ('def', 'return') map to unambiguous grammar symbols; identifiers are preserved as atomic strings.</text>
      <text x="12" y="62" font-size="8" fill="#64748b">• Parsing fails cleanly at compile-time with exact line and column coordinates if syntax invariants are violated.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: STATISTICAL SUBWORD BPE PARTITIONING                     -->
  <!-- ================================================================= -->
  <g transform="translate(30, 215)">
    <rect width="820" height="245" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="820" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">2. STATISTICAL SUBWORD TOKENIZATION (Verified Byte-Pair Encoding: cl100k_base)</text>

    <!-- Case 1: Unindented Baseline -->
    <g transform="translate(16, 36)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#334155">Case 1: Baseline Function Definition (0 spaces):</text>
      <g transform="translate(0, 18)">
        <!-- Token 1 -->
        <rect x="0" y="0" width="55" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="27" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"def"</text>
        <text x="27" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 755</text>

        <!-- Token 2 -->
        <rect x="62" y="0" width="65" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="94" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">" get"</text>
        <text x="94" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 636</text>

        <!-- Token 3 -->
        <rect x="134" y="0" width="70" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="169" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_user"</text>
        <text x="169" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 3398</text>

        <!-- Token 4 -->
        <rect x="211" y="0" width="55" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="238" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_id"</text>
        <text x="238" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 851</text>

        <!-- Token 5 -->
        <rect x="273" y="0" width="55" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="300" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"():"</text>
        <text x="300" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 4658</text>

        <text x="345" y="17" font-size="8" font-weight="600" fill="#15803d">Total: 5 tokens (Keyword 'def' is isolated as token 755; identifier is split into 3 fragments)</text>
      </g>
    </g>

    <!-- Case 2: Indented with 2 spaces -->
    <g transform="translate(16, 92)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#334155">Case 2: Indented Function Definition (2 leading spaces):</text>
      <g transform="translate(0, 18)">
        <!-- Token 1 (space) -->
        <rect x="0" y="0" width="45" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="22" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">" "</text>
        <text x="22" y="22" font-size="7.5" fill="#b91c1c" text-anchor="middle">ID: 220</text>

        <!-- Token 2 (def with space) -->
        <rect x="52" y="0" width="65" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="84" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">" def"</text>
        <text x="84" y="22" font-size="7.5" fill="#b91c1c" text-anchor="middle">ID: 711</text>

        <!-- Token 3 -->
        <rect x="124" y="0" width="65" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="156" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">" get"</text>
        <text x="156" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 636</text>

        <!-- Token 4 -->
        <rect x="196" y="0" width="70" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="231" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_user"</text>
        <text x="231" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 3398</text>

        <!-- Token 5 -->
        <rect x="273" y="0" width="55" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="300" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_id"</text>
        <text x="300" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 851</text>

        <!-- Token 6 -->
        <rect x="335" y="0" width="55" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="362" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"():"</text>
        <text x="362" y="22" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 4658</text>

        <text x="405" y="17" font-size="8" font-weight="600" fill="#dc2626">Boundary Fracture: ' def' (711) != 'def' (755). Whitespace fuses into keyword token.</text>
      </g>
    </g>

    <!-- Case 3: Syntax Boundary Crossing -->
    <g transform="translate(16, 148)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#334155">Case 3: Structured Tool Call Syntax Crossing [edit_file(path="parser.py")]:</text>
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="48" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="24" y="12" font-family="Courier New, monospace" font-size="8" fill="#0f172a" text-anchor="middle">"edit"</text>
        <text x="24" y="20" font-size="7" fill="#64748b" text-anchor="middle">3671</text>

        <rect x="53" y="0" width="55" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="80" y="12" font-family="Courier New, monospace" font-size="8" fill="#0f172a" text-anchor="middle">"_file"</text>
        <text x="80" y="20" font-size="7" fill="#64748b" text-anchor="middle">2517</text>

        <rect x="113" y="0" width="60" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="143" y="12" font-family="Courier New, monospace" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">"(path"</text>
        <text x="143" y="20" font-size="7" fill="#b91c1c" text-anchor="middle">5698</text>

        <rect x="178" y="0" width="45" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="200" y="12" font-family="Courier New, monospace" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">"=\""</text>
        <text x="200" y="20" font-size="7" fill="#b91c1c" text-anchor="middle">429</text>

        <rect x="228" y="0" width="60" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="258" y="12" font-family="Courier New, monospace" font-size="8" fill="#0f172a" text-anchor="middle">"parser"</text>
        <text x="258" y="20" font-size="7" fill="#64748b" text-anchor="middle">9854</text>

        <rect x="293" y="0" width="45" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="315" y="12" font-family="Courier New, monospace" font-size="8" fill="#0f172a" text-anchor="middle">".py"</text>
        <text x="315" y="20" font-size="7" fill="#64748b" text-anchor="middle">7345</text>

        <rect x="343" y="0" width="45" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="365" y="12" font-family="Courier New, monospace" font-size="8" fill="#0f172a" text-anchor="middle">"\")"</text>
        <text x="365" y="20" font-size="7" fill="#64748b" text-anchor="middle">909</text>

        <text x="405" y="16" font-size="8" font-weight="600" fill="#dc2626">Syntax Fused: '(path' (5698) merges delimiter '(' with identifier; '="' (429) merges '=' with quote.</text>
      </g>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(16, 202)">
      <rect width="788" height="30" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="12" y="19" font-size="8.5" font-weight="600" fill="#b45309">Systems Reality: Neural models perceive sequences of statistical subword IDs, completely unaware of AST grammar or syntax delimiters.</text>
    </g>
  </g>
</svg>
