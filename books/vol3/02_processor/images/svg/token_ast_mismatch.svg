<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="680" height="440" fill="#ffffff" rx="4"/>

  <!-- ================================================================= -->
  <!-- PANEL A: Programmatic Syntax Specification (Compiler AST)         -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <!-- Container Card -->
    <rect width="620" height="180" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="620" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">1. Deterministic Programmatic Syntax (Abstract Syntax Tree)</text>

    <!-- Source Code Line Display -->
    <g transform="translate(16, 36)">
      <rect width="588" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-family="Courier New, monospace" font-size="9.5" font-weight="600" fill="#64748b">␣␣<tspan fill="#7c3aed">def</tspan> <tspan fill="#0284c7">get_user_id</tspan><tspan fill="#0f172a">():</tspan></text>
      <text x="440" y="20" font-size="8.5" font-weight="600" fill="#059669">✓ Deterministic Lexer Invariant</text>
    </g>

    <!-- AST Node Hierarchy -->
    <g transform="translate(16, 80)">
      <!-- INDENT Node -->
      <g transform="translate(10, 0)">
        <rect width="90" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="45" y="15" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">INDENT</text>
        <text x="45" y="28" font-family="Courier New, monospace" font-size="8.0" fill="#0284c7" text-anchor="middle">depth = 2</text>
      </g>

      <!-- Arrow -->
      <line x1="105" y1="18" x2="125" y2="18" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <!-- Keyword Node -->
      <g transform="translate(130, 0)">
        <rect width="90" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="45" y="15" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">KEYWORD</text>
        <text x="45" y="28" font-family="Courier New, monospace" font-size="8.0" fill="#0284c7" text-anchor="middle">'def'</text>
      </g>

      <!-- Arrow -->
      <line x1="225" y1="18" x2="245" y2="18" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <!-- Identifier Node -->
      <g transform="translate(250, 0)">
        <rect width="120" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="60" y="15" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">IDENTIFIER</text>
        <text x="60" y="28" font-family="Courier New, monospace" font-size="8.0" fill="#0284c7" text-anchor="middle">'get_user_id'</text>
      </g>

      <!-- Arrow -->
      <line x1="375" y1="18" x2="395" y2="18" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

      <!-- Signature Node -->
      <g transform="translate(400, 0)">
        <rect width="90" height="36" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="45" y="15" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">PARAMETERS</text>
        <text x="45" y="28" font-family="Courier New, monospace" font-size="8.0" fill="#0284c7" text-anchor="middle">[]</text>
      </g>

      <!-- Summary Pill -->
      <g transform="translate(10, 48)">
        <rect width="568" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
        <text x="12" y="16" font-size="8.5" font-weight="600" fill="#15803d">Grammar Contract: Tokens align exactly with AST syntax nodes; zero parameter capacity spent on reassembly.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: Statistical Subword Partitioning (Byte-Pair Encoding)    -->
  <!-- ================================================================= -->
  <g transform="translate(30, 218)">
    <!-- Container Card -->
    <rect width="620" height="202" rx="3" fill="#fff5f5" stroke="#fca5a5" stroke-width="1"/>
    <rect width="620" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">2. Statistical Subword Partitioning (BPE Greedy Merges)</text>

    <!-- Case 1: Unindented Baseline -->
    <g transform="translate(16, 34)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#334155">Case A: Baseline (Zero Indentation)</text>
      <g transform="translate(0, 18)">
        <!-- Token: def -->
        <rect x="0" y="0" width="60" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="30" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"def"</text>
        <text x="30" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 789</text>

        <!-- Token: get -->
        <rect x="68" y="0" width="65" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="100" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">" get"</text>
        <text x="100" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 1204</text>

        <!-- Token: _user -->
        <rect x="141" y="0" width="70" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="176" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_user"</text>
        <text x="176" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 3511</text>

        <!-- Token: _id -->
        <rect x="219" y="0" width="60" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="249" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_id"</text>
        <text x="249" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 4410</text>

        <!-- Token: (): -->
        <rect x="287" y="0" width="55" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="314" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"():"</text>
        <text x="314" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 2105</text>

        <text x="360" y="17" font-size="8.0" fill="#64748b">Intact keyword boundary: 'def' maps to single vocabulary entry</text>
      </g>
    </g>

    <!-- Case 2: Indented 2 Spaces -->
    <g transform="translate(16, 92)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#b91c1c">Case B: Shifted Prefix (2 Leading Spaces: "  def get_user_id():")</text>
      <g transform="translate(0, 18)">
        <!-- Token: space -->
        <rect x="0" y="0" width="40" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="20" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">" "</text>
        <text x="20" y="22" font-size="7.0" fill="#b91c1c" text-anchor="middle">ID: 220</text>

        <!-- Fractured Token 1: " d" -->
        <rect x="48" y="0" width="52" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="74" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">" d"</text>
        <text x="74" y="22" font-size="7.0" fill="#dc2626" text-anchor="middle">ID: 312</text>

        <!-- Fractured Token 2: "ef" -->
        <rect x="108" y="0" width="52" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="134" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">"ef"</text>
        <text x="134" y="22" font-size="7.0" fill="#dc2626" text-anchor="middle">ID: 415</text>

        <!-- Bracket highlighting fracture -->
        <path d="M 48 30 L 48 35 L 160 35 L 160 30" fill="none" stroke="#dc2626" stroke-width="1"/>
        <text x="104" y="44" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">Fractured Keyword 'def'</text>

        <!-- Token: get -->
        <rect x="168" y="0" width="65" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="200" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">" get"</text>
        <text x="200" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 1204</text>

        <!-- Token: _user -->
        <rect x="241" y="0" width="70" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="276" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_user"</text>
        <text x="276" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 3511</text>

        <!-- Token: _id -->
        <rect x="319" y="0" width="60" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="349" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"_id"</text>
        <text x="349" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 4410</text>

        <!-- Token: (): -->
        <rect x="387" y="0" width="55" height="26" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="414" y="13" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">"():"</text>
        <text x="414" y="22" font-size="7.0" fill="#64748b" text-anchor="middle">ID: 2105</text>
      </g>
    </g>

    <!-- Systems Overhead Callout Box -->
    <g transform="translate(16, 160)">
      <rect width="588" height="30" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="15" font-size="8.0" font-weight="700" fill="#b91c1c">Systems Capacity Tax:</text>
      <text x="118" y="15" font-size="8.0" fill="#7f1d1d">Leading whitespace mutation changes merge priorities, fracturing language keywords.</text>
      <text x="12" y="25" font-size="8.0" fill="#7f1d1d">Early self-attention layers must expend representational capacity on lexical reassembly prior to semantic evaluation.</text>
    </g>
  </g>
</svg>
