<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: Compiler AST (Syntactic Invariance Under Whitespace)       -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="820" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="820" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="820" height="10" y="16" fill="#f1f5f9"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#0f172a">1  Compiler lexer and AST</text>

    <!-- Code Examples Display -->
    <g transform="translate(16, 36)">
      <!-- Unindented Source -->
      <rect width="385" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="19" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" fill="#0f172a"><tspan fill="#7c3aed" font-weight="700">def</tspan> <tspan fill="#0284c7">get_user_id</tspan>():</text>
      <text x="375" y="19" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">Module Scope (0 spaces)</text>

      <!-- Indented Source -->
      <g transform="translate(403, 0)">
        <rect width="385" height="30" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="19" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" fill="#0f172a"><tspan fill="#94a3b8">␣␣␣␣</tspan><tspan fill="#7c3aed" font-weight="700">def</tspan> <tspan fill="#0284c7">get_user_id</tspan>():</text>
        <text x="375" y="19" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">Class Method (4 spaces)</text>
      </g>
    </g>

    <!-- AST Node Pipeline -->
    <g transform="translate(16, 78)">
      <rect width="788" height="58" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8" font-weight="700" fill="#475569">AST SYNTACTIC NODES (Invariant representation for both declarations):</text>

      <!-- Node: INDENT (Scope) -->
      <g transform="translate(14, 24)">
        <rect width="130" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="65" y="16" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">BLOCK_SCOPE (Indent)</text>
      </g>

      <line x1="148" y1="36" x2="168" y2="36" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Node: KEYWORD -->
      <g transform="translate(172, 24)">
        <rect width="130" height="24" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="65" y="16" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">KEYWORD: 'def'</text>
      </g>

      <line x1="306" y1="36" x2="326" y2="36" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Node: IDENTIFIER -->
      <g transform="translate(330, 24)">
        <rect width="180" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="90" y="16" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">IDENTIFIER: 'get_user_id'</text>
      </g>

      <line x1="514" y1="36" x2="534" y2="36" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Node: PARAMETERS -->
      <g transform="translate(538, 24)">
        <rect width="115" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="57" y="16" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">PARAMETERS: ()</text>
      </g>

      <line x1="657" y1="36" x2="677" y2="36" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-slate)"/>

      <!-- Node: COLON -->
      <g transform="translate(681, 24)">
        <rect width="90" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="45" y="16" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">COLON: ':'</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: Subword BPE Tokenization & Embedding Disconnect          -->
  <!-- ================================================================= -->
  <g transform="translate(30, 185)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="820" height="225" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="820" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="820" height="10" y="16" fill="#f1f5f9"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#0f172a">2  Subword BPE (cl100k_base)</text>

    <!-- Case A: Unindented Baseline -->
    <g transform="translate(16, 32)">
      <text x="0" y="11" font-size="8.5" font-weight="700" fill="#15803d">Case A: Module Scope (Zero Indentation) → 5 Tokens</text>
      <g transform="translate(0, 16)">
        <!-- Token: def (755) -->
        <rect x="0" y="0" width="82" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="41" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">"def"</text>
        <text x="41" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#166534" text-anchor="middle">ID: 755</text>

        <!-- Token:  get (1146) -->
        <rect x="88" y="0" width="85" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="130" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">" get"</text>
        <text x="130" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 1146</text>

        <!-- Token: _user (3110) -->
        <rect x="179" y="0" width="90" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="224" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">"_user"</text>
        <text x="224" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 3110</text>

        <!-- Token: _id (482) -->
        <rect x="275" y="0" width="80" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="315" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">"_id"</text>
        <text x="315" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 482</text>

        <!-- Token: (): (3341) -->
        <rect x="361" y="0" width="75" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="398" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">"():"</text>
        <text x="398" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 3341</text>
      </g>
    </g>

    <!-- Case B: Indented 4 Spaces -->
    <g transform="translate(16, 104)">
      <text x="0" y="11" font-size="8.5" font-weight="700" fill="#991b1b">Case B: Class Scope (4 Leading Spaces: '<tspan fill="#94a3b8">␣␣␣␣</tspan>def get_user_id():') → 6 Tokens</text>
      <g transform="translate(0, 16)">
        <!-- Token: 4 spaces (262) -->
        <rect x="0" y="0" width="80" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="40" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">"    "</text>
        <text x="40" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#b91c1c" text-anchor="middle">ID: 262</text>

        <!-- Fractured Keyword: def (711) -->
        <rect x="86" y="0" width="82" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="127" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">"def"</text>
        <text x="127" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" font-weight="700" fill="#b91c1c" text-anchor="middle">ID: 711</text>

        <!-- Token:  get (1146) -->
        <rect x="174" y="0" width="85" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="216" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">" get"</text>
        <text x="216" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 1146</text>

        <!-- Token: _user (3110) -->
        <rect x="265" y="0" width="90" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="310" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">"_user"</text>
        <text x="310" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 3110</text>

        <!-- Token: _id (482) -->
        <rect x="361" y="0" width="80" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="401" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">"_id"</text>
        <text x="401" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 482</text>

        <!-- Token: (): (3341) -->
        <rect x="447" y="0" width="75" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="484" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">"():"</text>
        <text x="484" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#64748b" text-anchor="middle">ID: 3341</text>
      </g>
    </g>

    <!-- RIGHT SUB-PANEL: Physical Accelerator Memory Disconnect -->
    <g transform="translate(545, 32)">
      <rect width="259" height="178" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="259" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Accelerator Memory (W_embed)</text>

      <!-- Row 755 (Unindented def) -->
      <g transform="translate(12, 28)">
        <rect width="235" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="8" y="17" font-family="'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="700" fill="#14532d">Row 755: [e_1, e_2, ...]</text>
        <text x="227" y="17" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="end">"def" (unindented)</text>
      </g>

      <!-- Ellipsis -->
      <text x="129" y="66" font-size="8.5" fill="#64748b" text-anchor="middle">⋮ (44 rows of unrelated vocabulary weights)</text>

      <!-- Row 711 (Indented def) -->
      <g transform="translate(12, 74)">
        <rect width="235" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
        <text x="8" y="17" font-family="'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="700" fill="#991b1b">Row 711: [e_1, e_2, ...]</text>
        <text x="227" y="17" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#dc2626" text-anchor="end">"def" (indented)</text>
      </g>

      <!-- Row 262 (4 spaces) -->
      <g transform="translate(12, 105)">
        <rect width="235" height="22" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b">Row 262: [e_1, e_2, ...]</text>
        <text x="227" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b" text-anchor="end">"    " (4 spaces)</text>
      </g>

      <!-- Systems Disconnect Callout -->
      <g transform="translate(12, 142)">
        <text x="0" y="12" font-size="8" font-weight="700" fill="#b91c1c">Row 755 ∩ Row 711 = ∅</text>
        <text x="0" y="24" font-size="7.5" fill="#64748b">Disjoint memory addresses; zero shared weights</text>
      </g>
    </g>

    <!-- Connective lines routed through clear horizontal channels -->
    <!-- Route 1: From Token 755 (x=57, y=80 in Panel B) to Row 755 (x=545, y=73 in Panel B) -->
    <path d="M 57,80 L 57,92 L 536,92 L 536,73 L 545,73" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr-emerald)"/>

    <!-- Route 2: From Token 711 (x=143, y=152 in Panel B) to Row 711 (x=545, y=119 in Panel B) -->
    <path d="M 143,152 L 143,168 L 536,168 L 536,119 L 545,119" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-crimson)"/>
  </g>
</svg>
