<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <filter id="panel-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <linearGradient id="header-draft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="header-target" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="header-verify" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" letter-spacing="0.5">TWO-TIER SPECULATIVE DECODING: DRAFT, PARALLEL VERIFY, AND KV ROLLBACK</text>
  </g>

  <!-- PANEL 1: Draft Proposal (Left) -->
  <g transform="translate(24, 64)">
    <rect width="270" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#panel-shadow)" />
    <rect width="270" height="36" rx="2" fill="url(#header-draft)" />
    <line x1="0" y1="36" x2="270" y2="36" stroke="#BFDBFE" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1E40AF">1. Sequential Draft Proposal</text>

    <!-- Context Box -->
    <g transform="translate(14, 48)">
      <rect width="242" height="38" rx="2" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#475569">Committed Prefix Context (x_1:t)</text>
      <text x="10" y="30" font-family="monospace" font-size="7.5" fill="#0F172A">"def execute_query(db, sql):"</text>
    </g>

    <!-- Draft Model Spec -->
    <g transform="translate(14, 96)">
      <rect width="242" height="74" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8">Draft Engine M_q (e.g., 1B–3B)</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Latency ratio c = T_q / T_p ≈ 0.08–0.12</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Generates K candidate tokens sequentially</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Low memory footprint: Fits in GPU SRAM/L2</text>
    </g>

    <!-- Draft Token Sequence -->
    <g transform="translate(14, 180)">
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Speculative Sequence (K = 4):</text>
      
      <!-- Token 1 -->
      <g transform="translate(0, 22)">
        <rect width="242" height="36" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
        <text x="10" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#1E40AF">x̃_1: "cursor"</text>
        <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Draft prob: q_1 = 0.94</text>
      </g>
      <!-- Token 2 -->
      <g transform="translate(0, 64)">
        <rect width="242" height="36" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
        <text x="10" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#1E40AF">x̃_2: " ="</text>
        <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Draft prob: q_2 = 0.98</text>
      </g>
      <!-- Token 3 -->
      <g transform="translate(0, 106)">
        <rect width="242" height="36" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
        <text x="10" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#1E40AF">x̃_3: " db.cursor"</text>
        <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Draft prob: q_3 = 0.89</text>
      </g>
      <!-- Token 4 -->
      <g transform="translate(0, 148)">
        <rect width="242" height="36" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
        <text x="10" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#1E40AF">x̃_4: "()"</text>
        <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Draft prob: q_4 = 0.82</text>
      </g>
    </g>
  </g>

  <!-- PANEL 2: Target Parallel Verification (Middle) -->
  <g transform="translate(310, 64)">
    <rect width="320" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#panel-shadow)" />
    <rect width="320" height="36" rx="2" fill="url(#header-target)" />
    <line x1="0" y1="36" x2="320" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#581C87">2. Parallel Target Scoring (M_p)</text>

    <!-- Target Engine Spec -->
    <g transform="translate(14, 48)">
      <rect width="292" height="66" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#6B21A8">Target Processor M_p (70B Dense / MoE)</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Single batched forward pass evaluates all K tokens</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Transforms GEMV memory-wall into batched compute</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Emits K+1 logit distributions p(·|x_&lt;k) in parallel</text>
    </g>

    <!-- Verification Matrix Comparison -->
    <g transform="translate(14, 126)">
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Acceptance Test: α_k = min(1, p_k / q_k)</text>

      <!-- Row 1: Accept -->
      <g transform="translate(0, 22)">
        <rect width="292" height="46" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
        <text x="8" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#166534">k=1: x̃_1 ("cursor")</text>
        <text x="8" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">p_1 = 0.96 | q_1 = 0.94 ⇒ α_1 = 1.00</text>
        <rect x="220" y="12" width="62" height="22" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
        <text x="251" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">ACCEPTED</text>
      </g>

      <!-- Row 2: Accept -->
      <g transform="translate(0, 74)">
        <rect width="292" height="46" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
        <text x="8" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#166534">k=2: x̃_2 (" =")</text>
        <text x="8" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">p_2 = 0.99 | q_2 = 0.98 ⇒ α_2 = 1.00</text>
        <rect x="220" y="12" width="62" height="22" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
        <text x="251" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">ACCEPTED</text>
      </g>

      <!-- Row 3: Rejection Triggered! -->
      <g transform="translate(0, 126)">
        <rect width="292" height="52" rx="2" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" />
        <text x="8" y="16" font-family="monospace" font-size="8" font-weight="700" fill="#991B1B">k=3: x̃_3 (" db.cursor")</text>
        <text x="8" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">p_3 = 0.21 | q_3 = 0.89 ⇒ α_3 = 0.236</text>
        <text x="8" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#DC2626">Random draw u=0.45 &gt; α_3 ⇒ REJECTED</text>
        <rect x="220" y="14" width="62" height="22" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />
        <text x="251" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#B91C1C" text-anchor="middle">REJECTED</text>
      </g>

      <!-- Row 4: Discarded Tail -->
      <g transform="translate(0, 184)">
        <rect width="292" height="34" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />
        <text x="8" y="16" font-family="monospace" font-size="8" fill="#94A3B8">k=4: x̃_4 ("()") [SKIPPED]</text>
        <text x="8" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#94A3B8">Untested due to upstream rejection at k=3</text>
      </g>
    </g>
  </g>

  <!-- PANEL 3: KV Cache Commit & Rollback (Right) -->
  <g transform="translate(646, 64)">
    <rect width="290" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#panel-shadow)" />
    <rect width="290" height="36" rx="2" fill="url(#header-verify)" />
    <line x1="0" y1="36" x2="290" y2="36" stroke="#BBF7D0" stroke-width="1" />
    <text x="14" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#166534">3. Rollback &amp; Residual Commit</text>

    <!-- Residual Sampling Box -->
    <g transform="translate(14, 48)">
      <rect width="262" height="84" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#15803D">Residual Correction Sampling</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• On rejection, sample from residual distribution:</text>
      <text x="18" y="44" font-family="monospace" font-size="7.5" fill="#166534">p_res(v) = norm(max(0, p(v) - q(v)))</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Guarantees target distribution invariance</text>
      <text x="10" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#047857">Correction token sampled: " conn.cursor"</text>
    </g>

    <!-- KV Cache Memory State -->
    <g transform="translate(14, 142)">
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">KV-Cache Physical Allocation:</text>

      <!-- Slot 1: Committed -->
      <rect x="0" y="22" width="262" height="24" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
      <text x="10" y="37" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803D">Slot t+1: x̃_1 ("cursor") [COMMITTED]</text>

      <!-- Slot 2: Committed -->
      <rect x="0" y="52" width="262" height="24" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
      <text x="10" y="67" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803D">Slot t+2: x̃_2 (" =") [COMMITTED]</text>

      <!-- Slot 3: Corrected -->
      <rect x="0" y="82" width="262" height="24" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
      <text x="10" y="97" font-family="monospace" font-size="7.5" font-weight="700" fill="#92400E">Slot t+3: x_corr (" conn.cursor") [CORRECTED]</text>

      <!-- Slot 4: Invalidated -->
      <rect x="0" y="112" width="262" height="24" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3" />
      <text x="10" y="127" font-family="monospace" font-size="7.5" fill="#991B1B">Slot t+4: x̃_4 [INVALIDATED &amp; FREED]</text>
    </g>

    <!-- Round Summary Badge -->
    <g transform="translate(14, 290)">
      <rect width="262" height="66" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Round Output &amp; Speedup Metrics:</text>
      <text x="10" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Accepted Tokens: 2 draft + 1 correction = 3 tokens</text>
      <text x="10" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#334155">• Target Forward Passes: 1 (vs. 3 passes in standard decode)</text>
      <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#16A34A">• Effective Step Speedup: ρ ≈ 2.14×</text>
    </g>
  </g>

  <!-- Bottom Architectural Takeaway Bar -->
  <g transform="translate(24, 466)">
    <rect width="912" height="48" rx="2" fill="#0F172A" />
    <text x="16" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38BDF8">ARCHITECTURAL PRINCIPLE: MATHEMATICAL DISTRIBUTION EQUIVALENCE VIA SPECULATIVE REJECTION</text>
    <text x="16" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#E2E8F0">Speculative decoding converts idle GPU memory bandwidth into token generation speedup without altering the target model's output distribution.</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#E2E8F0">When draft proposals are rejected, the runtime truncates the speculative KV-cache tail in physical HBM and samples from the residual distribution, maintaining bit-exact mathematical fidelity.</text>
  </g>
</svg>
