<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">TWO-TIER SPECULATIVE DECODING: DRAFT, PARALLEL VERIFY, AND KV ROLLBACK</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Trading idle compute for lower latency through draft speculation, parallel target scoring, and residual sampling</text>

  <!-- ================================================================= -->
  <!-- PANEL 1: Draft Proposal (Left Column)                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect width="275" height="350" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect width="275" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">1. Sequential Draft Proposal</text>

    <!-- Context Box -->
    <g transform="translate(12, 34)">
      <rect width="251" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8" font-weight="700" fill="#475569">Committed Prefix Context (x_1:t)</text>
      <text x="10" y="28" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">"def execute_query(db, sql):"</text>
    </g>

    <!-- Draft Model Spec -->
    <g transform="translate(12, 80)">
      <rect width="251" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">Draft Engine M_q (e.g., 1B–3B)</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">• Latency ratio c = T_q / T_p ≈ 0.08–0.12</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Generates K candidate tokens sequentially</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">• Low memory footprint: Fits in GPU SRAM/L2</text>
    </g>

    <!-- Draft Token Sequence -->
    <g transform="translate(12, 162)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Speculative Sequence (K = 4):</text>
      
      <!-- Token 1 -->
      <g transform="translate(0, 18)">
        <rect width="251" height="36" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="10" y="15" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#0369a1">x̃_1: "cursor"</text>
        <text x="10" y="27" font-size="7" fill="#64748b">Draft prob: q_1 = 0.94</text>
      </g>
      <!-- Token 2 -->
      <g transform="translate(0, 58)">
        <rect width="251" height="36" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="10" y="15" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#0369a1">x̃_2: " ="</text>
        <text x="10" y="27" font-size="7" fill="#64748b">Draft prob: q_2 = 0.98</text>
      </g>
      <!-- Token 3 -->
      <g transform="translate(0, 98)">
        <rect width="251" height="36" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="10" y="15" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#0369a1">x̃_3: " db.cursor"</text>
        <text x="10" y="27" font-size="7" fill="#64748b">Draft prob: q_3 = 0.89</text>
      </g>
      <!-- Token 4 -->
      <g transform="translate(0, 138)">
        <rect width="251" height="36" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="10" y="15" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#0369a1">x̃_4: "()"</text>
        <text x="10" y="27" font-size="7" fill="#64748b">Draft prob: q_4 = 0.82</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: Target Parallel Verification (Middle Column)             -->
  <!-- ================================================================= -->
  <g transform="translate(330, 75)">
    <rect width="315" height="350" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <rect width="315" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">2. Parallel Target Scoring (M_p)</text>

    <!-- Target Engine Spec -->
    <g transform="translate(12, 34)">
      <rect width="291" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">Target Processor M_p (70B Dense / MoE)</text>
      <text x="10" y="28" font-size="7.5" fill="#334155">• Single batched forward pass evaluates all K tokens</text>
      <text x="10" y="42" font-size="7.5" fill="#334155">• Transforms GEMV memory-wall into batched compute</text>
      <text x="10" y="56" font-size="7.5" fill="#334155">• Emits K+1 logit distributions p(·|x_&lt;k) in parallel</text>
    </g>

    <!-- Verification Matrix Comparison -->
    <g transform="translate(12, 108)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">Acceptance Test: α_k = min(1, p_k / q_k)</text>

      <!-- Row 1: Accept -->
      <g transform="translate(0, 18)">
        <rect width="291" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <text x="8" y="16" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">k=1: x̃_1 ("cursor")</text>
        <text x="8" y="30" font-size="7" fill="#334155">p_1 = 0.96 | q_1 = 0.94 ⇒ α_1 = 1.00</text>
        <rect x="220" y="12" width="63" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
        <text x="251" y="26" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">ACCEPTED</text>
      </g>

      <!-- Row 2: Accept -->
      <g transform="translate(0, 70)">
        <rect width="291" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <text x="8" y="16" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">k=2: x̃_2 (" =")</text>
        <text x="8" y="30" font-size="7" fill="#334155">p_2 = 0.99 | q_2 = 0.98 ⇒ α_2 = 1.00</text>
        <rect x="220" y="12" width="63" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
        <text x="251" y="26" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">ACCEPTED</text>
      </g>

      <!-- Row 3: Rejection Triggered -->
      <g transform="translate(0, 122)">
        <rect width="291" height="52" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
        <text x="8" y="16" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#991b1b">k=3: x̃_3 (" db.cursor")</text>
        <text x="8" y="28" font-size="7" fill="#334155">p_3 = 0.21 | q_3 = 0.89 ⇒ α_3 = 0.236</text>
        <text x="8" y="42" font-size="7" font-weight="700" fill="#dc2626">Random draw u=0.45 &gt; α_3 ⇒ REJECTED</text>
        <rect x="220" y="14" width="63" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
        <text x="251" y="28" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">REJECTED</text>
      </g>

      <!-- Row 4: Discarded Tail -->
      <g transform="translate(0, 180)">
        <rect width="291" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
        <text x="8" y="15" font-family="Courier, monospace" font-size="7.5" fill="#94a3b8">k=4: x̃_4 ("()") [SKIPPED]</text>
        <text x="8" y="26" font-size="6.5" fill="#94a3b8">Untested due to upstream rejection at k=3</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 3: KV Cache Commit & Rollback (Right Column)                -->
  <!-- ================================================================= -->
  <g transform="translate(660, 75)">
    <rect width="260" height="350" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <rect width="260" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. Rollback &amp; Residual Commit</text>

    <!-- Residual Sampling Box -->
    <g transform="translate(12, 34)">
      <rect width="236" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">Residual Correction Sampling</text>
      <text x="10" y="29" font-size="7.5" fill="#334155">• On rejection, sample from residual:</text>
      <text x="18" y="43" font-family="Courier, monospace" font-size="7.5" fill="#15803d">p_res(v) = norm(max(0, p - q))</text>
      <text x="10" y="57" font-size="7.5" fill="#334155">• Guarantees exact target fidelity</text>
      <text x="10" y="71" font-size="7.5" font-weight="700" fill="#15803d">Sampled: " conn.cursor"</text>
    </g>

    <!-- KV Cache Memory State -->
    <g transform="translate(12, 126)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#0f172a">KV-Cache Physical Allocation:</text>

      <!-- Slot 1: Committed -->
      <rect x="0" y="18" width="236" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8" />
      <text x="8" y="32" font-family="Courier, monospace" font-size="7" font-weight="700" fill="#15803d">Slot t+1: x̃_1 ("cursor") [COMMITTED]</text>

      <!-- Slot 2: Committed -->
      <rect x="0" y="44" width="236" height="22" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8" />
      <text x="8" y="58" font-family="Courier, monospace" font-size="7" font-weight="700" fill="#15803d">Slot t+2: x̃_2 (" =") [COMMITTED]</text>

      <!-- Slot 3: Corrected -->
      <rect x="0" y="70" width="236" height="22" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8" />
      <text x="8" y="84" font-family="Courier, monospace" font-size="7" font-weight="700" fill="#b45309">Slot t+3: x_corr (" conn.") [CORRECTED]</text>

      <!-- Slot 4: Invalidated -->
      <rect x="0" y="96" width="236" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="3 3" />
      <text x="8" y="110" font-family="Courier, monospace" font-size="7" fill="#991b1b">Slot t+4: x̃_4 [INVALIDATED &amp; FREED]</text>
    </g>

    <!-- Round Summary Badge -->
    <g transform="translate(12, 260)">
      <rect width="236" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Round Metrics &amp; Speedup:</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">• Accepted Tokens: 2 draft + 1 corr = 3 tok</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Target Forward Passes: 1 (vs. 3 passes)</text>
      <text x="10" y="58" font-size="7.5" font-weight="700" fill="#16a34a">• Effective Step Speedup: ρ ≈ 2.14×</text>
      <text x="10" y="70" font-size="7" fill="#64748b">• KV tail truncated outside context window</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM ARCHITECTURAL PRINCIPLE BANNER                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 436)">
    <rect width="880" height="66" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect x="12" y="12" width="80" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="52" y="28" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">SYSTEMS</text>
    <text x="52" y="42" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">PRINCIPLE</text>
    <text x="106" y="28" font-size="9.5" font-weight="700" fill="#0f172a">Mathematical Distribution Equivalence via Speculative Rejection Sampling</text>
    <text x="106" y="44" font-size="8" fill="#475569">Speculative decoding converts idle GPU memory bandwidth into token generation speedup without altering the target model's output distribution. When draft proposals are rejected, the runtime truncates the speculative KV-cache tail in physical HBM and samples from the residual distribution, maintaining bit-exact mathematical fidelity.</text>
  </g>
</svg>
