<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="opt1-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6B21A8" flood-opacity="0.35"/>
    </filter>
    <filter id="opt1-node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean card background -->
  <rect width="500" height="380" fill="#ffffff" rx="14" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Interior Cross-Diagonals (H-A and C-S) -->
  <line x1="250" y1="95" x2="250" y2="285"
        stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="130" y1="190" x2="370" y2="190"
        stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Inactive Perimeter Edges -->
  <line x1="370" y1="190" x2="250" y2="285"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="285" x2="130" y2="190"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="190" x2="250" y2="95"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- Active Perimeter Edge: H <-> S (Memory Shuttle & Working Set) -->
  <line x1="250" y1="95" x2="370" y2="190"
        stroke="#6B21A8" stroke-width="4.5" stroke-linecap="round" filter="url(#opt1-glow)"/>
  <line x1="250" y1="95" x2="370" y2="190"
        stroke="#ffffff" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Inactive Nodes: S, A, C -->
  <g transform="translate(370, 190)">
    <circle cx="0" cy="0" r="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#opt1-node-shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">S</text>
  </g>

  <g transform="translate(250, 285)">
    <circle cx="0" cy="0" r="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#opt1-node-shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#64748B">A</text>
  </g>

  <g transform="translate(130, 190)">
    <circle cx="0" cy="0" r="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#opt1-node-shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#64748B">C</text>
  </g>

  <!-- Active Node: [H] Horizon -->
  <g transform="translate(250, 95)">
    <circle cx="0" cy="0" r="30" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="23" fill="#6B21A8" stroke="#ffffff" stroke-width="2.5" filter="url(#opt1-glow)"/>
    <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">H</text>
  </g>

  <!-- Center Active Focus Badge -->
  <g transform="translate(250, 190)">
    <rect x="-64" y="-13" width="128" height="26" rx="13" fill="#FAF5FF" stroke="#6B21A8" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3B0764">Ch 02: H = 1 Envelope</text>
  </g>

  <!-- ALL 4 LABELS WITH CLEAN BRACKET NOTATION -->
  <!-- Top: [H] Horizon (Active) -->
  <g transform="translate(250, 24)">
    <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="800" fill="#3B0764">[H] Horizon</text>
    <text x="0" y="26" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B21A8">Active: H = 1 Invocation</text>
  </g>

  <!-- Right: [S] State -->
  <g transform="translate(404, 182)">
    <text x="0" y="0" text-anchor="start" font-size="14" font-weight="800" fill="#0F172A">[S] State</text>
    <text x="0" y="15" text-anchor="start" font-size="10.5" font-weight="600" fill="#64748B">Staged Context</text>
    <text x="0" y="27" text-anchor="start" font-size="9.5" fill="#94A3B8">Ephemeral KV Cache</text>
  </g>

  <!-- Bottom: [A] Authority -->
  <g transform="translate(250, 324)">
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">[A] Authority</text>
    <text x="0" y="15" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">A = 0 (Unprivileged)</text>
    <text x="0" y="27" text-anchor="middle" font-size="9.5" fill="#94A3B8">Zero ambient mutation</text>
  </g>

  <!-- Left: [C] Closure (Explicitly [C]) -->
  <g transform="translate(96, 182)">
    <text x="0" y="0" text-anchor="end" font-size="14" font-weight="800" fill="#0F172A">[C] Closure</text>
    <text x="0" y="15" text-anchor="end" font-size="10.5" font-weight="600" fill="#64748B">External Loop</text>
    <text x="0" y="27" text-anchor="end" font-size="9.5" fill="#94A3B8">Runtime verification</text>
  </g>

</svg>
