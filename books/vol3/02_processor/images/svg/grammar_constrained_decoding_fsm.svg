<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 960 500" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 960 500" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- SECTION 1: Ahead-of-Time Grammar Compilation (Left Column)        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect width="270" height="350" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <rect width="270" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. Ahead-of-Time Grammar Compilation</text>

    <!-- Pydantic / Schema Box -->
    <g transform="translate(12, 34)">
      <rect width="246" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#0369a1">Pydantic Tool Schema</text>
      <text x="10" y="29" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">class SQLQuery(BaseModel):</text>
      <text x="20" y="43" font-family="Courier, monospace" font-size="8.0" fill="#334155">query: str = Field(min_length=1)</text>
      <text x="20" y="57" font-family="Courier, monospace" font-size="8.0" fill="#334155">limit: int = Field(ge=1, le=500)</text>
      <text x="20" y="71" font-family="Courier, monospace" font-size="8.0" fill="#7c3aed">timeout_s: float = 30.0</text>
    </g>

    <!-- FSM Compiler Box -->
    <g transform="translate(12, 126)">
      <rect width="246" height="110" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">Regex &amp; DFA State Construction</text>
      <text x="10" y="30" font-size="8.0" fill="#334155">• Converts JSON grammar to regular regex</text>
      <text x="10" y="42" font-size="8.0" fill="#334155">• Constructs DFA: Q = {q0, q1, ..., qK}</text>
      <text x="10" y="54" font-size="8.0" fill="#334155">• Identifies valid token transitions δ(q, v)</text>
      
      <!-- Mini DFA Visual -->
      <g transform="translate(18, 62)">
        <circle cx="20" cy="18" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
        <text x="20" y="22" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">q0</text>
        <line x1="33" y1="18" x2="68" y2="18" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)" />
        <text x="50" y="12" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9" text-anchor="middle">"{"</text>

        <circle cx="82" cy="18" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
        <text x="82" y="22" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">q1</text>
        <line x1="95" y1="18" x2="130" y2="18" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)" />
        <text x="112" y="12" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9" text-anchor="middle">"sql"</text>

        <circle cx="145" cy="18" r="13" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
        <circle cx="145" cy="18" r="10" fill="none" stroke="#6d28d9" stroke-width="1" />
        <text x="145" y="22" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">qF</text>
      </g>
    </g>

    <!-- Tokenizer Index Table -->
    <g transform="translate(12, 244)">
      <rect width="246" height="94" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Precomputed Vocabulary Index</text>
      <text x="10" y="30" font-size="8.0" fill="#64748b">For each state q, precomputes bitmask:</text>
      <rect x="10" y="38" width="226" height="24" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="18" y="53" font-family="Courier, monospace" font-size="8" font-weight="600" fill="#0f172a">Bitmask[q] = [1, 0, 0, 1, 1, 0, ...]</text>
      <text x="10" y="78" font-size="8.0" fill="#15803d">✓ Memory footprint: O(|Q| · |V| / 8) ~ few MBs</text>
    </g>
  </g>

  <!-- Flow Arrow from Section 1 to Section 2 -->
  <line x1="310" y1="235" x2="328" y2="235" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- ================================================================= -->
  <!-- SECTION 2: Online Autoregressive GPU Decoding (Middle Column)     -->
  <!-- ================================================================= -->
  <g transform="translate(330, 75)">
    <rect width="320" height="350" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect width="320" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. Real-Time GPU Logit Masking Kernel</text>

    <!-- Raw Logits from LM Head -->
    <g transform="translate(12, 34)">
      <rect width="296" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Transformer Forward Pass Output</text>
      <text x="10" y="27" font-size="8.0" fill="#64748b">Unconstrained logits from LM projection head z_t:</text>
      
      <!-- Visual Logit Vector -->
      <g transform="translate(10, 44)">
        <text x="17" y="-4" font-family="Courier, monospace" font-size="8.0" fill="#64748b" text-anchor="middle">"SELECT"</text>
        <rect x="0" y="0" width="34" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
        <text x="17" y="15" font-family="Courier, monospace" font-size="8.0" fill="#0369a1" text-anchor="middle">+14.2</text>

        <text x="57" y="-4" font-family="Courier, monospace" font-size="8.0" fill="#64748b" text-anchor="middle">"I think"</text>
        <rect x="40" y="0" width="34" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
        <text x="57" y="15" font-family="Courier, monospace" font-size="8.0" fill="#0369a1" text-anchor="middle">+18.5</text>

        <text x="97" y="-4" font-family="Courier, monospace" font-size="8.0" fill="#64748b" text-anchor="middle">"{"</text>
        <rect x="80" y="0" width="34" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
        <text x="97" y="15" font-family="Courier, monospace" font-size="8.0" fill="#0369a1" text-anchor="middle">+8.1</text>

        <text x="137" y="-4" font-family="Courier, monospace" font-size="8.0" fill="#64748b" text-anchor="middle">"Sure"</text>
        <rect x="120" y="0" width="34" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
        <text x="137" y="15" font-family="Courier, monospace" font-size="8.0" fill="#0369a1" text-anchor="middle">+12.0</text>

        <text x="175" y="15" font-family="Courier, monospace" font-size="8" fill="#64748b">... 128k tokens</text>
      </g>
    </g>

    <!-- Bitmask & Dynamic Masking Operation -->
    <g transform="translate(12, 116)">
      <rect width="296" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0369a1">Active Token Allowlist Masking (CUDA Kernel)</text>
      <text x="10" y="28" font-size="8.0" fill="#334155">Current state q_0 expects opening brace `{` only:</text>

      <!-- Masked Result Vector -->
      <g transform="translate(10, 40)">
        <rect x="0" y="0" width="34" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8" />
        <text x="17" y="15" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
        <line x1="0" y1="0" x2="34" y2="24" stroke="#dc2626" stroke-width="1" />

        <rect x="40" y="0" width="34" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8" />
        <text x="57" y="15" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
        <line x1="40" y1="0" x2="74" y2="24" stroke="#dc2626" stroke-width="1" />

        <rect x="80" y="0" width="34" height="24" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" />
        <text x="97" y="15" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">+8.1</text>
        <text x="97" y="34" font-size="8.0" font-weight="700" fill="#15803d" text-anchor="middle">ALLOWED</text>

        <rect x="120" y="0" width="34" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8" />
        <text x="137" y="15" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
        <line x1="120" y1="0" x2="154" y2="24" stroke="#dc2626" stroke-width="1" />

        <text x="175" y="15" font-family="Courier, monospace" font-size="8" fill="#64748b">... all invalid -∞</text>
      </g>

      <rect x="10" y="86" width="276" height="36" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="16" y="100" font-size="8" font-weight="700" fill="#0369a1">Mathematical Guarantee:</text>
      <text x="16" y="113" font-family="Courier, monospace" font-size="8.0" fill="#334155">p(v ∉ Allowed | q) = softmax(-∞) ≡ 0.000000%</text>
    </g>

    <!-- State Transition -->
    <g transform="translate(12, 260)">
      <rect width="296" height="78" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Sampled Token &amp; State Advance</text>
      <text x="10" y="29" font-size="8.0" fill="#334155">Sampled token: <tspan font-family="Courier, monospace" font-weight="700" fill="#15803d">"{"</tspan></text>
      <text x="10" y="43" font-size="8.0" fill="#334155">Automaton transition: <tspan font-family="Courier, monospace" fill="#0369a1">q_next = δ(q_0, "{") → q_1</tspan></text>
      <text x="10" y="57" font-size="8.0" fill="#334155">Next allowed tokens: <tspan font-family="Courier, monospace" fill="#0f172a">"query", "limit"</tspan></text>
      <text x="10" y="69" font-size="8.0" fill="#15803d">✓ Latency overhead: &lt; 0.2% of step runtime (sub-millisecond)</text>
    </g>
  </g>

  <!-- Flow Arrow from Section 2 to Section 3 -->
  <line x1="650" y1="235" x2="668" y2="235" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- ================================================================= -->
  <!-- SECTION 3: Systems Performance & Invariants (Right Column)        -->
  <!-- ================================================================= -->
  <g transform="translate(670, 75)">
    <rect width="250" height="350" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <rect width="250" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. Systems Performance</text>

    <!-- Comparison Table -->
    <g transform="translate(12, 34)">
      <rect width="226" height="136" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      
      <rect width="226" height="22" rx="1" fill="#f1f5f9" />
      <text x="10" y="15" font-size="8.0" font-weight="700" fill="#475569">METRIC</text>
      <text x="105" y="15" font-size="8.0" font-weight="700" fill="#dc2626">PROMPT ONLY</text>
      <text x="175" y="15" font-size="8.0" font-weight="700" fill="#15803d">FSM MASK</text>

      <line x1="0" y1="22" x2="226" y2="22" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="38" font-size="8.0" fill="#334155">Syntax Error Rate</text>
      <text x="110" y="38" font-family="Courier, monospace" font-size="8.0" fill="#dc2626">12.4% - 28%</text>
      <text x="180" y="38" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">0.00%</text>

      <line x1="0" y1="48" x2="226" y2="48" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="64" font-size="8.0" fill="#334155">Correction Turns</text>
      <text x="110" y="64" font-family="Courier, monospace" font-size="8.0" fill="#dc2626">1 - 3 extra</text>
      <text x="180" y="64" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">0 extra</text>

      <line x1="0" y1="74" x2="226" y2="74" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="90" font-size="8.0" fill="#334155">Token Waste</text>
      <text x="110" y="90" font-family="Courier, monospace" font-size="8.0" fill="#dc2626">+1,420 tok</text>
      <text x="180" y="90" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">+0 tok</text>

      <line x1="0" y1="100" x2="226" y2="100" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="116" font-size="8.0" fill="#334155">Latency Overhead</text>
      <text x="110" y="116" font-family="Courier, monospace" font-size="8.0" fill="#64748b">0 ms</text>
      <text x="180" y="116" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">&lt; 0.8 ms</text>

      <line x1="0" y1="126" x2="226" y2="126" stroke="#e2e8f0" stroke-width="1" />
    </g>

    <!-- Deep Invariant Callout -->
    <g transform="translate(12, 180)">
      <rect width="226" height="158" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Architectural Takeaways</text>
      
      <text x="10" y="32" font-size="8.0" font-weight="700" fill="#0f172a">1. Zero Parsing Regret:</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">Runtime never encounters malformed</text>
      <text x="10" y="54" font-size="8.0" fill="#475569">JSON or unescaped quotes.</text>

      <text x="10" y="70" font-size="8.0" font-weight="700" fill="#0f172a">2. Context Window Savings:</text>
      <text x="10" y="82" font-size="8.0" fill="#475569">Eliminates diagnostic error correction</text>
      <text x="10" y="92" font-size="8.0" fill="#475569">turns that bloat KV caches.</text>

      <text x="10" y="108" font-size="8.0" font-weight="700" fill="#0f172a">3. Production Adoption:</text>
      <text x="10" y="120" font-size="8.0" fill="#475569">Implemented in Outlines, Guidance,</text>
      <text x="10" y="130" font-size="8.0" fill="#475569">vLLM, and SGLang decode engines.</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM PRINCIPLE BANNER                                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 436)">
    <rect width="880" height="66" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <rect x="12" y="12" width="80" height="42" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" />
    <text x="52" y="28" font-size="8.0" font-weight="700" fill="#6d28d9" text-anchor="middle">SYSTEMS</text>
    <text x="52" y="42" font-size="8.0" font-weight="700" fill="#6d28d9" text-anchor="middle">PRINCIPLE</text>
    <text x="106" y="28" font-size="9.5" font-weight="700" fill="#0f172a">Enforce Syntax Invariants at the Logit Surface, Not Post-Hoc via Parsing Regret</text>
    <text x="106" y="44" font-size="8" fill="#475569">Treating tool schemas as prompt instructions invites non-deterministic syntax failures. Compiling schemas to finite automata guarantees 100% compliance at the tensor level.</text>
  </g>
</g>
</svg>