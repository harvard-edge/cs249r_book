<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL 1: COMPILED RECOGNIZER AUTOMATON (DFA)                      -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="820" height="150" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="820" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. COMPILED RECOGNIZER AUTOMATON (Grammar DFA States)</text>

    <!-- Schema Specification -->
    <g transform="translate(16, 36)">
      <rect width="210" height="98" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#64748b">TOOL CALL SCHEMA</text>
      <text x="8" y="30" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a">{"path": str,</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a"> "search": str,</text>
      <text x="8" y="58" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#0f172a"> "replace": str}</text>
      <text x="8" y="80" font-size="7.5" fill="#6d28d9">Compiled to state machine Q</text>
    </g>

    <!-- DFA State Graph -->
    <g transform="translate(245, 36)">
      <rect width="559" height="98" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="15" font-size="8" font-weight="700" fill="#64748b">AUTOMATON TRANSITION GRAPH δ(q, token)</text>

      <!-- State q0: Initial -->
      <circle cx="45" cy="55" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="45" y="59" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">q₀</text>
      <text x="45" y="85" font-size="7.5" fill="#64748b" text-anchor="middle">Start</text>

      <!-- Arrow q0 -> q1 -->
      <line x1="61" y1="55" x2="115" y2="55" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
      <text x="88" y="48" font-family="Courier New, monospace" font-size="8" fill="#6d28d9" text-anchor="middle">'{"path":'</text>

      <!-- State q1: Expecting Path String -->
      <circle cx="135" cy="55" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="135" y="59" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">q₁</text>
      <text x="135" y="85" font-size="7.5" fill="#64748b" text-anchor="middle">In Path</text>

      <!-- Arrow q1 -> q2 -->
      <line x1="151" y1="55" x2="215" y2="55" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
      <text x="183" y="48" font-family="Courier New, monospace" font-size="8" fill="#6d28d9" text-anchor="middle">'", "search":'</text>

      <!-- State q2: In Search -->
      <circle cx="235" cy="55" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="235" y="59" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">q₂</text>
      <text x="235" y="85" font-size="7.5" fill="#64748b" text-anchor="middle">In Search</text>

      <!-- Arrow q2 -> q3 -->
      <line x1="251" y1="55" x2="315" y2="55" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
      <text x="283" y="48" font-family="Courier New, monospace" font-size="8" fill="#6d28d9" text-anchor="middle">'", "replace":'</text>

      <!-- State q3: In Replace -->
      <circle cx="335" cy="55" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="335" y="59" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">q₃</text>
      <text x="335" y="85" font-size="7.5" fill="#64748b" text-anchor="middle">In Replace</text>

      <!-- Arrow q3 -> q_accept -->
      <line x1="351" y1="55" x2="435" y2="55" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="393" y="48" font-family="Courier New, monospace" font-size="8" fill="#15803d" text-anchor="middle">'"}'</text>

      <!-- Accepting State q_accept (Double Circle) -->
      <circle cx="455" cy="55" r="17" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="455" cy="55" r="13" fill="none" stroke="#16a34a" stroke-width="1"/>
      <text x="455" y="59" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">q_acc</text>
      <text x="455" y="85" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Accepting State</text>

      <!-- Invariant Annotation -->
      <rect x="360" y="8" width="185" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="452" y="21" font-size="7.5" font-weight="600" fill="#15803d" text-anchor="middle">EOS valid ONLY in Accepting State</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: REAL-TIME LOGIT MASKING AT STEP t                        -->
  <!-- ================================================================= -->
  <g transform="translate(30, 185)">
    <rect width="820" height="195" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="820" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. REAL-TIME LOGIT MASKING OPERATION (At Active Automaton State q_t)</text>

    <!-- Step A: Raw Model Logits -->
    <g transform="translate(16, 36)">
      <rect width="240" height="95" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#334155">RAW LOGITS FROM NEURAL CORE</text>
      <text x="8" y="28" font-family="Courier New, monospace" font-size="8" fill="#64748b">z_t = W_vocab * h_t in R^|V|</text>
      
      <!-- Sample Logit Entries -->
      <g transform="translate(8, 38)">
        <rect x="0" y="0" width="48" height="24" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="24" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#0369a1" text-anchor="middle">"{"</text>
        <text x="24" y="20" font-family="Courier New, monospace" font-size="7" fill="#64748b" text-anchor="middle">+8.1</text>

        <rect x="54" y="0" width="48" height="24" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="78" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#0369a1" text-anchor="middle">"Sure"</text>
        <text x="78" y="20" font-family="Courier New, monospace" font-size="7" fill="#64748b" text-anchor="middle">+14.2</text>

        <rect x="108" y="0" width="48" height="24" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="132" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#0369a1" text-anchor="middle">"I will"</text>
        <text x="132" y="20" font-family="Courier New, monospace" font-size="7" fill="#64748b" text-anchor="middle">+16.0</text>

        <rect x="162" y="0" width="55" height="24" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
        <text x="189" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#0369a1" text-anchor="middle">&lt;EOS&gt;</text>
        <text x="189" y="20" font-family="Courier New, monospace" font-size="7" fill="#64748b" text-anchor="middle">+11.5</text>
      </g>
      <text x="8" y="82" font-size="7.5" fill="#64748b">Unconstrained mode: "I will" wins (score +16.0)</text>
    </g>

    <!-- Arrow from Raw to Mask -->
    <path d="M 264,83 L 285,83" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Step B: Logit Masking Kernel -->
    <g transform="translate(290, 36)">
      <rect width="250" height="95" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0369a1">AUTOMATON LOGIT MASK (State q₀)</text>
      <text x="8" y="28" font-family="Courier New, monospace" font-size="8" fill="#64748b">V_valid(q_0) = { "{" }</text>

      <!-- Masked Entries -->
      <g transform="translate(8, 38)">
        <rect x="0" y="0" width="48" height="24" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="24" y="11" font-family="Courier New, monospace" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">"{"</text>
        <text x="24" y="20" font-family="Courier New, monospace" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">+8.1</text>

        <rect x="54" y="0" width="48" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
        <text x="78" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#991b1b" text-anchor="middle">"Sure"</text>
        <text x="78" y="20" font-family="Courier New, monospace" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>

        <rect x="108" y="0" width="48" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
        <text x="132" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#991b1b" text-anchor="middle">"I will"</text>
        <text x="132" y="20" font-family="Courier New, monospace" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>

        <rect x="162" y="0" width="55" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
        <text x="189" y="11" font-family="Courier New, monospace" font-size="7.5" fill="#991b1b" text-anchor="middle">&lt;EOS&gt;</text>
        <text x="189" y="20" font-family="Courier New, monospace" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
      </g>
      <text x="8" y="82" font-size="7.5" fill="#b91c1c">Masked tokens driven to -infinity before softmax</text>
    </g>

    <!-- Arrow from Mask to Output -->
    <path d="M 548,83 L 570,83" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Step C: Softmax & State Advance -->
    <g transform="translate(575, 36)">
      <rect width="229" height="95" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#15803d">SAMPLING &amp; TRANSITION</text>
      
      <text x="8" y="32" font-family="Courier New, monospace" font-size="8" fill="#166534">P("{" | q₀) = 1.0 (100%)</text>
      <text x="8" y="46" font-family="Courier New, monospace" font-size="8" fill="#dc2626">P(invalid | q₀) = 0.0 (0%)</text>
      
      <text x="8" y="66" font-size="8" font-weight="700" fill="#334155">State Advance:</text>
      <text x="8" y="80" font-family="Courier New, monospace" font-size="8" fill="#15803d">q₁ = δ(q₀, "{")</text>
    </g>

    <!-- Systems Contract Callout at Bottom -->
    <g transform="translate(16, 140)">
      <rect width="788" height="42" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="12" y="17" font-size="8.5" font-weight="700" fill="#b45309">Systems Guarantee Boundary:</text>
      <text x="12" y="31" font-size="8" fill="#92400e">• Prefix Validity: Every emitted token keeps the sequence within the recognized grammar prefix language.</text>
      <text x="12" y="43" font-size="8" fill="#92400e">• Acceptance Invariant: Total conformance requires reaching an accepting state (q_acc); premature truncation (K_max) yields an invalid payload.</text>
    </g>
  </g>
</svg>