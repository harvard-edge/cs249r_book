<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: AGENT RUNTIME (HOST CALLER)                              -->
  <!-- ================================================================= -->
  <g transform="translate(30, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="385" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">AGENT RUNTIME (Host Caller)</text>

    <!-- Stage 1 Sub-block: Context Staging & Budgeting -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="226" height="150" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">1. Context Staging &amp; Budgeting</text>
      
      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Task Prompt &amp; Tool Schemas</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8" fill="#64748b">Prompt x = (x_1, ..., x_M)</text>
      
      <text x="8" y="62" font-size="8" font-weight="700" fill="#334155">Resource Ceilings &amp; Deadlines</text>
      <text x="8" y="74" font-size="8" fill="#64748b">Max tokens K_max, deadline T_max</text>
      
      <text x="8" y="92" font-size="8" font-weight="700" fill="#334155">Model Checkpoint Target</text>
      <text x="8" y="104" font-family="Courier New, monospace" font-size="8" fill="#b45309">model_id: "model-2026-03-01"</text>
      
      <text x="8" y="122" font-size="8" font-weight="700" fill="#334155">Decoding Policy Controls</text>
      <text x="8" y="134" font-size="8" fill="#64748b">Temperature tau, top-p, stop tokens</text>
    </g>

    <!-- Stage 4 Sub-block: Interpretation & Action Dispatch -->
    <g transform="translate(12, 205)">
      <rect x="0" y="0" width="226" height="165" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">4. Validation &amp; Action Dispatch</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Envelope Status Triage</text>
      <text x="8" y="44" font-size="8" fill="#64748b">Handle Completed, Incomplete, Refusal</text>

      <text x="8" y="62" font-size="8" font-weight="700" fill="#334155">Schema &amp; Integrity Verification</text>
      <text x="8" y="74" font-size="8" fill="#64748b">Unmarshal JSON; verify AST &amp; arguments</text>

      <text x="8" y="92" font-size="8" font-weight="700" fill="#334155">Capability &amp; Sandbox Gate</text>
      <text x="8" y="104" font-size="8" fill="#64748b">Verify file path ACLs &amp; write leases</text>

      <text x="8" y="122" font-size="8" font-weight="700" fill="#334155">External Side-Effect Execution</text>
      <text x="8" y="134" font-family="Courier New, monospace" font-size="8" fill="#15803d">edit_file(path, search, replace)</text>
      <text x="8" y="148" font-size="8" font-weight="600" fill="#dc2626">Model proposes; runtime authorizes</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: INFERENCE SERVICE (SERVING ENGINE)                      -->
  <!-- ================================================================= -->
  <g transform="translate(315, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="385" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">INFERENCE SERVICE (Serving Engine)</text>

    <!-- Sub-block 1: Queueing & Prefix Caching -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="226" height="70" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Batch Scheduling &amp; KV Allocation</text>
      <text x="8" y="29" font-size="8" fill="#64748b">Tokenizer encoding &amp; queueing (T_queue)</text>
      <text x="8" y="42" font-size="8" fill="#64748b">Prefix cache match &amp; memory paging</text>
      <text x="8" y="56" font-family="Courier New, monospace" font-size="8" fill="#15803d">KV Blocks: paged non-contiguous tensors</text>
    </g>

    <!-- Sub-block 2: Decode Loop & Grammar Masking -->
    <g transform="translate(12, 116)">
      <rect x="0" y="0" width="226" height="135" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">2. Decode Loop &amp; Grammar Masking</text>
      
      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Grammar Automaton Logit Mask</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8" fill="#0284c7">z_masked[invalid] = -infinity</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Softmax &amp; Sampling Policy</text>
      <text x="8" y="72" font-family="Courier New, monospace" font-size="8" fill="#0284c7">y_t ~ p_t = softmax(z_masked / tau)</text>

      <text x="8" y="88" font-size="8" font-weight="700" fill="#334155">Dynamic KV Cache Insertion</text>
      <text x="8" y="100" font-size="8" fill="#64748b">Append (k_t, v_t) to device HBM</text>

      <text x="8" y="116" font-size="8" font-weight="700" fill="#334155">Termination Predicates</text>
      <text x="8" y="127" font-size="8" fill="#64748b">Check EOS delimiter, K_max, or timeout</text>
    </g>

    <!-- Stage 3 Sub-block: Response Packaging -->
    <g transform="translate(12, 261)">
      <rect x="0" y="0" width="226" height="109" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">3. Response Packaging Envelope</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Candidate Content Payload</text>
      <text x="8" y="44" font-size="8" fill="#64748b">Proposed text stream or tool call JSON</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Normalized Outcome Status</text>
      <text x="8" y="72" font-family="Courier New, monospace" font-size="8" fill="#15803d">finish_reason: "stop" | "length"</text>

      <text x="8" y="88" font-size="8" font-weight="700" fill="#334155">Verified Usage Accounting</text>
      <text x="8" y="99" font-size="8" fill="#64748b">Prompt tokens M, decode K, latency TTFT</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: LEARNED MODEL (NEURAL CORE)                             -->
  <!-- ================================================================= -->
  <g transform="translate(600, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="385" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">LEARNED MODEL (Processor Core)</text>

    <!-- Sub-block 1: Prefill Core -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="226" height="100" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">Prompt Prefill Phase (GEMM)</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Parallel Context Ingestion</text>
      <text x="8" y="44" font-size="8" fill="#64748b">Evaluates all M prompt tokens concurrently</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Compute-Bound Saturation</text>
      <text x="8" y="72" font-size="8" fill="#0284c7">Intensity scales with prompt length (I ~ M)</text>
      <text x="8" y="86" font-size="8" fill="#64748b">Tensor cores saturated; establishes TTFT</text>
    </g>

    <!-- Sub-block 2: Autoregressive Decode Core -->
    <g transform="translate(12, 146)">
      <rect x="0" y="0" width="226" height="110" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">Autoregressive Decode Core (GEMV)</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Serial Forward Step</text>
      <text x="8" y="44" font-size="8" fill="#64748b">Token t+1 depends causally on token t</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Memory-Bandwidth Bound</text>
      <text x="8" y="72" font-size="8" fill="#dc2626">Intensity I ~ 2/P FLOP/byte &lt;&lt; I_sat</text>
      <text x="8" y="86" font-size="8" fill="#64748b">Streams parameter weights from HBM</text>
    </g>

    <!-- Sub-block 3: Unembedding Projection -->
    <g transform="translate(12, 266)">
      <rect x="0" y="0" width="226" height="104" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0f172a">Unembedding Tensor Projection</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Linear Vocabulary Mapping</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8" fill="#334155">z_t = W_vocab * h_t in R^|V|</text>

      <text x="8" y="62" font-size="8" font-weight="700" fill="#334155">Raw Unnormalized Logits</text>
      <text x="8" y="74" font-size="8" fill="#64748b">Outputs real-valued scores for all |V| tokens</text>
      <text x="8" y="88" font-size="8" fill="#64748b">Returns log-odds vector z_t to serving harness</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CROSS-TIER DATAFLOW ARROWS & PROTOCOL STAGES                      -->
  <!-- ================================================================= -->

  <!-- Flow 1: Stage 1 Dispatch: Runtime -> Service -->
  <path d="M 280,105 L 315,105" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="281" y="85" width="33" height="14" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="297" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">REQ</text>

  <!-- Flow 2a: Prefill Dispatch: Service -> Model -->
  <path d="M 565,80 L 600,80" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Flow 2b: Decode Inter-token Step: Service <-> Model -->
  <!-- Step Request -->
  <path d="M 565,175 L 600,175" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Logit Return -->
  <path d="M 600,210 L 565,210" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="568" y="184" width="29" height="14" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
  <text x="582" y="194" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">LOOP</text>

  <!-- Flow 3: Stage 3 Response Packaging Return: Service -> Runtime -->
  <path d="M 315,315 L 280,315" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="281" y="322" width="33" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="297" y="332" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">RESP</text>

</svg>
