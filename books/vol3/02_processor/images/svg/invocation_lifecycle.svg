<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: AGENT RUNTIME (HOST CALLER)                              -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="16" width="250" height="10" fill="#f1f5f9"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">HOST AGENT RUNTIME (Supervisor)</text>

    <!-- Stage 1 Sub-block: Context Staging & Budgeting -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="226" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">1. Context Staging &amp; Budgeting</text>
      
      <text x="8" y="34" font-size="8" font-weight="700" fill="#334155">Task Prompt &amp; Tool Schemas</text>
      <text x="8" y="46" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b">Prompt x = (x_1, ..., x_M)</text>
      
      <text x="8" y="64" font-size="8" font-weight="700" fill="#334155">Resource Ceilings &amp; Deadlines</text>
      <text x="8" y="76" font-size="8" fill="#64748b">Max tokens K_max, deadline T_max</text>
      
      <text x="8" y="94" font-size="8" font-weight="700" fill="#334155">Model Checkpoint Target</text>
      <text x="8" y="106" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#d97706">model_id: "model-2026-03-01"</text>
      
      <text x="8" y="124" font-size="8" font-weight="700" fill="#334155">Decoding Policy Controls</text>
      <text x="8" y="136" font-size="8" fill="#64748b">Temperature tau, top-p, stop tokens</text>
    </g>

    <!-- Stage 4 Sub-block: Interpretation & Action Dispatch -->
    <g transform="translate(12, 202)">
      <rect x="0" y="0" width="226" height="174" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">4. Validation &amp; Action Dispatch</text>

      <text x="8" y="34" font-size="8" font-weight="700" fill="#334155">Envelope Status Triage</text>
      <text x="8" y="46" font-size="8" fill="#64748b">Completed, Truncated, Refused, Transport Error</text>

      <text x="8" y="66" font-size="8" font-weight="700" fill="#334155">Schema &amp; Integrity Verification</text>
      <text x="8" y="78" font-size="8" fill="#64748b">Unmarshal JSON; verify AST &amp; arguments</text>

      <text x="8" y="98" font-size="8" font-weight="700" fill="#334155">Capability &amp; Sandbox Gate</text>
      <text x="8" y="110" font-size="8" fill="#64748b">Verify file path ACLs &amp; write leases</text>

      <text x="8" y="130" font-size="8" font-weight="700" fill="#334155">External Side-Effect Execution</text>
      <text x="8" y="143" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#059669">edit_file(path, search, replace)</text>
      <text x="8" y="157" font-size="7.8" font-style="italic" fill="#64748b">Authorized dispatch to isolated worker</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: INFERENCE SERVICE (SERVING ENGINE)                      -->
  <!-- ================================================================= -->
  <g transform="translate(315, 20)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="16" width="250" height="10" fill="#f1f5f9"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">INFERENCE SERVICE (Engine Daemon)</text>

    <!-- Sub-block 1: Queueing & Prefix Caching -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="226" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Batch Scheduling &amp; KV Allocation</text>
      <text x="8" y="30" font-size="8" fill="#64748b">Tokenizer encoding &amp; queueing (T_queue)</text>
      <text x="8" y="44" font-size="8" fill="#64748b">Prefix cache match &amp; memory paging</text>
      <text x="8" y="58" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.8" fill="#059669">KV Blocks: paged non-contiguous tensors</text>
    </g>

    <!-- Sub-block 2: Decode Loop & Grammar Masking -->
    <g transform="translate(12, 122)">
      <rect x="0" y="0" width="226" height="136" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">2. Decode Loop &amp; Grammar Masking</text>
      
      <text x="8" y="34" font-size="8" font-weight="700" fill="#334155">Grammar Automaton Logit Mask</text>
      <text x="8" y="46" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.8" fill="#0284c7">z_masked[invalid] = -infinity</text>

      <text x="8" y="64" font-size="8" font-weight="700" fill="#334155">Softmax &amp; Sampling Policy</text>
      <text x="8" y="76" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.8" fill="#0284c7">y_t ~ p_t = softmax(z_masked / tau)</text>

      <text x="8" y="94" font-size="8" font-weight="700" fill="#334155">Dynamic KV Cache Insertion</text>
      <text x="8" y="106" font-size="8" fill="#64748b">Append (k_t, v_t) to device HBM pages</text>

      <text x="8" y="121" font-size="8" font-weight="700" fill="#334155">Termination Predicates</text>
      <text x="8" y="132" font-size="8" fill="#64748b">Check EOS delimiter, K_max, or timeout</text>
    </g>

    <!-- Stage 3 Sub-block: Response Packaging -->
    <g transform="translate(12, 268)">
      <rect x="0" y="0" width="226" height="108" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">3. Response Packaging Envelope</text>

      <text x="8" y="34" font-size="8" font-weight="700" fill="#334155">Candidate Content Payload</text>
      <text x="8" y="46" font-size="8" fill="#64748b">Proposed text stream or tool call JSON</text>

      <text x="8" y="64" font-size="8" font-weight="700" fill="#334155">Normalized Outcome Status</text>
      <text x="8" y="76" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.8" fill="#059669">finish_reason: "stop" | "length"</text>

      <text x="8" y="92" font-size="8" font-weight="700" fill="#334155">Verified Usage Accounting</text>
      <text x="8" y="103" font-size="8" fill="#64748b">Prompt tokens M, decode K, latency TTFT</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: LEARNED MODEL (NEURAL CORE)                             -->
  <!-- ================================================================= -->
  <g transform="translate(600, 20)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="390" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="16" width="250" height="10" fill="#1e293b"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#38bdf8">NEURAL CORE (Accelerator Silicon)</text>

    <!-- Sub-block 1: Prefill Core -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="226" height="102" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#f8fafc">Prompt Prefill Phase (GEMM)</text>

      <text x="8" y="34" font-size="8" font-weight="700" fill="#94a3b8">Parallel Context Ingestion</text>
      <text x="8" y="46" font-size="8" fill="#cbd5e1">Evaluates all M prompt tokens concurrently</text>

      <text x="8" y="64" font-size="8" font-weight="700" fill="#94a3b8">Compute-Bound Saturation</text>
      <text x="8" y="76" font-size="8" fill="#38bdf8">Intensity scales with prompt length (I ~ M)</text>
      <text x="8" y="90" font-size="8" fill="#94a3b8">Tensor cores saturated; establishes TTFT</text>
    </g>

    <!-- Sub-block 2: Autoregressive Decode Core -->
    <g transform="translate(12, 150)">
      <rect x="0" y="0" width="226" height="112" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#f8fafc">Autoregressive Decode Core (GEMV)</text>

      <text x="8" y="34" font-size="8" font-weight="700" fill="#94a3b8">Serial Forward Step</text>
      <text x="8" y="46" font-size="8" fill="#cbd5e1">Token t+1 depends causally on token t</text>

      <text x="8" y="64" font-size="8" font-weight="700" fill="#94a3b8">Memory-Bandwidth Bound</text>
      <text x="8" y="76" font-size="8" fill="#f87171">Intensity I ~ 2/P FLOP/byte &lt;&lt; I_sat</text>
      <text x="8" y="90" font-size="8" fill="#94a3b8">Streams parameter weights from HBM</text>
    </g>

    <!-- Sub-block 3: Unembedding Projection -->
    <g transform="translate(12, 272)">
      <rect x="0" y="0" width="226" height="104" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="226" height="20" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#f8fafc">Unembedding Tensor Projection</text>

      <text x="8" y="34" font-size="8" font-weight="700" fill="#94a3b8">Linear Vocabulary Mapping</text>
      <text x="8" y="46" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.8" fill="#cbd5e1">z_t = W_vocab * h_t in R^|V|</text>

      <text x="8" y="64" font-size="8" font-weight="700" fill="#94a3b8">Raw Unnormalized Logits</text>
      <text x="8" y="76" font-size="8" fill="#cbd5e1">Outputs real-valued scores for all |V| tokens</text>
      <text x="8" y="90" font-size="8" fill="#94a3b8">Returns log-odds vector z_t to serving harness</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CROSS-TIER DATAFLOW ARROWS & PROTOCOL STAGES                      -->
  <!-- ================================================================= -->

  <!-- Flow 1: Stage 1 Dispatch: Runtime -> Service -->
  <path d="M 280,105 L 315,105" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <rect x="281" y="86" width="33" height="15" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="297" y="97" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">REQ</text>

  <!-- Flow 2a: Prefill Dispatch: Service -> Model -->
  <path d="M 565,82 L 600,82" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Flow 2b: Decode Inter-token Step: Service <-> Model -->
  <!-- Step Request -->
  <path d="M 565,178 L 600,178" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- Logit Return -->
  <path d="M 600,212 L 565,212" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <rect x="568" y="186" width="29" height="15" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="582" y="197" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f172a">LOOP</text>

  <!-- Flow 3: Stage 3 Response Packaging Return: Service -> Runtime -->
  <path d="M 315,322 L 280,322" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <rect x="281" y="329" width="33" height="15" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="0.8"/>
  <text x="297" y="340" text-anchor="middle" font-size="7.5" font-weight="700" fill="#059669">RESP</text>

</svg>
