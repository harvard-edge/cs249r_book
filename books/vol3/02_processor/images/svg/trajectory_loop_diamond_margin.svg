<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="opt2-c-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B21A8" flood-opacity="0.4"/>
    </filter>
    <marker id="arr-c2-purple" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#6B21A8"/>
    </marker>
    <marker id="arr-c2-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="arr-c2-red" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="280" height="280" fill="#ffffff" rx="10"/>

  <!-- Bypass shortcut: act -> ver (cross) -->
  <line x1="198" y1="136" x2="84" y2="136"
        stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-c2-red)"/>

  <!-- Perimeter Edges -->
  <!-- prop -> act (Active) -->
  <line x1="156" y1="70" x2="206" y2="120"
        stroke="#6B21A8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arr-c2-purple)" filter="url(#opt2-c-glow)"/>

  <!-- act -> obs -->
  <line x1="206" y1="152" x2="156" y2="202"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-c2-gray)"/>

  <!-- obs -> ver -->
  <line x1="124" y1="202" x2="74" y2="152"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-c2-gray)"/>

  <!-- ver -> prop -->
  <line x1="74" y1="120" x2="124" y2="70"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-c2-gray)"/>

  <!-- Inactive Nodes -->
  <circle cx="222" cy="136" r="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="222" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">a</text>

  <circle cx="140" cy="218" r="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="140" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">o</text>

  <circle cx="58" cy="136" r="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="58" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">v</text>

  <!-- Active Node prop -->
  <circle cx="140" cy="54" r="23" fill="#6B21A8" stroke="#ffffff" stroke-width="2.5" filter="url(#opt2-c-glow)"/>
  <text x="140" y="60" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">a<tspan font-size="9.5" dy="3">prop</tspan></text>

  <!-- Top Active Header -->
  <g transform="translate(140, 18)">
    <text x="0" y="0" text-anchor="middle" font-size="11.5" font-weight="800" fill="#3B0764">[a_prop] CANDIDATE PROPOSAL</text>
  </g>

  <!-- Bottom Legend Bar: All 4 Brackets Explicit -->
  <g transform="translate(140, 264)">
    <text x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="#64748B">
      <tspan fill="#6B21A8" font-weight="800">[a_prop]</tspan> Prop  •  
      <tspan fill="#334155">[a]</tspan> Action  •  
      <tspan fill="#334155">[o]</tspan> Obs  •  
      <tspan fill="#334155">[v]</tspan> Verifier
    </text>
  </g>

</svg>
