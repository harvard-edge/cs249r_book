<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE STOCHASTIC PROCESSOR: INSTRUCTION FETCH-DECODE-EXECUTE-WRITEBACK PIPELINE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Mapping the autoregressive transformer inference loop onto classic CPU microarchitectural pipeline stages</text>

  <!-- ================================================================= -->
  <!-- PIPELINE STAGE 1: INSTRUCTION FETCH (IF)                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect width="205" height="350" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect width="205" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="12" y="16" font-size="9" font-weight="700" fill="#0369a1">1. Instruction Fetch (IF)</text>

    <!-- Context Working Buffer -->
    <g transform="translate(10, 34)">
      <rect width="185" height="80" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0369a1">Context Token Register</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">History: (y_1, ..., y_{t-1})</text>
      <text x="8" y="41" font-family="Courier, monospace" font-size="7" fill="#0284c7">Fetched: y_{t-1}</text>
      <text x="8" y="56" font-size="7" fill="#64748b">• Atomic execution step t</text>
      <text x="8" y="68" font-size="7" fill="#64748b">• Serialized dependency barrier</text>
    </g>

    <!-- Program Counter / ACB -->
    <g transform="translate(10, 122)">
      <rect width="185" height="88" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">Agent Control Block (ACB)</text>
      <text x="8" y="30" font-size="7" fill="#334155">• Turn Counter: t = 14</text>
      <text x="8" y="43" font-size="7" fill="#334155">• Token Watchdog: 18.4k / 100k</text>
      <text x="8" y="56" font-size="7" fill="#334155">• Capability Lease: ReadOnly</text>
      <text x="8" y="69" font-size="7" fill="#334155">• Status: ACTIVE_DECODE</text>
    </g>

    <!-- Embedding Lookup -->
    <g transform="translate(10, 218)">
      <rect width="185" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#334155">Token Embedding Lookup</text>
      <text x="8" y="29" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">h_0 = E[y_{t-1}] + p_{t-1}</text>
      <text x="8" y="44" font-size="7" fill="#64748b">• E occupies ~2.0 GB HBM</text>
      <text x="8" y="57" font-size="7" font-weight="600" fill="#dc2626">• Intensity: 0 FLOPs/byte</text>
    </g>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <line x1="245" y1="245" x2="263" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />

  <!-- ================================================================= -->
  <!-- PIPELINE STAGE 2: NEURAL DECODE (ID)                              -->
  <!-- ================================================================= -->
  <g transform="translate(265, 75)">
    <rect width="205" height="350" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <rect width="205" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">2. Neural Decode (ID)</text>

    <!-- Multi-Head Attention Sublayer -->
    <g transform="translate(10, 34)">
      <rect width="185" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#6d28d9">Attention Sublayer (L Layers)</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">Q = h W_Q, K = h W_K, V = h W_V</text>
      <text x="8" y="41" font-size="7" fill="#64748b">• Streams full KV cache from HBM</text>
      <text x="8" y="54" font-size="7" fill="#64748b">• GQA (8 heads): 328 KB/token</text>
      <text x="8" y="67" font-size="7" fill="#64748b">• GEMV intensity: ~1 FLOP/byte</text>
      <text x="8" y="80" font-size="7" font-weight="600" fill="#7c3aed">HBM Bandwidth Bound (3.35 TB/s)</text>
    </g>

    <!-- FFN Sublayer -->
    <g transform="translate(10, 138)">
      <rect width="185" height="76" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#6d28d9">Feed-Forward Network (FFN)</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">FFN(h) = φ(h W_1) W_2</text>
      <text x="8" y="41" font-size="7" fill="#64748b">• Weight footprint: 140 GB (70B)</text>
      <text x="8" y="54" font-size="7" fill="#64748b">• Degenerate GEMV at B=1</text>
      <text x="8" y="66" font-size="7" font-weight="600" fill="#dc2626">• Tensor core utilization: &lt; 1%</text>
    </g>

    <!-- Vocabulary Logit Projection -->
    <g transform="translate(10, 222)">
      <rect width="185" height="72" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#334155">Logit Projection (Unnormalized)</text>
      <text x="8" y="29" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">z_t = h_L W_vocab ∈ R^{|V|}</text>
      <text x="8" y="44" font-size="7" fill="#64748b">• Vocab size |V| = 128,000</text>
      <text x="8" y="57" font-size="7" fill="#64748b">• Dense score vector output</text>
    </g>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <line x1="470" y1="245" x2="488" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />

  <!-- ================================================================= -->
  <!-- PIPELINE STAGE 3: EXECUTE & STOCHASTIC BRANCH (EX)                -->
  <!-- ================================================================= -->
  <g transform="translate(490, 75)">
    <rect width="205" height="350" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
    <rect width="205" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">3. Execute &amp; Branch (EX)</text>

    <!-- Grammar Logit Masking -->
    <g transform="translate(10, 34)">
      <rect width="185" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#b45309">Grammar Logit Mask Filter</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">ẑ = z if v ∈ V_k else -∞</text>
      <text x="8" y="41" font-size="7" fill="#64748b">• Dynamic bitmask m_k ∈ {0, 1}^{|V|}</text>
      <text x="8" y="54" font-size="7" fill="#64748b">• PDA / FSM schema validation</text>
      <text x="8" y="67" font-size="7" font-weight="600" fill="#15803d">• Zero syntax errors by construction</text>
      <text x="8" y="80" font-size="7" fill="#64748b">• 16 KB bitmask transfer per step</text>
    </g>

    <!-- Temperature & Truncated Sampling -->
    <g transform="translate(10, 138)">
      <rect width="185" height="86" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#b45309">Sampling Thermodynamics</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">p(v) = exp(ẑ / τ) / ∑ exp</text>
      <text x="8" y="41" font-size="7" fill="#64748b">• Temperature τ: Entropy regulator</text>
      <text x="8" y="54" font-size="7" fill="#64748b">• Top-p (nucleus) / Min-p filtering</text>
      <text x="8" y="67" font-size="7" font-weight="600" fill="#dc2626">• Non-associative float reduction</text>
    </g>

    <!-- Stochastic Draw -->
    <g transform="translate(10, 232)">
      <rect width="185" height="64" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#334155">Stochastic Token Selection</text>
      <text x="8" y="29" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">y_t ~ Cat(p_1, ..., p_{|V|})</text>
      <text x="8" y="44" font-size="7" fill="#64748b">Sampled action token selected</text>
    </g>
  </g>

  <!-- Connecting Arrow 3 -> 4 -->
  <line x1="695" y1="245" x2="713" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />

  <!-- ================================================================= -->
  <!-- PIPELINE STAGE 4: WRITEBACK & COMMIT (WB)                         -->
  <!-- ================================================================= -->
  <g transform="translate(715, 75)">
    <rect width="205" height="350" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <rect width="205" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">4. Writeback &amp; Commit (WB)</text>

    <!-- Context Append -->
    <g transform="translate(10, 34)">
      <rect width="185" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#15803d">Context Buffer Mutation</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">x_{1:t} ← concat(x_{1:t-1}, y_t)</text>
      <text x="8" y="42" font-size="7" fill="#64748b">• Advances context length by 1</text>
      <text x="8" y="55" font-size="7" fill="#64748b">• Updates working memory</text>
    </g>

    <!-- KV Cache Layer Projections Writeback -->
    <g transform="translate(10, 116)">
      <rect width="185" height="88" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#15803d">KV Cache Commit</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">K_t^{(l)}, V_t^{(l)} → HBM Pool</text>
      <text x="8" y="42" font-size="7" fill="#64748b">• Materializes layer projections</text>
      <text x="8" y="55" font-size="7" fill="#64748b">• PagedAttention physical blocks</text>
      <text x="8" y="68" font-size="7" fill="#64748b">• Prevents quadratic recomputation</text>
    </g>

    <!-- ACB Program Counter Advance -->
    <g transform="translate(10, 212)">
      <rect width="185" height="84" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="8" y="15" font-size="8" font-weight="700" fill="#0f172a">Program Counter Advance</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="7" fill="#334155">t ← t + 1, tokens_used += 1</text>
      <text x="8" y="42" font-size="7" fill="#64748b">• Audit trail updated</text>
      <text x="8" y="55" font-size="7" fill="#64748b">• Watchdog budget decremented</text>
      <text x="8" y="68" font-size="7" fill="#64748b">• Checks terminal tokens</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM ARCHITECTURAL PRINCIPLE BANNER                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 436)">
    <rect width="880" height="66" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect x="12" y="12" width="80" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="52" y="28" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">SYSTEMS</text>
    <text x="52" y="42" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">PRINCIPLE</text>
    <text x="106" y="28" font-size="9.5" font-weight="700" fill="#0f172a">The Stochastic Processor Microarchitectural Contract</text>
    <text x="106" y="44" font-size="8" fill="#475569">An autoregressive foundation model functions as an instruction-processing unit bounded by physical memory bandwidth. While traditional CPUs execute deterministic opcodes, the neural core requires external runtime contracts (ACB guards, grammar masks, capability attenuation) to guarantee deterministic system execution.</text>
  </g>
</svg>
