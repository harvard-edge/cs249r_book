<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <linearGradient id="grad-if" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="grad-id" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="grad-ex" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="grad-wb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="2" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Top Title Header -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="912" height="30" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" letter-spacing="0.5">THE STOCHASTIC PROCESSOR: INSTRUCTION FETCH-DECODE-EXECUTE-WRITEBACK PIPELINE</text>
  </g>

  <!-- PIPELINE STAGE 1: INSTRUCTION FETCH (IF) -->
  <g transform="translate(24, 64)">
    <rect width="210" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="210" height="36" rx="2" fill="url(#grad-if)" />
    <line x1="0" y1="36" x2="210" y2="36" stroke="#BFDBFE" stroke-width="1" />
    <text x="12" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E40AF">1. Instruction Fetch (IF)</text>

    <!-- Context Working Buffer -->
    <g transform="translate(12, 48)">
      <rect width="186" height="80" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1D4ED8">Context Token Register</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">History: (y_1, ..., y_{t-1})</text>
      <text x="8" y="44" font-family="monospace" font-size="7.5" fill="#1E40AF">Fetched: y_{t-1}</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Atomic execution step t</text>
      <text x="8" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Serialized dependency barrier</text>
    </g>

    <!-- Program Counter / ACB -->
    <g transform="translate(12, 140)">
      <rect width="186" height="88" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Agent Control Block (ACB)</text>
      <text x="8" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• Turn Counter: t = 14</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• Token Watchdog: 18.4k / 100k</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• Capability Lease: ReadOnly</text>
      <text x="8" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• Status: ACTIVE_DECODE</text>
    </g>

    <!-- Embedding Lookup -->
    <g transform="translate(12, 240)">
      <rect width="186" height="74" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#334155">Token Embedding Lookup</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#0F172A">h_0 = E[y_{t-1}] + p_{t-1}</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• E occupies ~2.0 GB HBM</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#DC2626">• Intensity: 0 FLOPs/byte</text>
    </g>
  </g>

  <!-- PIPELINE STAGE 2: NEURAL DECODE (ID) -->
  <g transform="translate(250, 64)">
    <rect width="220" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="220" height="36" rx="2" fill="url(#grad-id)" />
    <line x1="0" y1="36" x2="220" y2="36" stroke="#E9D5FF" stroke-width="1" />
    <text x="12" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581C87">2. Neural Decode (ID)</text>

    <!-- Multi-Head Attention Sublayer -->
    <g transform="translate(12, 48)">
      <rect width="196" height="96" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8">Attention Sublayer (L Layers)</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">Q = h W_Q, K = h W_K, V = h W_V</text>
      <text x="8" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Streams full KV cache from HBM</text>
      <text x="8" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• GQA (8 heads): 328 KB/token</text>
      <text x="8" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• GEMV intensity: ~1 FLOP/byte</text>
      <text x="8" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#7E22CE">HBM Bandwidth Bound (3.35 TB/s)</text>
    </g>

    <!-- FFN Sublayer -->
    <g transform="translate(12, 154)">
      <rect width="196" height="76" rx="2" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B21A8">Feed-Forward Network (FFN)</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">FFN(h) = phi(h W_1) W_2</text>
      <text x="8" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Weight footprint: 140 GB (70B)</text>
      <text x="8" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Degenerate GEMV at B=1</text>
      <text x="8" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#DC2626">• Tensor core utilization: &lt; 1%</text>
    </g>

    <!-- Vocabulary Logit Projection -->
    <g transform="translate(12, 240)">
      <rect width="196" height="74" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#334155">Logit Projection (Unnormalized)</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#0F172A">z_t = h_L W_vocab in R^{|V|}</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Vocab size |V| = 128,000</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Dense score vector output</text>
    </g>
  </g>

  <!-- PIPELINE STAGE 3: EXECUTE & STOCHASTIC BRANCH (EX) -->
  <g transform="translate(486, 64)">
    <rect width="220" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="220" height="36" rx="2" fill="url(#grad-ex)" />
    <line x1="0" y1="36" x2="220" y2="36" stroke="#FDE68A" stroke-width="1" />
    <text x="12" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400E">3. Execute &amp; Branch (EX)</text>

    <!-- Grammar Logit Masking -->
    <g transform="translate(12, 48)">
      <rect width="196" height="96" rx="2" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#B45309">Grammar Logit Mask Filter</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">z_hat = z if v in V_k else -inf</text>
      <text x="8" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Dynamic bitmask m_k in {0, 1}^{|V|}</text>
      <text x="8" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• PDA / FSM schema validation</text>
      <text x="8" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#047857">• Zero syntax errors by construction</text>
      <text x="8" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• 16 KB bitmask transfer per step</text>
    </g>

    <!-- Temperature & Truncated Sampling -->
    <g transform="translate(12, 154)">
      <rect width="196" height="86" rx="2" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#B45309">Sampling Thermodynamics</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">p(v) = exp(z_hat / tau) / sum exp</text>
      <text x="8" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Temperature tau: Entropy regulator</text>
      <text x="8" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Top-p (nucleus) / Min-p filtering</text>
      <text x="8" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#DC2626">• Non-associative float reduction</text>
    </g>

    <!-- Stochastic Draw -->
    <g transform="translate(12, 250)">
      <rect width="196" height="64" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#334155">Stochastic Token Selection</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#0F172A">y_t ~ Cat(p_1, ..., p_{|V|})</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Sampled action token selected</text>
    </g>
  </g>

  <!-- PIPELINE STAGE 4: WRITEBACK & COMMIT (WB) -->
  <g transform="translate(722, 64)">
    <rect width="214" height="390" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="214" height="36" rx="2" fill="url(#grad-wb)" />
    <line x1="0" y1="36" x2="214" y2="36" stroke="#BBF7D0" stroke-width="1" />
    <text x="12" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#166534">4. Writeback &amp; Commit (WB)</text>

    <!-- Context Append -->
    <g transform="translate(12, 48)">
      <rect width="190" height="74" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#15803D">Context Buffer Mutation</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">x_{1:t} &lt;- concat(x_{1:t-1}, y_t)</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Advances context length by 1</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Updates working memory</text>
    </g>

    <!-- KV Cache Layer Projections Writeback -->
    <g transform="translate(12, 132)">
      <rect width="190" height="88" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#15803D">KV Cache Commit</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">K_t^{(l)}, V_t^{(l)} -&gt; HBM Pool</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Materializes layer projections</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• PagedAttention physical blocks</text>
      <text x="8" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Prevents quadratic recomputation</text>
    </g>

    <!-- ACB Program Counter Advance -->
    <g transform="translate(12, 230)">
      <rect width="190" height="84" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="8" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B">Program Counter Advance</text>
      <text x="8" y="30" font-family="monospace" font-size="7.5" fill="#334155">t &lt;- t + 1, tokens_used += 1</text>
      <text x="8" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Audit trail updated</text>
      <text x="8" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Watchdog budget decremented</text>
      <text x="8" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Checks terminal tokens</text>
    </g>
  </g>

  <!-- Connecting Pipeline Arrows -->
  <line x1="234" y1="250" x2="248" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="470" y1="250" x2="484" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706" y1="250" x2="720" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bottom Architectural Takeaway Bar -->
  <g transform="translate(24, 466)">
    <rect width="912" height="48" rx="2" fill="#0F172A" />
    <text x="16" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38BDF8">ARCHITECTURAL PRINCIPLE: THE STOCHASTIC PROCESSOR CONTRACT</text>
    <text x="16" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#E2E8F0">An autoregressive foundation model functions as an instruction-processing unit bounded by physical memory bandwidth.</text>
    <text x="16" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#E2E8F0">While traditional CPUs execute deterministic opcodes, the neural core requires external runtime contracts (ACB guards, grammar masks, capability attenuation) to guarantee deterministic system execution.</text>
  </g>
</svg>
