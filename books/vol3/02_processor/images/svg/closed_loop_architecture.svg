<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="640" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="840" height="600" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE CLOSED-LOOP AGENTIC EXECUTION ARCHITECTURE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Formal interaction loop between neural policy proposal, sandboxed tool execution, and ground-truth verification</text>

  <!-- ================================================================= -->
  <!-- 1. GOAL INPUT BOX (Top Center)                                    -->
  <!-- ================================================================= -->
  <g transform="translate(290, 75)">
    <rect x="0" y="0" width="300" height="42" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="150" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Delegated Objective / Goal (g)</text>
    <text x="150" y="32" text-anchor="middle" font-size="8" fill="#64748b">User Prompt • API Trigger • Sub-goal Task Specification</text>
  </g>

  <!-- Downward Arrow from Goal to Context Assembly -->
  <line x1="440" y1="117" x2="440" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================= -->
  <!-- 2. CONTEXT ASSEMBLY LAYER                                         -->
  <!-- ================================================================= -->
  <g transform="translate(240, 138)">
    <rect x="0" y="0" width="400" height="64" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">PERCEPTION &amp; CONTEXT ASSEMBLY LAYER</text>
    <text x="12" y="40" font-size="8" fill="#334155">History Serialization • Dynamic Window Compaction • Tokenization</text>
    <text x="12" y="54" font-size="7.5" font-family="Courier, monospace" fill="#64748b">Assembles full trajectory context: h_t = (g, o_0, a_0, ..., o_t)</text>
  </g>

  <!-- Downward Arrow to Neural Policy Engine -->
  <line x1="440" y1="202" x2="440" y2="226" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="450" y="218" font-size="8" font-weight="700" fill="#0369a1">h_t context</text>

  <!-- ================================================================= -->
  <!-- 3. NEURAL POLICY ENGINE                                           -->
  <!-- ================================================================= -->
  <g transform="translate(200, 226)">
    <rect x="0" y="0" width="480" height="74" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">NEURAL POLICY ENGINE (π_θ)</text>
    <text x="12" y="42" font-size="8.5" font-weight="600" fill="#0f172a">Autoregressive Prefill &amp; Decode • Structured Grammar-Constrained Decoding</text>
    <text x="12" y="58" font-size="8" font-family="Courier, monospace" fill="#0284c7">Emits Action Proposal: a_t ~ π_θ(· | h_t)</text>
  </g>

  <!-- Split Paths: Left = Internal Thought, Right = External Tool -->
  <!-- Left Path Line -->
  <path d="M 320,300 L 320,332 L 210,332 L 210,350" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="210" y="344" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Thought Action (a_thought)</text>

  <!-- Right Path Line -->
  <path d="M 560,300 L 560,332 L 670,332 L 670,350" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <text x="670" y="344" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Tool Action (a_tool)</text>

  <!-- ================================================================= -->
  <!-- 4A. LEFT: INTERNAL SCRATCHPAD                                     -->
  <!-- ================================================================= -->
  <g transform="translate(90, 350)">
    <rect x="0" y="0" width="240" height="66" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">INTERNAL SCRATCHPAD (CoT)</text>
    <text x="12" y="40" font-size="8" fill="#334155">Chain-of-Thought (CoT) / Reflection</text>
    <text x="12" y="54" font-size="7.5" fill="#64748b">Pure cognitive state (no environment mutation)</text>
  </g>

  <!-- ================================================================= -->
  <!-- 4B. RIGHT: TOOL EXECUTION SANDBOX                                 -->
  <!-- ================================================================= -->
  <g transform="translate(520, 350)">
    <rect x="0" y="0" width="300" height="66" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">TOOL EXECUTION SANDBOX (MCP / MicroVM)</text>
    <text x="12" y="40" font-size="8" fill="#334155">Model Context Protocol (MCP) • MicroVM / gVisor isolation</text>
    <text x="12" y="54" font-size="7.5" fill="#64748b">Capability lease checks • AST validation • Resource budgets</text>
  </g>

  <!-- Downward Line from Sandbox to Environment -->
  <line x1="670" y1="416" x2="670" y2="440" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <text x="682" y="432" font-size="7.5" font-weight="700" fill="#b45309">Side Effects</text>

  <!-- ================================================================= -->
  <!-- 5. GROUND-TRUTH ENVIRONMENT STATE                                 -->
  <!-- ================================================================= -->
  <g transform="translate(520, 440)">
    <rect x="0" y="0" width="300" height="60" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#991b1b">GROUND-TRUTH ENVIRONMENT STATE (S)</text>
    <text x="12" y="40" font-size="8" fill="#334155">Filesystem, OS Processes, Git Repository, Network APIs</text>
    <text x="12" y="52" font-size="7.5" font-family="Courier, monospace" fill="#dc2626">Crossing Reversibility Boundary: s_{t+1} ~ T(s_t, a_tool)</text>
  </g>

  <!-- Downward Line to Runtime Verification Oracle -->
  <line x1="670" y1="500" x2="670" y2="524" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ================================================================= -->
  <!-- 6. RUNTIME VERIFICATION ORACLE                                    -->
  <!-- ================================================================= -->
  <g transform="translate(520, 524)">
    <rect x="0" y="0" width="300" height="60" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">RUNTIME VERIFICATION ORACLE</text>
    <text x="12" y="40" font-size="8" fill="#334155">Deterministic Test Suites • Linter Exit Codes • AST Parsers</text>
    <text x="12" y="52" font-size="7.5" fill="#15803d">Emits Ground-Truth Observation &amp; Pass/Fail Verdict (o_{t+1})</text>
  </g>

  <!-- Loop Closure Paths Back to Context Assembly Layer -->
  <!-- From Scratchpad (Left) -->
  <path d="M 90,383 L 45,383 L 45,169 L 240,169" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="35" y="280" transform="rotate(-90, 35, 280)" font-size="7.5" font-weight="700" fill="#6d28d9">Append Thought to h_{t+1}</text>

  <!-- From Verification Oracle (Right) -->
  <path d="M 670,584 L 670,604 L 835,604 L 835,169 L 640,169" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="847" y="380" transform="rotate(90, 847, 380)" font-size="7.5" font-weight="700" fill="#15803d">Verified Feedback Closes Loop into h_{t+1}</text>
</svg>
