<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Title Header -->
  <g transform="translate(480, 26)">
    <text text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A" letter-spacing="-0.2">The Reliability Wall: Compounding Error in Agent Trajectories</text>
    <text y="18" text-anchor="middle" font-size="10.5" fill="#64748B">Exponential decay of open-loop task completion P_success ≤ p^N vs. closed-loop verified recovery</text>
  </g>

  <!-- LEFT PANEL: THE GRAPH -->
  <g transform="translate(0, 0)">
    <!-- Graph Background Card -->
    <rect x="65" y="60" width="470" height="435" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Grid lines and Y-axis labels -->
    <line x1="80" y1="440.0" x2="520" y2="440.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="72" y="444.0" font-size="9" text-anchor="end" fill="#64748B">0%</text>
    <line x1="80" y1="368.0" x2="520" y2="368.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="72" y="372.0" font-size="9" text-anchor="end" fill="#64748B">20%</text>
    <line x1="80" y1="296.0" x2="520" y2="296.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="72" y="300.0" font-size="9" text-anchor="end" fill="#64748B">40%</text>
    <line x1="80" y1="224.0" x2="520" y2="224.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="72" y="228.0" font-size="9" text-anchor="end" fill="#64748B">60%</text>
    <line x1="80" y1="152.0" x2="520" y2="152.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="72" y="156.0" font-size="9" text-anchor="end" fill="#64748B">80%</text>
    <line x1="80" y1="80.0" x2="520" y2="80.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="72" y="84.0" font-size="9" text-anchor="end" fill="#64748B">100%</text>
    <line x1="80.0" y1="80" x2="80.0" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="80.0" y="458" font-size="9" text-anchor="middle" fill="#64748B">0</text>
    <line x1="168.0" y1="80" x2="168.0" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="168.0" y="458" font-size="9" text-anchor="middle" fill="#64748B">20</text>
    <line x1="256.0" y1="80" x2="256.0" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="256.0" y="458" font-size="9" text-anchor="middle" fill="#64748B">40</text>
    <line x1="344.0" y1="80" x2="344.0" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="344.0" y="458" font-size="9" text-anchor="middle" fill="#64748B">60</text>
    <line x1="432.0" y1="80" x2="432.0" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="432.0" y="458" font-size="9" text-anchor="middle" fill="#64748B">80</text>
    <line x1="520.0" y1="80" x2="520.0" y2="440" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="520.0" y="458" font-size="9" text-anchor="middle" fill="#64748B">100</text>

    <!-- Axes -->
    <line x1="80" y1="80" x2="80" y2="440" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="80" y1="440" x2="520" y2="440" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Axis Titles -->
    <text x="35" y="260.0" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90 35 260.0)">Trajectory Success Probability (P_success)</text>
    <text x="300.0" y="476" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Trajectory Horizon Length N (Sequential Action Steps)</text>

    <!-- Curves -->
    <path d="M 80.0 80.0 L 88.8 148.4 L 97.6 203.8 L 106.4 248.7 L 115.2 285.0 L 124.0 314.5 L 132.8 338.3 L 141.6 357.6 L 150.4 373.3 L 159.2 386.0 L 168.0 396.2 L 176.8 404.5 L 185.6 411.3 L 194.4 416.7 L 203.2 421.2 L 212.0 424.7 L 220.8 427.6 L 229.6 430.0 L 238.4 431.9 L 247.2 433.4 L 256.0 434.7 L 264.8 435.7 L 273.6 436.5 L 282.4 437.2 L 291.2 437.7 L 300.0 438.1 L 308.8 438.5 L 317.6 438.8 L 326.4 439.0 L 335.2 439.2 L 344.0 439.4 L 352.8 439.5 L 361.6 439.6 L 370.4 439.7 L 379.2 439.7 L 388.0 439.8 L 396.8 439.8 L 405.6 439.9 L 414.4 439.9 L 423.2 439.9 L 432.0 439.9 L 440.8 439.9 L 449.6 439.9 L 458.4 440.0 L 467.2 440.0 L 476.0 440.0 L 484.8 440.0 L 493.6 440.0 L 502.4 440.0 L 511.2 440.0 L 520.0 440.0" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <path d="M 80.0 80.0 L 88.8 115.1 L 97.6 146.8 L 106.4 175.4 L 115.2 201.2 L 124.0 224.5 L 132.8 245.5 L 141.6 264.4 L 150.4 281.6 L 159.2 297.0 L 168.0 310.9 L 176.8 323.5 L 185.6 334.9 L 194.4 345.1 L 203.2 354.4 L 212.0 362.7 L 220.8 370.3 L 229.6 377.1 L 238.4 383.2 L 247.2 388.7 L 256.0 393.7 L 264.8 398.2 L 273.6 402.3 L 282.4 406.0 L 291.2 409.3 L 300.0 412.3 L 308.8 415.0 L 317.6 417.4 L 326.4 419.6 L 335.2 421.6 L 344.0 423.4 L 352.8 425.0 L 361.6 426.5 L 370.4 427.8 L 379.2 429.0 L 388.0 430.1 L 396.8 431.0 L 405.6 431.9 L 414.4 432.7 L 423.2 433.4 L 432.0 434.1 L 440.8 434.6 L 449.6 435.2 L 458.4 435.6 L 467.2 436.1 L 476.0 436.4 L 484.8 436.8 L 493.6 437.1 L 502.4 437.4 L 511.2 437.6 L 520.0 437.9" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <path d="M 80.0 80.0 L 88.8 87.2 L 97.6 94.2 L 106.4 101.1 L 115.2 107.8 L 124.0 114.4 L 132.8 120.9 L 141.6 127.3 L 150.4 133.5 L 159.2 139.6 L 168.0 145.6 L 176.8 151.4 L 185.6 157.2 L 194.4 162.8 L 203.2 168.3 L 212.0 173.7 L 220.8 179.0 L 229.6 184.2 L 238.4 189.3 L 247.2 194.3 L 256.0 199.2 L 264.8 204.0 L 273.6 208.7 L 282.4 213.3 L 291.2 217.8 L 300.0 222.2 L 308.8 226.5 L 317.6 230.8 L 326.4 234.9 L 335.2 239.0 L 344.0 243.0 L 352.8 246.9 L 361.6 250.8 L 370.4 254.6 L 379.2 258.2 L 388.0 261.9 L 396.8 265.4 L 405.6 268.9 L 414.4 272.3 L 423.2 275.6 L 432.0 278.9 L 440.8 282.1 L 449.6 285.2 L 458.4 288.3 L 467.2 291.3 L 476.0 294.3 L 484.8 297.2 L 493.6 300.0 L 502.4 302.8 L 511.2 305.6 L 520.0 308.2" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
    <path d="M 80.0 94.4 L 84.4 101.3 L 88.8 108.1 L 93.2 114.7 L 97.6 121.2 L 102.0 127.6 L 106.4 133.9 L 110.8 140.0 L 115.2 146.0 L 119.6 151.9 L 124.0 157.6 L 128.4 163.3 L 132.8 168.8 L 137.2 174.2 L 141.6 179.5 L 146.0 94.4 L 150.4 101.3 L 154.8 108.1 L 159.2 114.7 L 163.6 121.2 L 168.0 127.6 L 172.4 133.9 L 176.8 140.0 L 181.2 146.0 L 185.6 151.9 L 190.0 157.6 L 194.4 163.3 L 198.8 168.8 L 203.2 174.2 L 207.6 179.5 L 212.0 94.4 L 216.4 101.3 L 220.8 108.1 L 225.2 114.7 L 229.6 121.2 L 234.0 127.6 L 238.4 133.9 L 242.8 140.0 L 247.2 146.0 L 251.6 151.9 L 256.0 157.6 L 260.4 163.3 L 264.8 168.8 L 269.2 174.2 L 273.6 179.5 L 278.0 94.4 L 282.4 101.3 L 286.8 108.1 L 291.2 114.7 L 295.6 121.2 L 300.0 127.6 L 304.4 133.9 L 308.8 140.0 L 313.2 146.0 L 317.6 151.9 L 322.0 157.6 L 326.4 163.3 L 330.8 168.8 L 335.2 174.2 L 339.6 179.5 L 344.0 94.4 L 348.4 101.3 L 352.8 108.1 L 357.2 114.7 L 361.6 121.2 L 366.0 127.6 L 370.4 133.9 L 374.8 140.0 L 379.2 146.0 L 383.6 151.9 L 388.0 157.6 L 392.4 163.3 L 396.8 168.8 L 401.2 174.2 L 405.6 179.5 L 410.0 94.4 L 414.4 101.3 L 418.8 108.1 L 423.2 114.7 L 427.6 121.2 L 432.0 127.6 L 436.4 133.9 L 440.8 140.0 L 445.2 146.0 L 449.6 151.9 L 454.0 157.6 L 458.4 163.3 L 462.8 168.8 L 467.2 174.2 L 471.6 179.5 L 476.0 94.4 L 480.4 101.3 L 484.8 108.1 L 489.2 114.7 L 493.6 121.2 L 498.0 127.6 L 502.4 133.9 L 506.8 140.0 L 511.2 146.0 L 515.6 151.9 L 520.0 157.6" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5 3"/>

    <!-- Curve Labels -->
    <g transform="translate(390, 140)">
      <rect width="120" height="84" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
      <line x1="8" y1="15" x2="28" y2="15" stroke="#059669" stroke-width="2" stroke-dasharray="4 2"/>
      <text x="34" y="18" font-size="8.5" font-weight="700" fill="#047857">Verified + Rollback</text>

      <line x1="8" y1="35" x2="28" y2="35" stroke="#7C3AED" stroke-width="2.5"/>
      <text x="34" y="38" font-size="8.5" font-weight="700" fill="#6D28D9">p = 0.99 (State of Art)</text>

      <line x1="8" y1="55" x2="28" y2="55" stroke="#2563EB" stroke-width="2.5"/>
      <text x="34" y="58" font-size="8.5" font-weight="700" fill="#1E40AF">p = 0.95 (High Quality)</text>

      <line x1="8" y1="73" x2="28" y2="73" stroke="#D97706" stroke-width="2.5"/>
      <text x="34" y="76" font-size="8.5" font-weight="700" fill="#B45309">p = 0.90 (Standard)</text>
    </g>

    <!-- Highlight Callout at step 20 -->
    <circle cx="168.0" cy="310.9450679329249" r="4" fill="#2563EB"/>
    <line x1="168.0" y1="310.9450679329249" x2="198.0" y2="285.9450679329249" stroke="#2563EB" stroke-width="1"/>
    <rect x="198.0" y="272.9450679329249" width="86" height="22" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="241.0" y="286.9450679329249" font-size="8" font-weight="700" fill="#1E40AF" text-anchor="middle">N=20: P = 35.8%</text>
  </g>

  <!-- RIGHT PANEL: SYSTEMS IMPLICATIONS -->
  <g transform="translate(565, 60)">
    <!-- Card 1: The Exponential Decay Law -->
    <g filter="url(#shadow)">
      <rect width="365" height="120" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect width="365" height="28" rx="8" fill="#0F172A"/>
      <rect y="22" width="365" height="6" fill="#0F172A"/>
      <text x="14" y="19" font-size="11" font-weight="700" fill="#FFFFFF">1. The Exponential Decay Bound</text>

      <g transform="translate(14, 38)">
        <text font-size="9.5" font-weight="700" fill="#991B1B">P_success ≤ ∏ P(step_t) ≈ p^N</text>
        <text y="16" font-size="8.5" fill="#334155">In open-loop execution, an agent must succeed at every turn.</text>
        <text y="30" font-size="8.5" fill="#334155">Even with 99% per-step reliability (p=0.99), success plunges to:</text>
        <text y="46" font-size="9" font-weight="700" fill="#475569">• N = 20 steps: <tspan fill="#7C3AED">81.8%</tspan>  |  • N = 50 steps: <tspan fill="#7C3AED">60.5%</tspan>  |  • N = 100: <tspan fill="#7C3AED">36.6%</tspan></text>
        <text y="60" font-size="8.5" fill="#DC2626" font-weight="600">At p = 0.95, a 50-step trajectory succeeds only 7.7% of the time!</text>
      </g>
    </g>

    <!-- Card 2: Why Model Scaling Fails Alone -->
    <g transform="translate(0, 134)" filter="url(#shadow)">
      <rect width="365" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect width="365" height="28" rx="8" fill="#7C2D12"/>
      <rect y="22" width="365" height="6" fill="#7C2D12"/>
      <text x="14" y="19" font-size="11" font-weight="700" fill="#FFFFFF">2. The Limits of Model Scaling</text>

      <g transform="translate(14, 38)">
        <text font-size="8.5" fill="#334155">Pushing per-step reliability from 95% to 99.9% requires exponential</text>
        <text y="14" font-size="8.5" fill="#334155">parameter scaling, compute budgets, and post-training data.</text>
        <text y="30" font-size="8.5" fill="#334155">Yet even p = 0.999 collapses at horizons of N = 1,000 steps (P = 36.8%).</text>
        <rect y="42" width="337" height="20" rx="4" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1"/>
        <text x="168" y="55" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">Reliability cannot be solved by model scale alone.</text>
      </g>
    </g>

    <!-- Card 3: The Closed-Loop Systems Solution -->
    <g transform="translate(0, 258)" filter="url(#shadow)">
      <rect width="365" height="150" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
      <rect width="365" height="28" rx="8" fill="url(#emeraldGrad)"/>
      <rect y="22" width="365" height="6" fill="#10B981"/>
      <text x="14" y="19" font-size="11" font-weight="700" fill="#FFFFFF">3. The Closed-Loop Systems Solution</text>

      <g transform="translate(14, 38)">
        <text font-size="9" font-weight="700" fill="#065F46">State Checkpoints &amp; Deterministic Oracles:</text>
        <text y="14" font-size="8.5" fill="#047857">By verifying actions at intermediate milestones, the runtime resets</text>
        <text y="27" font-size="8.5" fill="#047857">the compounding decay chain.</text>
        
        <rect y="38" width="337" height="34" rx="4" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
        <text x="10" y="52" font-size="8.5" font-weight="700" fill="#065F46">Fast Rollback + Alternative Branching:</text>
        <text x="10" y="65" font-size="8" fill="#047857">Failed actions are rolled back to checkpoint s_k rather than compounding.</text>

        <rect y="78" width="337" height="22" rx="4" fill="#D1FAE5"/>
        <text x="168" y="93" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle">Maintains &gt;85% success over arbitrary horizon lengths.</text>
      </g>
    </g>
  </g>
</svg>
