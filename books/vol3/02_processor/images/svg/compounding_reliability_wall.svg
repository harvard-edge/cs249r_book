<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: THE GRAPH                                             -->
  <!-- ================================================================= -->
  <g transform="translate(0, 0)">
    <!-- Graph Background Card -->
    <rect x="40" y="75" width="490" height="425" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Grid lines and Y-axis labels -->
    <line x1="80" y1="440.0" x2="510" y2="440.0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="444.0" font-size="8.5" text-anchor="end" fill="#64748b">0%</text>

    <line x1="80" y1="368.0" x2="510" y2="368.0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="372.0" font-size="8.5" text-anchor="end" fill="#64748b">20%</text>

    <line x1="80" y1="296.0" x2="510" y2="296.0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="300.0" font-size="8.5" text-anchor="end" fill="#64748b">40%</text>

    <line x1="80" y1="224.0" x2="510" y2="224.0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="228.0" font-size="8.5" text-anchor="end" fill="#64748b">60%</text>

    <line x1="80" y1="152.0" x2="510" y2="152.0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="156.0" font-size="8.5" text-anchor="end" fill="#64748b">80%</text>

    <line x1="80" y1="80.0" x2="510" y2="80.0" stroke="#f1f5f9" stroke-width="1"/>
    <text x="72" y="84.0" font-size="8.5" text-anchor="end" fill="#64748b">100%</text>

    <!-- X Grid lines -->
    <line x1="80.0" y1="80" x2="80.0" y2="440" stroke="#f1f5f9" stroke-width="1"/>
    <text x="80.0" y="456" font-size="8.5" text-anchor="middle" fill="#64748b">0</text>

    <line x1="168.0" y1="80" x2="168.0" y2="440" stroke="#f1f5f9" stroke-width="1"/>
    <text x="168.0" y="456" font-size="8.5" text-anchor="middle" fill="#64748b">20</text>

    <line x1="256.0" y1="80" x2="256.0" y2="440" stroke="#f1f5f9" stroke-width="1"/>
    <text x="256.0" y="456" font-size="8.5" text-anchor="middle" fill="#64748b">40</text>

    <line x1="344.0" y1="80" x2="344.0" y2="440" stroke="#f1f5f9" stroke-width="1"/>
    <text x="344.0" y="456" font-size="8.5" text-anchor="middle" fill="#64748b">60</text>

    <line x1="432.0" y1="80" x2="432.0" y2="440" stroke="#f1f5f9" stroke-width="1"/>
    <text x="432.0" y="456" font-size="8.5" text-anchor="middle" fill="#64748b">80</text>

    <line x1="510.0" y1="80" x2="510.0" y2="440" stroke="#f1f5f9" stroke-width="1"/>
    <text x="510.0" y="456" font-size="8.5" text-anchor="middle" fill="#64748b">100</text>

    <!-- Axes -->
    <line x1="80" y1="80" x2="80" y2="440" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="80" y1="440" x2="510" y2="440" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Axis Titles -->
    <text x="52" y="260.0" font-size="9" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90 52 260.0)">Trajectory Success Probability (P_success)</text>
    <text x="295.0" y="474" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Trajectory Horizon Length N (Sequential Action Steps)</text>

    <!-- Curves -->
    <path d="M 80.0 80.0 L 88.8 148.4 L 97.6 203.8 L 106.4 248.7 L 115.2 285.0 L 124.0 314.5 L 132.8 338.3 L 141.6 357.6 L 150.4 373.3 L 159.2 386.0 L 168.0 396.2 L 176.8 404.5 L 185.6 411.3 L 194.4 416.7 L 203.2 421.2 L 212.0 424.7 L 220.8 427.6 L 229.6 430.0 L 238.4 431.9 L 247.2 433.4 L 256.0 434.7 L 264.8 435.7 L 273.6 436.5 L 282.4 437.2 L 291.2 437.7 L 300.0 438.1 L 308.8 438.5 L 317.6 438.8 L 326.4 439.0 L 335.2 439.2 L 344.0 439.4 L 352.8 439.5 L 361.6 439.6 L 370.4 439.7 L 379.2 439.7 L 388.0 439.8 L 396.8 439.8 L 405.6 439.9 L 414.4 439.9 L 423.2 439.9 L 432.0 439.9 L 440.8 439.9 L 449.6 439.9 L 458.4 440.0 L 467.2 440.0 L 476.0 440.0 L 484.8 440.0 L 493.6 440.0 L 502.4 440.0 L 511.2 440.0 L 520.0 440.0" fill="none" stroke="#d97706" stroke-width="2.2"/>
    <path d="M 80.0 80.0 L 88.8 115.1 L 97.6 146.8 L 106.4 175.4 L 115.2 201.2 L 124.0 224.5 L 132.8 245.5 L 141.6 264.4 L 150.4 281.6 L 159.2 297.0 L 168.0 310.9 L 176.8 323.5 L 185.6 334.9 L 194.4 345.1 L 203.2 354.4 L 212.0 362.7 L 220.8 370.3 L 229.6 377.1 L 238.4 383.2 L 247.2 388.7 L 256.0 393.7 L 264.8 398.2 L 273.6 402.3 L 282.4 406.0 L 291.2 409.3 L 300.0 412.3 L 308.8 415.0 L 317.6 417.4 L 326.4 419.6 L 335.2 421.6 L 344.0 423.4 L 352.8 425.0 L 361.6 426.5 L 370.4 427.8 L 379.2 429.0 L 388.0 430.1 L 396.8 431.0 L 405.6 431.9 L 414.4 432.7 L 423.2 433.4 L 432.0 434.1 L 440.8 434.6 L 449.6 435.2 L 458.4 435.6 L 467.2 436.1 L 476.0 436.4 L 484.8 436.8 L 493.6 437.1 L 502.4 437.4 L 511.2 437.6 L 520.0 437.9" fill="none" stroke="#0284c7" stroke-width="2.2"/>
    <path d="M 80.0 80.0 L 88.8 87.2 L 97.6 94.2 L 106.4 101.1 L 115.2 107.8 L 124.0 114.4 L 132.8 120.9 L 141.6 127.3 L 150.4 133.5 L 159.2 139.6 L 168.0 145.6 L 176.8 151.4 L 185.6 157.2 L 194.4 162.8 L 203.2 168.3 L 212.0 173.7 L 220.8 179.0 L 229.6 184.2 L 238.4 189.3 L 247.2 194.3 L 256.0 199.2 L 264.8 204.0 L 273.6 208.7 L 282.4 213.3 L 291.2 217.8 L 300.0 222.2 L 308.8 226.5 L 317.6 230.8 L 326.4 234.9 L 335.2 239.0 L 344.0 243.0 L 352.8 246.9 L 361.6 250.8 L 370.4 254.6 L 379.2 258.2 L 388.0 261.9 L 396.8 265.4 L 405.6 268.9 L 414.4 272.3 L 423.2 275.6 L 432.0 278.9 L 440.8 282.1 L 449.6 285.2 L 458.4 288.3 L 467.2 291.3 L 476.0 294.3 L 484.8 297.2 L 493.6 300.0 L 502.4 302.8 L 511.2 305.6 L 520.0 308.2" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
    <path d="M 80.0 94.4 L 84.4 101.3 L 88.8 108.1 L 93.2 114.7 L 97.6 121.2 L 102.0 127.6 L 106.4 133.9 L 110.8 140.0 L 115.2 146.0 L 119.6 151.9 L 124.0 157.6 L 128.4 163.3 L 132.8 168.8 L 137.2 174.2 L 141.6 179.5 L 146.0 94.4 L 150.4 101.3 L 154.8 108.1 L 159.2 114.7 L 163.6 121.2 L 168.0 127.6 L 172.4 133.9 L 176.8 140.0 L 181.2 146.0 L 185.6 151.9 L 190.0 157.6 L 194.4 163.3 L 198.8 168.8 L 203.2 174.2 L 207.6 179.5 L 212.0 94.4 L 216.4 101.3 L 220.8 108.1 L 225.2 114.7 L 229.6 121.2 L 234.0 127.6 L 238.4 133.9 L 242.8 140.0 L 247.2 146.0 L 251.6 151.9 L 256.0 157.6 L 260.4 163.3 L 264.8 168.8 L 269.2 174.2 L 273.6 179.5 L 278.0 94.4 L 282.4 101.3 L 286.8 108.1 L 291.2 114.7 L 295.6 121.2 L 300.0 127.6 L 304.4 133.9 L 308.8 140.0 L 313.2 146.0 L 317.6 151.9 L 322.0 157.6 L 326.4 163.3 L 330.8 168.8 L 335.2 174.2 L 339.6 179.5 L 344.0 94.4 L 348.4 101.3 L 352.8 108.1 L 357.2 114.7 L 361.6 121.2 L 366.0 127.6 L 370.4 133.9 L 374.8 140.0 L 379.2 146.0 L 383.6 151.9 L 388.0 157.6 L 392.4 163.3 L 396.8 168.8 L 401.2 174.2 L 405.6 179.5 L 410.0 94.4 L 414.4 101.3 L 418.8 108.1 L 423.2 114.7 L 427.6 121.2 L 432.0 127.6 L 436.4 133.9 L 440.8 140.0 L 445.2 146.0 L 449.6 151.9 L 454.0 157.6 L 458.4 163.3 L 462.8 168.8 L 467.2 174.2 L 471.6 179.5 L 476.0 94.4 L 480.4 101.3 L 484.8 108.1 L 489.2 114.7 L 493.6 121.2 L 498.0 127.6 L 502.4 133.9 L 506.8 140.0 L 511.2 146.0 L 515.6 151.9 L 520.0 157.6" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="4 2"/>

    <!-- Curve Legend Box -->
    <g transform="translate(365, 95)">
      <rect width="145" height="85" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="10" y1="18" x2="30" y2="18" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 2"/>
      <text x="36" y="21" font-size="8" font-weight="700" fill="#15803d">Verified + Rollback</text>

      <line x1="10" y1="38" x2="30" y2="38" stroke="#7c3aed" stroke-width="2.2"/>
      <text x="36" y="41" font-size="8" font-weight="700" fill="#6d28d9">p = 0.99 (State of Art)</text>

      <line x1="10" y1="58" x2="30" y2="58" stroke="#0284c7" stroke-width="2.2"/>
      <text x="36" y="61" font-size="8" font-weight="700" fill="#0369a1">p = 0.95 (High Quality)</text>

      <line x1="10" y1="75" x2="30" y2="75" stroke="#d97706" stroke-width="2.2"/>
      <text x="36" y="78" font-size="8" font-weight="700" fill="#b45309">p = 0.90 (Standard)</text>
    </g>

    <!-- Highlight Callout at step 20 -->
    <circle cx="168.0" cy="310.9" r="3.5" fill="#0284c7"/>
    <line x1="168.0" y1="310.9" x2="198.0" y2="285.9" stroke="#0284c7" stroke-width="1"/>
    <rect x="198.0" y="272.9" width="92" height="22" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="244.0" y="287.0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">N=20: P = 35.8%</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: SYSTEMS IMPLICATIONS                                 -->
  <!-- ================================================================= -->
  <g transform="translate(550, 75)">
    <!-- Card 1: The Exponential Decay Law -->
    <g>
      <rect width="370" height="126" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect width="370" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">1. THE EXPONENTIAL DECAY BOUND</text>

      <g transform="translate(12, 36)">
        <text font-family="Courier, monospace" font-size="9" font-weight="700" fill="#991b1b">P_success ≤ ∏ P(step_t) ≈ p^N</text>
        <text y="16" font-size="8" fill="#334155">In open-loop execution, an agent must succeed at every turn.</text>
        <text y="30" font-size="8" fill="#334155">Even with 99% per-step reliability (p=0.99), success collapses:</text>
        <text y="46" font-size="8.5" font-weight="700" fill="#475569">• N = 20: <tspan fill="#7c3aed">81.8%</tspan>  |  • N = 50: <tspan fill="#7c3aed">60.5%</tspan>  |  • N = 100: <tspan fill="#7c3aed">36.6%</tspan></text>
        <text y="62" font-size="8" fill="#dc2626" font-weight="700">At p = 0.95, a 50-step trajectory succeeds only 7.7% of the time!</text>
      </g>
    </g>

    <!-- Card 2: Why Model Scaling Fails Alone -->
    <g transform="translate(0, 138)">
      <rect width="370" height="120" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect width="370" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">2. THE LIMITS OF MODEL SCALING</text>

      <g transform="translate(12, 36)">
        <text font-size="8" fill="#334155">Pushing per-step reliability from 95% to 99.9% requires exponential</text>
        <text y="14" font-size="8" fill="#334155">parameter scaling, compute budgets, and post-training data.</text>
        <text y="28" font-size="8" fill="#334155">Yet even p = 0.999 collapses at horizons of N = 1,000 steps (P = 36.8%).</text>
        <rect y="40" width="346" height="20" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
        <text x="173" y="53" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">Reliability cannot be solved by model scale alone.</text>
      </g>
    </g>

    <!-- Card 3: The Closed-Loop Systems Solution -->
    <g transform="translate(0, 270)">
      <rect width="370" height="155" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect width="370" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. THE CLOSED-LOOP SYSTEMS SOLUTION</text>

      <g transform="translate(12, 36)">
        <text font-size="8.5" font-weight="700" fill="#15803d">State Checkpoints &amp; Deterministic Oracles:</text>
        <text y="14" font-size="8" fill="#334155">By verifying actions at intermediate milestones, the runtime resets</text>
        <text y="26" font-size="8" fill="#334155">the compounding decay chain.</text>
        
        <rect y="38" width="346" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="51" font-size="8" font-weight="700" fill="#15803d">Fast Rollback + Alternative Branching:</text>
        <text x="10" y="64" font-size="7.5" fill="#64748b">Failed actions are rolled back to checkpoint s_k rather than compounding.</text>

        <rect y="80" width="346" height="22" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
        <text x="173" y="94" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Maintains &gt;85% success over arbitrary horizon lengths.</text>
      </g>
    </g>
  </g>
</g>
</svg>