<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#334155"/>
    </marker>
    <marker id="arr-emerald" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#059669"/>
    </marker>
    <marker id="arr-crimson" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- MAIN ROOFLINE MODEL PLOT (LEFT PANEL)                             -->
  <!-- ================================================================= -->
  <g transform="translate(10, 15)">
    <!-- Plot Frame Background -->
    <rect x="75" y="25" width="555" height="360" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

    <!-- Memory-Bound Zone Shading -->
    <path d="M 90,355 L 551,68 L 551,355 Z" fill="#fee2e2" opacity="0.35"/>
    <!-- Compute-Bound Zone Shading -->
    <path d="M 551,68 L 620,68 L 620,355 L 551,355 Z" fill="#dcfce7" opacity="0.35"/>

    <!-- Zone Watermarks -->
    <text x="260" y="340" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c" letter-spacing="0.5">MEMORY-BANDWIDTH BOUND REGIME</text>
    <text x="585" y="160" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle" transform="rotate(90 585 160)" letter-spacing="0.5">COMPUTE BOUND</text>

    <!-- Grid Lines (Horizontal: 1, 10, 100, 1000 TFLOP/s) -->
    <line x1="90" y1="355" x2="620" y2="355" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="90" y1="260" x2="620" y2="260" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="90" y1="164" x2="620" y2="164" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="90" y1="68" x2="620" y2="68" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Grid Lines (Vertical: 0.1, 1, 10, 100, 1000 FLOP/byte) -->
    <line x1="90" y1="35" x2="90" y2="355" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="222" y1="35" x2="222" y2="355" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="355" y1="35" x2="355" y2="355" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="488" y1="35" x2="488" y2="355" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="620" y1="35" x2="620" y2="355" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Axes -->
    <line x1="90" y1="355" x2="90" y2="30" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <line x1="90" y1="355" x2="628" y2="355" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <!-- Axis Labels -->
    <text x="355" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Operational / Arithmetic Intensity ℐ (FLOPs / Byte)</text>
    <text x="36" y="195" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 36 195)">Attainable Performance P (TFLOP/s)</text>

    <!-- X-axis Scale Numbers -->
    <text x="90" y="372" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">0.1</text>
    <text x="222" y="372" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">1</text>
    <text x="355" y="372" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">10</text>
    <text x="488" y="372" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">100</text>
    <text x="620" y="372" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">1000</text>

    <!-- Y-axis Scale Numbers -->
    <text x="82" y="358" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">1</text>
    <text x="82" y="263" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">10</text>
    <text x="82" y="167" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">100</text>
    <text x="82" y="71" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">1000</text>

    <!-- ================================================================= -->
    <!-- THE HARDWARE ROOFLINE CURVE (NVIDIA H100 SXM5 GPU)                -->
    <!-- Slope = Memory Bandwidth B_mem = 3.35 TB/s                        -->
    <!-- Peak Compute P_peak = 989 TFLOP/s (BF16 Tensor Cores)             -->
    <!-- Ridge Point ℐ* = 295.2 FLOP/Byte                                  -->
    <!-- ================================================================= -->

    <!-- Memory Bandwidth Bound Slanted Line -->
    <line x1="160" y1="355" x2="551" y2="68" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Peak Compute Ceiling Horizontal Line -->
    <line x1="551" y1="68" x2="620" y2="68" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Ceiling Label Text (Above ceiling, clean) -->
    <rect x="440" y="44" width="170" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="525" y="56" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a">P_peak = 989 TFLOP/s (BF16)</text>

    <!-- Bandwidth Slope Text (Parallel to slanted line, offset cleanly) -->
    <text x="350" y="194" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#334155" transform="rotate(-36.3 350 194)">Slope: B_mem = 3.35 TB/s (HBM3)</text>

    <!-- Ridge Point Knee Indicator -->
    <circle cx="551" cy="68" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="551" y1="72" x2="551" y2="355" stroke="#0f172a" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="521" y="334" width="60" height="16" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
    <text x="551" y="346" text-anchor="middle" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a">ℐ* = 295.2</text>

    <!-- ================================================================= -->
    <!-- OPERATING POINT 1: AUTOREGRESSIVE DECODE (GEMV, B=1)              -->
    <!-- ℐ = 1.0 (x=222), P = 3.35 TFLOP/s (y=307)                        -->
    <!-- ================================================================= -->
    <circle cx="222" cy="307" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="222" cy="307" r="8" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Decode Leader Line & Callout Box (Left open region) -->
    <path d="M 222,307 L 185,250 L 100,250" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <g transform="translate(100, 175)">
      <rect width="170" height="72" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <rect width="4" height="72" rx="1" fill="#dc2626"/>
      <text x="12" y="15" font-size="8" font-weight="700" fill="#dc2626">PHASE 2: DECODE (GEMV, B=1)</text>
      <text x="12" y="29" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">ℐ_decode ≈ 1.0 FLOP/Byte</text>
      <text x="12" y="42" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">Attained: P ≈ 3.35 TFLOP/s</text>
      <text x="12" y="55" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b">Tensor Core: &lt; 0.5% (Bus Stall)</text>
      <text x="12" y="66" font-size="6.5" fill="#64748b">Irreducible parameter shuttle floor</text>
    </g>

    <!-- ================================================================= -->
    <!-- OPERATING POINT 2: CONTEXT PREFILL (GEMM, S >> 1)                 -->
    <!-- ℐ = 512 (x=588), P = 989 TFLOP/s (y=68)                           -->
    <!-- ================================================================= -->
    <circle cx="588" cy="68" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="588" cy="68" r="8" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Prefill Leader Line & Callout Box (Upper-left open region) -->
    <path d="M 588,68 L 588,88 L 380,88" fill="none" stroke="#059669" stroke-width="1.2"/>
    <g transform="translate(210, 52)">
      <rect width="170" height="72" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <rect width="4" height="72" rx="1" fill="#059669"/>
      <text x="12" y="15" font-size="8" font-weight="700" fill="#059669">PHASE 1: PREFILL (GEMM, S &gt;&gt; 1)</text>
      <text x="12" y="29" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">ℐ_prefill ≈ S / b_elem ≈ 512</text>
      <text x="12" y="42" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" fill="#059669">Attained: P ≈ 950 TFLOP/s</text>
      <text x="12" y="55" font-size="7" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d">Tensor Core: &gt; 90% (Saturated)</text>
      <text x="12" y="66" font-size="6.5" fill="#64748b">Compute-bound matrix multiplication</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: KERNEL GEOMETRY & MATHEMATICAL FORMULATION           -->
  <!-- ================================================================= -->
  <g transform="translate(660, 15)" filter="url(#cardShadow)">
    <rect width="270" height="410" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="270" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="270" height="10" y="16" fill="#f1f5f9"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Kernel Matrix Geometry</text>

    <!-- Inset A: Decode (GEMV) -->
    <g transform="translate(12, 36)">
      <rect width="246" height="112" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#dc2626">Autoregressive Decode: GEMV (B=1)</text>

      <!-- Geometry graphic: narrow vector x matrix = vector -->
      <g transform="translate(20, 24)">
        <rect x="0" y="4" width="8" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="4" y="24" text-anchor="middle" font-size="6" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b">x</text>

        <text x="16" y="24" font-size="8" fill="#334155">×</text>

        <rect x="26" y="0" width="42" height="42" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
        <text x="47" y="24" text-anchor="middle" font-size="6.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">W_{d×d}</text>

        <text x="76" y="24" font-size="8" fill="#334155">=</text>

        <rect x="86" y="4" width="8" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="90" y="24" text-anchor="middle" font-size="6" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b">y</text>
      </g>

      <text x="10" y="80" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Memory: Read 140 GB weights / token</text>
      <text x="10" y="93" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">Computation: 2 FLOPs per parameter</text>
      <text x="10" y="105" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b">Arithmetic Intensity: ℐ ≈ 1.0 FLOP/byte</text>
    </g>

    <!-- Inset B: Prefill (GEMM) -->
    <g transform="translate(12, 156)">
      <rect width="246" height="116" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#059669">Context Prefill: GEMM (S &gt;&gt; 1)</text>

      <!-- Geometry graphic: large matrix x matrix = matrix -->
      <g transform="translate(20, 24)">
        <rect x="0" y="0" width="22" height="42" fill="#dcfce7" stroke="#059669" stroke-width="1"/>
        <text x="11" y="24" text-anchor="middle" font-size="6" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">X_{S×d}</text>

        <text x="28" y="24" font-size="8" fill="#334155">×</text>

        <rect x="38" y="0" width="42" height="42" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
        <text x="59" y="24" text-anchor="middle" font-size="6.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">W_{d×d}</text>

        <text x="86" y="24" font-size="8" fill="#334155">=</text>

        <rect x="96" y="0" width="22" height="42" fill="#dcfce7" stroke="#059669" stroke-width="1"/>
        <text x="107" y="24" text-anchor="middle" font-size="6" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Y_{S×d}</text>
      </g>

      <text x="10" y="80" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Memory: Share 140 GB weights over S rows</text>
      <text x="10" y="93" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" fill="#059669">Amortization: Weight fetch reused across tokens</text>
      <text x="10" y="106" font-size="6.8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#059669">Arithmetic Intensity: ℐ ≈ S FLOP/byte</text>
    </g>

    <!-- Inset C: Roofline Governing Law -->
    <g transform="translate(12, 280)">
      <rect width="246" height="118" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Roofline Governing Formulation</text>
      
      <text x="10" y="32" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#0284c7">P(ℐ) = min( P_peak, ℐ · B_mem )</text>
      <text x="10" y="48" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#334155">ℐ* = P_peak / B_mem = 295.2</text>
      
      <line x1="10" y1="58" x2="236" y2="58" stroke="#e2e8f0" stroke-width="0.8"/>
      
      <text x="10" y="72" font-size="7.5" font-weight="700" fill="#0f172a">Architectural Implication:</text>
      <text x="10" y="86" font-size="7.2" fill="#64748b">Decode cannot saturate tensor cores without batching (B ↑) or speculation (ρ &gt; 1).</text>
      <text x="10" y="100" font-size="7.2" fill="#64748b">Prefill saturates silicon immediately at sequence lengths S ≥ 295 tokens.</text>
    </g>
  </g>
</svg>
