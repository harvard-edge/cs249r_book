<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers calibrated for academic systems schematics -->
    <marker id="arr-navy" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#1E3A5F"/>
    </marker>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- MAIN ROOFLINE MODEL COORDINATE PLOT (LEFT PANEL)                  -->
  <!-- ================================================================= -->
  <g transform="translate(10, 10)">
    <!-- Plot Frame Background -->
    <rect x="75" y="35" width="545" height="340" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>

    <!-- Memory-Bound Zone Shading -->
    <path d="M 90,360 L 541,73 L 541,360 Z" fill="#FEF2F2" opacity="0.5"/>
    <!-- Compute-Bound Zone Shading -->
    <path d="M 541,73 L 610,73 L 610,360 L 541,360 Z" fill="#EFF6FF" opacity="0.5"/>

    <!-- Grid Lines (Horizontal: 1, 10, 100, 1000 TFLOP/s) -->
    <line x1="90" y1="360" x2="610" y2="360" stroke="#E2E8F0" stroke-width="0.8"/>
    <line x1="90" y1="264" x2="610" y2="264" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="90" y1="168" x2="610" y2="168" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="90" y1="73" x2="610" y2="73" stroke="#E2E8F0" stroke-width="0.8"/>

    <!-- Grid Lines (Vertical: 0.1, 1, 10, 100, 1000 FLOP/byte) -->
    <line x1="90" y1="45" x2="90" y2="360" stroke="#E2E8F0" stroke-width="0.8"/>
    <line x1="220" y1="45" x2="220" y2="360" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="350" y1="45" x2="350" y2="360" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="480" y1="45" x2="480" y2="360" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="610" y1="45" x2="610" y2="360" stroke="#E2E8F0" stroke-width="0.8"/>

    <!-- Axes -->
    <line x1="90" y1="360" x2="90" y2="40" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="90" y1="360" x2="618" y2="360" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <!-- Axis Labels -->
    <text x="350" y="396" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A">Operational / Arithmetic Intensity ℐ (FLOPs / Byte)</text>
    <text x="40" y="205" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle" transform="rotate(-90 40 205)">Attainable Performance P (TFLOP/s)</text>

    <!-- X-axis Numbers -->
    <text x="90" y="375" text-anchor="middle" font-size="7" font-family="Courier New, monospace" fill="#475569">0.1</text>
    <text x="220" y="375" text-anchor="middle" font-size="7" font-family="Courier New, monospace" fill="#475569">1</text>
    <text x="350" y="375" text-anchor="middle" font-size="7" font-family="Courier New, monospace" fill="#475569">10</text>
    <text x="480" y="375" text-anchor="middle" font-size="7" font-family="Courier New, monospace" fill="#475569">100</text>
    <text x="610" y="375" text-anchor="middle" font-size="7" font-family="Courier New, monospace" fill="#475569">1000</text>

    <!-- Y-axis Numbers -->
    <text x="82" y="363" text-anchor="end" font-size="7" font-family="Courier New, monospace" fill="#475569">1</text>
    <text x="82" y="267" text-anchor="end" font-size="7" font-family="Courier New, monospace" fill="#475569">10</text>
    <text x="82" y="171" text-anchor="end" font-size="7" font-family="Courier New, monospace" fill="#475569">100</text>
    <text x="82" y="76" text-anchor="end" font-size="7" font-family="Courier New, monospace" fill="#475569">1000</text>

    <!-- ================================================================= -->
    <!-- THE ROOFLINE CURVE (H100 SXM5 REFERENCE)                          -->
    <!-- Slope = Memory Bandwidth B_mem = 3.35 TB/s                        -->
    <!-- Peak Compute P_peak = 989 TFLOP/s (BF16 Tensor Cores)             -->
    <!-- Ridge Point ℐ* = 295.2 FLOP/Byte (x = 541, y = 73)                -->
    <!-- ================================================================= -->

    <!-- Memory Bandwidth Bound Slanted Line -->
    <line x1="158" y1="360" x2="541" y2="73" stroke="#1E3A5F" stroke-width="2.5"/>

    <!-- Peak Compute Ceiling Horizontal Line -->
    <line x1="541" y1="73" x2="610" y2="73" stroke="#1E3A5F" stroke-width="2.5"/>

    <!-- Ceiling Label -->
    <rect x="430" y="48" width="175" height="18" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="0.8"/>
    <text x="517" y="60" text-anchor="middle" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">P_peak = 989 TFLOP/s (BF16)</text>

    <!-- Bandwidth Slope Badge -->
    <rect x="305" y="195" width="165" height="18" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="0.8"/>
    <text x="387" y="207" text-anchor="middle" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">Slope: B_mem = 3.35 TB/s (HBM3)</text>

    <!-- Ridge Point Knee Indicator -->
    <circle cx="541" cy="73" r="3.5" fill="#ffffff" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="541" y1="77" x2="541" y2="360" stroke="#1E3A5F" stroke-width="0.8" stroke-dasharray="2,2"/>
    <rect x="512" y="340" width="58" height="14" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="0.6"/>
    <text x="541" y="350" text-anchor="middle" font-size="6.2" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">ℐ* = 295.2</text>

    <!-- ================================================================= -->
    <!-- OPERATING POINT 1: AUTOREGRESSIVE DECODE (GEMV)                   -->
    <!-- ℐ = 1.0 (x=220), P = 3.35 TFLOP/s (y=310)                        -->
    <!-- ================================================================= -->
    <circle cx="220" cy="310" r="4.5" fill="#991B1B" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="220" cy="310" r="7.5" fill="none" stroke="#991B1B" stroke-width="0.8" stroke-dasharray="2,1"/>

    <!-- Decode Leader Line & Callout Card -->
    <path d="M 220,310 L 195,250 L 105,250" fill="none" stroke="#991B1B" stroke-width="1"/>
    <g transform="translate(105, 175)">
      <rect width="165" height="70" rx="1" fill="#ffffff" stroke="#991B1B" stroke-width="1"/>
      <rect width="3" height="70" fill="#991B1B"/>
      <text x="10" y="14" font-size="7.2" font-weight="700" fill="#991B1B">PHASE 2: DECODE (GEMV)</text>
      <text x="10" y="27" font-size="6.5" font-family="Courier New, monospace" fill="#334155">ℐ_decode ≈ 1.0 FLOP/Byte</text>
      <text x="10" y="40" font-size="6.5" font-family="Courier New, monospace" fill="#991B1B">Attained: P ≈ 3.35 TFLOP/s</text>
      <text x="10" y="53" font-size="6.5" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">Tensor Core: &lt; 0.5% (Bus Stall)</text>
      <text x="10" y="65" font-size="6" fill="#475569">Memory-Bandwidth Bound</text>
    </g>

    <!-- ================================================================= -->
    <!-- OPERATING POINT 2: CONTEXT PREFILL (GEMM)                         -->
    <!-- ℐ = 512 (x=578), P = 989 TFLOP/s (y=73)                           -->
    <!-- ================================================================= -->
    <circle cx="578" cy="73" r="4.5" fill="#0F766E" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="578" cy="73" r="7.5" fill="none" stroke="#0F766E" stroke-width="0.8" stroke-dasharray="2,1"/>

    <!-- Prefill Leader Line & Callout Card -->
    <path d="M 578,73 L 520,105 L 355,105" fill="none" stroke="#0F766E" stroke-width="1"/>
    <g transform="translate(355, 75)">
      <rect width="165" height="70" rx="1" fill="#ffffff" stroke="#0F766E" stroke-width="1"/>
      <rect width="3" height="70" fill="#0F766E"/>
      <text x="10" y="14" font-size="7.2" font-weight="700" fill="#0F766E">PHASE 1: PREFILL (GEMM)</text>
      <text x="10" y="27" font-size="6.5" font-family="Courier New, monospace" fill="#334155">ℐ_prefill ≈ S / b_elem ≈ 512</text>
      <text x="10" y="40" font-size="6.5" font-family="Courier New, monospace" fill="#0F766E">Attained: P ≈ 950 TFLOP/s</text>
      <text x="10" y="53" font-size="6.5" font-family="Courier New, monospace" font-weight="700" fill="#0F766E">Tensor Core: &gt; 90% (Saturated)</text>
      <text x="10" y="65" font-size="6" fill="#475569">Compute-Bound Execution</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: KERNEL GEOMETRY & ARCHITECTURAL MITIGATIONS          -->
  <!-- ================================================================= -->
  <g transform="translate(650, 45)">
    <rect width="285" height="340" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <rect width="285" height="24" rx="2" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">KERNEL MATRIX GEOMETRY</text>

    <!-- Inset A: Decode (GEMV) -->
    <g transform="translate(12, 32)">
      <rect width="261" height="92" rx="1" fill="#ffffff" stroke="#991B1B" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7" font-weight="700" fill="#991B1B">Autoregressive Decode: GEMV (B=1)</text>

      <!-- Geometry graphic: narrow vector x matrix = vector -->
      <g transform="translate(20, 20)">
        <rect x="0" y="6" width="6" height="32" fill="#FEE2E2" stroke="#991B1B" stroke-width="0.8"/>
        <text x="3" y="24" text-anchor="middle" font-size="5" font-family="Courier New, monospace" fill="#991B1B">x</text>

        <text x="14" y="24" font-size="8" fill="#334155">×</text>

        <rect x="24" y="2" width="40" height="40" fill="#F8FAFC" stroke="#334155" stroke-width="0.8"/>
        <text x="44" y="24" text-anchor="middle" font-size="6" font-family="Courier New, monospace" fill="#475569">W_{d×d}</text>

        <text x="70" y="24" font-size="8" fill="#334155">=</text>

        <rect x="80" y="6" width="6" height="32" fill="#FEE2E2" stroke="#991B1B" stroke-width="0.8"/>
        <text x="83" y="24" text-anchor="middle" font-size="5" font-family="Courier New, monospace" fill="#991B1B">y</text>
      </g>

      <text x="10" y="74" font-size="6" font-family="Courier New, monospace" fill="#475569">Memory: Read 140 GB weights / token</text>
      <text x="10" y="85" font-size="6" font-family="Courier New, monospace" fill="#991B1B">Computation: 2 FLOPs per parameter</text>
    </g>

    <!-- Inset B: Prefill (GEMM) -->
    <g transform="translate(12, 130)">
      <rect width="261" height="96" rx="1" fill="#ffffff" stroke="#0F766E" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7" font-weight="700" fill="#0F766E">Context Prefill: GEMM (S &gt;&gt; 1)</text>

      <!-- Geometry graphic: large matrix x matrix = matrix -->
      <g transform="translate(20, 20)">
        <rect x="0" y="2" width="18" height="40" fill="#F0FDF4" stroke="#0F766E" stroke-width="0.8"/>
        <text x="9" y="24" text-anchor="middle" font-size="5" font-family="Courier New, monospace" fill="#0F766E">X_{S×d}</text>

        <text x="24" y="24" font-size="8" fill="#334155">×</text>

        <rect x="34" y="2" width="40" height="40" fill="#F8FAFC" stroke="#334155" stroke-width="0.8"/>
        <text x="54" y="24" text-anchor="middle" font-size="6" font-family="Courier New, monospace" fill="#475569">W_{d×d}</text>

        <text x="80" y="24" font-size="8" fill="#334155">=</text>

        <rect x="90" y="2" width="18" height="40" fill="#F0FDF4" stroke="#0F766E" stroke-width="0.8"/>
        <text x="99" y="24" text-anchor="middle" font-size="5" font-family="Courier New, monospace" fill="#0F766E">Y_{S×d}</text>
      </g>

      <text x="10" y="76" font-size="6" font-family="Courier New, monospace" fill="#475569">Memory: Share 140 GB weights over S rows</text>
      <text x="10" y="88" font-size="6" font-family="Courier New, monospace" fill="#0F766E">Amortization: ℐ scales linearly with S</text>
    </g>

    <!-- Systems Solutions Panel -->
    <g transform="translate(12, 232)">
      <rect width="261" height="98" rx="1" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7" font-weight="700" fill="#0F172A">Architectural Systems Solutions</text>

      <text x="10" y="28" font-size="6.5" font-weight="700" fill="#991B1B">Decode Memory Wall:</text>
      <text x="10" y="41" font-size="6" fill="#334155">• Continuous Batching (B ↑ amortizes W)</text>
      <text x="10" y="52" font-size="6" fill="#334155">• Speculative Decoding (p &gt; 1 tokens/step)</text>

      <text x="10" y="68" font-size="6.5" font-weight="700" fill="#0F766E">Prefill Phase Interference:</text>
      <text x="10" y="81" font-size="6" fill="#334155">• Chunked Prefill (Sarathi-Serve)</text>
      <text x="10" y="92" font-size="6" fill="#334155">• Prefill-Decode Disaggregation (SplitWise)</text>
    </g>
  </g>

  <!-- Bottom Global Metric Banner -->
  <g transform="translate(40, 420)">
    <rect width="895" height="58" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Metric Formula Left -->
    <g transform="translate(16, 10)">
      <text x="0" y="14" font-size="7.2" font-weight="700" fill="#1E3A5F">Operational Intensity Law:</text>
      <text x="0" y="28" font-size="6.5" font-family="Courier New, monospace" fill="#334155">ℐ = Total Operations (FLOPs) / Total Memory Transferred (Bytes)</text>
      <text x="0" y="41" font-size="6.5" font-family="Courier New, monospace" fill="#475569">Attainable Performance: P(ℐ) = min( P_peak, ℐ · B_mem )</text>
    </g>

    <!-- Metric Specs Right -->
    <g transform="translate(570, 10)">
      <rect width="310" height="38" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="0.6"/>
      <text x="10" y="14" font-size="6.5" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">H100 SXM5 Hardware Baseline:</text>
      <text x="10" y="25" font-size="6" font-family="Courier New, monospace" fill="#475569">P_peak = 989 TFLOP/s (BF16) | B_mem = 3.35 TB/s (HBM3)</text>
      <text x="10" y="34" font-size="6" font-family="Courier New, monospace" fill="#0F766E">Hardware Ridge Point: ℐ* = 295.2 FLOP/Byte</text>
    </g>
  </g>
</svg>
