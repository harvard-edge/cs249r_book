<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="440" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEVEL 0: ROOT SUPERVISOR (x: 240, y: 75, w: 440, h: 92)          -->
  <!-- ================================================================= -->
  <g transform="translate(240, 75)">
    <rect x="0" y="0" width="440" height="92" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">ROOT SUPERVISOR (Principal Authority)</text>

    <text x="14" y="38" font-size="8" font-weight="700" fill="#334155">Full Authority C_0:</text>
    <text x="115" y="38" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">{ ReadFS, WriteFS, ExecBash, NetHTTP, GitCommit, CloudDeploy }</text>

    <text x="14" y="55" font-size="8" font-weight="700" fill="#334155">Resource Quota:</text>
    <text x="115" y="55" font-family="Courier, monospace" font-size="7.8" fill="#475569">Budget: $50.00 • 500,000 Tokens • TTL: 24h</text>

    <text x="14" y="72" font-size="8" font-weight="700" fill="#334155">Lease Token:</text>
    <text x="115" y="72" font-family="Courier, monospace" font-size="7.5" fill="#64748b">HMAC_SHA256(principal_id, C_0, TTL, k_sys)</text>

    <rect x="14" y="81" width="412" height="3" rx="1" fill="#0284c7"/>
  </g>

  <!-- Delegation Line 1: Root -> Child 1A -->
  <path d="M350,167 L350,190 L210,190 L210,210" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="275" y="185" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#0369a1">delegate(C_1A, $5, 30m)</text>

  <!-- Delegation Line 2: Root -> Child 1B -->
  <path d="M570,167 L570,190 L710,190 L710,210" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="645" y="185" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" fill="#15803d">delegate(C_1B, $20, 2h)</text>

  <!-- ================================================================= -->
  <!-- LEVEL 1: SUBAGENTS                                                -->
  <!-- ================================================================= -->
  <!-- CHILD 1A: Repository Research Agent (x: 40, y: 210, w: 340, h: 108) -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="340" height="108" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">CHILD SUBAGENT 1A: Repository Research</text>

    <text x="12" y="39" font-size="8" font-weight="700" fill="#0369a1">Granted (C_1A ⊂ C_0):</text>
    <rect x="110" y="28" width="218" height="16" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="115" y="39" font-family="Courier, monospace" font-size="7.5" fill="#15803d">ReadFS, NetHTTP(allowlist: [docs, git])</text>

    <text x="12" y="59" font-size="8" font-weight="700" fill="#991b1b">Revoked / Stripped:</text>
    <rect x="110" y="48" width="218" height="16" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="115" y="59" font-family="Courier, monospace" font-size="7.5" fill="#991b1b">WriteFS, ExecBash, GitCommit, CloudDeploy</text>

    <text x="12" y="79" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="110" y="79" font-family="Courier, monospace" font-size="7.8" fill="#334155">Budget: $5.00 • 50k Tokens • TTL: 30m</text>

    <text x="12" y="97" font-size="7.5" fill="#64748b">Isolation Boundary: Read-only network egress; zero FS write access</text>
  </g>

  <!-- CHILD 1B: Code Implementation Agent (x: 540, y: 210, w: 340, h: 108) -->
  <g transform="translate(540, 210)">
    <rect x="0" y="0" width="340" height="108" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">CHILD SUBAGENT 1B: Code Implementation</text>

    <text x="12" y="39" font-size="8" font-weight="700" fill="#15803d">Granted (C_1B ⊂ C_0):</text>
    <rect x="110" y="28" width="218" height="16" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="115" y="39" font-family="Courier, monospace" font-size="7.5" fill="#15803d">ReadFS, WriteFS(/src/*), ExecBash(gVisor)</text>

    <text x="12" y="59" font-size="8" font-weight="700" fill="#991b1b">Revoked / Stripped:</text>
    <rect x="110" y="48" width="218" height="16" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="115" y="59" font-family="Courier, monospace" font-size="7.5" fill="#991b1b">NetHTTP, GitCommit, CloudDeploy</text>

    <text x="12" y="79" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="110" y="79" font-family="Courier, monospace" font-size="7.8" fill="#334155">Budget: $20.00 • 200k Tokens • TTL: 2h</text>

    <text x="12" y="97" font-size="7.5" fill="#64748b">Isolation Boundary: Ephemeral sandbox; zero external network ingress</text>
  </g>

  <!-- Delegation Line 3: Child 1B -> Grandchild 2A -->
  <path d="M710,318 L710,345" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="718" y="335" font-family="Courier, monospace" font-size="7.5" fill="#15803d">spawn_tester(C_2A)</text>

  <!-- ================================================================= -->
  <!-- LEVEL 2: FORMAL INVARIANTS & GRANDCHILD SUBAGENT                  -->
  <!-- ================================================================= -->
  <!-- FORMAL SPECIFICATION INVARIANTS (x: 40, y: 345, w: 470, h: 95)    -->
  <g transform="translate(40, 345)">
    <rect x="0" y="0" width="470" height="95" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="470" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">FORMAL CAPABILITY ATTENUATION INVARIANTS</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#334155">1. Monotonicity:</text>
    <text x="110" y="38" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">C_{child} ⊆ C_{parent}</text>
    <text x="240" y="38" font-size="7.5" fill="#64748b">(Privilege escalation mathematically impossible)</text>

    <text x="12" y="55" font-size="8" font-weight="700" fill="#334155">2. Quota Boundedness:</text>
    <text x="110" y="55" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">∑ Quota_{child} ≤ RemainingQuota_{parent}</text>
    <text x="320" y="55" font-size="7.5" fill="#64748b">(Strict budget sub-allocation)</text>

    <text x="12" y="72" font-size="8" font-weight="700" fill="#334155">3. Temporal Bound:</text>
    <text x="110" y="72" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">TTL_{child} ≤ TTL_{parent}</text>
    <text x="255" y="72" font-size="7.5" fill="#64748b">(Orphaned runaway subagents impossible)</text>

    <text x="12" y="87" font-size="7" font-weight="700" fill="#0284c7">Enforcement: Cryptographic lease signatures validated at runtime kernel barrier outside neural context.</text>
  </g>

  <!-- GRANDCHILD 2A: Unit Test Runner (x: 540, y: 345, w: 340, h: 95)  -->
  <g transform="translate(540, 345)">
    <rect x="0" y="0" width="340" height="95" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">GRANDCHILD 2A: Ephemeral Test Runner</text>

    <text x="12" y="38" font-size="8" font-weight="700" fill="#15803d">Granted (C_2A ⊂ C_1B):</text>
    <rect x="115" y="27" width="213" height="16" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="120" y="38" font-family="Courier, monospace" font-size="7.5" fill="#15803d">ReadFS(/src/*), ExecBash(pytest tests/)</text>

    <text x="12" y="57" font-size="8" font-weight="700" fill="#991b1b">Revoked / Stripped:</text>
    <rect x="115" y="46" width="213" height="16" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="120" y="57" font-family="Courier, monospace" font-size="7.5" fill="#991b1b">WriteFS (Filesystem mutation revoked)</text>

    <text x="12" y="75" font-size="8" font-weight="700" fill="#475569">Attenuated Quota:</text>
    <text x="115" y="75" font-family="Courier, monospace" font-size="7.8" fill="#334155">Budget: $2.00 • 20k Tokens • TTL: 5m</text>

    <text x="12" y="88" font-size="7.2" fill="#64748b">Isolation: Ephemeral disposable microVM container</text>
  </g>

</g>
</svg>