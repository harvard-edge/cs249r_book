<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 920 580" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 920 580" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 920 580" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 920 580" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 920 580" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="920" height="580" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ========================================================================= -->
  <!-- PANEL 1: TRADITIONAL AI (Stateless Request-Response)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 75)">
    <rect width="840" height="175" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect width="840" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">1. TRADITIONAL AI: STATELESS REQUEST-RESPONSE</text>
    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#0284c7">Open-Loop Inference</text>

    <!-- Pipeline Flow -->
    <!-- Input Box -->
    <g transform="translate(50, 42)">
      <rect width="130" height="50" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="65" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Input</text>
      <text x="65" y="36" text-anchor="middle" font-size="7.5" fill="#64748b">User Prompt / Query</text>
    </g>

    <!-- Arrow Input -> Model -->
    <line x1="180" y1="67" x2="320" y2="67" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <text x="250" y="60" text-anchor="middle" font-size="7.5" fill="#475569">Prompt Tokens</text>

    <!-- Model Box -->
    <g transform="translate(320, 34)">
      <rect width="200" height="66" rx="1" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">Foundation Model</text>
      <text x="100" y="44" text-anchor="middle" font-size="8" fill="#0284c7">Forward Pass / KV Cache</text>
    </g>

    <!-- Arrow Model -> Output -->
    <line x1="520" y1="67" x2="660" y2="67" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <text x="590" y="60" text-anchor="middle" font-size="7.5" fill="#475569">Completion Tokens</text>

    <!-- Output Box -->
    <g transform="translate(660, 42)">
      <rect width="130" height="50" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="65" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Output</text>
      <text x="65" y="36" text-anchor="middle" font-size="7.5" fill="#64748b">Text Stream / JSON</text>
    </g>

    <!-- Optimization Callout Bracket below Model -->
    <g transform="translate(295, 110)">
      <rect x="0" y="0" width="250" height="46" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="125" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">optimize this (Micro-Efficiency)</text>
      <text x="125" y="34" text-anchor="middle" font-family="Courier, monospace" font-size="8.5" font-weight="700" fill="#0284c7">FLOPs / token  •  Joules / token</text>
    </g>
    
    <!-- Descriptive Notes on right -->
    <g transform="translate(570, 118)">
      <text x="0" y="14" font-size="8" fill="#475569">• Single forward pass; volatile activation reclamation</text>
      <text x="0" y="28" font-size="8" fill="#475569">• Zero persistent environment state or self-correction</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: AGENTIC AI (Closed-Loop Trajectory Execution)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 268)">
    <rect width="840" height="315" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <rect width="840" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">2. AGENTIC AI: CLOSED-LOOP TRAJECTORY EXECUTION</text>
    <text x="828" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#7c3aed">Stateful Feedback System</text>

    <!-- Overarching Foundation Model Backbone Box -->
    <g transform="translate(180, 36)">
      <rect width="460" height="30" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="230" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Neural Foundation Model Backbone (Cognitive Policy Engine)</text>
      
      <!-- Downward connector lines to sub-components -->
      <line x1="60" y1="30" x2="60" y2="46" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="210" y1="30" x2="210" y2="46" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
      <line x1="360" y1="30" x2="360" y2="46" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
    </g>

    <!-- Subsystem Nodes Row 1 -->
    <!-- Input Goal -->
    <g transform="translate(25, 82)">
      <rect width="110" height="50" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="55" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Input Goal</text>
      <text x="55" y="36" text-anchor="middle" font-size="7.5" fill="#64748b">User Objective</text>
    </g>

    <!-- Arrow Input -> Planner -->
    <line x1="135" y1="107" x2="180" y2="107" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Planner Node -->
    <g transform="translate(180, 82)">
      <rect width="125" height="50" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="62" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Planner</text>
      <text x="62" y="36" text-anchor="middle" font-size="7.5" fill="#7c3aed">Decomposition</text>
    </g>

    <!-- Arrow Planner -> Retrieval -->
    <line x1="305" y1="107" x2="335" y2="107" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Retrieval Node -->
    <g transform="translate(335, 82)">
      <rect width="125" height="50" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="62" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Retrieval</text>
      <text x="62" y="36" text-anchor="middle" font-size="7.5" fill="#7c3aed">Context &amp; Memory</text>
    </g>

    <!-- Arrow Retrieval -> Tool -->
    <line x1="460" y1="107" x2="490" y2="107" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Tool Execution Node -->
    <g transform="translate(490, 82)">
      <rect width="125" height="50" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
      <text x="62" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Tool / Action</text>
      <text x="62" y="36" text-anchor="middle" font-size="7.5" fill="#d97706">Sandbox &amp; POSIX</text>
    </g>

    <!-- Row 2: Verification Node -->
    <!-- Downward arrows into Verification -->
    <path d="M 395 132 L 395 152 L 465 152" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="430" y="147" font-size="7" fill="#64748b">Context</text>

    <line x1="550" y1="132" x2="550" y2="152" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
    <text x="560" y="145" font-size="7" fill="#64748b">Mutations</text>

    <g transform="translate(465, 152)">
      <rect width="170" height="52" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
      <text x="85" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Verification Oracle</text>
      <text x="85" y="38" text-anchor="middle" font-size="7.5" fill="#16a34a">Compilers, Linters &amp; Tests</text>
    </g>

    <!-- Arrow Verification -> Output (Terminal Success) -->
    <line x1="635" y1="178" x2="710" y2="178" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <rect x="645" y="163" width="55" height="15" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="672" y="174" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">PASS / OK</text>

    <!-- Terminal Output Node -->
    <g transform="translate(710, 154)">
      <rect width="115" height="48" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
      <text x="57" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">Output</text>
      <text x="57" y="36" text-anchor="middle" font-size="7.5" fill="#16a34a">Certified Objective</text>
    </g>

    <!-- Closed-Loop Feedback Path (Verification -> Planner on Retry) -->
    <path d="M 465 178 L 242 178 L 242 136" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
    
    <!-- Badge on Feedback Path -->
    <rect x="260" y="186" width="190" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="355" y="198" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#991b1b">RETRY / REPLAN FEEDBACK LOOP</text>

    <!-- Optimization Callout for the Whole Loop -->
    <g transform="translate(120, 236)">
      <rect width="600" height="58" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="300" y="24" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">optimize THIS WHOLE LOOP (Macro-Efficiency)</text>
      <text x="300" y="44" text-anchor="middle" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#15803d">Joules / useful task  •  Cost / resolved goal  •  Trajectory Goodput</text>
    </g>
  </g>
</g>
</svg>