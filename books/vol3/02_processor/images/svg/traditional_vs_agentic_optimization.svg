<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .section-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; text-anchor: middle; fill: #64748b; }
      .opt-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 800; text-anchor: middle; }
      .opt-metric { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 700; }
      .annotation { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .flow-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>

    
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="620" fill="#f8fafc" rx="2" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(30, 18)">
    <rect width="860" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="14" y="13" width="96" height="20" rx="4" fill="#e0e7ff"/>
    <text x="62" y="26" text-anchor="middle" class="badge-text" fill="#4338ca">PARADIGM SHIFT</text>
    <text x="126" y="24" class="title">From Stateless Inference to Closed-Loop Agentic Trajectories</text>
    <text x="126" y="38" class="subtitle">Contrasting the local optimization of individual tokens against the global systems optimization of end-to-end task completion</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1: TRADITIONAL AI (Stateless Request-Response)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 76)">
    <rect width="860" height="175" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Header Pill -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 850 0 C 855.523 0 860 4.477 860 10 L 860 32 L 0 32 Z" fill="#f1f5f9"/>
    <text x="20" y="21" class="section-hdr" fill="#334155">1. TRADITIONAL AI: STATELESS REQUEST-RESPONSE</text>
    <rect x="690" y="6" width="155" height="20" rx="4" fill="#e2e8f0"/>
    <text x="767" y="19" text-anchor="middle" class="badge-text" fill="#475569">Open-Loop Inference</text>

    <!-- Pipeline Flow -->
    <!-- Input Box -->
    <g transform="translate(60, 50)">
      <rect width="125" height="48" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="62" y="26" class="node-text" fill="#1e293b">Input</text>
      <text x="62" y="40" class="node-sub">User Prompt / Query</text>
    </g>

    <!-- Arrow Input -> Model -->
    <line x1="185" y1="74" x2="330" y2="74" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="257" y="66" text-anchor="middle" class="annotation" font-size="10.5">Prompt Tokens</text>

    <!-- Model Box -->
    <g transform="translate(330, 40)">
      <rect width="190" height="68" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="95" y="32" class="node-text" fill="#1e40af" font-size="14.5">Foundation Model</text>
      <text x="95" y="50" class="node-sub" fill="#2563eb">Forward Pass / KV Cache</text>
    </g>

    <!-- Arrow Model -> Output -->
    <line x1="520" y1="74" x2="665" y2="74" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="592" y="66" text-anchor="middle" class="annotation" font-size="10.5">Completion Tokens</text>

    <!-- Output Box -->
    <g transform="translate(665, 50)">
      <rect width="125" height="48" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="62" y="26" class="node-text" fill="#1e293b">Output</text>
      <text x="62" y="40" class="node-sub">Text Stream / JSON</text>
    </g>

    <!-- Optimization Callout Bracket below Model -->
    <g transform="translate(310, 114)">
      <line x1="115" y1="0" x2="115" y2="10" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="0" y="10" width="230" height="42" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <text x="115" y="25" class="opt-hdr" fill="#1e40af">optimize this (Micro-Efficiency)</text>
      <text x="115" y="41" class="opt-metric" fill="#1d4ed8">FLOPs / token  •  joules / token</text>
    </g>
    
    <!-- Descriptive Notes on right -->
    <g transform="translate(585, 122)">
      <text x="0" y="13" class="annotation">• Single forward pass; volatile activation reclamation</text>
      <text x="0" y="27" class="annotation">• Zero persistent environment state or self-correction</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: AGENTIC AI (Closed-Loop Trajectory Execution)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 265)">
    <rect width="860" height="335" rx="2" fill="#ffffff" stroke="#818cf8" stroke-width="1.8" />
    
    <!-- Header Pill -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 850 0 C 855.523 0 860 4.477 860 10 L 860 32 L 0 32 Z" fill="#f5f3ff"/>
    <text x="20" y="21" class="section-hdr" fill="#5b21b6">2. AGENTIC AI: CLOSED-LOOP TRAJECTORY EXECUTION</text>
    <rect x="680" y="6" width="165" height="20" rx="4" fill="#ede9fe"/>
    <text x="762" y="19" text-anchor="middle" class="badge-text" fill="#6d28d9">Stateful Feedback System</text>

    <!-- Overarching Foundation Model Backbone Box -->
    <g transform="translate(195, 42)">
      <rect width="455" height="32" rx="2" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="227" y="21" class="node-text" fill="#6d28d9" font-size="12">Neural Foundation Model Backbone (Cognitive Policy Engine)</text>
      
      <!-- Downward connector lines to sub-components -->
      <line x1="60" y1="32" x2="60" y2="50" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <line x1="210" y1="32" x2="210" y2="50" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <line x1="360" y1="32" x2="360" y2="50" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    </g>

    <!-- Subsystem Nodes Row 1 -->
    <!-- Input Goal -->
    <g transform="translate(35, 92)">
      <rect width="105" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="52" y="25" class="node-text" fill="#1e293b">Input Goal</text>
      <text x="52" y="40" class="node-sub">User Objective</text>
    </g>

    <!-- Arrow Input -> Planner -->
    <line x1="140" y1="117" x2="195" y2="117" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

    <!-- Planner Node -->
    <g transform="translate(195, 92)">
      <rect width="120" height="50" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="60" y="25" class="node-text" fill="#5b21b6">Planner</text>
      <text x="60" y="40" class="node-sub" fill="#7c3aed">Decomposition</text>
    </g>

    <!-- Arrow Planner -> Retrieval -->
    <line x1="315" y1="117" x2="350" y2="117" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

    <!-- Retrieval Node -->
    <g transform="translate(350, 92)">
      <rect width="120" height="50" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="60" y="25" class="node-text" fill="#5b21b6">Retrieval</text>
      <text x="60" y="40" class="node-sub" fill="#7c3aed">Context &amp; Memory</text>
    </g>

    <!-- Arrow Retrieval -> Tool -->
    <line x1="470" y1="117" x2="505" y2="117" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

    <!-- Tool Execution Node -->
    <g transform="translate(505, 92)">
      <rect width="120" height="50" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
      <text x="60" y="25" class="node-text" fill="#92400e">Tool / Action</text>
      <text x="60" y="40" class="node-sub" fill="#b45309">Sandbox &amp; POSIX</text>
    </g>

    <!-- Row 2: Verification Node -->
    <!-- Downward arrows into Verification -->
    <path d="M 410 142 L 410 162 L 485 162" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="445" y="157" class="node-sub" font-size="8.5">Context</text>

    <line x1="565" y1="142" x2="565" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="590" y="154" class="node-sub" font-size="8.5">Mutations</text>

    <g transform="translate(485, 162)">
      <rect width="160" height="52" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="80" y="25" class="node-text" fill="#065f46">Verification Oracle</text>
      <text x="80" y="41" class="node-sub" fill="#047857">Compilers, Linters &amp; Tests</text>
    </g>

    <!-- Arrow Verification -> Output (Terminal Success) -->
    <line x1="645" y1="188" x2="725" y2="188" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <rect x="652" y="172" width="65" height="15" rx="3" fill="#d1fae5"/>
    <text x="684" y="183" text-anchor="middle" class="flow-label" fill="#047857" font-size="8.5">PASS / OK</text>

    <!-- Terminal Output Node -->
    <g transform="translate(725, 164)">
      <rect width="115" height="48" rx="2" fill="#f8fafc" stroke="#10b981" stroke-width="1.8"/>
      <text x="57" y="24" class="node-text" fill="#065f46">Output</text>
      <text x="57" y="39" class="node-sub" fill="#047857">Certified Objective</text>
    </g>

    <!-- Closed-Loop Feedback Path (Verification -> Planner on Retry / Incomplete) -->
    <path d="M 485 192 L 255 192 L 255 147" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
    
    <!-- Badge on Feedback Path -->
    <rect x="270" y="200" width="200" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="370" y="213" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#b91c1c">RETRY / REPLAN FEEDBACK LOOP</text>

    <!-- Optimization Callout for the Whole Loop -->
    <g transform="translate(130, 260)">
      <rect width="600" height="54" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="300" y="24" class="opt-hdr" fill="#065f46" font-size="14.5">optimize THIS WHOLE LOOP (Macro-Efficiency)</text>
      <text x="300" y="44" class="opt-metric" fill="#047857" font-size="13">joules / useful task  •  cost / resolved goal  •  Trajectory Goodput</text>
    </g>
  </g>
</svg>