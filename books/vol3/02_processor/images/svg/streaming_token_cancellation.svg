<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- SWIMLANE COLUMNS & HEADERS                                        -->
  <!-- ================================================================= -->

  <!-- Left Header: Host Agent Runtime -->
  <g transform="translate(30, 16)" filter="url(#cardShadow)">
    <rect width="380" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="190" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">HOST AGENT RUNTIME (Supervisor)</text>
    <text x="190" y="33" text-anchor="middle" font-size="8" fill="#64748b">Partial-Validation State Machine • Memory Escrow Quarantine</text>
  </g>

  <!-- Center Channel Header: Transport Boundary -->
  <g transform="translate(430, 16)">
    <rect width="100" height="40" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="50" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">TRANSPORT</text>
    <text x="50" y="33" text-anchor="middle" font-size="7.5" fill="#64748b">HTTP/2 • gRPC</text>
  </g>

  <!-- Right Header: Inference Engine Daemon & Silicon -->
  <g transform="translate(550, 16)" filter="url(#cardShadow)">
    <rect width="380" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="190" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8">INFERENCE SERVICE &amp; NEURAL CORE</text>
    <text x="190" y="33" text-anchor="middle" font-size="8" fill="#94a3b8">Continuous Batching Scheduler • Paged KV Cache (GPU HBM)</text>
  </g>

  <!-- Vertical Timeline Guides -->
  <line x1="220" y1="62" x2="220" y2="430" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="62" x2="480" y2="430" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="740" y1="62" x2="740" y2="430" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ================================================================= -->
  <!-- STEP 1: Decode Step t=1 (Valid Token)                             -->
  <!-- ================================================================= -->
  <g transform="translate(0, 72)">
    <!-- GPU Event -->
    <rect x="630" y="0" width="220" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="640" y="14" font-size="8" font-weight="700" fill="#0f172a">Decode Step t=1 (GEMV Forward)</text>
    <text x="640" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#0284c7">Sampled y_1: "{" (ID: 334)</text>

    <!-- Packet Arrow (Right to Left) -->
    <line x1="630" y1="17" x2="330" y2="17" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <rect x="425" y="8" width="110" height="18" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
    <text x="480" y="20" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0284c7">DATA: y_1="{"</text>

    <!-- Host Validation Event -->
    <rect x="110" y="0" width="220" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="120" y="14" font-size="8" font-weight="700" fill="#15803d">DFA State Advance: q_0 → q_1</text>
    <text x="120" y="26" font-size="7.5" fill="#166534">Prefix matches JSON tool schema (Valid)</text>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 2: Decode Step t=2 (Valid Tool Identifier)                   -->
  <!-- ================================================================= -->
  <g transform="translate(0, 120)">
    <!-- GPU Event -->
    <rect x="630" y="0" width="220" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="640" y="14" font-size="8" font-weight="700" fill="#0f172a">Decode Step t=2 (GEMV Forward)</text>
    <text x="640" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#0284c7">Sampled y_2: "query" (ID: 2119)</text>

    <!-- Packet Arrow -->
    <line x1="630" y1="17" x2="330" y2="17" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)"/>
    <rect x="425" y="8" width="110" height="18" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
    <text x="480" y="20" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0284c7">DATA: y_2="query"</text>

    <!-- Host Validation Event -->
    <rect x="110" y="0" width="220" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="120" y="14" font-size="8" font-weight="700" fill="#15803d">DFA State Advance: q_1 → q_2</text>
    <text x="120" y="26" font-size="7.5" fill="#166534">Quarantine in Escrow; physical KV page preserved</text>
  </g>

  <!-- Ellipsis: Steps t=3 to t=95 -->
  <g transform="translate(0, 168)">
    <text x="480" y="12" text-anchor="middle" font-size="9" fill="#94a3b8" font-weight="600">⋮ (Incremental decoding continues nominally through step t=95) ⋮</text>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 3: Decode Step t=96 (Invariant Violation Triggered)          -->
  <!-- ================================================================= -->
  <g transform="translate(0, 192)">
    <!-- GPU Event -->
    <rect x="630" y="0" width="220" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="640" y="14" font-size="8" font-weight="700" fill="#0f172a">Decode Step t=96 (GEMV Forward)</text>
    <text x="640" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#dc2626">Sampled y_96: "DROP TABLE" (Illegal)</text>
    <text x="640" y="36" font-size="7" fill="#64748b">Allocates KV Cache Slot 96 in HBM</text>

    <!-- Packet Arrow -->
    <line x1="630" y1="21" x2="330" y2="21" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
    <rect x="420" y="12" width="120" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="480" y="24" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b">DATA: y_96="DROP"</text>

    <!-- Host Trap Event -->
    <rect x="110" y="0" width="220" height="42" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="120" y="14" font-size="8" font-weight="700" fill="#991b1b">INVARIANT VIOLATION TRAP</text>
    <text x="120" y="26" font-size="7.5" fill="#b91c1c">Transition δ*(q_95, "DROP") = ∅ (Undefined)</text>
    <text x="120" y="36" font-size="7" font-weight="600" fill="#7f1d1d">Schema validation failure: abort execution</text>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 4: Transport Cancellation Frame (Host to Engine)             -->
  <!-- ================================================================= -->
  <g transform="translate(0, 252)">
    <!-- Cancellation Signal Arrow (Left to Right) -->
    <line x1="330" y1="18" x2="630" y2="18" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-crimson)"/>
    <rect x="395" y="8" width="170" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="480" y="21" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b">HTTP/2 RST_STREAM (CANCEL)</text>

    <!-- Host Escrow Action -->
    <rect x="110" y="0" width="220" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="120" y="15" font-size="8" font-weight="700" fill="#0f172a">Purge Escrow Quarantine Buffer</text>
    <text x="120" y="28" font-size="7.5" fill="#64748b">Zero side-effects dispatched to effector</text>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 5: Accelerator Memory Reclamation (Silicon Consequences)     -->
  <!-- ================================================================= -->
  <g transform="translate(0, 304)">
    <!-- Engine / Accelerator Action -->
    <rect x="580" y="0" width="320" height="122" rx="4" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="580" y="0" width="320" height="22" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="580" y="14" width="320" height="8" fill="#1e293b"/>
    <text x="592" y="15" font-size="8.5" font-weight="700" fill="#f87171">SILICON RECLAMATION (Inference Daemon)</text>

    <text x="592" y="38" font-size="8" font-weight="700" fill="#f8fafc">• Worker Thread Terminated:</text>
    <text x="602" y="50" font-size="7.5" fill="#94a3b8">Sequence evicted from continuous batch scheduling queue</text>

    <text x="592" y="66" font-size="8" font-weight="700" fill="#38bdf8">• Physical KV Cache Paging Deallocation:</text>
    <text x="602" y="78" font-size="7.5" fill="#cbd5e1">Reclaims 4,000 pending decode steps × 320 KiB/tok = <tspan fill="#38bdf8" font-weight="700">1.22 GiB HBM</tspan></text>

    <text x="592" y="94" font-size="8" font-weight="700" fill="#4ade80">• Memory Bandwidth Wall Avoided:</text>
    <text x="602" y="106" font-size="7.5" fill="#cbd5e1">Bypasses shuttling 70B parameter weights (140 GB) across bus 4,000 times</text>

    <!-- Host Summary Card Left -->
    <rect x="60" y="0" width="320" height="122" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="60" y="0" width="320" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="60" y="14" width="320" height="8" fill="#f1f5f9"/>
    <text x="72" y="15" font-size="8.5" font-weight="700" fill="#0f172a">SUPERVISOR RECOVERY STATE</text>

    <text x="72" y="38" font-size="8" font-weight="700" fill="#334155">• Latency Saved:</text>
    <text x="82" y="50" font-size="7.5" fill="#64748b">Avoids waiting ~100 seconds for K_max=4,096 completion</text>

    <text x="72" y="66" font-size="8" font-weight="700" fill="#334155">• Escrow Integrity Intact:</text>
    <text x="82" y="78" font-size="7.5" fill="#64748b">Partial payload never executed against real databases or filesystem</text>

    <text x="72" y="94" font-size="8" font-weight="700" fill="#b91c1c">• Fault Normalization:</text>
    <text x="82" y="106" font-size="7.5" fill="#b91c1c">Logs SCHEMA_VIOLATION fault; enters diagnostic retry turn</text>
  </g>
</svg>
