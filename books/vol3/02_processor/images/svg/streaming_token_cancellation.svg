<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B91C1C"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#15803D"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#FFFFFF"/>

  <!-- Top: Foundation Model Serving Cluster -->
  <g transform="translate(190, 20)">
    <rect width="500" height="64" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
    <rect width="500" height="22" rx="4" fill="#F3E8FF" stroke="#581C87" stroke-width="1.5"/>
    <text x="250" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#581C87">ACCELERATOR SERVING ENGINE (DECODE LOOP)</text>
    <text x="250" y="44" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0F172A">Active KV Cache Allocation &amp; Autoregressive Decode</text>
    <text x="250" y="56" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#6D28D9">Streaming Tokens: y_1, y_2, ..., y_t crossing transport boundary</text>
  </g>

  <!-- Downward arrow -->
  <line x1="440" y1="84" x2="440" y2="114" stroke="#581C87" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="448" y="104" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#581C87">Packetized Tokens</text>

  <!-- Middle: Host Stream Monitor / Parser -->
  <g transform="translate(190, 115)">
    <rect width="500" height="75" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
    <rect width="500" height="22" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">HOST RUNTIME STREAM MONITOR &amp; PARSER</text>
    <text x="250" y="42" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Incremental Partial-Validation State Machine</text>
    <text x="250" y="58" text-anchor="middle" font-size="8" fill="#64748B">Validates tool identifier prefixes, JSON grammar syntax, and stop delimiters</text>
  </g>

  <!-- Branches -->
  <!-- Left: Invariant Violated -->
  <path d="M 310,190 L 310,225 L 200,225 L 200,248" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="210" y="215" font-size="8.5" font-weight="700" fill="#B91C1C">INVARIANT VIOLATED (YES)</text>

  <g transform="translate(40, 250)">
    <rect width="320" height="100" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/>
    <text x="160" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">EARLY TRANSPORT CANCELLATION</text>
    <text x="160" y="44" text-anchor="middle" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#7F1D1D">HTTP/2 RST_STREAM / gRPC CANCEL</text>
    <text x="160" y="66" text-anchor="middle" font-size="8" fill="#991B1B">Inference engine terminates decode worker thread</text>
    <text x="160" y="82" text-anchor="middle" font-size="8" font-weight="600" fill="#B91C1C">Instantly deallocates KV cache pages from GPU HBM</text>
  </g>

  <!-- Right: Invariant Preserved -->
  <path d="M 570,190 L 570,225 L 680,225 L 680,248" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="580" y="215" font-size="8.5" font-weight="700" fill="#15803D">SYNTAX VALID (NO VIOLATION)</text>

  <g transform="translate(520, 250)">
    <rect width="320" height="100" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1.3"/>
    <text x="160" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532D">MEMORY ESCROW BUFFER</text>
    <text x="160" y="44" text-anchor="middle" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">Forward Token to Quarantine Buffer</text>
    <text x="160" y="66" text-anchor="middle" font-size="8" fill="#15803D">Tokens held in unprivileged host memory quarantine</text>
    <text x="160" y="82" text-anchor="middle" font-size="8" font-weight="600" fill="#15803D">Zero ambient authority granted until complete mediation</text>
  </g>
</svg>
