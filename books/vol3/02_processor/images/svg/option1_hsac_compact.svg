<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="opt1-c-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B21A8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="280" height="280" fill="#ffffff" rx="10"/>

  <!-- Perimeter Edges -->
  <line x1="222" y1="136" x2="140" y2="218"
        stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="140" y1="218" x2="58" y2="136"
        stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="58" y1="136" x2="140" y2="54"
        stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Active Edge: H <-> S -->
  <line x1="140" y1="54" x2="222" y2="136"
        stroke="#6B21A8" stroke-width="4" stroke-linecap="round" filter="url(#opt1-c-glow)"/>

  <!-- Inactive Nodes -->
  <circle cx="222" cy="136" r="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="222" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#64748B">S</text>

  <circle cx="140" cy="218" r="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="140" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#64748B">A</text>

  <circle cx="58" cy="136" r="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="58" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#64748B">C</text>

  <!-- Active Node: H -->
  <circle cx="140" cy="54" r="23" fill="#6B21A8" stroke="#ffffff" stroke-width="2.5" filter="url(#opt1-c-glow)"/>
  <text x="140" y="61" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">H</text>

  <!-- Top Active Banner -->
  <g transform="translate(140, 18)">
    <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="800" fill="#3B0764">[H] HORIZON (H = 1)</text>
  </g>

  <!-- Bottom Legend Bar: All 4 Brackets Explicit -->
  <g transform="translate(140, 264)">
    <text x="0" y="0" text-anchor="middle" font-size="9.5" font-weight="600" fill="#64748B">
      <tspan fill="#6B21A8" font-weight="800">[H]</tspan> Horizon  •  
      <tspan fill="#334155">[S]</tspan> State  •  
      <tspan fill="#334155">[A]</tspan> Authority  •  
      <tspan fill="#334155">[C]</tspan> Closure
    </text>
  </g>

</svg>
