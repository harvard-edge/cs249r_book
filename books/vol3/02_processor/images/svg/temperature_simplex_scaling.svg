<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: RAW LOGIT VECTOR                                        -->
  <!-- ================================================================= -->
  <g transform="translate(30, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="220" height="340" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">1. RAW LOGIT VECTOR (z_t)</text>

    <!-- Sub-block -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="196" height="66" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Unnormalized Log-Odds</text>
      <text x="8" y="27" font-family="Courier New, monospace" font-size="8" fill="#334155">z_t = W_vocab * h_t in R^|V|</text>
      <text x="8" y="41" font-size="8" fill="#64748b">Vocabulary: 32k to 256k tokens</text>
      <text x="8" y="54" font-size="8" fill="#64748b">Arbitrary real-valued scores</text>
    </g>

    <!-- Visual Logit Bars -->
    <g transform="translate(12, 114)">
      <rect x="0" y="0" width="196" height="200" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#475569">Sample Candidate Logits:</text>
      
      <!-- Token 1 (Mode) -->
      <text x="8" y="38" font-family="Courier New, monospace" font-size="8" fill="#0f172a">w_1 ("path")</text>
      <rect x="75" y="29" width="95" height="12" rx="1" fill="#cbd5e1"/>
      <text x="175" y="38" font-family="Courier New, monospace" font-size="8" fill="#0f172a">+12.4</text>

      <!-- Token 2 (Runner up) -->
      <text x="8" y="62" font-family="Courier New, monospace" font-size="8" fill="#0f172a">w_2 ("file")</text>
      <rect x="75" y="53" width="75" height="12" rx="1" fill="#cbd5e1"/>
      <text x="155" y="62" font-family="Courier New, monospace" font-size="8" fill="#0f172a">+9.8</text>

      <!-- Token 3 -->
      <text x="8" y="86" font-family="Courier New, monospace" font-size="8" fill="#0f172a">w_3 ("target")</text>
      <rect x="75" y="77" width="50" height="12" rx="1" fill="#cbd5e1"/>
      <text x="130" y="86" font-family="Courier New, monospace" font-size="8" fill="#0f172a">+6.5</text>

      <!-- Token 4 -->
      <text x="8" y="110" font-family="Courier New, monospace" font-size="8" fill="#0f172a">w_4 ("src")</text>
      <rect x="75" y="101" width="35" height="12" rx="1" fill="#cbd5e1"/>
      <text x="115" y="110" font-family="Courier New, monospace" font-size="8" fill="#0f172a">+4.2</text>

      <!-- Divider / Tail -->
      <line x1="8" y1="130" x2="188" y2="130" stroke="#cbd5e1" stroke-dasharray="2,2"/>
      <text x="8" y="145" font-family="Courier New, monospace" font-size="8" fill="#94a3b8">w_k ... w_|V|</text>
      <rect x="75" y="137" width="12" height="12" rx="1" fill="#e2e8f0"/>
      <text x="92" y="146" font-family="Courier New, monospace" font-size="8" fill="#94a3b8">-2.1</text>

      <text x="8" y="174" font-size="8" font-style="italic" fill="#64748b">Logit difference:</text>
      <text x="8" y="187" font-family="Courier New, monospace" font-size="8" fill="#0284c7">Delta z = z_1 - z_2 = 2.6</text>
    </g>
  </g>

  <!-- Connection: Logits -> Thermal Scaling -->
  <path d="M 250,195 L 285,195" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: THERMAL SCALING TRANSFORMATION                          -->
  <!-- ================================================================= -->
  <g transform="translate(285, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="285" height="340" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="285" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. THERMAL SCALING: z_i / tau</text>

    <!-- Regime A: Greedy Argmax -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="261" height="88" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="261" height="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#0369a1">Greedy Argmax: tau -&gt; 0+</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Logit Gap Amplification</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8" fill="#0284c7">Delta z / tau -&gt; +infinity</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Execution Characteristic</text>
      <text x="8" y="72" font-size="8" fill="#64748b">Deterministic mode selection; zero entropy</text>
      <text x="8" y="83" font-size="8" fill="#dc2626">Risk: uncorrectable bias loops on wrong mode</text>
    </g>

    <!-- Regime B: Controlled Exploration -->
    <g transform="translate(12, 134)">
      <rect x="0" y="0" width="261" height="88" rx="2" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <rect x="0" y="0" width="261" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#15803d">Controlled Decode: tau ~ 0.2 ... 0.7</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Calibrated Relative Probabilities</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8" fill="#15803d">P(w_i)/P(w_j) = exp((z_i - z_j) / tau)</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Execution Characteristic</text>
      <text x="8" y="72" font-size="8" fill="#64748b">Bounded diversification; modal paths favored</text>
      <text x="8" y="83" font-size="8" fill="#15803d">Optimal for multi-turn reasoning and retry diversity</text>
    </g>

    <!-- Regime C: High Entropy -->
    <g transform="translate(12, 232)">
      <rect x="0" y="0" width="261" height="92" rx="2" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <rect x="0" y="0" width="261" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#b91c1c">High Entropy: tau &gt;= 1.5</text>

      <text x="8" y="32" font-size="8" font-weight="700" fill="#334155">Logit Gap Flattening</text>
      <text x="8" y="44" font-family="Courier New, monospace" font-size="8" fill="#dc2626">Delta z / tau -&gt; 0,  p_t -&gt; uniform</text>

      <text x="8" y="60" font-size="8" font-weight="700" fill="#334155">Execution Characteristic</text>
      <text x="8" y="72" font-size="8" fill="#64748b">Massive token dispersion across tail</text>
      <text x="8" y="84" font-size="8" fill="#dc2626">Failure: syntax fragmentation, JSON parse aborts</text>
    </g>
  </g>

  <!-- Connections: Scaling -> Simplex Profiles -->
  <path d="M 570,80 L 600,80" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 570,178 L 600,178" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 570,278 L 600,278" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: PROBABILITY SIMPLEX DISTRIBUTION                        -->
  <!-- ================================================================= -->
  <g transform="translate(600, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="340" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. PROBABILITY SIMPLEX (Delta^|V|-1)</text>

    <!-- Simplex Profile A: Dirac Delta -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="226" height="88" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0284c7">Dirac Delta Impulse (Mode = 1.0)</text>
      <!-- Sparkline bar -->
      <line x1="8" y1="52" x2="218" y2="52" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="18" y="24" width="12" height="28" fill="#0284c7" rx="1"/>
      <text x="18" y="20" font-family="Courier New, monospace" font-size="7.5" font-weight="700" fill="#0284c7">1.0</text>
      <text x="35" y="42" font-size="7.5" fill="#64748b">P(w_1)=1.0, all others 0.0</text>
      <text x="8" y="68" font-size="8" fill="#334155">Entropy H(P) = 0 nats</text>
      <text x="8" y="80" font-size="8" font-weight="600" fill="#0284c7">Output: strictly deterministic</text>
    </g>

    <!-- Simplex Profile B: Calibrated Multinomial -->
    <g transform="translate(12, 134)">
      <rect x="0" y="0" width="226" height="88" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#15803d">Calibrated Softmax Distribution</text>
      <!-- Sparkline bars -->
      <line x1="8" y1="52" x2="218" y2="52" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="18" y="26" width="10" height="26" fill="#16a34a" rx="1"/>
      <rect x="34" y="36" width="10" height="16" fill="#16a34a" rx="1"/>
      <rect x="50" y="44" width="10" height="8" fill="#16a34a" rx="1"/>
      <rect x="66" y="49" width="10" height="3" fill="#cbd5e1" rx="1"/>
      <text x="18" y="21" font-family="Courier New, monospace" font-size="7.5" fill="#15803d">0.72</text>
      <text x="34" y="31" font-family="Courier New, monospace" font-size="7.5" fill="#15803d">0.21</text>
      <text x="8" y="68" font-size="8" fill="#334155">Entropy H(P) = Low / Moderate</text>
      <text x="8" y="80" font-size="8" font-weight="600" fill="#15803d">Nucleus top-p removes invalid tail</text>
    </g>

    <!-- Simplex Profile C: Uniform Noise -->
    <g transform="translate(12, 232)">
      <rect x="0" y="0" width="226" height="92" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#b91c1c">Uniform Diffuse Dispersion</text>
      <!-- Flat bars -->
      <line x1="8" y1="52" x2="218" y2="52" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="14" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <rect x="26" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <rect x="38" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <rect x="50" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <rect x="62" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <rect x="74" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <rect x="86" y="47" width="8" height="5" fill="#dc2626" rx="1"/>
      <text x="100" y="46" font-family="Courier New, monospace" font-size="7.5" fill="#dc2626">P ~ 1/|V|</text>
      <text x="8" y="70" font-size="8" fill="#334155">Entropy H(P) -&gt; Max (ln |V|)</text>
      <text x="8" y="84" font-size="8" font-weight="600" fill="#dc2626">P_valid ~ (1-eps)^K &lt; 14% at K=1000</text>
    </g>
  </g>

</svg>
