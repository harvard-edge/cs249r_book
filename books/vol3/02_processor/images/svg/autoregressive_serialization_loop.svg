<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="840" height="380" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT: STEP t ACCELERATOR FORWARD PASS (COMPUTE)                   -->
  <!-- ================================================================= -->
  <g transform="translate(30, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="360" height="260" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">STEP t: ACCELERATOR FORWARD PASS (Compute Core)</text>

    <!-- Sub-block 1: Causal Multi-Head Attention -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="336" height="64" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Causal Self-Attention Layer (GEMV)</text>
      <text x="8" y="27" font-family="Courier New, monospace" font-size="8" fill="#0284c7">Query q_t attends to Keys K_{1:t-1} and Values V_{1:t-1}</text>
      <text x="8" y="40" font-size="8" fill="#64748b">Iterative memory streaming from HBM (I_decode ~ 1 FLOP/byte)</text>
      <text x="8" y="53" font-size="8" fill="#dc2626">Single-stream memory bus bottleneck: ~30-60 tok/s at B=1</text>
    </g>

    <!-- Sub-block 2: Feed-Forward & Unembedding -->
    <g transform="translate(12, 106)">
      <rect x="0" y="0" width="336" height="64" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Feed-Forward MLP &amp; Unembedding Projection</text>
      <text x="8" y="27" font-family="Courier New, monospace" font-size="8" fill="#334155">h_t = MLP(LayerNorm(Attn)) in R^d_model</text>
      <text x="8" y="40" font-family="Courier New, monospace" font-size="8" fill="#334155">z_t = W_vocab * h_t + b_vocab in R^|V|</text>
      <text x="8" y="53" font-size="8" fill="#64748b">Raw unnormalized logit vector across vocabulary |V|</text>
    </g>

    <!-- Sub-block 3: Softmax & Sampling -->
    <g transform="translate(12, 178)">
      <rect x="0" y="0" width="336" height="68" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Softmax Normalization &amp; Categorical Sampling</text>
      <text x="8" y="27" font-family="Courier New, monospace" font-size="8" fill="#0284c7">p_t = softmax(z_t / tau),  sample y_t ~ p_t</text>
      <text x="8" y="41" font-size="8" fill="#64748b">Greedy argmax (tau -> 0) or nucleus top-p sampling</text>
      <text x="8" y="56" font-family="Courier New, monospace" font-size="8.5" font-weight="700" fill="#15803d">Emitted Token: y_t</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: SERVING STATE UPDATE & CONTROL (MEMORY)                    -->
  <!-- ================================================================= -->
  <g transform="translate(450, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="360" height="260" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">SERVING STATE UPDATE &amp; CONTROL (Memory Engine)</text>

    <!-- Sub-block 1: KV Cache Mutation -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="336" height="64" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Attention KV Cache State Mutation</text>
      <text x="8" y="27" font-family="Courier New, monospace" font-size="8" fill="#15803d">Append (k_t, v_t) to dynamic serving memory</text>
      <text x="8" y="40" font-size="8" fill="#64748b">PagedAttention non-contiguous physical page tables</text>
      <text x="8" y="53" font-size="8" fill="#334155">Memory cost: Mem_token = 2 * L * H_kv * d_head * P bytes</text>
    </g>

    <!-- Sub-block 2: Stopping Conditions -->
    <g transform="translate(12, 106)">
      <rect x="0" y="0" width="336" height="64" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Termination Criteria Verification</text>
      <text x="8" y="27" font-size="8" fill="#64748b">Evaluate stopping predicates at token boundary:</text>
      <text x="8" y="40" font-family="Courier New, monospace" font-size="8" fill="#334155">• y_t in S_stop  (e.g., &lt;|eot_id|&gt; or stop string)</text>
      <text x="8" y="53" font-family="Courier New, monospace" font-size="8" fill="#334155">• Generation counter t reaches limit K_max</text>
    </g>

    <!-- Sub-block 3: Prefix Formulation -->
    <g transform="translate(12, 178)">
      <rect x="0" y="0" width="336" height="68" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Sequential Continuation Assembly</text>
      <text x="8" y="27" font-family="Courier New, monospace" font-size="8" fill="#15803d">y_&lt;=t = (y_&lt;t, y_t) appended to context</text>
      <text x="8" y="41" font-size="8" fill="#64748b">Prefix becomes historical input conditioning for step t+1</text>
      <text x="8" y="55" font-size="8" font-weight="600" fill="#0284c7">Advances decode iteration counter: t &lt;- t + 1</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FORWARD CONNECTION: STEP t -> STATE UPDATE                        -->
  <!-- ================================================================= -->
  <path d="M 390,212 L 450,212" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="398" y="196" width="44" height="14" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="420" y="206" text-anchor="middle" font-family="Courier New, monospace" font-size="7.5" font-weight="700" fill="#15803d">y_t</text>

  <!-- ================================================================= -->
  <!-- RECURRENT CAUSAL LOOP: STEP t -> STEP t+1                         -->
  <!-- ================================================================= -->
  <!-- Down from right container -->
  <path d="M 630,285 L 630,325 L 210,325 L 210,285" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Centered Warning Pill on Causal Barrier -->
  <rect x="300" y="315" width="240" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="420" y="328" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">IRREDUCIBLE CAUSAL DEPENDENCY BARRIER</text>
  <text x="420" y="352" text-anchor="middle" font-size="8" fill="#64748b">Token t+1 forward pass cannot initiate until token t is sampled and committed to KV memory</text>

</svg>
