<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7E22CE" flood-opacity="0.35"/>
    </filter>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean canvas -->
  <rect width="340" height="340" fill="#ffffff" rx="12"/>

  <!-- Background decorative boundary (faint square container) -->
  <rect x="20" y="20" width="300" height="300" rx="8" fill="none" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Cross diagonals (H-A and C-S) -->
  <line x1="170" y1="80" x2="170" y2="260"
        stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="170" x2="260" y2="170"
        stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Perimeter Edges -->
  <!-- Active Edge: H - S -->
  <line x1="170" y1="80" x2="260" y2="170"
        stroke="#7E22CE" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-purple)"/>
  <line x1="170" y1="80" x2="260" y2="170"
        stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Inactive Edge: S - A -->
  <line x1="260" y1="170" x2="170" y2="260"
        stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
  <!-- Inactive Edge: A - C -->
  <line x1="170" y1="260" x2="80" y2="170"
        stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
  <!-- Inactive Edge: C - H -->
  <line x1="80" y1="170" x2="170" y2="80"
        stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

  <!-- Active Node: H (Horizon) -->
  <g transform="translate(170, 80)">
    <circle cx="0" cy="0" r="26" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="#7E22CE" stroke="#ffffff" stroke-width="2.5" filter="url(#glow-purple)"/>
    <text x="0" y="7" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">H</text>
  </g>

  <!-- Inactive Node: S (State) -->
  <g transform="translate(260, 170)">
    <circle cx="0" cy="0" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" filter="url(#subtle-shadow)"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">S</text>
  </g>

  <!-- Inactive Node: A (Authority) -->
  <g transform="translate(170, 260)">
    <circle cx="0" cy="0" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" filter="url(#subtle-shadow)"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">A</text>
  </g>

  <!-- Inactive Node: C (Closure) -->
  <g transform="translate(80, 170)">
    <circle cx="0" cy="0" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" filter="url(#subtle-shadow)"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">C</text>
  </g>

  <!-- Node Labels with Bracket Text -->
  <!-- Top: [H] Horizon -->
  <g transform="translate(170, 24)">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#581C87">
      [H] Horizon
    </text>
    <text x="0" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#7E22CE">
      H = 1 (Single Step)
    </text>
  </g>

  <!-- Right: [S] State -->
  <g transform="translate(292, 166)">
    <text x="0" y="0" text-anchor="start" font-size="13" font-weight="800" fill="#475569">
      [S] State
    </text>
    <text x="0" y="14" text-anchor="start" font-size="10" font-weight="600" fill="#94A3B8">
      Staged Context
    </text>
  </g>

  <!-- Bottom: [A] Authority -->
  <g transform="translate(170, 304)">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">
      [A] Authority
    </text>
    <text x="0" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#94A3B8">
      A = 0 (Unprivileged)
    </text>
  </g>

  <!-- Left: [C] Closure -->
  <g transform="translate(48, 166)">
    <text x="0" y="0" text-anchor="end" font-size="13" font-weight="800" fill="#475569">
      [C] Closure
    </text>
    <text x="0" y="14" text-anchor="end" font-size="10" font-weight="600" fill="#94A3B8">
      External Loop
    </text>
  </g>

  <!-- Center Active Constraint Pill -->
  <g transform="translate(170, 170)">
    <rect x="-46" y="-12" width="92" height="24" rx="12" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581C87">Ch 02 Focus</text>
  </g>

</svg>
