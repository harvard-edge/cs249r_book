<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="840" height="460" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">PROCESS CONTROL BLOCK (PCB) VS. AGENT CONTROL BLOCK (ACB)</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Architectural comparison: bit-exact OS process switching vs. stochastic non-stationary agent context lifecycle</text>

  <!-- ================================================================= -->
  <!-- LEFT DOMAIN: POSIX OPERATING SYSTEM (KERNEL / CPU)                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <!-- Domain Boundary Box -->
    <rect x="0" y="0" width="390" height="390" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">POSIX KERNEL EXECUTION DOMAIN</text>
    <text x="378" y="16" text-anchor="end" font-size="7.5" fill="#0284c7">Hardware-managed bit-exact context swap</text>

    <!-- PCB Struct (Memory Layout) -->
    <g transform="translate(15, 34)">
      <!-- Struct Container -->
      <rect x="0" y="0" width="220" height="250" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="110" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">struct task_struct (PCB)</text>

      <!-- Field 1: PID & Creds -->
      <g transform="translate(10, 24)">
        <text y="14" font-size="7" font-weight="700" fill="#475569">IDENTIFIERS &amp; CREDS</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0f172a">pid_t pid; uid_t uid;</text>
      </g>
      <line x1="0" y1="58" x2="220" y2="58" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 2: Registers (thread_struct) -->
      <rect x="1" y="59" width="218" height="38" fill="#e0f2fe" opacity="0.6"/>
      <g transform="translate(10, 59)">
        <text y="14" font-size="7" font-weight="700" fill="#0369a1">HARDWARE REGISTERS</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0c4a6e">RIP, RSP, RAX, CR3</text>
        <text y="35" font-size="6.5" fill="#0284c7">thread_struct (bit-exact)</text>
      </g>
      <line x1="0" y1="98" x2="220" y2="98" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 3: Memory Address Space -->
      <rect x="1" y="99" width="218" height="38" fill="#dcfce7" opacity="0.6"/>
      <g transform="translate(10, 99)">
        <text y="14" font-size="7" font-weight="700" fill="#15803d">VIRTUAL ADDRESS SPACE</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#14532d">struct mm_struct *mm;</text>
        <text y="35" font-size="6.5" fill="#16a34a">pgd_t *pgd (CR3 target)</text>
      </g>
      <line x1="0" y1="138" x2="220" y2="138" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 4: File Descriptors -->
      <g transform="translate(10, 138)">
        <text y="14" font-size="7" font-weight="700" fill="#475569">FILE DESCRIPTORS</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0f172a">struct files_struct *files;</text>
      </g>
      <line x1="0" y1="172" x2="220" y2="172" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 5: Execution State -->
      <rect x="1" y="173" width="218" height="38" fill="#fef3c7" opacity="0.6"/>
      <g transform="translate(10, 173)">
        <text y="14" font-size="7" font-weight="700" fill="#b45309">SCHEDULER STATE</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#78350f">long state (TASK_RUNNING)</text>
      </g>
      <line x1="0" y1="212" x2="220" y2="212" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 6: Resource Accounting -->
      <g transform="translate(10, 212)">
        <text y="14" font-size="7" font-weight="700" fill="#475569">ACCOUNTING</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0f172a">u64 utime, stime, rss;</text>
      </g>
    </g>

    <!-- Pointers to OS / HW Subsystems -->
    <!-- 1. CPU Core Context -->
    <g transform="translate(250, 95)">
      <rect x="0" y="0" width="125" height="38" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">CPU Registers</text>
      <text x="62" y="28" text-anchor="middle" font-size="7" fill="#64748b">RIP / RSP Stack Frame</text>
    </g>
    <path d="M235,114 L250,114" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- 2. MMU Page Table -->
    <g transform="translate(250, 145)">
      <rect x="0" y="0" width="125" height="42" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">MMU Page Tables</text>
      <text x="62" y="26" text-anchor="middle" font-size="7" fill="#64748b">4 KB Physical Pages</text>
      <text x="62" y="36" text-anchor="middle" font-size="6.5" fill="#16a34a">Host DRAM (CR3)</text>
    </g>
    <path d="M235,166 L250,166" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- 3. CFS Scheduler Queue -->
    <g transform="translate(250, 202)">
      <rect x="0" y="0" width="125" height="38" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">CFS Runqueue</text>
      <text x="62" y="28" text-anchor="middle" font-size="7" fill="#64748b">Red-Black Tree (vruntime)</text>
    </g>
    <path d="M235,221 L250,221" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- Bottom Metric Panels -->
    <g transform="translate(15, 298)">
      <rect x="0" y="0" width="360" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8" font-weight="700" fill="#334155">Context Switch Cost:</text>
      <text x="106" y="16" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#0284c7">1 to 10 µs</text>
      <text x="160" y="16" font-size="7.5" fill="#64748b">(Bit-exact hardware register swap)</text>
      <text x="12" y="28" font-size="7" fill="#64748b">Direct hardware pipeline save/restore via CR3 &amp; TSS</text>
    </g>
    <g transform="translate(15, 342)">
      <rect x="0" y="0" width="360" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8" font-weight="700" fill="#334155">Failure Boundary:</text>
      <text x="96" y="16" font-size="8" font-weight="700" fill="#0f172a">Fail-stop; SIGSEGV / Core Dump</text>
      <text x="12" y="28" font-size="7" fill="#64748b">Kernel traps memory violation immediately; zero silent drift</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT DOMAIN: AGENT RUNTIME (ACCELERATOR / CLOUD)                 -->
  <!-- ================================================================= -->
  <g transform="translate(450, 75)">
    <!-- Domain Boundary Box -->
    <rect x="0" y="0" width="390" height="390" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">AGENT RUNTIME CONTROL PLANE</text>
    <text x="378" y="16" text-anchor="end" font-size="7.5" fill="#d97706">Software-orchestrated distributed state</text>

    <!-- ACB Struct (Memory Layout) -->
    <g transform="translate(15, 34)">
      <!-- Struct Container -->
      <rect x="0" y="0" width="220" height="250" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="110" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">struct agent_control_block (ACB)</text>

      <!-- Field 1: Identity & Goal -->
      <g transform="translate(10, 24)">
        <text y="14" font-size="7" font-weight="700" fill="#475569">IDENTITY &amp; GOAL ENVELOPE</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0f172a">uuid_t aid; goal_t g;</text>
      </g>
      <line x1="0" y1="58" x2="220" y2="58" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 2: Capabilities (Leases) -->
      <rect x="1" y="59" width="218" height="38" fill="#fee2e2" opacity="0.6"/>
      <g transform="translate(10, 59)">
        <text y="14" font-size="7" font-weight="700" fill="#991b1b">CAPABILITY LEASES</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#7f1d1d">lease_t leases[] (HMAC)</text>
        <text y="35" font-size="6.5" fill="#dc2626">Attenuating permissions / TTL</text>
      </g>
      <line x1="0" y1="98" x2="220" y2="98" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 3: KV Cache Descriptors -->
      <rect x="1" y="99" width="218" height="38" fill="#dcfce7" opacity="0.6"/>
      <g transform="translate(10, 99)">
        <text y="14" font-size="7" font-weight="700" fill="#15803d">CONTEXT WORKING SET</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#14532d">paged_kv_table_t *kv_tbl;</text>
        <text y="35" font-size="6.5" fill="#16a34a">PagedAttention L1/L2 handles</text>
      </g>
      <line x1="0" y1="138" x2="220" y2="138" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 4: Vector Clock & Lineage -->
      <g transform="translate(10, 138)">
        <text y="14" font-size="7" font-weight="700" fill="#475569">CAUSAL CLOCKS &amp; LINEAGE</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0f172a">vclock_t vc; parent_id_t p;</text>
      </g>
      <line x1="0" y1="172" x2="220" y2="172" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 5: Lifecycle & Sagas State -->
      <rect x="1" y="173" width="218" height="38" fill="#fef3c7" opacity="0.6"/>
      <g transform="translate(10, 173)">
        <text y="14" font-size="7" font-weight="700" fill="#b45309">LIFECYCLE FSM &amp; SAGAS</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#78350f">state_t (PREFILL, WAIT, ...)</text>
      </g>
      <line x1="0" y1="212" x2="220" y2="212" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Field 6: Token Quotas & Velocity -->
      <g transform="translate(10, 212)">
        <text y="14" font-size="7" font-weight="700" fill="#475569">TOKENOMICS &amp; BUDGETS</text>
        <text y="26" font-family="Courier, monospace" font-size="8" fill="#0f172a">token_budget_t; float v_burn;</text>
      </g>
    </g>

    <!-- Pointers to Agent Runtime Subsystems -->
    <!-- 1. Capability Sandbox Filter -->
    <g transform="translate(250, 95)">
      <rect x="0" y="0" width="125" height="38" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">Tool Sandbox</text>
      <text x="62" y="28" text-anchor="middle" font-size="7" fill="#64748b">eBPF / MicroVM Filter</text>
    </g>
    <path d="M235,114 L250,114" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <!-- 2. PagedAttention KV Cache Table -->
    <g transform="translate(250, 145)">
      <rect x="0" y="0" width="125" height="42" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Paged KV Blocks</text>
      <text x="62" y="26" text-anchor="middle" font-size="7" fill="#64748b">16-Token Page Tables</text>
      <text x="62" y="36" text-anchor="middle" font-size="6.5" fill="#16a34a">Accelerator HBM</text>
    </g>
    <path d="M235,166 L250,166" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

    <!-- 3. MLFQ / Disaggregated Scheduler -->
    <g transform="translate(250, 202)">
      <rect x="0" y="0" width="125" height="38" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">MLFQ Scheduler</text>
      <text x="62" y="28" text-anchor="middle" font-size="7" fill="#64748b">Priority Queue / Prefill</text>
    </g>
    <path d="M235,221 L250,221" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-orange)"/>

    <!-- Bottom Metric Panels -->
    <g transform="translate(15, 298)">
      <rect x="0" y="0" width="360" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8" font-weight="700" fill="#334155">Context Switch Cost:</text>
      <text x="106" y="16" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#d97706">50 to 1,000 ms</text>
      <text x="180" y="16" font-size="7.5" fill="#64748b">(PCIe DMA KV swapping)</text>
      <text x="12" y="28" font-size="7" fill="#64748b">Gigabyte-scale KV offload across PCIe/NVMe hierarchy</text>
    </g>
    <g transform="translate(15, 342)">
      <rect x="0" y="0" width="360" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8" font-weight="700" fill="#334155">Failure Boundary:</text>
      <text x="96" y="16" font-size="8" font-weight="700" fill="#b45309">Fail-plausible; Sagas Rollback</text>
      <text x="12" y="28" font-size="7" fill="#64748b">Hallucinations appear syntactically valid; requires compensation</text>
    </g>
  </g>
</svg>