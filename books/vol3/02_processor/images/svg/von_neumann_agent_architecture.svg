<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="840" height="440" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE STOCHASTIC COMPUTER: VON NEUMANN ARCHITECTURAL MAPPING</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Mapping autonomous neural agent runtime components onto classical computer systems abstractions</text>

  <!-- ================================================================= -->
  <!-- TOP LEFT: STOCHASTIC PROCESSOR (ALU / COMPUTE)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="340" height="150" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">STOCHASTIC PROCESSOR (Compute Engine / ALU)</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Neural Weights Array W_θ</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Static parameters; next-token transition operator (ALU logic)</text>
    </g>

    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Autoregressive Pipeline Core</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Forward-pass clock cycles; GEMM prefill and GEMV decode</text>
    </g>

    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Grammar Logit Mask Filter (DFA)</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Hardware instruction decoder; dynamic vocabulary bitmask</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- TOP RIGHT: VOLATILE CONTEXT MEMORY (WORKING RAM)                  -->
  <!-- ================================================================= -->
  <g transform="translate(500, 75)">
    <rect x="0" y="0" width="340" height="150" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">VOLATILE CONTEXT MEMORY (Working RAM)</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Active Attention Window (L1 KV)</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">On-chip SRAM tiles &amp; active tokens in GPU HBM (3.35 TB/s)</text>
    </g>

    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">PagedAttention Virtual Paging</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Non-contiguous physical page tables; eliminates fragmentation</text>
    </g>

    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Radix Prefix Caching Trie</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Shared system prompt cache; tree branch aliasing &amp; LRU</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER BUS: HBM MEMORY BUS                                        -->
  <!-- ================================================================= -->
  <g transform="translate(380, 135)">
    <line x1="5" y1="15" x2="115" y2="15" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="5,15 13,11 13,19" fill="#16a34a"/>
    <polygon points="115,15 107,11 107,19" fill="#16a34a"/>
    <text x="60" y="8" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">KV MEMORY BUS</text>
    <text x="60" y="28" text-anchor="middle" font-size="7" fill="#64748b">HBM3e (3.35 TB/s)</text>
  </g>

  <!-- ================================================================= -->
  <!-- VERTICAL BUSES                                                    -->
  <!-- ================================================================= -->
  <!-- Left Vertical Bus: System Call Bus -->
  <g transform="translate(195, 225)">
    <line x1="15" y1="5" x2="15" y2="55" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="15,5 11,13 19,13" fill="#0284c7"/>
    <polygon points="15,55 11,47 19,47" fill="#0284c7"/>
    <text x="24" y="32" font-size="8" font-weight="700" fill="#0369a1">SYSTEM CALL BUS (MCP)</text>
    <text x="24" y="42" font-size="7" fill="#64748b">JSON-RPC / stdio IPC</text>
  </g>

  <!-- Right Vertical Bus: Hierarchical DMA Paging -->
  <g transform="translate(655, 225)">
    <line x1="15" y1="5" x2="15" y2="55" stroke="#7c3aed" stroke-width="2.5"/>
    <polygon points="15,5 11,13 19,13" fill="#7c3aed"/>
    <polygon points="15,55 11,47 19,47" fill="#7c3aed"/>
    <text x="24" y="32" font-size="8" font-weight="700" fill="#6d28d9">HIERARCHICAL PAGING</text>
    <text x="24" y="42" font-size="7" fill="#64748b">PCIe Gen5 DMA (64 GB/s)</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM LEFT: ACTUATION BOUNDARY (I/O & PERIPHERALS)               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="340" height="150" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">ACTUATION BOUNDARY (I/O &amp; Peripherals)</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Model Context Protocol (MCP)</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Typed wire protocol; client gateway &amp; schema registry</text>
    </g>

    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Execution Sandboxes (MicroVMs)</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Firecracker / gVisor isolation; eBPF egress filtering</text>
    </g>

    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Attenuated Capability Leases</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Cryptographic HMAC tokens; monotonic authority scoping</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM RIGHT: PERSISTENT SECONDARY STORAGE (DISK)                 -->
  <!-- ================================================================= -->
  <g transform="translate(500, 285)">
    <rect x="0" y="0" width="340" height="150" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">SECONDARY STORAGE (Episodic Disk &amp; Audit Logs)</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Write-Ahead Log (WAL) &amp; Event Sourcing</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Durable append-only turn ledger; crash hydration</text>
    </g>

    <g transform="translate(15, 70)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Dense Metric &amp; Graph Stores (RAG)</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">IVF-PQ vector partitions &amp; AST symbol dependency graphs</text>
    </g>

    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="310" height="30" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Sagas Compensating Log</text>
      <text x="10" y="24" font-size="7.5" fill="#64748b">Backward compensating closures for non-transactional tools</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM BUS: REVERSIBILITY / SAGAS PERSISTENCE                     -->
  <!-- ================================================================= -->
  <g transform="translate(380, 345)">
    <line x1="5" y1="15" x2="115" y2="15" stroke="#d97706" stroke-width="2.5"/>
    <polygon points="5,15 13,11 13,19" fill="#d97706"/>
    <polygon points="115,15 107,11 107,19" fill="#d97706"/>
    <text x="60" y="8" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">TRANSACTION LOG</text>
    <text x="60" y="28" text-anchor="middle" font-size="7" fill="#64748b">Synchronous Fsync</text>
  </g>

</svg>