<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="640" fill="#FFFFFF"/>

  <!-- Title Header -->
  <g transform="translate(480, 28)">
    <text text-anchor="middle" font-size="16" font-weight="800" fill="#0F172A" letter-spacing="-0.2">The Von Neumann Metaphor: The Stochastic Computer</text>
    <text y="18" text-anchor="middle" font-size="10.5" fill="#64748B">Mapping the components of an autonomous agent system onto classical computer architecture</text>
  </g>

  <!-- TOP-LEFT: STOCHASTIC PROCESSOR (ALU) -->
  <g transform="translate(30, 68)" filter="url(#shadow)">
    <rect width="435" height="210" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="435" height="34" rx="8" fill="url(#purpleGrad)"/>
    <rect y="26" width="435" height="8" fill="#6D28D9"/>
    <text x="16" y="22" font-size="11.5" font-weight="700" fill="#FFFFFF">1. The Stochastic Processor (Compute / ALU)</text>
    <rect x="345" y="8" width="76" height="18" rx="4" fill="#581C87" fill-opacity="0.6"/>
    <text x="383" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#E9D5FF">NEURAL ALU</text>

    <!-- Content Items -->
    <g transform="translate(16, 48)">
      <text font-size="10" font-weight="700" fill="#1E293B">Classical Concept: <tspan font-weight="500" fill="#475569">Arithmetic Logic Unit (ALU), Instruction Registers &amp; Branch Predictor</tspan></text>
      
      <rect y="16" width="403" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="32" font-size="9.5" font-weight="700" fill="#581C87">Neural Model Weights (θ):</text>
      <text x="10" y="47" font-size="8.5" fill="#334155">Weights perform next-token mathematical transitions; they do not store state.</text>

      <rect y="64" width="403" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="80" font-size="9.5" font-weight="700" fill="#581C87">Inference Engine as Instruction Pipeline:</text>
      <text x="10" y="95" font-size="8.5" fill="#334155">Autoregressive generation executes the outer loop of cognitive token production.</text>

      <rect y="112" width="403" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="128" font-size="9.5" font-weight="700" fill="#581C87">Search Algorithms as Branch Prediction:</text>
      <text x="10" y="143" font-size="8.5" fill="#334155">MCTS, Best-of-N, and PRMs explore speculative execution trees prior to commit.</text>
    </g>
  </g>

  <!-- TOP-RIGHT: VOLATILE MEMORY (RAM) -->
  <g transform="translate(495, 68)" filter="url(#shadow)">
    <rect width="435" height="210" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="435" height="34" rx="8" fill="url(#blueGrad)"/>
    <rect y="26" width="435" height="8" fill="#2563EB"/>
    <text x="16" y="22" font-size="11.5" font-weight="700" fill="#FFFFFF">2. Volatile Working Memory (Context / RAM)</text>
    <rect x="335" y="8" width="86" height="18" rx="4" fill="#1E3A8A" fill-opacity="0.6"/>
    <text x="378" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#BFDBFE">WORKING SET</text>

    <!-- Content Items -->
    <g transform="translate(16, 48)">
      <text font-size="10" font-weight="700" fill="#1E293B">Classical Concept: <tspan font-weight="500" fill="#475569">SRAM Cache Hierarchy, DRAM Physical Frames &amp; Virtual Pages</tspan></text>
      
      <rect y="16" width="403" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="32" font-size="9.5" font-weight="700" fill="#1E40AF">Active Attention Window (L1/L2):</text>
      <text x="10" y="47" font-size="8.5" fill="#334155">Tokens currently participating in O(N²) attention computation in GPU HBM.</text>

      <rect y="64" width="403" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="80" font-size="9.5" font-weight="700" fill="#1E40AF">Key-Value (KV) Cache Tables:</text>
      <text x="10" y="95" font-size="8.5" fill="#334155">Materialized attention vectors; memory-bandwidth bound during decode (GEMV).</text>

      <rect y="112" width="403" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="128" font-size="9.5" font-weight="700" fill="#1E40AF">Virtual Memory Paging (PagedAttention):</text>
      <text x="10" y="143" font-size="8.5" fill="#334155">Eliminates memory fragmentation; enables prefix sharing and host DRAM swap.</text>
    </g>
  </g>

  <!-- BOTTOM-LEFT: PERSISTENT STORAGE (DISK) -->
  <g transform="translate(30, 298)" filter="url(#shadow)">
    <rect width="435" height="195" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="435" height="34" rx="8" fill="url(#amberGrad)"/>
    <rect y="26" width="435" height="8" fill="#D97706"/>
    <text x="16" y="22" font-size="11.5" font-weight="700" fill="#FFFFFF">3. Persistent Secondary Storage (Episodic / Disk)</text>
    <rect x="330" y="8" width="91" height="18" rx="4" fill="#451A03" fill-opacity="0.6"/>
    <text x="375" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FDE68A">PERSISTENCE</text>

    <!-- Content Items -->
    <g transform="translate(16, 48)">
      <text font-size="10" font-weight="700" fill="#1E293B">Classical Concept: <tspan font-weight="500" fill="#475569">Non-Volatile Flash / Disk, File Systems &amp; ACID Transaction Logs</tspan></text>
      
      <rect y="16" width="403" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="31" font-size="9.5" font-weight="700" fill="#B45309">Episodic Vector Memory &amp; Knowledge Graphs:</text>
      <text x="10" y="45" font-size="8.5" fill="#334155">Non-volatile indexed historical trajectory checkpoints, diffs, and domain facts.</text>

      <rect y="62" width="403" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="77" font-size="9.5" font-weight="700" fill="#B45309">Checkpoints &amp; Rollback Logs:</text>
      <text x="10" y="91" font-size="8.5" fill="#334155">Snapshots of trajectory state $s_t$ allowing rewind upon unrecoverable error.</text>

      <rect y="108" width="403" height="34" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="123" font-size="9.5" font-weight="700" fill="#B45309">Distributed Sagas:</text>
      <text x="10" y="136" font-size="8.5" fill="#334155">Compensating actions across irreversible real-world side effects.</text>
    </g>
  </g>

  <!-- BOTTOM-RIGHT: OPERATING SYSTEM (KERNEL / RUNTIME) -->
  <g transform="translate(495, 298)" filter="url(#shadow)">
    <rect width="435" height="195" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="435" height="34" rx="8" fill="url(#emeraldGrad)"/>
    <rect y="26" width="435" height="8" fill="#059669"/>
    <text x="16" y="22" font-size="11.5" font-weight="700" fill="#FFFFFF">4. The Agent Operating System (Kernel / Runtime)</text>
    <rect x="330" y="8" width="91" height="18" rx="4" fill="#022C22" fill-opacity="0.6"/>
    <text x="375" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#A7F3D0">SUPERVISOR</text>

    <!-- Content Items -->
    <g transform="translate(16, 48)">
      <text font-size="10" font-weight="700" fill="#1E293B">Classical Concept: <tspan font-weight="500" fill="#475569">OS Kernel, Process Control Block (PCB), Syscalls &amp; Protection Rings</tspan></text>
      
      <rect y="16" width="403" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="31" font-size="9.5" font-weight="700" fill="#047857">Agent Control Block (ACB):</text>
      <text x="10" y="45" font-size="8.5" fill="#334155">Tracks trajectory state, parentage, token budgets, and security context.</text>

      <rect y="62" width="403" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="77" font-size="9.5" font-weight="700" fill="#047857">System Calls (Tool Boundary / MCP):</text>
      <text x="10" y="91" font-size="8.5" fill="#334155">Marshals typed tool actuations; transitions control from model to environment.</text>

      <rect y="108" width="403" height="34" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="123" font-size="9.5" font-weight="700" fill="#047857">Hardware Isolation (MicroVMs):</text>
      <text x="10" y="136" font-size="8.5" fill="#334155">Jails tool execution inside ephemeral Firecracker / gVisor sandboxes.</text>
    </g>
  </g>

  <!-- BOTTOM SPAN: THE W XOR X VIOLATION -->
  <g transform="translate(30, 508)" filter="url(#shadow)">
    <rect width="900" height="116" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.3"/>
    
    <!-- Left Alert Badge -->
    <rect x="14" y="12" width="165" height="24" rx="4" fill="url(#roseGrad)"/>
    <text x="96" y="28" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">THE FATAL ANOMALY: W ⊕ X</text>

    <!-- Title and Description -->
    <text x="190" y="28" font-size="11.5" font-weight="700" fill="#9F1239">The Broken Architectural Separation Between Instructions and Data</text>
    
    <g transform="translate(18, 48)">
      <!-- Classical W^X -->
      <rect width="418" height="54" rx="5" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#9F1239">Classical Computer Architecture (Rigid Separation):</text>
      <text x="10" y="32" font-size="8.5" fill="#4C0519">Hardware MMU enforces $W \oplus X$ (Write XOR Execute) at the page table level.</text>
      <text x="10" y="45" font-size="8.5" fill="#4C0519">Data segments cannot be executed as instructions; code injection triggers fault.</text>

      <!-- Neural W^X Failure -->
      <rect x="432" width="440" height="54" rx="5" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#9F1239">Neural Stochastic Processor (Unified Token Stream):</text>
      <text x="10" y="32" font-size="8.5" fill="#4C0519">System prompts (instructions) and external data (untrusted input) share identical tokens.</text>
      <text x="10" y="45" font-size="8.5" fill="#9F1239" font-weight="700">Root Cause of Prompt Injection: Isolation must be enforced externally by the OS runtime.</text>
    </g>
  </g>
</svg>
