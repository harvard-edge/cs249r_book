<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers calibrated for academic systems schematics -->
    <marker id="arr-navy" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#1E3A5F"/>
    </marker>
    <marker id="arr-slate" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#334155"/>
    </marker>
    <marker id="arr-teal" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="arr-ochre" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#92400E"/>
    </marker>
    <marker id="arr-crimson" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#991B1B"/>
    </marker>
    <marker id="arr-sage" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- STAGE 1: CONTEXT STAGING REGISTER & ACB                           -->
  <!-- ================================================================= -->
  <g transform="translate(25, 30)">
    <rect width="215" height="340" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <!-- Stage Header -->
    <rect width="215" height="24" rx="2" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">STAGE 1: CONTEXT STAGING</text>

    <!-- Context Working Register -->
    <g transform="translate(10, 34)">
      <rect width="195" height="88" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="1"/>
      <rect width="4" height="88" fill="#1E3A5F"/>
      <text x="12" y="16" font-size="7.5" font-weight="700" fill="#1E3A5F">Context Input Register [c]</text>
      <text x="12" y="32" font-size="6.8" font-family="Courier New, monospace" fill="#334155">c = [x_prompt, a_1, o_1, ...]</text>
      <text x="12" y="46" font-size="6.8" font-family="Courier New, monospace" fill="#475569">Sequence Length: S_t tokens</text>

      <!-- Bus width indicator -->
      <rect x="12" y="56" width="170" height="20" rx="1" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="28" y1="61" x2="34" y2="71" stroke="#1E3A5F" stroke-width="1"/>
      <text x="38" y="70" font-size="6.5" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">[/B × S × d_model]</text>
    </g>

    <!-- Agent Control Block (ACB) State Registers -->
    <g transform="translate(10, 134)">
      <rect width="195" height="106" rx="1" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="16" font-size="7.2" font-weight="700" fill="#0F172A">Agent Control Block (ACB)</text>

      <!-- Rising clock pulse & PC -->
      <path d="M 12,32 L 16,32 L 16,24 L 22,24 L 22,32 L 26,32" fill="none" stroke="#0F766E" stroke-width="1.2"/>
      <text x="32" y="30" font-size="6.8" font-family="Courier New, monospace" font-weight="700" fill="#0F766E">PC: Step t</text>

      <text x="10" y="48" font-size="6.8" font-family="Courier New, monospace" fill="#334155">Budget: B_t = B_max - b_used</text>
      <text x="10" y="62" font-size="6.8" font-family="Courier New, monospace" fill="#475569">CR_KV: 0x7FFF_0000 [Base]</text>

      <!-- Bit register glyph -->
      <g transform="translate(10, 72)">
        <rect width="175" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
        <line x1="44" y1="0" x2="44" y2="24" stroke="#CBD5E1" stroke-width="0.6"/>
        <line x1="88" y1="0" x2="88" y2="24" stroke="#CBD5E1" stroke-width="0.6"/>
        <line x1="132" y1="0" x2="132" y2="24" stroke="#CBD5E1" stroke-width="0.6"/>
        <text x="22" y="15" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" fill="#475569">STATUS</text>
        <text x="66" y="15" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" fill="#475569">LEASE</text>
        <text x="110" y="15" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" fill="#475569">QUOTA</text>
        <text x="153" y="15" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" fill="#0F766E">ACTIVE</text>
      </g>
    </g>

    <!-- Embedding Lookup -->
    <g transform="translate(10, 252)">
      <rect width="195" height="74" rx="1" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" font-size="7.2" font-weight="700" fill="#334155">Token Embedding Lookup</text>
      <text x="10" y="30" font-size="6.8" font-family="Courier New, monospace" fill="#1E3A5F">h_0 = E[y_{t-1}] + P_{pos}</text>
      <text x="10" y="46" font-size="6.5" font-family="Courier New, monospace" fill="#475569">W_E ∈ ℝ^{|V| × d_model}</text>
      <text x="10" y="60" font-size="6.5" font-family="Courier New, monospace" fill="#0F766E">Intensity: ~0 FLOPs/byte</text>
    </g>
  </g>

  <!-- Datapath Arrow Stage 1 -> Stage 2 -->
  <path d="M 240,200 L 258,200" stroke="#1E3A5F" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <!-- Bus slash on datapath -->
  <line x1="246" y1="195" x2="252" y2="205" stroke="#1E3A5F" stroke-width="1"/>
  <text x="249" y="190" text-anchor="middle" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">[d]</text>

  <!-- ================================================================= -->
  <!-- STAGE 2: NEURAL COMPUTE CORE (f_θ)                                -->
  <!-- ================================================================= -->
  <g transform="translate(260, 30)">
    <rect width="215" height="340" rx="2" fill="#F8FAFC" stroke="#1E3A5F" stroke-width="1.2"/>
    <!-- Stage Header -->
    <rect width="215" height="24" rx="2" fill="#F0F4F8" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8" font-weight="700" fill="#1E3A5F">STAGE 2: NEURAL CORE (f_θ)</text>

    <!-- Transformer Attention Sublayer -->
    <g transform="translate(10, 34)">
      <rect width="195" height="88" rx="1" fill="#ffffff" stroke="#0F766E" stroke-width="1"/>
      <rect width="4" height="88" fill="#0F766E"/>
      <text x="12" y="15" font-size="7.2" font-weight="700" fill="#0F766E">Self-Attention Sublayer (L Layers)</text>
      <text x="12" y="30" font-size="6.8" font-family="Courier New, monospace" fill="#334155">Q = h W_Q, K = h W_K, V = h W_V</text>
      <text x="12" y="44" font-size="6.8" font-family="Courier New, monospace" fill="#0F766E">Attn = Softmax(Q K^T / √d_k) V</text>
      <text x="12" y="58" font-size="6.5" font-family="Courier New, monospace" fill="#475569">GQA (H_Q: 64, H_KV: 8)</text>

      <!-- Bidirectional KV memory link badge -->
      <rect x="12" y="66" width="170" height="14" rx="1" fill="#F0FDF4" stroke="#0F766E" stroke-width="0.5"/>
      <text x="97" y="76" text-anchor="middle" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#0F766E">KV Blocks ↔ HBM Pool (3.35 TB/s)</text>
    </g>

    <!-- Internal Datapath -->
    <path d="M 107,122 L 107,134" stroke="#1E3A5F" stroke-width="1.2" marker-end="url(#arr-navy)"/>

    <!-- Feed-Forward Network (FFN) -->
    <g transform="translate(10, 134)">
      <rect width="195" height="84" rx="1" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" font-size="7.2" font-weight="700" fill="#0F172A">Feed-Forward Network (FFN)</text>
      <text x="10" y="30" font-size="6.8" font-family="Courier New, monospace" fill="#334155">FFN(h) = (SiLU(h W_gate) ⊙ h W_up) W_down</text>
      <text x="10" y="46" font-size="6.8" font-family="Courier New, monospace" fill="#475569">Parameters: θ ∈ ℝ^{70B}</text>
      <text x="10" y="60" font-size="6.5" font-family="Courier New, monospace" fill="#991B1B">Arithmetic Intensity: ~1 FLOP/byte</text>
      <text x="10" y="74" font-size="6.5" font-family="Courier New, monospace" fill="#334155">Single-token GEMV (Tensor Core &lt; 1%)</text>
    </g>

    <!-- Internal Datapath -->
    <path d="M 107,218 L 107,230" stroke="#1E3A5F" stroke-width="1.2" marker-end="url(#arr-navy)"/>

    <!-- Unnormalized Logit Projection -->
    <g transform="translate(10, 230)">
      <rect width="195" height="96" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="1"/>
      <text x="10" y="16" font-size="7.2" font-weight="700" fill="#1E3A5F">Unnormalized Logit Port [z_t]</text>
      <text x="10" y="32" font-size="6.8" font-family="Courier New, monospace" fill="#1E3A5F">z_t = h_L · W_vocab ∈ ℝ^{|V|}</text>
      <text x="10" y="46" font-size="6.8" font-family="Courier New, monospace" fill="#475569">Vocabulary: |V| = 128,000</text>

      <!-- Register array glyph -->
      <g transform="translate(10, 56)">
        <rect width="175" height="28" rx="1" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
        <line x1="35" y1="0" x2="35" y2="28" stroke="#CBD5E1" stroke-width="0.6"/>
        <line x1="70" y1="0" x2="70" y2="28" stroke="#CBD5E1" stroke-width="0.6"/>
        <line x1="105" y1="0" x2="105" y2="28" stroke="#CBD5E1" stroke-width="0.6"/>
        <line x1="140" y1="0" x2="140" y2="28" stroke="#CBD5E1" stroke-width="0.6"/>
        <text x="17" y="18" text-anchor="middle" font-size="6.5" font-family="Courier New, monospace" fill="#334155">z_0</text>
        <text x="52" y="18" text-anchor="middle" font-size="6.5" font-family="Courier New, monospace" fill="#334155">z_1</text>
        <text x="87" y="18" text-anchor="middle" font-size="6.5" font-family="Courier New, monospace" fill="#475569">···</text>
        <text x="122" y="18" text-anchor="middle" font-size="6.5" font-family="Courier New, monospace" fill="#334155">z_k</text>
        <text x="157" y="18" text-anchor="middle" font-size="6.5" font-family="Courier New, monospace" fill="#334155">z_{|V|}</text>
      </g>
    </g>
  </g>

  <!-- Datapath Arrow Stage 2 -> Stage 3 -->
  <path d="M 475,200 L 498,200" stroke="#1E3A5F" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <!-- Bus slash on datapath -->
  <line x1="483" y1="195" x2="489" y2="205" stroke="#1E3A5F" stroke-width="1"/>
  <text x="486" y="190" text-anchor="middle" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#1E3A5F">[/|V|]</text>

  <!-- ================================================================= -->
  <!-- STAGE 3: CONSTRAINED SIMPLEX & SAMPLING ENGINE                    -->
  <!-- ================================================================= -->
  <g transform="translate(500, 30)">
    <rect width="215" height="340" rx="2" fill="#F8FAFC" stroke="#92400E" stroke-width="1.2"/>
    <!-- Stage Header -->
    <rect width="215" height="24" rx="2" fill="#FEF9F3" stroke="#92400E" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8" font-weight="700" fill="#92400E">STAGE 3: CONSTRAINED SAMPLING</text>

    <!-- Grammar Logit Mask (CFG / FSM) -->
    <g transform="translate(10, 34)">
      <rect width="195" height="92" rx="1" fill="#ffffff" stroke="#92400E" stroke-width="1"/>
      <rect width="4" height="92" fill="#92400E"/>
      <text x="12" y="15" font-size="7.2" font-weight="700" fill="#92400E">Grammar Logit Mask (CFG / FSM)</text>
      <text x="12" y="30" font-size="6.8" font-family="Courier New, monospace" fill="#334155">M_t ∈ {0, -∞}^{|V|} [Schema Filter]</text>
      <text x="12" y="44" font-size="6.8" font-family="Courier New, monospace" fill="#92400E">ẑ_t = z_t + M_t</text>
      <text x="12" y="58" font-size="6.5" font-family="Courier New, monospace" fill="#475569">FSM State: q_t = δ(q_{t-1}, y_{t-1})</text>

      <!-- Validation guarantee badge -->
      <rect x="12" y="68" width="170" height="14" rx="1" fill="#FEF9F3" stroke="#92400E" stroke-width="0.5"/>
      <text x="97" y="78" text-anchor="middle" font-size="6" font-weight="700" fill="#92400E">Guarantees Syntactic Schema Only</text>
    </g>

    <!-- Internal Datapath -->
    <path d="M 107,126 L 107,138" stroke="#92400E" stroke-width="1.2" marker-end="url(#arr-ochre)"/>

    <!-- Probability Simplex & Temperature -->
    <g transform="translate(10, 138)">
      <rect width="195" height="88" rx="1" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" font-size="7.2" font-weight="700" fill="#0F172A">Probability Simplex &amp; Entropy</text>
      <text x="10" y="30" font-size="6.8" font-family="Courier New, monospace" fill="#1E3A5F">p_t = Softmax(ẑ_t / T) ∈ Δ^{|V|}</text>
      <text x="10" y="44" font-size="6.8" font-family="Courier New, monospace" fill="#475569">Entropy: H(p_t) = -∑ p_i log p_i</text>
      <text x="10" y="58" font-size="6.5" font-family="Courier New, monospace" fill="#334155">Filters: Top-p (Nucleus) / Min-p</text>
      <text x="10" y="72" font-size="6.5" font-family="Courier New, monospace" fill="#991B1B">Float reduction non-associativity</text>
    </g>

    <!-- Internal Datapath -->
    <path d="M 107,226 L 107,238" stroke="#92400E" stroke-width="1.2" marker-end="url(#arr-ochre)"/>

    <!-- Stochastic Draw & Stop Comparator -->
    <g transform="translate(10, 238)">
      <rect width="195" height="88" rx="1" fill="#ffffff" stroke="#92400E" stroke-width="1"/>
      <text x="10" y="15" font-size="7.2" font-weight="700" fill="#92400E">Stochastic Token Selection</text>
      <text x="10" y="30" font-size="6.8" font-family="Courier New, monospace" fill="#334155">y_t ~ Categorical(p_t)</text>
      <text x="10" y="44" font-size="6.8" font-family="Courier New, monospace" fill="#475569">Or Greedy: y_t = argmax(p_t)</text>

      <!-- Comparator triangle glyph checking Stop tokens -->
      <g transform="translate(10, 52)">
        <polygon points="12,4 12,24 24,14" fill="#FEF9F3" stroke="#92400E" stroke-width="1"/>
        <text x="17" y="16" text-anchor="middle" font-size="6.5" font-weight="700" fill="#92400E">Δ</text>
        <text x="32" y="12" font-size="6" font-family="Courier New, monospace" fill="#475569">Check: y_t ∈ {EOS, StopSeq}</text>
        <text x="32" y="24" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#0F766E">Commit Turn Boundary</text>
      </g>
    </g>
  </g>

  <!-- Datapath Arrow Stage 3 -> Stage 4 -->
  <path d="M 715,200 L 738,200" stroke="#1E3A5F" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <!-- ================================================================= -->
  <!-- STAGE 4: CALLER CONTRACT & TRIPARTITE BOUNDARY                    -->
  <!-- ================================================================= -->
  <g transform="translate(740, 30)">
    <rect width="195" height="340" rx="2" fill="#F8FAFC" stroke="#1E3A5F" stroke-width="1.2"/>
    <!-- Stage Header -->
    <rect width="195" height="24" rx="2" fill="#F0F4F8" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8" font-weight="700" fill="#1E3A5F">STAGE 4: CALLER CONTRACT</text>

    <!-- Tripartite Unit 1: Untrusted Proposal -->
    <g transform="translate(10, 34)">
      <rect width="175" height="60" rx="1" fill="#ffffff" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="14" font-size="7.2" font-weight="700" fill="#0F172A">1. Untrusted Proposal [a_prop]</text>
      <text x="10" y="28" font-size="6.8" font-family="Courier New, monospace" fill="#1E3A5F">y_{1:k} ∈ ℒ(Grammar)</text>
      <text x="10" y="42" font-size="6.5" font-family="Courier New, monospace" fill="#991B1B">Untrusted Neural Emission</text>
      <text x="10" y="54" font-size="6" fill="#475569">No external state authority</text>
    </g>

    <!-- Capability Verification Gate with Air-gap switch -->
    <g transform="translate(10, 102)">
      <rect width="175" height="74" rx="1" fill="#ffffff" stroke="#991B1B" stroke-width="1"/>
      <rect width="4" height="74" fill="#991B1B"/>
      <text x="12" y="14" font-size="7.2" font-weight="700" fill="#991B1B">2. Verification Gate (W ⊕ X)</text>
      <text x="12" y="28" font-size="6.8" font-family="Courier New, monospace" fill="#334155">Check: a_prop ∈ Permitted</text>

      <!-- Air-gap switch glyph: o - / - o -->
      <g transform="translate(12, 36)">
        <circle cx="6" cy="10" r="2.5" fill="#ffffff" stroke="#991B1B" stroke-width="1"/>
        <line x1="8.5" y1="10" x2="18" y2="10" stroke="#991B1B" stroke-width="1"/>
        <line x1="18" y1="10" x2="30" y2="3" stroke="#991B1B" stroke-width="1.2"/>
        <circle cx="36" cy="10" r="2.5" fill="#ffffff" stroke="#991B1B" stroke-width="1"/>
        <line x1="38.5" y1="10" x2="48" y2="10" stroke="#991B1B" stroke-width="1"/>
        <text x="54" y="13" font-size="6" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">Capability Check</text>
      </g>
      <text x="12" y="64" font-size="6" fill="#991B1B">Rejects Unauthorized Actuation</text>
    </g>

    <!-- Tripartite Unit 3: Committed Effect -->
    <g transform="translate(10, 184)">
      <rect width="175" height="60" rx="1" fill="#ffffff" stroke="#166534" stroke-width="1"/>
      <rect width="4" height="60" fill="#166534"/>
      <text x="12" y="14" font-size="7.2" font-weight="700" fill="#166534">3. Committed Effect [a_commit]</text>
      <text x="12" y="28" font-size="6.8" font-family="Courier New, monospace" fill="#166534">a_commit → Sandbox / Tool RPC</text>
      <text x="12" y="42" font-size="6.5" font-family="Courier New, monospace" fill="#475569">Physical state delta: ΔS_env</text>
      <text x="12" y="54" font-size="6" font-weight="700" fill="#166534">Logged to WAL &amp; Saga Ledger</text>
    </g>

    <!-- Caller Status Port -->
    <g transform="translate(10, 252)">
      <rect width="175" height="74" rx="1" fill="#ffffff" stroke="#1E3A5F" stroke-width="1"/>
      <text x="10" y="14" font-size="7.2" font-weight="700" fill="#0F172A">Caller Status Register</text>
      <!-- 4 Status Flags -->
      <g transform="translate(6, 22)">
        <rect x="0" y="0" width="76" height="18" rx="1" fill="#F0FDF4" stroke="#166534" stroke-width="0.6"/>
        <text x="38" y="12" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" font-weight="700" fill="#166534">COMPLETED</text>

        <rect x="84" y="0" width="76" height="18" rx="1" fill="#FEF9F3" stroke="#92400E" stroke-width="0.6"/>
        <text x="122" y="12" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" font-weight="700" fill="#92400E">TRUNCATED</text>

        <rect x="0" y="24" width="76" height="18" rx="1" fill="#FEF2F2" stroke="#991B1B" stroke-width="0.6"/>
        <text x="38" y="36" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" font-weight="700" fill="#991B1B">REFUSAL</text>

        <rect x="84" y="24" width="76" height="18" rx="1" fill="#F8FAFC" stroke="#64748B" stroke-width="0.6"/>
        <text x="122" y="36" text-anchor="middle" font-size="5.8" font-family="Courier New, monospace" font-weight="700" fill="#475569">TRANSPORT_ERR</text>
      </g>
    </g>
  </g>

  <!-- Global Feedback Loop: Committed Action / Observation to Context Register -->
  <path d="M 837,370 L 837,400 L 132,400 L 132,370" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr-teal)"/>
  <rect x="380" y="394" width="200" height="14" rx="1" fill="#ffffff" stroke="#0F766E" stroke-width="0.6"/>
  <text x="480" y="404" text-anchor="middle" font-size="6.2" font-family="Courier New, monospace" font-weight="700" fill="#0F766E">Feedback: Append [y_t, o_{t+1}] to Context Buffer</text>
</svg>
