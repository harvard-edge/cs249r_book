<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow-purple-traj" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7E22CE" flood-opacity="0.35"/>
    </filter>
    <filter id="subtle-shadow-traj" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- Marker Arrows -->
    <marker id="arr-active" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#7E22CE"/>
    </marker>
    <marker id="arr-inactive" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#CBD5E1"/>
    </marker>
    <marker id="arr-forbidden" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Clean canvas -->
  <rect width="340" height="340" fill="#ffffff" rx="12"/>

  <!-- Background decorative container -->
  <rect x="20" y="20" width="300" height="300" rx="8" fill="none" stroke="#F8FAFC" stroke-width="1"/>

  <!-- Forbidden Center Shortcut: a_prop -> v (Fail-Plausible hallucination bypass) -->
  <g>
    <!-- Truncated line so it doesn't touch circle boundaries -->
    <line x1="150" y1="98" x2="98" y2="150"
          stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-forbidden)"/>
    <!-- Warning badge on forbidden edge -->
    <g transform="translate(114, 114)">
      <rect x="-14" y="-8" width="28" height="16" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#DC2626">BYPASS</text>
    </g>
  </g>

  <!-- Directed Perimeter Edges: a_prop -> a -> o -> v -> a_prop -->
  <!-- 1. a_prop -> a (Admission / Gate) -->
  <line x1="188" y1="98" x2="242" y2="152"
        stroke="#7E22CE"
        stroke-width="3" stroke-linecap="round" marker-end="url(#arr-active if ('a_prop', 'a') in active_edges else #arr-inactive)"/>
  <!-- 2. a -> o (Actuation) -->
  <line x1="242" y1="188" x2="188" y2="242"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-inactive)"/>
  <!-- 3. o -> v (Verification) -->
  <line x1="152" y1="242" x2="98" y2="188"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-inactive)"/>
  <!-- 4. v -> a_prop (Feedback) -->
  <line x1="98" y1="152" x2="152" y2="98"
        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-inactive)"/>

  <!-- Nodes -->
  <!-- Top Node: a_prop (Active) -->
  <g transform="translate(170, 80)">
    <circle cx="0" cy="0" r="26" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="21" fill="#7E22CE" stroke="#ffffff" stroke-width="2.5" filter="url(#glow-purple-traj)"/>
    <text x="0" y="6" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">a<tspan font-size="10" dy="4">prop</tspan></text>
  </g>

  <!-- Right Node: a (Inactive) -->
  <g transform="translate(260, 170)">
    <circle cx="0" cy="0" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" filter="url(#subtle-shadow-traj)"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">a</text>
  </g>

  <!-- Bottom Node: o (Inactive) -->
  <g transform="translate(170, 260)">
    <circle cx="0" cy="0" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" filter="url(#subtle-shadow-traj)"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">o</text>
  </g>

  <!-- Left Node: v (Inactive) -->
  <g transform="translate(80, 170)">
    <circle cx="0" cy="0" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" filter="url(#subtle-shadow-traj)"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#64748B">v</text>
  </g>

  <!-- Labels with Bracket Text -->
  <!-- Top: [a_prop] Proposal -->
  <g transform="translate(170, 24)">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#581C87">
      [a<tspan font-size="10" dy="2">prop</tspan><tspan font-size="13" dy="-2">] Candidate Proposal</tspan>
    </text>
    <text x="0" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#7E22CE">
      Neural Core Output (Stochastic)
    </text>
  </g>

  <!-- Right: [a] Action -->
  <g transform="translate(292, 166)">
    <text x="0" y="0" text-anchor="start" font-size="13" font-weight="800" fill="#475569">
      [a] Action
    </text>
    <text x="0" y="14" text-anchor="start" font-size="10" font-weight="600" fill="#94A3B8">
      Admitted Execution
    </text>
  </g>

  <!-- Bottom: [o] Observation -->
  <g transform="translate(170, 304)">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">
      [o] Observation
    </text>
    <text x="0" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#94A3B8">
      Env State Delta / Logs
    </text>
  </g>

  <!-- Left: [v] Verifier -->
  <g transform="translate(48, 166)">
    <text x="0" y="0" text-anchor="end" font-size="13" font-weight="800" fill="#475569">
      [v] Verifier
    </text>
    <text x="0" y="14" text-anchor="end" font-size="10" font-weight="600" fill="#94A3B8">
      Invariant Evidence
    </text>
  </g>

  <!-- Center Status / Kernel Boundary Badge -->
  <g transform="translate(170, 170)">
    <rect x="-52" y="-12" width="104" height="24" rx="12" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="700" fill="#581C87">Kernel Boundary</text>
  </g>

</svg>
