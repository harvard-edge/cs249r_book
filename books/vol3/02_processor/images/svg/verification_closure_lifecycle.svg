<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PHASE 1: SPECULATIVE PROPOSAL GENERATION                          -->
  <!-- ================================================================= -->
  <g transform="translate(25, 20)">
    <!-- Phase Container -->
    <rect x="0" y="0" width="370" height="440" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#0f172a">PHASE 1: STOCHASTIC PROPOSAL (H=1, A=0)</text>

    <!-- Tier 1: Host Agent Runtime -->
    <g transform="translate(15, 42)">
      <rect width="340" height="65" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
      <rect width="340" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="10" y="14" font-size="9.5" font-weight="700" fill="#b45309">HOST AGENT RUNTIME (User-Space OS)</text>
      <text x="10" y="36" font-size="8.5" fill="#334155">Stages context buffer x, bounds K_max, T_max</text>
      <text x="10" y="52" font-size="8.5" fill="#334155">Enforces Zero Ambient Authority: no direct file/syscall access</text>
    </g>

    <!-- Dispatch Arrow -->
    <line x1="185" y1="107" x2="185" y2="132" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <text x="192" y="123" font-size="8" font-weight="600" fill="#b45309">Dispatch Request C_req</text>

    <!-- Tier 2: Inference Service Daemon -->
    <g transform="translate(15, 134)">
      <rect width="340" height="65" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="340" height="20" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="10" y="14" font-size="9.5" font-weight="700" fill="#0369a1">INFERENCE SERVICE DAEMON (Driver Tier)</text>
      <text x="10" y="36" font-size="8.5" fill="#334155">BPE tokenization, batched scheduling, KV allocations</text>
      <text x="10" y="52" font-size="8.5" fill="#334155">Applies decode-time logit masks m_t on accelerator</text>
    </g>

    <!-- Step Arrow -->
    <line x1="185" y1="199" x2="185" y2="224" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="192" y="215" font-size="8" font-weight="600" fill="#0369a1">Forward passes / logits z_t</text>

    <!-- Tier 3: Neural Core -->
    <g transform="translate(15, 226)">
      <rect width="340" height="65" rx="3" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="340" height="20" rx="3" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/>
      <text x="10" y="14" font-size="9.5" font-weight="700" fill="#7e22ce">NEURAL CORE (Static Parameters Θ on Silicon)</text>
      <text x="10" y="36" font-size="8.5" fill="#334155">Linear algebra on Tensor Cores (GEMM prefill, GEMV decode)</text>
      <text x="10" y="52" font-size="8.5" fill="#334155">Evaluates statistical typicality; zero semantic validation</text>
    </g>

    <!-- Emission Arrow -->
    <line x1="185" y1="291" x2="185" y2="318" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr-purple)"/>
    <text x="192" y="308" font-size="8" font-weight="600" fill="#7e22ce">Emits unverified candidate sequence y</text>

    <!-- Escrow Buffer -->
    <g transform="translate(15, 320)">
      <rect width="340" height="98" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
      <rect width="340" height="22" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#1e293b">HOST DRAM MEMORY ESCROW (Isolated Buffer)</text>
      <text x="10" y="38" font-family="Courier New, monospace" font-size="8" fill="#0f172a">Candidate y: [Token IDs, Serialized Stream, Diff]</text>
      <text x="10" y="54" font-size="8" fill="#475569">• Quarantined: Zero host mutation permitted</text>
      <text x="10" y="70" font-size="8" fill="#475569">• Unverified hypothesis held pending external gates</text>
      <text x="10" y="86" font-size="8" font-weight="700" fill="#b45309">Invariant: S_class ≠ COMPLETED ⟹ y ∉ Actuation</text>
    </g>
  </g>

  <!-- Transfer Arrow Phase 1 -> Phase 2 (Clean 75px wide bridge) -->
  <g transform="translate(395, 360)">
    <line x1="5" y1="0" x2="55" y2="0" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)"/>
    <text x="30" y="-12" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">ROUTE TO</text>
    <text x="30" y="-2" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">VERIFICATION</text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 2: EXTERNAL VERIFICATION PERIMETER (C = external)           -->
  <!-- ================================================================= -->
  <g transform="translate(465, 20)">
    <rect x="0" y="0" width="470" height="440" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="470" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#15803d">PHASE 2: EXTERNAL VERIFICATION PERIMETER (C = external)</text>

    <!-- Verification Pipeline Box -->
    <g transform="translate(15, 38)">
      <!-- Gate 1 -->
      <rect x="0" y="0" width="315" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Layer 1: Escrow Unpacking &amp; Schema Parser</text>
      <text x="10" y="32" font-size="7.5" fill="#475569">Extracts candidate payload; enforces strict JSON / AST grammar</text>
      
      <line x1="315" y1="23" x2="345" y2="23" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <text x="352" y="26" font-size="7.5" font-weight="600" fill="#dc2626">Drop if malformed</text>

      <line x1="157" y1="46" x2="157" y2="56" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Gate 2 -->
      <g transform="translate(0, 58)">
        <rect x="0" y="0" width="315" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Layer 2: Static Semantic Type Checker</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Verifies symbols, imports, argument types (e.g. pyright/tsc)</text>

        <line x1="315" y1="23" x2="345" y2="23" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
        <text x="352" y="26" font-size="7.5" font-weight="600" fill="#dc2626">Drop if untyped</text>

        <line x1="157" y1="46" x2="157" y2="56" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      </g>

      <!-- Gate 3 -->
      <g transform="translate(0, 116)">
        <rect x="0" y="0" width="315" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Layer 3: Contractual Precondition Monitor</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Validates file digests, existence, path bounds, resource locks</text>

        <line x1="315" y1="23" x2="345" y2="23" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
        <text x="352" y="26" font-size="7.5" font-weight="600" fill="#dc2626">Drop if violated</text>

        <line x1="157" y1="46" x2="157" y2="56" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      </g>

      <!-- Gate 4 -->
      <g transform="translate(0, 174)">
        <rect x="0" y="0" width="315" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Layer 4: Deterministic Sandbox Test Execution</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Executes test suite in ephemeral isolated sandbox; checks exit code 0</text>

        <line x1="315" y1="23" x2="345" y2="23" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
        <text x="352" y="26" font-size="7.5" font-weight="600" fill="#dc2626">Drop if exit != 0</text>

        <line x1="157" y1="46" x2="157" y2="56" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      </g>

      <!-- Gate 5 -->
      <g transform="translate(0, 232)">
        <rect x="0" y="0" width="315" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Layer 5: Reference Monitor Capability Gate</text>
        <text x="10" y="32" font-size="7.5" fill="#475569">Verifies tamper-proof token/capability before permitting host commit</text>

        <line x1="315" y1="23" x2="345" y2="23" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
        <text x="352" y="26" font-size="7.5" font-weight="600" fill="#dc2626">Drop if unauthorized</text>

        <line x1="157" y1="46" x2="157" y2="60" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      </g>
    </g>

    <!-- Outcomes Footer -->
    <g transform="translate(15, 345)">
      <!-- Success Box -->
      <g transform="translate(0, 0)">
        <rect width="210" height="68" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#15803d">ALL GATES PASSED (P = 1.0)</text>
        <text x="10" y="34" font-size="8" font-weight="600" fill="#0f172a">Release Gate Cleared</text>
        <text x="10" y="48" font-size="7.5" fill="#334155">Invariants verified externally (C=external)</text>
        <text x="10" y="60" font-size="8" font-weight="700" fill="#15803d">COMMIT &amp; ACTUATE (A: 0 ➔ 1)</text>
      </g>

      <!-- Failure Box -->
      <g transform="translate(230, 0)">
        <rect width="210" height="68" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="10" y="18" font-size="9" font-weight="700" fill="#b91c1c">ANY GATE FAILED</text>
        <text x="10" y="34" font-size="8" font-weight="600" fill="#0f172a">Quarantine Invariant Enforced</text>
        <text x="10" y="48" font-size="7.5" fill="#334155">Payload quarantined in host DRAM</text>
        <text x="10" y="60" font-size="8" font-weight="700" fill="#b91c1c">HOST MUTATION BLOCKED (A = 0)</text>
      </g>
    </g>
  </g>
</svg>
