<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="880" height="440" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT PANEL: CONTEXT PREFILL                                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="390" height="365" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">PHASE 1: CONTEXT PREFILL</text>
    <text x="378" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#0284c7">COMPUTE-BOUND (FLOPs)</text>

    <!-- Content Items -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Workload Input</text>
      <text x="12" y="32" font-size="8" fill="#475569">All T_prompt accumulated tokens ingested simultaneously in parallel</text>
    </g>

    <g transform="translate(15, 88)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Silicon Computation</text>
      <text x="12" y="32" font-size="8" fill="#475569">Dense Matrix-Matrix Multiplications (GEMM)</text>
    </g>

    <g transform="translate(15, 142)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Arithmetic Intensity</text>
      <text x="12" y="32" font-size="8" font-weight="600" fill="#0284c7">High: &gt; 100 FLOP/Byte (Tensor Cores saturated)</text>
    </g>

    <g transform="translate(15, 196)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Hardware Bottleneck</text>
      <text x="12" y="32" font-size="8" fill="#475569">Peak FP8 / FP16 Tensor Core FLOPS capability</text>
    </g>

    <!-- Bottom summary box -->
    <g transform="translate(15, 252)">
      <rect x="0" y="0" width="360" height="98" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0369a1">Agent Systems Implication:</text>
      <text x="12" y="36" font-size="8" fill="#334155">• Prompt evaluation scales quadratically across expanding multi-turn trajectories</text>
      <text x="12" y="52" font-size="8" fill="#334155">• Long system prompts and MCP tool definitions impose high prefill latency</text>
      <text x="12" y="68" font-size="8" fill="#334155">• Requires Radix Prefix Caching to reuse shared prefix KV blocks</text>
      <text x="12" y="84" font-size="8" font-weight="700" fill="#0284c7">• Chunked prefill prevents queue starvation for concurrent decode requests</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: AUTOREGRESSIVE DECODE                                -->
  <!-- ================================================================= -->
  <g transform="translate(450, 75)">
    <rect x="0" y="0" width="390" height="365" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PHASE 2: AUTOREGRESSIVE DECODE</text>
    <text x="378" y="16" text-anchor="end" font-size="8" font-weight="700" fill="#15803d">MEMORY-BANDWIDTH BOUND</text>

    <!-- Content Items -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Workload Input</text>
      <text x="12" y="32" font-size="8" fill="#475569">Exactly one generated token at a time (t = 1) in causal sequence</text>
    </g>

    <g transform="translate(15, 88)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Silicon Computation</text>
      <text x="12" y="32" font-size="8" fill="#475569">Matrix-Vector Multiplications (GEMV)</text>
    </g>

    <g transform="translate(15, 142)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Arithmetic Intensity</text>
      <text x="12" y="32" font-size="8" font-weight="600" fill="#16a34a">Abysmal: ~ 1–2 FLOP/Byte (Severe memory bus stall)</text>
    </g>

    <g transform="translate(15, 196)">
      <rect x="0" y="0" width="360" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Hardware Bottleneck</text>
      <text x="12" y="32" font-size="8" fill="#475569">High-Bandwidth Memory (HBM3e) streaming transfer rate</text>
    </g>

    <!-- Bottom summary box -->
    <g transform="translate(15, 252)">
      <rect x="0" y="0" width="360" height="98" rx="1" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">Agent Systems Implication:</text>
      <text x="12" y="36" font-size="8" fill="#334155">• Streams entire model weight matrix W and active KV cache for every step</text>
      <text x="12" y="52" font-size="8" fill="#334155">• Idle tool-wait states strand multi-gigabyte KV caches in expensive GPU HBM</text>
      <text x="12" y="68" font-size="8" fill="#334155">• Requires PagedAttention virtual memory to eliminate external fragmentation</text>
      <text x="12" y="84" font-size="8" font-weight="700" fill="#16a34a">• Hierarchical DMA swapping evicts inactive agent contexts to host DRAM</text>
    </g>
  </g>
</g>
</svg>