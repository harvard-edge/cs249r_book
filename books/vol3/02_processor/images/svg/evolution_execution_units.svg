<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="880" height="460" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- ROW 1: MACHINE INSTRUCTION                                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="800" height="56" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="56" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">1. Machine Instruction</text>
    <text x="85" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Clock: 10⁻⁹ s (1 ns)</text>

    <g transform="translate(185, 0)">
      <text x="10" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Execution Primitives: <tspan font-family="Courier, monospace" fill="#0284c7">ADD, SUB, LOAD, STORE, JMP</tspan></text>
      <text x="10" y="38" font-size="7.5" fill="#64748b">Hardware ALU &amp; registers • Completely deterministic • Atomic state transition</text>
    </g>

    <rect x="695" y="16" width="95" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="742" y="31" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">Hardware Core</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 2: OS PROCESS & THREAD                                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 139)">
    <rect x="0" y="0" width="800" height="56" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="56" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">2. OS Process &amp; Thread</text>
    <text x="85" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Cadence: 10⁻⁶ s (1 µs)</text>

    <g transform="translate(185, 0)">
      <text x="10" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Kernel Abstractions: <tspan font-family="Courier, monospace" fill="#0284c7">fork(), exec(), context switch, mmap()</tspan></text>
      <text x="10" y="38" font-size="7.5" fill="#64748b">Operating system kernel &amp; MMU • Hardware page tables • POSIX protection rings</text>
    </g>

    <rect x="695" y="16" width="95" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="742" y="31" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">OS Kernel</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 3: DISTRIBUTED RPC / HTTP                                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 203)">
    <rect x="0" y="0" width="800" height="56" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="56" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">3. Distributed RPC / HTTP</text>
    <text x="85" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Latency: 10⁻³ s (1 ms)</text>

    <g transform="translate(185, 0)">
      <text x="10" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Stateless Transactions: <tspan font-family="Courier, monospace" fill="#0284c7">POST /api/v1/resource {"payload"} -&gt; 200 OK</tspan></text>
      <text x="10" y="38" font-size="7.5" fill="#64748b">Network gateways &amp; REST protocols • Idempotent retries • Stateless client-server</text>
    </g>

    <rect x="695" y="16" width="95" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="742" y="31" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">Network Fabric</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 4: MODEL INFERENCE PASS                                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 267)">
    <rect x="0" y="0" width="800" height="56" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="56" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">4. Model Inference Pass</text>
    <text x="85" y="38" text-anchor="middle" font-size="7.5" fill="#64748b">Latency: 10⁻¹ s (100 ms)</text>

    <g transform="translate(185, 0)">
      <text x="10" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Stateless Neural Query: <tspan font-family="Courier, monospace" fill="#0284c7">f_θ(prompt) -&gt; token stream (Oracle)</tspan></text>
      <text x="10" y="38" font-size="7.5" fill="#64748b">GPU GEMM matrix engines • Ephemeral KV cache • Unchanged physical world</text>
    </g>

    <rect x="695" y="16" width="95" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="742" y="31" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">Inference Server</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 5: AUTONOMOUS AGENT TRAJECTORY (FEATURED)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 331)">
    <rect x="0" y="0" width="800" height="120" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="120" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="85" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">5. Autonomous Trajectory</text>
    <text x="85" y="56" text-anchor="middle" font-size="8" font-weight="600" fill="#7c3aed">Horizon: 10¹ – 10⁴ s (Hours)</text>
    <text x="85" y="72" text-anchor="middle" font-size="7.5" fill="#6d28d9">Stateful Closed Loop</text>

    <g transform="translate(185, 0)">
      <text x="10" y="25" font-size="9" font-weight="700" fill="#6d28d9">Closed-Loop Loop: <tspan font-family="Courier, monospace" fill="#7c3aed">Goal -&gt; [Act -&gt; Observe -&gt; Verify]ᴺ -&gt; Outcome</tspan></text>
      <text x="10" y="48" font-size="8" fill="#334155">• Non-stationary belief state updates (h_{t+1}) and compounding covariate drift</text>
      <text x="10" y="68" font-size="8" fill="#334155">• Side-effect mutations crossing the Reversibility Boundary (Sagas &amp; compensation)</text>
      <text x="10" y="88" font-size="8" fill="#334155">• Managed by Agent Control Block (ACB), tool sandboxes, and verification oracles</text>
    </g>

    <rect x="685" y="46" width="105" height="28" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="737" y="63" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">Agent Runtime</text>
  </g>
</g>
</svg>