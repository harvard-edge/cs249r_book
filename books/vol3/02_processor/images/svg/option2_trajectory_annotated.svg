<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="opt2-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6B21A8" flood-opacity="0.35"/>
    </filter>
    <filter id="opt2-node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- Exact, fixed pixel arrowheads using userSpaceOnUse -->
    <marker id="arr-purple-fixed" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6B21A8"/>
    </marker>
    <marker id="arr-gray-fixed" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="arr-red-fixed" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Clean card background -->
  <rect width="500" height="380" fill="#ffffff" rx="14" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- SHORTCUT DIAGONAL: Act -> Ver (Bypassing Environment Observation) -->
  <g>
    <line x1="344" y1="190" x2="158" y2="190"
          stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-red-fixed)"/>
    <g transform="translate(250, 190)">
      <rect x="-48" y="-10" width="96" height="20" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="8.5" font-weight="800" fill="#DC2626">BYPASS OBSERVATION</text>
    </g>
  </g>

  <!-- Directed Perimeter Cycle: a_prop -> a -> o -> v -> a_prop -->
  <!-- 1. a_prop -> a: Active Kernel Admission Gate -->
  <line x1="268" y1="109" x2="352" y2="176"
        stroke="#6B21A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-purple-fixed)" filter="url(#opt2-glow)"/>

  <!-- 2. a -> o: Environmental Actuation -->
  <line x1="352" y1="204" x2="268" y2="271"
        stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr-gray-fixed)"/>

  <!-- 3. o -> v: Telemetry & Invariant Proof -->
  <line x1="232" y1="271" x2="148" y2="204"
        stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr-gray-fixed)"/>

  <!-- 4. v -> a_prop: Context Ingestion / Next Prompt -->
  <line x1="148" y1="176" x2="232" y2="109"
        stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr-gray-fixed)"/>

  <!-- Status / Kernel Gate Annotation on active edge -->
  <g transform="translate(325, 130)">
    <rect x="-42" y="-9" width="84" height="18" rx="4" fill="#FAF5FF" stroke="#6B21A8" stroke-width="1"/>
    <text x="0" y="3.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#3B0764">Admission Gate</text>
  </g>

  <!-- Inactive Nodes -->
  <g transform="translate(370, 190)">
    <circle cx="0" cy="0" r="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#opt2-node-shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">a</text>
  </g>

  <g transform="translate(250, 285)">
    <circle cx="0" cy="0" r="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#opt2-node-shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="17" font-weight="700" fill="#64748B">o</text>
  </g>

  <g transform="translate(130, 190)">
    <circle cx="0" cy="0" r="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#opt2-node-shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="17" font-weight="700" fill="#64748B">v</text>
  </g>

  <!-- Active Node: [a_prop] Proposal -->
  <g transform="translate(250, 95)">
    <circle cx="0" cy="0" r="30" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="23" fill="#6B21A8" stroke="#ffffff" stroke-width="2.5" filter="url(#opt2-glow)"/>
    <text x="0" y="7" text-anchor="middle" font-size="14.5" font-weight="800" fill="#ffffff">a<tspan font-size="10.5" dy="3">prop</tspan></text>
  </g>

  <!-- ALL 4 LABELS WITH BRACKET TEXT -->
  <!-- Top: [a_prop] Candidate Proposal -->
  <g transform="translate(250, 24)">
    <rect x="-95" y="-12" width="190" height="24" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#3B0764">[a<tspan font-size="9" dy="2">prop</tspan><tspan font-size="12" dy="-2">] Candidate Proposal</tspan></text>
    <text x="0" y="26" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B21A8">Active: Stochastic Core Output</text>
  </g>

  <!-- Right: [a] Action -->
  <g transform="translate(404, 182)">
    <text x="0" y="0" text-anchor="start" font-size="14" font-weight="800" fill="#0F172A">[a] Action</text>
    <text x="0" y="15" text-anchor="start" font-size="10.5" font-weight="600" fill="#64748B">Gated Execution</text>
    <text x="0" y="27" text-anchor="start" font-size="9.5" fill="#94A3B8">Sandbox interception</text>
  </g>

  <!-- Bottom: [o] Observation -->
  <g transform="translate(250, 324)">
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">[o] Observation</text>
    <text x="0" y="15" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">Env Telemetry</text>
    <text x="0" y="27" text-anchor="middle" font-size="9.5" fill="#94A3B8">Exit codes, stdout, diffs</text>
  </g>

  <!-- Left: [v] Verifier -->
  <g transform="translate(96, 182)">
    <text x="0" y="0" text-anchor="end" font-size="14" font-weight="800" fill="#0F172A">[v] Verifier</text>
    <text x="0" y="15" text-anchor="end" font-size="10.5" font-weight="600" fill="#64748B">Invariant Proof</text>
    <text x="0" y="27" text-anchor="end" font-size="9.5" fill="#94A3B8">Deterministic oracles</text>
  </g>

</svg>
