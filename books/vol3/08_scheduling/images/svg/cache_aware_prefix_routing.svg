<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="workerGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="workerAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="workerSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="1184" height="644" rx="2" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <!-- Top Title Header -->
  <rect x="36" y="26" width="1112" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="48" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">CACHE-AWARE LOAD BALANCING AND PREFIX ROUTING ARCHITECTURE</text>

  <!-- Column 1: Prompt Ingestion & Rolling Merkle Hashing (x: 36, y: 92, w: 330, h: 530) -->
  <rect x="36" y="92" width="330" height="530" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="36" y="92" width="330" height="38" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="52" y="116" fill="#581C87" font-size="13" font-weight="700">1. Prompt Chunk Fingerprinting</text>

  <!-- Prompt Anatomy Card -->
  <g transform="translate(52, 142)">
    <rect width="298" height="136" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="20" fill="#1E293B" font-size="11.5" font-weight="700">Incoming Request Prompt (S = 40k)</text>
    
    <!-- Token Segments -->
    <rect x="14" y="32" width="125" height="22" rx="4" fill="#7C3AED"/>
    <text x="76" y="47" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="600">System (16k)</text>

    <rect x="143" y="32" width="65" height="22" rx="4" fill="#8B5CF6"/>
    <text x="175" y="47" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="600">Tools (8k)</text>

    <rect x="212" y="32" width="55" height="22" rx="4" fill="#A78BFA"/>
    <text x="239" y="47" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="600">Repo (12k)</text>

    <rect x="271" y="32" width="13" height="22" rx="2" fill="#C4B5FD"/>
    
    <text x="14" y="74" fill="#475569" font-size="10">• Shared Prefix: <tspan font-weight="700" fill="#581C87">36,000 tokens (90%)</tspan></text>
    <text x="14" y="92" fill="#475569" font-size="10">• New Turn Suffix: 4,000 tokens (10%)</text>
    <text x="14" y="110" fill="#475569" font-size="10">• Invariant: Chunk size <tspan font-weight="700" fill="#0F172A">B_chunk = 16 tokens</tspan></text>
    <text x="14" y="126" fill="#059669" font-size="9.5" font-weight="600">Identical across 40 swarm agents</text>
  </g>

  <!-- Rolling Merkle Hash Card -->
  <g transform="translate(52, 292)">
    <rect width="298" height="150" rx="2" fill="url(#cardGrad)" stroke="#D8B4FE" stroke-width="1"/>
    <text x="14" y="22" fill="#581C87" font-size="11.5" font-weight="700">Rolling Merkle Chunk Hashing</text>
    <text x="14" y="42" fill="#334155" font-size="10.5">Recursive chunk hash function:</text>
    <rect x="14" y="52" width="270" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="149" y="71" text-anchor="middle" font-family="monospace" fill="#6B21A8" font-size="11" font-weight="700">h_k = Hash(h_{k-1} || c_k)</text>
    
    <text x="14" y="98" fill="#475569" font-size="10">• Initial Vector: <tspan font-family="monospace" fill="#0F172A">h_0 = IV</tspan></text>
    <text x="14" y="114" fill="#475569" font-size="10">• Merkle chain captures strict token ordering</text>
    <text x="14" y="130" fill="#475569" font-size="10">• Produces 64-bit integer stream: <tspan font-family="monospace" fill="#581C87">[h_1 ... h_m]</tspan></text>
    <text x="14" y="144" fill="#64748B" font-size="9">O(1) incremental hashing at cluster ingress</text>
  </g>

  <!-- Router Action Notice -->
  <g transform="translate(52, 456)">
    <rect width="298" height="150" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="20" fill="#1E293B" font-size="11" font-weight="700">Hash Forwarding Invariant</text>
    <text x="14" y="40" fill="#475569" font-size="10">• Ingress router hashes prompt stream</text>
    <text x="14" y="58" fill="#475569" font-size="10">• Omits raw token text from router query</text>
    <text x="14" y="76" fill="#475569" font-size="10">• Transmits compact 64-bit hash keys</text>
    <text x="14" y="94" fill="#475569" font-size="10">• Prevents router memory bandwidth exhaustion</text>
    <rect x="14" y="108" width="270" height="30" rx="4" fill="#EDE9FE"/>
    <text x="149" y="128" text-anchor="middle" fill="#581C87" font-size="10.5" font-weight="700">Zero String Comparison in Router</text>
  </g>

  <!-- Arrow: Col 1 -> Col 2 -->
  <path d="M 370,350 L 390,350" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Column 2: Global Prefix Directory & Radix Index (x: 395, y: 92, w: 420, h: 530) -->
  <rect x="395" y="92" width="420" height="530" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="395" y="92" width="420" height="38" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="411" y="116" fill="#581C87" font-size="13" font-weight="700">2. Global Prefix Directory (Cluster Radix Index)</text>

  <!-- Global Trie Structure Visualization -->
  <g transform="translate(411, 142)">
    <rect width="388" height="240" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="20" fill="#1E293B" font-size="11.5" font-weight="700">Distributed Radix Prefix Trie</text>

    <!-- Trie Nodes -->
    <!-- Root Node -->
    <rect x="114" y="32" width="160" height="34" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="194" y="47" text-anchor="middle" fill="#581C87" font-size="10" font-weight="700">Root [h_0: Empty]</text>
    <text x="194" y="60" text-anchor="middle" fill="#6B21A8" font-size="8.5">Active Nodes: {W1, W2, W3, W4}</text>

    <!-- Edge 1 -->
    <line x1="194" y1="66" x2="194" y2="84" stroke="#7C3AED" stroke-width="1.5"/>

    <!-- Level 1: System Prompt -->
    <rect x="84" y="84" width="220" height="34" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="194" y="99" text-anchor="middle" fill="#581C87" font-size="10" font-weight="700">System Prompt [h_1...h_1000]</text>
    <text x="194" y="112" text-anchor="middle" fill="#6B21A8" font-size="8.5">Cached in HBM: {W1, W2, W3}</text>

    <!-- Edge 2 -->
    <line x1="194" y1="118" x2="194" y2="136" stroke="#7C3AED" stroke-width="1.5"/>

    <!-- Level 2: Tool Schemas -->
    <rect x="94" y="136" width="200" height="34" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="194" y="151" text-anchor="middle" fill="#581C87" font-size="10" font-weight="700">Tool Schemas [h_1001...h_1500]</text>
    <text x="194" y="164" text-anchor="middle" fill="#6B21A8" font-size="8.5">Cached in HBM: {W1, W2}</text>

    <!-- Edge 3 Split -->
    <line x1="150" y1="170" x2="100" y2="188" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="238" y1="170" x2="288" y2="188" stroke="#7C3AED" stroke-width="1.5"/>

    <!-- Level 3 Left: Repo Context A -->
    <rect x="20" y="188" width="160" height="38" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="100" y="203" text-anchor="middle" fill="#581C87" font-size="9.5" font-weight="700">Repo A [h_1501...h_2250]</text>
    <text x="100" y="218" text-anchor="middle" fill="#059669" font-size="8.5" font-weight="700">Node W1 ONLY (Warm)</text>

    <!-- Level 3 Right: Repo Context B -->
    <rect x="208" y="188" width="160" height="38" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="288" y="203" text-anchor="middle" fill="#334155" font-size="9.5" font-weight="700">Repo B [h_1501...h_2250]</text>
    <text x="288" y="218" text-anchor="middle" fill="#64748B" font-size="8.5">Node W2 ONLY (Warm)</text>
  </g>

  <!-- Joint Optimization Equation Card -->
  <g transform="translate(411, 396)">
    <rect width="388" height="210" rx="2" fill="url(#cardGrad)" stroke="#D8B4FE" stroke-width="1"/>
    <text x="14" y="20" fill="#581C87" font-size="11.5" font-weight="700">Joint Affinity vs. Load Objective Function</text>
    
    <rect x="14" y="32" width="360" height="42" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="194" y="58" text-anchor="middle" font-family="monospace" fill="#0F172A" font-size="11" font-weight="700">w* = argmax [ μ·(Match/S) - (1-μ)·(L_j/L_max)^γ ]</text>

    <text x="14" y="92" fill="#475569" font-size="10.2">• <tspan font-weight="700" fill="#581C87">μ ∈ [0, 1]</tspan>: Cache affinity coefficient (default 0.7)</text>
    <text x="14" y="110" fill="#475569" font-size="10.2">• <tspan font-weight="700" fill="#059669">Match/S</tspan>: Fraction of prompt tokens cached in node's HBM</text>
    <text x="14" y="128" fill="#475569" font-size="10.2">• <tspan font-weight="700" fill="#D97706">L_j / L_max</tspan>: Queue load ratio (blocks or queued tokens)</text>
    <text x="14" y="146" fill="#475569" font-size="10.2">• <tspan font-weight="700" fill="#DC2626">γ ≥ 1</tspan>: Non-linear penalty preventing queue saturation</text>
    <text x="14" y="168" fill="#6B21A8" font-size="10" font-weight="600">Guarantees high cache reuse without hot-spotting popular prefixes</text>
    <rect x="14" y="178" width="360" height="22" rx="4" fill="#EDE9FE"/>
    <text x="194" y="193" text-anchor="middle" fill="#581C87" font-size="9.5" font-weight="700">Consistent Hashing with Bounded Loads (1 + ε)</text>
  </g>

  <!-- Arrow: Col 2 -> Col 3 -->
  <path d="M 819,350 L 839,350" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Column 3: Cluster Worker Fleet Dispatch (x: 844, y: 92, w: 320, h: 530) -->
  <rect x="844" y="92" width="320" height="530" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="844" y="92" width="320" height="38" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="860" y="116" fill="#581C87" font-size="13" font-weight="700">3. Worker Node Dispatch &amp; Hit Rates</text>

  <!-- Worker 1: Selected Target (Warm Hit) -->
  <g transform="translate(860, 142)">
    <rect width="288" height="145" rx="2" fill="url(#workerGreen)" stroke="#86EFAC" stroke-width="1.5"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#059669"/>
    <text x="50" y="26" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700">SELECTED</text>
    <text x="96" y="27" fill="#065F46" font-size="11.5" font-weight="800">Worker Node 1 (w*)</text>
    
    <text x="12" y="48" fill="#047857" font-size="10.2">• Cache Match: <tspan font-weight="700">36,000 tokens (90% hit)</tspan></text>
    <text x="12" y="64" fill="#047857" font-size="10.2">• Queue Load: <tspan font-weight="700">L_1 = 42% (Normal)</tspan></text>
    <text x="12" y="80" fill="#047857" font-size="10.2">• Joint Score: <tspan font-weight="700">0.7·(0.9) - 0.3·(0.42)^2 = +0.577</tspan></text>
    
    <rect x="12" y="90" width="264" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
    <text x="144" y="106" text-anchor="middle" fill="#065F46" font-size="10" font-weight="700">Prefill Skipped for 36k Tokens</text>
    <text x="144" y="122" text-anchor="middle" fill="#047857" font-size="9.5">TTFT &lt; 15 ms • Zero Duplicate Compute</text>
  </g>

  <!-- Worker 2: Rejected (Queue Overloaded) -->
  <g transform="translate(860, 299)">
    <rect width="288" height="145" rx="2" fill="url(#workerAmber)" stroke="#FDE68A" stroke-width="1.2"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#D97706"/>
    <text x="50" y="26" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700">PENALIZED</text>
    <text x="96" y="27" fill="#78350F" font-size="11.5" font-weight="800">Worker Node 2</text>
    
    <text x="12" y="48" fill="#92400E" font-size="10.2">• Cache Match: 24,000 tokens (60% hit)</text>
    <text x="12" y="64" fill="#B45309" font-size="10.2">• Queue Load: <tspan font-weight="700">L_2 = 91% (Near Saturation)</tspan></text>
    <text x="12" y="80" fill="#92400E" font-size="10.2">• Joint Score: <tspan font-weight="700">0.7·(0.6) - 0.3·(0.91)^2 = +0.171</tspan></text>

    <rect x="12" y="90" width="264" height="42" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
    <text x="144" y="106" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">Shed to Avoid SLA Violations</text>
    <text x="144" y="122" text-anchor="middle" fill="#B45309" font-size="9.5">Prevents Head-of-Line Queue Delays</text>
  </g>

  <!-- Worker 3: Cold Fallback -->
  <g transform="translate(860, 456)">
    <rect width="288" height="150" rx="2" fill="url(#workerSlate)" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="12" y="12" width="76" height="20" rx="4" fill="#64748B"/>
    <text x="50" y="26" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700">COLD POOL</text>
    <text x="96" y="27" fill="#1E293B" font-size="11.5" font-weight="800">Worker Nodes 3 &amp; 4</text>
    
    <text x="12" y="48" fill="#475569" font-size="10.2">• Cache Match: 0 tokens (Cold Miss)</text>
    <text x="12" y="64" fill="#475569" font-size="10.2">• Queue Load: L_3 = 12% (Idle)</text>
    <text x="12" y="80" fill="#475569" font-size="10.2">• Joint Score: 0.7·(0.0) - 0.3·(0.12)^2 = -0.004</text>

    <rect x="12" y="94" width="264" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="144" y="110" text-anchor="middle" fill="#334155" font-size="10" font-weight="700">Reserved for Uncached Requests</text>
    <text x="144" y="126" text-anchor="middle" fill="#64748B" font-size="9.5">Isolated from Swarm Cache Footprint</text>
  </g>

</svg>
