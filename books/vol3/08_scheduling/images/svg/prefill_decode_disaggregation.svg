<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="prefillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="decodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="rdmaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="1184" height="644" rx="2" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <!-- Top Title Header -->
  <rect x="36" y="26" width="1112" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="48" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">DISAGGREGATED SERVING ARCHITECTURE: DECOUPLED PREFILL AND DECODE</text>

  <!-- Left: Prefill Engine Node (Compute-Bound) -->
  <rect x="36" y="92" width="340" height="440" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="36" y="92" width="340" height="38" rx="2" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
  <circle cx="56" cy="111" r="7" fill="#7C3AED"/>
  <text x="72" y="116" fill="#581C87" font-size="13" font-weight="700">Prefill Node Pool (Compute-Bound)</text>

  <rect x="52" y="142" width="308" height="88" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="64" y="162" fill="#1E293B" font-size="11.5" font-weight="700">Operational Profile</text>
  <text x="64" y="180" fill="#475569" font-size="10.8">• Workload: Full-prompt context ingestion</text>
  <text x="64" y="196" fill="#475569" font-size="10.8">• Arithmetic Intensity: <tspan font-weight="700" fill="#7C3AED">AI &gt;&gt; 100 FLOPs/byte</tspan></text>
  <text x="64" y="212" fill="#475569" font-size="10.8">• Primary Metric: <tspan font-weight="700" fill="#0F172A">Time to First Token (TTFT)</tspan></text>

  <rect x="52" y="240" width="308" height="150" rx="2" fill="url(#prefillGrad)" stroke="#D8B4FE" stroke-width="1"/>
  <text x="64" y="260" fill="#581C87" font-size="11.5" font-weight="700">Hardware &amp; Execution Characteristics</text>
  <text x="64" y="280" fill="#334155" font-size="10.5">• High-TFLOPS Tensor Cores (H100 SXM5 / B200)</text>
  <text x="64" y="298" fill="#334155" font-size="10.5">• Large matrix-matrix multiplications (GEMM)</text>
  <text x="64" y="316" fill="#334155" font-size="10.5">• FlashAttention-2 / Chunked prefill tiling</text>
  <text x="64" y="334" fill="#334155" font-size="10.5">• Temporary KV cache generation:</text>
  <rect x="64" y="342" width="284" height="36" rx="2" fill="#FFFFFF" stroke="#C084FC" stroke-width="1"/>
  <text x="76" y="357" fill="#6B21A8" font-size="10" font-weight="600">Generates K, V tensor blocks across all layers</text>
  <text x="76" y="371" fill="#475569" font-size="9.5">Ready for immediate handoff; no local decoding</text>

  <rect x="52" y="400" width="308" height="118" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="64" y="420" fill="#1E293B" font-size="11.5" font-weight="700">Traditional Co-located Failure Mode</text>
  <text x="64" y="440" fill="#DC2626" font-size="10.5">⚠ Head-of-Line (HoL) Blocking:</text>
  <text x="64" y="458" fill="#475569" font-size="10.2">A 64k agent prefill monopolizes Tensor Cores for</text>
  <text x="64" y="474" fill="#475569" font-size="10.2">seconds, freezing all concurrent decode tokens and</text>
  <text x="64" y="490" fill="#DC2626" font-size="10.2" font-weight="600">spiking Inter-Token Latency (ITL) by 20x–50x.</text>

  <!-- Center: High-Speed RDMA Transfer Interconnect (x: 396, y: 92, w: 408, h: 440) -->
  <rect x="396" y="92" width="408" height="440" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="396" y="92" width="408" height="38" rx="2" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <circle cx="416" cy="111" r="7" fill="#0284C7"/>
  <text x="432" y="116" fill="#0369A1" font-size="13" font-weight="700">Disaggregated RDMA KV Transfer Fabric</text>

  <!-- Visual Stream Graphic -->
  <rect x="412" y="142" width="376" height="74" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="424" y="162" fill="#0F172A" font-size="11.5" font-weight="700">RoCEv2 / InfiniBand Transport (400 – 800 Gbps)</text>
  <rect x="424" y="176" width="352" height="12" rx="2" fill="#0284C7"/>
  <path d="M 768 182 L 758 177 L 758 187 Z" fill="#0284C7"/>
  <line x1="428" y1="182" x2="756" y2="182" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="206" text-anchor="middle" fill="#0369A1" font-size="10" font-weight="700">Zero-Copy Kernel-Bypass RDMA Write (GPU HBM → GPU HBM)</text>

  <!-- Architecture Comparison Box: DistServe vs Splitwise vs Mooncake -->
  <rect x="412" y="226" width="376" height="292" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="424" y="246" fill="#0F172A" font-size="12" font-weight="700">Disaggregated Systems Mechanisms</text>

  <!-- DistServe / Splitwise Card -->
  <rect x="424" y="258" width="352" height="76" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="275" fill="#581C87" font-size="11" font-weight="700">Phase Splitting (Splitwise &amp; DistServe)</text>
  <text x="436" y="293" fill="#334155" font-size="10.2">• Prefill nodes execute layer forward passes.</text>
  <text x="436" y="309" fill="#334155" font-size="10.2">• As each layer completes, KV tensors stream over RDMA.</text>
  <text x="436" y="325" fill="#059669" font-size="10" font-weight="600">Pipelined transfer overlaps network delay with compute.</text>

  <!-- Mooncake KVCache Store Card -->
  <rect x="424" y="342" width="352" height="82" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="436" y="359" fill="#0284C7" font-size="11" font-weight="700">KVCache-Centric Datacenter (Mooncake)</text>
  <text x="436" y="377" fill="#334155" font-size="10.2">• Disaggregated cluster-wide memory pool for KV caches.</text>
  <text x="436" y="393" fill="#334155" font-size="10.2">• Radix tree lookup matches prefix across entire datacenter.</text>
  <text x="436" y="409" fill="#0284C7" font-size="10" font-weight="600">Reuses cached agent prefixes across different physical nodes.</text>

  <!-- RDMA Transfer Latency Equation Card -->
  <rect x="424" y="432" width="352" height="74" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="436" y="449" fill="#065F46" font-size="11" font-weight="700">Network Bandwidth Invariant</text>
  <text x="436" y="466" fill="#334155" font-size="10.2">RDMA transfer time must remain strictly lower than prefill:</text>
  <text x="436" y="483" fill="#059669" font-size="10.5" font-weight="700" font-family="monospace">T_transfer = S_kv / B_net  &lt;  T_prefill</text>
  <text x="436" y="498" fill="#475569" font-size="9.5">400 Gbps (50 GB/s) streams 2.1 GB in ~42 ms (vs ~9s prefill)</text>

  <!-- Right: Decode Engine Node (Memory-Bandwidth-Bound) -->
  <rect x="824" y="92" width="340" height="440" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="824" y="92" width="340" height="38" rx="2" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <circle cx="844" cy="111" r="7" fill="#059669"/>
  <text x="860" y="116" fill="#065F46" font-size="13" font-weight="700">Decode Node Pool (Bandwidth-Bound)</text>

  <rect x="840" y="142" width="308" height="88" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="852" y="162" fill="#1E293B" font-size="11.5" font-weight="700">Operational Profile</text>
  <text x="852" y="180" fill="#475569" font-size="10.8">• Workload: Autoregressive single-token decoding</text>
  <text x="852" y="196" fill="#475569" font-size="10.8">• Arithmetic Intensity: <tspan font-weight="700" fill="#059669">AI ≈ 1 – 2 FLOPs/byte</tspan></text>
  <text x="852" y="212" fill="#475569" font-size="10.8">• Primary Metric: <tspan font-weight="700" fill="#0F172A">Inter-Token Latency (ITL &lt; 25 ms)</tspan></text>

  <rect x="840" y="240" width="308" height="150" rx="2" fill="url(#decodeGrad)" stroke="#86EFAC" stroke-width="1"/>
  <text x="852" y="260" fill="#065F46" font-size="11.5" font-weight="700">Hardware &amp; Execution Characteristics</text>
  <text x="852" y="280" fill="#334155" font-size="10.5">• High-Memory Bandwidth (HBM3e @ 4.8 TB/s)</text>
  <text x="852" y="298" fill="#334155" font-size="10.5">• Matrix-vector multiplications (GEMV)</text>
  <text x="852" y="316" fill="#334155" font-size="10.5">• PagedAttention block manager allocates pages</text>
  <text x="852" y="334" fill="#334155" font-size="10.5">• Streams generated tokens directly to agent:</text>
  <rect x="852" y="342" width="284" height="36" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="864" y="357" fill="#065F46" font-size="10" font-weight="600">Stable, jitter-free autoregressive stream</text>
  <text x="864" y="371" fill="#475569" font-size="9.5">Guarantees interactive human &amp; tool latency SLOs</text>

  <rect x="840" y="400" width="308" height="118" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="852" y="420" fill="#1E293B" font-size="11.5" font-weight="700">Systems &amp; Goodput Benefits</text>
  <text x="852" y="440" fill="#059669" font-size="10.5">✓ Strict SLO Isolation:</text>
  <text x="852" y="458" fill="#475569" font-size="10.2">Decode iterations never interrupted by large prefills.</text>
  <text x="852" y="474" fill="#059669" font-size="10.2" font-weight="600">✓ 2.5× to 4.2× higher cluster goodput</text>
  <text x="852" y="490" fill="#475569" font-size="10.2">under tight TTFT and ITL service level objectives.</text>

  <!-- Systems Principle Callout Banner -->
  <rect x="36" y="548" width="1128" height="86" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="52" y="562" width="102" height="58" rx="2" fill="#581C87"/>
  <text x="103" y="587" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SYSTEMS</text>
  <text x="103" y="603" text-anchor="middle" fill="#E9D5FF" font-size="10" font-weight="700">PRINCIPLE</text>
  <text x="172" y="582" fill="#0F172A" font-size="13.5" font-weight="800">Decouple Compute-Bound Prefill from Bandwidth-Bound Decode via RDMA</text>
  <text x="172" y="604" fill="#475569" font-size="11.5">Co-locating prompt prefill and token decoding causes catastrophic head-of-line blocking for multi-turn agent workloads.</text>
  <text x="172" y="621" fill="#475569" font-size="11.5">Physical disaggregation over RoCEv2/InfiniBand isolates latency SLOs, yielding up to 4x higher serving goodput.</text>
</svg>
