<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="1184" height="644" rx="14" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <rect x="36" y="26" width="102" height="26" rx="13" fill="#EDE9FE"/>
  <text x="87" y="43" text-anchor="middle" fill="#6B21A8" font-size="11" font-weight="700" letter-spacing="0.8">FIGURE 7.2</text>
  <text x="150" y="45" fill="#0F172A" font-size="19" font-weight="800">Trajectory-Aware Serving and Scheduling Architecture</text>
  <text x="36" y="73" fill="#64748B" font-size="12.5">Session-centric affinity routing, heavy-tailed Pareto queues, and capacity-aware predictive admission control</text>

  <!-- Left: Multi-Tenant Agent Ingestion & Workload Traits (x: 36, y: 92, w: 320, h: 440) -->
  <rect x="36" y="92" width="320" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="36" y="92" width="320" height="38" rx="12" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="52" y="116" fill="#581C87" font-size="13" font-weight="700">Agent Trajectory Ingestion</text>

  <!-- Workload Characteristic 1: Heavy-Tailed Pareto -->
  <rect x="52" y="142" width="288" height="106" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="64" y="162" fill="#1E293B" font-size="11.5" font-weight="700">Heavy-Tailed Pareto Service Times</text>
  <text x="64" y="180" fill="#475569" font-size="10.5">• Step distribution: <tspan font-weight="700" fill="#7C3AED">P(N &gt; x) ~ x^(-α)</tspan> (α ≈ 1.1)</text>
  <text x="64" y="198" fill="#475569" font-size="10.5">• 80% tasks finish in &lt; 5 steps; 5% run &gt; 100 steps</text>
  <text x="64" y="216" fill="#475569" font-size="10.5">• Unpredictable horizons break classical FIFO/M/M/k</text>
  <text x="64" y="234" fill="#B45309" font-size="10" font-weight="600">High-variance service time collapses naive queues</text>

  <!-- Workload Characteristic 2: Bimodal Execution -->
  <rect x="52" y="258" width="288" height="106" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="64" y="278" fill="#1E293B" font-size="11.5" font-weight="700">Bimodal Compute vs. Tool I/O</text>
  <text x="64" y="296" fill="#475569" font-size="10.5">• GPU Burst: 100 – 400 ms token decode</text>
  <text x="64" y="314" fill="#475569" font-size="10.5">• Tool Idle Gap: 1 – 60 s (Bash, Pytest, Web)</text>
  <text x="64" y="332" fill="#475569" font-size="10.5">• Human Wait: Minutes to hours for approval</text>
  <text x="64" y="350" fill="#059669" font-size="10" font-weight="600">Demands dynamic context suspension</text>

  <!-- Workload Characteristic 3: Prefix Sharing -->
  <rect x="52" y="374" width="288" height="142" rx="8" fill="url(#cardGrad)" stroke="#D8B4FE" stroke-width="1"/>
  <text x="64" y="394" fill="#581C87" font-size="11.5" font-weight="700">Multi-Turn Prefix Redundancy</text>
  <text x="64" y="412" fill="#334155" font-size="10.5">• Turn t+1 shares 90%+ tokens with Turn t</text>
  <text x="64" y="430" fill="#334155" font-size="10.5">• Routing Turn t+1 to a new worker forces</text>
  <text x="72" y="446" fill="#DC2626" font-size="10.5" font-weight="700">100% redundant prefill recomputation!</text>
  <text x="64" y="468" fill="#334155" font-size="10.5">• Cost penalty: ~9.2 seconds per turn on 70B</text>
  <text x="64" y="492" fill="#581C87" font-size="10.5" font-weight="700">Requires Session-Affinity Routing</text>

  <!-- Center: Trajectory-Aware Scheduling Engine (x: 376, y: 92, w: 448, h: 440) -->
  <rect x="376" y="92" width="448" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="376" y="92" width="448" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="392" y="116" fill="#1E293B" font-size="13" font-weight="700">Trajectory Scheduling Controller</text>
  <text x="808" y="116" text-anchor="end" fill="#64748B" font-size="11">Global Resource Coordinator</text>

  <!-- Component 1: Horizon & Memory Predictor -->
  <rect x="392" y="142" width="416" height="78" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="402" y="152" width="22" height="18" rx="4" fill="#7C3AED"/>
  <text x="413" y="165" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">1</text>
  <text x="432" y="165" fill="#1E293B" font-size="11.5" font-weight="700">Predictive Horizon &amp; Memory Sizing</text>
  <text x="402" y="184" fill="#475569" font-size="10.2">Estimates task horizon H(X_0) and peak KV-cache footprint:</text>
  <text x="402" y="200" fill="#7C3AED" font-size="10.5" font-weight="700" font-family="monospace">S_peak = S_token · (L_initial + E[N] · ΔL_step)</text>

  <!-- Component 2: Capacity-Aware Admission Control -->
  <rect x="392" y="228" width="416" height="88" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="402" y="238" width="22" height="18" rx="4" fill="#D97706"/>
  <text x="413" y="251" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">2</text>
  <text x="432" y="251" fill="#1E293B" font-size="11.5" font-weight="700">Capacity-Aware Admission Gate</text>
  <text x="402" y="270" fill="#475569" font-size="10.2">• Checks cluster HBM safety margin: <tspan font-weight="700">M_free &gt; θ_reserve + S_peak</tspan></text>
  <text x="402" y="286" fill="#475569" font-size="10.2">• Rejects or queues new sessions before memory oversubscription</text>
  <text x="402" y="302" fill="#B45309" font-size="10" font-weight="600">Prevents Coffman deadlocks and cascading GPU OOM crashes</text>

  <!-- Component 3: Cache-Affinity Session Router -->
  <rect x="392" y="324" width="416" height="98" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="402" y="334" width="22" height="18" rx="4" fill="#059669"/>
  <text x="413" y="347" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">3</text>
  <text x="432" y="347" fill="#1E293B" font-size="11.5" font-weight="700">Cache-Affinity Session Routing</text>
  <text x="402" y="366" fill="#475569" font-size="10.2">• Hashes Session ID and checks Radix cache locality across fleet</text>
  <text x="402" y="382" fill="#475569" font-size="10.2">• Steers step t+1 directly to the GPU holding warm prefix blocks</text>
  <text x="402" y="398" fill="#475569" font-size="10.2">• Fallback: RDMA transfer if target worker is compute-saturated</text>
  <text x="402" y="412" fill="#059669" font-size="10" font-weight="600">Achieves &gt; 90% prefix cache hit rate across fleet</text>

  <!-- Component 4: Preemption & Suspension Coordinator -->
  <rect x="392" y="430" width="416" height="88" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="402" y="440" width="22" height="18" rx="4" fill="#2563EB"/>
  <text x="413" y="453" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">4</text>
  <text x="432" y="453" fill="#1E293B" font-size="11.5" font-weight="700">Preemption and Suspension Coordinator</text>
  <text x="402" y="472" fill="#475569" font-size="10.2">• Detects external tool waits; initiates async DMA swap: <tspan font-weight="700">HBM → DRAM</tspan></text>
  <text x="402" y="488" fill="#475569" font-size="10.2">• Respects <tspan font-weight="700" fill="#DC2626">Reversibility Boundary</tspan>: never aborts mutated workflows</text>
  <text x="402" y="504" fill="#1E40AF" font-size="10" font-weight="600">Frees physical HBM page frames during long tool stalls</text>

  <!-- Right: Heterogeneous GPU Worker Fleet (x: 844, y: 92, w: 320, h: 440) -->
  <rect x="844" y="92" width="320" height="440" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="844" y="92" width="320" height="38" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="860" y="116" fill="#065F46" font-size="13" font-weight="700">Target GPU Serving Fleet</text>

  <!-- Worker 1: Active Decoding -->
  <rect x="860" y="142" width="288" height="114" rx="8" fill="url(#workerGrad)" stroke="#86EFAC" stroke-width="1"/>
  <text x="872" y="162" fill="#065F46" font-size="11.5" font-weight="700">GPU Worker #1 (Active Session)</text>
  <text x="872" y="180" fill="#334155" font-size="10.5">• Session A: Turn 12 (Active decode)</text>
  <text x="872" y="196" fill="#334155" font-size="10.5">• Radix Tree: 48k tokens cached</text>
  <text x="872" y="212" fill="#334155" font-size="10.5">• Suffix prefill: 240 tokens</text>
  <text x="872" y="232" fill="#059669" font-size="10" font-weight="600">✓ 100% Affinity Match (Zero recompute)</text>
  <text x="872" y="246" fill="#475569" font-size="9.5">TTFT: 110 ms | GPU HBM: 72% utilized</text>

  <!-- Worker 2: Tool-Wait Swapped -->
  <rect x="860" y="266" width="288" height="114" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="872" y="286" fill="#92400E" font-size="11.5" font-weight="700">GPU Worker #2 (Swapped Session)</text>
  <text x="872" y="304" fill="#334155" font-size="10.5">• Session B: Awaiting Pytest (45 s wait)</text>
  <text x="872" y="320" fill="#334155" font-size="10.5">• KV Cache swapped to Host DRAM</text>
  <text x="872" y="336" fill="#334155" font-size="10.5">• HBM blocks yielded to active batch</text>
  <text x="872" y="356" fill="#D97706" font-size="10" font-weight="600">⚡ Suspended: 0 GB HBM pinned</text>
  <text x="872" y="370" fill="#475569" font-size="9.5">Ready for prefetch on tool completion</text>

  <!-- Worker 3: Multi-Resource Balanced -->
  <rect x="860" y="390" width="288" height="126" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="872" y="410" fill="#1E293B" font-size="11.5" font-weight="700">GPU Worker #3 (DRF Balanced)</text>
  <text x="872" y="428" fill="#334155" font-size="10.5">• Co-locates compute &amp; memory jobs</text>
  <text x="872" y="444" fill="#334155" font-size="10.5">• Dominant Resource Fairness pacing</text>
  <text x="872" y="460" fill="#334155" font-size="10.5">• Enforces QoS P99 &lt; 25 ms ITL</text>
  <text x="872" y="482" fill="#059669" font-size="10" font-weight="600">✓ Goodput optimized under strict SLOs</text>
  <text x="872" y="498" fill="#475569" font-size="9.5">Cluster goodput: 3.4x higher than FIFO</text>

  <!-- Systems Principle Callout Banner -->
  <rect x="36" y="548" width="1128" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="52" y="562" width="102" height="58" rx="8" fill="#581C87"/>
  <text x="103" y="587" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SYSTEMS</text>
  <text x="103" y="603" text-anchor="middle" fill="#E9D5FF" font-size="10" font-weight="700">PRINCIPLE</text>
  <text x="172" y="582" fill="#0F172A" font-size="13.5" font-weight="800">The Session Trajectory, Not the Isolated Request, is the Schedulable Entity</text>
  <text x="172" y="604" fill="#475569" font-size="11.5">Treating multi-turn agent turns as independent requests destroys prefix cache locality and induces fatal memory fragmentation.</text>
  <text x="172" y="621" fill="#475569" font-size="11.5">Schedulers must route with session affinity, predict trajectory horizons, and suspend idle KV blocks during tool execution.</text>
</svg>
