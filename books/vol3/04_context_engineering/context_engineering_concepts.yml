  claims:
    Working-set partition: Before each call the runtime selects a bounded working set and splits the input allowance
      S_max - K_max among instructions, tool declarations, task state, and observations, and appended observations
      are the term that grows and displaces task state.
    Usable working context: Usable context is an empirical property of a model, configuration, representation, and
      workload found by decision-level evaluation, because attention dilutes a target key as staged keys accumulate
      and position matters.
    Change-rate ordering: Staging the request as root, trunk, and leaf by change rate keeps the longest exact token
      prefix reusable, so volatile fields belong in the leaf, although correctness always overrides cache economics.
    Scope rule: An observation is evidence only for the artifact versions and execution conditions under which it
      was gathered, and provenance labels on untrusted spans guide interpretation but enforce nothing.
    Context compaction: Every compaction is a lossy transform that can silently drop evidence a later decision needs,
      so the runtime pins a protected-field set and keeps handles to raw records.
    Audited progress records: A model-written continuation record is an untrusted candidate that a host-side audit
      checks against a runtime-owned field inventory, the event log, and the workspace version before it replaces
      history.
    Context invalidation: A verified write withdraws current-state authority from bound observations and flags dependent
      conclusions for reassessment, without erasing their historical truth.
    Context policy evaluation: Context policies are compared as complete policies on accepted outcomes under a fixed
      model, tools, budget, and fixture, and retention or compression ratios are diagnostics with explicit denominators,
      not verdicts.
    Hysteretic compaction scheduling: Separating a trigger watermark from a post-compaction target sets compaction
      cadence, and the amortized pass cost is judged against cost per accepted task, not local turn cost.
