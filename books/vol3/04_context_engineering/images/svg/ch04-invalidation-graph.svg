  <rect x="398" y="148" width="64" height="14" rx="7" fill="#6d28d9"/>
  <text x="430" y="158" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">historical</text>
  <text x="260" y="176" font-size="8" fill="#475569" font-family="Courier New, monospace">⟨test_waiter_notified_on_return,</text>
