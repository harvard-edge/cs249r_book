<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 694 374"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="694" height="374" fill="#ffffff"/>
  <g transform="translate(7,0)">

  <!-- ===== Reach of the write: every node downstream of src/pool.py ===== -->
  <path d="M14,72 H666 V222 H180 V142 H14 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="654" y="212" text-anchor="end" font-size="12" fill="#b91c1c">reached by the write</text>

  <!-- ===== Column headers ===== -->
  <text x="95" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Workspace artifacts</text>
  <text x="330" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Staged observations</text>
  <text x="330" y="54" text-anchor="middle" font-size="12" fill="#475569">bound by <tspan font-style="italic">λ</tspan>(<tspan font-style="italic">o</tspan>)</text>
  <text x="580" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Derived entries</text>

  <!-- ===== Artifacts ===== -->
  <rect x="20" y="80" width="150" height="50" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="32" y="101" font-size="12" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">src/pool.py</text>
  <text x="32" y="120" font-size="12" fill="#b91c1c">r17 → r18</text>

  <rect x="20" y="160" width="150" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="181" font-size="12" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">tests/test_pool.py</text>
  <text x="32" y="200" font-size="12" fill="#475569">r17</text>

  <rect x="20" y="260" width="150" height="50" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="281" font-size="12" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">docs/pool.md</text>
  <text x="32" y="300" font-size="12" fill="#475569">r17</text>

  <!-- ===== Staged observations ===== -->
  <rect x="220" y="80" width="220" height="50" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text xml:space="preserve" x="232" y="101" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">o</tspan><tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> source excerpt</tspan></text>
  <text x="232" y="120" font-size="12" fill="#475569">pool.py @ r17</text>
  <text x="428" y="120" text-anchor="end" font-size="12" font-weight="700" fill="#475569">historical</text>

  <rect x="220" y="160" width="220" height="50" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text xml:space="preserve" x="232" y="181" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">o</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> controlled test run</tspan></text>
  <text x="232" y="200" font-size="12" fill="#475569">test run @ r17</text>
  <text x="428" y="200" text-anchor="end" font-size="12" font-weight="700" fill="#475569">historical</text>

  <rect x="220" y="260" width="220" height="50" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text xml:space="preserve" x="232" y="281" font-size="13" font-weight="700" fill="#0f172a"><tspan font-style="italic">o</tspan><tspan font-size="11" dy="3">3</tspan><tspan dy="-3"> documentation excerpt</tspan></text>
  <text x="232" y="300" font-size="12" fill="#475569">pool.md @ r17</text>
  <text x="428" y="300" text-anchor="end" font-size="12" font-weight="700" fill="#15803d">unchanged</text>

  <!-- ===== Derived entries ===== -->
  <rect x="500" y="110" width="160" height="70" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="512" y="132" font-size="13" font-weight="700" fill="#0f172a">Missed-notification</text>
  <text x="512" y="149" font-size="13" font-weight="700" fill="#0f172a">hypothesis</text>
  <text x="512" y="168" font-size="12" font-weight="700" fill="#b91c1c">reassess</text>

  <rect x="500" y="260" width="160" height="50" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="512" y="281" font-size="13" font-weight="700" fill="#0f172a">API usage note</text>
  <text x="512" y="300" font-size="12" font-weight="700" fill="#15803d">unchanged</text>

  <!-- ===== Edges: change propagates (red) ===== -->
  <path d="M170,100 H218" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M170,115 H192 V175 H218" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M440,105 H470 V135 H498" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M440,185 H470 V155 H498" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== Edges: dependency, no change (gray) ===== -->
  <path d="M170,195 H218" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M170,285 H218" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M440,285 H498" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Key ===== -->
  <line x1="220" y1="344" x2="250" y2="344" stroke="#dc2626" stroke-width="1.5"/>
  <text x="258" y="348" font-size="12" fill="#0f172a">change propagates</text>
  <line x1="420" y1="344" x2="450" y2="344" stroke="#64748b" stroke-width="1.2"/>
  <text x="458" y="348" font-size="12" fill="#0f172a">dependency, no change</text>
  </g>
</svg>
