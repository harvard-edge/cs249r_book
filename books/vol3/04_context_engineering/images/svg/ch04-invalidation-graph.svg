  <rect x="520" y="105" width="140" height="70" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="530" y="124" font-size="9" font-weight="700" fill="#0f172a">Missed-notification</text>
  <text x="530" y="137" font-size="9" font-weight="700" fill="#0f172a">hypothesis</text>
  <rect x="530" y="148" width="64" height="14" rx="7" fill="#b45309"/>
  <text x="562" y="158" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">reassess</text>

  <rect x="520" y="250" width="140" height="50" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="530" y="268" font-size="9" font-weight="700" fill="#0f172a">API usage note</text>
  <rect x="530" y="278" width="64" height="14" rx="7" fill="#15803d"/>
  <text x="562" y="288" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">unchanged</text>

  <!-- ===== Bindings: artifact -> observation ===== -->
  <path d="M190,85 H250" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M190,100 H220 V165 H250" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M190,185 H250" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M190,275 H250" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Dependency edges: observation -> derived entry ===== -->
  <path d="M470,85 H495 V125 H520" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M470,175 H495 V155 H520" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M470,275 H520" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Key ===== -->
  <line x1="250" y1="320" x2="276" y2="320" stroke="#dc2626" stroke-width="1.5"/>
  <text x="282" y="323" font-size="8" fill="#475569">change propagates from the write</text>
  <line x1="450" y1="320" x2="476" y2="320" stroke="#64748b" stroke-width="1.2"/>
