  <rect x="250" y="60" width="220" height="50" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="260" y="78" font-size="9" font-weight="700" fill="#0f172a">o₁ source excerpt</text>
  <rect x="398" y="68" width="64" height="14" rx="7" fill="#6d28d9"/>
  <text x="430" y="78" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">historical</text>
  <text x="260" y="98" font-size="8" fill="#475569" font-family="Courier New, monospace">⟨pool.py, source, r17, release(), c1⟩</text>

