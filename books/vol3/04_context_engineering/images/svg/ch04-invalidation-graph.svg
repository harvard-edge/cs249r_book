  <rect x="250" y="250" width="220" height="50" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="260" y="268" font-size="9" font-weight="700" fill="#0f172a">o₃ documentation excerpt</text>
  <rect x="398" y="258" width="64" height="14" rx="7" fill="#15803d"/>
  <text x="430" y="268" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">unchanged</text>
  <text x="260" y="288" font-size="8" fill="#475569" font-family="Courier New, monospace">⟨pool.md, source, r17, waiters, c3⟩</text>

