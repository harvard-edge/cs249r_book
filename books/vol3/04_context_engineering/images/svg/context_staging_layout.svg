<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1040" height="370" fill="#ffffff"/>

  <!-- Main Container Card -->
  <rect x="20" y="16" width="1000" height="338" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ========================================================================= -->
  <!-- TOP PANEL: THREE-ZONE LOGICAL CONTEXT LAYOUT                              -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 32)">
    <!-- Zone 1: Immutable Root -->
    <rect x="0" y="24" width="220" height="74" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="110" y="47" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Root Zone [0, L_root]</text>
    <text x="110" y="62" text-anchor="middle" font-size="8.5" fill="#334155">Instructions, Constraints &amp; Tool Definitions</text>
    <text x="110" y="78" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Tier 0 · System Message, Cached Every Turn</text>

    <!-- Zone 2: Trunk -->
    <rect x="220" y="24" width="500" height="74" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="470" y="47" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Trunk Zone [L_root, L_leaf]</text>
    <text x="470" y="62" text-anchor="middle" font-size="8.5" fill="#78350f">Task Statement, Progress Record &amp; Working Files</text>
    <text x="470" y="78" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#b45309">Tier 1 · Rewritten Only at Compaction or Refresh</text>

    <!-- Zone 3: Leaf -->
    <rect x="720" y="24" width="240" height="74" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="840" y="47" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Leaf Zone [L_leaf, M*]</text>
    <text x="840" y="62" text-anchor="middle" font-size="8.5" fill="#166534">Recent Turns &amp; Tool Results</text>
    <text x="840" y="78" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#15803d">Tier 2 · Untrusted, Changes Every Turn</text>

    <!-- Boundary Markers (Upper Axis) -->
    <line x1="0" y1="14" x2="0" y2="22" stroke="#64748b" stroke-width="1.2"/>
    <text x="0" y="10" text-anchor="start" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">0</text>

    <line x1="220" y1="14" x2="220" y2="22" stroke="#64748b" stroke-width="1.2"/>
    <text x="220" y="10" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">L_root</text>

    <line x1="720" y1="14" x2="720" y2="22" stroke="#64748b" stroke-width="1.2"/>
    <text x="720" y="10" text-anchor="middle" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">L_leaf</text>

    <line x1="960" y1="14" x2="960" y2="22" stroke="#64748b" stroke-width="1.2"/>
    <text x="960" y="10" text-anchor="end" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">M* (Budget Cap)</text>

    <!-- Sub-labels below bars -->
    <line x1="220" y1="98" x2="220" y2="114" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="220" y="125" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">PREFIX CACHE BOUNDARY</text>

    <line x1="720" y1="98" x2="720" y2="114" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="720" y="125" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">RECENCY BOUNDARY</text>

    <!-- Generation Frontier Pointer -->
    <line x1="960" y1="98" x2="960" y2="114" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <text x="960" y="126" text-anchor="end" font-size="8" font-weight="700" fill="#0f172a">Next Output</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LOWER PANEL: ATTENTION LOGIT WEIGHT ALLOCATION & U-CURVE PROFILE          -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 180)">
    <rect x="0" y="0" width="960" height="150" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Y-axis and X-axis -->
    <line x1="45" y1="120" x2="940" y2="120" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="45" y1="20" x2="45" y2="120" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="24" text-anchor="end" font-size="8" fill="#64748b">High</text>
    <text x="40" y="118" text-anchor="end" font-size="8" fill="#64748b">Low</text>
    <text x="490" y="136" text-anchor="middle" font-size="8.5" fill="#64748b">Token Position j in [0, M*]</text>
    <text x="940" y="16" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">Attention Weight by Position (schematic)</text>

    <!-- Zone 1 High Attention Sink Shading -->
    <rect x="45" y="20" width="175" height="100" fill="#3b82f6" fill-opacity="0.06"/>
    <text x="132" y="80" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">Attention Sink &amp; Primacy</text>
    <text x="132" y="94" text-anchor="middle" font-size="7.5" fill="#2563eb">Instructions and constraints</text>

    <!-- Zone 2 Lost-in-the-Middle Trough -->
    <rect x="220" y="20" width="500" height="100" fill="#ef4444" fill-opacity="0.04"/>
    <text x="470" y="55" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">Lost in the Middle</text>
    <text x="470" y="69" text-anchor="middle" font-size="8" fill="#991b1b">Evidence here receives the least weight</text>

    <!-- Zone 3 Recency Bias Spike -->
    <rect x="720" y="20" width="220" height="100" fill="#16a34a" fill-opacity="0.06"/>
    <text x="830" y="80" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Recency</text>
    <text x="830" y="94" text-anchor="middle" font-size="7.5" fill="#166534">Latest feedback nearest the output</text>

    <!-- U-Curve Path Aligned with Boundaries -->
    <path d="M 45 32 C 120 36, 180 54, 220 82 C 300 108, 430 114, 560 112 C 650 108, 690 92, 720 76 C 760 54, 840 34, 940 28" 
          fill="none" stroke="#2563eb" stroke-width="2.2"/>
  </g>
</svg>
