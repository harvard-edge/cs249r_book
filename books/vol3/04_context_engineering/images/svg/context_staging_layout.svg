<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="680" height="300" fill="#ffffff"/>

  <g transform="translate(-20,0)">
  <!-- ===== Zone headers (order by change rate) ===== -->
  <text x="215" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Root</text>
  <text x="215" y="38" text-anchor="middle" font-size="8" fill="#475569">instructions, tools</text>
  <text x="370" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Trunk</text>
  <text x="370" y="38" text-anchor="middle" font-size="8" fill="#475569">constraints, progress, source</text>
  <text x="520" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Leaf</text>
  <text x="520" y="38" text-anchor="middle" font-size="8" fill="#475569">latest result, next step</text>
  <text x="600" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Output</text>
  <text x="600" y="38" text-anchor="middle" font-size="8" fill="#475569">reserve</text>

  <!-- change-rate arrow under headers -->
  <line x1="160" y1="50" x2="570" y2="50" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="160" y="62" font-size="8" fill="#64748b">changes rarely</text>
  <text x="570" y="62" text-anchor="end" font-size="8" fill="#64748b">changes every call</text>

  <!-- ===== Row 1: call n (cold) ===== -->
  <text x="150" y="92" text-anchor="end" font-size="9" font-weight="700" fill="#0f172a">call n</text>
  <text x="150" y="104" text-anchor="end" font-size="8" fill="#475569">cold start</text>
  <rect x="160" y="80" width="110" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="270" y="80" width="200" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="470" y="80" width="100" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="570" y="80" width="60" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <text x="215" y="98" text-anchor="middle" font-size="8.5" fill="#0f172a">root</text>
  <text x="370" y="98" text-anchor="middle" font-size="8.5" fill="#0f172a">trunk @ r17</text>
  <text x="520" y="98" text-anchor="middle" font-size="8.5" fill="#0f172a">leaf n</text>

  <!-- ===== Row 2: call n+1, only the leaf changed ===== -->
  <text x="150" y="152" text-anchor="end" font-size="9" font-weight="700" fill="#0f172a">call n+1</text>
  <text x="150" y="164" text-anchor="end" font-size="8" fill="#475569">new observation</text>
  <rect x="160" y="140" width="110" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="270" y="140" width="200" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="470" y="140" width="100" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="570" y="140" width="60" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <text x="215" y="158" text-anchor="middle" font-size="8.5" fill="#0f172a">root</text>
  <text x="370" y="158" text-anchor="middle" font-size="8.5" fill="#0f172a">trunk @ r17</text>
  <text x="520" y="158" text-anchor="middle" font-size="8.5" fill="#0f172a">leaf n+1</text>
  <line x1="470" y1="132" x2="470" y2="178" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="474" y="130" font-size="8" fill="#b91c1c">first changed token</text>

  <!-- ===== Row 3: call n+2, trunk refreshed after the patch ===== -->
  <text x="150" y="212" text-anchor="end" font-size="9" font-weight="700" fill="#0f172a">call n+2</text>
  <text x="150" y="224" text-anchor="end" font-size="8" fill="#475569">trunk refreshed</text>
  <rect x="160" y="200" width="110" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="270" y="200" width="200" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="470" y="200" width="100" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="570" y="200" width="60" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <text x="215" y="218" text-anchor="middle" font-size="8.5" fill="#0f172a">root</text>
  <text x="370" y="218" text-anchor="middle" font-size="8.5" fill="#0f172a">trunk @ r18</text>
  <text x="520" y="218" text-anchor="middle" font-size="8.5" fill="#0f172a">leaf n+2</text>
  <line x1="270" y1="192" x2="270" y2="238" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="274" y="190" font-size="8" fill="#b91c1c">first changed token</text>

  <!-- ===== Input limit tick ===== -->
  <line x1="570" y1="72" x2="570" y2="246" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text xml:space="preserve" x="570" y="258" text-anchor="middle" font-size="8.5" fill="#475569">S<tspan font-size="8" dy="2">max</tspan><tspan dy="-2"> − K</tspan><tspan font-size="8" dy="2">max</tspan></text>

  <!-- ===== Legend ===== -->
  <rect x="160" y="272" width="14" height="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="180" y="281" font-size="8.5" fill="#0f172a">prefix reused</text>
  <rect x="270" y="272" width="14" height="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="290" y="281" font-size="8.5" fill="#0f172a">processed</text>
  <rect x="360" y="272" width="14" height="10" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <text xml:space="preserve" x="380" y="281" font-size="8.5" fill="#0f172a">reserved output, K<tspan font-size="8" dy="2">max</tspan></text>
  </g>
</svg>
