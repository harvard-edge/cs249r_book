<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
    <!-- one tool result = one 20 px amber slice -->
    <rect id="slice" width="54" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <!-- fixed terms: tools and system -->
    <g id="fixed">
      <rect x="0" y="240" width="54" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="270" width="54" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="70" width="54" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    </g>
  </defs>

  <rect width="680" height="370" fill="#ffffff"/>
  <g transform="translate(4,2)">

  <!-- ===== Panel tags ===== -->
  <text x="20" y="34" font-size="14" font-weight="700" fill="#0f172a">A · Append every result</text>
  <text x="360" y="34" font-size="14" font-weight="700" fill="#0f172a">B · Select for the next step</text>
  <line x1="340" y1="20" x2="340" y2="330" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Shared vertical scale (left) ===== -->
  <text x="100" y="74" font-size="14" text-anchor="end" fill="#475569"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">max</tspan></text>
  <text xml:space="preserve" x="100" y="104" font-size="14" text-anchor="end" fill="#b91c1c"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">max</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">K</tspan><tspan font-size="11" dy="3">max</tspan></text>

  <!-- segment names, read against the turn-t bar -->
  <text x="100" y="134" font-size="15" font-weight="700" text-anchor="end" fill="#b45309"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">obs</tspan></text>
  <text x="100" y="199" font-size="15" font-weight="700" text-anchor="end" fill="#15803d"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">state</tspan></text>
  <text x="100" y="259" font-size="15" font-weight="700" text-anchor="end" fill="#475569"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">tools</tspan></text>
  <text x="100" y="289" font-size="15" font-weight="700" text-anchor="end" fill="#475569"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">system</tspan></text>

  <!-- ===== Panel A guides ===== -->
  <line x1="106" y1="70" x2="316" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="106" y1="100" x2="316" y2="100" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="106" y1="300" x2="316" y2="300" stroke="#64748b" stroke-width="1"/>

  <!-- A · turn t: 2 results -->
  <g transform="translate(110,0)">
    <use href="#fixed"/>
    <rect x="0" y="150" width="54" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <use href="#slice" y="130"/><use href="#slice" y="110"/>
  </g>
  <!-- A · turn t+1: 4 results -->
  <g transform="translate(182,0)">
    <use href="#fixed"/>
    <rect x="0" y="180" width="54" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <use href="#slice" y="160"/><use href="#slice" y="140"/><use href="#slice" y="120"/><use href="#slice" y="100"/>
  </g>
  <!-- A · turn t+2: 6 results, task state squeezed -->
  <g transform="translate(254,0)">
    <use href="#fixed"/>
    <use href="#slice" y="200"/><use href="#slice" y="180"/><use href="#slice" y="160"/>
    <use href="#slice" y="140"/><use href="#slice" y="120"/><use href="#slice" y="100"/>
    <rect x="0" y="220" width="54" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  <text x="137" y="322" font-size="12" text-anchor="middle" fill="#475569">turn <tspan font-style="italic">t</tspan></text>
  <text x="209" y="322" font-size="12" text-anchor="middle" fill="#475569">turn <tspan font-style="italic">t</tspan>+1</text>
  <text x="281" y="322" font-size="12" text-anchor="middle" fill="#475569">turn <tspan font-style="italic">t</tspan>+2</text>
  <text x="281" y="342" font-size="12" text-anchor="middle" fill="#b91c1c">state squeezed</text>

  <!-- ===== Panel B guides ===== -->
  <line x1="360" y1="70" x2="566" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="100" x2="566" y2="100" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="360" y1="300" x2="566" y2="300" stroke="#64748b" stroke-width="1"/>

  <!-- B · three identical requests: latest 2 results each -->
  <g transform="translate(370,0)">
    <use href="#fixed"/>
    <rect x="0" y="150" width="54" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <use href="#slice" y="130"/><use href="#slice" y="110"/>
  </g>
  <g transform="translate(436,0)">
    <use href="#fixed"/>
    <rect x="0" y="150" width="54" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <use href="#slice" y="130"/><use href="#slice" y="110"/>
  </g>
  <g transform="translate(502,0)">
    <use href="#fixed"/>
    <rect x="0" y="150" width="54" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <use href="#slice" y="130"/><use href="#slice" y="110"/>
  </g>
  <text x="397" y="322" font-size="12" text-anchor="middle" fill="#475569">turn <tspan font-style="italic">t</tspan></text>
  <text x="463" y="322" font-size="12" text-anchor="middle" fill="#475569">turn <tspan font-style="italic">t</tspan>+1</text>
  <text x="529" y="322" font-size="12" text-anchor="middle" fill="#475569">turn <tspan font-style="italic">t</tspan>+2</text>
  <text x="463" y="342" font-size="12" text-anchor="middle" fill="#15803d">state keeps its share</text>

  <!-- ===== Retained records: the older results, outside the request ===== -->
  <rect x="590" y="104" width="62" height="92" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <g transform="translate(594,0)">
    <use href="#slice" y="110"/><use href="#slice" y="130"/><use href="#slice" y="150"/><use href="#slice" y="170"/>
  </g>
  <text x="621" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#6d28d9">retained</text>
  <text x="621" y="90" font-size="12" font-weight="700" text-anchor="middle" fill="#6d28d9">records</text>

  <!-- move older results out -->
  <path d="M556,140 H588" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <!-- retrieve by handle -->
  <path d="M621,196 V220 H558" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="621" y="242" font-size="12" text-anchor="middle" fill="#6d28d9">retrieve</text>
  <text x="621" y="258" font-size="12" text-anchor="middle" fill="#6d28d9">by handle</text>
  </g>
</svg>
