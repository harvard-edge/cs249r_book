<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="680" height="370" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- PANEL A: APPEND EVERY RESULT                                 -->
  <!-- ============================================================ -->
  <rect x="12" y="12" width="318" height="346" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="12" y="12" width="318" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="24" y="28" font-size="10" font-weight="700" fill="#0f172a">A · Append every tool result</text>

  <!-- limit guides (panel A) -->
  <line x1="92" y1="70" x2="318" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="92" y1="100" x2="318" y2="100" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="92" y1="300" x2="318" y2="300" stroke="#64748b" stroke-width="1"/>
  <text x="86" y="73" font-size="8.5" text-anchor="end" fill="#475569">S<tspan font-size="8" dy="2">max</tspan></text>
  <text xml:space="preserve" x="86" y="103" font-size="8.5" text-anchor="end" fill="#b91c1c">S<tspan font-size="8" dy="2">max</tspan><tspan dy="-2"> − K</tspan><tspan font-size="8" dy="2">max</tspan></text>
  <text x="86" y="303" font-size="8.5" text-anchor="end" fill="#475569">0</text>

  <!-- bar geometry: system 270-300, tools 240-270; state/obs vary; reserve 70-100 -->
  <!-- turn t -->
  <g>
    <rect x="110" y="70" width="56" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="110" y="110" width="56" height="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="110" y="150" width="56" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <rect x="110" y="240" width="56" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <rect x="110" y="270" width="56" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="138" y="133" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0369a1">S<tspan font-size="8" dy="2">obs</tspan></text>
    <text x="138" y="198" font-size="9.5" font-weight="700" text-anchor="middle" fill="#15803d">S<tspan font-size="8" dy="2">state</tspan></text>
    <text x="138" y="258" font-size="9.5" font-weight="700" text-anchor="middle" fill="#b45309">S<tspan font-size="8" dy="2">tools</tspan></text>
    <text x="138" y="288" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0f172a">S<tspan font-size="8" dy="2">system</tspan></text>
    <text x="138" y="318" font-size="8.5" text-anchor="middle" fill="#475569">turn t</text>
  </g>
  <!-- turn t+1 -->
  <g>
    <rect x="186" y="70" width="56" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="186" y="100" width="56" height="80" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="186" y="180" width="56" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <rect x="186" y="240" width="56" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <rect x="186" y="270" width="56" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="214" y="143" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0369a1">S<tspan font-size="8" dy="2">obs</tspan></text>
    <text x="214" y="213" font-size="9.5" font-weight="700" text-anchor="middle" fill="#15803d">S<tspan font-size="8" dy="2">state</tspan></text>
    <text x="214" y="318" font-size="8.5" text-anchor="middle" fill="#475569">turn t+1</text>
  </g>
  <!-- turn t+2 -->
  <g>
    <rect x="262" y="70" width="56" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="262" y="100" width="56" height="115" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="262" y="215" width="56" height="25" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="262" y="240" width="56" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <rect x="262" y="270" width="56" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="290" y="160" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0369a1">S<tspan font-size="8" dy="2">obs</tspan></text>
    <text x="290" y="231" font-size="9.5" font-weight="700" text-anchor="middle" fill="#b91c1c">S<tspan font-size="8" dy="2">state</tspan></text>
    <text x="290" y="318" font-size="8.5" text-anchor="middle" fill="#475569">turn t+2</text>
  </g>
  <text x="171" y="342" font-size="8.5" text-anchor="middle" fill="#b91c1c">Growing observations crowd out task state</text>

  <!-- ============================================================ -->
  <!-- PANEL B: SELECT FOR THE NEXT STEP                            -->
  <!-- ============================================================ -->
  <rect x="350" y="12" width="318" height="346" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350" y="12" width="318" height="24" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="362" y="28" font-size="10" font-weight="700" fill="#0f172a">B · Select for the next step</text>

  <line x1="364" y1="70" x2="542" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="364" y1="100" x2="542" y2="100" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="364" y1="300" x2="542" y2="300" stroke="#64748b" stroke-width="1"/>

  <!-- three identical selected requests -->
  <g>
    <rect x="370" y="70" width="46" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="370" y="110" width="46" height="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="370" y="150" width="46" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <rect x="370" y="240" width="46" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <rect x="370" y="270" width="46" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="393" y="133" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0369a1">S<tspan font-size="8" dy="2">obs</tspan></text>
    <text x="393" y="198" font-size="9.5" font-weight="700" text-anchor="middle" fill="#15803d">S<tspan font-size="8" dy="2">state</tspan></text>
    <text x="393" y="318" font-size="8.5" text-anchor="middle" fill="#475569">turn t</text>
  </g>
  <g>
    <rect x="432" y="70" width="46" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="432" y="110" width="46" height="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="432" y="150" width="46" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <rect x="432" y="240" width="46" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <rect x="432" y="270" width="46" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="455" y="133" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0369a1">S<tspan font-size="8" dy="2">obs</tspan></text>
    <text x="455" y="198" font-size="9.5" font-weight="700" text-anchor="middle" fill="#15803d">S<tspan font-size="8" dy="2">state</tspan></text>
    <text x="455" y="318" font-size="8.5" text-anchor="middle" fill="#475569">turn t+1</text>
  </g>
  <g>
    <rect x="494" y="70" width="46" height="30" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
    <rect x="494" y="110" width="46" height="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="494" y="150" width="46" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <rect x="494" y="240" width="46" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <rect x="494" y="270" width="46" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="517" y="133" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0369a1">S<tspan font-size="8" dy="2">obs</tspan></text>
    <text x="517" y="198" font-size="9.5" font-weight="700" text-anchor="middle" fill="#15803d">S<tspan font-size="8" dy="2">state</tspan></text>
    <text x="517" y="318" font-size="8.5" text-anchor="middle" fill="#475569">turn t+2</text>
  </g>

  <!-- off-context records -->
  <rect x="566" y="110" width="92" height="104" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="566" y="110" width="92" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="612" y="126" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6d28d9">Retained records</text>
  <text x="612" y="152" font-size="8" text-anchor="middle" fill="#475569">raw test logs</text>
  <text x="612" y="168" font-size="8" text-anchor="middle" fill="#475569">superseded reads</text>
  <text x="612" y="184" font-size="8" text-anchor="middle" fill="#475569">earlier narrative</text>
  <text x="612" y="204" font-size="8" text-anchor="middle" fill="#6d28d9">outside the request</text>

  <!-- compact out / retrieve by handle -->
  <path d="M540,124 H566" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M612,214 V232 H542" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="600" y="100" font-size="8" text-anchor="middle" fill="#475569">older results move out</text>
  <text x="606" y="250" font-size="8" text-anchor="middle" fill="#6d28d9">retrieve by handle</text>
  <text x="606" y="262" font-size="8" text-anchor="middle" fill="#6d28d9">when needed</text>

  <!-- reserve label -->
  <text xml:space="preserve" x="455" y="60" font-size="8" text-anchor="middle" fill="#475569">K<tspan font-size="8" dy="2">max</tspan><tspan dy="-2"> output reserve (hatched)</tspan></text>
  <text x="455" y="342" font-size="8.5" text-anchor="middle" fill="#15803d">Task state keeps its share every turn</text>
</svg>
