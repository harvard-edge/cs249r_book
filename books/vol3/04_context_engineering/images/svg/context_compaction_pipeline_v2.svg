<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cc-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
    <marker id="cc-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="cc-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581c87"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1040" height="500" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- 4-STAGE PIPELINE COLUMNS                                                  -->
  <!-- ========================================================================= -->

  <!-- Stage 1: Raw Trajectory Ingestion -->
  <g transform="translate(24, 20)">
    <rect width="230" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="32" rx="4" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#991b1b">Stage 1: Raw Trajectory</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <!-- Unfiltered Log -->
      <rect width="206" height="58" rx="2" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Verbose Diagnostic Logs</text>
      <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">stdout/stderr stack traces</text>
      <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#b91c1c">~8,000 tokens per failure</text>

      <!-- Raw File Payloads -->
      <g transform="translate(0, 66)">
        <rect width="206" height="58" rx="2" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Raw Source File Reads</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Entire files staged for edits</text>
        <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#b91c1c">~20,000 tokens per file</text>
      </g>

      <!-- Conversation Chatter -->
      <g transform="translate(0, 132)">
        <rect width="206" height="50" rx="2" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Conversational Scaffolding</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Multi-turn intermediate chatter</text>
        <text x="10" y="42" font-size="7.5" font-style="italic" fill="#64748b">Superseded hypotheses</text>
      </g>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="206" height="158" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#64748b">BUFFER FOOTPRINT</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#dc2626">128,000 tokens</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#64748b">EFFECTIVE SIGNAL</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#dc2626">&lt; 2% usable tokens</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#64748b">SYSTEMS STATUS</text>
        <text x="0" y="82" font-size="8.5" fill="#991b1b">Quadratic prefill stalls</text>
        <text x="0" y="96" font-size="8.5" fill="#7f1d1d">Softmax denominator dilution</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#64748b">Pre-compaction state</text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M254,230 L274,230" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#cc-arr-slate)"/>

  <!-- Stage 2: Deterministic Lossless Pruning -->
  <g transform="translate(276, 20)">
    <rect width="230" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#334155">Stage 2: Deterministic Pruning</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <!-- Head/Tail Log Slicer -->
      <rect width="206" height="88" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Head/Tail Log Slicer</text>
      <text x="10" y="32" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">Keep: Head 25 lines (Init)</text>
      <text x="10" y="46" font-size="7.5" font-family="ui-monospace, monospace" fill="#b91c1c">Grep: FAIL | ERROR | Panic</text>
      <text x="10" y="60" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">Keep: Tail 25 lines (Exit)</text>
      <text x="10" y="74" font-size="7.5" font-style="italic" fill="#64748b">[... 4,200 lines pruned ...]</text>

      <!-- Unified Diff Extractor -->
      <g transform="translate(0, 96)">
        <rect width="206" height="86" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Unified Diff Extractor</text>
        <text x="10" y="32" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Purge full file dumps</text>
        <text x="10" y="46" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">Retain git diff -U3</text>
        <text x="10" y="60" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">2,000 LOC → 12 LOC patch</text>
        <text x="10" y="74" font-size="7.5" font-weight="700" fill="#0f766e">98% file delta reduction</text>
      </g>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="206" height="158" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#64748b">BUFFER FOOTPRINT</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">24,000 tokens (81% drop)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#64748b">EXECUTION METHOD</text>
        <text x="0" y="48" font-size="8.5" fill="#0f172a">Deterministic regex &amp; diffs</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#64748b">HOST OVERHEAD</text>
        <text x="0" y="82" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">&lt; 5 ms CPU (0 GPU FLOPs)</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#0f766e">Zero information loss</text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M506,230 L526,230" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#cc-arr-teal)"/>

  <!-- Stage 3: Structured AST Skeletonization -->
  <g transform="translate(528, 20)">
    <rect width="230" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="32" rx="4" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#166534">Stage 3: AST Skeletonizer</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <rect width="206" height="182" rx="2" fill="#f8fafc" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#065f46">Tree-sitter Syntax Engine</text>

      <g transform="translate(8, 26)">
        <rect width="190" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Module Docstring</text>
        <text x="8" y="25" font-size="7" font-family="ui-monospace, monospace" fill="#475569">"""Async connection pool"""</text>
      </g>

      <g transform="translate(8, 64)">
        <rect width="190" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Class Hierarchy</text>
        <text x="8" y="25" font-size="7" font-family="ui-monospace, monospace" fill="#475569">class AsyncPool(BasePool):</text>
      </g>

      <g transform="translate(8, 102)">
        <rect width="190" height="40" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Typed API Signatures</text>
        <text x="8" y="26" font-size="7" font-family="ui-monospace, monospace" fill="#0f766e">def acquire(...) -&gt; Conn:</text>
        <text x="8" y="35" font-size="7" font-style="italic" fill="#64748b">[... implementation stripped ...]</text>
      </g>

      <rect x="8" y="150" width="190" height="22" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="103" y="165" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">Symbol Map: 95% Code Pruning</text>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="206" height="158" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#64748b">BUFFER FOOTPRINT</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">6,000 tokens (95% drop)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#64748b">EXTRACTION METHOD</text>
        <text x="0" y="48" font-size="8.5" fill="#0f172a">AST grammar skeletonizer</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#64748b">SEMANTIC FIDELITY</text>
        <text x="0" y="82" font-size="8.5" fill="#047857">Full type &amp; contract integrity</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#047857">Structural interface preservation</text>
      </g>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M758,230 L778,230" fill="none" stroke="#581c87" stroke-width="1.6" marker-end="url(#cc-arr-amethyst)"/>

  <!-- Stage 4: State Ledger & Invariant Enclosure -->
  <g transform="translate(780, 20)">
    <rect width="236" height="420" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1.2"/>
    <rect width="236" height="32" rx="4" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#581c87">Stage 4: State Ledger &amp; Invariants</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <!-- Structured State Ledger -->
      <rect width="212" height="96" rx="2" fill="#ffffff" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6b21a8">Structured State Ledger</text>
      <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f172a">epoch: 3</text>
      <text x="10" y="42" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f172a">goal: "Async pool migration"</text>
      <text x="10" y="54" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">hypotheses: [H1: CONFIRMED]</text>
      <text x="10" y="66" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">mutated: ["src/pool.py:acquire"]</text>
      <text x="10" y="80" font-size="7.5" font-family="ui-monospace, monospace" fill="#16a34a">tests_passing: 42 / 42</text>

      <!-- Invariant Enclosure -->
      <g transform="translate(0, 104)">
        <rect width="212" height="78" rx="2" fill="#faf5ff" stroke="#9333ea" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#581c87">Immutable Invariant Enclosure</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#581c87">User Constraint Set I_spec:</text>
        <text x="10" y="44" font-size="7" font-family="ui-monospace, monospace" fill="#0f172a">Zero breaking API changes</text>
        <text x="10" y="56" font-size="7" font-family="ui-monospace, monospace" fill="#0f172a">Asyncio concurrency invariant</text>
        <text x="10" y="68" font-size="7" font-style="italic" fill="#6b21a8">Protected against drift</text>
      </g>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="212" height="158" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#581c87">FINAL WORKING SET</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">1,200 tokens (99.1% drop)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#581c87">GLOBAL COMPACTION</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">106.7× total reduction</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#581c87">POLICY ENFORCEMENT</text>
        <text x="0" y="82" font-size="8.5" fill="#15803d">Verifiable invariant enclosure</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#581c87">Zero stale-state contamination</text>
      </g>
    </g>
  </g>

  <!-- Bottom Pipeline Flow Banner -->
  <g transform="translate(24, 456)">
    <rect width="992" height="32" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="20" font-size="9" font-weight="700" fill="#0f172a">COMPACTION PIPELINE FLOW:</text>
    <text x="180" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#dc2626">128k (Raw Input)</text>
    <text x="280" y="20" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">──[Lossless Diffs]──&gt;</text>
    <text x="415" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0f766e">24k tokens</text>
    <text x="500" y="20" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">──[AST Skeletons]──&gt;</text>
    <text x="645" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0f766e">6k tokens</text>
    <text x="730" y="20" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">──[State Ledger]──&gt;</text>
    <text x="865" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#15803d">1.2k tokens (99.1%)</text>
  </g>
</svg>
