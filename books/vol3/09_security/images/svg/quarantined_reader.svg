<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 410" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1030" height="410" fill="#ffffff"/>

  <!-- ===== Ingestion row ===== -->
  <rect x="20" y="36" width="160" height="80" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="62" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">README excerpt</text>
  <text x="100" y="80" text-anchor="middle" font-size="8" fill="#0f172a" font-family="Courier New, monospace">readme_7 @ doc_v3</text>
  <text x="100" y="97" text-anchor="middle" font-size="8.5" fill="#7f1d1d">may carry instructions</text>

  <path d="M180,76 H208" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="210" y="36" width="160" height="80" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="290" y="62" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369a1">Quarantined reader</text>
  <text x="290" y="80" text-anchor="middle" font-size="8.5" fill="#0f172a">no tools, no credentials</text>
  <text x="290" y="97" text-anchor="middle" font-size="8.5" fill="#0f172a">declared extraction contract</text>

  <path d="M370,76 H398" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="400" y="36" width="160" height="80" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="62" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Adapter</text>
  <text x="480" y="80" text-anchor="middle" font-size="8.5" fill="#0f172a">completion status checked</text>
  <text x="480" y="97" text-anchor="middle" font-size="8.5" fill="#0f172a">schema validated</text>

  <path d="M560,76 H588" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ── rejected outputs ── -->
  <path d="M480,116 V144" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <rect x="400" y="146" width="160" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="480" y="166" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Not dispatched</text>
  <text x="480" y="182" text-anchor="middle" font-size="8" fill="#475569">tool-call block, extra field, truncation</text>

  <!-- ── runtime ingestion record feeds host metadata ── -->
  <rect x="20" y="200" width="160" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="100" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Runtime ingestion record</text>
  <text x="100" y="236" text-anchor="middle" font-size="8" fill="#475569">task, source, excerpt supplied</text>
  <path d="M180,225 H588" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

  <!-- ===== Host record (matches the reader-record listing) ===== -->
  <rect x="590" y="20" width="220" height="240" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="590" y="20" width="220" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="700" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Admitted record</text>

  <text x="602" y="62" font-size="8" font-weight="700" fill="#475569">reader_output (candidate value)</text>
  <text x="602" y="80" font-size="8" fill="#0f172a" font-family="Courier New, monospace">claimed_tests_passed: true</text>
  <line x1="600" y1="96" x2="800" y2="96" stroke="#cbd5e1" stroke-width="0.8"/>

  <text x="602" y="114" font-size="8" font-weight="700" fill="#475569">host_metadata (from the runtime)</text>
  <text x="602" y="134" font-size="8" fill="#0f172a" font-family="Courier New, monospace">task_id: repair_42</text>
  <text x="602" y="152" font-size="8" fill="#0f172a" font-family="Courier New, monospace">source_id: readme_7</text>
  <text x="602" y="170" font-size="8" fill="#0f172a" font-family="Courier New, monospace">source_version: doc_v3</text>
  <text x="602" y="188" font-size="8" fill="#0f172a" font-family="Courier New, monospace">integrity_provenance:</text>
  <text x="614" y="202" font-size="8" fill="#0f172a" font-family="Courier New, monospace">untrusted_external</text>
  <text x="602" y="220" font-size="8" fill="#0f172a" font-family="Courier New, monospace">confidentiality: public</text>
  <text x="602" y="238" font-size="8" fill="#0f172a" font-family="Courier New, monospace">record_kind: document_claim</text>

  <path d="M810,76 H848" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ===== Planner ===== -->
  <rect x="850" y="36" width="160" height="80" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="930" y="62" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369a1">Planner</text>
  <text x="930" y="80" text-anchor="middle" font-size="8.5" fill="#0f172a">sees the claim,</text>
  <text x="930" y="97" text-anchor="middle" font-size="8.5" fill="#0f172a">not the raw excerpt</text>

  <path d="M930,116 V178" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="936" y="152" font-size="8" fill="#b45309">proposal</text>

  <!-- ===== Reference monitor ===== -->
  <rect x="850" y="180" width="160" height="110" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="930" y="204" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Reference monitor</text>
  <text x="930" y="224" text-anchor="middle" font-size="8.5" fill="#0f172a">checks every proposal</text>
  <text x="930" y="248" text-anchor="middle" font-size="8" fill="#0f172a" font-family="Courier New, monospace">apply_patch(patch=h)</text>
  <text x="930" y="270" text-anchor="middle" font-size="8.5" fill="#0f172a">resolves h under policy</text>

  <!-- ── typed handle store ── -->
  <rect x="590" y="290" width="220" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="700" y="310" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Handle store</text>
  <text x="700" y="326" text-anchor="middle" font-size="8" fill="#475569">patch bytes with host labels, under handle h</text>
  <path d="M810,315 H830 V270 H848" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Tools ===== -->
  <path d="M930,290 V338" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="936" y="318" font-size="8" fill="#b45309">admitted only</text>
  <rect x="850" y="340" width="160" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="930" y="362" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Tool adapters</text>
  <text x="930" y="378" text-anchor="middle" font-size="8" fill="#0f172a">disposable candidate workspace</text>
</svg>
