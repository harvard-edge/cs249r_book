<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="800" height="510" fill="#ffffff"/>

  <!-- ===== Quarantine zone: raw text and the reader, no tools, no credentials ===== -->
  <rect x="20" y="30" width="270" height="160" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="34" y="50" text-anchor="start" font-size="12.5" font-weight="700" fill="#475569">quarantine</text>
  <rect x="36" y="70" width="96" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="84" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">README</text>
  <text x="84" y="115" text-anchor="middle" font-size="12.5" fill="#7f1d1d" font-family="Courier New, monospace">readme_7</text>
  <path d="M132,100 H158" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="160" y="70" width="114" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="217" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0369a1">Quarantined</text>
  <text x="217" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0369a1">reader</text>
  <text x="155" y="172" text-anchor="middle" font-size="12.5" fill="#475569">no tools · no credentials</text>

  <!-- ===== Adapter admits only a completed, schema-valid result ===== -->
  <path d="M274,100 H318" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="320" y="70" width="92" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="366" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Adapter</text>
  <text x="366" y="115" text-anchor="middle" font-size="12.5" fill="#0f172a">schema check</text>
  <path d="M366,130 V218" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <rect x="301" y="220" width="130" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="366" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Not dispatched</text>
  <text x="366" y="259" text-anchor="middle" font-size="12.5" fill="#475569">incomplete or invalid</text>

  <!-- ===== Admitted record: candidate value plus host metadata ===== -->
  <rect x="440" y="30" width="218" height="268" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="549" y="50" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Admitted record</text>
  <rect x="448" y="62" width="202" height="66" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="458" y="80" text-anchor="start" font-size="12.5" fill="#b91c1c">reader output</text>
  <text x="458" y="99" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">claimed_tests_passed:</text>
  <text x="474" y="117" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">true</text>
  <rect x="448" y="136" width="202" height="154" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="458" y="154" text-anchor="start" font-size="12.5" fill="#6d28d9">host metadata</text>
  <text x="458" y="173" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">record_kind:</text>
  <text x="474" y="191" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">document_claim</text>
  <text x="458" y="209" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">source_id: readme_7</text>
  <text x="458" y="227" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">source_version: doc_v3</text>
  <text x="458" y="245" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">integrity_provenance:</text>
  <text x="474" y="263" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">untrusted_external</text>
  <text x="458" y="281" text-anchor="start" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">confidentiality: public</text>
  <path d="M412,87 H438" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="448" y="312" width="130" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="513" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">Runtime</text>
  <text x="513" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">ingestion record</text>
  <path d="M513,312 V300" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

  <!-- ===== Planner sees the claim; every proposal still meets the monitor ===== -->
  <path d="M658,100 H678" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="680" y="70" width="90" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="725" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0369a1">Planner</text>
  <text x="725" y="115" text-anchor="middle" font-size="12.5" fill="#0f172a">sees claim</text>
  <path d="M725,130 V338" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="717" y="236" text-anchor="end" font-size="12.5" fill="#b45309">proposal</text>
  <rect x="610" y="340" width="165" height="80" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="692.5" y="362" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Reference monitor</text>
  <text x="692.5" y="384" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">apply_patch(patch=h)</text>
  <text x="692.5" y="406" text-anchor="middle" font-size="12.5" fill="#475569">resolves h</text>
  <rect x="300" y="370" width="130" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="365" y="391" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Handle store</text>
  <text x="365" y="409" text-anchor="middle" font-size="12.5" fill="#475569">patch bytes as h</text>
  <path d="M430,395 H608" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M692.5,420 V438" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="610" y="440" width="165" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="692.5" y="461" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">Tool adapters</text>
  <text x="692.5" y="479" text-anchor="middle" font-size="12.5" fill="#0f172a">admitted only</text>
</svg>
