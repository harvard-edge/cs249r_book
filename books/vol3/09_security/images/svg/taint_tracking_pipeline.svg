<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="980" height="340" fill="#ffffff"/>

  <!-- ===== Labeled inputs ===== -->
  <rect x="20" y="20" width="190" height="80" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="115" y="44" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">README (readme_7)</text>
  <text x="115" y="64" text-anchor="middle" font-size="8.5" fill="#0f172a">ι = {readme_7}</text>
  <text x="115" y="82" text-anchor="middle" font-size="8.5" fill="#0f172a">κ = every recipient</text>

  <rect x="20" y="120" width="190" height="80" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="115" y="144" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Private fixture</text>
  <text x="115" y="164" text-anchor="middle" font-size="8.5" fill="#0f172a">ι = {fixture}</text>
  <text x="115" y="182" text-anchor="middle" font-size="8.5" fill="#0f172a">κ = {local test runner}</text>

  <rect x="20" y="240" width="190" height="80" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="115" y="264" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Reader extraction</text>
  <text x="115" y="284" text-anchor="middle" font-size="8" fill="#0f172a" font-family="Courier New, monospace">claimed_tests_passed: true</text>
  <text x="115" y="302" text-anchor="middle" font-size="8.5" fill="#0f172a">ι = {readme_7}</text>

  <!-- ── inputs to the planner invocation ── -->
  <path d="M210,60 H230 V90 H248" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M210,160 H230 V130 H248" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Planner invocation ===== -->
  <rect x="250" y="60" width="170" height="100" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="335" y="100" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369a1">Planner invocation</text>
  <text x="335" y="118" text-anchor="middle" font-size="8.5" fill="#0f172a">inputs: all selected context</text>

  <path d="M420,110 H458" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Label join ===== -->
  <rect x="460" y="40" width="210" height="140" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="460" y="40" width="210" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="565" y="56" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Derived query x</text>
  <text x="476" y="86" font-size="8.5" font-weight="700" fill="#0f172a">ι(x): union of inputs</text>
  <text x="476" y="104" font-size="8.5" fill="#0f172a">{readme_7, fixture}</text>
  <text x="476" y="136" font-size="8.5" font-weight="700" fill="#0f172a">κ(x): intersection of inputs</text>
  <text x="476" y="154" font-size="8.5" fill="#0f172a">{local test runner}</text>
  <text x="565" y="204" text-anchor="middle" font-size="8.5" fill="#475569">labels survive summaries and storage</text>


  <!-- ===== Reference monitor ===== -->
  <rect x="700" y="20" width="260" height="310" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="830" y="38" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Reference monitor, before dispatch</text>

  <!-- ── proposals enter the monitor ── -->
  <path d="M670,110 H718" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M210,280 H718" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- ── panel A: release check ── -->
  <rect x="720" y="50" width="220" height="120" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="830" y="70" text-anchor="middle" font-size="8" fill="#0f172a" font-family="Courier New, monospace">package_search(query=x)</text>
  <text x="830" y="88" text-anchor="middle" font-size="8.5" fill="#475569">r = search endpoint (host-resolved)</text>
  <text x="830" y="112" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">release: r ∈ κ(x)?  no</text>
  <rect x="760" y="130" width="140" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="830" y="147" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">rejected before dispatch</text>

  <!-- ── panel B: evidence check ── -->
  <rect x="720" y="190" width="220" height="120" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="830" y="210" text-anchor="middle" font-size="8.5" fill="#0f172a">record a test pass</text>
  <text x="830" y="228" text-anchor="middle" font-size="8.5" fill="#475569">ℰ(o) = {protected runner}</text>
  <text x="830" y="252" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">evidence: ι(x) ⊆ ℰ(o)?  no</text>
  <rect x="760" y="270" width="140" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="830" y="287" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">not recorded as a pass</text>
</svg>
