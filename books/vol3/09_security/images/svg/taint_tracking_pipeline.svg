<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="410" fill="#ffffff"/>

  <!-- ===== Labeled inputs ===== -->
  <rect x="20" y="30" width="170" height="76" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="105" y="52" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">README</text>
  <text x="105" y="72" text-anchor="middle" font-size="12.5" fill="#0f172a">ι = {readme_7}</text>
  <text x="105" y="92" text-anchor="middle" font-size="12.5" fill="#0f172a">κ = every recipient</text>
  <rect x="20" y="124" width="170" height="76" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Private fixture</text>
  <text x="105" y="166" text-anchor="middle" font-size="12.5" fill="#0f172a">ι = {fixture}</text>
  <text x="105" y="186" text-anchor="middle" font-size="12.5" fill="#0f172a">κ = {local test runner}</text>
  <rect x="20" y="268" width="525" height="70" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="105" y="298" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">Reader</text>
  <text x="105" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">extraction</text>
  <line x1="190" y1="280" x2="190" y2="326" stroke="#fca5a5" stroke-width="1"/>
  <text x="357" y="298" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">claimed_tests_passed: true</text>
  <text x="357" y="318" text-anchor="middle" font-size="12.5" fill="#0f172a">ι = {readme_7}</text>

  <!-- ===== Planner invocation sees all selected context ===== -->
  <path d="M190,68 H202 V100 H213" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M190,162 H202 V130 H213" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="215" y="80" width="100" height="70" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="265" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0369a1">Planner</text>
  <text x="265" y="129" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0369a1">invocation</text>
  <path d="M315,115 H343" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Derived query: provenance is the union, recipients the intersection ===== -->
  <rect x="345" y="30" width="200" height="170" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <rect x="345" y="30" width="200" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0"/>
  <line x1="345" y1="56" x2="545" y2="56" stroke="#64748b" stroke-width="1"/>
  <text x="445" y="48" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Derived query x</text>
  <text x="357" y="80" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">ι(x): union</text>
  <rect x="357" y="90" width="84" height="22" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="399" y="105.5" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-family="Courier New, monospace">readme_7</text>
  <rect x="449" y="90" width="84" height="22" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="491" y="105.5" text-anchor="middle" font-size="12.5" fill="#15803d" font-family="Courier New, monospace">fixture</text>
  <text x="357" y="142" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">κ(x): intersection</text>
  <rect x="357" y="152" width="176" height="22" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="445" y="167.5" text-anchor="middle" font-size="12.5" fill="#0f172a">local test runner</text>

  <!-- ===== Reference monitor: two independent checks before dispatch ===== -->
  <rect x="570" y="20" width="210" height="368" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="675" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Reference monitor</text>
  <rect x="580" y="52" width="190" height="164" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="675" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Release check</text>
  <text x="675" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Courier New, monospace">package_search(x)</text>
  <text x="675" y="118" text-anchor="middle" font-size="12.5" fill="#475569">r = search endpoint</text>
  <text x="675" y="136" text-anchor="middle" font-size="12.5" fill="#475569">(host-resolved)</text>
  <text x="675" y="162" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">r ∈ κ(x)?  no</text>
  <rect x="590" y="176" width="170" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="675" y="195" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">rejected before dispatch</text>
  <rect x="580" y="228" width="190" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="675" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Evidence check</text>
  <text x="675" y="274" text-anchor="middle" font-size="12.5" fill="#0f172a">record a test pass</text>
  <text x="675" y="294" text-anchor="middle" font-size="12.5" fill="#475569">Inf(o) = {protected runner}</text>
  <text x="675" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">ι(x) ⊆ Inf(o)?  no</text>
  <rect x="590" y="336" width="170" height="28" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="675" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">not recorded as a pass</text>
  <path d="M545,115 H578" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M545,303 H578" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
</svg>
