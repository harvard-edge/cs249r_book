<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="860" height="310" fill="#ffffff"/>

  <!-- ===== Column tags ===== -->
  <text x="120" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">CONNECTION ON THIS PATH</text>
  <text x="360" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">ONE WAY TO REMOVE IT</text>
  <text x="575" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">WHEN ALL ARE NEEDED</text>

  <!-- ===== Legs ===== -->
  <rect x="20" y="40" width="200" height="70" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="120" y="68" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Private data in reach</text>
  <text x="120" y="86" text-anchor="middle" font-size="8.5" fill="#0f172a">fixture read for local tests</text>

  <rect x="20" y="130" width="200" height="70" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="120" y="158" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Attacker-controlled content</text>
  <text x="120" y="176" text-anchor="middle" font-size="8.5" fill="#0f172a">instruction in the README</text>

  <rect x="20" y="220" width="200" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Outbound recipient</text>
  <text x="120" y="266" text-anchor="middle" font-size="8.5" fill="#0f172a">external package-search service</text>

  <!-- ── leg to gate ── -->
  <path d="M220,75 H258" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M220,165 H258" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M220,255 H258" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Gates ===== -->
  <rect x="260" y="40" width="200" height="70" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="360" y="62" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Protected test runner</text>
  <text x="360" y="79" text-anchor="middle" font-size="8.5" fill="#475569">returns a result, not fixture bytes;</text>
  <text x="360" y="94" text-anchor="middle" font-size="8.5" fill="#475569">handles resolved under policy</text>

  <rect x="260" y="130" width="200" height="70" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="360" y="158" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Quarantined reader</text>
  <text x="360" y="176" text-anchor="middle" font-size="8.5" fill="#475569">narrows raw-instruction exposure</text>

  <rect x="260" y="220" width="200" height="70" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="360" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Egress boundary</text>
  <text x="360" y="266" text-anchor="middle" font-size="8.5" fill="#475569">no external search for this subtask</text>

  <!-- ── gates converge on the dispatch check ── -->
  <path d="M460,75 H575 V108" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M460,165 H498" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M460,255 H575 V222" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Dispatch check ===== -->
  <rect x="500" y="110" width="150" height="110" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="575" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Dependency +</text>
  <text x="575" y="163" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">recipient check</text>
  <text x="575" y="182" text-anchor="middle" font-size="8.5" fill="#475569">before dispatch</text>

  <!-- ── check to disclosure (only if admitted) ── -->
  <path d="M650,165 H688" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>

  <!-- ===== Outcome ===== -->
  <rect x="690" y="130" width="150" height="70" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="158" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Disclosure</text>
  <text x="765" y="176" text-anchor="middle" font-size="8.5" fill="#0f172a">fixture reaches the service</text>
</svg>
