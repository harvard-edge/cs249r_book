<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="290" fill="#ffffff"/>

  <!-- ===== Endpoints of the disclosure path ===== -->
  <rect x="20" y="92" width="100" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Private</text>
  <text x="70" y="134" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">fixture</text>
  <rect x="690" y="92" width="90" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="735" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">Disclosure</text>
  <text x="735" y="134" text-anchor="middle" font-size="13" fill="#7f1d1d">at service</text>

  <!-- ===== Bracket: the three connections lie on one path ===== -->
  <path d="M140,62 V56 H510 V62" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="325" y="48" text-anchor="middle" font-size="13" fill="#475569">all three on one path</text>

  <!-- ===== Three connections, wired in series ===== -->
  <line x1="120" y1="120" x2="140" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <line x1="140" y1="120" x2="250" y2="120" stroke="#16a34a" stroke-width="4"/>
  <circle cx="140" cy="120" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="250" cy="120" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">private data</text>
  <text x="195" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">in reach</text>
  <path d="M188,130 L194,110 M196,130 L202,110" stroke="#475569" stroke-width="1.5"/>
  <line x1="195" y1="134" x2="195" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="139" y="180" width="112" height="80" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="195" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Protected</text>
  <text x="195" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">test runner</text>
  <text x="195" y="243" text-anchor="middle" font-size="13" fill="#475569">result, not bytes</text>
  <line x1="250" y1="120" x2="270" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="120" x2="380" y2="120" stroke="#dc2626" stroke-width="4"/>
  <circle cx="270" cy="120" r="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="380" cy="120" r="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="325" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">attacker</text>
  <text x="325" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">content</text>
  <path d="M322,130 L328,110" stroke="#475569" stroke-width="1.5"/>
  <line x1="325" y1="134" x2="325" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="269" y="180" width="112" height="80" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="325" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Quarantined</text>
  <text x="325" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">reader</text>
  <text x="325" y="243" text-anchor="middle" font-size="13" fill="#475569">narrows exposure</text>
  <line x1="380" y1="120" x2="400" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <line x1="400" y1="120" x2="510" y2="120" stroke="#d97706" stroke-width="4"/>
  <circle cx="400" cy="120" r="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="510" cy="120" r="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="455" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">outbound</text>
  <text x="455" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">recipient</text>
  <path d="M448,130 L454,110 M456,130 L462,110" stroke="#475569" stroke-width="1.5"/>
  <line x1="455" y1="134" x2="455" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="399" y="180" width="112" height="80" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="455" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Egress</text>
  <text x="455" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">boundary</text>
  <text x="455" y="243" text-anchor="middle" font-size="13" fill="#475569">no search</text>

  <!-- ===== Dependency and recipient check before dispatch ===== -->
  <line x1="510" y1="120" x2="530" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <rect x="530" y="76" width="110" height="88" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="585" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Dependency +</text>
  <text x="585" y="121" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">recipient</text>
  <text x="585" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">check</text>
  <text x="585" y="184" text-anchor="middle" font-size="13" fill="#475569">before dispatch</text>
  <path d="M640,120 H688" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
</svg>
