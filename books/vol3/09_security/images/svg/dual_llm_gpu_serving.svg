<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
  </defs>

  <!-- Crisp white background -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ======================================================================= -->
  <!-- PANEL 1: QUARANTINE EXTRACTOR NODE (LEFT: x=24 to 304, w=280)           -->
  <!-- ======================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="280" height="420" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="280" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="14" y="19" font-size="8.5" font-weight="700" fill="#991b1b" letter-spacing="0.5">QUARANTINE EXTRACTOR (π_read)</text>
    <text x="266" y="19" font-size="7" font-weight="700" fill="#7f1d1d" text-anchor="end">GPU Node A (A=0)</text>

    <!-- Sub-box 1: Untrusted Ingress & Isolation -->
    <g transform="translate(10, 36)">
      <rect width="260" height="110" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="260" height="20" rx="3" fill="#fee2e2"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#991b1b">Untrusted Ingestion Envelope</text>
      <text x="8" y="34" font-size="7.2" fill="#475569">• Consumes hostile web scrapes, diffs, emails</text>
      <text x="8" y="48" font-size="7.2" fill="#7f1d1d">• Planted adversarial prompt injections</text>
      <text x="8" y="62" font-size="7.2" fill="#7f1d1d">• Zero ambient authority (A = 0)</text>
      <text x="8" y="76" font-size="7.2" fill="#475569">• Network disabled • No tool APIs advertised</text>
      <rect x="8" y="84" width="244" height="20" rx="2" fill="#fee2e2"/>
      <text x="130" y="97" font-size="6.8" font-weight="700" fill="#991b1b" text-anchor="middle">Physical Compromise Blast Radius: Zero Actuation</text>
    </g>

    <!-- Sub-box 2: Ephemeral Bounded Context -->
    <g transform="translate(10, 154)">
      <rect width="260" height="112" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="260" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#1e293b">Bounded Ephemeral KV-Cache</text>
      <text x="8" y="34" font-size="7.2" fill="#334155">Worker Model: Lightweight 8B parameter (FP8/BF16)</text>
      <text x="8" y="48" font-size="7.2" fill="#475569">Context Buffer Bound: S_read ≤ 4,096 tokens</text>
      <text x="8" y="62" font-size="7.2" fill="#475569">Per-token KV memory: 128 KiB/token (32 layers, GQA-8)</text>
      <rect x="8" y="74" width="244" height="30" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="130" y="87" font-size="6.8" font-weight="700" fill="#92400e" text-anchor="middle">Transient Sequence Lifespan</text>
      <text x="130" y="98" font-size="6.5" fill="#78350f" text-anchor="middle">KV blocks deallocated immediately upon JSON emit</text>
    </g>

    <!-- Sub-box 3: Grammar-Constrained Engine -->
    <g transform="translate(10, 274)">
      <rect width="260" height="136" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <rect width="260" height="20" rx="3" fill="#ccfbf1"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#0f766e">Grammar-Constrained Logit Engine</text>
      <text x="8" y="34" font-size="7.2" fill="#475569">Deterministic JSON Schema decoding via CFG:</text>
      <rect x="8" y="42" width="244" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="55" font-family="monospace" font-size="6.8" fill="#0f766e">{ "is_bug": bool, "summary": str, "code": int }</text>
      <text x="12" y="68" font-family="monospace" font-size="6.5" fill="#7f1d1d">Logit mask: Non-conforming token logits → -∞</text>
      <text x="12" y="78" font-size="6.5" fill="#166534">Adversarial payload tokens syntactically blocked</text>
      <rect x="8" y="90" width="244" height="36" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="130" y="103" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle">Schema-Pure JSON Extraction</text>
      <text x="130" y="116" font-size="6.5" fill="#166534" text-anchor="middle">Emits typed data record D_extracted (150 tokens)</text>
    </g>
  </g>

  <!-- ======================================================================= -->
  <!-- PANEL 2: HOST SUPERVISOR & MEDIATION (CENTER: x=328 to 632, w=304)      -->
  <!-- ======================================================================= -->
  <g transform="translate(328, 20)">
    <rect width="304" height="420" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="304" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="14" y="19" font-size="8.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">HOST SUPERVISOR &amp; MEDIATION BUS</text>
    <text x="290" y="19" font-size="7" font-weight="700" fill="#475569" text-anchor="end">Host OS / Kernel</text>

    <!-- Sub-box 1: Zero-Copy Blob Escrow -->
    <g transform="translate(10, 36)">
      <rect width="284" height="110" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <rect width="284" height="20" rx="3" fill="#ccfbf1"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#0f766e">Zero-Copy Host Memory Blob Escrow</text>
      <text x="8" y="34" font-size="7.2" fill="#475569">Raw observation staged in host RAM outside GPU HBM</text>
      <text x="8" y="48" font-family="monospace" font-size="7" fill="#0f766e">Handle: $blob_8f9a2c (SHA-256: 7f83b165...)</text>
      <text x="8" y="62" font-size="7.2" fill="#475569">Bypasses privileged model context entirely</text>
      <rect x="8" y="70" width="268" height="32" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="142" y="83" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle">Opaque Handle Resolution</text>
      <text x="142" y="95" font-size="6.5" fill="#166534" text-anchor="middle">Expanded only inside isolated microVM sandboxes</text>
    </g>

    <!-- Sub-box 2: Reference Monitor & Taint -->
    <g transform="translate(10, 154)">
      <rect width="284" height="112" rx="3" fill="#ffffff" stroke="#92400e" stroke-width="1.2"/>
      <rect width="284" height="20" rx="3" fill="#fef3c7"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#92400e">Dynamic Taint &amp; Complete Mediation Gate</text>
      <text x="8" y="34" font-size="7.2" fill="#334155">Evaluates tool proposal before system dispatch:</text>
      <text x="14" y="48" font-family="monospace" font-size="6.8" fill="#166534">T_read (read_file, search): ALLOW (Any Taint)</text>
      <text x="14" y="60" font-family="monospace" font-size="6.8" fill="#92400e">T_mutate (/scratch): ALLOW IF target ⊑ /scratch</text>
      <text x="14" y="72" font-family="monospace" font-size="6.8" fill="#991b1b">T_sink (curl, email, drop_db): INTERCEPT IF τ=1</text>
      <rect x="8" y="80" width="268" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="142" y="95" font-size="6.8" font-weight="700" fill="#991b1b" text-anchor="middle">Taint Check: Intercepts unauthorized exfiltration</text>
    </g>

    <!-- Sub-box 3: Capability Verifier & JIT Vault -->
    <g transform="translate(10, 274)">
      <rect width="284" height="136" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
      <rect width="284" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#1e293b">HMAC Capability Gate &amp; JIT Credential Broker</text>
      <text x="8" y="34" font-size="7.2" fill="#334155">Verifies signed capability token descriptor:</text>
      <text x="14" y="48" font-family="monospace" font-size="6.8" fill="#0f766e">C = ⟨ToolID, Scope, τ_expire, σ_host⟩</text>
      <text x="14" y="60" font-family="monospace" font-size="6.8" fill="#475569">σ_host = HMAC-SHA256(K_sup, ToolID ∥ Scope ∥ τ_exp)</text>
      <text x="8" y="74" font-size="7" fill="#475569">JIT Down-Scoped OAuth Tokens (RFC 8693):</text>
      <text x="8" y="86" font-size="7" fill="#475569">• Ephemeral micro-TTL (30s) • Target-bound URI scope</text>
      <rect x="8" y="96" width="268" height="30" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="142" y="109" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle">Zero Ambient Credentials in Sandbox</text>
      <text x="142" y="120" font-size="6.5" fill="#166534" text-anchor="middle">Injected directly into TLS transport layer at host</text>
    </g>
  </g>

