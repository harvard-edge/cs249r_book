  <path d="M 304 340 L 316 340 L 316 110 L 328 110" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <rect x="290" y="215" width="48" height="16" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="0.8"/>
  <text x="314" y="226" font-size="6.2" font-weight="700" fill="#0f766e" text-anchor="middle">JSON AST</text>

  <!-- Host to Node B: Sanitized Context + Opaque Handle -->
  <line x1="632" y1="90" x2="656" y2="90" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <rect x="633" y="72" width="22" height="14" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="0.8"/>
  <text x="644" y="82" font-size="6" font-weight="700" fill="#0f766e" text-anchor="middle">$ref</text>

  <!-- Node B to Host: Tool Proposal with Opaque Handle -->
  <line x1="656" y1="340" x2="632" y2="340" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-navy)"/>
  <rect x="633" y="324" width="22" height="14" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="0.8"/>
  <text x="644" y="334" font-size="6" font-weight="700" fill="#1e293b" text-anchor="middle">a_t</text>

  <!-- Host to Sandbox: Dispatched Execution -->
  <line x1="480" y1="410" x2="480" y2="442" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <rect x="420" y="442" width="120" height="16" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="480" y="453" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle">MicroVM Execution Sandbox</text>
