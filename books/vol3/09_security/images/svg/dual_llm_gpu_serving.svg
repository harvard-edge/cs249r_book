    <text x="266" y="19" font-size="7" font-weight="700" fill="#0f766e" text-anchor="end">GPU Pool B (70B)</text>

    <!-- Sub-box 1: Pristine HBM KV-Cache -->
    <g transform="translate(10, 36)">
      <rect width="260" height="110" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <rect width="260" height="20" rx="3" fill="#ccfbf1"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#0f766e">Pristine Privileged KV-Cache</text>
      <text x="8" y="34" font-size="7.2" fill="#166534">• System Prompt: Developer safety invariants (S)</text>
      <text x="8" y="48" font-size="7.2" fill="#166534">• User Goal: Authenticated operational intent</text>
      <text x="8" y="62" font-size="7.2" fill="#166534">• Sanitized AST: Clean JSON record from π_read</text>
      <text x="8" y="76" font-size="7.2" fill="#166534">• Opaque Pointer: $blob_8f9a2c (no raw tokens)</text>
      <rect x="8" y="84" width="244" height="20" rx="2" fill="#f0fdf4"/>
      <text x="130" y="97" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle">Zero Untrusted Tokens: Attentional Bypass Blocked</text>
    </g>

    <!-- Sub-box 2: 56.5% KV-Cache Memory Savings -->
    <g transform="translate(10, 154)">
      <rect width="260" height="112" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <rect width="260" height="20" rx="3" fill="#ccfbf1"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#0f766e">56.5% Privileged KV Memory Savings</text>
      <text x="8" y="34" font-size="7.2" fill="#334155">Single-Model Baseline (10,000 tokens):</text>
      <text x="14" y="46" font-size="7" fill="#475569">M_single = 10,000 × 320 KiB = 3.20 GB HBM / seq</text>
      <text x="8" y="60" font-size="7.2" fill="#0f766e">Dual-Serving Coordinator (4,350 tokens):</text>
      <text x="14" y="72" font-size="7" fill="#0f766e">M_dual = 4,350 × 320 KiB = 1.39 GB HBM / seq</text>
      <rect x="8" y="80" width="244" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="130" y="96" font-size="7" font-weight="700" fill="#166534" text-anchor="middle">ΔM_priv = 1 - (1.39 / 3.20) = 56.5% Memory Savings</text>
    </g>

    <!-- Sub-box 3: Action Proposal Formulation -->
    <g transform="translate(10, 274)">
      <rect width="260" height="136" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="260" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="7.8" font-weight="700" fill="#1e293b">Tool Action Formulation via Opaque Handles</text>
      <text x="8" y="34" font-size="7" fill="#475569">Planner generates proposal referencing handles:</text>
      <rect x="8" y="40" width="244" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="54" font-family="monospace" font-size="6.8" fill="#1e293b">run_shell(cmd="git apply $blob_8f9a2c")</text>
      <text x="12" y="66" font-family="monospace" font-size="6.8" fill="#1e293b">capability: C_git_apply</text>
      <text x="12" y="76" font-size="6.5" fill="#475569"># Raw patch tokens never parsed by 70B attention</text>
      <rect x="8" y="88" width="244" height="38" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="130" y="102" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle">High-Fidelity Action Generation</text>
      <text x="130" y="116" font-size="6.5" fill="#166534" text-anchor="middle">Steering attack collapsed • ASRR &gt; 97.2%</text>
    </g>
  </g>

