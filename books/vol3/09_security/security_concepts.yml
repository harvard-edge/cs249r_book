    concepts:
    - id: vol3.injection
      label: Prompt injection
      teaches: Structural prompt injection
      summary: Untrusted task material attempts to redirect a model-controlled workflow across an instruction
        or authority boundary.
      section: sec-vol3-security-injection-entry-points
    - id: vol3.flow
      label: Information-flow policy
