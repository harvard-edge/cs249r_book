      section: sec-vol3-security-action-bound-approval
    relationships:
    - id: vol3.field.injection.observation
      source: vol3.injection
      predicate: arrives through
      target: vol3.observation
      explanation: Untrusted source content can influence later model behavior through returned tool material.
      conditions: This connection is specifically indirect injection; its success depends on crossing a
        declared policy boundary.
      status: draft
      evidence:
        section: sec-vol3-security-injection-entry-points
        quote: '***Indirect prompt injection***\index{Indirect prompt injection!definition} is prompt injection
          delivered through an observation (a retrieved document, repository file, search result, email,
          or tool response) that the agent reads while performing a task for someone else [@greshake2023not].'
    - id: vol3.field.flow.working-context
      source: vol3.flow
      predicate: tracks origins through
      target: vol3.working-context
      explanation: Source integrity and confidentiality survive transformations rather than becoming trusted
        because text was summarized.
      conditions: Policy precision depends on the granularity and completeness of propagated labels.
      status: draft
      evidence:
        section: sec-vol3-security-label-propagation
        quote: 'Model-generated transformations require a coarser policy, because neither the generated
          explanation nor attention weights yield a trustworthy semantic dependency graph. A conservative
          policy treats a model output as potentially dependent on all the selected inputs available to
          that invocation and carries their integrity provenance and confidentiality restrictions into the
          derived record and subsequent proposal. It is a declared over-approximation: it assumes every
          input may have influenced every output token, and it proves no noninterference[^fn-noninterference-goguen-meseguer]
          property for the whole system.'
    - id: vol3.field.approval.proposal
      source: vol3.approval
      predicate: narrows authority for
      target: vol3.proposal
      explanation: Approval applies to one resolved action and relevant state rather than all later outputs
        from the model.
      conditions: Expired, changed, or substituted arguments require renewed checks at dispatch.
      status: draft
      evidence:
        section: sec-vol3-security-action-bound-approval
        quote: 'When a high-consequence mutation requires human sign-off before execution, asking an operator
          to approve the agent''s high-level summary decouples the approval from the action: a prompt injection
          can lead the model to pair a benign explanation ("Updating dependencies") with a destructive tool
          invocation. To prevent this decoupling, an **action-bound approval**\index{Action-bound approval!definition}
          cryptographically binds human authorization to the exact, canonical payload that the runtime will
          dispatch, rather than to the model''s natural-language claims about the action.'
    - id: vol3.field.flow.egress
      source: vol3.flow
      predicate: constrains permitted
      target: vol3.egress
      explanation: A permitted outbound tool can still leak protected data unless operation and recipient
        policy consider its source labels.
      conditions: Destination allowlists alone do not establish permission to disclose particular content.
      status: draft
      evidence:
        section: sec-vol3-security-operation-mediation
        quote: 'A tool named `read` or `search` is not exempt from mediation: a local read can pull protected
          data into model context, and an external search transmits its query string to a remote server
          even if it mutates no remote record. The reference monitor\index{Reference monitor!information-flow
          checks} therefore applies integrity and confidentiality checks before every dispatch, alongside
          the structure, permission, and state checks from @sec-vol3-tool-calling-boundary-checks, identifying
          the actual operation, resolved resources, recipients, and data that the call will expose.'
    maps: []
