concept_map:
  schema_version: 2
  source: 09_security.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Structural prompt injection
    - Callable is not permitted
    - Information-flow labels
    - Quarantined readers
    - Effective permission intersection
    - Action-bound approval
    - Multi-turn policy continuity
    - Security outcome measurement
  secondary_concepts:
    - Lethal trifecta
    - Prefix-cache timing channel
    - Detection vs separation
  claims:
    Structural prompt injection: Instructions, tool definitions, the request, and every observation are serialized
      into one token sequence in which no position carries enforced privilege, so injection is structural and exposure
      grows with every untrusted read.
    Callable is not permitted: Injection turns the runtime into a confused deputy with a legitimate identity, so
      authorization must judge this request within this task, not the function name, argument types, or endpoint
      allowlist.
    Information-flow labels: Confidentiality and integrity provenance vary independently, so the host attaches both
      to every record, propagates them by the lattice join, and checks release and evidence before dispatch.
    Quarantined readers: A quarantined reader keeps raw untrusted text out of the planner and typed handles keep
      untrusted bytes out of context, but a schema-valid field is still an untrusted claim, not evidence.
    Effective permission intersection: When an agent acts for a requester, effective permission is the intersection
      of requester rights, service principal, task grant, and issuer and receiver policy, with identities taken
      from the runtime's task record, never from prompt text.
    Action-bound approval: Human approval binds to a digest of the canonical, host-resolved action, is presented
      out of band with the agent's explanation labeled untrusted, and is re-verified with its preconditions immediately
      before dispatch.
    Multi-turn policy continuity: Over a trajectory an attacker gains an adaptation oracle and conversational momentum,
      so every dispatch is re-evaluated against policy and an obfuscated retry after a block is still the blocked
      action.
    Security outcome measurement: A defense is evaluated by system effects at the protected sink on whole eligible
      episodes, not by model text, and its overhead is priced in cost per accepted task.
    Lethal trifecta: An agent that combines access to private data, exposure to untrusted content, and an external
      communication channel can be steered to exfiltrate, and removing any one leg breaks the attack path.
    Prefix-cache timing channel: A prefix cache shared across security domains leaks through time to first token
      whether another caller processed identical text, so sharing domains must bound cache reuse.
    Detection vs separation: Detection only lowers the rate at which payloads get through, whereas separation by
      construction bounds what any payload can reach, detected or not.
