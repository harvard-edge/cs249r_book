<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="615" rx="4" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .stage-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.35; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #0f172a; }
    .code-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #2563eb; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #059669; font-weight: 600; }
    .code-purple { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #7c3aed; font-weight: 600; }
    .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #d97706; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #1e293b; }
  </style>

  <!-- ==================== TOP TIER: STAGES 1, 2, 3 ==================== -->

  <!-- Stage 1: Task Dispatch & Ingestion -->
  <g transform="translate(15, 15)">
    <rect class="stage-card" x="0" y="0" width="230" height="260"/>
    <rect class="header-box" x="10" y="10" width="210" height="38" fill="#e2e8f0"/>
    <text class="title-text" x="18" y="28">Task Dispatch</text>
    <text class="subtitle-text" x="18" y="42">Prompt &amp; Test Fixtures</text>

    <!-- Task Prompt D_q -->
    <g transform="translate(10, 56)">
      <rect class="inner-box" x="0" y="0" width="210" height="62"/>
      <text class="dim-label" x="10" y="16">TASK PROMPT QUEUE</text>
      <text class="code-text" x="10" y="32">q ~ D_tasks (SWE-bench)</text>
      <text class="body-text" x="10" y="46" font-size="8.5px">Repo issue, workspace tree,</text>
      <text class="body-text" x="10" y="56" font-size="8.5px">and tool API contracts.</text>
    </g>

    <!-- Test Harness Fixture -->
    <g transform="translate(10, 124)">
      <rect class="inner-box" x="0" y="0" width="210" height="62"/>
      <text class="dim-label" x="10" y="16">TEST HARNESS SPEC</text>
      <text class="code-text" x="10" y="32">tests/test_spec.py</text>
      <text class="body-text" x="10" y="46" font-size="8.5px">Deterministic test assertions</text>
      <text class="body-text" x="10" y="56" font-size="8.5px">and execution timeouts.</text>
    </g>

    <!-- Sharded Dispatch -->
    <g transform="translate(10, 192)">
      <rect class="inner-box" x="0" y="0" width="210" height="56"/>
      <text class="dim-label" x="10" y="16">DISPATCH ENGINE</text>
      <text class="body-text" x="10" y="32" font-size="8.5px">Non-blocking prompt queue;</text>
      <text class="body-text" x="10" y="44" font-size="8.5px">load balances rollout nodes.</text>
    </g>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <g transform="translate(250, 135)">
    <path d="M 0 0 L 48 0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text class="dim-label" x="24" y="-8" text-anchor="middle" font-size="8.5px">Prompt q</text>
  </g>

  <!-- Stage 2: Rollout Inference Fleet (vLLM / SGLang) -->
  <g transform="translate(305, 15)">
    <rect class="stage-card" x="0" y="0" width="475" height="260"/>
    <rect class="header-box" x="10" y="10" width="455" height="38" fill="#dbeafe"/>
    <text class="title-text" x="18" y="28">Rollout Inference Fleet (vLLM / SGLang)</text>
    <text class="subtitle-text" x="18" y="42">Throughput-Optimized Serving with Radix-Tree KV Sharing</text>

    <!-- Prefill Pass & Radix Tree -->
    <g transform="translate(10, 56)">
      <rect class="inner-box" x="0" y="0" width="455" height="74"/>
      <text class="dim-label" x="12" y="16">RADIX-TREE PREFIX KV-CACHE (AMORTIZED PREFILL)</text>
      <rect x="12" y="24" width="431" height="42" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text class="code-blue" x="16" y="40">Pinned Prompt Prefix KV Block (Refcount = G)</text>
      <text class="body-text" x="16" y="54" font-size="8.5px">Prompt q evaluated once across cluster; 3.3x KV memory reduction across G streams.</text>
    </g>

    <!-- Parallel Decode Streams -->
    <g transform="translate(10, 138)">
      <rect class="inner-box" x="0" y="0" width="455" height="110"/>
      <text class="dim-label" x="12" y="16">PARALLEL DECODE STREAMS (G CANDIDATES PER PROMPT)</text>

      <!-- Row 1: Stream 1 & Stream 2 -->
      <g transform="translate(12, 24)">
        <!-- Stream 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="210" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text class="code-text" x="10" y="17">Stream 1: τ₁ ~ π_old</text>
          <text class="dim-val" x="10" y="29" font-size="8.5px">PagedAttention Δ KV pages</text>
        </g>
        <!-- Stream 2 -->
        <g transform="translate(221, 0)">
          <rect x="0" y="0" width="210" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text class="code-text" x="10" y="17">Stream 2: τ₂ ~ π_old</text>
          <text class="dim-val" x="10" y="29" font-size="8.5px">PagedAttention Δ KV pages</text>
        </g>
      </g>

      <!-- Row 2: Stream 3 & Stream G -->
      <g transform="translate(12, 66)">
        <!-- Stream 3 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="210" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text class="code-text" x="10" y="17">Stream 3: τ₃ ~ π_old</text>
          <text class="dim-val" x="10" y="29" font-size="8.5px">PagedAttention Δ KV pages</text>
        </g>
        <!-- Stream G -->
        <g transform="translate(221, 0)">
          <rect x="0" y="0" width="210" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text class="code-text" x="10" y="17">Stream G: τ_G ~ π_old</text>
          <text class="dim-val" x="10" y="29" font-size="8.5px">PagedAttention Δ KV pages</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <g transform="translate(786, 135)">
    <path d="M 0 0 L 48 0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
    <text class="dim-label" x="24" y="-8" text-anchor="middle" font-size="8.5px">Actions a_t</text>
  </g>

  <!-- Stage 3: Out-of-Band Execution Substrate -->
  <g transform="translate(840, 15)">
    <rect class="stage-card" x="0" y="0" width="345" height="260"/>
    <rect class="header-box" x="10" y="10" width="325" height="38" fill="#fef3c7"/>
    <text class="title-text" x="18" y="28">Execution Substrate (MicroVMs)</text>
    <text class="subtitle-text" x="18" y="42">Hermetic Tool Sandbox &amp; Verification Oracles</text>

    <!-- Sandbox 1 -->
    <g transform="translate(10, 56)">
      <rect class="inner-box" x="0" y="0" width="325" height="58"/>
      <text class="code-amber" x="10" y="18">Sandbox 1: pytest -q test_suite.py</text>
      <text class="body-text" x="10" y="34" font-size="8.5px">Executes candidate action trace τ₁</text>
      <text class="code-green" x="10" y="48">Verified Return R₁ in {0, 1}</text>
    </g>

    <!-- Sandbox 2 -->
    <g transform="translate(10, 122)">
      <rect class="inner-box" x="0" y="0" width="325" height="58"/>
      <text class="code-amber" x="10" y="18">Sandbox 2: cargo test --test lock_race</text>
      <text class="body-text" x="10" y="34" font-size="8.5px">Executes candidate action trace τ₂</text>
      <text class="code-green" x="10" y="48">Verified Return R₂ in {0, 1}</text>
    </g>

    <!-- Sandbox G -->
    <g transform="translate(10, 188)">
      <rect class="inner-box" x="0" y="0" width="325" height="60"/>
      <text class="code-amber" x="10" y="18">Sandbox G: z3 / lean formal check</text>
      <text class="body-text" x="10" y="34" font-size="8.5px">Executes candidate action trace τ_G</text>
      <text class="code-green" x="10" y="48">Verified Return R_G in {0, 1}</text>
    </g>
  </g>

  <!-- Arrow Stage 3 Down -> Stage 4 -->
  <g transform="translate(1005, 275)">
    <path d="M 0 0 L 0 20" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text class="dim-label" x="8" y="12" font-size="8px">Returns R = [R₁..R_G]</text>
  </g>

  <!-- ==================== MIDDLE TIER: STAGE 4 (BROKER & ADVANTAGE) ==================== -->
  <g transform="translate(15, 298)">
    <rect class="stage-card" x="0" y="0" width="1170" height="135"/>
    <rect class="header-box" x="10" y="10" width="1150" height="34" fill="#f3e8ff"/>
    <text class="title-text" x="18" y="26">Host Trajectory Broker &amp; In-Group Advantage Normalization</text>
    <text class="subtitle-text" x="18" y="38">Zero Critic Neural Network Overhead | Asynchronous Ring Buffering</text>

    <!-- Block 4A: Advantage Math -->
    <g transform="translate(10, 50)">
      <rect class="inner-box" x="0" y="0" width="395" height="74"/>
      <text class="dim-label" x="12" y="16">IN-GROUP ADVANTAGE ESTIMATOR</text>
      <rect x="12" y="22" width="371" height="26" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <text class="code-purple" x="18" y="39" font-size="10px">A_hat_i = (R(τ_i) - μ_g) / (σ_g + ε)</text>
      <text class="body-text" x="12" y="62" font-size="8.5px">Baseline in host DRAM · no critic backward</text>
    </g>

    <!-- Block 4B: Variance Filter -->
    <g transform="translate(415, 50)">
      <rect class="inner-box" x="0" y="0" width="355" height="74"/>
      <text class="dim-label" x="12" y="16">ZERO-VARIANCE BATCH FILTER</text>
      <text class="code-text" x="12" y="32">if σ_g == 0: drop batch (all pass or fail)</text>
      <text class="body-text" x="12" y="48" font-size="8.5px">Prevents training on uninformative rollouts;</text>
      <text class="body-text" x="12" y="60" font-size="8.5px">curriculum scheduler prioritizes boundary tasks.</text>
    </g>

    <!-- Block 4C: Replay Buffer -->
    <g transform="translate(780, 50)">
      <rect class="inner-box" x="0" y="0" width="380" height="74"/>
      <text class="dim-label" x="12" y="16">CIRCULAR REPLAY QUEUE (HOST PINNED DRAM)</text>
      <text class="code-green" x="12" y="32">Decouples variable-latency microVM execution</text>
      <text class="body-text" x="12" y="48" font-size="8.5px">Stages verified trajectories &lt;q, o_i, A_hat_i&gt;;</text>
      <text class="body-text" x="12" y="60" font-size="8.5px">eliminates straggler idle bubbles on GPU training ranks.</text>
    </g>
  </g>

  <!-- Arrow Stage 4 Down -> Stage 5 -->
  <g transform="translate(590, 433)">
    <path d="M 0 0 L 0 16" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text class="dim-label" x="8" y="10" font-size="8px">Mini-Batches &lt;q, o_i, A_hat_i&gt; via RDMA</text>
  </g>

  <!-- ==================== BOTTOM TIER: STAGE 5 (TRAINING CLUSTER) ==================== -->
  <g transform="translate(15, 452)">
    <rect class="stage-card" x="0" y="0" width="1170" height="145"/>
    <rect class="header-box" x="10" y="10" width="1150" height="34" fill="#eff6ff"/>
    <text class="title-text" x="18" y="26">Distributed Policy Training Cluster (Megatron-LM / FSDP Ranks)</text>
    <text class="subtitle-text" x="18" y="38">Compute-Bound Backward GEMMs | Single All-Reduce Ring</text>

    <!-- Training Sub-blocks -->
    <g transform="translate(10, 50)">
      <!-- Left: Surrogate Loss -->
      <g transform="translate(0, 0)">
        <rect class="inner-box" x="0" y="0" width="480" height="84"/>
        <text class="dim-label" x="12" y="16">CLIPPED SURROGATE POLICY OBJECTIVE</text>
        <rect x="12" y="22" width="456" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text class="code-blue" x="18" y="39" font-size="9px">L_clip = min(r_t·A_hat_i, clip(r_t, 1-ε, 1+ε)·A_hat_i) - β·D_KL</text>
        <text class="body-text" x="12" y="62" font-size="8.5px">Executes backward passes at continuous saturation (58% MFU);</text>
        <text class="body-text" x="12" y="74" font-size="8.5px">reclaims 47.1% VRAM by removing critic optimizer state shards.</text>
      </g>

      <!-- Middle: Interconnect Ring -->
      <g transform="translate(490, 0)">
        <rect class="inner-box" x="0" y="0" width="315" height="84"/>
        <text class="dim-label" x="12" y="16">COLLECTIVE COMMUNICATION</text>
        <rect x="12" y="24" width="291" height="24" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text class="code-blue" x="157" y="39" text-anchor="middle" font-size="8.5px">Single All-Reduce Policy Ring</text>
        <text class="body-text" x="12" y="62" font-size="8.5px">Zero critic traffic; no fabric collisions.</text>
        <text class="body-text" x="12" y="74" font-size="8.5px">InfiniBand non-blocking gradient sync.</text>
      </g>

      <!-- Right: Checkpoint Broadcast -->
      <g transform="translate(815, 0)">
        <rect class="inner-box" x="0" y="0" width="335" height="84"/>
        <text class="dim-label" x="12" y="16">CHECKPOINT DISSEMINATION</text>
        <text class="code-green" x="12" y="32">Asynchronous Weight Broadcast: θ_(v+1)</text>
        <text class="body-text" x="12" y="48" font-size="8.5px">Validated checkpoints pushed to inference nodes;</text>
        <text class="body-text" x="12" y="60" font-size="8.5px">bounded staleness Δv &lt;= 2 maintains policy stability.</text>
      </g>
    </g>
  </g>
</svg>
