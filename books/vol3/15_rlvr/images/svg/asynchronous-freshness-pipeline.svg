<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 710" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1160" height="710" rx="4" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>

  <style>
    .panel-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.35; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #0f172a; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #059669; font-weight: 600; }
    .code-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #dc2626; font-weight: 600; }
    .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #b45309; font-weight: 600; }
    .code-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #2563eb; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #1e293b; }
  </style>

  <!-- ==================== TOP PANEL: (a) EXECUTION TIMELINES ==================== -->
  <g transform="translate(15, 15)">
    <rect class="panel-card" x="0" y="0" width="1130" height="280"/>
    <rect class="header-box" x="12" y="10" width="1106" height="34" fill="#e2e8f0"/>
    <text class="title-text" x="22" y="26">(a) Execution Timelines: Synchronous Lockstep vs. Asynchronous Streaming</text>
    <text class="subtitle-text" x="22" y="38">Straggler Bubble Degradation (Synchronous) vs. Bounded Staleness Saturation (Asynchronous)</text>

    <!-- Sub-panel Left: Synchronous Lockstep -->
    <g transform="translate(12, 52)">
      <rect class="inner-box" x="0" y="0" width="540" height="215"/>
      <text class="title-text" x="14" y="20" font-size="11.5px">Synchronous Lockstep Pipeline (Straggler-Bound)</text>
      <text class="subtitle-text" x="14" y="34" font-size="9px">Barrier idles trainer on slowest rollout</text>

      <!-- Trainer Track -->
      <text class="code-text" x="14" y="60" font-weight="bold">Trainer:</text>
      <rect x="85" y="48" width="75" height="20" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text class="code-text" x="122" y="61" text-anchor="middle" font-size="9px">Step v</text>

      <!-- Idle Bubble -->
      <rect x="165" y="48" width="245" height="20" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="3 2" stroke-width="1"/>
      <text class="code-red" x="287" y="61" text-anchor="middle" font-size="9px">IDLE WAITING BUBBLE</text>

      <rect x="415" y="48" width="85" height="20" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text class="code-text" x="457" y="61" text-anchor="middle" font-size="9px">Step v+1</text>

      <!-- Workers Tracks -->
      <text class="code-text" x="14" y="94" font-weight="bold">Worker 1:</text>
      <rect x="85" y="82" width="60" height="18" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text class="code-text" x="115" y="94" text-anchor="middle" font-size="8.5px">120 tokens</text>
      <rect x="150" y="82" width="260" height="18" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2 2"/>
      <text class="dim-label" x="280" y="94" text-anchor="middle">idle wait at barrier</text>

      <text class="code-text" x="14" y="122" font-weight="bold">Worker 2:</text>
      <rect x="85" y="110" width="160" height="18" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text class="code-text" x="165" y="122" text-anchor="middle" font-size="8.5px">850 tokens (tool calls)</text>
      <rect x="250" y="110" width="160" height="18" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2 2"/>
      <text class="dim-label" x="330" y="122" text-anchor="middle">idle wait</text>

      <text class="code-text" x="14" y="150" font-weight="bold">Worker G:</text>
      <rect x="85" y="138" width="325" height="18" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text class="code-amber" x="247" y="150" text-anchor="middle" font-size="8.5px">4,096 tokens (Max Horizon Straggler)</text>

      <!-- Sync Barrier Line -->
      <line x1="412" y1="44" x2="412" y2="162" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 2"/>
      <text class="code-red" x="412" y="176" text-anchor="middle" font-size="8px">Global Sync Barrier</text>

      <!-- Bottom Note -->
      <rect x="14" y="186" width="512" height="20" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text class="dim-val" x="22" y="199">Strictly on-policy (Δv = 0), but step latency T_step = max(T_exec) + T_train.</text>
    </g>

    <!-- Sub-panel Right: Asynchronous Streaming -->
    <g transform="translate(565, 52)">
      <rect class="inner-box" x="0" y="0" width="553" height="215"/>
      <text class="title-text" x="14" y="20" font-size="11.5px">Asynchronous Streaming Pipeline (Freshness-Bound)</text>
      <text class="subtitle-text" x="14" y="34" font-size="9px">Streams to replay queue · trainer saturated</text>

      <!-- Continuous Trainer Steps -->
      <text class="code-text" x="14" y="60" font-weight="bold">Trainer:</text>
      <g transform="translate(80, 48)">
        <rect x="0" y="0" width="75" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text class="code-text" x="37" y="13" text-anchor="middle" font-size="9px">Step v</text>

        <rect x="80" y="0" width="75" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text class="code-text" x="117" y="13" text-anchor="middle" font-size="9px">Step v+1</text>

        <rect x="160" y="0" width="75" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text class="code-text" x="197" y="13" text-anchor="middle" font-size="9px">Step v+2</text>

        <rect x="240" y="0" width="75" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text class="code-text" x="277" y="13" text-anchor="middle" font-size="9px">Step v+3</text>

        <rect x="320" y="0" width="75" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text class="code-text" x="357" y="13" text-anchor="middle" font-size="9px">Step v+4</text>
      </g>

      <!-- Worker 1 -->
      <text class="code-text" x="14" y="94" font-weight="bold">Worker 1:</text>
      <rect x="80" y="82" width="70" height="18" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text class="code-text" x="115" y="94" text-anchor="middle" font-size="8.5px">Gen (θ_v)</text>
      <rect x="158" y="83" width="95" height="16" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text class="code-green" x="205" y="94" text-anchor="middle" font-size="8px">Ingest Δv=1 (OK)</text>
      <path d="M 255 91 L 285 91 L 285 70" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>

      <!-- Worker 2 -->
      <text class="code-text" x="14" y="122" font-weight="bold">Worker 2:</text>
      <rect x="80" y="110" width="145" height="18" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text class="code-text" x="152" y="122" text-anchor="middle" font-size="8.5px">Gen (θ_v, 850t)</text>
      <rect x="233" y="111" width="95" height="16" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text class="code-green" x="280" y="122" text-anchor="middle" font-size="8px">Ingest Δv=2 (OK)</text>
      <path d="M 330 119 L 365 119 L 365 70" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>

      <!-- Worker G -->
      <text class="code-text" x="14" y="150" font-weight="bold">Worker G:</text>
      <rect x="80" y="138" width="280" height="18" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text class="code-red" x="220" y="150" text-anchor="middle" font-size="8.5px">Gen (θ_v, 4096t)</text>
      <rect x="368" y="139" width="145" height="16" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text class="code-red" x="440" y="150" text-anchor="middle" font-size="8px">Δv = 4 &gt; Δv_max (Quarantine)</text>
      <path d="M 445 138 L 445 70" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-rose)"/>

      <!-- Bottom Note -->
      <rect x="14" y="186" width="525" height="20" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text class="dim-val" x="22" y="199">Trainer stays busy; off-policy drift bounded by Δv_max threshold.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM PANEL: (b) HOST-MANAGED REPLAY ARCHITECTURE ==================== -->
  <g transform="translate(15, 310)">
    <rect class="panel-card" x="0" y="0" width="1130" height="380"/>
    <rect class="header-box" x="12" y="10" width="1106" height="34" fill="#eff6ff"/>
    <text class="title-text" x="22" y="26">(b) Host-Managed Replay Architecture &amp; Admission Gating Protocol</text>
    <text class="subtitle-text" x="22" y="38">Ingestion · freshness filter · release gating</text>

    <!-- Block 1: Rollout Fleet -->
    <g transform="translate(12, 52)">
      <rect class="inner-box" x="0" y="0" width="240" height="270"/>
      <rect class="header-box" x="8" y="8" width="224" height="26" fill="#f1f5f9"/>
      <text class="title-text" x="16" y="24" font-size="11px">Rollout Inference Fleet</text>

      <text class="dim-label" x="12" y="48">DISAGGREGATED WORKERS</text>
      <text class="code-text" x="12" y="62">Inference servers</text>

      <!-- Worker Pods -->
      <rect x="10" y="74" width="220" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-blue" x="18" y="90">Worker Pods 1..M</text>
      <text class="dim-val" x="18" y="104">Weights: θ_rollout [Version v]</text>
      <text class="dim-val" x="18" y="116">Shared prompt prefix cached</text>

      <!-- Sandbox Enclave -->
      <rect x="10" y="134" width="220" height="54" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-amber" x="18" y="150">MicroVM Enclave</text>
      <text class="dim-val" x="18" y="164">Hermetic sandbox test oracles</text>
      <text class="code-green" x="18" y="177">Return R in {0, 1}</text>

      <!-- Trajectory Envelope -->
      <rect x="10" y="196" width="220" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="title-text" x="18" y="212" font-size="10px">Trajectory Envelope</text>
      <text class="code-text" x="18" y="226" font-size="8.5px">&lt;UUID, v_rollout, logprobs&gt;</text>
      <text class="dim-val" x="18" y="240">Actions, States, Verifier Result</text>
    </g>

    <!-- Arrow Col 1 -> Col 2 -->
    <g transform="translate(254, 185)">
      <path d="M 0 0 L 26 0" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <text class="dim-label" x="13" y="-8" text-anchor="middle" font-size="8px">stream</text>
    </g>

    <!-- Block 2: Circular Replay Buffer -->
    <g transform="translate(282, 52)">
      <rect class="inner-box" x="0" y="0" width="250" height="270"/>
      <rect class="header-box" x="8" y="8" width="234" height="26" fill="#f1f5f9"/>
      <text class="title-text" x="16" y="24" font-size="11px">Circular Replay Buffer</text>

      <text class="dim-label" x="12" y="48">BOUNDED HOST-MEMORY QUEUE</text>
      <text class="code-text" x="12" y="62">Asynchronous FIFO Stage</text>

      <!-- Slots -->
      <g transform="translate(10, 74)">
        <rect x="0" y="0" width="230" height="24" rx="2" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
        <text class="code-text" x="8" y="15" font-size="8.5px">Slot 0: τ_101 [v_rollout = 48]</text>

        <rect x="0" y="28" width="230" height="24" rx="2" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
        <text class="code-text" x="8" y="43" font-size="8.5px">Slot 1: τ_102 [v_rollout = 49]</text>

        <rect x="0" y="56" width="230" height="24" rx="2" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
        <text class="code-text" x="8" y="71" font-size="8.5px">Slot 2: τ_103 [v_rollout = 49]</text>

        <rect x="0" y="84" width="230" height="24" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="code-red" x="8" y="99" font-size="8.5px">Slot 3: τ_104 [v_r = 46] (STALE)</text>

        <rect x="0" y="112" width="230" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2 2"/>
        <text class="dim-label" x="8" y="127">Slot 4..K: In-flight / Writing</text>
      </g>

      <rect x="10" y="218" width="230" height="40" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text class="code-text" x="18" y="233" font-size="8.5px">Capacity: set by Δv_max</text>
      <text class="dim-val" x="18" y="246">Fixed-size queue in host memory</text>
    </g>

    <!-- Arrow Col 2 -> Col 3 -->
    <g transform="translate(534, 185)">
      <path d="M 0 0 L 26 0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
      <text class="dim-label" x="13" y="-8" text-anchor="middle" font-size="8px">FIFO</text>
    </g>

    <!-- Block 3: Freshness Admission Gate -->
    <g transform="translate(562, 52)">
      <rect class="inner-box" x="0" y="0" width="260" height="270"/>
      <rect class="header-box" x="8" y="8" width="244" height="26" fill="#f1f5f9"/>
      <text class="title-text" x="16" y="24" font-size="11px">Freshness Admission Gate</text>

      <text class="dim-label" x="12" y="46">STALENESS COMPUTATION</text>
      <rect x="10" y="52" width="240" height="26" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text class="code-blue" x="120" y="68" text-anchor="middle">Δv = v_trainer - v_rollout</text>

      <text class="dim-label" x="12" y="92">ADMISSION INVARIANT</text>
      <rect x="10" y="98" width="240" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="16" y="112" font-size="8.5px">Admit(τ) = TRUE  if Δv &lt;= Δv_max</text>
      <text class="code-text" x="16" y="126" font-size="8.5px">Admit(τ) = FALSE if Δv &gt; Δv_max</text>

      <!-- Out-paths -->
      <path d="M 130 138 L 130 152" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
      <rect x="10" y="154" width="240" height="42" rx="2" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text class="code-green" x="16" y="170">PASS: Δv &lt;= 2 (Admitted)</text>
      <text class="dim-val" x="16" y="184">Forward to Truncated Importance Sampling</text>

      <path d="M 130 198 L 130 210" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-rose)"/>
      <rect x="10" y="212" width="240" height="46" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
      <text class="code-red" x="16" y="228">FAIL: Δv &gt; 2 (Quarantined)</text>
      <text class="dim-val" x="16" y="242">Recycle buffer slot; discard trajectory</text>
    </g>

    <!-- Arrow Col 3 -> Col 4 -->
    <g transform="translate(824, 185)">
      <path d="M 0 0 L 26 0" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>
      <text class="dim-label" x="13" y="-8" text-anchor="middle" font-size="8px" fill="#059669">Admit</text>
    </g>

    <!-- Block 4: Policy Training Engine -->
    <g transform="translate(852, 52)">
      <rect class="inner-box" x="0" y="0" width="266" height="270"/>
      <rect class="header-box" x="8" y="8" width="250" height="26" fill="#f1f5f9"/>
      <text class="title-text" x="16" y="24" font-size="11px">Policy Training Engine</text>

      <text class="dim-label" x="12" y="46">TRUNCATED IMPORTANCE RATIO</text>
      <rect x="10" y="52" width="246" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="16" y="66" font-size="8px">ρ_t = min(ρ_bar, π_train / π_rollout)</text>
      <text class="dim-val" x="16" y="78">Bounds gradient variance from policy lag</text>

      <text class="dim-label" x="12" y="98">GRPO POLICY UPDATE</text>
      <rect x="10" y="104" width="246" height="46" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text class="code-blue" x="16" y="118" font-size="8.5px">g_hat = E[ ∇_θ log π_θ · A_hat_i ]</text>
      <text class="dim-val" x="16" y="132">Active counter: v_trainer++</text>
      <text class="dim-val" x="16" y="143">Gradient step on admitted batch</text>

      <text class="dim-label" x="12" y="162">POLICY RELEASE GATE</text>
      <rect x="10" y="168" width="246" height="40" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="16" y="182" font-size="8px">Held-out release gate</text>
      <text class="code-green" x="16" y="196" font-size="8px">Pass: promote θ_(v+1) to rollout fleet</text>

      <rect x="10" y="214" width="246" height="44" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text class="code-green" x="16" y="230">Asynchronous Weight Broadcast</text>
      <text class="dim-val" x="16" y="244">Pushes θ_(v+1) weights across broadcast tree</text>
    </g>

    <!-- Global Feedback Loop from Weight Broadcast to Rollout Fleet -->
    <path d="M 985 330 L 985 354 L 132 354 L 132 324" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-emerald)"/>
    <rect x="360" y="344" width="395" height="18" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text class="code-green" x="557" y="356" text-anchor="middle" font-size="8.5px">Asynchronous Weight Dissemination Bus (θ_v → θ_v+1 update)</text>
  </g>
</svg>