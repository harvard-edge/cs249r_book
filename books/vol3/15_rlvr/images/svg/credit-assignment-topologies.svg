<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="560" rx="4" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .panel-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .node-base { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
    .node-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .node-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
    .node-purple { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; line-height: 1.4; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
    .code-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #dc2626; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #059669; font-weight: 600; }
    .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #d97706; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #1e293b; }
    .node-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #0f172a; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; }
  </style>

  <!-- ==================== PANEL A: OUTCOME REWARD MODEL (ORM) ==================== -->
  <g transform="translate(15, 15)">
    <rect class="panel-card" x="0" y="0" width="375" height="530"/>
    <rect class="header-box" x="12" y="12" width="351" height="42" fill="#fee2e2"/>
    <text class="title-text" x="22" y="32">Outcome Reward Model (ORM)</text>
    <text class="subtitle-text" x="22" y="47">Sparse Terminal Backup: G_t = γ^(T-t) · R(s_T)</text>

    <!-- Tree Diagram Area -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="351" height="270"/>

      <!-- Level lines and labels on the right -->
      <line x1="15" y1="35" x2="335" y2="35" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="95" x2="335" y2="95" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="155" x2="335" y2="155" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="215" x2="335" y2="215" stroke="#f1f5f9" stroke-dasharray="2 2"/>

      <!-- Tree Nodes and Edges -->
      <!-- s0 -->
      <circle class="node-purple" cx="125" cy="35" r="14"/>
      <text class="node-label" x="125" y="35">s₀</text>

      <!-- Edge s0 -> s1 -->
      <path d="M 125 49 L 125 81" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-slate)"/>
      <text class="edge-label" x="135" y="65">a₀: Inspect logs (Sound)</text>

      <!-- s1 -->
      <circle class="node-green" cx="125" cy="95" r="14"/>
      <text class="node-label" x="125" y="95">s₁</text>

      <!-- Edge s1 -> s2 -->
      <path d="M 125 109 L 125 141" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
      <text class="edge-label" x="135" y="125" fill="#dc2626">a₁: Mutex bug introduced</text>

      <!-- s2 -->
      <circle class="node-red" cx="125" cy="155" r="14"/>
      <text class="node-label" x="125" y="155">s₂</text>

      <!-- Edge s2 -> sT -->
      <path d="M 125 169 L 125 201" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arr-slate)"/>
      <text class="edge-label" x="135" y="185">... intermediate steps</text>

      <!-- sT -->
      <circle class="node-red" cx="125" cy="215" r="14"/>
      <text class="node-label" x="125" y="215">s_T</text>

      <!-- Terminal Oracle evaluation -->
      <rect x="175" y="200" width="160" height="30" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text class="code-red" x="183" y="218">Oracle: R(s_T) = 0</text>

      <!-- Backward credit backup path -->
      <path d="M 108 215 C 65 175 65 75 108 38" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
      <rect x="20" y="112" width="80" height="26" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text class="code-red" x="25" y="124" font-size="8.5px">Uniform</text>
      <text class="code-red" x="25" y="134" font-size="8.5px">Backup</text>

      <!-- Annotation box inside tree -->
      <rect x="15" y="238" width="321" height="24" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text class="body-text" x="22" y="254" font-size="9px" fill="#991b1b">Sound a₀ penalized like bug a₁</text>
    </g>

    <!-- Operational Metrics Block -->
    <g transform="translate(12, 348)">
      <rect class="inner-box" x="0" y="0" width="351" height="170"/>
      <text class="dim-label" x="14" y="18">SYSTEMS TRADEOFF ANALYSIS</text>

      <text class="dim-label" x="14" y="38">Credit Target:</text>
      <text class="dim-val" x="125" y="38">Terminal state s_T only</text>

      <text class="dim-label" x="14" y="58">Gradient Variance:</text>
      <text class="code-red" x="125" y="58">Severe: O(T) horizon scaling</text>

      <text class="dim-label" x="14" y="78">Sample Efficiency:</text>
      <text class="dim-val" x="125" y="78">Low (sparse binary feedback)</text>

      <text class="dim-label" x="14" y="98">Verifier Gaming:</text>
      <text class="code-green" x="125" y="98">Bounded by test coverage</text>

      <text class="dim-label" x="14" y="118">Compute Cost:</text>
      <text class="dim-val" x="125" y="118">Baseline: 1 verifier pass per rollout</text>

      <line x1="14" y1="128" x2="337" y2="128" stroke="#f1f5f9" stroke-width="1"/>
    </g>
  </g>

  <!-- ==================== PANEL B: PROCESS REWARD MODEL (PRM) ==================== -->
  <g transform="translate(410, 15)">
    <rect class="panel-card" x="0" y="0" width="375" height="530"/>
    <rect class="header-box" x="12" y="12" width="351" height="42" fill="#fef3c7"/>
    <text class="title-text" x="22" y="32">Process Reward Model (PRM)</text>
    <text class="subtitle-text" x="22" y="47">Dense Step-Level Scoring: r_t = M_PRM(s_t, a_t)</text>

    <!-- Tree Diagram Area -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="351" height="270"/>

      <line x1="15" y1="35" x2="335" y2="35" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="95" x2="335" y2="95" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="155" x2="335" y2="155" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="215" x2="335" y2="215" stroke="#f1f5f9" stroke-dasharray="2 2"/>

      <!-- s0 -->
      <circle class="node-purple" cx="125" cy="35" r="14"/>
      <text class="node-label" x="125" y="35">s₀</text>

      <!-- Edge s0 -> s1 -->
      <path d="M 125 49 L 125 81" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
      <rect x="145" y="54" width="190" height="24" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text class="code-green" x="152" y="70" font-size="9.5px">r₀ = +1.0 (Valid analysis)</text>

      <!-- s1 -->
      <circle class="node-green" cx="125" cy="95" r="14"/>
      <text class="node-label" x="125" y="95">s₁</text>

      <!-- Edge s1 -> s2 -->
      <path d="M 125 109 L 125 141" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
      <rect x="145" y="114" width="190" height="24" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text class="code-amber" x="152" y="130" font-size="9.5px">r₁ = +0.8 (Sycophantic prose)</text>

      <!-- s2 -->
      <circle class="node-base" cx="125" cy="155" r="14"/>
      <text class="node-label" x="125" y="155">s₂</text>

      <!-- Edge s2 -> sT -->
      <path d="M 125 169 L 125 201" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arr-slate)"/>
      <text class="edge-label" x="135" y="185">... intermediate steps</text>

      <!-- sT -->
      <circle class="node-red" cx="125" cy="215" r="14"/>
      <text class="node-label" x="125" y="215">s_T</text>

      <rect x="175" y="200" width="160" height="30" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text class="code-red" x="183" y="218">Terminal Fail (R=0)</text>

      <!-- Step-level return annotation -->
      <path d="M 108 95 C 90 95 80 80 80 65 C 80 50 90 35 108 35" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text class="dim-label" x="42" y="68" font-size="8.5px" fill="#059669">Step Credit</text>

      <!-- Annotation box inside tree -->
      <rect x="15" y="238" width="321" height="24" rx="3" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
      <text class="body-text" x="22" y="254" font-size="9.5px" fill="#92400e">Vulnerability: Neural PRM fooled by conversational padding.</text>
    </g>

    <!-- Operational Metrics Block -->
    <g transform="translate(12, 348)">
      <rect class="inner-box" x="0" y="0" width="351" height="170"/>
      <text class="dim-label" x="14" y="18">SYSTEMS TRADEOFF ANALYSIS</text>

      <text class="dim-label" x="14" y="38">Credit Target:</text>
      <text class="dim-val" x="125" y="38">Discrete transition (s_t, a_t)</text>

      <text class="dim-label" x="14" y="58">Gradient Variance:</text>
      <text class="code-green" x="125" y="58">Low: O(1) step feedback</text>

      <text class="dim-label" x="14" y="78">Sample Efficiency:</text>
      <text class="dim-val" x="125" y="78">High (dense step supervision)</text>

      <text class="dim-label" x="14" y="98">Verifier Gaming:</text>
      <text class="code-red" x="125" y="98">Critical (Goodhart proxy hacking)</text>

      <text class="dim-label" x="14" y="118">Compute Cost:</text>
      <text class="dim-val" x="125" y="118">Moderate: O(T) neural verifier passes</text>

      <line x1="14" y1="128" x2="337" y2="128" stroke="#f1f5f9" stroke-width="1"/>
    </g>
  </g>

  <!-- ==================== PANEL C: MONTE CARLO SUB-TREE ROLLOUTS (MCR) ==================== -->
  <g transform="translate(805, 15)">
    <rect class="panel-card" x="0" y="0" width="380" height="530"/>
    <rect class="header-box" x="12" y="12" width="356" height="42" fill="#dcfce7"/>
    <text class="title-text" x="22" y="32">Monte Carlo Sub-Trees (MCR)</text>
    <text class="subtitle-text" x="22" y="47">Empirical Grounding: V_hat(s_t) = (1/K) Σ R(τ_k)</text>

    <!-- Tree Diagram Area -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="356" height="270"/>

      <!-- Level lines -->
      <line x1="15" y1="35" x2="340" y2="35" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="95" x2="340" y2="95" stroke="#f1f5f9" stroke-dasharray="2 2"/>
      <line x1="15" y1="200" x2="340" y2="200" stroke="#f1f5f9" stroke-dasharray="2 2"/>

      <!-- s0 -->
      <circle class="node-purple" cx="120" cy="35" r="14"/>
      <text class="node-label" x="120" y="35">s₀</text>

      <!-- Edge s0 -> s1 -->
      <path d="M 120 49 L 120 81" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
      <text class="edge-label" x="130" y="65">a₀: Targeted gdb trace</text>

      <!-- s1 (Branching Point) -->
      <circle class="node-green" cx="120" cy="95" r="14"/>
      <text class="node-label" x="120" y="95">s₁</text>

      <!-- Forked branches from s1 -->
      <!-- Branch 1 (Pass) -->
      <path d="M 112 106 L 40 185" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>
      <circle class="node-green" cx="36" cy="195" r="10"/>
      <text class="edge-label" x="15" y="220" fill="#059669" font-size="8.5px">R(τ₁)=1</text>

      <!-- Branch 2 (Pass) -->
      <path d="M 116 108 L 84 185" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>
      <circle class="node-green" cx="80" cy="195" r="10"/>
      <text class="edge-label" x="65" y="220" fill="#059669" font-size="8.5px">R(τ₂)=1</text>

      <!-- Branch 3 (Pass) -->
      <path d="M 124 108 L 136 185" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>
      <circle class="node-green" cx="140" cy="195" r="10"/>
      <text class="edge-label" x="125" y="220" fill="#059669" font-size="8.5px">R(τ₃)=1</text>

      <!-- Branch K (Fail) -->
      <path d="M 128 106 L 194 185" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>
      <circle class="node-red" cx="198" cy="195" r="10"/>
      <text class="edge-label" x="185" y="220" fill="#dc2626" font-size="8.5px">R(τ_K)=0</text>

      <!-- Calculation Box -->
      <rect x="225" y="70" width="120" height="100" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text class="dim-label" x="232" y="86" fill="#15803d">EMPIRICAL DELTA</text>
      <text class="code-text" x="232" y="103" font-size="9px">V_hat(s₀) = 0.05</text>
      <text class="code-green" x="232" y="120" font-size="9px">V_hat(s₁) = 0.60</text>
      <line x1="232" y1="126" x2="338" y2="126" stroke="#86efac" stroke-width="1"/>
      <text class="code-green" x="232" y="142" font-size="9.5px">A_hat = +0.55</text>
      <text class="dim-label" x="232" y="158" font-size="8px" fill="#15803d">Credit Protected</text>

      <!-- Annotation box inside tree -->
      <rect x="12" y="238" width="332" height="24" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text class="body-text" x="18" y="254" font-size="9px" fill="#166534">Invariant: Diagnostic steps reinforced even when rollouts fail later.</text>
    </g>

    <!-- Operational Metrics Block -->
    <g transform="translate(12, 348)">
      <rect class="inner-box" x="0" y="0" width="356" height="170"/>
      <text class="dim-label" x="14" y="18">SYSTEMS TRADEOFF ANALYSIS</text>

      <text class="dim-label" x="14" y="38">Credit Target:</text>
      <text class="dim-val" x="125" y="38">Intermediate state s_t via forks</text>

      <text class="dim-label" x="14" y="58">Gradient Variance:</text>
      <text class="code-green" x="125" y="58">Moderate: O(1/√K) scaling</text>

      <text class="dim-label" x="14" y="78">Sample Efficiency:</text>
      <text class="dim-val" x="125" y="78">High (dense empirical values)</text>

      <text class="dim-label" x="14" y="98">Verifier Gaming:</text>
      <text class="code-green" x="125" y="98">Bounded by terminal tests</text>

      <text class="dim-label" x="14" y="118">Compute Cost:</text>
      <text class="code-red" x="125" y="118">Extreme: O(K · T²) sub-rollouts</text>

      <line x1="14" y1="128" x2="342" y2="128" stroke="#f1f5f9" stroke-width="1"/>
    </g>
  </g>
</svg>
