<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #475569; line-height: 1.35; }
      .mono-metric { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 700; }
      .arrow-label { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; fill: #64748b; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="510" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Banner -->
  <g transform="translate(25, 18)">
    <rect x="0" y="0" width="890" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="12" y="11" width="76" height="20" rx="4" fill="#e0e7ff"/>
    <text x="50" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4338ca">FIGURE 16.2</text>
    <text x="98" y="22" class="title">Compounding Token Cascades vs. Cost-Aware Model Routing</text>
    <text x="98" y="34" class="subtitle">Unconstrained recursive agent swarms trigger budget collapse; tiered routing and quota contracts enforce CPVG bounds</text>
  </g>

  <!-- Panel 1: Unconstrained Swarm Cascade (Left) -->
  <g transform="translate(25, 75)">
    <rect width="425" height="415" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="425" height="32" rx="8" fill="#fff1f2"/>
    <text x="18" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#be123c">FAILURE MODE: Unconstrained Multi-Agent Cascade</text>

    <!-- Step 1: User Request -->
    <rect x="20" y="50" width="385" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="32" y="68" class="box-title" fill="#0f172a">1. User Request (Direct Input)</text>
    <text x="32" y="84" class="mono-metric" fill="#475569">Prompt: 50 tokens · Frontier Model ($15/M tok) · Cost: $0.00075</text>

    <!-- Arrow Down 1 -->
    <line x1="212" y1="98" x2="212" y2="120" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="220" y="113" class="arrow-label">Spawns 5 Subagents</text>

    <!-- Step 2: Shared Buffer Swarm -->
    <rect x="20" y="122" width="385" height="90" rx="6" fill="#fff1f2" stroke="#fda4af"/>
    <text x="32" y="142" class="box-title" fill="#9f1239">2. Unisolated Conversational Swarm (Turn 1–5)</text>
    <text x="32" y="158" class="box-desc">Each subagent ingests the entire prompt + code context (40k tokens).</text>
    <text x="32" y="172" class="box-desc">Subagents broadcast raw outputs across a shared conversation room.</text>
    <text x="32" y="196" class="mono-metric" fill="#be123c">5 × 40,000 in + 5 × 2,000 out = 210,000 tokens ($4.50)</text>

    <!-- Arrow Down 2 -->
    <line x1="212" y1="212" x2="212" y2="236" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="220" y="228" class="arrow-label">Unbounded Retries (Thundering Herd)</text>

    <!-- Step 3: Compounding Trajectory Blowup -->
    <rect x="20" y="238" width="385" height="95" rx="6" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="32" y="258" class="box-title" fill="#881337">3. Exponential Retries &amp; KV Cache Thrashing</text>
    <text x="32" y="274" class="box-desc">Minor tool schema parse error triggers 20 recursive repair loops.</text>
    <text x="32" y="288" class="box-desc">No circuit breaker; subagents regenerate full prompt sequences.</text>
    <text x="32" y="316" class="mono-metric" fill="#9f1239">Cumulative Consumption: 4.8 Million tokens ($115.20)</text>

    <!-- Outcome Card Bottom -->
    <rect x="20" y="348" width="385" height="52" rx="6" fill="#9f1239"/>
    <text x="212" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">RESULT: 153,600x Cost Inflation ($115.20 vs. $0.00075)</text>
    <text x="212" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fecdd3">Cloud budget exhausted; task ultimately aborted due to rate limits</text>
  </g>

  <!-- Panel 2: Cost-Aware Tiered Model Routing (Right) -->
  <g transform="translate(485, 75)">
    <rect width="430" height="415" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="430" height="32" rx="8" fill="#ecfdf5"/>
    <text x="18" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">SOLUTION: Tiered Routing &amp; Quota Leases</text>

    <!-- Tier 1: Distilled Router -->
    <rect x="20" y="50" width="390" height="70" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="28" y="58" width="60" height="18" rx="3" fill="#dcfce7"/>
    <text x="58" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#15803d">TIER 1</text>
    <text x="96" y="71" class="box-title" fill="#14532d">Ultra-Fast Distilled Classifier / Router</text>
    <text x="28" y="92" class="box-desc">Categorizes query complexity; enforces rigid token quota allocation.</text>
    <text x="28" y="106" class="mono-metric" fill="#166534">Model: 8B Distilled ($0.10/M) · Prefill amortized via KV cache</text>

    <!-- Arrow Down 1 -->
    <line x1="215" y1="120" x2="215" y2="140" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="225" y="133" class="arrow-label">Decomposed Worker Tasks</text>

    <!-- Tier 2: Domain Specialists -->
    <rect x="20" y="142" width="390" height="85" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="28" y="150" width="60" height="18" rx="3" fill="#dcfce7"/>
    <text x="58" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#15803d">TIER 2</text>
    <text x="96" y="163" class="box-title" fill="#14532d">Specialized Workers (Isolated Mailboxes)</text>
    <text x="28" y="184" class="box-desc">Private worktrees; shared read-only code prefix KV cache.</text>
    <text x="28" y="198" class="box-desc">Monotonic token leases (max 5,000 tokens per subagent).</text>
    <text x="28" y="214" class="mono-metric" fill="#166534">Model: 70B MoE ($0.60/M) · Circuit breaker on 2 consecutive errors</text>

    <!-- Arrow Down 2 -->
    <line x1="215" y1="227" x2="215" y2="247" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="225" y="240" class="arrow-label">Oracle Gate (Unit Test Pass / Fail)</text>

    <!-- Tier 3: Gated Frontier Synthesis -->
    <rect x="20" y="249" width="390" height="85" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="28" y="257" width="60" height="18" rx="3" fill="#dcfce7"/>
    <text x="58" y="269" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#15803d">TIER 3</text>
    <text x="96" y="270" class="box-title" fill="#14532d">Frontier Reasoning Model (Escalation Only)</text>
    <text x="28" y="291" class="box-desc">Invoked strictly when deterministic software oracle fails.</text>
    <text x="28" y="305" class="box-desc">Synthesizes verified diffs; bounded to 1 single deliberate turn.</text>
    <text x="28" y="321" class="mono-metric" fill="#166534">Model: Frontier ($15/M) · Consumes only condensed AST delta summary</text>

    <!-- Outcome Card Bottom -->
    <rect x="20" y="348" width="390" height="52" rx="6" fill="#047857"/>
    <text x="215" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">RESULT: 98.4% Cost Reduction ($1.84 vs. $115.20)</text>
    <text x="215" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Deterministic oracle gating guarantees bounded CPVG and high goodput</text>
  </g>
</svg>
