<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
  </defs>
  <rect x="10" y="10" width="660" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="10" width="660" height="24" rx="3" fill="#e2e8f0"/>
  <text x="22" y="26" font-size="10" font-weight="700" fill="#0f172a">(a) Synchronous group: every slot waits for the slowest member</text>
  <text x="658" y="26" text-anchor="end" font-size="8.5" fill="#475569">65% of reserved slot time idle</text>
  <text x="110" y="57" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout 1</text>
  <rect x="120" y="46" width="5.7" height="16" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="125.7" y="46" width="474.3" height="16" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="131.7" y="57.5" font-size="8.5" fill="#0f172a">0.2 s</text>
  <text x="592" y="57.5" text-anchor="end" font-size="8" fill="#64748b">idle</text>
  <text x="110" y="79" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout 2</text>
  <rect x="120" y="68" width="60.0" height="16" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="180.0" y="68" width="420.0" height="16" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="186.0" y="79.5" font-size="8.5" fill="#0f172a">2.1 s</text>
  <text x="592" y="79.5" text-anchor="end" font-size="8" fill="#64748b">idle</text>
  <text x="110" y="101" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout 3</text>
  <rect x="120" y="90" width="120.0" height="16" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="240.0" y="90" width="360.0" height="16" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="246.0" y="101.5" font-size="8.5" fill="#0f172a">4.2 s</text>
  <text x="592" y="101.5" text-anchor="end" font-size="8" fill="#64748b">idle</text>
  <text x="110" y="123" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout 4</text>
  <rect x="120" y="112" width="480.0" height="16" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="592.0" y="123.5" text-anchor="end" font-size="8.5" fill="#0f172a">16.8 s</text>
  <text x="110" y="145" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">trainer</text>
  <line x1="120" y1="142" x2="596" y2="142" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="336.0" y="135" width="48" height="14" fill="#f8fafc"/>
  <text x="360.0" y="145.5" text-anchor="middle" font-size="8" fill="#64748b">waits</text>
  <rect x="604" y="134" width="54" height="16" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="631" y="145.5" text-anchor="middle" font-size="8.5" fill="#0f172a">update</text>
  <line x1="600" y1="40" x2="600" y2="130" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="606" y="56" font-size="8.5" fill="#b91c1c">barrier</text>
  <rect x="10" y="180" width="660" height="170" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="180" width="660" height="24" rx="3" fill="#e2e8f0"/>
  <text x="22" y="196" font-size="10" font-weight="700" fill="#0f172a">(b) Asynchronous collection: each record carries its behavior version</text>
  <text x="110" y="226" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">trainer version</text>
  <rect x="120" y="214" width="92" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="166.0" y="226.5" text-anchor="middle" font-size="8.5" fill="#0f172a">ver</text>
  <rect x="216" y="214" width="92" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="262.0" y="226.5" text-anchor="middle" font-size="8.5" fill="#0f172a">ver + 1</text>
  <rect x="312" y="214" width="92" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="358.0" y="226.5" text-anchor="middle" font-size="8.5" fill="#0f172a">ver + 2</text>
  <rect x="408" y="214" width="92" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="454.0" y="226.5" text-anchor="middle" font-size="8.5" fill="#0f172a">ver + 3</text>
  <rect x="504" y="214" width="92" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="550.0" y="226.5" text-anchor="middle" font-size="8.5" fill="#0f172a">ver + 4</text>
  <text x="110" y="261" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout A</text>
  <rect x="124" y="250" width="126" height="16" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="132" y="261.5" font-size="8" fill="#475569">sampled with ver</text>
  <line x1="250" y1="250" x2="250" y2="234" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="256" y="261.5" font-size="8.5" fill="#15803d">&#916;ver = 1: admit</text>
  <text x="110" y="289" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout B</text>
  <rect x="220" y="278" width="270" height="16" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="228" y="289.5" font-size="8" fill="#475569">sampled with ver + 1</text>
  <line x1="490" y1="278" x2="490" y2="234" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="496" y="289.5" font-size="8.5" fill="#15803d">&#916;ver = 2: admit</text>
  <text x="110" y="317" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f172a">rollout C</text>
  <rect x="124" y="306" width="466" height="16" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="132" y="317.5" font-size="8" fill="#475569">sampled with ver</text>
  <line x1="590" y1="303" x2="590" y2="325" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="338" text-anchor="end" font-size="8.5" fill="#b91c1c">&#916;ver = 4 exceeds &#916;ver<tspan baseline-shift="sub" font-size="75%">max</tspan>: excluded, reason recorded</text>
  <rect x="10" y="370" width="660" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="370" width="660" height="24" rx="3" fill="#e2e8f0"/>
  <text x="22" y="386" font-size="10" font-weight="700" fill="#0f172a">(c) Admission path for one record</text>
  <rect x="20" y="426" width="104" height="40" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="72.0" y="443" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">rollout pool</text>
  <text x="72.0" y="457" text-anchor="middle" font-size="8" fill="#475569">samples with ver<tspan baseline-shift="sub" font-size="75%">b</tspan></text>
  <rect x="150" y="426" width="104" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="202.0" y="443" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">verification</text>
  <text x="202.0" y="457" text-anchor="middle" font-size="8" fill="#475569">pass, fail, unavailable</text>
  <rect x="280" y="426" width="104" height="40" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="332.0" y="443" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">group buffer</text>
  <text x="332.0" y="457" text-anchor="middle" font-size="8" fill="#475569">bounded records</text>
  <rect x="410" y="426" width="104" height="40" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="462.0" y="443" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">version check</text>
  <text x="462.0" y="457" text-anchor="middle" font-size="8" fill="#475569">&#916;ver &#8804; &#916;ver<tspan baseline-shift="sub" font-size="75%">max</tspan>?</text>
  <rect x="540" y="426" width="104" height="40" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="592.0" y="443" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">trainer</text>
  <text x="592.0" y="457" text-anchor="middle" font-size="8" fill="#475569">update, ver<tspan baseline-shift="sub" font-size="75%">t</tspan> ← ver<tspan baseline-shift="sub" font-size="75%">t</tspan> + 1</text>
  <line x1="124" y1="446.0" x2="148" y2="446.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="254" y1="446.0" x2="278" y2="446.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="384" y1="446.0" x2="408" y2="446.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="514" y1="446.0" x2="538" y2="446.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="527" y="441.0" text-anchor="middle" font-size="8" fill="#15803d">yes</text>
  <line x1="462.0" y1="466" x2="462.0" y2="480" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="468.0" y="477" font-size="8" fill="#b91c1c">no</text>
  <rect x="392.0" y="482" width="140" height="22" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="462.0" y="496" text-anchor="middle" font-size="8" fill="#0f172a">excluded, reason and cost recorded</text>
  <path d="M592.0,426 V408 H72.0 V424" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="250" y="401" width="180" height="14" fill="#f8fafc"/>
  <text x="340" y="411" text-anchor="middle" font-size="8.5" fill="#0369a1">new weights, version ver<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
</svg>
