  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.reward
      label: Verifiable reward
      teaches: Reward as measurement
      summary: A measured rollout score supplies an optimization signal under a specified evaluator; it
        may incompletely represent the intended task.
      section: sec-vol3-rlvr-score-intended-outcome
    - id: vol3.credit
      label: Credit assignment
      teaches: Credit assignment
      summary: The learning objective attributes trajectory outcomes to sampled policy actions; prompts
        and tool feedback condition actions without becoming sampled actions.
      section: sec-vol3-rlvr-credit
    - id: vol3.reward-hacking
      label: Reward hacking
      teaches: Reward hacking
      summary: A policy increases measured reward through gaps in the task proxy or by manipulating its
        measurement mechanism.
      section: sec-vol3-rlvr-score-intended-outcome
      aliases:
      - Specification gaming
    relationships:
    - id: vol3.field.reward.reward-hacking
      source: vol3.reward
      predicate: can incentivize
      target: vol3.reward-hacking
      explanation: An incomplete task proxy and a compromised grader can both raise reward while failing
        the intended engineering task.
      conditions: Measurement hardening addresses manipulation but cannot make incomplete criteria complete.
      status: draft
      evidence:
        section: sec-vol3-rlvr-score-intended-outcome
        quote: 'A candidate patch for `pool_repair_01` can pass every test in `repair_accept_v1` while introducing
          a race condition on an untested concurrency path, or, if the grading environment is writable,
          modify the test runner so that a failing execution reports success. Both outcomes collect high
          reward without solving the underlying engineering problem, but they represent two different defects:
          incomplete test coverage vs. compromised measurement. Hardening the grader protects the measurement
          process, but it does not make the underlying test criteria complete.'
    - id: vol3.field.reward.credit
      source: vol3.reward
      predicate: supplies outcome information for
      target: vol3.credit
      explanation: The policy update must connect episode outcomes to the actions actually sampled by the
        policy.
      conditions: Tool observations and prompts are conditioning input rather than sampled policy actions.
      status: draft
      evidence:
        section: sec-vol3-rlvr-baselines-credit
        quote: 'When a binary check such as `repair_accept_v1` emits $1$ for a pass and $0$ for a failure,
          multiplying action log-probabilities directly by the raw score multiplies every failed rollout
          by zero, leaving the update with no signal to penalize the actions that failed. Policy-gradient
          algorithms adjust model parameters by estimating a gradient direction that increases or decreases
          the log-probabilities of sampled actions relative to an offset reference level. Standard estimators
          subtract a **baseline**\index{Baseline (policy gradient)!definition} from the raw outcome: the
          centered advantage is $\TrajectoryReward(\Trajectory)-\PolicyGradientBaseline(\InteractionHistory_0)$,
          where $\PolicyGradientBaseline(\InteractionHistory_0)$ depends on the initial task prompt and
          context $\InteractionHistory_0$ but remains independent of the sampled action sequence $\Trajectory$.
          That baseline can be a fixed scalar, an empirical rolling mean across task batches, or a parametric
          value estimate, and it does not necessarily require training a separate critic network [@williams1992simple].'
    - id: vol3.field.reward-hacking.grader
      source: vol3.reward-hacking
      predicate: motivates protection by
      target: vol3.grader
      explanation: Assessment must keep verdict state and protected test definitions outside the reach of
        the untrusted candidate.
      conditions: A separate workspace alone is insufficient if the candidate shares the grader process
        or readable protected files.
      status: draft
      evidence:
        section: sec-vol3-rlvr-assessment-workspaces
        quote: Grading a patch inside the same container where the agent explored leaves the test runner,
          module imports, and exit codes exposed to the candidate's modifications. To close that path, the
          controller separates the exploration workspace from the assessment workspace (@tbl-vol3-dual-sandbox-boundaries).
          When an episode finishes, the controller captures the candidate artifact, binds it to the rollout
          identifier and base source revision, and admits it only if its diff modifies files the task permits,
          such as application source rather than tests, grading scripts, or container configuration. The
          controller then applies that admitted diff to a fresh copy of the declared fixture in a separate
          assessment workspace. Because the test suite must import or execute the patched application to
          evaluate it, the candidate remains untrusted even after it crosses into the assessment container.
          Application code that runs inside the same language interpreter process as the grader can still
          monkeypatch assertion objects or reporting hooks in memory, and hidden test files mounted read-only
          inside the candidate's filesystem namespace can still be opened and read by the application at
          runtime. The assessment harness must therefore keep the authoritative verdict store and protected
          test definitions outside the process and filesystem scope reachable by the code under test, treating
          candidate stdout, stderr, and exit codes strictly as telemetry rather than verdicts.
