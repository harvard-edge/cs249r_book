    - Rollout loop sizing
  secondary_concepts:
    - Entropy collapse
    - Verifier isolation
  claims:
    Sampled reward contrast: RLVR scores sampled rollouts with a programmatic check, so the update learns only what
      the sampler reaches and the reward distinguishes, and a task the policy never solves gives zero signal.
    Reward hacking: Once a check is the objective, any trajectory with proxy reward at least the intended solution's
      but lower true utility gains weight, and cheap exploits usually have high probability.
    Reward as measurement: The false-accept share of rewarded rollouts moves with the policy's current pass rate
      rather than being a fixed verifier property, so reward shaping must preserve the priority of correct outcomes.
    Credit assignment: A terminal reward gives every turn the same reward-to-go, so separating a useful step from
      a faulty one is bought with a critic, more samples, or step-level signals, each at its own cost.
    GRPO coefficients: GRPO replaces the learned critic with G rollouts per task and broadcasts one standardized
      coefficient to every sampled token of a rollout, and its clipping and KL estimator choices change how that
      signal is weighted.
    Zero-contrast groups: A group whose rewards all tie carries no reward gradient, occurring with probability p^G
      + (1-p)^G, so the rollout cost of one informative group is G/C and difficulty targeting toward p near 0.5
      lowers it.
    Faithful rollout records: Ratios and gradients are valid only on per-invocation records of the delivered prefix
      token IDs, sampled token IDs, and behavior log probabilities under the actual sampling transforms.
    Rollout loop sizing: Agent RL throughput is set by the rollout loop, not the gradient step, so the serial slot
      cycle caps capacity and Amdahl's law bounds any single-stage speedup.
    Entropy collapse: Symmetric ratio clipping is asymmetric in probability space, so early successes sharpen the
      policy until groups converge and contrast vanishes, which outcome statistics can diagnose.
    Verifier isolation: Grader isolation placed on the reward path protects the verdict from both the acting policy
      and the candidate code it submits, so a reward reflects executed tests rather than tampering.
