<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .text-subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-header { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text-subhead { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #334155; }
      .text-body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.35; }
      .text-badge { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 9.5px; }
      .text-caption { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="16" y="16" width="928" height="528" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Header Bar -->
  <rect x="32" y="32" width="896" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="42" y="42" width="94" height="26" rx="5" fill="#4f46e5"/>
  <text x="89" y="59" text-anchor="middle" class="text-badge" fill="#ffffff">FIGURE 6.1</text>
  <text x="148" y="52" class="text-title">The Fault Spectrum: Classical Fault Models vs. Fail-Plausible Semantic Defects</text>
  <text x="148" y="68" class="text-subtitle">Why standard supervisor exception handlers and cryptographic checksums fail to detect agentic hallucinations</text>

  <!-- Column 1: Fail-Stop (Crash) -->
  <rect x="32" y="96" width="285" height="370" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="32" y="96" width="285" height="32" rx="8" fill="#475569"/>
  <rect x="32" y="120" width="285" height="8" fill="#475569"/>
  <text x="174" y="117" text-anchor="middle" class="text-header" fill="#ffffff">1. FAIL-STOP (CRASH)</text>

  <rect x="44" y="138" width="261" height="66" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="154" class="text-subhead" fill="#1e293b">Failure Manifestation:</text>
  <text x="54" y="170" class="text-body">• Process terminates abruptly, kernel panic</text>
  <text x="54" y="184" class="text-body">• OOM killer SIGKILL, dropped TCP socket</text>

  <rect x="44" y="212" width="261" height="66" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="228" class="text-subhead" fill="#1e293b">Detection Mechanism:</text>
  <text x="54" y="244" class="text-body">• Deterministic: exit code ≠ 0 (137, 139)</text>
  <text x="54" y="258" class="text-body">• Heartbeat keep-alive timeout, RST packet</text>

  <rect x="44" y="286" width="261" height="66" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="302" class="text-subhead" fill="#1e293b">Systems Recovery:</text>
  <text x="54" y="318" class="text-body">• OS supervisor restart (systemd/k8s)</text>
  <text x="54" y="332" class="text-body">• Node failover &amp; idempotent retry</text>

  <rect x="44" y="360" width="261" height="94" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="174" y="380" text-anchor="middle" class="text-subhead" fill="#334155">Standard Defense: EFFECTIVE</text>
  <text x="54" y="400" class="text-caption">• Clean, unambiguous failure boundary</text>
  <text x="54" y="416" class="text-caption">• Hardware or OS signals failure instantly</text>
  <text x="54" y="432" class="text-caption">• Discard in-flight buffer; state uncorrupted</text>

  <!-- Column 2: Byzantine Fault -->
  <rect x="337" y="96" width="285" height="370" rx="8" fill="#fffbfb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="337" y="96" width="285" height="32" rx="8" fill="#d97706"/>
  <rect x="337" y="120" width="285" height="8" fill="#d97706"/>
  <text x="479" y="117" text-anchor="middle" class="text-header" fill="#ffffff">2. BYZANTINE FAULT</text>

  <rect x="349" y="138" width="261" height="66" rx="6" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
  <text x="359" y="154" class="text-subhead" fill="#92400e">Failure Manifestation:</text>
  <text x="359" y="170" class="text-body">• Arbitrary bit flips, memory corruption</text>
  <text x="359" y="184" class="text-body">• Malicious actor, packet tampering</text>

  <rect x="349" y="212" width="261" height="66" rx="6" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
  <text x="359" y="228" class="text-subhead" fill="#92400e">Detection Mechanism:</text>
  <text x="359" y="244" class="text-body">• Cryptographic hash digest (SHA-256)</text>
  <text x="359" y="258" class="text-body">• Divergent replica votes across nodes</text>

  <rect x="349" y="286" width="261" height="66" rx="6" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
  <text x="359" y="302" class="text-subhead" fill="#92400e">Systems Recovery:</text>
  <text x="359" y="318" class="text-body">• Quorum consensus (PBFT, Raft)</text>
  <text x="359" y="332" class="text-body">• 3f + 1 replication masks f faulty nodes</text>

  <rect x="349" y="360" width="261" height="94" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="479" y="380" text-anchor="middle" class="text-subhead" fill="#92400e">Consensus Defense: EFFECTIVE</text>
  <text x="359" y="400" class="text-caption" fill="#78350f">• Cryptographically verifiable payloads</text>
  <text x="359" y="416" class="text-caption" fill="#78350f">• Multi-replica voting suppresses rogues</text>
  <text x="359" y="432" class="text-caption" fill="#78350f">• Assumes independent non-correlated faults</text>

  <!-- Column 3: Fail-Plausible Defect (Agentic MLSys) -->
  <rect x="643" y="96" width="285" height="370" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="643" y="96" width="285" height="32" rx="8" fill="#581c87"/>
  <rect x="643" y="120" width="285" height="8" fill="#581c87"/>
  <text x="785" y="117" text-anchor="middle" class="text-header" fill="#ffffff">3. FAIL-PLAUSIBLE DEFECT</text>

  <rect x="655" y="138" width="261" height="66" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="1"/>
  <text x="665" y="154" class="text-subhead" fill="#581c87">Failure Manifestation:</text>
  <text x="665" y="170" class="text-body">• Syntactically valid JSON, exit code 0</text>
  <text x="665" y="184" class="text-body" fill="#dc2626" font-weight="600">• Confident reasoning; catastrophic flaw</text>

  <rect x="655" y="212" width="261" height="66" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="1"/>
  <text x="665" y="228" class="text-subhead" fill="#581c87">Detection Mechanism:</text>
  <text x="665" y="244" class="text-body" fill="#dc2626">• INVISIBLE to OS &amp; cryptographic hashes</text>
  <text x="665" y="258" class="text-body">• Demands external verifier oracles</text>

  <rect x="655" y="286" width="261" height="66" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="1"/>
  <text x="665" y="302" class="text-subhead" fill="#581c87">Amplification Hazard:</text>
  <text x="665" y="318" class="text-body" fill="#b91c1c">• Conversational retries compound error</text>
  <text x="665" y="332" class="text-body">• Flawed logic pinned in active KV cache</text>

  <rect x="655" y="360" width="261" height="94" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="785" y="380" text-anchor="middle" class="text-subhead" fill="#581c87">Required Defense: SYSTEMS GATES</text>
  <text x="665" y="400" class="text-caption" fill="#4c1d95">• External compiler, AST, and test oracles</text>
  <text x="665" y="416" class="text-caption" fill="#4c1d95">• Reversibility boundaries &amp; Saga compensation</text>
  <text x="665" y="432" class="text-caption" fill="#4c1d95">• Event-sourced WAL deterministic rollbacks</text>

  <!-- Bottom Architectural Invariant Footer -->
  <rect x="32" y="480" width="896" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="497" class="text-subhead" fill="#0f172a">Core Systems Invariant: Semantic Defects Require External Verification Oracles, Not Conversational Retries</text>
  <text x="44" y="512" class="text-body" fill="#475569">Stochastic foundation models do not fail-stop; they generate plausible yet defective actions with high confidence.</text>
  <text x="44" y="525" class="text-body" fill="#475569">Because checksums verify data integrity rather than cognitive correctness, runtimes must gate execution with deterministic test oracles.</text>
</svg>
