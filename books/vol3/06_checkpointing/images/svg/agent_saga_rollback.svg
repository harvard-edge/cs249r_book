<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .text-subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-header { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text-subhead { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #334155; }
      .text-body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.35; }
      .text-code { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .text-badge { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 9.5px; }
      .text-caption { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="16" y="16" width="928" height="528" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Header Bar -->
  <rect x="32" y="32" width="896" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="42" y="42" width="94" height="26" rx="5" fill="#4f46e5"/>
  <text x="89" y="59" text-anchor="middle" class="text-badge" fill="#ffffff">FIGURE 6.3</text>
  <text x="148" y="52" class="text-title">Distributed Agent Sagas: Forward Execution and Backward Compensating Actions</text>
  <text x="148" y="68" class="text-subtitle">Deterministic forward-recovery and reverse compensation restore consistency when heterogeneous tool steps fail</text>

  <!-- Forward Execution Sequence (Top Row) -->
  <rect x="32" y="96" width="896" height="152" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="44" y="116" class="text-header" fill="#166534">Forward Trajectory Execution: T_1 → T_2 → T_3 → T_4 (Failed)</text>
  <rect x="796" y="103" width="120" height="18" rx="4" fill="#dcfce7"/>
  <text x="856" y="116" text-anchor="middle" class="text-badge" fill="#166534">FORWARD SAGA</text>

  <!-- Step T1 -->
  <rect x="44" y="128" width="186" height="104" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="52" y="136" width="48" height="18" rx="3" fill="#dcfce7"/>
  <text x="76" y="149" text-anchor="middle" class="text-badge" fill="#15803d">STEP T_1</text>
  <text x="108" y="150" class="text-subhead">Git Scratch Branch</text>
  <text x="54" y="170" class="text-body">• Creates git worktree branch</text>
  <text x="54" y="184" class="text-body">• Registers compensating C_1</text>
  <rect x="52" y="200" width="170" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="137" y="215" text-anchor="middle" class="text-code" fill="#15803d">✓ CHECKPOINT SAVED</text>

  <!-- Arrow T1 -> T2 -->
  <line x1="230" y1="180" x2="260" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step T2 -->
  <rect x="264" y="128" width="186" height="104" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="272" y="136" width="48" height="18" rx="3" fill="#dcfce7"/>
  <text x="296" y="149" text-anchor="middle" class="text-badge" fill="#15803d">STEP T_2</text>
  <text x="328" y="150" class="text-subhead">Reserve Cloud VM</text>
  <text x="274" y="170" class="text-body">• Provisions AWS EC2 instance</text>
  <text x="274" y="184" class="text-body">• Registers compensating C_2</text>
  <rect x="272" y="200" width="170" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="357" y="215" text-anchor="middle" class="text-code" fill="#15803d">✓ CHECKPOINT SAVED</text>

  <!-- Arrow T2 -> T3 -->
  <line x1="450" y1="180" x2="480" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step T3 -->
  <rect x="484" y="128" width="186" height="104" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="492" y="136" width="48" height="18" rx="3" fill="#dcfce7"/>
  <text x="516" y="149" text-anchor="middle" class="text-badge" fill="#15803d">STEP T_3</text>
  <text x="548" y="150" class="text-subhead">Stripe Auth Hold</text>
  <text x="494" y="170" class="text-body">• Authorizes $50 compute fee</text>
  <text x="494" y="184" class="text-body">• Registers compensating C_3</text>
  <rect x="492" y="200" width="170" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="577" y="215" text-anchor="middle" class="text-code" fill="#15803d">✓ CHECKPOINT SAVED</text>

  <!-- Arrow T3 -> T4 -->
  <line x1="670" y1="180" x2="700" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Step T4 (Failed) -->
  <rect x="704" y="128" width="212" height="104" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <rect x="712" y="136" width="48" height="18" rx="3" fill="#fee2e2"/>
  <text x="736" y="149" text-anchor="middle" class="text-badge" fill="#b91c1c">STEP T_4</text>
  <text x="768" y="150" class="text-subhead" fill="#991b1b">Deploy &amp; Execute</text>
  <text x="714" y="170" class="text-body">• Docker run fails in microVM</text>
  <text x="714" y="184" class="text-body">• Exit Code: 137 (OOM killed)</text>
  <rect x="712" y="200" width="196" height="22" rx="3" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="810" y="215" text-anchor="middle" class="text-badge" fill="#dc2626">✗ VERIFICATION FAILED!</text>

  <!-- Center Coordinator Band -->
  <rect x="32" y="260" width="896" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 810 232 L 810 260" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="50" y="285" class="text-subhead" fill="#4338ca">Saga Execution Coordinator:</text>
  <text x="220" y="285" class="text-body" fill="#1e293b">Traps failure on T_4. Halts forward progress. Invokes reverse compensating sequence: C_3 → C_2 → C_1</text>
  <rect x="800" y="271" width="116" height="20" rx="4" fill="#fee2e2"/>
  <text x="858" y="285" text-anchor="middle" class="text-badge" fill="#991b1b">INITIATE ROLLBACK</text>

  <!-- Backward Compensating Execution Sequence (Bottom Row) -->
  <rect x="32" y="314" width="896" height="152" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="44" y="334" class="text-header" fill="#9a3412">Backward Compensating Actions: C_3 → C_2 → C_1 (Deterministic Code Handlers)</text>
  <rect x="786" y="321" width="130" height="18" rx="4" fill="#ffedd5"/>
  <text x="851" y="334" text-anchor="middle" class="text-badge" fill="#9a3412">REVERSE RECOVERY</text>

  <!-- Arrow down to C3 -->
  <path d="M 810 302 L 810 398 L 676 398" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Step C3 -->
  <rect x="484" y="346" width="186" height="104" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="492" y="354" width="60" height="18" rx="3" fill="#ffedd5"/>
  <text x="522" y="367" text-anchor="middle" class="text-badge" fill="#c2410c">ACTION C_3</text>
  <text x="560" y="368" class="text-subhead">Release Stripe Auth</text>
  <text x="494" y="388" class="text-body">• Invokes: stripe.Refund()</text>
  <text x="494" y="402" class="text-body">• Idempotency key verified</text>
  <rect x="492" y="418" width="170" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="577" y="433" text-anchor="middle" class="text-code" fill="#ea580c">✓ HOLD RELEASED ($0)</text>

  <!-- Arrow C3 -> C2 -->
  <line x1="484" y1="398" x2="454" y2="398" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Step C2 -->
  <rect x="264" y="346" width="186" height="104" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="272" y="354" width="60" height="18" rx="3" fill="#ffedd5"/>
  <text x="302" y="367" text-anchor="middle" class="text-badge" fill="#c2410c">ACTION C_2</text>
  <text x="340" y="368" class="text-subhead">Terminate Cloud VM</text>
  <text x="274" y="388" class="text-body">• Invokes: ec2.Terminate()</text>
  <text x="274" y="402" class="text-body">• Releases IP &amp; EBS storage</text>
  <rect x="272" y="418" width="170" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="357" y="433" text-anchor="middle" class="text-code" fill="#ea580c">✓ INSTANCE TERMINATED</text>

  <!-- Arrow C2 -> C1 -->
  <line x1="264" y1="398" x2="234" y2="398" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Step C1 -->
  <rect x="44" y="346" width="186" height="104" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="42" y="354" width="60" height="18" rx="3" fill="#ffedd5"/>
  <text x="72" y="367" text-anchor="middle" class="text-badge" fill="#c2410c">ACTION C_1</text>
  <text x="110" y="368" class="text-subhead">Clean Git Scratch</text>
  <text x="54" y="388" class="text-body">• git worktree remove -f</text>
  <text x="54" y="402" class="text-body">• Prunes dangling branches</text>
  <rect x="52" y="418" width="170" height="22" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="137" y="433" text-anchor="middle" class="text-code" fill="#ea580c">✓ WORKTREE PURGED</text>

  <!-- Bottom Final Result Callout -->
  <rect x="32" y="480" width="896" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="497" class="text-subhead" fill="#0f172a">Key Invariant: Compensating Actions Must Be Deterministic Code, Never Prompted LLM Text</text>
  <text x="44" y="512" class="text-body" fill="#475569">Prompting a failing model to "undo" an action triggers hallucination compounding. Compensating actions (A^-1) must be</text>
  <text x="44" y="525" class="text-body" fill="#475569">pre-compiled, idempotent API handlers registered in advance at forward action dispatch.</text>
</svg>
