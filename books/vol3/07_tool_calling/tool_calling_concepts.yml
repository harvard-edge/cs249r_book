concept_map:
  schema_version: 2
  source: 07_tool_calling.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Complete mediation
    - Action-time preconditions
    - Discovery is not authority
    - Settlement before retry
    - Operation identity
    - Bounded observation
    - Acknowledgment is not completion
    - Toolkit staging
  secondary_concepts:
    - Reconciliation probe
    - Repeat-behavior classes
    - Confused deputy
    - Computer-use tool calls
  claims:
    Complete mediation: Every proposed call, reads included, passes a deterministic host reference monitor that
      validates, authorizes, dispatches with outcome tracking, and shapes the observation.
    Action-time preconditions: A schema settles only structure, so any precondition that depends on current state
      (an expected version, a canonical path) must be enforced atomically with the effect at the endpoint.
    Discovery is not authority: 'A shared tool protocol cuts integration to N_host + N_tool adapters, but listed
      tools supply only interface syntax: descriptions are untrusted input and admitted schemas must be bound to
      the server instance.'
    Settlement before retry: A timeout records that the caller stopped waiting, not that the effect failed, so a
      dispatched mutation without a reply is an uncertain outcome that blocks retry until its repeat semantics or
      evidence settle it.
    Operation identity: A logical operation ID names one intended effect across attempts, each attempt gets a fresh
      attempt ID, and the ID is safe only under an endpoint contract that binds it to caller, scope, and arguments.
    Bounded observation: Capture and staging are separate budgets, so the adapter drains both pipes, enforces byte
      limits, and stages a head-and-tail view with a typed notice of what was omitted and a handle to the rest.
    Acknowledgment is not completion: A long-running tool returns a job handle whose acknowledgment means only that
      work was queued, so status keeps last-observed-running distinct from unavailable and from failure, and detection
      belongs to the runtime.
    Toolkit staging: Which descriptors the model sees each turn and how much work each tool does are design variables
      priced in context tokens and in cost per accepted task.
    Reconciliation probe: A mutating tool over an endpoint without deduplication ships actuate, probe, and compensate
      together, with the probe written before dispatch against a captured baseline.
    Repeat-behavior classes: Read, set-desired-state, and produce-another-event classify what a repeated call does,
      a dimension orthogonal to the authority levels.
    Confused deputy: A program that acts with its own legitimate authority on behalf of a less privileged requester
      can be steered to misuse that authority, so authority must follow the request, not the program.
    Computer-use tool calls: A click keeps every tool-boundary invariant while losing atomicity, so each observation
      carries capture, window, and coordinate mapping and target identity is rechecked before dispatch.
