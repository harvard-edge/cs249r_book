      evidence:
        section: sec-vol3-tool-calling-complete-mediation
        quote: '***Complete mediation***\index{Complete mediation!definition}\index{Tool actuation!complete
          mediation} requires every proposed access to pass through an enforced authorization boundary before
          it reaches the protected resource. In an agent runtime, the return path is also mediated so that
          observations enter context under explicit access, payload, and status contracts.'
    - id: vol3.field.settlement.observation
      source: vol3.settlement
      predicate: requires correlated
      target: vol3.observation
      explanation: A status probe or returned result establishes an effect only through the endpoint evidence
        contract.
      conditions: A negative lookup while a request remains in flight can leave the effect unknown.
      status: draft
      evidence:
        section: sec-vol3-tool-calling-reconciliation
        quote: When an endpoint lacks native deduplication and a mutating call times out, merely observing
          that the target system now matches the desired state does not prove that the timed-out call produced
          it. A concurrent agent or human operator might have made the change, or an earlier mutation might
          already have been overwritten. To settle ambiguous operations against such endpoints, the runtime
          relies on **reconciliation**\index{Reconciliation!definition}, an authorized, bounded inspection
          of external system state. Obtaining an operation-specific receipt (such as an execution log entry
          or transaction identifier bearing the caller's unique metadata) yields stronger evidence than
          a bare state check. Runtime diagnostics must keep that epistemic distinction intact rather than
          synthesizing a false success receipt for an unverified call.
