<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 340"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1070" height="340" fill="#ffffff"/>

  <!-- ===== 1. Child process ===== -->
  <rect x="20" y="20" width="150" height="220" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <rect x="20" y="20" width="150" height="24" rx="3" fill="#fef3c7"/>
  <text x="95" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Child process</text>
  <rect x="40" y="70" width="110" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="95" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">stdout</text>
  <rect x="40" y="130" width="110" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="95" y="148" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">stderr</text>
  <text x="95" y="200" text-anchor="middle" font-size="8.5" fill="#475569">output volume</text>
  <text x="95" y="214" text-anchor="middle" font-size="8.5" fill="#475569">not bounded by the call</text>

  <!-- ===== 2. Adapter capture ===== -->
  <rect x="210" y="20" width="220" height="220" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="210" y="20" width="220" height="24" rx="3" fill="#e2e8f0"/>
  <text x="320" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Adapter</text>
  <rect x="225" y="70" width="80" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="265" y="88" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">bounded pipe</text>
  <rect x="225" y="130" width="80" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="265" y="148" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">bounded pipe</text>
  <rect x="330" y="70" width="85" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="372" y="106" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">readiness</text>
  <text x="372" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">loop</text>
  <text x="372" y="134" text-anchor="middle" font-size="8" fill="#475569">drains each</text>
  <text x="372" y="145" text-anchor="middle" font-size="8" fill="#475569">channel</text>
  <text x="320" y="200" text-anchor="middle" font-size="8.5" fill="#475569">capture limit in bytes</text>
  <text x="320" y="214" text-anchor="middle" font-size="8.5" fill="#475569">execution deadline</text>

  <!-- child -> pipes -> loop -->
  <path d="M150,85 H223" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M150,145 H223" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M305,85 H328" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M305,145 H328" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== 3. Capture buffers ===== -->
  <rect x="470" y="20" width="200" height="220" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="470" y="20" width="200" height="24" rx="3" fill="#dcfce7"/>
  <text x="570" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Capture buffers</text>
  <rect x="485" y="60" width="170" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="570" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">head, <tspan font-style="italic">M</tspan><tspan font-size="8" dy="2">head</tspan></text>
  <text x="570" y="94" text-anchor="middle" font-size="8.5" fill="#475569">fills once, then stops</text>
  <rect x="485" y="118" width="170" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="570" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">omitted middle</text>
  <text x="570" y="152" text-anchor="middle" font-size="8.5" fill="#475569">not retained; bytes counted</text>
  <rect x="485" y="176" width="170" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="570" y="194" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">tail ring, <tspan font-style="italic">M</tspan><tspan font-size="8" dy="2">tail</tspan></text>
  <text x="570" y="210" text-anchor="middle" font-size="8.5" fill="#475569">overwrites its oldest bytes</text>

  <!-- loop -> capture -->
  <path d="M415,115 H468" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== 4. Staged observation ===== -->
  <rect x="710" y="20" width="180" height="220" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="710" y="20" width="180" height="24" rx="3" fill="#dcfce7"/>
  <text x="800" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Staged observation</text>
  <rect x="725" y="68" width="150" height="22" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="800" y="82" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">process and capture status</text>
  <rect x="725" y="96" width="150" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="800" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">head, <tspan font-style="italic">M</tspan><tspan font-size="8" dy="2">head</tspan></text>
  <rect x="725" y="124" width="150" height="22" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="800" y="138" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">notice: bytes omitted, <tspan font-style="italic">M</tspan><tspan font-size="8" dy="2">notice</tspan></text>
  <rect x="725" y="152" width="150" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="800" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">tail, <tspan font-style="italic">M</tspan><tspan font-size="8" dy="2">tail</tspan></text>
  <rect x="725" y="180" width="150" height="22" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="800" y="194" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">inspection handle</text>
  <text x="800" y="60" text-anchor="middle" font-size="9" fill="#0f172a"><tspan font-style="italic">M</tspan><tspan font-size="8" dy="2">obs,max</tspan><tspan dx="4" dy="-2">=</tspan><tspan dx="4" font-style="italic">M</tspan><tspan font-size="8" dy="2">head</tspan><tspan dx="4" dy="-2">+</tspan><tspan dx="4" font-style="italic">M</tspan><tspan font-size="8" dy="2">notice</tspan><tspan dx="4" dy="-2">+</tspan><tspan dx="4" font-style="italic">M</tspan><tspan font-size="8" dy="2">tail</tspan></text>

  <!-- capture -> staged -->
  <path d="M670,130 H708" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ===== 5. Next model call ===== -->
  <rect x="930" y="90" width="110" height="80" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="985" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Next model call</text>
  <text x="985" y="136" text-anchor="middle" font-size="8.5" fill="#475569">payload measured</text>
  <text x="985" y="149" text-anchor="middle" font-size="8.5" fill="#475569">in tokens</text>
  <path d="M890,130 H928" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ===== Retained record (optional path) ===== -->
  <path d="M570,240 V268" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="580" y="258" font-size="8" fill="#475569">if retention is authorized</text>
  <rect x="485" y="270" width="170" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="570" y="290" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">retained record</text>
  <text x="570" y="306" text-anchor="middle" font-size="8.5" fill="#475569">quota, expiry, access checks</text>
  <path d="M655,295 H800 V204" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="680" y="288" font-size="8" fill="#475569">bounded range reads</text>
</svg>
