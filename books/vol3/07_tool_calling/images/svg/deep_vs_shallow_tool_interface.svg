<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>

  <!-- ===== Panel (a): low-level composition ===== -->
  <rect x="20" y="20" width="460" height="340" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="460" height="24" rx="4" fill="#e2e8f0"/>
  <text x="250" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">(a) Low-level composition</text>

  <text x="90" y="64" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">model</text>
  <text x="250" y="64" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">tool call</text>
  <text x="410" y="64" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">result in context</text>

  <!-- row 1 -->
  <rect x="40" y="74" width="100" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="90" y="92" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">model call 1</text>
  <rect x="170" y="74" width="160" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="250" y="92" text-anchor="middle" font-size="8.5" fill="#0f172a" font-family="Courier New, monospace">open_file(path)</text>
  <rect x="360" y="74" width="100" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="410" y="92" text-anchor="middle" font-size="8.5" fill="#0f172a">handle</text>
  <path d="M140,89 H168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <path d="M330,89 H358" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- row 2 -->
  <rect x="40" y="120" width="100" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="90" y="138" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">model call 2</text>
  <rect x="170" y="120" width="160" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="250" y="138" text-anchor="middle" font-size="8.5" fill="#0f172a" font-family="Courier New, monospace">seek_cursor(handle, n)</text>
  <rect x="360" y="120" width="100" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="410" y="138" text-anchor="middle" font-size="8.5" fill="#0f172a">cursor position</text>
  <path d="M140,135 H168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <path d="M330,135 H358" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- row 3 -->
  <rect x="40" y="166" width="100" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="90" y="184" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">model call 3</text>
  <rect x="170" y="166" width="160" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="250" y="184" text-anchor="middle" font-size="8.5" fill="#0f172a" font-family="Courier New, monospace">write_bytes(handle, b)</text>
  <rect x="360" y="166" width="100" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="410" y="184" text-anchor="middle" font-size="8.5" fill="#0f172a">bytes written</text>
  <path d="M140,181 H168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <path d="M330,181 H358" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- row 4 -->
  <rect x="40" y="212" width="100" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="90" y="230" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">model call 4</text>
  <rect x="170" y="212" width="160" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="250" y="230" text-anchor="middle" font-size="8.5" fill="#0f172a" font-family="Courier New, monospace">close_file(handle)</text>
  <rect x="360" y="212" width="100" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="410" y="230" text-anchor="middle" font-size="8.5" fill="#0f172a">closed</text>
  <path d="M140,227 H168" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <path d="M330,227 H358" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- obligations (a) -->
  <path d="M40,264 H460" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="40" y="286" font-size="8.5" font-weight="700" fill="#0f172a">Model</text>
  <text x="140" y="286" font-size="8.5" fill="#475569">selects each operation, carries handles</text>
  <text x="140" y="300" font-size="8.5" fill="#475569">and cleanup across calls</text>
  <text x="40" y="324" font-size="8.5" font-weight="700" fill="#0f172a">Implementation</text>
  <text x="140" y="324" font-size="8.5" fill="#475569">validates each operation; exposes handle,</text>
  <text x="140" y="338" font-size="8.5" fill="#475569">status, and cleanup semantics</text>

  <!-- ===== Panel (b): task-level operation ===== -->
  <rect x="520" y="20" width="460" height="340" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="520" y="20" width="460" height="24" rx="4" fill="#e2e8f0"/>
  <text x="750" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">(b) Task-level operation</text>

  <text x="590" y="64" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">model</text>
  <text x="805" y="64" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">tool call</text>

  <rect x="540" y="74" width="100" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="590" y="92" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">model call 1</text>
  <rect x="670" y="74" width="270" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="805" y="92" text-anchor="middle" font-size="8.5" fill="#0f172a" font-family="Courier New, monospace">apply_patch(path, expected_version, patch)</text>
  <path d="M640,89 H668" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- implementation container -->
  <rect x="670" y="120" width="270" height="76" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="684" y="136" font-size="8.5" font-weight="700" fill="#0f172a">Implementation</text>
  <rect x="684" y="146" width="110" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="739" y="163" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">check version</text>
  <rect x="816" y="146" width="110" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="871" y="163" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">apply change</text>
  <path d="M794,159 H814" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="805" y="188" text-anchor="middle" font-size="8" font-style="italic" fill="#475569">all-or-nothing only if the implementation provides it</text>
  <path d="M805,104 V118" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- results -->
  <text x="590" y="243" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">result in context</text>
  <path d="M732,196 V222" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M877,196 V222" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="670" y="224" width="125" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="732" y="242" text-anchor="middle" font-size="8.5" fill="#0f172a">diff and new version</text>
  <rect x="815" y="224" width="125" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="877" y="242" text-anchor="middle" font-size="8.5" fill="#0f172a">version conflict</text>
  <text x="805" y="243" text-anchor="middle" font-size="8.5" fill="#475569">or</text>

  <!-- obligations (b) -->
  <path d="M540,264 H960" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="540" y="286" font-size="8.5" font-weight="700" fill="#0f172a">Model</text>
  <text x="640" y="286" font-size="8.5" fill="#475569">states one bounded intent</text>
  <text x="540" y="324" font-size="8.5" font-weight="700" fill="#0f172a">Implementation</text>
  <text x="640" y="324" font-size="8.5" fill="#475569">enforces the precondition and mutation</text>
  <text x="640" y="338" font-size="8.5" fill="#475569">boundary; returns an interpretable result</text>
</svg>
