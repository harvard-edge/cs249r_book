<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="760" height="370" fill="#ffffff"/>

  <!-- ===== Runtime (caller) ===== -->
  <rect x="20" y="20" width="230" height="330" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="34" y="40" font-size="13" font-weight="700" fill="#6d28d9">Runtime</text>

  <rect x="40" y="56" width="190" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="135" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Admit intent</text>
  <text x="135" y="91" text-anchor="middle" font-size="12" fill="#475569">op ID created once</text>

  <!-- Attempt k: a stack of attempts sharing one op ID -->
  <rect x="48" y="120" width="190" height="48" rx="3" fill="#ffffff" stroke="#a78bfa" stroke-width="1"/>
  <rect x="44" y="124" width="190" height="48" rx="3" fill="#ffffff" stroke="#a78bfa" stroke-width="1"/>
  <rect x="40" y="128" width="190" height="48" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="135" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Attempt <tspan font-style="italic">k</tspan></text>
  <text x="135" y="166" text-anchor="middle" font-size="12" fill="#475569">same op ID, new attempt ID</text>

  <rect x="40" y="210" width="190" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="135" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Timeout</text>
  <text x="135" y="245" text-anchor="middle" font-size="12" fill="#b91c1c">effect unknown</text>

  <rect x="40" y="290" width="190" height="44" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="135" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Unresolved</text>
  <text x="135" y="325" text-anchor="middle" font-size="12" fill="#b91c1c">attempts exhausted</text>

  <path d="M135,100 V118" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M135,176 V208" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <path d="M135,254 V288" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <!-- retry the same intent -->
  <path d="M40,232 H30 V152 H38" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>


  <!-- ===== Endpoint (deduplication contract) ===== -->
  <rect x="290" y="20" width="450" height="330" rx="4" fill="#fffdf5" stroke="#d97706" stroke-width="1.2"/>
  <text x="304" y="40" font-size="13" font-weight="700" fill="#b45309">Endpoint</text>

  <rect x="310" y="114" width="120" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Look up op ID</text>
  <text x="370" y="160" text-anchor="middle" font-size="12" fill="#92400e">caller, resource,</text>
  <text x="370" y="176" text-anchor="middle" font-size="12" fill="#92400e">retention window</text>

  <!-- fan-out trunk -->
  <path d="M430,154 H450" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M450,70 V290" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M450,70 H468" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M450,140 H468" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M450,210 H468" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M450,290 H468" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- four lookup outcomes -->
  <rect x="470" y="50" width="130" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="535" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Completed</text>
  <text x="535" y="82" text-anchor="middle" font-size="12" fill="#15803d">retained result</text>

  <rect x="470" y="120" width="130" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="535" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Still running</text>
  <text x="535" y="152" text-anchor="middle" font-size="12" fill="#475569">pending status</text>

  <rect x="470" y="190" width="130" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="535" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Payload differs</text>
  <text x="535" y="222" text-anchor="middle" font-size="12" fill="#b91c1c">ID conflict</text>

  <rect x="470" y="270" width="130" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="535" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Not found</text>
  <text x="535" y="302" text-anchor="middle" font-size="12" fill="#92400e">execute</text>

  <!-- three branches leave state untouched -->
  <path d="M612,52 H618 V228 H612" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="628" y="136" font-size="12.5" fill="#475569">no new</text>
  <text x="628" y="152" font-size="12.5" fill="#475569">effect</text>

  <!-- the one branch that applies the effect -->
  <text x="675" y="254" text-anchor="middle" font-size="12" fill="#6d28d9">one transaction</text>
  <rect x="620" y="260" width="110" height="80" rx="3" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="630" y="268" width="90" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="675" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">apply effect</text>
  <rect x="630" y="306" width="90" height="26" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="675" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">record result</text>
  <path d="M600,290 H618" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M675,294 V304" fill="none" stroke="#7c3aed" stroke-width="1" marker-end="url(#arr-purple)"/>
  <!-- request and reply (drawn last, over both containers) -->
  <path d="M238,144 H308" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M310,160 H240" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
</svg>
