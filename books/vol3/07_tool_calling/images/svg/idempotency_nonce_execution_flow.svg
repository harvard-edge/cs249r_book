<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>

  <!-- ===== Runtime (caller) ===== -->
  <rect x="20" y="20" width="280" height="340" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="20" y="20" width="280" height="24" rx="3" fill="#f3e8ff"/>
  <text x="160" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Runtime (caller)</text>

  <rect x="50" y="60" width="230" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="165" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Admit the intent</text>
  <text x="165" y="94" text-anchor="middle" font-size="8.5" fill="#475569">create the operation ID once</text>

  <rect x="50" y="130" width="230" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="165" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Attempt <tspan font-style="italic">k</tspan></text>
  <text x="165" y="164" text-anchor="middle" font-size="8.5" fill="#475569">same operation ID, fresh attempt ID</text>

  <rect x="50" y="210" width="230" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="165" y="228" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Timeout or lost reply</text>
  <text x="165" y="244" text-anchor="middle" font-size="8.5" fill="#475569">effect unknown; retry the same intent</text>

  <rect x="50" y="290" width="230" height="44" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="165" y="308" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Attempts exhausted</text>
  <text x="165" y="324" text-anchor="middle" font-size="8.5" fill="#475569">outcome unresolved; reconcile</text>

  <path d="M165,104 V128" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <path d="M165,174 V208" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <path d="M165,254 V288" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <path d="M50,232 H35 V152 H48" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

  <!-- ===== Endpoint ===== -->
  <rect x="340" y="20" width="640" height="340" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <rect x="340" y="20" width="640" height="24" rx="3" fill="#fef3c7"/>
  <text x="660" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Endpoint (deduplication contract)</text>

  <rect x="360" y="124" width="180" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="450" y="144" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Look up operation ID</text>
  <text x="450" y="160" text-anchor="middle" font-size="8.5" fill="#475569">scoped to caller and resource</text>
  <text x="450" y="174" text-anchor="middle" font-size="8.5" fill="#475569">within the retention window</text>

  <!-- ===== Request and reply ===== -->
  <path d="M280,145 H358" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="319" y="139" text-anchor="middle" font-size="8" fill="#475569">request</text>
  <path d="M360,163 H282" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="319" y="178" text-anchor="middle" font-size="8" fill="#475569">reply</text>


  <!-- fan-out bus -->
  <path d="M540,154 H570" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M570,80 V290" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M570,80 H598" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M570,144 H598" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M570,208 H598" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M570,290 H598" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Branch: completed -->
  <rect x="600" y="58" width="360" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="614" y="76" font-size="9.5" font-weight="700" fill="#0f172a">Found, completed</text>
  <text x="614" y="92" font-size="8.5" fill="#475569">return the retained result; no new effect</text>

  <!-- Branch: pending -->
  <rect x="600" y="122" width="360" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="614" y="140" font-size="9.5" font-weight="700" fill="#0f172a">Found, still running</text>
  <text x="614" y="156" font-size="8.5" fill="#475569">return a pending status; do not execute again</text>

  <!-- Branch: conflict -->
  <rect x="600" y="186" width="360" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="614" y="204" font-size="9.5" font-weight="700" fill="#0f172a">Found, different payload</text>
  <text x="614" y="220" font-size="8.5" fill="#475569">reject as an ID conflict; no mutation</text>

  <!-- Branch: new -->
  <rect x="600" y="250" width="360" height="90" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="614" y="268" font-size="9.5" font-weight="700" fill="#0f172a">Not found</text>
  <text x="946" y="268" text-anchor="end" font-size="8.5" fill="#475569">execute, then reply</text>
  <rect x="614" y="278" width="332" height="50" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="624" y="292" font-size="8" fill="#6d28d9">one transaction boundary</text>
  <rect x="640" y="298" width="120" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="700" y="313" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">apply the effect</text>
  <rect x="800" y="298" width="120" height="22" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="860" y="313" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">record the result</text>
  <path d="M760,309 H798" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
</svg>
