<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: SUPERVISOR NONCE SYNTHESIS                              -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="460" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 170 0 Q 174 0 174 4 L 174 24 L 0 24 Z" fill="#ede9fe"/>
    <text x="12" y="16" font-size="10.5" font-weight="700" fill="#6b21a8" letter-spacing="0.04em">RUNTIME (CLIENT)</text>
    <text x="268" y="16" font-size="10" font-weight="600" fill="#7c3aed" text-anchor="end">Key Synthesis</text>

    <!-- Subcard 1: Mutating Call -->
    <rect x="14" y="34" width="252" height="106" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="52" font-size="11" font-weight="700" fill="#0f172a">Mutating Tool Invocation</text>
    <text x="24" y="68" font-size="10" fill="#475569">Proposed call with side effects:</text>
    <rect x="24" y="76" width="232" height="52" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="9" fill="#9f1239" transform="translate(32, 91)">
      <text x="0" y="0">ToolCall("transfer_funds", {</text>
      <text x="12" y="14">"amount": 5000,</text>
      <text x="12" y="28">"recipient": "acct-9842" })</text>
    </g>

    <!-- Subcard 2: Deterministic Hash -->
    <rect x="14" y="152" width="252" height="150" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="170" font-size="11" font-weight="700" fill="#0f172a">Idempotency Key Derivation</text>
    <text x="24" y="188" font-size="10" fill="#475569">Binds trajectory state and arguments:</text>
    <rect x="24" y="196" width="232" height="56" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="8.5" fill="#334155" transform="translate(30, 210)">
      <text x="0" y="0">k_idem = SHA-256(</text>
      <text x="10" y="13">SessionID ‖ Turn_t ‖</text>
      <text x="10" y="26">ToolName ‖ CanonicalJSON(args)</text>
      <text x="0" y="39">)</text>
    </g>
    <rect x="24" y="258" width="232" height="32" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="32" y="272" font-size="9" font-family="ui-monospace, monospace" fill="#6b21a8">Key: idem_8f3d1b94...</text>
    <text x="32" y="284" font-size="8.5" fill="#64748b">Invariant across crash loops &amp; retries</text>

    <!-- Subcard 3: Outbound Wire RPC -->
    <rect x="14" y="314" width="252" height="132" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="332" font-size="11" font-weight="700" fill="#0f172a">Outbound RPC Envelope</text>
    <text x="24" y="348" font-size="10" fill="#475569">Tagged with header metadata:</text>
    <rect x="24" y="356" width="232" height="78" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="9" fill="#0f172a" transform="translate(32, 372)">
      <text x="0" y="0"><tspan fill="#64748b">POST</tspan> /mcp/tools/call</text>
      <text x="0" y="16"><tspan fill="#6b21a8">Idempotency-Key:</tspan> idem_8f3d1b94</text>
      <text x="0" y="32"><tspan fill="#64748b">Content-Type:</tspan> application/json</text>
      <text x="0" y="48">Payload: {"tool": "transfer_funds", ...}</text>
    </g>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="300" y1="380" x2="338" y2="380" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: DEDUPLICATION & LEASE GATEWAY                           -->
  <!-- ================================================================= -->
  <g transform="translate(340, 20)">
    <rect x="0" y="0" width="300" height="460" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 180 0 Q 184 0 184 4 L 184 24 L 0 24 Z" fill="#fef3c7"/>
    <text x="12" y="16" font-size="10.5" font-weight="700" fill="#92400e" letter-spacing="0.04em">DEDUP GATEWAY</text>
    <text x="288" y="16" font-size="10" font-weight="600" fill="#d97706" text-anchor="end">State &amp; Lock Store</text>

    <!-- Deduplication lookup -->
    <rect x="14" y="34" width="272" height="74" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="24" y="52" font-size="11" font-weight="700" fill="#0f172a">Atomic Key Inspection</text>
    <rect x="24" y="60" width="252" height="36" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="75" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">GET idem_8f3d1b94</text>
    <text x="32" y="88" font-size="8.5" fill="#475569">Inspects transactional key-value store (Redis / DB)</text>

    <!-- Branch A: COMPLETED -->
    <rect x="14" y="118" width="272" height="102" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <rect x="14" y="118" width="272" height="22" rx="3" fill="#dcfce7" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="24" y="133" font-size="10" font-weight="700" fill="#065f46">BRANCH A: COMPLETED (Fast-Path Hit)</text>
    <text x="24" y="154" font-size="9.5" fill="#475569">Key exists with committed observation:</text>
    <rect x="24" y="160" width="252" height="38" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="32" y="174" font-size="9" font-family="ui-monospace, monospace" fill="#047857">HTTP 200 OK: {"tx_id": "9842"}</text>
    <text x="32" y="188" font-size="8.5" fill="#065f46">Bypasses sandbox; returns cached result</text>

    <!-- Branch B: IN_FLIGHT -->
    <rect x="14" y="230" width="272" height="84" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
    <rect x="14" y="230" width="272" height="22" rx="3" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="24" y="245" font-size="10" font-weight="700" fill="#9a3412">BRANCH B: IN_FLIGHT (Concurrent Retry)</text>
    <text x="24" y="266" font-size="9.5" fill="#475569">Active lease held by concurrent worker:</text>
    <rect x="24" y="272" width="252" height="32" rx="2" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="32" y="286" font-size="9" font-family="ui-monospace, monospace" fill="#c2410c">HTTP 409 Conflict / Yield wait</text>
    <text x="32" y="297" font-size="8.5" fill="#9a3412">Suppresses duplicate execution attempt</text>

    <!-- Branch C: NOT_FOUND -->
    <rect x="14" y="324" width="272" height="122" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <rect x="14" y="324" width="272" height="22" rx="3" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="24" y="339" font-size="10" font-weight="700" fill="#0369a1">BRANCH C: NOT_FOUND (First Execution)</text>
    <text x="24" y="358" font-size="9.5" fill="#475569">Acquires atomic distributed mutex lease:</text>
    <rect x="24" y="366" width="252" height="42" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="32" y="380" font-size="9" font-family="ui-monospace, monospace" fill="#0284c7">SET k_idem "IN_FLIGHT" NX PX 30000</text>
    <text x="32" y="396" font-size="8.5" fill="#0369a1">TTL watchdog prevents orphan deadlocks</text>
    <text x="24" y="426" font-size="9.5" font-weight="600" fill="#0f172a">Lease acquired → Dispatches to sandbox</text>
  </g>

  <!-- Return Fast-Path Arrow (Col 2 Branch A -> Col 1) -->
  <path d="M 340 185 L 310 185 L 310 120 L 282 120" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <rect x="286" y="145" width="48" height="16" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="310" y="156" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">Fast Hit</text>

  <!-- Arrow Col 2 -> Col 3 -->
  <line x1="640" y1="400" x2="668" y2="400" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: EXECUTION SANDBOX & ATOMIC COMMIT                       -->
  <!-- ================================================================= -->
  <g transform="translate(670, 20)">
    <rect x="0" y="0" width="270" height="460" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 175 0 Q 179 0 179 4 L 179 24 L 0 24 Z" fill="#dcfce7"/>
    <text x="12" y="16" font-size="10.5" font-weight="700" fill="#065f46" letter-spacing="0.04em">EXEC SANDBOX</text>
    <text x="258" y="16" font-size="10" font-weight="600" fill="#059669" text-anchor="end">WAL &amp; Commit</text>

    <!-- Subcard 1: Write-Ahead Log -->
    <rect x="14" y="34" width="242" height="116" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="52" font-size="11" font-weight="700" fill="#0f172a">Write-Ahead Log (WAL)</text>
    <text x="24" y="68" font-size="10" fill="#475569">Appends intent before physical mutation:</text>
    <rect x="24" y="76" width="222" height="44" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="92" font-size="8.5" font-family="ui-monospace, monospace" fill="#334155">WAL: [idem_8f3d, transfer, $5k]</text>
    <text x="32" y="106" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857">Compensating inverse logged</text>
    <text x="24" y="136" font-size="9" fill="#64748b">Enables crash-recovery reconciliation</text>

    <!-- Subcard 2: Physical Sandbox Execution -->
    <rect x="14" y="160" width="242" height="126" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="178" font-size="11" font-weight="700" fill="#0f172a">Isolated Physical Mutation</text>
    <text x="24" y="196" font-size="10" fill="#475569">Executes once within container</text>
    <text x="24" y="212" font-size="10" fill="#475569">Captures stdout, stderr, exit code</text>
    <text x="24" y="228" font-size="10" fill="#475569">Enforces strict execution deadline</text>
    <rect x="24" y="238" width="222" height="36" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="32" y="252" font-size="9" font-family="ui-monospace, monospace" fill="#065f46">Mutation Invariant:</text>
    <text x="32" y="266" font-size="9" font-family="ui-monospace, monospace" fill="#047857">Exactly one physical side effect</text>

    <!-- Subcard 3: State Commit & Release -->
    <rect x="14" y="296" width="242" height="150" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="314" font-size="11" font-weight="700" fill="#0f172a">Atomic State Transition</text>
    <text x="24" y="332" font-size="10" fill="#475569">Commit database transaction</text>
    <text x="24" y="348" font-size="10" fill="#475569">Transition key state:</text>
    <rect x="24" y="356" width="222" height="34" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="370" font-size="9" font-family="ui-monospace, monospace" fill="#065f46">SET k_idem "COMPLETED" (TTL 24h)</text>
    <text x="32" y="382" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">Store result bytes payload</text>
    <text x="24" y="406" font-size="10" fill="#475569">Release lease lock</text>
    <text x="24" y="422" font-size="10" fill="#475569">Return observation to runtime</text>
  </g>
</svg>