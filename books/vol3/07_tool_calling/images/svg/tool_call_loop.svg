<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="#ffffff"/>

  <!-- Model call (turn t) -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="270" height="100" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="270" height="24" rx="3" fill="#bae6fd"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#0f172a">Model call (turn t)</text>
    <text x="10" y="42" font-size="10" fill="#475569">Emits one or more tool-call blocks,</text>
    <text x="10" y="56" font-size="10" fill="#475569">then stops with a tool-use stop reason</text>
    <text x="10" y="76" font-size="9.5" font-family="Courier New, monospace" fill="#0369a1">call_1: restart(id="srv-stage-04")</text>
    <text x="10" y="90" font-size="9.5" font-family="Courier New, monospace" fill="#0369a1">call_2: drop_table(name="users")</text>
  </g>

  <!-- Tool or environment -->
  <g transform="translate(600, 20)">
    <rect x="0" y="0" width="360" height="100" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="24" rx="3" fill="#fde68a"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#0f172a">Tool server or environment</text>
    <text x="10" y="42" font-size="10" fill="#475569">MCP server, REST API, database, or subprocess</text>
    <text x="10" y="56" font-size="10" fill="#475569">The effect happens here, and should happen once</text>
    <text x="10" y="76" font-size="9.5" font-family="Courier New, monospace" fill="#b45309">POST /containers/srv-stage-04/restart</text>
  </g>

  <text x="455" y="60" font-size="10" font-style="italic" fill="#64748b" text-anchor="middle">The model never</text>
  <text x="455" y="74" font-size="10" font-style="italic" fill="#64748b" text-anchor="middle">reaches the tool</text>

  <!-- Runtime card -->
  <rect x="25" y="140" width="950" height="150" rx="3" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="25" y="140" width="950" height="24" rx="3" fill="#f3e8ff"/>
  <text x="37" y="156" font-size="11" font-weight="700" fill="#0f172a">Runtime: complete mediation between the call and the next turn</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 176)">
    <rect x="0" y="0" width="200" height="100" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="10" y="18" font-size="10.5" font-weight="700" fill="#6d28d9">1  Validate</text>
    <text x="10" y="38" font-size="9.5" fill="#475569">Parse the block against the</text>
    <text x="10" y="52" font-size="9.5" fill="#475569">descriptor: types, ranges,</text>
    <text x="10" y="66" font-size="9.5" fill="#475569">no undeclared fields</text>
    <text x="10" y="88" font-size="9" fill="#94a3b8">Tool schemas</text>
  </g>
  <!-- Stage 2 -->
  <g transform="translate(280, 176)">
    <rect x="0" y="0" width="200" height="100" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="10" y="18" font-size="10.5" font-weight="700" fill="#6d28d9">2  Authorize</text>
    <text x="10" y="38" font-size="9.5" fill="#475569">Check the grant this session</text>
    <text x="10" y="52" font-size="9.5" fill="#475569">holds for this tool and these</text>
    <text x="10" y="66" font-size="9.5" fill="#475569">arguments, by authority level</text>
    <text x="10" y="88" font-size="9" fill="#94a3b8">Discovery and the grant</text>
  </g>
  <!-- Stage 3 -->
  <g transform="translate(520, 176)">
    <rect x="0" y="0" width="200" height="100" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="10" y="18" font-size="10.5" font-weight="700" fill="#6d28d9">3  Dispatch and settle</text>
    <text x="10" y="38" font-size="9.5" fill="#475569">Attach an idempotency key;</text>
    <text x="10" y="52" font-size="9.5" fill="#475569">on timeout, settle the effect</text>
    <text x="10" y="66" font-size="9.5" fill="#475569">before any retry</text>
    <text x="10" y="88" font-size="9" fill="#94a3b8">Settlement, long-running tools</text>
  </g>
  <!-- Stage 4 -->
  <g transform="translate(760, 176)">
    <rect x="0" y="0" width="200" height="100" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="10" y="18" font-size="10.5" font-weight="700" fill="#6d28d9">4  Shape the observation</text>
    <text x="10" y="38" font-size="9.5" fill="#475569">Bound its size, mark any</text>
    <text x="10" y="52" font-size="9.5" fill="#475569">truncation, type the result</text>
    <text x="10" y="66" font-size="9.5" fill="#475569">and its errors</text>
    <text x="10" y="88" font-size="9" fill="#94a3b8">Shaping observations</text>
  </g>

  <!-- Stage arrows -->
  <line x1="240" y1="226" x2="277" y2="226" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="480" y1="226" x2="517" y2="226" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Model to stage 1 -->
  <line x1="140" y1="120" x2="140" y2="173" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Stage 3 up to environment -->
  <line x1="640" y1="176" x2="640" y2="123" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="648" y="134" font-size="9.5" fill="#b45309">dispatch</text>
  <!-- Environment down to stage 4 -->
  <line x1="860" y1="120" x2="860" y2="173" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="868" y="134" font-size="9.5" fill="#b45309">raw result, unbounded</text>

  <!-- Context for turn t+1 -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="920" height="80" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="920" height="24" rx="3" fill="#bbf7d0"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#0f172a">Context for turn t+1: one tool result per call, matched by call id</text>
    <text x="10" y="44" font-size="9.5" font-family="Courier New, monospace" fill="#15803d">result(call_1): {"status": "restarted", "idempotency_key": "...", "truncated": false}</text>
    <text x="10" y="64" font-size="9.5" font-family="Courier New, monospace" fill="#b91c1c">result(call_2): {"error": "not_authorized", "tool": "drop_table", "needs": "approval"}</text>
  </g>

  <!-- Rejections from stages 1 and 2 -->
  <line x1="140" y1="276" x2="140" y2="327" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <line x1="380" y1="276" x2="380" y2="327" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="148" y="316" font-size="9.5" fill="#b91c1c">invalid: structured error</text>
  <text x="388" y="316" font-size="9.5" fill="#b91c1c">not granted: structured error</text>
  <!-- Stage 4 to context -->
  <line x1="860" y1="276" x2="860" y2="327" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="868" y="316" font-size="9.5" fill="#15803d">bounded, typed</text>

  <!-- Feedback: next model call -->
  <path d="M 40 395 L 12 395 L 12 64 L 37 64" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="8" y="230" font-size="9.5" fill="#64748b" text-anchor="middle" transform="rotate(-90 8 230)">next model call</text>
</svg>
