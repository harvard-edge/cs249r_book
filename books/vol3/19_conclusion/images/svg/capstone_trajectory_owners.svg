<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="680" height="452" fill="#ffffff"/>

  <!-- Specification boundary: the contract the engineer writes -->
  <rect x="20" y="20" width="640" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" rx="2"/>
  <text x="36" y="38" font-size="9.5" font-weight="700" fill="#0f172a">Task contract, written by the engineer</text>
  <text x="36" y="54" font-size="8.5" fill="#475569">goal · environment · permitted actions · observations · completion criteria</text>
  <rect x="560" y="32" width="88" height="20" fill="#b91c1c" rx="10"/>
  <text x="604" y="46" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Part VII</text>

  <path d="M 340 64 V 84" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Live loop card -->
  <rect x="20" y="88" width="640" height="196" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <rect x="20" y="88" width="640" height="24" fill="#e2e8f0" rx="2"/>
  <text x="36" y="104" font-size="9.5" font-weight="700" fill="#0f172a">Live loop · one trajectory · seconds to hours</text>

  <!-- Context assembly -->
  <rect x="36" y="124" width="140" height="68" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="2"/>
  <text x="106" y="141" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Context assembly</text>
  <text x="106" y="156" text-anchor="middle" font-size="8" fill="#475569">budget and layout</text>
  <text x="106" y="167" text-anchor="middle" font-size="8" fill="#475569">prefix reuse · retrieval</text>
  <text x="106" y="184" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Part II</text>

  <!-- Model call -->
  <rect x="196" y="124" width="140" height="68" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" rx="2"/>
  <text x="266" y="141" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Model call</text>
  <text x="266" y="156" text-anchor="middle" font-size="8" fill="#475569">one proposal per call</text>
  <text x="266" y="167" text-anchor="middle" font-size="8" fill="#475569">more samples if they pay</text>
  <text x="266" y="184" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">Part I</text>

  <!-- Tool call -->
  <rect x="356" y="124" width="140" height="68" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" rx="2"/>
  <text x="426" y="141" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Tool call</text>
  <text x="426" y="156" text-anchor="middle" font-size="8" fill="#475569">schema check · grant</text>
  <text x="426" y="167" text-anchor="middle" font-size="8" fill="#475569">settle before retry</text>
  <text x="426" y="184" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Part III</text>

  <!-- Sandbox -->
  <rect x="516" y="124" width="128" height="68" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" rx="2"/>
  <text x="580" y="141" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Sandbox</text>
  <text x="580" y="156" text-anchor="middle" font-size="8" fill="#475569">enforced envelope</text>
  <text x="580" y="167" text-anchor="middle" font-size="8" fill="#475569">untrusted output tagged</text>
  <text x="580" y="184" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Part III</text>

  <!-- Forward arrows -->
  <path d="M 176 158 H 194" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 336 158 H 354" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 496 158 H 514" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Observation feedback -->
  <path d="M 580 192 V 210 H 106 V 194" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
  <rect x="266" y="203" width="160" height="14" fill="#f8fafc"/>
  <text x="346" y="213" text-anchor="middle" font-size="8" fill="#b45309">observation returns as data</text>

  <!-- Harness strip -->
  <rect x="36" y="224" width="608" height="48" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2" rx="2"/>
  <text x="48" y="241" font-size="9" font-weight="700" fill="#0f172a">Harness around every step</text>
  <text x="48" y="256" font-size="8" fill="#475569">budgets and approval gate · write-ahead log and resume · compensation and loop detection</text>
  <text x="48" y="266" font-size="8" fill="#475569">trajectory record owned by the runtime</text>
  <rect x="566" y="233" width="66" height="18" fill="#6d28d9" rx="9"/>
  <text x="599" y="246" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Part IV</text>

  <!-- Acceptance -->
  <path d="M 340 284 V 302" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="190" y="306" width="300" height="44" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2" rx="2"/>
  <text x="206" y="324" font-size="9" font-weight="700" fill="#0f172a">Acceptance: sealed checks, not the agent's report</text>
  <text x="206" y="340" font-size="8" fill="#475569">traces · repeated-run evidence · release gates</text>
  <rect x="424" y="330" width="58" height="16" fill="#6d28d9" rx="8"/>
  <text x="453" y="341" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">Part IV</text>

  <!-- Across-task learning -->
  <path d="M 250 350 V 370" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="258" y="364" font-size="8" fill="#6d28d9">verified trajectories</text>
  <rect x="20" y="374" width="310" height="62" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <rect x="20" y="374" width="310" height="22" fill="#e2e8f0" rx="2"/>
  <text x="32" y="389" font-size="9" font-weight="700" fill="#0f172a">Learning · across tasks · hours to days</text>
  <text x="32" y="410" font-size="8" fill="#475569">curate → fine-tune → optimize against verifiers</text>
  <text x="32" y="424" font-size="8" fill="#475569">new model returns to Part I through the release gates</text>
  <text x="318" y="389" text-anchor="end" font-size="8" font-weight="700" fill="#0f172a">Part V</text>

  <!-- Scale -->
  <rect x="350" y="374" width="310" height="62" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <rect x="350" y="374" width="310" height="22" fill="#e2e8f0" rx="2"/>
  <text x="362" y="389" font-size="9" font-weight="700" fill="#0f172a">Scale · across agents and trajectories</text>
  <text x="362" y="410" font-size="8" fill="#475569">split only when the coordination tax pays</text>
  <text x="362" y="424" font-size="8" fill="#475569">price and provision per accepted task</text>
  <text x="648" y="389" text-anchor="end" font-size="8" font-weight="700" fill="#0f172a">Part VI</text>
</svg>
