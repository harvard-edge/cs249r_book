<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="530" fill="#ffffff"/>
  <g transform="translate(-20,0)">

  <!-- Task contract: the specification the trajectory starts from -->
  <rect x="180" y="20" width="320" height="50" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="2"/>
  <text x="196" y="41" font-size="14" font-weight="700" fill="#0f172a">Task contract</text>
  <text x="196" y="59" font-size="12" fill="#475569">adopted by an authorized owner</text>
  <text x="486" y="41" text-anchor="end" font-size="12" fill="#475569">Part VII</text>

  <!-- Contract governs the loop -->
  <path d="M 340 70 V 98" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="350" y="89" font-size="12" fill="#475569">governs</text>

  <!-- Harness wraps the whole loop -->
  <rect x="80" y="100" width="520" height="250" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="100" y="124" font-size="14" font-weight="700" fill="#6d28d9">Harness around every step</text>
  <text x="580" y="124" text-anchor="end" font-size="12" fill="#6d28d9">Part IV</text>
  <text x="100" y="142" font-size="12" fill="#475569">budgets · approval gate · durable log · recovery</text>

  <!-- Live loop: four stages arranged as a cycle -->
  <!-- Context assembly (top left) -->
  <rect x="120" y="170" width="180" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="2"/>
  <text x="210" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Context assembly</text>
  <text x="210" y="213" text-anchor="middle" font-size="12" fill="#15803d">Part II</text>

  <!-- Model call (top right) -->
  <rect x="380" y="170" width="180" height="56" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" rx="2"/>
  <text x="470" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Model call</text>
  <text x="470" y="213" text-anchor="middle" font-size="12" fill="#0369a1">Part I</text>

  <!-- Tool call (bottom right) -->
  <rect x="380" y="276" width="180" height="56" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" rx="2"/>
  <text x="470" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Tool call</text>
  <text x="470" y="319" text-anchor="middle" font-size="12" fill="#b45309">Part III</text>

  <!-- Sandbox (bottom left) -->
  <rect x="120" y="276" width="180" height="56" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" rx="2"/>
  <text x="210" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Sandbox</text>
  <text x="210" y="319" text-anchor="middle" font-size="12" fill="#b45309">Part III</text>

  <!-- Cycle edges -->
  <path d="M 300 198 H 378" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <path d="M 470 226 V 274" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="482" y="255" font-size="12" fill="#475569">proposal</text>
  <path d="M 380 304 H 302" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M 210 276 V 228" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="198" y="249" text-anchor="end" font-size="12" fill="#b45309">observation</text>
  <text x="198" y="264" text-anchor="end" font-size="12" fill="#b45309">as data</text>

  <!-- Harness checkpoints intercept every edge -->
  <rect x="336" y="190" width="6" height="16" fill="#7c3aed"/>
  <rect x="462" y="247" width="16" height="6" fill="#7c3aed"/>
  <rect x="338" y="296" width="6" height="16" fill="#7c3aed"/>
  <rect x="202" y="249" width="16" height="6" fill="#7c3aed"/>

  <!-- Trajectory leaves the loop for acceptance -->
  <path d="M 340 350 V 378" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="350" y="369" font-size="12" fill="#475569">settled outcome</text>

  <!-- Acceptance: the second bookend -->
  <rect x="180" y="380" width="320" height="50" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="2"/>
  <text x="196" y="401" font-size="14" font-weight="700" fill="#0f172a">Acceptance</text>
  <text x="196" y="419" font-size="12" fill="#475569">scoped evidence, not the agent's report</text>
  <text x="486" y="401" text-anchor="end" font-size="12" fill="#475569">Part IV</text>

  <!-- Acceptance is judged against the adopted contract -->
  <path d="M 500 45 H 640 V 405 H 502" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="630" y="225" text-anchor="end" font-size="12" fill="#475569" transform="rotate(-90 630 225)" dx="0">checked against</text>

  <!-- Optional lifecycle choices, not entered on this task -->
  <path d="M 260 430 V 462" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-light)"/>
  <text x="252" y="451" text-anchor="end" font-size="12" fill="#64748b">if chosen</text>
  <rect x="120" y="464" width="200" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" rx="2"/>
  <text x="136" y="484" font-size="13" font-weight="700" fill="#475569">Learning</text>
  <text x="304" y="484" text-anchor="end" font-size="12" fill="#64748b">Part V</text>
  <text x="136" y="501" font-size="12" fill="#64748b">optional, across tasks</text>

  <rect x="360" y="464" width="200" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" rx="2"/>
  <text x="376" y="484" font-size="13" font-weight="700" fill="#475569">Scale</text>
  <text x="544" y="484" text-anchor="end" font-size="12" fill="#64748b">Part VI</text>
  <text x="376" y="501" font-size="12" fill="#64748b">optional, across agents</text>
  </g>
</svg>
