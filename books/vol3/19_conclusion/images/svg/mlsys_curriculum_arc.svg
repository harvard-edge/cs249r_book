        <text x="456" y="24" font-size="7.2" font-weight="700" fill="#581C87">Trajectory (~10¹..10⁴ s)</text>
        <text x="680" y="24" font-size="7.0" fill="#0F172A">Sensorimotor Cycle (~10⁻² s)</text>
      </g>

      <!-- ============================================================= -->
      <!-- ROW 2: PRIMARY ABSTRACTION                                    -->
      <!-- ============================================================= -->
      <g transform="translate(0, 84)">
        <text x="10" y="24" font-size="7.2" font-weight="700" fill="#334155">Core Abstraction</text>
        <text x="148" y="18" font-size="7.0" fill="#0F172A">Static Compute DAG</text>
        <text x="148" y="30" font-size="6.8" fill="#64748B">Stateless Tensor Fused Ops</text>
        <text x="302" y="18" font-size="7.0" fill="#0F172A">3D Mesh (TP/PP/DP)</text>
        <text x="302" y="30" font-size="6.8" fill="#64748B">PagedAttention KV Blocks</text>
        <text x="456" y="18" font-size="7.2" font-weight="700" fill="#581C87">Agent Control Block (ACB)</text>
        <text x="456" y="30" font-size="6.8" fill="#581C87">Radix Prefix Tree + Sagas</text>
        <text x="680" y="18" font-size="7.0" fill="#0F172A">Cyber-Physical Loop</text>
        <text x="680" y="30" font-size="6.8" fill="#64748B">Sensorimotor Policy Kernel</text>
      </g>

      <!-- ============================================================= -->
      <!-- ROW 3: GOVERNING PHYSICS                                      -->
      <!-- ============================================================= -->
      <g transform="translate(0, 126)">
        <text x="10" y="24" font-size="7.2" font-weight="700" fill="#334155">Governing Law</text>
        <text x="148" y="18" font-size="7.0" fill="#0F172A">Roofline Model</text>
        <text x="148" y="30" font-size="6.8" fill="#64748B">I = FLOP/Byte intensity</text>
        <text x="302" y="18" font-size="7.0" fill="#0F172A">Bisection Bandwidth</text>
        <text x="302" y="30" font-size="6.8" fill="#64748B">Pipeline Bubble F_bubble</text>
        <text x="456" y="18" font-size="7.2" font-weight="700" fill="#581C87">Error Compounding (p^H)</text>
        <text x="456" y="30" font-size="6.8" fill="#581C87">Action Reversibility A⁻¹</text>
        <text x="680" y="18" font-size="7.0" fill="#0F172A">Real-Time Deadlines (τ)</text>
        <text x="680" y="30" font-size="6.8" fill="#64748B">Newtonian Safety Dynamics</text>
      </g>

