      <!-- ROW 4: SYSTEMS TRIAD                                          -->
      <!-- ============================================================= -->
      <g transform="translate(0, 168)">
        <text x="10" y="24" font-size="7.2" font-weight="700" fill="#334155">Systems Triad</text>
        <text x="148" y="18" font-size="7.0" fill="#0F172A">D · A · M</text>
        <text x="148" y="30" font-size="6.8" fill="#64748B">Data, Algorithm, Model</text>
        <text x="302" y="18" font-size="7.0" fill="#0F172A">C³ Tradeoff</text>
        <text x="302" y="30" font-size="6.8" fill="#64748B">Compute, Comm, Capacity</text>
        <text x="456" y="18" font-size="7.2" font-weight="700" fill="#581C87">H · S · A · C</text>
        <text x="456" y="30" font-size="6.8" fill="#581C87">Horizon, State, Auth, Check</text>
        <text x="680" y="18" font-size="7.0" fill="#0F172A">S · A · E</text>
        <text x="680" y="30" font-size="6.8" fill="#64748B">Sensation, Actuation, Energy</text>
      </g>

      <!-- ============================================================= -->
      <!-- ROW 5: PHYSICAL BOTTLENECK                                    -->
      <!-- ============================================================= -->
      <g transform="translate(0, 210)">
        <text x="10" y="24" font-size="7.2" font-weight="700" fill="#334155">Physical Wall</text>
        <text x="148" y="18" font-size="7.0" fill="#991B1B">HBM Memory Bandwidth</text>
        <text x="148" y="30" font-size="6.8" fill="#64748B">SRAM register spills</text>
        <text x="302" y="18" font-size="7.0" fill="#991B1B">Inter-Node Fabric Skew</text>
        <text x="302" y="30" font-size="6.8" fill="#64748B">KV capacity stranding</text>
        <text x="456" y="18" font-size="7.2" font-weight="700" fill="#991B1B">Context Pollution &amp; Rot</text>
        <text x="456" y="30" font-size="6.8" fill="#581C87">Irreversible environment side-fx</text>
        <text x="680" y="18" font-size="7.0" fill="#991B1B">Actuator Latency Jitter</text>
        <text x="680" y="30" font-size="6.8" fill="#64748B">Physical catastrophic damage</text>
      </g>

      <!-- ============================================================= -->
      <!-- ROW 6: FAULT MODEL & GUARANTEES                               -->
      <!-- ============================================================= -->
      <g transform="translate(0, 252)">
        <text x="10" y="24" font-size="7.2" font-weight="700" fill="#334155">Fault Model</text>
        <text x="148" y="18" font-size="7.0" fill="#0F172A">Fail-Stop (IEEE 754)</text>
        <text x="148" y="30" font-size="6.8" fill="#64748B">NaN / Inf bit corruption</text>
        <text x="302" y="18" font-size="7.0" fill="#0F172A">Byzantine Stragglers</text>
        <text x="302" y="30" font-size="6.8" fill="#64748B">Heartbeat &amp; node restarts</text>
        <text x="456" y="18" font-size="7.2" font-weight="700" fill="#581C87">Fail-Plausible Drift</text>
        <text x="456" y="30" font-size="6.8" fill="#581C87">Exit 0 while invariants violate</text>
        <text x="680" y="18" font-size="7.0" fill="#0F172A">Fail-Safe Emergency Stop</text>
        <text x="680" y="30" font-size="6.8" fill="#64748B">Watchdog clamp &amp; brake</text>
      </g>

      <!-- ============================================================= -->
      <!-- ROW 7: CAPSTONE INVARIANT                                     -->
      <!-- ============================================================= -->
      <g transform="translate(0, 298)">
        <text x="10" y="24" font-size="7.2" font-weight="700" fill="#334155">Core Invariant</text>
        <text x="148" y="24" font-size="7.0" fill="#0F172A">Kernel Determinism</text>
        <text x="302" y="24" font-size="7.0" fill="#0F172A">Exact Weight Consistency</text>
        <text x="456" y="24" font-size="7.2" font-weight="700" fill="#581C87">Invariant Closure Principle</text>
        <text x="680" y="24" font-size="7.0" fill="#0F172A">Physical Safety Enclosure</text>
      </g>
