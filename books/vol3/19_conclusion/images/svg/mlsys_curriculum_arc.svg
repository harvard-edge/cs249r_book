<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%"
     font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace">
  <!-- Clean White Canvas -->
  <rect width="960" height="420" fill="#FFFFFF"/>

  <!-- Main Container Frame -->
  <g transform="translate(20, 16)">
    <rect width="920" height="388" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <rect width="920" height="24" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0F172A">MACHINE LEARNING SYSTEMS CURRICULUM ARCHITECTURE: THE FOUR-VOLUME PROGRESSION</text>

    <!-- Matrix Table Structure -->
    <g transform="translate(12, 32)">
      <!-- Row Background Bands -->
      <!-- Row 0: Header (Vol Titles) -->
      <rect x="0" y="0" width="896" height="42" rx="1" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
      <!-- Vol III Highlight Column Background -->
      <rect x="448" y="0" width="224" height="344" rx="1" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>

      <!-- Column Dividers -->
      <line x1="140" y1="0" x2="140" y2="344" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="294" y1="0" x2="294" y2="344" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="448" y1="0" x2="448" y2="344" stroke="#581C87" stroke-width="1.2"/>
      <line x1="672" y1="0" x2="672" y2="344" stroke="#581C87" stroke-width="1.2"/>

      <!-- Horizontal Row Lines -->
      <line x1="0" y1="42" x2="896" y2="42" stroke="#CBD5E1" stroke-width="0.8"/>
      <line x1="0" y1="84" x2="896" y2="84" stroke="#E2E8F0" stroke-width="0.8"/>
      <line x1="0" y1="126" x2="896" y2="126" stroke="#E2E8F0" stroke-width="0.8"/>
      <line x1="0" y1="168" x2="896" y2="168" stroke="#E2E8F0" stroke-width="0.8"/>
      <line x1="0" y1="210" x2="896" y2="210" stroke="#E2E8F0" stroke-width="0.8"/>
      <line x1="0" y1="252" x2="896" y2="252" stroke="#E2E8F0" stroke-width="0.8"/>
      <line x1="0" y1="298" x2="896" y2="298" stroke="#E2E8F0" stroke-width="0.8"/>
      <line x1="0" y1="344" x2="896" y2="344" stroke="#0F172A" stroke-width="1.2"/>

      <!-- ============================================================= -->
      <!-- HEADER ROW: VOLUMES                                           -->
      <!-- ============================================================= -->
      <!-- Label Header -->
      <text x="10" y="24" font-size="7.5" font-weight="700" fill="#334155">DIMENSION</text>

      <!-- Vol I -->
      <g transform="translate(148, 8)">
        <text x="0" y="12" font-size="7.8" font-weight="700" fill="#0F172A">Volume I: The Model</text>
        <text x="0" y="24" font-size="6.8" fill="#64748B">Single-Node ML Systems</text>
      </g>

      <!-- Vol II -->
      <g transform="translate(302, 8)">
        <text x="0" y="12" font-size="7.8" font-weight="700" fill="#0F172A">Volume II: The Fleet</text>
        <text x="0" y="24" font-size="6.8" fill="#64748B">Distributed Training &amp; Serving</text>
      </g>

      <!-- Vol III (THIS VOLUME) -->
      <g transform="translate(456, 8)">
        <text x="0" y="12" font-size="8.2" font-weight="700" fill="#581C87">Volume III: Stochastic Computer</text>
        <text x="0" y="24" font-size="7.0" font-weight="700" fill="#6B21A8">Agentic Systems [This Text]</text>
      </g>

      <!-- Vol IV -->
      <g transform="translate(680, 8)">
        <text x="0" y="12" font-size="7.8" font-weight="700" fill="#0F172A">Volume IV: Physical AI</text>
        <text x="0" y="24" font-size="6.8" fill="#64748B">Embodied &amp; Real-Time ML</text>
      </g>

      <!-- ============================================================= -->
