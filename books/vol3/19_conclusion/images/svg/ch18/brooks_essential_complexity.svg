<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #1e293b; }
      .text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .tag { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; font-weight: 600; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .grid { stroke: #e2e8f0; stroke-width: 0.8; stroke-dasharray: 3,3; }
      .asymptote { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .curve-ideal { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .curve-audit { stroke: #d97706; stroke-width: 2; stroke-dasharray: 4,3; fill: none; }
      .curve-f80 { stroke: #059669; stroke-width: 2.2; fill: none; }
      .curve-f60 { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .curve-f40 { stroke: #7c3aed; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="arr-red-tiny" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1160" height="520" fill="#ffffff"/>

  <!-- PANEL A: Total Engineering Duration vs Accidental Acceleration -->
  <g transform="translate(30, 20)">
    <rect width="535" height="480" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="535" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text class="section-hdr" x="16" y="20">PANEL A: Turnaround Duration &amp; The Irreducible Essential Asymptote</text>

    <!-- Grid lines -->
    <line x1="65" y1="297" x2="495" y2="297" class="asymptote"/>
    <text x="500" y="300" class="tag" fill="#dc2626">T_ess = 48h</text>

    <line x1="65" y1="221" x2="495" y2="221" class="grid"/>
    <text x="35" y="225" class="mono" text-anchor="end">80h</text>

    <line x1="65" y1="127" x2="495" y2="127" class="grid"/>
    <text x="35" y="131" class="mono" text-anchor="end">120h</text>

    <!-- Axes -->
    <line x1="65" y1="80" x2="65" y2="410" class="axis"/>
    <line x1="65" y1="410" x2="495" y2="410" class="axis"/>

    <!-- Y ticks -->
    <text x="35" y="414" class="mono" text-anchor="end">0h</text>
    <text x="35" y="301" class="mono" fill="#dc2626" font-weight="700" text-anchor="end">48h</text>
    <text x="30" y="90" class="mono" font-weight="700">Total Hours (T)</text>

    <!-- X ticks -->
    <line x1="65" y1="410" x2="65" y2="416" class="axis"/>
    <text x="65" y="430" class="mono" text-anchor="middle">1×</text>

    <line x1="133" y1="410" x2="133" y2="416" class="axis"/>
    <text x="133" y="430" class="mono" text-anchor="middle">4×</text>

    <line x1="223" y1="410" x2="223" y2="416" class="axis"/>
    <text x="223" y="430" class="mono" text-anchor="middle">8×</text>

    <line x1="314" y1="410" x2="314" y2="416" class="axis"/>
    <text x="314" y="430" class="mono" text-anchor="middle">12×</text>

    <line x1="405" y1="410" x2="405" y2="416" class="axis"/>
    <text x="405" y="430" class="mono" text-anchor="middle">16×</text>

    <line x1="495" y1="410" x2="495" y2="416" class="axis"/>
    <text x="495" y="430" class="mono" text-anchor="middle">20×</text>

    <text x="280" y="452" class="mono" font-weight="700" text-anchor="middle">Accidental Acceleration Factor (S_acc)</text>

    <!-- Shaded region below T_ess: Essential Complexity -->
    <rect x="66" y="297" width="428" height="112" fill="#eff6ff" opacity="0.85"/>
    <text x="280" y="356" class="label-bold" fill="#1e40af" text-anchor="middle">Irreducible Essential Architecture: T_ess = 48 hours</text>
    <text x="280" y="374" class="text-regular" fill="#475569" text-anchor="middle">(State machines, MVCC invariants, crash recovery proofs, threat modeling)</text>

    <!-- Curve 1: T_ideal = 48 + 72 / S_acc -->
    <path d="M 65 127.1 L 87.6 212.0 L 110.3 240.3 L 132.9 254.4 L 155.5 262.9 L 178.2 268.6 L 223.4 275.6 L 268.7 279.9 L 313.9 282.7 L 404.5 286.3 L 495.0 288.4" class="curve-ideal"/>

    <!-- Curve 2: T_empirical = 48 + 72/S_acc + T_audit(S_acc) -->
    <path d="M 65 127.1 L 87.6 209.6 L 110.3 234.0 L 132.9 248.5 L 178.2 258.0 L 223.4 265.0 L 268.7 267.5 L 313.9 268.6 L 404.5 269.8 L 495.0 269.5" class="curve-audit"/>

    <!-- Annotations on Panel A -->
    <circle cx="65" cy="127.1" r="4" fill="#2563eb"/>
    <text x="75" y="122" class="tag" fill="#2563eb">Software 1.0 Baseline (120h)</text>

    <circle cx="313.9" cy="282.7" r="4" fill="#2563eb"/>
    <text x="320" y="316" class="tag" fill="#2563eb">Ideal S_acc = 12× (54h)</text>

    <circle cx="313.9" cy="268.6" r="4" fill="#d97706"/>
    <text x="320" y="254" class="tag" fill="#d97706">Empirical (+6h Verification Audit)</text>

    <text x="110" y="175" class="tag" fill="#dc2626">Accidental Friction Compresses</text>
    <path d="M 100 182 L 100 215" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red-tiny)"/>
  </g>

  <!-- PANEL B: Net Systems Speedup Ceiling (Amdahl's Law) -->
  <g transform="translate(595, 20)">
    <rect width="535" height="480" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="535" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text class="section-hdr" x="16" y="20">PANEL B: Net Speedup Ceilings Across Accidental Fractions</text>

    <!-- Amdahl Ceiling lines -->
    <line x1="65" y1="146" x2="495" y2="146" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="500" y="150" class="tag" fill="#059669">Limit: 5.0×</text>

    <line x1="65" y1="311" x2="495" y2="311" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="500" y="315" class="tag" fill="#2563eb">Limit: 2.5×</text>

    <line x1="65" y1="366" x2="495" y2="366" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="500" y="370" class="tag" fill="#7c3aed">Limit: 1.67×</text>

    <!-- Grid lines Y -->
    <line x1="65" y1="212" x2="495" y2="212" class="grid"/>
    <text x="45" y="216" class="mono" text-anchor="end">4.0×</text>
    <line x1="65" y1="278" x2="495" y2="278" class="grid"/>
    <text x="45" y="282" class="mono" text-anchor="end">3.0×</text>
    <line x1="65" y1="344" x2="495" y2="344" class="grid"/>
    <text x="45" y="348" class="mono" text-anchor="end">2.0×</text>

    <!-- Axes -->
    <line x1="65" y1="80" x2="65" y2="410" class="axis"/>
    <line x1="65" y1="410" x2="495" y2="410" class="axis"/>

    <!-- Y labels -->
    <text x="45" y="414" class="mono" text-anchor="end">1.0×</text>
    <text x="45" y="80" class="mono" font-weight="700">Net Speedup (S_net)</text>

    <!-- X ticks -->
    <line x1="65" y1="410" x2="65" y2="416" class="axis"/>
    <text x="65" y="430" class="mono" text-anchor="middle">1×</text>

    <line x1="133" y1="410" x2="133" y2="416" class="axis"/>
    <text x="133" y="430" class="mono" text-anchor="middle">4×</text>

    <line x1="223" y1="410" x2="223" y2="416" class="axis"/>
    <text x="223" y="430" class="mono" text-anchor="middle">8×</text>

    <line x1="314" y1="410" x2="314" y2="416" class="axis"/>
    <text x="314" y="430" class="mono" text-anchor="middle">12×</text>

    <line x1="405" y1="410" x2="405" y2="416" class="axis"/>
    <text x="405" y="430" class="mono" text-anchor="middle">16×</text>

    <line x1="495" y1="410" x2="495" y2="416" class="axis"/>
    <text x="495" y="430" class="mono" text-anchor="middle">20×</text>

    <text x="280" y="452" class="mono" font-weight="700" text-anchor="middle">Model Accidental Acceleration (S_acc)</text>

    <!-- Curve 1: f_acc = 0.80 -->
    <path d="M 65 410.0 L 87.6 366.0 L 110.3 334.6 L 132.9 311.0 L 178.2 278.0 L 223.4 256.0 L 268.7 240.3 L 313.9 228.5 L 404.5 212.0 L 495.0 201.0" class="curve-f80"/>
    <text x="310" y="192" class="tag" fill="#059669">f_acc = 0.80 (Boilerplate Heavy)</text>

    <!-- Curve 2: f_acc = 0.60 -->
    <path d="M 65 410.0 L 87.6 381.7 L 110.3 366.0 L 132.9 356.0 L 178.2 344.0 L 223.4 337.1 L 268.7 332.5 L 313.9 329.3 L 404.5 325.1 L 495.0 322.5" class="curve-f60"/>
    <text x="280" y="295" class="tag" fill="#2563eb">f_acc = 0.60 (LSM Tree Refactor)</text>

    <!-- Curve 3: f_acc = 0.40 -->
    <path d="M 65 410.0 L 87.6 393.5 L 110.3 386.0 L 132.9 381.7 L 178.2 377.0 L 223.4 374.5 L 268.7 372.9 L 313.9 371.8 L 404.5 370.4 L 495.0 369.5" class="curve-f40"/>
    <text x="260" y="358" class="tag" fill="#7c3aed">f_acc = 0.40 (Distributed State Machine)</text>

    <!-- Inset box explaining Amdahl Formula -->
    <g transform="translate(80, 85)">
      <rect width="250" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="mono" font-weight="700" fill="#0f172a">Amdahl's Engineering Law:</text>
      <text x="10" y="34" class="mono" fill="#2563eb">S_net = 1 / [(1 - f_acc) + f_acc / S_acc]</text>
    </g>
  </g>
</svg>