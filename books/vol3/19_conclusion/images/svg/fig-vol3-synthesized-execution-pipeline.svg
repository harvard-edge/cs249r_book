<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12.5px; fill: #0f172a; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11.5px; fill: #1e293b; }
      .text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #0f172a; }
      .metric-tag { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 9.5px; fill: #2563eb; }
      .invariant-tag { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 9.5px; fill: #047857; }
      .box-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .stage-hdr-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .stage-sub-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .arrow { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="540" fill="#ffffff"/>

  <!-- Top Ingress Bar -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text class="label-bold" x="16" y="21" fill="#1e40af">UNPRIVILEGED INPUT:</text>
    <text class="text-code" x="165" y="21">Prompt c_t ~ [Task Contract &lt;G, E, A, O, K&gt; | Working Context | Prior Observations]</text>
    <text class="metric-tag" x="1000" y="21" fill="#dc2626">Zero ambient authority</text>
  </g>

  <!-- 6 Pipelined Stages Layout: 2 rows of 3 stages -->
  <!-- ROW 1: Stages 1, 2, 3 -->
  <!-- Stage 1 -->
  <g transform="translate(30, 70)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">STAGE 1: MODEL PROPOSAL &amp; GRAMMAR MASK</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Logit-Level Pushdown Automaton</text>
      <text class="text-regular" x="10" y="32">Applies bitmask M_t to logits prior to softmax</text>
      <text class="metric-tag" x="10" y="44">Zero Syntax Errors: Output in L(G)</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Deterministic Action Frame Generation</text>
      <text class="text-code" x="10" y="32">Emits: {tool: "fs_write", path: "src/lock.c"}</text>
      <text class="text-regular" x="10" y="44">Held in unprivileged memory escrow</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Invariant: Schema conformance verified at decode</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="390" y1="172" x2="418" y2="172" class="arrow"/>

  <!-- Stage 2 -->
  <g transform="translate(420, 70)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">STAGE 2: CAPABILITY &amp; AUTHORITY GATE</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Cryptographic Capability Token Check</text>
      <text class="text-regular" x="10" y="32">Validates macaroons / HMAC grants against tool ID</text>
      <text class="metric-tag" x="10" y="44">Attenuated Permissions: Read/Write Mask</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Budget &amp; Escrow Reservation Check</text>
      <text class="text-code" x="10" y="32">Assert: C(t) + R_turn &lt;= B_task (Monotonic Ledger)</text>
      <text class="text-regular" x="10" y="44">Rejects action if balance depleted</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Invariant: Complete mediation (Saltzer &amp; Kaashoek)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="780" y1="172" x2="808" y2="172" class="arrow"/>

  <!-- Stage 3 -->
  <g transform="translate(810, 70)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">STAGE 3: WRITE-AHEAD INTENT LOG (WAL)</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Synchronous Pre-Execution fsync</text>
      <text class="text-regular" x="10" y="32">Appends intent record to disk before network dispatch</text>
      <text class="metric-tag" x="10" y="44">Monotonic LSN: LSN_(t+1) = LSN_t + 1</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Crash-Consistent Trajectory State</text>
      <text class="text-code" x="10" y="32">Payload: &lt;LSN, turn_t, action_id, args, prev_hash&gt;</text>
      <text class="text-regular" x="10" y="44">Enables exact point-in-time replay</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Invariant: Persistence before external side-effect</text>
  </g>

  <!-- Connecting Snake Arrow: Stage 3 (right) down to Stage 4 (left) -->
  <path d="M 990 275 L 990 293 L 210 293 L 210 310" class="arrow"/>

  <!-- ROW 2: Stages 4, 5, 6 -->
  <!-- Stage 4 -->
  <g transform="translate(30, 312)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">STAGE 4: ISOLATED SANDBOX ACTUATION</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Hypervisor / MicroVM Containment</text>
      <text class="text-regular" x="10" y="32">Firecracker microVM / gVisor with seccomp-bpf filter</text>
      <text class="metric-tag" x="10" y="44">Network: Dedicated netns | Rootfs: Read-Only Overlay</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Deterministic Execution Quotas</text>
      <text class="text-code" x="10" y="32">Enforces: T_tool &lt;= 30s, RAM &lt;= 4GB, CPU &lt;= 2 cores</text>
      <text class="text-regular" x="10" y="44">SIGKILL emitted on quota overrun</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Invariant: Zero host privilege escalation</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="390" y1="414" x2="418" y2="414" class="arrow"/>

  <!-- Stage 5 -->
  <g transform="translate(420, 312)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">STAGE 5: OBSERVATION SANITIZATION</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Payload Truncation &amp; ANSI Stripping</text>
      <text class="text-regular" x="10" y="32">Clamps stdout/stderr to S_obs &lt;= K_max tokens</text>
      <text class="metric-tag" x="10" y="44">Context Protection: Prevents OOM &amp; Buffer Churn</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">W ⊕ X Prompt Injection Firewall</text>
      <text class="text-code" x="10" y="32">Wraps raw output in typed status envelope: [OK | ERR]</text>
      <text class="text-regular" x="10" y="44">External text never treated as executable prompt</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Invariant: W ⊕ X context protection barrier</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="780" y1="414" x2="808" y2="414" class="arrow"/>

  <!-- Stage 6 -->
  <g transform="translate(810, 312)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">STAGE 6: COMPENSATING SAGA REGISTRATION</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Dual Forward &amp; Compensating Ledger</text>
      <text class="text-regular" x="10" y="32">Every forward action A_i registers inverse action C_i</text>
      <text class="metric-tag" x="10" y="44">Example: fs_write(X) -&gt; fs_restore(backup_X)</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Verified Transaction Commit / Rollback</text>
      <text class="text-code" x="10" y="32">If oracle succeeds: Commit; Else: Execute C_k..C_1</text>
      <text class="text-regular" x="10" y="44">Guarantees state consistency upon abort</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Invariant: Semantic atomicity (Garcia-Molina)</text>
  </g>
</svg>