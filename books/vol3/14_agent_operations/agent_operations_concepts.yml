    - id: vol3.field.trace.diagnosis
      source: vol3.trace
      predicate: provides observations for
      target: vol3.diagnosis
      explanation: Controlled diagnostic experiments vary suspected causes; correlated traces identify where
        such interventions should be applied.
      conditions: A trace or replay can localize a divergence without independently establishing its cause.
      status: draft
      evidence:
        section: sec-vol3-evaluation-postmortems
        quote: When verdict-aware retention preserves the failed connection-pool repair trial of `candidate_v2`
          (@sec-vol3-operations-introduction), the retained trace shows the search response ending in the
          middle of a source excerpt with no truncation notice, even though the bounded-observation contract
          requires one, followed by a model response that proposes replacing a file outside the permitted
          repair scope. The runtime rejects that proposal before dispatch. While the execution trace pinpoints
          where the observation was cut short and where the runtime blocked the illegal operation, it cannot
          reveal whether a complete observation would have produced an accepted repair. An incident postmortem[^fn-blameless-postmortem-evaluation]
          connects such telemetry to a testable explanation and a scoped corrective change.
    - id: vol3.field.release.acceptance
      source: vol3.release
      predicate: requires evidence about
      target: vol3.acceptance
      explanation: A release gate combines acceptance evidence with declared budgets and safety obligations.
      conditions: A release rule must bind the task population and current system versions.
      status: draft
      evidence:
        section: sec-vol3-evaluation-synthesis-math
        quote: 'Even if `candidate_v2` ran faster or cheaper than `baseline_v1`, a release gate cannot let
          a gain in latency or cost override an inconclusive acceptance comparison where the lower limit
          of the paired interval drops below the permissible degradation threshold $-\NoninferiorityTolerance$.
          That empirical evidence establishes neither noninferiority nor superiority: the interval does
          not rule out the specified unacceptable loss, and it does not establish that `candidate_v2` is
          inferior either. An inconclusive observed interval also does not by itself determine the study''s
          planned power. The planning count in @sec-vol3-evaluation-paired is about `{python} PairedAcceptance.n_if_gain_holds_str`
          paired evaluations if the observed advantage persists, and even that count clears the gate with
          only roughly even odds. A powered next sample therefore uses the paired-variance planning approximation
          in @sec-vol3-evaluation-rigor, with its gain, discordance, and tolerance fixed in advance.'
    - id: vol3.field.trace.trajectory
      source: vol3.trace
      predicate: records the course of
      target: vol3.trajectory
      explanation: Trace records retain the operation, source, timing, and accounting context needed to
        reconstruct a trajectory.
      conditions: Retention and redaction policies can limit replay fidelity and disclosed detail.
      status: draft
      evidence:
        section: sec-vol3-evaluation-tracing-fields
        quote: Preserving input manifests and span records helps little if each service emits unstandardized
          telemetry tags that omit which trial, candidate revision, transport attempt, or truncation policy
          produced an observation. An evaluation harness instead requires a disciplined, minimal schema
          that links experimental parameters directly to runtime and network observations. @Tbl-vol3-trace-evidence-fields
          organizes the essential fields into five functional categories. The attribute names may follow
          a standard such as the OpenTelemetry semantic conventions; the five groups are the minimal information
          required to diagnose agent behavior.
