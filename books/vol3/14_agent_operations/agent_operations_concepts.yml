  generated_date: '2026-10-13'
  primary_concepts:
    - Trajectory traces
    - Trace retention
    - Postmortem by intervention
    - Staged release
    - Release gate
  secondary_concepts:
    - Critical path
    - Empirical safety case
  claims:
    Trajectory traces: Spans bind every model call, mediated tool execution, and check to their trial and artifact,
      but a diagnostic trace may sample or drop and never replaces the durable recovery log or the verdict record.
    Trace retention: Sampling may thin diagnostic detail but never the accounting record of admitted trials, verdicts,
      spend, and drops, and retention is chosen per verdict under storage and privacy budgets.
    Postmortem by intervention: An agent incident is diagnosed by keeping findings separated by boundary and testing
      each with a controlled intervention on the recorded trajectory, not by naming one culprit.
    Staged release: Release exposure is staged so each stage answers its own question (offline gate, shadow execution,
      bounded canary), with sequential monitoring and hard tripwires that stop admission.
    Release gate: A release decision is a declared conjunctive rule written before data and applied to an evidence
      record that keeps verdicts, paired cohorts, and diagnostics.
    Critical path: The longest chain of dependent operations recorded in the trace is measured from span timing,
      and only work on it can shorten the trajectory.
    Empirical safety case: Release is justified by a scoped, inspectable safety case of claim, argument, evidence,
      assumptions, and residual uncertainty, and evidence for one claim does not establish the others.
