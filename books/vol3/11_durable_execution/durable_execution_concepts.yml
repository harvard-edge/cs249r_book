  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.log
      label: Trajectory log
      teaches: Trajectory log
      summary: An append-only recovery record retains operation identities, admissions, observed results,
        and obligations across the declared failure domain.
      section: sec-vol3-persistence-event-sourcing
    - id: vol3.intent
      label: Durable intent
      teaches: Durable intent before dispatch
      summary: A durable pre-dispatch record preserves admitted operation identity and outstanding liability;
        it does not prove a remote effect happened.
      section: sec-vol3-persistence-wal
    - id: vol3.checkpoint
      label: Recovery checkpoint
      teaches: Checkpoint binding
      summary: A consistent local state snapshot is bound to a log position and compatible environment;
        external effects still require reconciliation.
      section: sec-vol3-persistence-checkpointing
    relationships:
    - id: vol3.field.operation.settlement
      source: vol3.operation
      predicate: correlates evidence for
      target: vol3.settlement
      explanation: Settlement evidence must bind to the intended logical operation, not merely to an uncorrelated
        response.
      conditions: Stable identifiers prevent duplicate effects only when the endpoint implements the promised
        repeat contract.
      status: draft
      evidence:
        section: sec-vol3-durable-execution-effect-reconciliation
        quote: When the inbox holds no settling record for `test_r18`, the worker queries the tool endpoint
          directly to recover the job and its execution output by reconciliation, a bounded status query
          by logical operation identity under the tool's contract. If the endpoint returns a verified completion
          record, that result confirms the status of `ws_r18` for that specific test run, though it does
          not imply that the broader repair objective has been met. If the endpoint cannot be reached or
          returns an ambiguous status, the operation remains in doubt. In that situation, the endpoint retry
          contract, rather than the absence of a response or a matching identifier, governs whether launching
          another attempt is safe.
    - id: vol3.field.log.intent
      source: vol3.log
      predicate: persists
      target: vol3.intent
      explanation: The runtime commits an operation intent before exposing an external effect to the dispatch
        boundary.
      conditions: Durability is defined relative to a specified failure domain; a local flush may not survive
        host loss.
      status: draft
      evidence:
        section: sec-vol3-persistence-wal
        quote: Recording the admitted request durably before dispatching it is classical **write-ahead logging**\index{Write-ahead
          logging!definition} applied to trajectory dispatch. A durable history ensures that recovery can
          identify every external operation that may have begun, even if network partitions or crashes prevent
          the worker from ever receiving the reply. Under the runtime's declared failure model, an external
          mutation that occurs without a recoverable record of intent is a **phantom effect**\index{Phantom
          effect!definition}. Eliminating phantom effects requires two guarantees, strict write-ahead ordering
          in the runtime execution pipeline and a storage substrate that reliably outlives the failures
          the system claims to tolerate. Together they are the Part IV principle of intent before effect
          (principle \ref{pri-vol3-intent-before-effect}), whose ordering this section derives (@eq-vol3-wal-ordering)
          and whose storage half it prices.
    - id: vol3.field.intent.settlement
      source: vol3.intent
      predicate: does not establish
      target: vol3.settlement
      explanation: The pre-dispatch record proves that an operation was admitted, not that the remote service
        committed its effect.
      conditions: Recovery must reconcile any operation lacking authenticated correlated outcome evidence.
      status: draft
      evidence:
        section: sec-vol3-persistence-wal
        quote: '1. **Significance**: It converts a crash between dispatch and reply from an untracked phantom
          effect into an unresolved operation with an explicit owner, at the price of placing one durable
          acknowledgment on the critical path of every dispatch (@tbl-vol3-durable-ack-domains).

          2. **Distinction**: A durable intent records that work may have escaped into the external environment.
          It does not certify that the remote endpoint committed or executed the work, nor does it mandate
          that a recovered worker must re-execute it.

          3. **Common pitfall**: Taking an acknowledgment from storage that shares the failure boundary
          the design claims to survive, such as writing to a local scratch volume under a system contract
          that promises resilience against host or volume loss.'
    - id: vol3.field.checkpoint.log
      source: vol3.checkpoint
      predicate: binds restored state to
      target: vol3.log
      explanation: A recovery checkpoint is interpreted at its bound log frontier rather than mixed with
        arbitrary later records.
      conditions: The checkpoint and referenced environment must be compatible and complete for the promised
        restoration scope.
      status: draft
      evidence:
        section: sec-vol3-durable-execution-recovery-boundaries
        quote: If a runtime snapshots the control record at one instant and copies the workspace directory
          a few seconds later while a tool is writing files, restoring the pair produces a torn state. In
          a torn state, the record refers to file bytes that the snapshot lacks, or the reverse.[^fn-consistent-cut-checkpoint]
          A checkpoint must therefore freeze both halves at an authoritative log position $\CheckpointLogPosition$,
          mirroring the fold boundary $\LogPositionIndex$, rather than at a loose model turn. A checkpoint
          manifest serves as the formal contract for this boundary. It binds $\CheckpointLogPosition$ to
          the record snapshot, the workspace snapshot, references to external artifacts, cryptographic hashes
          for integrity, and the reducer schema versions required to interpret them. The control record
          snapshot captures cumulative resource consumption, active budget reservations, approval states,
          and in-flight operations with their identities and settlement owners. These obligations persist
          in the record even while a crashed agent awaits replacement.
    - id: vol3.field.checkpoint.settlement
      source: vol3.checkpoint
      predicate: does not replace
      target: vol3.settlement
      explanation: Restoring local state cannot reset already committed remote effects or remove their liability.
      conditions: Resumption reconciles effect and charge evidence before admitting dependent actions.
      status: draft
      evidence:
        section: sec-vol3-durable-execution-effect-reconciliation
        quote: Restoring the log leaves `test_r18` in doubt, and the remote test runner may have finished
          and reported its result while no worker was alive to receive it. To keep such callbacks from vanishing
          with the crashed process, durable execution moves the harness's result wakeup registrations out
          of worker memory into a durable result inbox that operates independently of any single host. The
          inbox retains authenticated completion records, indexed by trajectory identifier, logical operation,
          and attempt identity, and stamped with executor signatures and scope metadata for independent
          validation. The current trajectory owner ingests this evidence into the log and the `operation_table`.
          However, receiving an inbox message does not settle an operation. Pending statuses, gateway timeouts,
          and partial payloads leave the operation in doubt.
    maps: []
