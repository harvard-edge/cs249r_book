concept_map:
  schema_version: 2
  source: 11_durable_execution.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Failure-domain durability
    - Trajectory log
    - Durable intent before dispatch
    - Completeness rule
    - Checkpoint binding
    - Resume protocol
    - Record and replay
  secondary_concepts:
    - Checkpoint stride
    - First-divergence localization
    - Recovery retention
    - Fencing tokens
    - In-doubt action
  claims:
    Failure-domain durability: An acknowledgment is durable only against the faults its storage tier survives, so
      each write's durability is declared against a failure domain rather than assumed.
    Trajectory log: Recovery state comes from an append-only, typed trajectory log, and the live trajectory record
      is a deterministic fold over that log.
    Durable intent before dispatch: An admitted operation's identity, arguments, grant reference, and reservation
      must be durable under the declared failure domain before the request leaves, so no effect can exist without
      its intent on record.
    Completeness rule: Where a crash falls in the ordering decides whether an operation is not dispatched, in doubt,
      or established, and an absent intent proves non-dispatch only in a complete authoritative log prefix.
    Checkpoint binding: A checkpoint binds the record snapshot, workspace snapshot, artifacts, and reducer versions
      to one committed log position, captured as a consistent cut and published only after the state it references
      is durable.
    Resume protocol: Resume is an authorized continuation in ordered stages (prove the prefix, acquire ownership
      with a fencing epoch, restore by fold, reconcile in-doubt operations) rather than a restart.
    Record and replay: A sampled model reply cannot be regenerated, so reproduction substitutes recorded inputs
      at nondeterministic boundaries, and one recording serves time-travel inspection, harness regression, and counterfactual
      branching.
    Checkpoint stride: Young's interval prices checkpoints when a crash loses work to re-execute, and once each
      turn is logged the stride lengthens by the square root of the cost ratio because a crash costs reconstruction,
      not resampling.
    First-divergence localization: Debugging two executions steps boundary by boundary from a verified checkpoint
      to the first mismatch under a declared equivalence, because every later difference may be a consequence.
    Recovery retention: Current recovery, historical replay, and diagnostics need different artifacts on independent
      schedules, so retention is derived from the declared recovery and replay promise, not storage convenience.
    Fencing tokens: A monotonically increasing owner epoch checked at the resource rejects writes from a stalled
      holder that outlives its lease, because lease expiry alone is not exclusion.
    In-doubt action: An admitted operation whose effect cannot be proven present or absent is in doubt and must
      be reconciled before any re-dispatch, the recovery-side view of an uncertain outcome.
