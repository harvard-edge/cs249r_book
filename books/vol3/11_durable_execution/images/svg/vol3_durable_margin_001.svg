  <text x="105" y="96" text-anchor="middle" font-size="11" fill="#6D28D9" font-weight="bold">flush</text>
  <line x1="140" y1="22" x2="140" y2="86" stroke="#0F172A" stroke-width="1.4" stroke-dasharray="3,2"/>
  <text x="140" y="18" text-anchor="middle" font-size="11" fill="#0F172A">ack</text>
  <circle cx="16" cy="60.0" r="3" fill="#0F172A"/>
  <line x1="19" y1="60.0" x2="140" y2="60.0" stroke="#6D28D9" stroke-width="2.2"/>
  <circle cx="30" cy="52.5" r="3" fill="#0F172A"/>
