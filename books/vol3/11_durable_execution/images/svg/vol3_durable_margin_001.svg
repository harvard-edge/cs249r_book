<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="164" height="136" fill="#ffffff"/>
