<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="740" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ===== Regions either side of the durability barrier ===== -->
  <text x="207" y="32" font-size="12" font-style="italic" fill="#475569" text-anchor="middle">runtime can still withhold</text>
  <text x="539" y="32" font-size="12" font-style="italic" fill="#475569" text-anchor="middle">request may have left</text>

  <!-- ===== Ordered events (log records violet, external action amber) ===== -->
  <!-- e_prop -->
  <rect x="40" y="50" width="90" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="85" y="74" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">prop</tspan></text>
  <text x="85" y="95" font-size="12" fill="#334155" text-anchor="middle">proposal</text>
  <!-- e_auth -->
  <rect x="156" y="50" width="90" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="201" y="74" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">auth</tspan></text>
  <text x="201" y="95" font-size="12" fill="#334155" text-anchor="middle">admission</text>
  <!-- e_flush -->
  <rect x="272" y="50" width="90" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="317" y="74" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">flush</tspan></text>
  <text x="317" y="95" font-size="12" fill="#334155" text-anchor="middle">intent ack</text>
  <!-- a_ext -->
  <rect x="388" y="50" width="90" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="433" y="74" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan font-size="12" dy="3">ext</tspan></text>
  <text x="433" y="95" font-size="12" fill="#334155" text-anchor="middle">dispatch</text>
  <!-- e_obs -->
  <rect x="504" y="50" width="90" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="549" y="74" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">obs</tspan></text>
  <text x="549" y="95" font-size="12" fill="#334155" text-anchor="middle">evidence</text>

  <!-- Ordering arrows -->
  <line x1="130" y1="78" x2="154" y2="78" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="246" y1="78" x2="270" y2="78" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="362" y1="78" x2="386" y2="78" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="478" y1="78" x2="502" y2="78" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Time axis ===== -->
  <line x1="40" y1="150" x2="696" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="700" y="140" font-size="12" fill="#475569" text-anchor="end">time</text>
  <!-- Drop lines from the two state-changing events -->
  <line x1="317" y1="106" x2="317" y2="284" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2,3"/>
  <line x1="549" y1="106" x2="549" y2="284" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2,3"/>
  <circle cx="317" cy="150" r="3.5" fill="#7c3aed"/>
  <circle cx="549" cy="150" r="3.5" fill="#7c3aed"/>

  <text x="40" y="184" font-size="12" font-style="italic" fill="#475569">recovery state if the crash falls here</text>

  <!-- ===== Recovery-state bands ===== -->
  <!-- Before the acknowledgment -->
  <rect x="40" y="196" width="277" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="178" y="230" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Not dispatched</text>
  <text x="178" y="252" font-size="12" fill="#475569" text-anchor="middle">intent may be durable</text>
  <!-- In doubt: from the acknowledgment until adequate evidence -->
  <rect x="317" y="196" width="232" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="462" y="230" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">In doubt</text>
  <text x="462" y="252" font-size="12" fill="#7f1d1d" text-anchor="middle">withhold dependent work</text>
  <!-- After correlated evidence -->
  <rect x="549" y="196" width="151" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="624" y="230" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Established</text>
  <text x="624" y="252" font-size="12" fill="#166534" text-anchor="middle">per endpoint contract</text>

  <!-- ===== Durability barrier (drawn last: it cuts through the in-doubt band) ===== -->
  <line x1="375" y1="40" x2="375" y2="284" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="375" y="304" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">durability barrier</text>
</svg>
