<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="880" height="300" fill="#ffffff" rx="4"/>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Region labels either side of the durability barrier -->
  <text x="276" y="30" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">Runtime can still withhold the request</text>
  <text x="706" y="30" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">Request may have left runtime control</text>

  <!-- Durability barrier -->
  <line x1="532" y1="16" x2="532" y2="150" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,4"/>
  <rect x="477" y="122" width="110" height="18" rx="9" fill="#6d28d9"/>
  <text x="532" y="134.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">durability barrier</text>

  <!-- Station 1: e_prop (compute) -->
  <rect x="44" y="48" width="136" height="64" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="44" y="48" width="136" height="22" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="112" y="63" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">prop</tspan></text>
  <text x="112" y="94" font-size="8.5" fill="#475569" text-anchor="middle">Validated proposal</text>

  <!-- Station 2: e_auth (runtime / system) -->
  <rect x="208" y="48" width="136" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="208" y="48" width="136" height="22" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="276" y="63" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">auth</tspan></text>
  <text x="276" y="88" font-size="8.5" fill="#475569" text-anchor="middle">Admission and</text>
  <text x="276" y="100" font-size="8.5" fill="#475569" text-anchor="middle">reservation</text>

  <!-- Station 3: e_flush (storage) -->
  <rect x="372" y="48" width="136" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="372" y="48" width="136" height="22" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="440" y="63" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">flush</tspan></text>
  <text x="440" y="88" font-size="8.5" fill="#475569" text-anchor="middle">Intent acknowledged under</text>
  <text x="440" y="100" font-size="8.5" fill="#475569" text-anchor="middle">declared failure domain</text>

  <!-- Station 4: a_ext (actuation) -->
  <rect x="556" y="48" width="136" height="64" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <rect x="556" y="48" width="136" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="624" y="63" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan font-size="7.5" dy="2.5">ext</tspan></text>
  <text x="624" y="88" font-size="8.5" fill="#475569" text-anchor="middle">Dispatch,</text>
  <text x="624" y="100" font-size="8.5" fill="#475569" text-anchor="middle">not completion</text>

  <!-- Station 5: e_obs (log) -->
  <rect x="720" y="48" width="136" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="720" y="48" width="136" height="22" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="788" y="63" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">obs</tspan></text>
  <text x="788" y="88" font-size="8.5" fill="#475569" text-anchor="middle">Evidence recorded,</text>
  <text x="788" y="100" font-size="8.5" fill="#475569" text-anchor="middle">possibly pending</text>

  <!-- Ordering arrows -->
  <path d="M 180 91 H 207" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 344 91 H 371" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 508 91 H 555" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#arr-amber)"/>
  <path d="M 692 91 H 719" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#arr-gray)"/>

  <!-- Instant guides: acknowledgment and recorded evidence -->
  <line x1="440" y1="112" x2="440" y2="159" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="788" y1="112" x2="788" y2="159" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Crash-time zones on the timeline -->
  <text x="30" y="168" font-size="8.5" fill="#64748b" text-anchor="end">crash</text>
  <line x1="44" y1="165" x2="437" y2="165" stroke="#94a3b8" stroke-width="3"/>
  <line x1="443" y1="165" x2="785" y2="165" stroke="#dc2626" stroke-width="3"/>
  <line x1="791" y1="165" x2="856" y2="165" stroke="#16a34a" stroke-width="3"/>

  <!-- Crash markers -->
  <g>
    <circle cx="242" cy="165" r="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <path d="M 238 161 L 246 169 M 246 161 L 238 169" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="614" cy="165" r="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <path d="M 610 161 L 618 169 M 618 161 L 610 169" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="822" cy="165" r="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <path d="M 818 161 L 826 169 M 826 161 L 818 169" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Connectors from crash zones to recovery states -->
  <path d="M 242 173 V 188 H 172 V 204" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 614 173 V 188 H 450 V 204" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 822 173 V 188 H 728 V 204" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>

  <!-- Recovery state 1: no durable intent -->
  <rect x="44" y="205" width="256" height="80" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="44" y="205" width="256" height="22" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="172" y="220" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">No durable intent</text>
  <text x="172" y="244" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Not dispatched</text>
  <text x="172" y="259" font-size="8.5" fill="#475569" text-anchor="middle">Only in a complete authoritative prefix</text>
  <text x="172" y="273" font-size="8.5" fill="#475569" text-anchor="middle">Reconsider under current admission</text>

  <!-- Recovery state 2: in doubt -->
  <rect x="322" y="205" width="256" height="80" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="322" y="205" width="256" height="22" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="450" y="220" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Intent, no adequate evidence</text>
  <text x="450" y="244" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">In doubt: unresolved</text>
  <text x="450" y="259" font-size="8.5" fill="#475569" text-anchor="middle">Keep identity, liability, and owner</text>
  <text x="450" y="273" font-size="8.5" fill="#475569" text-anchor="middle">Withhold dependent work</text>

  <!-- Recovery state 3: outcome established -->
  <rect x="600" y="205" width="256" height="80" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="600" y="205" width="256" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="728" y="220" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Intent and correlated evidence</text>
  <text x="728" y="244" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Outcome established</text>
  <text x="728" y="259" font-size="8.5" fill="#475569" text-anchor="middle">To the extent the endpoint contract allows</text>
  <text x="728" y="273" font-size="8.5" fill="#475569" text-anchor="middle">Reuse within its candidate and scope</text>
</svg>
