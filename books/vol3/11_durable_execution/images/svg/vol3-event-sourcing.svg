<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="880" height="312" fill="#ffffff" rx="4"/>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ============ Top panel: runtime memory ============ -->
  <rect x="20" y="12" width="840" height="138" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="30" y="20" width="176" height="17" rx="2" fill="#e2e8f0"/>
  <text x="38" y="32" font-size="9" font-weight="700" fill="#334155">Runtime memory: lost on a crash</text>

  <!-- Initial record -->
  <rect x="40" y="48" width="190" height="82" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="40" y="48" width="190" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="135" y="63" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Initial record <tspan font-style="italic">R</tspan><tspan font-size="7.5" dy="2.5">0</tspan></text>
  <text x="135" y="92" font-size="8.5" fill="#475569" text-anchor="middle">Task, grants, and limits</text>
  <text x="135" y="108" font-size="8.5" fill="#475569" text-anchor="middle">No admitted operations</text>

  <!-- Reducer -->
  <rect x="330" y="48" width="220" height="82" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="330" y="48" width="220" height="22" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="440" y="63" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Deterministic reducer</text>
  <text x="440" y="90" font-size="9" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">apply(R, e) per event</text>
  <text x="440" y="108" font-size="8.5" fill="#475569" text-anchor="middle">No model call, no tool call</text>

  <!-- Reconstructed record -->
  <rect x="650" y="48" width="190" height="82" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="650" y="48" width="190" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="745" y="63" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Reconstructed record <tspan font-style="italic">R</tspan><tspan font-size="7.5" dy="2.5">t</tspan></text>
  <text x="745" y="88" font-size="8.5" fill="#475569" text-anchor="middle">Admission and reservation held</text>
  <rect x="671" y="97" width="148" height="18" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="745" y="109.5" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle"><tspan font-family="Courier New, monospace">test_r18</tspan>: unresolved</text>

  <!-- Record flow -->
  <path d="M 230 89 H 329" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 550 89 H 649" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#arr-gray)"/>

  <!-- Fold path from the log into the reducer -->
  <path d="M 440 186 V 131" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)"/>
  <text x="450" y="169" font-size="8.5" fill="#6d28d9">fold in sequence order</text>

  <!-- ============ Bottom panel: trajectory log ============ -->
  <rect x="20" y="186" width="840" height="114" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="30" y="194" width="200" height="17" rx="2" fill="#e2e8f0"/>
  <text x="38" y="206" font-size="9" font-weight="700" fill="#334155">Trajectory log: durable, append-only</text>

  <!-- e1 -->
  <rect x="40" y="222" width="116" height="62" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
  <rect x="40" y="222" width="116" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="98" y="236" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">1</tspan></text>
  <text x="98" y="259" font-size="8.5" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">TaskStarted</text>
  <text x="98" y="274" font-size="8" fill="#475569" text-anchor="middle">task and grants</text>

  <!-- e2 -->
  <rect x="172" y="222" width="116" height="62" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
  <rect x="172" y="222" width="116" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="230" y="236" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">2</tspan></text>
  <text x="230" y="259" font-size="8.5" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">ContextBuilt</text>
  <text x="230" y="274" font-size="8" fill="#475569" text-anchor="middle">delivered inputs</text>

  <!-- e3 -->
  <rect x="304" y="222" width="116" height="62" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
  <rect x="304" y="222" width="116" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="362" y="236" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">3</tspan></text>
  <text x="362" y="259" font-size="8.5" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">ModelReplied</text>
  <text x="362" y="274" font-size="8" fill="#475569" text-anchor="middle">proposed test</text>

  <!-- e4 -->
  <rect x="436" y="222" width="116" height="62" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
  <rect x="436" y="222" width="116" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="494" y="236" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">4</tspan></text>
  <text x="494" y="259" font-size="8.5" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">Authorized</text>
  <text x="494" y="274" font-size="8" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">BudgetReserved</text>

  <!-- e_t -->
  <rect x="568" y="222" width="116" height="62" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
  <rect x="568" y="222" width="116" height="20" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="626" y="236" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle"><tspan font-style="italic">e</tspan><tspan font-size="7.5" dy="2.5">t</tspan></text>
  <text x="626" y="259" font-size="8.5" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">ToolIntent</text>
  <text x="626" y="274" font-size="8" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">test_r18</text>

  <!-- Missing result (not recorded) -->
  <rect x="716" y="222" width="116" height="62" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="774" y="259" font-size="8.5" fill="#64748b" text-anchor="middle" font-family="Courier New, monospace">ToolResult</text>
  <text x="774" y="274" font-size="8" fill="#64748b" text-anchor="middle">not recorded</text>

  <!-- Sequence arrows -->
  <path d="M 156 253 H 171" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 288 253 H 303" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 420 253 H 435" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>
  <path d="M 552 253 H 567" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr-gray)"/>

  <!-- Log boundary t -->
  <line x1="700" y1="214" x2="700" y2="292" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="700" y="209" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">boundary <tspan font-style="italic">t</tspan></text>
</svg>
