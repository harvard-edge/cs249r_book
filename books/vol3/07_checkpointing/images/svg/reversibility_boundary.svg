<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .text-subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-header { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text-subhead { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #334155; }
      .text-body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.35; }
      .text-code { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .text-badge { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 9.5px; }
      .text-caption { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="16" y="16" width="928" height="528" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Header Bar -->
  <rect x="32" y="32" width="896" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="42" y="42" width="94" height="26" rx="5" fill="#4f46e5"/>
  <text x="89" y="59" text-anchor="middle" class="text-badge" fill="#ffffff">FIGURE 7.2</text>
  <text x="148" y="52" class="text-title">The Reversibility Boundary: Internal State vs. External Actuation</text>
  <text x="148" y="68" class="text-subtitle">Bifurcation between low-latency invertible software states and high-stakes non-invertible real-world side-effects</text>

  <!-- Left Domain: Reversible Internal State (Blue/Indigo tint) -->
  <rect x="32" y="96" width="410" height="370" rx="8" fill="#f8faff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="32" y="96" width="410" height="32" rx="8" fill="#eff6ff"/>
  <rect x="32" y="120" width="410" height="8" fill="#eff6ff"/>
  <text x="44" y="117" class="text-header" fill="#1e40af">Reversible Internal State Domain</text>
  <rect x="330" y="103" width="100" height="18" rx="4" fill="#dbeafe"/>
  <text x="380" y="116" text-anchor="middle" class="text-badge" fill="#1e40af">100% INVERTIBLE</text>

  <!-- Card 1: Context Window -->
  <rect x="44" y="138" width="386" height="70" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="56" y="156" class="text-subhead" fill="#1e3a8a">1. Context Working Set &amp; Attention KV Cache</text>
  <text x="56" y="172" class="text-body">• Ephemeral transformer activations stored in GPU HBM / Host RAM</text>
  <text x="56" y="186" class="text-body">• Zero-copy tree branching via Radix prefix trees (SGLang/vLLM)</text>
  <text x="56" y="200" class="text-caption" fill="#2563eb">Rollback Mechanism: Pop context turn, trim KV cache tree (Latency: &lt; 1 ms)</text>

  <!-- Card 2: Git Worktrees -->
  <rect x="44" y="216" width="386" height="70" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="56" y="234" class="text-subhead" fill="#1e3a8a">2. Git Worktrees &amp; Detached HEAD Sandboxes</text>
  <text x="56" y="250" class="text-body">• Local filesystem workspace branched off integration HEAD</text>
  <text x="56" y="264" class="text-body">• Unchecked AST mutations, speculative refactorings, test runs</text>
  <text x="56" y="278" class="text-caption" fill="#2563eb">Rollback Mechanism: git checkout . ; git clean -fd (Latency: 2–5 ms)</text>

  <!-- Card 3: MicroVM CoW -->
  <rect x="44" y="294" width="386" height="70" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="56" y="312" class="text-subhead" fill="#1e3a8a">3. MicroVM Copy-on-Write Filesystems (OverlayFS)</text>
  <text x="56" y="328" class="text-body">• Ephemeral UpperDir capturing mutations atop immutable LowerDir</text>
  <text x="56" y="342" class="text-body">• Arbitrary package installs, compiler builds, intermediate files</text>
  <text x="56" y="356" class="text-caption" fill="#2563eb">Rollback Mechanism: rm -rf UpperDir / Discard microVM (Latency: &lt; 2 ms)</text>

  <!-- Card 4: Speculative Search -->
  <rect x="44" y="372" width="386" height="82" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="56" y="390" class="text-subhead" fill="#1e3a8a">4. Speculative Trajectory Search (Best-of-N, MCTS)</text>
  <text x="56" y="406" class="text-body">• Parallel candidate trajectories explored concurrently</text>
  <text x="56" y="420" class="text-body">• Evaluated by deterministic oracles before external commit</text>
  <text x="56" y="434" class="text-caption" fill="#2563eb">Rollback Mechanism: Discard losing branches; zero side-effects</text>

  <!-- Center: The Reversibility Boundary (Red Dotted / Gatekeeper) -->
  <line x1="480" y1="96" x2="480" y2="466" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Gatekeeper Badge on Boundary -->
  <rect x="444" y="104" width="72" height="24" rx="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="480" y="120" text-anchor="middle" class="text-badge" fill="#ffffff">GATEWAY</text>

  <!-- Gatekeeper Card: Human Approval & State Suspension -->
  <rect x="442" y="196" width="76" height="170" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="480" y="214" text-anchor="middle" class="text-badge" fill="#9f1239">Oversight</text>
  <text x="480" y="228" text-anchor="middle" class="text-badge" fill="#9f1239">Gate</text>
  
  <rect x="448" y="238" width="64" height="34" rx="4" fill="#ffffff" stroke="#fda4af"/>
  <text x="480" y="252" text-anchor="middle" class="text-caption" fill="#9f1239">Human</text>
  <text x="480" y="264" text-anchor="middle" class="text-caption" fill="#9f1239">Review</text>

  <rect x="448" y="280" width="64" height="42" rx="4" fill="#ffffff" stroke="#fda4af"/>
  <text x="480" y="294" text-anchor="middle" class="text-caption" fill="#9f1239">State</text>
  <text x="480" y="306" text-anchor="middle" class="text-caption" fill="#9f1239">Suspend</text>
  <text x="480" y="318" text-anchor="middle" class="text-caption" fill="#9f1239">(Free HBM)</text>

  <rect x="448" y="330" width="64" height="28" rx="4" fill="#ffffff" stroke="#fda4af"/>
  <text x="480" y="344" text-anchor="middle" class="text-caption" fill="#9f1239">10^6x Lat</text>
  <text x="480" y="354" text-anchor="middle" class="text-caption" fill="#9f1239">Disparity</text>

  <!-- Forward Flow Arrow Across Boundary -->
  <path d="M 430 173 L 530 173" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Right Domain: Irreversible External Actuation (Red/Amber tint) -->
  <rect x="518" y="96" width="410" height="370" rx="8" fill="#fffbfb" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="518" y="96" width="410" height="32" rx="8" fill="#fef2f2"/>
  <rect x="518" y="120" width="410" height="8" fill="#fef2f2"/>
  <text x="530" y="117" class="text-header" fill="#991b1b">Irreversible External Actuation Domain</text>
  <rect x="806" y="103" width="112" height="18" rx="4" fill="#fee2e2"/>
  <text x="862" y="116" text-anchor="middle" class="text-badge" fill="#991b1b">NON-INVERTIBLE</text>

  <!-- Card 1: Production Databases -->
  <rect x="530" y="138" width="386" height="70" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="542" y="156" class="text-subhead" fill="#7f1d1d">1. Production Relational &amp; Document Stores</text>
  <text x="542" y="172" class="text-body">• Direct SQL mutations: UPDATE balances, DELETE FROM users</text>
  <text x="542" y="186" class="text-body">• No 2-phase commit (2PC) possible across heterogeneous services</text>
  <text x="542" y="200" class="text-caption" fill="#dc2626">Recovery: Compensating transaction handler (A^-1) or point-in-time recovery</text>

  <!-- Card 2: Cloud Infrastructure -->
  <rect x="530" y="216" width="386" height="70" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="542" y="234" class="text-subhead" fill="#7f1d1d">2. Cloud Infrastructure &amp; Fleet Provisioning</text>
  <text x="542" y="250" class="text-body">• AWS API: ec2:TerminateInstances, terraform apply, Route53 updates</text>
  <text x="542" y="264" class="text-body">• Physical storage deletion, IAM permission mutations</text>
  <text x="542" y="278" class="text-caption" fill="#dc2626">Recovery: Complex redeployment saga; data loss may be unrecoverable</text>

  <!-- Card 3: External Communications -->
  <rect x="530" y="294" width="386" height="70" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="542" y="312" class="text-subhead" fill="#7f1d1d">3. External Communications &amp; Customer Notifications</text>
  <text x="542" y="328" class="text-body">• SMTP email dispatch, Slack messages, Twilio SMS alerts, Webhooks</text>
  <text x="542" y="342" class="text-body">• Once dispatched over internet, packets cannot be recalled</text>
  <text x="542" y="356" class="text-caption" fill="#dc2626">Recovery: Send apology / retraction email (compensating semantic action)</text>

  <!-- Card 4: Financial & Physical APIs -->
  <rect x="530" y="372" width="386" height="82" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="542" y="390" class="text-subhead" fill="#7f1d1d">4. Financial Transactions &amp; Cyber-Physical Actuators</text>
  <text x="542" y="406" class="text-body">• Stripe credit card charge, banking ACH transfer, crypto asset swap</text>
  <text x="542" y="420" class="text-body">• Robotic arm motion, physical warehouse sorter, CNC cutting</text>
  <text x="542" y="434" class="text-caption" fill="#dc2626">Recovery: Refund API (fees lost); physical actions are final</text>

  <!-- Bottom Architectural Invariant Footer -->
  <rect x="32" y="480" width="896" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="497" class="text-subhead" fill="#0f172a">Core Systems Invariant: The Reversibility Boundary Requires Asymmetric Architecture</text>
  <text x="44" y="512" class="text-body" fill="#475569">Internal errors are cheap and resolved by speculative rollbacks. External actions have no mathematical inverse:</text>
  <text x="44" y="525" class="text-body" fill="#475569">they require typed deterministic Sagas (A^-1) or runtime state suspension behind human approval gates.</text>
</svg>
