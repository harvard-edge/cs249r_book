<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- CANDIDATE ACTION GENERATOR (LLM)                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="144" height="240" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="144" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#334155">CANDIDATE ACTION</text>

    <text x="10" y="42" font-size="8" font-weight="700" fill="#0f172a">Generator:</text>
    <text x="10" y="55" font-size="7.5" fill="#334155">Stochastic LLM</text>
    <text x="10" y="68" font-family="SF Mono, Menlo, monospace" font-size="7.5" fill="#0284c7">a_t ~ π(a | s_t)</text>

    <!-- Risk Badge Box -->
    <rect x="8" y="80" width="128" height="42" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="14" y="93" font-size="7.5" font-weight="700" fill="#991b1b">Fail-Plausible Risk</text>
    <text x="14" y="105" font-size="7" fill="#b91c1c">Syntactically confident,</text>
    <text x="14" y="116" font-size="7" fill="#b91c1c">semantically flawed</text>

    <text x="10" y="138" font-size="8" font-weight="700" fill="#0f172a">Payload Types:</text>
    <text x="10" y="152" font-size="7.5" fill="#334155">• Tool JSON call</text>
    <text x="10" y="165" font-size="7.5" fill="#334155">• Git code diff</text>
    <text x="10" y="178" font-size="7.5" fill="#334155">• SQL query / Bash</text>

    <text x="10" y="210" font-size="7" fill="#64748b">Latency: ~500–1500 ms</text>
  </g>

  <!-- Arrow Generator -> Gate 1 -->
  <line x1="184" y1="194" x2="204" y2="194" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- ================================================================= -->
  <!-- STAGE 1: SYNTAX & SCHEMA GATE (BLUE)                              -->
  <!-- ================================================================= -->
  <g transform="translate(208, 74)">
    <rect x="0" y="0" width="160" height="240" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">1. SYNTAX &amp; SCHEMA</text>

    <!-- Sub-badge -->
    <rect x="10" y="32" width="54" height="16" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="37" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">&lt; 2 ms</text>
    <text x="70" y="43" font-size="7" fill="#64748b">Deterministic</text>

    <text x="10" y="66" font-size="8" font-weight="700" fill="#0f172a">Oracles:</text>
    <text x="10" y="80" font-size="7.2" fill="#334155">• JSON-RPC schema (MCP)</text>
    <text x="10" y="93" font-size="7.2" fill="#334155">• Tree-sitter AST parser</text>
    <text x="10" y="106" font-size="7.2" fill="#334155">• Pydantic type validator</text>

    <text x="10" y="126" font-size="8" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="140" font-size="7.2" fill="#334155">• Unclosed string/bracket</text>
    <text x="10" y="153" font-size="7.2" fill="#334155">• Missing required param</text>
    <text x="10" y="166" font-size="7.2" fill="#334155">• Unknown tool identifier</text>

    <!-- Code Chip -->
    <rect x="8" y="204" width="144" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="219" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="7" font-weight="600" fill="#0284c7">Schema.validate(a_t)</text>
  </g>

  <!-- Arrow Gate 1 -> Gate 2 -->
  <line x1="368" y1="194" x2="392" y2="194" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="380" y="188" text-anchor="middle" font-size="7" font-weight="700" fill="#16a34a">OK</text>

  <!-- ================================================================= -->
  <!-- STAGE 2: STATIC ANALYSIS & TYPE GATE (PURPLE)                     -->
  <!-- ================================================================= -->
  <g transform="translate(396, 74)">
    <rect x="0" y="0" width="160" height="240" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#6d28d9">2. STATIC ANALYSIS</text>

    <!-- Sub-badge -->
    <rect x="10" y="32" width="60" height="16" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="40" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">10–50 ms</text>
    <text x="76" y="43" font-size="7" fill="#64748b">Deterministic</text>

    <text x="10" y="66" font-size="8" font-weight="700" fill="#0f172a">Oracles:</text>
    <text x="10" y="80" font-size="7.2" fill="#334155">• TypeScript compiler (`tsc`)</text>
    <text x="10" y="93" font-size="7.2" fill="#334155">• Python typechecker (`mypy`)</text>
    <text x="10" y="106" font-size="7.2" fill="#334155">• AST linters (`ruff`, `eslint`)</text>

    <text x="10" y="126" font-size="8" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="140" font-size="7.2" fill="#334155">• Undefined symbol/import</text>
    <text x="10" y="153" font-size="7.2" fill="#334155">• Type mismatch (int/str)</text>
    <text x="10" y="166" font-size="7.2" fill="#334155">• Dead/unreachable code</text>

    <!-- Code Chip -->
    <rect x="8" y="204" width="144" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="219" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="7" font-weight="600" fill="#7c3aed">mypy --strict patch.py</text>
  </g>

  <!-- Arrow Gate 2 -> Gate 3 -->
  <line x1="556" y1="194" x2="580" y2="194" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="568" y="188" text-anchor="middle" font-size="7" font-weight="700" fill="#16a34a">OK</text>

  <!-- ================================================================= -->
  <!-- STAGE 3: DYNAMIC SANDBOX TEST ORACLE (AMBER)                      -->
  <!-- ================================================================= -->
  <g transform="translate(584, 74)">
    <rect x="0" y="0" width="160" height="240" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#b45309">3. DYNAMIC SANDBOX</text>

    <!-- Sub-badge -->
    <rect x="10" y="32" width="70" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="45" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">100–2000 ms</text>
    <text x="86" y="43" font-size="7" fill="#64748b">Isolated VM</text>

    <text x="10" y="66" font-size="8" font-weight="700" fill="#0f172a">Oracles:</text>
    <text x="10" y="80" font-size="7.2" fill="#334155">• Test runners (`pytest`)</text>
    <text x="10" y="93" font-size="7.2" fill="#334155">• Regression test suites</text>
    <text x="10" y="106" font-size="7.2" fill="#334155">• Property assertions</text>

    <text x="10" y="126" font-size="8" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="140" font-size="7.2" fill="#334155">• Functional regressions</text>
    <text x="10" y="153" font-size="7.2" fill="#334155">• Non-zero exit codes</text>
    <text x="10" y="166" font-size="7.2" fill="#334155">• OOM / Segfault crashes</text>

    <!-- Code Chip -->
    <rect x="8" y="204" width="144" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="219" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="6.8" font-weight="600" fill="#d97706">pytest -q tests/test_core.py</text>
  </g>

  <!-- Arrow Gate 3 -> Gate 4 -->
  <line x1="744" y1="194" x2="768" y2="194" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="756" y="188" text-anchor="middle" font-size="7" font-weight="700" fill="#16a34a">OK</text>

  <!-- ================================================================= -->
  <!-- STAGE 4: INVARIANT & SAFETY GATE (GREEN)                          -->
  <!-- ================================================================= -->
  <g transform="translate(772, 74)">
    <rect x="0" y="0" width="148" height="240" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="148" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#15803d">4. INVARIANT &amp; SAFETY</text>

    <!-- Sub-badge -->
    <rect x="10" y="32" width="56" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="38" y="43" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">5–20 ms</text>
    <text x="72" y="43" font-size="7" fill="#64748b">Policy Gate</text>

    <text x="10" y="66" font-size="8" font-weight="700" fill="#0f172a">Oracles:</text>
    <text x="10" y="80" font-size="7.2" fill="#334155">• Pre/post-condition checks</text>
    <text x="10" y="93" font-size="7.2" fill="#334155">• Reversibility boundary</text>
    <text x="10" y="106" font-size="7.2" fill="#334155">• Token / cost budget</text>

    <text x="10" y="126" font-size="8" font-weight="700" fill="#0f172a">Catches:</text>
    <text x="10" y="140" font-size="7.2" fill="#334155">• Unauthorized file delete</text>
    <text x="10" y="153" font-size="7.2" fill="#334155">• Uncompensated actions</text>
    <text x="10" y="166" font-size="7.2" fill="#334155">• Infinite trajectory drift</text>

    <!-- Code Chip -->
    <rect x="8" y="204" width="132" height="24" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="74" y="219" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="6.8" font-weight="600" fill="#16a34a">assert policy.is_safe(δ)</text>
  </g>

  <!-- ================================================================= -->
  <!-- FAILURE PATHWAY & BUS                                             -->
  <!-- ================================================================= -->
  <!-- Downward rejection lines from each gate -->
  <line x1="288" y1="314" x2="288" y2="340" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="476" y1="314" x2="476" y2="340" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="664" y1="314" x2="664" y2="340" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="820" y1="314" x2="820" y2="340" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Failure horizontal bus line -->
  <line x1="288" y1="340" x2="820" y2="340" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Downward connector into Recovery Routine box -->
  <line x1="375" y1="340" x2="375" y2="376" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Any Rejection Badge -->
  <rect x="490" y="331" width="94" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="537" y="344" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">ANY REJECTION</text>

  <!-- ================================================================= -->
  <!-- PASS PATHWAY & SUCCESS COMMIT BOX                                 -->
  <!-- ================================================================= -->
  <!-- Downward connector from Stage 4 into Commit State box -->
  <line x1="860" y1="314" x2="860" y2="376" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="828" y="338" width="64" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="860" y="351" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">ALL PASS</text>

  <!-- Commit State Box -->
  <g transform="translate(740, 376)">
    <rect x="0" y="0" width="180" height="64" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">COMMIT STATE &amp; ADVANCE</text>
    <text x="10" y="36" font-size="7.5" fill="#334155">• State verified in working set</text>
    <text x="10" y="50" font-size="7.5" fill="#334155">• Advance trajectory to step t+1</text>
  </g>

  <!-- ================================================================= -->
  <!-- ERROR RECOVERY ROUTINE BOX                                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 376)">
    <rect x="0" y="0" width="670" height="64" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="670" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="14" font-size="8" font-weight="700" fill="#991b1b">DETERMINISTIC ERROR RECOVERY ROUTINE (FORK-ON-ERROR &amp; ROLLBACK)</text>
    <text x="12" y="33" font-size="7.5" fill="#334155"><tspan font-weight="700">1. Structured Error Diff:</tspan> Extract exact compiler line or failing test traceback (discard noisy conversational prose).</text>
    <text x="12" y="45" font-size="7.5" fill="#334155"><tspan font-weight="700">2. Prune Poisoned Context:</tspan> Evict hallucinated turn from active KV working set to prevent confirmation bias.</text>
    <text x="12" y="57" font-size="7.5" fill="#334155"><tspan font-weight="700">3. Counterfactual Branching:</tspan> Fork stategraph from last verified checkpoint; invoke alternative branch or Saga.</text>
  </g>

  <!-- ================================================================= -->
  <!-- FOOTER: KEY ARCHITECTURAL INVARIANT                               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="880" height="60" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">KEY ARCHITECTURAL INVARIANT: NEVER USE PROBABILISTIC MODELS AS EXCLUSIVE SAFETY ORACLES</text>
    <text x="12" y="36" font-size="8" fill="#334155">"LLM-as-a-judge" critics suffer from sycophancy, context dilution, and non-deterministic false negatives. Systems correctness</text>
    <text x="12" y="49" font-size="8" fill="#334155">demands deterministic verification gates—formal grammar masks, compiler types, isolated sandboxes, and policy checkers.</text>
  </g>
</g>
</svg>