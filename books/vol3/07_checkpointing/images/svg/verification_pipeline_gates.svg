<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .text-subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-header { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text-subhead { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #334155; }
      .text-body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.35; }
      .text-code { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .text-badge { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 9.5px; }
      .text-caption { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    
    
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="528" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Technical Header Bar -->
  <rect x="32" y="32" width="896" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e293b">MULTI-STAGE DETERMINISTIC VERIFICATION PIPELINE</text>

  <!-- Left: Candidate Action Card -->
  <rect x="32" y="98" width="136" height="230" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="98" width="136" height="28" rx="2" fill="#e2e8f0"/>
  <rect x="32" y="118" width="136" height="8" fill="#e2e8f0"/>
  <text x="100" y="117" text-anchor="middle" class="text-header">Candidate Action</text>
  
  <text x="42" y="142" class="text-subhead">Generator:</text>
  <text x="42" y="156" class="text-body">Stochastic LLM</text>
  <text x="42" y="170" class="text-code">a_t ~ pi(a | s_t)</text>

  <rect x="40" y="185" width="120" height="44" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="46" y="199" class="text-badge" fill="#991b1b">Fail-Plausible Risk</text>
  <text x="46" y="213" class="text-caption" fill="#b91c1c">Syntactically confident,</text>
  <text x="46" y="224" class="text-caption" fill="#b91c1c">semantically flawed</text>

  <text x="42" y="248" class="text-subhead">Payload Types:</text>
  <text x="42" y="262" class="text-body">• Tool JSON call</text>
  <text x="42" y="276" class="text-body">• Git code diff</text>
  <text x="42" y="290" class="text-body">• SQL query / Bash</text>
  <text x="42" y="312" class="text-caption">Latency: ~500-1500 ms</text>

  <!-- Arrow from Generator to Stage 1 -->
  <line x1="168" y1="213" x2="194" y2="213" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: Syntax & Schema Gate -->
  <rect x="198" y="98" width="164" height="230" rx="2" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="198" y="98" width="164" height="28" rx="2" fill="#eff6ff"/>
  <rect x="198" y="118" width="164" height="8" fill="#eff6ff"/>
  <text x="280" y="117" text-anchor="middle" class="text-header" fill="#1d4ed8">1. Syntax &amp; Schema</text>

  <rect x="208" y="134" width="70" height="18" rx="4" fill="#dbeafe"/>
  <text x="243" y="147" text-anchor="middle" class="text-badge" fill="#1e40af">&lt; 2 ms</text>
  <text x="286" y="147" class="text-caption">Deterministic</text>

  <text x="208" y="170" class="text-subhead">Oracles:</text>
  <text x="208" y="184" class="text-body">• JSON-RPC schema (MCP)</text>
  <text x="208" y="198" class="text-body">• Tree-sitter AST parser</text>
  <text x="208" y="212" class="text-body">• Pydantic type validator</text>

  <text x="208" y="234" class="text-subhead">Catches:</text>
  <text x="208" y="248" class="text-body">• Unclosed string/brackets</text>
  <text x="208" y="262" class="text-body">• Missing required params</text>
  <text x="208" y="276" class="text-body">• Unknown tool identifier</text>

  <rect x="206" y="292" width="148" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="280" y="309" text-anchor="middle" class="text-code" fill="#2563eb">Schema.validate(a_t)</text>

  <!-- Arrow Stage 1 to Stage 2 -->
  <line x1="362" y1="213" x2="384" y2="213" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="373" y="206" text-anchor="middle" class="text-badge" fill="#059669">OK</text>

  <!-- Stage 2: Static Analysis & Type Gate -->
  <rect x="388" y="98" width="164" height="230" rx="2" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="388" y="98" width="164" height="28" rx="2" fill="#f5f3ff"/>
  <rect x="388" y="118" width="164" height="8" fill="#f5f3ff"/>
  <text x="470" y="117" text-anchor="middle" class="text-header" fill="#6d28d9">2. Static Analysis</text>

  <rect x="398" y="134" width="76" height="18" rx="4" fill="#ede9fe"/>
  <text x="436" y="147" text-anchor="middle" class="text-badge" fill="#5b21b6">10–50 ms</text>
  <text x="482" y="147" class="text-caption">Deterministic</text>

  <text x="398" y="170" class="text-subhead">Oracles:</text>
  <text x="398" y="184" class="text-body">• TypeScript compiler (`tsc`)</text>
  <text x="398" y="198" class="text-body">• Python typechecker (`mypy`)</text>
  <text x="398" y="212" class="text-body">• AST linters (`ruff`, `eslint`)</text>

  <text x="398" y="234" class="text-subhead">Catches:</text>
  <text x="398" y="248" class="text-body">• Undefined symbols/imports</text>
  <text x="398" y="262" class="text-body">• Type mismatches (int/str)</text>
  <text x="398" y="276" class="text-body">• Dead code / unreachable logic</text>

  <rect x="396" y="292" width="148" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="470" y="309" text-anchor="middle" class="text-code" fill="#7c3aed">mypy --strict patch.py</text>

  <!-- Arrow Stage 2 to Stage 3 -->
  <line x1="552" y1="213" x2="574" y2="213" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="563" y="206" text-anchor="middle" class="text-badge" fill="#059669">OK</text>

  <!-- Stage 3: Dynamic Sandbox Test Oracle -->
  <rect x="578" y="98" width="164" height="230" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="578" y="98" width="164" height="28" rx="2" fill="#fffbeb"/>
  <rect x="578" y="118" width="164" height="8" fill="#fffbeb"/>
  <text x="660" y="117" text-anchor="middle" class="text-header" fill="#b45309">3. Dynamic Sandbox</text>

  <rect x="588" y="134" width="84" height="18" rx="4" fill="#fef3c7"/>
  <text x="630" y="147" text-anchor="middle" class="text-badge" fill="#92400e">100–2000 ms</text>
  <text x="680" y="147" class="text-caption">Isolated VM</text>

  <text x="588" y="170" class="text-subhead">Oracles:</text>
  <text x="588" y="184" class="text-body">• Test runners (`pytest`, `cargo`)</text>
  <text x="588" y="198" class="text-body">• Regression test suites</text>
  <text x="588" y="212" class="text-body">• Invariant property assertions</text>

  <text x="588" y="234" class="text-subhead">Catches:</text>
  <text x="588" y="248" class="text-body">• Functional regression bugs</text>
  <text x="588" y="262" class="text-body">• Non-zero exit codes</text>
  <text x="588" y="276" class="text-body">• Out-of-memory / Segfaults</text>

  <rect x="586" y="292" width="148" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="660" y="309" text-anchor="middle" class="text-code" fill="#d97706">pytest -q tests/test_core.py</text>

  <!-- Arrow Stage 3 to Stage 4 -->
  <line x1="742" y1="213" x2="764" y2="213" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="753" y="206" text-anchor="middle" class="text-badge" fill="#059669">OK</text>

  <!-- Stage 4: Semantic Invariant & Safety Gate -->
  <rect x="768" y="98" width="160" height="230" rx="2" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <rect x="768" y="98" width="160" height="28" rx="2" fill="#ecfdf5"/>
  <rect x="768" y="118" width="160" height="8" fill="#ecfdf5"/>
  <text x="848" y="117" text-anchor="middle" class="text-header" fill="#047857">4. Invariant &amp; Safety</text>

  <rect x="778" y="134" width="76" height="18" rx="4" fill="#d1fae5"/>
  <text x="816" y="147" text-anchor="middle" class="text-badge" fill="#065f46">5–20 ms</text>
  <text x="862" y="147" class="text-caption">Policy Gate</text>

  <text x="778" y="170" class="text-subhead">Oracles:</text>
  <text x="778" y="184" class="text-body">• Pre/post-condition contracts</text>
  <text x="778" y="198" class="text-body">• Reversibility boundary check</text>
  <text x="778" y="212" class="text-body">• Token &amp; cost budget guard</text>

  <text x="778" y="234" class="text-subhead">Catches:</text>
  <text x="778" y="248" class="text-body">• Unauthorized file deletion</text>
  <text x="778" y="262" class="text-body">• Uncompensated side-effects</text>
  <text x="778" y="276" class="text-body">• Infinite trajectory drift</text>

  <rect x="776" y="292" width="144" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="848" y="309" text-anchor="middle" class="text-code" fill="#059669">assert policy.is_safe(delta)</text>

  <!-- Fail Pathway (Downward red lines from each gate) -->
  <line x1="280" y1="328" x2="280" y2="368" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="470" y1="328" x2="470" y2="368" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="660" y1="328" x2="660" y2="368" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="848" y1="328" x2="848" y2="368" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Bus line for Failures -->
  <line x1="280" y1="368" x2="848" y2="368" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="564" y1="368" x2="564" y2="394" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="524" y="356" width="80" height="20" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="564" y="370" text-anchor="middle" class="text-badge" fill="#dc2626">ANY REJECTION</text>

  <!-- Failure Recovery Box -->
  <rect x="232" y="398" width="664" height="68" rx="2" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="246" y="418" class="text-subhead" fill="#991b1b">Deterministic Error Recovery Routine (Fork-on-Error &amp; Rollback)</text>
  <text x="246" y="435" class="text-body" fill="#7f1d1d">1. Generate Structured Error Diff: Extract exact compiler line or failing test traceback (discard noisy conversational prose).</text>
  <text x="246" y="451" class="text-body" fill="#7f1d1d">2. Prune Poisoned Context: Remove hallucinated turn from active KV working set to prevent confirmation bias.</text>
  <text x="246" y="467" class="text-body" fill="#7f1d1d">3. Counterfactual Branching: Fork stategraph from last verified checkpoint; invoke alternative search branch or compensating Saga.</text>

  <!-- Pass Branch Output (Green) -->
  <line x1="928" y1="213" x2="944" y2="213" stroke="#059669" stroke-width="2"/>
  <line x1="944" y1="213" x2="944" y2="350" stroke="#059669" stroke-width="2"/>
  <line x1="944" y1="350" x2="160" y2="350" stroke="#059669" stroke-width="2"/>
  <line x1="160" y1="350" x2="160" y2="394" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="120" y="338" width="80" height="20" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="160" y="352" text-anchor="middle" class="text-badge" fill="#047857">ALL PASS</text>

  <!-- Pass Box -->
  <rect x="32" y="398" width="186" height="68" rx="2" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="44" y="420" class="text-subhead" fill="#065f46">Commit State &amp; Advance</text>
  <text x="44" y="438" class="text-body" fill="#047857">• State verified in working set</text>
  <text x="44" y="454" class="text-body" fill="#047857">• Advance trajectory to step t+1</text>

  <!-- Bottom Architectural Invariant Footer -->
  <rect x="32" y="482" width="896" height="48" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="501" class="text-subhead" fill="#0f172a">Key Architectural Invariant: Never Use Probabilistic Models as Exclusive Safety Oracles</text>
  <text x="44" y="519" class="text-body" fill="#475569">"LLM-as-a-judge" critics suffer from sycophancy, context dilution, and non-deterministic false negatives. Systems correctness requires deterministic test oracles.</text>
</svg>