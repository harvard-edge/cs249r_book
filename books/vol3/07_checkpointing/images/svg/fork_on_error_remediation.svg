<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .text-subtitle { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-header { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text-subhead { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #334155; }
      .text-body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; line-height: 1.35; }
      .text-code { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .text-badge { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 9.5px; }
      .text-caption { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #64748b; }
    </style>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    
    
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="528" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Technical Header Bar -->
  <rect x="32" y="32" width="896" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e293b">FORK-ON-ERROR: COUNTERFACTUAL REMEDIATION FOR NON-INVERTIBLE FAILURES</text>

  <!-- Top Primary Track -->
  <rect x="32" y="94" width="896" height="114" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="94" width="896" height="26" rx="2" fill="#e2e8f0"/>
  <rect x="32" y="112" width="896" height="8" fill="#e2e8f0"/>
  <text x="44" y="112" class="text-subhead" fill="#334155">PRIMARY EXECUTION TRACK (NON-INVERTIBLE ACTUATION)</text>

  <!-- Card T1 -->
  <rect x="44" y="128" width="250" height="68" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="145" class="text-subhead" fill="#0f172a">Step T_1: Destructive DDL</text>
  <text x="54" y="161" class="text-body">• DROP COLUMN auth_tokens;</text>
  <text x="54" y="175" class="text-caption" fill="#059669">✓ Executed &amp; committed to DB</text>
  <rect x="230" y="134" width="56" height="18" rx="3" fill="#ecfdf5"/>
  <text x="258" y="146" text-anchor="middle" class="text-badge" fill="#059669">APPLIED</text>

  <!-- Arrow T1 -> T2 -->
  <line x1="294" y1="162" x2="334" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Card T2 (Crash) -->
  <rect x="338" y="128" width="290" height="68" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="348" y="145" class="text-subhead" fill="#991b1b">Step T_2: Backfill Hashes (CRASH!)</text>
  <text x="348" y="161" class="text-body">• Hash migration fails: foreign key deadlock</text>
  <text x="348" y="175" class="text-caption" fill="#dc2626">✗ Execution aborted; missing reverse inverse</text>
  <rect x="556" y="134" width="64" height="18" rx="3" fill="#fee2e2"/>
  <text x="588" y="146" text-anchor="middle" class="text-badge" fill="#dc2626">ABORTED</text>

  <!-- Arrow T2 -> Trap -->
  <line x1="628" y1="162" x2="668" y2="162" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Trap Card -->
  <rect x="672" y="128" width="244" height="68" rx="2" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="682" y="145" class="text-subhead" fill="#b91c1c">Saga Impasse: C_1 = ∅</text>
  <text x="682" y="161" class="text-body">• Cannot "un-drop" column via API</text>
  <text x="682" y="175" class="text-caption" fill="#991b1b">Mandates Fork-on-Error Protocol</text>

  <!-- Bifurcation Arrows -->
  <path d="M 480 208 L 480 226 L 256 226 L 256 244" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 480 208 L 480 226 L 704 226 L 704 244" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Left Branch: State Freezing & Context Quarantine -->
  <rect x="32" y="248" width="436" height="216" rx="2" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="32" y="248" width="436" height="30" rx="2" fill="#fee2e2"/>
  <rect x="32" y="270" width="436" height="8" fill="#fee2e2"/>
  <text x="44" y="268" class="text-header" fill="#991b1b">Branch A: Freeze Tainted State &amp; Quarantine</text>
  <rect x="366" y="254" width="92" height="18" rx="4" fill="#fecaca"/>
  <text x="412" y="267" text-anchor="middle" class="text-badge" fill="#991b1b">ISOLATION</text>

  <rect x="44" y="290" width="412" height="46" rx="5" fill="#ffffff" stroke="#fecaca"/>
  <text x="54" y="306" class="text-subhead" fill="#7f1d1d">1. Network Socket Severing</text>
  <text x="54" y="322" class="text-body">• Freeze active TCP sockets; halt external write queues to prevent cascade</text>

  <rect x="44" y="344" width="412" height="46" rx="5" fill="#ffffff" stroke="#fecaca"/>
  <text x="54" y="360" class="text-subhead" fill="#7f1d1d">2. Information Flow Control (IFC) Quarantine</text>
  <text x="54" y="376" class="text-body">• Tag context buffer with TAINT_UNCOMMITTED bit; block upstream synthesis</text>

  <rect x="44" y="398" width="412" height="54" rx="5" fill="#ffffff" stroke="#fecaca"/>
  <text x="54" y="414" class="text-subhead" fill="#7f1d1d">3. Human Ops Incident Telemetry</text>
  <text x="54" y="430" class="text-body">• Emit structured event log with state diff and deadlock callstack</text>
  <text x="54" y="443" class="text-caption" fill="#b91c1c">Guarantees zero unmonitored external writes during anomaly</text>

  <!-- Right Branch: Counterfactual Remediation Track -->
  <rect x="492" y="248" width="436" height="216" rx="2" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <rect x="492" y="248" width="436" height="30" rx="2" fill="#ccfbf1"/>
  <rect x="492" y="270" width="436" height="8" fill="#ccfbf1"/>
  <text x="504" y="268" class="text-header" fill="#115e59">Branch B: Counterfactual Forward Remediation</text>
  <rect x="826" y="254" width="92" height="18" rx="4" fill="#99f6e4"/>
  <text x="872" y="267" text-anchor="middle" class="text-badge" fill="#115e59">REPAIR FORK</text>

  <rect x="504" y="290" width="412" height="46" rx="5" fill="#ffffff" stroke="#99f6e4"/>
  <text x="514" y="306" class="text-subhead" fill="#0f766e">1. Spawn Remediation Subagent</text>
  <text x="514" y="322" class="text-body">• Lightweight agent spawned with clean context &amp; dedicated repair tools</text>

  <rect x="504" y="344" width="412" height="46" rx="5" fill="#ffffff" stroke="#99f6e4"/>
  <text x="514" y="360" class="text-subhead" fill="#0f766e">2. Mount Point-in-Time Recovery (PITR) Snapshot</text>
  <text x="514" y="376" class="text-body">• Mount immutable pre-migration storage volume snapshot from t_{-1}</text>

  <rect x="504" y="398" width="412" height="54" rx="5" fill="#ffffff" stroke="#99f6e4"/>
  <text x="514" y="414" class="text-subhead" fill="#0f766e">3. Replay WAL &amp; Synthesize Forward Patch</text>
  <text x="514" y="430" class="text-body">• Replay redo log, extract lost auth_tokens, apply forward hash backfill</text>
  <text x="514" y="443" class="text-caption" fill="#0d9488">Restores consistency without requiring human terminal intervention</text>

  <!-- Bottom Architectural Invariant Footer -->
  <rect x="32" y="480" width="896" height="50" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="497" class="text-subhead" fill="#0f172a">Core Systems Invariant: Non-Invertible Failures Demand Forward Repair via Isolated Subagents</text>
  <text x="44" y="512" class="text-body" fill="#475569">When an action has no inverse handler (C_i = ∅), runtimes cannot roll back in-place. The orchestrator must freeze</text>
  <text x="44" y="525" class="text-body" fill="#475569">tainted state, quarantine contaminated context, and fork an isolated remediation subagent with PITR logs.</text>
</svg>
