<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- TOP: PRIMARY EXECUTION TRACK                                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="880" height="120" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#334155">PRIMARY EXECUTION TRACK (NON-INVERTIBLE ACTUATION)</text>

    <!-- Card T1 -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="254" height="76" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="8" width="54" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="35" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">STEP T₁</text>
      <text x="68" y="20" font-size="8.5" font-weight="700" fill="#0f172a">Destructive DDL</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• DROP COLUMN auth_tokens;</text>
      <text x="10" y="60" font-size="7.5" fill="#16a34a">✓ Executed &amp; committed to DB</text>
      <rect x="190" y="8" width="56" height="16" rx="1" fill="#dcfce7"/>
      <text x="218" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">APPLIED</text>
    </g>

    <!-- Arrow T1 -> T2 -->
    <line x1="270" y1="70" x2="296" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

    <!-- Card T2 (Crash) -->
    <g transform="translate(300, 32)">
      <rect x="0" y="0" width="280" height="76" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="8" y="8" width="54" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="35" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">STEP T₂</text>
      <text x="68" y="20" font-size="8.5" font-weight="700" fill="#991b1b">Backfill Hashes (CRASH!)</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Hash migration fails: foreign key deadlock</text>
      <text x="10" y="60" font-size="7.5" fill="#dc2626">✗ Execution aborted; missing reverse inverse</text>
      <rect x="210" y="8" width="62" height="16" rx="1" fill="#fee2e2"/>
      <text x="241" y="20" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">ABORTED</text>
    </g>

    <!-- Arrow T2 -> Trap -->
    <line x1="584" y1="70" x2="610" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Trap Card: Saga Impasse -->
    <g transform="translate(614, 32)">
      <rect x="0" y="0" width="254" height="76" rx="1" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <rect x="8" y="8" width="104" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="60" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">IMPASSE: C₁ = ∅</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">• Cannot "un-drop" column via API</text>
      <text x="10" y="60" font-size="7.5" fill="#991b1b">Mandates Fork-on-Error Protocol</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BIFURCATION ARROWS                                                -->
  <!-- ================================================================= -->
  <path d="M 480,194 L 480,211 L 252,211 L 252,228" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 480,194 L 480,211 L 707,211 L 707,228" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- ================================================================= -->
  <!-- BOTTOM LEFT: BRANCH A (QUARANTINE & ISOLATION)                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 228)">
    <rect x="0" y="0" width="425" height="210" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">BRANCH A: FREEZE TAINTED STATE &amp; QUARANTINE</text>

    <!-- Badge -->
    <rect x="340" y="4" width="75" height="16" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="377" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">ISOLATION</text>

    <!-- Sub-block 1 -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="405" height="42" rx="1" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">1. Network Socket Severing</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Freeze active TCP sockets; halt external write queues to prevent cascade</text>
    </g>

    <!-- Sub-block 2 -->
    <g transform="translate(10, 80)">
      <rect x="0" y="0" width="405" height="42" rx="1" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">2. Information Flow Control (IFC) Quarantine</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Tag context buffer with TAINT_UNCOMMITTED bit; block upstream synthesis</text>
    </g>

    <!-- Sub-block 3 -->
    <g transform="translate(10, 128)">
      <rect x="0" y="0" width="405" height="54" rx="1" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">3. Human Ops Incident Telemetry</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Emit structured event log with state diff and deadlock callstack</text>
      <text x="10" y="46" font-size="7" fill="#dc2626">Guarantees zero unmonitored external writes during anomaly</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM RIGHT: BRANCH B (COUNTERFACTUAL REMEDIATION)               -->
  <!-- ================================================================= -->
  <g transform="translate(495, 228)">
    <rect x="0" y="0" width="425" height="210" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">BRANCH B: COUNTERFACTUAL FORWARD REMEDIATION</text>

    <!-- Badge -->
    <rect x="330" y="4" width="85" height="16" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="372" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">REPAIR FORK</text>

    <!-- Sub-block 1 -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="405" height="42" rx="1" fill="#f8fafc" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">1. Spawn Remediation Subagent</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Lightweight agent spawned with clean context &amp; dedicated repair tools</text>
    </g>

    <!-- Sub-block 2 -->
    <g transform="translate(10, 80)">
      <rect x="0" y="0" width="405" height="42" rx="1" fill="#f8fafc" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">2. Mount Point-in-Time Recovery (PITR) Snapshot</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Mount immutable pre-migration storage volume snapshot from t₋₁</text>
    </g>

    <!-- Sub-block 3 -->
    <g transform="translate(10, 128)">
      <rect x="0" y="0" width="405" height="54" rx="1" fill="#f8fafc" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">3. Replay WAL &amp; Synthesize Forward Patch</text>
      <text x="10" y="32" font-size="7.5" fill="#334155">• Replay redo log, extract lost auth_tokens, apply forward hash backfill</text>
      <text x="10" y="46" font-size="7" fill="#16a34a">Restores consistency without requiring human terminal intervention</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FOOTER: CORE SYSTEMS INVARIANT                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 448)">
    <rect x="0" y="0" width="880" height="62" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">CORE SYSTEMS INVARIANT: NON-INVERTIBLE FAILURES DEMAND FORWARD REPAIR VIA ISOLATED SUBAGENTS</text>
    <text x="12" y="36" font-size="8" fill="#334155">When an action has no inverse handler (Cᵢ = ∅), runtimes cannot roll back in-place. The orchestrator must freeze</text>
    <text x="12" y="49" font-size="8" fill="#334155">tainted state, quarantine contaminated context, and fork an isolated remediation subagent with PITR logs.</text>
  </g>
</g>
</svg>