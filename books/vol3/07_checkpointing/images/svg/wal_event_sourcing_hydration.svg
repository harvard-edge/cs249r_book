  <text x="524" y="273" class="text-subhead" fill="#14532d">1. Claim Trajectory Descriptor #842</text>
  <text x="524" y="289" class="text-body">• Acquires distributed lease; attaches persistent WAL log volume</text>

  <!-- Step 2: The Replay Invariant -->
  <rect x="514" y="306" width="392" height="66" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="524" y="321" class="text-subhead" fill="#15803d">2. The Replay Invariant: Zero External Tool Re-execution</text>
  <text x="524" y="337" class="text-body">• Intercepts tool calls during fast-forward replay</text>
  <text x="524" y="351" class="text-body">• Injects recorded outputs directly into reconstructed context buffer</text>
  <text x="524" y="364" class="text-caption" fill="#059669">✓ Prevents duplicate cloud mutations, API charges, or file corruption</text>

  <!-- Step 3: Resumed Execution -->
  <rect x="514" y="378" width="392" height="46" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="524" y="393" class="text-subhead" fill="#14532d">3. Resume Forward Trajectory from Turn 5</text>
  <text x="524" y="409" class="text-body">• Seamless restart from exact crash point; zero token recomputation</text>

  <text x="514" y="443" class="text-caption" fill="#15803d">Total Hydration Latency: 38 ms | Compute Cost: $0 | Duplicate Side Effects: 0</text>

  <!-- Cross Arrow WAL to Replay -->
  <path d="M 472 280 L 504 280" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Bottom Architectural Invariant Footer -->
  <rect x="32" y="480" width="896" height="50" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="497" class="text-subhead" fill="#0f172a">Core Systems Invariant: The Replay Invariant Forbids Tool Re-Execution During Crash Recovery</text>
  <text x="44" y="512" class="text-body" fill="#475569">When replaying a Write-Ahead Log to hydrate agent state on a replacement worker, runtimes must intercept tool calls</text>
  <text x="44" y="525" class="text-body" fill="#475569">and inject recorded results from the log. Re-invoking external APIs during replay causes catastrophic state divergence.</text>
</svg>
