  <rect x="32" y="120" width="440" height="8" fill="#eff6ff"/>
  <text x="44" y="117" class="text-header" fill="#1e40af">Durable Event-Sourced Stategraph (WAL)</text>
  <rect x="350" y="103" width="112" height="18" rx="4" fill="#dbeafe"/>
  <text x="406" y="116" text-anchor="middle" class="text-badge" fill="#1e40af">APPEND-ONLY</text>

  <!-- WAL Entry 0 -->
  <rect x="44" y="136" width="416" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="52" y="142" width="46" height="16" rx="3" fill="#eff6ff"/>
