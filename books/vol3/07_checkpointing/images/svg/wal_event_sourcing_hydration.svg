        <rect x="0" y="0" width="389" height="66" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">2. The Replay Invariant: Zero External Tool Re-execution</text>
        <text x="10" y="32" font-size="8.0" fill="#334155">• Intercepts tool calls during fast-forward replay</text>
        <text x="10" y="46" font-size="8.0" fill="#334155">• Injects recorded outputs directly into reconstructed context buffer</text>
        <text x="10" y="58" font-size="8.0" font-weight="600" fill="#16a34a">✓ Prevents duplicate cloud mutations, API charges, or file corruption</text>
      </g>

      <!-- Step 3: Resumed Execution -->
      <g transform="translate(8, 146)">
        <rect x="0" y="0" width="389" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8" font-weight="700" fill="#0f172a">3. Resume Forward Trajectory from Turn 5</text>
        <text x="10" y="29" font-size="8.0" fill="#334155">• Seamless restart from exact crash point; zero token recomputation</text>
      </g>

      <!-- Metrics Chip -->
      <g transform="translate(8, 196)">
        <rect x="0" y="0" width="389" height="24" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
        <text x="194" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">Total Hydration Latency: 38 ms | Compute Cost: $0 | Duplicate Side Effects: 0</text>
