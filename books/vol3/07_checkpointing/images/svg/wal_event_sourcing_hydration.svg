  <!-- ================================================================= -->
  <!-- FOOTER: CORE SYSTEMS INVARIANT                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 448)">
    <rect x="0" y="0" width="880" height="62" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">CORE SYSTEMS INVARIANT: THE REPLAY INVARIANT FORBIDS TOOL RE-EXECUTION DURING CRASH RECOVERY</text>
    <text x="12" y="36" font-size="8" fill="#334155">When replaying a Write-Ahead Log to hydrate agent state on a replacement worker, runtimes must intercept tool calls</text>
    <text x="12" y="49" font-size="8" fill="#334155">and inject recorded results from the log. Re-invoking external APIs during replay causes catastrophic state divergence.</text>
  </g>
