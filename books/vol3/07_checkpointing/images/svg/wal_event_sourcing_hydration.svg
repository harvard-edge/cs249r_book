  <text x="106" y="153" class="text-subhead" fill="#1e3a8a">EVENT_TASK_INIT</text>
  <text x="230" y="153" class="text-code" fill="#64748b">parent_id: null</text>
  <text x="54" y="171" class="text-body">• Task ID: #842, User: "Migrate Auth Schema", Root Context: 1.2 KB</text>

  <!-- WAL Entry 1 -->
  <rect x="44" y="186" width="416" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="52" y="192" width="46" height="16" rx="3" fill="#eff6ff"/>
  <text x="75" y="204" text-anchor="middle" class="text-code" fill="#1d4ed8">e_1</text>
  <text x="106" y="203" class="text-subhead" fill="#1e3a8a">EVENT_LLM_REQUEST</text>
  <text x="245" y="203" class="text-code" fill="#64748b">parent_id: e_0</text>
  <text x="54" y="221" class="text-body">• Prompt Tokens: 3,210, Model: Claude-3.7-Sonnet, Temperature: 0.2</text>

  <!-- WAL Entry 2 -->
  <rect x="44" y="236" width="416" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="52" y="242" width="46" height="16" rx="3" fill="#eff6ff"/>
  <text x="75" y="254" text-anchor="middle" class="text-code" fill="#1d4ed8">e_2</text>
  <text x="106" y="253" class="text-subhead" fill="#1e3a8a">EVENT_LLM_COMPLETION</text>
  <text x="260" y="253" class="text-code" fill="#64748b">parent_id: e_1</text>
  <text x="54" y="271" class="text-body">• Emitted Tool: git_worktree_create(branch='feat-auth')</text>

  <!-- WAL Entry 3 -->
  <rect x="44" y="286" width="416" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="52" y="292" width="46" height="16" rx="3" fill="#eff6ff"/>
  <text x="75" y="304" text-anchor="middle" class="text-code" fill="#1d4ed8">e_3</text>
  <text x="106" y="303" class="text-subhead" fill="#1e3a8a">EVENT_TOOL_EXECUTED</text>
  <text x="252" y="303" class="text-code" fill="#64748b">parent_id: e_2</text>
  <text x="54" y="321" class="text-body">• Result: /tmp/wt_01; Registered C_1: git_worktree_remove(/tmp/wt_01)</text>

  <!-- WAL Entry 4 -->
  <rect x="44" y="336" width="416" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="52" y="342" width="46" height="16" rx="3" fill="#eff6ff"/>
  <text x="75" y="354" text-anchor="middle" class="text-code" fill="#1d4ed8">e_4</text>
  <text x="106" y="353" class="text-subhead" fill="#1e3a8a">EVENT_ORACLE_PASSED</text>
  <text x="254" y="353" class="text-code" fill="#64748b">parent_id: e_3</text>
  <text x="54" y="371" class="text-body">• AST Validator: Exit 0, Clean Syntax; Snapshot committed to disk</text>

  <!-- WAL Entry 5 -->
  <rect x="44" y="386" width="416" height="44" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="52" y="392" width="46" height="16" rx="3" fill="#eff6ff"/>
  <text x="75" y="404" text-anchor="middle" class="text-code" fill="#1d4ed8">e_5</text>
  <text x="106" y="403" class="text-subhead" fill="#1e3a8a">EVENT_STATE_SUSPENDED</text>
  <text x="268" y="403" class="text-code" fill="#64748b">parent_id: e_4</text>
  <text x="54" y="421" class="text-body">• Paused at Oversight Gate #12; HBM context evicted to storage</text>

  <text x="54" y="450" class="text-caption" fill="#2563eb">Immutable disk backing: Sync write before any external actuation</text>

  <!-- Right Side: Crash & Recovery Execution Pipeline -->
  <rect x="492" y="96" width="436" height="370" rx="2" fill="#fdfefe" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="492" y="96" width="436" height="32" rx="2" fill="#f8fafc"/>
  <rect x="492" y="120" width="436" height="8" fill="#f8fafc"/>
  <text x="504" y="117" class="text-header" fill="#0f172a">Sub-50ms Crash Hydration Sequence</text>
  <rect x="806" y="103" width="112" height="18" rx="4" fill="#f1f5f9"/>
  <text x="862" y="116" text-anchor="middle" class="text-badge" fill="#475569">ZERO TOOL RETRY</text>

  <!-- Worker 1 Crash Card -->
  <rect x="504" y="136" width="412" height="66" rx="2" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="514" y="153" class="text-subhead" fill="#991b1b">Worker Node 1: Physical Failure at Turn 4</text>
  <text x="514" y="169" class="text-body">• Host Kernel Panic / OOM Termination / Spot Node Reclaim</text>
  <text x="514" y="183" class="text-caption" fill="#b91c1c">Volatile RAM &amp; KV cache lost; WAL log safely flushed on NVMe</text>
  <rect x="834" y="142" width="72" height="18" rx="3" fill="#fee2e2"/>
  <text x="870" y="154" text-anchor="middle" class="text-badge" fill="#dc2626">CRASHED</text>

  <!-- Arrow down to Hydration Engine -->
  <line x1="710" y1="202" x2="710" y2="222" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Replacement Node Box -->
  <rect x="504" y="224" width="412" height="230" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="504" y="224" width="412" height="26" rx="2" fill="#dcfce7"/>
  <rect x="504" y="242" width="412" height="8" fill="#dcfce7"/>
  <text x="514" y="242" class="text-subhead" fill="#166534">Worker Node 2: Deterministic Replay Hydration (&lt; 50 ms)</text>
  <rect x="834" y="228" width="72" height="18" rx="3" fill="#bbf7d0"/>
  <text x="870" y="240" text-anchor="middle" class="text-badge" fill="#15803d">ACTIVE</text>

  <!-- Step 1 in Replacement -->
