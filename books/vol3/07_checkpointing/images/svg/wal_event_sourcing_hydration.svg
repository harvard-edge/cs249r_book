  <text x="44" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e293b">DURABLE WRITE-AHEAD LOG (WAL) &amp; INSTANT CRASH HYDRATION ARCHITECTURE</text>

  <!-- Left Side: Immutable Append-Only WAL Ledger -->
