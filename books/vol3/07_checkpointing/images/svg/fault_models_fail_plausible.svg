<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: FAIL-STOP (CRASH)                                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="280" height="364" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#334155">1. FAIL-STOP (CRASH)</text>

    <!-- Sub-block 1 -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Failure Manifestation:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Process terminates abruptly, kernel panic</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• OOM killer SIGKILL, dropped TCP socket</text>
    </g>

    <!-- Sub-block 2 -->
    <g transform="translate(10, 106)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Detection Mechanism:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Deterministic: exit code ≠ 0 (137, 139)</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Heartbeat keep-alive timeout, RST packet</text>
    </g>

    <!-- Sub-block 3 -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Systems Recovery:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• OS supervisor restart (systemd / k8s)</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Node failover &amp; idempotent retry</text>
    </g>

    <!-- Sub-block 4: Defense Assessment -->
    <g transform="translate(10, 254)">
      <rect x="0" y="0" width="260" height="98" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="8" y="8" width="244" height="18" rx="1" fill="#e2e8f0"/>
      <text x="130" y="21" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">STANDARD DEFENSE: EFFECTIVE</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">• Clean, unambiguous failure boundary</text>
      <text x="10" y="60" font-size="8.0" fill="#64748b">• Hardware or OS signals failure instantly</text>
      <text x="10" y="76" font-size="8.0" fill="#64748b">• Discard in-flight buffer; state uncorrupted</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: BYZANTINE FAULT                                         -->
  <!-- ================================================================= -->
  <g transform="translate(340, 74)">
    <rect x="0" y="0" width="280" height="364" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">2. BYZANTINE FAULT</text>

    <!-- Sub-block 1 -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Failure Manifestation:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Arbitrary bit flips, memory corruption</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Malicious actor, packet tampering</text>
    </g>

    <!-- Sub-block 2 -->
    <g transform="translate(10, 106)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Detection Mechanism:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Cryptographic hash digest (SHA-256)</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Divergent replica votes across nodes</text>
    </g>

    <!-- Sub-block 3 -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Systems Recovery:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Quorum consensus (PBFT, Raft)</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• 3f + 1 replication masks f faulty nodes</text>
    </g>

    <!-- Sub-block 4: Defense Assessment -->
    <g transform="translate(10, 254)">
      <rect x="0" y="0" width="260" height="98" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
      <rect x="8" y="8" width="244" height="18" rx="1" fill="#fef3c7"/>
      <text x="130" y="21" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">CONSENSUS DEFENSE: EFFECTIVE</text>
      <text x="10" y="44" font-size="8.0" fill="#64748b">• Cryptographically verifiable payloads</text>
      <text x="10" y="60" font-size="8.0" fill="#64748b">• Multi-replica voting suppresses rogues</text>
      <text x="10" y="76" font-size="8.0" fill="#64748b">• Assumes independent non-correlated faults</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: FAIL-PLAUSIBLE DEFECT (AGENTIC MLSYS)                   -->
  <!-- ================================================================= -->
  <g transform="translate(640, 74)">
    <rect x="0" y="0" width="280" height="364" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">3. FAIL-PLAUSIBLE DEFECT (MLSYS)</text>

    <!-- Sub-block 1 -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Failure Manifestation:</text>
      <text x="10" y="34" font-size="8.0" fill="#334155">• Syntactically valid JSON, exit code 0</text>
      <text x="10" y="48" font-size="8.0" font-weight="700" fill="#dc2626">• Confident reasoning; catastrophic flaw</text>
    </g>

    <!-- Sub-block 2 -->
    <g transform="translate(10, 106)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Detection Mechanism:</text>
      <text x="10" y="34" font-size="8.0" font-weight="700" fill="#dc2626">• INVISIBLE to OS &amp; cryptographic hashes</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Demands external verifier oracles</text>
    </g>

    <!-- Sub-block 3 -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="260" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Amplification Hazard:</text>
      <text x="10" y="34" font-size="8.0" font-weight="700" fill="#b91c1c">• Conversational retries compound error</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">• Flawed logic pinned in active KV cache</text>
    </g>

    <!-- Sub-block 4: Defense Assessment -->
    <g transform="translate(10, 254)">
      <rect x="0" y="0" width="260" height="98" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <rect x="8" y="8" width="244" height="18" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
      <text x="130" y="21" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">REQUIRED DEFENSE: SYSTEMS GATES</text>
      <text x="10" y="44" font-size="8.0" fill="#991b1b">• External compiler, AST, and test oracles</text>
      <text x="10" y="60" font-size="8.0" fill="#991b1b">• Reversibility boundaries &amp; Saga compensation</text>
      <text x="10" y="76" font-size="8.0" fill="#991b1b">• Event-sourced WAL deterministic rollbacks</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- FOOTER: CORE SYSTEMS INVARIANT                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="880" height="60" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="880" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">CORE SYSTEMS INVARIANT: SEMANTIC DEFECTS REQUIRE EXTERNAL VERIFICATION ORACLES, NOT CONVERSATIONAL RETRIES</text>
    <text x="12" y="36" font-size="8" fill="#334155">Stochastic foundation models do not fail-stop; they generate plausible yet defective actions with high confidence.</text>
    <text x="12" y="49" font-size="8" fill="#334155">Because checksums verify data integrity rather than cognitive correctness, runtimes must gate execution with deterministic test oracles.</text>
  </g>
</g>
</svg>