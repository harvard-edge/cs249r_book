<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="100%" height="100%">
  <defs>
    <style>
      .chart-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .chart-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #64748B; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #475569; }
      .tick-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748B; }
      .zone-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .zone-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #64748B; text-anchor: middle; }
      .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; }
      .curve-yield { stroke: #059669; stroke-width: 3; fill: none; stroke-linecap: round; }
      .curve-div { stroke: #7C3AED; stroke-width: 2.25; fill: none; stroke-linecap: round; stroke-dasharray: 6 3; }
      .curve-err { stroke: #DC2626; stroke-width: 2.25; fill: none; stroke-linecap: round; stroke-dasharray: 4 3; }
    </style>
    <linearGradient id="opt-zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="collapse-zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="err-zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="940" height="470" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Row 1: Title -->
  <text x="35" y="32" class="chart-title">Sampling Temperature Dynamics in Trajectory Synthesis</text>
  <!-- Row 2: Subtitle -->
  <text x="35" y="52" class="chart-subtitle">Yield of unique verified trajectories versus exploration entropy across softmax temperature T</text>

  <!-- Row 3: Legend -->
  <g transform="translate(35, 76)">
    <!-- Yield line -->
    <line x1="0" y1="6" x2="20" y2="6" stroke="#059669" stroke-width="3"/>
    <circle cx="10" cy="6" r="3.5" fill="#059669"/>
    <text x="26" y="10" class="legend-text" fill="#059669">Usable Yield</text>

    <!-- Diversity line -->
    <line x1="125" y1="6" x2="145" y2="6" stroke="#7C3AED" stroke-width="2.25" stroke-dasharray="6 3"/>
    <text x="151" y="10" class="legend-text" fill="#7C3AED">Exploration Diversity</text>

    <!-- Error line -->
    <line x1="285" y1="6" x2="305" y2="6" stroke="#DC2626" stroke-width="2.25" stroke-dasharray="4 3"/>
    <text x="311" y="10" class="legend-text" fill="#DC2626">Syntax / Schema Errors</text>
  </g>

  <!-- Plot Area: x from 80 to 880 (width 800), y from 105 to 400 (height 295) -->
  <!-- 100% line is at y=150; 0% line is at y=400 (height=250) -->
  
  <!-- Shaded Zones with Dedicated Header Banners (y=105 to 142) -->
  <!-- Zone 1: T in [0.0, 0.4] -> x in [80, 346] -->
  <rect x="80" y="105" width="266" height="295" fill="url(#collapse-zone)"/>
  <line x1="346" y1="105" x2="346" y2="400" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="213" y="124" class="zone-title" fill="#475569">Deterministic Mode Collapse</text>
  <text x="213" y="139" class="zone-desc">Identical greedy paths, zero diversity</text>

  <!-- Zone 2: Optimal Synthesis Regime: T in [0.6, 0.8] -> x in [480, 613] -->
  <rect x="480" y="105" width="133" height="295" fill="url(#opt-zone)"/>
  <line x1="480" y1="105" x2="480" y2="400" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="613" y1="105" x2="613" y2="400" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="546" y="124" class="zone-title" fill="#047857">Optimal Synthesis Regime</text>
  <text x="546" y="139" class="zone-desc" font-weight="600" fill="#047857">Peak Yield (T &#8776; 0.7)</text>

  <!-- Zone 3: T in [0.95, 1.2] -> x in [713, 880] -->
  <rect x="713" y="105" width="167" height="295" fill="url(#err-zone)"/>
  <line x1="713" y1="105" x2="713" y2="400" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="796" y="124" class="zone-title" fill="#B91C1C">Entropy Explosion</text>
  <text x="796" y="139" class="zone-desc">Malformed calls &amp; verifier rejection</text>

  <!-- Grid lines -->
  <line x1="80" y1="400" x2="880" y2="400" stroke="#64748B" stroke-width="1.5"/>
  <line x1="80" y1="150" x2="80" y2="400" stroke="#64748B" stroke-width="1.5"/>

  <line x1="80" y1="337" x2="880" y2="337" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="275" x2="880" y2="275" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="212" x2="880" y2="212" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="150" x2="880" y2="150" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Y-axis ticks & labels -->
  <text x="70" y="404" class="tick-label" text-anchor="end">0%</text>
  <text x="70" y="341" class="tick-label" text-anchor="end">25%</text>
  <text x="70" y="279" class="tick-label" text-anchor="end">50%</text>
  <text x="70" y="216" class="tick-label" text-anchor="end">75%</text>
  <text x="70" y="154" class="tick-label" text-anchor="end">100%</text>
  <text x="26" y="275" class="axis-label" transform="rotate(-90 26 275)" text-anchor="middle">Relative Rate (%)</text>

  <!-- X-axis ticks & labels -->
  <text x="80" y="420" class="tick-label" text-anchor="middle">0.0</text>
  <text x="213" y="420" class="tick-label" text-anchor="middle">0.2</text>
  <text x="347" y="420" class="tick-label" text-anchor="middle">0.4</text>
  <text x="480" y="420" class="tick-label" text-anchor="middle">0.6</text>
  <text x="547" y="420" class="tick-label" text-anchor="middle" font-weight="700" fill="#047857">0.7</text>
  <text x="613" y="420" class="tick-label" text-anchor="middle">0.8</text>
  <text x="747" y="420" class="tick-label" text-anchor="middle">1.0</text>
  <text x="880" y="420" class="tick-label" text-anchor="middle">1.2</text>
  <text x="480" y="450" class="axis-label" text-anchor="middle">Softmax Sampling Temperature (T)</text>

  <!-- Curves: Strictly in range y=[155, 400] -->
  <!-- 1. Exploration Diversity curve (rises smoothly from 5% to 98%) -->
  <!-- 5% -> y=387; 50% -> y=275; 98% -> y=155 -->
  <path d="M 80 387 C 213 380, 347 340, 480 260 C 547 220, 613 185, 747 160 C 813 155, 880 155, 880 155" class="curve-div"/>

  <!-- 2. Syntax / Schema Error Rate (flat near 0% up to T=0.6, then rises exponentially) -->
  <!-- 0% -> y=397; T=0.6: 5% -> y=387; T=0.8: 22% -> y=345; T=1.0: 55% -> y=262; T=1.2: 95% -> y=162 -->
  <path d="M 80 397 C 270 397, 410 395, 480 387 C 547 377, 613 345, 713 262 C 780 205, 830 172, 880 162" class="curve-err"/>

  <!-- 3. Usable Trajectory Yield curve (peaked bell-like curve, max at T=0.7: 96% -> y=160) -->
  <!-- T=0.0: 15% -> y=362; T=0.2: 25% -> y=337; T=0.4: 50% -> y=275; T=0.6: 85% -> y=187; T=0.7: 96% -> y=160; T=0.8: 78% -> y=205; T=1.0: 32% -> y=320; T=1.2: 3% -> y=392 -->
  <path d="M 80 362 C 213 342, 347 285, 480 187 C 515 145, 575 145, 613 205 C 670 270, 747 325, 880 392" class="curve-yield"/>
  
  <!-- Peak Marker Dot -->
  <circle cx="547" cy="160" r="5" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>

</svg>
