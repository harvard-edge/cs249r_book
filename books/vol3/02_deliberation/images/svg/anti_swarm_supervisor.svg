<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7E22CE"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">The Anti-Swarm Principle: Mesh Swarms vs. Hierarchical Supervisor Trees</text>
  <text x="480" y="50" text-anchor="middle" font-size="10.5" fill="#64748B">Why production engineering rejects peer-to-peer agent swarms in favor of unidirectional supervisor topologies</text>

  <!-- LEFT PANEL: Peer-to-Peer Mesh Swarm (Anti-Pattern) -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="420" height="435" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <rect width="420" height="34" rx="8" fill="#991B1B"/>
    <rect y="26" width="420" height="8" fill="#991B1B"/>
    <text x="210" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Anti-Pattern: Peer-to-Peer Mesh Swarm</text>

    <!-- Mesh Graph Visualization -->
    <g transform="translate(40, 50)">
      <!-- Central Warning Badge -->
      <circle cx="170" cy="140" r="32" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="170" y="136" text-anchor="middle" font-size="9" font-weight="700" fill="#991B1B">O(N²)</text>
      <text x="170" y="148" text-anchor="middle" font-size="7.5" fill="#B91C1C">Message Chaos</text>

      <!-- Mesh Edges (Bidirectional Cross-talk) -->
      <!-- A <-> B -->
      <line x1="170" y1="50" x2="60" y2="140" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <line x1="60" y1="140" x2="170" y2="50" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <!-- A <-> C -->
      <line x1="170" y1="50" x2="280" y2="140" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <line x1="280" y1="140" x2="170" y2="50" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <!-- A <-> D -->
      <line x1="170" y1="50" x2="170" y2="230" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- B <-> D -->
      <line x1="60" y1="140" x2="170" y2="230" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <line x1="170" y1="230" x2="60" y2="140" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <!-- C <-> D -->
      <line x1="280" y1="140" x2="170" y2="230" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <line x1="170" y1="230" x2="280" y2="140" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
      <!-- B <-> C -->
      <line x1="60" y1="140" x2="280" y2="140" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Nodes -->
      <!-- Agent A (Top) -->
      <circle cx="170" cy="40" r="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="170" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">Agent A</text>

      <!-- Agent B (Left) -->
      <circle cx="50" cy="140" r="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="50" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">Agent B</text>

      <!-- Agent C (Right) -->
      <circle cx="290" cy="140" r="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="290" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">Agent C</text>

      <!-- Agent D (Bottom) -->
      <circle cx="170" cy="240" r="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
      <text x="170" y="244" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">Agent D</text>
    </g>

    <!-- Failure Mechanisms Card -->
    <g transform="translate(20, 315)">
      <rect width="380" height="100" rx="5" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text x="14" y="18" font-size="9" font-weight="700" fill="#991B1B">Production Failure Modes:</text>
      <text x="14" y="34" font-size="8" fill="#7F1D1D">• <tspan font-weight="700">Context Dilution:</tspan> Everyone sees everything; quadratic token waste</text>
      <text x="14" y="48" font-size="8" fill="#7F1D1D">• <tspan font-weight="700">Echo Chambers:</tspan> Hallucinated facts circulate and gain false consensus</text>
      <text x="14" y="62" font-size="8" fill="#7F1D1D">• <tspan font-weight="700">Diffused Responsibility:</tspan> No single root entity owns the terminal state</text>
      <text x="14" y="76" font-size="8" fill="#7F1D1D">• <tspan font-weight="700">Infinite Banter:</tspan> Agents thank and validate each other without acting</text>
      <text x="14" y="90" font-size="8" font-weight="700" fill="#DC2626">Result: High token burn, nondeterministic livelock</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Hierarchical Supervisor Tree (Production Standard) -->
  <g transform="translate(500, 75)" filter="url(#shadow)">
    <rect width="420" height="435" rx="8" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.2"/>
    <rect width="420" height="34" rx="8" fill="#581C87"/>
    <rect y="26" width="420" height="8" fill="#581C87"/>
    <text x="210" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Production Standard: Hierarchical Supervisor Tree</text>

    <!-- Tree Visualization -->
    <g transform="translate(20, 50)">
      <!-- Root Supervisor -->
      <g transform="translate(70, 0)">
        <rect width="240" height="56" rx="6" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.5"/>
        <text x="120" y="20" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581C87">Supervisor Agent (Orchestrator ACB)</text>
        <text x="120" y="34" text-anchor="middle" font-size="8" fill="#6B21A8">Owns Global State, Plan DAG, &amp; Task Budget</text>
        <text x="120" y="47" text-anchor="middle" font-size="7.5" fill="#059669">Root Accountability &amp; Termination Invariant</text>
      </g>

      <!-- Downward Delegation Edges (Command Payloads) -->
      <path d="M 120 56 L 50 115" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <text x="60" y="80" font-size="7.5" font-weight="600" fill="#7E22CE">Task A</text>

      <path d="M 190 56 L 190 115" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <text x="195" y="85" font-size="7.5" font-weight="600" fill="#7E22CE">Task B</text>

      <path d="M 260 56 L 330 115" stroke="#7E22CE" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <text x="310" y="80" font-size="7.5" font-weight="600" fill="#7E22CE">Task C</text>

      <!-- Context Isolation Boundary Line -->
      <line x1="0" y1="100" x2="380" y2="100" stroke="#A855F7" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="375" y="96" text-anchor="end" font-size="7.5" font-weight="700" fill="#9333EA">Context Isolation Boundary</text>

      <!-- Worker 1: Code Search -->
      <g transform="translate(0, 120)">
        <rect width="115" height="66" rx="5" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
        <text x="57" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Search Worker</text>
        <text x="57" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Tool: Ripgrep / AST</text>
        <rect x="10" y="38" width="95" height="18" rx="3" fill="#F3E8FF" stroke="#C084FC" stroke-width="0.8"/>
        <text x="57" y="50" text-anchor="middle" font-size="7" font-weight="600" fill="#6B21A8">Scoped Context Only</text>
      </g>

      <!-- Worker 2: Code Gen -->
      <g transform="translate(132, 120)">
        <rect width="115" height="66" rx="5" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
        <text x="57" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">CodeGen Worker</text>
        <text x="57" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Tool: File Editor</text>
        <rect x="10" y="38" width="95" height="18" rx="3" fill="#F3E8FF" stroke="#C084FC" stroke-width="0.8"/>
        <text x="57" y="50" text-anchor="middle" font-size="7" font-weight="600" fill="#6B21A8">Scoped Context Only</text>
      </g>

      <!-- Worker 3: Sandbox Exec -->
      <g transform="translate(265, 120)">
        <rect width="115" height="66" rx="5" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1"/>
        <text x="57" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Sandbox Worker</text>
        <text x="57" y="30" text-anchor="middle" font-size="7.5" fill="#475569">Tool: Bash / Docker</text>
        <rect x="10" y="38" width="95" height="18" rx="3" fill="#F3E8FF" stroke="#C084FC" stroke-width="0.8"/>
        <text x="57" y="50" text-anchor="middle" font-size="7" font-weight="600" fill="#6B21A8">Scoped Context Only</text>
      </g>

      <!-- Verifier Gatekeeper Intercept -->
      <g transform="translate(70, 210)">
        <!-- Upward Return Edges to Gatekeeper -->
        <path d="M -15 -24 L 30 0" stroke="#059669" stroke-width="1.2" stroke-dasharray="2 2"/>
        <path d="M 120 -24 L 120 0" stroke="#059669" stroke-width="1.2" stroke-dasharray="2 2"/>
        <path d="M 255 -24 L 210 0" stroke="#059669" stroke-width="1.2" stroke-dasharray="2 2"/>

        <rect width="240" height="42" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
        <text x="120" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#065F46">Schema Verifier &amp; Test Oracle</text>
        <text x="120" y="32" text-anchor="middle" font-size="7.5" fill="#047857">Validates JSON Schema &amp; Invariants before State Commit</text>
      </g>

      <!-- Verified Upward Return to Supervisor -->
      <path d="M 190 210 L 190 60" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-emerald)"/>
    </g>

    <!-- Architectural Invariants Card -->
    <g transform="translate(20, 315)">
      <rect width="380" height="100" rx="5" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="14" y="18" font-size="9" font-weight="700" fill="#581C87">Architectural Invariants Guaranteed:</text>
      <text x="14" y="34" font-size="8" fill="#475569">• <tspan font-weight="700">Strict Hierarchy:</tspan> Workers cannot communicate with peers; zero chatter</text>
      <text x="14" y="48" font-size="8" fill="#475569">• <tspan font-weight="700">Context Isolation:</tspan> Workers receive only strict sub-prompts, saving tokens</text>
      <text x="14" y="62" font-size="8" fill="#475569">• <tspan font-weight="700">Schema Gating:</tspan> Unstructured babble rejected before reaching supervisor</text>
      <text x="14" y="76" font-size="8" fill="#475569">• <tspan font-weight="700">Monotonic Convergence:</tspan> Supervisor enforces progress invariants or aborts</text>
      <text x="14" y="90" font-size="8" font-weight="700" fill="#059669">Result: Deterministic reliability, bounded cost, auditability</text>
    </g>
  </g>
</svg>
