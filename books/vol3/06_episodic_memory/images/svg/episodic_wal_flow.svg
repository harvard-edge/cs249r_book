<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="510" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="900" height="470" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">TRANSACTIONAL WRITE-AHEAD LOGGING (WAL) &amp; ACTUATION RECOVERY LIFECYCLE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Ensuring actuation safety, failure atomicity, and compensating rollback across tool invocations</text>

  <!-- ================================================================= -->
  <!-- THREE COLUMNS: AGENT CORE | NVMe WAL | EXTERNAL WORLD              -->
  <!-- ================================================================= -->

  <!-- Column 1: Agent Runtime Core (Left: x=40) -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="260" height="260" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">1. AGENT RUNTIME (VOLATILE CORE)</text>

    <!-- State Box -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="236" height="52" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="15" font-size="7.5" font-weight="700" fill="#0369a1">Current System State: s_t</text>
      <text x="8" y="28" font-size="6.8" fill="#334155">Active prompt buffer + KV cache</text>
      <text x="8" y="42" font-family="Courier, monospace" font-size="6.5" fill="#64748b">LSN_current: 0x004F8A20 | turn: 14</text>
    </g>

    <!-- Propose Action Box -->
    <g transform="translate(12, 94)">
      <rect x="0" y="0" width="236" height="66" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <text x="8" y="15" font-size="7.5" font-weight="700" fill="#0369a1">Action Proposal: a_t ~ π(· | s_t)</text>
      <text x="8" y="28" font-size="6.8" fill="#334155">Tool: bash_exec("rm -rf build &amp;&amp; make")</text>
      <rect x="8" y="36" width="220" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="118" y="50" text-anchor="middle" font-size="6.5" font-weight="700" fill="#991b1b">ACTUATION HAZARD: Irreversible Mutation</text>
    </g>

    <!-- Strict Gate Invariant Rule -->
    <g transform="translate(12, 168)">
      <rect x="0" y="0" width="236" height="80" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="7" font-weight="700" fill="#0f172a">The WAL Invariant (Gray 1981):</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">"Never dispatch external side effects</text>
      <text x="8" y="40" font-size="6.2" fill="#475569">across the network/sandbox boundary</text>
      <text x="8" y="52" font-size="6.2" fill="#475569">until intention &amp; rollback parameters</text>
      <text x="8" y="64" font-size="6.2" fill="#475569">are durably committed to disk."</text>
    </g>
  </g>

  <!-- Flow 1 Arrow: Core to WAL fsync -->
  <g transform="translate(303, 145)">
    <path d="M0,0 L32,0" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-amber)"/>
    <text x="16" y="-7" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Step 1</text>
    <text x="16" y="13" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#b45309">fsync()</text>
  </g>

  <!-- Column 2: Non-Volatile WAL Engine (Center: x=340) -->
  <g transform="translate(340, 72)">
    <rect x="0" y="0" width="260" height="260" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">2. TRANSACTIONAL WAL (LOCAL NVMe)</text>

    <!-- WAL Table Records -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="240" height="142" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>

      <!-- Table Header -->
      <rect x="0" y="0" width="240" height="18" fill="#fef3c7"/>
      <text x="6" y="12" font-size="6.5" font-weight="700" fill="#78350f">LSN</text>
      <text x="42" y="12" font-size="6.5" font-weight="700" fill="#78350f">Tx ID</text>
      <text x="82" y="12" font-size="6.5" font-weight="700" fill="#78350f">Action Record</text>
      <text x="175" y="12" font-size="6.5" font-weight="700" fill="#78350f">Status</text>

      <!-- Row 1: Prior Committed -->
      <line x1="0" y1="18" x2="240" y2="18" stroke="#fef3c7"/>
      <text x="6" y="30" font-family="Courier, monospace" font-size="6" fill="#64748b">#021</text>
      <text x="42" y="30" font-family="Courier, monospace" font-size="6" fill="#64748b">TX-801</text>
      <text x="82" y="30" font-size="6" fill="#334155">git checkout dev</text>
      <rect x="175" y="21" width="58" height="12" rx="1" fill="#dcfce7"/>
      <text x="204" y="30" text-anchor="middle" font-size="5.5" font-weight="700" fill="#15803d">COMMITTED</text>

      <!-- Row 2: Prior Committed -->
      <line x1="0" y1="36" x2="240" y2="36" stroke="#fef3c7"/>
      <text x="6" y="48" font-family="Courier, monospace" font-size="6" fill="#64748b">#022</text>
      <text x="42" y="48" font-family="Courier, monospace" font-size="6" fill="#64748b">TX-802</text>
      <text x="82" y="48" font-size="6" fill="#334155">patch Makefile</text>
      <rect x="175" y="39" width="58" height="12" rx="1" fill="#dcfce7"/>
      <text x="204" y="48" text-anchor="middle" font-size="5.5" font-weight="700" fill="#15803d">COMMITTED</text>

      <!-- Row 3: ACTIVE PENDING TRANSACTION (Current) -->
      <line x1="0" y1="54" x2="240" y2="54" stroke="#d97706" stroke-width="1.2"/>
      <rect x="0" y="54" width="240" height="22" fill="#fef3c7" opacity="0.6"/>
      <text x="6" y="68" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#b45309">#023</text>
      <text x="42" y="68" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#b45309">TX-803</text>
      <text x="82" y="68" font-size="6" font-weight="700" fill="#b45309">rm -rf build</text>
      <rect x="175" y="59" width="58" height="12" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="204" y="68" text-anchor="middle" font-size="5.8" font-weight="700" fill="#991b1b">PENDING</text>

      <!-- Compensating Saga Meta -->
      <line x1="0" y1="76" x2="240" y2="76" stroke="#fef3c7"/>
      <rect x="6" y="82" width="228" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="94" font-size="6.2" font-weight="700" fill="#475569">Saga Compensation Payload:</text>
      <text x="10" y="106" font-family="Courier, monospace" font-size="5.8" fill="#334155">rollback: "git stash -u &amp;&amp; git clean -fd"</text>
      <text x="10" y="117" font-family="Courier, monospace" font-size="5.8" fill="#334155">pre_state_hash: 0x98A4DFE2... (SHA-256)</text>
      <text x="10" y="128" font-size="5.8" fill="#64748b">Timeout deadline: 30,000 ms</text>
    </g>

    <!-- Fsync Verification Box -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="240" height="68" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#15803d">NVMe Barrier Confirmation:</text>
      <text x="8" y="27" font-size="6.2" fill="#334155">Log buffer flushed to persistent NAND flash.</text>
      <text x="8" y="38" font-size="6.2" fill="#334155">Storage controller acknowledges write barrier.</text>
      <rect x="8" y="46" width="224" height="15" rx="1" fill="#dcfce7"/>
      <text x="120" y="57" text-anchor="middle" font-family="Courier, monospace" font-size="6" font-weight="700" fill="#15803d">O_SYNC / fsync() return: 0 (OK)</text>
    </g>
  </g>

  <!-- Flow 2 Arrow: WAL to External Dispatch -->
  <g transform="translate(603, 145)">
    <path d="M0,0 L32,0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="16" y="-7" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Step 2</text>
    <text x="16" y="13" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">Dispatch</text>
  </g>

  <!-- Column 3: Untrusted External Environment (Right: x=640) -->
  <g transform="translate(640, 72)">
    <rect x="0" y="0" width="260" height="260" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">3. EXTERNAL RUNTIME (SANDBOX)</text>

    <!-- Tool Execution Target -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="236" height="64" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803d">Tool Execution Engine</text>
      <text x="8" y="27" font-size="6.5" fill="#334155">Target: Container / gVisor sandbox</text>
      <text x="8" y="39" font-family="Courier, monospace" font-size="6.2" fill="#475569">$ bash -c "rm -rf build &amp;&amp; make"</text>
      <rect x="8" y="46" width="220" height="14" rx="1" fill="#f0fdf4"/>
      <text x="118" y="56" text-anchor="middle" font-size="6.2" fill="#15803d">Side effect applies to environment</text>
    </g>

    <!-- Failure Scenarios Box -->
    <g transform="translate(12, 104)">
      <rect x="0" y="0" width="236" height="74" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#991b1b">Execution Crash / Disconnection Hazards:</text>
      <text x="8" y="27" font-size="6.2" fill="#7f1d1d">• Container OOM-Killed (SIGKILL 137)</text>
      <text x="8" y="39" font-size="6.2" fill="#7f1d1d">• Host network socket partition / timeout</text>
      <text x="8" y="51" font-size="6.2" fill="#7f1d1d">• Power failure before tool stdout returns</text>
      <text x="8" y="65" font-size="6.2" font-weight="700" fill="#991b1b">State: Environment left corrupted / partial!</text>
    </g>

    <!-- Normal ACK Return -->
    <g transform="translate(12, 184)">
      <rect x="0" y="0" width="236" height="64" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#0f172a">Normal Path: Observation Record</text>
      <text x="8" y="27" font-size="6.2" fill="#334155">Exit code 0 ➔ Return observation o_t</text>
      <text x="8" y="39" font-size="6.2" fill="#334155">Commit marker appended to WAL (TX-803: OK)</text>
      <rect x="8" y="46" width="220" height="14" rx="1" fill="#dcfce7"/>
      <text x="118" y="56" text-anchor="middle" font-size="6.2" font-weight="700" fill="#15803d">Full Transaction Complete</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SECTION: CRASH RECOVERY & SAGA ROLLBACK (POST-REBOOT)     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 348)">
    <rect x="0" y="0" width="860" height="126" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="860" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">REHYDRATION &amp; COMPENSATING SAGA CRASH RECOVERY ENGINE (POST-REBOOT)</text>

    <!-- Left: Tail Scan -->
    <g transform="translate(12, 30)">
      <rect x="0" y="0" width="255" height="88" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#991b1b">1. Tail Scan &amp; Incomplete Tx Detection</text>
      <text x="8" y="28" font-size="6.5" fill="#334155">On process restart, recovery thread</text>
      <text x="8" y="40" font-size="6.5" fill="#334155">reads WAL forward from checkpoint.</text>
      <text x="8" y="52" font-size="6.5" fill="#334155">Detects <tspan font-family="Courier, monospace" font-weight="700" fill="#dc2626">TX-803</tspan> logged as <tspan font-weight="700" fill="#dc2626">PENDING</tspan></text>
      <text x="8" y="64" font-size="6.5" fill="#7f1d1d">with zero matching commit record!</text>
      <rect x="8" y="70" width="239" height="14" rx="1" fill="#fee2e2"/>
      <text x="127" y="80" text-anchor="middle" font-size="6" font-weight="700" fill="#991b1b">Flagged: Uncommitted In-Flight Mutation</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M269,74 L289,74" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Middle: Compensating Saga Execution -->
    <g transform="translate(293, 30)">
      <rect x="0" y="0" width="270" height="88" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#991b1b">2. Compensating Saga Dispatch</text>
      <text x="8" y="28" font-size="6.5" fill="#334155">Recovery engine refuses blind retry.</text>
      <text x="8" y="40" font-size="6.5" fill="#334155">Executes inverse compensation action:</text>
      <rect x="8" y="46" width="254" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="12" y="58" font-family="Courier, monospace" font-size="6" font-weight="700" fill="#991b1b">$ git reset --hard &amp;&amp; git clean -fd</text>
      <text x="8" y="78" font-size="6.2" fill="#7f1d1d">Cleans partially generated artifacts &amp; restores s_t.</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M565,74 L585,74" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Right: Consistent State Restored -->
    <g transform="translate(589, 30)">
      <rect x="0" y="0" width="259" height="88" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#15803d">3. Environmental Consistency Restored</text>
      <text x="8" y="28" font-size="6.5" fill="#334155">Hash(s_restored) matches pre-state hash.</text>
      <text x="8" y="40" font-size="6.5" fill="#334155">Appends <tspan font-family="Courier, monospace" font-weight="700" fill="#15803d">TX-803: ABORTED</tspan> record.</text>
      <text x="8" y="52" font-size="6.5" fill="#334155">Agent safely resumes execution loop.</text>
      <rect x="8" y="62" width="243" height="20" rx="1" fill="#dcfce7"/>
      <text x="129" y="73" text-anchor="middle" font-size="6.2" font-weight="700" fill="#15803d">INVARIANT GUARANTEED</text>
      <text x="129" y="80" text-anchor="middle" font-size="5.5" fill="#14532d">Zero Phantom Mutations / Leaked State</text>
    </g>
  </g>

</svg>
