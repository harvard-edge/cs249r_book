<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .timeline-card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 4px; }
      .proto-pill { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .proto-spec { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; }
      .lane-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1e293b; }
      .block-txt { font-family: ui-monospace, monospace; font-size: 8.5px; text-anchor: middle; dominant-baseline: central; }
      .sub-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; fill: #475569; }
      .alert-txt { font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 700; fill: #991b1b; text-anchor: middle; dominant-baseline: central; }
    </style>

    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PROTOCOL 1: SYNCHRONOUS INCREMENTAL RE-INDEXING                   -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="940" height="165" class="timeline-card"/>
    <rect x="12" y="10" width="250" height="22" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="18" y="25" class="proto-pill" fill="#991b1b">PROTOCOL 1: SYNCHRONOUS RE-INDEX</text>
    <text x="275" y="25" class="proto-spec">Trade-off: Zero index staleness, but blocking latency stalls agent execution loop (1.25s stall)</text>

    <!-- Timeline Axis -->
    <line x1="180" y1="145" x2="900" y2="145" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arr-axis)"/>
    <text x="910" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#64748b">Time t</text>

    <!-- Lanes -->
    <!-- Lane A: Agent Execution Loop -->
    <text x="20" y="65" class="lane-label">Agent Execution Loop</text>
    <rect x="175" y="50" width="85" height="26" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="217" y="63" class="block-txt" fill="#1e40af">Turn t: Edit</text>

    <!-- Mutation Point t_w -->
    <line x1="268" y1="42" x2="268" y2="145" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="268" y="38" font-family="ui-monospace, monospace" font-size="8.5px" font-weight="700" fill="#dc2626" text-anchor="middle">w(D_j, t_w)</text>

    <!-- Agent Stalled Block -->
    <rect x="275" y="50" width="365" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="457" y="63" class="alert-txt">BLOCKED: STALLED ON SYNCHRONOUS RE-INDEXING (Δt_stall ≈ 1250 ms)</text>

    <!-- Agent Resumes -->
    <rect x="648" y="50" width="135" height="26" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="715" y="63" class="block-txt" fill="#15803d">Turn t+1: Search Code</text>

    <!-- Lane B: Storage Subsystem -->
    <text x="20" y="105" class="lane-label">Storage Subsystem</text>
    <!-- Disk write (fast) -->
    <rect x="275" y="90" width="48" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="299" y="102" class="block-txt" font-size="7.5px" fill="#14532d">NVMe 8ms</text>

    <!-- AST Parsing + BM25 + Embed Pass -->
    <rect x="330" y="90" width="310" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="485" y="102" class="block-txt" fill="#b45309">Parse AST (15ms) + Re-tokenize BM25 + Batch GPU Embed (1200ms)</text>

    <rect x="648" y="90" width="75" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="685" y="102" class="block-txt" font-weight="700" fill="#15803d">Fresh Index</text>
  </g>

  <!-- ================================================================= -->
  <!-- PROTOCOL 2: ASYNCHRONOUS EVENT-DRIVEN RE-INDEXING                 -->
  <!-- ================================================================= -->
  <g transform="translate(30, 205)">
    <rect width="940" height="175" class="timeline-card"/>
    <rect x="12" y="10" width="250" height="22" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <text x="18" y="25" class="proto-pill" fill="#b45309">PROTOCOL 2: ASYNCHRONOUS RE-INDEX</text>
    <text x="275" y="25" class="proto-spec">Trade-off: Fast agent response, but unfenced staleness window causes self-contradiction oscillation</text>

    <!-- Timeline Axis -->
    <line x1="180" y1="155" x2="900" y2="155" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arr-axis)"/>
    <text x="910" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#64748b">Time t</text>

    <!-- Lanes -->
    <text x="20" y="65" class="lane-label">Agent Execution Loop</text>
    <rect x="175" y="50" width="85" height="26" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="217" y="63" class="block-txt" fill="#1e40af">Turn t: Edit</text>

    <!-- Mutation Point t_w -->
    <line x1="268" y1="42" x2="268" y2="155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="268" y="38" font-family="ui-monospace, monospace" font-size="8.5px" font-weight="700" fill="#dc2626" text-anchor="middle">w(D_j, t_w)</text>

    <!-- Agent Resumes Immediately without stall -->
    <rect x="275" y="50" width="130" height="26" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="340" y="63" class="block-txt" fill="#1e40af">Agent Decodes Action</text>

    <!-- Stale Query Invocation inside Staleness Window -->
    <rect x="415" y="50" width="170" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="500" y="63" class="alert-txt">Turn t+1: Query Code (STALE!)</text>

    <!-- Oscillation Loop Box -->
    <rect x="595" y="50" width="190" height="26" rx="2" fill="#fee2e2" stroke="#991b1b" stroke-dasharray="2,2"/>
    <text x="690" y="63" class="alert-txt">Self-Contradiction / Revert Loop</text>

    <!-- Lane B: Storage Subsystem & Background Worker -->
    <text x="20" y="105" class="lane-label">Storage Subsystem</text>
    <!-- Disk write -->
    <rect x="275" y="88" width="48" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="299" y="100" class="block-txt" font-size="7.5px" fill="#14532d">NVMe 8ms</text>

    <!-- Background re-indexing worker -->
    <rect x="330" y="88" width="365" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="512" y="100" class="block-txt" fill="#475569">Background Worker: Async Queue Re-indexing in Progress...</text>

    <!-- Finished Re-index -->
    <rect x="702" y="88" width="80" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="742" y="100" class="block-txt" font-weight="700" fill="#15803d">Fresh Index</text>

    <!-- Staleness Window Bracket -->
    <rect x="275" y="120" width="425" height="22" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="2,2"/>
    <text x="487" y="131" class="alert-txt" font-size="8px">UNFENCED STALENESS WINDOW Δt: Queries retrieve obsolete code before background completion</text>
  </g>

  <!-- ================================================================= -->
  <!-- PROTOCOL 3: READ-TIME TOMBSTONING (GENERATION TAGGING)            -->
  <!-- ================================================================= -->
  <g transform="translate(30, 400)">
    <rect width="940" height="175" class="timeline-card"/>
    <rect x="12" y="10" width="250" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="18" y="25" class="proto-pill" fill="#047857">PROTOCOL 3: READ-TIME TOMBSTONING</text>
    <text x="275" y="25" class="proto-spec">Optimal Systems Policy: Instant memory generation tag eliminates stalls and guarantees zero stale reads</text>

    <!-- Timeline Axis -->
    <line x1="180" y1="155" x2="900" y2="155" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arr-axis)"/>
    <text x="910" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#64748b">Time t</text>

    <!-- Lanes -->
    <text x="20" y="65" class="lane-label">Agent Execution Loop</text>
    <rect x="175" y="50" width="85" height="26" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="217" y="63" class="block-txt" fill="#1e40af">Turn t: Edit</text>

    <!-- Mutation Point t_w -->
    <line x1="268" y1="42" x2="268" y2="155" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="268" y="38" font-family="ui-monospace, monospace" font-size="8.5px" font-weight="700" fill="#15803d" text-anchor="middle">w(D_j, t_w)</text>

    <!-- Agent Resumes with Zero Stall -->
    <rect x="275" y="50" width="130" height="26" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="340" y="63" class="block-txt" fill="#1e40af">Agent Decodes Action</text>

    <!-- Query at t+1: Protected by Tombstone -->
    <rect x="415" y="50" width="190" height="26" rx="2" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="510" y="63" class="block-txt" font-weight="700" fill="#15803d">Turn t+1: Query (Tombstone Filtered)</text>

    <!-- Agent Executes with Fresh Context -->
    <rect x="615" y="50" width="170" height="26" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="700" y="63" class="block-txt" fill="#15803d">Accurate Progress (No Loops)</text>

    <!-- Lane B: Storage Subsystem -->
    <text x="20" y="105" class="lane-label">Storage Subsystem</text>
    <!-- Disk write + In-Memory Tag -->
    <rect x="275" y="88" width="130" height="24" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="340" y="100" class="block-txt" font-weight="700" fill="#047857">Tag g_new in DRAM (0.2 ms)</text>

    <!-- Async Background Worker -->
    <rect x="415" y="88" width="280" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="555" y="100" class="block-txt" fill="#475569">Async Worker Re-indexes in Background...</text>

    <!-- Reconciled State -->
    <rect x="705" y="88" width="80" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="745" y="100" class="block-txt" font-weight="700" fill="#15803d">Reconciled</text>

    <!-- Tombstone Mechanism Highlight -->
    <rect x="415" y="120" width="370" height="22" rx="2" fill="#f0fdf4" stroke="#86efac"/>
    <text x="600" y="131" class="block-txt" font-size="8px" font-weight="700" fill="#14532d">Read-Time Filter: Drops candidates where g_chunk &lt; g_live; routes to authoritative disk read</text>
  </g>
</svg>