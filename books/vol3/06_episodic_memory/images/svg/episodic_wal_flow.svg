<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="490" fill="#ffffff"/>

  <!-- Main Container -->
  <rect x="20" y="15" width="900" height="460" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="15" width="900" height="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="32" y="32" font-size="9" font-weight="700" fill="#1e293b">TRANSACTIONAL WRITE-AHEAD LOGGING (WAL) &amp; ACTUATION RECOVERY LIFECYCLE</text>

  <!-- ================================================================= -->
  <!-- THREE COLUMNS: AGENT CORE | NVMe WAL | EXTERNAL WORLD              -->
  <!-- ================================================================= -->

  <!-- Column 1: Agent Runtime Core (Left: x=35) -->
  <g transform="translate(35, 52)">
    <rect x="0" y="0" width="265" height="260" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="22" fill="#e0f2fe"/>
    <text x="10" y="15" font-size="7.8" font-weight="700" fill="#0369a1">1. AGENT RUNTIME (VOLATILE CORE)</text>

    <!-- State Box -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="235" height="52" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#0369a1">Current System State: s_t</text>
      <text x="8" y="26" font-size="6.5" fill="#334155">Active prompt buffer + KV cache</text>
      <text x="8" y="38" font-family="Courier, monospace" font-size="6.2" fill="#64748b">LSN_current: 0x004F8A20 | turn: 14</text>
    </g>

    <!-- Propose Action Box -->
    <g transform="translate(15, 96)">
      <rect x="0" y="0" width="235" height="62" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#0369a1">Action Proposal: a_t ~ π(· | s_t)</text>
      <text x="8" y="26" font-size="6.5" fill="#334155">Tool: bash_exec("rm -rf build &amp;&amp; make")</text>
      <rect x="8" y="34" width="219" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="117" y="47" text-anchor="middle" font-size="6.2" font-weight="700" fill="#b91c1c">ACTUATION HAZARD: Irreversible Mutation</text>
    </g>

    <!-- Strict Gate Invariant Rule -->
    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="235" height="75" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#1e293b">The WAL Invariant (Gray 1981):</text>
      <text x="8" y="26" font-size="6.2" fill="#475569">"Never dispatch external side effects</text>
      <text x="8" y="37" font-size="6.2" fill="#475569">across the network/sandbox boundary</text>
      <text x="8" y="48" font-size="6.2" fill="#475569">until intention &amp; rollback parameters</text>
      <text x="8" y="59" font-size="6.2" fill="#475569">are durably committed to disk."</text>
    </g>
  </g>

  <!-- Flow 1 Arrow: Core to WAL fsync -->
  <g transform="translate(300, 115)">
    <path d="M0,0 L35,0" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
    <text x="17" y="-6" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b45309">Step 1</text>
    <text x="17" y="12" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" fill="#b45309">fsync()</text>
  </g>

  <!-- Column 2: Non-Volatile WAL Engine (Center: x=335) -->
  <g transform="translate(335, 52)">
    <rect x="0" y="0" width="270" height="260" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <rect x="0" y="0" width="270" height="22" fill="#fef3c7"/>
    <text x="10" y="15" font-size="7.8" font-weight="700" fill="#b45309">2. TRANSACTIONAL WAL (LOCAL NVMe)</text>

    <!-- WAL Table Records -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="246" height="140" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect x="0" y="0" width="246" height="18" fill="#fef3c7"/>
      <text x="6" y="12" font-size="6.5" font-weight="700" fill="#78350f">LSN</text>
      <text x="45" y="12" font-size="6.5" font-weight="700" fill="#78350f">Tx ID</text>
      <text x="85" y="12" font-size="6.5" font-weight="700" fill="#78350f">Action Record</text>
      <text x="180" y="12" font-size="6.5" font-weight="700" fill="#78350f">Status</text>

      <!-- Row 1: Prior Committed -->
      <line x1="0" y1="18" x2="246" y2="18" stroke="#fef3c7"/>
      <text x="6" y="30" font-family="Courier, monospace" font-size="5.8" fill="#64748b">#021</text>
      <text x="45" y="30" font-family="Courier, monospace" font-size="5.8" fill="#64748b">TX-801</text>
      <text x="85" y="30" font-size="5.8" fill="#334155">git checkout dev</text>
      <rect x="180" y="22" width="58" height="11" rx="1" fill="#dcfce7"/>
      <text x="209" y="30" text-anchor="middle" font-size="5.5" font-weight="700" fill="#15803d">COMMITTED</text>

      <!-- Row 2: Prior Committed -->
      <line x1="0" y1="36" x2="246" y2="36" stroke="#fef3c7"/>
      <text x="6" y="48" font-family="Courier, monospace" font-size="5.8" fill="#64748b">#022</text>
      <text x="45" y="48" font-family="Courier, monospace" font-size="5.8" fill="#64748b">TX-802</text>
      <text x="85" y="48" font-size="5.8" fill="#334155">patch Makefile</text>
      <rect x="180" y="40" width="58" height="11" rx="1" fill="#dcfce7"/>
      <text x="209" y="48" text-anchor="middle" font-size="5.5" font-weight="700" fill="#15803d">COMMITTED</text>

      <!-- Row 3: ACTIVE PENDING TRANSACTION (Current) -->
      <line x1="0" y1="54" x2="246" y2="54" stroke="#d97706" stroke-width="1.2"/>
      <rect x="0" y="54" width="246" height="22" fill="#fef3c7" opacity="0.5"/>
      <text x="6" y="68" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#b45309">#023</text>
      <text x="45" y="68" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#b45309">TX-803</text>
      <text x="85" y="68" font-size="6" font-weight="700" fill="#b45309">rm -rf build</text>
      <rect x="180" y="60" width="58" height="12" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="209" y="69" text-anchor="middle" font-size="5.8" font-weight="700" fill="#b91c1c">PENDING</text>

      <!-- Compensating Saga Meta -->
      <line x1="0" y1="76" x2="246" y2="76" stroke="#fef3c7"/>
      <rect x="6" y="82" width="234" height="50" rx="1" fill="#fafafa" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="94" font-size="6" font-weight="700" fill="#475569">Saga Compensation Payload:</text>
      <text x="12" y="105" font-family="Courier, monospace" font-size="5.5" fill="#334155">rollback_cmd: "git stash -u &amp;&amp; git clean -fd"</text>
      <text x="12" y="116" font-family="Courier, monospace" font-size="5.5" fill="#334155">pre_state_hash: 0x98A4DFE2... (SHA-256)</text>
      <text x="12" y="126" font-size="5.5" fill="#64748b">Timeout deadline: 30,000 ms</text>
    </g>

    <!-- Fsync Verification Pill -->
    <g transform="translate(12, 182)">
      <rect x="0" y="0" width="246" height="65" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#15803d">NVMe Barrier Confirmation:</text>
      <text x="8" y="26" font-size="6.2" fill="#334155">Log buffer flushed to persistent NAND flash.</text>
      <text x="8" y="37" font-size="6.2" fill="#334155">Storage controller acknowledges write barrier.</text>
      <rect x="8" y="44" width="230" height="14" rx="1" fill="#dcfce7"/>
      <text x="123" y="54" text-anchor="middle" font-family="Courier, monospace" font-size="6" font-weight="700" fill="#15803d">O_SYNC / fsync() return: 0 (OK)</text>
    </g>
  </g>

  <!-- Flow 2 Arrow: WAL to External Dispatch -->
  <g transform="translate(605, 115)">
    <path d="M0,0 L35,0" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="17" y="-6" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">Step 2</text>
    <text x="17" y="12" text-anchor="middle" font-size="6.2" fill="#15803d">Dispatch</text>
  </g>

  <!-- Column 3: Untrusted External Environment (Right: x=640) -->
  <g transform="translate(640, 52)">
    <rect x="0" y="0" width="265" height="260" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="22" fill="#dcfce7"/>
    <text x="10" y="15" font-size="7.8" font-weight="700" fill="#15803d">3. EXTERNAL RUNTIME (SANDBOX)</text>

    <!-- Tool Execution Target -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="235" height="62" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#15803d">Tool Execution Engine</text>
      <text x="8" y="26" font-size="6.5" fill="#334155">Target: Container / gVisor sandbox</text>
      <text x="8" y="37" font-family="Courier, monospace" font-size="6" fill="#475569">$ bash -c "rm -rf build &amp;&amp; make"</text>
      <rect x="8" y="43" width="219" height="14" rx="1" fill="#f0fdf4"/>
      <text x="117" y="53" text-anchor="middle" font-size="6" fill="#15803d">Side effect applies to environment</text>
    </g>

    <!-- Failure Scenarios Box -->
    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="235" height="68" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#b91c1c">Execution Crash / Disconnection Hazards:</text>
      <text x="8" y="26" font-size="6.2" fill="#7f1d1d">• Container OOM-Killed (SIGKILL 137)</text>
      <text x="8" y="37" font-size="6.2" fill="#7f1d1d">• Host network socket partition / timeout</text>
      <text x="8" y="48" font-size="6.2" fill="#7f1d1d">• Power failure before tool stdout returns</text>
      <text x="8" y="59" font-size="6.2" font-weight="700" fill="#b91c1c">State: Environment left corrupted!</text>
    </g>

    <!-- Normal ACK Return -->
    <g transform="translate(15, 184)">
      <rect x="0" y="0" width="235" height="62" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#1e293b">Normal Path: Observation Record</text>
      <text x="8" y="26" font-size="6.2" fill="#334155">Exit code 0 ➔ Return observation o_t</text>
      <text x="8" y="37" font-size="6.2" fill="#334155">Commit marker appended to WAL (TX-803: OK)</text>
      <rect x="8" y="44" width="219" height="13" rx="1" fill="#dcfce7"/>
      <text x="117" y="53" text-anchor="middle" font-size="6" font-weight="700" fill="#15803d">Full Transaction Complete</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SECTION: CRASH RECOVERY & SAGA ROLLBACK (y: 330 to 460)   -->
  <!-- ================================================================= -->
  <g transform="translate(35, 330)">
    <rect x="0" y="0" width="870" height="130" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="870" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.2" font-weight="700" fill="#b91c1c">REHYDRATION &amp; COMPENSATING SAGA CRASH RECOVERY ENGINE (POST-REBOOT)</text>

    <!-- Left: Tail Scan -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="265" height="88" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#b91c1c">1. Tail Scan &amp; Incomplete Tx Detection</text>
      <text x="8" y="28" font-size="6.5" fill="#334155">On process restart, recovery thread</text>
      <text x="8" y="40" font-size="6.5" fill="#334155">reads WAL forward from checkpoint.</text>
      <text x="8" y="52" font-size="6.5" fill="#334155">Detects <tspan font-family="Courier, monospace" font-weight="700" fill="#b91c1c">TX-803</tspan> logged as <tspan font-weight="700" fill="#b91c1c">PENDING</tspan></text>
      <text x="8" y="64" font-size="6.5" fill="#7f1d1d">with zero matching commit record!</text>
      <rect x="8" y="70" width="249" height="14" rx="1" fill="#fee2e2"/>
      <text x="132" y="80" text-anchor="middle" font-size="6" font-weight="700" fill="#991b1b">Flagged: Uncommitted In-Flight Mutation</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M290,74 L315,74" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Middle: Compensating Saga Execution -->
    <g transform="translate(315, 30)">
      <rect x="0" y="0" width="270" height="88" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#b91c1c">2. Compensating Saga Dispatch</text>
      <text x="8" y="28" font-size="6.5" fill="#334155">Recovery engine refuses blind retry.</text>
      <text x="8" y="40" font-size="6.5" fill="#334155">Executes inverse compensation action:</text>
      <rect x="8" y="46" width="254" height="18" rx="1" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
      <text x="12" y="58" font-family="Courier, monospace" font-size="6" font-weight="700" fill="#991b1b">$ git reset --hard &amp;&amp; git clean -fd</text>
      <text x="8" y="78" font-size="6.2" fill="#7f1d1d">Cleans partially generated artifacts &amp; restores s_t.</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M595,74 L620,74" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Right: Consistent State Restored -->
    <g transform="translate(620, 30)">
      <rect x="0" y="0" width="235" height="88" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#15803d">3. Environmental Consistency Restored</text>
      <text x="8" y="28" font-size="6.5" fill="#334155">Hash(s_restored) matches pre-state hash.</text>
      <text x="8" y="40" font-size="6.5" fill="#334155">Appends <tspan font-family="Courier, monospace" font-weight="700" fill="#15803d">TX-803: ABORTED</tspan> record.</text>
      <text x="8" y="52" font-size="6.5" fill="#334155">Agent safely resumes execution loop.</text>
      <rect x="8" y="62" width="219" height="20" rx="1" fill="#dcfce7"/>
      <text x="117" y="73" text-anchor="middle" font-size="6.2" font-weight="700" fill="#15803d">INVARIANT GUARANTEED</text>
      <text x="117" y="80" text-anchor="middle" font-size="5.5" fill="#14532d">Zero Phantom Mutations / Leaked State</text>
    </g>
  </g>

</svg>
