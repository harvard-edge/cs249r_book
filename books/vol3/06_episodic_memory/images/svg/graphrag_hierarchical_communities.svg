<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-amethyst" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#581C87"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803D"/>
    </marker>
    <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="400" fill="#FFFFFF" rx="2"/>

  <!-- Level 0: Global Root Summary Bar -->
  <g transform="translate(40, 20)">
    <rect width="880" height="52" rx="2" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <rect width="210" height="52" rx="2" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="105" y="22" text-anchor="middle" font-size="9" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#0F172A">LEVEL 0: GLOBAL SYNTHESIS</text>
    <text x="105" y="38" text-anchor="middle" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#581C87">S_root = ⨁_k s_Ck</text>

    <text x="230" y="24" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#334155">CROSS-COMMUNITY TOPOLOGICAL COHERENCE:</text>
    <text x="230" y="40" font-size="8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Agglomerative Graph Partitioning via Modularity Maximization ℋ = argmax_P Q(G, P)</text>
  </g>

  <!-- Handoff Arrows from Level 1 to Level 0 -->
  <line x1="180" y1="106" x2="180" y2="74" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-amethyst)"/>
  <line x1="480" y1="106" x2="480" y2="74" stroke="#15803D" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <line x1="780" y1="106" x2="780" y2="74" stroke="#D97706" stroke-width="1.3" marker-end="url(#arr-amber)"/>

  <!-- Level 1 Communities (3 Large Boxes) -->
  <!-- Community C1: Authentication (Royal Amethyst) -->
  <g transform="translate(40, 108)">
    <rect width="280" height="268" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.3"/>
    <rect width="280" height="24" rx="2" fill="#F3E8FF" stroke="#581C87" stroke-width="1.3"/>
    <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">COMMUNITY C₁: Identity &amp; Auth</text>
    <text x="268" y="16" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#6D28D9">Q₁ = 0.68</text>

    <!-- Cluster Metadata Header -->
    <g transform="translate(10, 32)">
      <rect width="260" height="34" rx="2" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">Community Vector s_C1:</text>
      <text x="8" y="26" font-size="7" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Tokens: JWT, OAuth2, SessionStore, UserSchema</text>
    </g>

    <!-- Sub-Graph Nodes and Edges -->
    <g transform="translate(15, 78)">
      <!-- Node A -->
      <circle cx="40" cy="55" r="20" fill="#FFFFFF" stroke="#581C87" stroke-width="1.3"/>
      <text x="40" y="58" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">AuthSvc</text>

      <!-- Node B -->
      <circle cx="120" cy="35" r="20" fill="#FFFFFF" stroke="#581C87" stroke-width="1.3"/>
      <text x="120" y="38" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">TokenGen</text>

      <!-- Node C -->
      <circle cx="195" cy="65" r="20" fill="#FFFFFF" stroke="#581C87" stroke-width="1.3"/>
      <text x="195" y="68" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">UserDB</text>

      <!-- Node D -->
      <circle cx="95" cy="125" r="20" fill="#FFFFFF" stroke="#581C87" stroke-width="1.3"/>
      <text x="95" y="128" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#581C87">Session</text>

      <!-- Graph Edges -->
      <line x1="60" y1="50" x2="100" y2="40" stroke="#581C87" stroke-width="1.1" marker-end="url(#arr-amethyst)"/>
      <line x1="140" y1="41" x2="175" y2="59" stroke="#581C87" stroke-width="1.1" marker-end="url(#arr-amethyst)"/>
      <line x1="53" y1="71" x2="82" y2="109" stroke="#581C87" stroke-width="1.1" marker-end="url(#arr-amethyst)"/>
      <line x1="115" y1="125" x2="175" y2="75" stroke="#581C87" stroke-width="1.1" marker-end="url(#arr-amethyst)"/>
    </g>
  </g>

  <!-- Community C2: Billing & Invoices (Emerald Green) -->
  <g transform="translate(340, 108)">
    <rect width="280" height="268" rx="2" fill="#F0FDF4" stroke="#15803D" stroke-width="1.3"/>
    <rect width="280" height="24" rx="2" fill="#DCFCE7" stroke="#15803D" stroke-width="1.3"/>
    <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">COMMUNITY C₂: Billing &amp; Invoices</text>
    <text x="268" y="16" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#166534">Q₂ = 0.74</text>

    <!-- Cluster Metadata Header -->
    <g transform="translate(10, 32)">
      <rect width="260" height="34" rx="2" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">Community Vector s_C2:</text>
      <text x="8" y="26" font-size="7" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Tokens: StripeAPI, Subscriptions, InvoiceLedger</text>
    </g>

    <!-- Sub-Graph Nodes and Edges -->
    <g transform="translate(15, 78)">
      <!-- Node A -->
      <circle cx="40" cy="55" r="20" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
      <text x="40" y="58" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">BillSvc</text>

      <!-- Node B -->
      <circle cx="120" cy="35" r="20" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
      <text x="120" y="38" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">StripeAdp</text>

      <!-- Node C -->
      <circle cx="195" cy="65" r="20" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
      <text x="195" y="68" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">InvoiceDB</text>

      <!-- Node D -->
      <circle cx="95" cy="125" r="20" fill="#FFFFFF" stroke="#15803D" stroke-width="1.3"/>
      <text x="95" y="128" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#15803D">TaxEngine</text>

      <!-- Graph Edges -->
      <line x1="60" y1="50" x2="100" y2="40" stroke="#15803D" stroke-width="1.1" marker-end="url(#arr-green)"/>
      <line x1="140" y1="41" x2="175" y2="59" stroke="#15803D" stroke-width="1.1" marker-end="url(#arr-green)"/>
      <line x1="53" y1="71" x2="82" y2="109" stroke="#15803D" stroke-width="1.1" marker-end="url(#arr-green)"/>
      <line x1="115" y1="125" x2="175" y2="75" stroke="#15803D" stroke-width="1.1" marker-end="url(#arr-green)"/>
    </g>
  </g>

  <!-- Community C3: Telemetry & Logs (Amber) -->
  <g transform="translate(640, 108)">
    <rect width="280" height="268" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
    <rect width="280" height="24" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">COMMUNITY C₃: Telemetry &amp; Logs</text>
    <text x="268" y="16" text-anchor="end" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#B45309">Q₃ = 0.71</text>

    <!-- Cluster Metadata Header -->
    <g transform="translate(10, 32)">
      <rect width="260" height="34" rx="2" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
      <text x="8" y="14" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">Community Vector s_C3:</text>
      <text x="8" y="26" font-size="7" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#64748B">Tokens: KafkaEvent, ClickHouse, Prometheus, Alert</text>
    </g>

    <!-- Sub-Graph Nodes and Edges -->
    <g transform="translate(15, 78)">
      <!-- Node A -->
      <circle cx="40" cy="55" r="20" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
      <text x="40" y="58" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">EventBus</text>

      <!-- Node B -->
      <circle cx="120" cy="35" r="20" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
      <text x="120" y="38" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">ClickH</text>

      <!-- Node C -->
      <circle cx="195" cy="65" r="20" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
      <text x="195" y="68" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">Metrics</text>

      <!-- Node D -->
      <circle cx="95" cy="125" r="20" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
      <text x="95" y="128" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-weight="700" fill="#D97706">AlertSvc</text>

      <!-- Graph Edges -->
      <line x1="60" y1="50" x2="100" y2="40" stroke="#D97706" stroke-width="1.1" marker-end="url(#arr-amber)"/>
      <line x1="140" y1="41" x2="175" y2="59" stroke="#D97706" stroke-width="1.1" marker-end="url(#arr-amber)"/>
      <line x1="53" y1="71" x2="82" y2="109" stroke="#D97706" stroke-width="1.1" marker-end="url(#arr-amber)"/>
      <line x1="115" y1="125" x2="175" y2="75" stroke="#D97706" stroke-width="1.1" marker-end="url(#arr-amber)"/>
    </g>
  </g>

  <!-- Cross-Community Inter-Module API Calls -->
  <path d="M 270,250 C 300,225 320,225 350,250" fill="none" stroke="#64748B" stroke-width="1.1" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <text x="310" y="222" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#475569">validate()</text>

  <path d="M 570,250 C 600,225 620,225 650,250" fill="none" stroke="#64748B" stroke-width="1.1" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <text x="610" y="222" text-anchor="middle" font-size="6.8" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" fill="#475569">emit(invoice)</text>
</svg>
