<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-teal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="32" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="0.2">HIERARCHICAL KNOWLEDGE GRAPH COMMUNITY DETECTION &amp; MULTI-SCALE SUMMARIZATION</text>
  <text x="40" y="48" font-size="9" fill="#64748b">Recursive Leiden Partitioning of Entity-Relation Networks into Agglomerative Abstraction Communities (GraphRAG)</text>

  <!-- Level 0: Global Root Summary Bar -->
  <g transform="translate(40, 70)">
    <rect width="880" height="48" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
    <rect width="180" height="48" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
    <text x="90" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Level 0: Global Synthesis</text>
    <text x="90" y="36" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#475569">S_root = f(S_C1, S_C2, S_C3)</text>

    <text x="200" y="22" font-size="9" font-weight="600" fill="#334155">System-Wide Coherence Summary:</text>
    <text x="200" y="36" font-size="8.5" fill="#64748b">Unified architectural description reconciling payments, authentication, and ledger invariants across all subsystems.</text>
  </g>

  <!-- Handoff Arrows from Level 1 to Level 0 -->
  <line x1="180" y1="140" x2="180" y2="120" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="480" y1="140" x2="480" y2="120" stroke="#0f766e" stroke-width="1.2" marker-end="url(#arr-teal)"/>
  <line x1="780" y1="140" x2="780" y2="120" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Level 1 Communities (3 Large Boxes) -->
  <!-- Community C1: Authentication -->
  <g transform="translate(40, 142)">
    <rect width="280" height="270" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect width="280" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#1e40af">COMMUNITY C₁: Identity &amp; Auth (γ=0.5)</text>

    <!-- Summary Card -->
    <g transform="translate(10, 32)">
      <rect width="260" height="42" rx="2" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#1e3a8a">Community Summary S_C1:</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Token validation, OAuth2 flows, session storage</text>
      <text x="8" y="38" font-size="7.5" fill="#1e40af">Resolution: High Modularity Q₁ = 0.68</text>
    </g>

    <!-- Sub-Graph Nodes and Edges -->
    <g transform="translate(15, 90)">
      <!-- Node A -->
      <circle cx="40" cy="50" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="40" y="53" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">AuthSvc</text>

      <!-- Node B -->
      <circle cx="130" cy="30" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="130" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">TokenGen</text>

      <!-- Node C -->
      <circle cx="210" cy="60" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="210" y="63" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">UserDB</text>

      <!-- Node D -->
      <circle cx="100" cy="110" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="100" y="113" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Session</text>

      <!-- Graph Edges -->
      <line x1="58" y1="45" x2="112" y2="35" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <line x1="148" y1="36" x2="192" y2="54" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <line x1="48" y1="65" x2="86" y2="98" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
      <line x1="118" y1="110" x2="194" y2="70" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    </g>
  </g>

  <!-- Community C2: Billing & Subscriptions -->
  <g transform="translate(340, 142)">
    <rect width="280" height="270" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect width="280" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#065f46">COMMUNITY C₂: Billing &amp; Invoices (γ=0.5)</text>

    <!-- Summary Card -->
    <g transform="translate(10, 32)">
      <rect width="260" height="42" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#064e3b">Community Summary S_C2:</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Recurring billing cycles, Stripe API, ledger sync</text>
      <text x="8" y="38" font-size="7.5" fill="#047857">Resolution: High Modularity Q₂ = 0.74</text>
    </g>

    <!-- Sub-Graph Nodes and Edges -->
    <g transform="translate(15, 90)">
      <!-- Node A -->
      <circle cx="40" cy="50" r="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="40" y="53" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">BillSvc</text>

      <!-- Node B -->
      <circle cx="130" cy="30" r="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="130" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">StripeAdp</text>

      <!-- Node C -->
      <circle cx="210" cy="60" r="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="210" y="63" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">InvoiceDB</text>

      <!-- Node D -->
      <circle cx="100" cy="110" r="18" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="100" y="113" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">TaxEngine</text>

      <!-- Graph Edges -->
      <line x1="58" y1="45" x2="112" y2="35" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-teal)"/>
      <line x1="148" y1="36" x2="192" y2="54" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-teal)"/>
      <line x1="48" y1="65" x2="86" y2="98" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-teal)"/>
      <line x1="118" y1="110" x2="194" y2="70" stroke="#059669" stroke-width="1.2" marker-end="url(#arr-teal)"/>
    </g>
  </g>

  <!-- Community C3: Data Pipeline & Reporting -->
  <g transform="translate(640, 142)">
    <rect width="280" height="270" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect width="280" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#92400e">COMMUNITY C₃: Telemetry &amp; Logs (γ=0.5)</text>

    <!-- Summary Card -->
    <g transform="translate(10, 32)">
      <rect width="260" height="42" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#78350f">Community Summary S_C3:</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Kafka event stream, ClickHouse sink, audit reports</text>
      <text x="8" y="38" font-size="7.5" fill="#b45309">Resolution: High Modularity Q₃ = 0.71</text>
    </g>

    <!-- Sub-Graph Nodes and Edges -->
    <g transform="translate(15, 90)">
      <!-- Node A -->
      <circle cx="40" cy="50" r="18" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="40" y="53" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">EventBus</text>

      <!-- Node B -->
      <circle cx="130" cy="30" r="18" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="130" y="33" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">ClickH</text>

      <!-- Node C -->
      <circle cx="210" cy="60" r="18" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="210" y="63" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Metrics</text>

      <!-- Node D -->
      <circle cx="100" cy="110" r="18" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="100" y="113" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">AlertSvc</text>

      <!-- Graph Edges -->
      <line x1="58" y1="45" x2="112" y2="35" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <line x1="148" y1="36" x2="192" y2="54" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <line x1="48" y1="65" x2="86" y2="98" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <line x1="118" y1="110" x2="194" y2="70" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    </g>
  </g>

  <!-- Cross-Community Bridges (Inter-Community Edges) -->
  <path d="M 235,232 C 280,245 300,245 345,232" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-slate)"/>
  <text x="290" y="252" text-anchor="middle" font-size="7" font-style="italic" fill="#64748b">inter-module API call</text>

  <path d="M 535,232 C 580,245 600,245 645,232" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-slate)"/>
  <text x="590" y="252" text-anchor="middle" font-size="7" font-style="italic" fill="#64748b">event publish</text>
</svg>
