<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-sec-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-sec-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-sec-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1080" height="410" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Outer Supervisor Boundary Box -->
  <rect x="20" y="20" width="1040" height="305" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="35" y="40" font-family="system-ui, sans-serif" font-weight="700" font-size="11.5px" fill="#475569">HOST SUPERVISOR PRIVILEGED SECURITY BOUNDARY</text>

  <!-- Left: Unprivileged Planning Engine -->
  <g transform="translate(45, 60)">
    <rect width="260" height="235" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="230" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="130" y="32" class="box-lbl" fill="#1e40af" text-anchor="middle">Planning Engine (Unprivileged)</text>
    <text x="25" y="15" class="box-lbl" fill="#0f172a">Execution Authority: A = 0</text>
    <text x="25" y="35" class="box-sub">• Frozen weights; zero native I/O</text>
    <text x="25" y="53" class="box-sub">• Emits structured query proposals</text>
    <text x="25" y="71" class="box-sub">• Receives validated text envelopes</text>

    <!-- Quarantined Context Ingress Box -->
    <rect x="20" y="95" width="220" height="65" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="130" y="114" class="box-lbl" fill="#15803d" text-anchor="middle">Encapsulated Context Ingress</text>
    <text x="130" y="130" class="mono" fill="#166534" text-anchor="middle">&lt;data-frame nonce="..."&gt;</text>
    <text x="130" y="146" class="box-sub" fill="#15803d" text-anchor="middle">Non-executable syntax fences</text>
  </g>

  <!-- Query Dispatch Arrow: Left to Middle-Top -->
  <path d="M 305 155 L 400 155" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-sec-blue)"/>
  <text x="352" y="95" class="mono" fill="#1e40af" text-anchor="middle">Query Q</text>

  <!-- Middle Top: ACL & Governance Gate -->
  <g transform="translate(410, 60)">
    <rect width="280" height="95" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="15" y="12" width="250" height="24" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="140" y="28" class="box-lbl" fill="#6d28d9" text-anchor="middle">Principal Token &amp; ACL Filter</text>
    <text x="20" y="55" class="box-sub">• Verifies Principal Security Token</text>
    <text x="20" y="22" class="box-sub">• Generates Bitset Mask B = {doc_id : U in ACL}</text>
    <text x="20" y="39" class="box-sub">• Enforces Latency &amp; Token Bounds (T_budget, S_max)</text>
  </g>

  <!-- Arrow Middle-Top to Right Storage -->
  <path d="M 690 155 L 755 155" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-sec-purple)"/>
  <text x="722" y="95" class="mono" fill="#6d28d9" text-anchor="middle">Mask B</text>

  <!-- Right: Storage Engine & Index Traversal -->
  <g transform="translate(765, 60)">
    <rect width="270" height="235" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="15" y="15" width="240" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="135" y="32" class="box-lbl" fill="#0f172a" text-anchor="middle">Derivative Search Stores</text>
    
    <rect x="20" y="55" width="230" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="30" y="23" class="box-lbl" fill="#0284c7">Sparse Lexical (BM25)</text>
    <text x="30" y="38" class="box-sub">Bitset intersection on postings</text>

    <rect x="20" y="55" width="230" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="30" y="73" class="box-lbl" fill="#7c3aed">Dense Vector (HNSW / IVF)</text>
    <text x="30" y="88" class="box-sub">Traverse graph if B[v] == 1</text>

    <rect x="20" y="105" width="230" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="30" y="123" class="box-lbl" fill="#10b981">Topological CPG (Graph)</text>
    <text x="30" y="138" class="box-sub">Multi-hop AST callpath traversal</text>

    <text x="135" y="172" class="mono" fill="#475569" text-anchor="middle">Output: Raw Candidates R_k</text>
  </g>

  <!-- Arrow Right Storage down to Sanitizer -->
  <path d="M 765 260 L 695 260" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-sec-green)"/>
  <text x="730" y="202" class="mono" fill="#15803d" text-anchor="middle">Raw R_k</text>

  <!-- Middle Lower: Ingestion Sanitizer & Provenance Scrub -->
  <g transform="translate(410, 170)">
    <rect width="280" height="125" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="15" y="12" width="250" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="140" y="28" class="box-lbl" fill="#15803d" text-anchor="middle">Ingestion Sanitizer &amp; Provenance Scrub</text>
    <text x="20" y="55" class="box-sub">• Secret &amp; Credential Redaction (Entropy filter)</text>
    <text x="20" y="22" class="box-sub">• Indirect Prompt Injection Neutralizer</text>
    <text x="20" y="39" class="box-sub">• Provenance &amp; Freshness Verification (Live hash)</text>
    <text x="20" y="56" class="box-sub">• Escapes delimiters; wraps in nonce fences</text>
  </g>

  <!-- Arrow Sanitizer to Unprivileged Engine -->
  <path d="M 410 280 L 315 280" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-sec-green)"/>
  <text x="362" y="222" class="mono" fill="#15803d" text-anchor="middle">Verified R_k</text>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="335" width="1040" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="359" class="card-text" font-weight="700" fill="#0f172a">Security Invariant:</text>
  <text x="160" y="359" class="card-text">The foundation model possesses zero ambient authority (A=0) to query or mutate external stores directly.</text>
  <text x="160" y="378" class="card-text">Every candidate must be pre-filtered by principal ACL bitsets, scrubbed for secrets, and encapsulated in nonces.</text>
</svg>