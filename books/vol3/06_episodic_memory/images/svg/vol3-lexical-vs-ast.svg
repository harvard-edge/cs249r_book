<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .sub-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
      .alert-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #991b1b; }
      .alert-orange { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #9a3412; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Query Box -->
  <rect x="180" y="16" width="680" height="50" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="196" y="36" class="lbl" fill="#1e40af">Agent Natural Language Query:</text>
  <text x="375" y="36" class="mono" font-weight="700" fill="#1d4ed8">"find socket connection rate limiter algorithm"</text>
  <text x="196" y="52" class="desc">Intent: Locate traffic-shaping token bucket primitive controlling network packet ingress</text>

  <!-- Directed branching connectors -->
  <path d="M 380 66 L 270 96" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M 660 66 L 770 96" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- Left Panel: Lexical BM25 Failure -->
  <g transform="translate(20, 102)">
    <rect width="485" height="212" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="1" y="1" width="483" height="30" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="16" y="21" class="alert-red">PATHOLOGY 1: LEXICAL INVERTED INDEX (BM25) VOCABULARY MISMATCH</text>

    <text x="16" y="52" class="lbl">Query Inverted Postings:</text>
    <text x="156" y="52" class="mono" fill="#b91c1c">{"socket", "connection", "rate", "limiter"}</text>

    <rect x="16" y="68" width="453" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="86" class="sub-hdr">Target Implementation Codebase (C++):</text>
    <text x="26" y="103" class="mono">struct TokenBucketDrain { uint64_t drain_rate; ... };</text>

    <path d="M 242 120 L 242 138" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <rect x="16" y="142" width="453" height="54" rx="3" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
    <text x="242" y="162" class="alert-red" text-anchor="middle">Retrieval Collapse: Postings Intersect = 0 Hits</text>
    <text x="242" y="180" class="desc" text-anchor="middle">Lexical BM25 matches exact lexical stems only; semantic synonymy remains unmapped.</text>
  </g>

  <!-- Right Panel: AST Symbol Graph Failure -->
  <g transform="translate(535, 102)">
    <rect width="485" height="212" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="1" y="1" width="483" height="30" rx="3" fill="#ffedd5" stroke="#fed7aa" stroke-width="0.8"/>
    <text x="16" y="21" class="alert-orange">PATHOLOGY 2: STATIC AST / SYMBOL GRAPH STRUCTURAL BLINDNESS</text>

    <text x="16" y="52" class="lbl">Static AST Symbol Table:</text>
    <text x="162" y="52" class="mono" fill="#c2410c">Exact match on symbol `TokenBucketDrain`</text>

    <rect x="16" y="68" width="453" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="86" class="sub-hdr">Dynamic Dispatch / Cross-Process Service Boundary:</text>
    <text x="26" y="103" class="mono">channel.invoke("RateLimiterService", payload);</text>

    <path d="M 242 120 L 242 138" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

    <rect x="16" y="142" width="453" height="54" rx="3" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="242" y="162" class="alert-orange" text-anchor="middle">Structural Blindness: Dynamic Edge Severed</text>
    <text x="242" y="180" class="desc" text-anchor="middle">Static AST parsers cannot resolve dynamic string dispatch, RPCs, or reflection boundaries.</text>
  </g>
</svg>