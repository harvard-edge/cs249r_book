<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10.5px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1080" height="410" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Query Box -->
  <rect x="200" y="20" width="680" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="215" y="37" class="box-lbl" fill="#1e40af">Agent Query:</text>
  <text x="300" y="37" class="mono" font-weight="700" fill="#1e3a8a">"find socket connection rate limiter algorithm"</text>
  <text x="215" y="53" class="box-sub">Intent: Locate traffic shaping primitive controlling ingress packet flow</text>

  <!-- Split Connectors -->
  <path d="M 400 112 L 280 148" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 680 112 L 800 148" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Left Panel: Lexical BM25 -->
  <g transform="translate(45, 100)">
    <rect width="475" height="215" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="15" y="12" width="445" height="28" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="25" y="31" class="panel-title" fill="#991b1b">PATHOLOGY 1: LEXICAL BM25 VOCABULARY MISMATCH</text>

    <text x="20" y="62" class="box-lbl" fill="#0f172a">Parsed Query Postings:</text>
    <text x="175" y="62" class="mono" fill="#b91c1c">{socket, connection, rate, limiter}</text>

    <rect x="20" y="26" width="435" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="43" class="box-lbl" fill="#334155">Target Implementation (C++):</text>
    <text x="30" y="62" class="mono" fill="#0f172a">struct TokenBucketDrain { uint64_t drain_rate; ... };</text>

    <path d="M 237 132 L 237 155" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <rect x="20" y="110" width="435" height="42" rx="4" fill="#fee2e2" stroke="#ef4444"/>
    <text x="237" y="127" class="box-lbl" fill="#991b1b" text-anchor="middle">Retrieval Collapse: Postings Match = 0 Hits</text>
    <text x="237" y="143" class="box-sub" fill="#b91c1c" text-anchor="middle">Zero literal overlap; BM25 cannot infer synonymy with leaky_bucket</text>
  </g>

  <!-- Right Panel: AST Symbol Graph -->
  <g transform="translate(560, 100)">
    <rect width="475" height="215" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="15" y="12" width="445" height="28" rx="4" fill="#ffffff" stroke="#fed7aa"/>
    <text x="25" y="31" class="panel-title" fill="#9a3412">PATHOLOGY 2: AST GRAPH STRUCTURAL BLINDNESS</text>

    <text x="20" y="62" class="box-lbl" fill="#0f172a">Static AST Symbol Table:</text>
    <text x="175" y="62" class="mono" fill="#c2410c">Exact match: TokenBucketDrain</text>

    <rect x="20" y="26" width="435" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="43" class="box-lbl" fill="#334155">Multi-Language &amp; Dynamic Dispatch Boundary:</text>
    <text x="30" y="62" class="mono" fill="#0f172a">channel.invoke("RateLimiterService", payload)</text>

    <path d="M 237 132 L 237 155" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <rect x="20" y="110" width="435" height="42" rx="4" fill="#ffedd5" stroke="#f97316"/>
    <text x="237" y="127" class="box-lbl" fill="#9a3412" text-anchor="middle">Structural Blindness: Dynamic Edge Severed</text>
    <text x="237" y="143" class="box-sub" fill="#c2410c" text-anchor="middle">Static AST parser cannot traverse RPC, reflection, or macro bounds</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="330" width="1040" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="355" class="card-text" font-weight="700" fill="#0f172a">The Architectural Dilemma:</text>
  <text x="195" y="355" class="card-text">Unimodal retrieval fails symmetrically: lexical BM25 is brittle to synonym variations, while static AST graphs</text>
  <text x="195" y="375" class="card-text">are blind to dynamic boundaries. Production agent runtimes require fused hybrid retrieval (BM25 + HNSW + CPG).</text>
</svg>