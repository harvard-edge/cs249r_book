<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <style>
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1e293b; }
      .tick-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #64748b; }
      .regime-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
      .regime-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; }
      .legend-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arr-axis-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Plot Background Regimes -->
  <!-- 1. Under-retrieval -->
  <rect x="90" y="24" width="220" height="250" fill="#fef2f2" opacity="0.65"/>
  <text x="200" y="44" class="regime-lbl" fill="#b91c1c" text-anchor="middle">UNDER-RETRIEVAL REGIME</text>
  <text x="200" y="58" class="regime-sub" fill="#b91c1c" text-anchor="middle">(Missing Invariant / Unbound Types)</text>

  <!-- 2. Optimal Window -->
  <rect x="310" y="24" width="170" height="250" fill="#f0fdf4" opacity="0.75"/>
  <text x="395" y="44" class="regime-lbl" fill="#15803d" text-anchor="middle">OPTIMAL OPERATING WINDOW</text>
  <text x="395" y="58" class="regime-sub" fill="#15803d" text-anchor="middle">(k* in [3, 5] High-Precision Passages)</text>

  <!-- 3. Dilution Regime -->
  <rect x="480" y="24" width="480" height="250" fill="#fff7ed" opacity="0.65"/>
  <text x="720" y="44" class="regime-lbl" fill="#c2410c" text-anchor="middle">ATTENTION DILUTION &amp; DISTRACTOR INTERFERENCE</text>
  <text x="720" y="58" class="regime-sub" fill="#c2410c" text-anchor="middle">(Lost-in-the-Middle + Context Dilution + Hallucinated Overwrites)</text>

  <!-- Grid lines -->
  <path d="M 90 214 L 960 214" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 90 154 L 960 154" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 90 94 L 960 94" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Recall@k Curve (Monotonically Increasing Gray Dashed Line) -->
  <path d="M 90 260 C 200 190, 330 130, 480 110 C 660 95, 840 88, 960 85" 
        fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- End-to-End Task Success Rate Curve (Blue) -->
  <path d="M 90 250 
           C 180 200, 260 130, 340 100 
           C 390 85, 410 85, 450 100 
           C 530 140, 670 210, 810 230 
           C 880 240, 930 245, 960 250" 
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Peak Marker at k* -->
  <circle cx="395" cy="88" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="340" y="104" width="110" height="22" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="395" y="119" class="mono" font-weight="700" fill="#047857" text-anchor="middle">Peak SR: 72% (k*)</text>

  <!-- Axes -->
  <path d="M 90 274 L 980 274" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-axis-d)"/>
  <path d="M 90 274 L 90 20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-axis-d)"/>

  <!-- Y-Axis Labels -->
  <text x="30" y="147" class="axis-lbl" transform="rotate(-90 30,147)" text-anchor="middle">Task Success Rate (SR %) / Recall (%)</text>
  <text x="80" y="278" class="tick-lbl" text-anchor="end">0%</text>
  <text x="80" y="218" class="tick-lbl" text-anchor="end">25%</text>
  <text x="80" y="158" class="tick-lbl" text-anchor="end">50%</text>
  <text x="80" y="98" class="tick-lbl" text-anchor="end">75%</text>
  <text x="80" y="38" class="tick-lbl" text-anchor="end">100%</text>

  <!-- X-Axis Labels -->
  <text x="525" y="318" class="axis-lbl" text-anchor="middle">Retrieved Context Passages Staged into Model Window (k)</text>
  <text x="90" y="293" class="tick-lbl" text-anchor="middle">0</text>
  <text x="200" y="293" class="tick-lbl" text-anchor="middle">2</text>
  <text x="310" y="293" class="tick-lbl" text-anchor="middle">3</text>
  <text x="395" y="293" class="tick-lbl" text-anchor="middle" font-weight="700" fill="#15803d">5 (k*)</text>
  <text x="480" y="293" class="tick-lbl" text-anchor="middle">10</text>
  <text x="640" y="293" class="tick-lbl" text-anchor="middle">20</text>
  <text x="800" y="293" class="tick-lbl" text-anchor="middle">50</text>
  <text x="960" y="293" class="tick-lbl" text-anchor="middle">100</text>

  <!-- Legend -->
  <g transform="translate(230, 335)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#2563eb" stroke-width="2.5"/>
    <text x="38" y="14" class="legend-lbl" fill="#1e40af">End-to-End Task Success Rate (SR %)</text>

    <line x1="290" y1="10" x2="320" y2="10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="328" y="14" class="legend-lbl" fill="#64748b">Raw Retrieval Recall@k (Monotonically Increasing)</text>
  </g>
</svg>