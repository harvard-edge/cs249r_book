<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .axis-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #1e293b; }
      .tick-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .legend-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-axis-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="1080" height="410" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Plot Background Regions -->
  <!-- Under-retrieval -->
  <rect x="110" y="25" width="220" height="230" fill="#fef2f2" opacity="0.6"/>
  <text x="220" y="48" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#b91c1c" text-anchor="middle">UNDER-RETRIEVAL REGIME</text>
  <text x="220" y="64" font-family="system-ui, sans-serif" font-size="10px" fill="#b91c1c" text-anchor="middle">(Missing Invariant / Evidence)</text>

  <!-- Optimal Window -->
  <rect x="330" y="25" width="180" height="230" fill="#f0fdf4" opacity="0.6"/>
  <text x="420" y="48" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#15803d" text-anchor="middle">OPTIMAL OPERATING WINDOW</text>
  <text x="420" y="64" font-family="system-ui, sans-serif" font-size="10px" fill="#15803d" text-anchor="middle">(k* in [3, 5] Passages)</text>

  <!-- Dilution Regime -->
  <rect x="510" y="25" width="500" height="230" fill="#fff7ed" opacity="0.6"/>
  <text x="760" y="48" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#c2410c" text-anchor="middle">ATTENTION DILUTION &amp; DISTRACTOR INTERFERENCE</text>
  <text x="760" y="64" font-family="system-ui, sans-serif" font-size="10px" fill="#c2410c" text-anchor="middle">(Lost-in-the-Middle + Distractor Hallucinations)</text>

  <!-- Grid lines -->
  <path d="M 110 245 L 1010 245" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 185 L 1010 185" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 125 L 1010 125" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Recall@k Curve (Monotonically Increasing Gray Dashed Line) -->
  <path d="M 110 290 C 220 220, 350 160, 510 140 C 700 125, 880 118, 1010 115" 
        fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- End-to-End Task Success Rate Curve (Green to Orange/Red) -->
  <path d="M 110 280 
           C 200 230, 280 160, 360 130 
           C 410 115, 430 115, 470 130 
           C 560 170, 700 240, 850 260 
           C 920 270, 970 275, 1010 280" 
        fill="none" stroke="#2563eb" stroke-width="3.5"/>

  <!-- Peak Marker at k* -->
  <circle cx="420" cy="118" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="360" y="85" width="120" height="24" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="101" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#047857" text-anchor="middle">Peak SR: 72% (k*)</text>

  <!-- Axes -->
  <path d="M 110 305 L 1030 305" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis-d)"/>
  <path d="M 110 305 L 110 70" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis-d)"/>

  <!-- Y-Axis Labels -->
  <text x="45" y="140" class="axis-lbl" transform="rotate(-90 45,190)" text-anchor="middle">Task Success Rate (%)</text>
  <text x="100" y="259" class="tick-lbl" text-anchor="end">0%</text>
  <text x="100" y="199" class="tick-lbl" text-anchor="end">25%</text>
  <text x="100" y="139" class="tick-lbl" text-anchor="end">50%</text>
  <text x="100" y="79" class="tick-lbl" text-anchor="end">75%</text>

  <!-- X-Axis Labels -->
  <text x="560" y="298" class="axis-lbl" text-anchor="middle">Retrieved Context Passages (k)</text>
  <text x="110" y="275" class="tick-lbl" text-anchor="middle">0</text>
  <text x="220" y="275" class="tick-lbl" text-anchor="middle">2</text>
  <text x="330" y="275" class="tick-lbl" text-anchor="middle">3</text>
  <text x="420" y="275" class="tick-lbl" text-anchor="middle" font-weight="700" fill="#15803d">5 (k*)</text>
  <text x="510" y="275" class="tick-lbl" text-anchor="middle">10</text>
  <text x="680" y="275" class="tick-lbl" text-anchor="middle">20</text>
  <text x="850" y="275" class="tick-lbl" text-anchor="middle">50</text>
  <text x="1010" y="275" class="tick-lbl" text-anchor="middle">100</text>

  <!-- Legend -->
  <g transform="translate(250, 315)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#2563eb" stroke-width="3"/>
    <text x="38" y="14" class="legend-lbl" fill="#1e40af">End-to-End Task Success Rate (SR %)</text>

    <line x1="300" y1="10" x2="330" y2="10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="338" y="14" class="legend-lbl" fill="#64748b">Raw Retrieval Recall@k (Monotonic)</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="345" width="1040" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="368" class="card-text" font-weight="700" fill="#0f172a">The End-to-End Verification Argument:</text>
  <text x="270" y="368" class="card-text">Maximizing Recall@k does not maximize agent task completion. Staging excess passages dilutes self-attention</text>
  <text x="270" y="384" class="card-text">mass across distractor keys, triggering hallucinations and reducing task success from 72% down to 28%.</text>
</svg>