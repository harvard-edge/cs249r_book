<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arr-sec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Left Side: Secure Bitset Pre-Filtering -->
  <g transform="translate(15, 10)">
    <rect width="505" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="503" height="30" rx="3" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#0369a1">SECURE PRE-FILTERING PROTOCOL (IN-TRAVERSAL)</text>

    <!-- Query Step -->
    <rect x="16" y="44" width="473" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="62" class="box-lbl" fill="#0f172a">Authenticated Query Ingress:</text>
    <text x="28" y="76" class="mono" fill="#0284c7">Query Q + Security Principal Token U (Active Role / Scopes)</text>

    <!-- Arrow down -->
    <path d="M 252 86 L 252 98" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-sec)"/>

    <!-- Bitset Step -->
    <rect x="16" y="98" width="473" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="116" class="box-lbl" fill="#0f172a">Dynamic Bitset Mask Generation:</text>
    <text x="28" y="130" class="mono" fill="#0369a1">Bitset B = { doc_id : Principal U in ACL(doc_id) }</text>

    <!-- Arrow down -->
    <path d="M 252 140 L 252 152" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-sec)"/>

    <!-- Traversal Step -->
    <rect x="16" y="152" width="473" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="170" class="box-lbl" fill="#0f172a">Constrained Index Traversal:</text>
    <text x="28" y="186" class="mono" fill="#0f172a">HNSW: Traverse node v iff B[v] == 1  |  • BM25: Postings INTERSECT B</text>

    <!-- Arrow down -->
    <path d="M 252 200 L 252 212" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-sec)"/>

    <!-- Result -->
    <rect x="16" y="214" width="473" height="48" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="252" y="234" class="box-lbl" fill="#065f46" text-anchor="middle">Guaranteed Authorized Result Set R_k (Bounded Tail Latency)</text>
    <text x="252" y="250" class="box-sub" fill="#047857" text-anchor="middle">Traverses only authorized vectors; zero rejection overhead; zero cross-tenant leakage</text>
  </g>

  <!-- Right Side: Post-Filtering Pathologies -->
  <g transform="translate(540, 10)">
    <rect width="505" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="503" height="30" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#991b1b">POST-FILTERING PATHOLOGY: UNCONSTRAINED RETRIEVAL</text>

    <!-- Pathology 1 -->
    <rect x="16" y="44" width="473" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="64" class="box-lbl" fill="#991b1b">Pathology 1: Complete Recall Collapse</text>
    <text x="28" y="80" class="box-sub">Top-M global nearest neighbors are retrieved across all tenants unconditionally.</text>
    <text x="28" y="96" class="box-sub">If top-M candidates belong to unauthorized tenants, ACL pruning yields an empty result set.</text>

    <!-- Pathology 2 -->
    <rect x="16" y="118" width="473" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="138" class="box-lbl" fill="#991b1b">Pathology 2: Unpredictable P99 Tail Latency</text>
    <text x="28" y="154" class="box-sub">To overcome empty results, the runtime dynamically re-queries with larger radii (M -> 2M -> 4M).</text>
    <text x="28" y="170" class="box-sub">Repeated index re-traversals cause severe latency jitter and breach strict SLA deadlines.</text>

    <!-- Invariant Summary Card -->
    <rect x="16" y="192" width="473" height="70" rx="3" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
    <text x="28" y="212" class="box-lbl" fill="#9f1239">Architectural Recommendation:</text>
    <text x="28" y="230" class="box-sub">Intersect bitsets directly during HNSW priority queue expansion.</text>
    <text x="28" y="246" class="box-sub">Maintain Roaring Bitset per security principal to guarantee O(1) bit-test cost.</text>
  </g>
</svg>