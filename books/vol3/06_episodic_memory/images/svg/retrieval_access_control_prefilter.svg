<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1080" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Left Side: Supervisor & Pre-filtering -->
  <g transform="translate(35, 25)">
    <rect width="520" height="285" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="12" width="490" height="28" rx="4" fill="#e0f2fe" stroke="#bae6fd"/>
    <text x="25" y="31" class="panel-title" fill="#0369a1">SECURE PRE-FILTERING PROTOCOL (IN-TRAVERSAL)</text>

    <!-- Query Step -->
    <rect x="20" y="55" width="480" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="23" class="box-lbl" fill="#0f172a">1. Authenticated Query Ingress:</text>
    <text x="30" y="38" class="mono" fill="#0284c7">Query Q + Security Principal Token U (Active Role / Scopes)</text>

    <!-- Arrow down -->
    <path d="M 260 97 L 260 112" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-sec)"/>

    <!-- Bitset Step -->
    <rect x="20" y="65" width="480" height="45" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="83" class="box-lbl" fill="#0f172a">2. Dynamic Bitset Mask Generation:</text>
    <text x="30" y="98" class="mono" fill="#0369a1">Bitset B = { doc_id : Principal U in ACL(doc_id) }</text>

    <!-- Arrow down -->
    <path d="M 260 160 L 260 175" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-sec)"/>

    <!-- Traversal Step -->
    <rect x="20" y="128" width="480" height="48" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="146" class="box-lbl" fill="#0f172a">3. Constrained Index Traversal:</text>
    <text x="30" y="163" class="mono" fill="#0f172a">• HNSW: Step to neighbor v iff B[v] == 1  |  • BM25: Postings ∩ B</text>

    <!-- Arrow down -->
    <path d="M 260 226 L 260 238" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-sec)"/>

    <!-- Result -->
    <rect x="20" y="190" width="480" height="35" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="260" y="212" class="box-lbl" fill="#065f46" text-anchor="middle">Guaranteed Authorized Result Set R_k (Zero Latency Variance)</text>
  </g>

  <!-- Right Side: Post-Filtering Pathology -->
  <g transform="translate(585, 25)">
    <rect width="460" height="285" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="15" y="12" width="430" height="28" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="25" y="31" class="panel-title" fill="#991b1b">POST-FILTERING FAILURE MODES</text>

    <rect x="20" y="55" width="420" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="23" class="box-lbl" fill="#991b1b">Pathology 1: Recall Collapse</text>
    <text x="30" y="42" class="box-sub">If top-M candidates are unauthorized, result set is empty</text>

    <rect x="20" y="65" width="420" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="83" class="box-lbl" fill="#991b1b">Pathology 2: Unpredictable P99 Tail Latency</text>
    <text x="30" y="102" class="box-sub">Iteratively expanding search radius M explodes query deadlines</text>

    <rect x="20" y="125" width="420" height="85" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="145" class="box-lbl" fill="#0f172a">Ingestion Quarantine Invariant:</text>
    <text x="30" y="163" class="box-sub">• Secret Scrubbing: Regex + Entropy scanner strips credentials</text>
    <text x="30" y="179" class="box-sub">• XML / Nonce Fencing: Wraps evidence in non-executable tags</text>
    <text x="30" y="195" class="box-sub">• Neutralizes Indirect Prompt Injection before context entry</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="325" width="1040" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="350" class="card-text" font-weight="700" fill="#0f172a">Zero Ambient Authority Invariant in Storage:</text>
  <text x="320" y="350" class="card-text">Enforce access controls during index traversal via bitset masking (pre-filtering).</text>
  <text x="320" y="370" class="card-text">Never execute unconstrained similarity search followed by post-query rejection.</text>
</svg>