<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL A: OFFLINE COMPRESSION & INVERTED FILE INDEXING             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="860" height="205" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="860" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">PANEL A: OFFLINE COMPRESSION &amp; INVERTED FILE (IVF-PQ) INDEXING PIPELINE</text>

    <!-- Stage 1: High-Dim Input Vector -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="135" height="160" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="135" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0369a1">Input Embedding x</text>

      <text x="8" y="34" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">x ∈ ℝ^D (D=1536)</text>
      <text x="8" y="47" font-size="8.0" fill="#64748b">Uncompressed FP32:</text>
      <rect x="8" y="53" width="119" height="20" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="67" y="66" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">6,144 Bytes / vec</text>

      <text x="8" y="88" font-size="8.0" fill="#475569">• Full context memory</text>
      <text x="8" y="100" font-size="8.0" fill="#475569">• Prohibitive at scale</text>
      <text x="8" y="112" font-size="8.0" fill="#475569">  (1M vecs = 6.14 GB)</text>
      <rect x="8" y="125" width="119" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="67" y="140" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">HBM Exhaustion Hazard</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M152,114 L168,114" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 2: Coarse Voronoi Quantization (IVF) -->
    <g transform="translate(170, 34)">
      <rect x="0" y="0" width="185" height="160" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="185" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0369a1">1. Coarse IVF Partitioning</text>

      <text x="8" y="34" font-size="8.0" fill="#334155">Assign to nearest Voronoi centroid:</text>
      <rect x="8" y="40" width="169" height="20" rx="1" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="92" y="53" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0369a1">c_i = argmin_j ‖x - C_j‖²</text>

      <text x="8" y="74" font-size="8.0" fill="#475569">Compute residual vector r:</text>
      <text x="8" y="87" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0284c7">r = x - c_i ∈ ℝ^D</text>

      <rect x="8" y="98" width="169" height="52" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="112" font-size="8.0" font-weight="700" fill="#0f172a">Inverted Lists (Postings):</text>
      <text x="12" y="125" font-size="8.0" fill="#475569">Postings List [i] ➔ stores all vectors</text>
      <text x="12" y="137" font-size="8.0" fill="#475569">whose nearest centroid is c_i.</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M357,114 L373,114" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 3: Sub-vector Decomposition -->
    <g transform="translate(375, 34)">
      <rect x="0" y="0" width="215" height="160" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="215" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0369a1">2. Product Quantization (PQ)</text>

      <text x="8" y="34" font-size="8.0" fill="#334155">Slice residual into M=16 sub-vectors:</text>
      <rect x="8" y="40" width="199" height="20" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="107" y="53" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">r = [u^(1), u^(2), ..., u^(16)]</text>
      <text x="8" y="72" font-size="8.0" fill="#64748b">Each sub-vector dim: d = D/M = 1536/16 = 96</text>

      <text x="8" y="86" font-size="8.0" font-weight="700" fill="#334155">Quantize to Sub-Codebooks:</text>
      <text x="8" y="99" font-size="8.0" fill="#475569">Each u^(m) mapped to nearest centroid</text>
      <text x="8" y="110" font-size="8.0" fill="#475569">in codebook C_m (|C_m| = 256 centroids)</text>

      <rect x="8" y="122" width="199" height="26" rx="1" fill="#e0f2fe" stroke="#93c5fd" stroke-width="0.8"/>
      <text x="107" y="138" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0369a1">256 centroids = 8 bits (1 Byte!)</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M592,114 L608,114" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

    <!-- Stage 4: Compact Quantized Byte Code -->
    <g transform="translate(610, 34)">
      <rect x="0" y="0" width="235" height="160" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="235" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#15803d">3. Compressed Byte Code Record</text>

      <text x="8" y="34" font-size="8.0" fill="#334155">Physical Storage Layout on NVMe:</text>

      <!-- Byte Layout Bar -->
      <g transform="translate(8, 40)">
        <rect x="0" y="0" width="50" height="24" rx="1" fill="#0284c7" stroke="#0369a1" stroke-width="0.8"/>
        <text x="25" y="11" text-anchor="middle" font-size="8.0" font-weight="700" fill="#ffffff">IVF Cell</text>
        <text x="25" y="20" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#e0f2fe">2 Bytes</text>

        <rect x="52" y="0" width="167" height="24" rx="1" fill="#16a34a" stroke="#15803d" stroke-width="0.8"/>
        <text x="135" y="11" text-anchor="middle" font-size="8.0" font-weight="700" fill="#ffffff">16 Sub-Vector Codes [k₁ ... k₁₆]</text>
        <text x="135" y="20" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#dcfce7">16 × 1 Byte = 16 Bytes</text>
      </g>

      <rect x="8" y="72" width="219" height="38" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="12" y="86" font-size="8.0" font-weight="700" fill="#15803d">Total Record Size: 18 Bytes / vector</text>
      <text x="12" y="100" font-size="8.0" font-weight="700" fill="#16a34a">Compression Ratio: 341.3× Reduction!</text>

      <text x="8" y="125" font-size="8.0" fill="#14532d">• 1,000,000 vectors fit in 18 MB RAM</text>
      <text x="8" y="138" font-size="8.0" fill="#14532d">• 100% mmap residency in GPU L2 / CPU cache</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: ONLINE QUERY ASYMMETRIC DISTANCE COMPUTATION (ADC)       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="860" height="215" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="860" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PANEL B: ONLINE ASYMMETRIC DISTANCE COMPUTATION (ADC) LOOKUP PIPELINE</text>

    <!-- Query Vector q -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="175" height="170" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="175" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#0369a1">1. Unquantized Query: q</text>
      <text x="8" y="32" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">q ∈ ℝ^D (Exact FP32)</text>

      <rect x="8" y="38" width="159" height="40" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="50" font-size="8.0" font-weight="700" fill="#0f172a">Asymmetric Principle:</text>
      <text x="12" y="62" font-size="8.0" fill="#475569">Keep query unquantized;</text>
      <text x="12" y="73" font-size="8.0" fill="#475569">quantize database vectors.</text>

      <text x="8" y="93" font-size="8.0" font-weight="700" fill="#334155">Coarse Probe (nprobe=8):</text>
      <text x="8" y="105" font-size="8.0" fill="#475569">Identify 8 closest Voronoi cells.</text>
      <text x="8" y="117" font-size="8.0" fill="#475569">Prunes 99.2% of database</text>
      <text x="8" y="128" font-size="8.0" fill="#475569">without evaluating vectors.</text>

      <rect x="8" y="136" width="159" height="26" rx="1" fill="#e0f2fe" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="87" y="147" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0284c7">Sub-vector Split:</text>
      <text x="87" y="157" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#0369a1">q = [q^(1), ..., q^(16)]</text>
    </g>

    <!-- Arrow 1 to LUT -->
    <path d="M192,119 L213,119" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Lookup Table Construction (LUT) -->
    <g transform="translate(215, 34)">
      <rect x="0" y="0" width="295" height="170" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="295" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#15803d">2. Precomputed Distance LUT (16 × 256 Table)</text>

      <text x="8" y="32" font-size="8.0" fill="#334155">Computed ONCE per query prior to postings scan:</text>
      <rect x="8" y="38" width="279" height="20" rx="1" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
      <text x="147" y="51" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">LUT[m, j] = ‖q^(m) - C_j^(m)‖²</text>

      <!-- Grid Illustration of LUT -->
      <g transform="translate(8, 64)">
        <rect x="0" y="0" width="279" height="74" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <!-- Headers -->
        <rect x="0" y="0" width="279" height="16" fill="#f1f5f9"/>
        <text x="6" y="11" font-size="8.0" font-weight="700" fill="#475569">Sub-vec (m)</text>
        <text x="70" y="11" font-size="8.0" font-weight="700" fill="#475569">Centroid #0</text>
        <text x="140" y="11" font-size="8.0" font-weight="700" fill="#475569">Centroid #1</text>
        <text x="210" y="11" font-size="8.0" font-weight="700" fill="#475569">Centroid #255</text>

        <!-- Rows -->
        <line x1="0" y1="16" x2="279" y2="16" stroke="#cbd5e1"/>
        <text x="6" y="28" font-family="Courier, monospace" font-size="8.0" fill="#0284c7">m = 1</text>
        <text x="70" y="28" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.0412</text>
        <text x="140" y="28" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.8912</text>
        <text x="210" y="28" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.1245</text>

        <line x1="0" y1="35" x2="279" y2="35" stroke="#cbd5e1"/>
        <text x="6" y="47" font-family="Courier, monospace" font-size="8.0" fill="#0284c7">m = 2</text>
        <text x="70" y="47" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.3120</text>
        <text x="140" y="47" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.0054</text>
        <text x="210" y="47" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.4410</text>

        <line x1="0" y1="54" x2="279" y2="54" stroke="#cbd5e1"/>
        <text x="6" y="66" font-family="Courier, monospace" font-size="8.0" fill="#0284c7">m = 16</text>
        <text x="70" y="66" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.0821</text>
        <text x="140" y="66" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.1540</text>
        <text x="210" y="66" font-family="Courier, monospace" font-size="8.0" fill="#334155">0.0219</text>
      </g>

      <text x="8" y="148" font-size="8.0" fill="#15803d">Total compute: 16 × 256 = 4,096 scalar distances.</text>
      <text x="8" y="160" font-size="8.0" font-weight="700" fill="#15803d">LUT fits entirely in L1 CPU Cache (&lt; 16 KB)!</text>
    </g>

    <!-- Arrow 2 to ADC Scanner -->
    <path d="M512,119 L533,119" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

    <!-- Fast Asymmetric Distance Evaluator -->
    <g transform="translate(535, 34)">
      <rect x="0" y="0" width="310" height="170" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="0" width="310" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="8" y="14" font-size="8.0" font-weight="700" fill="#15803d">3. Postings List Fast ADC Scan (O(1) Lookups)</text>

      <text x="8" y="32" font-size="8.0" fill="#334155">For each candidate vector byte code [k₁, k₂, ..., k₁₆]:</text>
      <rect x="8" y="38" width="294" height="22" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="155" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#15803d">Dist(q, x) ≈ ∑_{m=1}^{16} LUT[m, k_m]</text>

      <rect x="8" y="66" width="294" height="48" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="78" font-size="8.0" font-weight="700" fill="#0f172a">Execution Mechanics:</text>
      <text x="12" y="89" font-size="8.0" fill="#334155">• Zero 1536-dim floating point dot products!</text>
      <text x="12" y="99" font-size="8.0" fill="#334155">• Evaluated via 16 table lookups and 15 additions.</text>
      <text x="12" y="109" font-size="8.0" fill="#334155">• Vectorized via AVX-512 / ARM Neon SIMD registers.</text>

      <rect x="8" y="120" width="294" height="42" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="12" y="133" font-size="8.0" font-weight="700" fill="#15803d">PERFORMANCE RESULT:</text>
      <text x="12" y="145" font-size="8.0" fill="#14532d">Throughput: &gt; 10,000,000 distance evaluations / sec / core.</text>
      <text x="12" y="156" font-size="8.0" font-weight="700" fill="#15803d">Sub-5 millisecond retrieval across 10M agent turns.</text>
    </g>
  </g>

</g>
</svg>