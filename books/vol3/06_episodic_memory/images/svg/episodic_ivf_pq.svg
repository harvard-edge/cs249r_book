<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 4px; }
      .header-pill { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; }
      .sect-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .box-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1e293b; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 9px; }
      .badge-txt { font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>

    <!-- Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: OFFLINE PRODUCT QUANTIZATION (PQ) DECOMPOSITION       -->
  <!-- ================================================================= -->
  <g transform="translate(25, 20)">
    <rect width="465" height="560" class="card-bg"/>

    <!-- Header Pill -->
    <rect x="12" y="12" width="230" height="22" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="18" y="27" class="header-pill" fill="#0369a1">OFFLINE VECTOR QUANTIZATION</text>
    <text x="12" y="52" class="sub-text">Continuous vector decomposition and centroid codebook projection</text>

    <!-- Stage 1: Input Vector x -->
    <g transform="translate(15, 65)">
      <rect width="435" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="box-label">1. Full Input Embedding Vector x in R^D (D = 1536, FP32)</text>
      <text x="10" y="28" class="sub-text">Raw uncompressed storage footprint: 1536 * 4 bytes = 6,144 bytes / vector</text>
      
      <!-- Vector Segments Bar -->
      <g transform="translate(10, 36)">
        <rect x="0" y="0" width="85" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="42" y="12" class="badge-txt" fill="#0369a1">u^(1) [24-d]</text>

        <rect x="92" y="0" width="85" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="134" y="12" class="badge-txt" fill="#0369a1">u^(2) [24-d]</text>

        <rect x="184" y="0" width="45" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="206" y="12" class="badge-txt" fill="#64748b">...</text>

        <rect x="236" y="0" width="85" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="278" y="12" class="badge-txt" fill="#0369a1">u^(m) [24-d]</text>

        <rect x="328" y="0" width="45" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="350" y="12" class="badge-txt" fill="#64748b">...</text>

        <rect x="380" y="0" width="45" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="402" y="12" class="badge-txt" fill="#0369a1">u^(64)</text>
      </g>
    </g>

    <!-- Downward Arrows to Codebooks -->
    <path d="M 72 140 L 72 165" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <path d="M 164 140 L 164 165" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <path d="M 308 140 L 308 165" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <path d="M 432 140 L 432 165" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

    <!-- Stage 2: Learned Subspace Codebooks -->
    <g transform="translate(15, 170)">
      <rect width="435" height="155" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="box-label">2. M = 64 Orthogonal Sub-Codebooks C_1 ... C_64</text>
      <text x="10" y="29" class="sub-text">Map each sub-vector: k_m = argmin_j ||u^(m) - c_j^(m)||^2, for j in [0, 255]</text>

      <!-- Codebook Visual Blocks -->
      <g transform="translate(10, 36)">
        <!-- Codebook 1 -->
        <rect x="0" y="0" width="95" height="105" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <rect x="0" y="0" width="95" height="18" fill="#e0f2fe"/>
        <text x="47" y="9" class="badge-txt" fill="#0369a1">Codebook C_1</text>
        <text x="6" y="32" class="mono-txt" fill="#334155">c_0^(1) in R^24</text>
        <text x="6" y="47" class="mono-txt" fill="#334155">c_1^(1) in R^24</text>
        <rect x="4" y="55" width="87" height="16" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="6" y="66" class="mono-txt" font-weight="700" fill="#1d4ed8">c_k1^(1) [Best]</text>
        <text x="6" y="85" class="mono-txt" fill="#64748b">...</text>
        <text x="6" y="98" class="mono-txt" fill="#334155">c_255^(1)</text>

        <!-- Codebook 2 -->
        <rect x="105" y="0" width="95" height="105" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <rect x="0" y="0" width="95" height="18" fill="#e0f2fe" transform="translate(105, 0)"/>
        <text x="152" y="9" class="badge-txt" fill="#0369a1">Codebook C_2</text>
        <text x="111" y="32" class="mono-txt" fill="#334155">c_0^(2) in R^24</text>
        <rect x="109" y="38" width="87" height="16" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="111" y="49" class="mono-txt" font-weight="700" fill="#1d4ed8">c_k2^(2) [Best]</text>
        <text x="111" y="68" class="mono-txt" fill="#334155">c_2^(2) in R^24</text>
        <text x="111" y="85" class="mono-txt" fill="#64748b">...</text>
        <text x="111" y="98" class="mono-txt" fill="#334155">c_255^(2)</text>

        <!-- Ellipsis -->
        <text x="215" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16px" fill="#94a3b8">···</text>

        <!-- Codebook m -->
        <rect x="235" y="0" width="95" height="105" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <rect x="0" y="0" width="95" height="18" fill="#e0f2fe" transform="translate(235, 0)"/>
        <text x="282" y="9" class="badge-txt" fill="#0369a1">Codebook C_m</text>
        <text x="241" y="32" class="mono-txt" fill="#334155">c_0^(m) in R^24</text>
        <text x="241" y="47" class="mono-txt" fill="#334155">c_1^(m) in R^24</text>
        <text x="241" y="62" class="mono-txt" fill="#64748b">...</text>
        <rect x="239" y="68" width="87" height="16" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="241" y="79" class="mono-txt" font-weight="700" fill="#1d4ed8">c_km^(m) [Best]</text>
        <text x="241" y="98" class="mono-txt" fill="#334155">c_255^(m)</text>

        <!-- Codebook 64 -->
        <rect x="340" y="0" width="75" height="105" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <rect x="0" y="0" width="75" height="18" fill="#e0f2fe" transform="translate(340, 0)"/>
        <text x="377" y="9" class="badge-txt" fill="#0369a1">C_64</text>
        <text x="344" y="32" class="mono-txt" fill="#334155">c_0^(64)</text>
        <text x="344" y="52" class="mono-txt" fill="#64748b">...</text>
        <rect x="342" y="62" width="71" height="16" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="344" y="73" class="mono-txt" font-weight="700" fill="#1d4ed8">c_k64 [Best]</text>
        <text x="344" y="95" class="mono-txt" fill="#334155">c_255^(64)</text>
      </g>
    </g>

    <!-- Downward Arrows to Compressed Record -->
    <path d="M 232 330 L 232 355" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Stage 3: Compact Quantized Byte-Code Record -->
    <g transform="translate(15, 360)">
      <rect width="435" height="180" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="435" height="24" rx="3" fill="#ecfdf5"/>
      <text x="10" y="16" class="box-label" fill="#065f46">3. Quantized Discrete Byte-Code Record (64 Bytes Total)</text>

      <text x="10" y="38" class="sub-text">Each centroid index k_m in [0, 255] requires exactly ceil(log2(256)) = 8 bits = 1 byte:</text>

      <!-- Byte Code Bar -->
      <g transform="translate(10, 48)">
        <rect x="0" y="0" width="55" height="32" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
        <text x="27" y="12" class="badge-txt" fill="#14532d">Byte 1</text>
        <text x="27" y="24" class="mono-txt" font-weight="700" fill="#15803d" text-anchor="middle">k_1</text>

        <rect x="62" y="0" width="55" height="32" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
        <text x="89" y="12" class="badge-txt" fill="#14532d">Byte 2</text>
        <text x="89" y="24" class="mono-txt" font-weight="700" fill="#15803d" text-anchor="middle">k_2</text>

        <rect x="124" y="0" width="35" height="32" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="141" y="18" class="badge-txt" fill="#64748b">...</text>

        <rect x="166" y="0" width="55" height="32" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
        <text x="193" y="12" class="badge-txt" fill="#14532d">Byte m</text>
        <text x="193" y="24" class="mono-txt" font-weight="700" fill="#15803d" text-anchor="middle">k_m</text>

        <rect x="228" y="0" width="35" height="32" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="245" y="18" class="badge-txt" fill="#64748b">...</text>

        <rect x="270" y="0" width="60" height="32" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
        <text x="300" y="12" class="badge-txt" fill="#14532d">Byte 64</text>
        <text x="300" y="24" class="mono-txt" font-weight="700" fill="#15803d" text-anchor="middle">k_64</text>

        <rect x="338" y="0" width="75" height="32" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="375" y="12" class="badge-txt" fill="#475569">Total Size</text>
        <text x="375" y="24" class="mono-txt" font-weight="700" fill="#0f172a" text-anchor="middle">64 Bytes</text>
      </g>

      <!-- Compression Metrics Box -->
      <g transform="translate(10, 92)">
        <rect width="415" height="74" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="16" class="box-label" fill="#0f172a">Exact Systems Mathematical Derivation:</text>
        <text x="10" y="32" class="mono-txt" fill="#1e293b">• Uncompressed Vector (FP32): 1536 * 4 B = 6,144 Bytes</text>
        <text x="10" y="47" class="mono-txt" fill="#1e293b">• Quantized Byte Record (M=64): 64 * 1 B = 64 Bytes</text>
        <text x="10" y="63" class="mono-txt" font-weight="700" fill="#15803d">• Net Compression Factor: 6,144 / 64 = 96.0x Storage Reduction</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: ONLINE ASYMMETRIC DISTANCE COMPUTATION (ADC)         -->
  <!-- ================================================================= -->
  <g transform="translate(510, 20)">
    <rect width="465" height="560" class="card-bg"/>

    <!-- Header Pill -->
    <rect x="12" y="12" width="230" height="22" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="18" y="27" class="header-pill" fill="#6d28d9">ONLINE ASYMMETRIC DISTANCE (ADC)</text>
    <text x="12" y="52" class="sub-text">Fast postings scan via CPU L1-cached Look-Up Table (LUT)</text>

    <!-- Stage 1: Unquantized Query Vector q -->
    <g transform="translate(15, 65)">
      <rect width="435" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="box-label">1. Unquantized Query Vector q in R^1536 (Exact FP32)</text>
      <text x="10" y="28" class="sub-text">Preserving q in full precision prevents double-quantization error accumulation</text>

      <!-- Query Sub-vectors -->
      <g transform="translate(10, 36)">
        <rect x="0" y="0" width="85" height="24" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
        <text x="42" y="12" class="badge-txt" fill="#b45309">q^(1) [24-d]</text>

        <rect x="92" y="0" width="85" height="24" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
        <text x="134" y="12" class="badge-txt" fill="#b45309">q^(2) [24-d]</text>

        <rect x="184" y="0" width="45" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="206" y="12" class="badge-txt" fill="#64748b">...</text>

        <rect x="236" y="0" width="85" height="24" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
        <text x="278" y="12" class="badge-txt" fill="#b45309">q^(m) [24-d]</text>

        <rect x="328" y="0" width="45" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="350" y="12" class="badge-txt" fill="#64748b">...</text>

        <rect x="380" y="0" width="45" height="24" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
        <text x="402" y="12" class="badge-txt" fill="#b45309">q^(64)</text>
      </g>
    </g>

    <!-- Downward Arrow to LUT -->
    <path d="M 232 140 L 232 165" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>

    <!-- Stage 2: Precomputed Distance LUT in L1 Cache -->
    <g transform="translate(15, 170)">
      <rect width="435" height="185" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="0" y="0" width="435" height="24" rx="3" fill="#f5f3ff"/>
      <text x="10" y="16" class="box-label" fill="#5b21b6">2. Precomputed Look-Up Table: LUT[m, j] = ||q^(m) - c_j^(m)||^2</text>

      <text x="10" y="38" class="sub-text">Evaluated once per query across 64 * 256 = 16,384 scalar distances (64 KB in L1):</text>

      <!-- LUT Table Grid -->
      <g transform="translate(10, 48)">
        <rect width="415" height="125" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        
        <!-- Table Header -->
        <rect width="415" height="20" fill="#f1f5f9"/>
        <text x="10" y="14" class="mono-txt" font-weight="700" fill="#475569">Subspace m</text>
        <text x="95" y="14" class="mono-txt" font-weight="700" fill="#475569">Centroid #0</text>
        <text x="190" y="14" class="mono-txt" font-weight="700" fill="#475569">Centroid #k_m</text>
        <text x="310" y="14" class="mono-txt" font-weight="700" fill="#475569">Centroid #255</text>

        <!-- Row 1: m=1 -->
        <line x1="0" y1="20" x2="415" y2="20" stroke="#cbd5e1"/>
        <text x="10" y="36" class="mono-txt" font-weight="700" fill="#0284c7">m = 1</text>
        <text x="95" y="36" class="mono-txt" fill="#334155">0.4215</text>
        <rect x="180" y="24" width="80" height="16" rx="2" fill="#ddd6fe"/>
        <text x="190" y="36" class="mono-txt" font-weight="700" fill="#5b21b6">LUT[1, k_1]</text>
        <text x="310" y="36" class="mono-txt" fill="#334155">1.8410</text>

        <!-- Row 2: m=2 -->
        <line x1="0" y1="45" x2="415" y2="45" stroke="#cbd5e1"/>
        <text x="10" y="61" class="mono-txt" font-weight="700" fill="#0284c7">m = 2</text>
        <text x="95" y="61" class="mono-txt" fill="#334155">0.9140</text>
        <rect x="180" y="49" width="80" height="16" rx="2" fill="#ddd6fe"/>
        <text x="190" y="61" class="mono-txt" font-weight="700" fill="#5b21b6">LUT[2, k_2]</text>
        <text x="310" y="61" class="mono-txt" fill="#334155">0.2481</text>

        <!-- Ellipsis -->
        <line x1="0" y1="70" x2="415" y2="70" stroke="#cbd5e1"/>
        <text x="10" y="85" class="mono-txt" fill="#64748b">...</text>
        <text x="95" y="85" class="mono-txt" fill="#64748b">...</text>
        <text x="190" y="85" class="mono-txt" fill="#7c3aed">...</text>
        <text x="310" y="85" class="mono-txt" fill="#64748b">...</text>

        <!-- Row 64: m=64 -->
        <line x1="0" y1="94" x2="415" y2="94" stroke="#cbd5e1"/>
        <text x="10" y="110" class="mono-txt" font-weight="700" fill="#0284c7">m = 64</text>
        <text x="95" y="110" class="mono-txt" fill="#334155">0.0812</text>
        <rect x="180" y="98" width="80" height="16" rx="2" fill="#ddd6fe"/>
        <text x="190" y="110" class="mono-txt" font-weight="700" fill="#5b21b6">LUT[64, k_64]</text>
        <text x="310" y="110" class="mono-txt" fill="#334155">0.6724</text>
      </g>
    </g>

    <!-- Downward Arrow to Accumulator -->
    <path d="M 232 360 L 232 385" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Stage 3: Zero-Multiplication Postings Distance Accumulation -->
    <g transform="translate(15, 390)">
      <rect width="435" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="435" height="24" rx="3" fill="#f8fafc"/>
      <text x="10" y="16" class="box-label">3. Inner Loop ADC Evaluation: O(1) Lookups &amp; Additions</text>

      <!-- Equation Box -->
      <g transform="translate(10, 32)">
        <rect width="415" height="34" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
        <text x="207" y="21" class="mono-txt" font-size="10px" font-weight="700" fill="#5b21b6" text-anchor="middle">dist(q, x) ≈ sum_{m=1}^{64} LUT[m, k_m]</text>
      </g>

      <!-- Execution Mechanics List -->
      <g transform="translate(10, 74)">
        <text x="10" y="16" class="mono-txt" fill="#1e293b">• Zero 1536-dimensional floating-point dot products during scan</text>
        <text x="10" y="32" class="mono-txt" fill="#1e293b">• Evaluated via 64 table lookups + 63 scalar additions in SIMD</text>
        <text x="10" y="48" class="mono-txt" fill="#1e293b">• Streaming sequential byte codes from NVMe avoids memory bus stalls</text>
        <text x="10" y="64" class="mono-txt" font-weight="700" fill="#047857">• Throughput: &gt; 15,000,000 distance evaluations / sec / core</text>
      </g>
    </g>
  </g>
</svg>