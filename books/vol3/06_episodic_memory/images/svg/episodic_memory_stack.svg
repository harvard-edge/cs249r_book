<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="900" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">AGENT MEMORY &amp; STORAGE HIERARCHY (PHYSICAL SPECIFICATIONS &amp; ACCESS DYNAMICS)</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Tiered migration across GPU HBM, host DRAM, and durable indexed NVMe secondary storage</text>

  <!-- ================================================================= -->
  <!-- SECTION 1: VOLATILE WORKING SET TIERS                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="655" height="135" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="655" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">VOLATILE WORKING SET TIERS (GPU HBM &amp; HOST DRAM)</text>

    <!-- L1: Active Working Context (GPU HBM3e) -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="290" height="92" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="290" height="18" fill="#e0f2fe"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0369a1">L1: Active Working Context (GPU HBM3e)</text>

      <text x="8" y="32" font-size="6.8" fill="#334155">• Capacity: 80–192 GB per GPU | Bandwidth: 3.35 TB/s</text>
      <text x="8" y="45" font-size="6.8" fill="#334155">• Latency: &lt; 10 ns (Register File / SRAM / FlashAttention)</text>
      <text x="8" y="58" font-size="6.8" fill="#334155">• State: Active attention KV cache (N ≤ 128k tokens)</text>
      <rect x="8" y="66" width="274" height="18" rx="1" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="145" y="78" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" font-weight="700" fill="#0284c7">Direct Matrix Engine Interconnect</text>
    </g>

    <!-- Bi-directional Paging Arrows -->
    <g transform="translate(305, 68)">
      <path d="M5,7 L35,7" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <path d="M35,21 L5,21" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text x="20" y="1" text-anchor="middle" font-size="6" font-weight="700" fill="#0369a1">Swap In</text>
      <text x="20" y="33" text-anchor="middle" font-size="6" font-weight="700" fill="#0369a1">Swap Out</text>
    </g>

    <!-- L2: Paged Virtual Memory (Host DRAM / NVMe) -->
    <g transform="translate(353, 32)">
      <rect x="0" y="0" width="290" height="92" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="290" height="18" fill="#e0f2fe"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0369a1">L2: Paged Virtual Memory (Host DRAM / NVMe)</text>

      <text x="8" y="32" font-size="6.8" fill="#334155">• Capacity: 512 GB – 2 TB | Bandwidth: 100–400 GB/s</text>
      <text x="8" y="45" font-size="6.8" fill="#334155">• Latency: 50–100 ns (PCIe Gen5 / CXL 2.0 Bus)</text>
      <text x="8" y="58" font-size="6.8" fill="#334155">• State: Inactive agent sessions, radix prefix cache</text>
      <rect x="8" y="66" width="274" height="18" rx="1" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="145" y="78" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" font-weight="700" fill="#0284c7">PagedAttention Block Translation Table</text>
    </g>
  </g>

  <!-- Vertical Arrows down to Gate -->
  <path d="M190,207 L190,222" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M535,207 L535,222" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- ================================================================= -->
  <!-- SECTION 2: TRANSACTIONAL EVICTION & COMPACTION BOUNDARY           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 222)">
    <rect x="0" y="0" width="655" height="46" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="18" font-size="8" font-weight="700" fill="#b45309">EVICTION &amp; COMPACTION BOUNDARY (TRANSACTIONAL WAL GATE)</text>
    <text x="12" y="33" font-size="7" fill="#78350f">Invariant: Zero context eviction before fsync. Triggered when context length &gt; N_max or session suspends.</text>

    <rect x="475" y="8" width="168" height="30" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="559" y="21" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Compaction Pipeline</text>
    <text x="559" y="32" text-anchor="middle" font-size="6.2" fill="#78350f">Chunking ➔ Embedding ➔ Dedup</text>
  </g>

  <!-- Vertical Arrows down to Persistent Storage -->
  <path d="M150,268 L150,283" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M365,268 L365,283" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M580,268 L580,283" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ================================================================= -->
  <!-- SECTION 3: NON-VOLATILE EPISODIC STORAGE                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 283)">
    <rect x="0" y="0" width="655" height="222" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="655" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">L3: NON-VOLATILE EPISODIC STORAGE TIER (SECONDARY / PERSISTENT)</text>

    <!-- Sub-tier 1: Dense Vector Indices -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="200" height="178" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="20" fill="#dcfce7"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803d">Dense Metric Vectors</text>

      <text x="8" y="35" font-size="6.8" font-weight="700" fill="#334155">Engine: HNSW / IVF-PQ</text>
      <text x="8" y="49" font-size="6.5" fill="#475569">• Vector dims: D=1536 (FP16/PQ)</text>
      <text x="8" y="62" font-size="6.5" fill="#475569">• Query latency: 2–5 ms (ADC)</text>
      <text x="8" y="75" font-size="6.5" fill="#475569">• Storage: Memory-mapped NVMe</text>

      <rect x="8" y="86" width="184" height="82" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="100" font-size="6.5" font-weight="700" fill="#0f172a">Semantic Recall Index</text>
      <text x="12" y="112" font-size="6" fill="#334155">Top-k nearest neighbor search</text>
      <text x="12" y="124" font-size="6" fill="#334155">across historical turn embeddings</text>
      <text x="12" y="136" font-size="6" fill="#334155">and synthesized task reflections.</text>
      <rect x="12" y="144" width="176" height="16" rx="1" fill="#dcfce7"/>
      <text x="100" y="155" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#15803d">O(log N) Graph Traverse</text>
    </g>

    <!-- Sub-tier 2: Topological Knowledge Graphs -->
    <g transform="translate(227, 32)">
      <rect x="0" y="0" width="200" height="178" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="20" fill="#dcfce7"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803d">Topological Code Graphs</text>

      <text x="8" y="35" font-size="6.8" font-weight="700" fill="#334155">Engine: Tree-Sitter / Neo4j</text>
      <text x="8" y="49" font-size="6.5" fill="#475569">• Primitives: AST nodes, edges</text>
      <text x="8" y="62" font-size="6.5" fill="#475569">• Query latency: 5–15 ms</text>
      <text x="8" y="75" font-size="6.5" fill="#475569">• Schema: Symbol Call Graphs</text>

      <rect x="8" y="86" width="184" height="82" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="100" font-size="6.5" font-weight="700" fill="#0f172a">Structural Dependency Map</text>
      <text x="12" y="112" font-size="6" fill="#334155">Resolves callers, definitions,</text>
      <text x="12" y="124" font-size="6" fill="#334155">and type signatures without</text>
      <text x="12" y="136" font-size="6" fill="#334155">hallucinating unseen modules.</text>
      <rect x="12" y="144" width="176" height="16" rx="1" fill="#dcfce7"/>
      <text x="100" y="155" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#15803d">Deterministic Cypher/AST</text>
    </g>

    <!-- Sub-tier 3: Transactional Event Ledgers -->
    <g transform="translate(442, 32)">
      <rect x="0" y="0" width="200" height="178" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="20" fill="#dcfce7"/>
      <text x="8" y="14" font-size="7.5" font-weight="700" fill="#15803d">Transactional Event Ledgers</text>

      <text x="8" y="35" font-size="6.8" font-weight="700" fill="#334155">Engine: SQLite / DuckDB WAL</text>
      <text x="8" y="49" font-size="6.5" fill="#475569">• Invariant: ACID fsync commit</text>
      <text x="8" y="62" font-size="6.5" fill="#475569">• Write latency: &lt; 1 ms (NVMe)</text>
      <text x="8" y="75" font-size="6.5" fill="#475569">• Records: Raw stdout/stderr/diffs</text>

      <rect x="8" y="86" width="184" height="82" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="12" y="100" font-size="6.5" font-weight="700" fill="#0f172a">Audit &amp; Crash Recovery</text>
      <text x="12" y="112" font-size="6" fill="#334155">Enables exact point-in-time</text>
      <text x="12" y="124" font-size="6" fill="#334155">replay, compensating sagas,</text>
      <text x="12" y="136" font-size="6" fill="#334155">and offline RLVR training data.</text>
      <rect x="12" y="144" width="176" height="16" rx="1" fill="#dcfce7"/>
      <text x="100" y="155" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#15803d">Strict Append-Only Invariant</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: SYSTEM METRICS BY TIER                               -->
  <!-- ================================================================= -->
  <g transform="translate(710, 72)">
    <rect x="0" y="0" width="190" height="433" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">SYSTEM METRICS BY TIER</text>

    <!-- Top Card: L1 Specs -->
    <g transform="translate(8, 32)">
      <rect x="0" y="0" width="174" height="86" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#0284c7">L1: GPU HBM3e</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">Latency: <tspan font-weight="700" fill="#0f172a">~10 ns</tspan></text>
      <text x="8" y="40" font-size="6.2" fill="#475569">Bandwidth: <tspan font-weight="700" fill="#0f172a">3.35 TB/s</tspan></text>
      <text x="8" y="52" font-size="6.2" fill="#475569">Capacity: <tspan font-weight="700" fill="#0f172a">80–192 GB</tspan></text>
      <text x="8" y="64" font-size="6.2" fill="#475569">Relative Cost: <tspan font-weight="700" fill="#dc2626">Highest (HBM)</tspan></text>
      <text x="8" y="76" font-size="6.2" fill="#0369a1">Persistence: None (Volatile)</text>
    </g>

    <!-- Mid Card: L2 Specs -->
    <g transform="translate(8, 126)">
      <rect x="0" y="0" width="174" height="86" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#0284c7">L2: Host DRAM / CXL</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">Latency: <tspan font-weight="700" fill="#0f172a">50–100 ns</tspan></text>
      <text x="8" y="40" font-size="6.2" fill="#475569">Bandwidth: <tspan font-weight="700" fill="#0f172a">100–400 GB/s</tspan></text>
      <text x="8" y="52" font-size="6.2" fill="#475569">Capacity: <tspan font-weight="700" fill="#0f172a">512 GB – 2 TB</tspan></text>
      <text x="8" y="64" font-size="6.2" fill="#475569">Relative Cost: <tspan font-weight="700" fill="#d97706">Moderate (DRAM)</tspan></text>
      <text x="8" y="76" font-size="6.2" fill="#0369a1">Persistence: None (Volatile)</text>
    </g>

    <!-- Bottom Card: L3 Specs -->
    <g transform="translate(8, 220)">
      <rect x="0" y="0" width="174" height="116" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#15803d">L3: NVMe / S3 Secondary</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">Latency: <tspan font-weight="700" fill="#0f172a">10 µs – 10 ms</tspan></text>
      <text x="8" y="40" font-size="6.2" fill="#475569">Bandwidth: <tspan font-weight="700" fill="#0f172a">5–15 GB/s (NVMe)</tspan></text>
      <text x="8" y="52" font-size="6.2" fill="#475569">Capacity: <tspan font-weight="700" fill="#0f172a">Multi-TB ➔ Unbounded</tspan></text>
      <text x="8" y="64" font-size="6.2" fill="#475569">Relative Cost: <tspan font-weight="700" fill="#16a34a">Lowest (NVMe)</tspan></text>
      <text x="8" y="76" font-size="6.2" fill="#15803d">Persistence: Full (ACID / WAL)</text>
      <rect x="8" y="85" width="158" height="22" rx="1" fill="#dcfce7"/>
      <text x="87" y="96" text-anchor="middle" font-size="6" font-weight="700" fill="#15803d">Preserves Multi-Turn State</text>
      <text x="87" y="104" text-anchor="middle" font-size="5.5" fill="#14532d">Beyond Context Window Limit</text>
    </g>

    <!-- Bottom Principle Note -->
    <g transform="translate(8, 344)">
      <rect x="0" y="0" width="174" height="80" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#0369a1">Systems Rule:</text>
      <text x="8" y="27" font-size="6.2" fill="#334155">"Fast memory cannot be large;</text>
      <text x="8" y="39" font-size="6.2" fill="#334155">large memory cannot be fast."</text>
      <text x="8" y="53" font-size="6.2" fill="#475569">Autonomous reasoning requires</text>
      <text x="8" y="64" font-size="6.2" fill="#475569">tiered migration across HBM,</text>
      <text x="8" y="74" font-size="6.2" fill="#475569">DRAM, and indexed NVMe.</text>
    </g>
  </g>

</svg>
