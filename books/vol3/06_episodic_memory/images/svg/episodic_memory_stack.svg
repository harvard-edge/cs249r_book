<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="940" height="520" fill="#ffffff"/>

  <!-- Main Container -->
  <rect x="20" y="15" width="900" height="490" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="15" width="900" height="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="32" y="32" font-size="9" font-weight="700" fill="#1e293b">AGENT MEMORY &amp; STORAGE HIERARCHY (PHYSICAL SPECIFICATIONS &amp; ACCESS DYNAMICS)</text>

  <!-- ================================================================= -->
  <!-- SECTION 1: VOLATILE MEMORY TIERS (L1 & L2) (y: 50 to 195)          -->
  <!-- ================================================================= -->
  <g transform="translate(35, 52)">
    <!-- Volatile Tier Header/Band -->
    <rect x="0" y="0" width="660" height="135" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="660" height="20" fill="#e0f2fe"/>
    <text x="10" y="14" font-size="7.5" font-weight="700" fill="#0369a1">VOLATILE WORKING SET TIERS (GPU HBM &amp; HOST DRAM)</text>

    <!-- L1: Active Context (GPU HBM3e) -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="295" height="90" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="295" height="18" fill="#e0f2fe"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0369a1">L1: Active Working Context (GPU HBM3e)</text>
      
      <text x="8" y="32" font-size="6.8" fill="#334155">• Capacity: 80–192 GB per GPU | Bandwidth: 3.35 TB/s</text>
      <text x="8" y="45" font-size="6.8" fill="#334155">• Latency: &lt; 10 ns (Register File / SRAM / FlashAttention)</text>
      <text x="8" y="58" font-size="6.8" fill="#334155">• State: Active attention KV cache (N ≤ 128k tokens)</text>
      <rect x="8" y="66" width="279" height="16" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="147" y="77" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" font-weight="700" fill="#0284c7">Direct Matrix Engine Interconnect</text>
    </g>

    <!-- Bi-directional Paging Arrows -->
    <g transform="translate(315, 68)">
      <path d="M5,5 L25,5" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <path d="M25,17 L5,17" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text x="15" y="0" text-anchor="middle" font-size="5.8" font-weight="700" fill="#0369a1">Swap In</text>
      <text x="15" y="29" text-anchor="middle" font-size="5.8" font-weight="700" fill="#0369a1">Swap Out</text>
    </g>

    <!-- L2: Paged KV Cache (Host DRAM / NVMe) -->
    <g transform="translate(345, 30)">
      <rect x="0" y="0" width="300" height="90" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="300" height="18" fill="#e0f2fe"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0369a1">L2: Paged Virtual Memory (Host DRAM / NVMe)</text>
      
      <text x="8" y="32" font-size="6.8" fill="#334155">• Capacity: 512 GB – 2 TB | Bandwidth: 100–400 GB/s</text>
      <text x="8" y="45" font-size="6.8" fill="#334155">• Latency: 50–100 ns (PCIe Gen5 / CXL 2.0 Bus)</text>
      <text x="8" y="58" font-size="6.8" fill="#334155">• State: Inactive agent sessions, radix prefix cache</text>
      <rect x="8" y="66" width="284" height="16" rx="1" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="150" y="77" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" font-weight="700" fill="#0284c7">PagedAttention Block Translation Table</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SECTION 2: TRANSACTIONAL EVICTION BOUNDARY (y: 200 to 248)        -->
  <!-- ================================================================= -->
  <g transform="translate(35, 198)">
    <rect x="0" y="0" width="660" height="44" rx="1" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="15" y="17" font-size="7.5" font-weight="700" fill="#b45309">EVICTION &amp; COMPACTION BOUNDARY (TRANSACTIONAL WAL GATE)</text>
    <text x="15" y="31" font-size="6.8" fill="#78350f">Invariant: Zero context eviction before fsync. Triggered when context length &gt; N_max or session suspends.</text>
    
    <rect x="480" y="8" width="165" height="28" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="562" y="20" text-anchor="middle" font-size="6.5" font-weight="700" fill="#b45309">Compaction Pipeline</text>
    <text x="562" y="30" text-anchor="middle" font-size="5.8" fill="#78350f">Chunking ➔ Embedding ➔ Dedup</text>
  </g>

  <!-- Vertical Arrows down from Volatile to Gate -->
  <path d="M200,187 L200,198" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M510,187 L510,198" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Vertical Arrows down from Gate to Persistent Storage -->
  <path d="M140,242 L140,260" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M360,242 L360,260" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M580,242 L580,260" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ================================================================= -->
  <!-- SECTION 3: NON-VOLATILE EPISODIC STORAGE (y: 260 to 485)          -->
  <!-- ================================================================= -->
  <g transform="translate(35, 260)">
    <rect x="0" y="0" width="660" height="225" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="660" height="20" fill="#dcfce7"/>
    <text x="10" y="14" font-size="7.5" font-weight="700" fill="#15803d">L3: NON-VOLATILE EPISODIC STORAGE TIER (SECONDARY / PERSISTENT)</text>

    <!-- Sub-tier 1: Dense Vector Indices -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="200" height="180" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="20" fill="#dcfce7"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#15803d">Dense Metric Vectors</text>
      
      <text x="8" y="35" font-size="6.8" font-weight="700" fill="#334155">Engine: HNSW / IVF-PQ</text>
      <text x="8" y="49" font-size="6.5" fill="#475569">• Vector dims: D=1536 (FP16/PQ)</text>
      <text x="8" y="62" font-size="6.5" fill="#475569">• Query latency: 2–5 ms (ADC)</text>
      <text x="8" y="75" font-size="6.5" fill="#475569">• Storage: Memory-mapped NVMe</text>

      <rect x="8" y="86" width="184" height="82" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="14" y="99" font-size="6.5" font-weight="700" fill="#1e293b">Semantic Recall Index</text>
      <text x="14" y="111" font-size="6" fill="#334155">Top-k nearest neighbor search</text>
      <text x="14" y="123" font-size="6" fill="#334155">across historical turn embeddings</text>
      <text x="14" y="135" font-size="6" fill="#334155">and synthesized task reflections.</text>
      <rect x="14" y="143" width="172" height="16" rx="1" fill="#dcfce7"/>
      <text x="100" y="154" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#15803d">O(log N) Graph Traverse</text>
    </g>

    <!-- Sub-tier 2: Topological Knowledge Graphs -->
    <g transform="translate(230, 30)">
      <rect x="0" y="0" width="200" height="180" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="20" fill="#dcfce7"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#15803d">Topological Code Graphs</text>
      
      <text x="8" y="35" font-size="6.8" font-weight="700" fill="#334155">Engine: Tree-Sitter / Neo4j</text>
      <text x="8" y="49" font-size="6.5" fill="#475569">• Primitives: AST nodes, edges</text>
      <text x="8" y="62" font-size="6.5" fill="#475569">• Query latency: 5–15 ms</text>
      <text x="8" y="75" font-size="6.5" fill="#475569">• Schema: Symbol Call Graphs</text>

      <rect x="8" y="86" width="184" height="82" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="14" y="99" font-size="6.5" font-weight="700" fill="#1e293b">Structural Dependency Map</text>
      <text x="14" y="111" font-size="6" fill="#334155">Resolves callers, definitions,</text>
      <text x="14" y="123" font-size="6" fill="#334155">and type signatures without</text>
      <text x="14" y="135" font-size="6" fill="#334155">hallucinating unseen modules.</text>
      <rect x="14" y="143" width="172" height="16" rx="1" fill="#dcfce7"/>
      <text x="100" y="154" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#15803d">Deterministic Cypher/AST</text>
    </g>

    <!-- Sub-tier 3: Transactional Event Ledgers -->
    <g transform="translate(445, 30)">
      <rect x="0" y="0" width="200" height="180" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="200" height="20" fill="#dcfce7"/>
      <text x="8" y="14" font-size="7.2" font-weight="700" fill="#15803d">Transactional Event Ledgers</text>
      
      <text x="8" y="35" font-size="6.8" font-weight="700" fill="#334155">Engine: SQLite / DuckDB WAL</text>
      <text x="8" y="49" font-size="6.5" fill="#475569">• Invariant: ACID fsync commit</text>
      <text x="8" y="62" font-size="6.5" fill="#475569">• Write latency: &lt; 1 ms (NVMe)</text>
      <text x="8" y="75" font-size="6.5" fill="#475569">• Records: Raw stdout/stderr/diffs</text>

      <rect x="8" y="86" width="184" height="82" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="14" y="99" font-size="6.5" font-weight="700" fill="#1e293b">Audit &amp; Crash Recovery</text>
      <text x="14" y="111" font-size="6" fill="#334155">Enables exact point-in-time</text>
      <text x="14" y="123" font-size="6" fill="#334155">replay, compensating sagas,</text>
      <text x="14" y="135" font-size="6" fill="#334155">and offline RLVR training flywheels.</text>
      <rect x="14" y="143" width="172" height="16" rx="1" fill="#dcfce7"/>
      <text x="100" y="154" text-anchor="middle" font-family="Courier, monospace" font-size="6.2" font-weight="700" fill="#15803d">Strict Append-Only Invariant</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: SPEED VS CAPACITY PYRAMID COMPARISON (x: 710 to 905) -->
  <!-- ================================================================= -->
  <g transform="translate(710, 52)">
    <rect x="0" y="0" width="195" height="433" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="20" fill="#f1f5f9"/>
    <text x="10" y="14" font-size="7.5" font-weight="700" fill="#334155">SYSTEM METRICS BY TIER</text>

    <!-- Top Card: L1 Specs -->
    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="175" height="85" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#0284c7">L1: GPU HBM3e</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">Latency: <tspan font-weight="700" fill="#0f172a">~10 ns</tspan></text>
      <text x="8" y="40" font-size="6.2" fill="#475569">Bandwidth: <tspan font-weight="700" fill="#0f172a">3.35 TB/s</tspan></text>
      <text x="8" y="52" font-size="6.2" fill="#475569">Capacity: <tspan font-weight="700" fill="#0f172a">80–192 GB</tspan></text>
      <text x="8" y="64" font-size="6.2" fill="#475569">Relative Cost: <tspan font-weight="700" fill="#b91c1c">Highest (HBM)</tspan></text>
      <text x="8" y="76" font-size="6.2" fill="#0369a1">Persistence: None (Volatile)</text>
    </g>

    <!-- Mid Card: L2 Specs -->
    <g transform="translate(10, 125)">
      <rect x="0" y="0" width="175" height="85" rx="1" fill="#ffffff" stroke="#0ea5e9" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#0284c7">L2: Host DRAM / CXL</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">Latency: <tspan font-weight="700" fill="#0f172a">50–100 ns</tspan></text>
      <text x="8" y="40" font-size="6.2" fill="#475569">Bandwidth: <tspan font-weight="700" fill="#0f172a">100–400 GB/s</tspan></text>
      <text x="8" y="52" font-size="6.2" fill="#475569">Capacity: <tspan font-weight="700" fill="#0f172a">512 GB – 2 TB</tspan></text>
      <text x="8" y="64" font-size="6.2" fill="#475569">Relative Cost: <tspan font-weight="700" fill="#d97706">Moderate (DRAM)</tspan></text>
      <text x="8" y="76" font-size="6.2" fill="#0369a1">Persistence: None (Volatile)</text>
    </g>

    <!-- Bottom Card: L3 Specs -->
    <g transform="translate(10, 220)">
      <rect x="0" y="0" width="175" height="115" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="7" font-weight="700" fill="#15803d">L3: NVMe / S3 Secondary</text>
      <text x="8" y="28" font-size="6.2" fill="#475569">Latency: <tspan font-weight="700" fill="#0f172a">10 µs – 10 ms</tspan></text>
      <text x="8" y="40" font-size="6.2" fill="#475569">Bandwidth: <tspan font-weight="700" fill="#0f172a">5–15 GB/s (NVMe)</tspan></text>
      <text x="8" y="52" font-size="6.2" fill="#475569">Capacity: <tspan font-weight="700" fill="#0f172a">Multi-TB ➔ Unbounded</tspan></text>
      <text x="8" y="64" font-size="6.2" fill="#475569">Relative Cost: <tspan font-weight="700" fill="#16a34a">Lowest (NVMe)</tspan></text>
      <text x="8" y="76" font-size="6.2" fill="#15803d">Persistence: Full (ACID / WAL)</text>
      <rect x="8" y="84" width="159" height="22" rx="1" fill="#dcfce7"/>
      <text x="87" y="95" text-anchor="middle" font-size="6" font-weight="700" fill="#15803d">Preserves Multi-Turn State</text>
      <text x="87" y="103" text-anchor="middle" font-size="5.8" fill="#14532d">Beyond Context Window Limit</text>
    </g>

    <!-- Bottom Principle Note -->
    <g transform="translate(10, 345)">
      <rect x="0" y="0" width="175" height="78" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="8" y="14" font-size="6.8" font-weight="700" fill="#1e40af">Systems Rule:</text>
      <text x="8" y="26" font-size="6" fill="#334155">"Fast memory cannot be large;</text>
      <text x="8" y="37" font-size="6" fill="#334155">large memory cannot be fast."</text>
      <text x="8" y="50" font-size="6" fill="#475569">Autonomous reasoning requires</text>
      <text x="8" y="61" font-size="6" fill="#475569">tiered migration across HBM,</text>
      <text x="8" y="71" font-size="6" fill="#475569">DRAM, and indexed NVMe.</text>
    </g>
  </g>

</svg>
