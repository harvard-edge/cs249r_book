<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #0f172a; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 9.5px; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Left Panel: Pipeline Stages -->
  <g transform="translate(15, 12)">
    <rect width="480" height="306" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="478" height="30" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#1e40af">STAGE 1: GRAPH EXTRACTION &amp; STORAGE PIPELINE</text>

    <!-- Step 1 -->
    <rect x="20" y="44" width="440" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="62" class="box-lbl">Raw Source Code Repository</text>
    <text x="32" y="76" class="box-sub">Filesystem, Git Working Tree (e.g., 1M lines, ~40 MB ASCII)</text>

    <path d="M 240 86 L 240 98" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Step 2 -->
    <rect x="20" y="98" width="440" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="116" class="box-lbl" fill="#1e40af">Incremental AST Parsing (Tree-sitter)</text>
    <text x="32" y="130" class="box-sub">Emits Local AST + Symbol Scopes in ~2 ms/file; token byte offsets</text>

    <path d="M 240 140 L 240 152" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Step 3 -->
    <rect x="20" y="152" width="440" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="170" class="box-lbl" fill="#1e40af">Cross-Reference Linker (SCIP / LSIF)</text>
    <text x="32" y="184" class="box-sub">Resolves module imports, type signatures; generates CALLS &amp; READS edges</text>

    <path d="M 240 194 L 240 206" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Step 4 -->
    <rect x="20" y="206" width="440" height="46" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="225" class="box-lbl" fill="#15803d">Embedded Property Graph Storage</text>
    <text x="32" y="241" class="box-sub">SQLite CTEs / LMDB adjacency lists; graph footprint beta = 8x - 25x (~1 GB)</text>

    <!-- Performance footer note -->
    <rect x="20" y="260" width="440" height="34" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="281" class="box-sub"><tspan font-weight="700" fill="#0f172a">Ingestion Cost:</tspan> O(N) AST parse + O(E log V) reference resolution across translation units</text>
  </g>

  <!-- Right Panel: Dual-Path Foreground/Background Engine -->
  <g transform="translate(515, 12)">
    <rect width="530" height="306" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="528" height="30" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#6d28d9">STAGE 2: DUAL-PATH TIERED REFRESH ARCHITECTURE</text>

    <!-- Foreground Path -->
    <rect x="20" y="44" width="490" height="74" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="30" y="52" width="130" height="18" rx="2" fill="#dbeafe"/>
    <text x="36" y="65" class="badge" fill="#1e40af">FOREGROUND FAST PATH</text>
    <text x="175" y="65" class="box-sub" font-weight="600">Latency: ~2 ms / modified file (Tree-sitter)</text>
    <text x="30" y="88" class="box-sub">Agent edits active file -> Incremental parse generates localized AST delta.</text>
    <text x="30" y="104" class="mono" fill="#2563eb">Delta Overlay: delta_G_local = (V_delta, E_delta) held in DRAM working memory</text>

    <!-- Background Path -->
    <rect x="20" y="126" width="490" height="74" rx="3" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <rect x="30" y="134" width="130" height="18" rx="2" fill="#ede9fe"/>
    <text x="36" y="147" class="badge" fill="#6d28d9">BACKGROUND DEEP PATH</text>
    <text x="175" y="147" class="box-sub" font-weight="600">Latency: Minutes to hours (Compiler-grade Clang/SCIP)</text>
    <text x="30" y="170" class="box-sub">Asynchronous worker daemon builds whole-program symbol table &amp; exact vtables.</text>
    <text x="30" y="186" class="mono" fill="#6d28d9">Global Graph Base: G_global persisted to disk (SQLite / LMDB index store)</text>

    <!-- Overlay Merger -->
    <rect x="20" y="208" width="490" height="86" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="228" class="box-lbl" fill="#15803d">Query-Time Unified Graph Merger</text>
    <text x="30" y="246" class="mono" fill="#166534">G_view(t) = (G_global \ Tombstones) UNION delta_G_local</text>
    <text x="30" y="264" class="box-sub" fill="#15803d">Provides point-in-time consistency to agent queries without blocking on compiler re-indexing.</text>
    <text x="30" y="280" class="box-sub" fill="#15803d">Reconciles exact global semantics with zero-latency sub-millisecond local updates.</text>
  </g>
</svg>