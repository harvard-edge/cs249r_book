<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .tbl-hdr { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10.5px; fill: #1e293b; }
      .tbl-cell { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
    <marker id="arr-ingest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1080" height="460" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Banner -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">TIERED CODE PROPERTY GRAPH (CPG) INGESTION PIPELINE</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">Static Analysis Depth vs. Ingestion Latency Trade-Offs</text>

  <!-- Left Panel: Pipeline Stages -->
  <g transform="translate(30, 72)">
    <rect width="470" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="12" width="440" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="25" y="29" class="panel-title" fill="#1e40af">INGESTION AND INDEXING PIPELINE</text>

    <!-- Step 1 -->
    <rect x="30" y="50" width="410" height="42" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="45" y="68" class="box-lbl" fill="#0f172a">1. Raw Source Code Repository</text>
    <text x="45" y="83" class="box-sub">Filesystem, Git Working Tree (e.g. 1M lines, ~40 MB ASCII)</text>

    <path d="M 235 92 L 235 106" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-ingest)"/>

    <!-- Step 2 -->
    <rect x="30" y="108" width="410" height="46" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="45" y="126" class="box-lbl" fill="#1e40af">2. Incremental AST Parsing (Tree-sitter)</text>
    <text x="45" y="142" class="box-sub">Emits Local AST + Symbol Scopes in ~2 ms/file; token offsets, AST nodes</text>

    <path d="M 235 154 L 235 168" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-ingest)"/>

    <!-- Step 3 -->
    <rect x="30" y="170" width="410" height="46" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="45" y="188" class="box-lbl" fill="#1e40af">3. Cross-Reference Linker (SCIP / LSIF)</text>
    <text x="45" y="204" class="box-sub">Resolves imports, inheritance, call targets; builds CALLS, READS edges</text>

    <path d="M 235 216 L 235 230" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-ingest)"/>

    <!-- Step 4 -->
    <rect x="30" y="232" width="410" height="48" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="45" y="251" class="box-lbl" fill="#15803d">4. Embedded Property Graph Backend</text>
    <text x="45" y="267" class="box-sub">SQLite CTEs / LMDB adjacency store; expansion factor beta = 8x - 25x (1 GB)</text>
  </g>

  <!-- Right Panel: Architectural Comparison Matrix -->
  <g transform="translate(520, 72)">
    <rect width="530" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="12" width="500" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="25" y="29" class="panel-title" fill="#334155">EXTRACTOR TIERS: SPEED VS. SEMANTIC FIDELITY</text>

    <!-- Table Container -->
    <rect x="15" y="48" width="500" height="235" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <!-- Row 1: Header -->
    <rect x="15" y="48" width="500" height="28" fill="#e2e8f0"/>
    <text x="25" y="66" class="tbl-hdr">Dimension</text>
    <text x="140" y="66" class="tbl-hdr">Lightweight (Tree-sitter)</text>
    <text x="320" y="66" class="tbl-hdr">Compiler-Grade (Clang/SCIP)</text>

    <!-- Row 2: Throughput -->
    <text x="25" y="94" class="tbl-cell" font-weight="700">Latency</text>
    <text x="140" y="94" class="tbl-cell" fill="#16a34a">~2 ms / file (incremental)</text>
    <text x="320" y="94" class="tbl-cell" fill="#dc2626">Minutes to hours (full build)</text>
    <line x1="15" y1="104" x2="515" y2="104" stroke="#e2e8f0"/>

    <!-- Row 3: Scope -->
    <text x="25" y="122" class="tbl-cell" font-weight="700">Resolution Scope</text>
    <text x="140" y="122" class="tbl-cell">Single-file syntactic CST</text>
    <text x="320" y="122" class="tbl-cell">Whole-program symbol table</text>
    <line x1="15" y1="132" x2="515" y2="132" stroke="#e2e8f0"/>

    <!-- Row 4: Types -->
    <text x="25" y="150" class="tbl-cell" font-weight="700">Type Deduction</text>
    <text x="140" y="150" class="tbl-cell" fill="#dc2626">Shallow / heuristic only</text>
    <text x="320" y="150" class="tbl-cell" fill="#16a34a">Exact types, templates, macros</text>
    <line x1="15" y1="160" x2="515" y2="160" stroke="#e2e8f0"/>

    <!-- Row 5: Dynamic Dispatch -->
    <text x="25" y="178" class="tbl-cell" font-weight="700">Dynamic Dispatch</text>
    <text x="140" y="178" class="tbl-cell" fill="#dc2626">Severed across modules</text>
    <text x="320" y="178" class="tbl-cell" fill="#16a34a">Exact vtable hierarchy</text>
    <line x1="15" y1="188" x2="515" y2="188" stroke="#e2e8f0"/>

    <!-- Strategy Card inside Right Panel -->
    <rect x="25" y="196" width="480" height="76" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="35" y="214" class="tbl-cell" font-weight="700" fill="#1e40af">Recommended Tiered Architecture:</text>
    <text x="35" y="232" class="tbl-cell" fill="#1e3a8a">1. Cold Startup: Precompute full compiler-grade SCIP index once.</text>
    <text x="35" y="250" class="tbl-cell" fill="#1e3a8a">2. Interactive Loop: Apply incremental Tree-sitter patches over modified files.</text>
    <text x="35" y="264" class="tbl-cell" fill="#1e3a8a">Prevents blocking agent execution on expensive whole-program rebuilds.</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="385" width="1040" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="409" class="card-text" font-weight="700" fill="#0f172a">Ingestion Invariant:</text>
  <text x="160" y="409" class="card-text">Never block the interactive agent loop on whole-program compiler passes. Maintain a baseline</text>
  <text x="160" y="428" class="card-text">semantic index and apply localized, incremental syntactic updates (Tree-sitter) during active file editing.</text>
</svg>