<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .layer-card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 4px; }
      .layer-pill { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .layer-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .node-base { stroke-width: 1.5; }
      .node-lbl { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .step-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .step-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #1e293b; }
      .metric-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #475569; }
      .mono-code { font-family: ui-monospace, monospace; font-size: 9px; fill: #0f172a; }
    </style>

    <!-- Markers -->
    <marker id="arr-edge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arr-hop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-drop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-beam" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LAYER 2: SPARSE HIGHWAY SKIP-GRAPH                                -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="940" height="145" class="layer-card" fill="#f8fafc" stroke="#94a3b8"/>
    
    <!-- Layer Header Pill -->
    <rect x="12" y="10" width="220" height="22" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="18" y="25" class="layer-pill" fill="#0369a1">LAYER 2: SPARSE HIGHWAY</text>
    <text x="245" y="25" class="layer-sub">Skip-graph hops over long coordinate distances (Decay probability P(l) = exp(-l / m_L))</text>

    <!-- 1. EDGES LAYER 2 (Drawn first so nodes sit cleanly on top) -->
    <line x1="200" y1="80" x2="520" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="520" y1="80" x2="840" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Step 1 Traversal: Greedy hop from v_entry (200) to v_1 (520) -->
    <path d="M 220 80 L 500 80" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-hop)"/>

    <!-- 2. NODES LAYER 2 (Opaque fills prevent line-through collisions) -->
    <!-- Node A: Entry Point -->
    <circle cx="200" cy="80" r="18" fill="#eff6ff" stroke="#2563eb" class="node-base" stroke-width="2"/>
    <text x="200" y="80" class="node-lbl" fill="#1e40af">v_0</text>
    <text x="200" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9px" font-weight="700" fill="#1e40af" text-anchor="middle">v_entry (Top Entry)</text>

    <!-- Node B: Layer 2 Candidate (at x=520) -->
    <circle cx="520" cy="80" r="16" fill="#ffffff" stroke="#64748b" class="node-base" stroke-width="1.8"/>
    <text x="520" y="80" class="node-lbl" fill="#334155">v_1</text>

    <!-- Node C: Other Highway Node (at x=840) -->
    <circle cx="840" cy="80" r="16" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="840" y="80" class="node-lbl" fill="#64748b">v_2</text>

    <!-- Query Target Projection q on Layer 2 -->
    <circle cx="750" cy="80" r="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="750" y="80" class="node-lbl" fill="#b45309">q</text>
    <text x="750" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9px" font-weight="700" fill="#b45309" text-anchor="middle">Query Target</text>

    <!-- Step 1 Label Badge -->
    <rect x="305" y="52" width="125" height="20" rx="3" fill="#2563eb"/>
    <text x="367" y="66" class="step-badge" text-anchor="middle">Step 1: Greedy Hop</text>
    <text x="367" y="44" font-family="ui-monospace, monospace" font-size="8.5px" fill="#1e40af" text-anchor="middle">dist(v_1, q) &lt; dist(v_0, q)</text>

    <!-- Local Minimum Detection Note -->
    <rect x="550" y="52" width="145" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="558" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="8.5px" font-weight="700" fill="#0f172a">Local Min in Layer 2:</text>
    <text x="558" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8px" fill="#475569">No neighbor closer to q</text>
  </g>

  <!-- Step 2: Vertical Descent L2 -> L1 (Directly at x=550 from v_1: x=30+520=550) -->
  <line x1="550" y1="165" x2="550" y2="200" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-drop)"/>
  <rect x="562" y="172" width="135" height="20" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="629" y="186" font-family="ui-monospace, monospace" font-size="8.5px" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2: Drop to Layer 1</text>

  <!-- ================================================================= -->
  <!-- LAYER 1: REGIONAL PROXIMITY MESH                                  -->
  <!-- ================================================================= -->
  <g transform="translate(30, 205)">
    <rect width="940" height="160" class="layer-card" fill="#f8fafc" stroke="#94a3b8"/>

    <!-- Layer Header Pill -->
    <rect x="12" y="10" width="220" height="22" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="18" y="25" class="layer-pill" fill="#6d28d9">LAYER 1: REGIONAL MESH</text>
    <text x="245" y="25" class="layer-sub">Greedy descent from prior layer</text>

    <!-- 1. EDGES LAYER 1 (Drawn first) -->
    <line x1="200" y1="85" x2="360" y2="55" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="360" y1="55" x2="520" y2="85" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="200" y1="85" x2="440" y2="120" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="440" y1="120" x2="520" y2="85" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="520" y1="85" x2="680" y2="75" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="680" y1="75" x2="790" y2="125" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="680" y1="75" x2="840" y2="85" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="790" y1="125" x2="840" y2="85" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Step 3 Traversal: Greedy hop from v_1 (520) to v_5 (680) -->
    <path d="M 537 84 L 661 76" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-hop)"/>

    <!-- 2. NODES LAYER 1 (Opaque white/color fills cover background lines) -->
    <!-- Node A (from L2) -->
    <circle cx="200" cy="85" r="14" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="200" y="85" class="node-lbl" fill="#64748b">v_0</text>

    <!-- Intermediate Layer 1 Nodes -->
    <circle cx="360" cy="55" r="13" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="360" y="55" class="node-lbl" fill="#475569">v_3</text>

    <circle cx="440" cy="120" r="13" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="440" y="120" class="node-lbl" fill="#475569">v_4</text>

    <!-- Node B: Current Candidate from L2 (at x=520, y=85) -->
    <circle cx="520" cy="85" r="16" fill="#f5f3ff" stroke="#7c3aed" class="node-base" stroke-width="2"/>
    <text x="520" y="85" class="node-lbl" fill="#5b21b6">v_1</text>
    <text x="520" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="8.5px" font-weight="700" fill="#6d28d9" text-anchor="middle">L1 Entry Point</text>

    <!-- Node v_5: Layer 1 Local Min Candidate (at x=680, y=75) -->
    <circle cx="680" cy="75" r="16" fill="#ffffff" stroke="#64748b" class="node-base" stroke-width="1.8"/>
    <text x="680" y="75" class="node-lbl" fill="#334155">v_5</text>

    <!-- Node C (from L2 at x=840, y=85) -->
    <circle cx="840" cy="85" r="14" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="840" y="85" class="node-lbl" fill="#64748b">v_2</text>

    <circle cx="790" cy="125" r="13" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="790" y="125" class="node-lbl" fill="#475569">v_6</text>

    <!-- Query Target Projection q on Layer 1 -->
    <circle cx="750" cy="85" r="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="750" y="85" class="node-lbl" fill="#b45309">q</text>

    <!-- Step 3 Label Badge -->
    <rect x="550" y="46" width="125" height="20" rx="3" fill="#7c3aed"/>
    <text x="612" y="60" class="step-badge" text-anchor="middle">Step 3: Greedy Hop</text>
    <text x="612" y="38" font-family="ui-monospace, monospace" font-size="8.5px" fill="#6d28d9" text-anchor="middle">dist(v_5, q) &lt; dist(v_1, q)</text>

    <!-- Local Minimum Detection Note L1 -->
    <rect x="705" y="46" width="140" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="713" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="8.5px" font-weight="700" fill="#0f172a">Local Min in Layer 1:</text>
    <text x="713" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="8px" fill="#475569">v_5 is closest to q</text>
  </g>

  <!-- Step 4: Vertical Descent L1 -> L0 (Directly at x=710 from v_5: x=30+680=710) -->
  <line x1="710" y1="365" x2="710" y2="400" stroke="#059669" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-beam)"/>
  <rect x="722" y="372" width="135" height="20" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="789" y="386" font-family="ui-monospace, monospace" font-size="8.5px" font-weight="700" fill="#047857" text-anchor="middle">Step 4: Drop to Layer 0</text>

  <!-- ================================================================= -->
  <!-- LAYER 0: DENSE BASE GRAPH (ALL VECTORS)                           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 405)">
    <rect width="940" height="215" class="layer-card" fill="#f8fafc" stroke="#94a3b8"/>

    <!-- Layer Header Pill -->
    <rect x="12" y="10" width="240" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="18" y="25" class="layer-pill" fill="#047857">LAYER 0: DENSE BASE GRAPH</text>
    <text x="265" y="25" class="layer-sub">All N vectors · beam search (efSearch)</text>

    <!-- 1. EDGES LAYER 0 (Drawn first) -->
    <!-- Background cluster 1 edges -->
    <line x1="120" y1="70" x2="160" y2="120" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="160" y1="120" x2="200" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="200" y1="85" x2="250" y2="60" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="200" y1="85" x2="240" y2="130" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Background cluster 2 edges -->
    <line x1="250" y1="60" x2="360" y2="55" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="360" y1="55" x2="410" y2="95" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="410" y1="95" x2="440" y2="130" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="410" y1="95" x2="520" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="440" y1="130" x2="500" y2="140" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="520" y1="85" x2="580" y2="115" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Active Cluster Interconnect Edges -->
    <line x1="580" y1="115" x2="680" y2="75" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="680" y1="75" x2="655" y2="130" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="655" y1="130" x2="705" y2="150" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="705" y1="150" x2="740" y2="135" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="680" y1="75" x2="790" y2="80" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="790" y1="80" x2="810" y2="120" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="740" y1="135" x2="810" y2="120" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="790" y1="80" x2="840" y2="85" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="810" y1="120" x2="880" y2="130" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="840" y1="85" x2="910" y2="75" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Step 5 Traversal: Beam Search Exploration Paths -->
    <path d="M 696 76 L 772 79" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-beam)"/>
    <path d="M 686 89 L 728 123" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-beam)"/>
    <path d="M 755 133 L 793 124" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-beam)"/>

    <!-- 2. NODES LAYER 0 (Opaque solid fills cover all edge lines) -->
    <!-- Background cluster 1 nodes -->
    <circle cx="120" cy="70" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="160" cy="120" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="200" cy="85" r="12" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="200" y="85" class="node-lbl" fill="#94a3b8">v_0</text>
    <circle cx="250" cy="60" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="240" cy="130" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>

    <!-- Background cluster 2 nodes -->
    <circle cx="360" cy="55" r="11" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="410" cy="95" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="440" cy="130" r="11" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="520" cy="85" r="12" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="520" y="85" class="node-lbl" fill="#94a3b8">v_1</text>
    <circle cx="500" cy="140" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="580" cy="115" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>

    <!-- Active Cluster Nodes -->
    <!-- Entry Candidate from Layer 1 (at x=680, y=75) -->
    <circle cx="680" cy="75" r="16" fill="#ecfdf5" stroke="#059669" class="node-base" stroke-width="2"/>
    <text x="680" y="75" class="node-lbl" fill="#047857">v_5</text>
    <text x="680" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="8.5px" font-weight="700" fill="#047857" text-anchor="middle">L0 Entry Candidate</text>

    <!-- Intermediate Beam Search Candidates -->
    <circle cx="655" cy="130" r="13" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="655" y="130" class="node-lbl" fill="#065f46">u_1</text>

    <circle cx="705" cy="150" r="13" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="705" y="150" class="node-lbl" fill="#065f46">u_2</text>

    <!-- Final Top-K Discovered Nearest Neighbors -->
    <!-- k_1 (Nearest) -->
    <circle cx="790" cy="80" r="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="790" y="80" class="node-lbl" fill="#14532d">k_1</text>
    <line x1="768" y1="88" x2="774" y2="85" stroke="#15803d" stroke-width="1.8" stroke-dasharray="3,2"/>

    <!-- k_2 (Second Nearest) -->
    <circle cx="740" cy="135" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/>
    <text x="740" y="135" class="node-lbl" fill="#14532d">k_2</text>
    <line x1="747" y1="113" x2="743" y2="120" stroke="#15803d" stroke-width="1.8" stroke-dasharray="3,2"/>

    <!-- k_3 (Third Nearest) -->
    <circle cx="810" cy="120" r="15" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/>
    <text x="810" y="120" class="node-lbl" fill="#14532d">k_3</text>
    <line x1="767" y1="102" x2="795" y2="114" stroke="#15803d" stroke-width="1.8" stroke-dasharray="3,2"/>

    <!-- Background nodes in cluster 3 -->
    <circle cx="840" cy="85" r="12" fill="#ffffff" stroke="#94a3b8" class="node-base"/>
    <text x="840" y="85" class="node-lbl" fill="#94a3b8">v_2</text>
    <circle cx="880" cy="130" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>
    <circle cx="910" cy="75" r="10" fill="#ffffff" stroke="#cbd5e1" class="node-base"/>

    <!-- Query Vector q in Layer 0 (Solid fill, covers all background) -->
    <circle cx="750" cy="95" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="750" y="95" class="node-lbl" fill="#b45309">q</text>

    <!-- Dynamic Priority Queue Box (efSearch = 4) on Left -->
    <g transform="translate(18, 50)">
      <rect width="225" height="122" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="225" height="22" rx="3" fill="#ecfdf5"/>
      <text x="10" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9px" font-weight="700" fill="#047857">Dynamic Priority Queue (efSearch=4)</text>
      
      <!-- Queue rows -->
      <text x="10" y="38" class="mono-code">Rank 1: <tspan font-weight="700" fill="#15803d">k_1</tspan> (d = 0.0412)  [Nearest]</text>
      <text x="10" y="55" class="mono-code">Rank 2: <tspan font-weight="700" fill="#15803d">k_2</tspan> (d = 0.0685)</text>
      <text x="10" y="72" class="mono-code">Rank 3: <tspan font-weight="700" fill="#15803d">k_3</tspan> (d = 0.0914)</text>
      <text x="10" y="89" class="mono-code">Rank 4: <tspan fill="#64748b">u_2</tspan> (d = 0.1420)  [Pruned]</text>
      <line x1="10" y1="99" x2="215" y2="99" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="8.5px" fill="#047857" font-weight="700">Returns Top-K (K=3) in O(log N) Time</text>
    </g>

    <!-- Step 5 Label Badge (Cleanly placed with generous padding) -->
    <rect x="580" y="175" width="210" height="24" rx="3" fill="#059669"/>
    <text x="685" y="191" class="step-badge" text-anchor="middle">Step 5: Bounded Beam Search (efSearch)</text>
  </g>
</svg>