<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: DENSE UNBOUNDED KV CACHE                                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="350" height="450" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">DENSE UNBOUNDED KV CACHE (Full Attention)</text>

    <!-- Sub-block 1: Allocation -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="320" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Memory Allocation across Sequence Length N</text>

      <rect x="12" y="28" width="296" height="36" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="160" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">All Tokens Retained in HBM (t=0 to t=N)</text>

      <text x="12" y="78" font-size="8.0" fill="#64748b">t=0 (Initial Prompt)</text>
      <text x="308" y="78" text-anchor="end" font-size="8.0" fill="#64748b">t=N (Current Decode)</text>
    </g>

    <!-- Sub-block 2: Characteristics -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="320" height="235" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <text x="12" y="22" font-size="8.5" font-weight="700" fill="#dc2626">FOOTPRINT</text>
      <text x="120" y="22" font-size="8.5" font-weight="700" fill="#0f172a">O(N) Unbounded Scaling</text>
      <text x="12" y="38" font-size="8.0" font-family="Courier, monospace" fill="#334155">M = 2 · b · L · h_kv · d_head · N bytes</text>
      <text x="12" y="52" font-size="8.0" fill="#64748b">Memory scales linearly with trajectory steps; no ceiling.</text>

      <text x="12" y="80" font-size="8.5" font-weight="700" fill="#dc2626">DECODE INTENSITY</text>
      <text x="120" y="80" font-size="8.5" font-weight="700" fill="#0f172a">Severe Memory-Bound Bottleneck</text>
      <text x="12" y="96" font-size="8.0" fill="#334155">Arithmetic intensity drops below 0.5 FLOP/byte;</text>
      <text x="12" y="110" font-size="8.0" fill="#64748b">memory bandwidth throttles generation rate completely.</text>

      <text x="12" y="138" font-size="8.5" font-weight="700" fill="#dc2626">FAILURE MODE</text>
      <text x="120" y="138" font-size="8.5" font-weight="700" fill="#991b1b">OOM Crash / Quadratic Prefill</text>
      <text x="12" y="154" font-size="8.0" fill="#334155">Context exceeds physical GPU HBM capacity;</text>
      <text x="12" y="168" font-size="8.0" fill="#64748b">prefill latency surges quadratically as O(N²).</text>

      <text x="12" y="196" font-size="8.5" font-weight="700" fill="#dc2626">AGENT IMPACT</text>
      <text x="120" y="196" font-size="8.5" font-weight="700" fill="#0f172a">Trajectory Truncation</text>
      <text x="12" y="212" font-size="8.0" fill="#64748b">Forces premature truncation or catastrophic thrashing.</text>
    </g>

    <!-- Sub-block 3: Bottom Badge -->
    <g transform="translate(15, 388)">
      <rect x="0" y="0" width="320" height="46" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="160" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">EVALUATION: UNFEASIBLE FOR LONG AGENTS</text>
      <text x="160" y="34" text-anchor="middle" font-size="8.0" fill="#7f1d1d">Cannot maintain persistent multi-turn execution loops</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: STREAMINGLLM (ATTENTION SINKS)                          -->
  <!-- ================================================================= -->
  <g transform="translate(425, 75)">
    <rect x="0" y="0" width="350" height="450" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">STREAMINGLLM (Attention Sinks + Window)</text>

    <!-- Sub-block 1: Allocation -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="320" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Sinks (S) + Evicted Gap + Rolling Window (W)</text>

      <!-- Sinks -->
      <rect x="12" y="28" width="55" height="36" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="39" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Sinks</text>
      <text x="39" y="55" text-anchor="middle" font-size="8.0" fill="#6d28d9">S ≈ 4 tokens</text>

      <!-- Evicted gap -->
      <rect x="71" y="28" width="105" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="123" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#94a3b8">Evicted Tokens</text>
      <text x="123" y="55" text-anchor="middle" font-size="8.0" fill="#94a3b8">(Pruned mid-flight)</text>

      <!-- Sliding window -->
      <rect x="180" y="28" width="128" height="36" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="244" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Sliding Window</text>
      <text x="244" y="55" text-anchor="middle" font-size="8.0" fill="#15803d">Recent W=1024 tokens</text>

      <text x="12" y="78" font-size="8.0" fill="#64748b">t=0 (Prompt Start)</text>
      <text x="308" y="78" text-anchor="end" font-size="8.0" fill="#64748b">t=N (Current Token)</text>
    </g>

    <!-- Sub-block 2: Characteristics -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="320" height="235" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <text x="12" y="22" font-size="8.5" font-weight="700" fill="#7c3aed">FOOTPRINT</text>
      <text x="120" y="22" font-size="8.5" font-weight="700" fill="#0f172a">O(S + W) Bounded Footprint</text>
      <text x="12" y="38" font-size="8.0" font-family="Courier, monospace" fill="#334155">M = 2 · b · L · h_kv · d_head · (S + W) bytes</text>
      <text x="12" y="52" font-size="8.0" fill="#64748b">Constant memory footprint across infinite streaming sequences.</text>

      <text x="12" y="80" font-size="8.5" font-weight="700" fill="#7c3aed">SINK PHENOMENON</text>
      <text x="120" y="80" font-size="8.5" font-weight="700" fill="#15803d">Softmax Numerical Stability</text>
      <text x="12" y="96" font-size="8.0" fill="#334155">Initial tokens absorb unnormalized attention mass;</text>
      <text x="12" y="110" font-size="8.0" fill="#64748b">retaining S prevents catastrophic perplexity collapse.</text>

      <text x="12" y="138" font-size="8.5" font-weight="700" fill="#7c3aed">PRIMARY LIMITATION</text>
      <text x="120" y="138" font-size="8.5" font-weight="700" fill="#b45309">Middle Context Amnesia</text>
      <text x="12" y="154" font-size="8.0" fill="#334155">Permanently discards intermediate observations &amp; tool results;</text>
      <text x="12" y="168" font-size="8.0" fill="#64748b">agent loses awareness of prior multi-step trajectory.</text>

      <text x="12" y="196" font-size="8.5" font-weight="700" fill="#7c3aed">REMEDIATION</text>
      <text x="120" y="196" font-size="8.5" font-weight="700" fill="#0f172a">External Episodic Recall</text>
      <text x="12" y="212" font-size="8.0" fill="#64748b">Requires external RAG / WAL store to recover middle context.</text>
    </g>

    <!-- Sub-block 3: Bottom Badge -->
    <g transform="translate(15, 388)">
      <rect x="0" y="0" width="320" height="46" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="160" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">EVALUATION: IDEAL FOR STREAMING LOOPS</text>
      <text x="160" y="34" text-anchor="middle" font-size="8.0" fill="#5b21b6">Prevents collapse but requires secondary recall index</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: H2O / HEAVY-HITTER ORACLE                               -->
  <!-- ================================================================= -->
  <g transform="translate(810, 75)">
    <rect x="0" y="0" width="350" height="450" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="350" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">H2O (Heavy-Hitter Oracle) / FASTGEN</text>

    <!-- Sub-block 1: Allocation -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="320" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Sinks (S) + Sparse Heavy Hitters (H) + Window (W)</text>

      <!-- Sinks -->
      <rect x="12" y="28" width="45" height="36" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="34" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Sinks</text>
      <text x="34" y="55" text-anchor="middle" font-size="8.0" fill="#6d28d9">S ≈ 4</text>

      <!-- Sparse Heavy Hitters -->
      <rect x="61" y="28" width="125" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="71" y="33" width="22" height="26" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="82" y="49" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">H₁</text>
      <rect x="105" y="33" width="22" height="26" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="116" y="49" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">H₂</text>
      <rect x="142" y="33" width="22" height="26" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="153" y="49" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">H₃</text>

      <!-- Sliding window -->
      <rect x="190" y="28" width="118" height="36" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="249" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Sliding Window</text>
      <text x="249" y="55" text-anchor="middle" font-size="8.0" fill="#15803d">Recent tokens</text>

      <text x="12" y="78" font-size="8.0" fill="#64748b">t=0 (Prompt Start)</text>
      <text x="308" y="78" text-anchor="end" font-size="8.0" fill="#64748b">t=N (Current Token)</text>
    </g>

    <!-- Sub-block 2: Characteristics -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="320" height="235" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <text x="12" y="22" font-size="8.5" font-weight="700" fill="#16a34a">FOOTPRINT</text>
      <text x="120" y="22" font-size="8.5" font-weight="700" fill="#0f172a">O(S + H + W) Bounded Budget</text>
      <text x="12" y="38" font-size="8.0" font-family="Courier, monospace" fill="#334155">M = 2 · b · L · h_kv · d_head · (S + H + W) bytes</text>
      <text x="12" y="52" font-size="8.0" fill="#64748b">Retains only ~20% of full KV cache while preserving accuracy.</text>

      <text x="12" y="80" font-size="8.5" font-weight="700" fill="#16a34a">ACCUMULATED SCORE</text>
      <text x="120" y="80" font-size="8.5" font-weight="700" fill="#15803d">Dynamic Attention Tracking</text>
      <text x="12" y="96" font-size="8.0" fill="#334155">Maintains cumulative score s_i = Σ_t α_ti over generation;</text>
      <text x="12" y="110" font-size="8.0" fill="#64748b">dynamically preserves critical symbol &amp; schema definitions.</text>

      <text x="12" y="138" font-size="8.5" font-weight="700" fill="#16a34a">FIDELITY</text>
      <text x="120" y="138" font-size="8.5" font-weight="700" fill="#15803d">High Semantic State Retention</text>
      <text x="12" y="154" font-size="8.0" fill="#334155">Prevents hallucinated variables and structural syntax drift;</text>
      <text x="12" y="168" font-size="8.0" fill="#64748b">retains needle-in-haystack facts across long contexts.</text>

      <text x="12" y="196" font-size="8.5" font-weight="700" fill="#16a34a">BANDWIDTH</text>
      <text x="120" y="196" font-size="8.5" font-weight="700" fill="#0f172a">3×–5× HBM Memory Reduction</text>
      <text x="12" y="212" font-size="8.0" fill="#64748b">Drastically reduces decode memory bandwidth bottleneck.</text>
    </g>

    <!-- Sub-block 3: Bottom Badge -->
    <g transform="translate(15, 388)">
      <rect x="0" y="0" width="320" height="46" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="160" y="20" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">EVALUATION: OPTIMAL FOR AGENTIC REASONING</text>
      <text x="160" y="34" text-anchor="middle" font-size="8.0" fill="#166534">Combines stability, compactness, and high semantic precision</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 540)">
    <rect x="0" y="0" width="1120" height="90" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <rect x="16" y="15" width="120" height="60" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="76" y="42" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">ARCHITECTURAL</text>
    <text x="76" y="56" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">TAKEAWAY</text>

    <text x="154" y="34" font-size="9.5" font-weight="700" fill="#0f172a">Attention Sinks Prevent Perplexity Catastrophe; Heavy Hitters Retain Semantic Grounding</text>
    <text x="154" y="52" font-size="8" fill="#334155">Standard window attention collapses because transformers allocate massive unnormalized attention mass to initial token 0 (the sink).</text>
    <text x="154" y="68" font-size="8" fill="#64748b">Combining sink preservation with dynamic heavy-hitter retention (H2O) delivers 4x KV memory reduction without losing critical state.</text>
  </g>

</g>
</svg>