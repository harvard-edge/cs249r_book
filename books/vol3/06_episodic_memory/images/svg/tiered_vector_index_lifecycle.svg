<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .tier-card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 4px; }
      .tier-pill { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .tier-spec { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; }
      .block-title { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .block-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; fill: #475569; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 8.5px; }
      .flow-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; }
    </style>

    <!-- Markers -->
    <marker id="arr-down-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-down-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-up-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1040" height="640" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- TIER 1: HOT TIER (HOST DRAM & GPU HBM)                            -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="980" height="160" class="tier-card"/>

    <!-- Header Pill -->
    <rect x="12" y="10" width="220" height="22" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="18" y="25" class="tier-pill" fill="#0369a1">HOT TIER: DRAM / HBM</text>
    <text x="245" y="25" class="tier-spec">Latency: 50-100 ns | Bandwidth: 100-400 GB/s | Capacity: 64-512 GB | Volatile Active Working Set</text>

    <!-- Sub-blocks in Hot Tier -->
    <!-- Block 1: Mutable MemTable / Write Buffer -->
    <g transform="translate(15, 42)">
      <rect width="225" height="105" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="225" height="20" rx="3" fill="#e0f2fe"/>
      <text x="8" y="14" class="block-title" fill="#0369a1">Active Ingestion Buffer</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Structure: Concurrent MemTable</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Precision: FP32 uncompressed</text>
      <text x="8" y="60" class="block-sub">Absorbs writes from agent actions</text>
      <text x="8" y="74" class="block-sub">Immediate visibility (zero read lag)</text>
      <rect x="8" y="82" width="209" height="16" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="112" y="93" class="mono-txt" font-weight="700" fill="#0284c7" text-anchor="middle">Volatile In-Memory Log</text>
    </g>

    <!-- Block 2: Coarse Voronoi Centroids -->
    <g transform="translate(255, 42)">
      <rect width="225" height="105" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="225" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" class="block-title">Coarse IVF Centroids</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Count: C = 4,096 cluster keys</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Dimensions: D = 1536 (FP16/FP32)</text>
      <text x="8" y="60" class="block-sub">Memory size: 4096 * 3 KB ≈ 12 MB</text>
      <text x="8" y="74" class="block-sub">Evaluated during coarse probe</text>
      <rect x="8" y="82" width="209" height="16" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="112" y="93" class="mono-txt" fill="#475569" text-anchor="middle">100% DRAM Resident</text>
    </g>

    <!-- Block 3: HNSW Skip Highway Layers -->
    <g transform="translate(495, 42)">
      <rect width="225" height="105" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="225" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" class="block-title">HNSW Top Skip Layers</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Topology: Layer 2 &amp; Layer 1 graphs</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Degree: M = 32 links / node</text>
      <text x="8" y="60" class="block-sub">Sparse highway navigation</text>
      <text x="8" y="74" class="block-sub">Footprint: &lt; 2% of total index</text>
      <rect x="8" y="82" width="209" height="16" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="112" y="93" class="mono-txt" fill="#475569" text-anchor="middle">Fast Entry &amp; Greedy Descent</text>
    </g>

    <!-- Block 4: Query Distance LUT in L1/L2 -->
    <g transform="translate(735, 42)">
      <rect width="230" height="105" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="20" rx="3" fill="#f5f3ff"/>
      <text x="8" y="14" class="block-title" fill="#6d28d9">Query Distance LUT</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Table: 64 sub-vectors * 256 keys</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Cache Size: 16,384 * 4 B = 64 KB</text>
      <text x="8" y="60" class="block-sub">Built once per query in CPU L1/L2</text>
      <text x="8" y="74" class="block-sub">Enables zero-FLOP ADC scans</text>
      <rect x="8" y="82" width="214" height="16" rx="2" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.8"/>
      <text x="115" y="93" class="mono-txt" font-weight="700" fill="#6d28d9" text-anchor="middle">L1 Cache Resident (64 KB)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- VERTICAL FLOW 1: FLUSH & QUANTIZE (HOT -> WARM)                   -->
  <!-- ================================================================= -->
  <g transform="translate(142, 180)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-down-blue)"/>
    <rect x="8" y="8" width="195" height="22" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="15" y="22" class="flow-lbl" fill="#0369a1">Flush: Cluster + PQ Quantize (M=64)</text>
  </g>

  <!-- ================================================================= -->
  <!-- VERTICAL FLOW 2: STREAMING ADC QUERY SCAN (WARM -> HOT)           -->
  <!-- ================================================================= -->
  <g transform="translate(850, 220)">
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#059669" stroke-width="2" marker-end="url(#arr-up-green)"/>
    <rect x="-195" y="-30" width="185" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="-187" y="-16" class="flow-lbl" fill="#047857">Query: Sequential Scan (64 B codes)</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 2: WARM TIER (LOCAL NVMe SSD / BLOCK STORAGE)                -->
  <!-- ================================================================= -->
  <g transform="translate(30, 225)">
    <rect width="980" height="165" class="tier-card"/>

    <!-- Header Pill -->
    <rect x="12" y="10" width="220" height="22" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <text x="18" y="25" class="tier-pill" fill="#b45309">WARM TIER: LOCAL NVMe SSD</text>
    <text x="245" y="25" class="tier-spec">Latency: 10-50 µs | Bandwidth: 5-15 GB/s | Capacity: 1-8 TB | Memory-Mapped High-Density Storage</text>

    <!-- Sub-blocks in Warm Tier -->
    <!-- Block 1: Quantized Vector Postings (IVF-PQ) -->
    <g transform="translate(15, 42)">
      <rect width="360" height="110" rx="3" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
      <rect x="0" y="0" width="360" height="20" rx="3" fill="#dcfce7"/>
      <text x="8" y="14" class="block-title" fill="#14532d">Quantized Vector Postings (IVF-PQ64)</text>
      
      <text x="8" y="32" class="mono-txt" fill="#334155">Record Size: M = 64 bytes per vector (1 byte / sub-vector)</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Uncompressed FP32: 1536 * 4 B = 6,144 Bytes / vector</text>
      <text x="8" y="60" class="mono-txt" font-weight="700" fill="#15803d">Compression Ratio: 6,144 / 64 = 96.0x Storage Reduction</text>
      <text x="8" y="74" class="block-sub">Footprint for 10^7 vectors: 10^7 * 64 B = 640 MB (fits in cache)</text>

      <rect x="8" y="82" width="344" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="180" y="95" class="mono-txt" font-weight="700" fill="#15803d" text-anchor="middle">Physical Layout: Contiguous Block Postings on Flash</text>
    </g>

    <!-- Block 2: Memory-Mapped Base Graph (DiskANN / Layer 0) -->
    <g transform="translate(390, 42)">
      <rect width="280" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="280" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" class="block-title">Base Graph Adjacency (Layer 0)</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">DiskANN / mmap() file backing</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Node ID -&gt; list of M_0 = 64 neighbor IDs</text>
      <text x="8" y="60" class="block-sub">Evaluated during bounded beam search</text>
      <text x="8" y="74" class="block-sub">Page faults serviced in &lt; 20 µs via io_uring</text>
      <rect x="8" y="82" width="264" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="140" y="95" class="mono-txt" fill="#475569" text-anchor="middle">mmap() Zero-Copy Kernel Buffer</text>
    </g>

    <!-- Block 3: In-Memory Tombstone Bitset -->
    <g transform="translate(685, 42)">
      <rect width="280" height="110" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
      <rect x="0" y="0" width="280" height="20" rx="3" fill="#fee2e2"/>
      <text x="8" y="14" class="block-title" fill="#991b1b">Read-Time Invalidation Bitset</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Generation tags for dirty/mutated chunks</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Size: N / 8 bytes = 1.25 MB for 10M chunks</text>
      <text x="8" y="60" class="block-sub">Bitwise AND during ADC postings traversal</text>
      <text x="8" y="74" class="block-sub">Filters stale chunks without rebuilding index</text>
      <rect x="8" y="82" width="264" height="20" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
      <text x="140" y="95" class="mono-txt" font-weight="700" fill="#991b1b" text-anchor="middle">Tombstone Filter: Zero Stale Reads</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- VERTICAL FLOW 3: ARCHIVAL FLUSH (WARM -> COLD)                    -->
  <!-- ================================================================= -->
  <g transform="translate(195, 390)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#d97706" stroke-width="2" marker-end="url(#arr-down-amber)"/>
    <rect x="8" y="8" width="195" height="22" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <text x="15" y="22" class="flow-lbl" fill="#b45309">Archive: Seal Parquet Segments</text>
  </g>

  <!-- ================================================================= -->
  <!-- VERTICAL FLOW 4: RECOVERY / COLD PROMPT HYDRATION (COLD -> HOT)   -->
  <!-- ================================================================= -->
  <g transform="translate(800, 430)">
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#059669" stroke-width="2" marker-end="url(#arr-up-green)"/>
    <rect x="-195" y="-30" width="185" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="-187" y="-16" class="flow-lbl" fill="#047857">Rehydrate: Batch Index Rebuild</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 3: COLD TIER (DISTRIBUTED OBJECT STORAGE / S3 / BLOB)        -->
  <!-- ================================================================= -->
  <g transform="translate(30, 435)">
    <rect width="980" height="185" class="tier-card"/>

    <!-- Header Pill -->
    <rect x="12" y="10" width="220" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="18" y="25" class="tier-pill" fill="#047857">COLD TIER: OBJECT STORAGE</text>
    <text x="245" y="25" class="tier-spec">Latency: 50-200 ms | Bandwidth: Network Gbps | Capacity: Unbounded | Durable Long-Term Storage (S3 / GCS)</text>

    <!-- Sub-blocks in Cold Tier -->
    <!-- Block 1: Immutable Columnar Segments -->
    <g transform="translate(15, 42)">
      <rect width="300" height="130" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="300" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" class="block-title">Immutable Columnar Segments</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Format: Apache Parquet / Arrow Tables</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Content: Postings, token spans, metadata</text>
      <text x="8" y="60" class="block-sub">Written once during background compaction</text>
      <text x="8" y="74" class="block-sub">Highly compressed with zstd/snappy</text>
      <text x="8" y="88" class="block-sub">Read asynchronously on cold restart</text>
      <rect x="8" y="100" width="284" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="150" y="113" class="mono-txt" fill="#475569" text-anchor="middle">Write-Once, Read-Many (WORM)</text>
    </g>

    <!-- Block 2: Raw High-Precision Vector Archives -->
    <g transform="translate(330, 42)">
      <rect width="320" height="130" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="320" height="20" rx="3" fill="#e0f2fe"/>
      <text x="8" y="14" class="block-title" fill="#0369a1">Raw Ground-Truth Vector Archive</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Format: Flat binary FP32 tensor blobs</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Dimensions: Exact D = 1536 uncompressed</text>
      <text x="8" y="60" class="block-sub">Preserves original embeddings without loss</text>
      <text x="8" y="74" class="block-sub">Retrained when new codebooks are calibrated</text>
      <text x="8" y="88" class="block-sub">Guarantees zero cumulative drift over time</text>
      <rect x="8" y="100" width="304" height="20" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="160" y="113" class="mono-txt" font-weight="700" fill="#0284c7" text-anchor="middle">Authoritative Semantic Source of Truth</text>
    </g>

    <!-- Block 3: Monotonic Trajectory Ledgers -->
    <g transform="translate(665, 42)">
      <rect width="300" height="130" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="300" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" class="block-title">Trajectory Ledgers &amp; Checkpoints</text>
      <text x="8" y="32" class="mono-txt" fill="#334155">Format: Append-only JSONL / FlatBuffers</text>
      <text x="8" y="46" class="mono-txt" fill="#334155">Records: Action tuples, tool outputs, diffs</text>
      <text x="8" y="60" class="block-sub">Cryptographic SHA-256 version chaining</text>
      <text x="8" y="74" class="block-sub">Enables deterministic replay &amp; recovery</text>
      <text x="8" y="88" class="block-sub">Offloaded for offline RLVR policy training</text>
      <rect x="8" y="100" width="284" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="150" y="113" class="mono-txt" fill="#475569" text-anchor="middle">Auditable Append-Only History</text>
    </g>
  </g>
</svg>
