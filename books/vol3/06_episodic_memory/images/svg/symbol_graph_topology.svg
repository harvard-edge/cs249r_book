<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" width="100%" height="100%">
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .box-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
      .edge-lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #2563eb; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Left Panel: Lexical Inverted Index -->
  <g transform="translate(15, 10)">
    <rect width="490" height="290" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="488" height="30" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#1e40af">PANEL A: LEXICAL INVERTED INDEX (POSTINGS LISTS)</text>

    <!-- Term 1 -->
    <rect x="16" y="44" width="115" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="64" class="mono" font-weight="700" fill="#0f172a">"connect"</text>
    <path d="M 131 60 L 158 60" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <rect x="162" y="44" width="312" height="32" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="172" y="64" class="mono" fill="#1e40af">Doc 12 (tf=3) -&gt; Doc 85 (tf=1) -&gt; Doc 204</text>

    <!-- Term 2 -->
    <rect x="16" y="86" width="115" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="106" class="mono" font-weight="700" fill="#0f172a">"socket"</text>
    <path d="M 131 102 L 158 102" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <rect x="162" y="86" width="312" height="32" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="172" y="106" class="mono" fill="#1e40af">Doc 12 (tf=1) -&gt; Doc 99 (tf=4) -&gt; Doc 512</text>

    <!-- Term 3 -->
    <rect x="16" y="128" width="115" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="148" class="mono" font-weight="700" fill="#0f172a">"retry"</text>
    <path d="M 131 144 L 158 144" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <rect x="162" y="128" width="312" height="32" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="172" y="148" class="mono" fill="#1e40af">Doc 44 (tf=2) -&gt; Doc 204 (tf=5)</text>

    <!-- Summary Box -->
    <rect x="16" y="174" width="458" height="102" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="194" class="box-hdr">Structural Properties of Lexical Postings:</text>
    <text x="26" y="212" class="box-sub">• Maps isolated terms to flat document identifiers via set intersection.</text>
    <text x="26" y="228" class="box-sub">• Blind to lexical scoping, function boundaries, and class membership.</text>
    <text x="26" y="244" class="box-sub">• Confounds comments, string literals, and active executable identifiers.</text>
    <text x="26" y="260" class="mono" fill="#b91c1c">Limitation: Cannot differentiate declaration from invocation.</text>
  </g>

  <!-- Right Panel: Syntax-Directed Symbol Graph -->
  <g transform="translate(525, 10)">
    <rect width="500" height="290" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="498" height="30" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#6d28d9">PANEL B: SYNTAX-DIRECTED CODE PROPERTY GRAPH (CPG)</text>

    <!-- Node 1: Class Interface -->
    <rect x="20" y="44" width="210" height="48" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="30" y="63" class="box-hdr" fill="#6d28d9">interface TransportClient</text>
    <text x="30" y="79" class="mono" fill="#475569">Scope: net::rpc [lines 10-55]</text>

    <!-- Edge: Implements -->
    <path d="M 230 68 L 290 68" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
    <text x="260" y="61" class="edge-lbl" fill="#7c3aed" text-anchor="middle">IMPLEMENTS</text>

    <!-- Node 2: Concrete Class -->
    <rect x="295" y="44" width="190" height="48" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="305" y="63" class="box-hdr" fill="#1e40af">class TcpClient</text>
    <text x="305" y="79" class="mono" fill="#475569">File: client.cc [lines 24-180]</text>

    <!-- Edge: Defines -->
    <path d="M 390 92 L 390 128" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <text x="424" y="112" class="edge-lbl" text-anchor="middle">DEFINES</text>

    <!-- Node 3: Method connect() -->
    <rect x="275" y="132" width="210" height="52" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="285" y="151" class="box-hdr" fill="#1e40af">connect(addr, timeout_ms)</text>
    <text x="285" y="166" class="mono" fill="#166534">Return: StatusOr&lt;Socket&gt;</text>
    <text x="285" y="178" class="box-sub">Span: lines 45-88 (AST Block)</text>

    <!-- Edge: Calls -->
    <path d="M 275 158 L 205 158" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <text x="238" y="151" class="edge-lbl" text-anchor="middle">CALLS</text>

    <!-- Node 4: Leaf function -->
    <rect x="20" y="132" width="180" height="52" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <text x="30" y="151" class="box-hdr" fill="#15803d">sys_socket_open()</text>
    <text x="30" y="166" class="mono" fill="#475569">File: sys_posix.c</text>
    <text x="30" y="178" class="box-sub">Native OS syscall wrapper</text>

    <!-- Summary Box -->
    <rect x="16" y="196" width="468" height="80" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="214" class="box-hdr" fill="#15803d">Topological Invariants of the Symbol Graph:</text>
    <text x="26" y="232" class="box-sub">• Traverses deterministic edges: DEFINES, CALLS, IMPLEMENTS, READS.</text>
    <text x="26" y="248" class="box-sub">• Preserves exact AST boundary spans, method signatures, and scope fences.</text>
    <text x="26" y="264" class="mono" fill="#047857">Guarantees zero syntactic truncation during context window assembly.</text>
  </g>
</svg>
