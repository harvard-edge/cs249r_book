<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="330" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #0f172a; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arr-cpg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Left: Panel A CPG Traversal -->
  <g transform="translate(15, 12)">
    <rect width="505" height="306" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="503" height="30" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#1e40af">PANEL A: STRUCTURAL MULTI-HOP PATH TRAVERSAL</text>

    <!-- Node 1 -->
    <rect x="25" y="48" width="195" height="46" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="122" y="67" class="box-lbl" fill="#1e3a8a" text-anchor="middle">process_transaction()</text>
    <text x="122" y="83" class="box-sub" text-anchor="middle">File: tx_handler.c</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 220 71 L 285 71" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-cpg)"/>
    <text x="252" y="64" class="mono" font-weight="700" fill="#2563eb" text-anchor="middle">CALLS</text>

    <!-- Node 2 -->
    <rect x="295" y="48" width="185" height="46" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="387" y="67" class="box-lbl" fill="#1e3a8a" text-anchor="middle">validate_signature()</text>
    <text x="387" y="83" class="box-sub" text-anchor="middle">File: sec_crypto.c</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 387 94 L 387 142" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-cpg)"/>
    <text x="422" y="122" class="mono" font-weight="700" fill="#2563eb" text-anchor="middle">READS</text>

    <!-- Node 3 -->
    <rect x="295" y="146" width="185" height="46" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <text x="387" y="165" class="box-lbl" fill="#065f46" text-anchor="middle">HardwareSecModule</text>
    <text x="387" y="181" class="box-sub" text-anchor="middle">Global Struct: hsm_key</text>

    <!-- Arrow 1 to 4 -->
    <path d="M 122 94 L 122 142" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-cpg)"/>
    <text x="157" y="122" class="mono" font-weight="700" fill="#2563eb" text-anchor="middle">MODIFIES</text>

    <!-- Node 4 -->
    <rect x="25" y="146" width="195" height="46" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="122" y="165" class="box-lbl" fill="#b45309" text-anchor="middle">TxLedgerRecord</text>
    <text x="122" y="181" class="box-sub" text-anchor="middle">State Variable: pending_bit</text>

    <!-- Linearized Callpath Box -->
    <rect x="20" y="210" width="465" height="78" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="229" class="box-lbl" fill="#0f172a">Serialized Graph Traversal Context:</text>
    <text x="32" y="247" class="mono" fill="#475569">[PATH] tx_handler.c:process_transaction()</text>
    <text x="32" y="263" class="mono" fill="#2563eb">  -&gt; CALLS sec_crypto.c:validate_signature() -&gt; READS hsm_key</text>
    <text x="32" y="278" class="mono" fill="#b45309">  -&gt; MODIFIES TxLedgerRecord.pending_bit</text>
  </g>

  <!-- Right: Panel B Seeded Neighborhood Expansion -->
  <g transform="translate(540, 12)">
    <rect width="505" height="306" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1" y="1" width="503" height="30" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="16" y="20" class="panel-title" fill="#6d28d9">PANEL B: SEEDED NEIGHBORHOOD EXPANSION &amp; PPR PRUNING</text>

    <!-- Step 1 -->
    <rect x="20" y="48" width="465" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="66" class="box-lbl" fill="#0f172a">Hybrid Seed Selection:</text>
    <text x="32" y="83" class="mono" fill="#6d28d9">V_0 = Top-k_0 by RRF(Q)  [k_0 = 5 initial anchor functions]</text>

    <!-- Arrow down -->
    <path d="M 252 94 L 252 108" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Step 2 -->
    <rect x="20" y="112" width="465" height="58" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="130" class="box-lbl" fill="#0f172a">Topological Expansion Dilemma:</text>
    <text x="32" y="146" class="box-sub" fill="#dc2626">Unconstrained BFS (H=3): 1,310 functions = 235k tokens (28.8x over budget)</text>
    <text x="32" y="161" class="box-sub" fill="#059669">Personalized PageRank · biased walk</text>

    <!-- Arrow down -->
    <path d="M 252 170 L 252 184" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Step 3 -->
    <rect x="20" y="188" width="465" height="100" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="208" class="box-lbl" fill="#065f46">Compact Induced Subgraph G_sub (38 functions):</text>
    <text x="32" y="226" class="mono" fill="#047857">Tokens consumed: 6,840 / 8,192 budget (1,352 tokens headroom)</text>
    <text x="32" y="244" class="box-sub" fill="#065f46">Stationary distribution p = (1 - alpha)s + alpha P^T p with cutoff eps_PPR = 1.2e-3</text>
    <text x="32" y="260" class="box-sub" fill="#047857">Bounded context · full causal chain</text>
  </g>
</svg>