<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL 1: UNMANAGED CONTEXT ACCUMULATION (ANTI-PATTERN)             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="550" height="430" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="550" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">UNMANAGED APPEND-ONLY TRAJECTORY (Anti-Pattern)</text>

    <!-- Chart Block -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="510" height="210" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Context Length Scaling across Steps (Token Accumulation)</text>

      <!-- Axes -->
      <line x1="50" y1="165" x2="470" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="50" y1="35" x2="50" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="470" y="180" font-size="8.0" font-weight="700" fill="#64748b" text-anchor="end">Trajectory Steps (t)</text>
      <text x="45" y="32" font-size="8.0" font-weight="700" fill="#64748b" text-anchor="end">Tokens</text>

      <!-- Grid lines -->
      <line x1="50" y1="130" x2="470" y2="130" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="50" y1="95" x2="470" y2="95" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="50" y1="60" x2="470" y2="60" stroke="#e2e8f0" stroke-width="1"/>
      <text x="42" y="133" font-size="8.0" fill="#64748b" text-anchor="end">32k</text>
      <text x="42" y="98" font-size="8.0" fill="#64748b" text-anchor="end">64k</text>
      <text x="42" y="63" font-size="8.0" fill="#64748b" text-anchor="end">128k</text>

      <!-- Danger Ceiling -->
      <line x1="50" y1="52" x2="470" y2="52" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.2"/>
      <rect x="300" y="40" width="165" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="382" y="52" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">HBM Capacity / TTFT Wall (128k)</text>

      <!-- Growth Curve -->
      <path d="M 50,160 Q 200,152 290,110 T 450,54" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="450" cy="54" r="4" fill="#dc2626"/>

      <!-- Annotations -->
      <rect x="120" y="75" width="145" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="192" y="89" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Tool Output Bloat</text>
      <text x="192" y="101" text-anchor="middle" font-size="8.0" fill="#64748b">+15,000 tokens / grep turn</text>
      <line x1="265" y1="92" x2="305" y2="105" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Symptoms Breakdown -->
    <g transform="translate(20, 255)">
      <rect x="0" y="0" width="510" height="160" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="510" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#991b1b">FAILURE MODES &amp; PERFORMANCE IMPACT</text>

      <text x="12" y="36" font-size="8" font-weight="700" fill="#dc2626">Quadratic Prefill &amp; TTFT Surge:</text>
      <text x="155" y="36" font-size="8" fill="#334155">Attention compute scales as O(L²); prefill latency surges from 120ms to &gt;8.5s.</text>
      <text x="12" y="49" font-size="8.0" fill="#64748b">Prefill GEMM matrix multiplication dominates execution time, exhausting GPU SMs.</text>

      <text x="12" y="72" font-size="8" font-weight="700" fill="#dc2626">Memory Bandwidth Saturation:</text>
      <text x="155" y="72" font-size="8" fill="#334155">Every autoregressive decode step loads multi-GB KV cache from HBM.</text>
      <text x="12" y="85" font-size="8.0" fill="#64748b">Operational intensity drops below 0.2 FLOP/B; decode stalls on HBM3e bandwidth.</text>

      <text x="12" y="108" font-size="8" font-weight="700" fill="#dc2626">"Lost-in-the-Middle" Dispersion:</text>
      <text x="155" y="108" font-size="8" fill="#334155">Softmax dilution &amp; rotary positional decay cause early constraints to blur.</text>
      <text x="12" y="121" font-size="8.0" fill="#64748b">Agent ignores negative constraints and instructions positioned between prompt and end.</text>

      <rect x="12" y="132" width="486" height="20" rx="1" fill="#fee2e2"/>
      <text x="255" y="145" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Result: OOM crash or hallucination cascade after 15–20 autonomous turns</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: MANAGED CONTEXT WORKING SET W(t, Δt)                     -->
  <!-- ================================================================= -->
  <g transform="translate(610, 75)">
    <rect x="0" y="0" width="550" height="430" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="550" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">ACTIVE CONTEXT WORKING SET W(t, Δt) (Architectural Model)</text>

    <!-- Architecture Hierarchy -->
    <g transform="translate(20, 36)">
      <!-- Tier 1: Fixed Anchor -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="510" height="48" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
        <rect x="0" y="0" width="510" height="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#6d28d9">L0 ANCHOR: System Invariants &amp; Tool Contracts (Pinned)</text>
        <text x="8" y="31" font-size="8.0" fill="#334155">Fixed instruction prefix, MCP schemas, security envelope (Zero-eviction policy)</text>
        <text x="8" y="42" font-size="8.0" fill="#64748b">Guarantees safety guardrails, schema validation, and fundamental goals remain intact.</text>
      </g>

      <!-- Tier 2: Dynamic Working Set -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="510" height="106" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
        <rect x="0" y="0" width="510" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#15803d">DYNAMIC WORKING SET WINDOW W(t, Δt) (Bounded Budget ≤ 32k tokens)</text>

        <!-- Sub-block 1: Active Turn -->
        <g transform="translate(10, 26)">
          <rect x="0" y="0" width="155" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="0" y="0" width="155" height="16" fill="#f0fdf4"/>
          <text x="8" y="12" font-size="8.0" font-weight="700" fill="#15803d">Active Turn (t)</text>
          <text x="8" y="30" font-size="8.0" fill="#334155">Immediate observation,</text>
          <text x="8" y="42" font-size="8.0" fill="#334155">active AST repomap,</text>
          <text x="8" y="54" font-size="8.0" fill="#334155">and current git delta</text>
        </g>

        <!-- Sub-block 2: Recent Window -->
        <g transform="translate(177, 26)">
          <rect x="0" y="0" width="155" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="0" y="0" width="155" height="16" fill="#f0fdf4"/>
          <text x="8" y="12" font-size="8.0" font-weight="700" fill="#15803d">Recent Window (Δt)</text>
          <text x="8" y="30" font-size="8.0" fill="#334155">Sliding window across</text>
          <text x="8" y="42" font-size="8.0" fill="#334155">k=4 immediate turns</text>
          <text x="8" y="54" font-size="8.0" fill="#334155">(short-term memory)</text>
        </g>

        <!-- Sub-block 3: Ephemeral CoT -->
        <g transform="translate(345, 26)">
          <rect x="0" y="0" width="155" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="0" y="0" width="155" height="16" fill="#f0fdf4"/>
          <text x="8" y="12" font-size="8.0" font-weight="700" fill="#15803d">Ephemeral CoT</text>
          <text x="8" y="30" font-size="8.0" fill="#334155">Scratchpad tokens</text>
          <text x="8" y="42" font-size="8.0" fill="#334155">pruned immediately</text>
          <text x="8" y="54" font-size="8.0" fill="#334155">post-action execution</text>
        </g>
      </g>

      <!-- Eviction Boundary -->
      <g transform="translate(0, 168)">
        <line x1="10" y1="8" x2="500" y2="8" stroke="#7c3aed" stroke-dasharray="4,4" stroke-width="1.5"/>
        <rect x="175" y="-3" width="160" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="255" y="12" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">EVICTION / COMPACTION GATE</text>
      </g>

      <!-- Tier 3: Off-Context Hierarchy -->
      <g transform="translate(0, 196)">
        <rect x="0" y="0" width="510" height="70" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
        <rect x="0" y="0" width="510" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#b45309">L2 / L3: STRUCTURED COMPACTION &amp; EPISODIC TIER</text>
        <text x="8" y="31" font-size="8.0" fill="#334155">Lossless git diffs, AST symbol summaries, episodic vector index (HNSW / SQLite WAL)</text>
        <text x="8" y="44" font-size="8.0" fill="#78350f">Preserves long-range decision state; prevents hallucination drift across 100+ steps.</text>
        <text x="8" y="56" font-size="8.0" fill="#64748b">Evicted turns flushed to persistent storage; queried on demand via tool search.</text>
      </g>
    </g>

    <!-- Metrics Callout -->
    <g transform="translate(20, 315)">
      <rect x="0" y="0" width="510" height="100" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="510" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">PERFORMANCE INVARIANTS &amp; PRODUCTION BENCHMARKS</text>

      <g transform="translate(0, 24)">
        <text x="85" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">≤ 180 ms</text>
        <text x="85" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Constant TTFT</text>
        <text x="85" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Zero quadratic surge</text>

        <line x1="170" y1="10" x2="170" y2="66" stroke="#86efac" stroke-width="1"/>

        <text x="255" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">O(1) Bounded</text>
        <text x="255" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">KV Cache Memory</text>
        <text x="255" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Fixed HBM footprint</text>

        <line x1="340" y1="10" x2="340" y2="66" stroke="#86efac" stroke-width="1"/>

        <text x="425" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">99.4%</text>
        <text x="425" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Instruction Recall</text>
        <text x="425" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Lossless constraint audit</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="1120" height="95" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <rect x="16" y="18" width="120" height="60" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="76" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">SYSTEMS</text>
    <text x="76" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">INVARIANT</text>

    <text x="154" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Context Window is L1 Cache, Not Durable Storage</text>
    <text x="154" y="54" font-size="8" fill="#334155">Treating context as an unbounded log triggers quadratic prefill penalties and memory bandwidth saturation.</text>
    <text x="154" y="70" font-size="8" fill="#64748b">Long trajectories require active working set management W(t, Δt): discard scratchpads, skeletonize payloads, and compact state.</text>
  </g>

</g>
</svg>