<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- STAGE 1: TRAJECTORY BLOAT (HAZARD)                                -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="240" height="430" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">1. TRAJECTORY BLOAT</text>

    <!-- Item 1 -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="212" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Verbose Tool Output</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Full stdout/stderr dumps,</text>
      <text x="10" y="45" font-size="8.0" fill="#334155">compiler stacktraces (8k+ toks)</text>
      <text x="10" y="60" font-size="8.0" font-weight="700" fill="#dc2626">High noise-to-signal ratio</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(14, 120)">
      <rect x="0" y="0" width="212" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Raw File Payloads</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Entire files dumped into context</text>
      <text x="10" y="45" font-size="8.0" fill="#334155">for minor edits (20k+ toks)</text>
      <text x="10" y="60" font-size="8.0" font-weight="700" fill="#dc2626">Redundant token waste</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(14, 204)">
      <rect x="0" y="0" width="212" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#991b1b">In-Flight CoT Reasoning</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Extended scratchpads,</text>
      <text x="10" y="45" font-size="8.0" fill="#334155">backtracking deliberations</text>
      <text x="10" y="60" font-size="8.0" font-weight="700" fill="#dc2626">Ephemeral utility only</text>
    </g>

    <!-- Compaction Trigger Callout -->
    <g transform="translate(14, 335)">
      <rect x="0" y="0" width="212" height="80" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="106" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">COMPACTION TRIGGER</text>
      <text x="106" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Buffer ≥ 75% Budget</text>
      <text x="106" y="64" text-anchor="middle" font-size="8.0" fill="#7f1d1d">(e.g. 24k / 32k tokens reached)</text>
    </g>
  </g>

  <!-- Connector 1 -->
  <line x1="285" y1="290" x2="323" y2="290" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="304" y="282" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Trigger</text>

  <!-- ================================================================= -->
  <!-- STAGE 2: COMPACTION ENGINES                                       -->
  <!-- ================================================================= -->
  <g transform="translate(330, 75)">
    <rect x="0" y="0" width="280" height="430" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">2. COMPACTION ENGINES</text>

    <!-- Track A: Structural Extractive -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="252" height="175" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="252" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">DETERMINISTIC: Structural Pruning</text>

      <text x="10" y="36" font-size="8" font-weight="700" fill="#0f172a">Head/Tail Slicing</text>
      <text x="10" y="49" font-size="8.0" fill="#334155">Retain 20 head + 20 tail lines + error grep</text>

      <text x="10" y="72" font-size="8" font-weight="700" fill="#0f172a">Tree-Sitter AST Repomap</text>
      <text x="10" y="85" font-size="8.0" fill="#334155">Extract symbol signatures &amp; hierarchy</text>

      <text x="10" y="108" font-size="8" font-weight="700" fill="#0f172a">Git Diff Delta Representation</text>
      <text x="10" y="121" font-size="8.0" fill="#334155">Compact patch hunks replace full file reads</text>

      <rect x="10" y="136" width="232" height="26" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="126" y="152" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">Zero Semantic Paraphrasing Loss</text>
    </g>

    <!-- Track B: State Synthesis -->
    <g transform="translate(14, 222)">
      <rect x="0" y="0" width="252" height="195" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="0" y="0" width="252" height="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#6d28d9">SYNTHESIS: Semantic State Distillation</text>

      <text x="10" y="36" font-size="8" font-weight="700" fill="#0f172a">Step State Distillation</text>
      <text x="10" y="49" font-size="8.0" fill="#334155">Map 10 reasoning turns into 1 state ledger</text>

      <text x="10" y="72" font-size="8" font-weight="700" fill="#0f172a">Ephemeral Scratchpad Eviction</text>
      <text x="10" y="85" font-size="8.0" fill="#334155">Strip internal CoT; commit only (action, obs)</text>

      <text x="10" y="108" font-size="8" font-weight="700" fill="#0f172a">Invariant Enclosure Preservation</text>
      <text x="10" y="121" font-size="8.0" fill="#334155">Lock user goals, constraints, &amp; test suite</text>
      <text x="10" y="134" font-size="8.0" fill="#64748b">criteria against paraphrasing drift</text>

      <rect x="10" y="152" width="232" height="28" rx="1" fill="#ede9fe" stroke="#c084fc" stroke-width="0.8"/>
      <text x="126" y="169" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Structured State Transition Function</text>
    </g>
  </g>

  <!-- Connector 2 -->
  <line x1="615" y1="290" x2="650" y2="290" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="632" y="282" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Distill</text>

  <!-- ================================================================= -->
  <!-- STAGE 3: DRIFT VERIFICATION                                       -->
  <!-- ================================================================= -->
  <g transform="translate(655, 75)">
    <rect x="0" y="0" width="240" height="430" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">3. DRIFT VERIFICATION</text>

    <!-- Check 1 -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="212" height="90" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">Semantic Entropy Check</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Measures cross-entropy loss</text>
      <text x="10" y="45" font-size="8.0" fill="#334155">between original instructions</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">and condensed state summary</text>
      <text x="10" y="76" font-size="8.0" font-weight="700" fill="#d97706">Rejects mutating paraphrases</text>
    </g>

    <!-- Check 2 -->
    <g transform="translate(14, 136)">
      <rect x="0" y="0" width="212" height="90" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">State Consistency Gate</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Verifies file modification</text>
      <text x="10" y="45" font-size="8.0" fill="#334155">ledger against git status</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">and disk filesystem reality</text>
      <text x="10" y="76" font-size="8.0" font-weight="700" fill="#d97706">Prevents hallucinated edits</text>
    </g>

    <!-- Check 3 -->
    <g transform="translate(14, 236)">
      <rect x="0" y="0" width="212" height="100" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8.5" font-weight="700" fill="#b45309">L3 Archival Flush</text>
      <text x="10" y="32" font-size="8.0" fill="#334155">Evicted raw turns flushed</text>
      <text x="10" y="45" font-size="8.0" fill="#334155">to external vector database</text>
      <text x="10" y="58" font-size="8.0" fill="#334155">(HNSW / SQLite episodic log)</text>
      <text x="10" y="76" font-size="8.0" font-weight="700" fill="#15803d">Accessible via tool query</text>
    </g>

    <!-- Bottom Gate Tag -->
    <g transform="translate(14, 348)">
      <rect x="0" y="0" width="212" height="66" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="106" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">VERIFICATION GATE</text>
      <text x="106" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#d97706">Zero Semantic Drift Policy</text>
      <text x="106" y="56" text-anchor="middle" font-size="8.0" fill="#78350f">Rollback on entropy spike</text>
    </g>
  </g>

  <!-- Connector 3 -->
  <line x1="900" y1="290" x2="935" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="917" y="282" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">Validate</text>

  <!-- ================================================================= -->
  <!-- STAGE 4: COMPACTED NEXT-TURN WORKING SET                          -->
  <!-- ================================================================= -->
  <g transform="translate(940, 75)">
    <rect x="0" y="0" width="220" height="430" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">4. COMPACTED WORKING SET</text>

    <!-- Assembled State Layout -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="196" height="44" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Pinned System Anchor</text>
      <text x="98" y="32" text-anchor="middle" font-size="8.0" fill="#6d28d9">Goal, rules &amp; tool schemas</text>

      <rect x="0" y="50" width="196" height="44" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="98" y="68" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Condensed State Ledger</text>
      <text x="98" y="82" text-anchor="middle" font-size="8.0" fill="#b45309">Completed steps &amp; findings</text>

      <rect x="0" y="100" width="196" height="44" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="98" y="118" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Structured Git Diff</text>
      <text x="98" y="132" text-anchor="middle" font-size="8.0" fill="#15803d">Patch hunks of modified files</text>

      <rect x="0" y="150" width="196" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Tree-Sitter Repomap</text>
      <text x="98" y="182" text-anchor="middle" font-size="8.0" fill="#64748b">Active symbol hierarchy</text>

      <rect x="0" y="200" width="196" height="44" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="98" y="218" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">Immediate Turn Window</text>
      <text x="98" y="232" text-anchor="middle" font-size="8.0" fill="#15803d">Active step obs &amp; action</text>
    </g>

    <!-- Metrics Callout -->
    <g transform="translate(12, 290)">
      <rect x="0" y="0" width="196" height="125" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="98" y="24" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">RESULTING METRICS</text>
      <text x="98" y="52" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">78% Reduction</text>
      <text x="98" y="74" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">TTFT &lt; 160ms</text>
      <text x="98" y="90" text-anchor="middle" font-size="8.0" fill="#166534">Zero Hallucination Drift</text>
      <text x="98" y="108" text-anchor="middle" font-size="8.0" fill="#64748b">Bounded context footprint</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="1120" height="95" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <rect x="16" y="18" width="120" height="60" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="76" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">SYSTEMS</text>
    <text x="76" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6d28d9">PRINCIPLE</text>

    <text x="154" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Deterministic Representation Trumps Lossy Paraphrasing</text>
    <text x="154" y="54" font-size="8" fill="#334155">Repeated natural-language summarization causes semantic entropy and hallucination cascades. Production agents preserve code state via</text>
    <text x="154" y="70" font-size="8" fill="#64748b">deterministic git diffs and AST repomaps, reserving lossy summarization strictly for high-level decision rationale.</text>
  </g>

</g>
</svg>