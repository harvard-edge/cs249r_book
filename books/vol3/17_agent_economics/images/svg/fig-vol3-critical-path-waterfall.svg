<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1100" height="560" fill="#ffffff" />

  <!-- TOP PANEL: Waterfall Timeline Decomposition of an Agent Turn -->
  <g transform="translate(24, 20)">
    <rect width="1052" height="240" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1052" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#0f172a" letter-spacing="0.2">TURN CRITICAL-PATH LATENCY WATERFALL: T_turn = 4.25 s (100%)</text>
    <text x="1036" y="21" font-size="9.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Distributed OpenTelemetry Trace Spans</text>

    <!-- Timeline Grid and Ruler -->
    <g transform="translate(260, 48)">
      <!-- Axis Line -->
      <line x1="0" y1="0" x2="765" y2="0" stroke="#94a3b8" stroke-width="1.2" />
      
      <!-- Ticks and Labels: 765 px = 4.25 s -> 180 px per 1.0 s -->
      <line x1="0" y1="-4" x2="0" y2="175" stroke="#e2e8f0" stroke-width="1" />
      <text x="0" y="-8" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">0.0 s</text>

      <line x1="180" y1="-4" x2="180" y2="175" stroke="#e2e8f0" stroke-width="1" />
      <text x="180" y="-8" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">1.0 s</text>

      <line x1="360" y1="-4" x2="360" y2="175" stroke="#e2e8f0" stroke-width="1" />
      <text x="360" y="-8" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">2.0 s</text>

      <line x1="540" y1="-4" x2="540" y2="175" stroke="#e2e8f0" stroke-width="1" />
      <text x="540" y="-8" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">3.0 s</text>

      <line x1="720" y1="-4" x2="720" y2="175" stroke="#e2e8f0" stroke-width="1" />
      <text x="720" y="-8" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">4.0 s</text>

      <line x1="765" y1="-4" x2="765" y2="175" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2" />
      <text x="765" y="-8" font-size="8.5" font-family="'SF Mono', monospace" fill="#dc2626" font-weight="700" text-anchor="middle">4.25 s</text>

      <!-- Row 1: Prompt Prefill (0 to 380 ms -> x=0 to 68.4) -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="68.4" height="26" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
        <text x="34.2" y="16" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#1e40af" text-anchor="middle">380 ms</text>
      </g>

      <!-- Row 2: Autoregressive Decode (380 to 1500 ms -> x=68.4, width=201.6) -->
      <g transform="translate(0, 42)">
        <rect x="68.4" y="0" width="201.6" height="26" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" />
        <text x="169.2" y="16" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#581c87" text-anchor="middle">1,120 ms (48 tokens @ 43 tok/s)</text>
      </g>

      <!-- Row 3: Host Supervisor Mediation (1500 to 1650 ms -> x=270, width=27) -->
      <g transform="translate(0, 74)">
        <rect x="270" y="0" width="27" height="26" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" />
        <text x="303" y="16" font-size="8" font-family="'SF Mono', monospace" font-weight="600" fill="#334155">150 ms</text>
      </g>

      <!-- Row 4: Isolated Sandbox Actuation (1650 to 3600 ms -> x=297, width=351) -->
      <g transform="translate(0, 106)">
        <rect x="297" y="0" width="351" height="26" rx="2" fill="#dcfce7" stroke="#059669" stroke-width="1.2" />
        <text x="472.5" y="16" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#166534" text-anchor="middle">1,950 ms (Pytest execution inside isolated microVM sandbox)</text>
      </g>

      <!-- Row 5: External Network Wait (3600 to 4250 ms -> x=648, width=117) -->
      <g transform="translate(0, 138)">
        <rect x="648" y="0" width="117" height="26" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
        <text x="706.5" y="16" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#92400e" text-anchor="middle">650 ms (Network RPC)</text>
      </g>
    </g>

    <!-- Phase Labels (Left Side) -->
    <g transform="translate(16, 56)">
      <!-- 1. Prefill -->
      <g transform="translate(0, 2)">
        <text x="0" y="10" font-size="9" font-weight="700" fill="#0f172a">Prompt Prefill (T_prefill)</text>
        <text x="0" y="21" font-size="7.5" font-family="'SF Mono', monospace" fill="#2563eb">Reads the context &#183; 8.9%</text>
      </g>
      <!-- 2. Decode -->
      <g transform="translate(0, 34)">
        <text x="0" y="10" font-size="9" font-weight="700" fill="#0f172a">Auto. Decode (T_decode)</text>
        <text x="0" y="21" font-size="7.5" font-family="'SF Mono', monospace" fill="#7c3aed">Emits output tokens &#183; 26.4%</text>
      </g>
      <!-- 3. Supervisor -->
      <g transform="translate(0, 66)">
        <text x="0" y="10" font-size="9" font-weight="700" fill="#0f172a">Supervisor (T_runtime)</text>
        <text x="0" y="21" font-size="7.5" font-family="'SF Mono', monospace" fill="#475569">Parse, validate, log &#183; 3.5%</text>
      </g>
      <!-- 4. Sandbox -->
      <g transform="translate(0, 98)">
        <text x="0" y="10" font-size="9" font-weight="700" fill="#0f172a">Sandbox (T_tool)</text>
        <text x="0" y="21" font-size="7.5" font-family="'SF Mono', monospace" fill="#059669">MicroVM / compiler / tests &#183; 45.9%</text>
      </g>
      <!-- 5. Network -->
      <g transform="translate(0, 130)">
        <text x="0" y="10" font-size="9" font-weight="700" fill="#0f172a">Network Wait (T_wait)</text>
        <text x="0" y="21" font-size="7.5" font-family="'SF Mono', monospace" fill="#d97706">Git fetch &amp; packages &#183; 15.3%</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM PANEL: Amdahl's Law Speedup Curves & Acceleration Asymptotes -->
  <g transform="translate(24, 276)">
    <rect width="1052" height="264" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1052" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#0f172a" letter-spacing="0.2">AMDAHL'S LAW ACCELERATION ASYMPTOTES: S(s) = 1 / [ (1 - f) + f / s ]</text>
    <text x="1036" y="21" font-size="9.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Inference vs. Environment Speedup</text>

    <!-- LEFT: Quantitative Coordinate Plot -->
    <g transform="translate(16, 44)">
      <rect width="580" height="206" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

      <!-- Y Axis: Speedup S from 1.0x (y=180) to 3.0x (y=20) -->
      <line x1="55" y1="180" x2="550" y2="180" stroke="#cbd5e1" stroke-width="1" />
      <line x1="55" y1="140" x2="550" y2="140" stroke="#f1f5f9" stroke-width="1" />
      <line x1="55" y1="100" x2="550" y2="100" stroke="#f1f5f9" stroke-width="1" />
      <line x1="55" y1="60" x2="550" y2="60" stroke="#f1f5f9" stroke-width="1" />
      <line x1="55" y1="20" x2="550" y2="20" stroke="#f1f5f9" stroke-width="1" />

      <!-- Y Labels -->
      <text x="46" y="183" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">1.0&#215;</text>
      <text x="46" y="143" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">1.5&#215;</text>
      <text x="46" y="103" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">2.0&#215;</text>
      <text x="46" y="63" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">2.5&#215;</text>
      <text x="46" y="23" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="end">3.0&#215;</text>

      <!-- X Axis: Subsystem Speedup s from 1.0 (x=55) to 8.0 (x=545) -->
      <line x1="55" y1="180" x2="55" y2="20" stroke="#cbd5e1" stroke-width="1" />
      <line x1="125" y1="180" x2="125" y2="184" stroke="#94a3b8" stroke-width="1" />
      <line x1="195" y1="180" x2="195" y2="184" stroke="#94a3b8" stroke-width="1" />
      <line x1="265" y1="180" x2="265" y2="184" stroke="#94a3b8" stroke-width="1" />
      <line x1="335" y1="180" x2="335" y2="184" stroke="#94a3b8" stroke-width="1" />
      <line x1="405" y1="180" x2="405" y2="184" stroke="#94a3b8" stroke-width="1" />
      <line x1="475" y1="180" x2="475" y2="184" stroke="#94a3b8" stroke-width="1" />
      <line x1="545" y1="180" x2="545" y2="184" stroke="#94a3b8" stroke-width="1" />

      <!-- X Labels -->
      <text x="55" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">1&#215;</text>
      <text x="125" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">2&#215;</text>
      <text x="195" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">3&#215;</text>
      <text x="265" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">4&#215;</text>
      <text x="335" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">5&#215;</text>
      <text x="405" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">6&#215;</text>
      <text x="475" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">7&#215;</text>
      <text x="545" y="195" font-size="8.5" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">8&#215;</text>

      <!-- Curve 2: Environment Acceleration (f_env = 0.647) -->
      <!-- Smooth path calculated exactly through points -->
      <path d="M 55,180.0 C 90,155 120,142 160,129.2 C 200,116 230,108 265,104.6 C 335,94.2 420,85 545,75.6" fill="none" stroke="#059669" stroke-width="2.2" />

      <!-- Environment Asymptote line and label -->
      <line x1="55" y1="33.4" x2="550" y2="33.4" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" />
      <text x="545" y="27" font-size="7.5" font-family="'SF Mono', monospace" fill="#059669" font-weight="700" text-anchor="end">Environment Asymptote: S_max = 2.83&#215; (64.7% Non-Model)</text>

      <!-- Curve 1: Model Inference Acceleration (f_model = 0.353) -->
      <path d="M 55,180.0 C 90,170 125,162.9 195,155.4 C 265,151.2 360,147.5 545,144.3" fill="none" stroke="#7c3aed" stroke-width="2.2" />

      <!-- Model Asymptote line and label -->
      <line x1="55" y1="136.4" x2="550" y2="136.4" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3" />
      <text x="545" y="131" font-size="7.5" font-family="'SF Mono', monospace" fill="#7c3aed" font-weight="700" text-anchor="end">Model Asymptote: S_max = 1.55&#215; (Instant-Model Limit)</text>

      <!-- Point 1: Speculative Decoding (s=2.0 -> S=1.21x) -->
      <circle cx="125" cy="162.9" r="4" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" />
      <text x="125" y="176" font-size="7.5" font-family="'SF Mono', monospace" fill="#581c87" font-weight="700" text-anchor="middle">Speculative: 1.21&#215;</text>

      <!-- Point 2: Sandbox tmpfs & ccache (s=2.5 -> S=1.64x) -->
      <circle cx="160" cy="129.2" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
      <text x="155" y="121" font-size="7.5" font-family="'SF Mono', monospace" fill="#065f46" font-weight="700" text-anchor="end">tmpfs: 1.63&#215;</text>

      <!-- Point 3: Hermetic Snapshotting (s=4.0 -> S=1.94x) -->
      <circle cx="265" cy="104.6" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
      <text x="255" y="96" font-size="7.5" font-family="'SF Mono', monospace" fill="#065f46" font-weight="700" text-anchor="end">MicroVM Snap: 1.94&#215;</text>

      <!-- Labels directly on the curves -->
      <text x="440" y="70" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#059669">S_env(s)</text>
      <text x="440" y="156" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#7c3aed">S_model(s)</text>
    </g>

    <!-- RIGHT: Systems Leverage Ledger -->
    <g transform="translate(612, 44)">
      <!-- Card 1: Model Serving Tier -->
      <g transform="translate(0, 0)">
        <rect width="424" height="98" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <rect width="424" height="20" rx="3" fill="#ede9fe" />
        <text x="10" y="14" font-size="9" font-weight="700" fill="#581c87">MODEL SERVING REGIME (f_model = 35.3%)</text>
        <text x="414" y="14" font-size="8" font-family="'SF Mono', monospace" fill="#581c87" text-anchor="end">T_model = 1.50 s</text>

        <text x="10" y="36" font-size="8.5" fill="#334155">Speculative Decoding (s=2.0×): End-to-end speedup S = 1.21× (17.6% faster)</text>
        <text x="10" y="52" font-size="8.5" fill="#334155">Faster serving tier (s=5.0×): end-to-end S = 1.39× (28.2% faster)</text>
        
        <rect x="10" y="62" width="404" height="26" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8" />
        <text x="16" y="78" font-size="8" font-family="'SF Mono', monospace" fill="#991b1b" font-weight="700">LIMIT: Instant model (s&#8594;&#8734;) yields S_max = 1.55&#215; (2.75 s non-model remains)</text>
      </g>

      <!-- Card 2: Environment & Tool Tier -->
      <g transform="translate(0, 108)">
        <rect width="424" height="98" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <rect width="424" height="20" rx="3" fill="#dcfce7" />
        <text x="10" y="14" font-size="9" font-weight="700" fill="#166534">ENVIRONMENT &amp; TOOL REGIME (f_env = 64.7%)</text>
        <text x="414" y="14" font-size="8" font-family="'SF Mono', monospace" fill="#166534" text-anchor="end">T_env = 2.75 s</text>

        <text x="10" y="36" font-size="8.5" fill="#334155">RAM tmpfs &amp; Test Cache (s=2.5×): End-to-end speedup S = 1.63× (38.8% faster)</text>
        <text x="10" y="52" font-size="8.5" fill="#334155">Hermetic MicroVM Snapshots (s=4.0×): End-to-end speedup S = 1.94× (48.5% faster)</text>
        
        <rect x="10" y="62" width="404" height="26" rx="2" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.8" />
        <text x="16" y="78" font-size="8" font-family="'SF Mono', monospace" fill="#065f46" font-weight="700">2.5× faster tools beat an instant model</text>
      </g>
    </g>
  </g>
</svg>