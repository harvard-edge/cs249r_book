<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1100" height="520" fill="#ffffff" />

  <!-- MAIN CONTAINER CARD -->
  <g transform="translate(20, 20)">
    <rect width="1060" height="480" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="1060" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#0f172a" letter-spacing="0.2">TIERED MODEL ESCALATION CASCADE: EMPIRICAL VERIFICATION GATES</text>
    <text x="1044" y="21" font-size="9.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">FrugalGPT Escalation Protocol</text>

    <!-- TOP SECTION: THE THREE-TIER PIPELINE -->
    <g transform="translate(16, 46)">
      <!-- Ingress Request Box -->
      <g transform="translate(0, 36)">
        <rect width="80" height="100" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
        <rect width="80" height="18" rx="3" fill="#f1f5f9" />
        <text x="40" y="13" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">INGRESS</text>
        <text x="40" y="44" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Task</text>
        <text x="40" y="58" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Request</text>
        <text x="40" y="76" font-size="8" font-family="'SF Mono', monospace" fill="#64748b" text-anchor="middle">x ~ Ingress</text>
        <text x="40" y="90" font-size="7.5" font-family="'SF Mono', monospace" fill="#2563eb" text-anchor="middle">100k tasks</text>
      </g>

      <!-- Arrow Ingress -> Tier 1 -->
      <line x1="80" y1="86" x2="105" y2="86" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)" />

      <!-- ================================================================= -->
      <!-- TIER 1: SMALL / DETERMINISTIC ENGINE (1B - 3B)                     -->
      <!-- ================================================================= -->
      <g transform="translate(108, 0)">
        <rect width="260" height="240" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
        <rect width="260" height="22" rx="3" fill="#f3e8ff" />
        <text x="10" y="15" font-size="9.5" font-weight="700" fill="#581c87">TIER 1: SLM &amp; DETERMINISTIC LINTER</text>
        <text x="250" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#581c87" text-anchor="end">1B&#8211;3B</text>

        <!-- Specs row -->
        <g transform="translate(10, 30)">
          <text x="0" y="10" font-size="8.5" font-weight="600" fill="#334155">Model: 3B SLM / AST Linter</text>
          <text x="0" y="24" font-size="8" font-family="'SF Mono', monospace" fill="#581c87">C_1 = $0.0004 &#183; T_1 = 250 ms</text>
          <text x="0" y="36" font-size="7.5" fill="#64748b">Argument extraction, JSON schema linting</text>
        </g>

        <!-- Verification Gate V1 -->
        <g transform="translate(10, 78)">
          <rect width="240" height="80" rx="2" fill="#faf5ff" stroke="#a855f7" stroke-width="1" />
          <text x="8" y="15" font-size="8.5" font-weight="700" fill="#581c87">Verification Gate V_1 (AST / Schema)</text>
          <text x="8" y="28" font-size="7.5" font-family="'SF Mono', monospace" fill="#64748b">T_V1 = 50 ms &#183; Type checker / linter</text>

          <!-- Decision Branches -->
          <g transform="translate(8, 38)">
            <!-- Pass branch -->
            <rect width="108" height="32" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
            <text x="54" y="13" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">PASS: 60%</text>
            <text x="54" y="25" font-size="7" font-family="'SF Mono', monospace" fill="#15803d" text-anchor="middle">Fast Exit ($0.0004)</text>

            <!-- Fail branch -->
            <g transform="translate(116, 0)">
              <rect width="108" height="32" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8" />
              <text x="54" y="13" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">FAIL: P(fail_1)=40%</text>
              <text x="54" y="25" font-size="7" font-family="'SF Mono', monospace" fill="#dc2626" text-anchor="middle">Escalate to Tier 2</text>
            </g>
          </g>
        </g>

        <!-- Sanitization Context Policy note (Shifted to right half, leaving left clear) -->
        <g transform="translate(82, 168)">
          <rect width="168" height="60" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Context Sanitization:</text>
          <text x="8" y="27" font-size="7.2" fill="#475569">Discards flawed 3B output</text>
          <text x="8" y="39" font-size="7.2" fill="#475569">Retains AST linter trace</text>
          <text x="8" y="51" font-size="7.2" font-family="'SF Mono', monospace" fill="#dc2626">Prevents context poisoning</text>
        </g>
      </g>

      <!-- Escalation Path Tier 1 -> Tier 2 -->
      <line x1="368" y1="134" x2="396" y2="134" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
      <rect x="370" y="118" width="24" height="13" rx="1" fill="#fee2e2" />
      <text x="382" y="128" font-size="7" font-family="'SF Mono', monospace" font-weight="700" fill="#dc2626" text-anchor="middle">40%</text>

      <!-- Fast Exit Path Tier 1 -> Committed Output (Drops cleanly through left corridor at x=150) -->
      <path d="M 150,148 L 150,260 L 968,260" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)" />
      <text x="156" y="254" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">Fast Exit: 60% of tasks ($0.0004 &#183; 300 ms)</text>

      <!-- ================================================================= -->
      <!-- TIER 2: MID-TIER GENERALIST (8B - 14B)                            -->
      <!-- ================================================================= -->
      <g transform="translate(398, 0)">
        <rect width="260" height="240" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
        <rect width="260" height="22" rx="3" fill="#dcfce7" />
        <text x="10" y="15" font-size="9.5" font-weight="700" fill="#166534">TIER 2: MID-TIER GENERALIST</text>
        <text x="250" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#166534" text-anchor="end">8B&#8211;14B</text>

        <!-- Specs row -->
        <g transform="translate(10, 30)">
          <text x="0" y="10" font-size="8.5" font-weight="600" fill="#334155">Model: 14B Generalist (one accelerator)</text>
          <text x="0" y="24" font-size="8" font-family="'SF Mono', monospace" fill="#166534">C_2 = $0.0020 &#183; T_2 = 800 ms</text>
          <text x="0" y="36" font-size="7.5" fill="#64748b">Single-file code editing, tool dispatch</text>
        </g>

        <!-- Verification Gate V2 -->
        <g transform="translate(10, 78)">
          <rect width="240" height="80" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
          <text x="8" y="15" font-size="8.5" font-weight="700" fill="#166534">Verification Gate V_2 (Unit Tests / Build)</text>
          <text x="8" y="28" font-size="7.5" font-family="'SF Mono', monospace" fill="#64748b">T_V2 = 400 ms &#183; Fast test compilation</text>

          <!-- Decision Branches -->
          <g transform="translate(8, 38)">
            <!-- Pass branch -->
            <rect width="108" height="32" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
            <text x="54" y="13" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">PASS: 70% of T2</text>
            <text x="54" y="25" font-size="7" font-family="'SF Mono', monospace" fill="#15803d" text-anchor="middle">28% Total Exit ($0.0024)</text>

            <!-- Fail branch -->
            <g transform="translate(116, 0)">
              <rect width="108" height="32" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8" />
              <text x="54" y="13" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">FAIL: P(fail_2|f_1)=30%</text>
              <text x="54" y="25" font-size="7" font-family="'SF Mono', monospace" fill="#dc2626" text-anchor="middle">12% Joint Escalation</text>
            </g>
          </g>
        </g>

        <!-- Sanitization Context Policy note (Shifted to right half) -->
        <g transform="translate(82, 168)">
          <rect width="168" height="60" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Context Sanitization:</text>
          <text x="8" y="27" font-size="7.2" fill="#475569">Strips failed multi-line code</text>
          <text x="8" y="39" font-size="7.2" fill="#475569">Retains pytest stack trace</text>
          <text x="8" y="51" font-size="7.2" font-family="'SF Mono', monospace" fill="#dc2626">P(f_1, f_2) = 0.12 (12%)</text>
        </g>
      </g>

      <!-- Escalation Path Tier 2 -> Tier 3 -->
      <line x1="658" y1="134" x2="686" y2="134" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
      <rect x="660" y="118" width="24" height="13" rx="1" fill="#fee2e2" />
      <text x="672" y="128" font-size="7" font-family="'SF Mono', monospace" font-weight="700" fill="#dc2626" text-anchor="middle">12%</text>

      <!-- Mid Exit Path Tier 2 -> Committed Output (Drops cleanly through left corridor at x=440) -->
      <path d="M 440,148 L 440,275 L 968,275" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)" />
      <text x="446" y="270" font-size="7.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">Mid Exit: 28% of tasks ($0.0024 &#183; 1,500 ms)</text>

      <!-- ================================================================= -->
      <!-- TIER 3: FRONTIER REASONING CORE (70B - 405B)                      -->
      <!-- ================================================================= -->
      <g transform="translate(688, 0)">
        <rect width="260" height="240" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
        <rect width="260" height="22" rx="3" fill="#fef3c7" />
        <text x="10" y="15" font-size="9.5" font-weight="700" fill="#92400e">TIER 3: FRONTIER MODEL</text>
        <text x="250" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#92400e" text-anchor="end">&#8805; 70B / MoE</text>

        <!-- Specs row -->
        <g transform="translate(10, 30)">
          <text x="0" y="10" font-size="8.5" font-weight="600" fill="#334155">Model: Frontier Reasoning Engine</text>
          <text x="0" y="24" font-size="8" font-family="'SF Mono', monospace" fill="#92400e">C_3 = $0.0600 &#183; T_3 = 4,500 ms</text>
          <text x="0" y="36" font-size="7.5" fill="#64748b">Cross-file refactoring, distributed bugs</text>
        </g>

        <!-- Verification Gate V3 -->
        <g transform="translate(10, 78)">
          <rect width="240" height="80" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
          <text x="8" y="15" font-size="8.5" font-weight="700" fill="#92400e">Verification Gate V_3 (Integration Oracle)</text>
          <text x="8" y="28" font-size="7.5" font-family="'SF Mono', monospace" fill="#64748b">Full regression test suite &amp; invariant diffs</text>

          <!-- Decision Branches -->
          <g transform="translate(8, 38)">
            <!-- Pass branch -->
            <rect width="108" height="32" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
            <text x="54" y="13" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">PASS: 95% of T3</text>
            <text x="54" y="25" font-size="7" font-family="'SF Mono', monospace" fill="#15803d" text-anchor="middle">11.4% Total Exit</text>

            <!-- Fail branch -->
            <g transform="translate(116, 0)">
              <rect width="108" height="32" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8" />
              <text x="54" y="13" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">FAIL: 5% of T3</text>
              <text x="54" y="25" font-size="7" font-family="'SF Mono', monospace" fill="#dc2626" text-anchor="middle">0.6% Terminal Trap</text>
            </g>
          </g>
        </g>

        <!-- Terminal Verification note -->
        <g transform="translate(10, 168)">
          <rect width="240" height="60" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
          <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Terminal Verification Barrier:</text>
          <text x="8" y="27" font-size="7.2" fill="#475569">Reached by only 12% of total tasks</text>
          <text x="8" y="39" font-size="7.2" fill="#475569">Unresolved 0.6% returns FAILED</text>
          <text x="8" y="51" font-size="7.2" font-family="'SF Mono', monospace" fill="#991b1b">Escalates to Human Operator Triage</text>
        </g>
      </g>

      <!-- Exit Path Tier 3 -> Committed Output (Right) -->
      <path d="M 948,134 L 968,134" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)" />

      <!-- Terminal Committed Output Box -->
      <g transform="translate(972, 110)">
        <rect width="84" height="180" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" />
        <rect width="84" height="22" rx="3" fill="#dcfce7" />
        <text x="42" y="15" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">COMMIT</text>
        
        <text x="42" y="50" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Verified</text>
        <text x="42" y="64" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Output y*</text>
        <text x="42" y="82" font-size="7.5" font-family="'SF Mono', monospace" fill="#15803d" text-anchor="middle">99.4%</text>
        <text x="42" y="94" font-size="7.5" font-family="'SF Mono', monospace" fill="#15803d" text-anchor="middle">Resolved</text>

        <line x1="8" y1="104" x2="76" y2="104" stroke="#bbf7d0" stroke-width="1" />

        <text x="42" y="122" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">Resolution:</text>
        <text x="42" y="136" font-size="7" font-family="'SF Mono', monospace" fill="#581c87" text-anchor="middle">T1: 60.0%</text>
        <text x="42" y="148" font-size="7" font-family="'SF Mono', monospace" fill="#059669" text-anchor="middle">T2: 28.0%</text>
        <text x="42" y="160" font-size="7" font-family="'SF Mono', monospace" fill="#d97706" text-anchor="middle">T3: 11.4%</text>
        <text x="42" y="172" font-size="7" font-family="'SF Mono', monospace" fill="#dc2626" text-anchor="middle">Trap: 0.6%</text>
      </g>
    </g>

    <!-- BOTTOM PANEL: SYSTEMS ECONOMICS & LATENCY WATERFALL LEDGER -->
    <g transform="translate(16, 350)">
      <rect width="1028" height="114" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect width="1028" height="22" rx="3" fill="#f1f5f9" />
      <text x="12" y="15" font-size="9.5" font-weight="700" fill="#0f172a">SYSTEMS ECONOMIC LEDGER: MONOLITHIC FRONTIER VS. 3-TIER ESCALATION CASCADE (100k TASKS/DAY)</text>
      <text x="1016" y="15" font-size="8.5" font-family="'SF Mono', monospace" fill="#475569" text-anchor="end">Worked-Example Reconciliation</text>

      <!-- 4 Columns -->
      <g transform="translate(12, 30)">
        <!-- Col 1: Formula & Tiers -->
        <g transform="translate(0, 0)">
          <text x="0" y="12" font-size="8.5" font-weight="700" fill="#1e40af">EXPECTED CASCADE EQUATION</text>
          <text x="0" y="26" font-size="8" font-family="'SF Mono', monospace" fill="#334155">E[C] = C_1 + P(f_1)&#183;C_2 + P(f_1,f_2)&#183;C_3</text>
          <text x="0" y="40" font-size="8" font-family="'SF Mono', monospace" fill="#334155">E[C] = $0.0004 + 0.40($0.002) + 0.12($0.060)</text>
          <text x="0" y="54" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">E[C_cascade] = $0.0084 per task</text>
          <text x="0" y="68" font-size="7.5" fill="#64748b">Cumulative 88% resolved before Tier 3</text>
        </g>
        <line x1="250" y1="4" x2="250" y2="76" stroke="#e2e8f0" stroke-width="1" />

        <!-- Col 2: Monolithic Baseline -->
        <g transform="translate(262, 0)">
          <text x="0" y="12" font-size="8.5" font-weight="700" fill="#991b1b">MONOLITHIC FRONTIER BASELINE</text>
          <text x="0" y="26" font-size="8" fill="#475569">Direct route to frontier model (100% of tasks):</text>
          <text x="0" y="40" font-size="8" font-family="'SF Mono', monospace" fill="#991b1b">C_mono = $0.0600 per task ($60.00 / 1k tasks)</text>
          <text x="0" y="54" font-size="8" font-family="'SF Mono', monospace" fill="#991b1b">Daily spend: $6,000.00 / day ($2.19M / year)</text>
          <text x="0" y="68" font-size="7.5" fill="#64748b">Mean Latency: T_mono = 4.50 s (All tasks)</text>
        </g>
        <line x1="504" y1="4" x2="504" y2="76" stroke="#e2e8f0" stroke-width="1" />

        <!-- Col 3: Cascade Results -->
        <g transform="translate(516, 0)">
          <text x="0" y="12" font-size="8.5" font-weight="700" fill="#166534">3-TIER ESCALATION CASCADE</text>
          <text x="0" y="26" font-size="8" fill="#475569">Tiered dispatch with deterministic validation:</text>
          <text x="0" y="40" font-size="8" font-family="'SF Mono', monospace" fill="#166534">E[C] = $0.0084 per task ($8.40 / 1k tasks)</text>
          <text x="0" y="54" font-size="8" font-family="'SF Mono', monospace" fill="#166534">Daily spend: $840.00 / day ($306.6k / year)</text>
          <text x="0" y="68" font-size="8" font-weight="700" fill="#166534">&#8594; Net Savings: $5,160.00 / day (86.0% reduction)</text>
        </g>
        <line x1="756" y1="4" x2="756" y2="76" stroke="#e2e8f0" stroke-width="1" />

        <!-- Col 4: Latency Trade-Off -->
        <g transform="translate(768, 0)">
          <text x="0" y="12" font-size="8.5" font-weight="700" fill="#581c87">LATENCY TRADE-OFF DYNAMICS</text>
          <text x="0" y="26" font-size="8" font-family="'SF Mono', monospace" fill="#581c87">E[T] = 300ms + 0.40(1200ms) + 0.12(4500ms)</text>
          <text x="0" y="40" font-size="8" font-family="'SF Mono', monospace" font-weight="700" fill="#581c87">E[T_cascade] = 1,320 ms = 1.32 s</text>
          <text x="0" y="54" font-size="8" fill="#166534">&#8594; Average Latency: 3.4&#215; faster than baseline</text>
          <text x="0" y="68" font-size="7.5" fill="#dc2626">Tail Latency (12% escalated): T_worst = 6.00 s</text>
        </g>
      </g>
    </g>
  </g>
</svg>
