<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #E9D5FF; }
      .sec-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.35; }
      .token-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
      .arrow { stroke: #64748B; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-purple { stroke: #7E22CE; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="grad-head3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#64748B" />
    </marker>
    <marker id="arr-p3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#7E22CE" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="18" width="910" height="44" rx="6" fill="url(#grad-head3)" />
  <text x="42" y="45" class="banner-title">Parameter-Efficient Fine-Tuning (PEFT) &amp; Multi-Tenant Adapter Swapping</text>
  <text x="590" y="45" class="banner-sub">Low-Rank Adaptation Architecture for Agent Runtimes</text>

  <!-- Left Column: Low-Rank Adaptation Linear Algebra (LoRA / QLoRA) -->
  <g transform="translate(25, 75)">
    <rect width="455" height="325" rx="8" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5" />
    <rect width="455" height="28" rx="8" fill="#FAF5FF" />
    <rect y="20" width="455" height="8" fill="#FAF5FF" />
    <text x="16" y="19" class="sec-title" fill="#581C87">1. Parameter Decomposition: W = W_0 + (α/r)·(B · A)</text>

    <!-- Visual Architecture Diagram -->
    <g transform="translate(20, 36)">
      <!-- Input Vector x -->
      <rect x="180" y="0" width="70" height="26" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="215" y="17" class="token-text" font-weight="700" fill="#334155" text-anchor="middle">Input x</text>

      <!-- Fork Arrows -->
      <path d="M 195 26 L 110 58" class="arrow" marker-end="url(#arr3)" />
      <path d="M 235 26 L 320 58" class="arrow-purple" marker-end="url(#arr-p3)" />

      <!-- Left Branch: Frozen Base Weights W_0 -->
      <g transform="translate(20, 62)">
        <rect width="175" height="135" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
        <rect x="0" y="0" width="175" height="24" rx="6" fill="#E2E8F0" />
        <text x="87" y="16" class="label-text" fill="#334155" text-anchor="middle">Frozen Base Model W_0</text>
        <text x="14" y="46" class="sub-text" style="font-weight: 600;">Dimension: d × k</text>
        <text x="14" y="66" class="sub-text">Quantization: NF4 (4-bit)</text>
        <text x="14" y="86" class="sub-text">Memory: ~16 GB (70B model)</text>
        <text x="14" y="106" class="sub-text">Parameters: 70 Billion</text>
        <text x="14" y="124" class="sub-text" style="color: #DC2626; font-weight: 700;">Gradients: FROZEN (0)</text>
      </g>

      <!-- Right Branch: Low-Rank Adapter Matrices A & B -->
      <g transform="translate(225, 62)">
        <rect width="190" height="135" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" />
        <rect x="0" y="0" width="190" height="24" rx="6" fill="#EDE9FE" />
        <text x="95" y="16" class="label-text" fill="#581C87" text-anchor="middle">Trainable LoRA Adapters</text>
        
        <!-- Matrix A -->
        <rect x="12" y="32" width="166" height="42" rx="4" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.25" />
        <text x="95" y="49" class="label-text" fill="#6B21A8" text-anchor="middle">Matrix A (Down-Proj)</text>
        <text x="95" y="64" class="sub-text" fill="#7E22CE" text-anchor="middle">Dim: r × k | Rank r ≪ min(d,k)</text>

        <!-- Matrix B -->
        <rect x="12" y="80" width="166" height="42" rx="4" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.25" />
        <text x="95" y="97" class="label-text" fill="#6B21A8" text-anchor="middle">Matrix B (Up-Proj)</text>
        <text x="95" y="112" class="sub-text" fill="#7E22CE" text-anchor="middle">Dim: d × r | Init: Zero</text>
      </g>

      <!-- Join Arrows -->
      <path d="M 105 197 L 195 230" class="arrow" marker-end="url(#arr3)" />
      <path d="M 320 197 L 235 230" class="arrow-purple" marker-end="url(#arr-p3)" />

      <!-- Addition Circle (+) -->
      <circle cx="215" cy="236" r="14" fill="#581C87" />
      <text x="215" y="242" style="font-family: system-ui; font-size: 17px; font-weight: 700; fill: #FFFFFF;" text-anchor="middle">+</text>

      <!-- Downward Arrow to Output -->
      <path d="M 215 250 L 215 264" class="arrow-purple" marker-end="url(#arr-p3)" />

      <!-- Output Vector h -->
      <rect x="115" y="266" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <text x="215" y="284" class="token-text" font-weight="700" fill="#065F46" text-anchor="middle">Output: h = W_0·x + ΔW·x</text>
    </g>
  </g>

  <!-- Right Column: Multi-Tenant Agent Serving & Dynamic Swapping -->
  <g transform="translate(495, 75)">
    <rect width="440" height="325" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <rect width="440" height="28" rx="8" fill="#EFF6FF" />
    <rect y="20" width="440" height="8" fill="#EFF6FF" />
    <text x="16" y="19" class="sec-title" fill="#1D4ED8">2. Multi-Tenant Agent Runtime (S-LoRA / Punica)</text>

    <!-- Runtime Architecture Visual -->
    <g transform="translate(16, 38)">
      <!-- Base Model GPU Memory Block -->
      <rect width="408" height="58" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1" />
      <text x="14" y="20" class="label-text" fill="#1E293B">Shared GPU VRAM Pool</text>
      <text x="14" y="36" class="sub-text">1× Frozen 70B Quantized Foundation Model (NF4)</text>
      <text x="14" y="50" class="sub-text">Shared PagedAttention Key-Value Cache &amp; System Prefix Memory</text>
      <rect x="295" y="10" width="100" height="22" rx="4" fill="#E2E8F0" />
      <text x="345" y="25" class="token-text" font-weight="700" fill="#334155" text-anchor="middle">Static Footprint</text>

      <!-- Dynamic Adapter Slot Stack -->
      <g transform="translate(0, 70)">
        <text x="0" y="16" class="label-text" fill="#1E1B4B">Active Agent Adapters (Dispatched per ACB):</text>

        <!-- Adapter A: Bash Agent -->
        <g transform="translate(0, 24)">
          <rect width="408" height="38" rx="5" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.25" />
          <text x="14" y="18" class="label-text" fill="#6B21A8">Adapter α: Bash / Terminal Specialist</text>
          <text x="14" y="30" class="sub-text">Fine-tuned on shell syntax, AST diffs, error recovery</text>
          <rect x="330" y="8" width="65" height="20" rx="3" fill="#EDE9FE" />
          <text x="362" y="22" class="token-text" fill="#581C87" text-anchor="middle">Rank r=16</text>
        </g>

        <!-- Adapter B: SQL Agent -->
        <g transform="translate(0, 68)">
          <rect width="408" height="38" rx="5" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.25" />
          <text x="14" y="18" class="label-text" fill="#15803D">Adapter β: Database / SQL Specialist</text>
          <text x="14" y="30" class="sub-text">Fine-tuned on PostgreSQL schemas, join optimization</text>
          <rect x="330" y="8" width="65" height="20" rx="3" fill="#DCFCE7" />
          <text x="362" y="22" class="token-text" fill="#15803D" text-anchor="middle">Rank r=16</text>
        </g>

        <!-- Adapter C: Web Browser Agent -->
        <g transform="translate(0, 112)">
          <rect width="408" height="38" rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.25" />
          <text x="14" y="18" class="label-text" fill="#1D4ED8">Adapter γ: Web Navigation / DOM Specialist</text>
          <text x="14" y="30" class="sub-text">Fine-tuned on accessibility trees, click/input events</text>
          <rect x="330" y="8" width="65" height="20" rx="3" fill="#DBEAFE" />
          <text x="362" y="22" class="token-text" fill="#1E40AF" text-anchor="middle">Rank r=32</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(25, 415)">
    <rect width="910" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="16" y="24" class="sec-title" fill="#1E1B4B">Systems Trade-off: Full Fine-Tuning vs. Multi-Adapter Routing</text>
    <text x="16" y="46" class="sub-text" fill="#334155">
      While full-parameter fine-tuning achieves peak domain plasticity, serving N separate 70B models requires N × 140 GB of GPU HBM.
    </text>
    <text x="16" y="62" class="sub-text" fill="#334155">
      PEFT with LoRA/QLoRA reduces the per-agent parameter delta to &lt;0.2% (&lt;50 MB), enabling a single GPU cluster to serve thousands
    </text>
    <text x="16" y="78" class="sub-text" fill="#334155">
      of specialized agent behaviors via instantaneous batch tensor scattering (Punica batched GEMM) with zero base model reload penalty.
    </text>
  </g>
</svg>
