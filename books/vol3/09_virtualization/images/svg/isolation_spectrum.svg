<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: LINUX CONTAINERS                                        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="168" height="384" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect width="168" height="28" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="84" y="14" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Linux Containers</text>
    <text x="84" y="24" font-size="7.5" fill="#b91c1c" text-anchor="middle">Docker / cgroups / OCI</text>

    <!-- Boundary Badge -->
    <rect x="8" y="33" width="152" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="84" y="45" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Boundary: Process-Level</text>

    <!-- Section: Kernel Isolation -->
    <text x="8" y="66" font-size="7" font-weight="700" fill="#64748b">KERNEL ISOLATION</text>
    <text x="8" y="78" font-size="8.5" font-weight="700" fill="#991b1b">Shared Host Kernel</text>
    <text x="8" y="89" font-size="7" fill="#475569">450+ syscalls exposed to app</text>
    <line x1="8" y1="96" x2="160" y2="96" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Cold Boot Latency -->
    <text x="8" y="110" font-size="7" font-weight="700" fill="#64748b">COLD BOOT LATENCY</text>
    <text x="8" y="124" font-size="10" font-weight="700" fill="#0f172a">150 – 400 ms</text>
    <line x1="8" y1="132" x2="160" y2="132" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Memory Base -->
    <text x="8" y="146" font-size="7" font-weight="700" fill="#64748b">MEMORY BASE</text>
    <text x="8" y="160" font-size="10" font-weight="700" fill="#0f172a">~15 – 35 MB</text>
    <line x1="8" y1="168" x2="160" y2="168" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Escape Risks -->
    <text x="8" y="182" font-size="7" font-weight="700" fill="#64748b">ESCAPE RISKS</text>
    <rect x="8" y="188" width="152" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="12" y="201" font-size="7" fill="#991b1b">• Kernel priv esc (Dirty COW)</text>
    <text x="12" y="213" font-size="7" fill="#991b1b">• Misconfigured /proc leaks</text>
    <text x="12" y="225" font-size="7" fill="#991b1b">• CAP_SYS_ADMIN breakouts</text>
    <text x="12" y="237" font-size="7" fill="#991b1b">• Shared network stack leak</text>

    <!-- Section: Agent Applicability -->
    <text x="8" y="274" font-size="7" font-weight="700" fill="#64748b">AGENT APPLICABILITY</text>
    <rect x="8" y="280" width="152" height="94" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
    <circle cx="18" cy="294" r="3.5" fill="#dc2626"/>
    <text x="26" y="297" font-size="8" font-weight="700" fill="#991b1b">Unsafe for Agents</text>
    <text x="12" y="312" font-size="7.2" fill="#7f1d1d">Shared host kernel makes</text>
    <text x="12" y="324" font-size="7.2" fill="#7f1d1d">escape inevitable across</text>
    <text x="12" y="336" font-size="7.2" fill="#7f1d1d">high-frequency autonomous</text>
    <text x="12" y="348" font-size="7.2" fill="#7f1d1d">untrusted execution loops.</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: GVISOR                                                  -->
  <!-- ================================================================= -->
  <g transform="translate(218, 74)">
    <rect width="168" height="384" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect width="168" height="28" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="84" y="14" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">gVisor (Sentry)</text>
    <text x="84" y="24" font-size="7.5" fill="#b45309" text-anchor="middle">Userspace Kernel Sandbox</text>

    <!-- Boundary Badge -->
    <rect x="8" y="33" width="152" height="18" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <text x="84" y="45" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Boundary: Userspace Filter</text>

    <!-- Section: Kernel Isolation -->
    <text x="8" y="66" font-size="7" font-weight="700" fill="#64748b">KERNEL ISOLATION</text>
    <text x="8" y="78" font-size="8.5" font-weight="700" fill="#b45309">Sentry Intercepts Syscalls</text>
    <text x="8" y="89" font-size="7" fill="#475569">Implements Linux ABI in Go</text>
    <line x1="8" y1="96" x2="160" y2="96" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Cold Boot Latency -->
    <text x="8" y="110" font-size="7" font-weight="700" fill="#64748b">COLD BOOT LATENCY</text>
    <text x="8" y="124" font-size="10" font-weight="700" fill="#0f172a">120 – 250 ms</text>
    <line x1="8" y1="132" x2="160" y2="132" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Memory Base -->
    <text x="8" y="146" font-size="7" font-weight="700" fill="#64748b">MEMORY BASE</text>
    <text x="8" y="160" font-size="10" font-weight="700" fill="#0f172a">~25 – 45 MB</text>
    <line x1="8" y1="168" x2="160" y2="168" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Escape Risks -->
    <text x="8" y="182" font-size="7" font-weight="700" fill="#64748b">ESCAPE RISKS</text>
    <rect x="8" y="188" width="152" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="12" y="201" font-size="7" fill="#b45309">• Sentry ABI translation bugs</text>
    <text x="12" y="213" font-size="7" fill="#b45309">• Gofer file proxy bypasses</text>
    <text x="12" y="225" font-size="7" fill="#b45309">• 15–35% I/O syscall overhead</text>
    <text x="12" y="237" font-size="7" fill="#b45309">• Partial Linux syscall coverage</text>

    <!-- Section: Agent Applicability -->
    <text x="8" y="274" font-size="7" font-weight="700" fill="#64748b">AGENT APPLICABILITY</text>
    <rect x="8" y="280" width="152" height="94" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <circle cx="18" cy="294" r="3.5" fill="#d97706"/>
    <text x="26" y="297" font-size="8" font-weight="700" fill="#b45309">Moderate Protection</text>
    <text x="12" y="312" font-size="7.2" fill="#78350f">Good for compute batch runs;</text>
    <text x="12" y="324" font-size="7.2" fill="#78350f">suffers latency degradation</text>
    <text x="12" y="336" font-size="7.2" fill="#78350f">on intensive git checkouts,</text>
    <text x="12" y="348" font-size="7.2" fill="#78350f">compilers, and file I/O.</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: WEBASSEMBLY (WASM)                                      -->
  <!-- ================================================================= -->
  <g transform="translate(396, 74)">
    <rect width="168" height="384" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect width="168" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="84" y="14" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">WebAssembly (Wasm)</text>
    <text x="84" y="24" font-size="7.5" fill="#15803d" text-anchor="middle">WASI / Linear Memory</text>

    <!-- Boundary Badge -->
    <rect x="8" y="33" width="152" height="18" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <text x="84" y="45" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Boundary: Bytecode Sandbox</text>

    <!-- Section: Kernel Isolation -->
    <text x="8" y="66" font-size="7" font-weight="700" fill="#64748b">KERNEL ISOLATION</text>
    <text x="8" y="78" font-size="8.5" font-weight="700" fill="#15803d">No Host Kernel Access</text>
    <text x="8" y="89" font-size="7" fill="#475569">Strict capability-based WASI</text>
    <line x1="8" y1="96" x2="160" y2="96" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Cold Boot Latency -->
    <text x="8" y="110" font-size="7" font-weight="700" fill="#64748b">COLD BOOT LATENCY</text>
    <text x="8" y="124" font-size="10" font-weight="700" fill="#0f172a">&lt; 1 – 5 ms</text>
    <line x1="8" y1="132" x2="160" y2="132" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Memory Base -->
    <text x="8" y="146" font-size="7" font-weight="700" fill="#64748b">MEMORY BASE</text>
    <text x="8" y="160" font-size="10" font-weight="700" fill="#0f172a">~1 – 4 MB</text>
    <line x1="8" y1="168" x2="160" y2="168" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Escape Risks -->
    <text x="8" y="182" font-size="7" font-weight="700" fill="#64748b">ESCAPE RISKS</text>
    <rect x="8" y="188" width="152" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="12" y="201" font-size="7" fill="#15803d">• JIT compiler flaws (V8/Wasm)</text>
    <text x="12" y="213" font-size="7" fill="#15803d">• Host capability/binding leaks</text>
    <text x="12" y="225" font-size="7" fill="#15803d">• Limited POSIX compatibility</text>
    <text x="12" y="237" font-size="7" fill="#15803d">• Cannot run shell, git, apt</text>

    <!-- Section: Agent Applicability -->
    <text x="8" y="274" font-size="7" font-weight="700" fill="#64748b">AGENT APPLICABILITY</text>
    <rect x="8" y="280" width="152" height="94" rx="1" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
    <circle cx="18" cy="294" r="3.5" fill="#16a34a"/>
    <text x="26" y="297" font-size="8" font-weight="700" fill="#15803d">Ideal for Pure Tools</text>
    <text x="12" y="312" font-size="7.2" fill="#14532d">Extremely safe for deterministic</text>
    <text x="12" y="324" font-size="7.2" fill="#14532d">data parsers &amp; plugins; lacks</text>
    <text x="12" y="336" font-size="7.2" fill="#14532d">full Linux OS abstractions</text>
    <text x="12" y="348" font-size="7.2" fill="#14532d">needed for software agents.</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 4: FIRECRACKER MICROVM (GOLDEN STANDARD)                   -->
  <!-- ================================================================= -->
  <g transform="translate(574, 74)">
    <rect width="168" height="384" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <rect width="168" height="28" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="84" y="14" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">Firecracker MicroVM</text>
    <text x="84" y="24" font-size="7.5" fill="#0369a1" text-anchor="middle">KVM Hardware Virtualization</text>

    <!-- Boundary Badge -->
    <rect x="8" y="33" width="152" height="18" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
    <text x="84" y="45" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">Boundary: Hardware (VT-x)</text>

    <!-- Section: Kernel Isolation -->
    <text x="8" y="66" font-size="7" font-weight="700" fill="#64748b">KERNEL ISOLATION</text>
    <text x="8" y="78" font-size="8.5" font-weight="700" fill="#0369a1">Dedicated Guest Linux</text>
    <text x="8" y="89" font-size="7" fill="#475569">VMM exposes only 4 VirtIO devices</text>
    <line x1="8" y1="96" x2="160" y2="96" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Cold Boot Latency -->
    <text x="8" y="110" font-size="7" font-weight="700" fill="#64748b">COLD BOOT LATENCY</text>
    <text x="8" y="124" font-size="10" font-weight="700" fill="#0369a1">5 – 45 ms</text>
    <line x1="8" y1="132" x2="160" y2="132" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Memory Base -->
    <text x="8" y="146" font-size="7" font-weight="700" fill="#64748b">MEMORY BASE</text>
    <text x="8" y="160" font-size="10" font-weight="700" fill="#0369a1">~5 MB</text>
    <line x1="8" y1="168" x2="160" y2="168" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Escape Risks -->
    <text x="8" y="182" font-size="7" font-weight="700" fill="#64748b">ESCAPE RISKS</text>
    <rect x="8" y="188" width="152" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="12" y="201" font-size="7" fill="#0369a1">• Hardware CPU errata (Spectre)</text>
    <text x="12" y="213" font-size="7" fill="#0369a1">• Rust VMM virtio implementation</text>
    <text x="12" y="225" font-size="7" fill="#0369a1">• Jailer seccomp restricts host</text>
    <text x="12" y="237" font-size="7" fill="#0369a1">• Near-zero host attack surface</text>

    <!-- Section: Agent Applicability -->
    <text x="8" y="274" font-size="7" font-weight="700" fill="#64748b">AGENT APPLICABILITY</text>
    <rect x="8" y="280" width="152" height="94" rx="1" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="18" cy="294" r="3.5" fill="#0284c7"/>
    <text x="26" y="297" font-size="8" font-weight="700" fill="#0369a1">Agent Golden Standard</text>
    <text x="12" y="312" font-size="7.2" fill="#075985">Sub-50ms spinup, complete</text>
    <text x="12" y="324" font-size="7.2" fill="#075985">POSIX shell support, zero-copy</text>
    <text x="12" y="336" font-size="7.2" fill="#075985">workspace cloning, and true</text>
    <text x="12" y="348" font-size="7.2" fill="#075985">hardware hypervisor isolation.</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 5: FULL LEGACY VM                                          -->
  <!-- ================================================================= -->
  <g transform="translate(752, 74)">
    <rect width="168" height="384" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <rect width="168" height="28" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="84" y="14" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Full Legacy VM</text>
    <text x="84" y="24" font-size="7.5" fill="#475569" text-anchor="middle">QEMU / VMware / VirtualBox</text>

    <!-- Boundary Badge -->
    <rect x="8" y="33" width="152" height="18" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="84" y="45" font-size="7.5" font-weight="700" fill="#334155" text-anchor="middle">Boundary: Hardware (VT-x)</text>

    <!-- Section: Kernel Isolation -->
    <text x="8" y="66" font-size="7" font-weight="700" fill="#64748b">KERNEL ISOLATION</text>
    <text x="8" y="78" font-size="8.5" font-weight="700" fill="#334155">Dedicated Guest Linux</text>
    <text x="8" y="89" font-size="7" fill="#475569">40+ legacy emulated PC devices</text>
    <line x1="8" y1="96" x2="160" y2="96" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Cold Boot Latency -->
    <text x="8" y="110" font-size="7" font-weight="700" fill="#64748b">COLD BOOT LATENCY</text>
    <text x="8" y="124" font-size="10" font-weight="700" fill="#64748b">15 – 45 s</text>
    <line x1="8" y1="132" x2="160" y2="132" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Memory Base -->
    <text x="8" y="146" font-size="7" font-weight="700" fill="#64748b">MEMORY BASE</text>
    <text x="8" y="160" font-size="10" font-weight="700" fill="#64748b">~512 MB – 2 GB</text>
    <line x1="8" y1="168" x2="160" y2="168" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Section: Escape Risks -->
    <text x="8" y="182" font-size="7" font-weight="700" fill="#64748b">ESCAPE RISKS</text>
    <rect x="8" y="188" width="152" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="12" y="201" font-size="7" fill="#475569">• Enormous legacy emulation bugs</text>
    <text x="12" y="213" font-size="7" fill="#475569">• Floppy/IDE/ACPI CVEs (VENOM)</text>
    <text x="12" y="225" font-size="7" fill="#475569">• Large C codebase attack surface</text>
    <text x="12" y="237" font-size="7" fill="#475569">• Heavy memory limits density</text>

    <!-- Section: Agent Applicability -->
    <text x="8" y="274" font-size="7" font-weight="700" fill="#64748b">AGENT APPLICABILITY</text>
    <rect x="8" y="280" width="152" height="94" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="18" cy="294" r="3.5" fill="#64748b"/>
    <text x="26" y="297" font-size="8" font-weight="700" fill="#334155">Impractical at Scale</text>
    <text x="12" y="312" font-size="7.2" fill="#475569">Multi-second boots destroy</text>
    <text x="12" y="324" font-size="7.2" fill="#475569">interactive agent tool loops;</text>
    <text x="12" y="336" font-size="7.2" fill="#475569">gigabyte footprints limit</text>
    <text x="12" y="348" font-size="7.2" fill="#475569">concurrent multi-agent pools.</text>
  </g>

  <!-- ================================================================= -->
  <!-- FOOTER: KEY ARCHITECTURAL INVARIANT                               -->
  <!-- ================================================================= -->
  <g transform="translate(40, 468)">
    <rect width="880" height="42" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0f172a">KEY ARCHITECTURAL INVARIANT FOR AUTONOMOUS AGENT SANDBOXING:</text>
    <text x="14" y="28" font-size="7.8" fill="#475569">Containers share the host kernel (rendering them vulnerable to privilege escalation), while legacy VMs take tens of seconds to boot.</text>
    <text x="14" y="38" font-size="7.8" font-weight="600" fill="#0369a1">MicroVMs (Firecracker) bridge the gap: sub-50ms cold boot, 5MB footprint, and true hardware hypervisor boundaries.</text>
  </g>
</g>
</svg>