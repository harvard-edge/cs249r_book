<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">AWS FIRECRACKER MICROVM ARCHITECTURE &amp; EPHEMERAL SANDBOX LIFECYCLE</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Rootless Jailer envelope, minimal VirtIO surface, and zero-residual Copy-on-Write storage layering</text>

  <!-- ================================================================= -->
  <!-- LEFT: AGENT ORCHESTRATOR & API CONTROL PLANE                      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect width="200" height="384" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="200" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">AGENT ORCHESTRATOR (HOST)</text>

    <!-- Sub-blocks for Orchestrator Flow -->
    <g transform="translate(10, 32)">
      <rect width="180" height="60" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">1. Spawn with Jailer</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">Executes jailer binary with strict UID,</text>
      <text x="8" y="38" font-size="7.5" fill="#475569">GID, cgroup limits, and chroot dir.</text>
      <text x="8" y="50" font-family="monospace" font-size="7" fill="#0284c7">jailer --id vm-042 --exec-file ...</text>
    </g>

    <g transform="translate(10, 98)">
      <rect width="180" height="124" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">2. Configure via Unix Socket</text>
      <text x="8" y="27" font-family="monospace" font-size="7" fill="#64748b">PUT /boot-source (vmlinux)</text>
      <text x="8" y="38" font-family="monospace" font-size="7" fill="#64748b">PUT /drives/rootfs (OverlayFS)</text>
      <text x="8" y="49" font-family="monospace" font-size="7" fill="#64748b">PUT /network-interfaces/eth0</text>
      <text x="8" y="60" font-family="monospace" font-size="7" fill="#64748b">PUT /vsock (host-guest IPC)</text>
      <text x="8" y="78" font-size="7.5" font-weight="700" fill="#0284c7">Cold Boot in &lt; 50 ms:</text>
      <rect x="8" y="86" width="164" height="26" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="90" y="103" font-family="monospace" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">InstanceStart (T_boot: 22ms)</text>
    </g>

    <g transform="translate(10, 228)">
      <rect width="180" height="58" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">3. Tool Dispatch via Vsock</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">Executes bash commands, tests,</text>
      <text x="8" y="38" font-size="7.5" fill="#475569">and git patches inside sandbox.</text>
      <text x="8" y="50" font-family="monospace" font-size="7" fill="#16a34a">vsock://port=52/exec_command</text>
    </g>

    <g transform="translate(10, 292)">
      <rect width="180" height="80" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#991b1b">4. Ephemeral Teardown</text>
      <text x="8" y="27" font-size="7.5" fill="#475569">SendCtrlAltDel / process kill.</text>
      <text x="8" y="38" font-size="7.5" fill="#475569">UpperDir diff layer deleted.</text>
      <rect x="8" y="46" width="164" height="24" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="90" y="62" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Zero Residual Footprint (&lt;2ms)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- MIDDLE: JAILER SECURITY ENVELOPE & FIRECRACKER VMM                -->
  <!-- ================================================================= -->
  <g transform="translate(256, 74)">
    <rect width="432" height="384" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect width="432" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">JAILER SECURITY ENVELOPE (ROOTLESS ISOLATION)</text>
    <text x="420" y="16" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="end">chroot + cgroups v2 + seccomp-bpf</text>

    <!-- Firecracker VMM Process (Rust Userspace) -->
    <g transform="translate(10, 32)">
      <rect width="412" height="148" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect width="412" height="22" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#0369a1">Firecracker VMM Process (Rust Userspace)</text>
      <text x="402" y="15" font-family="monospace" font-size="7.5" fill="#0284c7" text-anchor="end">PID: 10482 (Unprivileged)</text>

      <g transform="translate(8, 28)">
        <rect width="190" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Minimal VirtIO Devices</text>
        <text x="8" y="28" font-size="7.5" fill="#334155">• <tspan font-weight="700">virtio-net</tspan>: TAP device to host</text>
        <text x="8" y="41" font-size="7.5" fill="#334155">• <tspan font-weight="700">virtio-block</tspan>: Disk I/O backend</text>
        <text x="8" y="54" font-size="7.5" fill="#334155">• <tspan font-weight="700">virtio-vsock</tspan>: Fast zero-TCP IPC</text>
        <text x="8" y="67" font-size="7.5" fill="#334155">• <tspan font-weight="700">serial console</tspan>: TTY / logging</text>
        <rect x="8" y="78" width="174" height="24" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="95" y="94" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">No PCI / No ACPI / No IDE</text>
      </g>

      <g transform="translate(206, 28)">
        <rect width="198" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">vCPU Execution Threads</text>
        <text x="8" y="28" font-size="7.5" fill="#334155">• 1 Host POSIX thread per guest vCPU</text>
        <text x="8" y="41" font-size="7.5" fill="#334155">• Tight loop on <tspan font-family="monospace" font-size="7">ioctl(KVM_RUN)</tspan></text>
        <text x="8" y="54" font-size="7.5" fill="#334155">• Memory: single <tspan font-family="monospace" font-size="7">mmap</tspan> backing slot</text>
        <rect x="8" y="66" width="182" height="36" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="12" y="80" font-family="monospace" font-size="7" fill="#334155">while (ioctl(vcpu_fd, KVM_RUN)) {</text>
        <text x="12" y="92" font-family="monospace" font-size="7" fill="#334155">  handle_exit(vcpu.exit_reason); }</text>
      </g>
    </g>

    <!-- Hardware KVM Hypervisor Boundary -->
    <g transform="translate(10, 186)">
      <rect width="412" height="30" rx="1" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
      <text x="206" y="13" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Hardware Virtualization Barrier: Linux /dev/kvm (Intel VT-x / AMD-V)</text>
      <text x="206" y="24" font-size="7.2" fill="#475569" text-anchor="middle">Non-Root CPU Ring 0/3 Execution • Extended Page Tables (EPT) Memory Isolation</text>
    </g>

    <!-- Guest MicroVM Context -->
    <g transform="translate(10, 222)">
      <rect width="412" height="152" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <rect width="412" height="22" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#991b1b">Guest MicroVM (Untrusted Agent Execution Zone)</text>
      <text x="402" y="15" font-family="monospace" font-size="7.5" fill="#991b1b" text-anchor="end">Isolated Kernel Ring 0</text>

      <g transform="translate(8, 28)">
        <rect width="124" height="114" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="13" font-size="8" font-weight="700" fill="#991b1b">Guest Linux Kernel</text>
        <text x="6" y="26" font-size="7.2" fill="#475569">• Stripped uncompressed</text>
        <text x="6" y="38" font-family="monospace" font-size="6.8" fill="#0f172a">  vmlinux (&lt;10MB)</text>
        <text x="6" y="51" font-size="7.2" fill="#475569">• Independent page</text>
        <text x="6" y="63" font-size="7.2" fill="#475569">  tables &amp; namespaces</text>
        <text x="6" y="76" font-size="7.2" fill="#475569">• Full POSIX syscalls</text>
        <text x="6" y="88" font-size="7.2" fill="#475569">  handled internally</text>
      </g>

      <g transform="translate(138, 28)">
        <rect width="140" height="114" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="13" font-size="8" font-weight="700" fill="#991b1b">Guest Agent Runner</text>
        <text x="6" y="26" font-size="7.2" fill="#475569">• Minimal init system</text>
        <text x="6" y="38" font-size="7.2" fill="#475569">• Python / Node runtimes</text>
        <text x="6" y="50" font-size="7.2" fill="#475569">• Executes LLM commands:</text>
        <rect x="6" y="58" width="128" height="46" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="73" font-family="monospace" font-size="7" fill="#0f172a">pytest -v tests/</text>
        <text x="10" y="88" font-family="monospace" font-size="7" fill="#0f172a">git checkout -b fix</text>
      </g>

      <g transform="translate(284, 28)">
        <rect width="120" height="114" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <rect x="6" y="6" width="108" height="16" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="60" y="18" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">CONTAINED</text>
        <text x="6" y="36" font-size="7" fill="#dc2626">Even if an agent</text>
        <text x="6" y="47" font-size="7" fill="#dc2626">executes malicious</text>
        <text x="6" y="58" font-family="monospace" font-size="6.8" fill="#991b1b">rm -rf / or exploit,</text>
        <text x="6" y="71" font-size="7" fill="#475569">it damages only its</text>
        <text x="6" y="82" font-size="7" fill="#475569">own guest kernel &amp;</text>
        <text x="6" y="93" font-size="7" fill="#475569">ephemeral rootfs!</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: COPY-ON-WRITE FILESYSTEM ARCHITECTURE                      -->
  <!-- ================================================================= -->
  <g transform="translate(704, 74)">
    <rect width="216" height="384" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="216" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">EPHEMERAL COW STORAGE</text>

    <!-- OverlayFS Diagram -->
    <g transform="translate(10, 32)">
      <rect width="196" height="38" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#15803d">Merged Mount (Sandbox /)</text>
      <text x="8" y="27" font-size="7.2" fill="#475569">Unified view seen by agent tool runner</text>

      <line x1="98" y1="40" x2="98" y2="48" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <g transform="translate(0, 52)">
        <rect width="196" height="66" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="#b45309">UpperDir (Read-Write Diff)</text>
        <text x="8" y="26" font-size="7" fill="#475569">• In-memory tmpfs / thin sparse file</text>
        <text x="8" y="37" font-size="7" fill="#475569">• Stores agent edits, new files, &amp; logs</text>
        <rect x="8" y="44" width="180" height="16" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
        <text x="98" y="56" font-size="7" font-weight="700" fill="#b45309" text-anchor="middle">Disposed on Task Exit (&lt;1ms)</text>
      </g>

      <line x1="98" y1="120" x2="98" y2="128" stroke="#94a3b8" stroke-width="1.5"/>

      <g transform="translate(0, 130)">
        <rect width="196" height="74" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">LowerDir (Immutable Base OS)</text>
        <text x="8" y="26" font-size="7" fill="#475569">• Read-only base rootfs (Ubuntu 24.04)</text>
        <text x="8" y="37" font-size="7" fill="#475569">• Pre-warmed toolchains (Python, Rust)</text>
        <text x="8" y="48" font-size="7" fill="#475569">• Read-only Git repo snapshot</text>
        <text x="8" y="62" font-size="7" font-weight="700" fill="#15803d">Shared across 10,000+ microVMs</text>
      </g>
    </g>

    <g transform="translate(10, 252)">
      <rect width="196" height="120" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Zero-Copy Workspace Cloning</text>
      <text x="8" y="27" font-size="7" fill="#475569">• Instantly clones 10GB repo in &lt;1ms</text>
      <text x="8" y="39" font-size="7" fill="#475569">• Shared lower layers stay in page cache</text>
      <text x="8" y="51" font-size="7" fill="#475569">• Zero disk write amplification for base</text>
      <text x="8" y="65" font-size="7" font-weight="700" fill="#0284c7">• Diff extraction: inspects UpperDir only</text>
      <text x="8" y="76" font-size="7" fill="#64748b">  before discarding VM container.</text>
    </g>
  </g>

  <!-- Connectors between components -->
  <line x1="240" y1="168" x2="254" y2="168" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="240" y1="330" x2="254" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="688" y1="330" x2="704" y2="330" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ================================================================= -->
  <!-- FOOTER: MULTI-TIER ISOLATION GUARANTEE                            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 468)">
    <rect width="880" height="42" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="16" font-size="8.5" font-weight="700" fill="#0f172a">JAILER + KVM + OVERLAYFS MULTI-TIER ISOLATION GUARANTEE:</text>
    <text x="14" y="28" font-size="7.8" fill="#334155">1. Even if the agent executes hostile code, guest kernel exploits cannot touch host memory due to hardware KVM virtualization.</text>
    <text x="14" y="38" font-size="7.8" fill="#334155">2. Even if an attacker finds a zero-day VM escape in the VMM, the Jailer cgroups, chroot, and seccomp sandbox prevent host compromise.</text>
  </g>
</svg>
