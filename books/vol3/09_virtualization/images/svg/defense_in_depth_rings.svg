<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="500" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">THE THREE DEFENSE-IN-DEPTH RINGS FOR AUTONOMOUS AGENT EXECUTION</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Concentric deterministic containment boundaries isolating probabilistic neural policies from host resources</text>

  <!-- ================================================================= -->
  <!-- LEFT: CONCENTRIC CONTAINMENT DIAGRAM                              -->
  <!-- ================================================================= -->
  <!-- Ring 3: Network Perimeter (Outer Shell) -->
  <rect x="40" y="74" width="360" height="384" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="40" y="74" width="360" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="52" y="90" font-size="9" font-weight="700" fill="#0369a1">RING 3: ZERO-TRUST NETWORK PERIMETER</text>
  <text x="388" y="90" font-size="8" font-weight="700" fill="#0369a1" text-anchor="end">eBPF + Proxy + DNS</text>

  <!-- Ring 2: OS & Virtualization (Middle Shell) -->
  <g transform="translate(58, 108)">
    <rect x="0" y="0" width="324" height="338" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="324" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">RING 2: OS &amp; VIRTUALIZATION LAYER</text>
    <text x="312" y="16" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="end">KVM + Overlays</text>

    <!-- Ring 1: Protocol & Capability (Inner Shell) -->
    <g transform="translate(18, 34)">
      <rect x="0" y="0" width="288" height="292" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <rect x="0" y="0" width="288" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">RING 1: API &amp; CAPABILITY LAYER</text>
      <text x="276" y="16" font-size="8" font-weight="700" fill="#b45309" text-anchor="end">JSON Schema</text>

      <!-- Central Core: Untrusted Agent -->
      <g transform="translate(16, 34)">
        <rect x="0" y="0" width="256" height="246" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
        <rect x="0" y="0" width="256" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="128" y="16" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">UNTRUSTED AGENT CORE</text>

        <!-- Threat Box 1 -->
        <g transform="translate(10, 32)">
          <rect x="0" y="0" width="236" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Stochastic Neural Policy</text>
          <text x="10" y="26" font-size="7.5" fill="#dc2626">• Shared embedding space (No W⊕X separation)</text>
          <text x="10" y="36" font-size="7" fill="#64748b">  P(inject) ≈ 1.0 under adversarial inputs</text>
        </g>

        <!-- Threat Box 2 -->
        <g transform="translate(10, 82)">
          <rect x="0" y="0" width="236" height="44" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Ambient Authority Risk</text>
          <text x="10" y="26" font-size="7.5" fill="#dc2626">• Confused Deputy vulnerability</text>
          <text x="10" y="36" font-size="7" fill="#64748b">  Arbitrary shell / socket / filesystem privileges</text>
        </g>

        <!-- Threat Box 3 -->
        <g transform="translate(10, 132)">
          <rect x="0" y="0" width="236" height="102" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="10" y="14" font-size="8.5" font-weight="700" fill="#991b1b">Active Execution Sandbox</text>
          <rect x="8" y="20" width="220" height="18" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="14" y="32" font-family="monospace" font-size="7.5" fill="#0f172a">python3 -c "exec(payload)"</text>
          <text x="10" y="52" font-size="7.5" fill="#dc2626">Attacker payload trapped inside containment rings</text>
          <rect x="8" y="62" width="220" height="28" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
          <text x="118" y="79" font-size="7.2" font-weight="700" fill="#991b1b" text-anchor="middle">CONTAINMENT GUARANTEED OUTSIDE MODEL</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: DETAILED ARCHITECTURE CARDS                                -->
  <!-- ================================================================= -->
  <!-- CARD 1: Ring 1 Details -->
  <g transform="translate(420, 74)">
    <rect x="0" y="0" width="500" height="118" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">RING 1: PROTOCOL &amp; CAPABILITY LAYER (Chapters 09 &amp; 10)</text>
    <text x="488" y="16" font-size="8" font-weight="700" fill="#b45309" text-anchor="end">Gate: Invariant Leases</text>

    <g transform="translate(14, 32)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Key Mechanisms:</text>
      <text x="105" y="10" font-size="8" fill="#334155">JSON-RPC / MCP schema validation • Ephemeral single-use capability leases</text>
      <text x="0" y="24" font-size="8" font-weight="700" fill="#0f172a">Enforcement:</text>
      <text x="105" y="24" font-size="8" fill="#334155">Human-in-the-loop cryptographic approval escrow for irreversible mutations</text>
      <text x="0" y="38" font-size="8" font-weight="700" fill="#0f172a">Information Flow:</text>
      <text x="105" y="38" font-size="8" fill="#334155">Dynamic context taint tracking: τ_state ← τ_state ⊔ τ(tool_output)</text>
      <rect x="0" y="48" width="472" height="26" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="8" y="64" font-size="7.5" font-weight="700" fill="#b45309">Neutralizes: <tspan font-weight="400">Unauthorized effector calls, tool parameter poisoning, prompt injection co-optation</tspan></text>
    </g>
  </g>

  <!-- CARD 2: Ring 2 Details -->
  <g transform="translate(420, 202)">
    <rect x="0" y="0" width="500" height="132" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">RING 2: OS &amp; VIRTUALIZATION LAYER (§§11.2 &amp; 11.3)</text>
    <text x="488" y="16" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="end">Gate: Hypervisor Boundary</text>

    <g transform="translate(14, 32)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Hardware microVM:</text>
      <text x="110" y="10" font-size="8" fill="#334155">AWS Firecracker / KVM; independent guest kernel; Extended Page Tables (EPT)</text>
      <text x="0" y="24" font-size="8" font-weight="700" fill="#0f172a">Jailer Envelope:</text>
      <text x="110" y="24" font-size="8" fill="#334155">pivot_root chroot jail • Unprivileged UID/GID • seccomp-bpf (&lt; 20 host syscalls)</text>
      <text x="0" y="38" font-size="8" font-weight="700" fill="#0f172a">Ephemeral Storage:</text>
      <text x="110" y="38" font-size="8" fill="#334155">OverlayFS on tmpfs (LowerDir NVMe + UpperDir RAM) • &lt; 2ms zero-residual wipe</text>
      <text x="0" y="52" font-size="8" font-weight="700" fill="#0f172a">Resource Limits:</text>
      <text x="110" y="52" font-size="8" fill="#334155">Linux cgroups v2: pids.max = 256 • cpu.max CFS quotas • memory.oom.group = 1</text>
      <rect x="0" y="60" width="472" height="30" rx="1" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
      <text x="8" y="73" font-size="7.5" font-weight="700" fill="#6d28d9">Neutralizes: <tspan font-weight="400">Host kernel escapes (Dirty COW, io_uring LPE), fork bombs, host OOM crashes</tspan></text>
      <text x="8" y="84" font-size="7.2" fill="#7c3aed">P(escape | inject) ≤ 10⁻⁶ (requires unpatched hardware virtualization hypervisor zero-day)</text>
    </g>
  </g>

  <!-- CARD 3: Ring 3 Details -->
  <g transform="translate(420, 344)">
    <rect x="0" y="0" width="500" height="118" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">RING 3: ZERO-TRUST NETWORK PERIMETER (§11.4)</text>
    <text x="488" y="16" font-size="8" font-weight="700" fill="#0369a1" text-anchor="end">Gate: Complete Mediation</text>

    <g transform="translate(14, 30)">
      <text x="0" y="10" font-size="8" font-weight="700" fill="#0f172a">Layer 1 (Kernel eBPF):</text>
      <text x="120" y="10" font-size="8" fill="#334155">tc hook drops raw destination IPs &amp; link-local IMDS (169.254.169.254)</text>
      <text x="0" y="24" font-size="8" font-weight="700" fill="#0f172a">Layer 2 (TLS Proxy):</text>
      <text x="120" y="24" font-size="8" fill="#334155">Transparent SNI allowlists (*.pypi.org) • Outbound credential regex redaction</text>
      <text x="0" y="38" font-size="8" font-weight="700" fill="#0f172a">Layer 3 (DNS Resolver):</text>
      <text x="120" y="38" font-size="8" fill="#334155">Shannon entropy filter (H(X) &gt; 4.2 drop) • Label length caps • NRD sinkhole</text>
      <rect x="0" y="48" width="472" height="30" rx="1" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="8" y="61" font-size="7.5" font-weight="700" fill="#0369a1">Neutralizes: <tspan font-weight="400">Cloud IAM theft, direct TCP reverse shells, covert DNS data exfiltration</tspan></text>
      <text x="8" y="72" font-size="7.2" fill="#0284c7">P(exfil | escape) ≤ 10⁻⁴ (requires bypassing eBPF drops, SNI proxy, and Shannon DNS filter)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM: SYSTEMS INVARIANT CARD                                    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 472)">
    <rect x="0" y="0" width="880" height="34" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="21" font-size="8.5" font-weight="700" fill="#0f172a">SYSTEMS INVARIANT:</text>
    <text x="135" y="21" font-size="8.5" font-weight="600" fill="#0369a1">P_breach = P(inject) × P(escape | inject) × P(exfil | escape) ≤ 1.0 × 10⁻⁶ × 10⁻⁴ = 10⁻¹⁰</text>
    <text x="866" y="21" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">Deterministic Systems Isolation Outside Probabilistic Neural Weights</text>
  </g>
</svg>