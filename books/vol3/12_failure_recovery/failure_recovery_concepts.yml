    relationships:
    - id: vol3.field.saga.compensation
      source: vol3.saga
      predicate: registers obligations for
      target: vol3.compensation
      explanation: Independent committed steps require explicit compensating operations when a later step
        fails.
      conditions: The compensation contract covers only declared fallback postconditions, not universal
        reversal.
      status: draft
      evidence:
        section: sec-vol3-failure-recovery-obligation-registration
        quote: 'Registering a compensating step before dispatching the forward action creates an immediate
          addressing problem: when the worker sends a provisioning request, the cloud service has not yet
          created the environment or returned the handle needed to tear it down. Waiting until the reply
          arrives to log the cleanup would open a crash window in which a dropped connection orphans a live,
          billed environment with no local recovery record; the runtime instead durably registers a cleanup
          template *before* forward dispatch and binds the target identifier when evidence arrives. In our
          temporary test-infrastructure workflow, let `provision_test_env_r18` be the stable logical operation
          that provisions an isolated test environment, and let `release_test_env_r18` be its corresponding
          cleanup operation, a distinct logical identity that remains stable across retries and restarts.
          Neither identity should be confused with the endpoint-generated environment identifier. That system
          handle, denoted `env_r18_01` in a successful provisioning run, becomes known to the runtime only
          after correlated response evidence settles the forward operation.'
    - id: vol3.field.compensation.settlement
      source: vol3.compensation
      predicate: requires evidence of
      target: vol3.settlement
      explanation: A returned cleanup request is not a settled cleanup outcome.
      conditions: Timeouts preserve an obligation with a named owner; they do not refund consumed allowance.
      status: draft
      evidence:
        section: sec-vol3-failure-recovery-cleanup-failures
        quote: 'The coordinator retires a compensation entry only upon receiving verifiable outcome evidence,
          rather than assuming success simply because a remote call returned without a transport error.
          If a release call times out, three states remain possible: the environment may be gone, it may
          still be undergoing deallocation, or it may remain allocated. The settlement rules keep all three
          possibilities open. Furthermore, cleanup actions consume quota and wall-clock execution budget;
          a timed-out call refunds nothing. If cleanup cannot progress further within its assigned budget,
          the obligation stays on record with its accumulated evidence and an assigned escalation owner.
          In this way, a failed agent trajectory can terminate safely without masking unresolved external
          leaks.'
    - id: vol3.field.checkpoint.compensation
      source: vol3.checkpoint
      predicate: restores local state separately from
      target: vol3.compensation
      explanation: Local restoration and remote compensation address different state scopes and must be
        verified independently.
      conditions: A checkpoint covers only the runtime-managed projection; external services and accrued
        charges remain outside it.
      status: draft
      evidence:
        section: sec-vol3-failure-recovery-semantic-compensation
        quote: Local workspace restoration plays a complementary but narrower role. A compatible checkpoint
          restores only the local workspace projection managed directly by the runtime. Checkpoints cannot
          reset remote cloud environments, running external daemons, dispatched batch jobs, or accrued service
          charges. Those external side effects demand semantic compensation. When recovery requires both
          local rollback and remote compensation, the runtime orchestrates both mechanisms, verifying the
          independent outcome of each path before declaring the system recovered.
    - id: vol3.field.watchdog.trajectory
      source: vol3.watchdog
      predicate: uses evidence to bound
      target: vol3.trajectory
      explanation: A supervisor evaluates observable progress and consumption rather than trusting a model
        declaration of progress.
      conditions: A watchdog response must itself pass admission and preserve unresolved obligations.
      status: draft
      evidence:
        section: sec-vol3-failure-recovery-progress-evidence
        quote: 'A watchdog that watches only raw tool return codes or uncanonicalized file timestamps either
          misses an agent toggling between two broken patches in `ws_r18` or raises a false alarm while
          the agent runs read-only log inspections. To evaluate trajectory health accurately, a semantic
          monitor requires three components: a concrete projection of task state, an authoritative observation
          stream, and a sliding comparison window. In our automated defect-repair scenario, meaningful evidence
          includes the source tree modifications, the specific regression suites executed against each candidate
          revision, and the resulting compiler or test diagnostic streams. Systems designers must maintain
          strict provenance for this evidence: a passing unit test validates only its scoped assertions,
          not complete task correctness. The runtime attaches the source revision, test scope, and verifier
          configuration to every evaluation record, ensuring that the watchdog compares identical verification
          criteria across successive turns.'
