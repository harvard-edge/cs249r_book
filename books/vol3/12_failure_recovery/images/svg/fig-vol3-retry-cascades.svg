<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" rx="4"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel-border { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hdr { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .title-text { font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub-text { font-size: 12px; fill: #64748b; text-anchor: middle; }
      .box-retry { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 5; }
      .box-aug { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 5; }
      .box-alert { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; rx: 5; }
      .card-hdr { font-size: 11.5px; font-weight: 700; fill: #1e293b; }
      .body-text { font-size: 10.5px; fill: #334155; }
      .mono-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .mono-alert { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #dc2626; }
      .mono-ok { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #166534; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.8; fill: none; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #f1f5f9; stroke-width: 1; stroke-dasharray: 3,3; }
      .axis-lbl { font-size: 10px; fill: #475569; }
      .curve-det { stroke: #dc2626; stroke-width: 2.2; fill: none; }
      .curve-full { stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
      .curve-decorr { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="510" y="28" class="title-text">Retry Cascades, Cascading Token Waste, and Serving Cluster Traffic Shaping</text>
  <text x="510" y="46" class="sub-text">Quantitative Epistemic Decay Across Trajectory Retries vs. Error-Feedback Augmentation and Backoff Dynamics</text>

  <!-- ================================================================= -->
  <!-- PANEL A: CASCADING TOKEN WASTE & EPISTEMIC DECAY                  -->
  <!-- ================================================================= -->
  <g transform="translate(20, 65)">
    <rect width="475" height="455" class="panel-border"/>
    <text x="16" y="24" class="panel-hdr">(a) Token Waste &amp; Epistemic Decay: W_tokens = ∑ (S_j + D_j)</text>

    <!-- Attempt j=1 -->
    <g transform="translate(18, 42)">
      <rect width="438" height="66" class="box-retry"/>
      <text x="12" y="18" class="card-hdr">Attempt j = 1: Initial Action Proposal (Prefill S₁ = 4,000, Decode D₁ = 320)</text>
      <text x="12" y="36" class="body-text">Context: Task prompt + tool definitions. Outcome: Schema/parameter rejection.</text>
      <text x="12" y="54" class="mono-text">p₁ = 0.40 • Sunk tokens: 4,320 • Cumulative waste: W₁ = 4,320 tokens</text>
    </g>

    <path d="M 237 108 L 237 126" class="edge" marker-end="url(#arrow)"/>

    <!-- Fork: Naive Retry vs Error Feedback -->
    <!-- Attempt j=2: Naive Decay -->
    <g transform="translate(18, 128)">
      <rect width="210" height="92" class="box-alert"/>
      <text x="10" y="16" class="card-hdr" fill="#991b1b">Naive Resample (j = 2)</text>
      <text x="10" y="32" class="body-text">Unchanged context τ (blind retry)</text>
      <text x="10" y="48" class="mono-alert">p₂ = p₁ · γ¹ = 0.20 (γ = 0.50)</text>
      <text x="10" y="64" class="body-text">Prefill S₂ = 4,320, Decode D₂ = 310</text>
      <text x="10" y="80" class="mono-alert">Subtotal waste: 8,950 tokens</text>
    </g>

    <!-- Attempt j=2: Error-Feedback Augmented -->
    <g transform="translate(246, 128)">
      <rect width="210" height="92" class="box-aug"/>
      <text x="10" y="16" class="card-hdr" fill="#166534">Error-Feedback Augmented</text>
      <text x="10" y="32" class="body-text">Context τ ∪ {a₁, o_err} injected</text>
      <text x="10" y="48" class="mono-ok">p₂^aug ≥ 0.65 (epistemic reset)</text>
      <text x="10" y="64" class="body-text">Model attends to error diagnostics</text>
      <text x="10" y="80" class="mono-ok">Direct convergence to success</text>
    </g>

    <!-- Continued Naive Decay: Attempt j=3 & j=4 -->
    <path d="M 123 220 L 123 238" class="edge-red" marker-end="url(#arrow-red)"/>

    <g transform="translate(18, 240)">
      <rect width="438" height="88" class="box-alert"/>
      <text x="12" y="18" class="card-hdr" fill="#991b1b">Unaugmented Retry Chain Collapse: j = 3 and j = 4</text>
      <text x="12" y="36" class="body-text">Attempt j = 3: p₃ = p₁ · γ² = 0.10 • Prefill S₃ = 4,630 • Sunk waste: 13,890 tokens</text>
      <text x="12" y="54" class="body-text">Attempt j = 4: p₄ = p₁ · γ³ = 0.05 • Prefill S₄ = 4,940 • Cumulative W_tokens = 19,140</text>
      <text x="12" y="74" class="mono-alert">Asymptotic ceiling: P_cum(4) = 1 - ∏(1 - p_j) = 0.59 • 78% tokens wasted</text>
    </g>

    <!-- Takeaway Summary Box -->
    <g transform="translate(18, 345)">
      <rect width="438" height="95" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" rx="4"/>
      <text x="12" y="18" class="card-hdr" fill="#1e40af">Systems Implication for Inference Serving Engines:</text>
      <text x="12" y="36" class="body-text">• Naive retries generate quadratic KV-cache allocation pressure without convergence.</text>
      <text x="12" y="54" class="body-text">• Error context resets conditional probability by transforming blind search into repair.</text>
      <text x="12" y="72" class="body-text">• Bounding R ≤ 2 attempts prevents GPU high-bandwidth memory (HBM) exhaustion.</text>
      <text x="12" y="88" class="mono-text" fill="#1e40af">HBM memory footprint: 2 × L × n_layers × d_head × n_kv_heads × 2 bytes</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: SERVING CLUSTER TRAFFIC SHAPING (JITTER DYNAMICS)        -->
  <!-- ================================================================= -->
  <g transform="translate(515, 65)">
    <rect width="485" height="455" class="panel-border"/>
    <text x="16" y="24" class="panel-hdr">(b) Inference &amp; Tool Gateway Arrival Distribution under Retry</text>

    <!-- Axis for traffic curves -->
    <g transform="translate(45, 60)">
      <!-- Axes -->
      <line x1="0" y1="210" x2="410" y2="210" class="axis"/>
      <line x1="0" y1="210" x2="0" y2="10" class="axis"/>

      <text x="405" y="226" class="axis-lbl" text-anchor="end">Time t (seconds)</text>
      <text x="10" y="8" class="axis-lbl">Request Arrival Rate λ(t) [req/s]</text>

      <!-- Cluster Capacity Limit line -->
      <line x1="0" y1="80" x2="410" y2="80" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,4"/>
      <text x="405" y="74" font-size="9.5px" fill="#dc2626" font-weight="700" text-anchor="end">Cluster Serving Capacity (C = 200 req/s)</text>

      <!-- Grid lines -->
      <line x1="0" y1="140" x2="410" y2="140" class="grid"/>
      <line x1="100" y1="10" x2="100" y2="210" class="grid"/>
      <line x1="200" y1="10" x2="200" y2="210" class="grid"/>
      <line x1="300" y1="10" x2="300" y2="210" class="grid"/>

      <text x="0" y="224" class="axis-lbl">0</text>
      <text x="100" y="224" class="axis-lbl">1s</text>
      <text x="200" y="224" class="axis-lbl">2s</text>
      <text x="300" y="224" class="axis-lbl">3s</text>

      <!-- Deterministic Resonance: Impulse spikes at 1s, 2s, 3s -->
      <path d="M 0 208 L 98 208 L 100 20 L 102 208 L 198 208 L 200 15 L 202 208 L 400 208" class="curve-det"/>
      <circle cx="100" cy="20" r="4" fill="#dc2626"/>
      <circle cx="200" cy="15" r="4" fill="#dc2626"/>
      <text x="110" y="28" font-size="9px" fill="#dc2626" font-weight="700">Deterministic Spike (64k req/s)</text>

      <!-- Full Jitter Curve: High near t=0, decays -->
      <path d="M 0 110 Q 40 120 100 155 T 250 190 T 400 205" class="curve-full"/>
      <text x="65" y="135" font-size="9px" fill="#d97706" font-weight="600">Full Jitter (clusters near t=0)</text>

      <!-- Decorrelated Jitter Curve: Flat uniform envelope -->
      <path d="M 0 208 L 30 208 L 35 150 L 80 148 L 160 152 L 260 155 L 380 158 L 400 208" class="curve-decorr"/>
      <text x="170" y="142" font-size="9.5px" fill="#2563eb" font-weight="700">Decorrelated Jitter: Flat arrival envelope</text>
    </g>

    <!-- Formula and Comparison Card -->
    <g transform="translate(18, 290)">
      <rect width="450" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="4"/>
      <text x="12" y="18" class="card-hdr">Jitter Mathematical Formulations &amp; Queuing Characteristics</text>
      
      <text x="12" y="38" class="mono-text" fill="#dc2626">Deterministic:</text>
      <text x="110" y="38" class="mono-text">t_wait = 2^k · T_0  (causes synchronous resonance spikes)</text>

      <text x="12" y="58" class="mono-text" fill="#d97706">Full Jitter:</text>
      <text x="110" y="58" class="mono-text">t_j ~ Uniform(0, min(T_max, 2^k · T_0)) (clusters near t=0)</text>

      <text x="12" y="78" class="mono-text" fill="#2563eb">Decorrelated:</text>
      <text x="110" y="78" class="mono-text">t_{j+1} = min(T_max, Uniform(t_base, 3 · t_j))</text>

      <line x1="12" y1="90" x2="438" y2="90" stroke="#e2e8f0" stroke-width="1"/>

      <text x="12" y="108" class="body-text">• <tspan font-weight="700">Non-zero lower bound:</tspan> Enforces quiet gap t_base ≥ 100 ms, draining GPU buffers.</text>
      <text x="12" y="124" class="body-text">• <tspan font-weight="700">Multiplicative dispersion:</tspan> Sleep scales with prior wait, breaking fleet correlation.</text>
      <text x="12" y="140" class="body-text">• <tspan font-weight="700">Cluster protection:</tspan> Lowers 99th percentile queue delay by 4.2× across 1,000 agents.</text>
    </g>
  </g>
</svg>
