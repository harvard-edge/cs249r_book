<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="170" fill="#ffffff"/>
  <!-- Log scale: x = 6 + 33.6 * log10(rate per second); decades 1/s .. 100k/s -->
  <!-- Synchronized: 64,000/s -> x end 167.5 -->
  <rect x="6" y="6" width="161.5" height="36" fill="#5e6b73" fill-opacity="0.92"/>
  <text x="161" y="21" font-size="13" fill="#ffffff" text-anchor="end">Synchronized</text>
  <text x="161" y="36" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">64,000/s</text>
  <!-- Jittered mean: 64/s -> x end 66.7 -->
  <rect x="6" y="52" width="60.7" height="36" fill="#5e6b73" fill-opacity="0.92"/>
  <text x="72" y="67" font-size="13" fill="#333333">Jittered mean</text>
  <text x="72" y="82" font-size="13" font-weight="bold" fill="#333333">64/s</text>
  <!-- Jittered worst case: realized burst can still include every retry -> same length as synchronized -->
  <rect x="7" y="99" width="159.5" height="34" fill="#ffffff" stroke="#5e6b73" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="161" y="113" font-size="13" fill="#333333" text-anchor="end">Jittered peak</text>
  <text x="161" y="128" font-size="13" font-weight="bold" fill="#333333" text-anchor="end">up to 64,000/s</text>
  <!-- Declared log axis -->
  <line x1="6" y1="142" x2="174" y2="142" stroke="#cccccc" stroke-width="1.2"/>
  <g stroke="#999999" stroke-width="1">
    <line x1="6" y1="142" x2="6" y2="147"/>
    <line x1="39.6" y1="142" x2="39.6" y2="145"/>
    <line x1="73.2" y1="142" x2="73.2" y2="147"/>
    <line x1="106.8" y1="142" x2="106.8" y2="145"/>
    <line x1="140.4" y1="142" x2="140.4" y2="147"/>
    <line x1="174" y1="142" x2="174" y2="145"/>
  </g>
  <g font-size="12" fill="#777777" text-anchor="middle">
    <text x="6" y="161">1</text>
    <text x="73.2" y="161">100</text>
    <text x="140.4" y="161">10k /s</text>
  </g>
</svg>
