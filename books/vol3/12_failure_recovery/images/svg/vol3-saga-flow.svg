<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box-forward { fill: #f8fafc; stroke: #16a34a; stroke-width: 1.5; rx: 4; }
      .box-fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 4; }
      .box-coord { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; rx: 4; }
      .box-stack { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 3; }
      .box-comp { fill: #f8fafc; stroke: #d97706; stroke-width: 1.5; rx: 4; }
      .box-term { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 4; }
      
      .hdr-forward { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 3; }
      .hdr-fail { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; rx: 3; }
      .hdr-comp { fill: #fef3c7; stroke: #d97706; stroke-width: 1; rx: 3; }
      
      .title-fwd { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #15803d; }
      .title-fail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; }
      .title-comp { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #b45309; }
      
      .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .item-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; }
      .item-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; fill: #0f172a; }
      .coord-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .coord-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; }
      
      .stack-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #475569; }
      .stack-item { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; font-weight: 600; fill: #b45309; text-anchor: middle; }
      .stack-slot { fill: #fef3c7; stroke: #d97706; stroke-width: 1; rx: 3; }
      
      .edge-green { stroke: #16a34a; stroke-width: 1.8; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.8; fill: none; }
      .edge-amber { stroke: #d97706; stroke-width: 1.8; fill: none; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #475569; }
    </style>
    
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ================================================================= -->
  <!-- TIER 1: FORWARD SUB-TRANSACTIONS (T1 -> T2 -> T3 -> T4)           -->
  <!-- ================================================================= -->

  <!-- Step T1 -->
  <g transform="translate(40, 15)">
    <rect width="190" height="138" class="box-forward" />
    <rect x="1" y="1" width="188" height="22" class="hdr-forward" />
    <text x="10" y="16" class="title-fwd">SUB-TRANSACTION T₁</text>
    <text x="10" y="38" class="item-title">Git Scratch Branch</text>
    <text x="10" y="55" class="item-code">git worktree add -b patch</text>
    <text x="10" y="73" class="item-body">State: Local branch committed</text>
    <text x="10" y="89" class="item-body">Isolation: I = 0 (visible to tools)</text>
    <text x="10" y="105" class="item-body">Action log: Recorded in WAL</text>
    <text x="10" y="123" class="item-code" fill="#15803d">push_stack(C₁) → LIFO</text>
  </g>

  <!-- Forward arrow T1 -> T2 -->
  <line x1="230" y1="84" x2="268" y2="84" class="edge-green" marker-end="url(#arr-green)" />

  <!-- Step T2 -->
  <g transform="translate(270, 15)">
    <rect width="190" height="138" class="box-forward" />
    <rect x="1" y="1" width="188" height="22" class="hdr-forward" />
    <text x="10" y="16" class="title-fwd">SUB-TRANSACTION T₂</text>
    <text x="10" y="38" class="item-title">Provision Cloud VM</text>
    <text x="10" y="55" class="item-code">cloud.create_instance(size)</text>
    <text x="10" y="73" class="item-body">State: Instance running, IP bound</text>
    <text x="10" y="89" class="item-body">Billing: Metering started</text>
    <text x="10" y="105" class="item-body">Action log: Recorded in WAL</text>
    <text x="10" y="123" class="item-code" fill="#15803d">push_stack(C₂) → LIFO</text>
  </g>

  <!-- Forward arrow T2 -> T3 -->
  <line x1="460" y1="84" x2="498" y2="84" class="edge-green" marker-end="url(#arr-green)" />

  <!-- Step T3 -->
  <g transform="translate(500, 15)">
    <rect width="190" height="138" class="box-forward" />
    <rect x="1" y="1" width="188" height="22" class="hdr-forward" />
    <text x="10" y="16" class="title-fwd">SUB-TRANSACTION T₃</text>
    <text x="10" y="38" class="item-title">Pre-Authorize Payment</text>
    <text x="10" y="55" class="item-code">payments.authorize($50)</text>
    <text x="10" y="73" class="item-body">State: Card authorized, hold set</text>
    <text x="10" y="89" class="item-body">Funds: Reserved at bank</text>
    <text x="10" y="105" class="item-body">Action log: Recorded in WAL</text>
    <text x="10" y="123" class="item-code" fill="#15803d">push_stack(C₃) → LIFO</text>
  </g>

  <!-- Forward arrow T3 -> T4 -->
  <line x1="690" y1="84" x2="728" y2="84" class="edge-red" marker-end="url(#arr-red)" />

  <!-- Step T4 (Failed) -->
  <g transform="translate(730, 15)">
    <rect width="190" height="138" class="box-fail" />
    <rect x="1" y="1" width="188" height="22" class="hdr-fail" />
    <text x="10" y="16" class="title-fail">SUB-TRANSACTION T₄ (FAILED)</text>
    <text x="10" y="38" class="item-title" fill="#991b1b">Deploy &amp; Integration Test</text>
    <text x="10" y="55" class="item-code" fill="#991b1b">sandbox.run(test_suite)</text>
    <text x="10" y="73" class="item-body">Result: Exit 137 (OOM killed)</text>
    <text x="10" y="89" class="item-body">Trapped: Verification failure</text>
    <text x="10" y="105" class="item-body">Forward execution halted</text>
    <text x="10" y="123" class="item-code" fill="#dc2626">trigger_rollback()</text>
  </g>

  <!-- Downward alert arrow from T4 to Coordinator -->
  <path d="M 825 153 L 825 186" class="edge-red" marker-end="url(#arr-red)" />

  <!-- ================================================================= -->
  <!-- TIER 2: SAGA COORDINATION ENGINE & LIFO COMPENSATING STACK        -->
  <!-- ================================================================= -->
  <g transform="translate(40, 190)">
    <rect width="880" height="74" class="box-coord" />
    
    <!-- Left: Supervisor Logic -->
    <g transform="translate(14, 10)">
      <text x="0" y="14" class="coord-title">Saga Coordinator (Agent Harness)</text>
      <text x="0" y="33" class="coord-body">Intercept T₄ fault · stop forward dispatch</text>
      <text x="0" y="49" class="coord-body">Reverse LIFO: pop C₃, C₂, C₁</text>
    </g>

    <!-- Right: LIFO Stack Visual -->
    <g transform="translate(545, 7)">
      <rect width="320" height="58" class="box-stack" />
      <text x="10" y="15" class="stack-title">LIFO Compensation Stack (Σ):</text>
      
      <!-- Slot C1 -->
      <rect x="10" y="22" width="90" height="22" class="stack-slot" />
      <text x="55" y="36" class="stack-item">C₁ (Worktree)</text>
      
      <!-- Slot C2 -->
      <rect x="108" y="22" width="95" height="22" class="stack-slot" />
      <text x="155" y="36" class="stack-item">C₂ (Cloud VM)</text>
      
      <!-- Slot C3 (Top) -->
      <rect x="211" y="22" width="98" height="22" class="stack-slot" stroke-width="1.8" />
      <text x="260" y="36" class="stack-item">C₃ (Card Hold)</text>
      
      <text x="260" y="52" class="label-text" text-anchor="middle" font-weight="700" fill="#b45309">▲ TOP (Next Pop)</text>
    </g>
  </g>

  <!-- Connectors from Coordinator down to C3 -->
  <path d="M 805 264 L 805 285 L 690 285" class="edge-amber" marker-end="url(#arr-amber)" />

  <!-- ================================================================= -->
  <!-- TIER 3: BACKWARD COMPENSATING ACTIONS (C3 -> C2 -> C1)            -->
  <!-- ================================================================= -->

  <!-- Action C3 -->
  <g transform="translate(500, 282)">
    <rect width="190" height="138" class="box-comp" />
    <rect x="1" y="1" width="188" height="22" class="hdr-comp" />
    <text x="10" y="16" class="title-comp">COMPENSATING ACTION C₃</text>
    <text x="10" y="38" class="item-title">Release Pre-Authorization</text>
    <text x="10" y="55" class="item-code">payments.cancel(auth_id)</text>
    <text x="10" y="73" class="item-body">Target: Pre-auth from step T₃</text>
    <text x="10" y="89" class="item-body">Idempotency: Verified by token</text>
    <text x="10" y="105" class="item-body">Side effect: Auth hold released</text>
    <text x="10" y="123" class="item-code" fill="#b45309">Result: $0 Charged (Neutral)</text>
  </g>

  <!-- Reverse arrow C3 -> C2 (pointing left) -->
  <line x1="500" y1="351" x2="462" y2="351" class="edge-amber" marker-end="url(#arr-amber)" />

  <!-- Action C2 -->
  <g transform="translate(270, 282)">
    <rect width="190" height="138" class="box-comp" />
    <rect x="1" y="1" width="188" height="22" class="hdr-comp" />
    <text x="10" y="16" class="title-comp">COMPENSATING ACTION C₂</text>
    <text x="10" y="38" class="item-title">Terminate Cloud VM</text>
    <text x="10" y="55" class="item-code">cloud.delete_instance(id)</text>
    <text x="10" y="73" class="item-body">Target: VM provisioned at T₂</text>
    <text x="10" y="89" class="item-body">Idempotency: request key</text>
    <text x="10" y="105" class="item-body">Side effect: VM, IP &amp; disk freed</text>
    <text x="10" y="123" class="item-code" fill="#b45309">Result: Metering Halted</text>
  </g>

  <!-- Reverse arrow C2 -> C1 (pointing left) -->
  <line x1="270" y1="351" x2="232" y2="351" class="edge-amber" marker-end="url(#arr-amber)" />

  <!-- Action C1 -->
  <g transform="translate(40, 282)">
    <rect width="190" height="138" class="box-comp" />
    <rect x="1" y="1" width="188" height="22" class="hdr-comp" />
    <text x="10" y="16" class="title-comp">COMPENSATING ACTION C₁</text>
    <text x="10" y="38" class="item-title">Purge Git Scratch Branch</text>
    <text x="10" y="55" class="item-code">git worktree remove --force</text>
    <text x="10" y="73" class="item-body">Target: Worktree created at T₁</text>
    <text x="10" y="89" class="item-body">Idempotency: Deterministic script</text>
    <text x="10" y="105" class="item-body">Side effect: Workspace clean</text>
    <text x="10" y="123" class="item-code" fill="#b45309">Result: Git Tree Reset</text>
  </g>

  <!-- Terminal State Strip -->
  <g transform="translate(40, 436)">
    <rect width="880" height="30" class="box-term" />
    <text x="440" y="19" class="item-title" text-anchor="middle" fill="#1e293b">Unwind complete · ABORT_CONSISTENT</text>
  </g>

</svg>
