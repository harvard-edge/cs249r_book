<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#ffffff"/>

  <!-- ===== Forward operation card ===== -->
  <rect x="20" y="20" width="720" height="196" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="720" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Forward operation</text>

  <!-- F1: register before dispatch -->
  <rect x="40" y="60" width="140" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Register obligation</text>
  <text x="110" y="95" text-anchor="middle" font-size="8" fill="#475569">intent + release template</text>
  <text x="110" y="108" text-anchor="middle" font-size="8" fill="#475569">target not yet bound</text>

  <!-- F2: dispatch -->
  <rect x="220" y="60" width="140" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="290" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Dispatch</text>
  <text x="290" y="96" text-anchor="middle" font-size="8" fill="#475569" font-family="Courier New, monospace">provision_test_env_r18</text>

  <!-- F3: bind result -->
  <rect x="400" y="60" width="140" height="60" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Bind result</text>
  <text x="470" y="96" text-anchor="middle" font-size="8" fill="#475569" font-family="Courier New, monospace">env_r18_01</text>
  <text x="470" y="109" text-anchor="middle" font-size="8" fill="#475569">recorded durably</text>

  <!-- F4: integration test -->
  <rect x="580" y="60" width="140" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Integration test</text>
  <text x="650" y="96" text-anchor="middle" font-size="8" fill="#475569">checks against</text>
  <text x="650" y="109" text-anchor="middle" font-size="8" fill="#475569" font-family="Courier New, monospace">ws_r18</text>

  <!-- forward arrows -->
  <path d="M180,90 H218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M360,90 H398" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="380" y="82" text-anchor="middle" font-size="8" fill="#475569">evidence</text>
  <path d="M540,90 H578" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- reply lost branch -->
  <path d="M290,120 V148" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="298" y="138" font-size="8" fill="#b91c1c">reply lost</text>
  <rect x="200" y="150" width="180" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="290" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Outcome unknown</text>
  <text x="290" y="186" text-anchor="middle" font-size="8" fill="#475569">obligation stays open with an owner</text>

  <!-- ===== Cleanup card ===== -->
  <rect x="20" y="250" width="720" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="250" width="720" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="266" font-size="10" font-weight="700" fill="#0f172a">Registered cleanup, ordered by dependencies</text>

  <!-- predecessors -->
  <rect x="100" y="290" width="200" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="307" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Test has ended</text>
  <text x="200" y="320" text-anchor="middle" font-size="8" fill="#475569">or cancellation confirmed</text>

  <rect x="100" y="346" width="200" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="363" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Artifacts preserved</text>
  <text x="200" y="376" text-anchor="middle" font-size="8" fill="#475569">outside the environment</text>

  <path d="M300,310 H362 V330 H393" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M300,366 H362 V346 H393" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- release -->
  <rect x="395" y="308" width="150" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="330" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Release</text>
  <text x="470" y="346" text-anchor="middle" font-size="8" fill="#475569" font-family="Courier New, monospace">release_test_env_r18</text>
  <text x="470" y="359" text-anchor="middle" font-size="8" fill="#475569">own intent and attempts</text>

  <!-- outcomes -->
  <path d="M545,338 H562 V310 H583" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M545,338 H562 V366 H583" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <rect x="585" y="290" width="140" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="655" y="307" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Postcondition shown</text>
  <text x="655" y="320" text-anchor="middle" font-size="8" fill="#475569">close that obligation</text>

  <rect x="585" y="346" width="140" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="655" y="363" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Release unconfirmed</text>
  <text x="655" y="376" text-anchor="middle" font-size="8" fill="#475569">retain with an owner</text>

  <!-- binding flows into the registered cleanup -->
  <path d="M470,120 V306" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="478" y="236" font-size="8" fill="#6d28d9">binds cleanup target</text>
</svg>
