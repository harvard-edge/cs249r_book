<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#ffffff"/>

  <!-- ===== Forward lane ===== -->
  <rect x="20" y="20" width="720" height="184" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="41" font-size="13" font-weight="700" fill="#0f172a">Forward operation</text>

  <!-- register before dispatch -->
  <rect x="40" y="52" width="190" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="135" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Register obligation</text>
  <text x="135" y="94" text-anchor="middle" font-size="12" fill="#475569">target unbound</text>

  <!-- dispatch -->
  <rect x="285" y="52" width="190" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Dispatch</text>
  <text x="380" y="94" text-anchor="middle" font-size="12" fill="#475569" font-family="Courier New, monospace">provision_test_env_r18</text>

  <!-- bind on evidence -->
  <rect x="530" y="52" width="190" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="625" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Bind on evidence</text>
  <text x="625" y="94" text-anchor="middle" font-size="12" fill="#475569" font-family="Courier New, monospace">env_r18_01</text>

  <path d="M230,80 H283" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M475,80 H528" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- lost reply -->
  <path d="M380,108 V136" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="390" y="127" font-size="12" fill="#b91c1c">reply lost</text>
  <rect x="290" y="138" width="180" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="380" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Outcome unknown</text>
  <text x="380" y="175" text-anchor="middle" font-size="12" fill="#475569">obligation open, owned</text>

  <!-- ===== Cleanup lane ===== -->
  <rect x="20" y="240" width="720" height="220" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="261" font-size="13" font-weight="700" fill="#0f172a">Registered cleanup</text>

  <!-- obligation links from the forward lane: bottom-center exits, routed through the inter-panel gap -->
  <path d="M135,108 V222 H350 V303" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="342" y="274" text-anchor="end" font-size="12" fill="#6d28d9">registers</text>
  <path d="M625,108 V222 H410 V303" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="418" y="274" font-size="12" fill="#6d28d9">binds target</text>

  <!-- predecessors -->
  <rect x="40" y="280" width="180" height="46" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="130" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Test ended</text>
  <text x="130" y="317" text-anchor="middle" font-size="12" fill="#475569">or cancel confirmed</text>

  <rect x="40" y="340" width="180" height="46" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="130" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Artifacts preserved</text>
  <text x="130" y="377" text-anchor="middle" font-size="12" fill="#475569">outside the environment</text>

  <path d="M220,303 H270 V323 H298" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M220,363 H270 V343 H298" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- independent cleanup: no ordering edge -->
  <rect x="40" y="400" width="180" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="130" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">Scratch removal</text>
  <text x="130" y="434" text-anchor="middle" font-size="12" fill="#64748b">no dependency</text>

  <!-- release -->
  <rect x="300" y="305" width="160" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Release</text>
  <text x="380" y="347" text-anchor="middle" font-size="12" fill="#475569" font-family="Courier New, monospace">release_test_env_r18</text>

  <!-- release outcomes -->
  <path d="M460,333 H495 V303 H528" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M495,333 V363 H528" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="530" y="280" width="190" height="46" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="625" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Obligation closed</text>
  <text x="625" y="317" text-anchor="middle" font-size="12" fill="#475569">postcondition shown</text>

  <rect x="530" y="340" width="190" height="46" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="625" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Retained, owned</text>
  <text x="625" y="377" text-anchor="middle" font-size="12" fill="#475569">release unconfirmed</text>
</svg>
