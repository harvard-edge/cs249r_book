<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="760" height="482" fill="#ffffff"/>

  <!-- ===== Top panel: observations and retained window ===== -->
  <rect x="20" y="20" width="720" height="256" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="41" font-size="13" font-weight="700" fill="#0f172a">Captured projection of candidate <tspan font-family="Courier New, monospace">ws_r18</tspan> revisions</text>

  <!-- step indices -->
  <text x="200" y="66" text-anchor="middle" font-size="12.5" fill="#475569"><tspan font-style="italic">t</tspan> − 3</text>
  <text x="350" y="66" text-anchor="middle" font-size="12.5" fill="#475569"><tspan font-style="italic">t</tspan> − 2</text>
  <text x="500" y="66" text-anchor="middle" font-size="12.5" fill="#475569"><tspan font-style="italic">t</tspan> − 1</text>
  <text x="650" y="66" text-anchor="middle" font-size="12.5" fill="#475569"><tspan font-style="italic">t</tspan></text>

  <!-- observations: alternate between two versions, same failure -->
  <rect x="140" y="74" width="120" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Version A</text>
  <text x="200" y="113" text-anchor="middle" font-size="12" fill="#475569">same failure</text>

  <rect x="290" y="74" width="120" height="50" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="350" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Version B</text>
  <text x="350" y="113" text-anchor="middle" font-size="12" fill="#475569">same failure</text>

  <rect x="440" y="74" width="120" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Version A</text>
  <text x="500" y="113" text-anchor="middle" font-size="12" fill="#475569">same failure</text>

  <rect x="590" y="74" width="120" height="50" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="650" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Version B</text>
  <text x="650" y="113" text-anchor="middle" font-size="12" fill="#475569">same failure</text>

  <path d="M260,99 H288" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M410,99 H438" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M560,99 H588" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- retained digest window -->
  <rect x="40" y="140" width="680" height="116" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="60" y="172" font-size="13" font-weight="700" fill="#6d28d9">Retained</text>
  <text x="60" y="188" font-size="13" font-weight="700" fill="#6d28d9">window</text>
  <text x="60" y="206" font-size="12" fill="#6d28d9">last <tspan font-style="italic">m</tspan> digests</text>

  <!-- capture ticks -->
  <path d="M200,124 V158" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M350,124 V158" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M500,124 V158" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M650,124 V158" fill="none" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- digest cells -->
  <rect x="150" y="160" width="100" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="180" text-anchor="middle" font-size="12.5" fill="#0f172a">digest a</text>
  <rect x="300" y="160" width="100" height="30" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="350" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">digest b</text>
  <rect x="450" y="160" width="100" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="180" text-anchor="middle" font-size="12.5" fill="#0f172a">digest a</text>
  <rect x="600" y="160" width="100" height="30" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="650" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">digest b</text>

  <!-- recurrence match at lag 2 -->
  <path d="M350,190 V206 H650 V190" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="500" y="228" text-anchor="middle" font-size="13" fill="#b91c1c"><tspan font-style="italic">h</tspan><tspan font-size="12" dy="3">state,<tspan font-style="italic">t</tspan></tspan><tspan dy="-3" dx="3">=</tspan><tspan dx="3" font-style="italic">h</tspan><tspan font-size="12" dy="3">state,<tspan font-style="italic">t</tspan>−2</tspan><tspan dy="-3" dx="8">⇒</tspan><tspan dx="8">period</tspan><tspan dx="4" font-style="italic">ℓ</tspan><tspan dx="3">= 2</tspan></text>

  <!-- ===== Bottom panel: finding and response ===== -->
  <rect x="20" y="296" width="720" height="166" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- window feeds the finding -->
  <path d="M110,256 V352" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>

  <rect x="40" y="354" width="140" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Finding recorded</text>
  <text x="110" y="393" text-anchor="middle" font-size="12" fill="#475569">observations, rule</text>

  <rect x="230" y="354" width="140" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="300" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Admission hold</text>
  <text x="300" y="393" text-anchor="middle" font-size="12" fill="#475569">new work withheld</text>

  <path d="M180,379 H228" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- policy picks one, no fixed order -->
  <path d="M370,379 H430" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M430,334 V424" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M430,334 H478" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M430,379 H478" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M430,424 H478" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="300" y="426" text-anchor="middle" font-size="12" fill="#475569">policy selects one,</text>
  <text x="300" y="442" text-anchor="middle" font-size="12" fill="#475569">no fixed order</text>

  <rect x="480" y="316" width="240" height="36" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="600" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Bounded diagnostic continuation</text>
  <rect x="480" y="361" width="240" height="36" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="600" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Controlled backtrack</text>
  <rect x="480" y="406" width="240" height="36" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="600" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">End model-directed repair</text>
</svg>
