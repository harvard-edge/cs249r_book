<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#ffffff"/>

  <!-- ===== Observation trace ===== -->
  <rect x="20" y="20" width="720" height="190" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="720" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Captured projection of candidate <tspan font-family="Courier New, monospace">ws_r18</tspan> revisions</text>

  <!-- observation boxes -->
  <rect x="40" y="60" width="150" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="115" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Observation <tspan font-style="italic">t</tspan> − 3</text>
  <text x="115" y="96" text-anchor="middle" font-size="8" fill="#475569">version A · same failure</text>

  <rect x="220" y="60" width="150" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="295" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Observation <tspan font-style="italic">t</tspan> − 2</text>
  <text x="295" y="96" text-anchor="middle" font-size="8" fill="#475569">version B · same failure</text>

  <rect x="400" y="60" width="150" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="475" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Observation <tspan font-style="italic">t</tspan> − 1</text>
  <text x="475" y="96" text-anchor="middle" font-size="8" fill="#475569">version A · same failure</text>

  <rect x="580" y="60" width="150" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="655" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Observation <tspan font-style="italic">t</tspan></text>
  <text x="655" y="96" text-anchor="middle" font-size="8" fill="#475569">version B · same failure</text>

  <path d="M190,85 H218" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M370,85 H398" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M550,85 H578" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- digest chips -->
  <path d="M115,110 V128" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M295,110 V128" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M475,110 V128" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M655,110 V128" fill="none" stroke="#94a3b8" stroke-width="0.8"/>

  <rect x="65" y="130" width="100" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="115" y="147" text-anchor="middle" font-size="9.5" fill="#0f172a"><tspan font-style="italic">D</tspan><tspan font-size="7.5" dy="2"><tspan font-style="italic">t</tspan>−3</tspan><tspan dy="-2" dx="3">= digest a</tspan></text>

  <rect x="245" y="130" width="100" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="295" y="147" text-anchor="middle" font-size="9.5" fill="#0f172a"><tspan font-style="italic">D</tspan><tspan font-size="7.5" dy="2"><tspan font-style="italic">t</tspan>−2</tspan><tspan dy="-2" dx="3">= digest b</tspan></text>

  <rect x="425" y="130" width="100" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="475" y="147" text-anchor="middle" font-size="9.5" fill="#0f172a"><tspan font-style="italic">D</tspan><tspan font-size="7.5" dy="2"><tspan font-style="italic">t</tspan>−1</tspan><tspan dy="-2" dx="3">= digest a</tspan></text>

  <rect x="605" y="130" width="100" height="26" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="655" y="147" text-anchor="middle" font-size="9.5" fill="#0f172a"><tspan font-style="italic">D</tspan><tspan font-size="7.5" dy="2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-2" dx="3">= digest b</tspan></text>

  <!-- recurrence bracket -->
  <path d="M295,156 V172 H655 V156" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="475" y="192" text-anchor="middle" font-size="9" fill="#b91c1c"><tspan font-style="italic">D</tspan><tspan font-size="7" dy="2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-2" dx="3">=</tspan><tspan dx="3" font-style="italic">D</tspan><tspan font-size="7" dy="2"><tspan font-style="italic">t</tspan>−2</tspan><tspan dy="-2">: recurrence with period</tspan><tspan dx="3" font-style="italic">k</tspan><tspan dx="3">= 2</tspan></text>

  <!-- ===== Escalation protocol ===== -->
  <rect x="20" y="240" width="720" height="180" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="240" width="720" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="256" font-size="10" font-weight="700" fill="#0f172a">Watchdog finding and escalation protocol</text>

  <rect x="40" y="316" width="130" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="105" y="334" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Retained window</text>
  <text x="105" y="349" text-anchor="middle" font-size="8" fill="#475569">last <tspan font-style="italic">m</tspan> digests</text>

  <rect x="200" y="316" width="130" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="265" y="334" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Finding recorded</text>
  <text x="265" y="349" text-anchor="middle" font-size="8" fill="#475569">observations, rule, window</text>

  <rect x="360" y="316" width="130" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="425" y="334" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Admission hold</text>
  <text x="425" y="349" text-anchor="middle" font-size="8" fill="#475569">new work withheld</text>
  <text x="425" y="380" text-anchor="middle" font-size="8" fill="#475569">policy selects one;</text>
  <text x="425" y="392" text-anchor="middle" font-size="8" fill="#475569">no fixed order</text>

  <path d="M170,338 H198" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <path d="M330,338 H358" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>

  <!-- digests feed the window -->
  <path d="M105,210 V314" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>

  <!-- fan to responses -->
  <path d="M490,338 H514" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M514,292 V384" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M514,292 H538" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M514,338 H538" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M514,384 H538" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="540" y="274" width="180" height="36" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="630" y="295" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Bounded diagnostic continuation</text>

  <rect x="540" y="320" width="180" height="36" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="341" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Controlled backtrack</text>

  <rect x="540" y="366" width="180" height="36" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="630" y="387" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">End model-directed repair</text>
</svg>
