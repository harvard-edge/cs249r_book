<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#ffffff"/>

  <!-- ===== Breaker scope card ===== -->
  <rect x="20" y="20" width="720" height="380" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="20" width="720" height="24" rx="2" fill="#e2e8f0"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Admission gate for one dependency scope</text>

  <!-- ===== States ===== -->
  <rect x="60" y="80" width="170" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">CLOSED</text>
  <text x="145" y="120" text-anchor="middle" font-size="8" fill="#475569">calls face ordinary guards</text>

  <rect x="530" y="80" width="170" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">OPEN</text>
  <text x="615" y="120" text-anchor="middle" font-size="8" fill="#475569">new ordinary calls withheld</text>

  <rect x="295" y="230" width="170" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" font-family="Courier New, monospace">HALF_OPEN</text>
  <text x="380" y="270" text-anchor="middle" font-size="8" fill="#475569">bounded probe allowance only</text>

  <!-- CLOSED to OPEN: trip rule -->
  <path d="M230,108 H528" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="380" y="99" text-anchor="middle" font-size="9" fill="#b91c1c">|<tspan font-style="italic">W</tspan>| ≥ <tspan font-style="italic">n</tspan><tspan font-size="7" dy="2">min</tspan><tspan dy="-2" dx="3">and</tspan><tspan dx="3" font-style="italic">r</tspan> ≥ <tspan font-style="italic">r</tspan><tspan font-size="7" dy="2">trip</tspan></text>

  <!-- OPEN to HALF_OPEN: cooldown -->
  <path d="M580,136 V250 H467" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="572" y="178" text-anchor="end" font-size="9" fill="#b45309"><tspan font-style="italic">T</tspan><tspan font-size="7" dy="2">cool</tspan><tspan dy="-2" dx="3">elapsed</tspan></text>
  <text x="572" y="191" text-anchor="end" font-size="8" fill="#475569">probe slot claimed atomically</text>

  <!-- HALF_OPEN to OPEN: probe fails -->
  <path d="M465,270 H660 V138" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="560" y="290" text-anchor="middle" font-size="8.5" fill="#b91c1c">current probe fails or times out</text>
  <text x="560" y="304" text-anchor="middle" font-size="8" fill="#475569">advance <tspan font-family="Courier New, monospace">breaker_generation</tspan></text>
  <text x="560" y="319" text-anchor="middle" font-size="8.5" fill="#475569"><tspan font-style="italic">T</tspan><tspan font-size="7" dy="2">cool</tspan><tspan dy="-2" dx="3">← min(2</tspan><tspan font-style="italic">T</tspan><tspan font-size="7" dy="2">cool</tspan><tspan dy="-2">,</tspan><tspan dx="3" font-style="italic">T</tspan><tspan font-size="7" dy="-4">max</tspan><tspan font-size="7" dx="-13" dy="7">cool</tspan><tspan dy="-3">)</tspan></text>

  <!-- HALF_OPEN to CLOSED: probe succeeds -->
  <path d="M295,258 H145 V138" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="220" y="276" text-anchor="middle" font-size="8.5" fill="#15803d">current-generation</text>
  <text x="220" y="288" text-anchor="middle" font-size="8.5" fill="#15803d">probe succeeds</text>

  <!-- ===== Stale probe result ===== -->
  <rect x="60" y="340" width="200" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="160" y="357" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Late probe result</text>
  <text x="160" y="370" text-anchor="middle" font-size="8" fill="#475569">from an older generation</text>

  <path d="M260,360 H318" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>

  <rect x="320" y="340" width="200" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="420" y="357" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Operation ledger</text>
  <text x="420" y="370" text-anchor="middle" font-size="8" fill="#475569">settles its operation; no transition</text>
</svg>
