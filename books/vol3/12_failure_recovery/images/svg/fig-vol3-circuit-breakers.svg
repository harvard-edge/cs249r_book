<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#ffffff"/>

  <!-- ===== One dependency scope ===== -->
  <rect x="20" y="22" width="720" height="310" rx="4" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="720" y="42" text-anchor="end" font-size="12" font-style="italic" fill="#475569">one dependency scope</text>

  <!-- ===== States ===== -->
  <rect x="50" y="62" width="180" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d" font-family="Courier New, monospace">CLOSED</text>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#475569">ordinary guards</text>

  <rect x="530" y="62" width="180" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c" font-family="Courier New, monospace">OPEN</text>
  <text x="620" y="106" text-anchor="middle" font-size="12" fill="#475569">new calls withheld</text>

  <rect x="290" y="206" width="180" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309" font-family="Courier New, monospace">HALF_OPEN</text>
  <text x="380" y="250" text-anchor="middle" font-size="12" fill="#475569">one probe slot</text>

  <!-- CLOSED to OPEN: trip rule -->
  <path d="M230,92 H528" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="380" y="82" text-anchor="middle" font-size="13" fill="#b91c1c">|<tspan font-style="italic">W</tspan>| ≥ <tspan font-style="italic">n</tspan><tspan font-size="12" dy="3">min</tspan><tspan dy="-3" dx="4">and</tspan><tspan dx="4" font-style="italic">r</tspan> ≥ <tspan font-style="italic">r</tspan><tspan font-size="12" dy="3">trip</tspan></text>

  <!-- OPEN to HALF_OPEN: cooldown elapsed, probe slot claimed -->
  <path d="M580,122 V221 H472" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="570" y="156" text-anchor="end" font-size="13" fill="#b45309"><tspan font-style="italic">T</tspan><tspan font-size="12" dy="3">cool</tspan><tspan dy="-3" dx="4">elapsed</tspan></text>
  <text x="570" y="173" text-anchor="end" font-size="12" fill="#475569">slot claimed atomically</text>

  <!-- HALF_OPEN to OPEN: probe fails -->
  <path d="M470,251 H660 V124" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="565" y="274" text-anchor="middle" font-size="13" fill="#b91c1c">probe fails or times out</text>
  <text x="565" y="292" text-anchor="middle" font-size="12" fill="#334155">advance <tspan font-family="Courier New, monospace">breaker_generation</tspan></text>
  <text x="565" y="309" text-anchor="middle" font-size="12" fill="#334155">lengthen cooldown</text>

  <!-- HALF_OPEN to CLOSED: current-generation success -->
  <path d="M290,236 H140 V124" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="215" y="258" text-anchor="middle" font-size="13" fill="#15803d">current-generation</text>
  <text x="215" y="274" text-anchor="middle" font-size="13" fill="#15803d">probe succeeds</text>

  <!-- ===== Late result from an older generation ===== -->
  <rect x="40" y="362" width="160" height="50" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1,2"/>
  <text x="120" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Late probe result</text>
  <text x="120" y="401" text-anchor="middle" font-size="12" fill="#475569">older generation</text>

  <path d="M200,387 H238" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>

  <rect x="240" y="362" width="160" height="50" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="320" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Operation ledger</text>
  <text x="320" y="401" text-anchor="middle" font-size="12" fill="#475569">settles; no transition</text>

  <!-- ===== Cooldown per failed probe: doubles up to the cap ===== -->
  <text x="590" y="358" text-anchor="end" font-size="12.5" fill="#475569"><tspan font-style="italic">T</tspan><tspan font-size="12" dy="3">cool</tspan><tspan dy="-3" dx="4">← min(2</tspan><tspan font-style="italic">T</tspan><tspan font-size="12" dy="3">cool</tspan><tspan dy="-3">,</tspan><tspan dx="4" font-style="italic">T</tspan></text>
  <text x="591" y="361" font-size="12" fill="#475569">cool</text>
  <text x="591" y="351" font-size="12" fill="#475569">max</text>
  <text x="615" y="358" font-size="12.5" fill="#475569">)</text>

  <!-- successive failed probes run downward -->
  <path d="M448,372 V426" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  <rect x="460" y="370" width="20" height="8" fill="#94a3b8"/>
  <rect x="460" y="382" width="40" height="8" fill="#94a3b8"/>
  <rect x="460" y="394" width="80" height="8" fill="#94a3b8"/>
  <rect x="460" y="406" width="140" height="8" fill="#94a3b8"/>
  <rect x="460" y="418" width="140" height="8" fill="#94a3b8"/>
  <text x="552" y="388" font-size="12" font-style="italic" fill="#475569">per failed probe</text>
  <path d="M600,402 V430" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="608" y="426" font-size="12" fill="#475569">cap</text>
</svg>
