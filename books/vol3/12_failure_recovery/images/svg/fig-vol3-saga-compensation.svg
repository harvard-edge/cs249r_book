<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" rx="4"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title-text { font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub-text { font-size: 12px; fill: #64748b; text-anchor: middle; }
      .box-tree { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .box-prefix { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 6; }
      .box-branch-fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 6; }
      .box-branch-succ { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 6; }
      .node-hdr { font-size: 11px; font-weight: 700; }
      .node-body { font-size: 9.5px; fill: #334155; }
      .node-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.8; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
      .edge-amber { stroke: #d97706; stroke-width: 1.8; fill: none; }
      .kv-bar { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; rx: 3; }
      .kv-hdr { font-size: 10px; font-weight: 700; fill: #1e40af; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="510" y="28" class="title-text">Trajectory Search Trees and Non-Linear Saga Compensation</text>
  <text x="510" y="46" class="sub-text">Tree-of-Thoughts Rollback to Branch Points Coupled with PagedAttention KV-Cache Prefix Retention</text>

  <!-- ================================================================= -->
  <!-- TIER 1: SHARED TRUNK (ROOT S0 -> STEP T1 -> FORK POINT S2)        -->
  <!-- ================================================================= -->

  <!-- Root S0 -->
  <g transform="translate(40, 75)">
    <rect width="160" height="88" class="box-prefix"/>
    <text x="10" y="18" class="node-hdr" fill="#1e40af">Root Node S₀</text>
    <text x="10" y="34" class="node-body">Task initial state</text>
    <text x="10" y="50" class="node-mono">T₀: Initialize context</text>
    <text x="10" y="68" class="node-mono" fill="#1e40af">Prefix: 2,048 tokens</text>
  </g>

  <!-- Arrow S0 -> S1 -->
  <path d="M 200 119 L 232 119" class="edge" marker-end="url(#arr)"/>

  <!-- Step S1 -->
  <g transform="translate(235, 75)">
    <rect width="170" height="88" class="box-prefix"/>
    <text x="10" y="18" class="node-hdr" fill="#1e40af">State S₁ (Step T₁)</text>
    <text x="10" y="34" class="node-body">Git worktree created</text>
    <text x="10" y="50" class="node-mono">T₁: git worktree add</text>
    <text x="10" y="68" class="node-mono" fill="#15803d">Compensator: push(C₁)</text>
    <text x="10" y="82" class="node-mono" fill="#1e40af">Tokens: +450</text>
  </g>

  <!-- Arrow S1 -> S2 -->
  <path d="M 405 119 L 437 119" class="edge" marker-end="url(#arr)"/>

  <!-- Branch Point Node S2 -->
  <g transform="translate(440, 65)">
    <rect width="190" height="108" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" rx="6"/>
    <text x="10" y="18" class="node-hdr" fill="#1e40af">FORK POINT S₂ (Step T₂)</text>
    <text x="10" y="34" class="node-body">MicroVM sandbox provisioned</text>
    <text x="10" y="50" class="node-mono">T₂: hypervisor.create_vm()</text>
    <text x="10" y="68" class="node-mono" fill="#15803d">Compensator: push(C₂)</text>
    <text x="10" y="86" class="node-hdr" fill="#1e40af">PAGE-LOCKED BRANCH POINT</text>
    <text x="10" y="100" class="node-mono" fill="#1e40af">Retained Prefix: 3,820 tokens</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 2: EXPLORATORY BRANCH A (FAILED -> COMPENSATED UNWIND)        -->
  <!-- ================================================================= -->
  <!-- Edge S2 -> S3A (Upper branch) -->
  <path d="M 630 100 L 690 100 L 690 85 L 722 85" class="edge-red" marker-end="url(#arr-red)"/>
  <text x="650" y="78" font-size="9.5px" fill="#dc2626" font-weight="700">Branch A</text>

  <!-- Step S3A -->
  <g transform="translate(725, 55)">
    <rect width="180" height="72" class="box-branch-fail"/>
    <text x="10" y="16" class="node-hdr" fill="#991b1b">State S_{3A} (Step T_{3A})</text>
    <text x="10" y="32" class="node-body">Schema migration patch</text>
    <text x="10" y="48" class="node-mono">T_{3A}: patch_sql_tables()</text>
    <text x="10" y="64" class="node-mono" fill="#d97706">push(C_{3A}) • Tokens: +620</text>
  </g>

  <!-- Arrow S3A -> S4A -->
  <path d="M 905 91 L 925 91 L 925 150 L 905 150" class="edge-red"/>

  <!-- Step S4A: Invariant Failure -->
  <g transform="translate(725, 135)">
    <rect width="180" height="72" class="box-branch-fail"/>
    <text x="10" y="16" class="node-hdr" fill="#991b1b">State S_{4A} [FAILED]</text>
    <text x="10" y="32" class="node-body">Pytest validation failed: exit 1</text>
    <text x="10" y="48" class="node-mono">Constraint: Foreign key violation</text>
    <text x="10" y="64" class="node-mono" fill="#dc2626">HALT FORWARD PROGRESSION</text>
  </g>

  <!-- Compensating Unwind Arrow from S4A back to S2 -->
  <path d="M 725 172 L 634 172" class="edge-amber" marker-end="url(#arr-amber)"/>
  <rect x="632" y="152" width="76" height="16" fill="#fffbeb" stroke="#d97706" rx="3"/>
  <text x="670" y="163" font-size="8px" font-weight="700" fill="#b45309" text-anchor="middle">Saga Rollback</text>

  <!-- ================================================================= -->
  <!-- TIER 3: ALTERNATIVE BRANCH B (SUCCESSFUL COMPLETION)               -->
  <!-- ================================================================= -->
  <!-- Edge S2 -> S3B (Lower branch) -->
  <path d="M 535 173 L 535 250 L 592 250" class="edge-green" marker-end="url(#arr-green)"/>
  <text x="542" y="215" font-size="9px" fill="#166534" font-weight="700">Branch B</text>

  <!-- Step S3B -->
  <g transform="translate(595, 215)">
    <rect width="185" height="75" class="box-branch-succ"/>
    <text x="10" y="16" class="node-hdr" fill="#166534">State S_{3B} (Step T_{3B})</text>
    <text x="10" y="32" class="node-body">Zero-downtime shadow table</text>
    <text x="10" y="48" class="node-mono">T_{3B}: create_shadow_table()</text>
    <text x="10" y="66" class="node-mono" fill="#15803d">push(C_{3B}) • Zero re-prefill!</text>
  </g>

  <!-- Arrow S3B -> S4B -->
  <path d="M 780 252 L 812 252" class="edge-green" marker-end="url(#arr-green)"/>

  <!-- Step S4B: Goal State -->
  <g transform="translate(815, 215)">
    <rect width="180" height="75" class="box-branch-succ"/>
    <text x="10" y="16" class="node-hdr" fill="#166534">State S_{goal} (Step T_{4B})</text>
    <text x="10" y="32" class="node-body">All test suites pass: exit 0</text>
    <text x="10" y="48" class="node-mono">Deploy completed verified</text>
    <text x="10" y="66" class="node-mono" fill="#166534">COMMITTED / TERMINATED</text>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 4: HARDWARE & MEMORY HIERARCHY (KV-CACHE RETENTION LAYER)    -->
  <!-- ================================================================= -->
  <g transform="translate(40, 310)">
    <rect width="940" height="215" fill="#f8fafc" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="20" y="24" class="node-hdr" font-size="12.5px" fill="#0f172a">Physical Memory Hierarchy: Accelerator KV-Cache Retention &amp; PagedAttention Block Tables</text>

    <!-- Block 1: Shared Prefix Blocks (RETAINED) -->
    <g transform="translate(20, 38)">
      <rect width="430" height="88" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" rx="4"/>
      <text x="12" y="18" class="kv-hdr">Shared Root Prefix KV Blocks: [S₀, S₁, S₂] (3,820 Tokens)</text>
      <text x="12" y="34" class="node-body">Status: <tspan font-weight="700" fill="#1e40af">PAGE-LOCKED IN HBM</tspan> across tree search branches.</text>
      <text x="12" y="50" class="node-mono">Block IDs: #B001 - #B238 (16 tokens/block) • Memory: 1.22 GB</text>
      <text x="12" y="68" class="node-body">Saga coordination: Preserved because physical state S₂ is intact.</text>
      <text x="12" y="82" class="node-mono" fill="#166534">Savings: Zero prefill FLOPs when branching to B (saves 480 ms)</text>
    </g>

    <!-- Block 2: Branch A Blocks (EVICTED) -->
    <g transform="translate(470, 38)">
      <rect width="210" height="88" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" rx="4"/>
      <text x="10" y="18" font-size="10px" font-weight="700" fill="#991b1b">Branch A Blocks: [S_{3A}, S_{4A}]</text>
      <text x="10" y="34" class="node-body">Status: <tspan font-weight="700" fill="#dc2626">FREED / EVICTED</tspan></text>
      <text x="10" y="50" class="node-mono">Blocks #B239 - #B280</text>
      <text x="10" y="66" class="node-body">Memory reclaimed: 210 MB</text>
      <text x="10" y="80" class="node-mono" fill="#991b1b">Unwound via C_{4A}, C_{3A}</text>
    </g>

    <!-- Block 3: Branch B Blocks (ALLOCATED) -->
    <g transform="translate(700, 38)">
      <rect width="220" height="88" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" rx="4"/>
      <text x="10" y="18" font-size="10px" font-weight="700" fill="#166534">Branch B Blocks: [S_{3B}, S_{goal}]</text>
      <text x="10" y="34" class="node-body">Status: <tspan font-weight="700" fill="#166534">ACTIVE ALLOCATION</tspan></text>
      <text x="10" y="50" class="node-mono">Appends to prefix block table</text>
      <text x="10" y="66" class="node-body">Instant decode launch</text>
      <text x="10" y="80" class="node-mono" fill="#166534">Full trajectory committed</text>
    </g>

    <!-- Summary strip at bottom -->
    <g transform="translate(20, 140)">
      <rect width="900" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4"/>
      <text x="12" y="18" font-size="10.5px" font-weight="700" fill="#0f172a">MLSys Architectural Synthesis:</text>
      <text x="12" y="34" font-size="10px" fill="#334155">• <tspan font-weight="600">Selective Saga Rollback:</tspan> Compensators unwind only pruned branch sub-transactions (C_{4A} → C_{3A}), returning external state precisely to S₂.</text>
      <text x="12" y="50" font-size="10px" fill="#334155">• <tspan font-weight="600">Radix Cache Sharing:</tspan> Retaining the prompt prefix in accelerator HBM completely eliminates redundant prefill overhead, reducing branch exploration latency by 73 percent.</text>
    </g>
  </g>
</svg>
