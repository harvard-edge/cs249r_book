<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#ffffff"/>

  <!-- ===== Failure evidence ===== -->
  <rect x="290" y="20" width="180" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="380" y="41" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Failure evidence recorded</text>
  <path d="M380,54 V78" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 1: evidence class ===== -->
  <rect x="230" y="80" width="300" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="97" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">1 · Evidence class</text>
  <text x="380" y="111" text-anchor="middle" font-size="8" fill="#475569">what is known about the effect?</text>

  <path d="M300,120 V136 H170 V158" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M460,120 V136 H590 V158" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- candidate sets (dashed = candidates, not yet admitted) -->
  <rect x="60" y="160" width="220" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="170" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Outcome unknown</text>
  <text x="170" y="193" text-anchor="middle" font-size="8" fill="#475569">candidate: retry under its repeat contract</text>

  <rect x="480" y="160" width="220" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="590" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Rejected or established</text>
  <text x="590" y="193" text-anchor="middle" font-size="8" fill="#475569">candidates: new proposal, repair, compensate</text>

  <path d="M170,204 V220 H300 V238" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M590,204 V220 H460 V238" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 2: admissibility ===== -->
  <rect x="230" y="240" width="300" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="257" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">2 · Admissibility</text>
  <text x="380" y="271" text-anchor="middle" font-size="8" fill="#475569">authority, allowance and finalization reserve, deadline</text>

  <!-- none admissible exit -->
  <path d="M530,260 H660 V378" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="596" y="253" text-anchor="middle" font-size="8" fill="#b91c1c">none admissible</text>

  <path d="M380,280 V298" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 3: expected cost ===== -->
  <rect x="230" y="300" width="300" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="317" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">3 · Expected cost at a matched endpoint</text>
  <text x="380" y="332" text-anchor="middle" font-size="8.5" fill="#475569">repair first when <tspan font-style="italic">p</tspan> &gt; <tspan font-style="italic">c</tspan><tspan font-size="7" dy="2">r</tspan><tspan dy="-2"> / </tspan><tspan font-style="italic">B</tspan>, per axis</text>

  <!-- bus to admissible choices -->
  <path d="M380,340 V356" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M100,356 H520" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M100,356 V378" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M240,356 V378" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M380,356 V378" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M520,356 V378" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Five recovery choices ===== -->
  <rect x="40" y="380" width="120" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="397" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Retry existing</text>
  <text x="100" y="410" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">operation</text>

  <rect x="180" y="380" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="240" y="397" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Generate new</text>
  <text x="240" y="410" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">proposal</text>

  <rect x="320" y="380" width="120" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="397" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Repair using</text>
  <text x="380" y="410" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">feedback</text>

  <rect x="460" y="380" width="120" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="403" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Compensate</text>

  <rect x="600" y="380" width="120" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="403" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">Hold or escalate</text>
</svg>
