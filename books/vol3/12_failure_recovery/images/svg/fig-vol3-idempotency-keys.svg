<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" rx="4"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title-text { font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub-text { font-size: 12px; fill: #64748b; text-anchor: middle; }
      .column-box { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; rx: 6; }
      .col-hdr { font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; }
      .edge-ok { stroke: #16a34a; stroke-width: 1.8; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
      .edge-blue { stroke: #2563eb; stroke-width: 1.8; fill: none; }
      .msg-text { font-size: 10.5px; fill: #1e293b; }
      .msg-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .phase-rect { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .phase-lbl { font-size: 11px; font-weight: 700; fill: #334155; }
      .cache-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 4; }
      .cache-hdr { font-size: 10.5px; font-weight: 700; fill: #1e40af; }
      .annot-alert { font-size: 10px; font-weight: 600; fill: #dc2626; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="510" y="28" class="title-text">Idempotency Nonce Deduplication and At-Most-Once Tool Actuation</text>
  <text x="510" y="46" class="sub-text">Transactional Token Gateway Protocol Shielding External Side Effects Across Lossy Network Retries</text>

  <!-- 3 Participants -->
  <!-- Col 1: Agent Runtime / Supervisor (x=160) -->
  <rect x="50" y="65" width="220" height="42" class="column-box"/>
  <text x="160" y="86" class="col-hdr">Agent Runtime &amp; Supervisor</text>
  <text x="160" y="100" font-size="10px" fill="#64748b" text-anchor="middle">Agent Control Block (ACB)</text>
  <line x1="160" y1="107" x2="160" y2="515" class="lifeline"/>

  <!-- Col 2: Tool Execution Gateway & Dedup Cache (x=510) -->
  <rect x="380" y="65" width="260" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" rx="6"/>
  <text x="510" y="86" class="col-hdr" fill="#1e40af">Tool Execution Gateway</text>
  <text x="510" y="100" font-size="10px" fill="#2563eb" text-anchor="middle">Transactional Dedup Store (WAL + KV)</text>
  <line x1="510" y1="107" x2="510" y2="515" class="lifeline"/>

  <!-- Col 3: External Tool Substrate / Remote API (x=840) -->
  <rect x="730" y="65" width="220" height="42" class="column-box"/>
  <text x="840" y="86" class="col-hdr">External Tool Substrate</text>
  <text x="840" y="100" font-size="10px" fill="#64748b" text-anchor="middle">Third-Party Cloud API / Sandbox Daemon</text>
  <line x1="840" y1="107" x2="840" y2="515" class="lifeline"/>

  <!-- PHASE 1: INITIAL DISPATCH -->
  <rect x="50" y="120" width="900" height="22" class="phase-rect"/>
  <text x="60" y="135" class="phase-lbl">PHASE 1: DETERMINISTIC KEY SYNTHESIS &amp; FIRST-TIME EXECUTION (ATTEMPT 1)</text>

  <!-- Step 1: Synthesis & dispatch -->
  <path d="M 160 158 L 502 158" class="edge-blue" marker-end="url(#arr-blue)"/>
  <text x="330" y="152" class="msg-mono" text-anchor="middle" fill="#1e40af">1. exec_tool(action, params, Idempotency-Key: κ_i)</text>

  <!-- Step 2: Cache miss registration -->
  <g transform="translate(420, 172)">
    <rect width="180" height="32" class="cache-box"/>
    <text x="90" y="15" class="cache-hdr" text-anchor="middle">Dedup Lookup: MISS for κ_i</text>
    <text x="90" y="27" font-size="9px" fill="#1e40af" text-anchor="middle">State: IN_FLIGHT (escrowed in WAL)</text>
  </g>

  <!-- Step 3: Forward to External Substrate -->
  <path d="M 510 220 L 832 220" class="edge" marker-end="url(#arr)"/>
  <text x="670" y="214" class="msg-mono" text-anchor="middle">2. POST /v1/vm/create (ClientToken: κ_i)</text>

  <!-- Step 4: External Substrate commits -->
  <path d="M 840 248 L 518 248" class="edge-ok" marker-end="url(#arr-green)"/>
  <text x="670" y="242" class="msg-mono" text-anchor="middle" fill="#166534">3. 201 Created: {vm_id: "i-98f4", status: "booting"}</text>

  <!-- Step 5: Gateway commits to Dedup Store -->
  <g transform="translate(420, 260)">
    <rect width="180" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" rx="4"/>
    <text x="90" y="15" font-size="10px" font-weight="700" fill="#166534" text-anchor="middle">Dedup Commit: STATUS = COMMITTED</text>
    <text x="90" y="27" font-size="9px" fill="#166534" text-anchor="middle">Persist receipt R_i to disk (fsync)</text>
  </g>

  <!-- Step 6: Network Drop on Return Path -->
  <path d="M 510 306 L 260 306" class="edge-red"/>
  <line x1="260" y1="298" x2="276" y2="314" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="276" y1="298" x2="260" y2="314" stroke="#dc2626" stroke-width="2.5"/>
  <text x="360" y="300" class="annot-alert" text-anchor="middle">4. TCP Drop / Gateway Timeout: Response Lost</text>

  <!-- PHASE 2: RETRY & DEDUPLICATION -->
  <rect x="50" y="328" width="900" height="22" class="phase-rect"/>
  <text x="60" y="343" class="phase-lbl" fill="#b45309">PHASE 2: CLIENT RETRY INTERCEPTION &amp; CACHED RECEIPT REPLAY (ATTEMPT 2)</text>

  <!-- Step 7: Agent Retries with identical key -->
  <path d="M 160 368 L 502 368" class="edge-blue" marker-end="url(#arr-blue)"/>
  <text x="330" y="362" class="msg-mono" text-anchor="middle" fill="#1e40af">5. RETRY exec_tool(action, params, Key: κ_i)</text>

  <!-- Step 8: Gateway Dedup HIT -->
  <g transform="translate(420, 380)">
    <rect width="180" height="36" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" rx="4"/>
    <text x="90" y="15" font-size="10px" font-weight="700" fill="#b45309" text-anchor="middle">Dedup Lookup: HIT for κ_i</text>
    <text x="90" y="29" font-size="9px" fill="#b45309" text-anchor="middle">STATUS: COMMITTED (zero RPC dispatch)</text>
  </g>

  <!-- Step 9: Replay Cached Receipt -->
  <path d="M 510 435 L 168 435" class="edge-ok" marker-end="url(#arr-green)"/>
  <text x="330" y="428" class="msg-mono" text-anchor="middle" fill="#166534">6. Replay Cached Receipt: {vm_id: "i-98f4", replay: true}</text>

  <!-- Invariant box at bottom -->
  <g transform="translate(50, 455)">
    <rect width="900" height="58" fill="#f8fafc" stroke="#334155" stroke-width="1.2" rx="4"/>
    <text x="16" y="18" font-size="11px" font-weight="700" fill="#0f172a">At-Most-Once Systems Guarantee:</text>
    <text x="16" y="34" font-size="10px" fill="#334155">Deterministic nonce κ_i = SHA256(trajectory_id || step || action_hash) guarantees that network re-attempts never re-execute physical mutations.</text>
    <text x="16" y="48" class="mono-ok">Result: Exactly 1 VM provisioned; 0 duplicate billing leaks.</text>
  </g>
</svg>
