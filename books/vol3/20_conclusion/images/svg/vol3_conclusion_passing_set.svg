<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 158" width="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="164" height="158" fill="#ffffff"/>
  <!-- Base-rate effect of a check (calc-vol3-conclusion-fallacy-prices: p_valid 0.30, alpha_fa 0.05, beta_miss 0.10).
       Both bars share one 0-100% height of 110 px. Red = invalid, green = valid. -->
  <!-- Candidates: 70% invalid, 30% valid -->
  <rect x="8" y="24" width="44" height="77" fill="#dc2626"/>
  <rect x="8" y="101" width="44" height="33" fill="#16a34a"/>
  <text x="30" y="66.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">70%</text>
  <!-- Passing set: 11.5% invalid, 88.5% valid -->
  <rect x="108" y="24" width="44" height="12.65" fill="#dc2626"/>
  <rect x="108" y="36.65" width="44" height="97.35" fill="#16a34a"/>
  <text x="130" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">11.5%</text>
  <!-- check arrow -->
  <line x1="58" y1="79" x2="98" y2="79" stroke="#334155" stroke-width="1.5"/>
  <path d="M97 75 L104 79 L97 83 Z" fill="#334155"/>
  <text x="80" y="72" text-anchor="middle" font-size="11" fill="#0f172a">check</text>
  <!-- bar titles -->
  <text x="30" y="150" text-anchor="middle" font-size="11" fill="#0f172a">Candidates</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#0f172a">Passing set</text>
</svg>
