<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="470" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- PANEL A: PURE BEHAVIORAL CLONING (Quadratic Regret: O(εH²))       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="820" height="166" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="820" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">PANEL A: PURE BEHAVIORAL CLONING ON GOLDEN PATHS (Quadratic Regret: O(εH²))</text>

    <!-- Support Manifold Band (Light Blue) -->
    <rect x="15" y="32" width="395" height="46" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="25" y="44" font-size="8.0" font-weight="700" fill="#1e40af">TRAINING DISTRIBUTION SUPPORT: Expert Demonstrations supp(d_π*)</text>

    <!-- Node s0 -->
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="50" height="24" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="25" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#0369a1">s₀</text>
    </g>

    <!-- Arrow s0 -> s1 -->
    <path d="M75,60 L125,60" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="100" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" fill="#0369a1">a₀*</text>

    <!-- Node s1* -->
    <g transform="translate(125, 48)">
      <rect x="0" y="0" width="50" height="24" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="25" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#0369a1">s₁*</text>
    </g>

    <!-- Arrow s1 -> s2 -->
    <path d="M175,60 L225,60" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="200" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" fill="#0369a1">a₁*</text>

    <!-- Node s2* -->
    <g transform="translate(225, 48)">
      <rect x="0" y="0" width="50" height="24" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="25" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#0369a1">s₂*</text>
