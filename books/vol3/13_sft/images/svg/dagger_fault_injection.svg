    <path d="M275,60 L365,60" stroke="#0284c7" stroke-dasharray="3,2" stroke-width="1.2" marker-end="url(#arr-blue)"/>
    <text x="320" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" fill="#0369a1">a₂* ... a_H*</text>

    <!-- Fault Perturbation (Drops off manifold) -->
    <path d="M275,60 L315,60 L315,116 L340,116" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="322" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#b91c1c">Fault: ε</text>

    <!-- Out-of-Distribution Zone (Red wash) -->
    <rect x="340" y="86" width="275" height="66" rx="1" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="350" y="100" font-size="8.0" font-weight="700" fill="#b91c1c">OUT-OF-DISTRIBUTION CASCADE (s_t ∉ supp(d_π*))</text>

    <!-- Node s2 (Perturbed) -->
    <g transform="translate(350, 110)">
      <rect x="0" y="0" width="65" height="32" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="32" y="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#b91c1c">s₂^{pert}</text>
      <text x="32" y="25" text-anchor="middle" font-size="8.0" fill="#7f1d1d">Err: 404/Null</text>
    </g>

    <!-- Arrow to Hallucination Livelock -->
    <path d="M415,126 L475,126" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="445" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" fill="#b91c1c">a_guess</text>

    <!-- Node Livelock -->
    <g transform="translate(475, 110)">
      <rect x="0" y="0" width="125" height="32" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="62" y="14" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b91c1c">Semantic Loop Livelock</text>
      <text x="62" y="25" text-anchor="middle" font-size="8.0" fill="#7f1d1d">Repeats hallucinated calls</text>
    </g>

    <!-- Side Analysis Card (Right) -->
    <g transform="translate(635, 28)">
      <rect x="0" y="0" width="170" height="126" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="0" y="0" width="170" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#991b1b">COMPOUNDING ERROR</text>

      <text x="10" y="34" font-size="8.0" fill="#334155">Single-step error rate: ε = 0.02</text>
      <text x="10" y="46" font-size="8.0" fill="#334155">Horizon length: H = 30 steps</text>

      <rect x="10" y="54" width="150" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="14" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#b91c1c">E[Errors] ≈ ε H² / 2 = 9.3</text>

      <text x="10" y="86" font-size="8.0" fill="#7f1d1d">• Model never saw error recovery</text>
      <text x="10" y="98" font-size="8.0" fill="#7f1d1d">• Context poisoned by failures</text>
      <text x="10" y="112" font-size="8.0" font-weight="700" fill="#dc2626">Verdict: Execution Collapse</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: CLOSED-LOOP DAGGER FAULT-INJECTION (Linear Regret: O(εH)) -->
  <!-- ================================================================= -->
  <g transform="translate(40, 248)">
    <rect x="0" y="0" width="820" height="226" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="820" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PANEL B: CLOSED-LOOP DAGGER WITH ACTIVE FAULT INJECTION (Linear Regret: O(εH))</text>

    <!-- Support Manifold Band (Light Green: Broadened Support) -->
    <rect x="15" y="32" width="605" height="106" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="25" y="44" font-size="8.0" font-weight="700" fill="#15803d">BROADENED SUPPORT: Policy Exploration d_{π_θ} + Remediated Recovery Traces</text>

    <!-- State Sequence with Remediation -->
    <!-- s0 -->
    <g transform="translate(25, 52)">
      <rect x="0" y="0" width="45" height="24" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="22" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#15803d">s₀</text>
    </g>

    <!-- Arrow s0 -> s1 -->
    <path d="M70,64 L110,64" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="90" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" fill="#15803d">a₀</text>

    <!-- Node s1 -->
    <g transform="translate(110, 52)">
      <rect x="0" y="0" width="45" height="24" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="22" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#15803d">s₁</text>
    </g>

    <!-- Intentional Fault Injection Point -->
    <path d="M155,64 L190,64 L190,102 L220,102" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>
    <text x="196" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#b45309">Fault</text>

    <!-- Perturbed Node s2^{pert} -->
    <g transform="translate(220, 87)">
      <rect x="0" y="0" width="65" height="30" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="32" y="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#b45309">s₂^{pert}</text>
      <text x="32" y="25" text-anchor="middle" font-size="8.0" fill="#78350f">Stderr: EPERM</text>
    </g>

    <!-- Teacher Recovery Demonstration Arrow -->
    <path d="M285,102 L375,102" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
    <text x="330" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#6d28d9">a₂* = π*(s₂)</text>

    <!-- Remediated Node s3* -->
    <g transform="translate(375, 87)">
      <rect x="0" y="0" width="70" height="30" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="35" y="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#15803d">s₃^{fixed}</text>
      <text x="35" y="25" text-anchor="middle" font-size="8.0" fill="#14532d">chmod +x ok</text>
    </g>

    <!-- Re-entry to Golden Goal -->
    <path d="M445,102 L500,102 L500,64 L540,64" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="505" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" fill="#15803d">a_goal</text>

    <!-- Goal Node s_H* -->
    <g transform="translate(540, 52)">
      <rect x="0" y="0" width="70" height="24" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="35" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#15803d">s_H (PASS)</text>
    </g>

    <!-- DAgger Aggregation Formula -->
    <g transform="translate(15, 148)">
      <rect x="0" y="0" width="605" height="66" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.0" font-weight="700" fill="#334155">Dataset Aggregation Step:</text>
      <text x="125" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#0f172a">D_{k+1} = D_k ∪ { (s_t^{pert}, π^*(s_t^{pert})) }</text>
      <text x="10" y="34" font-size="8.0" fill="#475569">Policy learns active self-healing: training distribution matches deployment rollout distribution P_{train}(s) = d_{π}(s).</text>
      <text x="10" y="48" font-size="8.0" fill="#475569">By demonstrating remediation on injected faults, the policy converts failure states into deterministic recovery trajectories.</text>
      <text x="10" y="60" font-size="8.0" fill="#15803d" font-weight="700">• Bounded linear regret ensures robust autonomous execution over long horizon tasks (H &gt; 30).</text>
    </g>

    <!-- Side Analysis Card (Right) -->
    <g transform="translate(635, 28)">
      <rect x="0" y="0" width="170" height="186" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="170" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">BOUNDED REGRET</text>

      <text x="10" y="34" font-size="8.0" fill="#334155">Single-step error rate: ε = 0.02</text>
      <text x="10" y="48" font-size="8.0" fill="#334155">Horizon length: H = 30 steps</text>

      <rect x="10" y="58" width="150" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="14" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.0" font-weight="700" fill="#15803d">E[Errors] ≤ ε H = 0.60</text>

      <text x="10" y="96" font-size="8.0" fill="#14532d">• Errors self-corrected in 1 step</text>
      <text x="10" y="110" font-size="8.0" fill="#14532d">• No out-of-distribution livelock</text>
      <text x="10" y="124" font-size="8.0" fill="#14532d">• High multi-turn goodput</text>
      <text x="10" y="138" font-size="8.0" fill="#14532d">• Linear regret guarantee</text>
      <text x="10" y="152" font-size="8.0" fill="#14532d">• Immune to compounding drift</text>

      <rect x="10" y="162" width="150" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="85" y="174" text-anchor="middle" font-size="8.0" font-weight="700" fill="#16a34a">15.5× Reliability Gain</text>
    </g>
