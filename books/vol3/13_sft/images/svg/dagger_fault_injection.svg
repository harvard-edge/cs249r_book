<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: PURE BEHAVIORAL CLONING (y: 20 to 190)                   -->
  <!-- ================================================================= -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="850" height="175" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="0" y="0" width="850" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#b91c1c">PANEL A: PURE BEHAVIORAL CLONING ON GOLDEN PATHS (Quadratic Regret: O(εH²))</text>

    <!-- Support Manifold Band (Light Blue) -->
    <rect x="15" y="32" width="410" height="46" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="25" y="44" font-size="7" font-weight="700" fill="#1e40af">TRAINING DISTRIBUTION SUPPORT: Expert Demonstrations supp(d_π*)</text>

    <!-- Node s0 -->
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="55" height="26" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="27" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#0369a1">s₀</text>
    </g>

    <!-- Arrow s0 -> s1 -->
    <path d="M80,61 L135,61" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="107" y="55" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#0369a1">a₀*</text>

    <!-- Node s1* -->
    <g transform="translate(135, 48)">
      <rect x="0" y="0" width="55" height="26" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="27" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#0369a1">s₁*</text>
    </g>

    <!-- Arrow s1 -> s2 -->
    <path d="M190,61 L245,61" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="217" y="55" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#0369a1">a₁*</text>

    <!-- Node s2* -->
    <g transform="translate(245, 48)">
      <rect x="0" y="0" width="55" height="26" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="27" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#0369a1">s₂*</text>
    </g>

    <!-- Fault Perturbation (Drops off manifold) -->
    <path d="M300,61 L345,61 L345,126 L385,126" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="352" y="95" font-family="Courier, monospace" font-size="7" fill="#b91c1c">Fault: ε</text>

    <!-- Out-of-Distribution Zone (Red wash) -->
    <rect x="375" y="95" width="265" height="66" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="385" y="110" font-size="7.5" font-weight="700" fill="#b91c1c">OUT-OF-DISTRIBUTION CASCADE (s_t ∉ supp(d*))</text>

    <!-- Node s2 (Perturbed) -->
    <g transform="translate(385, 120)">
      <rect x="0" y="0" width="65" height="32" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="32" y="14" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">s₂^{pert}</text>
      <text x="32" y="26" text-anchor="middle" font-size="6.5" fill="#7f1d1d">Err: 404/Null</text>
    </g>

    <!-- Arrow to Hallucination Livelock -->
    <path d="M450,136 L505,136" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="477" y="130" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" fill="#b91c1c">a_guess</text>

    <!-- Node Livelock -->
    <g transform="translate(505, 120)">
      <rect x="0" y="0" width="85" height="32" rx="1" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="42" y="14" text-anchor="middle" font-size="7.2" font-weight="700" fill="#b91c1c">Semantic Loop</text>
      <text x="42" y="26" text-anchor="middle" font-size="6.5" fill="#7f1d1d">Repeats failures</text>
    </g>

    <!-- Side Analysis Card (Right) -->
    <g transform="translate(660, 32)">
      <rect x="0" y="0" width="175" height="130" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#b91c1c">COMPOUNDING ERROR</text>
      <text x="10" y="34" font-size="7.2" fill="#334155">Single-step error rate: ε = 0.02</text>
      <text x="10" y="48" font-size="7.2" fill="#334155">Horizon length: H = 30 steps</text>
      
      <rect x="10" y="58" width="155" height="22" rx="1" fill="#fee2e2"/>
      <text x="14" y="72" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#b91c1c">E[Errors] ≈ ε H² / 2 = 9.3</text>

      <text x="10" y="94" font-size="7" fill="#7f1d1d">• Model never saw error recovery</text>
      <text x="10" y="106" font-size="7" fill="#7f1d1d">• Context poisoned by failures</text>
      <text x="10" y="118" font-size="7" font-weight="700" fill="#dc2626">Verdict: Execution Collapse</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: CLOSED-LOOP DAGGER FAULT-INJECTION (y: 215 to 395)       -->
  <!-- ================================================================= -->
  <g transform="translate(25, 215)">
    <rect x="0" y="0" width="850" height="185" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="850" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#15803d">PANEL B: CLOSED-LOOP DAGGER WITH ACTIVE FAULT INJECTION (Linear Regret: O(εH))</text>

    <!-- Support Manifold Band (Light Green: Broadened Support) -->
    <rect x="15" y="32" width="630" height="100" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="25" y="44" font-size="7" font-weight="700" fill="#15803d">BROADENED SUPPORT: Policy Exploration d_{π_θ} + Remediated Recovery Traces</text>

    <!-- State Sequence with Remediation -->
    <!-- s0 -->
    <g transform="translate(25, 52)">
      <rect x="0" y="0" width="48" height="26" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="24" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#15803d">s₀</text>
    </g>

    <!-- Arrow s0 -> s1 -->
    <path d="M73,65 L118,65" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="95" y="59" text-anchor="middle" font-family="Courier, monospace" font-size="6.8" fill="#15803d">a₀</text>

    <!-- Node s1 -->
    <g transform="translate(118, 52)">
      <rect x="0" y="0" width="48" height="26" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="24" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#15803d">s₁</text>
    </g>

    <!-- Intentional Fault Injection Point -->
    <path d="M166,65 L200,65 L200,102 L230,102" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="205" y="85" font-family="Courier, monospace" font-size="6.8" font-weight="700" fill="#b45309">Fault</text>

    <!-- Perturbed Node s2^{pert} -->
    <g transform="translate(230, 87)">
      <rect x="0" y="0" width="65" height="30" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="32" y="14" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#b45309">s₂^{pert}</text>
      <text x="32" y="25" text-anchor="middle" font-size="6.5" fill="#78350f">Stderr: EPERM</text>
    </g>

    <!-- Teacher Recovery Demonstration Arrow -->
    <path d="M295,102 L385,102" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="340" y="94" text-anchor="middle" font-family="Courier, monospace" font-size="7" font-weight="700" fill="#6d28d9">a₂* = π*(s₂)</text>

    <!-- Remediated Node s3* -->
    <g transform="translate(385, 87)">
      <rect x="0" y="0" width="70" height="30" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="35" y="14" text-anchor="middle" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">s₃^{fixed}</text>
      <text x="35" y="25" text-anchor="middle" font-size="6.5" fill="#14532d">chmod +x ok</text>
    </g>

    <!-- Re-entry to Golden Goal -->
    <path d="M455,102 L510,102 L510,65 L555,65" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="515" y="85" font-family="Courier, monospace" font-size="6.8" fill="#15803d">a_goal</text>

    <!-- Goal Node s_H* -->
    <g transform="translate(555, 52)">
      <rect x="0" y="0" width="65" height="26" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="32" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#15803d">s_H (PASS)</text>
    </g>

    <!-- DAgger Aggregation Formula -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="630" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="14" font-size="7.5" font-weight="700" fill="#334155">Dataset Aggregation Step:</text>
      <text x="125" y="14" font-family="Courier, monospace" font-size="7.5" fill="#0f172a">D_{k+1} = D_k ∪ { (s_t^{pert}, π^*(s_t^{pert})) }</text>
      <text x="10" y="27" font-size="7" fill="#64748b">Policy learns self-healing: training distribution matches deployment rollout distribution P_{train}(s) = d_{π}(s)</text>
    </g>

    <!-- Side Analysis Card (Right) -->
    <g transform="translate(660, 32)">
      <rect x="0" y="0" width="175" height="142" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">BOUNDED REGRET</text>
      <text x="10" y="34" font-size="7.2" fill="#334155">Single-step error rate: ε = 0.02</text>
      <text x="10" y="48" font-size="7.2" fill="#334155">Horizon length: H = 30 steps</text>
      
      <rect x="10" y="58" width="155" height="22" rx="1" fill="#dcfce7"/>
      <text x="14" y="72" font-family="Courier, monospace" font-size="7.2" font-weight="700" fill="#15803d">E[Errors] ≤ ε H = 0.60</text>

      <text x="10" y="94" font-size="7" fill="#14532d">• Errors self-corrected in 1 step</text>
      <text x="10" y="106" font-size="7" fill="#14532d">• No out-of-distribution livelock</text>
      <text x="10" y="118" font-size="7" fill="#14532d">• High multi-turn goodput</text>
      <text x="10" y="132" font-size="7" font-weight="700" fill="#16a34a">15.5× Reliability Gain</text>
    </g>
  </g>

</svg>
