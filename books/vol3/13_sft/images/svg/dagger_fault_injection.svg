<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: PURE BEHAVIORAL CLONING (EXPOSURE BIAS & QUADRATIC DRIFT)-->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect width="920" height="210" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="920" height="32" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
    <rect y="26" width="920" height="6" fill="#fee2e2"/>
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#991b1b">
      (a) Behavior Cloning on Nominal Golden Paths: Exposure Bias &amp; Quadratic Drift O(ε H²)
    </text>
    <rect x="790" y="7" width="116" height="18" rx="3" fill="#fecaca"/>
    <text x="848" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Open-Loop Failure</text>

    <!-- Nominal Manifold Corridor (Light Blue) -->
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="420" height="44" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#1e40af">Nominal Training Support: supp(d_π*)</text>

      <!-- Trajectory Nodes -->
      <!-- s0 -->
      <rect x="15" y="18" width="42" height="20" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="36" y="32" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1d4ed8">s₀</text>

      <!-- arrow s0 -> s1 -->
      <line x1="57" y1="28" x2="88" y2="28" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text x="72" y="23" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#1d4ed8">a₀*</text>

      <!-- s1 -->
      <rect x="92" y="18" width="42" height="20" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="113" y="32" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1d4ed8">s₁*</text>

      <!-- arrow s1 -> s2 -->
      <line x1="134" y1="28" x2="165" y2="28" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text x="149" y="23" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#1d4ed8">a₁*</text>

      <!-- s2 -->
      <rect x="169" y="18" width="42" height="20" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="190" y="32" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1d4ed8">s₂*</text>

      <!-- arrow to sH -->
      <line x1="211" y1="28" x2="350" y2="28" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
      <text x="270" y="23" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#1d4ed8">a₂* ... a_H* (nominal)</text>

      <!-- sH -->
      <rect x="354" y="18" width="52" height="20" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="380" y="32" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#1d4ed8">s_H*</text>
    </g>

    <!-- Runtime Fault Perturbation Drop -->
    <path d="M 230,74 L 250,74 L 250,116 L 275,116" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="256" y="98" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#dc2626">Fault ε</text>

    <!-- Out-of-Distribution Drift Zone -->
    <g transform="translate(280, 102)">
      <rect width="360" height="50" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="15" font-size="8" font-weight="700" fill="#991b1b">Unmodeled State Space: s_t ∉ supp(d_π*)</text>

      <!-- Perturbed State s_pert -->
      <rect x="10" y="22" width="60" height="22" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="40" y="36" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#dc2626">s₂^{pert}</text>

      <!-- Arrow to Hallucination -->
      <line x1="70" y1="33" x2="115" y2="33" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
      <text x="92" y="24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#dc2626">a_{guess}</text>

      <!-- Livelock State -->
      <rect x="120" y="22" width="120" height="22" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="180" y="36" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Loop Livelock (Exit 128)</text>

      <!-- Drift Arrow -->
      <line x1="240" y1="33" x2="280" y2="33" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>

      <!-- Terminal Crash -->
      <rect x="285" y="22" width="65" height="22" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="317" y="36" text-anchor="middle" font-size="8" font-weight="700" fill="#7f1d1d">Aborted</text>
    </g>

    <!-- Mathematical Bound Box (Right) -->
    <g transform="translate(660, 46)">
      <rect width="240" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="240" height="22" rx="3" fill="#f1f5f9"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#334155">Behavior Cloning Drift Bound</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Single-step error rate: ε = 0.02, Horizon: H = 30</text>
      <rect x="10" y="44" width="220" height="24" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="120" y="60" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#dc2626">
        E[Errors] ≈ ε H² / 2 = 9.3 mistakes
      </text>
      <text x="12" y="82" font-size="8" fill="#64748b">Policy lacks error recovery demonstrations</text>
      <text x="12" y="96" font-size="8" fill="#64748b">Covariate shift leads to execution collapse</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: CLOSED-LOOP DAGGER WITH ACTIVE FAULT INJECTION           -->
  <!-- ================================================================= -->
  <g transform="translate(20, 245)">
    <rect width="920" height="215" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="920" height="32" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect y="26" width="920" height="6" fill="#f0fdf4"/>
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#166534">
      (b) Closed-Loop DAgger with Active Fault Injection: Linear Regret Bounded by O(ε H)
    </text>
    <rect x="786" y="7" width="120" height="18" rx="3" fill="#dcfce7"/>
    <text x="846" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">Closed-Loop Recovery</text>

    <!-- Broadened Manifold Corridor (Light Green) -->
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="620" height="106" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#166534">Broadened Support: Demonstration supp(d_π*) ∪ Remediated Recovery States</text>

      <!-- Nominal Path -->
      <!-- s0 -->
      <rect x="15" y="24" width="38" height="20" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="34" y="38" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#15803d">s₀</text>

      <!-- arrow s0 -> s1 -->
      <line x1="53" y1="34" x2="80" y2="34" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="66" y="29" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#15803d">a₀</text>

      <!-- s1 -->
      <rect x="84" y="24" width="38" height="20" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="103" y="38" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#15803d">s₁</text>

      <!-- Controlled Fault Injection Arrow -->
      <path d="M 122,34 L 148,34 L 148,70 L 172,70" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
      <text x="154" y="56" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" font-weight="700" fill="#b45309">Fault</text>

      <!-- Perturbed Node s2^{pert} -->
      <rect x="176" y="60" width="60" height="22" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="206" y="74" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#b45309">s₂^{pert}</text>

      <!-- Expert Oracle Demonstration Arrow -->
      <line x1="236" y1="71" x2="315" y2="71" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
      <text x="275" y="60" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#7c3aed">a₂* = π*(s₂^{pert})</text>

      <!-- Remediated Node s3^{fixed} -->
      <rect x="320" y="60" width="68" height="22" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <text x="354" y="74" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#15803d">s₃^{fixed}</text>

      <!-- Re-entry Arrow to Nominal Goal -->
      <path d="M 388,71 L 440,71 L 440,34 L 485,34" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="445" y="54" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#16a34a">re-entry</text>

      <!-- Goal Node sH -->
      <rect x="490" y="24" width="64" height="20" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="522" y="38" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="700" fill="#15803d">s_H (PASS)</text>

      <!-- Aggregation Formula Note Inside Corridor -->
      <rect x="10" y="86" width="600" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="16" y="98" font-size="8" font-weight="600" fill="#334155">Aggregation:</text>
      <text x="75" y="98" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#0f172a">D_{k+1} = D_k ∪ {(s_t^{pert}, π*(s_t^{pert}))}</text>
      <text x="330" y="98" font-size="8" fill="#15803d">→ Closed-loop distribution match: P_{train}(s) = d_π(s)</text>
    </g>

    <!-- Mathematical Bound Box (Right) -->
    <g transform="translate(660, 46)">
      <rect width="240" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="240" height="22" rx="3" fill="#f0fdf4"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#166534">DAgger Closed-Loop Bound</text>
      <text x="12" y="36" font-size="8.5" fill="#475569">Single-step error rate: ε = 0.02, Horizon: H = 30</text>
      <rect x="10" y="44" width="220" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="120" y="60" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#15803d">
        E[Errors] ≤ ε H = 0.60 mistakes
      </text>
      <text x="12" y="82" font-size="8" fill="#15803d">Single-step self-healing back to nominal</text>
      <text x="12" y="96" font-size="8" fill="#15803d">Bounded linear regret</text>
    </g>
  </g>
</svg>