<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-burgundy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1120" height="540" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SUBTITLE                                                 -->
  <!-- ================================================================= -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">
      The Trajectory Serialization Pipeline: Asynchronous Ledger to Causal Token Sequence
    </text>
    <text x="0" y="20" font-size="12" fill="#475569">
      Compiling distributed multi-turn Agent Control Block (ACB) event logs into causally isolated, role-delimited autoregressive training tensors
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- STAGE 1: ASYNCHRONOUS ACB EVENT LEDGER (LEFT)                    -->
  <!-- ================================================================= -->
  <g transform="translate(30, 70)">
    <!-- Container Card -->
    <rect width="320" height="440" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect width="320" height="38" rx="6" fill="#1E293B"/>
    <rect y="32" width="320" height="6" fill="#1E293B"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.02em">
      1. ASYNCHRONOUS ACB LEDGER
    </text>
    <rect x="222" y="10" width="86" height="18" rx="3" fill="#334155"/>
    <text x="265" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#E2E8F0">
      Ch 10 Interface
    </text>

    <!-- Subtitle description -->
    <text x="14" y="56" font-size="10.5" fill="#475569">
      Concurrent, non-blocking runtime event stream:
    </text>

    <!-- Event 0: System Init -->
    <g transform="translate(14, 68)">
      <rect width="292" height="64" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="4" height="64" rx="2" fill="#475569"/>
      <text x="12" y="16" font-size="11" font-weight="700" fill="#0F172A">Event 0: System Initialization</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="monospace" fill="#64748B">t=0.000s</text>
      <text x="12" y="32" font-size="10" fill="#334155">Task config, sandbox paths, environment variables</text>
      <text x="12" y="48" font-size="9.5" font-family="monospace" fill="#0F766E">Tool Schemas: [bash, file_read, git_commit]</text>
    </g>

    <!-- Event 1: User Query -->
    <g transform="translate(14, 140)">
      <rect width="292" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="4" height="52" rx="2" fill="#334155"/>
      <text x="12" y="16" font-size="11" font-weight="700" fill="#0F172A">Event 1: User Request (Socket)</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="monospace" fill="#64748B">t=0.042s</text>
      <text x="12" y="34" font-size="10" fill="#334155">Task intent: "Fix race condition in worker pool"</text>
    </g>

    <!-- Event 2: Assistant Generation -->
    <g transform="translate(14, 200)">
      <rect width="292" height="74" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="4" height="74" rx="2" fill="#1E293B"/>
      <text x="12" y="16" font-size="11" font-weight="700" fill="#0F172A">Event 2: Model Inference Turn</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="monospace" fill="#64748B">t=1.218s</text>
      <text x="12" y="32" font-size="10" fill="#334155">Thought: Inspect locking around work_queue...</text>
      <text x="12" y="50" font-size="9.5" font-family="monospace" fill="#1E293B">RPC Action: bash(cmd="grep -n Mutex pool.go")</text>
      <text x="12" y="64" font-size="9" fill="#64748B">Status: Candidate proposal in memory escrow</text>
    </g>

    <!-- Event 3: Concurrent Tool Execution & Environment Return -->
    <g transform="translate(14, 282)">
      <rect width="292" height="84" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="4" height="84" rx="2" fill="#991B1B"/>
      <text x="12" y="16" font-size="11" font-weight="700" fill="#991B1B">Event 3: Environment Return (I/O)</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="monospace" fill="#64748B">t=1.450s</text>
      <text x="12" y="32" font-size="9.5" font-family="monospace" fill="#334155">Exit Code: 0 | PID: 41829 | TTY: pty0</text>
      <text x="12" y="48" font-size="9.5" fill="#475569">Raw Stdout: \x1b[32m42:\x1b[0m sync.Mutex</text>
      <text x="12" y="66" font-size="9" fill="#991B1B">Volatile noise: ANSI escapes, PIDs, clocks</text>
    </g>

    <!-- Ledger Footer Note -->
    <g transform="translate(14, 376)">
      <rect width="292" height="48" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#334155">Physical Execution Reality:</text>
      <text x="10" y="32" font-size="9" fill="#475569">Out-of-order pipe buffers, background subprocesses,</text>
      <text x="10" y="43" font-size="9" fill="#475569">wall-clock jitter, unparsed return streams.</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <path d="M 350 290 L 380 290" fill="none" stroke="#1E293B" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ================================================================= -->
  <!-- STAGE 2: SERIALIZATION & HYGIENE COMPILER (CENTER)               -->
  <!-- ================================================================= -->
  <g transform="translate(385, 70)">
    <!-- Container Card -->
    <rect width="340" height="440" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Card Header -->
    <rect width="340" height="38" rx="6" fill="#0F766E"/>
    <rect y="32" width="340" height="6" fill="#0F766E"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.02em">
      2. SERIALIZATION &amp; HYGIENE ENGINE
    </text>
    <rect x="242" y="10" width="86" height="18" rx="3" fill="#115E59"/>
    <text x="285" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#CCFBF1">
      Policy Compiler
    </text>

    <!-- Pass 1: Topological Sort & Causal Isolation -->
    <g transform="translate(14, 52)">
      <rect width="312" height="74" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="20" r="10" fill="#0F766E"/>
      <text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="38" y="20" font-size="11" font-weight="700" fill="#0F172A">Causal Timeline Sorting &amp; Isolation</text>
      <text x="38" y="38" font-size="9.5" fill="#334155">Enforce strict monotonic timestamps: t &lt; T_k.</text>
      <text x="38" y="52" font-size="9.5" fill="#334155">Purge post-hoc diagnostic summaries and future diffs.</text>
      <text x="38" y="65" font-size="9" font-weight="600" fill="#991B1B">Zero temporal leakage into historical prefix.</text>
    </g>

    <!-- Pass 2: Observation Sanitization & Normalization -->
    <g transform="translate(14, 134)">
      <rect width="312" height="82" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="20" r="10" fill="#0F766E"/>
      <text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="38" y="20" font-size="11" font-weight="700" fill="#0F172A">Observation Sanitization &amp; Folding</text>
      <text x="38" y="38" font-size="9.5" fill="#334155">Strip ANSI escapes (\x1b[...m) &amp; carriage returns.</text>
      <text x="38" y="52" font-size="9.5" fill="#334155">Canonicalize JSON keys; normalize whitespace.</text>
      <text x="38" y="66" font-size="9.5" fill="#334155">Deterministic structural folding on oversized stdout:</text>
      <text x="38" y="78" font-size="9" font-family="monospace" fill="#0F766E">[retain header + tail status; fold intermediate rows]</text>
    </g>

    <!-- Pass 3: Role Delimiter Injection & Escape Validation -->
    <g transform="translate(14, 224)">
      <rect width="312" height="84" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="20" r="10" fill="#0F766E"/>
      <text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="38" y="20" font-size="11" font-weight="700" fill="#0F172A">Atomic Role Delimiter Injection</text>
      <text x="38" y="38" font-size="9.5" fill="#334155">Inject immutable tokenizer control tokens:</text>
      <text x="38" y="52" font-size="9" font-family="monospace" fill="#1E293B">&lt;|start_sys|&gt;, &lt;|start_user|&gt;, &lt;|start_asst|&gt;, &lt;|start_env|&gt;</text>
      <text x="38" y="66" font-size="9.5" fill="#334155">Sanitize observation payloads to prevent prompt spoofing.</text>
      <text x="38" y="78" font-size="9" font-weight="600" fill="#991B1B">Zero off-by-one delimiter placement errors.</text>
    </g>

    <!-- Pass 4: Structural Rationale & Action Separation -->
    <g transform="translate(14, 316)">
      <rect width="312" height="70" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="20" cy="20" r="10" fill="#0F766E"/>
      <text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
      <text x="38" y="20" font-size="11" font-weight="700" fill="#0F172A">Structural Rationale Separation</text>
      <text x="38" y="38" font-size="9.5" fill="#334155">Partition assistant turns into distinct sub-blocks:</text>
      <text x="38" y="52" font-size="9" font-family="monospace" fill="#0F766E">&lt;|thought|&gt;...&lt;|end_thought|&gt; (Deliberation)</text>
      <text x="38" y="65" font-size="9" font-family="monospace" fill="#1E293B">&lt;|call:tool|&gt;...&lt;|end_call|&gt; (Executable syntax)</text>
    </g>

    <!-- Hygiene Note -->
    <g transform="translate(14, 394)">
      <rect width="312" height="34" rx="4" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#0F766E">Compiler Invariant:</text>
      <text x="10" y="28" font-size="8.5" fill="#134E4A">Deterministic mapping: identical ACB input yields identical token buffer.</text>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <path d="M 725 290 L 755 290" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- ================================================================= -->
  <!-- STAGE 3: SERIALIZED 1D CAUSAL TOKEN STREAM (RIGHT)               -->
  <!-- ================================================================= -->
  <g transform="translate(760, 70)">
    <!-- Container Card -->
    <rect width="330" height="440" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Card Header -->
    <rect width="330" height="38" rx="6" fill="#166534"/>
    <rect y="32" width="330" height="6" fill="#166534"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.02em">
      3. SERIALIZED TOKEN SEQUENCE
    </text>
    <rect x="230" y="10" width="88" height="18" rx="3" fill="#14532D"/>
    <text x="274" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#DCFCE7">
      Training Tensor
    </text>

    <!-- Token Stream Graphic -->
    <g transform="translate(14, 52)">
      <!-- System Block -->
      <rect width="302" height="60" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect width="6" height="60" rx="2" fill="#475569"/>
      <text x="14" y="16" font-size="9" font-family="monospace" font-weight="700" fill="#475569">&lt;|start_system|&gt;</text>
      <text x="14" y="30" font-size="9.5" fill="#0F172A">System Contract, Policies &amp; Tool Schemas</text>
      <text x="14" y="44" font-size="9" font-family="monospace" fill="#64748B">{"tools": [{"name": "bash", "args": ...}]}</text>
      <text x="210" y="55" font-size="9" font-family="monospace" font-weight="700" fill="#475569">&lt;|end_system|&gt;</text>

      <!-- User Block -->
      <g transform="translate(0, 68)">
        <rect width="302" height="52" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <rect width="6" height="52" rx="2" fill="#334155"/>
        <text x="14" y="16" font-size="9" font-family="monospace" font-weight="700" fill="#334155">&lt;|start_user|&gt;</text>
        <text x="14" y="30" font-size="9.5" fill="#0F172A">Task Intent: "Resolve deadlocks in worker.go"</text>
        <text x="220" y="46" font-size="9" font-family="monospace" font-weight="700" fill="#334155">&lt;|end_user|&gt;</text>
      </g>

      <!-- Assistant Block -->
      <g transform="translate(0, 128)">
        <rect width="302" height="116" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
        <rect width="6" height="116" rx="2" fill="#0F766E"/>
        <text x="14" y="16" font-size="9" font-family="monospace" font-weight="700" fill="#0F766E">&lt;|start_assistant|&gt;</text>
        
        <!-- Thought Sub-Block -->
        <rect x="14" y="22" width="278" height="34" rx="3" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
        <text x="20" y="35" font-size="8.5" font-family="monospace" font-weight="700" fill="#0F766E">&lt;|thought|&gt; Search lock acquisitions &lt;|end_thought|&gt;</text>
        <text x="20" y="49" font-size="8.5" fill="#134E4A">Internal reasoning scratchpad preserved</text>

        <!-- Tool Call Sub-Block -->
        <rect x="14" y="60" width="278" height="36" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="20" y="73" font-size="8.5" font-family="monospace" font-weight="700" fill="#1E293B">&lt;|call:bash|&gt;</text>
        <text x="20" y="87" font-size="8.5" font-family="monospace" fill="#0F172A">{"cmd": "grep -rn 'Lock' src/"} &lt;|end_call|&gt;</text>

        <text x="190" y="110" font-size="9" font-family="monospace" font-weight="700" fill="#0F766E">&lt;|end_assistant|&gt;</text>
      </g>

      <!-- Environment Block -->
      <g transform="translate(0, 252)">
        <rect width="302" height="66" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
        <rect width="6" height="66" rx="2" fill="#991B1B"/>
        <text x="14" y="16" font-size="9" font-family="monospace" font-weight="700" fill="#991B1B">&lt;|start_environment|&gt;</text>
        <text x="14" y="30" font-size="8.5" font-family="monospace" fill="#7F1D1D">exit_code: 0 | folded_stdout:</text>
        <text x="14" y="44" font-size="8.5" font-family="monospace" fill="#334155">src/worker.go:18: mu.Lock() [...]</text>
        <text x="170" y="60" font-size="9" font-family="monospace" font-weight="700" fill="#991B1B">&lt;|end_environment|&gt;</text>
      </g>

      <!-- Forward Bridge Indicator -->
      <g transform="translate(0, 326)">
        <rect width="302" height="48" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="10" y="16" font-size="9.5" font-weight="700" fill="#166534">Forward Causal Handoff to Section 13.2:</text>
        <text x="10" y="30" font-size="8.5" fill="#14532D">Which tokens receive backpropagation gradients?</text>
        <text x="10" y="42" font-size="8.5" font-weight="600" fill="#166534">Model actions vs. Environment observation targets.</text>
      </g>
    </g>
  </g>

  <!-- Causal Attention Invariant Bar Across Bottom -->
  <g transform="translate(30, 518)">
    <rect width="1060" height="18" rx="3" fill="#1E293B"/>
    <text x="530" y="13" text-anchor="middle" font-size="9" font-weight="600" fill="#F8FAFC" letter-spacing="0.04em">
      CAUSAL ATTENTION INVARIANT: TOKEN x_t ATTENDS STRICTLY TO x_(&lt;t) — ZERO INFORMATION LEAKAGE FROM THE FUTURE (t &gt;= T_k)
    </text>
  </g>
</svg>
