<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1060" height="450" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: ASYNCHRONOUS ACB EVENT LEDGER (LEFT)                   -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Container Card -->
    <rect width="320" height="410" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    
    <!-- Pastel Header -->
    <rect width="320" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect y="28" width="320" height="6" fill="#f1f5f9"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#0f172a">1. Asynchronous ACB Event Ledger</text>
    <rect x="236" y="8" width="70" height="18" rx="3" fill="#e2e8f0"/>
    <text x="271" y="20" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Runtime Log</text>

    <!-- Subtitle -->
    <text x="14" y="52" font-size="10" fill="#475569">Non-blocking runtime event stream:</text>

    <!-- Event 0: System Init -->
    <g transform="translate(14, 62)">
      <rect width="292" height="64" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="4" height="64" rx="1" fill="#64748b"/>
      <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">Event 0: System Initialization</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#64748b">t=0.00s</text>
      <text x="12" y="32" font-size="9.5" fill="#334155">Task config, sandbox paths, environment variables</text>
      <text x="12" y="48" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0f766e">Tool Schemas: [bash, file_read, patch]</text>
    </g>

    <!-- Event 1: User Query -->
    <g transform="translate(14, 134)">
      <rect width="292" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="4" height="52" rx="1" fill="#3b82f6"/>
      <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">Event 1: User Request (Socket)</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#64748b">t=0.04s</text>
      <text x="12" y="34" font-size="9.5" fill="#334155">Task intent: "Fix race condition in worker pool"</text>
    </g>

    <!-- Event 2: Assistant Generation -->
    <g transform="translate(14, 194)">
      <rect width="292" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="4" height="74" rx="1" fill="#7c3aed"/>
      <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">Event 2: Model Inference Turn</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#64748b">t=1.22s</text>
      <text x="12" y="32" font-size="9.5" fill="#334155">Thought: Inspect locking around work_queue...</text>
      <text x="12" y="48" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#4f46e5">RPC Action: bash(cmd="grep -n Mutex pool.go")</text>
      <text x="12" y="64" font-size="9" fill="#64748b">Status: Candidate proposal in memory escrow</text>
    </g>

    <!-- Event 3: Environment Return -->
    <g transform="translate(14, 276)">
      <rect width="292" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="4" height="76" rx="1" fill="#dc2626"/>
      <text x="12" y="16" font-size="10" font-weight="700" fill="#991b1b">Event 3: Environment Return (I/O)</text>
      <text x="280" y="16" text-anchor="end" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#64748b">t=1.45s</text>
      <text x="12" y="32" font-size="9" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#334155">Exit: 0 | PID: 41829 | TTY: pty0</text>
      <text x="12" y="48" font-size="9" fill="#475569">Raw Stdout: \x1b[32m42:\x1b[0m sync.Mutex</text>
      <text x="12" y="64" font-size="8.5" fill="#dc2626">Volatile noise: ANSI escapes, PID, clocks</text>
    </g>

    <!-- Footer Note -->
    <g transform="translate(14, 360)">
      <rect width="292" height="38" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="15" font-size="9" font-weight="600" fill="#334155">Physical Execution Reality:</text>
      <text x="10" y="28" font-size="8.5" fill="#64748b">Out-of-order buffers, clock jitter, unparsed returns</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <path d="M 340 225 L 368 225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: SERIALIZATION & HYGIENE COMPILER (CENTER)              -->
  <!-- ================================================================= -->
  <g transform="translate(370, 20)">
    <!-- Container Card -->
    <rect width="320" height="410" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Pastel Header -->
    <rect width="320" height="34" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
    <rect y="28" width="320" height="6" fill="#f0fdfa"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#0f766e">2. Serialization &amp; Hygiene Engine</text>
    <rect x="232" y="8" width="74" height="18" rx="3" fill="#ccfbf1"/>
    <text x="269" y="20" text-anchor="middle" font-size="9" font-weight="600" fill="#0f766e">Compiler</text>

    <!-- Pass 1: Causal Sort -->
    <g transform="translate(14, 46)">
      <rect width="292" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0f766e"/>
      <text x="18" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
      <text x="34" y="19" font-size="10" font-weight="700" fill="#0f172a">Causal Sorting &amp; Monotonicity</text>
      <text x="12" y="38" font-size="9" fill="#334155">Enforce strict monotonic timestamps: t &lt; T_k</text>
      <text x="12" y="52" font-size="9" fill="#334155">Purge post-hoc summaries and backported diffs</text>
      <text x="12" y="66" font-size="8.5" font-weight="600" fill="#b91c1c">Zero temporal leakage into historical prefix</text>
    </g>

    <!-- Pass 2: Observation Sanitization -->
    <g transform="translate(14, 126)">
      <rect width="292" height="78" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0f766e"/>
      <text x="18" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
      <text x="34" y="19" font-size="10" font-weight="700" fill="#0f172a">Observation Sanitization &amp; Folding</text>
      <text x="12" y="38" font-size="9" fill="#334155">Strip ANSI escapes (\x1b[...m) &amp; carriage returns</text>
      <text x="12" y="52" font-size="9" fill="#334155">Canonicalize JSON keys; normalize whitespace</text>
      <text x="12" y="66" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0f766e">Deterministic folding on oversized stdout</text>
    </g>

    <!-- Pass 3: Role Delimiter Injection -->
    <g transform="translate(14, 210)">
      <rect width="292" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0f766e"/>
      <text x="18" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
      <text x="34" y="19" font-size="10" font-weight="700" fill="#0f172a">Atomic Role Delimiter Injection</text>
      <text x="12" y="38" font-size="9" fill="#334155">Inject immutable tokenizer control tokens:</text>
      <text x="12" y="52" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#1e293b">&lt;|start_sys|&gt;, &lt;|start_user|&gt;, &lt;|start_asst|&gt;</text>
      <text x="12" y="68" font-size="8.5" font-weight="600" fill="#991b1b">Escape sanitization prevents prompt injection</text>
    </g>

    <!-- Pass 4: Structural Rationale Separation -->
    <g transform="translate(14, 296)">
      <rect width="292" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0f766e"/>
      <text x="18" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
      <text x="34" y="19" font-size="10" font-weight="700" fill="#0f172a">Deliberation &amp; Action Separation</text>
      <text x="12" y="38" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0f766e">&lt;|thought|&gt;...&lt;|end_thought|&gt; (Deliberation)</text>
      <text x="12" y="54" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#4f46e5">&lt;|call:tool|&gt;...&lt;|end_call|&gt; (RPC syntax)</text>
    </g>

    <!-- Compiler Invariant Note -->
    <g transform="translate(14, 368)">
      <rect width="292" height="30" rx="3" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
      <text x="10" y="19" font-size="8.5" font-weight="600" fill="#0f766e">Deterministic: identical ACB log → identical token buffer</text>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <path d="M 690 225 L 718 225" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: SERIALIZED 1D CAUSAL TOKEN STREAM (RIGHT)              -->
  <!-- ================================================================= -->
  <g transform="translate(720, 20)">
    <!-- Container Card -->
    <rect width="320" height="410" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Pastel Header -->
    <rect width="320" height="34" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect y="28" width="320" height="6" fill="#f0fdf4"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#166534">3. Serialized Token Sequence x₁:S</text>
    <rect x="228" y="8" width="78" height="18" rx="3" fill="#dcfce7"/>
    <text x="267" y="20" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">Training Batch</text>

    <!-- Token Stream Graphic -->
    <g transform="translate(14, 46)">
      <!-- System Block -->
      <rect width="292" height="62" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="4" height="62" rx="1" fill="#64748b"/>
      <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#475569">&lt;|start_system|&gt;</text>
      <text x="12" y="30" font-size="9" fill="#0f172a">System Contract, Policies &amp; Tool Schemas</text>
      <text x="12" y="44" font-size="8" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#64748b">{"tools": [{"name": "bash", "args": ...}]}</text>
      <text x="280" y="55" text-anchor="end" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#475569">&lt;|end_system|&gt;</text>

      <!-- User Block -->
      <g transform="translate(0, 68)">
        <rect width="292" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="4" height="52" rx="1" fill="#3b82f6"/>
        <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#2563eb">&lt;|start_user|&gt;</text>
        <text x="12" y="30" font-size="9" fill="#0f172a">Intent: "Resolve race condition in worker pool"</text>
        <text x="280" y="45" text-anchor="end" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#2563eb">&lt;|end_user|&gt;</text>
      </g>

      <!-- Assistant Block -->
      <g transform="translate(0, 126)">
        <rect width="292" height="114" rx="3" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
        <rect width="4" height="114" rx="1" fill="#7c3aed"/>
        <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#7c3aed">&lt;|start_assistant|&gt;</text>
        
        <!-- Thought Sub-Block -->
        <rect x="10" y="22" width="272" height="34" rx="2" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
        <text x="16" y="36" font-size="8" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#6b21a8">&lt;|thought|&gt; Search lock acquisitions &lt;|end_thought|&gt;</text>
        <text x="16" y="49" font-size="8" fill="#581c87">Internal reasoning scratchpad preserved</text>

        <!-- Tool Call Sub-Block -->
        <rect x="10" y="60" width="272" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="16" y="73" font-size="8" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#1e293b">&lt;|call:bash|&gt;</text>
        <text x="16" y="86" font-size="8" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#0f172a">{"cmd": "grep -rn 'Lock' src/"} &lt;|end_call|&gt;</text>

        <text x="280" y="107" text-anchor="end" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#7c3aed">&lt;|end_assistant|&gt;</text>
      </g>

      <!-- Environment Block -->
      <g transform="translate(0, 246)">
        <rect width="292" height="66" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <rect width="4" height="66" rx="1" fill="#dc2626"/>
        <text x="12" y="16" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#dc2626">&lt;|start_environment|&gt;</text>
        <text x="12" y="30" font-size="8" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#7f1d1d">exit_code: 0 | folded_stdout:</text>
        <text x="12" y="44" font-size="8" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#334155">src/worker.go:18: mu.Lock() [...]</text>
        <text x="280" y="58" text-anchor="end" font-size="8.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-weight="700" fill="#dc2626">&lt;|end_environment|&gt;</text>
      </g>

      <!-- Autoregressive Position Axis -->
      <g transform="translate(0, 320)">
        <line x1="10" y1="18" x2="282" y2="18" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate)"/>
        <text x="146" y="12" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Autoregressive Causal Order: t = 1, 2, ..., S</text>
        <text x="10" y="32" font-size="8" fill="#64748b">x₁ (system)</text>
        <text x="120" y="32" font-size="8" fill="#64748b">x_t (action)</text>
        <text x="240" y="32" font-size="8" fill="#64748b">x_S (obs)</text>
      </g>
    </g>
  </g>
</svg>
