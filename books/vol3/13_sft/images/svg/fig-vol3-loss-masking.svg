<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1060" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- TOP CARD: TOKEN SEQUENCE & LOSS MASK ALIGNMENT                    -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect width="1020" height="190" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="1020" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect y="26" width="1020" height="6" fill="#f1f5f9"/>
    <text x="14" y="21" font-size="12" font-weight="700" fill="#0f172a">Token stream and masking vector m</text>
    <text x="1006" y="21" text-anchor="end" font-size="9.5" font-family="'SFMono-Regular', Consolas, Menlo, monospace" fill="#64748b">T = 6 Token Strata</text>

    <!-- Token Blocks Row -->
    <g transform="translate(15, 46)">
      <!-- System Prompt -->
      <g transform="translate(0, 0)">
        <rect width="150" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="4" height="74" rx="1" fill="#64748b"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#334155">System Prompt</text>
        <text x="10" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#475569">&lt;|start_sys|&gt;</text>
        <text x="10" y="46" font-size="8" fill="#64748b">"You are an agent..."</text>
        <text x="10" y="62" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#475569">&lt;|end_sys|&gt;</text>
      </g>

      <!-- User Instruction -->
      <g transform="translate(160, 0)">
        <rect width="150" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="4" height="74" rx="1" fill="#3b82f6"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#1e40af">User Instruction</text>
        <text x="10" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#2563eb">&lt;|start_user|&gt;</text>
        <text x="10" y="46" font-size="8" fill="#64748b">"Fix bug in auth.py"</text>
        <text x="10" y="62" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#2563eb">&lt;|end_user|&gt;</text>
      </g>

      <!-- Agent Thought -->
      <g transform="translate(320, 0)">
        <rect width="160" height="74" rx="3" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
        <rect width="4" height="74" rx="1" fill="#7c3aed"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#6d28d9">Agent Deliberation</text>
        <text x="10" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#7c3aed">&lt;|thought|&gt;</text>
        <text x="10" y="46" font-size="8" fill="#6b21a8">"Inspect auth logic..."</text>
        <text x="10" y="62" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#7c3aed">&lt;|end_thought|&gt;</text>
      </g>

      <!-- Agent Tool Action -->
      <g transform="translate(490, 0)">
        <rect width="170" height="74" rx="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
        <rect width="4" height="74" rx="1" fill="#7c3aed"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#6d28d9">Tool Action (RPC)</text>
        <text x="10" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#5b21b6">&lt;|call:bash|&gt;</text>
        <text x="10" y="46" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" fill="#4c1d95">{"cmd": "pytest auth/"}</text>
        <text x="10" y="62" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#5b21b6">&lt;|end_call|&gt;</text>
      </g>

      <!-- Environment Observation -->
      <g transform="translate(670, 0)">
        <rect width="170" height="74" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
        <rect width="4" height="74" rx="1" fill="#dc2626"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#991b1b">Environment Obs</text>
        <text x="10" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#dc2626">&lt;|start_obs|&gt;</text>
        <text x="10" y="46" font-size="8" fill="#7f1d1d">FAILED test_jwt: 401</text>
        <text x="10" y="62" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#dc2626">&lt;|end_obs|&gt;</text>
      </g>

      <!-- Agent Remediation -->
      <g transform="translate(850, 0)">
        <rect width="140" height="74" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <rect width="4" height="74" rx="1" fill="#16a34a"/>
        <text x="10" y="16" font-size="10" font-weight="700" fill="#15803d">Remediation Action</text>
        <text x="10" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#15803d">&lt;|call:patch|&gt;</text>
        <text x="10" y="46" font-size="8" fill="#166534">Apply key fix</text>
        <text x="10" y="62" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#15803d">&lt;|end_call|&gt;</text>
      </g>
    </g>

    <!-- Loss Mask Indicator Row -->
    <g transform="translate(15, 134)">
      <!-- System Mask: 0 -->
      <g transform="translate(15, 0)">
        <rect width="120" height="34" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="60" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#475569">m_t = 0</text>
        <text x="60" y="28" text-anchor="middle" font-size="8" fill="#64748b">Context Only</text>
      </g>

      <!-- User Mask: 0 -->
      <g transform="translate(175, 0)">
        <rect width="120" height="34" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="60" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#475569">m_t = 0</text>
        <text x="60" y="28" text-anchor="middle" font-size="8" fill="#64748b">Context Only</text>
      </g>

      <!-- Thought Mask: 1 -->
      <g transform="translate(340, 0)">
        <rect width="120" height="34" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="60" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#6d28d9">m_t = 1</text>
        <text x="60" y="28" text-anchor="middle" font-size="8" font-weight="600" fill="#7c3aed">Active Gradient</text>
      </g>

      <!-- Action Mask: 1 -->
      <g transform="translate(515, 0)">
        <rect width="120" height="34" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="60" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#6d28d9">m_t = 1</text>
        <text x="60" y="28" text-anchor="middle" font-size="8" font-weight="600" fill="#7c3aed">Active Gradient</text>
      </g>

      <!-- Observation Mask: 0 -->
      <g transform="translate(695, 0)">
        <rect width="120" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="60" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#dc2626">m_t = 0</text>
        <text x="60" y="28" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">Masked Observation</text>
      </g>

      <!-- Action 2 Mask: 1 -->
      <g transform="translate(860, 0)">
        <rect width="120" height="34" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="60" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#15803d">m_t = 1</text>
        <text x="60" y="28" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">Active Gradient</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SECTION: GRADIENT BACKPROPAGATION CIRCUIT (LEFT & RIGHT)   -->
  <!-- ================================================================= -->
  <!-- Left Panel: Selective Normalization & Loss Optimization -->
  <g transform="translate(20, 225)">
    <rect width="500" height="235" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="500" height="32" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <rect y="26" width="500" height="6" fill="#ede9fe"/>
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#6d28d9">Supervised Gradient Injection &amp; Selective Normalization</text>

    <!-- Math Box -->
    <g transform="translate(14, 44)">
      <rect width="472" height="42" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <text x="236" y="26" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" font-weight="700" fill="#4c1d95">
        L_SFT(θ) = - (1 / Σ m_t) · Σ [ m_t · log P_θ( x_t | x_&lt;t ) ]
      </text>
    </g>

    <!-- Gradient Flow Explanation -->
    <g transform="translate(14, 96)">
      <!-- Closed Switch (Active m_t = 1) -->
      <rect width="472" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="20" cy="18" r="8" fill="#7c3aed"/>
      <text x="20" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">✓</text>
      <text x="36" y="18" font-size="10" font-weight="700" fill="#0f172a">Active Tokens (m_t = 1): Closed Circuit</text>
      <text x="36" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#6d28d9">∂L/∂z_t = p_t - y_t ≠ 0</text>
      <text x="195" y="32" font-size="8.5" fill="#334155">→ Error backpropagates into Transformer weights ΔW</text>
      <text x="36" y="46" font-size="8.5" fill="#475569">Updates model deliberation, planning, schema binding, and RPC call syntax.</text>

      <!-- Open Switch (Masked m_t = 0) -->
      <g transform="translate(0, 62)">
        <rect width="472" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="20" cy="18" r="8" fill="#dc2626"/>
        <text x="20" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">✗</text>
        <text x="36" y="18" font-size="10" font-weight="700" fill="#991b1b">Masked Tokens (m_t = 0): Severed Circuit</text>
        <text x="36" y="32" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" fill="#dc2626">∂L/∂z_t = 0</text>
        <text x="120" y="32" font-size="8.5" fill="#334155">Zero gradient signal</text>
        <text x="36" y="46" font-size="8.5" fill="#475569">No backprop through env or prompt</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: Causal Protection vs Unmasked Hazards -->
  <g transform="translate(540, 225)">
    <rect width="500" height="235" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="500" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <rect y="26" width="500" height="6" fill="#fee2e2"/>
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#991b1b">Causal Isolation vs. Systems Hazards of Unmasked Training</text>

    <g transform="translate(14, 44)">
      <!-- Hazard 1: Hallucinated Simulation -->
      <rect width="472" height="50" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
      <rect width="4" height="50" rx="1" fill="#dc2626"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. Hallucinated Environment Simulation</text>
      <text x="12" y="30" font-size="8.5" fill="#334155">Predicting stdout burns world state into weights</text>
      <text x="12" y="42" font-size="8.5" fill="#475569">Model fabricates tool returns</text>

      <!-- Hazard 2: Gradient Swamping -->
      <g transform="translate(0, 58)">
        <rect width="472" height="50" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
        <rect width="4" height="50" rx="1" fill="#dc2626"/>
        <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">B. Gradient Swamping &amp; Loss Dilution</text>
        <text x="12" y="30" font-size="8.5" fill="#334155">A single 10k-token compiler dump inflates divisor Σ L_b and dominates backprop.</text>
        <text x="12" y="42" font-size="8.5" fill="#475569">Dilutes call-argument gradient by &gt;95%</text>
      </g>

      <!-- Hazard 3: Causal Boundary Violation -->
      <g transform="translate(0, 116)">
        <rect width="472" height="58" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <rect width="4" height="58" rx="1" fill="#16a34a"/>
        <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">C. Architectural Invariant: Causal Boundary Enforcement</text>
        <text x="12" y="30" font-size="8.5" fill="#334155">Env lies outside the parameter manifold</text>
        <text x="12" y="44" font-size="8.5" font-weight="600" fill="#166534">Enforcing m_t = 0 on all environment tokens guarantees proper credit assignment.</text>
      </g>
    </g>
  </g>
</svg>