<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803d"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e40af"/>
    </marker>
  </defs>

  <rect width="940" height="400" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: MEMORIZED EXECUTION (STATIC WEIGHTS)                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="410" height="350" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="30" rx="3" fill="#ffe4e6"/>
    <text x="14" y="20" font-size="10.5" font-weight="700" fill="#9f1239">(a) Memorized Execution (Static Parameter Dominance)</text>

    <!-- Context Schema Injection -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="370" height="46" rx="2" fill="#ffffff" stroke="#fda4af" stroke-width="0.8"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#475569">In-Context Tool Schema (Prompt)</text>
      <text x="12" y="34" font-family="Courier, monospace" font-size="9" font-weight="600" fill="#0f172a">{"cmd": "create_cluster", "cluster-id": str}</text>
    </g>

    <!-- Attention Flow (Attenuated) -->
    <g transform="translate(20, 108)">
      <line x1="80" y1="0" x2="80" y2="40" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
      <text x="90" y="22" font-size="8" font-weight="600" fill="#b91c1c">Attenuated Cross-Attention (α = 0.04)</text>
    </g>

    <!-- FFN Static Projection -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="370" height="60" rx="2" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
      <rect x="0" y="0" width="370" height="20" fill="#ffe4e6"/>
      <text x="10" y="14" font-size="8.5" font-weight="700" fill="#9f1239">FFN MEMORIZED PROJECTION LAYER</text>
      <text x="12" y="36" font-size="8" fill="#475569">Direct associative recall from pretraining weights:</text>
      <text x="12" y="50" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#991b1b">Emits: --cluster-name &lt;id&gt; (Obsolete Syntax)</text>
    </g>

    <!-- Dispatch & Error -->
    <g transform="translate(20, 230)">
      <line x1="185" y1="0" x2="185" y2="30" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-red)"/>
      <rect x="30" y="35" width="310" height="42" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
      <text x="185" y="52" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">HTTP 400 Validation Failure</text>
      <text x="185" y="66" font-size="7.5" fill="#b91c1c" text-anchor="middle">Error: Unknown argument '--cluster-name'. Required: '--cluster-id'</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: DYNAMIC CONTEXT-CONDITIONED EXECUTION                    -->
  <!-- ================================================================= -->
  <g transform="translate(490, 24)">
    <rect x="0" y="0" width="410" height="350" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="0" y="0" width="410" height="30" rx="3" fill="#dcfce7"/>
    <text x="14" y="20" font-size="10.5" font-weight="700" fill="#166534">(b) Context-Conditioned Execution (Dynamic Attention Routing)</text>

    <!-- Context Schema Injection -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="370" height="46" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#475569">In-Context Tool Schema (Prompt)</text>
      <text x="12" y="34" font-family="Courier, monospace" font-size="9" font-weight="600" fill="#0f172a">{"cmd": "create_cluster", "cluster-id": str}</text>
    </g>

    <!-- Attention Flow (Active) -->
    <g transform="translate(20, 108)">
      <line x1="80" y1="0" x2="80" y2="40" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-green)"/>
      <text x="90" y="22" font-size="8" font-weight="700" fill="#15803d">Active Cross-Attention Binding (α = 0.89)</text>
    </g>

    <!-- Dynamic Attention Routing -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="370" height="60" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <rect x="0" y="0" width="370" height="20" fill="#dcfce7"/>
      <text x="10" y="14" font-size="8.5" font-weight="700" fill="#15803d">ATTENTION-CONDITIONED EMISSION LAYER</text>
      <text x="12" y="36" font-size="8" fill="#475569">Token emission grounded in prompt schema key tokens:</text>
      <text x="12" y="50" font-family="Courier, monospace" font-size="9" font-weight="700" fill="#166534">Emits: --cluster-id &lt;id&gt; (Late-Bound Match)</text>
    </g>

    <!-- Dispatch & Success -->
    <g transform="translate(20, 230)">
      <line x1="185" y1="0" x2="185" y2="30" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
      <rect x="30" y="35" width="310" height="42" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="185" y="52" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">HTTP 200 OK / Schema Invariant Preserved</text>
      <text x="185" y="66" font-size="7.5" fill="#166534" text-anchor="middle">Exact argument match: policy dynamically respects active schema</text>
    </g>
  </g>
</svg>
