<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="490" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- SECTION 1: TOKEN SEQUENCE & ROLE SEGMENTATION                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect width="880" height="152" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="880" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0f172a">1. TRAJECTORY TOKEN STREAM &amp; ROLE SEGMENTATION</text>

    <!-- Token Blocks Row -->
    <g transform="translate(15, 34)">
      <!-- System Prompt -->
      <g transform="translate(0, 0)">
        <rect width="140" height="58" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#334155">System Prompt</text>
        <text x="10" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#475569">&lt;|system|&gt;</text>
        <text x="10" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#64748b">"You are an agent..."</text>
      </g>

      <!-- User Instruction -->
      <g transform="translate(150, 0)">
        <rect width="140" height="58" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#334155">User Instruction</text>
        <text x="10" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#475569">&lt;|user|&gt;</text>
        <text x="10" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#64748b">"Fix bug in auth.py"</text>
      </g>

      <!-- Assistant Thought + Tool Call -->
      <g transform="translate(300, 0)">
        <rect width="175" height="58" rx="1" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#6d28d9">Agent Action 1</text>
        <rect x="102" y="5" width="65" height="15" rx="1" fill="#ede9fe"/>
        <text x="134" y="16" font-size="7" font-weight="700" fill="#6d28d9" text-anchor="middle">SUPERVISED</text>
        <text x="10" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.2" fill="#7c3aed">&lt;|thought|&gt; Inspect repo...</text>
        <text x="10" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.2" fill="#5b21b6">&lt;|call:run_cmd(ls)|&gt;</text>
      </g>

      <!-- Tool Execution Observation -->
      <g transform="translate(485, 0)">
        <rect width="175" height="58" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#991b1b">Environment Obs</text>
        <rect x="92" y="5" width="75" height="15" rx="1" fill="#fee2e2"/>
        <text x="129" y="16" font-size="7" font-weight="700" fill="#dc2626" text-anchor="middle">UNSUPERVISED</text>
        <text x="10" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.2" fill="#dc2626">&lt;|observation|&gt;</text>
        <text x="10" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#991b1b">stdout: "auth.py test.py"</text>
      </g>

      <!-- Assistant Recovery / Patch -->
      <g transform="translate(670, 0)">
        <rect width="180" height="58" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Agent Action 2</text>
        <rect x="105" y="5" width="67" height="15" rx="1" fill="#dcfce7"/>
        <text x="138" y="16" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">SUPERVISED</text>
        <text x="10" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.2" fill="#16a34a">&lt;|thought|&gt; Found bug...</text>
        <text x="10" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.2" fill="#15803d">&lt;|call:patch_file(diff)|&gt;</text>
      </g>
    </g>

    <!-- Loss Mask Indicator Row -->
    <g transform="translate(15, 102)">
      <!-- System Mask: 0 -->
      <g transform="translate(15, 0)">
        <rect width="110" height="24" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="55" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#475569">M_t = 0 (Ignore)</text>
      </g>

      <!-- User Mask: 0 -->
      <g transform="translate(165, 0)">
        <rect width="110" height="24" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="55" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#475569">M_t = 0 (Ignore)</text>
      </g>

      <!-- Action 1 Mask: 1 -->
      <g transform="translate(332, 0)">
        <rect width="110" height="24" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="55" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#6d28d9">M_t = 1 (Active)</text>
      </g>

      <!-- Obs 1 Mask: 0 -->
      <g transform="translate(517, 0)">
        <rect width="110" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="55" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">M_t = 0 (Masked)</text>
      </g>

      <!-- Action 2 Mask: 1 -->
      <g transform="translate(705, 0)">
        <rect width="110" height="24" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="55" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#15803d">M_t = 1 (Active)</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SECTION 2 & 3: OBJECTIVE & FAILURE MODES                          -->
  <!-- ================================================================= -->
  <!-- Left Box: Masked Cross-Entropy Loss -->
  <g transform="translate(40, 234)">
    <rect width="430" height="172" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="430" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">2. MASKED TRAJECTORY CROSS-ENTROPY LOSS</text>

    <g transform="translate(15, 34)">
      <rect width="400" height="38" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="200" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#4c1d95" text-anchor="middle">
        L(θ) = - [ 1 / Σ M_t ] · Σ [ M_t · log P_θ( x_t | x_&lt;t ) ]
      </text>

      <g transform="translate(0, 48)">
        <text x="0" y="12" font-size="7.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">Selective Normalization:</tspan> Loss is averaged strictly over active policy tokens (Σ M_t).</text>
        <text x="0" y="26" font-size="7.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">Eliminates Loss Dilution:</tspan> Prevents multi-kilotoken tool dumps from drowning agent loss.</text>
        <text x="0" y="40" font-size="7.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">Targeted Parameter Updates:</tspan> Gradients update model reasoning, planning, and tool schemas.</text>
        <text x="0" y="54" font-size="7.5" fill="#15803d" font-weight="700">• Validates causal boundary: external environment is never simulated into weights.</text>
      </g>
    </g>
  </g>

  <!-- Right Box: Failure Modes of Unmasked Training -->
  <g transform="translate(490, 234)">
    <rect width="430" height="172" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="430" height="24" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">3. SYSTEMS FAILURE MODES OF UNMASKED TRAINING</text>

    <g transform="translate(15, 34)">
      <!-- Item A -->
      <g transform="translate(0, 0)">
        <rect width="400" height="38" rx="1" fill="#fef2f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="10" y="14" font-size="7.5" font-weight="700" fill="#991b1b">A. Hallucinated Environment Simulation</text>
        <text x="10" y="27" font-size="7.2" fill="#475569">Model memorizes arbitrary database returns instead of querying live sandbox tools.</text>
      </g>

      <!-- Item B -->
      <g transform="translate(0, 46)">
        <rect width="400" height="38" rx="1" fill="#fef2f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="10" y="14" font-size="7.5" font-weight="700" fill="#991b1b">B. Covariate Collapse &amp; Exposure Bias</text>
        <text x="10" y="27" font-size="7.2" fill="#475569">Stochastic drift in external stdout triggers immediate out-of-distribution livelocks.</text>
      </g>

      <!-- Item C -->
      <g transform="translate(0, 92)">
        <rect width="400" height="38" rx="1" fill="#fef2f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="10" y="14" font-size="7.5" font-weight="700" fill="#991b1b">C. Gradient Swamping</text>
        <text x="10" y="27" font-size="7.2" fill="#475569">Large 10k-token compiler outputs dominate backprop, completely zeroing out tool call logic.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS CONTAINER: CAUSAL BOUNDARY TAKEAWAY              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 416)">
    <rect width="880" height="84" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="880" height="22" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">ARCHITECTURAL INVARIANT: THE REVERSIBILITY AND CAUSALITY BOUNDARY</text>

    <g transform="translate(14, 30)">
      <text x="0" y="11" font-size="7.5" fill="#334155">• In multi-turn agent systems, the context sequence strictly alternates between <tspan font-weight="700" fill="#0f172a">agent control states</tspan> (thoughts, schemas, arguments) and <tspan font-weight="700" fill="#0f172a">environment returns</tspan> (stdout, API responses).</text>
      <text x="0" y="25" font-size="7.5" fill="#334155">• External environments are non-differentiable stochastic processes outside the model's parameter manifold; backpropagating through them violates causal credit assignment.</text>
      <text x="0" y="39" font-size="7.5" fill="#15803d" font-weight="700">• Enforcing M_t = 0 on all environment tokens is mandatory to ensure valid credit assignment and robust out-of-distribution execution.</text>
    </g>
  </g>

</g>
</svg>