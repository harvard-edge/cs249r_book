<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1060" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: RANK-r PARAMETER DECOMPOSITION & MANIFOLD             -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect width="500" height="440" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="500" height="32" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <rect y="26" width="500" height="6" fill="#ede9fe"/>
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#6d28d9">
      (a) Low-Rank Parameter Decomposition: W = W₀ + (α/r)·B·A
    </text>
    <rect x="420" y="7" width="66" height="18" rx="3" fill="#ddd6fe"/>
    <text x="453" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5b21b6">r ≪ d</text>

    <!-- Input Vector x -->
    <g transform="translate(185, 44)">
      <rect width="130" height="24" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="65" y="16" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#0f172a">
        Input Vector x ∈ ℝ^d
      </text>
    </g>

    <!-- Branch Arrows from x -->
    <path d="M 215,68 L 115,92" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 285,68 L 365,92" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Left Sub-Branch: Frozen Base Weight W0 -->
    <g transform="translate(20, 96)">
      <rect width="170" height="134" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="170" height="22" rx="3" fill="#f1f5f9"/>
      <text x="85" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Frozen Base Matrix W₀</text>

      <!-- Matrix W0 schematic -->
      <rect x="45" y="28" width="80" height="60" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="85" y="54" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" font-weight="700" fill="#334155">W₀</text>
      <text x="85" y="68" text-anchor="middle" font-size="8" fill="#64748b">d × d (4096²)</text>
      <text x="85" y="80" text-anchor="middle" font-size="7.5" fill="#64748b">Quantized NF4/bf16</text>

      <!-- Frozen Status -->
      <rect x="15" y="98" width="140" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="85" y="110" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Frozen Base Weights</text>
      <text x="85" y="120" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#991b1b">∇_{W₀} L = 0</text>
    </g>

    <!-- Right Sub-Branch: Trainable LoRA Matrices A & B -->
    <g transform="translate(205, 96)">
      <rect width="275" height="134" rx="3" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
      <rect width="275" height="22" rx="3" fill="#ede9fe"/>
      <text x="137" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Trainable Low-Rank Factors (A, B)</text>

      <!-- Horizontal dataflow: A -> z -> B -->
      <!-- Matrix A (Down-Proj) -->
      <g transform="translate(10, 30)">
        <rect width="76" height="34" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="38" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#7c3aed">A (r × d)</text>
        <text x="38" y="28" text-anchor="middle" font-size="7" fill="#6b21a8">Down-Proj</text>
      </g>

      <!-- Arrow A to z -->
      <line x1="88" y1="47" x2="108" y2="47" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

      <!-- Bottleneck Activation z -->
      <g transform="translate(112, 34)">
        <rect width="52" height="26" rx="2" fill="#ede9fe" stroke="#a855f7" stroke-width="1"/>
        <text x="26" y="17" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#581c87">z ∈ ℝ^r</text>
      </g>

      <!-- Arrow z to B -->
      <line x1="166" y1="47" x2="186" y2="47" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

      <!-- Matrix B (Up-Proj) -->
      <g transform="translate(190, 30)">
        <rect width="76" height="34" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="38" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#7c3aed">B (d × r)</text>
        <text x="38" y="28" text-anchor="middle" font-size="7" fill="#6b21a8">Up-Proj</text>
      </g>

      <!-- Parameter Initialization Info -->
      <g transform="translate(10, 72)">
        <rect width="255" height="24" rx="2" fill="#ffffff" stroke="#e9d5ff" stroke-width="0.8"/>
        <text x="127" y="16" text-anchor="middle" font-size="7.5" fill="#4c1d95">
          A ~ 𝒩(0, σ²) &amp; B = 0 → ΔW = 0 at Step 0
        </text>
      </g>

      <!-- Scaling Banner -->
      <g transform="translate(10, 102)">
        <rect width="255" height="22" rx="2" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="0.8"/>
        <text x="127" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#6d28d9">
          Δh = (α / r) · B · (A · x) ∈ ℝ^d
        </text>
      </g>
    </g>

    <!-- Join Arrows into Add (+) Junction -->
    <path d="M 105,230 L 220,252" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <path d="M 342,230 L 260,252" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Addition Node (+) -->
    <circle cx="240" cy="256" r="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="240" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">+</text>

    <!-- Output Arrow -->
    <line x1="240" y1="268" x2="240" y2="284" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Output Vector h -->
    <g transform="translate(90, 287)">
      <rect width="300" height="26" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="150" y="17" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="9" font-weight="700" fill="#166534">
        Output: h = W₀·x + (α/r)·(B·A)·x ∈ ℝ^d
      </text>
    </g>

    <!-- Low-Rank Manifold Geometry Subspace Inset -->
    <g transform="translate(15, 322)">
      <rect width="470" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="470" height="20" rx="3" fill="#f1f5f9"/>
      <text x="10" y="14" font-size="8.5" font-weight="700" fill="#334155">Intrinsic Dimension Geometry: Low-Rank Parameter Manifold</text>

      <!-- Geometry Visual (Left) -->
      <g transform="translate(15, 26)">
        <polygon points="0,48 45,14 165,14 120,48" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="82" y="10" text-anchor="middle" font-size="7.5" fill="#64748b">Ambient Space ℝ^D (D = d² = 16.7M)</text>

        <!-- Low rank line/manifold -->
        <line x1="15" y1="42" x2="150" y2="20" stroke="#7c3aed" stroke-width="2.5"/>
        <circle cx="82" cy="31" r="3.5" fill="#7c3aed"/>
        <text x="82" y="62" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" font-weight="700" fill="#6d28d9">
          Intrinsic Manifold M_r (dim = 2rd)
        </text>
      </g>

      <!-- Subspace Math Explanation (Right) -->
      <g transform="translate(200, 28)">
        <text x="0" y="14" font-size="8" fill="#475569">Full Weight Tensor: D = 4096² = 16,777,216 params</text>
        <text x="0" y="28" font-size="8" font-weight="700" fill="#7c3aed">LoRA Factors (r=16): 2 × 16 × 4096 = 131,072 params</text>
        <text x="0" y="42" font-size="8" fill="#334155">Intrinsic Dimension Hypothesis (Aghajanyan et al.):</text>
        <rect x="0" y="48" width="255" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
        <text x="127" y="62" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">
          99.2% Parameter Reduction per Specialized Agent
        </text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: MULTI-TENANT SERVING ENGINE (S-LoRA / PUNICA)        -->
  <!-- ================================================================= -->
  <g transform="translate(540, 20)">
    <rect width="500" height="440" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="500" height="32" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <rect y="26" width="500" height="6" fill="#e0f2fe"/>
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#0369a1">
      (b) Multi-Tenant Serving Runtime (S-LoRA / Punica Segmented GEMM)
    </text>
    <rect x="410" y="7" width="76" height="18" rx="3" fill="#bae6fd"/>
    <text x="448" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284c7">Page Table</text>

    <!-- Accelerator HBM Layout Card -->
    <g transform="translate(15, 42)">
      <rect width="470" height="142" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="470" height="22" rx="3" fill="#f1f5f9"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#334155">Unified Accelerator HBM Memory Pool</text>

      <!-- Shared Base Model Block -->
      <g transform="translate(10, 28)">
        <rect width="180" height="104" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Shared Foundation Model</text>
        <text x="10" y="30" font-size="8" fill="#475569">1× Frozen 70B Weights W₀</text>
        <rect x="10" y="38" width="160" height="20" rx="2" fill="#e2e8f0"/>
        <text x="90" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" fill="#334155">VRAM: 35 GB (NF4)</text>
        <text x="10" y="74" font-size="7.5" fill="#64748b">Shared KV-Cache PagedAttention Pool</text>
        <text x="10" y="88" font-size="7.5" font-weight="600" fill="#15803d">Zero model duplication across tenants</text>
      </g>

      <!-- Dynamic Adapter Page Table & Memory Slices -->
      <g transform="translate(200, 28)">
        <rect width="260" height="104" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#6d28d9">Adapter Page Table (HBM Slices)</text>

        <!-- Table Rows with Clean Spacing -->
        <g transform="translate(10, 22)">
          <!-- Row 1: Bash Adapter -->
          <rect width="240" height="22" rx="2" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
          <text x="8" y="15" font-size="8" font-weight="700" fill="#6d28d9">Bash Agent</text>
          <text x="80" y="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#4c1d95">Pages: [4, 5]</text>
          <text x="232" y="15" text-anchor="end" font-size="7.5" fill="#64748b">r=16 (48 MB)</text>

          <!-- Row 2: SQL Adapter -->
          <g transform="translate(0, 26)">
            <rect width="240" height="22" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
            <text x="8" y="15" font-size="8" font-weight="700" fill="#166534">SQL Agent</text>
            <text x="80" y="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#14532d">Pages: [8, 9]</text>
            <text x="232" y="15" text-anchor="end" font-size="7.5" fill="#64748b">r=16 (48 MB)</text>
          </g>

          <!-- Row 3: Web Navigation -->
          <g transform="translate(0, 52)">
            <rect width="240" height="22" rx="2" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
            <text x="8" y="15" font-size="8" font-weight="700" fill="#1d4ed8">Web Agent</text>
            <text x="80" y="15" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#1e40af">Pages: [12..15]</text>
            <text x="232" y="15" text-anchor="end" font-size="7.5" fill="#64748b">r=32 (96 MB)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Downward Dispatch Flow Arrow -->
    <line x1="250" y1="188" x2="250" y2="204" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Segmented Batched GEMM Kernel Dispatch Card -->
    <g transform="translate(15, 208)">
      <rect width="470" height="154" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="470" height="22" rx="3" fill="#e0f2fe"/>
      <text x="10" y="15" font-size="9" font-weight="700" fill="#0369a1">Punica / S-LoRA Segmented Batched GEMM Execution</text>

      <!-- Batch Stream Input -->
      <g transform="translate(10, 30)">
        <text x="0" y="12" font-size="8" font-weight="600" fill="#334155">Batch Token Tensor X [B × S, d]:</text>
        <rect x="0" y="18" width="140" height="20" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
        <text x="70" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">Req 1: Bash Adapter</text>

        <rect x="145" y="18" width="140" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="215" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">Req 2: SQL Adapter</text>

        <rect x="290" y="18" width="160" height="20" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text x="370" y="32" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">Req 3: Web Adapter</text>
      </g>

      <!-- GEMM Kernel Execution Row -->
      <g transform="translate(10, 78)">
        <!-- Base GEMM -->
        <rect width="215" height="42" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="8" y="16" font-size="8" font-weight="700" fill="#0f172a">Shared Base GEMM (Unified)</text>
        <text x="8" y="30" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" fill="#334155">Y_base = X · W₀ (all B tokens)</text>

        <!-- Segmented GEMM -->
        <g transform="translate(225, 0)">
          <rect width="225" height="42" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
          <text x="8" y="16" font-size="8" font-weight="700" fill="#6d28d9">Segmented Adapter GEMM</text>
          <text x="8" y="30" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="7.5" fill="#4c1d95">ΔY_k = (α/r) · (X_k · A_k) · B_k</text>
        </g>

        <!-- Kernel Output Sum -->
        <g transform="translate(0, 48)">
          <rect width="450" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <text x="225" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8" font-weight="700" fill="#166534">
            Fused Batch Output: Y = Y_base + ΔY (Zero Base Model Reload Latency)
          </text>
        </g>
      </g>
    </g>

    <!-- Runtime Performance Summary Inset -->
    <g transform="translate(15, 372)">
      <rect width="470" height="56" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Multi-Tenant Serving Performance Guarantees:</text>
      <text x="12" y="32" font-size="8" fill="#334155">• Adapter dispatch takes &lt;10 µs via page table pointer offsets (zero PCIe weight reload).</text>
      <text x="12" y="46" font-size="8" fill="#15803d" font-weight="600">• Single GPU concurrently hosts 100+ specialized sub-agent adapters in unified HBM pool.</text>
    </g>
  </g>
</svg>