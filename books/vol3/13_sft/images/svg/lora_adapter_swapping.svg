<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="530" fill="#ffffff"/>

  <!-- Outer Architecture Boundary Framing Card -->
  <rect x="20" y="20" width="920" height="490" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">PARAMETER-EFFICIENT FINE-TUNING (PEFT) &amp; MULTI-TENANT ADAPTER SWAPPING</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Low-rank parameter decomposition and dynamic multi-tenant LoRA routing for high-density agent runtimes</text>

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: LOW-RANK PARAMETER DECOMPOSITION (LoRA / QLoRA)      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect width="440" height="336" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="440" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">1. PARAMETER DECOMPOSITION: W = W₀ + (α/r)(B · A)</text>

    <!-- Visual Architecture Diagram -->
    <g transform="translate(15, 34)">
      <!-- Input Vector x -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="90" height="24" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="45" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Input Vector x</text>
      </g>

      <!-- Fork Arrows -->
      <path d="M 175,24 L 105,48" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
      <path d="M 235,24 L 305,48" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)"/>

      <!-- Left Branch: Frozen Base Weights W_0 -->
      <g transform="translate(10, 52)">
        <rect width="180" height="142" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
        <rect width="180" height="22" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="90" y="15" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Frozen Base Model W₀</text>

        <text x="12" y="42" font-size="7.5" fill="#334155"><tspan font-weight="700">Dimension:</tspan> d × k</text>
        <text x="12" y="60" font-size="7.5" fill="#334155"><tspan font-weight="700">Quantization:</tspan> NF4 (4-bit)</text>
        <text x="12" y="78" font-size="7.5" fill="#334155"><tspan font-weight="700">Memory:</tspan> ~16 GB (70B model)</text>
        <text x="12" y="96" font-size="7.5" fill="#334155"><tspan font-weight="700">Parameters:</tspan> 70 Billion</text>

        <rect x="10" y="112" width="160" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
        <text x="90" y="125" font-size="7.2" font-weight="700" fill="#dc2626" text-anchor="middle">Gradients: FROZEN (0)</text>
      </g>

      <!-- Right Branch: Low-Rank Adapter Matrices A & B -->
      <g transform="translate(205, 52)">
        <rect width="195" height="142" rx="1" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
        <rect width="195" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="97" y="15" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">Trainable LoRA Adapters</text>

        <!-- Matrix A -->
        <g transform="translate(10, 30)">
          <rect width="175" height="44" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
          <text x="87" y="15" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Matrix A (Down-Proj)</text>
          <text x="87" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#4c1d95" text-anchor="middle">Dim: r × k | Rank r ≪ min(d,k)</text>
          <text x="87" y="38" font-size="6.8" fill="#64748b" text-anchor="middle">Init: Gaussian N(0, σ²)</text>
        </g>

        <!-- Matrix B -->
        <g transform="translate(10, 82)">
          <rect width="175" height="44" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
          <text x="87" y="15" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Matrix B (Up-Proj)</text>
          <text x="87" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#4c1d95" text-anchor="middle">Dim: d × r | Init: Zero</text>
          <text x="87" y="38" font-size="6.8" fill="#64748b" text-anchor="middle">Result: ΔW = 0 at step 0</text>
        </g>
      </g>

      <!-- Join Arrows into (+) -->
      <path d="M 100,198 L 188,228" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
      <path d="M 302,198 L 222,228" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)"/>

      <!-- Addition Circle (+) -->
      <circle cx="205" cy="235" r="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="205" y="240" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">+</text>

      <!-- Downward Arrow to Output -->
      <path d="M 205,249 L 205,263" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

      <!-- Output Vector h -->
      <g transform="translate(90, 266)">
        <rect width="230" height="26" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <text x="115" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Output: h = W₀·x + (α/r)·(B·A)·x</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: MULTI-TENANT AGENT RUNTIME (S-LoRA / Punica)        -->
  <!-- ================================================================= -->
  <g transform="translate(500, 72)">
    <rect width="420" height="336" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="420" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">2. MULTI-TENANT AGENT RUNTIME (S-LoRA / Punica)</text>

    <!-- Runtime Architecture Visual -->
    <g transform="translate(15, 34)">
      <!-- Base Model GPU Memory Block -->
      <g transform="translate(0, 0)">
        <rect width="390" height="56" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
        <rect width="390" height="20" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0f172a">Shared GPU VRAM Pool</text>
        <rect x="295" y="3" width="85" height="14" rx="1" fill="#e2e8f0"/>
        <text x="337" y="13" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">Static Footprint</text>

        <text x="10" y="34" font-size="7.5" fill="#334155">1× Frozen 70B Quantized Foundation Model (NF4, ~16 GB VRAM)</text>
        <text x="10" y="47" font-size="7.2" fill="#64748b">Shared PagedAttention Key-Value Cache &amp; System Prefix Memory</text>
      </g>

      <!-- Dynamic Adapter Slot Stack -->
      <g transform="translate(0, 68)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#0f172a">Active Agent Adapters (Dispatched per Agent Context Block):</text>

        <!-- Adapter A: Bash Agent -->
        <g transform="translate(0, 22)">
          <rect width="390" height="40" rx="1" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
          <text x="10" y="16" font-size="8" font-weight="700" fill="#6d28d9">Adapter α: Bash / Terminal Specialist</text>
          <rect x="315" y="5" width="65" height="16" rx="1" fill="#ede9fe"/>
          <text x="347" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#6d28d9" text-anchor="middle">Rank r=16</text>
          <text x="10" y="31" font-size="7.2" fill="#475569">POSIX shell syntax, AST diffs, exit-code fault remediation (48 MB)</text>
        </g>

        <!-- Adapter B: SQL Agent -->
        <g transform="translate(0, 68)">
          <rect width="390" height="40" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
          <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Adapter β: Database / SQL Specialist</text>
          <rect x="315" y="5" width="65" height="16" rx="1" fill="#dcfce7"/>
          <text x="347" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">Rank r=16</text>
          <text x="10" y="31" font-size="7.2" fill="#475569">PostgreSQL dialect, join query plans, ACID transaction logic (48 MB)</text>
        </g>

        <!-- Adapter C: Web Browser Agent -->
        <g transform="translate(0, 114)">
          <rect width="390" height="40" rx="1" fill="#eff6ff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="10" y="16" font-size="8" font-weight="700" fill="#0369a1">Adapter γ: Web Navigation / DOM Specialist</text>
          <rect x="315" y="5" width="65" height="16" rx="1" fill="#e0f2fe"/>
          <text x="347" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#0369a1" text-anchor="middle">Rank r=32</text>
          <text x="10" y="31" font-size="7.2" fill="#475569">Accessibility trees, DOM selectors, mouse/keyboard actuation (96 MB)</text>
        </g>
      </g>

      <!-- Batched Dispatch Info Row -->
      <g transform="translate(0, 236)">
        <rect width="390" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" font-weight="700" fill="#334155">Punica Batched GEMM Tensor Scattering:</text>
        <text x="10" y="28" font-size="7.2" fill="#475569">• Distinct agent requests routed to different adapters in a single GPU kernel launch.</text>
        <text x="10" y="40" font-size="7.2" fill="#0369a1" font-weight="700">• Instantaneous multi-tenant switching with zero foundation model reload latency.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS CONTAINER: SYSTEMS TRADE-OFF                     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 418)">
    <rect width="880" height="82" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="880" height="22" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">SYSTEMS TRADE-OFF: FULL FINE-TUNING VS. MULTI-ADAPTER ROUTING</text>

    <g transform="translate(14, 30)">
      <text x="0" y="11" font-size="7.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">Full-Parameter Serving Penalty:</tspan> Serving N separate 70B models requires N × 140 GB of GPU HBM, forcing expensive node replicas or multi-second weight reloads.</text>
      <text x="0" y="25" font-size="7.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">PEFT Multi-Tenant Efficiency:</tspan> LoRA/QLoRA reduces per-agent delta to &lt;0.2% (&lt;50 MB), enabling a single GPU cluster to host thousands of specialized agent behaviors.</text>
      <text x="0" y="39" font-size="7.5" fill="#15803d" font-weight="700">• Segmented batched GEMM kernels (S-LoRA / Punica) eliminate cold-start adapter swap overhead during complex multi-agent delegation.</text>
    </g>
  </g>

</svg>
