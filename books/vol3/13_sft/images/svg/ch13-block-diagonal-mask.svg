<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box-card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 4; ry: 4; }
      .panel-hdr { font-size: 12px; font-weight: 700; }
      .axis-lbl { font-size: 10px; font-weight: 600; fill: #334155; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; fill: #0f172a; text-anchor: middle; }
      .mono-red { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .mono-green { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #166534; text-anchor: middle; }
      .attn-active { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
      .attn-leak { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; }
      .attn-masked { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .body-text { font-size: 9.5px; fill: #334155; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="920" height="420" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: UNISOLATED CAUSAL ATTENTION (CONTAMINATED)            -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect width="430" height="380" class="box-card" stroke="#f87171"/>
    <rect width="430" height="32" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
    <rect y="26" width="430" height="6" fill="#fef2f2"/>
    <text x="14" y="21" class="panel-hdr" fill="#991b1b">(a) Standard Causal Mask: Cross-Task Leakage</text>
    <rect x="330" y="7" width="86" height="18" rx="3" fill="#fee2e2"/>
    <text x="373" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">Contaminated</text>

    <!-- Column headers (Keys) -->
    <text x="140" y="58" class="axis-lbl" text-anchor="middle">Keys: Trajectory τ₁</text>
    <text x="290" y="58" class="axis-lbl" text-anchor="middle">Keys: Trajectory τ₂</text>

    <!-- Row headers (Queries) -->
    <text x="26" y="140" class="axis-lbl" transform="rotate(-90 26 140)" text-anchor="middle">Queries τ₁</text>
    <text x="26" y="275" class="axis-lbl" transform="rotate(-90 26 275)" text-anchor="middle">Queries τ₂</text>

    <!-- Block 1,1: tau_1 x tau_1 (Lower triangular active) -->
    <g transform="translate(70, 70)">
      <path d="M 0 0 L 140 140 L 0 140 Z" class="attn-active"/>
      <path d="M 0 0 L 140 0 L 140 140 Z" class="attn-masked"/>
      <text x="48" y="96" class="mono">τ₁ Attention</text>
      <text x="96" y="44" class="mono" fill="#94a3b8">0 (Future)</text>
    </g>

    <!-- Block 1,2: tau_1 x tau_2 (Zero, future causal) -->
    <g transform="translate(220, 70)">
      <rect width="140" height="140" class="attn-masked"/>
      <text x="70" y="74" class="mono" fill="#94a3b8">0 (Future)</text>
    </g>

    <!-- Block 2,1: tau_2 x tau_1 (UNMASKED LEAKAGE HAZARD!) -->
    <g transform="translate(70, 220)">
      <rect width="140" height="120" class="attn-leak"/>
      <text x="70" y="46" class="mono-red">CROSS-TALK LEAKAGE</text>
      <text x="70" y="66" class="mono-red">A_ij ≠ -∞</text>
      <text x="70" y="86" class="body-text" text-anchor="middle" fill="#dc2626">τ₂ queries attend to τ₁ states!</text>
      <text x="70" y="102" class="body-text" text-anchor="middle" fill="#991b1b">Spurious inter-task coupling</text>
    </g>

    <!-- Block 2,2: tau_2 x tau_2 (Lower triangular active) -->
    <g transform="translate(220, 220)">
      <path d="M 0 0 L 120 120 L 0 120 Z" class="attn-active"/>
      <path d="M 0 0 L 140 0 L 140 120 L 120 120 Z" class="attn-masked"/>
      <text x="38" y="98" class="mono">τ₂ Attention</text>
      <text x="86" y="40" class="mono" fill="#94a3b8">0 (Future)</text>
    </g>

    <!-- Warning Footer -->
    <g transform="translate(15, 350)">
      <rect width="400" height="22" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="200" y="15" text-anchor="middle" font-size="8.5" font-weight="600" fill="#dc2626">Hazard: Policy learns ungrounded inter-trajectory dependencies</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: 2D BLOCK-DIAGONAL ATTENTION (STRICTLY ISOLATED)      -->
  <!-- ================================================================= -->
  <g transform="translate(470, 20)">
    <rect width="430" height="380" class="box-card" stroke="#86efac"/>
    <rect width="430" height="32" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect y="26" width="430" height="6" fill="#f0fdf4"/>
    <text x="14" y="21" class="panel-hdr" fill="#166534">(b) 2D Block-Diagonal Mask: Strict Isolation</text>
    <rect x="330" y="7" width="86" height="18" rx="3" fill="#dcfce7"/>
    <text x="373" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">Causally Isolated</text>

    <!-- Column headers (Keys) -->
    <text x="140" y="58" class="axis-lbl" text-anchor="middle">Keys: Trajectory τ₁</text>
    <text x="290" y="58" class="axis-lbl" text-anchor="middle">Keys: Trajectory τ₂</text>

    <!-- Row headers (Queries) -->
    <text x="26" y="140" class="axis-lbl" transform="rotate(-90 26 140)" text-anchor="middle">Queries τ₁</text>
    <text x="26" y="275" class="axis-lbl" transform="rotate(-90 26 275)" text-anchor="middle">Queries τ₂</text>

    <!-- Block 1,1: tau_1 x tau_1 (Lower triangular active) -->
    <g transform="translate(70, 70)">
      <path d="M 0 0 L 140 140 L 0 140 Z" class="attn-active"/>
      <path d="M 0 0 L 140 0 L 140 140 Z" class="attn-masked"/>
      <text x="48" y="96" class="mono">τ₁ Attention</text>
      <text x="96" y="44" class="mono" fill="#94a3b8">-∞</text>
    </g>

    <!-- Block 1,2: tau_1 x tau_2 (Masked -inf) -->
    <g transform="translate(220, 70)">
      <rect width="140" height="140" class="attn-masked"/>
      <text x="70" y="74" class="mono" fill="#94a3b8">-∞</text>
    </g>

    <!-- Block 2,1: tau_2 x tau_1 (MASKED: NO LEAKAGE!) -->
    <g transform="translate(70, 220)">
      <rect width="140" height="120" class="attn-masked" stroke="#86efac" stroke-width="1.2"/>
      <text x="70" y="46" class="mono-green">STRICTLY MASKED</text>
      <text x="70" y="66" class="mono-green">A_ij = -∞</text>
      <text x="70" y="86" class="body-text" text-anchor="middle" fill="#15803d">Cross-task attention = 0</text>
      <text x="70" y="102" class="body-text" text-anchor="middle" fill="#166534">Zero inter-task leakage</text>
    </g>

    <!-- Block 2,2: tau_2 x tau_2 (Lower triangular active) -->
    <g transform="translate(220, 220)">
      <path d="M 0 0 L 120 120 L 0 120 Z" class="attn-active"/>
      <path d="M 0 0 L 140 0 L 140 120 L 120 120 Z" class="attn-masked"/>
      <text x="38" y="98" class="mono">τ₂ Attention</text>
      <text x="86" y="40" class="mono" fill="#94a3b8">-∞</text>
    </g>

    <!-- Kernel Implementation Note Footer -->
    <g transform="translate(15, 350)">
      <rect width="400" height="22" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="200" y="15" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="8.5" font-weight="600" fill="#166534">
        Kernel: FlashAttention-2 cu_seqlens = [0, c₁, c₂] (Skips cross-blocks)
      </text>
    </g>
  </g>
</svg>
