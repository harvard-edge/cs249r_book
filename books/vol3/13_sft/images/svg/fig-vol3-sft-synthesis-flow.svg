<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box-card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 4; ry: 4; }
      .stage-hdr { font-size: 11px; font-weight: 700; }
      .stage-tag { font-size: 8px; font-weight: 700; text-anchor: middle; }
      .body-lbl { font-size: 8.5px; fill: #334155; }
      .code-lbl { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 8px; fill: #0f172a; }
      .contract-lbl { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 7.5px; font-weight: 600; }
    </style>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1060" height="480" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- ROW 1: STAGES 1, 2, 3 (PRE-TRAINING DATA COMPILATION)             -->
  <!-- ================================================================= -->

  <!-- STAGE 1: TRAJECTORY INGESTION & SCHEMA VALIDATION -->
  <g transform="translate(20, 20)">
    <rect width="320" height="195" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="320" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect y="22" width="320" height="6" fill="#f1f5f9"/>
    <text x="12" y="19" class="stage-hdr" fill="#0f172a">Stage 1: Ingestion &amp; Validation</text>
    <rect x="236" y="6" width="72" height="16" rx="2" fill="#e2e8f0"/>
    <text x="272" y="17" class="stage-tag" fill="#475569">Ch 12 Ingest</text>

    <g transform="translate(12, 36)">
      <text x="0" y="12" class="body-lbl">Raw multi-turn execution traces: <tspan class="code-lbl">τ = (s, a, o)</tspan></text>
      <text x="0" y="26" class="body-lbl">Schema validation against registered interface definitions</text>
      <text x="0" y="40" class="body-lbl">Strict terminal exit code &amp; output bound checks</text>
      
      <!-- Pruning Filter Box -->
      <rect x="0" y="50" width="296" height="34" rx="2" fill="#fff1f2" stroke="#fecaca" stroke-width="0.8"/>
      <text x="8" y="64" font-size="8" font-weight="700" fill="#dc2626">Validation Filter Contract:</text>
      <text x="8" y="76" font-size="7.5" fill="#991b1b">Prune truncated tool dumps &amp; malformed unparseable RPCs</text>

      <!-- Output Contract -->
      <rect x="0" y="92" width="296" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="108" font-size="8" font-weight="600" fill="#334155">Emits:</text>
      <text x="44" y="108" class="contract-lbl" fill="#0284c7">Validated Trajectory Set T_{valid}</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <line x1="340" y1="117" x2="368" y2="117" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- STAGE 2: DETERMINISTIC SERIALIZATION & ACTION LOSS MASKING -->
  <g transform="translate(370, 20)">
    <rect width="320" height="195" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="320" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <rect y="22" width="320" height="6" fill="#ede9fe"/>
    <text x="12" y="19" class="stage-hdr" fill="#6d28d9">Stage 2: Serialization &amp; Masking</text>
    <rect x="236" y="6" width="72" height="16" rx="2" fill="#ddd6fe"/>
    <text x="272" y="17" class="stage-tag" fill="#5b21b6">Tokenizer</text>

    <g transform="translate(12, 36)">
      <text x="0" y="12" class="body-lbl">Delimiter injection: <tspan class="code-lbl">&lt;|start_sys|&gt;, &lt;|start_asst|&gt;</tspan></text>
      <text x="0" y="26" class="body-lbl">Deliberation isolation: <tspan class="code-lbl">&lt;|thought|&gt;</tspan> vs <tspan class="code-lbl">&lt;|call:tool|&gt;</tspan></text>
      
      <!-- Loss Mask Calculation Box -->
      <rect x="0" y="36" width="296" height="48" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="0.8"/>
      <text x="8" y="50" font-size="8" font-weight="700" fill="#6d28d9">Action Loss Mask Compilation m ∈ {0, 1}^S:</text>
      <text x="8" y="64" class="contract-lbl" fill="#15803d">m_t = 1: Thought deliberation &amp; tool call syntax</text>
      <text x="8" y="76" class="contract-lbl" fill="#dc2626">m_t = 0: System instructions &amp; environment returns</text>

      <!-- Output Contract -->
      <rect x="0" y="92" width="296" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="108" font-size="8" font-weight="600" fill="#334155">Emits:</text>
      <text x="44" y="108" class="contract-lbl" fill="#6d28d9">1D Role-Delimited Tensors (X, Y, m)</text>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <line x1="690" y1="117" x2="718" y2="117" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>

  <!-- STAGE 3: DYNAMIC SEQUENCE PACKING & ATTENTION ISOLATION -->
  <g transform="translate(720, 20)">
    <rect width="320" height="195" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="320" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <rect y="22" width="320" height="6" fill="#e0f2fe"/>
    <text x="12" y="19" class="stage-hdr" fill="#0369a1">Stage 3: Sequence Packing</text>
    <rect x="236" y="6" width="72" height="16" rx="2" fill="#bae6fd"/>
    <text x="272" y="17" class="stage-tag" fill="#0284c7">Bin Packing</text>

    <g transform="translate(12, 36)">
      <text x="0" y="12" class="body-lbl">First-Fit Decreasing (FFD) packing into <tspan class="code-lbl">S_max = 32k</tspan></text>
      <text x="0" y="26" class="body-lbl">Eliminates padding bubbles: <tspan font-weight="600" fill="#15803d">&gt;95% compute utilization</tspan></text>
      
      <!-- Attention Masking Box -->
      <rect x="0" y="36" width="296" height="48" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
      <text x="8" y="50" font-size="8" font-weight="700" fill="#0369a1">2D Block-Diagonal Mask &amp; RoPE Reset:</text>
      <text x="8" y="64" class="contract-lbl" fill="#0284c7">M_{ij} = -∞ for cross-task pairs (zero leakage)</text>
      <text x="8" y="76" class="contract-lbl" fill="#0284c7">pos[t] = t - c_k (rotary position reset at boundary)</text>

      <!-- Output Contract -->
      <rect x="0" y="92" width="296" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="108" font-size="8" font-weight="600" fill="#334155">Emits:</text>
      <text x="44" y="108" class="contract-lbl" fill="#0284c7">Packed Batches B_{packed}</text>
    </g>
  </g>

  <!-- Bus Route: Stage 3 (Top Right) -> Stage 4 (Bottom Left) -->
  <path d="M 880,215 L 880,232 L 180,232 L 180,248" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="450" y="223" width="160" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="530" y="235" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">
    Cluster Dispatch (Zero Cross-Talk)
  </text>

  <!-- ================================================================= -->
  <!-- ROW 2: STAGES 4, 5, 6 (TRAINING, PACKAGING & REGRESSION GATING)   -->
  <!-- ================================================================= -->

  <!-- STAGE 4: DISTRIBUTED LOW-RANK PARAMETER OPTIMIZATION -->
  <g transform="translate(20, 252)">
    <rect width="320" height="205" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="320" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect y="22" width="320" height="6" fill="#f0fdf4"/>
    <text x="12" y="19" class="stage-hdr" fill="#166534">Stage 4: Low-Rank Optimization</text>
    <rect x="236" y="6" width="72" height="16" rx="2" fill="#dcfce7"/>
    <text x="272" y="17" class="stage-tag" fill="#15803d">LoRA / QLoRA</text>

    <g transform="translate(12, 36)">
      <text x="0" y="12" class="body-lbl">Base model weights <tspan class="code-lbl">W_0</tspan> frozen in NF4 / bfloat16</text>
      <text x="0" y="26" class="body-lbl">Trainable low-rank decomposition: <tspan class="code-lbl">W = W_0 + (α/r)BA</tspan></text>
      <text x="0" y="40" class="body-lbl">AdamW optimizer with selective loss normalization</text>

      <!-- Activation Memory Box -->
      <rect x="0" y="50" width="296" height="38" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="8" y="64" font-size="8" font-weight="700" fill="#15803d">Gradient Recomputation (Checkpointing):</text>
      <text x="8" y="78" font-size="7.5" fill="#166534">Discards activations · within HBM budget</text>

      <!-- Output Contract -->
      <rect x="0" y="98" width="296" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="114" font-size="8" font-weight="600" fill="#334155">Emits:</text>
      <text x="44" y="114" class="contract-lbl" fill="#15803d">Adapter Checkpoint Weights (A, B)</text>
    </g>
  </g>

  <!-- Connective Arrow 4 -> 5 -->
  <line x1="340" y1="354" x2="368" y2="354" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- STAGE 5: ARTIFACT PACKAGING & CRYPTOGRAPHIC SIGNING -->
  <g transform="translate(370, 252)">
    <rect width="320" height="205" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="320" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <rect y="22" width="320" height="6" fill="#fef3c7"/>
    <text x="12" y="19" class="stage-hdr" fill="#b45309">Stage 5: Artifact Packaging</text>
    <rect x="236" y="6" width="72" height="16" rx="2" fill="#fde68a"/>
    <text x="272" y="17" class="stage-tag" fill="#92400e">Signing</text>

    <g transform="translate(12, 36)">
      <text x="0" y="12" class="body-lbl">Exports low-rank adapter tensors <tspan class="code-lbl">A, B</tspan> (safetensors)</text>
      <text x="0" y="26" class="body-lbl">Immutable manifest: base model ID, rank <tspan class="code-lbl">r</tspan>, scale <tspan class="code-lbl">α</tspan></text>
      
      <!-- Checksum & Security Box -->
      <rect x="0" y="36" width="296" height="52" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
      <text x="8" y="50" font-size="8" font-weight="700" fill="#b45309">Cryptographic Manifest Contract:</text>
      <text x="8" y="64" class="contract-lbl" fill="#78350f">Tokenizer SHA-256 hash &amp; git commit stamp</text>
      <text x="8" y="78" class="contract-lbl" fill="#78350f">Cryptographic Ed25519 signature of binary</text>

      <!-- Output Contract -->
      <rect x="0" y="98" width="296" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="114" font-size="8" font-weight="600" fill="#334155">Emits:</text>
      <text x="44" y="114" class="contract-lbl" fill="#b45309">Signed Adapter Package</text>
    </g>
  </g>

  <!-- Connective Arrow 5 -> 6 -->
  <line x1="690" y1="354" x2="718" y2="354" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- STAGE 6: HERMETIC REGRESSION GATING & ADAPTER PROMOTION -->
  <g transform="translate(720, 252)">
    <rect width="320" height="205" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="320" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect y="22" width="320" height="6" fill="#f1f5f9"/>
    <text x="12" y="19" class="stage-hdr" fill="#0f172a">Stage 6: Regression Gating</text>
    <rect x="236" y="6" width="72" height="16" rx="2" fill="#e2e8f0"/>
    <text x="272" y="17" class="stage-tag" fill="#475569">Hermetic CI</text>

    <g transform="translate(12, 34)">
      <!-- Test Fixtures -->
      <text x="0" y="12" class="body-lbl">Syntax validator suite: schema conformance check</text>
      <text x="0" y="24" class="body-lbl">General retention: GSM8k / HumanEval (&gt;80%)</text>
      <text x="0" y="36" class="body-lbl">Integration benchmark: SWE-bench Lite sandbox</text>

      <!-- Automated Gate Outcomes -->
      <g transform="translate(0, 46)">
        <!-- Pass Path -->
        <rect width="296" height="34" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <circle cx="16" cy="17" r="7" fill="#16a34a"/>
        <text x="16" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">✓</text>
        <text x="30" y="16" font-size="8.5" font-weight="700" fill="#15803d">PASS: Gate Cleared</text>
        <text x="30" y="27" font-size="7.5" fill="#166534">Promote to Production Manifests (S-LoRA pool)</text>

        <!-- Reject Path -->
        <g transform="translate(0, 40)">
          <rect width="296" height="34" rx="2" fill="#fff1f2" stroke="#fecaca" stroke-width="1"/>
          <circle cx="16" cy="17" r="7" fill="#dc2626"/>
          <text x="16" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">✗</text>
          <text x="30" y="16" font-size="8.5" font-weight="700" fill="#991b1b">FAIL: Regression Detected</text>
          <text x="30" y="27" font-size="7.5" fill="#b91c1c">Automated quarantine &amp; serving deployment abort</text>
        </g>
      </g>
    </g>
  </g>
</svg>