<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
      .axis-line { stroke: #cbd5e1; stroke-width: 1.5; }
      .ring-line { stroke: #e2e8f0; stroke-width: 1; fill: none; }
      .ring-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #94a3b8; }
      .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .poly-base { fill: #94a3b8; fill-opacity: 0.15; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4,4; }
      .poly-chka { fill: #f87171; fill-opacity: 0.2; stroke: #dc2626; stroke-width: 2.2; }
      .poly-chkb { fill: #60a5fa; fill-opacity: 0.25; stroke: #2563eb; stroke-width: 2.5; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #1e293b; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="470" y="30" class="title-text">Multi-Metric Evaluation Radar for Supervised Policy Checkpoints</text>
  <text x="470" y="50" class="sub-text">Comparative Acceptance Profile Across Task Completion, Syntax, Efficiency, and Retention</text>

  <!-- Radar Center: (cx = 320, cy = 270), Radius R = 130 -->
  <!-- 4 Axes:
       Top (North): y = 270 - 130 = 140 -> Task Completion (Pass@1)
       Right (East): x = 320 + 130 = 450 -> Syntactic Tool Validity
       Bottom (South): y = 270 + 130 = 400 -> Trajectory Efficiency
       Left (West): x = 320 - 130 = 190 -> General Capability Retention
  -->

  <!-- Rings: 25% (32.5), 50% (65), 75% (97.5), 100% (130) -->
  <polygon points="320,237.5 352.5,270 320,302.5 287.5,270" class="ring-line" />
  <text x="324" y="241" class="ring-text">25%</text>

  <polygon points="320,205 385,270 320,335 255,270" class="ring-line" />
  <text x="324" y="209" class="ring-text">50%</text>

  <polygon points="320,172.5 417.5,270 320,367.5 222.5,270" class="ring-line" />
  <text x="324" y="176.5" class="ring-text">75%</text>

  <polygon points="320,140 450,270 320,400 190,270" class="ring-line" stroke="#94a3b8" stroke-width="1.2" />
  <text x="324" y="144" class="ring-text">100%</text>

  <!-- 4 Axis Lines -->
  <line x1="320" y1="270" x2="320" y2="130" class="axis-line" />
  <line x1="320" y1="270" x2="460" y2="270" class="axis-line" />
  <line x1="320" y1="270" x2="320" y2="410" class="axis-line" />
  <line x1="320" y1="270" x2="180" y2="270" class="axis-line" />

  <!-- Axis Titles with clean clearance and centering -->
  <text x="320" y="115" class="axis-title">Task Completion (Pass@1 %)</text>
  
  <text x="535" y="264" class="axis-title" text-anchor="middle">Syntactic Tool</text>
  <text x="535" y="280" class="axis-title" text-anchor="middle">Validity (%)</text>

  <text x="320" y="435" class="axis-title">Trajectory Efficiency (1 / Tokens)</text>

  <text x="105" y="264" class="axis-title" text-anchor="middle">General Retention</text>
  <text x="105" y="280" class="axis-title" text-anchor="middle">(%)</text>

  <!-- Model 1: Unadapted Base Model
       Task: 28% -> r = 36.4 -> y = 270 - 36.4 = 233.6
       Syntax: 42% -> r = 54.6 -> x = 320 + 54.6 = 374.6
       Efficiency: 35% -> r = 45.5 -> y = 270 + 45.5 = 315.5
       General: 95% -> r = 123.5 -> x = 320 - 123.5 = 196.5
  -->
  <polygon points="320,233.6 374.6,270 320,315.5 196.5,270" class="poly-base" />

  <!-- Model 2: Checkpoint A (Overfitted Surface SFT)
       Task: 52% -> r = 67.6 -> y = 270 - 67.6 = 202.4
       Syntax: 96% -> r = 124.8 -> x = 320 + 124.8 = 444.8
       Efficiency: 40% -> r = 52.0 -> y = 270 + 52 = 322
       General: 45% -> r = 58.5 -> x = 320 - 58.5 = 261.5
  -->
  <polygon points="320,202.4 444.8,270 320,322 261.5,270" class="poly-chka" />

  <!-- Model 3: Checkpoint B (Balanced SFT with Action Masking & Dynamic Schema)
       Task: 78% -> r = 101.4 -> y = 270 - 101.4 = 168.6
       Syntax: 92% -> r = 119.6 -> x = 320 + 119.6 = 439.6
       Efficiency: 82% -> r = 106.6 -> y = 270 + 106.6 = 376.6
       General: 88% -> r = 114.4 -> x = 320 - 114.4 = 205.6
  -->
  <polygon points="320,168.6 439.6,270 320,376.6 205.6,270" class="poly-chkb" />

  <!-- Legend & Diagnostic Box (Right Side: x = 650 to 900) -->
  <g transform="translate(650, 110)">
    <rect width="250" height="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" rx="6" />
    <text x="20" y="28" class="axis-title" text-anchor="start">Evaluation Scorecard</text>
    <line x1="20" y1="38" x2="230" y2="38" stroke="#cbd5e1" />

    <!-- Checkpoint B -->
    <line x1="20" y1="60" x2="50" y2="60" stroke="#2563eb" stroke-width="3" />
    <text x="60" y="64" class="legend-text" font-weight="700" fill="#1e40af">Checkpoint B (Balanced SFT)</text>
    <text x="20" y="82" class="body-text">• Action-targeted loss masking</text>
    <text x="20" y="98" class="body-text">• Dynamic schema regularization</text>
    <text x="20" y="114" class="body-text" font-weight="600" fill="#166534">Optimal production candidate</text>

    <!-- Checkpoint A -->
    <line x1="20" y1="140" x2="50" y2="140" stroke="#dc2626" stroke-width="2.5" />
    <text x="60" y="144" class="legend-text" font-weight="700" fill="#991b1b">Checkpoint A (Overfitted)</text>
    <text x="20" y="162" class="body-text">• Unmasked full-sequence SFT</text>
    <text x="20" y="178" class="body-text">• Fixed schema memorization</text>
    <text x="20" y="194" class="body-text" fill="#dc2626">Severe capability forgetting</text>

    <!-- Base Model -->
    <line x1="20" y1="220" x2="50" y2="220" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="60" y="224" class="legend-text">Base Model (Unadapted)</text>
    <text x="20" y="242" class="body-text">• High general reasoning</text>
    <text x="20" y="258" class="body-text">• Poor agentic tool dispatch</text>
  </g>

</svg>
