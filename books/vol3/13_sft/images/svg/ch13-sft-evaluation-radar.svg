<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .axis-line { stroke: #cbd5e1; stroke-width: 1.2; }
      .ring-line { stroke: #e2e8f0; stroke-width: 1; fill: none; }
      .gate-ring { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
      .ring-text { font-size: 8.5px; fill: #94a3b8; }
      .axis-title { font-size: 10.5px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .poly-base { fill: #94a3b8; fill-opacity: 0.15; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; }
      .poly-chka { fill: #f87171; fill-opacity: 0.2; stroke: #dc2626; stroke-width: 2; }
      .poly-chkb { fill: #3b82f6; fill-opacity: 0.25; stroke: #2563eb; stroke-width: 2.2; }
      .tbl-hdr { font-size: 8.5px; font-weight: 700; fill: #0f172a; }
      .tbl-cell { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 8px; fill: #334155; }
    </style>
  </defs>

  <!-- Clean Background -->
  <rect width="920" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- RADAR CHART CONTAINER (LEFT)                                      -->
  <!-- ================================================================= -->
  <!-- Center: cx = 270, cy = 215, Max Radius R = 130 -->
  <!-- Axes:
       North (y = 215 - r): Task Completion (Pass@1 %)
       East  (x = 270 + r): Syntactic Tool Validity (%)
       South (y = 215 + r): Trajectory Efficiency (1 / Tokens)
       West  (x = 270 - r): General Capability Retention (%)
  -->
  <g transform="translate(20, 20)">
    <rect width="490" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="490" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect y="24" width="490" height="6" fill="#f1f5f9"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">
      Multi-Dimensional Policy Acceptance Radar (Four Orthogonal Vectors)
    </text>

    <!-- Radar Graphic Group centered at cx=245, cy=210 -->
    <g transform="translate(0, 5)">
      <!-- Concentric Grid Rings: 25%, 50%, 75%, 100% -->
      <!-- 25% (r = 32.5) -->
      <polygon points="245,177.5 277.5,210 245,242.5 212.5,210" class="ring-line"/>
      <text x="252" y="181" class="ring-text">25%</text>

      <!-- 50% (r = 65) -->
      <polygon points="245,145 310,210 245,275 180,210" class="ring-line"/>
      <text x="252" y="149" class="ring-text">50%</text>

      <!-- 75% (r = 97.5) -->
      <polygon points="245,112.5 342.5,210 245,307.5 147.5,210" class="ring-line"/>
      <text x="252" y="116.5" class="ring-text">75%</text>

      <!-- 100% (r = 130) -->
      <polygon points="245,80 375,210 245,340 115,210" class="ring-line" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="252" y="84" class="ring-text">100%</text>

      <!-- Acceptance Gate Envelope (Dashed Amber)
           Task: 70% (r=91, y=119)
           Syntax: 90% (r=117, x=362)
           Efficiency: 75% (r=97.5, y=307.5)
           Retention: 80% (r=104, x=141)
      -->
      <polygon points="245,119 362,210 245,307.5 141,210" class="gate-ring"/>

      <!-- 4 Axis Lines -->
      <line x1="245" y1="210" x2="245" y2="70" class="axis-line"/>
      <line x1="245" y1="210" x2="385" y2="210" class="axis-line"/>
      <line x1="245" y1="210" x2="245" y2="350" class="axis-line"/>
      <line x1="245" y1="210" x2="105" y2="210" class="axis-line"/>

      <!-- Axis Titles with Clean Clearance -->
      <text x="245" y="60" class="axis-title">Task Completion (Pass@1 %)</text>

      <text x="435" y="206" class="axis-title" text-anchor="middle">Syntactic Tool</text>
      <text x="435" y="219" class="axis-title" text-anchor="middle">Validity (%)</text>

      <text x="245" y="368" class="axis-title">Trajectory Efficiency (1 / Tokens)</text>

      <text x="55" y="206" class="axis-title" text-anchor="middle">Capability</text>
      <text x="55" y="219" class="axis-title" text-anchor="middle">Retention (%)</text>

      <!-- Model 1: Unadapted Base Model
           Task: 28% -> r = 36.4 -> y = 210 - 36.4 = 173.6
           Syntax: 42% -> r = 54.6 -> x = 245 + 54.6 = 299.6
           Efficiency: 35% -> r = 45.5 -> y = 210 + 45.5 = 255.5
           Retention: 95% -> r = 123.5 -> x = 245 - 123.5 = 121.5
      -->
      <polygon points="245,173.6 299.6,210 245,255.5 121.5,210" class="poly-base"/>

      <!-- Model 2: Checkpoint A (Overfitted Surface SFT)
           Task: 52% -> r = 67.6 -> y = 210 - 67.6 = 142.4
           Syntax: 96% -> r = 124.8 -> x = 245 + 124.8 = 369.8
           Efficiency: 40% -> r = 52.0 -> y = 210 + 52.0 = 262
           Retention: 45% -> r = 58.5 -> x = 245 - 58.5 = 186.5
      -->
      <polygon points="245,142.4 369.8,210 245,262 186.5,210" class="poly-chka"/>

      <!-- Model 3: Checkpoint B (Balanced SFT with Masking & Schema Regularization)
           Task: 78% -> r = 101.4 -> y = 210 - 101.4 = 108.6
           Syntax: 92% -> r = 119.6 -> x = 245 + 119.6 = 364.6
           Efficiency: 82% -> r = 106.6 -> y = 210 + 106.6 = 316.6
           Retention: 88% -> r = 114.4 -> x = 245 - 114.4 = 130.6
      -->
      <polygon points="245,108.6 364.6,210 245,316.6 130.6,210" class="poly-chkb"/>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- SCORECARD & ACCEPTANCE MATRIX TABLE (RIGHT)                       -->
  <!-- ================================================================= -->
  <g transform="translate(530, 20)">
    <rect width="370" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="370" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect y="24" width="370" height="6" fill="#f1f5f9"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">
      Quantitative Verification Scorecard
    </text>

    <!-- Legend Blocks -->
    <g transform="translate(15, 42)">
      <!-- Checkpoint B -->
      <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="3"/>
      <text x="34" y="11" font-size="9" font-weight="700" fill="#1d4ed8">Checkpoint B (Balanced SFT)</text>
      <text x="210" y="11" font-size="8" font-weight="700" fill="#16a34a">✓ Production Gate Cleared</text>

      <!-- Checkpoint A -->
      <line x1="0" y1="28" x2="26" y2="28" stroke="#dc2626" stroke-width="2.5"/>
      <text x="34" y="31" font-size="9" font-weight="700" fill="#991b1b">Checkpoint A (Overfitted)</text>
      <text x="210" y="31" font-size="8" font-weight="700" fill="#dc2626">✗ Rejected: Forgetting</text>

      <!-- Base Model -->
      <line x1="0" y1="48" x2="26" y2="48" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3"/>
      <text x="34" y="51" font-size="9" font-weight="600" fill="#475569">Base Foundation Model</text>
      <text x="210" y="51" font-size="8" fill="#64748b">Unadapted Baseline</text>

      <!-- Gate Boundary -->
      <line x1="0" y1="68" x2="26" y2="68" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="34" y="71" font-size="9" font-weight="600" fill="#b45309">Acceptance Threshold</text>
      <text x="210" y="71" font-size="8" fill="#b45309">Minimum Envelope</text>
    </g>

    <!-- Structured Metric Table -->
    <g transform="translate(15, 130)">
      <rect width="340" height="156" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="340" height="26" rx="3" fill="#f1f5f9"/>
      <text x="10" y="17" class="tbl-hdr">Evaluation Dimension</text>
      <text x="140" y="17" class="tbl-hdr" text-anchor="middle">Base</text>
      <text x="190" y="17" class="tbl-hdr" text-anchor="middle">Chk A</text>
      <text x="245" y="17" class="tbl-hdr" text-anchor="middle">Chk B</text>
      <text x="305" y="17" class="tbl-hdr" text-anchor="middle">Gate Min</text>
      <line x1="0" y1="26" x2="340" y2="26" stroke="#cbd5e1"/>

      <!-- Row 1: Task Completion -->
      <g transform="translate(0, 26)">
        <text x="10" y="20" font-size="8.5" fill="#0f172a">Task Completion (Pass@1)</text>
        <text x="140" y="20" class="tbl-cell" text-anchor="middle">28%</text>
        <text x="190" y="20" class="tbl-cell" text-anchor="middle" fill="#dc2626">52%</text>
        <text x="245" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#16a34a">78%</text>
        <text x="305" y="20" class="tbl-cell" text-anchor="middle" font-weight="600">≥ 70%</text>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#f1f5f9"/>
      </g>

      <!-- Row 2: Syntax Validity -->
      <g transform="translate(0, 58)">
        <text x="10" y="20" font-size="8.5" fill="#0f172a">Syntactic Tool Validity</text>
        <text x="140" y="20" class="tbl-cell" text-anchor="middle">42%</text>
        <text x="190" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#16a34a">96%</text>
        <text x="245" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#16a34a">92%</text>
        <text x="305" y="20" class="tbl-cell" text-anchor="middle" font-weight="600">≥ 90%</text>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#f1f5f9"/>
      </g>

      <!-- Row 3: Efficiency -->
      <g transform="translate(0, 90)">
        <text x="10" y="20" font-size="8.5" fill="#0f172a">Trajectory Efficiency</text>
        <text x="140" y="20" class="tbl-cell" text-anchor="middle">35%</text>
        <text x="190" y="20" class="tbl-cell" text-anchor="middle" fill="#dc2626">40%</text>
        <text x="245" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#16a34a">82%</text>
        <text x="305" y="20" class="tbl-cell" text-anchor="middle" font-weight="600">≥ 75%</text>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#f1f5f9"/>
      </g>

      <!-- Row 4: Retention -->
      <g transform="translate(0, 122)">
        <text x="10" y="20" font-size="8.5" fill="#0f172a">General Capability Retention</text>
        <text x="140" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#16a34a">95%</text>
        <text x="190" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#dc2626">45%</text>
        <text x="245" y="20" class="tbl-cell" text-anchor="middle" font-weight="700" fill="#16a34a">88%</text>
        <text x="305" y="20" class="tbl-cell" text-anchor="middle" font-weight="600">≥ 80%</text>
      </g>
    </g>

    <!-- Systems Takeaway Card (Bottom) -->
    <g transform="translate(15, 298)">
      <rect width="340" height="78" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="340" height="20" rx="3" fill="#f1f5f9"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#334155">Statistical Gate Criterion</text>
      <text x="10" y="34" font-size="8" fill="#334155">Checkpoint A overfits surface tokens: achieving 96% syntax</text>
      <text x="10" y="46" font-size="8" fill="#dc2626">validity at the cost of severe reasoning collapse (45% retention).</text>
      <text x="10" y="60" font-size="8" font-weight="600" fill="#16a34a">Checkpoint B balances action loss masking with schema</text>
      <text x="10" y="72" font-size="8" font-weight="600" fill="#16a34a">regularization, satisfying all four operational constraints.</text>
    </g>
  </g>
</svg>
