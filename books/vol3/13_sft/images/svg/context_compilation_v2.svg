<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 580" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-amethyst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#581C87"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991B1B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#166534"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="attn-grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#991B1B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="attn-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="1150" height="580" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- HEADER & SYSTEM CONTEXT                                           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 20)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.3">CONTEXT COMPILATION: COMPILING IN-CONTEXT SCHEMAS INTO MODEL WEIGHTS</text>
    <text x="0" y="38" font-size="11" fill="#475569">Eliminating Quadratic Prefill Latency and Attention Dispersion via Supervised Weight Projection Tuning</text>

    <!-- Formula Box -->
    <rect x="740" y="4" width="370" height="38" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <text x="752" y="20" font-size="10" font-weight="700" fill="#581C87">Compiler Invariant:</text>
    <text x="860" y="20" font-size="9" font-family="'SF Mono', monospace" fill="#1E293B">W_ffn &lt;- W_ffn - eta * grad L_sft</text>
    <text x="752" y="34" font-size="8.5" fill="#6B21A8">Internalizes static API syntax into feedforward parameters</text>
  </g>

  <!-- ================================================================= -->
  <!-- TOP HALF: UNCOMPILED IN-CONTEXT PROMPTING (Quadratic Bloat)       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="1070" height="195" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="1070" height="28" rx="6" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#991B1B">BASELINE RUNTIME: UNCOMPILED IN-CONTEXT PROMPTING</text>
    <text x="820" y="19" font-size="9.5" fill="#B91C1C" font-family="'SF Mono', monospace">Context Length T = 16,512 Tokens</text>

    <!-- Token Stream Partition Diagram -->
    <g transform="translate(20, 42)">
      <text x="0" y="12" font-size="9.5" font-weight="700" fill="#334155">In-Memory Prompt Context Stream (Prepended Every Execution Turn):</text>

      <!-- Stream Segments -->
      <g transform="translate(0, 22)">
        <!-- Segment 1: System Prompt -->
        <rect x="0" y="0" width="160" height="38" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
        <text x="80" y="16" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">System Heuristics</text>
        <text x="80" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#64748B" text-anchor="middle">4,096 tokens (25%)</text>

        <!-- Segment 2: Tool Schemas -->
        <rect x="165" y="0" width="310" height="38" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
        <text x="320" y="16" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">Raw OpenAPI &amp; JSON Tool Schemas</text>
        <text x="320" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#78350F" text-anchor="middle">8,192 tokens (50% Schema Verbosity Tax)</text>

        <!-- Segment 3: Few-Shot Traces -->
        <rect x="480" y="0" width="160" height="38" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
        <text x="560" y="16" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Few-Shot Exemplars</text>
        <text x="560" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#64748B" text-anchor="middle">4,096 tokens (24%)</text>

        <!-- Segment 4: Task Goal -->
        <rect x="645" y="0" width="45" height="38" rx="2" fill="#FEE2E2" stroke="#991B1B" stroke-width="1.5"/>
        <text x="667" y="16" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">Task</text>
        <text x="667" y="30" font-size="7.5" font-family="'SF Mono', monospace" fill="#991B1B" text-anchor="middle">128 t</text>
      </g>

      <!-- Attention Dispersion Warning Arc / Indicator -->
      <path d="M 165 72 C 320 95, 480 95, 645 72" fill="none" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4,3"/>
      <circle cx="400" cy="88" r="3.5" fill="#991B1B"/>
      <text x="400" y="103" font-size="8" font-weight="700" fill="#991B1B" text-anchor="middle">Attention Dispersion: Recall collapses in middle token span ("Lost in the Middle")</text>
    </g>

    <!-- Right Side Schematic: Causal Attention Matrix (Quadratic Area) -->
    <g transform="translate(715, 38)">
      <rect x="0" y="0" width="340" height="142" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#334155">Attention &amp; Memory Footprint (T = 16k)</text>

      <!-- Matrix representation -->
      <g transform="translate(15, 26)">
        <rect x="0" y="0" width="95" height="95" fill="url(#attn-grad-red)" stroke="#991B1B" stroke-width="1"/>
        <line x1="0" y1="0" x2="95" y2="95" stroke="#991B1B" stroke-width="1.5"/>
        <text x="48" y="78" font-size="8" font-family="'SF Mono', monospace" fill="#991B1B" text-anchor="middle">O(T^2) FLOPs</text>
        <text x="48" y="108" font-size="7.5" fill="#64748B" text-anchor="middle">16k x 16k Prefill Matrix</text>
      </g>

      <!-- Numerical Metrics Strip -->
      <g transform="translate(125, 32)">
        <text x="0" y="12" font-size="8.5" fill="#334155">Prefill Compute:</text>
        <text x="130" y="12" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#991B1B">~820 ms / step</text>

        <text x="0" y="32" font-size="8.5" fill="#334155">KV Cache Stranded:</text>
        <text x="130" y="32" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#991B1B">10.8 GB / agent</text>

        <text x="0" y="52" font-size="8.5" fill="#334155">Serving Concurrency:</text>
        <text x="130" y="52" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#991B1B">7 sessions / H100</text>

        <text x="0" y="72" font-size="8.5" fill="#334155">Syntax Robustness:</text>
        <text x="130" y="72" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#991B1B">Hallucinated keys</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- MIDDLE CONVERSION STRIP: SFT COMPILER TRANSFORMATION PASS         -->
  <!-- ================================================================= -->
  <g transform="translate(40, 288)">
    <rect x="240" y="0" width="670" height="32" rx="4" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
    <line x1="20" y1="16" x2="230" y2="16" stroke="#581C87" stroke-width="1.8" stroke-dasharray="6,3"/>
    <line x1="920" y1="16" x2="1050" y2="16" stroke="#581C87" stroke-width="1.8" stroke-dasharray="6,3"/>

    <!-- Downward transform markers -->
    <line x1="575" y1="-12" x2="575" y2="-2" stroke="#581C87" stroke-width="2" marker-end="url(#arr-amethyst)"/>
    <line x1="575" y1="34" x2="575" y2="44" stroke="#581C87" stroke-width="2" marker-end="url(#arr-amethyst)"/>

    <text x="575" y="20" font-size="9.5" font-weight="700" fill="#581C87" text-anchor="middle">
      COMPILATION PASS: Supervised Trajectory Fine-Tuning &amp; Loss Masking: Internalizes Syntax into FFN Projections
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM HALF: CONTEXT-COMPILED POLICY RUNTIME (Linear Efficiency)  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 335)">
    <rect x="0" y="0" width="1070" height="195" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="1070" height="28" rx="6" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="19" font-size="11" font-weight="700" fill="#166534">OPTIMIZED RUNTIME: CONTEXT-COMPILED AGENT POLICY</text>
    <text x="830" y="19" font-size="9.5" fill="#15803D" font-family="'SF Mono', monospace">Context Length T = 128 Tokens</text>

    <!-- Token Stream Partition Diagram -->
    <g transform="translate(20, 42)">
      <text x="0" y="12" font-size="9.5" font-weight="700" fill="#334155">In-Memory Execution Context Stream (Zero Static Prefix Overhead):</text>

      <!-- Stream Segments -->
      <g transform="translate(0, 22)">
        <!-- Compiled Internalization Label Box -->
        <rect x="0" y="0" width="460" height="38" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="230" y="16" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">Compiled Into Model Parameters (theta*)</text>
        <text x="230" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#6B21A8" text-anchor="middle">System heuristics &amp; OpenAPI schemas compiled into FFN weights</text>

        <!-- Remaining Dynamic Token Stream: Only 128 tokens -->
        <rect x="470" y="0" width="210" height="38" rx="2" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>
        <text x="575" y="16" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Task Objective &amp; Live Observations</text>
        <text x="575" y="30" font-size="8" font-family="'SF Mono', monospace" fill="#15803D" text-anchor="middle">128 tokens (85% reduction)</text>
      </g>

      <!-- Undispersed Attention Benefit Indicator -->
      <path d="M 470 72 L 680 72" fill="none" stroke="#166534" stroke-width="1.8"/>
      <circle cx="575" cy="72" r="3.5" fill="#166534"/>
      <text x="575" y="88" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Zero Attention Dispersion: Full attention density focused</text>
      <text x="575" y="100" font-size="8" fill="#15803D" text-anchor="middle">exclusively on live dynamic environment state</text>
    </g>

    <!-- Right Side Schematic: Compact Attention Matrix & Metrics -->
    <g transform="translate(715, 38)">
      <rect x="0" y="0" width="340" height="142" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#334155">Compiled Footprint (T = 128)</text>

      <!-- Compact Matrix representation -->
      <g transform="translate(35, 40)">
        <rect x="0" y="0" width="35" height="35" fill="url(#attn-grad-green)" stroke="#166534" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="35" y2="35" stroke="#166534" stroke-width="1.2"/>
        <text x="17" y="52" font-size="7.5" font-family="'SF Mono', monospace" fill="#166534" text-anchor="middle">128 x 128</text>
        <text x="17" y="66" font-size="7.5" fill="#64748B" text-anchor="middle">Prefill Matrix</text>
      </g>

      <!-- Numerical Metrics Strip -->
      <g transform="translate(125, 32)">
        <text x="0" y="12" font-size="8.5" fill="#334155">Prefill Compute:</text>
        <text x="130" y="12" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">~12 ms (85% faster)</text>

        <text x="0" y="32" font-size="8.5" fill="#334155">KV Cache Stranded:</text>
        <text x="130" y="32" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">0.08 GB (135x less)</text>

        <text x="0" y="52" font-size="8.5" fill="#334155">Serving Concurrency:</text>
        <text x="130" y="52" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">64+ sessions / H100</text>

        <text x="0" y="72" font-size="8.5" fill="#334155">Syntax Robustness:</text>
        <text x="130" y="72" font-size="8.5" font-family="'SF Mono', monospace" font-weight="700" fill="#166534">Rigid grammar match</text>
      </g>
    </g>
  </g>
</svg>
