<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="460" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- PANEL A: UNCOMPILED IN-CONTEXT PROMPTING (Dynamic 16k Prefix)     -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect x="0" y="0" width="820" height="158" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="820" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">PANEL A: UNCOMPILED IN-CONTEXT PROMPTING (Dynamic 16k Prompt Prefix Baseline)</text>

    <!-- Context Window Bar Container -->
    <g transform="translate(15, 34)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#334155">In-Memory Attention Context Buffer (16,512 Tokens):</text>

      <!-- Segment 1: System Heuristics (4096 tokens) -->
      <rect x="0" y="20" width="125" height="42" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="62" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">System Prompt</text>
      <text x="62" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#64748b">4,096 tokens</text>

      <!-- Segment 2: OpenAPI Tool Schemas (8192 tokens) -->
      <rect x="130" y="20" width="250" height="42" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="255" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Raw OpenAPI / JSON Tool Schemas</text>
      <text x="255" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#78350f">8,192 tokens (Verbosity tax)</text>

      <!-- Segment 3: Few-Shot Demonstrations (4096 tokens) -->
      <rect x="385" y="20" width="125" height="42" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="447" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Few-Shot Traces</text>
      <text x="447" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#5b21b6">4,096 tokens</text>

      <!-- Segment 4: Task Objective (128 tokens) -->
      <rect x="515" y="20" width="35" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="532" y="44" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">Task</text>

      <!-- Attention Dispersion Warning -->
      <path d="M0,70 L550,70" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="275" y="82" text-anchor="middle" font-size="7.5" fill="#b91c1c">Attention Dispersion Hazard: Recall degrades in middle positions ("Lost in the Middle")</text>

      <!-- System Overhead Summary -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="550" height="26" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="17" font-size="7.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">In-Context Overhead:</tspan> Static tool definitions streamed per turn; quadratic attention prefill scales with O(T²).</text>
      </g>
    </g>

    <!-- Side Metrics Box (Right) -->
    <g transform="translate(580, 30)">
      <rect x="0" y="0" width="225" height="118" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="0" y="0" width="225" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#991b1b">UNCOMPILED RUNTIME TAX</text>

      <text x="10" y="34" font-size="7.5" fill="#334155">Prefill Compute:</text>
      <text x="105" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">~820 ms (O(T²) FLOPs)</text>

      <text x="10" y="50" font-size="7.5" fill="#334155">KV Cache Stranded:</text>
      <text x="105" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">10.8 GB / agent</text>

      <text x="10" y="66" font-size="7.5" fill="#334155">Memory Roofline:</text>
      <text x="105" y="66" font-size="7.2" fill="#7f1d1d">HBM exhausted at batch=7</text>

      <text x="10" y="82" font-size="7.5" fill="#334155">Schema Errors:</text>
      <text x="105" y="82" font-size="7.2" fill="#7f1d1d">High rate (hallucinated keys)</text>

      <rect x="10" y="94" width="205" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="112" y="106" text-anchor="middle" font-size="6.8" font-weight="700" fill="#991b1b">LOW SYSTEM GOODPUT</text>
    </g>
  </g>

  <!-- Transformation Indicator -->
  <g transform="translate(40, 236)">
    <line x1="160" y1="14" x2="250" y2="14" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="255" y="3" width="310" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="410" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">Context Compilation (SFT Weight Internalization: W_proj ← ∇L)</text>
    <line x1="570" y1="14" x2="660" y2="14" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M410,25 L410,34" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: CONTEXT-COMPILED POLICY RUNTIME (Internalized Weights)   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 276)">
    <rect x="0" y="0" width="820" height="184" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="820" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PANEL B: CONTEXT-COMPILED POLICY RUNTIME (Internalized Schema Weights)</text>

    <!-- Context Window Bar Container -->
    <g transform="translate(15, 34)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#15803d">Compacted Working Context Buffer (160 Tokens):</text>

      <!-- Segment 1: Compact System Role (32 tokens) -->
      <rect x="0" y="20" width="30" height="42" rx="1" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="15" y="45" text-anchor="middle" font-size="7" font-weight="700" fill="#334155">Sys</text>

      <!-- Segment 2: Task Instruction (128 tokens) -->
      <rect x="35" y="20" width="70" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="70" y="44" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0369a1">Task (128 t)</text>

      <!-- Freed Space -->
      <rect x="110" y="20" width="440" height="42" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4,2" stroke-width="1"/>
      <text x="330" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">FREED CAPACITY: 16,352 Tokens Preserved for Real-Time Execution</text>

      <!-- Subsystem Explanation -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="550" height="66" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" font-weight="700" fill="#334155">Mechanics of Compilation:</text>
        <text x="10" y="29" font-size="7.2" fill="#475569">• Tool schemas &amp; API argument constraints are burned into MLP layer weights (W_gate, W_up, W_down).</text>
        <text x="10" y="43" font-size="7.2" fill="#475569">• Attention heads attend 100% to live environment observations (standard output, file content diffs).</text>
        <text x="10" y="57" font-size="7.2" fill="#15803d" font-weight="700">• Context length drops from 16,512 to 160 tokens; prefill latency eliminated with 99% KV footprint saving.</text>
      </g>
    </g>

    <!-- Side Metrics Box (Right) -->
    <g transform="translate(580, 30)">
      <rect x="0" y="0" width="225" height="142" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="225" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">COMPILED EFFICIENCY GAINS</text>

      <text x="10" y="34" font-size="7.5" fill="#334155">Prefill Compute:</text>
      <text x="105" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#15803d">~14 ms (58× speedup)</text>

      <text x="10" y="50" font-size="7.5" fill="#334155">KV Cache Footprint:</text>
      <text x="105" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700" fill="#15803d">0.12 GB (99% saved)</text>

      <text x="10" y="66" font-size="7.5" fill="#334155">Memory Roofline:</text>
      <text x="105" y="66" font-size="7.2" fill="#14532d">Serves batch=64+ in HBM</text>

      <text x="10" y="82" font-size="7.5" fill="#334155">Schema Syntax:</text>
      <text x="105" y="82" font-size="7.2" fill="#14532d">Deterministic zero-error</text>

      <text x="10" y="98" font-size="7.5" fill="#334155">Agent Concurrency:</text>
      <text x="105" y="98" font-size="7.2" fill="#14532d">9.1× higher request density</text>

      <rect x="10" y="112" width="205" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="112" y="125" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">HIGH PRODUCTION GOODPUT</text>
    </g>
  </g>

</g>
</svg>