<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: UNCOMPILED IN-CONTEXT PROMPTING (y: 20 to 180)           -->
  <!-- ================================================================= -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="850" height="170" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="850" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#0f172a">PANEL A: UNCOMPILED IN-CONTEXT PROMPTING (Dynamic 16k Prompt Prefix)</text>

    <!-- Context Window Bar Container -->
    <g transform="translate(15, 36)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#334155">In-Memory Attention Context Buffer (16,512 Tokens):</text>
      
      <!-- Segment 1: System Heuristics (4096 tokens) -->
      <rect x="0" y="20" width="130" height="42" rx="1" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
      <text x="65" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">System Prompt</text>
      <text x="65" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#64748b">4,096 tokens</text>

      <!-- Segment 2: OpenAPI Tool Schemas (8192 tokens) -->
      <rect x="135" y="20" width="260" height="42" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="265" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">Raw OpenAPI / JSON Tool Schemas</text>
      <text x="265" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#78350f">8,192 tokens (Verbosity tax)</text>

      <!-- Segment 3: Few-Shot Demonstrations (4096 tokens) -->
      <rect x="400" y="20" width="130" height="42" rx="1" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="465" y="38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Few-Shot Traces</text>
      <text x="465" y="52" text-anchor="middle" font-family="Courier, monospace" font-size="7" fill="#4c1d95">4,096 tokens</text>

      <!-- Segment 4: Task Objective (128 tokens) -->
      <rect x="535" y="20" width="35" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="552" y="44" text-anchor="middle" font-size="7" font-weight="700" fill="#0369a1">Task</text>

      <!-- Attention Dispersion Warning -->
      <path d="M0,70 L570,70" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="285" y="82" text-anchor="middle" font-size="7.2" fill="#b91c1c">Attention Dispersion Hazard: Recall drops in middle positions ("Lost in the Middle")</text>
    </g>

    <!-- Side Metrics Box (Right) -->
    <g transform="translate(615, 34)">
      <rect x="0" y="0" width="220" height="122" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#b91c1c">UNCOMPILED RUNTIME TAX</text>
      <text x="10" y="34" font-size="7.5" fill="#334155">Prefill Compute:</text>
      <text x="95" y="34" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">~820 ms (O(T²) FLOPs)</text>

      <text x="10" y="52" font-size="7.5" fill="#334155">KV Cache Stranded:</text>
      <text x="95" y="52" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#b91c1c">10.8 GB / agent</text>

      <text x="10" y="70" font-size="7.5" fill="#334155">Memory Roofline:</text>
      <text x="95" y="70" font-size="7.2" fill="#7f1d1d">HBM exhausted at batch=7</text>

      <text x="10" y="88" font-size="7.5" fill="#334155">Schema Errors:</text>
      <text x="95" y="88" font-size="7.2" fill="#7f1d1d">High rate (hallucinated keys)</text>

      <rect x="10" y="98" width="200" height="16" rx="1" fill="#fee2e2"/>
      <text x="110" y="110" text-anchor="middle" font-size="6.8" font-weight="700" fill="#b91c1c">LOW SYSTEM GOODPUT</text>
    </g>
  </g>

  <!-- Transformation Indicator -->
  <g transform="translate(420, 200)">
    <path d="M0,0 L0,20" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
    <text x="12" y="14" font-size="7.5" font-weight="700" fill="#6d28d9">Context Compilation (SFT Weight Internalization: W_proj ← ∇L)</text>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: CONTEXT-COMPILED POLICY RUNTIME (y: 230 to 395)          -->
  <!-- ================================================================= -->
  <g transform="translate(25, 230)">
    <rect x="0" y="0" width="850" height="170" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="850" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="15" font-size="8.5" font-weight="700" fill="#15803d">PANEL B: CONTEXT-COMPILED POLICY RUNTIME (Internalized Schema Weights)</text>

    <!-- Context Window Bar Container -->
    <g transform="translate(15, 36)">
      <text x="0" y="12" font-size="8" font-weight="700" fill="#15803d">Compacted Working Context Buffer (160 Tokens):</text>

      <!-- Segment 1: Compact System Role (32 tokens) -->
      <rect x="0" y="20" width="30" height="42" rx="1" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="15" y="45" text-anchor="middle" font-size="7" font-weight="700" fill="#334155">Sys</text>

      <!-- Segment 2: Task Instruction (128 tokens) -->
      <rect x="35" y="20" width="70" height="42" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <text x="70" y="44" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0369a1">Task (128 t)</text>

      <!-- Freed Space -->
      <rect x="110" y="20" width="460" height="42" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4,2" stroke-width="1"/>
      <text x="340" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">FREED CAPACITY: 16,352 Tokens Preserved for Real-Time Execution</text>

      <!-- Subsystem Explanation -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="570" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="7.5" font-weight="700" fill="#334155">Mechanics of Compilation:</text>
        <text x="10" y="28" font-size="7.2" fill="#475569">• Tool schemas &amp; API argument constraints are burned into MLP layer weights (W_gate, W_up).</text>
        <text x="10" y="40" font-size="7.2" fill="#475569">• Attention heads attend 100% to live environment observations (standard output, file content diffs).</text>
      </g>
    </g>

    <!-- Side Metrics Box (Right) -->
    <g transform="translate(615, 34)">
      <rect x="0" y="0" width="220" height="122" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">COMPILED EFFICIENCY GAINS</text>
      <text x="10" y="34" font-size="7.5" fill="#334155">Prefill Compute:</text>
      <text x="95" y="34" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">~14 ms (58× speedup)</text>

      <text x="10" y="52" font-size="7.5" fill="#334155">KV Cache Footprint:</text>
      <text x="95" y="52" font-family="Courier, monospace" font-size="7.5" font-weight="700" fill="#15803d">0.12 GB (99% saved)</text>

      <text x="10" y="70" font-size="7.5" fill="#334155">Memory Roofline:</text>
      <text x="95" y="70" font-size="7.2" fill="#14532d">Serves batch=64+ in HBM</text>

      <text x="10" y="88" font-size="7.5" fill="#334155">Schema Syntax:</text>
      <text x="95" y="88" font-size="7.2" fill="#14532d">Deterministic zero-error</text>

      <rect x="10" y="98" width="200" height="16" rx="1" fill="#dcfce7"/>
      <text x="110" y="110" text-anchor="middle" font-size="6.8" font-weight="700" fill="#15803d">HIGH PRODUCTION GOODPUT</text>
    </g>
  </g>

</svg>
