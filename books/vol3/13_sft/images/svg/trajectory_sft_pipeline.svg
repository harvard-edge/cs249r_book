<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- STEP 1: TASK SEED CORPUS                                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 72)">
    <rect width="165" height="228" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="165" height="24" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">1. TASK SEED CORPUS</text>

    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="7.5" fill="#334155">• Task prompts x ~ D_tasks</text>
      <text x="0" y="30" font-size="7.5" fill="#334155">• Tool schemas &amp; mocks</text>
      <text x="0" y="48" font-size="7.5" fill="#334155">• Sandbox ground truth</text>
      <text x="0" y="66" font-size="7.5" fill="#334155">• Unit test harnesses</text>
      <text x="0" y="84" font-size="7.5" fill="#334155">• Initial state fixtures</text>
      <text x="0" y="102" font-size="7.5" fill="#334155">• Dependency graphs</text>
      <text x="0" y="120" font-size="7.5" fill="#334155">• Verification assertions</text>
    </g>

    <rect x="10" y="196" width="145" height="20" rx="1" fill="#e2e8f0"/>
    <text x="82" y="210" text-anchor="middle" font-size="7.2" font-weight="700" fill="#475569">Synthetic Seed Prompts</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 205,186 L 235,186" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>

  <!-- ================================================================= -->
  <!-- STEP 2: TEACHER POLICY ROLLOUTS                                   -->
  <!-- ================================================================= -->
  <g transform="translate(240, 72)">
    <rect width="175" height="228" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="175" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#6d28d9">2. TEACHER ROLLOUT</text>

    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="7.5" fill="#334155">• Frontier teacher (π_θ*)</text>
      <text x="0" y="30" font-size="7.5" fill="#334155">• Multi-turn execution</text>
      <text x="0" y="48" font-size="7.5" fill="#334155">• Tool call generation</text>
      <text x="0" y="66" font-size="7.5" fill="#334155">• Sandboxed runtime</text>
      <text x="0" y="84" font-size="7.5" fill="#334155">• Rollout trace: τ = (s, a, o)</text>
      <text x="0" y="102" font-size="7.5" fill="#334155">• CoT reflection nodes</text>
      <text x="0" y="120" font-size="7.5" fill="#334155">• Environment side-effects</text>
    </g>

    <rect x="10" y="196" width="155" height="20" rx="1" fill="#ede9fe"/>
    <text x="87" y="210" text-anchor="middle" font-size="7.2" font-weight="700" fill="#6d28d9">Candidate Traces</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 415,186 L 445,186" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- STEP 3: EXECUTION-BASED VERIFIER (REJECTION SAMPLING)             -->
  <!-- ================================================================= -->
  <g transform="translate(450, 72)">
    <rect width="180" height="228" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="180" height="24" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#0369a1">3. EXECUTION VERIFIER</text>

    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="7.5" fill="#334155">• Unit tests &amp; assertions</text>
      <text x="0" y="30" font-size="7.5" fill="#334155">• Syntax &amp; schema check</text>
      <text x="0" y="48" font-size="7.5" fill="#334155">• Environment state diff</text>
      <text x="0" y="66" font-size="7.5" fill="#334155">• Trajectory length bound</text>
      <text x="0" y="84" font-size="7.5" fill="#334155">• Binary reward: R(τ) ∈ {0,1}</text>
      <text x="0" y="102" font-size="7.5" fill="#334155">• Exit code verification</text>
      <text x="0" y="120" font-size="7.5" fill="#334155">• Idempotency check</text>
    </g>

    <rect x="10" y="196" width="160" height="20" rx="1" fill="#e0f2fe"/>
    <text x="90" y="210" text-anchor="middle" font-size="7.2" font-weight="700" fill="#0369a1">Rejection Gate R(τ)</text>
  </g>

  <!-- Arrow 3 to Pass (Green, upward slant) -->
  <path d="M 630,128 L 665,116" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arr-green)"/>
  <rect x="626" y="98" width="38" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="645" y="110" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">PASS</text>

  <!-- Arrow 3 to Fail (Amber, downward slant) -->
  <path d="M 630,224 L 665,236" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arr-amber)"/>
  <rect x="626" y="238" width="38" height="16" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="645" y="250" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">FAIL</text>

  <!-- ================================================================= -->
  <!-- STEP 4A: GOLDEN PATH EXTRACTION                                   -->
  <!-- ================================================================= -->
  <g transform="translate(675, 72)">
    <rect width="245" height="104" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="245" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#15803d">4A. GOLDEN PATH EXTRACTION</text>

    <rect x="180" y="4" width="55" height="16" rx="1" fill="#dcfce7"/>
    <text x="207" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#15803d">OPTIMAL</text>

    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="7.5" fill="#334155">• Prune redundant tool retries &amp; loops</text>
      <text x="0" y="28" font-size="7.5" fill="#334155">• Minimal step count: τ* = argmin |τ|</text>
      <text x="0" y="44" font-size="7.5" fill="#334155">• Preserves maximal reasoning density</text>
      <text x="0" y="60" font-size="7.5" fill="#15803d" font-weight="700">• Uncontaminated causal demonstration</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 4B: ERROR RECOVERY SYNTHESIS                                 -->
  <!-- ================================================================= -->
  <g transform="translate(675, 186)">
    <rect width="245" height="114" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="245" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#b45309">4B. ERROR RECOVERY SYNTHESIS</text>

    <rect x="175" y="4" width="60" height="16" rx="1" fill="#fef3c7"/>
    <text x="205" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">RECOVERY</text>

    <g transform="translate(10, 32)">
      <text x="0" y="12" font-size="7.5" fill="#334155">• Inject tool failure / API exception</text>
      <text x="0" y="28" font-size="7.5" fill="#334155">• Prompt teacher for self-correction</text>
      <text x="0" y="44" font-size="7.5" fill="#334155">• Retain trace if recovery succeeds</text>
      <text x="0" y="60" font-size="7.5" fill="#334155">• Broadens support: supp(d_π) expansion</text>
      <text x="0" y="74" font-size="7.5" fill="#b45309" font-weight="700">• Active DAgger dataset aggregation</text>
    </g>
  </g>

  <!-- Discard for Unrecoverable Failures -->
  <path d="M 797,300 L 797,314 L 540,314 L 540,300" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr-red)"/>
  <rect x="625" y="306" width="115" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="682" y="318" text-anchor="middle" font-size="6.8" font-weight="700" fill="#dc2626">Discard if Unrecovered</text>

  <!-- Downward routing arrows into Step 5 -->
  <path d="M 920,124 L 932,124 L 932,342 L 890,342" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 920,243 L 932,243" stroke="#d97706" stroke-width="1.5" fill="none"/>

  <!-- ================================================================= -->
  <!-- STEP 5: MULTI-TURN FORMATTING & SELECTIVE LOSS MASKING ENGINE      -->
  <!-- ================================================================= -->
  <g transform="translate(40, 330)">
    <rect width="880" height="174" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="880" height="24" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">5. MULTI-TURN FORMATTING &amp; SELECTIVE LOSS MASKING ENGINE</text>

    <!-- Visual Token Sequence Blocks -->
    <g transform="translate(15, 34)">
      <!-- System Prompt -->
      <g transform="translate(0, 0)">
        <rect width="130" height="42" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="65" y="17" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">System Prompt</text>
        <text x="65" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#64748b">Loss Mask = 0</text>
      </g>

      <!-- User Instruction -->
      <g transform="translate(140, 0)">
        <rect width="130" height="42" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="65" y="17" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">User Instruction</text>
        <text x="65" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#64748b">Loss Mask = 0</text>
      </g>

      <!-- Agent Thought & Tool Call -->
      <g transform="translate(280, 0)">
        <rect width="155" height="42" rx="1" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="77" y="17" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">Thought + Tool Call</text>
        <text x="77" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#6d28d9">Loss Mask = 1 (Active)</text>
      </g>

      <!-- Tool Observation -->
      <g transform="translate(445, 0)">
        <rect width="140" height="42" rx="1" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="70" y="17" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Tool Observation</text>
        <text x="70" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#dc2626">Loss Mask = 0 (Masked)</text>
      </g>

      <!-- Agent Recovery / Final Answer -->
      <g transform="translate(595, 0)">
        <rect width="155" height="42" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="77" y="17" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">Recovery + Final Output</text>
        <text x="77" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#15803d">Loss Mask = 1 (Active)</text>
      </g>

      <!-- Arrow to Packed Batch -->
      <path d="M 750,21 L 760,21" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)"/>

      <!-- Curated Batch Output -->
      <g transform="translate(762, 0)">
        <rect width="88" height="42" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="44" y="17" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d28d9">SFT Batch</text>
        <text x="44" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" font-weight="700" fill="#4c1d95">D_train (Packed)</text>
      </g>

      <!-- Bottom Invariant Box -->
      <g transform="translate(0, 52)">
        <rect width="850" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="16" font-size="7.5" fill="#334155"><tspan font-weight="700" fill="#0f172a">Core Systems Invariant:</tspan> Backpropagation updates model weights exclusively over generated thoughts and tool call arguments (L_CE).</text>
        <text x="12" y="32" font-size="7.5" fill="#334155">Environment returns (sandbox stdout, database outputs) are strictly masked to prevent hallucinated environment simulation and error propagation.</text>
        <text x="12" y="48" font-size="7.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">Sequence Packing:</tspan> Packing variable-length agent traces into fixed context windows eliminates padding bubbles and achieves &gt;95% GPU compute utilization.</text>
        <text x="12" y="62" font-size="7.5" fill="#15803d" font-weight="700">• End-to-end curated data distribution matches deployment rollout distribution, bounding compounding error to O(εH).</text>
      </g>
    </g>
  </g>

</g>
</svg>