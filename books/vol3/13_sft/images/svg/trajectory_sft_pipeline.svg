<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15.5px; font-weight: 700; fill: #FFFFFF; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #E9D5FF; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.4; }
      .tag { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
      .arrow { stroke: #64748B; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-purple { stroke: #7E22CE; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { stroke: #059669; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-amber { stroke: #D97706; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#64748B" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7E22CE" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#059669" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#D97706" />
    </marker>
    <linearGradient id="grad-head" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="510" fill="#FAFAFC" rx="2" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header Banner -->
  <rect x="25" y="18" width="910" height="44" rx="2" fill="url(#grad-head)" />
  <text x="42" y="45" class="banner-title">Trajectory Synthesis, Rejection Sampling, and Curation Pipeline</text>
  <text x="590" y="45" class="banner-sub">Agentic Post-Training Infrastructure (SFT &amp; Policy Distillation)</text>

  <!-- Step 1: Task Seed Corpus -->
  <g transform="translate(25, 80)">
    <rect width="160" height="185" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="160" height="28" rx="2" fill="#F1F5F9" />
    <rect y="20" width="160" height="8" fill="#F1F5F9" />
    <text x="12" y="19" class="box-title" fill="#334155">1. Task Seed Corpus</text>
    <text x="12" y="48" class="box-desc">• Task prompts x ~ D_tasks</text>
    <text x="12" y="70" class="box-desc">• Tool schemas &amp; mocks</text>
    <text x="12" y="92" class="box-desc">• Sandbox ground truth</text>
    <text x="12" y="114" class="box-desc">• Unit test harnesses</text>
    <text x="12" y="136" class="box-desc">• Initial state fixtures</text>
    <rect x="12" y="154" width="136" height="20" rx="4" fill="#E2E8F0" />
    <text x="80" y="168" class="tag" fill="#475569">Synthetic Prompts</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 185 172 L 220 172" class="arrow" marker-end="url(#arr)" />

  <!-- Step 2: Teacher Policy Rollouts -->
  <g transform="translate(225, 80)">
    <rect width="170" height="185" rx="2" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" />
    <rect width="170" height="28" rx="2" fill="#F3E8FF" />
    <rect y="20" width="170" height="8" fill="#F3E8FF" />
    <text x="12" y="19" class="box-title" fill="#581C87">2. Teacher Rollout</text>
    <text x="12" y="48" class="box-desc">• Frontier teacher (pi_theta)</text>
    <text x="12" y="70" class="box-desc">• Multi-turn execution</text>
    <text x="12" y="92" class="box-desc">• Tool call generation</text>
    <text x="12" y="114" class="box-desc">• Sandboxed runtime</text>
    <text x="12" y="136" class="box-desc">• Rollout trace: tau = (s, a, o)</text>
    <rect x="12" y="154" width="146" height="20" rx="4" fill="#EDE9FE" />
    <text x="85" y="168" class="tag" fill="#6B21A8">Candidate Traces</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 395 172 L 430 172" class="arrow-purple" marker-end="url(#arr-p)" />

  <!-- Step 3: Execution-Based Verifier / Rejection Sampling -->
  <g transform="translate(435, 80)">
    <rect width="175" height="185" rx="2" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
    <rect width="175" height="28" rx="2" fill="#EEF2FF" />
    <rect y="20" width="175" height="8" fill="#EEF2FF" />
    <text x="12" y="19" class="box-title" fill="#3730A3">3. Execution Verifier</text>
    <text x="12" y="48" class="box-desc">• Unit tests &amp; assertions</text>
    <text x="12" y="70" class="box-desc">• Syntax &amp; schema check</text>
    <text x="12" y="92" class="box-desc">• Environment state diff</text>
    <text x="12" y="114" class="box-desc">• Trajectory length bound</text>
    <text x="12" y="136" class="box-desc">• Binary reward: R(tau) in {0,1}</text>
    <rect x="12" y="154" width="151" height="20" rx="4" fill="#E0E7FF" />
    <text x="87" y="168" class="tag" fill="#4338CA">Rejection Gate</text>
  </g>

  <!-- Arrow 3 to Pass (Green, upward slant) -->
  <path d="M 610 135 L 655 118" class="arrow-green" marker-end="url(#arr-g)" />
  <rect x="610" y="110" width="40" height="16" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <text x="630" y="122" class="tag" fill="#047857">Pass</text>

  <!-- Arrow 3 to Fail (Amber, downward slant) -->
  <path d="M 610 210 L 655 228" class="arrow-amber" marker-end="url(#arr-a)" />
  <rect x="610" y="222" width="40" height="16" rx="3" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
  <text x="630" y="234" class="tag" fill="#B45309">Fail</text>

  <!-- Step 4A: Golden Trajectory Curation -->
  <g transform="translate(665, 80)">
    <rect width="270" height="85" rx="2" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" />
    <text x="14" y="24" class="box-title" fill="#15803D">4A. Golden Path Extraction</text>
    <rect x="195" y="10" width="62" height="18" rx="4" fill="#DCFCE7" />
    <text x="226" y="23" class="tag" fill="#166534">Optimal</text>
    <text x="14" y="48" class="box-desc">• Prune redundant tool retries &amp; loops</text>
    <text x="14" y="66" class="box-desc">• Minimal step count: tau* = argmin |tau|</text>
  </g>

  <!-- Step 4B: Error Injection & Recovery Bootstrapping -->
  <g transform="translate(665, 180)">
    <rect width="270" height="95" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
    <text x="14" y="24" class="box-title" fill="#B45309">4B. Error Recovery Synthesis</text>
    <rect x="195" y="10" width="62" height="18" rx="4" fill="#FEF3C7" />
    <text x="226" y="23" class="tag" fill="#92400E">Recovery</text>
    <text x="14" y="48" class="box-desc">• Inject tool failure / API exception</text>
    <text x="14" y="66" class="box-desc">• Prompt teacher for self-correction</text>
    <text x="14" y="84" class="box-desc">• Retain trace if recovery succeeds</text>
  </g>

  <!-- Feedback / Discard for Unrecoverable Failures -->
  <path d="M 800 275 L 800 300 L 522 300 L 522 268" class="arrow" stroke-dasharray="4 3" marker-end="url(#arr)" />
  <rect x="625" y="292" width="115" height="16" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
  <text x="682" y="304" class="tag" fill="#B91C1C">Discard if Unrecovered</text>

  <!-- Downward arrows to Step 5 -->
  <path d="M 935 122 L 945 122 L 945 350 L 910 350" class="arrow-green" marker-end="url(#arr-g)" />
  <path d="M 935 228 L 945 228" class="arrow-amber" />

  <!-- Bottom Container: Loss Masking & SFT Dataset Formatting -->
  <g transform="translate(25, 335)">
    <rect width="910" height="150" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1.5" />
    <rect width="910" height="28" rx="2" fill="#581C87" />
    <rect y="20" width="910" height="8" fill="#581C87" />
    <text x="16" y="19" class="box-title" fill="#FFFFFF">5. Multi-Turn Formatting &amp; Selective Loss Masking Engine</text>

    <!-- Visual Token Sequence Blocks -->
    <g transform="translate(16, 42)">
      <!-- System Prompt -->
      <rect x="0" y="0" width="125" height="40" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="62" y="18" class="tag" fill="#334155">System Prompt</text>
      <text x="62" y="32" style="font-size: 9px; fill: #64748B; text-anchor: middle;">Loss Mask = 0</text>

      <!-- User Instruction -->
      <rect x="135" y="0" width="125" height="40" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="197" y="18" class="tag" fill="#334155">User Instruction</text>
      <text x="197" y="32" style="font-size: 9px; fill: #64748B; text-anchor: middle;">Loss Mask = 0</text>

      <!-- Agent Thought & Tool Call -->
      <rect x="270" y="0" width="155" height="40" rx="5" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1.5" />
      <text x="347" y="18" class="tag" fill="#581C87">Thought + Tool Call</text>
      <text x="347" y="32" style="font-size: 9px; fill: #6B21A8; font-weight: 700; text-anchor: middle;">Loss Mask = 1 (Active)</text>

      <!-- Tool Observation -->
      <rect x="435" y="0" width="145" height="40" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" stroke-dasharray="4 2" />
      <text x="507" y="18" class="tag" fill="#991B1B">Tool Observation</text>
      <text x="507" y="32" style="font-size: 9px; fill: #DC2626; text-anchor: middle;">Loss Mask = 0 (Masked)</text>

      <!-- Agent Recovery / Final Answer -->
      <rect x="590" y="0" width="165" height="40" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <text x="672" y="18" class="tag" fill="#065F46">Recovery + Final Output</text>
      <text x="672" y="32" style="font-size: 9px; fill: #047857; font-weight: 700; text-anchor: middle;">Loss Mask = 1 (Active)</text>

      <!-- Curated Batch Output -->
      <rect x="765" y="0" width="115" height="40" rx="5" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" />
      <text x="822" y="18" class="tag" fill="#6B21A8">SFT Batch</text>
      <text x="822" y="32" style="font-size: 9px; fill: #581C87; font-weight: 700; text-anchor: middle;">D_train (Packed)</text>
    </g>

    <!-- Bottom Annotation -->
    <text x="16" y="112" class="box-desc">
      <tspan font-weight="700" fill="#1E1B4B">Core Systems Invariant:</tspan> Backpropagation updates model weights exclusively over generated thoughts and tool call arguments (L_CE).
    </text>
    <text x="16" y="130" class="box-desc">
      Environment returns (sandbox stdout, database outputs) are strictly masked to prevent hallucinated environment simulation and error propagation.
    </text>
  </g>
</svg>
