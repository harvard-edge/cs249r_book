    - Exact-scan floor and approximate indexes
    - Read-your-writes consistency
  claims:
    Record roles: Persistent records are roles in an evidence chain (source of record, observation log, agent-written
      memory, retrieval index), not storage tiers, and any claim is validated against its source of record.
    Retrieval contract: Every read is a bounded request answered by an envelope that reports scope, snapshot, completeness
      status, and per-item provenance, and an empty result proves nonexistence only for a complete search of the
      declared scope.
    Query formulation choice: A named target gets a direct read, a predictable unnamed set gets pre-staged, and
      a chain where each item is found only from the last forces model-directed probing at one model round per dependent
      hop.
    Bounded multi-hop retrieval: Neighborhoods grow geometrically with traversal depth, so multi-hop retrieval bounds
      edge types, direction, depth, and visited nodes before ranking.
    Memory write policy: 'The runtime, not the model, decides what persists: admission checks run before deduplication,
      same-scope updates supersede by compare-and-swap, and deletion (on request, on withdrawn consent, or at the end of
      a recorded retention period) is a lifecycle event the store must honor.'
    Memory poisoning: Repeated retrieval or re-summarization adds no independent evidence, so preventing a withdrawn
      or unverified claim from persisting needs a provenance graph over derived records whose invalidation cascades.
    Source-generation invalidation: A retrieval index is a materialized view that cannot be maintained by deltas,
      so each derived entry carries a source generation and the gateway admits it only for the generations it is
      valid in.
    Memory policy evaluation: The unit of evaluation is the whole memory policy run through isolated multi-session
      trials with lifecycle fixtures, scored by task acceptance and cost per accepted task including background
      maintenance.
    Matching method: Exact lookup, lexical ranking, structural indexes, and dense similarity answer different information
      needs and fail in different places, and hybrid retrieval joins candidates on full identity.
    Exact-scan floor and approximate indexes: An exact vector scan is bandwidth-bound with floor N*d*b/BW, which
      screens it against the search budget, while approximate indexes trade recall for bytes touched.
    Read-your-writes consistency: A session must observe its own committed memory writes on later reads, which a
      lagging index or replica silently violates unless reads are pinned to a generation at or after the write.
