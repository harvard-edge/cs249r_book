  learner_graph:
    schema_version: 1
    concepts:
    - id: vol3.memory
      label: Persistent memory record
      teaches: Record roles
      summary: A stored cross-session record has an explicit role and provenance; retrieval does not turn
        stored text into an authoritative instruction.
      section: sec-vol3-long-term-memory-record-roles
      aliases:
      - Long-term memory
    - id: vol3.retrieval
      label: Retrieval contract
      teaches: Retrieval contract
      summary: A bounded retrieval request specifies scope and a result envelope retains source identity,
        versions, and access conditions.
      section: sec-vol3-persistent-governance
    - id: vol3.provenance
      label: Source provenance
      teaches: Source-generation invalidation
      summary: A record carries the source and generation needed to determine whether retrieved evidence
        remains valid and permitted.
      section: sec-vol3-persistent-result-envelope
    relationships:
    - id: vol3.field.retrieval.working-context
      source: vol3.retrieval
      predicate: supplies evidence for
      target: vol3.working-context
      explanation: The runtime selects retrieved records for the immediate decision while preserving source,
        version, and serialized payload accounting.
      conditions: The retrieval backend does not choose the prompt; admitted source text remains untrusted
        material rather than authority.
      status: draft
      evidence:
        section: sec-vol3-persistent-quarantine
        quote: 'Piping top-ranked retrieval hits straight from the search backend into the prompt lets uncalibrated
          similarity scores, stripped version labels, and uncounted metadata wrappers overrun the context
          budget or slip stale `r17` excerpts into an `r18` decision. The agent runtime, never the retrieval
          backend or a raw ranking score, therefore decides which records enter the downstream prompt: it
          selects evidence for the immediate decision, keeps the source and version tags needed to interpret
          each item, and accounts for the full serialized token footprint. Staging is where invariant closure
          (principle \ref{pri-invariant-closure}) reaches the durable read boundary. The bound below the
          model is mechanical, because a runtime rule rather than the model or the ranker decides what is
          admitted. The version labels the runtime preserves are the evidence a later acceptance check needs
          to tell an `r17` observation from an `r18` one. Even after those checks, retrieved records remain
          untrusted spans when fetched from a local repository, because serialization that separates them
          from system instructions cannot stop the model from following text embedded in a record body,
          the hazard known as prompt injection.'
    - id: vol3.field.retrieval.memory
      source: vol3.retrieval
      predicate: governs reads of
      target: vol3.memory
      explanation: Reading persistent state must distinguish a genuine historical record from the current
        source version required by the next decision.
      conditions: Records returned for current-state decisions must meet the request version constraints;
        historical evidence can remain valid for historical questions.
      status: draft
      evidence:
        section: sec-vol3-long-term-memory-read-write-lifecycle
        quote: Consider the state of a code-repair agent immediately after it writes revision `r18`. If
          its vector or keyword index was generated from revision `r17`, a retrieval query for `src/pool.py`
          will return the unpatched file. While that record remains an accurate historical reflection of
          `r17`, serving it as current context leads the model to believe the bug persists, prompting redundant
          or conflicting edits. The staleness that context invalidation guards against thus extends beyond
          the active prompt into the persistent storage tiers that feed subsequent inference calls.
    - id: vol3.field.memory.provenance
      source: vol3.memory
      predicate: retains
      target: vol3.provenance
      explanation: Source-linked records preserve the generation required to detect stale derived material.
      conditions: Provenance does not itself prove a claim or grant authority to obey retrieved text.
      status: draft
      evidence:
        section: sec-vol3-long-term-memory-record-roles
        quote: Through the taxonomy of @tbl-vol3-memory-tiers, the published policy page functioned as the
          source of record, while the chatbot's generated response was a derived artifact that diverged
          from ground truth. If a customer-support system logs its previous dialogue turns to inform future
          responses, those conversational turns become agent-written memory. They document past interactions,
          but they never constitute organizational policy. A store that kept the chatbot's wrong answer
          and retrieved it for the next bereavement question would repeat the error with the apparent weight
          of precedent, unless the record carried its role as a derived answer and a link to the policy
          version it claimed to reflect.
    - id: vol3.field.provenance.invalidation
      source: vol3.provenance
      predicate: supports
      target: vol3.invalidation
      explanation: Changed source generations require reconsidering dependent persistent records rather
        than trusting storage recency.
      conditions: Invalidation operates on tracked source dependencies and source scopes.
      status: draft
      evidence:
        section: sec-vol3-long-term-memory-source-generations
        quote: 'Relying on filesystem modification timestamps (`mtime`) to detect stale index entries fails
          when clock skew, branch switches, or sub-millisecond edits leave two revisions with indistinguishable
          timestamps. To guarantee freshness, an index entry must explicitly record the **source generation**\index{Source
          generation!definition} from which it was derived: a monotonic version identity defined by the
          storage system''s write contract. In the connection-pool repair, `r17` and `r18` denote successive
          repository states. Once the runtime establishes `r18` as the active generation, any query seeking
          current code must systematically discard entries tagged with `r17`.'
    maps: []
