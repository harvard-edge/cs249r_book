<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Three ways to handle the index after a source edit commits r18. Durations are the chapter notebook's
       stipulated incremental work (nbk-06-index-maintenance-cost), excluding common durable commit
       and coordination costs and fallback retrieval; the time axis is schematic, not to scale. -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#ffffff"/>
  <rect x="20" y="20" width="640" height="114" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 20 44 V 24 Q 20 20 24 20 H 656 Q 660 20 660 24 V 44 Z" fill="#e2e8f0"/>
  <line x1="20" y1="44" x2="660" y2="44" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Synchronous re-index</text>
  <text x="648" y="36" text-anchor="end" font-size="8.5" fill="#0f172a">indexing: +88 ms (local) to +1.26 s (remote, per file)</text>
  <line x1="180" y1="48" x2="180" y2="130" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="430" y1="48" x2="430" y2="130" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="32" y="64" font-size="8.5" font-weight="700" fill="#475569">agent</text>
  <text x="32" y="90" font-size="8.5" font-weight="700" fill="#475569">worker</text>
  <text x="32" y="116" font-size="8.5" font-weight="700" fill="#475569">index serves</text>
  <rect x="120" y="52" width="58" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="149" y="64" text-anchor="middle" font-size="8" fill="#0f172a">edit r18</text>
  <rect x="182" y="52" width="246" height="18" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="305" y="64" text-anchor="middle" font-size="8" fill="#0f172a">write blocked until re-indexing finishes</text>
  <rect x="440" y="52" width="160" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="520" y="64" text-anchor="middle" font-size="8" fill="#0f172a">query: gets r18 entries</text>
  <rect x="182" y="78" width="246" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="305" y="90" text-anchor="middle" font-size="8" fill="#0f172a">parse, update postings, embed r18</text>
  <rect x="120" y="104" width="308" height="18" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="274" y="116" text-anchor="middle" font-size="8" fill="#0f172a">r17 entries</text>
  <rect x="432" y="104" width="208" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="536" y="116" text-anchor="middle" font-size="8" fill="#0f172a">r18 entries</text>
  <rect x="20" y="150" width="640" height="114" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M 20 174 V 154 Q 20 150 24 150 H 656 Q 660 150 660 154 V 174 Z" fill="#fee2e2"/>
  <line x1="20" y1="174" x2="660" y2="174" stroke="#dc2626" stroke-width="1.2"/>
  <text x="32" y="166" font-size="10" font-weight="700" fill="#0f172a">Background re-index, no generation check</text>
  <text x="648" y="166" text-anchor="end" font-size="8.5" fill="#0f172a">rebuild off write path; stale candidates admitted</text>
  <line x1="180" y1="178" x2="180" y2="260" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="430" y1="178" x2="430" y2="260" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="32" y="194" font-size="8.5" font-weight="700" fill="#475569">agent</text>
  <text x="32" y="220" font-size="8.5" font-weight="700" fill="#475569">worker</text>
  <text x="32" y="246" font-size="8.5" font-weight="700" fill="#475569">index serves</text>
  <rect x="120" y="182" width="58" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="149" y="194" text-anchor="middle" font-size="8" fill="#0f172a">edit r18</text>
  <rect x="250" y="182" width="170" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="335" y="194" text-anchor="middle" font-size="8" fill="#0f172a">query: gets r17 as current source</text>
  <rect x="182" y="208" width="246" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="305" y="220" text-anchor="middle" font-size="8" fill="#0f172a">rebuild r18 in the background</text>
  <rect x="120" y="234" width="58" height="18" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="149" y="246" text-anchor="middle" font-size="8" fill="#0f172a">r17 entries</text>
  <rect x="182" y="234" width="246" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="305" y="246" text-anchor="middle" font-size="8" fill="#0f172a">r17 entries still admitted as current</text>
  <rect x="432" y="234" width="208" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="536" y="246" text-anchor="middle" font-size="8" fill="#0f172a">r18 entries</text>
  <rect x="20" y="280" width="640" height="114" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 20 304 V 284 Q 20 280 24 280 H 656 Q 660 280 660 284 V 304 Z" fill="#dcfce7"/>
  <line x1="20" y1="304" x2="660" y2="304" stroke="#16a34a" stroke-width="1.2"/>
  <text x="32" y="296" font-size="10" font-weight="700" fill="#0f172a">Background re-index with exclusion</text>
  <text x="648" y="296" text-anchor="end" font-size="8.5" fill="#0f172a">local metadata: +0.4 μs/write, +1.5 μs/query</text>
  <line x1="180" y1="308" x2="180" y2="390" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="430" y1="308" x2="430" y2="390" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="32" y="324" font-size="8.5" font-weight="700" fill="#475569">agent</text>
  <text x="32" y="350" font-size="8.5" font-weight="700" fill="#475569">worker</text>
  <text x="32" y="376" font-size="8.5" font-weight="700" fill="#475569">index serves</text>
  <rect x="120" y="312" width="58" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="149" y="324" text-anchor="middle" font-size="8" fill="#0f172a">edit r18</text>
  <rect x="250" y="312" width="170" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="335" y="324" text-anchor="middle" font-size="8" fill="#0f172a">query: r17 excluded; direct read or partial</text>
  <rect x="182" y="338" width="246" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="305" y="350" text-anchor="middle" font-size="8" fill="#0f172a">rebuild r18 in the background</text>
  <text x="438" y="350" font-size="8" fill="#15803d">publish only if still current</text>
  <rect x="120" y="364" width="58" height="18" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="149" y="376" text-anchor="middle" font-size="8" fill="#0f172a">r17 entries</text>
  <rect x="182" y="364" width="246" height="18" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="305" y="376" text-anchor="middle" font-size="8" fill="#0f172a">r17 entries excluded</text>
  <rect x="432" y="364" width="208" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="536" y="376" text-anchor="middle" font-size="8" fill="#0f172a">r18 entries</text>
  <line x1="120" y1="410" x2="646" y2="410" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="112" y="413" text-anchor="end" font-size="8.5" fill="#475569">time</text>
  <line x1="180" y1="405" x2="180" y2="415" stroke="#64748b" stroke-width="1.2"/>
  <line x1="430" y1="405" x2="430" y2="415" stroke="#64748b" stroke-width="1.2"/>
  <text x="180" y="428" text-anchor="middle" font-size="8.5" fill="#475569">r18 committed</text>
  <text x="430" y="428" text-anchor="middle" font-size="8.5" fill="#475569">r18 entries ready</text>
</svg>
