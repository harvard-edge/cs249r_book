<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Filtering during HNSW traversal: a scope mask can disconnect the eligible nodes near q
       from the entry point, so the walk stalls. Right: the three responses named in the prose. -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#ffffff"/>

  <!-- ===== Panel A: masked traversal ===== -->
  <rect x="20" y="20" width="310" height="340" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M 20 44 V 24 Q 20 20 24 20 H 326 Q 330 20 330 24 V 44 Z" fill="#fee2e2"/>
  <line x1="20" y1="44" x2="330" y2="44" stroke="#dc2626" stroke-width="1.2"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">A. Mask applied during the walk</text>

  <!-- links -->
  <line x1="70" y1="110" x2="130" y2="130" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="70" y1="110" x2="90" y2="200" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="90" y1="200" x2="130" y2="130" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="90" y1="200" x2="80" y2="270" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="130" y1="130" x2="190" y2="100" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="130" y1="130" x2="200" y2="160" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="90" y1="200" x2="190" y2="220" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="80" y1="270" x2="180" y2="280" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="190" y1="100" x2="250" y2="90" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="200" y1="160" x2="250" y2="180" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="190" y1="220" x2="250" y2="180" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="180" y1="280" x2="270" y2="250" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="250" y1="90" x2="250" y2="180" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="250" y1="180" x2="270" y2="250" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- the walk -->
  <line x1="78" y1="113" x2="121" y2="127" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- eligible, reachable -->
  <circle cx="70" cy="110" r="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="70" y="92" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">entry</text>
  <circle cx="130" cy="130" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="130" cy="130" r="13" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="90" cy="200" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="80" cy="270" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <!-- masked (ineligible) -->
  <circle cx="190" cy="100" r="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="200" cy="160" r="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="190" cy="220" r="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="180" cy="280" r="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <!-- eligible, stranded near q -->
  <circle cx="250" cy="90" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="250" cy="180" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="270" cy="250" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="290" cy="140" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="290" y="143" text-anchor="middle" font-size="9" font-weight="700" font-style="italic" fill="#0f172a">q</text>

  <text x="138" y="168" font-size="8" fill="#b91c1c">stalls here</text>
  <text x="300" y="282" text-anchor="end" font-size="8" fill="#15803d">eligible near <tspan font-style="italic">q</tspan>, unreachable</text>

  <!-- legend A -->
  <line x1="36" y1="304" x2="314" y2="304" stroke="#cbd5e1" stroke-width="0.8"/>
  <circle cx="44" cy="322" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="325" font-size="8" fill="#475569">eligible for this principal and scope</text>
  <circle cx="44" cy="342" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="56" y="345" font-size="8" fill="#475569">masked: the walk may not step here</text>

  <!-- ===== Panel B: responses ===== -->
  <rect x="350" y="20" width="310" height="340" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 350 44 V 24 Q 350 20 354 20 H 656 Q 660 20 660 24 V 44 Z" fill="#dcfce7"/>
  <line x1="350" y1="44" x2="660" y2="44" stroke="#16a34a" stroke-width="1.2"/>
  <text x="362" y="36" font-size="10" font-weight="700" fill="#0f172a">B. Three responses</text>

  <!-- Row 1: partition -->
  <text x="366" y="64" font-size="9" font-weight="700" fill="#0f172a">Partition along scope boundaries</text>
  <text x="366" y="77" font-size="8" fill="#475569">one graph per tenant or repository</text>
  <rect x="380" y="88" width="110" height="46" rx="3" fill="#f8fafc" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="388" y="100" font-size="8" fill="#475569">scope X</text>
  <line x1="410" y1="118" x2="440" y2="110" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="440" y1="110" x2="470" y2="122" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="410" cy="118" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="440" cy="110" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="470" cy="122" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="520" y="88" width="110" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="528" y="100" font-size="8" fill="#475569">scope Y</text>
  <line x1="550" y1="118" x2="580" y2="110" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="580" y1="110" x2="610" y2="122" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="550" cy="118" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="580" cy="110" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="610" cy="122" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <line x1="366" y1="148" x2="644" y2="148" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Row 2: extra entry points -->
  <text x="366" y="168" font-size="9" font-weight="700" fill="#0f172a">Keep extra entry points</text>
  <text x="366" y="181" font-size="8" fill="#475569">restart the walk inside the eligible region</text>
  <line x1="390" y1="218" x2="420" y2="204" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="420" y1="204" x2="450" y2="226" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="450" y1="226" x2="500" y2="208" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="530" y1="228" x2="560" y2="204" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="560" y1="204" x2="610" y2="222" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="507" y1="211" x2="523" y2="222" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <circle cx="390" cy="218" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="420" cy="204" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="450" cy="226" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="500" cy="208" r="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="500" y="243" text-anchor="middle" font-size="8" font-weight="700" fill="#0369a1">extra entry</text>
  <circle cx="530" cy="228" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="560" cy="204" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="610" cy="222" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="585" cy="228" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="585" y="231" text-anchor="middle" font-size="8.5" font-weight="700" font-style="italic" fill="#0f172a">q</text>

  <line x1="366" y1="256" x2="644" y2="256" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Row 3: exact scan -->
  <text x="366" y="276" font-size="9" font-weight="700" fill="#0f172a">Scan the eligible set exactly</text>
  <text x="366" y="289" font-size="8" fill="#475569">when the filter leaves few vectors</text>
  <circle cx="390" cy="324" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="390" y="327" text-anchor="middle" font-size="8.5" font-weight="700" font-style="italic" fill="#0f172a">q</text>
  <line x1="398" y1="324" x2="446" y2="324" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="422" y="316" text-anchor="middle" font-size="8" fill="#0369a1">score all</text>
  <rect x="450" y="314" width="180" height="20" rx="3" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
  <circle cx="470" cy="324" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="505" cy="324" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="540" cy="324" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="575" cy="324" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="610" cy="324" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
</svg>
