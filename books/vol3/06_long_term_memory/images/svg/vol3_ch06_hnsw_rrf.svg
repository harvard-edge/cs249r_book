<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Two candidate generators, identity join, rank fusion, a cross-encoder over a short pool, then staging. -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#ffffff"/>
  <rect x="170" y="20" width="340" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="340" y="37" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">query</text>
  <text x="340" y="51" text-anchor="middle" font-size="8" fill="#475569">“a connection is returned, but another caller keeps waiting”</text>
  <rect x="100" y="90" width="220" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="210" y="107" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">lexical ranking (BM25)</text>
  <text x="210" y="121" text-anchor="middle" font-size="8" fill="#475569">ranked list; rare identifiers score high</text>
  <rect x="360" y="90" width="220" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="470" y="107" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">dense retrieval (ANN)</text>
  <text x="470" y="121" text-anchor="middle" font-size="8" fill="#475569">ranked list; bridges different wording</text>
  <rect x="170" y="160" width="340" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="177" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">join on candidate identity</text>
  <text x="340" y="191" text-anchor="middle" font-size="8" fill="#475569">scope, path, version, span: r17 and r18 stay distinct</text>
  <rect x="170" y="230" width="340" height="40" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="247" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">reciprocal rank fusion</text>
  <text x="340" y="261" text-anchor="middle" font-size="8" fill="#475569">score = Σ<tspan font-size="6.5" font-style="italic" dy="2">i</tspan><tspan dx="2" dy="-2">1 / (</tspan><tspan font-style="italic">k</tspan><tspan font-size="6.5" dy="2">rrf</tspan><tspan dx="2" dy="-2">+</tspan><tspan dx="2" font-style="italic">r</tspan><tspan font-size="6.5" font-style="italic" dy="2">i</tspan><tspan dy="-2">); ranks only, with</tspan><tspan dx="2.5" font-style="italic">k</tspan><tspan font-size="6.5" dy="2">rrf</tspan><tspan dx="2.5" dy="-2">a chosen parameter</tspan></text>
  <rect x="170" y="300" width="340" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="340" y="317" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">cross-encoder reranker, short pool only</text>
  <text x="340" y="331" text-anchor="middle" font-size="8" fill="#475569">reads query and candidate together; work grows with pool size and pair length</text>
  <rect x="170" y="370" width="340" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="340" y="387" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">stage a small set</text>
  <text x="340" y="401" text-anchor="middle" font-size="8" fill="#475569">within the payload budget, with source and version labels</text>
  <path d="M 340 60 V 74 H 210 V 88" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 340 74 H 470 V 88" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 210 130 V 144 H 334 V 158" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 470 130 V 144 H 346 V 158" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 340 200 V 228" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 340 270 V 298" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 340 340 V 368" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
</svg>
