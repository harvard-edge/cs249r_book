<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- IVF-PQ: build encodes each stored vector and appends its code to a coarse cell's
       inverted list; a query probes a few cells and scores codes by table lookup (ADC).
       Sizes follow the chapter's notebook corpus: 768-d FP16, m = 64 subvectors of 12 dims. -->
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#ffffff"/>

  <!-- ===== Build card ===== -->
  <rect x="20" y="20" width="640" height="140" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 20 44 V 24 Q 20 20 24 20 H 656 Q 660 20 660 24 V 44 Z" fill="#dcfce7"/>
  <line x1="20" y1="44" x2="660" y2="44" stroke="#16a34a" stroke-width="1.2"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Build: encode each stored vector</text>
  <text x="648" y="36" text-anchor="end" font-size="8" fill="#475569">codebooks and centroids are trained at build time</text>

  <!-- stored vector x -->
  <rect x="36" y="56" width="190" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="131" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">stored vector <tspan font-style="italic">x</tspan></text>
  <rect x="51" y="82" width="32" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="83" y="82" width="32" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="115" y="82" width="32" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="147" y="82" width="32" height="20" rx="0" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="179" y="82" width="32" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="67" y="95" text-anchor="middle" font-size="8" fill="#0f172a">1</text>
  <text x="99" y="95" text-anchor="middle" font-size="8" fill="#0f172a">2</text>
  <text x="131" y="95" text-anchor="middle" font-size="8" fill="#0f172a">3</text>
  <text x="163" y="95" text-anchor="middle" font-size="8" fill="#475569">…</text>
  <text x="195" y="95" text-anchor="middle" font-size="8" fill="#0f172a">64</text>
  <text x="131" y="119" text-anchor="middle" font-size="8" fill="#475569">768 dims in FP16, split into</text>
  <text x="131" y="131" text-anchor="middle" font-size="8" fill="#475569"><tspan font-style="italic">m</tspan> = 64 subvectors of 12 dims</text>

  <line x1="226" y1="101" x2="250" y2="101" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>

  <!-- codebook per subspace -->
  <rect x="252" y="56" width="180" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="342" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">codebook for subspace <tspan font-style="italic">j</tspan></text>
  <rect x="270" y="82" width="14" height="14" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="288" y="82" width="14" height="14" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="306" y="82" width="14" height="14" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="324" y="82" width="14" height="14" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <rect x="342" y="82" width="14" height="14" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="372" y="93" text-anchor="middle" font-size="8" fill="#475569">…</text>
  <rect x="388" y="82" width="14" height="14" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="342" y="119" text-anchor="middle" font-size="8" fill="#475569">256 centroids; store the index</text>
  <text x="342" y="131" text-anchor="middle" font-size="8" fill="#475569"><tspan font-style="italic">c</tspan><tspan font-size="6.5" font-style="italic" dy="2">j</tspan><tspan dx="2.5" dy="-2">of the nearest one</tspan></text>

  <line x1="432" y1="101" x2="456" y2="101" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>

  <!-- code -->
  <rect x="458" y="56" width="186" height="90" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="551" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">code for <tspan font-style="italic">x</tspan></text>
  <rect x="476" y="82" width="30" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="506" y="82" width="30" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="536" y="82" width="30" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <rect x="566" y="82" width="30" height="20" rx="0" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="596" y="82" width="30" height="20" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="491" y="95" text-anchor="middle" font-size="8" font-style="italic" fill="#0f172a">c<tspan font-size="6.5" dy="2">1</tspan></text>
  <text x="521" y="95" text-anchor="middle" font-size="8" font-style="italic" fill="#0f172a">c<tspan font-size="6.5" dy="2">2</tspan></text>
  <text x="551" y="95" text-anchor="middle" font-size="8" font-style="italic" fill="#0f172a">c<tspan font-size="6.5" dy="2">3</tspan></text>
  <text x="581" y="95" text-anchor="middle" font-size="8" fill="#475569">…</text>
  <text x="611" y="95" text-anchor="middle" font-size="8" font-style="italic" fill="#0f172a">c<tspan font-size="6.5" dy="2">64</tspan></text>
  <text x="551" y="119" text-anchor="middle" font-size="8" fill="#475569">64 one-byte indices,</text>
  <text x="551" y="131" text-anchor="middle" font-size="8" fill="#475569">24× fewer bytes than the FP16 vector</text>

  <!-- append to nearest coarse cell -->
  <line x1="598" y1="146" x2="598" y2="194" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="590" y="176" text-anchor="end" font-size="8" fill="#475569">append to the cell with the nearest coarse centroid</text>

  <!-- ===== Inverted lists ===== -->
  <text x="36" y="222" font-size="9" font-weight="700" fill="#0f172a">inverted lists</text>
  <text x="36" y="236" font-size="8" fill="#475569"><tspan font-style="italic">C</tspan> coarse cells from</text>
  <text x="36" y="248" font-size="8" fill="#475569"><tspan font-style="italic">k</tspan>-means</text>

  <g>
    <rect x="150" y="196" width="76" height="84" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="188" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">cell 1</text>
    <rect x="160" y="220" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="160" y="236" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="160" y="252" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  </g>
  <g>
    <rect x="240" y="196" width="76" height="84" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="278" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">cell 2</text>
    <rect x="250" y="220" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="250" y="236" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  </g>
  <g>
    <rect x="330" y="196" width="76" height="84" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="368" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">cell 3</text>
    <rect x="340" y="220" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="340" y="236" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="340" y="252" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  </g>
  <g>
    <rect x="420" y="196" width="76" height="84" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="458" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">cell 4</text>
    <rect x="430" y="220" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  </g>
  <text x="528" y="241" text-anchor="middle" font-size="10" fill="#475569">· · ·</text>
  <g>
    <rect x="560" y="196" width="76" height="84" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="598" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">cell <tspan font-style="italic">C</tspan></text>
    <rect x="570" y="220" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="570" y="236" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <rect x="570" y="252" width="56" height="10" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  </g>
  <text x="36" y="266" font-size="8" fill="#0369a1">blue: the <tspan font-style="italic">n</tspan><tspan font-size="6.5" dy="2">probe</tspan></text>
  <text x="36" y="278" font-size="8" fill="#0369a1">cells nearest to <tspan font-style="italic">q</tspan></text>

  <!-- scan probed cells -->
  <line x1="598" y1="280" x2="598" y2="345" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <text x="606" y="300" font-size="8" fill="#0369a1">scan codes</text>

  <!-- ===== Query card ===== -->
  <rect x="20" y="310" width="640" height="130" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M 20 334 V 314 Q 20 310 24 310 H 656 Q 660 310 660 314 V 334 Z" fill="#e0f2fe"/>
  <line x1="20" y1="334" x2="660" y2="334" stroke="#0284c7" stroke-width="1.2"/>
  <text x="32" y="326" font-size="10" font-weight="700" fill="#0f172a">Query: score codes, never the stored vectors</text>

  <rect x="36" y="346" width="118" height="80" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="95" y="364" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">query <tspan font-style="italic">q</tspan></text>
  <text x="95" y="382" text-anchor="middle" font-size="8" fill="#475569">stays in full precision;</text>
  <text x="95" y="394" text-anchor="middle" font-size="8" fill="#475569">split into the same</text>
  <text x="95" y="406" text-anchor="middle" font-size="8" fill="#475569">64 subvectors</text>

  <line x1="154" y1="386" x2="170" y2="386" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="172" y="346" width="128" height="80" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="236" y="364" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">choose cells</text>
  <text x="236" y="382" text-anchor="middle" font-size="8" fill="#475569">compare <tspan font-style="italic">q</tspan> with the</text>
  <text x="236" y="394" text-anchor="middle" font-size="8" fill="#475569"><tspan font-style="italic">C</tspan> centroids; keep the</text>
  <text x="236" y="406" text-anchor="middle" font-size="8" fill="#475569"><tspan font-style="italic">n</tspan><tspan font-size="6.5" dy="2">probe</tspan><tspan dx="2.5" dy="-2">nearest</tspan></text>

  <line x1="300" y1="386" x2="316" y2="386" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="318" y="346" width="136" height="80" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="386" y="364" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">build LUT[<tspan font-style="italic">j</tspan>, <tspan font-style="italic">c</tspan>]</text>
  <text x="386" y="382" text-anchor="middle" font-size="8" fill="#475569">64 × 256 squared distances</text>
  <text x="386" y="394" text-anchor="middle" font-size="8" fill="#475569">from each query subvector</text>
  <text x="386" y="406" text-anchor="middle" font-size="8" fill="#475569">to each centroid; stays in cache</text>

  <line x1="454" y1="386" x2="470" y2="386" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="472" y="346" width="172" height="80" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="558" y="364" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">score each code</text>
  <text x="558" y="382" text-anchor="middle" font-size="8" fill="#0f172a">Σ<tspan font-size="6.5" dy="2" font-style="italic">j</tspan><tspan dx="2.5" dy="-2">LUT[</tspan><tspan font-style="italic">j</tspan>, <tspan font-style="italic">c</tspan><tspan font-size="6.5" font-style="italic" dy="2">j</tspan><tspan dy="-2">]: 64 lookups and adds</tspan></text>
  <text x="558" y="394" text-anchor="middle" font-size="8" fill="#475569">then optionally re-score a short</text>
  <text x="558" y="406" text-anchor="middle" font-size="8" fill="#475569">list with full-precision vectors</text>
</svg>
