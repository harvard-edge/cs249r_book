<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- HNSW search: greedy descent through sparse upper layers, beam search in layer 0.
       Node x-positions are shared across layers; q sits at the same point in every layer. -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="680" height="450" fill="#ffffff"/>

  <!-- ===== Layer cards ===== -->
  <rect x="20" y="20" width="640" height="90" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="140" width="640" height="100" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="20" y="270" width="640" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <text x="36" y="44" font-size="10" font-weight="700" fill="#0f172a">Layer 2</text>
  <text x="36" y="58" font-size="8" fill="#475569">few vectors,</text>
  <text x="36" y="69" font-size="8" fill="#475569">long links</text>

  <text x="36" y="164" font-size="10" font-weight="700" fill="#0f172a">Layer 1</text>
  <text x="36" y="178" font-size="8" fill="#475569">more vectors,</text>
  <text x="36" y="189" font-size="8" fill="#475569">shorter links</text>

  <text x="36" y="294" font-size="10" font-weight="700" fill="#0f172a">Layer 0</text>
  <text x="36" y="308" font-size="8" fill="#475569">every vector,</text>
  <text x="36" y="319" font-size="8" fill="#475569">up to <tspan font-style="italic">M</tspan> links each</text>

  <!-- ===== Layer 2 ===== -->
  <line x1="180" y1="60" x2="440" y2="70" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="440" y1="70" x2="620" y2="58" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="190" y1="60.4" x2="429" y2="69.6" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="310" y="52" text-anchor="middle" font-size="8.5" fill="#0369a1">greedy hop toward <tspan font-weight="700">q</tspan></text>
  <circle cx="180" cy="60" r="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="180" y="86" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">entry point</text>
  <circle cx="440" cy="70" r="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="620" cy="58" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="520" cy="92" r="9" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="520" y="95" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">q</text>

  <!-- Drop 2 -> 1 -->
  <line x1="440" y1="79" x2="440" y2="179" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="448" y="128" font-size="8.5" fill="#475569">no closer neighbor: drop one layer</text>

  <!-- ===== Layer 1 ===== -->
  <line x1="180" y1="180" x2="300" y2="165" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="300" y1="165" x2="440" y2="190" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="180" y1="180" x2="380" y2="215" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="380" y1="215" x2="440" y2="190" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="440" y1="190" x2="620" y2="178" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="480" y1="208" x2="620" y2="178" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="449" y1="194" x2="471" y2="204" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <circle cx="180" cy="180" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="300" cy="165" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="380" cy="215" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="440" cy="190" r="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="480" cy="208" r="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="620" cy="178" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="520" cy="222" r="9" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="520" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">q</text>

  <!-- Drop 1 -> 0 -->
  <line x1="480" y1="217" x2="480" y2="341" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="488" y="258" font-size="8.5" fill="#475569">drop again: start the beam here</text>

  <!-- ===== Layer 0 ===== -->
  <!-- background links -->
  <line x1="170" y1="300" x2="210" y2="350" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="170" y1="300" x2="260" y2="318" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="210" y1="350" x2="300" y2="372" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="260" y1="318" x2="340" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="300" y1="372" x2="380" y2="345" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="340" y1="300" x2="420" y2="305" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="380" y1="345" x2="440" y2="378" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="380" y1="345" x2="455" y2="315" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="420" y1="305" x2="455" y2="315" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="440" y1="378" x2="480" y2="350" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="590" y1="345" x2="620" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="590" y1="345" x2="600" y2="385" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="548" y1="316" x2="620" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="530" y1="358" x2="600" y2="385" stroke="#e2e8f0" stroke-width="1"/>
  <!-- links the beam explored -->
  <line x1="480" y1="350" x2="455" y2="315" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="480" y1="350" x2="530" y2="358" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="480" y1="350" x2="500" y2="303" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="530" y1="358" x2="548" y2="316" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="548" y1="316" x2="590" y2="345" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="500" y1="303" x2="548" y2="316" stroke="#16a34a" stroke-width="1.5"/>
  <!-- unvisited nodes -->
  <circle cx="170" cy="300" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="210" cy="350" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="260" cy="318" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="300" cy="372" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="340" cy="300" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="380" cy="345" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="420" cy="305" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="440" cy="378" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="620" cy="300" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="600" cy="385" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- visited in the beam, not returned -->
  <circle cx="480" cy="350" r="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="455" cy="315" r="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="590" cy="345" r="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <!-- returned: best K = 3 -->
  <circle cx="548" cy="316" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <circle cx="530" cy="358" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <circle cx="500" cy="303" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <!-- query -->
  <circle cx="520" cy="330" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="520" y="333" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">q</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="425" x2="66" y2="425" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="74" y="428" font-size="8.5" fill="#475569">greedy hop</text>
  <circle cx="160" cy="425" r="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="172" y="428" font-size="8.5" fill="#475569">visited by the beam (width <tspan font-style="italic">ef</tspan><tspan font-size="6.5" dy="2">search</tspan><tspan dy="-2">)</tspan></text>
  <circle cx="360" cy="425" r="7" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="372" y="428" font-size="8.5" fill="#475569">returned: best <tspan font-style="italic">k</tspan></text>
  <circle cx="470" cy="425" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="482" y="428" font-size="8.5" fill="#475569">not visited</text>
  <circle cx="566" cy="425" r="7" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="578" y="428" font-size="8.5" fill="#475569">query <tspan font-weight="700">q</tspan></text>
</svg>
