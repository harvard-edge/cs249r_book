<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 4px; }
      .pill { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .title-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .sub-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #475569; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 8.5px; }
      .step-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: AGENT HOST RUNTIME (CLIENT / CALLER)                    -->
  <!-- ================================================================= -->
  <g transform="translate(25, 20)">
    <rect width="260" height="440" class="card"/>
    <rect x="12" y="10" width="180" height="22" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="18" y="25" class="pill" fill="#0369a1">AGENT RUNTIME</text>

    <!-- Context Assembly Engine -->
    <g transform="translate(12, 42)">
      <rect width="236" height="75" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" class="title-txt">Model Call</text>
      <text x="8" y="32" class="sub-txt">Proposes queries; holds no grants</text>
      <text x="8" y="46" class="sub-txt">Runtime fixes scope and ceilings</text>
      <text x="8" y="60" class="sub-txt">Context window ceiling: S_budget tokens</text>
    </g>

    <!-- Outgoing Query Formulation -->
    <g transform="translate(12, 128)">
      <rect width="236" height="155" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="236" height="22" rx="3" fill="#e0f2fe"/>
      <text x="8" y="15" class="title-txt" fill="#0369a1">Query Tuple Formulation</text>
      <text x="8" y="36" class="mono-txt" font-weight="700" fill="#0f172a">Q = &lt;q, S_scope, τ_fresh, ...&gt;</text>
      <text x="8" y="52" class="mono-txt" fill="#334155">q: Text string or embedding</text>
      <text x="8" y="66" class="mono-txt" fill="#334155">S_scope: Target namespace URI</text>
      <text x="8" y="80" class="mono-txt" fill="#334155">τ_fresh: Staleness bound (s)</text>
      <text x="8" y="94" class="mono-txt" fill="#334155">K_top: Ceiling on candidate set</text>
      <text x="8" y="108" class="mono-txt" fill="#334155">T_budget: Hard latency limit (ms)</text>
      <text x="8" y="122" class="mono-txt" fill="#334155">Filter: Deterministic predicate</text>
      <rect x="8" y="130" width="220" height="16" rx="2" fill="#e0f2fe"/>
      <text x="118" y="142" class="mono-txt" font-weight="700" fill="#0369a1" text-anchor="middle">Strictly Typed Query Tuple</text>
    </g>

    <!-- Staged Active Context -->
    <g transform="translate(12, 295)">
      <rect width="236" height="132" rx="3" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
      <rect x="0" y="0" width="236" height="22" rx="3" fill="#dcfce7"/>
      <text x="8" y="15" class="title-txt" fill="#14532d">Working Context Staging</text>
      <text x="8" y="36" class="sub-txt">Verified chunks staged into prompt</text>
      <text x="8" y="50" class="sub-txt">Enforces S_budget token ceiling</text>
      <rect x="8" y="58" width="220" height="62" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="12" y="74" class="mono-txt" font-weight="700" fill="#15803d">&lt;retrieved_context id="1"&gt;</text>
      <text x="12" y="88" class="mono-txt" fill="#334155">source="src/auth.c" hash="7a8f..."</text>
      <text x="12" y="102" class="mono-txt" fill="#334155">score=0.94 trust="authoritative"</text>
      <text x="12" y="114" class="mono-txt" fill="#15803d">&lt;/retrieved_context&gt;</text>
    </g>
  </g>

  <!-- Query Dispatch Arrow (Col 1 -> Col 2) -->
  <g transform="translate(285, 205)">
    <line x1="0" y1="0" x2="68" y2="0" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <rect x="6" y="-22" width="56" height="18" rx="2" fill="#0284c7"/>
    <text x="34" y="-10" class="step-lbl" text-anchor="middle">Issue Q</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: PERSISTENT STORAGE ENGINE                               -->
  <!-- ================================================================= -->
  <g transform="translate(360, 20)">
    <rect width="300" height="440" class="card"/>
    <rect x="12" y="10" width="220" height="22" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
    <text x="18" y="25" class="pill" fill="#b45309">PERSISTENT STORAGE ENGINE</text>

    <!-- Query Validation Gate -->
    <g transform="translate(12, 42)">
      <rect width="276" height="68" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" class="title-txt">Contract Validation &amp; Boundary Guard</text>
      <text x="8" y="30" class="mono-txt" fill="#334155">Namespace Check: S_scope subset of AllowedURIs</text>
      <text x="8" y="44" class="mono-txt" fill="#334155">Budget Enforcer: Timer abort at t = T_budget</text>
      <text x="8" y="58" class="mono-txt" fill="#334155">Freshness Guard: If Δt &gt; τ_fresh ➔ bypass index</text>
    </g>

    <!-- Multi-Index Search Substrate -->
    <g transform="translate(12, 118)">
      <rect width="276" height="148" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="276" height="20" rx="3" fill="#f8fafc"/>
      <text x="8" y="14" class="title-txt">Bounded Multi-Index Retrieval</text>
      
      <!-- Sub-indexes -->
      <g transform="translate(8, 26)">
        <rect width="260" height="32" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="8" y="14" class="mono-txt" font-weight="700" fill="#0284c7">Lexical Postings (BM25)</text>
        <text x="8" y="26" class="sub-txt">Term frequency / IDF matches within S_scope</text>
      </g>

      <g transform="translate(8, 64)">
        <rect width="260" height="32" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="8" y="14" class="mono-txt" font-weight="700" fill="#7c3aed">Dense Vector Index (HNSW / IVF-PQ)</text>
        <text x="8" y="26" class="sub-txt">Sub-linear cosine neighbor search (K &lt;= K_top)</text>
      </g>

      <g transform="translate(8, 102)">
        <rect width="260" height="36" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="8" y="14" class="mono-txt" font-weight="700" fill="#059669">Syntax Graph &amp; Relational Store</text>
        <text x="8" y="26" class="sub-txt">AST scope filter + deterministic SQL metadata</text>
      </g>
    </g>

    <!-- Result Envelope Constructor -->
    <g transform="translate(12, 275)">
      <rect width="276" height="152" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <rect x="0" y="0" width="276" height="22" rx="3" fill="#fef3c7"/>
      <text x="8" y="15" class="title-txt" fill="#b45309">Result Envelope: R_i</text>
      <text x="8" y="36" class="mono-txt" fill="#334155">Content: Raw document passage payload</text>
      <text x="8" y="50" class="mono-txt" fill="#334155">SourceURI: Canonical file / symbol path</text>
      <text x="8" y="64" class="mono-txt" fill="#334155">VersionHash: Git SHA-256 commit digest</text>
      <text x="8" y="78" class="mono-txt" fill="#334155">Timestamp: Index creation wall-clock time</text>
      <text x="8" y="92" class="mono-txt" fill="#334155">Score: Normalized ranking score sigma</text>
      <text x="8" y="106" class="mono-txt" fill="#334155">TrustLevel: Authoritative vs Derived</text>
      <rect x="8" y="118" width="260" height="22" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
      <text x="138" y="132" class="mono-txt" font-weight="700" fill="#b45309" text-anchor="middle">Decoupled Provenance Envelope</text>
    </g>
  </g>

  <!-- Envelope Return Arrow (Col 2 -> Col 3) -->
  <g transform="translate(660, 350)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>
    <rect x="2" y="-22" width="50" height="18" rx="2" fill="#d97706"/>
    <text x="27" y="-10" class="step-lbl" text-anchor="middle">Emit R_i</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 3: INGRESS QUARANTINE & SANITIZATION GATE                  -->
  <!-- ================================================================= -->
  <g transform="translate(720, 20)">
    <rect width="255" height="440" class="card"/>
    <rect x="12" y="10" width="210" height="22" rx="3" fill="#fce7f3" stroke="#fbcfe8" stroke-width="0.8"/>
    <text x="18" y="25" class="pill" fill="#9d174d">INGRESS QUARANTINE GATE</text>

    <!-- Authority & Checksum Verification -->
    <g transform="translate(12, 42)">
      <rect width="231" height="105" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="231" height="20" rx="3" fill="#f8fafc"/>
      <text x="8" y="14" class="title-txt">Authority &amp; Staleness Audit</text>
      <text x="8" y="32" class="sub-txt">Re-hash live source file on disk</text>
      <text x="8" y="46" class="mono-txt" fill="#0f172a">hash(live) == R_i.VersionHash ?</text>
      <text x="8" y="60" class="sub-txt">If mismatched ➔ drop stale candidate</text>
      <text x="8" y="74" class="sub-txt">Enforce freshness bound: Δt &lt;= τ_fresh</text>
      <rect x="8" y="80" width="215" height="18" rx="2" fill="#fdf2f8" stroke="#f472b6" stroke-width="0.8"/>
      <text x="115" y="93" class="mono-txt" font-weight="700" fill="#9d174d" text-anchor="middle">Rejects Epistemic Drift</text>
    </g>

    <!-- Token Budget Allocation -->
    <g transform="translate(12, 155)">
      <rect width="231" height="100" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="231" height="20" rx="3" fill="#f8fafc"/>
      <text x="8" y="14" class="title-txt">Token Budget Allocation</text>
      <text x="8" y="32" class="sub-txt">Filter by score threshold: sigma &gt;= sigma_min</text>
      <text x="8" y="46" class="sub-txt">Sort envelopes descending by score</text>
      <text x="8" y="60" class="sub-txt">Truncate chunk content to S_max ceiling</text>
      <text x="8" y="74" class="sub-txt">Stop allocation when used &gt;= S_budget</text>
      <rect x="8" y="78" width="215" height="16" rx="2" fill="#f1f5f9"/>
      <text x="115" y="90" class="mono-txt" fill="#475569" text-anchor="middle">Bounded Context Ceiling</text>
    </g>

    <!-- Content Sanitization & Defanging -->
    <g transform="translate(12, 263)">
      <rect width="231" height="165" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="0" y="0" width="231" height="22" rx="3" fill="#fee2e2"/>
      <text x="8" y="15" class="title-txt" fill="#991b1b">Prompt Injection Boundary</text>
      <text x="8" y="36" class="sub-txt">Inspect candidate text for escape tags</text>
      <text x="8" y="50" class="sub-txt">Defang adversarial instructions:</text>
      <rect x="8" y="56" width="215" height="32" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="10" y="69" class="mono-txt" font-size="8px" fill="#991b1b">"Ignore prior instructions..."</text>
      <text x="10" y="81" class="mono-txt" font-size="8px" font-weight="700" fill="#dc2626">➔ QUARANTINED / ESCAPED</text>
      <text x="8" y="104" class="sub-txt">Encapsulate in XML schema wrapper</text>
      <rect x="8" y="112" width="215" height="20" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
      <text x="115" y="126" class="mono-txt" font-weight="700" fill="#15803d" text-anchor="middle">Safe Context Envelope</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- UNIFIED RETURN FLOW: CLEANLY ROUTED BELOW CARDS                   -->
  <!-- ================================================================= -->
  <path d="M 840 460 L 840 488 L 150 488 L 150 460" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <rect x="420" y="476" width="160" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="500" y="492" class="mono-txt" font-weight="700" fill="#14532d" text-anchor="middle">Stage Verified Tokens</text>
</svg>