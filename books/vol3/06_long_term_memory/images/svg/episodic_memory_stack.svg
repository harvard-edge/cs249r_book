<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The retrieval contract: bounded request -> retrieval service -> result envelope -> runtime staging. -->
  <defs>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="196" height="236" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <path d="M 20 44 V 23 Q 20 20 23 20 H 213 Q 216 20 216 23 V 44 Z" fill="#f3e8ff"/>
  <line x1="20" y1="44" x2="216" y2="44" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="32" y="36" font-size="10" font-weight="700" fill="#0f172a">Bounded request</text>
  <text x="32" y="62" font-size="8.5" font-weight="700" fill="#6d28d9">information need</text>
  <text x="42" y="74" font-size="8" fill="#475569">query, literal, symbol, or path</text>
  <text x="32" y="94" font-size="8.5" font-weight="700" fill="#6d28d9">scope and principal</text>
  <text x="42" y="106" font-size="8" fill="#475569">checked by the runtime</text>
  <text x="32" y="126" font-size="8.5" font-weight="700" fill="#6d28d9">version requirement</text>
  <text x="42" y="138" font-size="8" fill="#475569">r18, r17 vs. r18, or a snapshot</text>
  <text x="32" y="158" font-size="8.5" font-weight="700" fill="#6d28d9">count and payload limits</text>
  <text x="42" y="170" font-size="8" fill="#475569">items and serialized size</text>
  <text x="32" y="190" font-size="8.5" font-weight="700" fill="#6d28d9">execution limits</text>
  <text x="42" y="202" font-size="8" fill="#475569">deadline, bounded search work</text>
  <text x="32" y="222" font-size="8.5" font-weight="700" fill="#6d28d9">optional filters</text>
  <text x="42" y="234" font-size="8" fill="#475569">file type, symbol kind</text>
  <rect x="242" y="20" width="196" height="236" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 242 44 V 23 Q 242 20 245 20 H 435 Q 438 20 438 23 V 44 Z" fill="#dcfce7"/>
  <line x1="242" y1="44" x2="438" y2="44" stroke="#16a34a" stroke-width="1.2"/>
  <text x="254" y="36" font-size="10" font-weight="700" fill="#0f172a">Retrieval service</text>
  <text x="254" y="62" font-size="8.5" font-weight="700" fill="#15803d">access check</text>
  <text x="264" y="74" font-size="8" fill="#475569">permitted paths and records only</text>
  <text x="254" y="94" font-size="8.5" font-weight="700" fill="#15803d">search method</text>
  <text x="264" y="106" font-size="8" fill="#475569">direct read, exact, lexical,</text>
  <text x="264" y="118" font-size="8" fill="#475569">dense, or structural</text>
  <text x="254" y="142" font-size="8.5" font-weight="700" fill="#15803d">version applicability</text>
  <text x="264" y="154" font-size="8" fill="#475569">exclude inapplicable generations</text>
  <text x="254" y="174" font-size="8.5" font-weight="700" fill="#15803d">limits</text>
  <text x="264" y="186" font-size="8" fill="#475569">stop at deadline or work bound;</text>
  <text x="264" y="198" font-size="8" fill="#475569">record what was covered</text>
  <rect x="464" y="20" width="196" height="236" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 464 44 V 23 Q 464 20 467 20 H 657 Q 660 20 660 23 V 44 Z" fill="#dcfce7"/>
  <line x1="464" y1="44" x2="660" y2="44" stroke="#16a34a" stroke-width="1.2"/>
  <text x="476" y="36" font-size="10" font-weight="700" fill="#0f172a">Result envelope</text>
  <text x="476" y="60" font-size="8" font-weight="700" fill="#475569">for the response</text>
  <text x="476" y="76" font-size="8.5" font-weight="700" fill="#15803d">scope and version searched</text>
  <text x="476" y="94" font-size="8.5" font-weight="700" fill="#15803d">status</text>
  <rect x="514" y="84" width="46" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="537" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803d">complete</text>
  <rect x="564" y="84" width="38" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="583" y="94" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">partial</text>
  <rect x="514" y="102" width="62" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="545" y="112" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b91c1c">unavailable</text>
  <text x="476" y="132" font-size="8.5" font-weight="700" fill="#15803d">limitation and continuation</text>
  <text x="486" y="144" font-size="8" fill="#475569">reason; cursor for a later read</text>
  <line x1="476" y1="162" x2="648" y2="162" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="476" y="178" font-size="8" font-weight="700" fill="#475569">for each item</text>
  <text x="476" y="194" font-size="8.5" font-weight="700" fill="#15803d">content with source identity</text>
  <text x="486" y="206" font-size="8" fill="#475569">path or key, range, version</text>
  <text x="476" y="226" font-size="8.5" font-weight="700" fill="#15803d">provenance and conditions</text>
  <text x="486" y="238" font-size="8" fill="#475569">optional score, named by method</text>
  <line x1="216" y1="138" x2="240" y2="138" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <line x1="438" y1="138" x2="462" y2="138" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <rect x="20" y="290" width="640" height="110" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="32" y="308" font-size="10" font-weight="700" fill="#6d28d9">Agent runtime</text>
  <rect x="36" y="320" width="164" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="118" y="338" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">set the bounds</text>
  <text x="118" y="354" text-anchor="middle" font-size="8" fill="#475569">model may propose terms;</text>
  <text x="118" y="366" text-anchor="middle" font-size="8" fill="#475569">runtime fixes scope and limits</text>
  <rect x="320" y="320" width="150" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="395" y="338" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">stage evidence</text>
  <text x="395" y="354" text-anchor="middle" font-size="8" fill="#475569">select within the payload budget,</text>
  <text x="395" y="366" text-anchor="middle" font-size="8" fill="#475569">keeping source and version labels</text>
  <rect x="498" y="320" width="146" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="571" y="338" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">next model call</text>
  <text x="571" y="354" text-anchor="middle" font-size="8" fill="#475569">measure the serialized request</text>
  <text x="571" y="366" text-anchor="middle" font-size="8" fill="#475569">before dispatch</text>
  <line x1="118" y1="320" x2="118" y2="258" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <path d="M 562 256 V 276 H 395 V 318" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <line x1="470" y1="352" x2="496" y2="352" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
</svg>
