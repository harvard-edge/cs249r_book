<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="boxShadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#581C87"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="640" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="440" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">The Closed-Loop Agentic Execution Architecture</text>
  <text x="440" y="46" text-anchor="middle" font-size="9" fill="#64748B">Formal interaction loop between neural policy proposal and external environment mutation</text>

  <!-- 1. Goal Input Box (Top Center) -->
  <g filter="url(#boxShadow)">
    <rect x="315" y="65" width="250" height="42" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
    <text x="440" y="85" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Delegated Objective / Goal (g)</text>
    <text x="440" y="98" text-anchor="middle" font-size="8" fill="#64748B">User Prompt • API Trigger • Sub-goal Task Specification</text>
  </g>

  <!-- Downward Arrow from Goal to Context Assembly -->
  <line x1="440" y1="107" x2="440" y2="135" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2. Context Assembly Layer -->
  <g filter="url(#boxShadow)">
    <rect x="240" y="135" width="400" height="64" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="440" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1E293B">Perception &amp; Context Assembly Layer</text>
    <text x="440" y="172" text-anchor="middle" font-size="8.5" fill="#475569">History Serialization • Dynamic Window Compaction • Tokenization</text>
    <text x="440" y="186" text-anchor="middle" font-size="8" fill="#64748B">Assembles full trajectory context: h_t = (g, o_0, a_0, ..., o_t)</text>
  </g>

  <!-- Downward Arrow to Neural Policy Engine -->
  <line x1="440" y1="199" x2="440" y2="228" stroke="#581C87" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="460" y="216" font-size="8.5" font-weight="600" fill="#581C87">h_t context</text>

  <!-- 3. Neural Policy Engine (Central Purple Box) -->
  <g filter="url(#boxShadow)">
    <rect x="200" y="228" width="480" height="72" rx="8" fill="#FAF5FF" stroke="#581C87" stroke-width="2"/>
    <rect x="200" y="228" width="480" height="22" rx="8" fill="#581C87"/>
    <rect x="200" y="242" width="480" height="8" fill="#581C87"/>
    <text x="440" y="243" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Neural Policy Engine (pi_theta)</text>
    <text x="440" y="267" text-anchor="middle" font-size="9" font-weight="600" fill="#3B0764">Autoregressive Prefill &amp; Decode • Structured Grammar-Constrained Decoding</text>
    <text x="440" y="284" text-anchor="middle" font-size="8.5" fill="#6B21A8">Emits Action Proposal: a_t ~ pi_theta(· | h_t)</text>
  </g>

  <!-- Split Paths: Left = Internal Thought, Right = External Tool -->
  <!-- Left Path Line -->
  <path d="M 320,300 L 320,335 L 210,335 L 210,360" fill="none" stroke="#7E22CE" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="210" y="348" text-anchor="middle" font-size="8" font-weight="700" fill="#7E22CE">Thought Action (a_thought)</text>

  <!-- Right Path Line -->
  <path d="M 560,300 L 560,335 L 670,335 L 670,360" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="670" y="348" text-anchor="middle" font-size="8" font-weight="700" fill="#2563EB">Tool Action (a_tool)</text>

  <!-- 4A. Left Box: Internal Scratchpad -->
  <g filter="url(#boxShadow)">
    <rect x="90" y="360" width="240" height="64" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.4"/>
    <text x="210" y="382" text-anchor="middle" font-size="10" font-weight="700" fill="#6B21A8">Internal Scratchpad</text>
    <text x="210" y="398" text-anchor="middle" font-size="8.5" fill="#475569">Chain-of-Thought (CoT) / Reflection</text>
    <text x="210" y="412" text-anchor="middle" font-size="7.5" fill="#7E22CE">Pure cognitive state (no environment mutation)</text>
  </g>

  <!-- 4B. Right Box: Tool Execution Sandbox -->
  <g filter="url(#boxShadow)">
    <rect x="520" y="360" width="300" height="68" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="735" y="368" width="75" height="18" rx="3" fill="#DBEAFE"/>
    <text x="772" y="381" text-anchor="middle" font-size="7" font-weight="700" fill="#1D4ED8">ISOLATION</text>
    <text x="540" y="382" text-anchor="start" font-size="10.5" font-weight="700" fill="#1E40AF">Tool Execution Sandbox</text>
    <text x="670" y="399" text-anchor="middle" font-size="8.5" fill="#1E3A8A">Model Context Protocol (MCP) • MicroVM / gVisor</text>
    <text x="670" y="413" text-anchor="middle" font-size="8" fill="#4B5563">Capability checks • AST validation • Resource budgets</text>
  </g>

  <!-- Downward Line from Sandbox to Environment -->
  <line x1="670" y1="428" x2="670" y2="455" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="695" y="444" font-size="7.5" fill="#2563EB">Side Effects</text>

  <!-- 5. Ground-Truth Environment State -->
  <g filter="url(#boxShadow)">
    <rect x="520" y="455" width="300" height="54" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
    <text x="670" y="475" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">Ground-Truth Environment State (S)</text>
    <text x="670" y="490" text-anchor="middle" font-size="8.5" fill="#7F1D1D">Filesystem, OS Processes, Git Repository, Network APIs</text>
    <text x="670" y="502" text-anchor="middle" font-size="7.5" fill="#DC2626">Crossing Reversibility Boundary: s_{t+1} ~ T(s_t, a_tool)</text>
  </g>

  <!-- Downward Line to Runtime Verification Oracle -->
  <line x1="670" y1="509" x2="670" y2="535" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- 6. Runtime Verification Oracle -->
  <g filter="url(#boxShadow)">
    <rect x="520" y="535" width="300" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="670" y="555" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">Runtime Verification Oracle</text>
    <text x="670" y="570" text-anchor="middle" font-size="8.5" fill="#047857">Deterministic Test Suites • Linter Exit Codes • AST Parsers</text>
    <text x="670" y="583" text-anchor="middle" font-size="7.5" fill="#059669">Emits Ground-Truth Observation &amp; Pass/Fail Verdict (o_{t+1})</text>
  </g>

  <!-- Loop Closure Paths Back to Context Assembly Layer -->
  <!-- From Scratchpad (Left) -->
  <path d="M 90,392 L 45,392 L 45,167 L 240,167" fill="none" stroke="#7E22CE" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="35" y="280" transform="rotate(-90, 35, 280)" font-size="8" font-weight="700" fill="#7E22CE">Append Thought to h_{t+1}</text>

  <!-- From Verification Oracle (Right) -->
  <path d="M 670,591 L 670,615 L 845,615 L 845,167 L 640,167" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="857" y="380" transform="rotate(90, 857, 380)" font-size="8" font-weight="700" fill="#059669">Verified Feedback Closes Loop into h_{t+1}</text>
</svg>
