<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The model call surface: a request (context) enters a frozen model, which returns a
       proposal. The stop-reason field is the switch: every path out of the response lands
       in the agent runtime. A tool result returns as a new message appended to the next
       request. Vol III agentic-stack palette: green = context, blue = model, violet = runtime,
       amber = tool execution, red = quarantine (fault). -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="466" fill="#ffffff"/>

  <!-- ===== Request (context) ===== -->
  <rect x="20" y="20" width="230" height="200" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M20,44 V23 A3,3 0 0 1 23,20 H247 A3,3 0 0 1 250,23 V44 Z" fill="#dcfce7"/>
  <line x1="20" y1="44" x2="250" y2="44" stroke="#16a34a" stroke-width="1"/>
  <text x="34" y="37" font-size="14" font-weight="700" fill="#0f172a">Request</text>

  <text x="34" y="68" font-size="13" font-weight="700" fill="#15803d">tools</text>
  <text x="96" y="68" font-size="12" fill="#334155">name, schema</text>
  <text x="34" y="90" font-size="13" font-weight="700" fill="#15803d">limits</text>
  <text x="96" y="90" font-size="12" fill="#334155">tokens, deadline</text>
  <text x="34" y="114" font-size="13" font-weight="700" fill="#15803d">messages</text>

  <!-- message history as a stack of slabs; the tool slab is the result appended by the runtime -->
  <g font-size="12">
    <rect x="34" y="122" width="202" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="42" y="136" font-family="Courier New, monospace" font-weight="700" fill="#15803d">system</text>
    <text x="130" y="136" fill="#334155">rules</text>
    <rect x="34" y="146" width="202" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="42" y="160" font-family="Courier New, monospace" font-weight="700" fill="#15803d">user</text>
    <text x="130" y="160" fill="#334155">task</text>
    <rect x="34" y="170" width="202" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="42" y="184" font-family="Courier New, monospace" font-weight="700" fill="#15803d">assistant</text>
    <text x="130" y="184" fill="#334155">earlier output</text>
    <rect x="34" y="194" width="202" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="42" y="208" font-family="Courier New, monospace" font-weight="700" fill="#15803d">tool</text>
    <text x="130" y="208" fill="#334155">result, by call id</text>
  </g>

  <!-- request -> model -->
  <line x1="250" y1="120" x2="298" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Model (frozen weights) ===== -->
  <rect x="300" y="60" width="150" height="120" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="375" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Model</text>
  <g font-size="14" font-style="italic" fill="#0369a1" text-anchor="middle">
    <rect x="314" y="102" width="34" height="28" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="331" y="121">y<tspan font-size="12" font-style="normal" dy="3">1</tspan></text>
    <rect x="354" y="102" width="34" height="28" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="371" y="121">y<tspan font-size="12" font-style="normal" dy="3">2</tspan></text>
    <rect x="394" y="102" width="34" height="28" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="411" y="121">y<tspan font-size="12" font-style="normal" dy="3">3</tspan></text>
  </g>
  <text x="375" y="152" text-anchor="middle" font-size="12" fill="#334155">one token per step</text>
  <text x="375" y="168" text-anchor="middle" font-size="12" fill="#334155">frozen weights</text>

  <!-- model -> response -->
  <line x1="450" y1="120" x2="498" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Response (a proposal) as a record of fields ===== -->
  <rect x="500" y="20" width="240" height="200" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M500,44 V23 A3,3 0 0 1 503,20 H737 A3,3 0 0 1 740,23 V44 Z" fill="#f1f5f9"/>
  <line x1="500" y1="44" x2="740" y2="44" stroke="#94a3b8" stroke-width="1"/>
  <text x="514" y="37" font-size="14" font-weight="700" fill="#0f172a">Response (a proposal)</text>

  <g font-size="12">
    <text x="514" y="70" font-size="13" font-weight="700" fill="#0f172a">text</text>
    <text x="610" y="70" fill="#334155">reasoning or reply</text>
    <line x1="510" y1="84" x2="730" y2="84" stroke="#e2e8f0" stroke-width="1"/>
    <text x="514" y="108" font-size="13" font-weight="700" fill="#0f172a">tool calls</text>
    <text x="610" y="108" font-family="Courier New, monospace" fill="#334155">run_tests {}</text>
    <line x1="510" y1="122" x2="730" y2="122" stroke="#e2e8f0" stroke-width="1"/>
    <text x="514" y="146" font-size="13" font-weight="700" fill="#0f172a">usage</text>
    <text x="610" y="146" fill="#334155">token counts</text>
  </g>
  <!-- the stop reason field is the switch -->
  <rect x="508" y="164" width="224" height="46" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">stop reason</text>
  <text x="620" y="200" text-anchor="middle" font-size="12" fill="#334155">why decoding ended</text>

  <!-- ===== Agent runtime ===== -->
  <rect x="20" y="260" width="720" height="186" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="34" y="282" font-size="14" font-weight="700" fill="#6d28d9">Agent runtime</text>

  <!-- stop reason -> router -->
  <line x1="620" y1="210" x2="620" y2="308" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- router -->
  <rect x="530" y="310" width="180" height="40" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">route on stop reason</text>

  <!-- branch 1: tool call -->
  <line x1="530" y1="330" x2="452" y2="330" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="491" y="321" text-anchor="middle" font-size="12" fill="#6d28d9">tool call</text>
  <rect x="290" y="310" width="160" height="40" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">validate, authorize</text>
  <line x1="290" y1="330" x2="232" y2="330" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="70" y="310" width="160" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">run in sandbox</text>
  <!-- loop: result returns as a new tool message for the next call -->
  <line x1="150" y1="310" x2="150" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="160" y="239" font-size="12" fill="#15803d">result returns as a</text>
  <text x="160" y="254" font-size="12" fill="#15803d">tool message; call again</text>

  <!-- branch 2: end of turn -->
  <path d="M570,350 V408 H452" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="511" y="400" text-anchor="middle" font-size="12" fill="#6d28d9">end of turn</text>
  <rect x="290" y="388" width="160" height="40" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">verify</text>

  <!-- branch 3: output limit -->
  <line x1="660" y1="350" x2="660" y2="386" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="652" y="373" text-anchor="end" font-size="12" fill="#b91c1c">output limit</text>
  <rect x="600" y="388" width="120" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">quarantine</text>
</svg>
