<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- One turn of the call surface: request -> model -> response, then the runtime routes on the stop reason. -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#ffffff"/>

  <!-- ============ REQUEST CARD ============ -->
  <g transform="translate(20, 20)">
    <rect width="220" height="196" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect width="220" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <rect y="14" width="220" height="10" fill="#dcfce7"/>
    <line x1="0" y1="24" x2="220" y2="24" stroke="#16a34a" stroke-width="1.2"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">Request</text>

    <text x="12" y="42" font-size="8.5" font-weight="700" fill="#15803d">messages</text>
    <text x="22" y="56" font-size="8" fill="#475569"><tspan font-family="Courier New, monospace" fill="#0f172a">system</tspan>  rules, policies</text>
    <text x="22" y="68" font-size="8" fill="#475569"><tspan font-family="Courier New, monospace" fill="#0f172a">user</tspan>  task</text>
    <text x="22" y="80" font-size="8" fill="#475569"><tspan font-family="Courier New, monospace" fill="#0f172a">assistant</tspan>  earlier outputs</text>
    <text x="22" y="92" font-size="8" fill="#475569"><tspan font-family="Courier New, monospace" fill="#0f172a">tool</tspan>  results, by call id</text>

    <text x="12" y="112" font-size="8.5" font-weight="700" fill="#15803d">tools</text>
    <text x="22" y="126" font-size="8" fill="#475569">name, description, argument schema</text>

    <text x="12" y="146" font-size="8.5" font-weight="700" fill="#15803d">limits</text>
    <text x="22" y="160" font-size="8" fill="#475569">max output tokens, deadline</text>
    <text x="22" y="172" font-size="8" fill="#475569">reasoning budget</text>
    <text x="22" y="184" font-size="8" fill="#475569">sampling (τ, p), stop sequences</text>
  </g>

  <!-- Request -> Model -->
  <line x1="240" y1="118" x2="268" y2="118" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <!-- ============ MODEL CARD ============ -->
  <g transform="translate(270, 58)">
    <rect width="140" height="120" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="140" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <rect y="14" width="140" height="10" fill="#e0f2fe"/>
    <line x1="0" y1="24" x2="140" y2="24" stroke="#0284c7" stroke-width="1.2"/>
    <text x="70" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Model</text>

    <text x="70" y="44" text-anchor="middle" font-size="8" fill="#475569">reads the whole context</text>
    <text x="70" y="58" text-anchor="middle" font-size="8" fill="#475569">samples one token per step</text>

    <!-- token row -->
    <g transform="translate(14, 70)">
      <rect x="0" y="0" width="24" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.9"/>
      <text x="12" y="12.5" text-anchor="middle" font-size="8" font-family="Courier New, monospace" fill="#0369a1">y₁</text>
      <rect x="28" y="0" width="24" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.9"/>
      <text x="40" y="12.5" text-anchor="middle" font-size="8" font-family="Courier New, monospace" fill="#0369a1">y₂</text>
      <rect x="56" y="0" width="24" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.9"/>
      <text x="68" y="12.5" text-anchor="middle" font-size="8" font-family="Courier New, monospace" fill="#0369a1">y₃</text>
      <text x="92" y="12.5" text-anchor="middle" font-size="8" fill="#64748b">…</text>
    </g>
    <text x="70" y="108" text-anchor="middle" font-size="8" fill="#475569">weights frozen, no memory</text>
  </g>

  <!-- Model -> Response -->
  <line x1="410" y1="118" x2="438" y2="118" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <!-- ============ RESPONSE CARD ============ -->
  <g transform="translate(440, 20)">
    <rect width="220" height="196" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="220" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <rect y="14" width="220" height="10" fill="#e0f2fe"/>
    <line x1="0" y1="24" x2="220" y2="24" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">Response (a proposal)</text>

    <text x="12" y="42" font-size="8.5" font-weight="700" fill="#0369a1">text</text>
    <text x="22" y="56" font-size="8" fill="#475569">reasoning or reply</text>

    <text x="12" y="76" font-size="8.5" font-weight="700" fill="#0369a1">tool calls (zero or more)</text>
    <rect x="22" y="84" width="186" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="30" y="97" font-size="8" font-family="Courier New, monospace" fill="#0f172a">id: call_1</text>
    <text x="30" y="109" font-size="8" font-family="Courier New, monospace" fill="#0f172a">run_tests  {}</text>

    <text x="12" y="134" font-size="8.5" font-weight="700" fill="#0369a1">stop reason</text>
    <text x="22" y="148" font-size="8" fill="#475569">end of turn, tool call, output limit,</text>
    <text x="22" y="160" font-size="8" fill="#475569">stop sequence, refusal</text>

    <text x="12" y="180" font-size="8.5" font-weight="700" fill="#0369a1">usage</text>
    <text x="52" y="180" font-size="8" fill="#475569">input, output, cached tokens</text>
  </g>

  <!-- ============ RUNTIME LANE ============ -->
  <rect x="20" y="246" width="640" height="160" rx="3" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="32" y="264" font-size="10" font-weight="700" fill="#6d28d9">Agent runtime</text>

  <!-- Response -> router -->
  <line x1="580" y1="216" x2="580" y2="282" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>

  <!-- Router -->
  <rect x="490" y="284" width="160" height="30" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="570" y="302.5" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">route on stop reason</text>

  <!-- Tool-call path: router -> validate -->
  <line x1="490" y1="299" x2="402" y2="299" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <text x="446" y="292" text-anchor="middle" font-size="8" fill="#6d28d9">tool call</text>

  <rect x="290" y="284" width="110" height="30" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="345" y="302.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">validate, authorize</text>

  <!-- validate -> sandbox -->
  <line x1="290" y1="299" x2="242" y2="299" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-amber)"/>

  <rect x="130" y="284" width="110" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="185" y="302.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">run in sandbox</text>

  <!-- sandbox -> back to request as tool message -->
  <path d="M 130 299 H 80 V 218" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="88" y="235" font-size="8" fill="#15803d">result returns as a tool message; call again</text>

  <!-- Router -> verify / quarantine -->
  <line x1="530" y1="314" x2="530" y2="358" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <text x="524" y="340" text-anchor="end" font-size="8" fill="#15803d">end of turn</text>
  <rect x="480" y="360" width="100" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="530" y="378.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">verify</text>

  <line x1="620" y1="314" x2="620" y2="358" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <text x="614" y="340" text-anchor="end" font-size="8" fill="#b91c1c">output limit</text>
  <rect x="588" y="360" width="64" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="620" y="378.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">quarantine</text>
</svg>
