<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Streaming validation and cancellation: tokens stream from the model service to the runtime;
       the runtime's incremental parser rejects token 96 and cancels the request. -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="424" fill="#ffffff"/>

  <!-- ===== Lane headers ===== -->
  <rect x="20" y="20" width="280" height="30" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="160" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Agent runtime (stream validator)</text>

  <rect x="330" y="20" width="100" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="380" y="39" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">token stream</text>

  <rect x="460" y="20" width="280" height="30" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="600" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Model service (decoding)</text>

  <!-- ===== Lifelines ===== -->
  <line x1="160" y1="50" x2="160" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="50" x2="380" y2="300" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="600" y1="50" x2="600" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== Step 1 ===== -->
  <rect x="500" y="70" width="200" height="30" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="510" y="83" font-size="8.5" font-weight="700" fill="#0f172a">decode step 1</text>
  <text x="510" y="94" font-size="8" font-family="Courier New, monospace" fill="#0369a1">{</text>
  <line x1="500" y1="85" x2="262" y2="85" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="60" y="70" width="200" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="70" y="83" font-size="8.5" font-weight="700" fill="#15803d">parser q0 → q1</text>
  <text x="70" y="94" font-size="8" fill="#166534">prefix fits the schema; held</text>

  <!-- ===== Step 2 ===== -->
  <rect x="500" y="116" width="200" height="30" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="510" y="129" font-size="8.5" font-weight="700" fill="#0f172a">decode step 2</text>
  <text x="510" y="140" font-size="8" font-family="Courier New, monospace" fill="#0369a1">"query"</text>
  <line x1="500" y1="131" x2="262" y2="131" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <rect x="60" y="116" width="200" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="70" y="129" font-size="8.5" font-weight="700" fill="#15803d">parser q1 → q2</text>
  <text x="70" y="140" font-size="8" fill="#166534">prefix fits the schema; held</text>

  <!-- ===== Ellipsis ===== -->
  <rect x="290" y="158" width="180" height="16" fill="#ffffff"/>
  <text x="380" y="170" text-anchor="middle" font-size="8.5" fill="#64748b">steps 3 to 95 continue</text>

  <!-- ===== Step 96: violation ===== -->
  <rect x="500" y="186" width="200" height="30" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="510" y="199" font-size="8.5" font-weight="700" fill="#0f172a">decode step 96</text>
  <text x="510" y="210" font-size="8" font-family="Courier New, monospace" fill="#b91c1c">"force":</text>
  <line x1="500" y1="201" x2="262" y2="201" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>
  <rect x="60" y="186" width="200" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="70" y="199" font-size="8.5" font-weight="700" fill="#991b1b">rejected: key not in schema</text>
  <text x="70" y="210" font-size="8" fill="#b91c1c">status REJECTED</text>

  <!-- ===== Cancel ===== -->
  <rect x="60" y="236" width="200" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="249" font-size="8.5" font-weight="700" fill="#0f172a">discard the partial proposal</text>
  <text x="70" y="260" font-size="8" fill="#475569">nothing dispatched</text>
  <line x1="260" y1="251" x2="498" y2="251" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="330" y="241" width="100" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="380" y="254.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">cancel request</text>
  <rect x="500" y="236" width="200" height="30" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="510" y="249" font-size="8.5" font-weight="700" fill="#0f172a">decoding stops</text>
  <text x="510" y="260" font-size="8" fill="#475569">at step 96 of up to 4,096</text>

  <!-- ===== Outcome cards ===== -->
  <rect x="20" y="310" width="280" height="94" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="20" y="310" width="280" height="24" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="20" y="324" width="280" height="10" fill="#f3e8ff"/>
  <line x1="20" y1="334" x2="300" y2="334" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="32" y="326" font-size="9.5" font-weight="700" fill="#0f172a">Runtime outcome</text>
  <text x="32" y="354" font-size="8.5" fill="#334155">partial proposal never dispatched</text>
  <text x="32" y="374" font-size="8.5" fill="#334155">rejection recorded in the envelope</text>
  <text x="32" y="394" font-size="8.5" fill="#334155">error returned to the model next turn</text>

  <rect x="460" y="310" width="280" height="94" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="460" y="310" width="280" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="460" y="324" width="280" height="10" fill="#e0f2fe"/>
  <line x1="460" y1="334" x2="740" y2="334" stroke="#0284c7" stroke-width="1.2"/>
  <text x="472" y="326" font-size="9.5" font-weight="700" fill="#0f172a">Service outcome</text>
  <text x="472" y="354" font-size="8.5" fill="#334155">up to 4,000 decode steps not run</text>
  <text x="472" y="374" font-size="8.5" fill="#334155">request leaves the batch</text>
  <text x="472" y="394" font-size="8.5" fill="#334155">its KV cache memory is released</text>
</svg>
