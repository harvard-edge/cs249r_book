<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Reject, then cancel. Top: the call's output allowance drawn to scale (4,096 steps across
       540 px), with the 96 decoded steps as a thin solid sliver and the steps a honored cancel
       spares as a dashed region. Middle: a zoom into the decoded sliver shows the token stream.
       Bottom: the runtime's stream validator advances a parser state per prefix, rejects the
       out-of-schema key at step 96, and sends the cancel request back to the service.
       Numbers match the StreamCancel LEGO cell (k_cap = 4,096, k_cut = 96, 4,000 spared). -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="720" height="362" fill="#ffffff"/>

  <!-- ===== Lane labels ===== -->
  <g font-size="13" font-weight="700">
    <text x="20" y="58" fill="#0369a1">Model service</text>
    <text x="20" y="148" fill="#0f172a">Token stream</text>
    <text x="20" y="226" fill="#6d28d9">Agent runtime</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="20" y="74">output allowance</text>
    <text x="20" y="164">steps 1 to 96</text>
    <text x="20" y="242">stream validator</text>
  </g>

  <!-- ===== Output allowance to scale: 540 px = 4,096 steps ===== -->
  <text x="150" y="30" font-size="12" fill="#475569">step 96</text>
  <text x="690" y="30" text-anchor="end" font-size="12" fill="#475569">4,096</text>
  <line x1="163" y1="34" x2="163" y2="44" stroke="#475569" stroke-width="1"/>
  <line x1="690" y1="34" x2="690" y2="44" stroke="#475569" stroke-width="1"/>
  <rect x="163" y="44" width="527" height="36" rx="0" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="426" y="67" text-anchor="middle" font-size="13" fill="#0369a1">up to 4,000 decode steps not run</text>
  <rect x="150" y="44" width="13" height="36" rx="0" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>

  <!-- ===== Zoom into the decoded sliver ===== -->
  <path d="M150,80 L163,80 L470,118 L150,118 Z" fill="#f1f5f9"/>
  <line x1="163" y1="80" x2="470" y2="118" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="150" y="118" width="320" height="56" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>

  <g text-anchor="middle">
    <rect x="160" y="126" width="50" height="40" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="185" y="143" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0f172a">{</text>
    <text x="185" y="159" font-size="12" fill="#475569">1</text>

    <rect x="220" y="126" width="80" height="40" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="260" y="143" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0f172a">"query"</text>
    <text x="260" y="159" font-size="12" fill="#475569">2</text>

    <text x="330" y="143" font-size="13" fill="#475569">…</text>
    <text x="330" y="159" font-size="12" fill="#475569">3–95</text>

    <rect x="360" y="126" width="100" height="40" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="410" y="143" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#b91c1c">"force":</text>
    <text x="410" y="159" font-size="12" fill="#b91c1c">96</text>
  </g>

  <!-- tokens -> validator -->
  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)">
    <line x1="185" y1="174" x2="185" y2="198"/>
    <line x1="260" y1="174" x2="260" y2="198"/>
    <line x1="410" y1="174" x2="410" y2="198"/>
  </g>

  <!-- ===== Validator states ===== -->
  <g text-anchor="middle">
    <rect x="150" y="200" width="70" height="44" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="185" y="218" font-size="13" font-weight="700" fill="#0f172a">q<tspan font-size="12" dy="3">0</tspan><tspan dy="-3"> → q</tspan><tspan font-size="12" dy="3">1</tspan></text>
    <text x="185" y="236" font-size="12" fill="#475569">held</text>

    <rect x="225" y="200" width="70" height="44" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="260" y="218" font-size="13" font-weight="700" fill="#0f172a">q<tspan font-size="12" dy="3">1</tspan><tspan dy="-3"> → q</tspan><tspan font-size="12" dy="3">2</tspan></text>
    <text x="260" y="236" font-size="12" fill="#475569">held</text>

    <text x="330" y="226" font-size="13" fill="#475569">…</text>

    <rect x="350" y="200" width="120" height="44" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="410" y="218" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#b91c1c">REJECTED</text>
    <text x="410" y="236" font-size="12" fill="#b91c1c">key not in schema</text>
  </g>

  <!-- ===== Cancel request back to the service ===== -->
  <path d="M470,222 H590 V82" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="600" y="152" font-size="13" font-weight="700" fill="#b91c1c">cancel</text>
  <text x="600" y="168" font-size="13" font-weight="700" fill="#b91c1c">request</text>

  <!-- ===== Outcomes ===== -->
  <line x1="150" y1="276" x2="470" y2="276" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="150" y="268" font-size="13" font-weight="700" fill="#6d28d9">Runtime, regardless of the service</text>
  <g font-size="12" fill="#334155">
    <text x="150" y="298">partial proposal never dispatched</text>
    <text x="150" y="318">rejection recorded in the envelope</text>
    <text x="150" y="338">error returned to the model next turn</text>
  </g>

  <line x1="500" y1="276" x2="690" y2="276" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="500" y="268" font-size="13" font-weight="700" fill="#0369a1">Service, if honored</text>
  <g font-size="12" fill="#334155">
    <text x="500" y="298">decoding stops at step 96</text>
    <text x="500" y="318">request leaves the batch</text>
    <text x="500" y="338">KV cache memory released</text>
  </g>
</svg>
