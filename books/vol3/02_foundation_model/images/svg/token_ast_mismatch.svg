<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The same Python line, unindented and indented by four spaces, as a compiler lexer
       sees it (panel 1) and as the cl100k_base byte-pair vocabulary encodes it (panel 2).
       Token IDs verified with tiktoken cl100k_base:
         "def get_user_id():"      -> [755, 636, 3398, 851, 4658]
         "    def get_user_id():"  -> [262, 711, 636, 3398, 851, 4658]
       262 = three spaces; 711 = " def" (leading space attached). -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="720" height="352" fill="#ffffff"/>

  <!-- ============ PANEL 1: COMPILER LEXER ============ -->
  <g transform="translate(20, 20)">
    <rect width="680" height="142" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="680" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="1" y="14" width="678" height="10" fill="#e2e8f0"/>
    <line x1="0" y1="24" x2="680" y2="24" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">1  Compiler lexer</text>

    <!-- Row A: unindented -->
    <rect x="14" y="36" width="160" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="56" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#0f172a">def get_user_id():</text>
    <line x1="174" y1="52" x2="267" y2="52" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <g font-family="Courier New, monospace" text-anchor="middle">
      <rect x="268" y="36" width="56" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="296" y="50" font-size="9" font-weight="700" fill="#0f172a">def</text>
      <rect x="330" y="36" width="100" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="380" y="50" font-size="9" font-weight="700" fill="#0f172a">get_user_id</text>
      <rect x="436" y="36" width="36" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="454" y="50" font-size="9" font-weight="700" fill="#0f172a">(</text>
      <rect x="478" y="36" width="36" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="496" y="50" font-size="9" font-weight="700" fill="#0f172a">)</text>
      <rect x="520" y="36" width="36" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="538" y="50" font-size="9" font-weight="700" fill="#0f172a">:</text>
    </g>
    <g font-size="8" fill="#64748b" text-anchor="middle">
      <text x="296" y="62">keyword</text>
      <text x="380" y="62">identifier</text>
      <text x="454" y="62">punct.</text>
      <text x="496" y="62">punct.</text>
      <text x="538" y="62">punct.</text>
    </g>

    <!-- Row B: indented four spaces -->
    <rect x="14" y="78" width="160" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="98" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#0f172a"><tspan fill="#94a3b8">␣␣␣␣</tspan>def get_user_id():</text>
    <line x1="174" y1="94" x2="205" y2="94" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <g font-family="Courier New, monospace" text-anchor="middle">
      <rect x="206" y="78" width="56" height="32" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="234" y="92" font-size="9" font-weight="700" fill="#475569">indent</text>
      <rect x="268" y="78" width="56" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="296" y="92" font-size="9" font-weight="700" fill="#0f172a">def</text>
      <rect x="330" y="78" width="100" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="380" y="92" font-size="9" font-weight="700" fill="#0f172a">get_user_id</text>
      <rect x="436" y="78" width="36" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="454" y="92" font-size="9" font-weight="700" fill="#0f172a">(</text>
      <rect x="478" y="78" width="36" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="496" y="92" font-size="9" font-weight="700" fill="#0f172a">)</text>
      <rect x="520" y="78" width="36" height="32" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="538" y="92" font-size="9" font-weight="700" fill="#0f172a">:</text>
    </g>
    <g font-size="8" fill="#64748b" text-anchor="middle">
      <text x="234" y="104">block depth</text>
      <text x="296" y="104">keyword</text>
      <text x="380" y="104">identifier</text>
      <text x="454" y="104">punct.</text>
      <text x="496" y="104">punct.</text>
      <text x="538" y="104">punct.</text>
    </g>

    <text x="14" y="130" font-size="8.5" fill="#475569">Indentation becomes block structure. The keyword <tspan font-family="Courier New, monospace" font-weight="700" fill="#0f172a">def</tspan> and the identifier are the same tokens in both lines.</text>
  </g>

  <!-- ============ PANEL 2: BYTE-PAIR TOKENIZER ============ -->
  <g transform="translate(20, 176)">
    <rect width="680" height="156" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect width="680" height="24" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <rect x="1" y="14" width="678" height="10" fill="#e0f2fe"/>
    <line x1="0" y1="24" x2="680" y2="24" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="16" font-size="10" font-weight="700" fill="#0f172a">2  Byte-pair tokenizer (cl100k_base)</text>

    <!-- Row A: unindented -->
    <rect x="14" y="36" width="160" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="56" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#0f172a">def get_user_id():</text>
    <line x1="174" y1="52" x2="267" y2="52" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <g font-family="Courier New, monospace" text-anchor="middle">
      <rect x="268" y="36" width="56" height="32" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="296" y="50" font-size="9" font-weight="700" fill="#b91c1c">def</text>
      <text x="296" y="62" font-size="8" fill="#b91c1c">755</text>

      <rect x="330" y="36" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="359" y="50" font-size="9" font-weight="700" fill="#0f172a">␣get</text>
      <text x="359" y="62" font-size="8" fill="#0369a1">636</text>
      <rect x="394" y="36" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="423" y="50" font-size="9" font-weight="700" fill="#0f172a">_user</text>
      <text x="423" y="62" font-size="8" fill="#0369a1">3398</text>
      <rect x="458" y="36" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="487" y="50" font-size="9" font-weight="700" fill="#0f172a">_id</text>
      <text x="487" y="62" font-size="8" fill="#0369a1">851</text>
      <rect x="522" y="36" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="551" y="50" font-size="9" font-weight="700" fill="#0f172a">():</text>
      <text x="551" y="62" font-size="8" fill="#0369a1">4658</text>
    </g>
    <text x="600" y="56" font-size="9" font-weight="700" fill="#0f172a">5 tokens</text>

    <!-- Row B: indented four spaces -->
    <rect x="14" y="78" width="160" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="98" font-family="Courier New, monospace" font-size="9.5" font-weight="700" fill="#0f172a"><tspan fill="#94a3b8">␣␣␣␣</tspan>def get_user_id():</text>
    <line x1="174" y1="94" x2="205" y2="94" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <g font-family="Courier New, monospace" text-anchor="middle">
      <rect x="206" y="78" width="56" height="32" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="234" y="92" font-size="9" font-weight="700" fill="#b91c1c">␣␣␣</text>
      <text x="234" y="104" font-size="8" fill="#b91c1c">262</text>
      <rect x="268" y="78" width="56" height="32" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="296" y="92" font-size="9" font-weight="700" fill="#b91c1c">␣def</text>
      <text x="296" y="104" font-size="8" fill="#b91c1c">711</text>

      <rect x="330" y="78" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="359" y="92" font-size="9" font-weight="700" fill="#0f172a">␣get</text>
      <text x="359" y="104" font-size="8" fill="#0369a1">636</text>
      <rect x="394" y="78" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="423" y="92" font-size="9" font-weight="700" fill="#0f172a">_user</text>
      <text x="423" y="104" font-size="8" fill="#0369a1">3398</text>
      <rect x="458" y="78" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="487" y="92" font-size="9" font-weight="700" fill="#0f172a">_id</text>
      <text x="487" y="104" font-size="8" fill="#0369a1">851</text>
      <rect x="522" y="78" width="58" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="551" y="92" font-size="9" font-weight="700" fill="#0f172a">():</text>
      <text x="551" y="104" font-size="8" fill="#0369a1">4658</text>
    </g>
    <text x="600" y="98" font-size="9" font-weight="700" fill="#b91c1c">6 tokens</text>

    <!-- Brackets and annotations -->
    <path d="M 206,116 V 121 H 324 V 116" fill="none" stroke="#dc2626" stroke-width="1"/>
    <text x="265" y="134" font-size="8" fill="#b91c1c" text-anchor="middle">4th space joins the keyword:</text>
    <text x="265" y="145" font-size="8" fill="#b91c1c" text-anchor="middle">711 replaces 755</text>

    <path d="M 330,116 V 121 H 580 V 116" fill="none" stroke="#0284c7" stroke-width="1"/>
    <text x="455" y="134" font-size="8" fill="#0369a1" text-anchor="middle">same four tokens and IDs in both lines</text>
  </g>
</svg>
