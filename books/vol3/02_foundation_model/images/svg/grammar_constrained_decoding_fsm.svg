<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Grammar-constrained decoding. Top: the tool schema compiles once into an automaton;
       every state carries a precomputed token mask (bit strip, filled = legal). Bottom: at
       one step in state q0 the mask is looked up and added to the logits; the fluent but
       illegal candidates go to -inf (dashed ghosts), only the legal one survives, the sampled
       token advances the automaton to q1. Logit values are illustrative (as in the caption).
       Mask bits for q0 and q1 are the illustrative vectors of the earlier figure. -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#ffffff"/>
  <!-- ===== Tool schema (compiled once) ===== -->
  <text x="20" y="62" font-size="13" font-weight="700" fill="#0f172a">Compiled once</text>
  <rect x="20" y="74" width="180" height="64" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="32" y="94" font-size="12" font-weight="700" fill="#b45309">tool schema</text>
  <text x="32" y="113" font-family="Courier New, monospace" font-size="12" fill="#0f172a">{"query": string,</text>
  <text x="32" y="129" font-family="Courier New, monospace" font-size="12" fill="#0f172a"> "limit": integer}</text>
  <line x1="200" y1="106" x2="276" y2="106" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="238" y="98" text-anchor="middle" font-size="12" fill="#475569">compile</text>
  <!-- ===== Automaton: states with per-state masks above ===== -->
  <text x="250" y="46" text-anchor="end" font-size="12" fill="#475569">mask</text>
  <rect x="260" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="270" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="280" y="34" width="10" height="16" rx="0" fill="#0284c7" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="290" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="300" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="310" y="34" width="10" height="16" rx="0" fill="#0284c7" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="320" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
  <rect x="330" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>
  <line x1="300" y1="50" x2="300" y2="85" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="380" y="34" width="10" height="16" rx="0" fill="#0284c7" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="390" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="400" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="410" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="420" y="34" width="10" height="16" rx="0" fill="#0284c7" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="430" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="440" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="450" y="34" width="10" height="16" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="420" y1="50" x2="420" y2="85" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="500" y="34" width="80" height="16" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="540" y1="50" x2="540" y2="85" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="610" y="34" width="80" height="16" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="650" y1="50" x2="650" y2="85" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="320" y1="106" x2="398" y2="106" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="360" y="128" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0369a1">"{"</text>
  <line x1="440" y1="106" x2="518" y2="106" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="480" y="128" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#334155">"query"</text>
  <line x1="560" y1="106" x2="626" y2="106" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arr-gray)"/>
  <circle cx="300" cy="106" r="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="298" y="110" text-anchor="middle" font-size="15" fill="#0f172a"><tspan font-style="italic">q</tspan><tspan font-size="12" font-style="normal" dy="3">0</tspan></text>
  <circle cx="420" cy="106" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="418" y="110" text-anchor="middle" font-size="15" fill="#0f172a"><tspan font-style="italic">q</tspan><tspan font-size="12" font-style="normal" dy="3">1</tspan></text>
  <circle cx="540" cy="106" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="538" y="110" text-anchor="middle" font-size="15" fill="#0f172a"><tspan font-style="italic">q</tspan><tspan font-size="12" font-style="normal" dy="3">2</tspan></text>
  <circle cx="650" cy="106" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="650" cy="106" r="16" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="648" y="110" text-anchor="middle" font-size="15" fill="#0f172a"><tspan font-style="italic">q</tspan><tspan font-size="12" font-style="normal" dy="3">F</tspan></text>
  <!-- ===== One decoding step in state q0 ===== -->
  <text x="20" y="226" font-size="13" font-weight="700" fill="#0f172a">logits <tspan font-weight="700">z</tspan><tspan font-size="12" dy="3">t</tspan></text>
  <line x1="20" y1="380" x2="240" y2="380" stroke="#64748b" stroke-width="1"/>
  <rect x="33" y="295" width="34" height="85" rx="0" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="50" y="288" text-anchor="middle" font-size="12" fill="#334155">+14.2</text>
  <text x="50" y="398" text-anchor="middle" font-size="12" fill="#334155">SELECT</text>
  <rect x="87" y="269" width="34" height="111" rx="0" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="104" y="262" text-anchor="middle" font-size="12" fill="#334155">+18.5</text>
  <text x="104" y="398" text-anchor="middle" font-size="12" fill="#334155">I think</text>
  <rect x="141" y="331" width="34" height="49" rx="0" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="158" y="324" text-anchor="middle" font-size="12" fill="#334155">+8.1</text>
  <text x="158" y="398" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0f172a">"{"</text>
  <rect x="195" y="308" width="34" height="72" rx="0" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="212" y="301" text-anchor="middle" font-size="12" fill="#334155">+12.0</text>
  <text x="212" y="398" text-anchor="middle" font-size="12" fill="#334155">Sure</text>
  <text x="246" y="376" font-size="13" fill="#475569">…</text>
  <text x="350" y="226" font-size="13" font-weight="700" fill="#0f172a">masked <tspan font-weight="700">z</tspan><tspan font-weight="700">&#8242;</tspan><tspan font-size="12" dy="3">t</tspan></text>
  <line x1="350" y1="380" x2="570" y2="380" stroke="#64748b" stroke-width="1"/>
  <rect x="363" y="295" width="34" height="85" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="380" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">&#8722;&#8734;</text>
  <text x="380" y="398" text-anchor="middle" font-size="12" fill="#334155">SELECT</text>
  <rect x="417" y="269" width="34" height="111" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="434" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">&#8722;&#8734;</text>
  <text x="434" y="398" text-anchor="middle" font-size="12" fill="#334155">I think</text>
  <rect x="471" y="331" width="34" height="49" rx="0" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <text x="488" y="324" text-anchor="middle" font-size="12" fill="#334155">+8.1</text>
  <text x="488" y="398" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0f172a">"{"</text>
  <rect x="525" y="308" width="34" height="72" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="542" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">&#8722;&#8734;</text>
  <text x="542" y="398" text-anchor="middle" font-size="12" fill="#334155">Sure</text>
  <text x="576" y="376" font-size="13" fill="#475569">…</text>
  <line x1="240" y1="316" x2="346" y2="316" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="270" y="300" width="62" height="32" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="301" y="321" text-anchor="middle" font-size="14" fill="#0369a1">+ <tspan font-weight="700">M</tspan>(<tspan font-style="italic">q</tspan><tspan font-size="12" dy="3">0</tspan><tspan dy="-3">)</tspan></text>
  <line x1="300" y1="126" x2="300" y2="298" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="308" y="200" font-size="12" fill="#0369a1">lookup</text>
  <line x1="570" y1="316" x2="618" y2="316" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="620" y="296" width="70" height="40" rx="2" fill="#0284c7" stroke="#0284c7" stroke-width="1.5"/>
  <text x="655" y="322" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#ffffff">"{"</text>
  <text x="655" y="356" text-anchor="middle" font-size="12" fill="#334155">sampled <tspan font-style="italic">y</tspan><tspan font-size="12" dy="3">t</tspan></text>
  <path d="M655,296 V170 H420 V128" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="537" y="162" text-anchor="middle" font-size="12" fill="#0369a1">advance to <tspan font-style="italic">q</tspan><tspan font-size="12" dy="3">1</tspan></text>
  <!-- ===== What the mask leaves unchecked ===== -->
  <rect x="20" y="416" width="670" height="30" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="34" y="436" font-size="12" font-weight="700" fill="#0f172a">Not checked by the mask</text>
  <g font-size="12" fill="#334155">
    <text x="250" y="436">table exists?</text>
    <text x="380" y="436">values right?</text>
    <text x="510" y="436">call authorized?</text>
  </g>
</svg>
