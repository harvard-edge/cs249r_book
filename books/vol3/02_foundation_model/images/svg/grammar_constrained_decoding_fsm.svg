<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- STAGE 1: Ahead-of-Time Grammar Compilation (Left Column)           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect width="280" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
    <rect width="280" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
    <rect width="280" height="10" y="16" fill="#f1f5f9"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">1  Compile the tool schema</text>

    <!-- Pydantic Schema Box -->
    <g transform="translate(12, 36)">
      <rect width="256" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#7c3aed">Tool argument schema</text>
      <text x="10" y="28" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0f172a">{"query": {"type": "string",</text>
      <text x="20" y="41" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#334155">           "minLength": 1},</text>
      <text x="20" y="54" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#334155"> "limit": {"type": "integer",</text>
      <text x="20" y="67" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b">           "maximum": 500}}</text>
    </g>

    <!-- DFA Construction Box -->
    <g transform="translate(12, 118)">
      <rect width="256" height="132" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Automaton over output bytes</text>
      <text x="10" y="30" font-size="8" fill="#475569">State space Q = {q_0, q_1, ..., q_F}</text>
      <text x="10" y="43" font-size="8" fill="#475569">Transition δ*(q, b^(v)) maps byte sequences</text>

      <!-- DFA State Graph Visual -->
      <g transform="translate(10, 56)">
        <!-- State q0 -->
        <circle cx="22" cy="22" r="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5" />
        <text x="22" y="26" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">q_0</text>

        <!-- Transition q0 -> q1 -->
        <line x1="36" y1="22" x2="84" y2="22" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-purple)" />
        <rect x="46" y="8" width="28" height="14" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.6"/>
        <text x="60" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">"{"</text>

        <!-- State q1 -->
        <circle cx="102" cy="22" r="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5" />
        <text x="102" y="26" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">q_1</text>

        <!-- Transition q1 -> q2 -->
        <line x1="116" y1="22" x2="164" y2="22" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arr-purple)" />
        <rect x="122" y="8" width="36" height="14" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.6"/>
        <text x="140" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">"query"</text>

        <!-- State q2 -->
        <circle cx="182" cy="22" r="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5" />
        <text x="182" y="26" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">q_2</text>

        <!-- Transition q2 -> qF -->
        <line x1="196" y1="22" x2="220" y2="22" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="2,2" />

        <!-- Final State qF -->
        <circle cx="232" cy="22" r="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
        <circle cx="232" cy="22" r="10" fill="none" stroke="#7c3aed" stroke-width="0.8" />
        <text x="232" y="25" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">q_F</text>
      </g>

      <text x="10" y="118" font-size="8" fill="#64748b">Transitions follow the schema's JSON grammar</text>
    </g>

    <!-- Bitmask Table Box -->
    <g transform="translate(12, 258)">
      <rect width="256" height="118" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Per-state token mask B[q]</text>
      <text x="10" y="30" font-size="8" fill="#475569">One bit per vocabulary token: legal or not</text>

      <g transform="translate(10, 38)">
        <rect width="236" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0f172a">B[q_0]: [0, 0, 1, 0, 0, 1, 0, ...]</text>
      </g>
      <g transform="translate(10, 66)">
        <rect width="236" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0f172a">B[q_1]: [1, 0, 0, 0, 1, 0, 0, ...]</text>
      </g>

      <text x="10" y="106" font-size="8" font-weight="600" fill="#0284c7">Computed once per schema</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <line x1="310" y1="215" x2="328" y2="215" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- STAGE 2: Real-Time GPU Logit Masking Kernel (Middle Column)        -->
  <!-- ================================================================= -->
  <g transform="translate(330, 20)">
    <rect width="325" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
    <rect width="325" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
    <rect width="325" height="10" y="16" fill="#f1f5f9"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">2  Mask the logits at each step</text>

    <!-- Raw Logits from Forward Pass -->
    <g transform="translate(12, 36)">
      <rect width="301" height="88" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Model logits z_t over the vocabulary</text>
      <text x="10" y="27" font-size="8" fill="#64748b">Unconstrained logit scores prior to normalization:</text>

      <!-- Logit Cells -->
      <g transform="translate(10, 36)">
        <!-- Logit 1 -->
        <g transform="translate(0, 0)">
          <text x="18" y="10" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b" text-anchor="middle">"SELECT"</text>
          <rect y="14" width="36" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="18" y="29" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0f172a" text-anchor="middle">+14.2</text>
        </g>

        <!-- Logit 2 -->
        <g transform="translate(42, 0)">
          <text x="21" y="10" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b" text-anchor="middle">"I think"</text>
          <rect y="14" width="42" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="21" y="29" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0f172a" text-anchor="middle">+18.5</text>
        </g>

        <!-- Logit 3 (Valid) -->
        <g transform="translate(90, 0)">
          <text x="18" y="10" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">"{"</text>
          <rect y="14" width="36" height="24" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
          <text x="18" y="29" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">+8.1</text>
        </g>

        <!-- Logit 4 -->
        <g transform="translate(132, 0)">
          <text x="18" y="10" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#64748b" text-anchor="middle">"Sure"</text>
          <rect y="14" width="36" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
          <text x="18" y="29" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0f172a" text-anchor="middle">+12.0</text>
        </g>

        <text x="180" y="30" font-size="8" fill="#64748b">… rest of vocabulary</text>
      </g>
    </g>

    <!-- Logit Mask Operation Kernel -->
    <g transform="translate(12, 134)">
      <rect width="301" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0284c7">Add the mask: z'_t = z_t + M(q_t)</text>
      <text x="10" y="28" font-size="8" fill="#475569">State q_0 expects schema opening brace only:</text>

      <!-- Masked Logit Cells -->
      <g transform="translate(10, 36)">
        <!-- Masked 1 -->
        <g transform="translate(0, 0)">
          <rect y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
          <text x="18" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
          <line x1="2" y1="2" x2="34" y2="24" stroke="#dc2626" stroke-width="0.8" opacity="0.6"/>
          <text x="18" y="36" font-size="8" fill="#b91c1c" text-anchor="middle">MASKED</text>
        </g>

        <!-- Masked 2 -->
        <g transform="translate(42, 0)">
          <rect y="0" width="42" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
          <text x="21" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
          <line x1="2" y1="2" x2="40" y2="24" stroke="#dc2626" stroke-width="0.8" opacity="0.6"/>
          <text x="21" y="36" font-size="8" fill="#b91c1c" text-anchor="middle">MASKED</text>
        </g>

        <!-- Allowed 3 -->
        <g transform="translate(90, 0)">
          <rect y="0" width="36" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
          <text x="18" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">+8.1</text>
          <text x="18" y="36" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">ALLOWED</text>
        </g>

        <!-- Masked 4 -->
        <g transform="translate(132, 0)">
          <rect y="0" width="36" height="26" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
          <text x="18" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">-∞</text>
          <line x1="2" y1="2" x2="34" y2="24" stroke="#dc2626" stroke-width="0.8" opacity="0.6"/>
          <text x="18" y="36" font-size="8" fill="#b91c1c" text-anchor="middle">MASKED</text>
        </g>

        <text x="180" y="17" font-size="8" fill="#64748b">… all invalid = -∞</text>
      </g>

      <!-- Math Invariant Formula Box -->
      <g transform="translate(10, 84)">
        <rect width="281" height="54" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#0f172a">Masked tokens get zero probability</text>
        <text x="10" y="31" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0284c7">P(v ∉ V_valid | q_t) = exp(-∞) / Σ = 0.00%</text>
        <text x="10" y="45" font-size="8" fill="#64748b">under every sampling rule</text>
      </g>
    </g>

    <!-- On-Chip SRAM Notice -->
    <g transform="translate(12, 296)">
      <rect width="301" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Where the mask runs</text>
      <text x="10" y="32" font-size="8" fill="#334155">Beside the sampler, inside each step</text>
      <text x="10" y="47" font-size="8" fill="#334155">Per-token cost: one table lookup</text>
      <text x="10" y="62" font-size="8" fill="#64748b">A per-token round trip would stall decoding</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <line x1="655" y1="215" x2="673" y2="215" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- STAGE 3: Synchronous Sampling & State Advance (Right Column)       -->
  <!-- ================================================================= -->
  <g transform="translate(675, 20)">
    <rect width="255" height="390" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
    <rect width="255" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
    <rect width="255" height="10" y="16" fill="#f1f5f9"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">3  Sample and advance</text>

    <!-- Sampling Step -->
    <g transform="translate(12, 36)">
      <rect width="231" height="88" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#15803d">Sample from the masked distribution</text>
      <text x="10" y="28" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#475569">y_t ~ p_t = softmax(z'_t / tau)</text>

      <g transform="translate(10, 36)">
        <rect width="211" height="40" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="10" y="16" font-size="8" font-weight="700" fill="#15803d">Only a legal token can be drawn:</text>
        <text x="10" y="30" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#14532d">Emitted y_t = "{"</text>
      </g>
    </g>

    <!-- State Transition Engine -->
    <g transform="translate(12, 134)">
      <rect width="231" height="120" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Automaton advances</text>
      <text x="10" y="29" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#7c3aed">q_{t+1} = δ*(q_t, b^(y_t))</text>

      <g transform="translate(10, 38)">
        <rect width="211" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="16" font-size="8" font-weight="700" fill="#334155">Transition:</text>
        <text x="8" y="32" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#7c3aed">q_0  ── "{" ──&gt;  q_1</text>
      </g>

      <text x="10" y="100" font-size="8" fill="#475569">Next legal tokens for q_1:</text>
      <text x="10" y="112" font-family="'SFMono-Regular', Consolas, monospace" font-size="8" fill="#0284c7">"query", "limit"</text>
    </g>

    <!-- Zero Host Stalls Invariant Box -->
    <g transform="translate(12, 264)">
      <rect width="231" height="112" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">What the mask does not check</text>
      <text x="10" y="32" font-size="8" fill="#334155">whether the table exists</text>
      <text x="10" y="47" font-size="8" fill="#334155">whether the values are right</text>
      <text x="10" y="62" font-size="8" fill="#334155">whether the call is authorized</text>

      <g transform="translate(10, 72)">
        <rect width="211" height="30" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="10" y="14" font-size="8" font-weight="700" fill="#0f172a">Syntax closed, semantics open</text>
        <text x="10" y="24" font-size="8" fill="#64748b">checked after the call, outside the model</text>
      </g>
    </g>
  </g>
</svg>