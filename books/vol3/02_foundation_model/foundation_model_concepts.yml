    concepts:
    - id: vol3.proposal
      label: Model proposal
      teaches: Proposal boundary
      summary: A generated response or tool request is a candidate whose structure, permission, and state
        preconditions require external checks.
      section: sec-vol3-foundation-model-proposals-observations
    - id: vol3.observation
      label: Tool observation
      teaches: Invocation contract
      summary: A recorded tool result reports an actual execution outcome, including errors and truncation,
        and becomes input to a later model call.
      section: sec-vol3-foundation-model-proposals-observations
    - id: vol3.grammar
      label: Grammar constraint
      teaches: Grammar-constrained decoding
      summary: Token-level constraints restrict legal output structures; they do not certify task semantics,
        permission, or external state.
      section: sec-vol3-foundation-model-structural-guarantee-scope
    relationships:
    - id: vol3.field.proposal.mediation
      source: vol3.proposal
      predicate: requires checks through
      target: vol3.mediation
      explanation: The runtime independently checks structure and permissions before executing a generated
        tool proposal.
      conditions: Tool advertisement gives the model an interface for proposals, not a grant to arbitrary
        resources.
      status: draft
      evidence:
        section: sec-vol3-foundation-model-proposals-observations
        quote: 'Following the tool-call branch of @fig-vol3-model-call-surface turns that returned `read_file`
          proposal into an observation without trusting its text. Because the payload could still carry
          a traversal string like `../../etc/passwd` or a malformed argument, the runtime first checks structural
          conformance, confirming that the proposed arguments match the declared schema (for example, that
          `path` is a string rather than a shell command). Next, it checks the arguments against the task''s
          permission grant: advertising `read_file` lets the model propose file reads, but grants no right
          to read arbitrary paths. The runtime verifies that `src/pool.py` resolves inside the allowed workspace
          rather than escaping to host files through directory traversal. Once authorized, the tool runs
          outside the model call, inside an isolated sandbox or container with its own timeout.'
    - id: vol3.field.observation.working-context
      source: vol3.observation
      predicate: feeds
      target: vol3.working-context
      explanation: The recorded result is paired with its call and staged into a later invocation.
      conditions: Truncation and errors must remain visible in the staged result.
      status: draft
      evidence:
        section: sec-vol3-foundation-model-proposals-observations
        quote: After the tool finishes, the runtime records what happened and builds the next prompt. It
          appends the model's `assistant` proposal paired with a `tool` message carrying the observation
          (here, the bounded file excerpt). That observation reports the actual outcome, including a missing
          file or a permission denial, and notes when the output was truncated; @sec-vol3-tool-calling-round-trip
          develops how the runtime matches each result to the call it answers, records errors, and marks
          truncation.
    - id: vol3.field.grammar.proposal
      source: vol3.grammar
      predicate: restricts the structure of
      target: vol3.proposal
      explanation: A decoding grammar constrains textual representation while leaving state and permission
        checks external.
      conditions: Its guarantee depends on the actual grammar; JSON syntax and schema conformance are different
        guarantees.
      status: draft
      evidence:
        section: sec-vol3-foundation-model-structural-guarantee-scope
        quote: Grammar masking moves the first row of @tbl-verification-layers into generation and leaves
          every other row where it was. A masked `{"path":"src/pool.py"}` still names a file that may not
          exist or may lie outside the grant, because the mask operates strictly on the textual representation
          and never queries repository state or security policy. Property by property, the mask's own reach
          is narrow (@tbl-vol3-verification-dimensions).
    - id: vol3.field.grammar.mediation
      source: vol3.grammar
      predicate: does not replace
      target: vol3.mediation
      explanation: A well-formed request may target a nonexistent or unauthorized file.
      conditions: The grammar has no access to repository state or authorization policy.
