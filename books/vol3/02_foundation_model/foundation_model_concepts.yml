concept_map:
  schema_version: 2
  source: 02_foundation_model.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Proposal boundary
    - Token-measured admission
    - Sampling shapes candidates, not correctness
    - Recorded calls replay, served calls do not
    - Invocation contract
    - Checks certify named properties
    - Output-bound call latency
    - Quadratic resend and prefix reuse
  secondary_concepts:
    - Grammar-constrained decoding
    - Interface choice under matched budgets
  claims:
    Proposal boundary: 'Model output is a proposal with zero ambient authority: the runtime validates, authorizes,
      executes, and returns the observation, so a tool request is never an effect and a model claim is never an
      observation.'
    Token-measured admission: A request is admitted only if its fully serialized wire payload, counted with the
      target model's own tokenizer, satisfies S <= S_max - K_max, and hidden reasoning tokens debit the same output
      headroom.
    Sampling shapes candidates, not correctness: Temperature, top-k, and top-p reshape which candidates appear but
      none makes a likely token a correct one, so sampling settings are chosen by measured task pass rates.
    Recorded calls replay, served calls do not: Reduction order and serving-path changes flip contested argmax choices
      even at temperature zero, so the runtime logs model revision, serving configuration, and sampling settings
      with every call and replays recorded responses when behavior must be reproduced.
    Invocation contract: Every call is a request record plus a normalized status envelope, and only a COMPLETED
      reply enters the candidate path, so a truncated prefix that parses is quarantined and a local deadline expiry
      leaves the remote outcome unknown.
    Checks certify named properties: Likelihood is not truth, schema conformance is not permission, a passing test
      covers only exercised behavior, and self-review re-samples the same distribution, so each gate is chosen for
      the one property it certifies and a fallible checker leaves a residual defect share given by Bayes.
    Output-bound call latency: Prefill is bounded by arithmetic and unbatched decode by weight bandwidth, so one
      output token costs roughly as much time as several hundred prompt tokens and output length is the primary
      latency lever.
    Quadratic resend and prefix reuse: Re-sending an append-only history submits H*S0 + Delta*H(H-1)/2 prompt tokens,
      compatible prefix reuse cuts fresh prefill to S0 + (H-1)*Delta, and latency, work, and billed dollars remain
      separate accounts.
    Grammar-constrained decoding: A per-state logit mask guarantees a completed output is in the enforced language,
      but only for syntax, only on COMPLETED status, and an over-constrained schema forces confabulation unless
      it offers an explicit unknown variant.
    Interface choice under matched budgets: Representation granularity, serialization, and constraint mechanism
      are independent interface axes judged on accepted outcomes under matched budgets, with a deadline acting as
      an admission filter and every initiated trial kept in the denominator.
