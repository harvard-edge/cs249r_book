<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .step-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #991b1b; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; text-anchor: middle; fill: #475569; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-c-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1080" height="370" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">CONTIGUOUS DYNAMIC REALLOCATION PATHOLOGY (std::vector STYLE)</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">Decode Step 513: High-Cost Memory Re-allocation on Accelerators</text>

  <!-- Left: Initial Allocation -->
  <g transform="translate(45, 75)">
    <text x="0" y="16" class="step-lbl">Initial Allocation (512 slots):</text>
    <rect x="0" y="25" width="280" height="45" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="45" class="box-lbl" fill="#065f46">Active KV Tensor State (512 tokens)</text>
    <text x="140" y="60" class="box-sub">Full capacity reached at decode step 512</text>
  </g>

  <!-- Right: Step 3 Free Old Buffer -->
  <g transform="translate(680, 75)">
    <text x="0" y="16" class="step-lbl">Step 3: Free Old Buffer</text>
    <rect x="0" y="25" width="350" height="45" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <text x="175" y="45" class="box-lbl" fill="#475569">External Fragmentation Hole (512 slots)</text>
    <text x="175" y="60" class="box-sub">Unusable by requests needing &gt; 512 slots</text>
  </g>

  <!-- Left: Step 1 Allocate Larger Buffer -->
  <g transform="translate(45, 185)">
    <text x="0" y="16" class="step-lbl">Step 1: cudaMalloc(1,024 slots) — Control Plane Latency</text>
    <rect x="0" y="25" width="600" height="45" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="45" class="box-lbl" fill="#b45309">New Contiguous Buffer (1,024 slots)</text>
    <text x="300" y="60" class="box-sub">Device stream serialization &amp; host synchronization</text>
  </g>

  <!-- Copy Arrow connecting Box 1 to Box 2 through open space -->
  <path d="M 325 122.5 H 480 V 205" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-c-red)"/>
  <rect x="370" y="145" width="220" height="22" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="480" y="160" font-family="ui-monospace, monospace" font-size="10px" font-weight="700" fill="#dc2626" text-anchor="middle">Step 2: Copy 512 slots over HBM Bus</text>

  <!-- Right: Transient Demand Surge -->
  <g transform="translate(680, 180)">
    <text x="0" y="16" class="step-lbl">Transient Memory Demand Surge</text>
    <rect x="0" y="25" width="350" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="175" y="45" font-family="ui-monospace, monospace" font-size="11px" font-weight="700" fill="#b91c1c" text-anchor="middle">512 + 1,024 = 1,536 slots (3.0× footprint)</text>
    <text x="175" y="60" class="box-sub" fill="#991b1b">Frequently precipitates OOM aborts on concurrent decodes</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="305" width="1040" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="328" class="card-text" font-weight="700" fill="#0f172a">Systems Diagnosis:</text>
  <text x="165" y="328" class="card-text">Dynamic contiguous reallocation on GPUs fails due to device synchronization overhead, memory bus copy taxes,</text>
  <text x="165" y="344" class="card-text">transient memory demand spikes (3× token footprint), and non-coalesced external fragmentation holes.</text>
</svg>