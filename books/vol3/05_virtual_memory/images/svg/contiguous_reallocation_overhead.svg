<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 270" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .step-hdr { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .box-title { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-size: 9.5px; text-anchor: middle; fill: #475569; }
      .mono-val { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Container Card -->
  <rect x="20" y="15" width="1040" height="240" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Left Column: Initial Allocation (t = 512) -->
  <g transform="translate(45, 35)">
    <text x="0" y="16" class="step-hdr">Initial Contiguous Buffer (Full Capacity at Step t = 512):</text>
    <rect x="0" y="26" width="300" height="50" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="150" y="47" class="box-title" fill="#065f46">Active KV Cache (512 slots)</text>
    <text x="150" y="63" class="box-desc">Prompt &amp; historical decode tokens 0 .. 511</text>
  </g>

  <!-- Left Column Lower: Step 1 (Allocate Doubled Buffer at t = 513) -->
  <g transform="translate(45, 135)">
    <text x="0" y="16" class="step-hdr">Step 1: Allocator Reserves Expanded Extent (1,024 slots):</text>
    <rect x="0" y="26" width="600" height="50" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="300" y="47" class="box-title" fill="#b45309">New Contiguous Buffer (1,024 slots)</text>
    <text x="300" y="63" class="box-desc">Requires synchronous GPU memory allocation (cudaMalloc / caching allocator lock)</text>
  </g>

  <!-- Step 2: Cross-Bus Copy Path -->
  <path d="M 345 86 H 490 V 158" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <rect x="365" y="105" width="230" height="24" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="480" y="121" class="mono-val" fill="#dc2626" text-anchor="middle">Step 2: Copy 512 Slots over HBM Bus</text>

  <!-- Right Column Upper: Step 3 (Free Old Buffer -> Stranded Hole) -->
  <g transform="translate(685, 35)">
    <text x="0" y="16" class="step-hdr">Step 3: Deallocate Original Buffer:</text>
    <rect x="0" y="26" width="350" height="50" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="175" y="47" class="box-title" fill="#475569">External Fragmentation Hole (512 slots)</text>
    <text x="175" y="63" class="box-desc">Uncoalesced gap; unusable by requests needing &gt; 512 slots</text>
  </g>

  <!-- Right Column Lower: Transient Peak Demand Surge -->
  <g transform="translate(685, 135)">
    <text x="0" y="16" class="step-hdr">Transient Peak Footprint During Step 2 Migration:</text>
    <rect x="0" y="26" width="350" height="50" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
    <text x="175" y="47" class="mono-val" fill="#b91c1c" text-anchor="middle">512 + 1,024 = 1,536 slots (3.0× Working Set)</text>
    <text x="175" y="63" class="box-desc" fill="#991b1b">Peak concurrency hazard; triggers mid-generation OOM aborts</text>
  </g>
</svg>