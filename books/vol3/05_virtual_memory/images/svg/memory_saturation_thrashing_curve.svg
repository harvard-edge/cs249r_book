<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .axis-lbl { font-size: 11px; font-weight: 700; fill: #1e293b; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .plot-note { font-size: 9.5px; fill: #475569; }
      .mono-val { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; }
    </style>
    <marker id="arr-sat" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Container Card -->
  <rect x="20" y="15" width="1040" height="310" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Plot Area Background -->
  <g transform="translate(10, 0)">
    <rect x="100" y="35" width="910" height="230" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Horizontal Grid Lines -->
    <line x1="100" y1="207" x2="1010" y2="207" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="100" y1="150" x2="1010" y2="150" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="100" y1="92" x2="1010" y2="92" stroke="#f1f5f9" stroke-width="1"/>

    <!-- 100% Thrashing Boundary Line at y = 50 -->
    <line x1="100" y1="50" x2="1010" y2="50" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="1000" y="44" class="mono-val" fill="#b91c1c" text-anchor="end">100% Thrashing Boundary (Physical Memory Exhaustion)</text>

    <!-- 50% Average Baseline at y = 150 -->
    <line x1="100" y1="150" x2="1010" y2="150" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="115" y="142" class="mono-val" fill="#047857">Provisioned Average Baseline (50% Mean Concurrency N = λW)</text>

    <!-- Smooth Dynamic Trajectory Waveform -->
    <path d="M 100 230 
             C 140 190, 170 220, 210 200 
             C 250 160, 290 230, 340 190 
             C 390 145, 430 210, 490 160 
             C 550 115, 590 195, 650 140 
             C 710 95,  750 150, 800 110 
             C 840 95,  870 105, 910 75 
             C 940 52,  970 51,  1010 50" 
          fill="none" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Annotation Callout on Burst -->
    <g transform="translate(620, 78)">
      <rect width="260" height="42" rx="3" fill="#fff7ed" stroke="#fb923c" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#9a3412">Correlated Branching Burst</text>
      <text x="12" y="32" font-size="8.5" fill="#7c2d12">+ Tool-Wait Concurrency Inflation (Arrivals pile up)</text>
    </g>

    <!-- Annotation on Saturation Impact -->
    <g transform="translate(820, 185)">
      <rect width="180" height="42" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#991b1b">Emergency Preemptions</text>
      <text x="10" y="32" font-size="8" fill="#7f1d1d">Prefix hit collapse &amp; tail latency spike</text>
    </g>

    <!-- Axes -->
    <line x1="100" y1="265" x2="1030" y2="265" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-sat)"/>
    <line x1="100" y1="265" x2="100" y2="25" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-sat)"/>

    <!-- Y-Axis Labels -->
    <text x="40" y="150" class="axis-lbl" transform="rotate(-90 40,150)" text-anchor="middle">Memory Saturation (%)</text>
    <text x="90" y="269" class="tick-lbl" text-anchor="end">0%</text>
    <text x="90" y="211" class="tick-lbl" text-anchor="end">25%</text>
    <text x="90" y="154" class="tick-lbl" text-anchor="end">50%</text>
    <text x="90" y="96" class="tick-lbl" text-anchor="end">75%</text>
    <text x="90" y="54" class="tick-lbl" text-anchor="end">100%</text>

    <!-- X-Axis Labels -->
    <text x="555" y="300" class="axis-lbl" text-anchor="middle">Time (t, Execution Seconds)</text>
    <text x="100" y="280" class="tick-lbl" text-anchor="middle">0s</text>
    <text x="250" y="280" class="tick-lbl" text-anchor="middle">30s</text>
    <text x="400" y="280" class="tick-lbl" text-anchor="middle">60s</text>
    <text x="550" y="280" class="tick-lbl" text-anchor="middle">90s</text>
    <text x="700" y="280" class="tick-lbl" text-anchor="middle">120s</text>
    <text x="850" y="280" class="tick-lbl" text-anchor="middle">150s</text>
    <text x="1000" y="280" class="tick-lbl" text-anchor="middle">180s</text>
  </g>
</svg>