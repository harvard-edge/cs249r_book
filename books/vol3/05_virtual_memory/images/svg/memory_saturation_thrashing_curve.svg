<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .axis-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-sat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="1080" height="420" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="35" y="41" class="title" fill="#991b1b">MEMORY SATURATION &amp; THE CACHE THRASHING BOUNDARY</text>
  <text x="1045" y="41" class="sub-note" fill="#b91c1c" text-anchor="end">Heavy-Tailed Tool-Wait Concurrency Inflation Triggers Preemption Storms</text>

  <!-- Plot Area -->
  <rect x="110" y="75" width="920" height="210" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M 110 232 L 1030 232" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 180 L 1030 180" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 127 L 1030 127" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 100% Thrashing Boundary Line at y=95 -->
  <line x1="110" y1="95" x2="1030" y2="95" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 50% Average Baseline at y=180 -->
  <line x1="110" y1="180" x2="1030" y2="180" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="125" y="168" width="200" height="22" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="225" y="183" font-family="system-ui, sans-serif" font-weight="600" font-size="10px" fill="#065f46" text-anchor="middle">Provisioned Average Baseline (50%)</text>

  <!-- Smooth Trajectory Waveform strictly bounded inside [95, 260] -->
  <path d="M 110 240 
           C 150 200, 180 230, 220 210 
           C 260 170, 300 240, 350 200 
           C 400 150, 440 220, 500 170 
           C 560 120, 600 210, 660 150 
           C 720 100, 760 160, 810 120 
           C 850 105, 880 115, 920 100 
           C 950 96,  980 98,  1030 96" 
        fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- 100% Thrashing Boundary Badge positioned clearly above the line -->
  <rect x="830" y="66" width="190" height="22" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="925" y="81" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#b91c1c" text-anchor="middle">100% Thrashing Boundary</text>

  <!-- Annotation on Burst -->
  <rect x="680" y="130" width="220" height="34" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="790" y="145" font-family="system-ui, sans-serif" font-weight="700" font-size="10px" fill="#9a3412" text-anchor="middle">Correlated Branching Burst</text>
  <text x="790" y="157" font-family="system-ui, sans-serif" font-size="9px" fill="#9a3412" text-anchor="middle">+ Tool-Wait Concurrency Inflation</text>

  <!-- Axes -->
  <path d="M 110 285 L 1050 285" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-sat)"/>
  <path d="M 110 285 L 110 70" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-sat)"/>

  <!-- Y-Axis Labels -->
  <text x="45" y="180" class="axis-lbl" transform="rotate(-90 45,180)" text-anchor="middle">Memory Saturation (%)</text>
  <text x="100" y="289" class="tick-lbl" text-anchor="end">0%</text>
  <text x="100" y="236" class="tick-lbl" text-anchor="end">25%</text>
  <text x="100" y="184" class="tick-lbl" text-anchor="end">50%</text>
  <text x="100" y="131" class="tick-lbl" text-anchor="end">75%</text>
  <text x="100" y="99" class="tick-lbl" text-anchor="end">100%</text>

  <!-- X-Axis Labels -->
  <text x="570" y="320" class="axis-lbl" text-anchor="middle">Time (t, Execution Seconds)</text>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="340" width="1040" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="363" class="card-text" font-weight="700" fill="#0f172a">Capacity Provisioning Rule:</text>
  <text x="35" y="381" class="card-text">Dimensioning memory pools against mean concurrency N = λW guarantees thrashing under heavy-tailed agent tool waits.</text>
  <text x="35" y="395" class="card-text">Infrastructure must provision for peak bimodal concurrency and enforce early admission gating well before HBM reaches saturation.</text>
</svg>