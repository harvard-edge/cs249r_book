<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="hkv-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581C87"/>
    </marker>
    <marker id="hkv-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0F766E"/>
    </marker>
    <marker id="hkv-arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400E"/>
    </marker>
    <marker id="hkv-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <!-- Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.2">HIERARCHICAL KV SWAPPING TOPOLOGY ACROSS PHYSICAL MEMORY TIERS</text>
    <text x="0" y="15" font-size="10" font-weight="400" fill="#475569">PagedAttention Virtual Memory Management, Asynchronous PCIe Gen5 DMA Offload, and Predictive Prefetching</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: 3-TIER PHYSICAL MEMORY HIERARCHY                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 62)">
    <rect width="480" height="424" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect width="480" height="28" rx="3" fill="#FAF5FF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#581C87">PHYSICAL MEMORY HIERARCHY &amp; ASYNC DMA PIPELINE</text>

    <g transform="translate(18, 38)">
      <!-- Tier 1: Accelerator HBM -->
      <g transform="translate(0, 0)">
        <rect width="444" height="96" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
        <text x="12" y="18" font-size="9.5" font-weight="700" fill="#581C87">Tier 1: Accelerator HBM3e / SRAM</text>
        <text x="432" y="18" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" font-weight="700" fill="#581C87">3.35 - 4.8 TB/s | 80 - 141 GB</text>

        <!-- Physical Block Array -->
        <g transform="translate(12, 28)">
          <text x="0" y="12" font-size="8" font-weight="700" fill="#475569">ACTIVE RESIDENT PAGEDATTENTION BLOCKS:</text>
          <!-- Block Cells -->
          <rect x="0" y="18" width="56" height="26" rx="1" fill="#FFFFFF" stroke="#581C87" stroke-width="1.2"/>
          <text x="28" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#581C87">Blk 001</text>

          <rect x="62" y="18" width="56" height="26" rx="1" fill="#FFFFFF" stroke="#581C87" stroke-width="1.2"/>
          <text x="90" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#581C87">Blk 002</text>

          <rect x="124" y="18" width="56" height="26" rx="1" fill="#FFFFFF" stroke="#581C87" stroke-width="1.2"/>
          <text x="152" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#581C87">Blk 003</text>

          <rect x="186" y="18" width="56" height="26" rx="1" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
          <text x="214" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#64748B">Free</text>

          <rect x="248" y="18" width="56" height="26" rx="1" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
          <text x="276" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#64748B">Free</text>

          <text x="314" y="34" font-size="8" font-family="ui-monospace, monospace" fill="#475569">... [4,096 frames]</text>
        </g>
      </g>

      <!-- Interconnect Bus 1: PCIe Gen5 x16 / CXL -->
      <g transform="translate(0, 102)">
        <rect width="444" height="34" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="12" y="21" font-size="8" font-weight="700" fill="#334155">PCIe Gen5 x16 / CXL 3.0 (64 GB/s)</text>

        <!-- Swap Out Datapath -->
        <path d="M220,6 L220,26" fill="none" stroke="#92400E" stroke-width="1.4" marker-end="url(#hkv-arr-ochre)"/>
        <text x="226" y="18" font-size="7.5" font-family="ui-monospace, monospace" font-weight="700" fill="#92400E">Swap Out (164 ms)</text>

        <!-- Prefetch In Datapath -->
        <path d="M350,26 L350,6" fill="none" stroke="#0F766E" stroke-width="1.4" marker-end="url(#hkv-arr-teal)"/>
        <text x="356" y="18" font-size="7.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0F766E">Prefetch In (Async)</text>
      </g>

      <!-- Tier 2: Host System DRAM -->
      <g transform="translate(0, 142)">
        <rect width="444" height="96" rx="2" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.4"/>
        <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0F766E">Tier 2: Host System DRAM (Pinned Kernel Buffers)</text>
        <text x="432" y="18" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" font-weight="700" fill="#0F766E">64 GB/s | 512 GB - 2 TB</text>

        <!-- Suspended Agent Block Array -->
        <g transform="translate(12, 28)">
          <text x="0" y="12" font-size="8" font-weight="700" fill="#475569">PAGED SWAP POOL (SUSPENDED TOOL-WAIT SESSIONS):</text>
          <rect x="0" y="18" width="76" height="26" rx="1" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
          <text x="38" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Agent 1 (Wait)</text>

          <rect x="82" y="18" width="76" height="26" rx="1" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
          <text x="120" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Agent 2 (Wait)</text>

          <rect x="164" y="18" width="76" height="26" rx="1" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
          <text x="202" y="34" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">Agent 3 (Wait)</text>

          <text x="252" y="34" font-size="8" font-family="ui-monospace, monospace" fill="#475569">... [64k frames buffered]</text>
        </g>
      </g>

      <!-- Interconnect Bus 2: NVMe Controller -->
      <g transform="translate(0, 244)">
        <rect width="444" height="34" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="12" y="21" font-size="8" font-weight="700" fill="#334155">PCIe Gen5 NVMe Controller (8 - 14 GB/s)</text>

        <!-- Cold Eviction Datapath -->
        <path d="M220,6 L220,26" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#hkv-arr-slate)"/>
        <text x="226" y="18" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Flush Dormant (Cold)</text>

        <!-- Cold Restore Datapath -->
        <path d="M350,26 L350,6" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#hkv-arr-slate)"/>
        <text x="356" y="18" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Restore Session</text>
      </g>

      <!-- Tier 3: Local NVMe SSD -->
      <g transform="translate(0, 284)">
        <rect width="444" height="84" rx="2" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9.5" font-weight="700" fill="#0F172A">Tier 3: Local NVMe SSD (Cold Trajectory Store)</text>
        <text x="432" y="18" text-anchor="end" font-size="8" font-family="ui-monospace, monospace" font-weight="700" fill="#475569">7 - 14 GB/s | 4 - 30 TB</text>
        <text x="12" y="38" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Dormant multi-day agent checkpoints, persistent trajectory episodic logs</text>
        <text x="12" y="52" font-size="7.5" font-style="italic" fill="#64748B">Reclaimed when memory pressure reaches critical watermark.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: VM PAGEDATTENTION BLOCK TABLE & LATENCY ACCOUNTING                 -->
  <!-- ========================================================================= -->
  <g transform="translate(540, 62)">
    <rect width="460" height="424" rx="3" fill="#FFFFFF" stroke="#581C87" stroke-width="1.4"/>
    <rect width="460" height="28" rx="3" fill="#FAF5FF" stroke="#581C87" stroke-width="1.4"/>
    <text x="14" y="18" font-size="9.5" font-weight="700" fill="#581C87">PAGE TABLE MAPPING &amp; LATENCY OVERLAP ACCOUNTING</text>

    <g transform="translate(18, 38)">
      <!-- Logical to Physical Page Table -->
      <rect width="424" height="136" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0F172A">RADIX PAGEDATTENTION BLOCK TABLE MAPPING</text>

      <!-- Table Header -->
      <g transform="translate(12, 26)">
        <rect width="400" height="20" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1"/>
        <text x="10" y="14" font-size="7.5" font-weight="700" fill="#334155">LOGICAL BLOCK</text>
        <text x="110" y="14" font-size="7.5" font-weight="700" fill="#334155">PHYSICAL FRAME</text>
        <text x="215" y="14" font-size="7.5" font-weight="700" fill="#334155">RESIDENCY</text>
        <text x="310" y="14" font-size="7.5" font-weight="700" fill="#334155">STATUS</text>

        <!-- Row 1: Active HBM -->
        <g transform="translate(0, 20)">
          <rect width="400" height="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <text x="10" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F172A">Block #0001</text>
          <text x="110" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">GPU_Frame 0x1A</text>
          <text x="215" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">Tier 1 (HBM)</text>
          <text x="310" y="14" font-size="7.5" font-weight="700" fill="#0F766E">ACTIVE_DECODE</text>
        </g>

        <!-- Row 2: Swapped Host DRAM -->
        <g transform="translate(0, 40)">
          <rect width="400" height="20" fill="#FAF5FF" stroke="#E2E8F0" stroke-width="1"/>
          <text x="10" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F172A">Block #0002</text>
          <text x="110" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">Host_Buf 0x88F</text>
          <text x="215" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F766E">Tier 2 (DRAM)</text>
          <text x="310" y="14" font-size="7.5" font-weight="700" fill="#92400E">TOOL_WAIT (SWAP)</text>
        </g>

        <!-- Row 3: Prefetching In -->
        <g transform="translate(0, 60)">
          <rect width="400" height="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <text x="10" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#0F172A">Block #0003</text>
          <text x="110" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">GPU_Frame 0x3C</text>
          <text x="215" y="14" font-size="7.5" font-family="ui-monospace, monospace" fill="#581C87">Tier 1 (HBM)</text>
          <text x="310" y="14" font-size="7.5" font-weight="700" fill="#581C87">PREFETCHING_DMA</text>
        </g>
      </g>

      <!-- Quantitative Latency Hiding Model -->
      <g transform="translate(0, 146)">
        <rect width="424" height="222" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.2"/>
        <text x="12" y="18" font-size="8.5" font-weight="700" fill="#581C87">THE ASYNCHRONOUS PREFETCH INVARIANT (LATENCY OVERLAP)</text>

        <!-- Math Derivation Box -->
        <g transform="translate(12, 28)">
          <rect width="400" height="52" rx="1" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <text x="10" y="18" font-size="8" font-family="ui-monospace, monospace" fill="#0F172A">T_swap = M_KV(S) / B_PCIe = 10.49 GB / (64 GB/s) = 164 ms</text>
          <text x="10" y="36" font-size="8" font-family="ui-monospace, monospace" fill="#0F766E">T_tool = 1,000 ms to 30,000 ms &gt;&gt; T_swap (164 ms)</text>
        </g>

        <!-- Timing Diagram: Tool I/O vs Swap Latency -->
        <g transform="translate(12, 90)">
          <!-- Tool Wait Timeline -->
          <text x="0" y="12" font-size="7.5" font-weight="700" fill="#475569">EXTERNAL TOOL LATENCY (T_tool):</text>
          <rect x="0" y="18" width="380" height="22" rx="1" fill="#EEF2F6" stroke="#475569" stroke-width="1"/>
          <text x="190" y="32" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Blocking Tool Execution (T_tool = 5,000 ms)</text>

          <!-- Swap Out + Prefetch Timeline -->
          <text x="0" y="56" font-size="7.5" font-weight="700" fill="#475569">PCIe DMA OVERHEAD (T_swap):</text>
          <rect x="0" y="62" width="48" height="22" rx="1" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
          <text x="24" y="76" text-anchor="middle" font-size="7" font-weight="700" fill="#92400E">Swap 164ms</text>

          <rect x="332" y="62" width="48" height="22" rx="1" fill="#F0FDF4" stroke="#0F766E" stroke-width="1"/>
          <text x="356" y="76" text-anchor="middle" font-size="7" font-weight="700" fill="#0F766E">Fetch 164ms</text>

          <!-- Hidden Idle Gap -->
          <line x1="50" y1="73" x2="330" y2="73" stroke="#581C87" stroke-width="1.2" stroke-dasharray="3 2"/>
          <text x="190" y="70" text-anchor="middle" font-size="7.5" font-weight="700" fill="#581C87">100% SWAP LATENCY HIDDEN (4,672 ms HBM FREED)</text>
        </g>

        <text x="12" y="206" font-size="7.5" font-style="italic" fill="#581C87">Zero GPU memory stranded during tool execution.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Architectural Invariant -->
  <g transform="translate(40, 498)">
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0F172A">THE ASYNCHRONOUS PREFETCH INVARIANT:</text>
    <text x="230" y="12" font-size="8.5" font-style="italic" fill="#334155">"Because T_tool exceeds PCIe Gen5 swap latency by 1–2 orders of magnitude, never pin idle KV cache in accelerator HBM during tool wait."</text>
  </g>

</svg>
