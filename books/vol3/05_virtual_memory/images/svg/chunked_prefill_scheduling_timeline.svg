<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; }
      .tl-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .tl-sub { font-family: ui-monospace, monospace; font-size: 10px; text-anchor: middle; }
      .badge-txt { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <rect width="1080" height="440" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">SCHEDULING TIMELINE: MONOLITHIC PREFILL VS. CHUNKED CO-SCHEDULING</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">Eliminating Head-of-Line Blocking and ITL Tail Spikes</text>

  <!-- Panel 1: Monolithic Scheduling -->
  <g transform="translate(35, 75)">
    <rect width="1010" height="135" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="25" class="panel-title" fill="#991b1b">A. Monolithic Scheduling (Head-of-Line Decode Stall):</text>
    <text x="980" y="25" class="badge-txt" fill="#dc2626" text-anchor="end">P99 ITL Spike: ~800 ms (22×)</text>

    <!-- Decode 1 -->
    <rect x="20" y="40" width="100" height="45" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="70" y="60" class="tl-lbl" fill="#1d4ed8">Decode 1</text>
    <text x="70" y="74" class="tl-sub" fill="#1e40af">35 ms</text>

    <!-- Monolithic Prefill -->
    <rect x="130" y="40" width="750" height="45" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="505" y="60" class="tl-lbl" fill="#b91c1c">Monolithic Prefill Ingestion (4,096 tokens)</text>
    <text x="505" y="74" class="tl-sub" fill="#991b1b">800 ms compute-bound stall (active decode streams starved of memory bus cycles)</text>

    <!-- Decode 2 -->
    <rect x="890" y="40" width="100" height="45" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="940" y="60" class="tl-lbl" fill="#1d4ed8">Decode 2</text>
    <text x="940" y="74" class="tl-sub" fill="#1e40af">35 ms</text>

    <text x="505" y="112" class="card-text" font-weight="700" fill="#b91c1c" text-anchor="middle">
      ▲ Active decode sequences stall for 800 ms waiting for monolithic GEMM tensor core completion
    </text>
  </g>

  <!-- Panel 2: Chunked Prefill Co-Scheduling -->
  <g transform="translate(35, 230)">
    <rect width="1010" height="135" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="20" y="25" class="panel-title" fill="#065f46">B. Chunked Co-Scheduling (Token-Budget Bounded Iterations):</text>
    <text x="980" y="25" class="badge-txt" fill="#047857" text-anchor="end">P99 ITL Bound: ~50 ms</text>

    <!-- 8 Interleaved Chunks -->
    <rect x="20" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="76" y="58" class="tl-lbl" fill="#047857">Chunk 1+Dec</text>
    <text x="76" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="142" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="198" y="58" class="tl-lbl" fill="#047857">Chunk 2+Dec</text>
    <text x="198" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="264" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="320" y="58" class="tl-lbl" fill="#047857">Chunk 3+Dec</text>
    <text x="320" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="386" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="442" y="58" class="tl-lbl" fill="#047857">Chunk 4+Dec</text>
    <text x="442" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="508" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="564" y="58" class="tl-lbl" fill="#047857">Chunk 5+Dec</text>
    <text x="564" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="630" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="686" y="58" class="tl-lbl" fill="#047857">Chunk 6+Dec</text>
    <text x="686" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="752" y="40" width="112" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="808" y="58" class="tl-lbl" fill="#047857">Chunk 7+Dec</text>
    <text x="808" y="73" class="tl-sub" fill="#065f46">50 ms</text>

    <rect x="874" y="40" width="116" height="45" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="932" y="58" class="tl-lbl" fill="#047857">Chunk 8+Dec ★</text>
    <text x="932" y="73" class="tl-sub" fill="#065f46">50 ms (Emit T1)</text>

    <text x="505" y="112" class="card-text" font-weight="700" fill="#047857" text-anchor="middle">
      ★ Steady 50 ms pacing throughout entire prompt ingestion; all active decodes advance 1 token per iteration
    </text>
  </g>

  <!-- Bottom SLA Card -->
  <rect x="20" y="380" width="1040" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="408" class="card-text" font-weight="700" fill="#0f172a">SLA Trade-off:</text>
  <text x="135" y="408" class="card-text">Chunked co-scheduling increases isolated TTFT by 5%–15% to eliminate a 22× tail-latency spike in Inter-Token Latency (ITL).</text>
</svg>