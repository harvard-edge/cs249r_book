<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .axis-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .legend-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-axis-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="1080" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Plot Area Backgrounds -->
  <rect x="110" y="25" width="670" height="240" fill="#f0fdf4" opacity="0.6"/>
  <text x="445" y="48" font-family="system-ui, sans-serif" font-weight="700" font-size="12px" fill="#15803d" text-anchor="middle">STABLE SERVING REGIME (U_KV &lt; 0.85)</text>

  <rect x="780" y="25" width="230" height="240" fill="#fef2f2" opacity="0.7"/>


  <!-- Grid lines -->
  <path d="M 110 265 L 1010 265" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 205 L 1010 205" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 110 145 L 1010 145" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 780 75 L 780 315" stroke="#ef4444" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Curves -->
  <!-- p50 ITL -->
  <path d="M 110 285 L 1010 285" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- p50 TTFT -->
  <path d="M 110 260 L 780 260 C 850 260, 920 250, 1010 230" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- p99 TTFT -->
  <path d="M 110 240 C 400 240, 680 230, 780 200 C 840 170, 900 130, 960 90" 
        fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>

  <!-- p99 ITL -->
  <path d="M 110 270 C 450 270, 700 265, 780 230 C 825 190, 855 140, 875 75" 
        fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Ceiling Marker (Positioned to the left of the line so no overlap) -->
  <circle cx="780" cy="230" r="5" fill="#dc2626"/>
  <rect x="610" y="90" width="160" height="24" rx="4" fill="#ffffff" stroke="#ef4444"/>
  <text x="690" y="106" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#b91c1c" text-anchor="middle">Admission Barrier (τ = 0.88)</text>

  <!-- Preemption Wall Badge -->
  <rect x="880" y="35" width="130" height="24" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <text x="945" y="51" font-family="system-ui, sans-serif" font-weight="700" font-size="11px" fill="#b91c1c" text-anchor="middle">PREEMPTION WALL</text>

  <!-- Axes -->
  <path d="M 110 315 L 1030 315" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis-l)"/>
  <path d="M 110 315 L 110 70" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis-l)"/>

  <!-- Y-Axis Labels -->
  <text x="45" y="145" class="axis-lbl" transform="rotate(-90 45,195)" text-anchor="middle">Latency (ms, Log Scale)</text>
  <text x="100" y="269" class="tick-lbl" text-anchor="end">10 ms</text>
  <text x="100" y="219" class="tick-lbl" text-anchor="end">50 ms</text>
  <text x="100" y="159" class="tick-lbl" text-anchor="end">200 ms</text>
  <text x="100" y="99" class="tick-lbl" text-anchor="end">1,000 ms</text>
  <text x="100" y="39" class="tick-lbl" text-anchor="end">5,000 ms</text>

  <!-- X-Axis Labels -->
  <text x="560" y="308" class="axis-lbl" text-anchor="middle">KV Cache Utilization (U_KV = Allocated Blocks / Total Pool)</text>
  <text x="110" y="285" class="tick-lbl" text-anchor="middle">0.0</text>
  <text x="350" y="285" class="tick-lbl" text-anchor="middle">0.30</text>
  <text x="560" y="285" class="tick-lbl" text-anchor="middle">0.60</text>
  <text x="780" y="285" class="tick-lbl" text-anchor="middle" font-weight="700" fill="#b91c1c">0.88 (τ_high)</text>
  <text x="1010" y="285" class="tick-lbl" text-anchor="middle">1.00 (Exhaustion)</text>

  <!-- Legend -->
  <g transform="translate(130, 325)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#10b981" stroke-width="2.5"/>
    <text x="38" y="14" class="legend-lbl" fill="#047857">p50 ITL (GEMV bounded, ~35 ms)</text>

    <line x1="260" y1="10" x2="290" y2="10" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="298" y="14" class="legend-lbl" fill="#1d4ed8">p50 TTFT (Stable prefill)</text>

    <line x1="470" y1="10" x2="500" y2="10" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
    <text x="508" y="14" class="legend-lbl" fill="#b45309">p99 TTFT (Queueing delay)</text>

    <line x1="700" y1="10" x2="730" y2="10" stroke="#dc2626" stroke-width="3"/>
    <text x="738" y="14" class="legend-lbl" fill="#b91c1c">p99 ITL (Swap/Preemption stall)</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="365" width="1040" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="388" class="card-text" font-weight="700" fill="#0f172a">Capacity Ceiling Invariant:</text>
  <text x="185" y="388" class="card-text">Never operate KV cache pools above τ_high = 0.88. Operating above this ceiling triggers preemption cascades and synchronous</text>
  <text x="185" y="404" class="card-text">PCIe swap stalls that explode tail ITL by over 20× while saving less than 12% in hardware provisioning.</text>
</svg>