<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .axis-lbl { font-size: 11px; font-weight: 700; fill: #1e293b; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .legend-lbl { font-size: 10.5px; font-weight: 600; }
      .regime-txt { font-size: 10px; font-weight: 700; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 9.5px; }
    </style>
    <marker id="arr-axis-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Container Card -->
  <rect x="20" y="15" width="1040" height="360" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Plot Area Background Shading -->
  <rect x="120" y="35" width="660" height="250" fill="#f0fdf4" fill-opacity="0.6"/>
  <text x="450" y="55" class="regime-txt" fill="#15803d" text-anchor="middle">STABLE SERVING REGIME (U_KV &lt; 0.85)</text>

  <rect x="780" y="35" width="230" height="250" fill="#fef2f2" fill-opacity="0.7"/>
  <text x="895" y="55" class="regime-txt" fill="#b91c1c" text-anchor="middle">PREEMPTION &amp; EVICTION ZONE</text>

  <!-- Grid Lines -->
  <line x1="120" y1="235" x2="1010" y2="235" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="175" x2="1010" y2="175" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="115" x2="1010" y2="115" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Vertical Admission Barrier -->
  <line x1="780" y1="35" x2="780" y2="285" stroke="#ef4444" stroke-dasharray="4 3" stroke-width="1.5"/>
  <circle cx="780" cy="205" r="4.5" fill="#dc2626"/>
  <text x="770" y="145" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="end">Admission Barrier (τ_high = 0.88)</text>

  <!-- Curves -->
  <!-- 1. p50 ITL (green flat) -->
  <line x1="120" y1="255" x2="1010" y2="255" stroke="#10b981" stroke-width="2.5"/>

  <!-- 2. p50 TTFT (blue flat then slight rise) -->
  <path d="M 120 230 L 780 230 C 850 230, 920 220, 1010 200" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- 3. p99 TTFT (amber dashed) -->
  <path d="M 120 210 C 400 210, 680 200, 780 170 C 840 140, 900 100, 970 55" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- 4. p99 ITL (red bold hockey-stick) -->
  <path d="M 120 240 C 450 240, 700 235, 780 205 C 825 165, 855 115, 875 45" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Axes -->
  <line x1="120" y1="285" x2="1030" y2="285" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis-l)"/>
  <line x1="120" y1="285" x2="120" y2="30" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-axis-l)"/>

  <!-- Y-Axis Labels -->
  <text x="50" y="160" class="axis-lbl" transform="rotate(-90 50,160)" text-anchor="middle">Latency (ms, Log Scale)</text>
  <text x="110" y="289" class="tick-lbl" text-anchor="end">10 ms</text>
  <text x="110" y="239" class="tick-lbl" text-anchor="end">50 ms</text>
  <text x="110" y="179" class="tick-lbl" text-anchor="end">200 ms</text>
  <text x="110" y="119" class="tick-lbl" text-anchor="end">1,000 ms</text>
  <text x="110" y="59" class="tick-lbl" text-anchor="end">5,000 ms</text>

  <!-- X-Axis Labels -->
  <text x="565" y="328" class="axis-lbl" text-anchor="middle">KV Cache Utilization (U_KV = Allocated Physical Blocks / Total HBM Pool)</text>
  <text x="120" y="304" class="tick-lbl" text-anchor="middle">0.0</text>
  <text x="340" y="304" class="tick-lbl" text-anchor="middle">0.30</text>
  <text x="560" y="304" class="tick-lbl" text-anchor="middle">0.60</text>
  <text x="780" y="304" class="tick-lbl" text-anchor="middle" font-weight="700" fill="#b91c1c">0.88 (τ_high)</text>
  <text x="1010" y="304" class="tick-lbl" text-anchor="middle">1.00 (Exhaustion)</text>

  <!-- Legend -->
  <g transform="translate(135, 348)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#10b981" stroke-width="2.5"/>
    <text x="36" y="12" class="legend-lbl" fill="#047857">p50 ITL (GEMV bounded, ~35 ms)</text>

    <line x1="260" y1="8" x2="288" y2="8" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="296" y="12" class="legend-lbl" fill="#1d4ed8">p50 TTFT (Stable prefill)</text>

    <line x1="470" y1="8" x2="498" y2="8" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="506" y="12" class="legend-lbl" fill="#b45309">p99 TTFT (Queueing delay)</text>

    <line x1="695" y1="8" x2="723" y2="8" stroke="#dc2626" stroke-width="3"/>
    <text x="731" y="12" class="legend-lbl" fill="#b91c1c">p99 ITL (Swap / Preemption wall)</text>
  </g>
</svg>