<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="1160" height="620" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">RADIX TREE ARCHITECTURE FOR DYNAMIC PREFIX CACHING</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Hierarchical token trie indexing with PagedAttention virtual memory mapping, reference counting, and LRU eviction</text>

  <!-- ================================================================= -->
  <!-- LEFT: LOGICAL RADIX TREE INDEX (TOKEN SEQUENCES)                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="570" height="440" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">LOGICAL RADIX TREE INDEX (TOKEN SEQUENCES)</text>

    <!-- Tree Nodes & Edges Graphic -->
    <g transform="translate(15, 34)">
      <!-- Root Node -->
      <g transform="translate(195, 8)">
        <rect x="0" y="0" width="180" height="44" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="90" y="18" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Root: System Prompt</text>
        <text x="90" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">Tokens [0..1840] • ref_count=3</text>
      </g>

      <!-- Forking Lines from Root -->
      <path d="M 245 52 L 120 86" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
      <path d="M 325 52 L 440 86" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-orange)"/>

      <!-- Level 1 - Child A -->
      <g transform="translate(25, 88)">
        <rect x="0" y="0" width="190" height="50" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
        <text x="95" y="16" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Turn 1: User Goal A</text>
        <text x="95" y="30" font-size="7.5" fill="#64748b" text-anchor="middle">Tokens [1841..2420] • ref=2</text>
        <text x="95" y="42" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle">MATCH: 100% Cache Hit</text>
      </g>

      <!-- Level 1 - Child B -->
      <g transform="translate(345, 88)">
        <rect x="0" y="0" width="190" height="50" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1.2"/>
        <text x="95" y="16" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Turn 1: User Goal B</text>
        <text x="95" y="30" font-size="7.5" fill="#64748b" text-anchor="middle">Tokens [1841..2180] • ref=1</text>
        <text x="95" y="42" font-size="7.5" font-weight="700" fill="#d97706" text-anchor="middle">INACTIVE (Idle Branch)</text>
      </g>

      <!-- Forking Lines from Child A -->
      <path d="M 80 138 L 50 170" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <path d="M 160 138 L 190 170" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <!-- Level 2 - Child A1 (Step 2 Tool Call) -->
      <g transform="translate(10, 172)">
        <rect x="0" y="0" width="150" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="75" y="15" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Step 2: Tool Call</text>
        <text x="75" y="28" font-size="7.5" font-family="monospace" fill="#0284c7" text-anchor="middle">view_file(cache.py)</text>
        <text x="75" y="40" font-size="7" fill="#64748b" text-anchor="middle">Tokens [2421..2850] • ref=1</text>
      </g>

      <!-- Level 2 - Child A2 (Branch Rollout / Search) -->
      <g transform="translate(170, 172)">
        <rect x="0" y="0" width="150" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="75" y="15" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Branch A2: Search</text>
        <text x="75" y="28" font-size="7.5" font-family="monospace" fill="#0284c7" text-anchor="middle">grep_search(H2O)</text>
        <text x="75" y="40" font-size="7" fill="#64748b" text-anchor="middle">Tokens [2421..2910] • ref=1</text>
      </g>

      <!-- Forking Line from Child B to Eviction Leaf -->
      <path d="M 440 138 L 440 170" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
      <g transform="translate(360, 172)">
        <rect x="0" y="0" width="160" height="48" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="80" y="15" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Terminated Turn</text>
        <text x="80" y="28" font-size="7.5" fill="#64748b" text-anchor="middle">ref_count = 0</text>
        <text x="80" y="40" font-size="7.5" font-weight="700" fill="#dc2626" text-anchor="middle">QUEUED FOR LRU</text>
      </g>
    </g>

    <!-- Bottom Legend / Invariants Card -->
    <g transform="translate(15, 290)">
      <rect x="0" y="0" width="540" height="135" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">RadixAttention Systems Invariants:</text>
      <text x="12" y="38" font-size="8" fill="#334155">• Prefix lookup overhead is sub-millisecond: O(length) string comparison over token IDs.</text>
      <text x="12" y="56" font-size="8" fill="#334155">• Zero redundant prefill: matched prefixes skip compute and map directly to cached KV blocks.</text>
      <text x="12" y="74" font-size="8" fill="#334155">• Reference counting: internal nodes pinned while active children exist; leaves evicted via LRU.</text>
      <text x="12" y="92" font-size="8" fill="#334155">• Dynamic tree pruning maintains memory budget without stalling serving loops.</text>
      <text x="12" y="112" font-size="7.5" fill="#64748b">Decouples token sequence structure from physical memory placement</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: PHYSICAL PAGEDATTENTION MEMORY MAPPING (HBM)                -->
  <!-- ================================================================= -->
  <g transform="translate(630, 75)">
    <rect x="0" y="0" width="530" height="440" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">PHYSICAL PAGEDATTENTION MEMORY MAPPING (HBM)</text>

    <!-- Mapping Container Area -->
    <g transform="translate(15, 34)">
      <!-- Page Table Block -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="185" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="220" height="22" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <text x="110" y="15" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Logical Block Table</text>

        <g transform="translate(10, 32)">
          <text x="0" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a">Logical #0  ──►  Phys #4</text>
          <text x="0" y="30" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a">Logical #1  ──►  Phys #7</text>
          <text x="0" y="46" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a">Logical #2  ──►  Phys #1</text>
          <text x="0" y="62" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a">Logical #3  ──►  Phys #12</text>
          <text x="0" y="78" font-family="monospace" font-size="8" font-weight="700" fill="#15803d">Branch A1   ──►  Phys #9</text>
          <text x="0" y="94" font-family="monospace" font-size="8" font-weight="700" fill="#15803d">Branch A2   ──►  Phys #15</text>
          <line x1="0" y1="106" x2="200" y2="106" stroke="#cbd5e1" stroke-width="1"/>
          <text x="0" y="120" font-size="7.5" fill="#64748b">Block size B = 16 tokens</text>
        </g>
      </g>

      <!-- Connecting Arrow -->
      <line x1="225" y1="92" x2="245" y2="92" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

      <!-- Physical HBM Blocks Grid -->
      <g transform="translate(255, 0)">
        <rect x="0" y="0" width="245" height="185" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="245" height="22" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <text x="122" y="15" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Physical HBM Blocks</text>

        <!-- Memory slots -->
        <g transform="translate(12, 32)">
          <rect x="0" y="0" width="48" height="28" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
          <text x="24" y="18" font-family="monospace" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">#1</text>

          <rect x="56" y="0" width="48" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="80" y="18" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">#2</text>

          <rect x="112" y="0" width="48" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="136" y="18" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">#3</text>

          <rect x="168" y="0" width="48" height="28" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
          <text x="192" y="18" font-family="monospace" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">#4</text>

          <rect x="0" y="36" width="48" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="24" y="54" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">#5</text>

          <rect x="56" y="36" width="48" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="80" y="54" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">#6</text>

          <rect x="112" y="36" width="48" height="28" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
          <text x="136" y="54" font-family="monospace" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">#7</text>

          <rect x="168" y="36" width="48" height="28" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="192" y="54" font-family="monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">#9</text>

          <rect x="0" y="72" width="48" height="28" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
          <text x="24" y="90" font-family="monospace" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">#12</text>

          <rect x="56" y="72" width="48" height="28" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="80" y="90" font-family="monospace" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">#15</text>

          <rect x="112" y="72" width="104" height="28" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
          <text x="164" y="90" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Free Pool (HBM)</text>
        </g>
      </g>
    </g>

    <!-- Allocation Comparison Table -->
    <g transform="translate(15, 235)">
      <rect x="0" y="0" width="500" height="190" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-size="8.5" font-weight="700" fill="#15803d">Static Tensor vs. PagedAttention Allocation:</text>

        <text x="0" y="20" font-size="8" font-weight="700" fill="#991b1b">• Contiguous Static Allocation:</text>
        <text x="0" y="34" font-size="7.5" fill="#334155">Requires pre-allocating max sequence length; wastes 60–80%</text>
        <text x="0" y="46" font-size="7.5" fill="#334155">of memory on internal and external fragmentation.</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#15803d">• Dynamic Paged Allocation:</text>
        <text x="0" y="82" font-size="7.5" fill="#334155">Allocates blocks on-demand; eliminates external fragmentation;</text>
        <text x="0" y="94" font-size="7.5" fill="#334155">enables copy-on-write sharing across speculative branches.</text>

        <text x="0" y="116" font-size="8" font-weight="700" fill="#0f172a">• Concurrency &amp; Throughput Impact:</text>
        <text x="0" y="130" font-size="7.5" fill="#334155">Yields 2.2× to 4.5× higher serving concurrency under identical</text>
        <text x="0" y="142" font-size="7.5" fill="#334155">GPU HBM memory budgets and real-world multi-turn traces.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM: SYSTEMS PRINCIPLE CALLOUT BANNER                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect x="0" y="0" width="1120" height="90" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <g transform="translate(15, 15)">
      <rect x="0" y="0" width="90" height="60" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="45" y="27" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">SYSTEMS</text>
      <text x="45" y="42" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">PRINCIPLE</text>
    </g>
    <text x="125" y="32" font-size="10.5" font-weight="700" fill="#0f172a">Radix Trees Exploit Prefix Redundancy; PagedAttention Solves Fragmentation</text>
    <text x="125" y="52" font-size="8.5" fill="#334155">Multi-turn agent trajectories share 85–95% of prompt prefixes. Radix trees index token sequences to skip redundant prefill compute,</text>
    <text x="125" y="68" font-size="8.5" fill="#334155">while virtual page tables map logical blocks to arbitrary non-contiguous physical GPU pages with copy-on-write sharing.</text>
  </g>

</svg>