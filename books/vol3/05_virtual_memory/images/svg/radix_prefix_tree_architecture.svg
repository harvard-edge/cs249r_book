<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .card-hdr { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .card-sub { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .node-lbl { font-size: 10px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 8.5px; fill: #64748b; text-anchor: middle; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 9px; }
      .mono-bold { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left Container Card: Logical Radix Prefix Trie -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="560" height="460" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="220" height="22" rx="3" fill="#ede9fe"/>
    <text x="24" y="29" class="card-hdr" fill="#6d28d9">LOGICAL RADIX PREFIX TRIE</text>
    <text x="248" y="29" class="card-sub">Hierarchical Token Sequence Index</text>

    <!-- Tree Structure -->
    <g transform="translate(15, 48)">
      <!-- Root Node: System Prompt -->
      <g transform="translate(160, 10)">
        <rect x="0" y="0" width="200" height="52" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="100" y="18" class="node-lbl" fill="#5b21b6">Root: System Prompt</text>
        <text x="100" y="32" class="mono-txt" fill="#475569" text-anchor="middle">Tokens [0 .. 1840]</text>
        <text x="100" y="45" class="mono-bold" fill="#7c3aed" text-anchor="middle">ref_count = 3 (Pinned)</text>
      </g>

      <!-- Branches from Root -->
      <path d="M 210 62 L 130 104" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
      <path d="M 310 62 L 390 104" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

      <!-- Level 1 - Branch A (User Goal A) -->
      <g transform="translate(30, 108)">
        <rect x="0" y="0" width="190" height="54" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
        <text x="95" y="18" class="node-lbl" fill="#15803d">Branch A: User Goal A</text>
        <text x="95" y="32" class="mono-txt" fill="#475569" text-anchor="middle">Tokens [1841 .. 2420]</text>
        <text x="95" y="46" class="mono-bold" fill="#16a34a" text-anchor="middle">ref_count = 2 (Prefix Hit)</text>
      </g>

      <!-- Level 1 - Branch B (User Goal B - Inactive) -->
      <g transform="translate(300, 108)">
        <rect x="0" y="0" width="190" height="54" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 2"/>
        <text x="95" y="18" class="node-lbl" fill="#b45309">Branch B: User Goal B</text>
        <text x="95" y="32" class="mono-txt" fill="#475569" text-anchor="middle">Tokens [1841 .. 2180]</text>
        <text x="95" y="46" class="mono-bold" fill="#dc2626" text-anchor="middle">ref_count = 0 (Idle)</text>
      </g>

      <!-- Forking from Branch A -->
      <path d="M 80 162 L 55 204" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <path d="M 170 162 L 195 204" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <!-- Leaf A1: Active Tool Call -->
      <g transform="translate(5, 208)">
        <rect x="0" y="0" width="135" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="67" y="16" class="node-lbl" fill="#0f172a">Leaf A1: Tool Call</text>
        <text x="67" y="30" class="mono-txt" fill="#0284c7" text-anchor="middle">view_file(cache.py)</text>
        <text x="67" y="44" class="mono-txt" fill="#64748b" text-anchor="middle">[2421..2850] · rc=1</text>
      </g>

      <!-- Leaf A2: Branch Search -->
      <g transform="translate(150, 208)">
        <rect x="0" y="0" width="135" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="67" y="16" class="node-lbl" fill="#0f172a">Leaf A2: Search</text>
        <text x="67" y="30" class="mono-txt" fill="#0284c7" text-anchor="middle">grep_search(H2O)</text>
        <text x="67" y="44" class="mono-txt" fill="#64748b" text-anchor="middle">[2421..2910] · rc=1</text>
      </g>

      <!-- Leaf B1: Terminated Branch -->
      <path d="M 395 162 L 395 204" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>
      <g transform="translate(320, 208)">
        <rect x="0" y="0" width="150" height="52" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="75" y="16" class="node-lbl" fill="#991b1b">Terminated Turn</text>
        <text x="75" y="30" class="mono-txt" fill="#b91c1c" text-anchor="middle">ref_count = 0</text>
        <text x="75" y="44" class="mono-bold" fill="#dc2626" text-anchor="middle">Queued in LRU List</text>
      </g>
    </g>

    <!-- Structural Invariants Box -->
    <g transform="translate(16, 330)">
      <rect x="0" y="0" width="528" height="112" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#1e40af">Prefix Trie Architectural Invariants:</text>
      <text x="12" y="36" font-size="8.5" fill="#334155">• <tspan font-weight="700">O(S_match) Match:</tspan> Token sequence matched via exact hash lookup; skips prefill GEMM.</text>
      <text x="12" y="52" font-size="8.5" fill="#334155">• <tspan font-weight="700">Reference Count Rule:</tspan> Internal nodes pinned while active child leaves exist (rc &gt; 0).</text>
      <text x="12" y="68" font-size="8.5" fill="#334155">• <tspan font-weight="700">Lazy Eviction:</tspan> Completed requests retain KV blocks until allocator memory pressure.</text>
      <text x="12" y="84" font-size="8.5" fill="#334155">• <tspan font-weight="700">Safe Pruning:</tspan> Evicting Branch B frees only PBN #9, leaving Root (PBN #4, #7) intact.</text>
    </g>
  </g>

  <!-- Right Container Card: Physical Frame Mapping & Dynamic Eviction List -->
  <g transform="translate(600, 20)">
    <rect x="0" y="0" width="480" height="460" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="220" height="22" rx="3" fill="#e0f2fe"/>
    <text x="24" y="29" class="card-hdr" fill="#0369a1">PHYSICAL HBM &amp; LRU EVICTION</text>
    <text x="464" y="29" class="card-sub" text-anchor="end">Frame Mapping</text>

    <!-- Physical Block Table Translation -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="448" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Block Table Residency &amp; Node Ownership</text>

      <g transform="translate(12, 28)">
        <!-- Header row -->
        <rect x="0" y="0" width="424" height="20" rx="2" fill="#f1f5f9"/>
        <text x="10" y="14" font-size="8.5" font-weight="700" fill="#475569">RADIX NODE</text>
        <text x="130" y="14" font-size="8.5" font-weight="700" fill="#475569">PHYSICAL FRAMES</text>
        <text x="270" y="14" font-size="8.5" font-weight="700" fill="#475569">RESIDENCY</text>
        <text x="365" y="14" font-size="8.5" font-weight="700" fill="#475569">STATUS</text>

        <!-- Row 1 -->
        <text x="10" y="38" class="mono-txt" fill="#334155">Root (SysPrompt)</text>
        <text x="130" y="38" class="mono-bold" fill="#7c3aed">PBN #4, #7</text>
        <text x="270" y="38" font-size="8.5" fill="#334155">HBM (Pinned)</text>
        <text x="365" y="38" class="mono-bold" fill="#15803d">ACTIVE</text>

        <!-- Row 2 -->
        <text x="10" y="58" class="mono-txt" fill="#334155">Branch A (Goal A)</text>
        <text x="130" y="58" class="mono-bold" fill="#16a34a">PBN #1</text>
        <text x="270" y="58" font-size="8.5" fill="#334155">HBM (Resident)</text>
        <text x="365" y="58" class="mono-bold" fill="#15803d">ACTIVE</text>

        <!-- Row 3 -->
        <text x="10" y="78" class="mono-txt" fill="#334155">Leaf A1 / Leaf A2</text>
        <text x="130" y="78" class="mono-bold" fill="#0284c7">PBN #12, #15</text>
        <text x="270" y="78" font-size="8.5" fill="#334155">HBM (Private)</text>
        <text x="365" y="78" class="mono-bold" fill="#15803d">ACTIVE</text>

        <!-- Row 4 -->
        <text x="10" y="98" class="mono-txt" fill="#dc2626">Branch B (Goal B)</text>
        <text x="130" y="98" class="mono-bold" fill="#dc2626">PBN #9</text>
        <text x="270" y="98" font-size="8.5" fill="#dc2626">HBM (Unreferenced)</text>
        <text x="365" y="98" class="mono-bold" fill="#dc2626">LRU QUEUE</text>
      </g>
    </g>

    <!-- LRU Eviction Doubly Linked List -->
    <g transform="translate(16, 202)">
      <rect x="0" y="0" width="448" height="115" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Dynamic LRU Eviction Linked List (ref_count == 0)</text>

      <g transform="translate(14, 32)">
        <!-- Node 1 (MRU candidate) -->
        <rect x="0" y="0" width="115" height="42" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
        <text x="57" y="16" class="mono-bold" fill="#b45309" text-anchor="middle">Branch B1</text>
        <text x="57" y="30" class="mono-txt" fill="#64748b" text-anchor="middle">PBN #14 (MRU)</text>

        <!-- Arrows -->
        <path d="M 120 16 L 145 16" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
        <path d="M 145 28 L 120 28" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

        <!-- Node 2 (LRU candidate) -->
        <rect x="150" y="0" width="115" height="42" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
        <text x="207" y="16" class="mono-bold" fill="#991b1b" text-anchor="middle">Branch B</text>
        <text x="207" y="30" class="mono-txt" fill="#dc2626" text-anchor="middle">PBN #9 (LRU Tail)</text>

        <!-- Eviction Arrow to Free Pool -->
        <path d="M 270 21 L 305 21" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

        <!-- Free Pool -->
        <rect x="310" y="0" width="105" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
        <text x="362" y="16" class="mono-bold" fill="#15803d" text-anchor="middle">Free Pool Ring</text>
        <text x="362" y="30" class="mono-txt" fill="#16a34a" text-anchor="middle">Available Frame</text>
      </g>

      <text x="12" y="96" font-size="8.5" fill="#475569">When HBM occupancy reaches threshold τ_high = 0.88, LRU tail is reclaimed.</text>
    </g>

    <!-- Physical Frame Grid -->
    <g transform="translate(16, 332)">
      <rect x="0" y="0" width="448" height="110" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">Physical Accelerator HBM Frames</text>

      <g transform="translate(14, 28)">
        <!-- PBN #1 -->
        <rect x="0" y="0" width="62" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="31" y="15" class="mono-bold" fill="#15803d" text-anchor="middle">PBN #1</text>
        <text x="31" y="25" font-size="7" fill="#16a34a" text-anchor="middle">Branch A</text>

        <!-- PBN #4 -->
        <rect x="70" y="0" width="62" height="30" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="101" y="15" class="mono-bold" fill="#6d28d9" text-anchor="middle">PBN #4</text>
        <text x="101" y="25" font-size="7" fill="#6d28d9" text-anchor="middle">Root (1)</text>

        <!-- PBN #7 -->
        <rect x="140" y="0" width="62" height="30" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="171" y="15" class="mono-bold" fill="#6d28d9" text-anchor="middle">PBN #7</text>
        <text x="171" y="25" font-size="7" fill="#6d28d9" text-anchor="middle">Root (2)</text>

        <!-- PBN #9 -->
        <rect x="210" y="0" width="62" height="30" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
        <text x="241" y="15" class="mono-bold" fill="#dc2626" text-anchor="middle">PBN #9</text>
        <text x="241" y="25" font-size="7" fill="#dc2626" text-anchor="middle">LRU Evict</text>

        <!-- PBN #12 -->
        <rect x="280" y="0" width="62" height="30" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="311" y="15" class="mono-bold" fill="#1d4ed8" text-anchor="middle">PBN #12</text>
        <text x="311" y="25" font-size="7" fill="#1d4ed8" text-anchor="middle">Leaf A1</text>

        <!-- PBN #15 -->
        <rect x="350" y="0" width="62" height="30" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
        <text x="381" y="15" class="mono-bold" fill="#1d4ed8" text-anchor="middle">PBN #15</text>
        <text x="381" y="25" font-size="7" fill="#1d4ed8" text-anchor="middle">Leaf A2</text>
      </g>
      <text x="12" y="86" font-size="8.5" fill="#475569">Shared frames remain resident across all active downstream trajectories.</text>
    </g>
  </g>
</svg>