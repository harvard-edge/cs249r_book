    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7E22CE"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="500" fill="#F8FAFC" rx="12"/>

  <!-- Top Header Banner -->
  <rect x="16" y="16" width="928" height="58" rx="8" fill="url(#headerGrad)"/>
  <rect x="36" y="27" width="92" height="20" rx="10" fill="#A855F7"/>
  <text x="82" y="41" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FIGURE 4.4</text>
  <text x="140" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Tree-Structured KV-Cache Allocation &amp; Radix Prefix Sharing</text>
  <text x="36" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#E9D5FF">Eliminating Redundant Prefills and HBM Thrashing via RadixAttention (Zheng et al. 2024)</text>

  <!-- LEFT PANEL: Naive Independent Serving -->
  <rect x="16" y="84" width="456" height="345" rx="8" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="26" y="92" width="436" height="24" rx="4" fill="#FEE2E2"/>
  <text x="244" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="middle">A. Naive Independent Serving (Redundant KV Duplication)</text>

  <!-- Branch 1 Memory Row -->
  <text x="32" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Branch 1:</text>
  <rect x="90" y="124" width="130" height="18" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <text x="155" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">System Prompt (2k)</text>
  <rect x="224" y="124" width="100" height="18" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="274" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">Step 1 Trace (1.5k)</text>
  <rect x="328" y="124" width="90" height="18" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="373" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Step 2 (A) (0.5k)</text>

  <!-- Branch 2 Memory Row -->
  <text x="32" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Branch 2:</text>
  <rect x="90" y="152" width="130" height="18" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <text x="155" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">System Prompt (2k) [DUP]</text>
  <rect x="224" y="152" width="100" height="18" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="274" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">Step 1 Trace [DUP]</text>
  <rect x="328" y="152" width="90" height="18" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="373" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Step 2 (B) (0.5k)</text>

  <!-- Branch 3 Memory Row -->
  <text x="32" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Branch 3:</text>
  <rect x="90" y="180" width="130" height="18" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <text x="155" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">System Prompt (2k) [DUP]</text>
  <rect x="224" y="180" width="100" height="18" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="274" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">Step 1 Trace [DUP]</text>
  <rect x="328" y="180" width="90" height="18" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="373" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Step 2 (C) (0.5k)</text>

  <!-- Branch 4 Memory Row -->
  <text x="32" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">Branch 4:</text>
  <rect x="90" y="208" width="130" height="18" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <text x="155" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">System Prompt (2k) [DUP]</text>
  <rect x="224" y="208" width="100" height="18" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="274" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">Step 1 Trace [DUP]</text>
  <rect x="328" y="208" width="90" height="18" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="373" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Step 2 (D) (0.5k)</text>

  <!-- Left Stats Card -->
  <rect x="26" y="240" width="436" height="95" rx="6" fill="#FFF5F5" stroke="#FEB2B2" stroke-width="1"/>
  <text x="36" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#991B1B">Memory Footprint &amp; Prefill Overhead:</text>
  <text x="36" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#DC2626">4 × 4,000 = 16,000 tokens</tspan></text>
  <text x="36" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">• Redundant Duplicate Tokens: <tspan font-weight="700" fill="#DC2626">10,500 tokens (65.6% pure waste)</tspan></text>
  <text x="36" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">• Prefill Thrashing: Redundant re-computation of 3.5k tokens 4× times</text>
  <text x="36" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991B1B">• Result: Rapid HBM OOM when scaling search width B &gt; 8</text>

  <rect x="26" y="346" width="436" height="36" rx="4" fill="#FEE2E2"/>
  <text x="244" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">HBM Status: Severe Memory Fragmentation &amp; Low Concurrency</text>
  <text x="244" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#7F1D1D" text-anchor="middle">Independent inference contexts cannot share physical KV pages</text>


  <!-- RIGHT PANEL: Radix Tree Cache -->
  <rect x="488" y="84" width="456" height="345" rx="8" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="498" y="92" width="436" height="24" rx="4" fill="#DCFCE7"/>
  <text x="716" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">B. RadixTree KV-Cache with Copy-on-Write (SGLang / RadixAttention)</text>

  <!-- Tree Graph Diagram -->
  <!-- Root Node -->
  <rect x="510" y="160" width="110" height="36" rx="4" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2"/>
  <text x="565" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B" text-anchor="middle">Root Node</text>
  <text x="565" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569" text-anchor="middle">Prompt: 2k tok [rc=4]</text>

  <!-- Intermediate Node -->
  <rect x="660" y="160" width="100" height="36" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
  <text x="710" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B" text-anchor="middle">Step 1 Node</text>
  <text x="710" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569" text-anchor="middle">Trace: 1.5k tok [rc=4]</text>

  <line x1="620" y1="178" x2="654" y2="178" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- 4 Delta Leaf Nodes -->
  <line x1="760" y1="168" x2="804" y2="134" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="760" y1="174" x2="804" y2="162" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="760" y1="182" x2="804" y2="194" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="760" y1="188" x2="804" y2="222" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="808" y="122" width="116" height="22" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="866" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Leaf A: Δ 0.5k [rc=1]</text>

  <rect x="808" y="152" width="116" height="22" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="866" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Leaf B: Δ 0.5k [rc=1]</text>

  <rect x="808" y="182" width="116" height="22" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="866" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Leaf C: Δ 0.5k [rc=1]</text>

  <rect x="808" y="212" width="116" height="22" rx="3" fill="#EDE9FE" stroke="#7E22CE" stroke-width="1"/>
  <text x="866" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Leaf D: Δ 0.5k [rc=1]</text>

  <!-- Right Stats Card -->
  <rect x="498" y="240" width="436" height="95" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="508" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">Radix Tree Memory &amp; Prefill Savings:</text>
  <text x="508" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">• Shared Root &amp; Step 1: <tspan font-weight="700" fill="#16A34A">2,000 + 1,500 = 3,500 tokens</tspan> (allocated ONCE)</text>
  <text x="508" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">• Delta Leaves Allocation: <tspan font-weight="700" fill="#16A34A">4 × 500 = 2,000 tokens</tspan></text>
  <text x="508" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#15803D">5,500 tokens vs. 16,000 tokens (65.6% saved!)</tspan></text>
  <text x="508" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#15803D">• Zero Prefill Overhead: Child branches branch instantly without prefill</text>

  <rect x="498" y="346" width="436" height="36" rx="4" fill="#DCFCE7"/>
  <text x="716" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">HBM Status: High Concurrency &amp; Reference Counting</text>
  <text x="716" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#14532D" text-anchor="middle">PagedAttention physical blocks freed automatically when refcount (rc) drops to 0</text>


  <!-- BOTTOM BANNER -->
  <rect x="16" y="440" width="928" height="44" rx="8" fill="url(#purpleGrad)" stroke="#D8B4FE" stroke-width="1.2"/>
  <text x="36" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#581C87">Systems Invariant: The Prefix-Tree Memory Law</text>
  <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#4C1D95">When serving branching search trees, memory scales with tree frontier width rather than total token count: M_tree = M_prefix + Σ M_Δ(leaf) ≪ Σ M_total(path).</text>
</svg>