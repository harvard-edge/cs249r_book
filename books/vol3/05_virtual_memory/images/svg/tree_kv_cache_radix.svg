<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="510" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT: NAIVE INDEPENDENT SERVING (REDUNDANT DUPLICATION)           -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="430" height="375" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. NAIVE INDEPENDENT SERVING (REDUNDANT DUPLICATION)</text>

    <!-- Branch Rows -->
    <g transform="translate(10, 32)">
      <!-- Branch 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#334155">Branch 1:</text>
        <rect x="58" y="2" width="125" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="120" y="14" font-size="7.5" fill="#334155" text-anchor="middle">System Prompt (2k)</text>
        <rect x="188" y="2" width="115" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="245" y="14" font-size="7.5" fill="#334155" text-anchor="middle">Step 1 Trace (1.5k)</text>
        <rect x="308" y="2" width="95" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="355" y="14" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (A) (0.5k)</text>
      </g>

      <!-- Branch 2 -->
      <g transform="translate(0, 24)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#334155">Branch 2:</text>
        <rect x="58" y="2" width="125" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="120" y="14" font-size="7.5" fill="#991b1b" text-anchor="middle">System Prompt (2k) [DUP]</text>
        <rect x="188" y="2" width="115" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="245" y="14" font-size="7.5" fill="#991b1b" text-anchor="middle">Step 1 Trace [DUP]</text>
        <rect x="308" y="2" width="95" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="355" y="14" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (B) (0.5k)</text>
      </g>

      <!-- Branch 3 -->
      <g transform="translate(0, 48)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#334155">Branch 3:</text>
        <rect x="58" y="2" width="125" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="120" y="14" font-size="7.5" fill="#991b1b" text-anchor="middle">System Prompt (2k) [DUP]</text>
        <rect x="188" y="2" width="115" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="245" y="14" font-size="7.5" fill="#991b1b" text-anchor="middle">Step 1 Trace [DUP]</text>
        <rect x="308" y="2" width="95" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="355" y="14" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (C) (0.5k)</text>
      </g>

      <!-- Branch 4 -->
      <g transform="translate(0, 72)">
        <text x="0" y="14" font-size="8" font-weight="700" fill="#334155">Branch 4:</text>
        <rect x="58" y="2" width="125" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="120" y="14" font-size="7.5" fill="#991b1b" text-anchor="middle">System Prompt (2k) [DUP]</text>
        <rect x="188" y="2" width="115" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="245" y="14" font-size="7.5" fill="#991b1b" text-anchor="middle">Step 1 Trace [DUP]</text>
        <rect x="308" y="2" width="95" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="355" y="14" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Step 2 (D) (0.5k)</text>
      </g>
    </g>

    <!-- Left Stats Card -->
    <g transform="translate(10, 134)">
      <rect width="410" height="126" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Memory Footprint &amp; Prefill Overhead:</text>
      <text x="12" y="38" font-size="8" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#dc2626">4 × 4,000 = 16,000 tokens</tspan></text>
      <text x="12" y="56" font-size="8" fill="#334155">• Redundant Duplicate Tokens: <tspan font-weight="700" fill="#dc2626">10,500 tokens (65.6% pure waste)</tspan></text>
      <text x="12" y="74" font-size="8" fill="#334155">• Prefill Thrashing: Redundant re-computation of 3.5k tokens 4× times</text>
      <text x="12" y="92" font-size="8" fill="#334155">• Scaling Limit: Rapid HBM OOM when scaling search width B &gt; 8</text>
      <text x="12" y="110" font-size="7.5" fill="#64748b">Root cause: Isolated sequence buffers lack inter-request page sharing</text>
    </g>

    <!-- Bottom Status Callout -->
    <g transform="translate(10, 268)">
      <rect width="410" height="92" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">HBM Status: Severe Memory Fragmentation &amp; Low Concurrency</text>
      <text x="12" y="36" font-size="8" fill="#334155">• Independent inference contexts cannot share physical KV pages</text>
      <text x="12" y="52" font-size="8" fill="#334155">• Forces linear memory scaling O(B · L) with number of reasoning paths</text>
      <text x="12" y="68" font-size="8" fill="#334155">• Exhausts accelerator memory during multi-step tree search</text>
      <text x="12" y="84" font-size="7.5" fill="#991b1b">Concurrency collapse under agentic Monte Carlo tree search</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: RADIXTREE KV-CACHE WITH COPY-ON-WRITE (RADIXATTENTION)     -->
  <!-- ================================================================= -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="430" height="375" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">B. RADIXTREE KV-CACHE WITH COPY-ON-WRITE (RADIXATTENTION)</text>

    <!-- Tree Graph Diagram -->
    <g transform="translate(10, 32)">
      <!-- Root Node -->
      <g transform="translate(5, 34)">
        <rect x="0" y="0" width="105" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="52" y="15" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Root Node</text>
        <text x="52" y="27" font-size="7" fill="#64748b" text-anchor="middle">Prompt: 2k tok [rc=4]</text>
      </g>

      <!-- Step 1 Node -->
      <g transform="translate(145, 34)">
        <rect x="0" y="0" width="95" height="36" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="47" y="15" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Step 1 Node</text>
        <text x="47" y="27" font-size="7" fill="#64748b" text-anchor="middle">Trace: 1.5k [rc=4]</text>
      </g>

      <!-- Arrow Root to Step 1 -->
      <line x1="110" y1="52" x2="140" y2="52" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)"/>

      <!-- 4 Delta Leaf Nodes -->
      <line x1="240" y1="46" x2="280" y2="15" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="240" y1="50" x2="280" y2="40" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="240" y1="54" x2="280" y2="65" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
      <line x1="240" y1="58" x2="280" y2="90" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

      <rect x="286" y="4" width="118" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="345" y="17" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf A: Δ 0.5k [rc=1]</text>

      <rect x="286" y="29" width="118" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="345" y="42" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf B: Δ 0.5k [rc=1]</text>

      <rect x="286" y="54" width="118" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="345" y="67" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf C: Δ 0.5k [rc=1]</text>

      <rect x="286" y="79" width="118" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="345" y="92" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Leaf D: Δ 0.5k [rc=1]</text>
    </g>

    <!-- Right Stats Card -->
    <g transform="translate(10, 134)">
      <rect width="410" height="126" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">Radix Tree Memory &amp; Prefill Savings:</text>
      <text x="12" y="38" font-size="8" fill="#334155">• Shared Root &amp; Step 1: <tspan font-weight="700" fill="#15803d">2,000 + 1,500 = 3,500 tokens</tspan> (allocated ONCE)</text>
      <text x="12" y="56" font-size="8" fill="#334155">• Delta Leaves Allocation: <tspan font-weight="700" fill="#15803d">4 × 500 = 2,000 tokens</tspan></text>
      <text x="12" y="74" font-size="8" fill="#334155">• Total HBM Allocation: <tspan font-weight="700" fill="#15803d">5,500 tokens vs. 16,000 tokens (65.6% saved!)</tspan></text>
      <text x="12" y="92" font-size="8" fill="#334155">• Zero Prefill Overhead: Child branches branch instantly without prefill</text>
      <text x="12" y="110" font-size="7.5" fill="#64748b">Mechanism: Trie branch aliasing with PagedAttention physical pages</text>
    </g>

    <!-- Bottom Status Callout -->
    <g transform="translate(10, 268)">
      <rect width="410" height="92" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">HBM Status: High Concurrency &amp; Reference Counting</text>
      <text x="12" y="36" font-size="8" fill="#334155">• PagedAttention physical blocks freed automatically when refcount drops to 0</text>
      <text x="12" y="52" font-size="8" fill="#334155">• Dynamic tree structure maps to arbitrary non-contiguous GPU page frames</text>
      <text x="12" y="68" font-size="8" fill="#334155">• Unlocks extensive parallel tree search (MCTS / Best-of-N) at low memory cost</text>
      <text x="12" y="84" font-size="7.5" fill="#15803d">Scale search width B &gt; 32 without linear memory expansion</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM: SYSTEMS INVARIANT BANNER                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 465)">
    <rect x="0" y="0" width="880" height="50" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="15" y="20" font-size="9" font-weight="700" fill="#6d28d9">SYSTEMS INVARIANT: THE PREFIX-TREE MEMORY LAW</text>
    <text x="15" y="36" font-size="8" fill="#334155">When serving branching search trees, memory scales with tree frontier width rather than total token count: M_tree = M_prefix + Σ M_Δ(leaf) ≪ Σ M_total(path).</text>
  </g>

</g>
</svg>