<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT: MULTI-TIER PHYSICAL STORAGE HIERARCHY                       -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="430" height="440" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">MULTI-TIER PHYSICAL STORAGE HIERARCHY</text>
    <text x="418" y="16" text-anchor="end" font-size="8" fill="#64748b">Capacity vs. Bandwidth Trade-Off</text>

    <!-- Tier 1: Accelerator HBM -->
    <g transform="translate(15, 34)">
      <rect width="400" height="96" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="10" y="10" width="76" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="48" y="22" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">TIER 1: HBM3</text>
      <text x="96" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Accelerator Device Memory (SRAM / HBM3e)</text>
      <text x="10" y="44" font-size="8" fill="#334155">• Capacity: <tspan font-weight="700" fill="#0f172a">80 – 141 GB</tspan> per GPU | Bandwidth: <tspan font-weight="700" fill="#0f172a">3.35 – 4.8 TB/s</tspan></text>
      <text x="10" y="60" font-size="8" fill="#334155">• State: <tspan font-weight="700" fill="#6d28d9">Active Decoding &amp; Prefill</tspan> (Hot working set blocks)</text>
      <text x="10" y="78" font-size="8" font-weight="600" fill="#b91c1c">⚠ Extreme Contention: Pinned idle context starves concurrent requests</text>
    </g>

    <!-- Interconnect 1: PCIe Gen5 / CXL 3.0 -->
    <g transform="translate(15, 134)">
      <line x1="120" y1="2" x2="120" y2="24" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
      <line x1="130" y1="24" x2="130" y2="2" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
      <rect x="150" y="3" width="230" height="20" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="265" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">PCIe Gen5 x16 (64 GB/s) / CXL 3.0</text>
    </g>

    <!-- Tier 2: Host System DRAM -->
    <g transform="translate(15, 164)">
      <rect width="400" height="96" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="10" y="10" width="76" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="48" y="22" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">TIER 2: DRAM</text>
      <text x="96" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Host System Memory (DDR5 / CXL Memory)</text>
      <text x="10" y="44" font-size="8" fill="#334155">• Capacity: <tspan font-weight="700" fill="#0f172a">512 GB – 2.0 TB</tspan> per node | Bandwidth: <tspan font-weight="700" fill="#0f172a">300 – 500 GB/s</tspan></text>
      <text x="10" y="60" font-size="8" fill="#334155">• State: <tspan font-weight="700" fill="#15803d">Suspended Agent State</tspan> (Awaiting bash tool stdout / API return)</text>
      <text x="10" y="78" font-size="8" font-weight="600" fill="#15803d">✓ Sweet spot for agent pauses: 100 ms – 30 seconds tool latency</text>
    </g>

    <!-- Interconnect 2: NVMe-oF / PCIe Storage -->
    <g transform="translate(15, 264)">
      <line x1="125" y1="2" x2="125" y2="24" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
      <rect x="150" y="3" width="230" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="265" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">PCIe NVMe / NVMe-oF (14–28 GB/s)</text>
    </g>

    <!-- Tier 3: Local NVMe SSD & Cluster Storage -->
    <g transform="translate(15, 294)">
      <rect width="400" height="96" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="10" y="10" width="76" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="48" y="22" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">TIER 3: NVMe</text>
      <text x="96" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Solid-State Flash &amp; Disaggregated KV Store</text>
      <text x="10" y="44" font-size="8" fill="#334155">• Capacity: <tspan font-weight="700" fill="#0f172a">4 – 30 TB</tspan> per node | Mooncake pooled RDMA cluster</text>
      <text x="10" y="60" font-size="8" fill="#334155">• State: <tspan font-weight="700" fill="#0369a1">Hibernated Sessions</tspan> (Human-in-the-loop review, long sleep)</text>
      <text x="10" y="78" font-size="8" font-weight="600" fill="#0369a1">✓ Persists entire trajectory histories without consuming DRAM/HBM</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: AGENT TOOL-WAIT LIFECYCLE & PAGED KV SWAPPING PROTOCOL     -->
  <!-- ================================================================= -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="670" height="440" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="670" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">AGENT TOOL-WAIT LIFECYCLE &amp; PAGED KV SWAPPING</text>
    <text x="658" y="16" text-anchor="end" font-size="8" fill="#64748b">Non-Blocking Asynchronous DMA</text>

    <!-- Workflow Steps Grid -->
    <g transform="translate(15, 34)">
      <!-- Step 1: Active Generation -->
      <g transform="translate(0, 0)">
        <rect width="195" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="10" y="10" width="18" height="18" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="19" y="23" text-anchor="middle" font-size="8" font-weight="700" fill="#6d28d9">1</text>
        <text x="34" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Active Token Generation</text>
        <text x="10" y="44" font-size="8.0" fill="#334155">• Agent executes autoregressive</text>
        <text x="18" y="56" font-size="8.0" fill="#334155">token decoding in GPU HBM.</text>
        <text x="10" y="72" font-size="8.0" fill="#334155">• Issues tool execution call:</text>
        <rect x="10" y="80" width="175" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="18" y="93" font-size="8.0" font-family="monospace" fill="#6d28d9">bash(pytest tests/)</text>
        <text x="10" y="120" font-size="8.0" font-weight="600" fill="#6d28d9">Estimated delay: 15–45 seconds</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="200" y1="75" x2="218" y2="75" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>

      <!-- Step 2: Swap-Out Trigger -->
      <g transform="translate(222, 0)">
        <rect width="195" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="10" y="10" width="18" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="19" y="23" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">2</text>
        <text x="34" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Async Swap-Out (DMA)</text>
        <text x="10" y="44" font-size="8.0" fill="#334155">• VMM detects that active session</text>
        <text x="18" y="56" font-size="8.0" fill="#334155">is entering tool wait state.</text>
        <text x="10" y="72" font-size="8.0" fill="#334155">• Non-blocking PCIe Gen5 stream</text>
        <text x="18" y="84" font-size="8.0" fill="#334155">copies KV blocks: <tspan font-weight="700" fill="#b45309">HBM → DRAM</tspan>.</text>
        <text x="10" y="102" font-size="8.0" fill="#334155">• Frees physical HBM page frames</text>
        <text x="10" y="120" font-size="8.0" font-weight="600" fill="#b45309">Zero stalls on concurrent queries</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="422" y1="75" x2="440" y2="75" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-orange)"/>

      <!-- Step 3: Tool Execution & Prefetch -->
      <g transform="translate(444, 0)">
        <rect width="195" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="10" y="10" width="18" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="19" y="23" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">3</text>
        <text x="34" y="23" font-size="8.5" font-weight="700" fill="#0f172a">Prefetch &amp; Resumption</text>
        <text x="10" y="44" font-size="8.0" fill="#334155">• Tool yields output stdout.</text>
        <text x="10" y="60" font-size="8.0" fill="#334155">• Asynchronous prefetch stream</text>
        <text x="18" y="72" font-size="8.0" fill="#334155">copies KV blocks: <tspan font-weight="700" fill="#15803d">DRAM → HBM</tspan>.</text>
        <text x="10" y="90" font-size="8.0" fill="#334155">• Page table remaps physical</text>
        <text x="18" y="102" font-size="8.0" fill="#334155">blocks; decode resumes.</text>
        <text x="10" y="120" font-size="8.0" font-weight="600" fill="#15803d">Prefetch hides transfer latency</text>
      </g>
    </g>

    <!-- Mathematical Trade-Off Formulation Card -->
    <g transform="translate(15, 196)">
      <rect width="640" height="230" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#0f172a">Bandwidth-Latency Breakeven Formulation: Swap vs. Recompute</text>

      <!-- Left Subcard: Swap Latency -->
      <g transform="translate(12, 28)">
        <rect width="300" height="190" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">KV Transfer Latency Model (PCIe Gen5)</text>
        <text x="10" y="34" font-size="8.0" fill="#334155">KV footprint for L tokens across model layers:</text>
        <text x="10" y="48" font-size="8.0" font-family="monospace" fill="#0f172a">S_kv = 2 · n_layer · d_model · L · b</text>
        <text x="10" y="64" font-size="8.0" fill="#334155">Transfer time over PCIe duplex bandwidth B_pcie:</text>
        <rect x="10" y="72" width="280" height="24" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="150" y="88" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">T_swap = (2 × S_kv) / B_pcie + τ_dma</text>
        <text x="10" y="112" font-size="8.0" fill="#334155">For L = 32,768 tokens on Llama-3-70B (S_kv ≈ 2.1 GB):</text>
        <text x="10" y="128" font-size="8" font-weight="700" fill="#15803d">T_swap ≈ (2 × 2.1 GB) / 54 GB/s ≈ 77.8 ms</text>
        <text x="10" y="146" font-size="8.0" fill="#64748b">Compared to 15,000 ms tool execution, swapping is &lt;0.6% overhead.</text>
      </g>

      <!-- Right Subcard: Recompute Latency -->
      <g transform="translate(328, 28)">
        <rect width="300" height="190" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Prefill Recompute Latency Model</text>
        <text x="10" y="34" font-size="8.0" fill="#334155">Recomputing prompt prefill forward pass requires:</text>
        <rect x="10" y="72" width="280" height="24" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
        <text x="150" y="88" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">T_recompute = (2 × P × L) / FLOPS_effective</text>
        <text x="10" y="112" font-size="8.0" fill="#334155">At 500 TFLOPS effective compute on H100 Tensor Cores:</text>
        <text x="10" y="128" font-size="8" font-weight="700" fill="#dc2626">T_recompute ≈ (2 × 70B × 32,768) / 500T ≈ 9.17 s</text>
        <text x="10" y="146" font-size="8.0" font-weight="700" fill="#b91c1c">Recomputing is ~118× SLOWER than PCIe swapping!</text>
        <text x="10" y="164" font-size="8.0" font-weight="700" fill="#15803d">Breakeven: Swapping wins whenever tool wait &gt; 150 ms.</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM: SYSTEMS PRINCIPLE CALLOUT BANNER                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect x="0" y="0" width="1120" height="90" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <g transform="translate(15, 15)">
      <rect x="0" y="0" width="90" height="60" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="45" y="27" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">SYSTEMS</text>
      <text x="45" y="42" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">PRINCIPLE</text>
    </g>
    <text x="125" y="32" font-size="10.5" font-weight="700" fill="#0f172a">Decouple Agent Context Retention from Scarce Accelerator HBM Allocation</text>
    <text x="125" y="52" font-size="8.5" fill="#334155">Agentic tool execution introduces heavy-tailed idle intervals (seconds to minutes) where zero tokens are generated. Hierarchical</text>
    <text x="125" y="68" font-size="8.5" fill="#334155">paging over PCIe Gen5/CXL offloads inactive KV blocks to host DRAM, reclaiming scarce GPU memory with sub-100ms swap breakeven.</text>
  </g>

</g>
</svg>