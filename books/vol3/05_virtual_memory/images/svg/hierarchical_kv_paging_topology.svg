<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hbmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="dramGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="nvmeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="1184" height="644" rx="2" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <!-- Top Title Header -->
  <rect x="36" y="26" width="1112" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="48" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">HIERARCHICAL KV-CACHE PAGING AND SWAPPING TOPOLOGY</text>

  <!-- Left: Memory Tiers Hierarchy (x: 36, y: 92, w: 430, h: 440) -->
  <rect x="36" y="92" width="430" height="440" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="36" y="92" width="430" height="38" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="116" fill="#1E293B" font-size="12.5" font-weight="700">Multi-Tier Physical Storage</text>
  <text x="450" y="116" text-anchor="end" fill="#64748B" font-size="10.5">Capacity vs. Bandwidth Trade-Off</text>

  <!-- Tier 1: Accelerator HBM -->
  <rect x="52" y="142" width="398" height="102" rx="9" fill="url(#hbmGrad)" stroke="#C084FC" stroke-width="1.2"/>
  <rect x="64" y="154" width="76" height="20" rx="4" fill="#7C3AED"/>
  <text x="102" y="168" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">TIER 1: HBM3</text>
  <text x="148" y="169" fill="#1E293B" font-size="13" font-weight="700">Accelerator Device Memory (SRAM / HBM3e)</text>
  <text x="64" y="193" fill="#4B5563" font-size="11.5">• Capacity: <tspan font-weight="700" fill="#0F172A">80 – 141 GB</tspan> per GPU | Bandwidth: <tspan font-weight="700" fill="#0F172A">3.35 – 4.8 TB/s</tspan></text>
  <text x="64" y="211" fill="#4B5563" font-size="11.5">• State: <tspan font-weight="700" fill="#7C3AED">Active Decoding &amp; Prefill</tspan> (Hot working set blocks)</text>
  <text x="64" y="229" fill="#6B21A8" font-size="11" font-weight="600">⚠ Extreme Contention: Pinned idle context starves concurrent requests</text>

  <!-- Interconnect: PCIe Gen5 / CXL 3.0 -->
  <line x1="251" y1="244" x2="251" y2="272" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>
  <line x1="255" y1="272" x2="255" y2="244" stroke="#059669" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrowEmerald)"/>
  <rect x="270" y="248" width="168" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="354" y="262" text-anchor="middle" fill="#92400E" font-size="9.5" font-weight="700">PCIe Gen5 x16 (64 GB/s) / CXL 3.0</text>

  <!-- Tier 2: Host System DRAM -->
  <rect x="52" y="278" width="398" height="102" rx="9" fill="url(#dramGrad)" stroke="#86EFAC" stroke-width="1.2"/>
  <rect x="64" y="290" width="76" height="20" rx="4" fill="#059669"/>
  <text x="102" y="304" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">TIER 2: DRAM</text>
  <text x="148" y="305" fill="#1E293B" font-size="13" font-weight="700">Host System Memory (DDR5 / CXL Memory)</text>
  <text x="64" y="329" fill="#4B5563" font-size="11.5">• Capacity: <tspan font-weight="700" fill="#0F172A">512 GB – 2.0 TB</tspan> per node | Bandwidth: <tspan font-weight="700" fill="#0F172A">300 – 500 GB/s</tspan></text>
  <text x="64" y="347" fill="#4B5563" font-size="11.5">• State: <tspan font-weight="700" fill="#059669">Suspended Agent State</tspan> (Awaiting bash tool stdout / API return)</text>
  <text x="64" y="365" fill="#065F46" font-size="11" font-weight="600">✓ Sweet spot for agent pauses: 100 ms – 30 seconds tool latency</text>

  <!-- Interconnect: NVMe-oF / PCIe Storage -->
  <line x1="251" y1="380" x2="251" y2="408" stroke="#D97706" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <rect x="270" y="384" width="168" height="20" rx="4" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
  <text x="354" y="398" text-anchor="middle" fill="#581C87" font-size="9.5" font-weight="700">PCIe NVMe / NVMe-oF (14–28 GB/s)</text>

  <!-- Tier 3: Local NVMe SSD & Cluster Storage -->
  <rect x="52" y="414" width="398" height="102" rx="9" fill="url(#nvmeGrad)" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="64" y="426" width="76" height="20" rx="4" fill="#2563EB"/>
  <text x="102" y="440" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">TIER 3: NVMe</text>
  <text x="148" y="441" fill="#1E293B" font-size="13" font-weight="700">Solid-State Flash &amp; Disaggregated KV Store</text>
  <text x="64" y="465" fill="#4B5563" font-size="11.5">• Capacity: <tspan font-weight="700" fill="#0F172A">4 – 30 TB</tspan> per node | Mooncake pooled RDMA cluster</text>
  <text x="64" y="483" fill="#4B5563" font-size="11.5">• State: <tspan font-weight="700" fill="#1E40AF">Hibernated Sessions</tspan> (Human-in-the-loop review, long sleep)</text>
  <text x="64" y="501" fill="#1E40AF" font-size="11" font-weight="600">✓ Persists entire trajectory histories without consuming DRAM/HBM</text>

  <!-- Right: Paged Swapping Workflow & Breakeven Analysis (x: 486, y: 92, w: 678, h: 440) -->
  <rect x="486" y="92" width="678" height="440" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="486" y="92" width="678" height="38" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="502" y="116" fill="#1E293B" font-size="13" font-weight="700">Agent Tool-Wait Lifecycle and Paged KV Swapping Protocol</text>
  <text x="1148" y="116" text-anchor="end" fill="#64748B" font-size="11">Non-Blocking Asynchronous DMA</text>

  <!-- Step 1: Active Generation -->
  <rect x="502" y="142" width="200" height="150" rx="2" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1"/>
  <rect x="512" y="152" width="24" height="20" rx="4" fill="#7C3AED"/>
  <text x="524" y="166" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <text x="544" y="167" fill="#1E293B" font-size="12" font-weight="700">Active Token Generation</text>
  <text x="512" y="190" fill="#475569" font-size="10.8">• Agent executes autoregressive</text>
  <text x="520" y="204" fill="#475569" font-size="10.8">token decoding in GPU HBM.</text>
  <text x="512" y="222" fill="#475569" font-size="10.8">• Issues tool execution call:</text>
  <rect x="512" y="230" width="180" height="22" rx="4" fill="#EDE9FE"/>
  <text x="520" y="245" fill="#581C87" font-size="10" font-family="monospace">bash(pytest tests/)</text>
  <text x="512" y="274" fill="#6B21A8" font-size="10" font-weight="600">Estimated delay: 15–45 seconds</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 702 217 L 726 217" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Step 2: Swap-Out Trigger -->
  <rect x="734" y="142" width="200" height="150" rx="2" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <rect x="744" y="152" width="24" height="20" rx="4" fill="#D97706"/>
  <text x="756" y="166" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
  <text x="776" y="167" fill="#1E293B" font-size="12" font-weight="700">Async Swap-Out (DMA)</text>
  <text x="744" y="190" fill="#475569" font-size="10.8">• Virtual Memory Manager identifies</text>
  <text x="752" y="204" fill="#475569" font-size="10.8">active session is entering tool wait.</text>
  <text x="744" y="222" fill="#475569" font-size="10.8">• Non-blocking PCIe Gen5 stream</text>
  <text x="752" y="236" fill="#475569" font-size="10.8">copies KV blocks: <tspan font-weight="700">HBM → DRAM</tspan>.</text>
  <text x="744" y="258" fill="#475569" font-size="10.8">• Frees physical HBM page frames</text>
  <text x="744" y="274" fill="#B45309" font-size="10" font-weight="600">Zero stalls on concurrent queries</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 934 217 L 958 217" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Step 3: Tool Execution & Prefetch -->
  <rect x="966" y="142" width="186" height="150" rx="2" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="976" y="152" width="24" height="20" rx="4" fill="#059669"/>
  <text x="988" y="166" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
  <text x="1008" y="167" fill="#1E293B" font-size="12" font-weight="700">Prefetch &amp; Resumption</text>
  <text x="976" y="190" fill="#475569" font-size="10.8">• Tool yields output stdout.</text>
  <text x="976" y="208" fill="#475569" font-size="10.8">• Asynchronous prefetch copies</text>
  <text x="984" y="222" fill="#475569" font-size="10.8">KV blocks: <tspan font-weight="700">DRAM → HBM</tspan>.</text>
  <text x="976" y="244" fill="#475569" font-size="10.8">• Page table remaps physical</text>
  <text x="984" y="258" fill="#475569" font-size="10.8">blocks; decode resumes.</text>
  <text x="976" y="276" fill="#065F46" font-size="10" font-weight="600">Prefetch hides transfer latency</text>

  <!-- Swapping vs Recompute Mathematical Trade-Off Box -->
  <rect x="502" y="306" width="650" height="210" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="518" y="328" fill="#0F172A" font-size="12" font-weight="700">Bandwidth-Latency Breakeven Formulation: Swap vs. Recompute</text>

  <rect x="518" y="338" width="306" height="164" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="530" y="357" fill="#581C87" font-size="11" font-weight="700">KV Transfer Latency Model (PCIe Gen5)</text>
  <text x="530" y="377" fill="#334155" font-size="10.2">KV footprint for L tokens: S_kv = 2 · n_layer · d_model · L · b</text>
  <text x="530" y="396" fill="#334155" font-size="10.2">Transfer time over PCIe duplex bandwidth B_pcie:</text>
  <text x="530" y="420" fill="#0F172A" font-size="11.5" font-weight="700" font-family="monospace">T_swap = (2 × S_kv) / B_pcie + τ_dma</text>
  <text x="530" y="445" fill="#475569" font-size="10">For L = 32,768 tokens on Llama-3-70B (S_kv ≈ 2.1 GB):</text>
  <text x="530" y="465" fill="#059669" font-size="11" font-weight="700">T_swap ≈ (2 × 2.1 GB) / 54 GB/s ≈ 77.8 ms</text>
  <text x="530" y="487" fill="#64748B" font-size="9.5">Compared to 15,000 ms tool execution, swapping overhead is &lt; 0.6%.</text>

  <rect x="836" y="338" width="306" height="164" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="848" y="357" fill="#581C87" font-size="11" font-weight="700">Prefill Recompute Latency Model</text>
  <text x="848" y="377" fill="#334155" font-size="10.2">Recomputing prompt prefill from scratch requires:</text>
  <text x="848" y="401" fill="#0F172A" font-size="11.5" font-weight="700" font-family="monospace">T_recompute = (2 × P × L) / FLOPS_effective</text>
  <text x="848" y="426" fill="#475569" font-size="10">At 500 TFLOPS effective compute on H100 Tensor Cores:</text>
  <text x="848" y="446" fill="#DC2626" font-size="11" font-weight="700">T_recompute ≈ (2 × 70B × 32,768) / 500T ≈ 9.17 s</text>
  <text x="848" y="468" fill="#B91C1C" font-size="10" font-weight="600">Recomputing is ~118× SLOWER than PCIe swapping!</text>
  <text x="848" y="487" fill="#64748B" font-size="9.5">Breakeven: Swapping wins whenever tool wait &gt; 150 ms.</text>

  <!-- Systems Principle Callout Banner -->
  <rect x="36" y="548" width="1128" height="86" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="52" y="562" width="102" height="58" rx="2" fill="#581C87"/>
  <text x="103" y="587" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SYSTEMS</text>
  <text x="103" y="603" text-anchor="middle" fill="#E9D5FF" font-size="10" font-weight="700">PRINCIPLE</text>
  <text x="172" y="582" fill="#0F172A" font-size="13.5" font-weight="800">Decouple Agent Context Retention from Scarce Accelerator HBM Allocation</text>
  <text x="172" y="604" fill="#475569" font-size="11.5">Agentic tool execution introduces heavy-tailed idle intervals (seconds to minutes) where zero tokens are generated. Hierarchical</text>
  <text x="172" y="621" fill="#475569" font-size="11.5">paging over PCIe Gen5/CXL offloads inactive KV blocks to host DRAM, reclaiming scarce GPU memory with sub-100ms swap breakeven.</text>
</svg>
