<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- Outer Architecture Boundary -->
  <rect x="20" y="20" width="920" height="460" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="44" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">TRAJECTORY PROMPT ANATOMY &amp; MULTI-TURN PREFIX LOCALITY</text>
  <text x="40" y="58" font-size="8.5" fill="#64748b">Context prompt composition showing high invariant prefix locality (&gt;95%) across turns vs. naive recomputation pathology</text>

  <!-- ================================================================= -->
  <!-- TOP PANEL: PROMPT ANATOMY BAR (TURN t)                             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="880" height="155" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">TURN t CONTEXT PROMPT COMPOSITION: X^(t) [e.g., 32,768 TOKENS]</text>

    <!-- Visual Segmented Bar -->
    <g transform="translate(15, 36)">
      <!-- System Prompt -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="105" height="42" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="52" y="18" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">System Prompt</text>
        <text x="52" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">x_sys (1k–4k)</text>
      </g>

      <!-- Tool Schemas -->
      <g transform="translate(112, 0)">
        <rect x="0" y="0" width="130" height="42" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
        <text x="65" y="18" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Tool Schemas (MCP)</text>
        <text x="65" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">x_tools (2k–8k)</text>
      </g>

      <!-- Workspace Environment -->
      <g transform="translate(249, 0)">
        <rect x="0" y="0" width="150" height="42" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="75" y="18" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">Repo Workspace State</text>
        <text x="75" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">x_env (2k–16k)</text>
      </g>

      <!-- Trajectory History -->
      <g transform="translate(406, 0)">
        <rect x="0" y="0" width="360" height="42" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
        <text x="180" y="18" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">Multi-Turn Interaction History (Thoughts, Actions, Observers)</text>
        <text x="180" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">x_history^(1..t-1) (4k–64k tokens)</text>
      </g>

      <!-- New Observation Delta -->
      <g transform="translate(773, 0)">
        <rect x="0" y="0" width="77" height="42" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
        <text x="38" y="18" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">New Obs Δ</text>
        <text x="38" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">x_obs^(t)</text>
      </g>
    </g>

    <!-- Invariant Prefix Bracket -->
    <path d="M 15 88 L 15 96 L 398 96 L 398 102 L 398 96 L 781 96 L 781 88" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <text x="398" y="117" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Shared Invariant Trajectory Prefix: ρ(t, t+1) = |X^(t)| / |X^(t+1)| &gt; 95% to 98%</text>
    <text x="398" y="131" font-size="8" fill="#64748b" text-anchor="middle">Stored as immutable PagedAttention blocks in accelerator HBM • Zero re-computation needed</text>

    <!-- Delta Bracket -->
    <path d="M 788 88 L 788 96 L 826 96 L 826 102 L 826 96 L 865 96 L 865 88" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <text x="826" y="117" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">Delta Δ</text>
    <text x="826" y="131" font-size="7.5" fill="#64748b" text-anchor="middle">&lt; 500 tok</text>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM LEFT: STATELESS SERVING (NAIVE RECOMPUTE)                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="430" height="220" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">STATELESS SERVING (NAIVE RECOMPUTE PATHOLOGY)</text>

    <!-- Turn t Execution -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="400" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#0f172a">Turn t (32k Tok):</text>
      <rect x="110" y="5" width="280" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="250" y="17" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Full Forward Pass Prefill: 4.59 PFLOPs (~9.18s TTFT)</text>
    </g>

    <!-- Turn t+1 Execution -->
    <g transform="translate(15, 68)">
      <rect x="0" y="0" width="400" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#0f172a">Turn t+1 (32.8k Tok):</text>
      <rect x="110" y="5" width="280" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="250" y="17" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Redundant Prefill: 4.70 PFLOPs (~9.40s TTFT)</text>
    </g>

    <!-- Pathology Callout Card -->
    <g transform="translate(15, 102)">
      <rect x="0" y="0" width="400" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Overhead on 20-Turn Agent Session (Llama-3-70B):</text>
      <text x="12" y="38" font-size="8" fill="#334155">• Redundant prefill time: <tspan font-weight="700" fill="#dc2626">&gt; 180 seconds</tspan> of pure GPU compute stall</text>
      <text x="12" y="56" font-size="8" fill="#334155">• Wasted arithmetic: <tspan font-weight="700" fill="#dc2626">&gt; 90 PFLOPs</tspan> spent re-evaluating static tokens</text>
      <text x="12" y="74" font-size="8" fill="#334155">• Queue collapse: Severe interactive latency and datacenter queue stall</text>
      <text x="12" y="92" font-size="7.5" fill="#64748b">Root cause: Zero caching across stateless HTTP/API inference requests</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM RIGHT: VIRTUAL CONTEXT MEMORY (PREFIX CACHING)              -->
  <!-- ================================================================= -->
  <g transform="translate(490, 245)">
    <rect x="0" y="0" width="430" height="220" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">VIRTUAL CONTEXT MEMORY (PREFIX CACHING)</text>

    <!-- Turn t Cached -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="400" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#0f172a">Turn t (32k Tok):</text>
      <rect x="110" y="5" width="280" height="18" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="250" y="17" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">Initial Ingestion &amp; Paged KV Allocation</text>
    </g>

    <!-- Turn t+1 Cached -->
    <g transform="translate(15, 68)">
      <rect x="0" y="0" width="400" height="28" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#0f172a">Turn t+1 (32.8k Tok):</text>
      <rect x="110" y="5" width="242" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="231" y="17" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">100% CACHE HIT (Zero Prefill Forward Pass)</text>
      <rect x="358" y="5" width="32" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="374" y="17" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">Δ</text>
    </g>

    <!-- Systems Gains Callout Card -->
    <g transform="translate(15, 102)">
      <rect x="0" y="0" width="400" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">Performance Gains via Virtual Memory Caching:</text>
      <text x="12" y="38" font-size="8" fill="#334155">• Prefill latency: Drops from 9.40s to <tspan font-weight="700" fill="#15803d">~140 ms (65× speedup)</tspan></text>
      <text x="12" y="56" font-size="8" fill="#334155">• Compute saved: <tspan font-weight="700" fill="#15803d">&gt; 98.4% FLOPs reduction</tspan> per interactive turn</text>
      <text x="12" y="74" font-size="8" fill="#334155">• Concurrency scaling: Cluster throughput scales linearly with HBM</text>
      <text x="12" y="92" font-size="7.5" fill="#64748b">Mechanism: PagedAttention blocks indexed by radix prefix tree</text>
    </g>
  </g>

</svg>
