<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="hitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="boxShadow" x="-2%" y="-3%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#FFFFFF" rx="2"/>

  <!-- Top Title Banner -->
  <!-- Top Title Header -->
  <rect x="20" y="16" width="920" height="32" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.5">TRAJECTORY PROMPT ANATOMY &amp; MULTI-TURN PREFIX LOCALITY</text>

  <!-- TOP PANEL: Prompt Anatomy Bar (Turn t) -->
  <g transform="translate(20, 90)">
    <rect width="920" height="155" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" filter="url(#boxShadow)"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#0F172A">Turn t Context Prompt Composition: X^(t) [e.g., 32,768 Tokens]</text>

    <!-- Visual Segmented Bar -->
    <g transform="translate(20, 36)">
      <!-- System Prompt -->
      <rect x="0" y="0" width="110" height="42" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="55" y="18" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle">System Prompt</text>
      <text x="55" y="32" font-size="8.5" fill="#2563EB" text-anchor="middle">x_sys (1k–4k)</text>

      <!-- Tool Schemas -->
      <rect x="115" y="0" width="140" height="42" rx="4" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2"/>
      <text x="185" y="18" font-size="10" font-weight="700" fill="#3730A3" text-anchor="middle">Tool Schemas (MCP)</text>
      <text x="185" y="32" font-size="8.5" fill="#4F46E5" text-anchor="middle">x_tools (2k–8k)</text>

      <!-- Workspace Environment -->
      <rect x="260" y="0" width="160" height="42" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="340" y="18" font-size="10" font-weight="700" fill="#5B21B6" text-anchor="middle">Repo Workspace State</text>
      <text x="340" y="32" font-size="8.5" fill="#7C3AED" text-anchor="middle">x_env (2k–16k)</text>

      <!-- Trajectory History -->
      <rect x="425" y="0" width="370" height="42" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="610" y="18" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Multi-Turn Interaction History (Thoughts, Actions, Observers)</text>
      <text x="610" y="32" font-size="8.5" fill="#B45309" text-anchor="middle">x_history^(1..t-1) (4k–64k tokens)</text>

      <!-- New Observation Delta -->
      <rect x="800" y="0" width="80" height="42" rx="4" fill="#DCFCE7" stroke="#10B981" stroke-width="1.5"/>
      <text x="840" y="18" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">New Obs</text>
      <text x="840" y="32" font-size="8" fill="#047857" text-anchor="middle">x_obs^(t)</text>
    </g>

    <!-- Bracket Underneath Shared Prefix -->
    <path d="M 20 85 L 20 95 L 417 95 L 417 103 L 417 95 L 815 95 L 815 85" fill="none" stroke="#059669" stroke-width="1.8"/>
    <text x="417" y="118" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">Shared Invariant Trajectory Prefix: ρ(t, t+1) = |X^(t)| / |X^(t+1)| &gt; 95% to 98%</text>
    <text x="417" y="133" font-size="9.5" fill="#047857" text-anchor="middle">Stored as immutable PagedAttention blocks in accelerator HBM • Zero re-computation needed</text>

    <!-- New Delta Indicator -->
    <path d="M 825 85 L 825 95 L 860 95 L 860 103 L 860 95 L 895 95 L 895 85" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <text x="860" y="118" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle">Delta Δ</text>
    <text x="860" y="133" font-size="8.5" fill="#3B82F6" text-anchor="middle">&lt; 500 tok</text>
  </g>

  <!-- BOTTOM LEFT: Stateless Serving Disaster (Compute Waste) -->
  <g transform="translate(20, 260)">
    <rect width="445" height="205" rx="2" fill="#FFF5F5" stroke="#FEB2B2" stroke-width="1.2" filter="url(#boxShadow)"/>
    <rect x="14" y="12" width="220" height="22" rx="4" fill="#FEE2E2"/>
    <text x="24" y="27" font-size="11" font-weight="700" fill="#991B1B">Stateless Serving (Naive Recompute)</text>

    <!-- Step t -->
    <g transform="translate(14, 46)">
      <text x="0" y="12" font-size="10" font-weight="700" fill="#334155">Turn t (32k Tokens):</text>
      <rect x="130" y="0" width="280" height="18" rx="3" fill="#F87171"/>
      <text x="270" y="13" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Full Prefill Forward Pass: 4.59 PFLOPs (~9.18s TTFT)</text>
    </g>

    <!-- Step t+1 -->
    <g transform="translate(14, 76)">
      <text x="0" y="12" font-size="10" font-weight="700" fill="#334155">Turn t+1 (32.8k Tok):</text>
      <rect x="130" y="0" width="280" height="18" rx="3" fill="#EF4444"/>
      <text x="270" y="13" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Redundant Prefill: 4.70 PFLOPs (~9.40s TTFT)</text>
    </g>

    <!-- Pathology Callout -->
    <rect x="14" y="106" width="417" height="85" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="24" y="124" font-size="10" font-weight="700" fill="#B91C1C">Overhead on 20-Turn Agent Session (Llama-3-70B):</text>
    <text x="24" y="142" font-size="9.5" fill="#475569">• Total redundant prefill time: <tspan font-weight="700" fill="#DC2626">&gt; 180 seconds</tspan> of pure GPU stall</text>
    <text x="24" y="158" font-size="9.5" fill="#475569">• Arithmetic wasted: <tspan font-weight="700" fill="#DC2626">&gt; 90 PFLOPs</tspan> re-evaluating unchanged tokens</text>
    <text x="24" y="174" font-size="9.5" fill="#475569">• Result: Catastrophic interactive latency &amp; datacenter queue collapse</text>
  </g>

  <!-- BOTTOM RIGHT: Virtual Memory Prefix Caching (PagedAttention + Radix) -->
  <g transform="translate(495, 260)">
    <rect width="445" height="205" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" filter="url(#boxShadow)"/>
    <rect x="14" y="12" width="240" height="22" rx="4" fill="#DCFCE7"/>
    <text x="24" y="27" font-size="11" font-weight="700" fill="#166534">Virtual Context Memory (Prefix Caching)</text>

    <!-- Step t -->
    <g transform="translate(14, 46)">
      <text x="0" y="12" font-size="10" font-weight="700" fill="#334155">Turn t (32k Tokens):</text>
      <rect x="130" y="0" width="280" height="18" rx="3" fill="#3B82F6"/>
      <text x="270" y="13" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Initial Ingestion &amp; Paged KV Allocation</text>
    </g>

    <!-- Step t+1 Cached -->
    <g transform="translate(14, 76)">
      <text x="0" y="12" font-size="10" font-weight="700" fill="#334155">Turn t+1 (32.8k Tok):</text>
      <rect x="130" y="0" width="240" height="18" rx="3" fill="url(#hitGrad)"/>
      <text x="250" y="13" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">100% CACHE HIT (Zero Prefill)</text>
      <rect x="375" y="0" width="35" height="18" rx="3" fill="#F59E0B"/>
      <text x="392" y="13" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Δ</text>
    </g>

    <!-- Systems Gain Callout -->
    <rect x="14" y="106" width="417" height="85" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="24" y="124" font-size="10" font-weight="700" fill="#15803D">Performance Gains via Virtual Memory Caching:</text>
    <text x="24" y="142" font-size="9.5" fill="#475569">• Turn t+1 prefill latency: Drops from 9.40s to <tspan font-weight="700" fill="#16A34A">~140 ms (65× speedup)</tspan></text>
    <text x="24" y="158" font-size="9.5" fill="#475569">• Compute saved: <tspan font-weight="700" fill="#16A34A">&gt; 98.4% FLOPs reduction</tspan> per interactive turn</text>
    <text x="24" y="174" font-size="9.5" fill="#475569">• Cluster throughput: Concurrency scales linearly with available HBM</text>
  </g>
</svg>
