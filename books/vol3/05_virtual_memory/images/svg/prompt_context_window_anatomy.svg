<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#d97706"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Region: Logical Context Window Anatomy -->
  <g transform="translate(40, 25)">
    <!-- Container Card -->
    <rect x="0" y="0" width="1120" height="235" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Section Label -->
    <rect x="16" y="14" width="220" height="22" rx="3" fill="#e2e8f0"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.5">CONTEXT PROMPT ANATOMY</text>
    <text x="248" y="29" font-family="monospace" font-size="11" fill="#64748b">Sequence Length S = 32,768 Tokens (Turn t)</text>

    <!-- Context Window Bar Segments -->
    <g transform="translate(16, 52)">
      <!-- S_sys -->
      <rect x="0" y="0" width="140" height="72" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="70" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">System Prompt</text>
      <text x="70" y="42" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">S_sys = 2,048 tok</text>
      <text x="70" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Role, instructions, protocol</text>

      <!-- S_tools -->
      <rect x="148" y="0" width="170" height="72" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="233" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Tool Schemas (MCP)</text>
      <text x="233" y="42" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">S_tools = 4,096 tok</text>
      <text x="233" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">JSON function signatures</text>

      <!-- S_env -->
      <rect x="326" y="0" width="210" height="72" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
      <text x="431" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Workspace Environment</text>
      <text x="431" y="42" font-family="monospace" font-size="10" fill="#16a34a" text-anchor="middle">S_env = 8,192 tok</text>
      <text x="431" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Repo file tree, source context</text>

      <!-- S_hist -->
      <rect x="544" y="0" width="370" height="72" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="729" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Multi-Turn History (Turns 1 .. t-1)</text>
      <text x="729" y="42" font-family="monospace" font-size="10" fill="#d97706" text-anchor="middle">S_hist = 16,384 tok</text>
      <text x="729" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">User queries, agent reasoning, tool call invocations, past stdout</text>

      <!-- Delta_obs -->
      <rect x="922" y="0" width="116" height="72" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
      <text x="980" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Turn t Obs</text>
      <text x="980" y="42" font-family="monospace" font-size="10" fill="#dc2626" text-anchor="middle">Δ = 2,048 tok</text>
      <text x="980" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Latest tool stdout</text>

      <!-- x_t in flight -->
      <rect x="1046" y="0" width="42" height="72" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="1067" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">x_t</text>
      <text x="1067" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Gen</text>
    </g>

    <!-- Structural Brackets and Annotations -->
    <!-- Invariant Prefix Bracket -->
    <path d="M 16 134 L 16 142 L 274 142 L 274 150 L 274 142 L 536 142 L 536 134" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <text x="274" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Shared Invariant Trajectory Prefix (14,336 Tokens · 43.8% of Total Context)</text>
    <text x="274" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Identical across workers · radix reuse</text>

    <!-- History Bracket -->
    <path d="M 544 134 L 544 142 L 729 142 L 729 150 L 729 142 L 914 142 L 914 134" fill="none" stroke="#d97706" stroke-width="1.2"/>
    <text x="729" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Growing Trajectory State (16,384 Tokens)</text>
    <text x="729" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Retained across tool-wait pauses</text>

    <!-- Active Turn Bracket -->
    <path d="M 922 134 L 922 142 L 1005 142 L 1005 150 L 1005 142 L 1088 142 L 1088 134" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <text x="1005" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Active Turn (2,048 Tokens)</text>
    <text x="1005" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Evaluated via prefill &amp; decode</text>
  </g>

  <!-- Downward Flow Arrows -->
  <g transform="translate(600, 265)">
    <line x1="-320" y1="0" x2="-320" y2="35" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="-310" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Forward Pass</text>

    <line x1="0" y1="0" x2="0" y2="35" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="10" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Linear Projections W_K, W_V</text>

    <line x1="320" y1="0" x2="320" y2="35" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="330" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">HBM Allocation</text>
  </g>

  <!-- Bottom Region: Physical KV Cache Memory Layout in HBM -->
  <g transform="translate(40, 305)">
    <!-- Container Card -->
    <rect x="0" y="0" width="1120" height="285" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

    <!-- Section Label -->
    <rect x="16" y="14" width="250" height="22" rx="3" fill="#e2e8f0"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.5">PHYSICAL ACCELERATOR KV STATE</text>
    <text x="278" y="29" font-family="monospace" font-size="11" fill="#64748b">4D Tensors: K, V in ℝ^[L × H_kv × S × d_head]</text>

    <!-- Left Block: Tensor Geometry Schema -->
    <g transform="translate(24, 50)">
      <rect x="0" y="0" width="460" height="215" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Structural Dimension Breakdown (Llama-3-70B)</text>
      
      <!-- Coordinate breakdown -->
      <g transform="translate(16, 40)" font-family="monospace" font-size="10.5" fill="#334155">
        <!-- L -->
        <rect x="0" y="0" width="428" height="26" rx="2" fill="#f1f5f9"/>
        <text x="10" y="17" font-weight="700" fill="#0f172a">Layers (L):</text>
        <text x="140" y="17">80 transformer layers</text>
        <text x="365" y="17" fill="#64748b">depth</text>

        <!-- H_kv -->
        <rect x="0" y="32" width="428" height="26" rx="2" fill="#f1f5f9"/>
        <text x="10" y="49" font-weight="700" fill="#0f172a">KV Heads (H_kv):</text>
        <text x="140" y="49">8 heads (GQA with G = 8)</text>
        <text x="365" y="49" fill="#64748b">heads/layer</text>

        <!-- d_head -->
        <rect x="0" y="64" width="428" height="26" rx="2" fill="#f1f5f9"/>
        <text x="10" y="81" font-weight="700" fill="#0f172a">Head Dim (d_head):</text>
        <text x="140" y="81">128 elements per head</text>
        <text x="365" y="81" fill="#64748b">channel dim</text>

        <!-- Precision P -->
        <rect x="0" y="96" width="428" height="26" rx="2" fill="#f1f5f9"/>
        <text x="10" y="113" font-weight="700" fill="#0f172a">Precision (P):</text>
        <text x="140" y="113">2 bytes (bfloat16 format)</text>
        <text x="365" y="113" fill="#64748b">storage size</text>

        <!-- Factor 2 -->
        <rect x="0" y="128" width="428" height="26" rx="2" fill="#f1f5f9"/>
        <text x="10" y="145" font-weight="700" fill="#0f172a">Tensors (K + V):</text>
        <text x="140" y="145">Key &amp; Value (2 matrices)</text>
        <text x="365" y="145" fill="#64748b">factor = 2</text>
      </g>
    </g>

    <!-- Right Block: Concrete Memory Quantities & Concurrency Boundary -->
    <g transform="translate(508, 50)">
      <rect x="0" y="0" width="588" height="215" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Footprint Derivation &amp; Physical Concurrency Ceiling</text>

      <!-- Derivation Boxes -->
      <g transform="translate(16, 40)">
        <!-- Mem_token -->
        <rect x="0" y="0" width="556" height="42" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="12" y="18" font-family="monospace" font-size="10.5" font-weight="700" fill="#1e40af">Mem_token = 2 · L · H_kv · d_head · P</text>
        <text x="12" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#1e3a8a">= 2 · 80 · 8 · 128 · 2 bytes = 327,680 bytes/token = <tspan font-weight="700">320 KiB / token</tspan></text>

        <!-- Mem_seq at 32k -->
        <rect x="0" y="50" width="556" height="42" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="12" y="68" font-family="monospace" font-size="10.5" font-weight="700" fill="#92400e">Mem_seq = S · Mem_token (at S = 32,768 tokens)</text>
        <text x="12" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#78350f">= 32,768 · 320 KiB = 10,737,418,240 bytes = <tspan font-weight="700">10.00 GiB / active trajectory</tspan></text>

        <!-- Concurrency Bound -->
        <rect x="0" y="100" width="556" height="58" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Capacity Ceiling on 8× 80 GiB H100 Node (480 GiB KV Cache Pool Available):</text>
        <text x="12" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Concurrency at S = 8,192 (Standard Turn): B_max = ⌊480 GiB / 2.5 GiB⌋ = <tspan font-weight="700" fill="#15803d">192 streams</tspan></text>
        <text x="12" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Concurrency at S = 32,768 (Agent Trajectory): B_max = ⌊480 GiB / 10.0 GiB⌋ = <tspan font-weight="700" fill="#b45309">48 streams</tspan> (75% drop)</text>
      </g>
    </g>
  </g>
</svg>
