<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .step-lbl { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .box-hdr { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .box-sub { font-size: 9.5px; text-anchor: middle; fill: #475569; }
      .mono-math { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .mono-sub { font-family: ui-monospace, monospace; font-size: 9px; fill: #64748b; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Container Card -->
  <rect x="20" y="15" width="1040" height="310" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Row 1: Logical Sequence Partitioning into Chunks -->
  <g transform="translate(45, 30)">
    <!-- Chunk 1 -->
    <rect x="0" y="0" width="310" height="52" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="155" y="22" class="box-hdr" fill="#1e40af">Chunk 1: Historical (Cached)</text>
    <text x="155" y="38" class="box-sub">Tokens [0, C-1] · Resident in Physical Blocks</text>

    <!-- Chunk 2 -->
    <rect x="340" y="0" width="310" height="52" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="495" y="22" class="box-hdr" fill="#1e40af">Chunk 2: Historical (Cached)</text>
    <text x="495" y="38" class="box-sub">Tokens [C, 2C-1] · Resident in Physical Blocks</text>

    <!-- Chunk 3 (Active) -->
    <rect x="680" y="0" width="310" height="52" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="835" y="22" class="box-hdr" fill="#b45309">Chunk 3: Active Slice I_k (In-Flight)</text>
    <text x="835" y="38" class="box-sub">Tokens [2C, 3C-1] · Active GEMM Projection</text>
  </g>

  <!-- Vertical Connecting Arrows -->
  <path d="M 200 82 V 104" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 540 82 V 104" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 880 82 V 104" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Row 2: Physical Memory Retrieval & Projection -->
  <g transform="translate(45, 106)">
    <!-- Cache Read 1 -->
    <rect x="0" y="0" width="310" height="48" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="155" y="20" class="mono-math" fill="#1e40af">K_1, V_1 in Physical HBM Blocks</text>
    <text x="155" y="35" class="box-sub">Read via Block Table (Zero Recompute FLOPs)</text>

    <!-- Cache Read 2 -->
    <rect x="340" y="0" width="310" height="48" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="495" y="20" class="mono-math" fill="#1e40af">K_2, V_2 in Physical HBM Blocks</text>
    <text x="495" y="35" class="box-sub">Read via Block Table (Zero Recompute FLOPs)</text>

    <!-- GEMM Computation -->
    <rect x="680" y="0" width="310" height="48" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="835" y="20" class="mono-math" fill="#b45309">Compute Q_3, K_3, V_3 via GEMM</text>
    <text x="835" y="35" class="box-sub">Active Tensor Core Forward Evaluation</text>
  </g>

  <!-- Convergence Paths to Causal Cross-Attention -->
  <path d="M 200 154 C 200 178, 480 178, 535 186" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 540 154 V 186" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 880 154 C 880 178, 600 178, 545 186" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Row 3: Causal Cross-Attention Kernel -->
  <g transform="translate(140, 190)">
    <rect width="800" height="52" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
    <text x="400" y="22" class="box-hdr" fill="#15803d">Causal Cross-Attention &amp; Masking Kernel:</text>
    <text x="400" y="40" class="mono-math" fill="#166534">A_3 = softmax( ( Q_3 · [K_1, K_2, K_3]^T ) / √d_head + M_causal ) · [V_1, V_2, V_3]</text>
  </g>

  <!-- Arrow to Cache Append -->
  <path d="M 540 242 V 266" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Row 4: Memory Commit -->
  <g transform="translate(210, 270)">
    <rect width="660" height="36" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="330" y="22" class="mono-math" fill="#15803d">Append Newly Projected K_3, V_3 into Physical Paged Cache Blocks (Intermediate Activations Freed)</text>
  </g>
</svg>