<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
      .math-lbl { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1080" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- Level 1: Logical Sequence Partitioning -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="310" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="155" y="22" class="box-lbl" fill="#1e40af">Chunk 1: Historical (Cached)</text>
    <text x="155" y="38" class="box-sub">Tokens [0, C-1] · Staged in Physical Pages</text>

    <rect x="340" y="0" width="310" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="495" y="22" class="box-lbl" fill="#1e40af">Chunk 2: Historical (Cached)</text>
    <text x="495" y="38" class="box-sub">Tokens [C, 2C-1] · Staged in Physical Pages</text>

    <rect x="680" y="0" width="310" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="835" y="22" class="box-lbl" fill="#b45309">Chunk 3: Active Slice (In-Flight)</text>
    <text x="835" y="38" class="box-sub">Tokens [2C, 3C-1] · Active GEMM Projection</text>
  </g>

  <!-- Vertical Arrows to Projections -->
  <path d="M 200 125 L 200 153" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 540 125 L 540 153" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 880 125 L 880 153" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Level 2: Tensor State Allocation -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="310" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="155" y="22" class="math-lbl">K₁, V₁ in Accelerator HBM Pages</text>
    <text x="155" y="38" class="box-sub">Retrieved via Page Table (0 FLOP recompute)</text>

    <rect x="340" y="0" width="310" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="495" y="22" class="math-lbl">K₂, V₂ in Accelerator HBM Pages</text>
    <text x="495" y="38" class="box-sub">Retrieved via Page Table (0 FLOP recompute)</text>

    <rect x="680" y="0" width="310" height="50" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="835" y="22" class="math-lbl">Compute Q₃, K₃, V₃ via GEMM</text>
    <text x="835" y="38" class="box-sub">Active Tensor Core Projection</text>
  </g>

  <!-- Convergence to Multi-Head Attention (clean fill="none") -->
  <path d="M 200 205 C 200 230, 480 230, 540 243" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 540 205 L 540 243" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 880 205 C 880 230, 600 230, 540 243" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Level 3: Cross-Chunk Attention Matrix -->
  <g transform="translate(180, 195)">
    <rect width="720" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="360" y="23" class="box-lbl" fill="#047857">Causal Cross-Attention &amp; Masking:</text>
    <text x="360" y="40" class="math-lbl" fill="#065f46">A₃ = Softmax( Q₃ · [K₁, K₂, K₃]ᵀ / √d + M_causal ) · [V₁, V₂, V₃]</text>
  </g>

  <!-- Append into Physical Pages -->
  <path d="M 540 295 L 540 323" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Level 4: Commit to Global Cache -->
  <g transform="translate(240, 275)">
    <rect width="600" height="35" rx="6" fill="#ffffff" stroke="#10b981" stroke-dasharray="3,3"/>
    <text x="300" y="22" class="box-lbl" fill="#065f46">Append Newly Projected K₃, V₃ into Physical Paged Cache Blocks</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="325" width="1040" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="348" class="card-text" font-weight="700" fill="#0f172a">Prefill Invariant:</text>
  <text x="145" y="348" class="card-text">Intermediate activations for Chunk k are discarded immediately after forward pass. Historical K, V projections are retrieved</text>
  <text x="145" y="364" class="card-text">directly from paged memory without weight re-evaluation, guaranteeing exact mathematical equivalence to monolithic execution.</text>
</svg>