<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- LEFT: PREFILL ENGINE POOL (COMPUTE-BOUND)                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="345" height="440" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#0369a1">PREFILL ENGINE POOL (COMPUTE-BOUND)</text>

    <!-- Operational Profile Card -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="315" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Operational Profile</text>
      <text x="10" y="32" font-size="8" fill="#334155">• Workload: Full-prompt context ingestion &amp; activation</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Arithmetic Intensity: <tspan font-weight="700" fill="#0369a1">AI &gt;&gt; 100 FLOPs/byte</tspan></text>
      <text x="10" y="64" font-size="8" fill="#334155">• Primary Metric: <tspan font-weight="700" fill="#0f172a">Time to First Token (TTFT)</tspan></text>
    </g>

    <!-- Hardware & Execution Card -->
    <g transform="translate(15, 116)">
      <rect x="0" y="0" width="315" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0369a1">Hardware &amp; Execution Characteristics</text>
      <text x="10" y="32" font-size="8" fill="#334155">• High-TFLOPS Tensor Cores (H100 SXM5 / B200)</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Large matrix-matrix multiplications (GEMM)</text>
      <text x="10" y="64" font-size="8" fill="#334155">• FlashAttention-2 / Chunked prefill tiling</text>
      <text x="10" y="80" font-size="8" fill="#334155">• Temporary KV cache generation:</text>
      <rect x="10" y="90" width="295" height="48" rx="1" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="20" y="108" font-size="8" font-weight="700" fill="#0369a1">Generates K, V tensor blocks across all layers</text>
      <text x="20" y="124" font-size="7.5" fill="#64748b">Ready for immediate handoff; no local decoding loop</text>
    </g>

    <!-- Failure Mode Card -->
    <g transform="translate(15, 274)">
      <rect x="0" y="0" width="315" height="152" rx="1" fill="#f8fafc" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Traditional Co-located Failure Mode</text>
      <text x="10" y="32" font-size="8" font-weight="700" fill="#dc2626">⚠ Head-of-Line (HoL) Blocking:</text>
      <text x="10" y="48" font-size="8" fill="#334155">• A 64k agent prefill monopolizes Tensor Cores for seconds</text>
      <text x="10" y="64" font-size="8" fill="#334155">• Freezes all concurrent decode tokens across instances</text>
      <text x="10" y="80" font-size="8" fill="#334155">• Spikes Inter-Token Latency (ITL) by 20×–50×</text>
      <text x="10" y="96" font-size="8" fill="#334155">• Destroys interactive human &amp; tool latency SLOs</text>
      <text x="10" y="116" font-size="7.5" fill="#64748b">Root cause: Phase interference between compute and bandwidth</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER: DISAGGREGATED RDMA KV TRANSFER FABRIC (NETWORK)           -->
  <!-- ================================================================= -->
  <g transform="translate(405, 75)">
    <rect x="0" y="0" width="390" height="440" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#b45309">DISAGGREGATED RDMA KV TRANSFER FABRIC</text>

    <!-- Visual Transport Stream Graphic -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="360" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">RoCEv2 / InfiniBand Transport (400 – 800 Gbps)</text>
      <rect x="10" y="26" width="340" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <line x1="15" y1="35" x2="335" y2="35" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
      <polygon points="340,35 332,31 332,39" fill="#d97706"/>
      <text x="180" y="60" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Zero-Copy Kernel-Bypass RDMA Write (GPU HBM → GPU HBM)</text>
    </g>

    <!-- Disaggregated Mechanisms Card -->
    <g transform="translate(15, 116)">
      <rect x="0" y="0" width="360" height="190" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Disaggregated Systems Mechanisms</text>

      <!-- Splitwise Subcard -->
      <g transform="translate(10, 24)">
        <rect x="0" y="0" width="340" height="72" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8" font-weight="700" fill="#b45309">Phase Splitting (Splitwise &amp; DistServe)</text>
        <text x="10" y="31" font-size="7.5" fill="#334155">• Prefill nodes execute layer forward passes sequentially.</text>
        <text x="10" y="47" font-size="7.5" fill="#334155">• As each layer completes, KV tensors stream over RDMA.</text>
        <text x="10" y="63" font-size="7.5" font-weight="700" fill="#15803d">Pipelined transfer overlaps network delay with compute.</text>
      </g>

      <!-- Mooncake Subcard -->
      <g transform="translate(10, 104)">
        <rect x="0" y="0" width="340" height="76" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="15" font-size="8" font-weight="700" fill="#0369a1">KVCache-Centric Datacenter (Mooncake)</text>
        <text x="10" y="31" font-size="7.5" fill="#334155">• Disaggregated cluster-wide memory pool for KV caches.</text>
        <text x="10" y="47" font-size="7.5" fill="#334155">• Radix tree lookup matches prefix across entire datacenter.</text>
        <text x="10" y="63" font-size="7.5" font-weight="700" fill="#0369a1">Reuses cached agent prefixes across different physical nodes.</text>
      </g>
    </g>

    <!-- Network Bandwidth Invariant Card -->
    <g transform="translate(15, 314)">
      <rect x="0" y="0" width="360" height="112" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">Network Bandwidth Invariant</text>
      <text x="10" y="32" font-size="8" fill="#334155">RDMA transfer time must remain strictly lower than prefill:</text>
      <rect x="10" y="40" width="340" height="26" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <text x="180" y="57" font-family="monospace" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">T_transfer = S_kv / B_net  &lt;  T_prefill</text>
      <text x="10" y="80" font-size="8" fill="#334155">400 Gbps (50 GB/s) streams 2.1 GB in ~42 ms (vs. ~9s prefill)</text>
      <text x="10" y="96" font-size="7.5" fill="#64748b">Transfer overhead is negligible (&lt;0.5%) relative to prefill savings</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: DECODE ENGINE POOL (BANDWIDTH-BOUND)                        -->
  <!-- ================================================================= -->
  <g transform="translate(815, 75)">
    <rect x="0" y="0" width="345" height="440" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">DECODE NODE POOL (BANDWIDTH-BOUND)</text>

    <!-- Operational Profile Card -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="315" height="74" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Operational Profile</text>
      <text x="10" y="32" font-size="8" fill="#334155">• Workload: Autoregressive single-token decoding</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Arithmetic Intensity: <tspan font-weight="700" fill="#15803d">AI ≈ 1 – 2 FLOPs/byte</tspan></text>
      <text x="10" y="64" font-size="8" fill="#334155">• Primary Metric: <tspan font-weight="700" fill="#0f172a">Inter-Token Latency (ITL &lt; 25 ms)</tspan></text>
    </g>

    <!-- Hardware & Execution Card -->
    <g transform="translate(15, 116)">
      <rect x="0" y="0" width="315" height="150" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Hardware &amp; Execution Characteristics</text>
      <text x="10" y="32" font-size="8" fill="#334155">• High-Memory Bandwidth (HBM3e @ 4.8 TB/s)</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Matrix-vector multiplications (GEMV)</text>
      <text x="10" y="64" font-size="8" fill="#334155">• PagedAttention block manager allocates pages</text>
      <text x="10" y="80" font-size="8" fill="#334155">• Streams generated tokens directly to agent:</text>
      <rect x="10" y="90" width="295" height="48" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="20" y="108" font-size="8" font-weight="700" fill="#15803d">Stable, jitter-free autoregressive stream</text>
      <text x="20" y="124" font-size="7.5" fill="#64748b">Guarantees interactive human &amp; tool latency SLOs</text>
    </g>

    <!-- Systems Benefits Card -->
    <g transform="translate(15, 274)">
      <rect x="0" y="0" width="315" height="152" rx="1" fill="#f8fafc" stroke="#16a34a" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Systems &amp; Goodput Benefits</text>
      <text x="10" y="32" font-size="8" font-weight="700" fill="#15803d">✓ Strict SLO Isolation:</text>
      <text x="10" y="48" font-size="8" fill="#334155">• Decode iterations never interrupted by large prefills</text>
      <text x="10" y="64" font-size="8" font-weight="700" fill="#15803d">✓ 2.5× to 4.2× higher cluster goodput</text>
      <text x="10" y="80" font-size="8" fill="#334155">• Under tight TTFT and ITL service level objectives</text>
      <text x="10" y="96" font-size="8" fill="#334155">• Heterogeneous node provisioning lowers total TCO</text>
      <text x="10" y="116" font-size="7.5" fill="#64748b">Eliminates resource stranding and dynamic batch interference</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM: SYSTEMS PRINCIPLE CALLOUT BANNER                          -->
  <!-- ================================================================= -->
  <g transform="translate(40, 530)">
    <rect x="0" y="0" width="1120" height="90" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <g transform="translate(15, 15)">
      <rect x="0" y="0" width="90" height="60" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
      <text x="45" y="27" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">SYSTEMS</text>
      <text x="45" y="42" font-size="8" font-weight="700" fill="#6d28d9" text-anchor="middle">PRINCIPLE</text>
    </g>
    <text x="125" y="32" font-size="10.5" font-weight="700" fill="#0f172a">Decouple Compute-Bound Prefill from Bandwidth-Bound Decode via RDMA</text>
    <text x="125" y="52" font-size="8.5" fill="#334155">Co-locating prompt prefill and token decoding causes catastrophic head-of-line blocking for multi-turn agent workloads.</text>
    <text x="125" y="68" font-size="8.5" fill="#334155">Physical disaggregation over RoCEv2/InfiniBand isolates latency SLOs, yielding up to 4.2× higher serving goodput.</text>
  </g>

</g>
</svg>