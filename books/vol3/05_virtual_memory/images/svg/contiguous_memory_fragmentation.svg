<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .panel-label { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .sub-label { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .item-hdr { font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .box-txt { font-size: 10px; font-weight: 700; text-anchor: middle; }
      .box-desc { font-size: 9px; text-anchor: middle; }
      .note-txt { font-size: 9.5px; fill: #475569; }
      .mono-code { font-family: ui-monospace, monospace; font-size: 9.5px; }
    </style>
    <pattern id="waste-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fca5a5" stroke-width="1.5"/>
    </pattern>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Container Card: Internal Fragmentation -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="1050" height="215" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="220" height="22" rx="3" fill="#fee2e2"/>
    <text x="24" y="29" class="panel-label" fill="#991b1b">INTERNAL FRAGMENTATION</text>
    <text x="248" y="29" class="sub-label">Reservation waste and geometric slack</text>

    <!-- Sequence A: Reservation Waste against S_max -->
    <g transform="translate(20, 52)">
      <text x="0" y="16" class="item-hdr">Request 1: Worst-Case Reservation (S_alloc = S_max = 4,096 tokens):</text>
      <g transform="translate(0, 24)">
        <!-- Active tokens -->
        <rect x="0" y="0" width="280" height="42" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="140" y="20" class="box-txt" fill="#1d4ed8">Live Tokens: t = 1,200 (29.3%)</text>
        <text x="140" y="34" class="box-desc" fill="#2563eb">Active attended KV projections</text>

        <!-- Wasted reservation -->
        <rect x="286" y="0" width="724" height="42" rx="3" fill="url(#waste-hatch)" stroke="#f87171" stroke-width="1.2"/>
        <text x="648" y="21" class="box-txt" fill="#b91c1c">Unused Reservation Waste: 2,896 Tokens Stranded (70.7% Unused Capacity)</text>
        <text x="648" y="35" class="box-desc" fill="#991b1b">Reserved for worst-case S_max; completely inaccessible to concurrent requests</text>
      </g>
    </g>

    <!-- Sequence B: Geometric Slack -->
    <g transform="translate(20, 132)">
      <text x="0" y="16" class="item-hdr">Request 2: Dynamic Doubling Slack (S_alloc = 2,048 tokens, Finished at t = 1,025 tokens):</text>
      <g transform="translate(0, 24)">
        <!-- Active tokens -->
        <rect x="0" y="0" width="500" height="40" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
        <text x="250" y="19" class="box-txt" fill="#15803d">Finished Output: t = 1,025 Tokens (50.1%)</text>
        <text x="250" y="32" class="box-desc" fill="#16a34a">End-of-sequence emitted; buffer retained during tool pause</text>

        <!-- Wasted slack -->
        <rect x="506" y="0" width="504" height="40" rx="3" fill="url(#waste-hatch)" stroke="#f87171" stroke-width="1.2"/>
        <text x="758" y="19" class="box-txt" fill="#b91c1c">Geometric Slack: 1,023 Tokens Stranded (49.9% Waste)</text>
        <text x="758" y="32" class="box-desc" fill="#991b1b">Array doubling penalty; stranded trailing capacity</text>
      </g>
    </g>
  </g>

  <!-- Bottom Container Card: External Fragmentation -->
  <g transform="translate(25, 255)">
    <rect x="0" y="0" width="1050" height="245" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="220" height="22" rx="3" fill="#fee2e2"/>
    <text x="24" y="29" class="panel-label" fill="#991b1b">EXTERNAL FRAGMENTATION</text>
    <text x="248" y="29" class="sub-label">Checkerboard Memory Holes in Linear Accelerator HBM (16 GiB Pool)</text>

    <!-- State 1: Active Requests Allocated -->
    <g transform="translate(20, 48)">
      <text x="0" y="14" class="item-hdr">Initial State: Unified contiguous allocations across variable trajectory lifetimes:</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="310" height="36" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="155" y="18" class="box-txt" fill="#1d4ed8">Request A: 4 GiB (0..4 GiB)</text>
        <text x="155" y="30" class="box-desc" fill="#2563eb">Active trajectory</text>

        <rect x="316" y="0" width="100" height="36" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="366" y="18" class="box-txt" fill="#b45309">Req B: 1 GiB</text>
        <text x="366" y="30" class="box-desc" fill="#d97706">Short query</text>

        <rect x="422" y="0" width="460" height="36" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="652" y="18" class="box-txt" fill="#6d28d9">Request C: 6 GiB (5..11 GiB)</text>
        <text x="652" y="30" class="box-desc" fill="#7c3aed">Long-horizon agent trajectory</text>

        <rect x="888" y="0" width="122" height="36" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="949" y="18" class="box-txt" fill="#475569">Free: 5 GiB</text>
        <text x="949" y="30" class="box-desc" fill="#64748b">11..16 GiB</text>
      </g>
    </g>

    <!-- State 2: Request B Departed & Stranded Hole -->
    <g transform="translate(20, 126)">
      <text x="0" y="14" class="item-hdr">After B departs: 1 GiB hole between A and C</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="310" height="36" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="155" y="22" class="box-txt" fill="#1d4ed8">Request A (4 GiB retained)</text>

        <!-- Stranded hole -->
        <rect x="316" y="0" width="100" height="36" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 2"/>
        <text x="366" y="16" class="box-txt" fill="#b91c1c">Hole: 1 GiB</text>
        <text x="366" y="29" font-size="8.5" fill="#dc2626" text-anchor="middle">Free interval</text>

        <rect x="422" y="0" width="460" height="36" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="652" y="22" class="box-txt" fill="#6d28d9">Request C (6 GiB retained)</text>

        <!-- High tail fragmented pool -->
        <rect x="888" y="0" width="122" height="36" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="949" y="16" class="box-txt" fill="#475569">Tail: 5 GiB</text>
        <text x="949" y="29" font-size="8.5" fill="#64748b" text-anchor="middle">Free interval</text>
      </g>
    </g>

    <!-- Incident Callout: Incoming Request D rejected -->
    <g transform="translate(20, 198)">
      <rect x="0" y="0" width="1010" height="32" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1"/>
      <text x="14" y="20" font-size="10" font-weight="700" fill="#991b1b">Admission Incident:</text>
      <text x="140" y="20" class="note-txt" fill="#881337">D needs 2 GiB contiguous; 6 GiB free but fragmented</text>
    </g>
  </g>
</svg>
