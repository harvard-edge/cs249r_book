<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .card-hdr { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .card-sub { font-family: ui-monospace, monospace; font-size: 9.5px; fill: #64748b; }
      .lbl-bold { font-size: 10px; font-weight: 700; fill: #0f172a; }
      .lbl-muted { font-size: 8.5px; fill: #64748b; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 9px; }
      .mono-bold { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Panel 1: Ingress Fingerprinting (Left) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="320" height="500" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <rect x="14" y="14" width="190" height="22" rx="3" fill="#ede9fe"/>
    <text x="22" y="29" class="card-hdr" fill="#6d28d9">INGRESS FINGERPRINTING</text>
    <text x="306" y="29" class="card-sub" text-anchor="end">Router Ingress</text>

    <!-- Request Prompt Structure -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="292" height="155" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" class="lbl-bold">Incoming Prompt (S = 40,000 Tokens)</text>

      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="100" height="26" rx="2" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
        <text x="50" y="17" font-size="8.5" font-weight="700" fill="#6d28d9" text-anchor="middle">System (16k)</text>

        <rect x="104" y="0" width="55" height="26" rx="2" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
        <text x="131" y="17" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Tools (8k)</text>

        <rect x="163" y="0" width="65" height="26" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
        <text x="195" y="17" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Repo (12k)</text>

        <rect x="232" y="0" width="40" height="26" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
        <text x="252" y="17" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Turn</text>
      </g>

      <!-- Details -->
      <g transform="translate(12, 68)" font-size="8.5" fill="#334155">
        <text x="0" y="12">• <tspan font-weight="700">Prefix Length:</tspan> 36,000 tokens (90% shared)</text>
        <text x="0" y="28">• <tspan font-weight="700">Turn Delta:</tspan> 4,000 tokens (uncached suffix)</text>
        <text x="0" y="44">• <tspan font-weight="700">Block Quantum:</tspan> B_chunk = 16 tokens</text>
        <text x="0" y="60">Total Chunks: m = 40,000 / 16 = 2,500 chunks</text>
      </g>
    </g>

    <!-- Rolling Merkle Hashing -->
    <g transform="translate(14, 218)">
      <rect x="0" y="0" width="292" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" class="lbl-bold">Rolling Merkle Chunk Hashing</text>
      <text x="12" y="32" class="lbl-muted">Sequential recursive token block hashing</text>

      <rect x="12" y="42" width="268" height="28" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="146" y="60" class="mono-bold" fill="#6d28d9" text-anchor="middle">h_k = Hash( h_{k-1} || c_k )</text>

      <g transform="translate(12, 82)" font-size="8.5" fill="#334155">
        <text x="0" y="12">Base vector: h_0 = IV (Initial Salt)</text>
        <text x="0" y="28">Produces 64-bit integer stream: [h_1, ..., h_m]</text>
        <text x="0" y="44">• Transmits compact hash keys to global directory</text>
        <text x="0" y="60">O(1) incremental calculation per 16-token chunk</text>
      </g>
    </g>

    <!-- Dispatch Invariant Box -->
    <g transform="translate(14, 382)">
      <rect x="0" y="0" width="292" height="104" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#1e40af">Ingress Forwarding Invariant:</text>
      <text x="10" y="34" font-size="8.5" fill="#1e3a8a">The ingress router forwards 64-bit chunk</text>
      <text x="10" y="48" font-size="8.5" fill="#1e3a8a">hashes rather than raw prompt strings,</text>
      <text x="10" y="62" font-size="8.5" fill="#1e3a8a">eliminating string comparison overhead</text>
      <text x="10" y="76" font-size="8.5" fill="#1e3a8a">and preserving router memory bandwidth.</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <path d="M 345 270 L 370 270" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="357" y="260" class="mono-txt" fill="#7c3aed" text-anchor="middle">h_k</text>

  <!-- Panel 2: Global Prefix Directory (Center) -->
  <g transform="translate(376, 20)">
    <rect x="0" y="0" width="374" height="500" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <rect x="14" y="14" width="210" height="22" rx="3" fill="#e0f2fe"/>
    <text x="22" y="29" class="card-hdr" fill="#0369a1">GLOBAL PREFIX DIRECTORY</text>
    <text x="360" y="29" class="card-sub" text-anchor="end">Cluster Trie Index</text>

    <!-- Cluster Radix Trie -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="346" height="240" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" class="lbl-bold">Cluster-Wide Radix Prefix Trie</text>

      <!-- Trie Nodes -->
      <g transform="translate(56, 30)">
        <!-- Root -->
        <rect x="40" y="0" width="150" height="34" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="115" y="14" class="mono-bold" fill="#1d4ed8" text-anchor="middle">Root [h_0: Empty]</text>
        <text x="115" y="26" font-size="7.5" fill="#64748b" text-anchor="middle">Active: {W1, W2, W3, W4}</text>

        <!-- Down arrow -->
        <path d="M 115 34 V 46" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-blue)"/>

        <!-- System Prompt -->
        <rect x="25" y="48" width="180" height="34" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="115" y="62" class="mono-bold" fill="#1d4ed8" text-anchor="middle">System [h_1..h_1000]</text>
        <text x="115" y="74" font-size="7.5" fill="#64748b" text-anchor="middle">Cached: {W1, W2, W3}</text>

        <!-- Down arrow -->
        <path d="M 115 82 V 94" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-blue)"/>

        <!-- Tools -->
        <rect x="25" y="96" width="180" height="34" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="115" y="110" class="mono-bold" fill="#1d4ed8" text-anchor="middle">Tools [h_1001..h_1500]</text>
        <text x="115" y="122" font-size="7.5" fill="#64748b" text-anchor="middle">Cached: {W1, W2}</text>

        <!-- Fork arrows -->
        <path d="M 80 130 L 40 148" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
        <path d="M 150 130 L 190 148" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-blue)"/>

        <!-- Leaf Repo A -->
        <rect x="-15" y="150" width="125" height="38" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <text x="47" y="164" class="mono-bold" fill="#15803d" text-anchor="middle">Repo [h_1501..2250]</text>
        <text x="47" y="176" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle">Worker W1 (Warm Hit)</text>

        <!-- Leaf Repo B -->
        <rect x="130" y="150" width="125" height="38" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="192" y="164" class="mono-txt" fill="#475569" text-anchor="middle">Other [h_1501..2000]</text>
        <text x="192" y="176" font-size="7.5" fill="#64748b" text-anchor="middle">Worker W2</text>
      </g>
    </g>

    <!-- Affinity-Load Objective Formulation -->
    <g transform="translate(14, 302)">
      <rect x="0" y="0" width="346" height="184" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" class="lbl-bold">Joint Affinity-Load Objective Formulation</text>

      <rect x="12" y="28" width="322" height="32" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="173" y="48" class="mono-bold" fill="#0f172a" text-anchor="middle">w* = argmax [ mu·(Match/S) - (1-mu)·(L_j/L_max)^gamma ]</text>

      <g transform="translate(12, 70)" font-size="8.5" fill="#334155">
        <text x="0" y="12">• <tspan font-weight="700">mu in [0, 1]:</tspan> Cache affinity trade-off weight (default 0.7)</text>
        <text x="0" y="28">• <tspan font-weight="700">Match / S:</tspan> Fraction of tokens cached in node HBM</text>
        <text x="0" y="44">• <tspan font-weight="700">L_j / L_max:</tspan> Queue load ratio of candidate worker node</text>
        <text x="0" y="60">• <tspan font-weight="700">gamma &gt;= 1:</tspan> Non-linear load penalty preventing queue hotspotting</text>
        <text x="0" y="78" fill="#15803d" font-weight="700">Guarantees high cache hit rates without overloading popular nodes.</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <path d="M 755 270 L 782 270" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="768" y="260" class="mono-txt" fill="#0284c7" text-anchor="middle">dispatch</text>

  <!-- Panel 3: Worker Node Dispatch (Right) -->
  <g transform="translate(790, 20)">
    <rect x="0" y="0" width="310" height="500" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <rect x="14" y="14" width="200" height="22" rx="3" fill="#dcfce7"/>
    <text x="22" y="29" class="card-hdr" fill="#15803d">WORKER NODE DISPATCH</text>
    <text x="296" y="29" class="card-sub" text-anchor="end">Cluster Execution</text>

    <!-- Selected Worker Node W1 -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="282" height="152" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="12" y="10" width="75" height="18" rx="2" fill="#dcfce7"/>
      <text x="49" y="23" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">SELECTED</text>
      <text x="96" y="23" class="lbl-bold">Worker Node 1 (w*)</text>

      <g transform="translate(12, 38)" font-size="8.5" fill="#334155">
        <text x="0" y="12">• Cache Match: <tspan font-weight="700" fill="#15803d">36,000 tokens (90%)</tspan></text>
        <text x="0" y="26">Queue Load: L_1 = 42% (Healthy)</text>
        <text x="0" y="40">• Score: 0.7·(0.90) - 0.3·(0.42)^2 = <tspan font-weight="700" fill="#15803d">+0.577</tspan></text>
      </g>

      <rect x="12" y="86" width="258" height="54" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="141" y="104" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Prefill Skipped for 36k Tokens</text>
      <text x="141" y="120" font-size="8" fill="#166534" text-anchor="middle">Executes prefill only for 4k tail tokens</text>
      <text x="141" y="132" font-size="7.5" fill="#64748b" text-anchor="middle">Reclaims ~90% forward pass arithmetic</text>
    </g>

    <!-- Penalized Worker Node W2 -->
    <g transform="translate(14, 214)">
      <rect x="0" y="0" width="282" height="120" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="75" height="18" rx="2" fill="#fee2e2"/>
      <text x="49" y="23" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">PENALIZED</text>
      <text x="96" y="23" class="lbl-bold">Worker Node 2</text>

      <g transform="translate(12, 38)" font-size="8.5" fill="#334155">
        <text x="0" y="12">Cache Match: 24,000 tokens (60%)</text>
        <text x="0" y="26">Queue Load: L_2 = 91% (Near saturation)</text>
        <text x="0" y="40">• Score: 0.7·(0.60) - 0.3·(0.91)^2 = <tspan font-weight="700" fill="#dc2626">+0.171</tspan></text>
      </g>

      <text x="12" y="98" font-size="8" fill="#991b1b">Shed by load penalty to avoid head-of-line delay</text>
    </g>

    <!-- Cold Pool Workers W3 & W4 -->
    <g transform="translate(14, 348)">
      <rect x="0" y="0" width="282" height="138" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="75" height="18" rx="2" fill="#f1f5f9"/>
      <text x="49" y="23" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">COLD POOL</text>
      <text x="96" y="23" class="lbl-bold">Worker Nodes 3 &amp; 4</text>

      <g transform="translate(12, 38)" font-size="8.5" fill="#334155">
        <text x="0" y="12">Cache Match: 0 tokens (Cold Miss)</text>
        <text x="0" y="26">Queue Load: L_3 = 12% (Idle capacity)</text>
        <text x="0" y="40">• Score: 0.7·(0.0) - 0.3·(0.12)^2 = <tspan font-weight="700" fill="#64748b">-0.004</tspan></text>
      </g>

      <text x="12" y="98" font-size="8" fill="#475569">Reserved for uncached requests, isolating</text>
      <text x="12" y="112" font-size="8" fill="#475569">swarm cache footprints from standard traffic.</text>
    </g>
  </g>
</svg>