<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .panel-hdr { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .panel-sub { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; }
      .lbl-bold { font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .lbl-muted { font-size: 9px; fill: #64748b; }
      .mono-txt { font-family: ui-monospace, monospace; font-size: 9.5px; }
      .mono-bold { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left Container Card: Logical-to-Physical Address Translation -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="680" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="310" height="22" rx="3" fill="#e0f2fe"/>
    <text x="24" y="29" class="panel-hdr" fill="#0369a1">LOGICAL TO PHYSICAL TRANSLATION</text>
    <text x="338" y="29" class="panel-sub">Block Size B = 16 Tokens</text>

    <!-- 1. Logical Sequence Blocks -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" class="lbl-bold">Virtual Logical Sequence (Contiguous Token Coordinates 0 .. 51):</text>
      
      <g transform="translate(0, 24)">
        <!-- LBN 0 -->
        <rect x="0" y="0" width="150" height="48" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="75" y="20" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Logical Block 0 (LBN 0)</text>
        <text x="75" y="36" class="mono-txt" fill="#2563eb" text-anchor="middle">Tokens 0 .. 15 (Full)</text>

        <!-- LBN 1 -->
        <rect x="160" y="0" width="150" height="48" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="235" y="20" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Logical Block 1 (LBN 1)</text>
        <text x="235" y="36" class="mono-txt" fill="#2563eb" text-anchor="middle">Tokens 16 .. 31 (Full)</text>

        <!-- LBN 2 -->
        <rect x="320" y="0" width="150" height="48" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="395" y="20" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Logical Block 2 (LBN 2)</text>
        <text x="395" y="36" class="mono-txt" fill="#2563eb" text-anchor="middle">Tokens 32 .. 47 (Full)</text>

        <!-- LBN 3 -->
        <rect x="480" y="0" width="150" height="48" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="555" y="20" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">Logical Block 3 (LBN 3)</text>
        <text x="555" y="36" class="mono-txt" fill="#d97706" text-anchor="middle">Tokens 48 .. 51 (Tail)</text>
      </g>
    </g>

    <!-- Mapping Arrows -->
    <path d="M 95 128 V 162" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 255 128 V 162" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 415 128 V 162" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 575 128 V 162" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- 2. Per-Sequence Block Table -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="630" height="92" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="18" class="lbl-bold">Per-Sequence Block Table T: l ↦ p</text>
      <text x="270" y="18" class="lbl-muted">Decouples contiguous logical view from physical memory locations</text>

      <g transform="translate(14, 28)">
        <!-- Entry 0 -->
        <rect x="0" y="0" width="144" height="48" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="72" y="18" class="mono-txt" fill="#334155" text-anchor="middle">LBN 0 ➔ <tspan font-weight="700" fill="#15803d">PBN #7</tspan></text>
        <text x="72" y="36" font-size="8.5" fill="#64748b" text-anchor="middle">Offsets 0..15 valid</text>

        <!-- Entry 1 -->
        <rect x="156" y="0" width="144" height="48" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="228" y="18" class="mono-txt" fill="#334155" text-anchor="middle">LBN 1 ➔ <tspan font-weight="700" fill="#15803d">PBN #2</tspan></text>
        <text x="228" y="36" font-size="8.5" fill="#64748b" text-anchor="middle">Offsets 0..15 valid</text>

        <!-- Entry 2 -->
        <rect x="312" y="0" width="144" height="48" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <text x="384" y="18" class="mono-txt" fill="#334155" text-anchor="middle">LBN 2 ➔ <tspan font-weight="700" fill="#15803d">PBN #13</tspan></text>
        <text x="384" y="36" font-size="8.5" fill="#64748b" text-anchor="middle">Offsets 0..15 valid</text>

        <!-- Entry 3 -->
        <rect x="468" y="0" width="144" height="48" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
        <text x="540" y="18" class="mono-txt" fill="#92400e" text-anchor="middle">LBN 3 ➔ <tspan font-weight="700" fill="#b45309">PBN #5</tspan></text>
        <text x="540" y="36" font-size="8.5" fill="#d97706" text-anchor="middle">Offsets 0..3 valid (12 free)</text>
      </g>
    </g>

    <!-- 3. Physical HBM Allocation Pool -->
    <g transform="translate(20, 276)">
      <rect x="0" y="0" width="630" height="106" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="18" class="lbl-bold">Physical Accelerator Memory (Scattered HBM Page Frames):</text>
      <text x="440" y="18" class="lbl-muted">Zero External Fragmentation</text>

      <!-- Frame Grid -->
      <g transform="translate(14, 28)">
        <!-- PBN 0 Free -->
        <rect x="0" y="0" width="68" height="32" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="34" y="16" class="mono-txt" fill="#64748b" text-anchor="middle">PBN #0</text>
        <text x="34" y="27" font-size="7.5" fill="#94a3b8" text-anchor="middle">Free Pool</text>

        <!-- PBN 2 Allocated (LBN 1) -->
        <rect x="76" y="0" width="68" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="110" y="16" class="mono-bold" fill="#15803d" text-anchor="middle">PBN #2</text>
        <text x="110" y="27" font-size="7.5" fill="#16a34a" text-anchor="middle">(Seq 1, LBN 1)</text>

        <!-- PBN 5 Allocated (LBN 3) -->
        <rect x="152" y="0" width="68" height="32" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="186" y="16" class="mono-bold" fill="#b45309" text-anchor="middle">PBN #5</text>
        <text x="186" y="27" font-size="7.5" fill="#d97706" text-anchor="middle">(Seq 1, LBN 3)</text>

        <!-- PBN 7 Allocated (LBN 0) -->
        <rect x="228" y="0" width="68" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="262" y="16" class="mono-bold" fill="#15803d" text-anchor="middle">PBN #7</text>
        <text x="262" y="27" font-size="7.5" fill="#16a34a" text-anchor="middle">(Seq 1, LBN 0)</text>

        <!-- PBN 9 Other Seq -->
        <rect x="304" y="0" width="68" height="32" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="338" y="16" class="mono-txt" fill="#475569" text-anchor="middle">PBN #9</text>
        <text x="338" y="27" font-size="7.5" fill="#64748b" text-anchor="middle">(Seq 2)</text>

        <!-- PBN 11 Free -->
        <rect x="380" y="0" width="68" height="32" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="414" y="16" class="mono-txt" fill="#64748b" text-anchor="middle">PBN #11</text>
        <text x="414" y="27" font-size="7.5" fill="#94a3b8" text-anchor="middle">Free Pool</text>

        <!-- PBN 13 Allocated (LBN 2) -->
        <rect x="456" y="0" width="68" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="490" y="16" class="mono-bold" fill="#15803d" text-anchor="middle">PBN #13</text>
        <text x="490" y="27" font-size="7.5" fill="#16a34a" text-anchor="middle">(Seq 1, LBN 2)</text>

        <!-- PBN 18 Other Seq -->
        <rect x="532" y="0" width="68" height="32" rx="2" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="566" y="16" class="mono-txt" fill="#475569" text-anchor="middle">PBN #18</text>
        <text x="566" y="27" font-size="7.5" fill="#64748b" text-anchor="middle">(Seq 3)</text>
      </g>
      <text x="14" y="88" font-size="9" fill="#475569">Physical memory is populated on demand: only 12 unwritten slots in PBN #5 suffer internal fragmentation.</text>
    </g>

    <!-- Translation Formula Box -->
    <g transform="translate(20, 396)">
      <rect x="0" y="0" width="630" height="68" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="14" y="18" font-size="10" font-weight="700" fill="#1e40af">Kernel Dynamic Address Translation Invariant:</text>
      <text x="14" y="36" class="mono-bold" fill="#1d4ed8">PhysAddr(i) = BaseAddr( T[ ⌊i / B⌋ ] ) + (i mod B) · Mem_token</text>
      <text x="14" y="54" font-size="9" fill="#334155">Example: Token i = 35 ➔ Block Index l = ⌊35/16⌋ = 2 ➔ Frame PBN #13, Block Offset = 35 mod 16 = 3.</text>
    </g>
  </g>

  <!-- Right Container Card: Copy-on-Write (CoW) Branching -->
  <g transform="translate(720, 20)">
    <rect x="0" y="0" width="360" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="190" height="22" rx="3" fill="#ede9fe"/>
    <text x="24" y="29" class="panel-hdr" fill="#6d28d9">COPY-ON-WRITE BRANCHING</text>
    <text x="344" y="29" class="panel-sub" text-anchor="end">Reference Counting</text>

    <!-- Parent Shared Prefix -->
    <g transform="translate(16, 52)">
      <text x="0" y="14" class="lbl-bold">Parent Sequence (Shared History):</text>
      
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="328" height="54" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="16" y="20" class="lbl-bold" fill="#6d28d9">Shared Immutable Prefix Blocks:</text>
        <g transform="translate(16, 26)">
          <rect x="0" y="0" width="90" height="20" rx="2" fill="#ede9fe"/>
          <text x="45" y="14" class="mono-txt" fill="#5b21b6" text-anchor="middle">PBN #7 [rc=2]</text>

          <rect x="100" y="0" width="90" height="20" rx="2" fill="#ede9fe"/>
          <text x="145" y="14" class="mono-txt" fill="#5b21b6" text-anchor="middle">PBN #2 [rc=2]</text>

          <rect x="200" y="0" width="90" height="20" rx="2" fill="#ede9fe"/>
          <text x="245" y="14" class="mono-txt" fill="#5b21b6" text-anchor="middle">PBN #13 [rc=2]</text>
        </g>
      </g>
    </g>

    <!-- Forking Arrows -->
    <path d="M 100 138 L 80 172" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
    <path d="M 260 138 L 280 172" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Speculative Child Branch 1 -->
    <g transform="translate(16, 180)">
      <rect x="0" y="0" width="156" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#0f172a">Branch 1 (Tool Call A)</text>
      
      <text x="10" y="38" font-size="8.5" fill="#475569">Aliased Prefix Frames:</text>
      <rect x="10" y="44" width="136" height="22" rx="2" fill="#f1f5f9"/>
      <text x="78" y="58" class="mono-txt" fill="#334155" text-anchor="middle">PBN #7, #2, #13</text>

      <text x="10" y="84" font-size="8.5" font-weight="700" fill="#15803d">Private Delta Allocation:</text>
      <rect x="10" y="90" width="136" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="78" y="108" class="mono-bold" fill="#15803d" text-anchor="middle">PBN #18 [rc=1]</text>

      <text x="10" y="136" font-size="8" fill="#64748b">Zero prompt copy tax</text>
    </g>

    <!-- Speculative Child Branch 2 -->
    <g transform="translate(188, 180)">
      <rect x="0" y="0" width="156" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#0f172a">Branch 2 (Tool Call B)</text>
      
      <text x="10" y="38" font-size="8.5" fill="#475569">Aliased Prefix Frames:</text>
      <rect x="10" y="44" width="136" height="22" rx="2" fill="#f1f5f9"/>
      <text x="78" y="58" class="mono-txt" fill="#334155" text-anchor="middle">PBN #7, #2, #13</text>

      <text x="10" y="84" font-size="8.5" font-weight="700" fill="#15803d">Private Delta Allocation:</text>
      <rect x="10" y="90" width="136" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="78" y="108" class="mono-bold" fill="#15803d" text-anchor="middle">PBN #24 [rc=1]</text>

      <text x="10" y="136" font-size="8" fill="#64748b">Zero prompt copy tax</text>
    </g>

    <!-- Memory Scaling Formula -->
    <g transform="translate(16, 346)">
      <rect x="0" y="0" width="328" height="118" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#5b21b6">CoW Scaling Invariants:</text>
      <text x="12" y="36" class="mono-bold" fill="#6d28d9">Mem_fork = M_prefix + ∑ M_delta(i)</text>
      <text x="12" y="54" font-size="8.5" fill="#334155">Aliased prefix frames increment reference count (rc).</text>
      <text x="12" y="70" font-size="8.5" fill="#334155">Frame freed to ring buffer only when rc == 0.</text>
      <text x="12" y="86" font-size="8.5" fill="#334155">Pruning rejected speculative branch never corrupts</text>
      <text x="12" y="102" font-size="8.5" fill="#334155">   active peer or parent trajectory state.</text>
    </g>
  </g>
</svg>