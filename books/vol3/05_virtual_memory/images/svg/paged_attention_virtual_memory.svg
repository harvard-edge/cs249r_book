<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="500" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL A: CONTIGUOUS ALLOCATION PATHOLOGY (LEFT)                   -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="280" height="425" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">A. CONTIGUOUS ALLOCATION (PATHOLOGY)</text>

    <!-- GPU Memory Chamber -->
    <g transform="translate(12, 34)">
      <rect width="256" height="262" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#334155">Physical HBM (Static Contiguous Buffers)</text>

      <!-- Request 1 -->
      <g transform="translate(10, 28)">
        <rect width="236" height="40" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect width="40" height="40" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="20" y="24" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Used</text>
        <text x="138" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Trajectory 1 (Reserved 32k)</text>
        <text x="138" y="31" font-size="7.5" fill="#b91c1c">Used 2k tokens • 93.7% Wasted</text>
      </g>

      <!-- Request 2 -->
      <g transform="translate(10, 76)">
        <rect width="236" height="40" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect width="80" height="40" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="40" y="24" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Used 8k</text>
        <text x="158" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Trajectory 2 (Reserved 32k)</text>
        <text x="158" y="31" font-size="7.5" fill="#b91c1c">75% Internal Fragmentation</text>
      </g>

      <!-- External Hole -->
      <g transform="translate(10, 124)">
        <rect width="236" height="32" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="118" y="20" font-size="8" fill="#64748b" text-anchor="middle">Released Slot (External Frag Hole: 8k)</text>
      </g>

      <!-- Blocked Request 3 -->
      <g transform="translate(10, 164)">
        <rect width="236" height="50" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
        <text x="118" y="22" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">Incoming Request 3 (Needs 12k)</text>
        <text x="118" y="38" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">BLOCKED: OUT OF MEMORY (OOM)</text>
      </g>

      <text x="128" y="248" font-size="7.5" fill="#64748b" text-anchor="middle">Total free = 18k, but no 12k contiguous segment</text>
    </g>

    <!-- Bottom Diagnosis Card -->
    <g transform="translate(12, 306)">
      <rect width="256" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#991b1b">Pathology Diagnosis:</text>
      <text x="12" y="36" font-size="8" fill="#334155">• Internal Waste: 60%–80% HBM stranded</text>
      <text x="12" y="52" font-size="8" fill="#334155">• External Frag: Scattered holes block requests</text>
      <text x="12" y="68" font-size="8" fill="#334155">• Speculative Branching: Forces full copy</text>
      <text x="12" y="86" font-size="8" font-weight="700" fill="#dc2626">• Max concurrency severely degraded</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: PAGEDATTENTION VIRTUAL PAGE TABLE (MIDDLE)                -->
  <!-- ================================================================= -->
  <g transform="translate(335, 75)">
    <rect x="0" y="0" width="310" height="425" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">B. PAGEDATTENTION VIRTUAL PAGE TABLE</text>

    <!-- Logical Sequence Representation -->
    <g transform="translate(12, 34)">
      <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0f172a">Logical Sequence (Tokens 0..L-1):</text>
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="66" height="24" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="33" y="15" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">LBN 0 (0..15)</text>

        <rect x="72" y="0" width="66" height="24" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="105" y="15" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">LBN 1 (16..31)</text>

        <rect x="144" y="0" width="66" height="24" rx="1" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
        <text x="177" y="15" font-size="7.5" font-weight="700" fill="#0369a1" text-anchor="middle">LBN 2 (32..47)</text>

        <rect x="216" y="0" width="70" height="24" rx="1" fill="#f8fafc" stroke="#d97706" stroke-width="1"/>
        <text x="251" y="15" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">LBN 3 (Tail)</text>
      </g>
    </g>

    <!-- Virtual-to-Physical Mapping Engine -->
    <g transform="translate(12, 88)">
      <!-- Page Table Container -->
      <rect width="130" height="130" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="130" height="22" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="15" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Trajectory Page Table</text>

      <g transform="translate(8, 28)">
        <text x="0" y="14" font-family="monospace" font-size="7.5" font-weight="700" fill="#0f172a">LBN 0 ──► PBN #7</text>
        <text x="0" y="30" font-family="monospace" font-size="7.5" font-weight="700" fill="#0f172a">LBN 1 ──► PBN #2</text>
        <text x="0" y="46" font-family="monospace" font-size="7.5" font-weight="700" fill="#0f172a">LBN 2 ──► PBN #13</text>
        <text x="0" y="62" font-family="monospace" font-size="7.5" font-weight="700" fill="#b45309">LBN 3 ──► PBN #5</text>
        <line x1="0" y1="72" x2="114" y2="72" stroke="#cbd5e1" stroke-width="1"/>
        <text x="0" y="86" font-size="7" fill="#64748b">Block size B = 16 tok</text>
      </g>

      <!-- Connecting Arrow -->
      <line x1="134" y1="65" x2="148" y2="65" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

      <!-- Physical HBM Page Frames Grid -->
      <g transform="translate(156, 0)">
        <rect width="130" height="130" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="130" height="22" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <text x="65" y="15" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Scattered HBM Blocks</text>

        <!-- Block Grid -->
        <g transform="translate(8, 28)">
          <rect x="0" y="0" width="34" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="17" y="13" font-size="7" fill="#64748b" text-anchor="middle">#0</text>
          <rect x="40" y="0" width="34" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="57" y="13" font-size="7" fill="#64748b" text-anchor="middle">#1</text>
          <rect x="80" y="0" width="34" height="20" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
          <text x="97" y="13" font-size="7" font-weight="700" fill="#0369a1" text-anchor="middle">#2</text>

          <rect x="0" y="24" width="34" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="17" y="37" font-size="7" fill="#64748b" text-anchor="middle">#3</text>
          <rect x="40" y="24" width="34" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="57" y="37" font-size="7" fill="#64748b" text-anchor="middle">#4</text>
          <rect x="80" y="24" width="34" height="20" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
          <text x="97" y="37" font-size="7" font-weight="700" fill="#b45309" text-anchor="middle">#5</text>

          <rect x="0" y="48" width="34" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="17" y="61" font-size="7" fill="#64748b" text-anchor="middle">#6</text>
          <rect x="40" y="48" width="34" height="20" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
          <text x="57" y="61" font-size="7" font-weight="700" fill="#0369a1" text-anchor="middle">#7</text>
          <rect x="80" y="48" width="34" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="97" y="61" font-size="7" fill="#64748b" text-anchor="middle">#8</text>

          <rect x="0" y="72" width="34" height="20" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
          <text x="17" y="85" font-size="7" font-weight="700" fill="#0369a1" text-anchor="middle">#13</text>
          <rect x="40" y="72" width="74" height="20" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
          <text x="77" y="85" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">Free Pool</text>
        </g>
      </g>
    </g>

    <!-- Formula Equation Card -->
    <g transform="translate(12, 230)">
      <rect width="286" height="48" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="143" y="18" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">PhysAddr(i) = Base(PageTable[⌊i/B⌋]) + (i mod B) · S_token</text>
      <text x="143" y="34" font-size="7" fill="#64748b" text-anchor="middle">Dynamic pointer translation inside custom PagedAttention CUDA kernel</text>
    </g>

    <!-- Systems Benefit Card -->
    <g transform="translate(12, 288)">
      <rect width="286" height="124" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#15803d">Virtual Paging Guarantees:</text>
      <text x="12" y="38" font-size="8" fill="#334155">• External Fragmentation: <tspan font-weight="700" fill="#15803d">Strictly 0%</tspan> (uniform page size B)</text>
      <text x="12" y="56" font-size="8" fill="#334155">• Internal Waste: Bounded to &lt; B · S_token (&lt;0.05% at 32k)</text>
      <text x="12" y="74" font-size="8" fill="#334155">• On-Demand Allocation: Pulled dynamically from free list</text>
      <text x="12" y="92" font-size="8" fill="#334155">• Hardware Utilization: Increases from 20% to over 95%</text>
      <text x="12" y="110" font-size="7.5" fill="#64748b">Decouples logical sequence length from physical memory placement</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL C: COPY-ON-WRITE (CoW) BRANCHING (RIGHT)                    -->
  <!-- ================================================================= -->
  <g transform="translate(660, 75)">
    <rect x="0" y="0" width="260" height="425" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">C. COPY-ON-WRITE (CoW) BRANCHING</text>

    <!-- CoW Mechanics Visual -->
    <g transform="translate(12, 34)">
      <!-- Parent Shared Blocks -->
      <rect width="236" height="54" rx="1" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/>
      <text x="10" y="16" font-size="8" font-weight="700" fill="#6d28d9">Parent Prefix State (Prompt + Trajectory)</text>
      <g transform="translate(8, 24)">
        <rect x="0" y="0" width="68" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="34" y="13" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">PBN #7 [rc=2]</text>
        <rect x="74" y="0" width="68" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="108" y="13" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">PBN #2 [rc=2]</text>
        <rect x="148" y="0" width="72" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="184" y="13" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">PBN #13 [rc=2]</text>
      </g>

      <!-- Forking Arrows -->
      <line x1="65" y1="84" x2="45" y2="106" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
      <line x1="170" y1="84" x2="190" y2="106" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

      <!-- Branch 1 Box -->
      <g transform="translate(0, 110)">
        <rect width="112" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="112" height="18" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <text x="56" y="13" font-size="7.5" font-weight="700" fill="#0f172a" text-anchor="middle">Speculative Branch 1</text>
        <text x="8" y="32" font-size="7" fill="#64748b">Shared (Aliased):</text>
        <text x="8" y="45" font-family="monospace" font-size="7" font-weight="700" fill="#6d28d9">[#7, #2, #13]</text>
        <text x="8" y="62" font-size="7" fill="#64748b">Private Delta Block:</text>
        <rect x="8" y="68" width="96" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="56" y="81" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">PBN #18 [rc=1]</text>
        <text x="8" y="98" font-size="6.5" fill="#16a34a">Zero prompt copy!</text>
      </g>

      <!-- Branch 2 Box -->
      <g transform="translate(124, 110)">
        <rect width="112" height="106" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="112" height="18" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <text x="56" y="13" font-size="7.5" font-weight="700" fill="#0f172a" text-anchor="middle">Speculative Branch 2</text>
        <text x="8" y="32" font-size="7" fill="#64748b">Shared (Aliased):</text>
        <text x="8" y="45" font-family="monospace" font-size="7" font-weight="700" fill="#6d28d9">[#7, #2, #13]</text>
        <text x="8" y="62" font-size="7" fill="#64748b">Private Delta Block:</text>
        <rect x="8" y="68" width="96" height="18" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="56" y="81" font-size="7" font-weight="700" fill="#15803d" text-anchor="middle">PBN #24 [rc=1]</text>
        <text x="8" y="98" font-size="6.5" fill="#16a34a">Zero prompt copy!</text>
      </g>

      <!-- Formula Bar -->
      <g transform="translate(0, 226)">
        <rect width="236" height="36" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="118" y="15" font-size="7.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Memory: O(L_prefix + K · L_branch)</text>
        <text x="118" y="27" font-size="6.5" fill="#7c3aed" text-anchor="middle">Collapses K-way duplication down to delta writes</text>
      </g>
    </g>

    <!-- Bottom Diagnosis Card -->
    <g transform="translate(12, 314)">
      <rect width="236" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="8" font-weight="700" fill="#6d28d9">CoW Reference Counting Invariant:</text>
      <text x="10" y="36" font-size="7.5" fill="#334155">• Blocks freed only when ref_count == 0</text>
      <text x="10" y="52" font-size="7.5" fill="#334155">• Enables high-width tree search / MCTS</text>
      <text x="10" y="68" font-size="7.5" fill="#334155">• Branch eviction never corrupts parent</text>
      <text x="10" y="84" font-size="7" fill="#64748b">Reference counting maintained by block allocator</text>
    </g>
  </g>

</g>
</svg>