<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="panelShadow" x="-2%" y="-3%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="530" fill="#FFFFFF" rx="2"/>

  <!-- Top Title Banner -->
  <!-- Top Title Header -->
  <rect x="20" y="16" width="920" height="32" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b" letter-spacing="0.5">PAGEDATTENTION: BLOCK-LEVEL VIRTUAL MEMORY &amp; COPY-ON-WRITE</text>

  <!-- PANEL A: Contiguous Pre-allocation Crisis (Left, w=280) -->
  <g transform="translate(20, 90)">
    <rect width="280" height="420" rx="2" fill="#FFF5F5" stroke="#FEB2B2" stroke-width="1.2" filter="url(#panelShadow)"/>
    <rect x="14" y="12" width="252" height="24" rx="4" fill="#FEE2E2"/>
    <text x="140" y="28" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">A. Contiguous Allocation (Pathology)</text>

    <!-- GPU Memory Chamber -->
    <g transform="translate(14, 46)">
      <rect width="252" height="255" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#475569">Physical HBM (Static Contiguous Buffers)</text>

      <!-- Request 1 -->
      <g transform="translate(10, 32)">
        <rect width="232" height="42" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
        <rect width="36" height="42" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="18" y="25" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Used</text>
        <text x="134" y="20" font-size="9" font-weight="700" fill="#991B1B">Trajectory 1 (Reserved 32k)</text>
        <text x="134" y="34" font-size="8" fill="#B91C1C">Used 2k tokens • 93.7% Wasted</text>
      </g>

      <!-- Request 2 -->
      <g transform="translate(10, 84)">
        <rect width="232" height="42" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
        <rect width="85" height="42" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="42" y="25" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">Used 8k</text>
        <text x="158" y="20" font-size="9" font-weight="700" fill="#991B1B">Trajectory 2 (Reserved 32k)</text>
        <text x="158" y="34" font-size="8" fill="#B91C1C">75% Internal Waste</text>
      </g>

      <!-- External Hole -->
      <g transform="translate(10, 136)">
        <rect width="232" height="32" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="116" y="20" font-size="8.5" fill="#64748B" text-anchor="middle">Released Slot (External Frag Hole: 8k)</text>
      </g>

      <!-- Blocked Request 3 -->
      <g transform="translate(10, 178)">
        <rect width="232" height="48" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,2"/>
        <text x="116" y="22" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Incoming Request 3 (Needs 12k)</text>
        <text x="116" y="38" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">BLOCKED: OUT OF MEMORY (OOM)</text>
      </g>

      <text x="126" y="244" font-size="8" fill="#64748B" text-anchor="middle">Total free = 18k, but no 12k contiguous segment</text>
    </g>

    <!-- Bottom Diagnosis -->
    <rect x="14" y="312" width="252" height="96" rx="2" fill="#FFFFFF" stroke="#FEB2B2" stroke-width="1"/>
    <text x="24" y="330" font-size="9.5" font-weight="700" fill="#991B1B">Pathology Diagnosis:</text>
    <text x="24" y="348" font-size="8.5" fill="#475569">• Internal Waste: 60%–80% HBM stranded</text>
    <text x="24" y="364" font-size="8.5" fill="#475569">• External Frag: Holes prevent allocations</text>
    <text x="24" y="380" font-size="8.5" fill="#475569">• Speculative Branching: Forces full copy</text>
    <text x="24" y="396" font-size="8.5" font-weight="700" fill="#DC2626">• Max concurrency severely capped</text>
  </g>

  <!-- PANEL B: PagedAttention Virtual Paging (Middle, w=325) -->
  <g transform="translate(315, 90)">
    <rect width="325" height="420" rx="2" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" filter="url(#panelShadow)"/>
    <rect x="14" y="12" width="297" height="24" rx="4" fill="#DCFCE7"/>
    <text x="162" y="28" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">B. PagedAttention Virtual Page Table</text>

    <!-- Logical Sequence Representation -->
    <g transform="translate(14, 46)">
      <text x="0" y="12" font-size="9.5" font-weight="700" fill="#1E293B">Logical Sequence (Tokens 0..L-1):</text>
      <!-- Logical Blocks -->
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="68" height="24" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
        <text x="34" y="15" font-size="8" font-weight="700" fill="#1E40AF" text-anchor="middle">LBN 0 (0..15)</text>

        <rect x="74" y="0" width="68" height="24" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
        <text x="108" y="15" font-size="8" font-weight="700" fill="#1E40AF" text-anchor="middle">LBN 1 (16..31)</text>

        <rect x="148" y="0" width="68" height="24" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
        <text x="182" y="15" font-size="8" font-weight="700" fill="#1E40AF" text-anchor="middle">LBN 2 (32..47)</text>

        <rect x="222" y="0" width="75" height="24" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
        <text x="259" y="15" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">LBN 3 (Tail)</text>
      </g>
    </g>

    <!-- Virtual-to-Physical Mapping Engine -->
    <g transform="translate(14, 102)">
      <!-- Page Table Container -->
      <rect width="135" height="135" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="135" height="22" rx="2" fill="#F1F5F9"/>
      <text x="67" y="15" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Trajectory Page Table</text>

      <g transform="translate(8, 28)">
        <text x="0" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#1E293B">LBN 0 ──► PBN #7</text>
        <text x="0" y="32" font-family="monospace" font-size="8" font-weight="700" fill="#1E293B">LBN 1 ──► PBN #2</text>
        <text x="0" y="50" font-family="monospace" font-size="8" font-weight="700" fill="#1E293B">LBN 2 ──► PBN #13</text>
        <text x="0" y="68" font-family="monospace" font-size="8" font-weight="700" fill="#D97706">LBN 3 ──► PBN #5</text>
        <line x1="0" y1="78" x2="119" y2="78" stroke="#E2E8F0" stroke-width="1"/>
        <text x="0" y="92" font-size="7.5" fill="#64748B">Block size B = 16 tok</text>
      </g>

      <!-- Arrow -->
      <path d="M 142 68 L 165 68" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

      <!-- Physical HBM Page Frames Grid -->
      <g transform="translate(172, 0)">
        <rect width="125" height="135" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <rect width="125" height="22" rx="2" fill="#F1F5F9"/>
        <text x="62" y="15" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Scattered HBM Blocks</text>

        <!-- Block Grid -->
        <g transform="translate(8, 30)">
          <rect x="0" y="0" width="32" height="20" rx="3" fill="#E2E8F0"/>
          <text x="16" y="13" font-size="7" fill="#64748B" text-anchor="middle">#0</text>
          <rect x="38" y="0" width="32" height="20" rx="3" fill="#E2E8F0"/>
          <text x="54" y="13" font-size="7" fill="#64748B" text-anchor="middle">#1</text>
          <rect x="76" y="0" width="32" height="20" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
          <text x="92" y="13" font-size="7" font-weight="700" fill="#1D4ED8" text-anchor="middle">#2</text>

          <rect x="0" y="24" width="32" height="20" rx="3" fill="#E2E8F0"/>
          <text x="16" y="37" font-size="7" fill="#64748B" text-anchor="middle">#3</text>
          <rect x="38" y="24" width="32" height="20" rx="3" fill="#E2E8F0"/>
          <text x="54" y="37" font-size="7" fill="#64748B" text-anchor="middle">#4</text>
          <rect x="76" y="24" width="32" height="20" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
          <text x="92" y="37" font-size="7" font-weight="700" fill="#B45309" text-anchor="middle">#5</text>

          <rect x="0" y="48" width="32" height="20" rx="3" fill="#E2E8F0"/>
          <text x="16" y="61" font-size="7" fill="#64748B" text-anchor="middle">#6</text>
          <rect x="38" y="48" width="32" height="20" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
          <text x="54" y="61" font-size="7" font-weight="700" fill="#1D4ED8" text-anchor="middle">#7</text>
          <rect x="76" y="48" width="32" height="20" rx="3" fill="#E2E8F0"/>
          <text x="92" y="61" font-size="7" fill="#64748B" text-anchor="middle">#8</text>

          <rect x="0" y="72" width="32" height="20" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
          <text x="16" y="85" font-size="7" font-weight="700" fill="#1D4ED8" text-anchor="middle">#13</text>
          <rect x="38" y="72" width="70" height="20" rx="3" fill="#DCFCE7"/>
          <text x="73" y="85" font-size="7" font-weight="700" fill="#166534" text-anchor="middle">Free Pool</text>
        </g>
      </g>
    </g>

    <!-- Formula Equation Bar -->
    <g transform="translate(14, 250)">
      <rect width="297" height="50" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="148" y="18" font-size="8.5" font-weight="700" fill="#0F172A" text-anchor="middle">PhysAddr(i) = Base(PageTable[⌊i/B⌋]) + (i mod B)·S_token</text>
      <text x="148" y="36" font-size="7.5" fill="#475569" text-anchor="middle">Dynamic pointer translation inside custom PagedAttention CUDA kernel</text>
    </g>

    <!-- Systems Benefit -->
    <rect x="14" y="312" width="297" height="96" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="24" y="330" font-size="9.5" font-weight="700" fill="#15803D">Virtual Paging Guarantees:</text>
    <text x="24" y="348" font-size="8.5" fill="#475569">• External Fragmentation: <tspan font-weight="700" fill="#16A34A">Strictly 0%</tspan> (uniform block size B)</text>
    <text x="24" y="364" font-size="8.5" fill="#475569">• Internal Waste: Bounded to &lt; B·S_token (&lt;0.05% at 32k)</text>
    <text x="24" y="380" font-size="8.5" fill="#475569">• On-Demand Growth: New blocks pulled from free list</text>
    <text x="24" y="396" font-size="8.5" font-weight="700" fill="#15803D">• Cluster utilization jumps from 20% to over 95%</text>
  </g>

  <!-- PANEL C: Copy-on-Write for Speculation (Right, w=265) -->
  <g transform="translate(655, 90)">
    <rect width="285" height="420" rx="2" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2" filter="url(#panelShadow)"/>
    <rect x="14" y="12" width="257" height="24" rx="4" fill="#EDE9FE"/>
    <text x="142" y="28" font-size="11" font-weight="700" fill="#5B21B6" text-anchor="middle">C. Copy-on-Write (CoW) Branching</text>

    <!-- CoW Mechanics Visual -->
    <g transform="translate(14, 46)">
      <!-- Parent Shared Blocks -->
      <rect width="257" height="58" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#581C87">Parent Prefix State (Prompt + Trajectory)</text>
      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="70" height="22" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
        <text x="35" y="14" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">PBN #7 [rc=2]</text>
        <rect x="76" y="0" width="70" height="22" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
        <text x="111" y="14" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">PBN #2 [rc=2]</text>
        <rect x="152" y="0" width="85" height="22" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
        <text x="194" y="14" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">PBN #13 [rc=2]</text>
      </g>

      <!-- Forking Arrows -->
      <path d="M 70 88 L 45 116" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
      <path d="M 180 88 L 205 116" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowSlate)"/>

      <!-- Branch 1 Box -->
      <g transform="translate(0, 120)">
        <rect width="122" height="115" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <rect width="122" height="20" rx="2" fill="#F8FAFC"/>
        <text x="61" y="14" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">Speculative Branch 1</text>
        <text x="8" y="34" font-size="7.5" fill="#475569">Shared Prefix (Aliased):</text>
        <text x="8" y="47" font-family="monospace" font-size="7.5" font-weight="700" fill="#581C87">[#7, #2, #13]</text>
        <text x="8" y="66" font-size="7.5" fill="#475569">Private Delta Block:</text>
        <rect x="8" y="72" width="106" height="20" rx="3" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
        <text x="61" y="85" font-size="7.5" font-weight="700" fill="#065F46" text-anchor="middle">PBN #18 [rc=1]</text>
        <text x="8" y="105" font-size="7" fill="#047857">Zero prompt copy!</text>
      </g>

      <!-- Branch 2 Box -->
      <g transform="translate(135, 120)">
        <rect width="122" height="115" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <rect width="122" height="20" rx="2" fill="#F8FAFC"/>
        <text x="61" y="14" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">Speculative Branch 2</text>
        <text x="8" y="34" font-size="7.5" fill="#475569">Shared Prefix (Aliased):</text>
        <text x="8" y="47" font-family="monospace" font-size="7.5" font-weight="700" fill="#581C87">[#7, #2, #13]</text>
        <text x="8" y="66" font-size="7.5" fill="#475569">Private Delta Block:</text>
        <rect x="8" y="72" width="106" height="20" rx="3" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
        <text x="61" y="85" font-size="7.5" font-weight="700" fill="#065F46" text-anchor="middle">PBN #24 [rc=1]</text>
        <text x="8" y="105" font-size="7" fill="#047857">Zero prompt copy!</text>
      </g>

      <!-- Formula Bar -->
      <g transform="translate(0, 246)">
        <rect width="257" height="42" rx="4" fill="#EDE9FE"/>
        <text x="128" y="16" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">Memory: O(L_prefix + K·L_branch)</text>
        <text x="128" y="30" font-size="7" fill="#6B21A8" text-anchor="middle">Collapses K-way duplication down to delta writes</text>
      </g>
    </g>

    <!-- Bottom Diagnosis -->
    <rect x="14" y="348" width="257" height="60" rx="2" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="24" y="366" font-size="8.5" font-weight="700" fill="#581C87">CoW Reference Counting Invariant:</text>
    <text x="24" y="382" font-size="8" fill="#475569">• Shared blocks freed only when ref_count == 0</text>
    <text x="24" y="396" font-size="8" fill="#475569">• Unlocks Best-of-N and high-width MCTS search</text>
  </g>
</svg>
