<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .card-hdr { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .card-sub { font-family: ui-monospace, monospace; font-size: 9.5px; fill: #64748b; }
      .axis-lbl { font-size: 10px; font-weight: 700; fill: #334155; }
      .tick-lbl { font-family: ui-monospace, monospace; font-size: 9px; fill: #64748b; }
      .mono-math { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; }
      .regime-title { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .regime-sub { font-size: 8.5px; fill: #475569; text-anchor: middle; }
    </style>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left Container Card: Cost vs Tool Wait Time -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="520" height="440" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <rect x="14" y="14" width="220" height="22" rx="3" fill="#e0f2fe"/>
    <text x="22" y="29" class="card-hdr" fill="#0369a1">LATENCY TRADE-OFF CURVE</text>
    <text x="506" y="29" class="card-sub" text-anchor="end">S = 32,768 Tokens (70B Model)</text>

    <!-- Plot Area -->
    <g transform="translate(60, 60)">
      <!-- Grid lines -->
      <line x1="0" y1="260" x2="420" y2="260" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="0" y1="180" x2="420" y2="180" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="100" x2="420" y2="100" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="20" x2="420" y2="20" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Vertical Axes -->
      <line x1="0" y1="260" x2="0" y2="10" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <line x1="0" y1="260" x2="430" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>

      <!-- Axis Labels -->
      <text x="-45" y="135" class="axis-lbl" transform="rotate(-90, -45, 135)" text-anchor="middle">Latency / Penalty Cost</text>
      <text x="210" y="295" class="axis-lbl" text-anchor="middle">Tool Wait Duration T_wait (Log Scale)</text>

      <!-- X Ticks -->
      <text x="40" y="274" class="tick-lbl" text-anchor="middle">50 ms</text>
      <text x="130" y="274" class="tick-lbl" text-anchor="middle">215 ms</text>
      <text x="220" y="274" class="tick-lbl" text-anchor="middle">1 s</text>
      <text x="310" y="274" class="tick-lbl" text-anchor="middle">10 s</text>
      <text x="400" y="274" class="tick-lbl" text-anchor="middle">60 s</text>

      <!-- Y Ticks -->
      <text x="-8" y="248" class="tick-lbl" text-anchor="end">107 ms</text>
      <text x="-8" y="184" class="tick-lbl" text-anchor="end">1.0 s</text>
      <text x="-8" y="104" class="tick-lbl" text-anchor="end">5.0 s</text>
      <text x="-8" y="44" class="tick-lbl" text-anchor="end">9.17 s</text>

      <!-- Break-even threshold vertical dashed line -->
      <line x1="130" y1="260" x2="130" y2="20" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="130" y="15" class="mono-math" fill="#dc2626" text-anchor="middle">T* = 215 ms Crossover</text>

      <!-- 1. Full Recomputation Line (Red horizontal) -->
      <line x1="0" y1="40" x2="420" y2="40" stroke="#dc2626" stroke-width="2"/>
      <text x="145" y="32" class="mono-math" fill="#dc2626">Full Recomputation: T_prefill = 9.17 s</text>

      <!-- 2. Retain Opportunity Cost Line (Gold diagonal) -->
      <line x1="0" y1="260" x2="280" y2="40" stroke="#d97706" stroke-width="2.5"/>

      <!-- 3. PCIe Swapping Overhead Line (Green horizontal) -->
      <line x1="0" y1="245" x2="420" y2="245" stroke="#16a34a" stroke-width="2"/>
      <text x="415" y="238" class="mono-math" fill="#15803d" text-anchor="end">PCIe Swap Roundtrip: 107 ms (54 GB/s DMA)</text>

      <!-- Shaded Regime Annotations -->
      <rect x="0" y="160" width="130" height="95" fill="#fef3c7" opacity="0.3"/>
      <text x="65" y="195" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">RETAIN REGIME</text>
      <text x="65" y="210" font-size="8" fill="#92400e" text-anchor="middle">T_wait &lt; 215 ms</text>
      <text x="65" y="224" font-size="7.5" fill="#78350f" text-anchor="middle">(Stranded HBM Tax)</text>

      <rect x="130" y="60" width="290" height="195" fill="#f0fdf4" opacity="0.3"/>
      <text x="275" y="140" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">PCIE HOST SWAPPING REGIME</text>
      <text x="275" y="154" font-size="8.5" fill="#166534" text-anchor="middle">107 ms DMA hidden behind pause</text>
    </g>

    <!-- Caption Callout below plot -->
    <g transform="translate(20, 375)">
      <rect x="0" y="0" width="480" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">Systems Decision Rule:</text>
      <text x="10" y="32" font-size="8.5" fill="#334155">T_wait &gt; 215 ms: offload frees 10.0 GiB</text>
    </g>
  </g>

  <!-- Right Container Card: Operational Regime Map -->
  <g transform="translate(560, 20)">
    <rect x="0" y="0" width="520" height="440" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <rect x="14" y="14" width="220" height="22" rx="3" fill="#dcfce7"/>
    <text x="22" y="29" class="card-hdr" fill="#15803d">OPERATIONAL REGIME MAP</text>
    <text x="506" y="29" class="card-sub" text-anchor="end">Sequence Length vs Pause Duration</text>

    <!-- 2D Map -->
    <g transform="translate(50, 60)">
      <!-- Axes -->
      <line x1="0" y1="260" x2="0" y2="10" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <line x1="0" y1="260" x2="430" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-axis)"/>

      <text x="-45" y="135" class="axis-lbl" transform="rotate(-90, -45, 135)" text-anchor="middle">Sequence Length S (Tokens)</text>
      <text x="215" y="295" class="axis-lbl" text-anchor="middle">Tool Wait Duration T_wait (Seconds)</text>

      <!-- Ticks Y -->
      <text x="-8" y="240" class="tick-lbl" text-anchor="end">2,048</text>
      <text x="-8" y="180" class="tick-lbl" text-anchor="end">8,192</text>
      <text x="-8" y="120" class="tick-lbl" text-anchor="end">32,768</text>
      <text x="-8" y="60" class="tick-lbl" text-anchor="end">131,072</text>

      <!-- Ticks X -->
      <text x="50" y="274" class="tick-lbl" text-anchor="middle">100 ms</text>
      <text x="130" y="274" class="tick-lbl" text-anchor="middle">1 s</text>
      <text x="220" y="274" class="tick-lbl" text-anchor="middle">15 s</text>
      <text x="310" y="274" class="tick-lbl" text-anchor="middle">60 s</text>
      <text x="390" y="274" class="tick-lbl" text-anchor="middle">10 min</text>

      <!-- Regime 1: Resident Retention (Left Strip) -->
      <rect x="0" y="10" width="70" height="250" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" fill-opacity="0.8"/>
      <g transform="translate(35, 100)">
        <text x="0" y="0" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">RETAIN</text>
        <text x="0" y="16" font-size="8" fill="#2563eb" text-anchor="middle">Fast Tools</text>
        <text x="0" y="30" font-size="7.5" fill="#64748b" text-anchor="middle">&lt; 215 ms</text>
      </g>

      <!-- Regime 2: PCIe Host Swapping (Center Region) -->
      <rect x="74" y="10" width="240" height="250" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" fill-opacity="0.8"/>
      <g transform="translate(194, 90)">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">PCIE HOST SWAP REGIME</text>
        <text x="0" y="20" font-size="8.5" fill="#166534" text-anchor="middle">Offload to Host DRAM during bash tool runs,</text>
        <text x="0" y="34" font-size="8.5" fill="#166534" text-anchor="middle">compiler runs, and test suites (1s – 60s)</text>
        <text x="0" y="58" class="mono-math" fill="#15803d" text-anchor="middle">T_swap &lt;&lt; T_tool &lt;&lt; T_recompute</text>
        <text x="0" y="78" font-size="8" fill="#475569" text-anchor="middle">Async DMA prefetch hides all restore latency</text>
      </g>

      <!-- Regime 3: Tiered Secondary Storage / NVMe (Right Region) -->
      <rect x="318" y="10" width="100" height="250" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" fill-opacity="0.8"/>
      <g transform="translate(368, 100)">
        <text x="0" y="0" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">NVMe / TIER 3</text>
        <text x="0" y="16" font-size="8" fill="#7c3aed" text-anchor="middle">Cold Store</text>
        <text x="0" y="30" font-size="7.5" fill="#64748b" text-anchor="middle">&gt; 60 s Wait</text>
        <text x="0" y="44" font-size="7.5" fill="#64748b" text-anchor="middle">Human In Loop</text>
      </g>
    </g>

    <!-- Explanatory note -->
    <g transform="translate(20, 375)">
      <rect x="0" y="0" width="480" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">Tier Migration Invariant:</text>
      <text x="10" y="30" font-size="8.5" fill="#334155">Working sets migrate down tiers</text>
      
    </g>
  </g>
</svg>
