concept_map:
  schema_version: 2
  source: 19_agent_economics.qmd
  generated_date: '2026-10-13'
  primary_concepts:
    - Cohort cost per accepted task
    - Prefix-cache pricing and compaction payback
    - Critical-path acceleration ceiling
    - Cascade and routing pricing
    - Trajectory goodput
    - Queueing cost of utilization
    - Budget conservation
    - Architecture pricing with human fallback
  secondary_concepts:
    - Dedicated capacity break-even
    - Speculative decoding profitability
    - Adaptation payback
  claims:
    Cohort cost per accepted task: Measured cost per accepted task is the sum of every initiated task's account,
      each charge in exactly one category, divided by the distinct tasks accepted under one declared contract.
    Prefix-cache pricing and compaction payback: Ideal prefix reuse bills the quadratic re-send at the cached rate,
      which lowers its coefficient without removing it, so a compaction pays back only after enough turns to recover
      its rewrite and lost cache.
    Critical-path acceleration ceiling: A speedup g applied to a fraction f of the measured critical path gives
      T' = T[(1-f) + f/g] and a ceiling of 1/(1-f), which a baseline profile reveals before anything is bought.
    Cascade and routing pricing: A cascade's cost and acceptance are reach-weighted sums, so savings come from the
      early-exit rate, every reached gate charges whether or not its candidate passes, and fail-through harm is
      priced in.
    Trajectory goodput: Accepted tasks per unit time is the platform's deliverable, so sustaining goodput G at acceptance
      alpha requires admitting G/alpha trajectories and any change that lowers acceptance raises offered load.
    Queueing cost of utilization: Near saturation queueing wait grows like rho/(1-rho), so a modest throughput gain
      from higher utilization costs a multiple in wait that compounds across every serial step of a trajectory.
    Budget conservation: Every budget account in the tree keeps budget = settled + reserved + free under atomic, logged transitions,
      so a delegation tree conserves spending and a stopped child keeps its reservation until its late bills settle.
    Architecture pricing with human fallback: Deterministic code, a fixed workflow, a bounded loop, and delegation
      are compared under one acceptance contract by cost per resolved task including human fallback, not by automated
      cost per automated acceptance.
    Dedicated capacity break-even: Owning capacity beats an API at a delivered utilization u* = F / (3600 R (P_eff
      - v)), not at a token price.
    Speculative decoding profitability: Speculative decoding pays only when the accepted-draft rate shortens the
      output-bound critical path by more than draft and verification work add to the bill.
    Adaptation payback: A one-time adaptation investment recovers its cost after N* = C_adapt / (C_base - C_adapted)
      tasks, never if the per-task saving is nonpositive, and only while acceptance stays equal.
