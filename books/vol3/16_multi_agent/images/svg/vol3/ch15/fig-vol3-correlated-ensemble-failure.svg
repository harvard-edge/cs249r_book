<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1160" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL (a): ENSEMBLE ERROR SCALING CURVES                          -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Container Card -->
    <rect width="640" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 636 0 Q 640 0 640 4 L 640 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(a) Majority Vote Failure Scaling vs. Fleet Size (M)</text>
    <text x="624" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">p = 0.20, ρ = 0.40</text>

    <!-- Plot Area Background -->
    <g transform="translate(60, 50)">
      <rect width="550" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>

      <!-- Grid lines (Y: 0%, 5%, 10%, 15%, 20%, 25%) -->
      <!-- Height is 360, mapping 0% to y=330, 25% to y=30 (300px for 25% -> 12px per %) -->
      <!-- 25% -> y = 30 -->
      <line x1="0" y1="30" x2="550" y2="30" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="34" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">25%</text>

      <!-- 20% -> y = 90 -->
      <line x1="0" y1="90" x2="550" y2="90" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="-10" y="94" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">20%</text>
      <text x="15" y="84" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b">Baseline Single-Agent Error (p = 0.20)</text>

      <!-- Asymptotic Floor Line & Badge -->
      <line x1="0" y1="150" x2="550" y2="150" stroke="#fee2e2" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="-10" y="154" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626" text-anchor="end">15%</text>
      <rect x="365" y="156" width="175" height="18" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="452" y="168" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626" font-weight="600" text-anchor="middle">Asymptotic Floor: ~14.95%</text>

      <!-- 10% -> y = 210 -->
      <line x1="0" y1="210" x2="550" y2="210" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="214" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">10%</text>

      <!-- 5% -> y = 270 -->
      <line x1="0" y1="270" x2="550" y2="270" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="274" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">5%</text>

      <!-- 0% -> y = 330 -->
      <line x1="0" y1="330" x2="550" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="-10" y="334" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">0%</text>

      <!-- X Grid and Ticks: M = 1, 3, 5, 7, 9, 11, 13, 15 -->
      <g fill="#64748b" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="middle">
        <text x="35" y="348">M=1</text>
        <text x="105" y="348">M=3</text>
        <text x="175" y="348">M=5</text>
        <text x="245" y="348">M=7</text>
        <text x="315" y="348">M=9</text>
        <text x="385" y="348">M=11</text>
        <text x="455" y="348">M=13</text>
        <text x="525" y="348">M=15</text>
      </g>
      <text x="280" y="372" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Voter Pool Size (M Parallel Agents)</text>

      <!-- ================= CURVE 1: INDEPENDENT (BLUE) ================= -->
      <path d="M 35 90 C 70 160, 130 235, 175 260.5 C 215 280, 280 300, 315 306.5 C 385 318, 455 322, 525 325"
            fill="none" stroke="#2563eb" stroke-width="2.5"/>

      <!-- Independent Data Dots -->
      <circle cx="35" cy="90" r="4" fill="#2563eb"/>
      <circle cx="105" cy="205.2" r="4" fill="#2563eb"/>
      <circle cx="175" cy="260.5" r="4.5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
      <circle cx="245" cy="290.0" r="4" fill="#2563eb"/>
      <circle cx="315" cy="306.5" r="4" fill="#2563eb"/>
      <circle cx="385" cy="316.0" r="4" fill="#2563eb"/>
      <circle cx="455" cy="321.6" r="4" fill="#2563eb"/>
      <circle cx="525" cy="325.0" r="4" fill="#2563eb"/>

      <!-- ================= CURVE 2: CORRELATED (RED) ================= -->
      <path d="M 35 90 C 70 108, 120 124, 175 130 C 230 134, 300 138, 385 140.3 C 440 141.5, 480 142.2, 525 142.8"
            fill="none" stroke="#dc2626" stroke-width="2.5"/>

      <!-- Correlated Data Dots -->
      <circle cx="35" cy="90" r="4" fill="#dc2626"/>
      <circle cx="105" cy="119.6" r="4" fill="#dc2626"/>
      <circle cx="175" cy="130.0" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="245" cy="135.1" r="4" fill="#dc2626"/>
      <circle cx="315" cy="138.1" r="4" fill="#dc2626"/>
      <circle cx="385" cy="140.3" r="4" fill="#dc2626"/>
      <circle cx="455" cy="141.7" r="4" fill="#dc2626"/>
      <circle cx="525" cy="142.8" r="4" fill="#dc2626"/>

      <!-- Callout Box at M=5 (Correlated) -->
      <g transform="translate(195, 80)">
        <rect width="180" height="36" rx="3" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
        <text x="8" y="13" font-size="8.5" font-weight="700" fill="#991b1b">M = 5 Correlated (ρ = 0.40):</text>
        <text x="8" y="27" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626">P(fail) = 16.67% (1.20× gain)</text>
      </g>
      <path d="M 195 98 L 181 125" stroke="#dc2626" stroke-width="1.2"/>

      <!-- Callout Box at M=5 (Independent) -->
      <g transform="translate(195, 230)">
        <rect width="180" height="36" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="8" y="13" font-size="8.5" font-weight="700" fill="#1e40af">M = 5 Independent (ρ = 0.0):</text>
        <text x="8" y="27" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#2563eb">P(fail) = 5.79% (3.45× gain)</text>
      </g>
      <path d="M 195 248 L 181 258" stroke="#2563eb" stroke-width="1.2"/>

      <!-- Stacked Legend at Top Left -->
      <g transform="translate(20, 15)">
        <rect width="250" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <!-- Line 1: Correlated -->
        <line x1="12" y1="15" x2="32" y2="15" stroke="#dc2626" stroke-width="2.5"/>
        <circle cx="22" cy="15" r="3" fill="#dc2626"/>
        <text x="38" y="18" font-size="8" font-weight="600" fill="#991b1b">Correlated Fleet (ρ = 0.40, Beta-Bin)</text>

        <!-- Line 2: Independent -->
        <line x1="12" y1="33" x2="32" y2="33" stroke="#2563eb" stroke-width="2.5"/>
        <circle cx="22" cy="33" r="3" fill="#2563eb"/>
        <text x="38" y="36" font-size="8" font-weight="600" fill="#1e40af">Independent (ρ = 0.0, Binomial)</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL (b): OUTCOME DISTRIBUTION BREAKDOWN (M = 5)                 -->
  <!-- ================================================================= -->
  <g transform="translate(680, 20)">
    <!-- Container Card -->
    <rect width="460" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 456 0 Q 460 0 460 4 L 460 30 L 0 30 Z" fill="#fff1f2" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#991b1b">(b) Failure Probability Density for M = 5 Voters</text>
    <text x="444" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#dc2626" text-anchor="end">Tail Inflation</text>

    <!-- Sub-Plot Area -->
    <g transform="translate(45, 50)">
      <rect width="380" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>

      <!-- Shaded Failure Region (k >= 3) -->
      <!-- k=3 starts at x=195, width = 185, height = 230 -->
      <rect x="190" y="0" width="190" height="200" fill="#fee2e2" opacity="0.4"/>
      <line x1="190" y1="0" x2="190" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="285" y="18" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Majority Fails (k ≥ 3)</text>

      <!-- Y Grid Lines: 0%, 20%, 40%, 60% (mapping 60% to 180px -> 3px per %) -->
      <!-- 60% -> y = 20 -->
      <line x1="0" y1="20" x2="380" y2="20" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-8" y="24" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">60%</text>
      <!-- 40% -> y = 80 -->
      <line x1="0" y1="80" x2="380" y2="80" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-8" y="84" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">40%</text>
      <!-- 20% -> y = 140 -->
      <line x1="0" y1="140" x2="380" y2="140" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-8" y="144" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">20%</text>
      <!-- 0% -> y = 200 -->
      <line x1="0" y1="200" x2="380" y2="200" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="-8" y="204" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">0%</text>

      <!-- Bars for k = 0, 1, 2, 3, 4, 5 -->
      <!-- Group slot width = 55px, bar width = 16px -->
      <!-- k=0 (slot center x=35):
           Indep: 32.8% -> h = 98.4px, y = 101.6px
           Corr: 58.9% -> h = 176.7px, y = 23.3px
      -->
      <g transform="translate(12, 0)">
        <rect x="5" y="101.6" width="16" height="98.4" fill="#3b82f6" rx="1"/>
        <rect x="23" y="23.3" width="16" height="176.7" fill="#ef4444" rx="1"/>
        <text x="22" y="215" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155" text-anchor="middle">k=0</text>
      </g>

      <!-- k=1 (slot center x=95):
           Indep: 41.0% -> h = 123.0px, y = 77.0px
           Corr: 13.6% -> h = 40.8px, y = 159.2px
      -->
      <g transform="translate(72, 0)">
        <rect x="5" y="77.0" width="16" height="123.0" fill="#3b82f6" rx="1"/>
        <rect x="23" y="159.2" width="16" height="40.8" fill="#ef4444" rx="1"/>
        <text x="22" y="215" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155" text-anchor="middle">k=1</text>
      </g>

      <!-- k=2 (slot center x=155):
           Indep: 20.5% -> h = 61.5px, y = 138.5px
           Corr: 10.8% -> h = 32.4px, y = 167.6px
      -->
      <g transform="translate(132, 0)">
        <rect x="5" y="138.5" width="16" height="61.5" fill="#3b82f6" rx="1"/>
        <rect x="23" y="167.6" width="16" height="32.4" fill="#ef4444" rx="1"/>
        <text x="22" y="215" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155" text-anchor="middle">k=2</text>
      </g>

      <!-- k=3 (slot center x=215):
           Indep: 5.12% -> h = 15.4px, y = 184.6px
           Corr: 7.29% -> h = 21.9px, y = 178.1px
      -->
      <g transform="translate(197, 0)">
        <rect x="5" y="184.6" width="16" height="15.4" fill="#3b82f6" rx="1"/>
        <rect x="23" y="178.1" width="16" height="21.9" fill="#ef4444" rx="1"/>
        <text x="22" y="215" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b" font-weight="700" text-anchor="middle">k=3</text>
      </g>

      <!-- k=4 (slot center x=275):
           Indep: 0.64% -> h = 2px, y = 198px
           Corr: 5.46% -> h = 16.4px, y = 183.6px
      -->
      <g transform="translate(257, 0)">
        <rect x="5" y="198.0" width="16" height="2.0" fill="#3b82f6" rx="1"/>
        <rect x="23" y="183.6" width="16" height="16.4" fill="#ef4444" rx="1"/>
        <text x="22" y="215" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b" font-weight="700" text-anchor="middle">k=4</text>
      </g>

      <!-- k=5 (slot center x=335):
           Indep: 0.03% -> h = 0.5px, y = 199.5px
           Corr: 3.92% -> h = 11.8px, y = 188.2px
      -->
      <g transform="translate(317, 0)">
        <rect x="5" y="199.5" width="16" height="0.5" fill="#3b82f6" rx="1"/>
        <rect x="23" y="188.2" width="16" height="11.8" fill="#ef4444" rx="1"/>
        <text x="22" y="215" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b" font-weight="700" text-anchor="middle">k=5</text>
      </g>

      <!-- Sub-plot legend -->
      <g transform="translate(15, 23)">
        <rect width="12" height="9" fill="#3b82f6" rx="1"/>
        <text x="16" y="8" font-size="7.5" fill="#334155">Indep (ρ=0)</text>
        <rect x="80" width="12" height="9" fill="#ef4444" rx="1"/>
        <text x="96" y="8" font-size="7.5" fill="#334155">Corr (ρ=0.40)</text>
      </g>
    </g>

    <!-- Mathematical Reconciliation & Quantitative Summary Box -->
    <g transform="translate(20, 295)">
      <rect width="420" height="170" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="420" height="20" rx="3" fill="#f8fafc"/>
      <text x="12" y="14" font-size="9.5" font-weight="700" fill="#0f172a">Mathematical Verification &amp; Tail Amplification</text>

      <g transform="translate(12, 28)">
        <!-- Step 1: Independent Sum -->
        <text x="0" y="12" font-size="8.5" font-weight="700" fill="#1e40af">1. Independent Binomial (M = 5, p = 0.20):</text>
        <text x="12" y="26" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">P(k ≥ 3) = 0.0512 + 0.0064 + 0.00032 = 5.79%</text>

        <!-- Step 2: Correlated Sum -->
        <text x="0" y="44" font-size="8.5" font-weight="700" fill="#991b1b">2. Correlated Beta-Binomial (M = 5, ρ = 0.40):</text>
        <text x="12" y="58" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">P(k ≥ 3) = 0.0729 + 0.0546 + 0.0392 = 16.67%</text>
        <text x="12" y="72" font-size="8" font-weight="600" fill="#dc2626">→ Error triples (5.79% → 16.67%), cancelling ensemble safety.</text>

        <!-- Step 3: Unanimous Failure -->
        <text x="0" y="90" font-size="8.5" font-weight="700" fill="#0f172a">3. Unanimous False Approval (k = 5):</text>
        <text x="12" y="104" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Independent: P(k=5) = (0.2)⁵ = 0.032% (1 in 3,125)</text>
        <text x="12" y="118" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">Correlated:  P(k=5) = 3.92% (1 in 25 reviews!)</text>
        <text x="12" y="132" font-size="8" font-weight="700" fill="#991b1b">122.5× amplification in unanimous catastrophic agreement.</text>
      </g>
    </g>
  </g>
</svg>