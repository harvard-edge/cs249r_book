<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1160" height="520" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL (a): GUNTHER USL & AMDAHL SCALING CURVES                     -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <!-- Container Card -->
    <rect width="640" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 636 0 Q 640 0 640 4 L 640 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(a) Multi-Agent Scalability &amp; Retrograde Collapse (Gunther USL)</text>
    <text x="624" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">f = 0.70, σ = 0.04, κ = 0.02</text>

    <!-- Plot Area Background -->
    <g transform="translate(60, 50)">
      <rect width="550" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>

      <!-- Retrograde Collapse Shaded Region (S < 1.0x -> y from 250 to 330) -->
      <rect x="0" y="250" width="550" height="80" fill="#fee2e2" opacity="0.35"/>
      <line x1="0" y1="250" x2="550" y2="250" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
      <rect x="360" y="255" width="180" height="20" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="450" y="269" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">Retrograde Zone: S(M) &lt; 1.0×</text>

      <!-- Y Grid Lines: 0x, 1x, 2x, 3x -->
      <!-- 3.0x -> y = 90 -->
      <line x1="0" y1="90" x2="550" y2="90" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="94" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">3.0×</text>

      <!-- 2.0x -> y = 170 -->
      <line x1="0" y1="170" x2="550" y2="170" stroke="#f1f5f9" stroke-width="1"/>
      <text x="-10" y="174" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">2.0×</text>

      <!-- 1.0x -> y = 250 -->
      <text x="-10" y="254" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e293b" text-anchor="end">1.0×</text>

      <!-- 0x -> y = 330 -->
      <line x1="0" y1="330" x2="550" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="-10" y="334" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#64748b" text-anchor="end">0.0×</text>

      <!-- Amdahl Asymptote: 1 / (1 - f) = 1 / 0.30 = 3.33x -> y = 63.3 -->
      <line x1="0" y1="63.3" x2="550" y2="63.3" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="540" y="58" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#1d4ed8" text-anchor="end">Amdahl Ceiling: 1/(1-f) = 3.33×</text>

      <!-- X Grid and Ticks: M = 1, 2, 4, 6, 8, 10, 12, 14, 16 -->
      <g fill="#64748b" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="middle">
        <text x="30" y="348">1</text>
        <text x="63" y="348">2</text>
        <text x="130" y="348">4</text>
        <text x="197" y="348">6</text>
        <text x="263" y="348">8</text>
        <text x="330" y="348">10</text>
        <text x="397" y="348">12</text>
        <text x="463" y="348">14</text>
        <text x="530" y="348">16</text>
      </g>
      <text x="280" y="372" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Concurrent Worker Fleet Size (M Agents)</text>

      <!-- ================= CURVE 1: AMDAHL IDEAL (BLUE) ================= -->
      <path d="M 30 250 C 60 210, 100 175, 130 161 C 180 142, 230 128, 263 123.6 C 350 112, 440 102, 530 97"
            fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="535" y="92" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#1e40af" text-anchor="end">Amdahl (σ=0, κ=0)</text>

      <!-- ================= CURVE 2: CONTENTION ONLY (GREEN) ================= -->
      <path d="M 30 250 C 60 215, 95 198, 130 196 C 165 196, 210 203, 263 211 C 350 224, 440 242, 530 253"
            fill="none" stroke="#059669" stroke-width="2"/>
      <text x="535" y="236" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#065f46" text-anchor="end">Contention (σ=0.04, κ=0)</text>

      <!-- ================= CURVE 3: FULL GUNTHER USL (RED) ================= -->
      <path d="M 30.0 250.0 L 38.3 238.7 L 46.7 230.2 L 55.0 224.2 L 63.3 220.4 L 71.7 218.5 L 80.0 218.1 L 88.3 219.0 L 96.7 220.9 L 105.0 223.6 L 113.3 226.8 L 121.7 230.4 L 130.0 234.2 L 138.3 238.1 L 146.7 242.1 L 155.0 246.1 L 163.3 250.0 L 171.7 253.8 L 180.0 257.4 L 188.3 260.9 L 196.7 264.2 L 205.0 267.4 L 213.3 270.4 L 221.7 273.3 L 230.0 275.9 L 238.3 278.5 L 246.7 280.9 L 255.0 283.1 L 263.3 285.2 L 271.7 287.2 L 280.0 289.1 L 288.3 290.9 L 296.7 292.6 L 305.0 294.2 L 313.3 295.6 L 321.7 297.1 L 330.0 298.4 L 338.3 299.6 L 346.7 300.8 L 355.0 301.9 L 363.3 303.0 L 371.7 304.0 L 380.0 305.0 L 388.3 305.9 L 396.7 306.7 L 405.0 307.5 L 413.3 308.3 L 421.7 309.1 L 430.0 309.8 L 438.3 310.4 L 446.7 311.1 L 455.0 311.7 L 463.3 312.3 L 471.7 312.8 L 480.0 313.3 L 488.3 313.9 L 496.7 314.3 L 505.0 314.8 L 513.3 315.2 L 521.7 315.7 L 530.0 316.1"
            fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <text x="535" y="325" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="end">Gunther USL (σ=0.04, κ=0.02)</text>

      <!-- Data Dots on Full USL Curve -->
      <circle cx="30" cy="250" r="4" fill="#dc2626"/>
      <circle cx="63" cy="220.4" r="4" fill="#dc2626"/>
      <!-- M=4 callout point -->
      <circle cx="130" cy="234" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <!-- M=8 callout point -->
      <circle cx="263" cy="285" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="397" cy="307" r="4" fill="#dc2626"/>
      <circle cx="530" cy="316" r="4" fill="#dc2626"/>

      <!-- Clean Badge M=4 (Below Curve in Clear White Area) -->
      <g transform="translate(45, 265)">
        <rect width="125" height="24" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
        <text x="62" y="16" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">M=4: 1.20× (T₄=501s)</text>
      </g>
      <path d="M 107 265 L 126 239" stroke="#dc2626" stroke-width="1.2"/>

      <!-- Clean Badge M=8 (In Clear Space Below Red Curve) -->
      <g transform="translate(200, 298)">
        <rect width="130" height="24" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
        <text x="65" y="16" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#991b1b" text-anchor="middle">M=8: 0.56× (T₈=1073s)</text>
      </g>
      <path d="M 263 298 L 263 290" stroke="#dc2626" stroke-width="1.2"/>

      <!-- Stationary Point M* Callout (Peak) -->
      <g transform="translate(60, 70)">
        <rect width="155" height="26" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="77" y="17" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d" text-anchor="middle">Optimal M* ≈ 2.4 (S* ≈ 1.40×)</text>
      </g>
      <path d="M 78 96 L 78 214" stroke="#15803d" stroke-width="1.2" stroke-dasharray="2 2"/>
      <circle cx="78" cy="218" r="3.5" fill="#15803d"/>

      <!-- Top Left Legend -->
      <g transform="translate(15, 12)">
        <rect width="360" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <!-- Line 1: USL Full -->
        <line x1="10" y1="17" x2="26" y2="17" stroke="#dc2626" stroke-width="2.5"/>
        <circle cx="18" cy="17" r="2.5" fill="#dc2626"/>
        <text x="32" y="20" font-size="7.5" font-weight="600" fill="#991b1b">Gunther USL (σ=0.04, κ=0.02)</text>

        <!-- Line 2: Contention -->
        <line x1="155" y1="17" x2="171" y2="17" stroke="#059669" stroke-width="2"/>
        <text x="176" y="20" font-size="7.5" font-weight="600" fill="#065f46">Contention (κ=0)</text>

        <!-- Line 3: Amdahl -->
        <line x1="260" y1="17" x2="276" y2="17" stroke="#2563eb" stroke-width="2"/>
        <text x="282" y="20" font-size="7.5" font-weight="600" fill="#1e40af">Amdahl Ideal</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL (b): GUNTHER USL FORMULATION & COHERENCY MECHANICS          -->
  <!-- ================================================================= -->
  <g transform="translate(680, 20)">
    <!-- Container Card -->
    <rect width="460" height="480" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Header Tab -->
    <path d="M 0 4 Q 0 0 4 0 L 456 0 Q 460 0 460 4 L 460 30 L 0 30 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#1e40af">(b) Universal Scalability Law Decomposition</text>
    <text x="444" y="20" font-size="10.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">after Gunther (1993)</text>

    <!-- Card 1: Governing Formula Box -->
    <g transform="translate(15, 42)">
      <rect width="430" height="110" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <rect width="430" height="20" rx="3" fill="#eff6ff"/>
      <text x="10" y="14" font-size="9" font-weight="700" fill="#1e40af">Gunther Universal Scalability Law (Speedup Formulation)</text>

      <!-- Formula Line -->
      <rect x="15" y="28" width="400" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="215" y="49" font-size="9.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#0f172a" text-anchor="middle">Speedup(M) = 1 / [ (1 - f) + f/M + σ(M - 1) + κ M(M - 1) ]</text>

      <!-- Optimal Scaling Point -->
      <text x="15" y="80" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d">Optimal Worker Count: f / M*² = σ + κ(2M* - 1)</text>
      <text x="15" y="98" font-size="7.5" fill="#475569">For f = 0.70, σ = 0.04, κ = 0.02: M* ≈ 2.4 workers, peak speedup ≈ 1.40×; break-even at M = 5</text>
    </g>

    <!-- Card 2: The Physical Pillars of Coordination Tax -->
    <g transform="translate(15, 162)">
      <rect width="430" height="155" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="430" height="20" rx="3" fill="#f8fafc"/>
      <text x="10" y="14" font-size="9" font-weight="700" fill="#0f172a">Physical Systems Decomposition of Coordination Tax</text>

      <g transform="translate(12, 28)">
        <!-- Term 1 -->
        <text x="0" y="12" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#2563eb">Parallel Speedup Term [ f / M ]:</text>
        <text x="12" y="24" font-size="7.5" fill="#475569">Linear makespan compression</text>

        <!-- Term 2 -->
        <text x="0" y="42" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#475569">Strictly Serial Bottleneck [ (1 - f) ]:</text>
        <text x="12" y="54" font-size="7.5" fill="#475569">Initial root planning, DAG task decomposition, and final regression validation.</text>

        <!-- Term 3 -->
        <text x="0" y="72" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#d97706">Contention Overhead [ σ (M - 1) ]:</text>
        <text x="12" y="84" font-size="7.5" fill="#475569">Queuing on supervisor and worktree locks</text>

        <!-- Term 4 -->
        <text x="0" y="102" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#dc2626">Pairwise Coherency Overhead [ κ M(M - 1) ]:</text>
        <text x="12" y="114" font-size="7.5" fill="#991b1b">Quadratic AST merge conflicts, state reconciliation, and multi-turn debate turns.</text>
      </g>
    </g>

    <!-- Card 3: Quantitative Telemetry (Example 15.2 Empirical Profile) -->
    <g transform="translate(15, 327)">
      <rect width="430" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="430" height="20" rx="3" fill="#f8fafc"/>
      <text x="10" y="14" font-size="9" font-weight="700" fill="#0f172a">Illustrative Refactoring Fleet (Worked Example)</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" font-size="8" font-weight="700" fill="#1e40af">Baseline Single Agent (T₁ = 600s):</text>
        <text x="180" y="12" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">120,000 total tokens (100k in, 20k out)</text>

        <text x="0" y="32" font-size="8" font-weight="700" fill="#15803d">4-Worker Fleet (M = 4, T₄ = 501s):</text>
        <text x="180" y="32" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">390,000 tokens (3.25× amplification)</text>
        <text x="12" y="46" font-size="7.5" fill="#475569">Speedup is only 1.20× despite 4× concurrency; wall-clock saved: 99s (16.5%).</text>

        <text x="0" y="66" font-size="8" font-weight="700" fill="#dc2626">8-Worker Fleet (M = 8, T₈ = 1073s):</text>
        <text x="180" y="66" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">Speedup = 0.56× (Severe Thrashing)</text>
        <text x="12" y="80" font-size="7.5" fill="#dc2626">Merge contention h(8) = 1.40 · 1.8× slower</text>

        <text x="0" y="98" font-size="7.5" font-weight="700" fill="#0f172a">Decision rule: if f ≤ σ + κ, then M* = 1 (do not delegate).</text>
      </g>
    </g>
  </g>
</svg>