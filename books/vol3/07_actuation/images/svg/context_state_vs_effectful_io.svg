<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%" style="background-color: #ffffff; font-family: Helvetica Neue, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (No Stroke) -->
  <rect width="900" height="340" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: CONTEXT STATE HIERARCHY                               -->
  <!-- ================================================================= -->
  <g id="context-state-hierarchy">
    <!-- Boundary Container -->
    <rect x="20" y="15" width="490" height="310" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Subsystem Header Band -->
    <rect x="20" y="15" width="490" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="265" y="33" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d" letter-spacing="0.5">CONTEXT STATE HIERARCHY</text>

    <!-- Vertical Gradients / Directional Axes -->
    <!-- Capacity / Lifetime Arrow (Left) -->
    <line x1="42" y1="58" x2="42" y2="280" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="42" y="302" text-anchor="start" font-size="8.5" font-weight="bold" fill="#15803d">capacity, lifetime, sharing grow</text>

    <!-- Freshness / Control Arrow (Right) -->
    <line x1="488" y1="280" x2="488" y2="58" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="488" y="302" text-anchor="end" font-size="8.5" font-weight="bold" fill="#15803d">freshness and control improve</text>

    <!-- Tier 1: Active Context -->
    <g id="tier-active-context">
      <rect x="175" y="55" width="180" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="265" y="71" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Active Context</text>
      <text x="265" y="85" text-anchor="middle" font-size="8.5" fill="#15803d">tokens visible now</text>
    </g>

    <!-- Tier 2: KV / Prefix Cache -->
    <g id="tier-kv-cache">
      <rect x="145" y="103" width="240" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="265" y="119" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">KV / Prefix Cache</text>
      <text x="265" y="133" text-anchor="middle" font-size="8.5" fill="#15803d">derived, reusable, recomputable</text>
    </g>

    <!-- Tier 3: Working State -->
    <g id="tier-working-state">
      <rect x="115" y="151" width="300" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="265" y="167" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Working State</text>
      <text x="265" y="181" text-anchor="middle" font-size="8.5" fill="#15803d">scratchpads, plans, partial results</text>
    </g>

    <!-- Tier 4: Semantic Memory -->
    <g id="tier-semantic-memory">
      <rect x="85" y="199" width="360" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="265" y="215" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Semantic Memory</text>
      <text x="265" y="229" text-anchor="middle" font-size="8.5" fill="#15803d">retrieval stores, summaries, episodes</text>
    </g>

    <!-- Tier 5: Artifacts and Logs -->
    <g id="tier-artifacts-logs">
      <rect x="55" y="247" width="420" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="265" y="263" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Artifacts and Logs</text>
      <text x="265" y="277" text-anchor="middle" font-size="8.5" fill="#15803d">files, traces, checkpoints, evidence</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: EFFECTFUL I/O PLANE                                 -->
  <!-- ================================================================= -->
  <g id="effectful-io-plane">
    <!-- Boundary Container -->
    <rect x="535" y="15" width="345" height="310" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

    <!-- Subsystem Header Band -->
    <rect x="535" y="15" width="345" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="707" y="33" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309" letter-spacing="0.5">EFFECTFUL I/O PLANE</text>

    <!-- Downward Arrow (Risk / Irreversibility) -->
    <line x1="850" y1="58" x2="850" y2="280" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="707" y="302" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#dc2626">latency, risk, irreversibility grow</text>

    <!-- Level 1: Tool Runtimes -->
    <g id="io-tool-runtimes">
      <rect x="555" y="55" width="275" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="692" y="73" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Tool Runtimes</text>
      <text x="692" y="88" text-anchor="middle" font-size="8.5" fill="#b45309">code execution, browsers, shells, APIs</text>
    </g>

    <!-- Level 2: Services and Databases -->
    <g id="io-services-databases">
      <rect x="555" y="112" width="275" height="44" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="692" y="130" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Services and Databases</text>
      <text x="692" y="145" text-anchor="middle" font-size="8.5" fill="#b45309">external records, queues, workflows</text>
    </g>

    <!-- Level 3: Human and Agent Peers -->
    <g id="io-human-peers">
      <rect x="555" y="169" width="275" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="692" y="187" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Human and Agent Peers</text>
      <text x="692" y="202" text-anchor="middle" font-size="8.5" fill="#b91c1c">approvals, delegation, communication</text>
    </g>

    <!-- Level 4: Physical Environment -->
    <g id="io-physical-env">
      <rect x="555" y="226" width="275" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="692" y="244" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Physical Environment</text>
      <text x="692" y="259" text-anchor="middle" font-size="8.5" fill="#6d28d9">sensors, actuators, users, devices</text>
    </g>
  </g>
</svg>
