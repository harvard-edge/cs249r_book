<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- UPPER SECTION: ACTUATION GATEWAY TOOL RESULT MEMOIZATION           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="940" height="170" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 360 0 Q 364 0 364 4 L 364 24 L 0 24 Z" fill="#ede9fe"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#6b21a8" letter-spacing="0.04em">ACTUATION GATEWAY: CONTENT-ADDRESSED MEMOIZATION</text>
    <text x="928" y="16" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="end">Deterministic Result Cache</text>

    <!-- Inbound Tool Call -->
    <rect x="18" y="36" width="310" height="118" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="28" y="54" font-size="11" font-weight="700" fill="#0f172a">Tool Call Interception</text>
    <text x="28" y="70" font-size="10" fill="#475569">Candidate invocation with arguments:</text>
    <rect x="28" y="78" width="290" height="42" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="8.5" fill="#0f172a" transform="translate(36, 92)">
      <text x="0" y="0">ToolCall("compile", {</text>
      <text x="10" y="14">"commit": "9a4f2b", "target": "//engine" })</text>
    </g>
    <text x="28" y="140" font-size="9.5" fill="#64748b">Expensive container execution (14.5 s un-cached)</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="328" y1="95" x2="356" y2="95" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Hash Computation -->
    <rect x="358" y="36" width="250" height="118" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="368" y="54" font-size="11" font-weight="700" fill="#0f172a">Content-Addressed Hash</text>
    <text x="368" y="70" font-size="10" fill="#475569">Deterministic canonical hash:</text>
    <rect x="368" y="78" width="230" height="42" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="376" y="93" font-size="8.5" font-family="ui-monospace, monospace" fill="#6b21a8">k_tool = SHA-256(name ‖ args)</text>
    <text x="376" y="108" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Hash: e3b0c44298fc1c14...</text>
    <text x="368" y="140" font-size="9.5" fill="#047857">Lookup: Table Hit in 0.8 ms</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="608" y1="95" x2="636" y2="95" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Stored Observation -->
    <rect x="638" y="36" width="284" height="118" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="648" y="54" font-size="11" font-weight="700" fill="#0f172a">Byte-Identical Output Stream</text>
    <text x="648" y="70" font-size="10" fill="#475569">Deterministic observation text:</text>
    <rect x="648" y="78" width="264" height="42" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="8.5" fill="#065f46" transform="translate(656, 92)">
      <text x="0" y="0">"Build complete. 48 targets up-to-date."</text>
      <text x="0" y="14">"Binary hash: 0x8a91c0e (1,400 tokens)"</text>
    </g>
    <text x="648" y="140" font-size="9.5" font-weight="600" fill="#0369a1">Preserves byte-for-byte token alignment</text>
  </g>

  <!-- Coupling Arrow: Gateway -> GPU Radix Cache -->
  <line x1="500" y1="190" x2="500" y2="226" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>
  <rect x="365" y="198" width="270" height="20" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="500" y="212" font-size="9.5" font-weight="600" fill="#047857" text-anchor="middle">Deterministic Observation Tokens Appended to Prompt</text>

  <!-- ================================================================= -->
  <!-- LOWER SECTION: GPU RADIX-TREE PREFIX CACHE (vLLM / SGLang)        -->
  <!-- ================================================================= -->
  <g transform="translate(30, 228)">
    <rect x="0" y="0" width="940" height="370" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 370 0 Q 374 0 374 4 L 374 24 L 0 24 Z" fill="#e0f2fe"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.04em">GPU RADIX-TREE KV PREFIX CACHE (SERVING ENGINE)</text>
    <text x="928" y="16" font-size="10.5" font-weight="600" fill="#0284c7" text-anchor="end">Physical Memory Frame Reuse</text>

    <!-- Tree Layout -->
    <!-- Root Node -->
    <rect x="30" y="140" width="110" height="50" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="85" y="160" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Radix Root</text>
    <text x="85" y="176" font-size="9" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">Prefix \0</text>

    <!-- Edge Root -> Node 1 -->
    <line x1="140" y1="165" x2="208" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <rect x="146" y="145" width="56" height="15" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="174" y="156" font-size="8" font-family="ui-monospace, monospace" fill="#334155" text-anchor="middle">[0..511]</text>

    <!-- Node 1: System Prompt -->
    <rect x="210" y="130" width="150" height="70" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="220" y="150" font-size="10.5" font-weight="700" fill="#0f172a">Node 1: System Prompt</text>
    <text x="220" y="166" font-size="9" fill="#475569">Shared system instructions</text>
    <text x="220" y="182" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">KV Frames: F_0 .. F_31</text>

    <!-- Edge Node 1 -> Node 2 -->
    <line x1="360" y1="165" x2="428" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <rect x="364" y="145" width="60" height="15" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="394" y="156" font-size="8" font-family="ui-monospace, monospace" fill="#334155" text-anchor="middle">[512..1535]</text>

    <!-- Node 2: Trajectory Context -->
    <rect x="430" y="130" width="160" height="70" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="440" y="150" font-size="10.5" font-weight="700" fill="#0f172a">Node 2: Prior Trajectory</text>
    <text x="440" y="166" font-size="9" fill="#475569">User query &amp; steps 1..t-1</text>
    <text x="440" y="182" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">KV Frames: F_32 .. F_95</text>

    <!-- Branch Fork from Node 2 -->
    <!-- Branch A: Divergent / Cache Miss (Upper Path) -->
    <path d="M 590 145 C 625 145, 625 85, 678 85" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-rose)"/>
    <!-- Branch A Label Box -->
    <rect x="586" y="98" width="82" height="24" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="627" y="110" font-size="7.5" font-family="ui-monospace, monospace" fill="#9f1239" text-anchor="middle">Non-Deterministic</text>
    <text x="627" y="119" font-size="7" font-family="ui-monospace, monospace" fill="#be123c" text-anchor="middle">[Mismatch]</text>

    <!-- Node 3a: Cache Miss Node -->
    <rect x="680" y="45" width="240" height="85" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="690" y="64" font-size="10.5" font-weight="700" fill="#9f1239">Branch A: Prefix Cache MISS</text>
    <text x="690" y="80" font-size="9.5" fill="#475569">Uncached / non-deterministic tokens</text>
    <rect x="690" y="88" width="220" height="34" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="696" y="101" font-size="8.5" font-family="ui-monospace, monospace" fill="#be123c">Allocates fresh frames F_180..F_267</text>
    <text x="696" y="114" font-size="8.5" font-family="ui-monospace, monospace" fill="#be123c">Compute-heavy prefill GEMM (450 ms)</text>

    <!-- Branch B: Memoized / Cache Hit (Lower Path) -->
    <path d="M 590 185 C 625 185, 625 245, 678 245" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>
    <!-- Branch B Label Box -->
    <rect x="586" y="200" width="82" height="24" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="627" y="212" font-size="7.5" font-family="ui-monospace, monospace" fill="#065f46" text-anchor="middle">Byte-Identical</text>
    <text x="627" y="221" font-size="7" font-family="ui-monospace, monospace" fill="#047857" text-anchor="middle">[1536..2935]</text>

    <!-- Node 3b: Cache Hit Node -->
    <rect x="680" y="205" width="240" height="85" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <text x="690" y="224" font-size="10.5" font-weight="700" fill="#065f46">Branch B: Prefix Cache HIT</text>
    <text x="690" y="240" font-size="9.5" fill="#475569">Matched memoized observation tokens</text>
    <rect x="690" y="248" width="220" height="34" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="696" y="261" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857">Reuses existing frames F_96..F_179</text>
    <text x="696" y="274" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857">Zero prefill FLOPs; TTFT &lt; 1.5 ms</text>

    <!-- Continuing path from Node 3b: Generation -->
    <line x1="800" y1="290" x2="800" y2="315" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
    <rect x="680" y="316" width="240" height="42" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="690" y="333" font-size="10" font-weight="700" fill="#0f172a">Turn t+1 Autoregressive Decode</text>
    <text x="690" y="348" font-size="8.5" font-family="ui-monospace, monospace" fill="#0369a1">Token [2936]: model emits next thought</text>

    <!-- Tree Legend/Annotations -->
    <g transform="translate(30, 305)">
      <rect x="0" y="0" width="560" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="14" y="18" font-size="10" font-weight="700" fill="#0f172a">Radix Prefix Tree Invariant:</text>
      <text x="14" y="33" font-size="9.5" fill="#475569">Deterministic serialization · identical radix path</text>
      
    </g>
  </g>
</svg>