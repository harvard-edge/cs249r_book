<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- Title Header Bar -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="920" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="25" font-size="14" font-weight="700" fill="#0f172a">Observation Stream Ingestion &amp; Sandwich Truncation Architecture</text>
    <text x="904" y="25" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Complete Mediation &amp; Backpressure Boundary</text>
  </g>

  <!-- Step 1: Child Process stdout/stderr -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="160" height="380" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="4" fill="#ffe4e6"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#9f1239">1. Unbounded Producer</text>
    
    <g transform="translate(12, 40)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#0f172a">Child Subprocess</text>
      <text x="0" y="28" font-size="9" fill="#475569">e.g. `pytest -v tests/`</text>
      
      <rect x="0" y="40" width="136" height="110" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
      <text x="8" y="56" font-family="monospace" font-size="8.5" fill="#e11d48">test_0001: PASS</text>
      <text x="8" y="70" font-family="monospace" font-size="8.5" fill="#e11d48">test_0002: PASS</text>
      <text x="8" y="84" font-family="monospace" font-size="8.5" fill="#64748b">... 500k lines ...</text>
      <text x="8" y="98" font-family="monospace" font-size="8.5" fill="#e11d48">test_4499: FAIL</text>
      <text x="8" y="112" font-family="monospace" font-size="8.5" fill="#e11d48">test_4500: PASS</text>
      <text x="8" y="138" font-size="9" font-weight="600" fill="#9f1239">Volume: ~80 MB</text>

      <rect x="0" y="190" width="136" height="80" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="206" font-size="8.5" font-weight="700" fill="#334155">Execution Entropy:</text>
      <text x="8" y="222" font-size="8" fill="#475569">• Repetitive passes</text>
      <text x="8" y="236" font-size="8" fill="#475569">• Low-entropy flood</text>
      <text x="8" y="250" font-size="8" fill="#e11d48">• Threatens context</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M200, 260 L230, 260" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="215" y="250" text-anchor="middle" font-size="8" font-weight="600" fill="#9f1239">pipe()</text>

  <!-- Step 2: Kernel Pipe & Epoll Reactor -->
  <g transform="translate(235, 80)">
    <rect x="0" y="0" width="160" height="380" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="4" fill="#e2e8f0"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#1e293b">2. OS Backpressure</text>
    
    <g transform="translate(12, 40)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#0f172a">Kernel Pipe Buffer</text>
      <text x="0" y="28" font-size="9" fill="#475569">Capacity: 64 KB (POSIX)</text>
      
      <rect x="0" y="40" width="136" height="70" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="60" font-size="8.5" font-weight="600" fill="#0f172a">• O_NONBLOCK reads</text>
      <text x="8" y="76" font-size="8.5" fill="#475569">• Child throttled if</text>
      <text x="8" y="90" font-size="8.5" fill="#475569">  buffer fills</text>

      <rect x="0" y="130" width="136" height="140" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="150" font-size="9" font-weight="700" fill="#0f172a">Reactor Loop</text>
      <text x="8" y="168" font-size="8.5" fill="#475569">• epoll_wait() / kqueue</text>
      <text x="8" y="184" font-size="8.5" fill="#475569">• Async stream chunks</text>
      <text x="8" y="200" font-size="8.5" fill="#475569">• Wall-clock deadline</text>
      <text x="8" y="216" font-size="8.5" font-weight="600" fill="#d97706">• Yields host thread</text>
      <text x="8" y="232" font-size="8.5" fill="#475569">• Zero CPU spin</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M395, 260 L425, 260" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 3: Fixed-Capacity Ring Buffer -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="175" height="380" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="28" rx="4" fill="#e0f2fe"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#0369a1">3. Circular Ring Buffer</text>
    
    <g transform="translate(12, 40)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#0f172a">In-Memory Escrow</text>
      <text x="0" y="28" font-size="9" fill="#475569">Bound: C = 1.0 MB RAM</text>

      <!-- Ring Buffer Visual Diagram -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="151" height="150" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
        
        <!-- Circular buffer blocks -->
        <rect x="15" y="15" width="121" height="24" rx="2" fill="#0284c7" opacity="0.9"/>
        <text x="75" y="31" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Head Buffer (First 200 lines)</text>

        <rect x="15" y="45" width="121" height="40" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3"/>
        <text x="75" y="63" text-anchor="middle" font-size="8" font-weight="600" fill="#64748b">Discard Window</text>
        <text x="75" y="76" text-anchor="middle" font-size="7.5" fill="#94a3b8">(Overwritten on wrap)</text>

        <rect x="15" y="91" width="121" height="24" rx="2" fill="#0369a1" opacity="0.9"/>
        <text x="75" y="107" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">Tail Buffer (Last 200 lines)</text>

        <text x="75" y="132" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">Head/Tail Pointer Tracking</text>
      </g>

      <rect x="0" y="205" width="151" height="65" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
      <text x="8" y="222" font-size="8.5" font-weight="700" fill="#0369a1">Physical Bound:</text>
      <text x="8" y="238" font-size="8" fill="#475569">• Prevents host OOM</text>
      <text x="8" y="252" font-size="8" fill="#475569">• Streaming bytes trapped</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M605, 260 L635, 260" stroke="#d97706" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Step 4: Normalization & Sandwich Truncation -->
  <g transform="translate(640, 80)">
    <rect x="0" y="0" width="165" height="380" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="28" rx="4" fill="#fef3c7"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#92400e">4. Sandwich Filter</text>
    
    <g transform="translate(12, 38)">
      <text x="0" y="14" font-size="10" font-weight="700" fill="#0f172a">Sanitization &amp; Splice</text>
      <text x="0" y="28" font-size="8.5" fill="#475569">Extract High-Signal Cues</text>

      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="141" height="155" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        
        <!-- Head slice -->
        <rect x="6" y="8" width="129" height="32" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="22" font-size="8" font-weight="700" fill="#065f46">Head: Invocation Context</text>
        <text x="12" y="34" font-size="7.5" fill="#047857">Config flags, suite banner</text>

        <!-- Truncation Sentinel -->
        <rect x="6" y="46" width="129" height="36" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
        <text x="12" y="60" font-size="8" font-weight="700" fill="#991b1b">[... 499,600 lines ...</text>
        <text x="12" y="74" font-size="7.5" font-weight="600" fill="#b91c1c">truncated by runtime ...]</text>

        <!-- Tail slice -->
        <rect x="6" y="88" width="129" height="58" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="102" font-size="8" font-weight="700" fill="#065f46">Tail: Terminal Outcome</text>
        <text x="12" y="116" font-size="7.5" fill="#047857">• Stack traces &amp; asserts</text>
        <text x="12" y="128" font-size="7.5" fill="#047857">• Exit code: 1 (SIGCHLD)</text>
        <text x="12" y="140" font-size="7.5" fill="#047857">• ANSI escapes stripped</text>
      </g>

      <rect x="0" y="205" width="141" height="65" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="8" y="222" font-size="8.5" font-weight="700" fill="#92400e">Preserves Invariant:</text>
      <text x="8" y="238" font-size="8" fill="#475569">Model observes both</text>
      <text x="8" y="252" font-size="8" fill="#475569">start setup and failure root</text>
    </g>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <path d="M805, 260 L835, 260" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step 5: Staged Working Context -->
  <g transform="translate(840, 80)">
    <rect x="0" y="0" width="120" height="380" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="28" rx="4" fill="#dcfce7"/>
    <text x="8" y="19" font-size="10.5" font-weight="700" fill="#166534">5. Context Staged</text>
    
    <g transform="translate(8, 40)">
      <text x="0" y="14" font-size="9.5" font-weight="700" fill="#0f172a">Working Memory</text>
      <text x="0" y="28" font-size="8.5" fill="#475569">S_obs &lt;= 2,048 tok</text>

      <rect x="0" y="40" width="104" height="150" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="6" y="56" font-size="8" font-weight="700" fill="#15803d">&lt;observation&gt;</text>
      <text x="6" y="70" font-family="monospace" font-size="7" fill="#334155">status: "failure"</text>
      <text x="6" y="82" font-family="monospace" font-size="7" fill="#334155">exit_code: 1</text>
      <text x="6" y="94" font-family="monospace" font-size="7" fill="#334155">head_lines: [...]</text>
      <text x="6" y="106" font-family="monospace" font-size="7" fill="#b91c1c">truncated: true</text>
      <text x="6" y="118" font-family="monospace" font-size="7" fill="#334155">tail_lines: [...]</text>
      <text x="6" y="130" font-size="8" font-weight="700" fill="#15803d">&lt;/observation&gt;</text>

      <rect x="0" y="205" width="104" height="65" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="6" y="222" font-size="8" font-weight="700" fill="#166534">KV Cache Safe:</text>
      <text x="6" y="238" font-size="7.5" fill="#475569">Zero HBM spill;</text>
      <text x="6" y="252" font-size="7.5" fill="#475569">TTFT bounded</text>
    </g>
  </g>

  <!-- Bottom Global Summary Banner -->
  <g transform="translate(40, 475)">
    <rect x="0" y="0" width="920" height="30" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="20" font-size="9" font-weight="600" fill="#334155">Systems Guarantee: The unprivileged foundation model receives bounded high-entropy evidence without saturating host memory or accelerator KV cache.</text>
  </g>
</svg>
