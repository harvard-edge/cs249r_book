<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- 1. UNBOUNDED PRODUCER (CHILD PROCESS)                             -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="170" height="420" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 170 0 Q 170 0 170 4 L 170 24 L 0 24 Z" fill="#ffe4e6"/>
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#9f1239">1. CHILD PROCESS</text>

    <rect x="10" y="32" width="150" height="60" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="18" y="48" font-size="10.5" font-weight="700" fill="#0f172a">Unbounded Output</text>
    <text x="18" y="64" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">pytest -v tests/</text>
    <text x="18" y="78" font-size="9" fill="#be123c">Volume: ~80 MB raw</text>

    <!-- Simulated Log Stream -->
    <rect x="10" y="100" width="150" height="230" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="18" y="118" font-size="9.5" font-weight="700" fill="#475569">Raw Stdout Stream</text>
    <g font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" transform="translate(18, 134)">
      <text x="0" y="0" fill="#047857">test_01: PASS</text>
      <text x="0" y="14" fill="#047857">test_02: PASS</text>
      <text x="0" y="28">test_03: PASS</text>
      <text x="0" y="46" fill="#94a3b8">... 500,000 lines</text>
      <text x="0" y="60" fill="#94a3b8">intermediate noise</text>
      <text x="0" y="74" fill="#94a3b8">and progress bars ...</text>
      <text x="0" y="94" fill="#be123c">test_4999: FAIL</text>
      <text x="0" y="108" fill="#be123c">AssertionError: 404</text>
      <text x="0" y="122" fill="#be123c">test_5000: FAIL</text>
    </g>

    <rect x="10" y="340" width="150" height="70" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="18" y="356" font-size="9.5" font-weight="700" fill="#be123c">Memory Hazard:</text>
    <text x="18" y="372" font-size="8.5" fill="#475569">Direct buffer read</text>
    <text x="18" y="386" font-size="8.5" fill="#475569">saturates host RAM</text>
    <text x="18" y="400" font-size="8.5" fill="#475569">and blows KV cache</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="210" x2="218" y2="210" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-rose)"/>
  <text x="204" y="200" font-size="8" font-family="ui-monospace, monospace" fill="#be123c" text-anchor="middle">pipe(2)</text>

  <!-- ================================================================= -->
  <!-- 2. OS KERNEL PIPE & REACTOR LOOP                                  -->
  <!-- ================================================================= -->
  <g transform="translate(220, 20)">
    <rect x="0" y="0" width="175" height="420" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 175 0 Q 175 0 175 4 L 175 24 L 0 24 Z" fill="#e2e8f0"/>
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#334155">2. KERNEL PIPE &amp; REACTOR</text>

    <!-- Kernel Pipe Buffer -->
    <rect x="10" y="32" width="155" height="170" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="50" font-size="10.5" font-weight="700" fill="#0f172a">Kernel Pipe Buffer</text>
    <text x="18" y="66" font-size="9" fill="#475569">Capacity: 64 KB (POSIX)</text>
    <rect x="18" y="74" width="139" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="88" font-size="8.5" font-family="ui-monospace, monospace" fill="#0369a1">O_NONBLOCK reads</text>
    <text x="24" y="100" font-size="8" fill="#64748b">Child throttled on full</text>

    <text x="18" y="126" font-size="9" font-weight="700" fill="#334155">Backpressure Mechanism:</text>
    <text x="18" y="142" font-size="8.5" fill="#475569">Child write blocks when</text>
    <text x="18" y="156" font-size="8.5" fill="#475569">pipe hits 64 KB capacity;</text>
    <text x="18" y="170" font-size="8.5" fill="#475569">host throttles ingestion.</text>
    <text x="18" y="190" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857">Guarantees bounded RAM</text>

    <!-- Host Reactor Loop -->
    <rect x="10" y="210" width="155" height="200" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="228" font-size="10.5" font-weight="700" fill="#0f172a">Host Reactor Loop</text>
    <text x="18" y="244" font-size="9" fill="#475569">Non-blocking multiplexing</text>
    <rect x="18" y="252" width="139" height="36" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="266" font-size="8.5" font-family="ui-monospace, monospace" fill="#334155">epoll_wait() / kqueue</text>
    <text x="24" y="280" font-size="8" fill="#64748b">Asynchronous chunk I/O</text>

    <text x="18" y="306" font-size="9" fill="#475569">• Yields host thread on wait</text>
    <text x="18" y="322" font-size="9" fill="#475569">• Wall-clock deadline timer</text>
    <text x="18" y="338" font-size="9" fill="#475569">• SIGCHLD exit interception</text>
    <text x="18" y="354" font-size="9" fill="#475569">• Zero CPU spinlock</text>
    <rect x="18" y="364" width="139" height="36" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="379" font-size="8.5" font-family="ui-monospace, monospace" fill="#0369a1">Reactor Invariant:</text>
    <text x="24" y="392" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Zero thread starvation</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="395" y1="210" x2="423" y2="210" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- 3. CIRCULAR RING BUFFER (MEMORY ESCROW)                           -->
  <!-- ================================================================= -->
  <g transform="translate(425, 20)">
    <rect x="0" y="0" width="180" height="420" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 180 0 Q 180 0 180 4 L 180 24 L 0 24 Z" fill="#e0f2fe"/>
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#0369a1">3. CIRCULAR RING BUFFER</text>

    <rect x="10" y="32" width="160" height="50" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="18" y="48" font-size="10.5" font-weight="700" fill="#0f172a">In-Memory Escrow</text>
    <text x="18" y="64" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">Bound C ≤ 1.0 MB RAM</text>

    <!-- Ring buffer visual representation -->
    <rect x="10" y="90" width="160" height="230" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="18" y="108" font-size="9.5" font-weight="700" fill="#334155">Dual Stream Windows</text>

    <!-- Head Buffer -->
    <rect x="18" y="120" width="144" height="44" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="26" y="136" font-size="9.5" font-weight="700" fill="#065f46">Head Buffer (200 lines)</text>
    <text x="26" y="152" font-size="8" font-family="ui-monospace, monospace" fill="#047857">Locked upon fill; immutable</text>

    <!-- Discard / Drop Window -->
    <rect x="18" y="172" width="144" height="52" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="90" y="194" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">Discard Window</text>
    <text x="90" y="210" font-size="8" font-family="ui-monospace, monospace" fill="#94a3b8" text-anchor="middle">Overwritten on wrap</text>

    <!-- Tail Buffer -->
    <rect x="18" y="232" width="144" height="44" rx="2" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="26" y="248" font-size="9.5" font-weight="700" fill="#0369a1">Tail Ring (200 lines)</text>
    <text x="26" y="264" font-size="8" font-family="ui-monospace, monospace" fill="#0284c7">Rolling circular overwrite</text>

    <text x="18" y="300" font-size="8.5" fill="#475569">Head &amp; tail pointers track</text>
    <text x="18" y="312" font-size="8.5" fill="#475569">stream boundaries in RAM</text>

    <rect x="10" y="330" width="160" height="80" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="18" y="348" font-size="9.5" font-weight="700" fill="#0369a1">Physical Guarantee:</text>
    <text x="18" y="364" font-size="8.5" fill="#475569">• Constant memory footprint</text>
    <text x="18" y="378" font-size="8.5" fill="#475569">• Head preserves config args</text>
    <text x="18" y="392" font-size="8.5" fill="#475569">• Tail preserves failure root</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="605" y1="210" x2="633" y2="210" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- 4. SANDWICH FILTER (SPLICE & TRUNCATE)                            -->
  <!-- ================================================================= -->
  <g transform="translate(635, 20)">
    <rect x="0" y="0" width="170" height="420" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 170 0 Q 170 0 170 4 L 170 24 L 0 24 Z" fill="#fef3c7"/>
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#92400e">4. SANDWICH FILTER</text>

    <rect x="10" y="32" width="150" height="50" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="18" y="48" font-size="10.5" font-weight="700" fill="#0f172a">Splice &amp; Sanitize</text>
    <text x="18" y="64" font-size="8.5" fill="#475569">Extracts diagnostic cues</text>

    <!-- Spliced Structure Visual -->
    <rect x="10" y="90" width="150" height="230" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>

    <!-- Head Box -->
    <rect x="18" y="104" width="134" height="48" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="120" font-size="9" font-weight="700" fill="#065f46">Head: Context</text>
    <text x="24" y="134" font-size="8" fill="#475569">Config flags, suite</text>
    <text x="24" y="146" font-size="8" fill="#475569">banner, setup logs</text>

    <!-- Omission Tombstone Box -->
    <rect x="18" y="160" width="134" height="56" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="85" y="176" font-size="8" font-family="ui-monospace, monospace" fill="#be123c" text-anchor="middle">[... 499,600 lines</text>
    <text x="85" y="188" font-size="8" font-family="ui-monospace, monospace" fill="#be123c" text-anchor="middle">omitted by runtime</text>
    <text x="85" y="200" font-size="8" font-family="ui-monospace, monospace" fill="#be123c" text-anchor="middle">tombstone ...]</text>

    <!-- Tail Box -->
    <rect x="18" y="224" width="134" height="58" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="240" font-size="9" font-weight="700" fill="#065f46">Tail: Diagnostics</text>
    <text x="24" y="254" font-size="8" fill="#475569">Stack trace, exit</text>
    <text x="24" y="266" font-size="8" fill="#475569">code, assertion root,</text>
    <text x="24" y="278" font-size="8" fill="#475569">ANSI escapes stripped</text>

    <rect x="10" y="330" width="150" height="80" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="18" y="348" font-size="9.5" font-weight="700" fill="#92400e">Preserves Invariant:</text>
    <text x="18" y="364" font-size="8.5" fill="#475569">Model observes both</text>
    <text x="18" y="378" font-size="8.5" fill="#475569">invocation flags and</text>
    <text x="18" y="392" font-size="8.5" fill="#475569">terminal failure cause</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="805" y1="210" x2="833" y2="210" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- ================================================================= -->
  <!-- 5. STAGED CONTEXT (MODEL WORKING MEMORY)                          -->
  <!-- ================================================================= -->
  <g transform="translate(835, 20)">
    <rect x="0" y="0" width="145" height="420" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 145 0 Q 145 0 145 4 L 145 24 L 0 24 Z" fill="#dcfce7"/>
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#065f46">5. CONTEXT STAGED</text>

    <rect x="10" y="32" width="125" height="50" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="48" font-size="10.5" font-weight="700" fill="#0f172a">Working Memory</text>
    <text x="16" y="64" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857">S_obs ≤ 2,048 tok</text>

    <!-- Structured XML Context Frame -->
    <rect x="10" y="90" width="125" height="230" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="8" fill="#0f172a" transform="translate(16, 108)">
      <text x="0" y="0" fill="#0369a1">&lt;observation&gt;</text>
      <text x="6" y="14"><tspan fill="#64748b">exit_code=</tspan>"1"</text>
      <text x="6" y="28"><tspan fill="#64748b">truncated=</tspan>"true"</text>
      <text x="6" y="42"><tspan fill="#64748b">duration=</tspan>"14s"</text>
      <text x="6" y="60" fill="#047857">&lt;head&gt;</text>
      <text x="10" y="74">test_01: PASS</text>
      <text x="6" y="88" fill="#047857">&lt;/head&gt;</text>
      <text x="6" y="106" fill="#be123c">&lt;omitted n=499k/&gt;</text>
      <text x="6" y="124" fill="#047857">&lt;tail&gt;</text>
      <text x="10" y="138">Assert: 404</text>
      <text x="6" y="152" fill="#047857">&lt;/tail&gt;</text>
      <text x="0" y="170" fill="#0369a1">&lt;/observation&gt;</text>
    </g>

    <rect x="10" y="330" width="125" height="80" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="348" font-size="9.5" font-weight="700" fill="#065f46">KV Budget Safe:</text>
    <text x="16" y="364" font-size="8.5" fill="#475569">Zero HBM spill;</text>
    <text x="16" y="378" font-size="8.5" fill="#475569">TTFT bounded;</text>
    <text x="16" y="392" font-size="8.5" fill="#475569">deterministic slots</text>
  </g>
</svg>
