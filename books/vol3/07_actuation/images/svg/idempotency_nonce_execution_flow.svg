<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="960" height="520" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary Framing Card -->

  <!-- ================================================================= -->
  <!-- COLUMN 1: TRAJECTORY NONCE SYNTHESIS                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="275" height="376" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="275" height="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#6d28d9">1. Trajectory Nonce Synthesis</text>

    <!-- Subcard 1: Mutating Tool Call Emitted -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="251" height="98" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Mutating Tool Call Emitted</text>
      <text x="10" y="32" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">{ "tool": "transfer_funds",</text>
      <text x="18" y="45" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">  "amount": 5000,</text>
      <text x="18" y="58" font-family="Courier, monospace" font-size="8.0" fill="#0f172a">  "recipient": "acct-9842" }</text>
      <rect x="10" y="68" width="231" height="20" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="125" y="81" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Non-Idempotent Real-World Action</text>
    </g>

    <!-- Subcard 2: Cryptographic Nonce Generator -->
    <g transform="translate(12, 138)">
      <rect x="0" y="0" width="251" height="118" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6d28d9">Cryptographic Nonce Generator</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">Combines trajectory context invariants:</text>
      <rect x="10" y="40" width="231" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="54" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">η = SHA256(SessionID || StepNum ||</text>
      <text x="24" y="66" font-family="Courier, monospace" font-size="8.0" fill="#6d28d9">ToolName || CanonicalJSON(args))</text>
      <text x="10" y="90" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">Key: <tspan fill="#6d28d9">idem_8f3d1b94...</tspan></text>
      <text x="10" y="104" font-size="8.0" font-weight="700" fill="#15803d">✓ Survives agent retry and crash loops</text>
    </g>

    <!-- Subcard 3: Outbound RPC with Header -->
    <g transform="translate(12, 264)">
      <rect x="0" y="0" width="251" height="100" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Outbound RPC with Header</text>
      <text x="10" y="34" font-family="Courier, monospace" font-size="8.0" fill="#475569">POST /mcp/tools/call</text>
      <text x="10" y="48" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#6d28d9">Idempotency-Key: idem_8f3d1b94</text>
      <text x="10" y="62" font-family="Courier, monospace" font-size="8.0" fill="#475569">Payload: { tool: "transfer_funds" }</text>
      <text x="10" y="82" font-size="8.0" fill="#0284c7">Transmitted over stdio / HTTP SSE</text>
    </g>
  </g>

  <!-- Flow Arrow from Step 1 to Step 2 -->
  <line x1="315" y1="262" x2="333" y2="262" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: IDEMPOTENCY FILTER & LOCK GATEWAY                       -->
  <!-- ================================================================= -->
  <g transform="translate(335, 74)">
    <rect x="0" y="0" width="330" height="376" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#b45309">2. Idempotency Filter &amp; Lock Gateway</text>

    <!-- Subcard 1: State Store Lookup -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="306" height="122" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#b45309">Distributed State Store Lookup (Redis / DynamoDB)</text>
      
      <rect x="10" y="24" width="286" height="22" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="39" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">GET idem_8f3d1b94 → Check State</text>

      <!-- Three Branches -->
      <g transform="translate(10, 52)">
        <rect x="0" y="0" width="90" height="58" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
        <text x="45" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">NOT FOUND</text>
        <text x="45" y="28" text-anchor="middle" font-size="8.0" fill="#15803d">First Execution</text>
        <text x="45" y="44" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">→ Acquire Lock</text>

        <rect x="98" y="0" width="90" height="58" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="143" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">IN_FLIGHT</text>
        <text x="143" y="28" text-anchor="middle" font-size="8.0" fill="#b45309">Concurrent Retry</text>
        <text x="143" y="44" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b45309">→ Wait / 409</text>

        <rect x="196" y="0" width="90" height="58" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
        <text x="241" y="15" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">COMPLETED</text>
        <text x="241" y="28" text-anchor="middle" font-size="8.0" fill="#0369a1">Previous Success</text>
        <text x="241" y="44" text-anchor="middle" font-size="8.0" font-weight="700" fill="#0369a1">→ Return Cache</text>
      </g>
    </g>

    <!-- Subcard 2: Deduplication Replay Fast-Path -->
    <g transform="translate(12, 162)">
      <rect x="0" y="0" width="306" height="102" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Deduplication Replay Fast-Path (Cache Hit)</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">If state is <tspan font-weight="700">COMPLETED</tspan>, bypass tool sandbox completely:</text>
      
      <rect x="10" y="38" width="286" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="52" font-family="Courier, monospace" font-size="8.0" fill="#15803d">HTTP 200 OK: {"status": "success", "tx_id": "9842"}</text>
      <text x="16" y="64" font-size="8.0" fill="#64748b">X-Cache-Lookup: HIT (Zero external calls executed)</text>

      <rect x="10" y="78" width="286" height="16" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="153" y="89" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">PROTECTED: PREVENTS DUPLICATE $5,000 TRANSFER</text>
    </g>

    <!-- Subcard 3: Atomic Lock Lease Acquisition -->
    <g transform="translate(12, 272)">
      <rect x="0" y="0" width="306" height="92" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Atomic Lock Lease Acquisition</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">For first attempt, acquire distributed lease:</text>
      <rect x="10" y="38" width="286" height="24" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="54" font-family="Courier, monospace" font-size="8.0" font-weight="700" fill="#0f172a">SET key "IN_FLIGHT" NX PX 30000</text>
      <text x="10" y="76" font-size="8.0" font-weight="700" fill="#15803d">✓ Heartbeat watchdog extends lease during long tasks</text>
    </g>
  </g>

  <!-- Flow Arrow from Step 2 to Step 3 -->
  <line x1="665" y1="262" x2="683" y2="262" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: EXECUTION, WAL & STATE COMMIT                           -->
  <!-- ================================================================= -->
  <g transform="translate(685, 74)">
    <rect x="0" y="0" width="235" height="376" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#15803d">3. Execution &amp; WAL Commit</text>

    <!-- Subcard 1: Write-Ahead Log -->
    <g transform="translate(12, 32)">
      <rect x="0" y="0" width="211" height="90" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Write-Ahead Log (WAL)</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">• Appends intent record before mutate</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">• Stores compensating saga inverse C_i</text>
      <text x="10" y="58" font-size="8.0" fill="#b45309">⚠ Enables crash recovery on reboot</text>
      <rect x="10" y="68" width="100" height="14" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="60" y="78" text-anchor="middle" font-family="Courier, monospace" font-size="8.0" fill="#475569">WAL Append-Only</text>
    </g>

    <!-- Subcard 2: Sandbox Execution Engine -->
    <g transform="translate(12, 130)">
      <rect x="0" y="0" width="211" height="96" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Isolated Sandbox Execution</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">• Dispatches to physical backend</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">• Captures stdout, stderr, exit code</text>
      <text x="10" y="58" font-size="8.0" fill="#475569">• Enforces timeout budgets (e.g. 30s)</text>
      <rect x="10" y="68" width="191" height="20" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="105" y="81" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">Single Physical Side-Effect</text>
    </g>

    <!-- Subcard 3: Atomic State Transition -->
    <g transform="translate(12, 234)">
      <rect x="0" y="0" width="211" height="130" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#15803d">Atomic State Transition</text>
      <text x="10" y="30" font-size="8.0" fill="#475569">1. Commit transaction in DB</text>
      <text x="10" y="44" font-size="8.0" fill="#475569">2. Transition key to <tspan font-weight="700" fill="#0f172a">COMPLETED</tspan></text>
      <text x="10" y="58" font-size="8.0" fill="#475569">3. Cache response payload (TTL 24h)</text>
      <text x="10" y="72" font-size="8.0" fill="#475569">4. Release distributed lease lock</text>
      <rect x="10" y="86" width="191" height="26" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="105" y="99" text-anchor="middle" font-size="8.0" font-weight="700" fill="#15803d">Exactly-Once Semantics</text>
      <text x="105" y="107" text-anchor="middle" font-size="8.0" fill="#16a34a">Guaranteed Across Swarm Retries</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYSTEMS PRINCIPLE CALLOUT                                  -->
  <!-- ================================================================= -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="880" height="66" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect x="12" y="12" width="120" height="18" rx="1" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="72" y="24" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">SYSTEMS PRINCIPLE</text>
    <text x="144" y="25" font-size="9.5" font-weight="700" fill="#0f172a">Autonomous Retry Loops Demand Distributed Idempotency at the Wire Layer</text>
    <text x="144" y="44" font-size="8" fill="#475569">Because stochastic models spontaneously retry ambiguous returns, tools must bind execution to deterministic trajectory nonces to prevent catastrophic duplicate mutations.</text>
  </g>

</g>
</svg>