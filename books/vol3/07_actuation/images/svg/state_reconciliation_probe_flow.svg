<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .decision-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10.5px; fill: #1e293b; }
    </style>
    <marker id="arr-recon-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-recon-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-recon-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-recon-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1080" height="500" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Banner -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">STATE RECONCILIATION PROBE ARCHITECTURE FOR UNCOOPERATIVE ENDPOINTS</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">Closed-Loop Verification Under Ambiguous Network Timeouts</text>

  <!-- Step 1: Initial Dispatch -->
  <rect x="390" y="70" width="300" height="42" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="88" class="box-lbl" fill="#1e40af" text-anchor="middle">1. Dispatch Mutating Tool Call (A)</text>
  <text x="540" y="103" class="box-sub" text-anchor="middle">Precondition captured: s0 = probe_pre(S_env)</text>

  <path d="M 540 112 L 540 132" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-recon-blue)"/>

  <!-- Step 2: Timeout Decision Diamond -->
  <polygon points="540,135 650,170 540,205 430,170" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="168" class="decision-lbl" fill="#92400e" text-anchor="middle">Timeout Elapsed?</text>
  <text x="540" y="182" class="mono" fill="#b45309" text-anchor="middle">Timer &gt; tau_timeout</text>

  <!-- Branch No (Left) -->
  <path d="M 430 170 L 220 170 L 220 230" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-recon-green)"/>
  <text x="320" y="162" class="mono" font-weight="700" fill="#16a34a">No (Success)</text>

  <rect x="110" y="230" width="220" height="46" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="220" y="250" class="box-lbl" fill="#15803d" text-anchor="middle">Normal Return Frame</text>
  <text x="220" y="266" class="box-sub" text-anchor="middle">Observation returned cleanly</text>

  <!-- Branch Yes (Down to Probe) -->
  <path d="M 540 205 L 540 230" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-recon-red)"/>
  <text x="555" y="222" class="mono" font-weight="700" fill="#dc2626">Yes (Ambiguous)</text>

  <!-- Step 3: Dispatch Read-Only Probe -->
  <rect x="420" y="230" width="240" height="46" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="248" class="box-lbl" fill="#991b1b" text-anchor="middle">2. Dispatch Read-Only Probe</text>
  <text x="540" y="264" class="box-sub" text-anchor="middle">Issues nullipotent probe_post(S_env)</text>

  <path d="M 540 276 L 540 298" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-recon-blue)"/>

  <!-- Step 4: Postcondition Met? Diamond -->
  <polygon points="540,300 660,335 540,370 420,335" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="333" class="decision-lbl" fill="#1e40af" text-anchor="middle">Postcondition Met?</text>
  <text x="540" y="347" class="mono" fill="#2563eb" text-anchor="middle">S_env == s_target</text>

  <!-- Branch Postcondition Met (Left) -->
  <path d="M 420 335 L 230 335 L 230 380" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-recon-green)"/>
  <text x="320" y="327" class="mono" font-weight="700" fill="#16a34a">Yes (sigma_sever)</text>

  <!-- Action Already Completed Box -->
  <rect x="100" y="380" width="260" height="48" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="399" class="box-lbl" fill="#15803d" text-anchor="middle">Synthesize Observation Frame</text>
  <text x="230" y="415" class="box-sub" text-anchor="middle">Action succeeded; skip retransmission</text>

  <!-- Branch Postcondition Not Met (Right) -->
  <path d="M 660 335 L 830 335 L 830 350" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-recon-red)"/>
  <text x="730" y="327" class="mono" font-weight="700" fill="#dc2626">No (Check S_env)</text>

  <!-- Step 5: Precondition Met? Diamond -->
  <polygon points="830,350 930,380 830,410 730,380" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="830" y="378" class="decision-lbl" fill="#9a3412" text-anchor="middle">S_env == s0?</text>
  <text x="830" y="392" class="box-sub" text-anchor="middle">Mutation Missed?</text>

  <!-- Precondition Met Branch (Down-Left) -->
  <path d="M 730 380 L 590 380 L 590 410" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-recon-amber)"/>
  <text x="645" y="372" class="mono" font-weight="700" fill="#d97706">Yes (sigma_drop)</text>

  <rect x="465" y="412" width="250" height="42" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="430" class="box-lbl" fill="#92400e" text-anchor="middle">Safe Re-Dispatch Mutate Call</text>
  <text x="590" y="445" class="box-sub" text-anchor="middle">Target unchanged; retry is idempotent</text>

  <!-- Precondition Not Met Branch (Down-Right) -->
  <path d="M 830 410 L 830 422" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-recon-red)"/>
  <text x="845" y="420" class="mono" font-weight="700" fill="#dc2626">No (sigma_crash)</text>

  <rect x="745" y="425" width="220" height="42" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="855" y="442" class="box-lbl" fill="#991b1b" text-anchor="middle">Raise Terminal Fault</text>
  <text x="855" y="457" class="box-sub" text-anchor="middle">Corrupt/drifted state; halt loop</text>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="468" width="1040" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="485" class="card-text"><b>Reconciliation Invariant:</b> Never blindly retransmit across timeouts; verify postconditions with read-only probes before re-dispatch.</text>
</svg>