<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#ffffff"/>

  <!-- Step 1: Initial Dispatch -->
  <g transform="translate(360, 20)">
    <rect x="0" y="0" width="280" height="56" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="140" y="24" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">Dispatch Mutating Tool Call (A)</text>
    <text x="140" y="42" font-size="10" font-family="ui-monospace, monospace" fill="#475569" text-anchor="middle">s_0 = probe_pre(S_env); start timer</text>
  </g>

  <!-- Arrow Step 1 -> Decision 1 -->
  <line x1="500" y1="76" x2="500" y2="108" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Decision 1: Timeout Elapsed? -->
  <g transform="translate(500, 138)">
    <polygon points="0,-26 110,0 0,26 -110,0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="0" y="-3" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Timeout Elapsed?</text>
    <text x="0" y="13" font-size="9" font-family="ui-monospace, monospace" fill="#b45309" text-anchor="middle">timer &gt; τ_timeout</text>
  </g>

  <!-- Branch No: Normal Return -->
  <path d="M 390 138 L 220 138 L 220 188" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <rect x="255" y="118" width="90" height="18" rx="2" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
  <text x="300" y="131" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">No (Success)</text>

  <!-- Normal Return Box -->
  <g transform="translate(100, 190)">
    <rect x="0" y="0" width="240" height="60" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <text x="120" y="24" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Normal Return Frame</text>
    <text x="120" y="42" font-size="9.5" fill="#475569" text-anchor="middle">Observation received within deadline</text>
  </g>

  <!-- Branch Yes: Ambiguous Timeout -> Step 2 -->
  <line x1="500" y1="164" x2="500" y2="204" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-rose)"/>
  <rect x="512" y="174" width="102" height="18" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="563" y="187" font-size="9" font-weight="600" fill="#be123c" text-anchor="middle">Yes (Ambiguous)</text>

  <!-- Step 2: Read-Only Probe -->
  <g transform="translate(360, 206)">
    <rect x="0" y="0" width="280" height="56" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="140" y="24" font-size="11.5" font-weight="700" fill="#9f1239" text-anchor="middle">Dispatch Read-Only Probe</text>
    <text x="140" y="42" font-size="10" font-family="ui-monospace, monospace" fill="#475569" text-anchor="middle">Issues nullipotent probe_post(S_env)</text>
  </g>

  <!-- Arrow Step 2 -> Decision 2 -->
  <line x1="500" y1="262" x2="500" y2="294" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Decision 2: Probe Outcome Evaluation -->
  <g transform="translate(500, 322)">
    <polygon points="0,-26 130,0 0,26 -130,0" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="0" y="-3" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">Probe State Evaluation</text>
    <text x="0" y="13" font-size="9" font-family="ui-monospace, monospace" fill="#0284c7" text-anchor="middle">inspect S_env outcome</text>
  </g>

  <!-- Branch 1: Postcondition Met (Left) -->
  <path d="M 370 322 L 190 322 L 190 398" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <rect x="200" y="300" width="150" height="18" rx="2" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
  <text x="275" y="313" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857" text-anchor="middle">S_env == s_target (σ_sever)</text>

  <!-- Box 1: Synthesize Observation -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="260" height="74" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <text x="130" y="22" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Synthesize Observation Frame</text>
    <text x="130" y="40" font-size="9.5" fill="#475569" text-anchor="middle">Mutation succeeded; network severed</text>
    <text x="130" y="56" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">Skip retransmission (Idempotent)</text>
  </g>

  <!-- Branch 2: Precondition Unchanged (Center) -->
  <line x1="500" y1="348" x2="500" y2="398" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="512" y="362" width="130" height="18" rx="2" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <text x="577" y="375" font-size="8.5" font-family="ui-monospace, monospace" fill="#9a3412" text-anchor="middle">S_env == s_0 (σ_drop)</text>

  <!-- Box 2: Safe Re-Dispatch -->
  <g transform="translate(370, 400)">
    <rect x="0" y="0" width="260" height="74" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="130" y="22" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Safe Re-Dispatch Mutate Call</text>
    <text x="130" y="40" font-size="9.5" fill="#475569" text-anchor="middle">Mutation was never executed by backend</text>
    <text x="130" y="56" font-size="9" font-weight="600" fill="#b45309" text-anchor="middle">Re-dispatch provably free of side effects</text>
  </g>

  <!-- Branch 3: State Corrupted / Inconsistent (Right) -->
  <path d="M 630 322 L 810 322 L 810 398" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-rose)"/>
  <rect x="650" y="300" width="150" height="18" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="725" y="313" font-size="8.5" font-family="ui-monospace, monospace" fill="#be123c" text-anchor="middle">Drifted / Corrupt (σ_crash)</text>

  <!-- Box 3: Terminal Fault -->
  <g transform="translate(680, 400)">
    <rect x="0" y="0" width="260" height="74" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="130" y="22" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">Raise Terminal Fault</text>
    <text x="130" y="40" font-size="9.5" fill="#475569" text-anchor="middle">Partial failure or unrecoverable state</text>
    <text x="130" y="56" font-size="9" font-weight="600" fill="#be123c" text-anchor="middle">Halt loop; trigger compensating saga</text>
  </g>
</svg>