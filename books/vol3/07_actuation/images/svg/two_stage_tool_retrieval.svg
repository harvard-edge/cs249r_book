<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="490" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- LAYER 1: OFFLINE TOOL CATALOG & DENSE VECTOR INDEX                 -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="900" height="96" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 320 0 Q 324 0 324 4 L 324 22 L 0 22 Z" fill="#e2e8f0"/>
    <text x="12" y="15" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.04em">OFFLINE TOOL REGISTRY &amp; DENSE VECTOR INDEX</text>
    <text x="888" y="15" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">Catalog Size M = 3,200 Tools</text>

    <!-- Tool Catalog Cards -->
    <g transform="translate(18, 34)">
      <rect x="0" y="0" width="115" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" font-size="10.5" font-weight="700" fill="#0f172a">T₁: git_commit</text>
      <text x="10" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">schema: 420 tok</text>

      <rect x="125" y="0" width="115" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="135" y="18" font-size="10.5" font-weight="700" fill="#0f172a">T₂: docker_run</text>
      <text x="135" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">schema: 680 tok</text>

      <rect x="250" y="0" width="115" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="260" y="18" font-size="10.5" font-weight="700" fill="#0f172a">T₃: k8s_deploy</text>
      <text x="260" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">schema: 890 tok</text>

      <text x="380" y="28" font-size="14" font-weight="700" fill="#94a3b8">···</text>

      <rect x="410" y="0" width="125" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="420" y="18" font-size="10.5" font-weight="700" fill="#0f172a">T_M: s3_put</text>
      <text x="420" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">schema: 350 tok</text>
    </g>

    <!-- Embedding Index representation -->
    <rect x="575" y="34" width="310" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="587" y="52" font-size="11" font-weight="700" fill="#0f172a">HNSW Vector Index (d = 1,536)</text>
    <text x="587" y="68" font-size="10" font-family="ui-monospace, monospace" fill="#475569">e_i = Embed(Name ‖ Docstring ‖ JSONSchema)</text>
  </g>

  <!-- Flow Connector 1->2 -->
  <line x1="480" y1="116" x2="480" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <rect x="400" y="122" width="160" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="133" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">HNSW Topology Synced</text>

  <!-- ================================================================= -->
  <!-- LAYER 2: STAGE 1 — COARSE MIPS CANDIDATE PRUNING                 -->
  <!-- ================================================================= -->
  <g transform="translate(30, 144)">
    <rect x="0" y="0" width="900" height="136" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 320 0 Q 324 0 324 4 L 324 22 L 0 22 Z" fill="#e0f2fe"/>
    <text x="12" y="15" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.04em">STAGE 1: COARSE MIPS CANDIDATE PRUNING</text>
    <text x="888" y="15" font-size="11" font-weight="600" fill="#0284c7" text-anchor="end">Sub-millisecond Vector Filtering</text>

    <!-- Query Embedding Box -->
    <rect x="18" y="32" width="260" height="90" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="28" y="48" font-size="11" font-weight="700" fill="#0f172a">Trajectory Query s_t</text>
    <text x="28" y="66" font-size="10" fill="#475569">Current thought / execution context:</text>
    <text x="28" y="82" font-size="10" font-family="ui-monospace, monospace" fill="#0369a1">"Rollback failed canary pod"</text>
    <text x="28" y="104" font-size="10" font-family="ui-monospace, monospace" fill="#475569">e_q = DenseEmbed(s_t)</text>

    <!-- Arrow Query -> HNSW -->
    <line x1="280" y1="77" x2="318" y2="77" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- HNSW Traversal Box -->
    <rect x="320" y="32" width="280" height="90" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="330" y="48" font-size="11" font-weight="700" fill="#0f172a">HNSW Beam Search</text>
    <text x="330" y="66" font-size="10" fill="#475569">Maximum Inner Product Search (MIPS):</text>
    <text x="330" y="84" font-size="10.5" font-family="ui-monospace, monospace" fill="#0369a1">score(T_i, s_t) = ⟨e_q, e_i⟩</text>
    <text x="330" y="104" font-size="10" fill="#64748b">Prunes 3,200 tools → top-K entries</text>

    <!-- Arrow HNSW -> Active Set -->
    <line x1="602" y1="77" x2="638" y2="77" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Active Subset Box -->
    <rect x="640" y="32" width="242" height="90" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="650" y="48" font-size="11" font-weight="700" fill="#0f172a">Active Candidate Subset K_t (K = 4)</text>
    <text x="650" y="66" font-size="10" font-family="ui-monospace, monospace" fill="#047857">1. k8s_rollback   2. k8s_status</text>
    <text x="650" y="82" font-size="10" font-family="ui-monospace, monospace" fill="#047857">3. pod_logs       4. alert_query</text>
    <text x="650" y="104" font-size="10" font-weight="600" fill="#0369a1">Context tax: 1.2k tokens (vs 80k)</text>
  </g>

  <!-- Flow Connector 2->3 -->
  <line x1="480" y1="280" x2="480" y2="306" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="375" y="286" width="210" height="16" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="480" y="297" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">Bind Active Subset K_t into Engine</text>

  <!-- ================================================================= -->
  <!-- LAYER 3: STAGE 2 — JIT SCHEMA BINDING & RUNTIME DFA LOGIT MASKING  -->
  <!-- ================================================================= -->
  <g transform="translate(30, 308)">
    <rect x="0" y="0" width="900" height="162" rx="4" fill="#f8fafc" stroke="#059669" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 370 0 Q 374 0 374 4 L 374 22 L 0 22 Z" fill="#dcfce7"/>
    <text x="12" y="15" font-size="11" font-weight="700" fill="#065f46" letter-spacing="0.04em">STAGE 2: JIT SCHEMA BINDING &amp; RUNTIME LOGIT MASKING</text>
    <text x="888" y="15" font-size="11" font-weight="600" fill="#059669" text-anchor="end">GPU Execution &amp; Grammar Guarantee</text>

    <!-- Step 1: Context Injection -->
    <rect x="18" y="32" width="265" height="116" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="28" y="50" font-size="11.5" font-weight="700" fill="#0f172a">1. JIT Context Injection</text>
    <text x="28" y="68" font-size="10.5" fill="#475569">Injects only active K=4 JSON schemas</text>
    <text x="28" y="86" font-size="10.5" fill="#475569">Preserves KV cache capacity for steps</text>
    <rect x="28" y="96" width="245" height="42" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="36" y="112" font-size="10" font-family="ui-monospace, monospace" fill="#065f46">Prompt footprint: 1.2k tok</text>
    <text x="36" y="126" font-size="10" font-family="ui-monospace, monospace" fill="#065f46">Prompt tax pruned by 98.5%</text>

    <!-- Arrow Step 1 -> Step 2 -->
    <line x1="285" y1="90" x2="328" y2="90" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>

    <!-- Step 2: DFA Grammar Compilation -->
    <rect x="330" y="32" width="265" height="116" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="340" y="50" font-size="11.5" font-weight="700" fill="#0f172a">2. Runtime DFA Masking</text>
    <text x="340" y="68" font-size="10.5" fill="#475569">Compiles K schemas into state machine:</text>
    <text x="340" y="86" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">M_t = BuildBitmask(DFA_K)</text>
    <rect x="340" y="96" width="245" height="42" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="348" y="112" font-size="10" font-family="ui-monospace, monospace" fill="#065f46">M_t ∈ {0, -∞}^|V|</text>
    <text x="348" y="126" font-size="10" font-family="ui-monospace, monospace" fill="#065f46">Drives invalid tokens to -∞</text>

    <!-- Arrow Step 2 -> Step 3 -->
    <line x1="597" y1="90" x2="638" y2="90" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>

    <!-- Step 3: GPU Forward Pass -->
    <rect x="640" y="32" width="242" height="116" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="650" y="50" font-size="11.5" font-weight="700" fill="#0f172a">3. Masked Decode Step</text>
    <text x="650" y="68" font-size="10.5" fill="#475569">Applies mask to raw logits z_t:</text>
    <text x="650" y="86" font-size="10.5" font-family="ui-monospace, monospace" fill="#0f172a">z'_t = z_t + M_t</text>
    <rect x="650" y="96" width="222" height="42" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="658" y="112" font-size="10" font-family="ui-monospace, monospace" fill="#065f46">P(valid_schema) = 1.0</text>
    <text x="658" y="126" font-size="10" font-family="ui-monospace, monospace" fill="#065f46">Zero syntax hallucinations</text>
  </g>
</svg>