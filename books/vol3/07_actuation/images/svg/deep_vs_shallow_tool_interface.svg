<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .card-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .node-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .footer-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0369a1; text-transform: uppercase; letter-spacing: 0.5px; }
      .footer-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(35, 25)">
    <text x="0" y="20" class="header-title">Tool Catalog Granularity: Shallow vs. Deep Interfaces</text>
    <text x="0" y="38" class="header-sub">Ousterhout's Interface Depth applied to agent actuation and stochastic inference loops</text>
  </g>

  <!-- LEFT PANEL: Shallow Interface -->
  <g transform="translate(35, 80)">
    <rect width="485" height="325" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 477 0 Q 485 0 485 8 L 485 38 L 0 38 Z" fill="#fef2f2" />
    
    <text x="16" y="24" class="card-title" fill="#991b1b">Shallow Interface (Fine-Grained)</text>
    <text x="470" y="24" class="card-subtitle" fill="#dc2626" text-anchor="end">Low Leverage • High Overhead</text>

    <!-- Content Nodes: Shallow -->
    <!-- Node 1: Agent Loop -->
    <g transform="translate(18, 52)">
      <rect width="130" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="65" y="26" class="node-text" text-anchor="middle" fill="#1e40af">Agent Core</text>
    </g>

    <!-- Node 2: Primitive Sequence -->
    <g transform="translate(195, 48)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="130" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="65" y="18" class="node-code" text-anchor="middle">open_file(path)</text>
      
      <!-- Step 2 -->
      <rect x="0" y="36" width="130" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="65" y="54" class="node-code" text-anchor="middle">seek(offset)</text>

      <!-- Step 3 -->
      <rect x="0" y="72" width="130" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="65" y="90" class="node-code" text-anchor="middle">write(bytes)</text>

      <!-- Step 4 -->
      <rect x="0" y="108" width="130" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="65" y="126" class="node-code" text-anchor="middle">close_file()</text>
    </g>

    <!-- Node 3: Environment -->
    <g transform="translate(370, 78)">
      <rect width="95" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="47" y="32" class="node-text" text-anchor="middle" fill="#475569">Filesystem</text>
      <text x="47" y="50" class="node-desc" text-anchor="middle">OS Inodes</text>
    </g>

    <!-- Connectors for Shallow -->
    <line x1="148" y1="73" x2="187" y2="73" class="arrow-red" />
    <line x1="325" y1="110" x2="362" y2="110" class="arrow" />

    <!-- Badges / Metrics -->
    <g transform="translate(18, 205)">
      <rect width="449" height="105" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
      <text x="14" y="24" class="node-text" fill="#9f1239">System Consequences:</text>
      <text x="14" y="46" class="node-desc" fill="#881337">• <tspan font-weight="700">Multi-Turn Round-Trips:</tspan> 4 to 8 sequential autoregressive model calls.</text>
      <text x="14" y="66" class="node-desc" fill="#881337">• <tspan font-weight="700">Compounding Error Probability:</tspan> P(Success) = (1 - ε)^k decays exponentially.</text>
      <text x="14" y="86" class="node-desc" fill="#881337">• <tspan font-weight="700">KV Cache Invalidation:</tspan> Context bloated by intermediate file descriptor states.</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Deep Interface -->
  <g transform="translate(555, 80)">
    <rect width="485" height="325" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 477 0 Q 485 0 485 8 L 485 38 L 0 38 Z" fill="#f0fdf4" />
    
    <text x="16" y="24" class="card-title" fill="#166534">Deep Interface (High Cohesion)</text>
    <text x="470" y="24" class="card-subtitle" fill="#15803d" text-anchor="end">High Leverage • Single Turn</text>

    <!-- Content Nodes: Deep -->
    <!-- Node 1: Agent Loop -->
    <g transform="translate(18, 52)">
      <rect width="120" height="70" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="60" y="32" class="node-text" text-anchor="middle" fill="#1e40af">Agent Core</text>
      <text x="60" y="50" class="node-desc" text-anchor="middle">Single Intent</text>
    </g>

    <!-- Node 2: High Cohesion RPC -->
    <g transform="translate(178, 52)">
      <rect width="155" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="77" y="26" class="node-code" text-anchor="middle" fill="#14532d">apply_patch(</text>
      <text x="77" y="44" class="node-code" text-anchor="middle" fill="#14532d">  path, target, repl)</text>
      <text x="77" y="60" class="node-desc" text-anchor="middle" fill="#15803d">Atomic Deterministic RPC</text>
    </g>

    <!-- Node 3: Environment -->
    <g transform="translate(370, 52)">
      <rect width="95" height="70" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="47" y="32" class="node-text" text-anchor="middle" fill="#475569">Filesystem</text>
      <text x="47" y="50" class="node-desc" text-anchor="middle">Host C/Rust</text>
    </g>

    <!-- Connectors for Deep -->
    <line x1="138" y1="87" x2="170" y2="87" class="arrow-green" />
    <line x1="333" y1="87" x2="362" y2="87" class="arrow-green" />

    <!-- Badges / Metrics -->
    <g transform="translate(18, 205)">
      <rect width="449" height="105" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="14" y="24" class="node-text" fill="#14532d">Systems Advantages:</text>
      <text x="14" y="46" class="node-desc" fill="#166534">• <tspan font-weight="700">Atomic Execution:</tspan> Exactly 1 model invocation; state change is all-or-nothing.</text>
      <text x="14" y="66" class="node-desc" fill="#166534">• <tspan font-weight="700">Minimal KV Cache Churn:</tspan> Schema is compact; intermediate byte offsets hidden.</text>
      <text x="14" y="86" class="node-desc" fill="#166534">• <tspan font-weight="700">Deterministic Invariants:</tspan> Conflict detection and diff generation handled in Rust.</text>
    </g>
  </g>

  <!-- Bottom Principle Box -->
  <g transform="translate(35, 422)">
    <rect width="1010" height="58" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" />
    <text x="20" y="25" class="footer-label">Ousterhout's Depth Invariant</text>
    <text x="20" y="44" class="footer-desc">Deep tools maximize underlying functionality while exposing minimal schema surface, reducing agent token latency and error cascades.</text>
  </g>
</svg>
