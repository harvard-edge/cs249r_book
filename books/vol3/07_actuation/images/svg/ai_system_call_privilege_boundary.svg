<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- DOMAIN 1: RING 3 USER SPACE (UNTRUSTED STOCHASTIC CORE)           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <!-- Container Box -->
    <rect x="0" y="0" width="940" height="150" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="6,4"/>
    <!-- Header Badge -->
    <path d="M 0 4 Q 0 0 4 0 L 360 0 Q 364 0 364 4 L 364 24 L 0 24 Z" fill="#ffe4e6"/>
    <text x="14" y="16" font-size="11" font-weight="700" fill="#9f1239" letter-spacing="0.05em">USER SPACE (RING 3) — UNTRUSTED STOCHASTIC PROCESS</text>
    <text x="920" y="16" font-size="11" font-weight="600" fill="#be123c" text-anchor="end">Zero Ambient Authority (A = 0)</text>

    <!-- Subcomponent 1: Neural Processor -->
    <rect x="20" y="36" width="440" height="98" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="32" y="54" font-size="12" font-weight="700" fill="#0f172a">Stochastic Foundation Model Core</text>
    <text x="32" y="72" font-size="11" fill="#475569">Autoregressive token generation across vocabulary V</text>
    <text x="32" y="88" font-size="11" fill="#64748b">Unified instruction/data stream; susceptible to prompt injection</text>
    <rect x="32" y="98" width="416" height="24" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="40" y="114" font-size="9.5" font-family="ui-monospace, monospace" fill="#be123c">Tokens: &lt;|tool_call|&gt; {"name": "read", "path": "/etc/passwd"}</text>

    <!-- Subcomponent 2: User-Space Escrow Register -->
    <rect x="480" y="36" width="440" height="98" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="492" y="54" font-size="12" font-weight="700" fill="#0f172a">User-Space System Call Escrow Register</text>
    <text x="492" y="72" font-size="11" fill="#475569">Buffers candidate tool tokens prior to kernel transition</text>
    <text x="492" y="88" font-size="11" fill="#64748b">Execution escrowed: no direct file descriptors or network sockets</text>
    <rect x="492" y="98" width="416" height="24" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="500" y="114" font-size="9.5" font-family="ui-monospace, monospace" fill="#9f1239">Trap Trigger: SYS_TOOL_CALL (Opcode 0x7001, EscrowRef)</text>
  </g>

  <!-- ================================================================= -->
  <!-- MEDIATION BOUNDARY: PRIVILEGE TRANSITION (TRAP & SYSRET)          -->
  <!-- ================================================================= -->
  <!-- Trap Downward Arrow -->
  <line x1="320" y1="170" x2="320" y2="208" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-rose)"/>
  <rect x="220" y="179" width="200" height="18" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="320" y="192" font-size="10" font-weight="600" fill="#be123c" text-anchor="middle">SYS_TOOL_CALL Trap (Yield)</text>

  <!-- Sysret Upward Arrow -->
  <line x1="710" y1="208" x2="710" y2="170" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)"/>
  <rect x="610" y="179" width="200" height="18" rx="2" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="710" y="192" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">SYSRET Observation (Resume)</text>

  <!-- ================================================================= -->
  <!-- DOMAIN 2: RING 0 SUPERVISOR SPACE (COMPLETE MEDIATION)           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="940" height="230" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <!-- Header Badge -->
    <path d="M 0 4 Q 0 0 4 0 L 380 0 Q 384 0 384 4 L 384 24 L 0 24 Z" fill="#e0f2fe"/>
    <text x="14" y="16" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.05em">SUPERVISOR SPACE (RING 0) — COMPLETE MEDIATION GATEWAY</text>
    <text x="920" y="16" font-size="11" font-weight="600" fill="#0284c7" text-anchor="end">Deterministic Verification Pipeline</text>

    <!-- Stage 1 -->
    <rect x="20" y="38" width="210" height="174" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <rect x="20" y="38" width="210" height="26" rx="3" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
    <text x="30" y="55" font-size="11.5" font-weight="700" fill="#0f172a">1. Grammar DFA Filter</text>
    <text x="30" y="80" font-size="11" font-weight="600" fill="#334155">Schema Constrained FSM</text>
    <text x="30" y="98" font-size="10.5" fill="#475569">• Vocabulary logit masking</text>
    <text x="30" y="114" font-size="10.5" fill="#475569">• JSON schema parsing</text>
    <text x="30" y="130" font-size="10.5" fill="#475569">• Strict lexical boundary</text>
    <rect x="28" y="152" width="194" height="46" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="168" font-size="10" font-family="ui-monospace, monospace" fill="#0369a1">Invariant:</text>
    <text x="34" y="184" font-size="10" font-family="ui-monospace, monospace" fill="#334155">P(syntax_err) = 0</text>

    <!-- Connector 1->2 -->
    <line x1="230" y1="125" x2="250" y2="125" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 2 -->
    <rect x="250" y="38" width="210" height="174" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <rect x="250" y="38" width="210" height="26" rx="3" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
    <text x="260" y="55" font-size="11.5" font-weight="700" fill="#0f172a">2. Strict ABI Deserializer</text>
    <text x="260" y="80" font-size="11" font-weight="600" fill="#334155">Typed Payload Binding</text>
    <text x="260" y="98" font-size="10.5" fill="#475569">• Serde struct hydration</text>
    <text x="260" y="114" font-size="10.5" fill="#475569">• Pointer &amp; bounds check</text>
    <text x="260" y="130" font-size="10.5" fill="#475569">• Type safety verification</text>
    <rect x="258" y="152" width="194" height="46" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="264" y="168" font-size="10" font-family="ui-monospace, monospace" fill="#0369a1">Rejects:</text>
    <text x="264" y="184" font-size="10" font-family="ui-monospace, monospace" fill="#be123c">Buffer overflow / types</text>

    <!-- Connector 2->3 -->
    <line x1="460" y1="125" x2="480" y2="125" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 3 -->
    <rect x="480" y="38" width="210" height="174" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <rect x="480" y="38" width="210" height="26" rx="3" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
    <text x="490" y="55" font-size="11.5" font-weight="700" fill="#0f172a">3. Capability &amp; Lease Check</text>
    <text x="490" y="80" font-size="11" font-weight="600" fill="#334155">Cryptographic Guard</text>
    <text x="490" y="98" font-size="10.5" fill="#475569">• HMAC token validation</text>
    <text x="490" y="114" font-size="10.5" fill="#475569">• Filesystem path allowlist</text>
    <text x="490" y="130" font-size="10.5" fill="#475569">• Monotonic attenuation</text>
    <rect x="488" y="152" width="194" height="46" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="494" y="168" font-size="10" font-family="ui-monospace, monospace" fill="#0369a1">Blocks:</text>
    <text x="494" y="184" font-size="10" font-family="ui-monospace, monospace" fill="#be123c">Path traversal &amp; esc</text>

    <!-- Connector 3->4 -->
    <line x1="690" y1="125" x2="710" y2="125" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 4 -->
    <rect x="710" y="38" width="210" height="174" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <rect x="710" y="38" width="210" height="26" rx="3" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
    <text x="720" y="55" font-size="11.5" font-weight="700" fill="#0f172a">4. Idempotency &amp; Replay</text>
    <text x="720" y="80" font-size="11" font-weight="600" fill="#334155">Transactional Deduplication</text>
    <text x="720" y="98" font-size="10.5" fill="#475569">• Trajectory nonce k_idem</text>
    <text x="720" y="114" font-size="10.5" fill="#475569">• Atomic SETNX lease lock</text>
    <text x="720" y="130" font-size="10.5" fill="#475569">• Write-ahead intent log</text>
    <rect x="718" y="152" width="194" height="46" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="724" y="168" font-size="10" font-family="ui-monospace, monospace" fill="#0369a1">Cache Hit:</text>
    <text x="724" y="184" font-size="10" font-family="ui-monospace, monospace" fill="#047857">Replays result directly</text>
  </g>

  <!-- ================================================================= -->
  <!-- ISOLATION BARRIER: DISPATCH & OBSERVATION RETURN                  -->
  <!-- ================================================================= -->
  <!-- Dispatch Downward Arrow -->
  <line x1="320" y1="440" x2="320" y2="478" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="220" y="449" width="200" height="18" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="320" y="462" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">Authorized Driver Dispatch</text>

  <!-- Return Upward Arrow -->
  <line x1="710" y1="478" x2="710" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)"/>
  <rect x="610" y="449" width="200" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710" y="462" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Raw Observation Stream &amp; Status</text>

  <!-- ================================================================= -->
  <!-- DOMAIN 3: ISOLATED EXECUTION ENVIRONMENTS (PHYSICAL ACTUATION)    -->
  <!-- ================================================================= -->
  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="940" height="116" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <!-- Header Badge -->
    <path d="M 0 4 Q 0 0 4 0 L 320 0 Q 324 0 324 4 L 324 22 L 0 22 Z" fill="#e2e8f0"/>
    <text x="14" y="15" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.05em">ISOLATED EXECUTION DOMAINS (CONTAINMENT)</text>
    <text x="920" y="15" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">Decoupled Physical Actuation</text>

    <!-- Backend 1 -->
    <rect x="20" y="32" width="210" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="48" font-size="11" font-weight="700" fill="#0f172a">Firecracker MicroVM</text>
    <text x="30" y="66" font-size="10.5" fill="#475569">Hardware KVM jail boundary</text>
    <text x="30" y="82" font-size="10" font-family="ui-monospace, monospace" fill="#64748b">Sealed tap networking</text>

    <!-- Backend 2 -->
    <rect x="250" y="32" width="210" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="260" y="48" font-size="11" font-weight="700" fill="#0f172a">gVisor Container Sandbox</text>
    <text x="260" y="66" font-size="10.5" fill="#475569">Intercepted kernel syscalls</text>
    <text x="260" y="82" font-size="10" font-family="ui-monospace, monospace" fill="#64748b">Sealed network namespaces</text>

    <!-- Backend 3 -->
    <rect x="480" y="32" width="210" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="490" y="48" font-size="11" font-weight="700" fill="#0f172a">Enterprise SaaS / DB</text>
    <text x="490" y="66" font-size="10.5" fill="#475569">Scoped OAuth &amp; mTLS tokens</text>
    <text x="490" y="82" font-size="10" font-family="ui-monospace, monospace" fill="#64748b">Compensating transaction log</text>

    <!-- Backend 4 -->
    <rect x="710" y="32" width="210" height="70" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="720" y="48" font-size="11" font-weight="700" fill="#0f172a">Local Filesystem Isolation</text>
    <text x="720" y="66" font-size="10.5" fill="#475569">pivot_root &amp; cgroups v2</text>
    <text x="720" y="82" font-size="10" font-family="ui-monospace, monospace" fill="#64748b">CoW overlayfs snapshots</text>
  </g>
</svg>