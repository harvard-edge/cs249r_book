<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="440" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- STAGE 0: RAW POSIX STREAM                                         -->
  <!-- ================================================================= -->
  <g transform="translate(30, 16)">
    <rect x="0" y="0" width="940" height="74" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 320 0 Q 324 0 324 4 L 324 20 L 0 20 Z" fill="#ffe4e6"/>
    <text x="12" y="14" font-size="10" font-weight="700" fill="#9f1239" letter-spacing="0.04em">RAW POSIX STREAM (CHILD STDOUT / STDERR)</text>
    <text x="928" y="14" font-size="10" font-weight="600" fill="#be123c" text-anchor="end">High Token Fragmentation Hazard</text>

    <!-- Raw Stream Box -->
    <rect x="14" y="28" width="620" height="36" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="22" y="44" font-size="8.5" font-family="ui-monospace, monospace" fill="#9f1239">"Building...\r\x1b[32m[ 50%]\x1b[0m Compiling core.c\r\x1b[32m[100%]\x1b[0m Build complete\n"</text>
    <text x="22" y="56" font-size="8" fill="#64748b">Raw ANSI escapes and carriage returns</text>

    <!-- Token Hazard Box -->
    <rect x="646" y="28" width="280" height="36" rx="2" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="654" y="43" font-size="8.5" font-weight="700" fill="#be123c">Tokenizer Shatter Effect:</text>
    <text x="654" y="55" font-size="8" fill="#475569">BPE splits ANSI codes into 18+ high-entropy tokens</text>
  </g>

  <!-- Arrow Stage 0 -> Stage 1 -->
  <line x1="500" y1="90" x2="500" y2="108" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- STAGE 1: ECMA-48 FSM ESCAPE STRIPPER                              -->
  <!-- ================================================================= -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="940" height="84" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 370 0 Q 374 0 374 4 L 374 20 L 0 20 Z" fill="#e0f2fe"/>
    <text x="12" y="14" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.04em">PHASE 1: ECMA-48 FINITE-STATE MACHINE ESCAPE STRIPPER</text>
    <text x="928" y="14" font-size="10" font-weight="600" fill="#0284c7" text-anchor="end">Deterministic Byte Sanitization</text>

    <!-- FSM State Description -->
    <rect x="14" y="28" width="460" height="46" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="24" y="44" font-size="9" font-weight="700" fill="#0f172a">ECMA-48 Automaton: Ground → Escape → CSI / OSC Parameter Drop</text>
    <text x="24" y="58" font-size="8.5" fill="#475569">Drops SGR colors · titles · cursor moves</text>
    <text x="24" y="68" font-size="8" font-family="ui-monospace, monospace" fill="#0369a1">Blocks delimiter injection</text>

    <!-- Intermediate Cleaned Stream -->
    <rect x="486" y="28" width="440" height="46" rx="2" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="496" y="44" font-size="8.5" font-weight="700" fill="#334155">Sanitized Byte Stream (Escapes Discarded):</text>
    <text x="496" y="58" font-size="8.5" font-family="ui-monospace, monospace" fill="#0369a1">"Building...\r[ 50%] Compiling core.c\r[100%] Build complete\n"</text>
    <text x="496" y="68" font-size="8" fill="#047857">Token footprint pruned by ~60%</text>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="500" y1="194" x2="500" y2="212" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- STAGE 2: 1D VIRTUAL LINE BUFFER (IN-PLACE REDRAW RESOLVER)        -->
  <!-- ================================================================= -->
  <g transform="translate(30, 214)">
    <rect x="0" y="0" width="940" height="106" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 415 0 Q 419 0 419 4 L 419 20 L 0 20 Z" fill="#fef3c7"/>
    <text x="12" y="14" font-size="10" font-weight="700" fill="#92400e" letter-spacing="0.04em">PHASE 2: 1D VIRTUAL LINE BUFFER (IN-PLACE REDRAW RESOLVER)</text>
    <text x="928" y="14" font-size="10" font-weight="600" fill="#d97706" text-anchor="end">Interactive Progress Collapse</text>

    <!-- 1D Buffer Visual Array -->
    <rect x="14" y="28" width="530" height="68" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="24" y="44" font-size="9" font-weight="700" fill="#0f172a">Virtual Character Cell Array (Cursor scalar c_x resets to column 0 on '\r'):</text>

    <!-- Character Cells -->
    <g transform="translate(24, 52)" font-family="ui-monospace, monospace" font-size="9">
      <rect x="0" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="10" y="13" text-anchor="middle" fill="#0f172a">[</text>
      <rect x="22" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="32" y="13" text-anchor="middle" fill="#0f172a">1</text>
      <rect x="44" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="54" y="13" text-anchor="middle" fill="#0f172a">0</text>
      <rect x="66" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="76" y="13" text-anchor="middle" fill="#0f172a">0</text>
      <rect x="88" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="98" y="13" text-anchor="middle" fill="#0f172a">%</text>
      <rect x="110" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="120" y="13" text-anchor="middle" fill="#0f172a">]</text>
      <rect x="132" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="142" y="13" text-anchor="middle" fill="#0f172a"> </text>
      <rect x="154" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="164" y="13" text-anchor="middle" fill="#0f172a">B</text>
      <rect x="176" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="186" y="13" text-anchor="middle" fill="#0f172a">u</text>
      <rect x="198" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="208" y="13" text-anchor="middle" fill="#0f172a">i</text>
      <rect x="220" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="230" y="13" text-anchor="middle" fill="#0f172a">l</text>
      <rect x="242" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="252" y="13" text-anchor="middle" fill="#0f172a">d</text>
      <rect x="264" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="274" y="13" text-anchor="middle" fill="#0f172a"> </text>
      <rect x="286" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="296" y="13" text-anchor="middle" fill="#0f172a">c</text>
      <rect x="308" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="318" y="13" text-anchor="middle" fill="#0f172a">o</text>
      <rect x="330" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="340" y="13" text-anchor="middle" fill="#0f172a">m</text>
      <rect x="352" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="362" y="13" text-anchor="middle" fill="#0f172a">p</text>
      <rect x="374" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="384" y="13" text-anchor="middle" fill="#0f172a">l</text>
      <rect x="396" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="406" y="13" text-anchor="middle" fill="#0f172a">e</text>
      <rect x="418" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="428" y="13" text-anchor="middle" fill="#0f172a">t</text>
      <rect x="440" y="0" width="20" height="18" fill="#f8fafc" stroke="#cbd5e1" rx="1"/>
      <text x="450" y="13" text-anchor="middle" fill="#0f172a">e</text>
    </g>
    <text x="24" y="88" font-size="8" font-family="ui-monospace, monospace" fill="#047857">Resolved Single Line: "[100%] Build complete" (prior 50% state overwritten)</text>

    <!-- Mechanism Description -->
    <rect x="556" y="28" width="370" height="68" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="566" y="44" font-size="9" font-weight="700" fill="#92400e">Progress Bar Redraw Elimination:</text>
    <text x="566" y="58" font-size="8.5" fill="#475569">Emulates 1D terminal line discipline</text>
    <text x="566" y="72" font-size="8.5" fill="#475569">Overwrites character cells on \r; only emits on \n</text>
    <text x="566" y="86" font-size="8.5" fill="#047857">Collapses 600 tqdm/curl progress updates (45 KB) → single line</text>
  </g>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <line x1="500" y1="320" x2="500" y2="338" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-emerald)"/>

  <!-- ================================================================= -->
  <!-- STAGE 3: STRUCTURED OBSERVATION FRAME & CONTEXT STAGING           -->
  <!-- ================================================================= -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="940" height="84" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 370 0 Q 374 0 374 4 L 374 20 L 0 20 Z" fill="#dcfce7"/>
    <text x="12" y="14" font-size="10" font-weight="700" fill="#065f46" letter-spacing="0.04em">PHASE 3: STRUCTURED OBSERVATION FRAME &amp; CONTEXT STAGING</text>
    <text x="928" y="14" font-size="10" font-weight="600" fill="#059669" text-anchor="end">Sanitized Context Turn</text>

    <!-- Metadata Attachment -->
    <rect x="14" y="28" width="400" height="46" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="44" font-size="9" font-weight="700" fill="#0f172a">Structured Metadata Tagging</text>
    <text x="24" y="58" font-size="8.5" fill="#475569">Attaches POSIX status, execution duration, and stream truncation flags</text>
    <text x="24" y="68" font-size="8" font-family="ui-monospace, monospace" fill="#047857">Guarantees deterministic prompt formatting for prefix cache</text>

    <!-- Staged Turn Output -->
    <rect x="426" y="28" width="500" height="46" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="436" y="44" font-size="8.5" font-weight="700" fill="#065f46">Staged Context String:</text>
    <text x="436" y="58" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f172a">&lt;observation exit_code="0" truncated="false" duration_ms="1420"&gt;</text>
    <text x="446" y="68" font-size="8.5" font-family="ui-monospace, monospace" fill="#0369a1">[100%] Build complete&lt;/observation&gt;</text>
  </g>
</svg>