<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .sub-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1080" height="480" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Banner -->
  <rect x="20" y="16" width="1040" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="41" class="title">TERMINAL STREAM NORMALIZATION PIPELINE</text>
  <text x="1045" y="41" class="sub-note" text-anchor="end">ECMA-48 Escape Stripping &amp; Virtual Line Buffer Overwrite Resolution</text>

  <!-- Step 0: Raw POSIX Pipe Stream -->
  <g transform="translate(40, 68)">
    <rect width="1000" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="24" class="panel-title" fill="#991b1b">RAW POSIX PIPE STREAM (stdout / stderr bytes from unprivileged child process)</text>
    <text x="20" y="42" class="mono" fill="#b91c1c">"Compiling...
\x1b[32m[ 50%]\x1b[0m Foo.c
\x1b[32m[100%]\x1b[0m Done
"</text>
    <text x="980" y="42" class="box-sub" text-anchor="end">High Token Fragmentation: BPE shatters ANSI escapes into 12+ useless tokens</text>
  </g>

  <path d="M 540 120 L 540 138" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-norm)"/>

  <!-- Step 1: ECMA-48 FSM Escape Stripper -->
  <g transform="translate(40, 140)">
    <rect width="1000" height="68" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="20" y="24" class="panel-title" fill="#1e40af">PHASE 1: ECMA-48 FINITE-STATE MACHINE ESCAPE STRIPPER</text>
    <text x="20" y="42" class="box-sub">• Ground/Escape/CSI/OSC FSM states discard SGR colors, 24-bit TrueColor, cursor translations, and window title sequences</text>
    <rect x="20" y="47" width="600" height="16" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="30" y="59" class="mono" fill="#1e3a8a">Output: "Compiling...
[ 50%] Foo.c
[100%] Done
"</text>
    <text x="980" y="59" class="box-sub" text-anchor="end" fill="#1e40af">Reduces token count by ~60%; eliminates delimiter injection exploits</text>
  </g>

  <path d="M 540 208 L 540 226" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-norm)"/>

  <!-- Step 2: 1D Virtual Line Buffer Resolver -->
  <g transform="translate(40, 228)">
    <rect width="1000" height="88" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="20" y="22" class="panel-title" fill="#9a3412">PHASE 2: 1D VIRTUAL LINE BUFFER RESOLVER (Deterministic In-Place Redraw Collapsing)</text>
    
    <g transform="translate(20, 32)">
      <!-- Line Buffer Visualisation -->
      <rect width="450" height="24" rx="3" fill="#ffffff" stroke="#fdba74"/>
      <text x="10" y="16" class="mono" fill="#c2410c">[1][0][0][%][]][ ][D][o][n][e][ ] ... (Cursor resets to Col 0 on r)</text>

      <rect x="470" y="0" width="490" height="48" rx="4" fill="#ffffff" stroke="#fed7aa"/>
      <text x="480" y="18" class="box-lbl" fill="#9a3412">Mechanism:</text>
      <text x="480" y="32" class="box-sub">• Advances cursor scalar on graphemes; resets to col 0 on r; commits on n</text>
      <text x="480" y="44" class="box-sub">• Collapses 600 tqdm/curl progress bar updates (45 KB) into a single 12-byte line</text>
    </g>
    <text x="30" y="78" class="mono" font-weight="700" fill="#047857">Resolved Text: "[100%] Done"</text>
  </g>

  <path d="M 540 316 L 540 334" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-norm)"/>

  <!-- Step 3: Structured Metadata & Envelope Staging -->
  <g transform="translate(40, 336)">
    <rect width="1000" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="20" y="24" class="panel-title" fill="#166534">PHASE 3: STRUCTURED OBSERVATION FRAME &amp; CONTEXT STAGING</text>
    <text x="20" y="42" class="box-sub">• Enforces sandwich truncation (Head 200 / Tail 200 lines); attaches POSIX exit status and byte omitted tombstones</text>
    <text x="20" y="58" class="mono" fill="#15803d">&lt;observation exit_code="0" truncated="false" duration_ms="1420"&gt;[100%] Done&lt;/observation&gt;</text>
  </g>

  <!-- Bottom Invariant Card -->
  <rect x="20" y="415" width="1040" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="35" y="437" class="card-text" font-weight="700" fill="#0f172a">Normalization Invariant:</text>
  <text x="185" y="437" class="card-text">Never feed raw interactive terminal streams to autoregressive tokenizers. Deterministically strip</text>
  <text x="185" y="455" class="card-text">display escape sequences and resolve in-place carriage returns before context window staging.</text>
</svg>