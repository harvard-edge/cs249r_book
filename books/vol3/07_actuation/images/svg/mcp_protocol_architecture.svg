<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="510" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: HOST APPLICATION & MCP CLIENT                           -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="280" height="470" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 190 0 Q 194 0 194 4 L 194 24 L 0 24 Z" fill="#ede9fe"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#6b21a8" letter-spacing="0.04em">HOST AGENT RUNTIME</text>
    <text x="268" y="16" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="end">Client Domain</text>

    <!-- Subcomponent 1: Model Core -->
    <rect x="14" y="34" width="252" height="96" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="52" font-size="11.5" font-weight="700" fill="#0f172a">Foundation Model Core</text>
    <text x="24" y="70" font-size="10.5" fill="#475569">Autoregressive token generation</text>
    <text x="24" y="86" font-size="10.5" fill="#475569">Emits candidate tool tokens</text>
    <rect x="24" y="94" width="232" height="26" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="111" font-size="9.5" font-family="ui-monospace, monospace" fill="#6b21a8">&lt;|tool_call|&gt; {"name": "query_db"}</text>

    <!-- Subcomponent 2: MCP Client Engine -->
    <rect x="14" y="142" width="252" height="174" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="160" font-size="11.5" font-weight="700" fill="#0f172a">MCP Client Protocol Manager</text>
    <text x="24" y="178" font-size="10.5" font-weight="600" fill="#334155">1. Handshake &amp; Negotiation</text>
    <text x="34" y="194" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">client/initialize (2024-11-05)</text>

    <text x="24" y="214" font-size="10.5" font-weight="600" fill="#334155">2. Dynamic Discovery</text>
    <text x="34" y="230" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">tools/list, resources/list</text>

    <text x="24" y="250" font-size="10.5" font-weight="600" fill="#334155">3. RPC Dispatch &amp; Sampling</text>
    <text x="34" y="266" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">tools/call, sampling/create</text>

    <rect x="24" y="278" width="232" height="26" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="32" y="295" font-size="9.5" font-family="ui-monospace, monospace" fill="#7c3aed">JSON-RPC 2.0 Marshaller</text>

    <!-- Subcomponent 3: Policy Gateway -->
    <rect x="14" y="328" width="252" height="128" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="346" font-size="11.5" font-weight="700" fill="#0f172a">Security &amp; Policy Supervisor</text>
    <text x="24" y="364" font-size="10" fill="#475569">• Zero ambient credentials boundary</text>
    <text x="24" y="380" font-size="10" fill="#475569">• Secret redaction &amp; credential escrow</text>
    <text x="24" y="396" font-size="10" fill="#475569">• Human-in-the-loop confirmation gates</text>
    <rect x="24" y="408" width="232" height="36" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
    <text x="32" y="423" font-size="9" font-family="ui-monospace, monospace" fill="#6b21a8">Complete Mediation Invariant:</text>
    <text x="32" y="437" font-size="9" font-family="ui-monospace, monospace" fill="#475569">All wire payloads intercepted</text>
  </g>

  <!-- Client -> Transport Arrow -->
  <line x1="300" y1="215" x2="328" y2="215" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <!-- Transport -> Client Arrow -->
  <line x1="328" y1="365" x2="300" y2="365" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: DUPLEX TRANSPORT LAYER (JSON-RPC 2.0)                   -->
  <!-- ================================================================= -->
  <g transform="translate(330, 20)">
    <rect x="0" y="0" width="310" height="470" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 210 0 Q 214 0 214 4 L 214 24 L 0 24 Z" fill="#e0f2fe"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.04em">DUPLEX TRANSPORT LAYER</text>
    <text x="298" y="16" font-size="10.5" font-weight="600" fill="#0284c7" text-anchor="end">JSON-RPC 2.0</text>

    <!-- Transports -->
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="136" height="54" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
      <text x="10" y="18" font-size="10.5" font-weight="700" fill="#0f172a">stdio Transport</text>
      <text x="10" y="32" font-size="9.5" fill="#475569">Local subprocess</text>
      <text x="10" y="46" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">stdin / stdout pipes</text>

      <rect x="146" y="0" width="136" height="54" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
      <text x="156" y="18" font-size="10.5" font-weight="700" fill="#0f172a">SSE / HTTP Transport</text>
      <text x="156" y="32" font-size="9.5" fill="#475569">Remote microservice</text>
      <text x="156" y="46" font-size="9" font-family="ui-monospace, monospace" fill="#0369a1">POST + event-stream</text>
    </g>

    <!-- Client Request Frame -->
    <rect x="14" y="100" width="282" height="165" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <path d="M 14 103 Q 14 100 17 100 L 150 100 Q 154 100 154 103 L 154 118 L 14 118 Z" fill="#e0f2fe"/>
    <text x="22" y="113" font-size="9.5" font-weight="700" fill="#0369a1">Client Request (tools/call)</text>
    <g transform="translate(22, 130)" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">
      <text x="0" y="0">{</text>
      <text x="12" y="14"><tspan fill="#64748b">"jsonrpc":</tspan> "2.0",</text>
      <text x="12" y="28"><tspan fill="#64748b">"id":</tspan> "req_42",</text>
      <text x="12" y="42"><tspan fill="#64748b">"method":</tspan> "tools/call",</text>
      <text x="12" y="56"><tspan fill="#64748b">"params":</tspan> {</text>
      <text x="24" y="70"><tspan fill="#64748b">"name":</tspan> "query_db",</text>
      <text x="24" y="84"><tspan fill="#64748b">"arguments":</tspan> {</text>
      <text x="36" y="98"><tspan fill="#64748b">"sql":</tspan> <tspan fill="#b91c1c">"SELECT * FROM users"</tspan></text>
      <text x="24" y="112">}</text>
      <text x="12" y="126">}</text>
      <text x="0" y="140">}</text>
    </g>

    <!-- Server Response Frame -->
    <rect x="14" y="277" width="282" height="178" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <path d="M 14 280 Q 14 277 17 277 L 150 277 Q 154 277 154 280 L 154 295 L 14 295 Z" fill="#dcfce7"/>
    <text x="22" y="290" font-size="9.5" font-weight="700" fill="#065f46">Server Response (result)</text>
    <g transform="translate(22, 307)" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">
      <text x="0" y="0">{</text>
      <text x="12" y="14"><tspan fill="#64748b">"jsonrpc":</tspan> "2.0",</text>
      <text x="12" y="28"><tspan fill="#64748b">"id":</tspan> "req_42",</text>
      <text x="12" y="42"><tspan fill="#64748b">"result":</tspan> {</text>
      <text x="24" y="56"><tspan fill="#64748b">"content":</tspan> [</text>
      <text x="36" y="70">{<tspan fill="#64748b">"type":</tspan> "text",</text>
      <text x="44" y="84"><tspan fill="#64748b">"text":</tspan> <tspan fill="#047857">"[3 rows returned]"</tspan>}</text>
      <text x="24" y="98">],</text>
      <text x="24" y="112"><tspan fill="#64748b">"isError":</tspan> false</text>
      <text x="12" y="126">}</text>
      <text x="0" y="140">}</text>
    </g>
  </g>

  <!-- Transport -> Server Arrow -->
  <line x1="640" y1="215" x2="668" y2="215" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Server -> Transport Arrow -->
  <line x1="668" y1="365" x2="640" y2="365" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: MCP SERVER & EXECUTION SANDBOX                          -->
  <!-- ================================================================= -->
  <g transform="translate(670, 20)">
    <rect x="0" y="0" width="270" height="470" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 175 0 Q 179 0 179 4 L 179 24 L 0 24 Z" fill="#fef3c7"/>
    <text x="12" y="16" font-size="11" font-weight="700" fill="#92400e" letter-spacing="0.04em">MCP SERVER</text>
    <text x="256" y="16" font-size="10.5" font-weight="600" fill="#d97706" text-anchor="end">Execution Domain</text>

    <!-- Subcomponent 1: Protocol Primitives -->
    <rect x="14" y="34" width="242" height="110" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="24" y="52" font-size="11.5" font-weight="700" fill="#0f172a">Three Protocol Primitives</text>

    <rect x="20" y="60" width="230" height="22" rx="2" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    <text x="28" y="75" font-size="9.5" font-weight="700" fill="#92400e">Tools:</text>
    <text x="68" y="75" font-size="9" fill="#475569">Callable routines with side-effects</text>

    <rect x="20" y="86" width="230" height="22" rx="2" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    <text x="28" y="101" font-size="9.5" font-weight="700" fill="#92400e">Resources:</text>
    <text x="92" y="101" font-size="9" fill="#475569">URI-addressable data blobs</text>

    <rect x="20" y="112" width="230" height="22" rx="2" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    <text x="28" y="127" font-size="9.5" font-weight="700" fill="#92400e">Prompts:</text>
    <text x="80" y="127" font-size="9" fill="#475569">Parametric templated contexts</text>

    <!-- Subcomponent 2: JSON Schema Validation -->
    <rect x="14" y="154" width="242" height="88" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="24" y="172" font-size="11.5" font-weight="700" fill="#0f172a">Schema Validation Engine</text>
    <text x="24" y="190" font-size="10" fill="#475569">• Validates inbound JSON-RPC payloads</text>
    <text x="24" y="206" font-size="10" fill="#475569">• Synthesizes typed Pydantic / Zod models</text>
    <rect x="20" y="214" width="230" height="20" rx="2" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="26" y="228" font-size="8.5" font-family="ui-monospace, monospace" fill="#c2410c">Validates types only, not safety semantics</text>

    <!-- Subcomponent 3: Backend Drivers -->
    <rect x="14" y="252" width="242" height="204" rx="3" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="24" y="270" font-size="11.5" font-weight="700" fill="#0f172a">Sandboxed Backend Drivers</text>
    <text x="24" y="286" font-size="10" fill="#475569">Executes within dedicated sandbox container</text>

    <!-- Driver Cards -->
    <rect x="24" y="296" width="105" height="42" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="312" font-size="10" font-weight="700" fill="#0f172a">PostgreSQL DB</text>
    <text x="32" y="326" font-size="9" fill="#64748b">SQL connection pool</text>

    <rect x="141" y="296" width="105" height="42" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="149" y="312" font-size="10" font-weight="700" fill="#0f172a">Docker Daemon</text>
    <text x="149" y="326" font-size="9" fill="#64748b">Container worker API</text>

    <rect x="24" y="344" width="105" height="42" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="360" font-size="10" font-weight="700" fill="#0f172a">Filesystem I/O</text>
    <text x="32" y="374" font-size="9" fill="#64748b">Scoped chroot path</text>

    <rect x="141" y="344" width="105" height="42" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="149" y="360" font-size="10" font-weight="700" fill="#0f172a">GitHub API</text>
    <text x="149" y="374" font-size="9" fill="#64748b">REST / GraphQL</text>

    <rect x="24" y="394" width="222" height="52" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="30" y="410" font-size="9.5" font-weight="600" fill="#334155">Isolation Requirement:</text>
    <text x="30" y="424" font-size="9" fill="#475569">Server processes untrusted tool input;</text>
    <text x="30" y="438" font-size="9" fill="#475569">must be jailed in ephemeral sandbox.</text>
  </g>
</svg>