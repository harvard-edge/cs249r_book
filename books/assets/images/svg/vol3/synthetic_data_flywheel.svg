<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <rect width="800" height="600" fill="#ffffff" />
    <style>
        .title { font-family: Inter, sans-serif; font-size: 20px; font-weight: bold; fill: #1f2937; }
        .tier-label { font-family: Inter, sans-serif; font-size: 14px; font-weight: bold; fill: #4b5563; }
        .node-text { font-family: Inter, sans-serif; font-size: 13px; fill: #1f2937; }
        .sub-text { font-family: Inter, sans-serif; font-size: 11px; fill: #4b5563; }
        .conn-label { font-family: Inter, sans-serif; font-size: 12px; fill: #6b7280; font-style: italic; }
        .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; }
    </style>
    <text x="400" y="40" text-anchor="middle" class="title">The Closed-Loop Synthetic Data Flywheel</text>
    
    <!-- 1. Task Generation -->
    <rect x="50" y="80" width="200" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="150" y="105" text-anchor="middle" class="tier-label">1. Task Generation Tier</text>
    <text x="150" y="130" text-anchor="middle" class="node-text">Synthetic Task Generator</text>
    <text x="150" y="150" text-anchor="middle" class="sub-text">Taxonomy sampling &amp; fixtures</text>
    
    <!-- 2. Rollout Exploration -->
    <rect x="300" y="80" width="220" height="90" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" />
    <text x="410" y="105" text-anchor="middle" class="tier-label">2. Rollout Exploration</text>
    <text x="410" y="130" text-anchor="middle" class="node-text">Stochastic Rollout Engine</text>
    <text x="410" y="150" text-anchor="middle" class="sub-text">High-throughput GPU / MCTS</text>
    
    <!-- 3. Verification -->
    <rect x="560" y="80" width="200" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="660" y="105" text-anchor="middle" class="tier-label">3. Verification Tier</text>
    <text x="660" y="130" text-anchor="middle" class="node-text">Deterministic Oracles</text>
    <text x="660" y="150" text-anchor="middle" class="sub-text">Compilers, linters, tests</text>
    
    <!-- 4. Curation -->
    <rect x="560" y="250" width="200" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="660" y="275" text-anchor="middle" class="tier-label">4. Trajectory Curation</text>
    <rect x="575" y="290" width="170" height="30" rx="4" fill="#fff" stroke="#d97706" />
    <text x="660" y="310" text-anchor="middle" class="node-text">Golden Path (R=1)</text>
    <rect x="575" y="330" width="170" height="30" rx="4" fill="#fff" stroke="#d97706" />
    <text x="660" y="350" text-anchor="middle" class="node-text">Error Recovery (R=0)</text>

    <!-- 5. Policy Adaptation -->
    <rect x="300" y="250" width="220" height="90" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
    <text x="410" y="275" text-anchor="middle" class="tier-label">5. Policy Adaptation</text>
    <text x="410" y="300" text-anchor="middle" class="node-text">Distillation &amp; Fine-Tuning</text>
    <text x="410" y="320" text-anchor="middle" class="sub-text">Trajectory search tree to π</text>
    
    <!-- Connections -->
    <!-- Task to Rollout -->
    <path d="M 250 125 L 290 125" class="arrow" marker-end="url(#arrowhead)" />
    <!-- Rollout to Verification -->
    <path d="M 520 125 L 550 125" class="arrow" marker-end="url(#arrowhead)" />
    <!-- Verification to Curation -->
    <path d="M 660 170 L 660 240" class="arrow" marker-end="url(#arrowhead)" />
    <!-- Curation to Policy -->
    <path d="M 560 310 L 530 310" class="arrow" marker-end="url(#arrowhead)" />
    <!-- Policy to Rollout -->
    <path d="M 410 250 L 410 180" class="arrow" stroke-dasharray="4" marker-end="url(#arrowhead)" />
    <text x="420" y="215" class="conn-label">Deploy π_{k+1}</text>
    <!-- Policy to Task -->
    <path d="M 300 295 L 150 295 L 150 180" class="arrow" stroke-dasharray="4" marker-end="url(#arrowhead)" />
    <text x="160" y="240" class="conn-label">Evolve tasks</text>

    <!-- Arrowhead definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
        </marker>
    </defs>
</svg>
