  <path d="M 470 160 L 500 160" stroke="#E53E3E" stroke-width="2" marker-end="url(#arrow-red)" />

  <g transform="translate(510, 110)">
    <rect width="190" height="100" rx="8" fill="white" stroke="#E53E3E" stroke-width="1.5" filter="url(#shadow)" />
    <text x="95" y="35" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Perturbation /</text>
    <text x="95" y="55" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Tool Fault</text>
    <text x="95" y="75" font-size="12" text-anchor="middle" fill="#4A5568">HTTP 504 / Exit Code 1</text>
  </g>

  <path d="M 700 160 L 730 160" stroke="#E53E3E" stroke-width="2" marker-end="url(#arrow-red)" />

  <g transform="translate(740, 110)">
    <rect width="200" height="100" rx="8" fill="white" stroke="#E53E3E" stroke-width="1.5" filter="url(#shadow)" />
    <text x="100" y="30" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Out-of-Distribution</text>
    <text x="100" y="50" font-size="12" text-anchor="middle" fill="#E53E3E">s_t ∉ supp(d_expert)</text>
    <text x="100" y="70" font-size="12" font-weight="600" text-anchor="middle" fill="#E53E3E">O(ε H²) Cumulative Regret</text>
    <text x="100" y="90" font-size="12" font-weight="600" text-anchor="middle" fill="#E53E3E">Semantic Livelock</text>
  </g>

  <!-- Transition -->
  <g transform="translate(500, 275)">
