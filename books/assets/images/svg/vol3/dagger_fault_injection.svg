  <g transform="translate(50, 110)">
    <rect width="190" height="100" rx="8" fill="white" stroke="#E53E3E" stroke-width="1.5" filter="url(#shadow)" />
    <text x="95" y="45" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Demonstration</text>
    <text x="95" y="65" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Corpus</text>
    <text x="95" y="85" font-size="12" text-anchor="middle" fill="#4A5568">Flawless Rollouts Only</text>
