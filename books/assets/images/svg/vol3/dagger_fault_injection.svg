    <text x="20" y="85" font-size="13" fill="#4A5568">• Schema Inspection</text>
    <text x="20" y="105" font-size="13" fill="#4A5568">• Diagnostic Self-Repair</text>
  </g>

  <path d="M 600 505 L 640 505" stroke="#38A169" stroke-width="2" marker-end="url(#arrow-green)" />

  <g transform="translate(650, 440)">
    <rect width="280" height="130" rx="8" fill="white" stroke="#38A169" stroke-width="1.5" filter="url(#shadow)" />
    <text x="140" y="30" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">DAgger Aggregation Buffer</text>
    <text x="140" y="55" font-size="13" text-anchor="middle" fill="#2F855A" font-family="monospace">D_agg = D_expert ∪ D_recovery</text>
    
    <line x1="20" y1="70" x2="260" y2="70" stroke="#E2E8F0" stroke-width="1.5" />
    
    <text x="140" y="90" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Retrained Policy π_θ</text>
    <text x="140" y="115" font-size="13" font-weight="600" text-anchor="middle" fill="#38A169">Linear Bound O(ε H) | Self-Healing</text>
