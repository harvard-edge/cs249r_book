    <rect x="-120" y="15" width="240" height="40" rx="20" fill="white" stroke="#718096" stroke-width="1.5" />
    <text x="0" y="40" font-size="14" font-weight="600" text-anchor="middle" fill="#4A5568">Sandboxed Chaos &amp; Recovery</text>
