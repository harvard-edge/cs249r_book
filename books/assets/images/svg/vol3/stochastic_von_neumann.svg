<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="#ffffff" />

  <!-- Title -->
  <text x="400" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#1F2937" text-anchor="middle">Stochastic Von Neumann Architecture</text>

  <!-- Processor -->
  <rect x="50" y="80" width="300" height="150" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
  <text x="200" y="110" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#92400E" text-anchor="middle">Processor (Compute)</text>
  <text x="200" y="140" font-family="Inter, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">LLM Weights (ALU)</text>
  <text x="200" y="160" font-family="Inter, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">Search Algos (Branch Prediction)</text>
  <text x="200" y="180" font-family="Inter, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">Stochastic Generation</text>

  <!-- Memory -->
  <rect x="450" y="80" width="300" height="150" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" />
  <text x="600" y="110" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Memory (Volatile)</text>
  <text x="600" y="140" font-family="Inter, sans-serif" font-size="14" fill="#1E3A8A" text-anchor="middle">KV Cache / Context Window (RAM)</text>
  <text x="600" y="160" font-family="Inter, sans-serif" font-size="14" fill="#1E3A8A" text-anchor="middle">PagedAttention (Virtual Mem)</text>

  <!-- Bus / Connection between Processor and Memory -->
  <path d="M 350 155 L 440 155" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="400" y="145" font-family="Inter, sans-serif" font-size="12" fill="#4B5563" text-anchor="middle">I/O Bus (Token Stream)</text>

  <!-- Storage -->
  <rect x="450" y="300" width="300" height="150" rx="10" fill="#F3E8FF" stroke="#9333EA" stroke-width="2" />
  <text x="600" y="330" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#581C87" text-anchor="middle">Storage (Persistent)</text>
  <text x="600" y="360" font-family="Inter, sans-serif" font-size="14" fill="#581C87" text-anchor="middle">Vector DB / Knowledge Graph</text>
  <text x="600" y="380" font-family="Inter, sans-serif" font-size="14" fill="#581C87" text-anchor="middle">Episodic Memory (Disk)</text>
  <text x="600" y="400" font-family="Inter, sans-serif" font-size="14" fill="#581C87" text-anchor="middle">Sagas (Checkpoints)</text>

  <!-- Connection to Storage -->
  <path d="M 600 230 L 600 290" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  
  <!-- OS Runtime -->
  <rect x="50" y="300" width="300" height="150" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2" />
  <text x="200" y="330" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#065F46" text-anchor="middle">Runtime (The OS)</text>
  <text x="200" y="360" font-family="Inter, sans-serif" font-size="14" fill="#065F46" text-anchor="middle">Agent Control Block (ACB)</text>
  <text x="200" y="380" font-family="Inter, sans-serif" font-size="14" fill="#065F46" text-anchor="middle">MicroVMs (Sandboxing)</text>
  <text x="200" y="400" font-family="Inter, sans-serif" font-size="14" fill="#065F46" text-anchor="middle">Tool Execution (System Calls)</text>

  <!-- Connection Processor <-> OS -->
  <path d="M 200 230 L 200 290" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" />

</svg>
