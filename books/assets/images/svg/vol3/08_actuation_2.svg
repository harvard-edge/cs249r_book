<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Inter, sans-serif">
  <defs>
    <style>
      .phase-aot { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 1.5; }
      .phase-rt { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .box { rx: 8; ry: 8; }
      .text-dark { fill: #1F2937; font-size: 14px; }
      .text-title { font-weight: bold; font-size: 16px; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; }
      .arrow-dashed { stroke: #6B7280; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      marker { fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff" />

  <!-- Phase 1: AOT Compilation -->
  <rect x="50" y="50" width="300" height="700" class="phase-aot box" />
  <text x="200" y="80" class="text-title" fill="#5B21B6" text-anchor="middle">Phase 1: Ahead-of-Time (AOT)</text>
  <text x="200" y="100" class="text-title" fill="#5B21B6" text-anchor="middle">Schema Compilation</text>

  <rect x="75" y="140" width="250" height="80" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="200" y="170" class="text-title" text-anchor="middle" font-size="14px">Tool ABI Schema</text>
  <text x="200" y="195" class="text-dark" font-size="12px" text-anchor="middle">(JSON Schema / Pydantic)</text>
  <path d="M200 220 L200 260" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="75" y="260" width="250" height="80" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="200" y="290" class="text-title" text-anchor="middle" font-size="14px">Context-Free Grammar</text>
  <text x="200" y="315" class="text-dark" font-size="12px" text-anchor="middle">Formal string &amp; key productions</text>
  <path d="M200 340 L200 380" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="75" y="380" width="250" height="80" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="200" y="410" class="text-title" text-anchor="middle" font-size="14px">Deterministic Finite Automaton</text>
  <text x="200" y="435" class="text-dark" font-size="12px" text-anchor="middle">M = (Q, Σ, δ, q_0, F)</text>
  <path d="M200 460 L200 500" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="75" y="500" width="250" height="90" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="200" y="530" class="text-title" text-anchor="middle" font-size="14px">Vocabulary Bitmask Tensor</text>
  <text x="200" y="555" class="text-dark" font-size="12px" text-anchor="middle">A(q) ∈ {0, 1}^(|Q| × |V|)</text>
  <text x="200" y="575" class="text-dark" font-size="12px" text-anchor="middle">Pinned in Accelerator Memory</text>

  <!-- Connection from AOT to Runtime -->
  <path d="M325 545 L460 545" class="arrow-dashed" marker-end="url(#arrowhead)" />
  <text x="390" y="535" class="text-dark" font-size="12px" text-anchor="middle">Loads into GPU</text>

  <!-- Phase 2: Runtime -->
  <rect x="400" y="50" width="550" height="700" class="phase-rt box" />
  <text x="675" y="80" class="text-title" fill="#1E40AF" text-anchor="middle">Phase 2: Real-Time GPU Autoregressive Decoding Loop</text>

  <rect x="430" y="140" width="230" height="80" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="545" y="170" class="text-title" text-anchor="middle" font-size="14px">Unconstrained Logits</text>
  <text x="545" y="195" class="text-dark" font-size="12px" text-anchor="middle">z_t ∈ R^|V| (Forward Pass)</text>
  
  <rect x="690" y="140" width="230" height="80" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="805" y="170" class="text-title" text-anchor="middle" font-size="14px">Current Automaton State</text>
  <text x="805" y="195" class="text-dark" font-size="12px" text-anchor="middle">State q_t (Parse Position)</text>

  <path d="M545 220 L545 280" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M805 220 L805 260 L655 260 L655 280" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="480" y="280" width="350" height="70" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="655" y="310" class="text-title" text-anchor="middle" font-size="14px">Fetch Allowed Token Mask A(q_t)</text>
  <text x="655" y="335" class="text-dark" font-size="12px" text-anchor="middle">Bitwise lookup: 1 = Allowed, 0 = Forbidden</text>
  <path d="M655 350 L655 390" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="480" y="390" width="350" height="70" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="655" y="420" class="text-title" text-anchor="middle" font-size="14px">Custom CUDA Logit Masking Kernel</text>
  <text x="655" y="445" class="text-dark" font-size="12px" text-anchor="middle">z~_{t, v} = z_{t, v} if v ∈ A(q_t) else -∞</text>
  <path d="M655 460 L655 500" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="480" y="500" width="350" height="70" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="655" y="530" class="text-title" text-anchor="middle" font-size="14px">Softmax Probability Distribution</text>
  <text x="655" y="555" class="text-dark" font-size="12px" text-anchor="middle">Forbidden tokens evaluated to exactly p = 0.00%</text>
  <path d="M655 570 L655 610" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="430" y="610" width="200" height="80" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="530" y="640" class="text-title" text-anchor="middle" font-size="14px">Autoregressive Sampler</text>
  <text x="530" y="665" class="text-dark" font-size="12px" text-anchor="middle">Sample y_t ~ p(y_t | y_&lt;t)</text>

  <rect x="690" y="610" width="230" height="80" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="805" y="640" class="text-title" text-anchor="middle" font-size="14px">Automaton State Transition</text>
  <text x="805" y="665" class="text-dark" font-size="12px" text-anchor="middle">q_{t+1} = δ*(q_t, decode(y_t))</text>

  <path d="M630 650 L690 650" class="arrow" marker-end="url(#arrowhead)" />

  <path d="M805 610 L805 220" class="arrow-dashed" marker-end="url(#arrowhead)" />
  <text x="815" y="400" class="text-dark" font-size="12px" transform="rotate(-90 815 400)">Next Autoregressive Step</text>

</svg>
