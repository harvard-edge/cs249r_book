<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f8f9fa" stroke-width="1"/>
    </pattern>
    <linearGradient id="untrustedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="secureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.05" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- 1. Untrusted Zone -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="300" height="300" rx="8" fill="url(#untrustedGrad)" stroke="#F87171" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)"/>
    <text x="20" y="30" font-weight="600" font-size="14" fill="#991B1B">Untrusted Agent Execution Boundary</text>
    <text x="20" y="45" font-size="12" fill="#B91C1C">(Ephemeral Sandbox)</text>
    
    <rect x="20" y="70" width="260" height="50" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="150" y="90" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle">Autonomous Agent Policy π_θ</text>
    <text x="150" y="106" font-size="10" fill="#991B1B" text-anchor="middle">(Potentially Scheming)</text>
    
    <rect x="20" y="150" width="260" height="50" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="150" y="170" font-size="12" font-weight="500" fill="#7F1D1D" text-anchor="middle">Mutable Workspace (UpperDir)</text>
    <text x="150" y="186" font-size="11" font-family="monospace" fill="#991B1B" text-anchor="middle">src/lib.rs, main.py</text>
    
    <rect x="20" y="230" width="260" height="50" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="150" y="250" font-size="12" font-weight="500" fill="#7F1D1D" text-anchor="middle">Read-Only Test Mount</text>
    <text x="150" y="266" font-size="11" font-family="monospace" fill="#991B1B" text-anchor="middle">tests/test_public.py</text>
    
    <path d="M 150 120 L 150 150" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 280 95 L 320 95 L 320 255 L 280 255" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-red)"/>
    <rect x="330" y="165" width="80" height="20" fill="#FFFFFF" stroke="#EF4444" rx="4"/>
    <text x="370" y="179" font-size="9" fill="#EF4444" text-anchor="middle">Tampering Attempt</text>
  </g>

  <!-- 2. Security Gate -->
  <g transform="translate(380, 40)">
    <rect x="0" y="0" width="260" height="300" rx="8" fill="url(#gateGrad)" stroke="#9CA3AF" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="30" font-weight="600" font-size="14" fill="#374151">Harness Integrity Verification Gate</text>
    
    <rect x="20" y="70" width="220" height="70" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
    <text x="130" y="90" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Cryptographic Hash Auditor</text>
    <text x="130" y="108" font-size="10" font-family="monospace" fill="#4B5563" text-anchor="middle">SHA256(Tests_terminal)</text>
    <text x="130" y="122" font-size="10" font-family="monospace" fill="#4B5563" text-anchor="middle">== SHA256(Tests_initial)</text>
    
    <rect x="20" y="180" width="220" height="60" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
    <text x="130" y="200" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Clean Patch Extraction</text>
    <text x="130" y="220" font-size="11" font-family="monospace" fill="#4B5563" text-anchor="middle">git diff &gt; agent.patch</text>
  </g>

  <!-- Connections from Untrusted to Gate -->
  <path d="M 300 255 L 380 105" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 300 175 L 380 210" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Out-of-Band Enclave -->
  <g transform="translate(680, 40)">
    <rect x="0" y="0" width="280" height="400" rx="8" fill="url(#secureGrad)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="30" font-weight="600" font-size="14" fill="#065F46">Out-of-Band Verification Enclave</text>
    <text x="20" y="45" font-size="12" fill="#047857">(Isolated Namespace)</text>
    
    <rect x="20" y="70" width="240" height="50" rx="4" fill="#FFFFFF" stroke="#34D399" stroke-width="1"/>
    <text x="140" y="90" font-size="12" font-weight="600" fill="#064E3B" text-anchor="middle">Fresh Hermetic MicroVM</text>
    <text x="140" y="106" font-size="10" fill="#065F46" text-anchor="middle">(No network, no IPC/PID)</text>
    
    <rect x="20" y="140" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#34D399" stroke-width="1"/>
    <text x="140" y="160" font-size="12" font-weight="500" fill="#064E3B" text-anchor="middle">Apply agent.patch</text>
    <text x="140" y="174" font-size="10" fill="#065F46" text-anchor="middle">(Reject if patch touches tests/)</text>

    <!-- Test Suites -->
    <rect x="20" y="200" width="240" height="110" rx="4" fill="rgba(255,255,255,0.6)" stroke="#6EE7B7" stroke-width="1"/>
    <text x="30" y="220" font-size="11" font-weight="600" fill="#065F46">Split Evaluation Suites</text>
    
    <rect x="30" y="235" width="220" height="30" rx="4" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
    <text x="140" y="254" font-size="11" fill="#064E3B" text-anchor="middle">Public Diagnostic Tests</text>
    
    <rect x="30" y="270" width="220" height="30" rx="4" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
    <text x="140" y="289" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Held-Out Private Test Split</text>

    <rect x="20" y="330" width="240" height="50" rx="4" fill="#FFFFFF" stroke="#34D399" stroke-width="1"/>
    <text x="140" y="350" font-size="12" font-weight="600" fill="#064E3B" text-anchor="middle">Deterministic Oracle</text>
    <text x="140" y="366" font-size="10" font-family="monospace" fill="#065F46" text-anchor="middle">Runs private test runner</text>
    
    <path d="M 140 120 L 140 140" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 140 180 L 140 200" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 140 310 L 140 330" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Connections from Gate to Enclave -->
  <path d="M 640 105 L 680 95" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="75" width="80" height="20" rx="4" fill="#F0FDF4" stroke="#6EE7B7" stroke-width="1"/>
  <text x="620" y="89" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">Hash OK</text>
  
  <path d="M 640 210 L 680 160" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Security Fault Abort -->
  <rect x="400" y="370" width="220" height="50" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="510" y="392" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">Abort Trajectory (Security Fault)</text>
  <text x="510" y="408" font-size="11" fill="#991B1B" text-anchor="middle">Reward R = -1.0</text>
  
  <path d="M 490 140 L 490 370" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="450" y="270" width="80" height="20" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="490" y="284" font-size="10" font-weight="600" fill="#B91C1C" text-anchor="middle">Hash Mismatch</text>

  <!-- 4. Reward Compute -->
  <g transform="translate(680, 470)">
    <rect x="0" y="0" width="280" height="100" rx="8" fill="url(#gateGrad)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="25" font-weight="600" font-size="14" fill="#4338CA">Secure Reward Gate</text>
    
    <rect x="20" y="40" width="240" height="40" rx="4" fill="#EEF2FF" stroke="#818CF8" stroke-width="1"/>
    <text x="140" y="58" font-size="12" font-weight="600" fill="#3730A3" text-anchor="middle">R = 1.0 (Private Tests Pass)</text>
    <text x="140" y="74" font-size="11" fill="#4338CA" text-anchor="middle">R = 0.0 (Fail / Timeout)</text>
  </g>

  <!-- Enclave to Reward -->
  <path d="M 820 440 L 820 470" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
