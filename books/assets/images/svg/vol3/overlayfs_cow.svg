<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
    <!-- Definitions -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
        </marker>
        <marker id="arrow-dashed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="800" height="600" fill="#ffffff" />
    
    <!-- Title -->
    <text x="400" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">OverlayFS Copy-on-Write Architecture</text>

    <!-- Blocks -->
    <rect x="200" y="80" width="400" height="60" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
    <text x="400" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">MergedFS Mount: /workspace</text>
    <text x="400" y="125" font-size="12" text-anchor="middle" fill="#4b5563">(Unified POSIX view presented to Guest Agent)</text>

    <rect x="200" y="200" width="400" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="400" y="225" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">UpperDir: /tmp/scratch_tenant42 (tmpfs)</text>
    <text x="400" y="245" font-size="12" text-anchor="middle" fill="#b45309">In-memory writable scratch space</text>
    <text x="400" y="260" font-size="12" text-anchor="middle" fill="#b45309">Captures file mutations and whiteout devices (c 0 0)</text>

    <rect x="200" y="320" width="400" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="400" y="340" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">WorkDir: /tmp/work_tenant42 (tmpfs)</text>
    <text x="400" y="358" font-size="12" text-anchor="middle" fill="#0c4a6e">Atomic rename staging and internal VFS locks</text>

    <rect x="200" y="410" width="400" height="80" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="400" y="435" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">LowerDir: /var/lib/images/agent-base-rootfs</text>
    <text x="400" y="455" font-size="12" text-anchor="middle" fill="#166534">Immutable Read-Only NVMe (OS + tools)</text>
    <text x="400" y="470" font-size="12" text-anchor="middle" fill="#166534">100% Host Page Cache Sharing across 500+ VMs</text>

    <!-- Side Actions -->
    <path d="M 600 240 L 700 240" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="710" y="220" width="80" height="40" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="750" y="245" font-size="12" text-anchor="middle" fill="#991b1b">Instant Teardown</text>

    <path d="M 200 110 C 50 110, 50 450, 200 450" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="40" y="270" width="100" height="40" fill="#ffffff" stroke="#9CA3AF" stroke-width="1"/>
    <text x="90" y="285" font-size="12" text-anchor="middle" fill="#374151">Read Miss</text>
    <text x="90" y="300" font-size="12" text-anchor="middle" fill="#374151">(passes to lower)</text>
    
    <path d="M 200 450 L 150 450 L 150 240 L 200 240" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="100" y="330" width="80" height="30" fill="#ffffff" stroke="#9CA3AF" stroke-width="1"/>
    <text x="140" y="348" font-size="12" text-anchor="middle" fill="#374151">Copy-Up Event</text>
    
    <!-- Arrows between boxes -->
    <path d="M 400 140 L 400 200" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 400 280 L 400 320" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 400 370 L 400 410" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,4" />
</svg>
