<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; fill: #111827; }
      .text-normal { font-family: 'Inter', sans-serif; font-size: 14px; fill: #374151; }
      .text-small { font-family: 'Inter', sans-serif; font-size: 12px; fill: #4B5563; }
      .text-code { font-family: 'monospace'; font-size: 12px; fill: #D97706; }
      .box { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; rx: 6; }
      .box-red { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #F0FDF4; stroke: #22C55E; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #FFF7ED; stroke: #F97316; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #6B7280; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
      .label-bg { fill: #ffffff; opacity: 0.9; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Section 1 -->
  <text x="20" y="40" class="text-title">1. Immutable Boundary Event Sourcing (WAL)</text>
  <rect x="20" y="55" width="860" height="110" fill="none" stroke="#E5E7EB" stroke-width="2" rx="8" />

  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="130" height="60" class="box" />
    <text x="65" y="25" text-anchor="middle" class="text-normal">Event e_0</text>
    <text x="65" y="45" text-anchor="middle" class="text-code">Seed, Prompt</text>

    <line x1="130" y1="30" x2="190" y2="30" class="arrow" />

    <rect x="200" y="0" width="130" height="60" class="box" />
    <text x="265" y="25" text-anchor="middle" class="text-normal">Event e_1</text>
    <text x="265" y="45" text-anchor="middle" class="text-code">Model, Tool Out</text>

    <line x1="330" y1="30" x2="390" y2="30" class="arrow-dashed" />

    <rect x="400" y="0" width="130" height="60" class="box-highlight" />
    <text x="465" y="25" text-anchor="middle" class="text-normal">Event e_15</text>
    <text x="465" y="45" text-anchor="middle" class="text-code">Checkpoint t*</text>

    <line x1="530" y1="30" x2="680" y2="30" class="arrow-dashed" />

    <rect x="690" y="0" width="130" height="60" class="box-red" />
    <text x="755" y="25" text-anchor="middle" class="text-normal">Event e_H</text>
    <text x="755" y="45" text-anchor="middle" class="text-code">Step 47 Crash!</text>
  </g>

  <!-- Section 2 -->
  <text x="20" y="210" class="text-title">2. CoW Filesystem Snapshot Hierarchy</text>
  <rect x="20" y="225" width="860" height="110" fill="none" stroke="#E5E7EB" stroke-width="2" rx="8" />

  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="130" height="60" class="box" />
    <text x="65" y="35" text-anchor="middle" class="text-normal">snap@step_0</text>

    <line x1="130" y1="30" x2="390" y2="30" class="arrow-dashed" />

    <rect x="400" y="0" width="170" height="60" class="box-highlight" />
    <text x="485" y="25" text-anchor="middle" class="text-normal">snap@step_15</text>
    <text x="485" y="45" text-anchor="middle" class="text-code">ZFS/OverlayFS Clone</text>

    <line x1="570" y1="30" x2="680" y2="30" class="arrow-dashed" />

    <rect x="690" y="0" width="130" height="60" class="box-red" />
    <text x="755" y="25" text-anchor="middle" class="text-normal">snap@step_47</text>
    <text x="755" y="45" text-anchor="middle" class="text-code">Corrupted State</text>
  </g>

  <!-- Section 3 -->
  <text x="20" y="380" class="text-title">3. State Rewind &amp; Counterfactual Branch Forking</text>
  <rect x="20" y="395" width="860" height="180" fill="none" stroke="#E5E7EB" stroke-width="2" rx="8" />

  <g transform="translate(40, 420)">
    
    <path d="M 755 -115 L 755 -40 L 150 -40 L 150 -5" class="arrow-dashed" stroke="#EF4444" />
    <rect x="350" y="-50" width="150" height="20" class="label-bg" />
    <text x="425" y="-35" text-anchor="middle" class="text-small" fill="#EF4444">1. Trigger Rewind to t*</text>

    <rect x="0" y="0" width="180" height="60" class="box-orange" />
    <text x="90" y="35" text-anchor="middle" class="text-normal">Time-Travel Debugger Engine</text>

    <path d="M 90 60 L 90 100 L 250 100" class="arrow" />
    <text x="95" y="80" class="text-small">3. Restore Context Vector</text>

    <path d="M 120 0 L 120 -80 L 400 -80 L 400 -115" class="arrow" />
    <rect x="200" y="-90" width="170" height="20" class="label-bg" />
    <text x="285" y="-75" text-anchor="middle" class="text-small">2. Rollback CoW Filesystem</text>

    <rect x="260" y="70" width="160" height="60" class="box-highlight" />
    <text x="340" y="35" text-anchor="middle" class="text-normal">Hydrated ACB (Step 15)</text>

    <line x1="420" y1="100" x2="480" y2="100" class="arrow" />
    <text x="450" y="90" text-anchor="middle" class="text-small">4. Inject</text>

    <polygon points="490,100 540,70 590,100 540,130" class="box-orange" />
    <text x="540" y="105" text-anchor="middle" class="text-small">Operator</text>

    <line x1="590" y1="100" x2="650" y2="100" class="arrow" />

    <rect x="660" y="70" width="160" height="60" class="box-green" />
    <text x="740" y="25" text-anchor="middle" class="text-normal">Counterfactual Branch</text>
    <text x="740" y="45" text-anchor="middle" class="text-code">Forward Exploration</text>

  </g>

</svg>
