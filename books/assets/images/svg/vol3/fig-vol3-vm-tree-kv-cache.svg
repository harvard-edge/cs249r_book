<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Inter, sans-serif">
  <defs>
    <style>
      .box-root { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; rx: 8; }
      .box-a { fill: #DCFCE7; stroke: #16A34A; stroke-width: 2; rx: 8; }
      .box-b { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; rx: 8; }
      .box-c { fill: #F3E8FF; stroke: #9333EA; stroke-width: 2; rx: 8; }
      
      .text-bold { font-size: 14px; font-weight: 700; fill: #1F2937; text-anchor: middle; }
      .text-norm { font-size: 13px; font-weight: 500; fill: #4B5563; text-anchor: middle; }
      .text-ref { font-size: 13px; font-weight: 600; fill: #991B1B; text-anchor: middle; }
      
      .arrow { stroke: #9CA3AF; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#9CA3AF" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />

  <!-- Root Context -->
  <rect class="box-root" x="225" y="40" width="350" height="80" />
  <text x="400" y="65" class="text-bold">Root Context: System + MCP Schemas + Repo Map</text>
  <text x="400" y="85" class="text-norm">16,000 tokens (Shared Physical Blocks: #12-#1011)</text>
  <text x="400" y="105" class="text-ref">ref_count = 3</text>

  <!-- Branch A -->
  <rect class="box-a" x="50" y="200" width="210" height="80" />
  <text x="155" y="225" class="text-bold">Branch A: In-Place Patch</text>
  <text x="155" y="245" class="text-norm">+500 tokens (Blocks #1012-#1043)</text>
  <text x="155" y="265" class="text-ref">ref_count = 1</text>

  <!-- Branch B -->
  <rect class="box-b" x="295" y="200" width="210" height="80" />
  <text x="400" y="225" class="text-bold">Branch B: Modular Rewrite</text>
  <text x="400" y="245" class="text-norm">+500 tokens (Blocks #1044-#1075)</text>
  <text x="400" y="265" class="text-ref">ref_count = 1</text>

  <!-- Branch C -->
  <rect class="box-c" x="540" y="200" width="210" height="80" />
  <text x="645" y="225" class="text-bold">Branch C: TDD Test Harness</text>
  <text x="645" y="245" class="text-norm">+500 tokens (Blocks #1076-#1107)</text>
  <text x="645" y="265" class="text-ref">ref_count = 1</text>

  <!-- Arrows -->
  <path class="arrow" d="M 350 120 C 350 160, 155 160, 155 195" />
  <path class="arrow" d="M 400 120 L 400 195" />
  <path class="arrow" d="M 450 120 C 450 160, 645 160, 645 195" />

</svg>
