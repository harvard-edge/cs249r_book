<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <rect width="800" height="600" fill="#ffffff" />
    <style>
        .title { font-family: Inter, sans-serif; font-size: 20px; font-weight: bold; fill: #1f2937; }
        .node-label { font-family: Inter, sans-serif; font-size: 14px; font-weight: bold; fill: #1f2937; }
        .sub-text { font-family: Inter, sans-serif; font-size: 12px; fill: #4b5563; }
        .conn-label { font-family: Inter, sans-serif; font-size: 12px; fill: #6b7280; }
        .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; }
        .arrow-reject { stroke: #ef4444; stroke-width: 2; fill: none; stroke-dasharray: 4; }
    </style>
    
    <text x="400" y="40" text-anchor="middle" class="title">Execution-Based Rejection Sampling Gate</text>

    <!-- Proposal -->
    <rect x="300" y="80" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="400" y="105" text-anchor="middle" class="node-label">Trajectory Proposal</text>
    <text x="400" y="125" text-anchor="middle" class="sub-text">τ ~ π_θ(· | x)</text>

    <!-- Cascade Container -->
    <rect x="250" y="180" width="300" height="280" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <text x="400" y="205" text-anchor="middle" class="node-label" fill="#475569">Cascading Deterministic Verification</text>

    <!-- Stages -->
    <rect x="300" y="220" width="200" height="40" rx="4" fill="#fff" stroke="#64748b" />
    <text x="400" y="245" text-anchor="middle" class="sub-text">1. Syntax AST Validation</text>

    <rect x="300" y="280" width="200" height="40" rx="4" fill="#fff" stroke="#64748b" />
    <text x="400" y="305" text-anchor="middle" class="sub-text">2. Schema Conformance</text>

    <rect x="300" y="340" width="200" height="40" rx="4" fill="#fff" stroke="#64748b" />
    <text x="400" y="365" text-anchor="middle" class="sub-text">3. Environment Invariants</text>

    <rect x="300" y="400" width="200" height="40" rx="4" fill="#fff" stroke="#64748b" />
    <text x="400" y="425" text-anchor="middle" class="sub-text">4. Test Suite Execution</text>

    <!-- Outcomes -->
    <rect x="150" y="500" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="250" y="530" text-anchor="middle" class="node-label">ACCEPTED (R=1)</text>
    <text x="250" y="550" text-anchor="middle" class="sub-text">Golden Trajectories</text>

    <rect x="450" y="500" width="200" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="550" y="530" text-anchor="middle" class="node-label">REJECTED (R=0)</text>
    <text x="550" y="550" text-anchor="middle" class="sub-text">Error Recovery Mining</text>

    <!-- Connections -->
    <path d="M 400 140 L 400 170" class="arrow" marker-end="url(#arrowhead)" />
    
    <path d="M 400 260 L 400 275" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 400 320 L 400 335" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 400 380 L 400 395" class="arrow" marker-end="url(#arrowhead)" />
    
    <path d="M 300 440 L 250 495" class="arrow" marker-end="url(#arrowhead)" />
    <text x="230" y="470" class="conn-label">All Pass</text>

    <!-- Rejections -->
    <path d="M 500 240 L 650 240 L 650 495 L 600 495" class="arrow-reject" marker-end="url(#arrowhead-reject)" />
    <path d="M 500 300 L 620 300 L 620 495 L 580 495" class="arrow-reject" marker-end="url(#arrowhead-reject)" />
    <path d="M 500 360 L 590 360 L 590 495 L 560 495" class="arrow-reject" marker-end="url(#arrowhead-reject)" />
    <path d="M 500 420 L 550 420 L 550 495" class="arrow-reject" marker-end="url(#arrowhead-reject)" />

    <text x="660" y="235" class="conn-label">Parse Error</text>
    <text x="630" y="295" class="conn-label">Schema Violation</text>

    <!-- Arrowheads -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
        </marker>
        <marker id="arrowhead-reject" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
        </marker>
    </defs>
</svg>
