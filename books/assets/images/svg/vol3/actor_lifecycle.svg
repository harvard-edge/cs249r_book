<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="font-family: Inter, sans-serif; background-color: #F9FAFB;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
    </marker>
    <rect id="state" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="2" />
  </defs>

  <g transform="translate(330, 50)">
    <circle cx="70" cy="-20" r="10" fill="#1F2937" />
    <path d="M 70 -10 L 70 20" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
    
    <use href="#state" x="0" y="20" />
    <text x="70" y="50" text-anchor="middle" font-weight="bold" fill="#1F2937">IDLE</text>
  </g>

  <g transform="translate(330, 160)">
    <use href="#state" x="0" y="0" />
    <text x="70" y="30" text-anchor="middle" font-weight="bold" fill="#1F2937">RECEIVING</text>
  </g>

  <path d="M 400 120 L 400 150" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="410" y="140" font-size="12" fill="#4B5563">Message Arrives in Mailbox</text>

  <path d="M 330 185 L 260 185 L 260 75 L 320 75" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="140" y="130" font-size="12" fill="#4B5563">Malformed Payload</text>

  <g transform="translate(330, 270)">
    <use href="#state" x="0" y="0" />
    <text x="70" y="30" text-anchor="middle" font-weight="bold" fill="#1F2937">INFERRING</text>
  </g>

  <path d="M 400 210 L 400 260" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="410" y="240" font-size="12" fill="#4B5563">Schema Validated &amp; Token Checked</text>

  <g transform="translate(60, 270)">
    <use href="#state" x="0" y="0" />
    <text x="70" y="30" text-anchor="middle" font-weight="bold" fill="#1F2937">TOOL_EXEC</text>
  </g>

  <path d="M 330 280 L 210 280" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="270" text-anchor="middle" font-size="12" fill="#4B5563">Tool Call Emitted</text>

  <path d="M 210 310 L 320 310" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#4B5563">Tool Result Appended</text>

  <g transform="translate(600, 270)">
    <use href="#state" x="0" y="0" />
    <text x="70" y="30" text-anchor="middle" font-weight="bold" fill="#1F2937">REPLYING</text>
  </g>

  <path d="M 470 295 L 590 295" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="530" y="285" text-anchor="middle" font-size="12" fill="#4B5563">Response Generated</text>

  <path d="M 670 270 L 670 95 L 480 95" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="680" y="180" font-size="12" fill="#4B5563">Message Dispatched</text>

  <g transform="translate(330, 420)">
    <use href="#state" x="0" y="0" />
    <text x="70" y="30" text-anchor="middle" font-weight="bold" fill="#DC2626">FAILED</text>
  </g>

  <path d="M 400 320 L 400 410" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="410" y="370" font-size="12" fill="#4B5563">Context Exhaustion / Exception</text>

  <path d="M 130 320 L 130 445 L 320 445" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="140" y="400" font-size="12" fill="#4B5563">Sandbox Timeout / Non-Zero Exit</text>

  <path d="M 470 445 L 750 445 L 750 75 L 480 75" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="760" y="280" font-size="12" fill="#4B5563">Supervisor Restart (one_for_one)</text>

</svg>
