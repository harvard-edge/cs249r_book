<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
        </marker>
    </defs>
    
    <rect width="800" height="600" fill="#ffffff" />
    
    <text x="400" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Information Flow Control (IFC) Lattice</text>

    <!-- Lattice side -->
    <rect x="50" y="80" width="300" height="450" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="200" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Security Lattice</text>
    
    <!-- Untrusted / Top -->
    <rect x="100" y="140" width="200" height="60" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="200" y="165" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">Untrusted / Tainted (⊤)</text>
    <text x="200" y="185" font-size="11" text-anchor="middle" fill="#b91c1c">Web, PRs, Tool Return Logs</text>
    
    <!-- Join Operator -->
    <circle cx="200" cy="270" r="30" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="200" y="275" font-size="18" font-weight="bold" text-anchor="middle" fill="#334155">⊔</text>
    
    <!-- Trusted / Bottom -->
    <rect x="100" y="370" width="200" height="60" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="200" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">Trusted / Clean (⊥)</text>
    <text x="200" y="415" font-size="11" text-anchor="middle" fill="#15803d">System Prompt, User Queries</text>
    
    <path d="M 200 370 L 200 300" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 200 240 L 200 200" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    
    <path d="M 50 270 L 170 270" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="100" y="260" font-size="11" text-anchor="middle" fill="#ef4444">Untrusted Input</text>

    <!-- Context side -->
    <rect x="420" y="80" width="330" height="200" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="585" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Agent Context State</text>
    
    <rect x="450" y="140" width="270" height="40" rx="4" fill="#ffffff" stroke="#9CA3AF" stroke-width="1"/>
    <text x="585" y="165" font-size="14" font-family="monospace" text-anchor="middle" fill="#374151">s_t = [x_1, x_2, ..., x_n]</text>
    
    <rect x="450" y="210" width="270" height="40" rx="4" fill="#ffffff" stroke="#9CA3AF" stroke-width="1"/>
    <text x="585" y="235" font-size="14" font-family="monospace" text-anchor="middle" fill="#374151">τ(s_t) = ⨆ τ(x_i)</text>

    <!-- Attenuation side -->
    <rect x="420" y="320" width="330" height="210" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="585" y="350" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Capability Attenuation Filter</text>
    
    <polygon points="585,370 650,400 585,430 520,400" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>
    <text x="585" y="405" font-size="12" font-weight="bold" text-anchor="middle" fill="#854D0E">τ == Trusted?</text>
    
    <path d="M 585 250 L 585 370" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Allowed -->
    <rect x="430" y="450" width="130" height="60" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="1"/>
    <text x="495" y="475" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534">Privileged Tools</text>
    <text x="495" y="495" font-size="10" text-anchor="middle" fill="#15803d">Allowed</text>
    
    <!-- Locked -->
    <rect x="600" y="450" width="130" height="60" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="665" y="475" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Privileged Tools</text>
    <text x="665" y="495" font-size="10" text-anchor="middle" fill="#b91c1c">Locked</text>
    
    <path d="M 540 410 L 495 450" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 630 410 L 665 450" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534">Yes</text>
    <text x="660" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">No</text>
</svg>
