<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f8f9fa" stroke-width="1"/>
    </pattern>
    <linearGradient id="genGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF" />
      <stop offset="100%" stop-color="#FAE8FF" />
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="backtrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <linearGradient id="execGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.05" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- 1. Hypothesis Generation -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="300" height="150" rx="8" fill="url(#genGrad)" stroke="#E879F9" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="150" y="25" font-weight="600" font-size="14" fill="#86198F" text-anchor="middle">Hypothesis Generation</text>
    
    <rect x="20" y="40" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#E879F9" stroke-width="1"/>
    <text x="150" y="64" font-size="12" font-family="monospace" fill="#4A044E" text-anchor="middle">Autoregressive Decode a_t ~ π(·|q, a_&lt;t)</text>
    
    <rect x="20" y="95" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#E879F9" stroke-width="1"/>
    <text x="150" y="120" font-size="12" fill="#4A044E" text-anchor="middle">Synthesize Candidate Step / Deduction</text>
    
    <path d="M 150 80 L 150 95" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 2. Self Monitoring -->
  <g transform="translate(420, 40)">
    <rect x="0" y="0" width="300" height="150" rx="8" fill="url(#monitorGrad)" stroke="#FBBF24" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="150" y="25" font-weight="600" font-size="14" fill="#B45309" text-anchor="middle">Self-Monitoring (Deep Attention)</text>
    
    <rect x="20" y="40" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1"/>
    <text x="150" y="64" font-size="12" fill="#78350F" text-anchor="middle">Attend to Early Context &amp; System Invariants</text>
    
    <rect x="20" y="95" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1"/>
    <text x="150" y="120" font-size="12" fill="#78350F" text-anchor="middle">Compare Derivation vs Constraints</text>
    
    <path d="M 150 80 L 150 95" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Connection: Gen -> Monitor -->
  <path d="M 350 115 L 420 115" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="105" font-size="11" fill="#4B5563" text-anchor="middle">Evaluate</text>

  <!-- 3. Backtracking Phase -->
  <g transform="translate(420, 260)">
    <rect x="0" y="0" width="300" height="200" rx="8" fill="url(#backtrackGrad)" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="150" y="25" font-weight="600" font-size="14" fill="#991B1B" text-anchor="middle">Backtracking Phase (Self-Correction)</text>
    
    <rect x="20" y="40" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#F87171" stroke-width="1"/>
    <text x="150" y="64" font-size="12" font-family="monospace" fill="#7F1D1D" text-anchor="middle">Emit Reconsideration Marker ("Wait...")</text>
    
    <rect x="20" y="95" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#F87171" stroke-width="1"/>
    <text x="150" y="120" font-size="12" fill="#7F1D1D" text-anchor="middle">Invalidate Prior Deductive Branch</text>
    
    <rect x="20" y="150" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#F87171" stroke-width="1"/>
    <text x="150" y="175" font-size="12" fill="#7F1D1D" text-anchor="middle">Synthesize Alternative Strategy</text>
    
    <path d="M 150 80 L 150 95" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 150 135 L 150 150" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Connection: Monitor -> Backtrack -->
  <path d="M 570 190 L 570 260" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="210" width="140" height="20" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="570" y="224" font-size="11" font-weight="500" fill="#DC2626" text-anchor="middle">Semantic Inconsistency</text>

  <!-- Connection: Monitor -> Tool Actuation (Direct) -->
  <path d="M 720 115 L 850 115 L 850 490 L 720 490" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="735" y="105" width="100" height="20" rx="10" fill="#F0FDF4" stroke="#6EE7B7" stroke-width="1"/>
  <text x="785" y="119" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">Invariants OK</text>

  <!-- Backtrack Loop back to Generation? Actually the text says Synthesize Alternative Strategy, which could loop or go to execution. The diagram flows to Tool Actuation -->
  <path d="M 570 460 L 570 510" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 4. Tool Actuation & Verification Oracle -->
  <g transform="translate(420, 510)">
    <rect x="0" y="0" width="300" height="150" rx="8" fill="url(#execGrad)" stroke="#34D399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="150" y="25" font-weight="600" font-size="14" fill="#065F46" text-anchor="middle">Tool Actuation &amp; Verification</text>
    
    <rect x="20" y="40" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#34D399" stroke-width="1"/>
    <text x="150" y="64" font-size="12" fill="#064E3B" text-anchor="middle">Commit Grounded Patch in MicroVM</text>
    
    <rect x="20" y="95" width="260" height="40" rx="4" fill="#FFFFFF" stroke="#34D399" stroke-width="1"/>
    <text x="150" y="120" font-size="12" fill="#064E3B" text-anchor="middle">Deterministic Oracle Check (Test Harness)</text>
    
    <path d="M 150 80 L 150 95" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 5. Outcome -->
  <g transform="translate(770, 550)">
    <rect x="0" y="0" width="120" height="35" rx="17.5" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="60" y="22" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Pass (R = 1.0)</text>
    
    <rect x="0" y="55" width="120" height="35" rx="17.5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="60" y="77" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">Fail (R = 0.0)</text>
  </g>

  <!-- Connection to Outcome -->
  <path d="M 720 567.5 L 765 567.5" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 567.5 L 740 567.5 L 740 605 L 765 605" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
