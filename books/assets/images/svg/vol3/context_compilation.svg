<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: white; font-family: 'Inter', sans-serif;">
  <!-- Definitions for markers and filters -->
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E53E3E" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38A169" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Panel 1: In-Context Prompting -->
  <rect x="50" y="50" width="900" height="200" rx="12" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2" />
  <text x="70" y="80" font-size="18" font-weight="600" fill="#E53E3E">In-Context Prompting Runtime (Uncompiled)</text>

  <!-- Nodes for Panel 1 -->
  <!-- Monolithic Prompt -->
  <g transform="translate(80, 110)">
    <rect width="250" height="100" rx="8" fill="white" stroke="#E53E3E" stroke-width="1.5" filter="url(#shadow)" />
    <text x="125" y="25" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Monolithic Prompt Prefix</text>
    <text x="125" y="45" font-size="12" text-anchor="middle" fill="#4A5568">(32k Tokens)</text>
    <text x="15" y="65" font-size="12" fill="#4A5568">• OpenAPI Tool Definitions</text>
    <text x="15" y="80" font-size="12" fill="#4A5568">• Behavioral Guardrails &amp; Rules</text>
    <text x="15" y="95" font-size="12" fill="#4A5568">• Few-Shot Exemplars</text>
  </g>

  <path d="M 330 160 L 370 160" stroke="#E53E3E" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Prefill Bottleneck -->
  <g transform="translate(380, 110)">
    <rect width="250" height="100" rx="8" fill="white" stroke="#E53E3E" stroke-width="1.5" filter="url(#shadow)" />
    <text x="125" y="40" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Quadratic Prefill Attention</text>
    <text x="125" y="65" font-size="13" text-anchor="middle" fill="#4A5568">O(T² · d_model)</text>
    <text x="125" y="85" font-size="13" text-anchor="middle" fill="#E53E3E" font-weight="600">Latency Bottleneck</text>
  </g>

  <path d="M 630 160 L 670 160" stroke="#E53E3E" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- KV Cache / Attention Dispersion -->
  <g transform="translate(680, 110)">
    <rect width="240" height="100" rx="8" fill="white" stroke="#E53E3E" stroke-width="1.5" filter="url(#shadow)" />
    <text x="120" y="30" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Memory &amp; Attention Wall</text>
    <text x="120" y="50" font-size="12" text-anchor="middle" fill="#4A5568">~10.5 GB VRAM / Agent</text>
    <text x="120" y="70" font-size="12" text-anchor="middle" fill="#E53E3E">"Lost in the Middle"</text>
    <text x="120" y="90" font-size="12" text-anchor="middle" fill="#E53E3E">Hallucinated Arguments</text>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(500, 250)">
    <path d="M 0 0 L 0 70" stroke="#718096" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-gray)" />
    <rect x="-110" y="15" width="220" height="40" rx="20" fill="white" stroke="#718096" stroke-width="1.5" />
    <text x="0" y="40" font-size="14" font-weight="600" text-anchor="middle" fill="#4A5568">Gradient Descent (Compilation)</text>
  </g>

  <!-- Panel 2: Context Compilation -->
  <rect x="50" y="340" width="900" height="200" rx="12" fill="#F0FFF4" stroke="#38A169" stroke-width="2" />
  <text x="70" y="370" font-size="18" font-weight="600" fill="#2F855A">Context Compilation Runtime (Supervised Fine-Tuning)</text>

  <!-- Nodes for Panel 2 -->
  <!-- Dynamic Prompt -->
  <g transform="translate(80, 400)">
    <rect width="250" height="100" rx="8" fill="white" stroke="#38A169" stroke-width="1.5" filter="url(#shadow)" />
    <text x="125" y="35" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Dynamic Goal Prompt</text>
    <text x="125" y="55" font-size="12" text-anchor="middle" fill="#4A5568">(~500 Tokens)</text>
    <text x="15" y="75" font-size="12" fill="#4A5568">• Task Specification</text>
    <text x="15" y="90" font-size="12" fill="#4A5568">• Immediate State Payload</text>
  </g>

  <path d="M 330 450 L 370 450" stroke="#38A169" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Compiled Weights -->
  <g transform="translate(380, 400)">
    <rect width="250" height="100" rx="8" fill="white" stroke="#38A169" stroke-width="1.5" filter="url(#shadow)" />
    <text x="125" y="35" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Compiled Policy Weights</text>
    <text x="125" y="60" font-size="14" text-anchor="middle" fill="#2F855A" font-style="italic">W = W₀ + ΔW</text>
    <text x="125" y="85" font-size="12" text-anchor="middle" fill="#4A5568">(Tool Schemas in Parameters)</text>
  </g>

  <path d="M 630 450 L 670 450" stroke="#38A169" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Fast execution -->
  <g transform="translate(680, 400)">
    <rect width="240" height="100" rx="8" fill="white" stroke="#38A169" stroke-width="1.5" filter="url(#shadow)" />
    <text x="120" y="30" font-size="14" font-weight="600" text-anchor="middle" fill="#2D3748">Sub-Millisecond Prefill</text>
    <text x="120" y="50" font-size="12" text-anchor="middle" fill="#4A5568">85% Prefix Reduction</text>
    <text x="120" y="70" font-size="12" text-anchor="middle" fill="#2F855A">Preserved Tool Circuits</text>
    <text x="120" y="90" font-size="12" text-anchor="middle" fill="#2F855A">Strict Schema Adherence</text>
  </g>

</svg>
