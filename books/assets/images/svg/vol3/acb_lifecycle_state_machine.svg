<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="font-family:Inter, sans-serif; background-color:#ffffff;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#4B5563" />
        </marker>
        <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#DC2626" />
        </marker>
        <rect id="state-rect" width="200" height="60" rx="8" />
    </defs>

    <g transform="translate(400, 40)">
        <use href="#state-rect" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">INITIALIZED</text>
    </g>

    <g transform="translate(400, 160)">
        <use href="#state-rect" fill="#ECFCCB" stroke="#84CC16" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#3F6212">ACTIVE_PREFILL</text>
    </g>

    <g transform="translate(400, 280)">
        <use href="#state-rect" fill="#ECFCCB" stroke="#84CC16" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#3F6212">ACTIVE_DECODE</text>
    </g>

    <g transform="translate(100, 400)">
        <use href="#state-rect" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">SUSPENDED_TOOL_WAIT</text>
    </g>

    <g transform="translate(700, 400)">
        <use href="#state-rect" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">SUSPENDED_HUMAN_GATE</text>
    </g>

    <g transform="translate(100, 520)">
        <use href="#state-rect" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#581C87">MEMORY_SWAPPING</text>
    </g>

    <g transform="translate(700, 280)">
        <use href="#state-rect" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">ROLLBACK_COMPENSATING</text>
    </g>

    <g transform="translate(400, 600)">
        <use href="#state-rect" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#14532D">TERMINATED_SUCCESS</text>
    </g>

    <g transform="translate(700, 600)">
        <use href="#state-rect" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
        <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#7F1D1D">TERMINATED_FAILED</text>
    </g>

    <!-- Connectors -->
    <!-- INIT to PREFILL -->
    <path d="M500,100 L500,150" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="510" y="130" font-size="12" fill="#4B5563">Admission Gate</text>

    <!-- PREFILL to DECODE -->
    <path d="M500,220 L500,270" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="510" y="250" font-size="12" fill="#4B5563">First Token</text>

    <!-- DECODE to SUSPENDED TOOL -->
    <path d="M400,310 L250,310 L250,390" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="260" y="300" font-size="12" fill="#4B5563">Emit Tool Schema</text>

    <!-- SUSPENDED TOOL to PREFILL -->
    <path d="M150,400 L150,190 L390,190" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="240" font-size="12" fill="#4B5563">Observation Return</text>

    <!-- DECODE to SUSPENDED HUMAN -->
    <path d="M600,310 L800,310 L800,390" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="630" y="300" font-size="12" fill="#4B5563">Privilege Escalate</text>
    
    <!-- SUSPENDED HUMAN to PREFILL -->
    <path d="M850,400 L850,190 L610,190" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="730" y="240" font-size="12" fill="#4B5563">Approval Granted</text>

    <!-- DECODE to TERMINATED SUCCESS -->
    <path d="M500,340 L500,590" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="510" y="470" font-size="12" fill="#4B5563">Goal Complete</text>

    <!-- TOOL WAIT to MEMORY SWAPPING -->
    <path d="M200,460 L200,510" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="490" font-size="12" fill="#4B5563">Wait &gt; Breakeven</text>

    <!-- MEMORY SWAPPING back to TOOL WAIT -->
    <path d="M150,520 L150,470" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="490" font-size="12" fill="#4B5563">Swap Done</text>

    <!-- DECODE to ROLLBACK -->
    <path d="M600,290 L690,290" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="610" y="280" font-size="12" fill="#4B5563">Invariant Viol.</text>

    <!-- ALL to TERMINATED FAILED -->
    <!-- From DECODE -->
    <path d="M570,340 L720,590" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-error)"/>
    <!-- From ROLLBACK -->
    <path d="M800,340 L800,590" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-error)"/>
    <!-- From INIT -->
    <path d="M600,70 L950,70 L950,630 L910,630" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-error)"/>

</svg>
