<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Inter, sans-serif">
  <defs>
    <style>
      .host { fill: #FAF5FF; stroke: #7C3AED; stroke-width: 1.5; }
      .client { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .trans { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; }
      .server { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.5; }
      .box { rx: 8; ry: 8; }
      .text-dark { fill: #1F2937; font-size: 14px; }
      .text-title { font-weight: bold; font-size: 16px; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; }
      .arrow-dashed { stroke: #6B7280; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      marker { fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowhead-both" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff" />

  <!-- Host Application -->
  <rect x="50" y="50" width="900" height="150" class="host box" />
  <text x="70" y="80" class="text-title" fill="#5B21B6">Host Application (Agent Runtime Core)</text>

  <rect x="80" y="100" width="250" height="80" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="205" y="125" class="text-title" text-anchor="middle" font-size="14px">Agent Orchestration Engine</text>
  <text x="205" y="145" class="text-dark" text-anchor="middle" font-size="12px">Trajectory Deliberation</text>
  <text x="205" y="165" class="text-dark" text-anchor="middle" font-size="12px">State Ledger, Goal Tracking</text>

  <rect x="360" y="100" width="250" height="80" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="485" y="125" class="text-title" text-anchor="middle" font-size="14px">Context Window &amp; Memory</text>
  <text x="485" y="145" class="text-dark" text-anchor="middle" font-size="12px">Radix KV Cache</text>
  <text x="485" y="165" class="text-dark" text-anchor="middle" font-size="12px">Attention Working Set</text>

  <path d="M330 140 L360 140" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M360 140 L330 140" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="640" y="100" width="280" height="80" fill="#ffffff" stroke="#7C3AED" rx="4" />
  <text x="780" y="125" class="text-title" text-anchor="middle" font-size="14px">Authoritative Policy Gateway</text>
  <text x="780" y="145" class="text-dark" text-anchor="middle" font-size="12px">Capability Lease Verification</text>
  <text x="780" y="165" class="text-dark" text-anchor="middle" font-size="12px">Complete Mediation Boundary</text>

  <path d="M610 140 L640 140" class="arrow" marker-end="url(#arrowhead)" />
  <text x="625" y="130" class="text-dark" font-size="10px" text-anchor="middle">Validated</text>

  <!-- Client Protocol Gateway -->
  <path d="M780 200 L780 250" class="arrow" marker-end="url(#arrowhead)" />
  <text x="790" y="230" class="text-dark" font-size="12px">Authorized Invocation</text>

  <rect x="250" y="250" width="500" height="100" class="client box" />
  <text x="270" y="280" class="text-title" fill="#1E40AF">Client Protocol Gateway</text>
  
  <rect x="280" y="295" width="440" height="40" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="500" y="312" class="text-dark" font-weight="bold" text-anchor="middle">JSON-RPC 2.0 Protocol Engine</text>
  <text x="500" y="327" class="text-dark" font-size="12px" text-anchor="middle">Frame serialization &amp; correlation (Call IDs)</text>

  <!-- Transport Layer -->
  <rect x="50" y="400" width="900" height="150" class="trans box" />
  <text x="70" y="430" class="text-title" fill="#166534">Dual Transport Framing (Local IPC vs Remote Cloud)</text>

  <path d="M400 350 L280 450" class="arrow" marker-end="url(#arrowhead)" />
  <text x="250" y="390" class="text-dark" font-size="12px">Local child process</text>

  <path d="M600 350 L720 450" class="arrow" marker-end="url(#arrowhead)" />
  <text x="690" y="390" class="text-dark" font-size="12px">Remote network RPC</text>

  <rect x="80" y="450" width="400" height="80" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="280" y="475" class="text-title" text-anchor="middle">Local IPC: stdio Transport</text>
  <text x="280" y="495" class="text-dark" font-size="12px" text-anchor="middle">Newline-Delimited JSON-RPC via unbuffered OS Pipes</text>
  <text x="280" y="515" class="text-dark" font-size="12px" text-anchor="middle">Sub-millisecond latency, Zero Network Exposure</text>

  <rect x="520" y="450" width="400" height="80" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="720" y="475" class="text-title" text-anchor="middle">Remote Cloud: HTTP / SSE Transport</text>
  <text x="720" y="495" class="text-dark" font-size="12px" text-anchor="middle">Server-Sent Events (SSE) Stream + HTTP POST</text>
  <text x="720" y="515" class="text-dark" font-size="12px" text-anchor="middle">Distributed microservices &amp; ephemeral containers</text>

  <!-- Tool Servers -->
  <rect x="50" y="600" width="900" height="150" class="server box" />
  <text x="70" y="630" class="text-title" fill="#92400E">Decoupled Tool Servers &amp; Resource Providers</text>

  <path d="M280 530 L180 650" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M280 530 L450 650" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M720 530 L780 650" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="80" y="650" width="220" height="70" fill="#ffffff" stroke="#D97706" rx="4" />
  <text x="190" y="675" class="text-title" text-anchor="middle" font-size="14px">Filesystem MCP Server</text>
  <text x="190" y="695" class="text-dark" font-size="12px" text-anchor="middle">(Atomic edits, views)</text>

  <rect x="340" y="650" width="240" height="70" fill="#ffffff" stroke="#D97706" rx="4" />
  <text x="460" y="675" class="text-title" text-anchor="middle" font-size="14px">Compute Sandbox MicroVM</text>
  <text x="460" y="695" class="text-dark" font-size="12px" text-anchor="middle">(POSIX shell, compilers)</text>

  <rect x="650" y="650" width="260" height="70" fill="#ffffff" stroke="#D97706" rx="4" />
  <text x="780" y="675" class="text-title" text-anchor="middle" font-size="14px">Database &amp; Analytics Server</text>
  <text x="780" y="695" class="text-dark" font-size="12px" text-anchor="middle">(Read-only SQL schemas)</text>

</svg>
