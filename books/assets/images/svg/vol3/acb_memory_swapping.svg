<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="font-family:Inter, sans-serif; background-color:#ffffff;">
    <defs>
        <marker id="arrow-swap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#3B82F6" />
        </marker>
        <marker id="arrow-swap-rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#10B981" />
        </marker>
        <rect id="tier-box" width="300" height="200" rx="8" />
    </defs>

    <!-- Tier 1 -->
    <g transform="translate(350, 20)">
        <use href="#tier-box" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
        <text x="150" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#991B1B">Tier 1: Accelerator HBM3e</text>
        <text x="150" y="55" text-anchor="middle" font-size="14" fill="#991B1B">Active Agent Contexts</text>
        <rect x="40" y="70" width="220" height="100" fill="#FEE2E2" stroke="#F87171" stroke-width="2"/>
        <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F1D1D">KV Cache Pages</text>
        <text x="150" y="130" text-anchor="middle" font-size="12" fill="#7F1D1D">(High bandwidth, Low capacity)</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(100, 350)">
        <use href="#tier-box" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
        <text x="150" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A8A">Tier 2: Host DDR5 DRAM</text>
        <text x="150" y="55" text-anchor="middle" font-size="14" fill="#1E3A8A">Short-term Tool Wait Swapping</text>
        <rect x="40" y="70" width="220" height="100" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
        <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E40AF">Evicted PagedAttention Blocks</text>
        <text x="150" y="130" text-anchor="middle" font-size="12" fill="#1E40AF">(Medium bandwidth, Med capacity)</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(600, 350)">
        <use href="#tier-box" fill="#ECFCCB" stroke="#84CC16" stroke-width="3"/>
        <text x="150" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#3F6212">Tier 3: Local NVMe SSD</text>
        <text x="150" y="55" text-anchor="middle" font-size="14" fill="#3F6212">Long-term Suspend / Human Gate</text>
        <rect x="40" y="70" width="220" height="100" fill="#D9F99D" stroke="#A3E635" stroke-width="2"/>
        <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#4D7C0F">Serialized Session State</text>
        <text x="150" y="130" text-anchor="middle" font-size="12" fill="#4D7C0F">(Low bandwidth, High capacity)</text>
    </g>

    <!-- Interconnect HBM <-> DRAM -->
    <path d="M400,220 L300,350" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrow-swap)"/>
    <path d="M330,350 L430,220" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrow-swap-rev)"/>
    <text x="260" y="270" font-size="14" font-weight="bold" fill="#374151" transform="rotate(50, 260, 270)">PCIe Gen5 x16 DMA (64 GB/s)</text>

    <!-- Interconnect DRAM <-> NVMe -->
    <path d="M400,420 L600,420" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrow-swap)"/>
    <path d="M600,460 L400,460" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrow-swap-rev)"/>
    <text x="430" y="410" font-size="14" font-weight="bold" fill="#374151">Page out to Disk</text>
    <text x="440" y="485" font-size="14" font-weight="bold" fill="#374151">Prefetch to RAM</text>
</svg>
