<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <rect width="800" height="600" fill="#ffffff" />
    <style>
        .title { font-family: Inter, sans-serif; font-size: 20px; font-weight: bold; fill: #1f2937; }
        .tier-label { font-family: Inter, sans-serif; font-size: 14px; font-weight: bold; fill: #4b5563; }
        .node-text { font-family: Inter, sans-serif; font-size: 13px; fill: #1f2937; }
        .sub-text { font-family: Inter, sans-serif; font-size: 11px; fill: #4b5563; }
        .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; }
    </style>
    
    <text x="400" y="40" text-anchor="middle" class="title">Disaggregated Compute Architecture for Trajectory Synthesis</text>

    <!-- GPU Fleet -->
    <rect x="50" y="80" width="220" height="420" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" />
    <text x="160" y="110" text-anchor="middle" class="tier-label">GPU Rollout Fleet</text>
    <text x="160" y="130" text-anchor="middle" class="sub-text">Continuous Batching Inference</text>

    <rect x="70" y="160" width="180" height="60" rx="4" fill="#fff" stroke="#9333ea" />
    <text x="160" y="190" text-anchor="middle" class="node-text">GPU Worker 1 (vLLM)</text>

    <rect x="70" y="240" width="180" height="60" rx="4" fill="#fff" stroke="#9333ea" />
    <text x="160" y="270" text-anchor="middle" class="node-text">GPU Worker 2 (vLLM)</text>

    <rect x="70" y="400" width="180" height="60" rx="4" fill="#fff" stroke="#9333ea" />
    <text x="160" y="430" text-anchor="middle" class="node-text">GPU Worker N (vLLM)</text>
    
    <circle cx="160" cy="330" r="3" fill="#9333ea" />
    <circle cx="160" cy="350" r="3" fill="#9333ea" />
    <circle cx="160" cy="370" r="3" fill="#9333ea" />

    <!-- Message Queue -->
    <rect x="320" y="80" width="160" height="420" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="400" y="270" text-anchor="middle" class="tier-label">Decoupling Tier</text>
    <text x="400" y="295" text-anchor="middle" class="node-text">Message Stream</text>
    <text x="400" y="315" text-anchor="middle" class="sub-text">(Kafka / Redis)</text>

    <!-- CPU Fleet -->
    <rect x="530" y="80" width="220" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="640" y="110" text-anchor="middle" class="tier-label">CPU Verification Fleet</text>
    <text x="640" y="130" text-anchor="middle" class="sub-text">Deterministic Oracles</text>

    <rect x="550" y="150" width="180" height="50" rx="4" fill="#fff" stroke="#22c55e" />
    <text x="640" y="175" text-anchor="middle" class="node-text">CPU Host 1 (MicroVMs)</text>

    <rect x="550" y="220" width="180" height="50" rx="4" fill="#fff" stroke="#22c55e" />
    <text x="640" y="245" text-anchor="middle" class="node-text">CPU Host 2 (MicroVMs)</text>

    <circle cx="640" cy="285" r="3" fill="#22c55e" />
    <circle cx="640" cy="295" r="3" fill="#22c55e" />

    <rect x="550" y="310" width="180" height="50" rx="4" fill="#fff" stroke="#22c55e" />
    <text x="640" y="335" text-anchor="middle" class="node-text">CPU Host M (MicroVMs)</text>

    <!-- Storage Tier -->
    <rect x="530" y="420" width="220" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
    <text x="640" y="450" text-anchor="middle" class="tier-label">Curated Data Staging</text>
    <text x="640" y="475" text-anchor="middle" class="sub-text">Parquet Storage (S3/GCS)</text>

    <!-- Connections -->
    <path d="M 250 190 L 315 190" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 250 270 L 315 270" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 250 430 L 315 430" class="arrow" marker-end="url(#arrowhead)" />
    
    <path d="M 480 175 L 545 175" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 480 245 L 545 245" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 480 335 L 545 335" class="arrow" marker-end="url(#arrowhead)" />

    <path d="M 640 380 L 640 415" class="arrow" marker-end="url(#arrowhead)" />

    <!-- Arrowhead definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
        </marker>
    </defs>
</svg>
