<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #4B5563; stroke-width: 2; rx: 8; ry: 8; }
      .text-title { font-size: 16px; font-weight: bold; fill: #1F2937; }
      .text-desc { font-size: 12px; fill: #4B5563; }
      .arrow { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-dashed { fill: none; stroke: #374151; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <rect x="50" y="50" width="200" height="100" class="box" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="150" y="80" class="text-title" fill="#0369A1" text-anchor="middle">Agent Core</text>
  <text x="150" y="105" class="text-desc" text-anchor="middle">State s_t</text>
  <text x="150" y="125" class="text-desc" text-anchor="middle">Propose Action a_t</text>

  <rect x="300" y="50" width="200" height="100" class="box" fill="#FEF08A" stroke="#CA8A04"/>
  <text x="400" y="80" class="text-title" fill="#A16207" text-anchor="middle">Non-Volatile WAL</text>
  <text x="400" y="105" class="text-desc" text-anchor="middle">Append-Only Log</text>
  <text x="400" y="125" class="text-desc" text-anchor="middle">(fsync to Disk)</text>

  <rect x="550" y="50" width="200" height="100" class="box" fill="#D1FAE5" stroke="#059669"/>
  <text x="650" y="80" class="text-title" fill="#047857" text-anchor="middle">External World</text>
  <text x="650" y="105" class="text-desc" text-anchor="middle">Tool Dispatch</text>
  <text x="650" y="125" class="text-desc" text-anchor="middle">Mutation on Env</text>

  <path d="M 250 100 L 300 100" class="arrow" />
  <text x="275" y="90" class="text-desc" text-anchor="middle" font-size="10">1. fsync</text>

  <path d="M 500 100 L 550 100" class="arrow" />
  <text x="525" y="90" class="text-desc" text-anchor="middle" font-size="10">2. execute</text>

  <rect x="300" y="250" width="200" height="80" class="box" fill="#FECACA" stroke="#DC2626"/>
  <text x="400" y="280" class="text-title" fill="#B91C1C" text-anchor="middle">Crash Recovery</text>
  <text x="400" y="300" class="text-desc" text-anchor="middle">Compensating Saga</text>
  <text x="400" y="315" class="text-desc" text-anchor="middle">(Rollback)</text>

  <path d="M 650 150 L 650 200 L 450 200 L 450 250" class="arrow-dashed" />
  <text x="550" y="190" class="text-desc" text-anchor="middle" font-size="10">crash/partition</text>

</svg>
