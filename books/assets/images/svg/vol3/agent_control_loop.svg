<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" />

  <!-- Agent Box -->
  <rect x="100" y="50" width="250" height="300" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2" />
  <text x="225" y="80" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">Agent (POMDP)</text>

  <!-- State (s_t) -->
  <rect x="125" y="120" width="200" height="60" rx="5" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" />
  <text x="225" y="155" font-family="Inter, sans-serif" font-size="16" fill="#1E3A8A" text-anchor="middle">Belief State (s_t)</text>

  <!-- Policy / Model -->
  <rect x="125" y="230" width="200" height="60" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
  <text x="225" y="265" font-family="Inter, sans-serif" font-size="16" fill="#92400E" text-anchor="middle">Policy Model (LLM)</text>

  <!-- Internal Agent Flow -->
  <path d="M 225 180 L 225 220" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Environment Box -->
  <rect x="500" y="50" width="200" height="300" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2" />
  <text x="600" y="80" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">Environment</text>

  <!-- Tools / Execution -->
  <rect x="525" y="170" width="150" height="60" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="2" />
  <text x="600" y="205" font-family="Inter, sans-serif" font-size="16" fill="#065F46" text-anchor="middle">Runtime Execution</text>

  <!-- Action (a_t) Arrow -->
  <path d="M 325 260 L 450 260 L 450 200 L 515 200" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="280" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Action (a_t)</text>

  <!-- Observation (o_t) Arrow -->
  <path d="M 525 200 L 450 200 L 450 150 L 335 150" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="140" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Observation (o_t)</text>

  <!-- Transition label (s_t+1) -->
  <text x="225" y="190" font-family="Inter, sans-serif" font-size="12" fill="#4B5563" text-anchor="start">Transition (s_t+1)</text>
</svg>
