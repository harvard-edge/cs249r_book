<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" style="font-family: Inter, sans-serif; background: #ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280" />
    </marker>
    
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="tierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9FAFB" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F9FAFB" />
    </linearGradient>
    
    <!-- Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">Agentic Reference Architecture</text>

  <!-- 1. Ingress Tier -->
  <rect x="40" y="80" width="1120" height="120" rx="8" fill="url(#tierGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="110" font-size="16" font-weight="bold" fill="#374151">1. Ingress &amp; Client Interface Tier</text>
  
  <rect x="250" y="110" width="280" height="60" rx="6" fill="url(#boxGrad)" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="135" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Client Applications</text>
  <text x="390" y="155" font-size="12" text-anchor="middle" fill="#6B7280">API Gateways</text>

  <rect x="670" y="110" width="280" height="60" rx="6" fill="url(#boxGrad)" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="135" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Ingress Controller</text>
  <text x="810" y="155" font-size="12" text-anchor="middle" fill="#6B7280">TLS Termination, Rate Limiting</text>
  
  <path d="M 530 140 L 660 140" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="130" font-size="11" text-anchor="middle" fill="#4B5563">gRPC / HTTPS</text>

  <!-- 2. Orchestration Tier -->
  <rect x="40" y="220" width="1120" height="160" rx="8" fill="url(#tierGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="250" font-size="16" font-weight="bold" fill="#374151">2. Orchestration &amp; Control Plane Tier</text>

  <rect x="80" y="280" width="300" height="70" rx="6" fill="url(#boxGrad)" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="305" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Temporal Workflow Engine</text>
  <text x="230" y="325" font-size="12" text-anchor="middle" fill="#6B7280">Durable Event Sourcing &amp; Sagas</text>

  <rect x="450" y="280" width="300" height="70" rx="6" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="305" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Agent Control Block &amp; FSM</text>
  <text x="600" y="325" font-size="12" text-anchor="middle" fill="#6B7280">LangGraph / StateGraph</text>

  <rect x="820" y="280" width="300" height="70" rx="6" fill="url(#boxGrad)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="305" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Context Working Set Governor</text>
  <text x="970" y="325" font-size="12" text-anchor="middle" fill="#6B7280">Token Budgets &amp; Compaction</text>

  <path d="M 810 170 L 230 270" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 380 315 L 440 315" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 440 315 L 380 315" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 750 315 L 810 315" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 810 315 L 750 315" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Stochastic Processor -->
  <rect x="40" y="400" width="540" height="300" rx="8" fill="url(#tierGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="430" font-size="16" font-weight="bold" fill="#374151">3. Stochastic Processor &amp; Memory Tier (GPU Cluster)</text>

  <rect x="160" y="450" width="300" height="50" rx="6" fill="url(#boxGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="470" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Continuous In-Flight Scheduler</text>
  <text x="310" y="488" font-size="12" text-anchor="middle" fill="#6B7280">Chunked Prefill &amp; Iteration Batching</text>

  <rect x="160" y="520" width="300" height="50" rx="6" fill="url(#boxGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="540" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Inference Execution Engines</text>
  <text x="310" y="558" font-size="12" text-anchor="middle" fill="#6B7280">vLLM / SGLang / TensorRT-LLM</text>

  <rect x="160" y="590" width="300" height="50" rx="6" fill="url(#boxGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="610" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Virtual Memory Page Allocator</text>
  <text x="310" y="628" font-size="12" text-anchor="middle" fill="#6B7280">PagedAttention &amp; Radix Trie</text>

  <rect x="160" y="660" width="300" height="50" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="680" font-size="14" font-weight="600" text-anchor="middle" fill="#065F46">Accelerator High-Bandwidth Memory</text>
  <text x="310" y="698" font-size="12" text-anchor="middle" fill="#047857">Model Weights &amp; Dynamic KV Cache</text>

  <path d="M 450 350 L 310 440" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 500 L 310 510" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 570 L 310 580" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 580 L 310 570" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 640 L 310 650" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 650 L 310 640" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>


  <!-- 4. Actuation Tier -->
  <rect x="620" y="400" width="540" height="300" rx="8" fill="url(#tierGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <text x="640" y="430" font-size="16" font-weight="bold" fill="#374151">4. Actuation &amp; Isolation Tier</text>

  <rect x="740" y="450" width="300" height="50" rx="6" fill="url(#boxGrad)" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="470" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Actuation Gateway (MCP)</text>
  <text x="890" y="488" font-size="12" text-anchor="middle" fill="#6B7280">Typed ABI Validation</text>

  <rect x="740" y="520" width="300" height="50" rx="6" fill="url(#boxGrad)" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="540" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2937">Capability &amp; Idempotency Validator</text>
  <text x="890" y="558" font-size="12" text-anchor="middle" fill="#6B7280">Cryptographic Leases &amp; Nonces</text>

  <rect x="640" y="590" width="500" height="100" rx="6" fill="#FEE2E2" stroke="#F87171" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="650" y="610" font-size="12" font-weight="bold" fill="#B91C1C">Isolated Workspaces (Sandboxes)</text>
  
  <rect x="650" y="620" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="725" y="645" font-size="12" font-weight="600" text-anchor="middle" fill="#7F1D1D">Firecracker</text>
  <text x="725" y="660" font-size="10" text-anchor="middle" fill="#991B1B">MicroVMs</text>

  <rect x="815" y="620" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="890" y="645" font-size="12" font-weight="600" text-anchor="middle" fill="#7F1D1D">gVisor</text>
  <text x="890" y="660" font-size="10" text-anchor="middle" fill="#991B1B">Containers</text>

  <rect x="980" y="620" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="1055" y="645" font-size="12" font-weight="600" text-anchor="middle" fill="#7F1D1D">Wasmtime</text>
  <text x="1055" y="660" font-size="10" text-anchor="middle" fill="#991B1B">WebAssembly</text>

  <path d="M 460 545 L 730 475" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="500" font-size="11" text-anchor="middle" fill="#4B5563">Tool Call Tokens</text>

  <path d="M 890 500 L 890 510" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  
  <path d="M 890 570 L 725 610" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 890 570 L 890 610" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 890 570 L 1055 610" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>


  <!-- 5. Storage Tier -->
  <rect x="40" y="720" width="540" height="240" rx="8" fill="url(#tierGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="750" font-size="16" font-weight="bold" fill="#374151">5. Episodic &amp; Working State Tier</text>

  <rect x="160" y="770" width="300" height="40" rx="6" fill="url(#boxGrad)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="795" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2937">Redis In-Memory Tier (Scratchpad)</text>

  <rect x="160" y="830" width="300" height="40" rx="6" fill="url(#boxGrad)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="855" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2937">Distributed Vector DB (Milvus/Pinecone)</text>

  <rect x="160" y="890" width="300" height="40" rx="6" fill="url(#boxGrad)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="915" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2937">Relational &amp; Document Store (PostgreSQL)</text>

  <path d="M 850 350 L 380 760" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 380 760 L 850 350" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <path d="M 970 350 L 460 840" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 460 840 L 970 350" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <path d="M 600 350 L 410 880" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 410 880 L 600 350" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <path d="M 725 690 L 440 890" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>


  <!-- 6. Telemetry Tier -->
  <rect x="620" y="720" width="540" height="240" rx="8" fill="url(#tierGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <text x="640" y="750" font-size="16" font-weight="bold" fill="#374151">6. Observability &amp; Crash-Consistency Tier</text>

  <rect x="740" y="770" width="300" height="40" rx="6" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="795" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2937">NVMe Write-Ahead Log (WAL)</text>

  <rect x="740" y="830" width="300" height="40" rx="6" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="855" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2937">OpenTelemetry Collector</text>

  <rect x="740" y="890" width="300" height="40" rx="6" fill="url(#boxGrad)" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="915" font-size="13" font-weight="600" text-anchor="middle" fill="#1F2937">Metrics &amp; APM (Prometheus/Jaeger)</text>

  <path d="M 980 500 L 980 760" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 230 350 L 730 840" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <path d="M 350 570 L 730 850" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <path d="M 920 500 L 920 820" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  
  <path d="M 890 870 L 890 880" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
