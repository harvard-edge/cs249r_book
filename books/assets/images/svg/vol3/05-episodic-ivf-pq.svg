<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #4B5563; stroke-width: 2; rx: 8; ry: 8; }
      .text-title { font-size: 14px; font-weight: bold; fill: #1F2937; }
      .text-desc { font-size: 12px; fill: #4B5563; }
      .arrow { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <!-- Ingestion -->
  <rect x="50" y="50" width="300" height="400" class="box" fill="#F3E8FF" stroke="#7E22CE"/>
  <text x="200" y="80" class="text-title" fill="#6B21A8" text-anchor="middle">Vector Quantization Pipeline</text>

  <rect x="75" y="100" width="250" height="50" class="box" fill="#ffffff" />
  <text x="200" y="125" class="text-title" text-anchor="middle">Input Vector x (D=1536)</text>

  <rect x="75" y="170" width="250" height="50" class="box" fill="#ffffff" />
  <text x="200" y="190" class="text-title" text-anchor="middle">Coarse Quantization</text>
  <text x="200" y="210" class="text-desc" text-anchor="middle">Assign to nearest centroid</text>

  <rect x="75" y="240" width="250" height="50" class="box" fill="#ffffff" />
  <text x="200" y="260" class="text-title" text-anchor="middle">Sub-Vector Decomposition</text>
  <text x="200" y="280" class="text-desc" text-anchor="middle">Split residual r into M parts</text>

  <rect x="75" y="310" width="250" height="50" class="box" fill="#ffffff" />
  <text x="200" y="335" class="text-title" text-anchor="middle">Quantize to Sub-Centroids</text>

  <rect x="75" y="380" width="250" height="50" class="box" fill="#ffffff" />
  <text x="200" y="400" class="text-title" text-anchor="middle">Quantized Byte Code</text>
  <text x="200" y="420" class="text-desc" text-anchor="middle">[c_i, k_1, ..., k_M]</text>

  <path d="M 200 150 L 200 170" class="arrow" />
  <path d="M 200 220 L 200 240" class="arrow" />
  <path d="M 200 290 L 200 310" class="arrow" />
  <path d="M 200 360 L 200 380" class="arrow" />

  <!-- Query Time -->
  <rect x="400" y="50" width="350" height="300" class="box" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="575" y="80" class="text-title" fill="#0369A1" text-anchor="middle">Query-Time ADC</text>

  <rect x="425" y="100" width="300" height="50" class="box" fill="#ffffff" />
  <text x="575" y="125" class="text-title" text-anchor="middle">Query Vector q</text>

  <rect x="425" y="180" width="300" height="50" class="box" fill="#ffffff" />
  <text x="575" y="200" class="text-title" text-anchor="middle">Precompute Distance Table</text>
  <text x="575" y="220" class="text-desc" text-anchor="middle">dist(q^(m), c^(m)_j)</text>

  <rect x="425" y="260" width="300" height="50" class="box" fill="#ffffff" />
  <text x="575" y="280" class="text-title" text-anchor="middle">Sum Lookup Values (ADC)</text>
  <text x="575" y="300" class="text-desc" text-anchor="middle">O(1) table lookups</text>

  <path d="M 575 150 L 575 180" class="arrow" />
  <path d="M 575 230 L 575 260" class="arrow" />
</svg>
