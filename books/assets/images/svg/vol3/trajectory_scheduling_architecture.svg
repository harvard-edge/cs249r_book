<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="font-family:Inter, sans-serif; background-color:#ffffff;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#4B5563" />
        </marker>
        <rect id="comp-box" width="240" height="100" rx="6" />
    </defs>

    <!-- Ingestion Layer -->
    <g transform="translate(100, 50)">
        <rect width="800" height="120" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#374151">Agent Ingestion &amp; Admission Layer</text>

        <rect x="40" y="50" width="200" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
        <text x="140" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Heavy-Tailed Pareto Queue</text>

        <rect x="300" y="50" width="200" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
        <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Horizon Predictor (LAS)</text>

        <rect x="560" y="50" width="200" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
        <text x="660" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">Admission Control Gate</text>
    </g>

    <!-- Global Control Plane -->
    <g transform="translate(100, 250)">
        <rect width="800" height="150" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400E">Global Trajectory Scheduler</text>

        <circle cx="250" cy="90" r="40" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
        <text x="250" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">State Manager</text>

        <circle cx="500" cy="90" r="40" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
        <text x="500" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Session Affinity</text>

        <circle cx="750" cy="90" r="40" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
        <text x="750" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">KV Swapper</text>
        
        <path d="M300,90 L450,90" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M550,90 L700,90" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- GPU Workers -->
    <g transform="translate(100, 480)">
        <rect width="800" height="140" rx="8" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
        <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#581C87">Heterogeneous GPU Worker Fleet</text>

        <rect x="50" y="50" width="200" height="70" rx="4" fill="#E9D5FF" stroke="#9333EA" stroke-width="2"/>
        <text x="150" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4C1D95">Prefill Worker</text>
        <text x="150" y="100" text-anchor="middle" font-size="12" fill="#4C1D95">Compute Bound (GEMM)</text>

        <rect x="300" y="50" width="200" height="70" rx="4" fill="#E9D5FF" stroke="#9333EA" stroke-width="2"/>
        <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4C1D95">Decode Worker 1</text>
        <text x="400" y="100" text-anchor="middle" font-size="12" fill="#4C1D95">Memory Bound (GEMV)</text>

        <rect x="550" y="50" width="200" height="70" rx="4" fill="#E9D5FF" stroke="#9333EA" stroke-width="2"/>
        <text x="650" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4C1D95">Decode Worker 2</text>
        <text x="650" y="100" text-anchor="middle" font-size="12" fill="#4C1D95">Warm Prefix Trees</text>
    </g>

    <!-- Connectors Ingestion to Scheduler -->
    <path d="M500,170 L500,250" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="510" y="215" font-size="12" font-weight="bold" fill="#374151">Admitted Trajectories</text>

    <!-- Connectors Scheduler to Workers -->
    <path d="M350,400 L250,480" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M500,400 L500,480" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M650,400 L750,480" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="510" y="440" font-size="12" font-weight="bold" fill="#374151">Disaggregated Prompt Dispatch</text>

</svg>
