<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" style="font-family:Inter, sans-serif; background-color:#ffffff;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#4B5563" />
        </marker>
        <rect id="queue-box" width="300" height="70" rx="4" />
        <rect id="term-box" width="160" height="40" rx="20" />
    </defs>

    <!-- Arrival -->
    <rect x="250" y="20" width="160" height="40" rx="20" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="330" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">New Agent Arrival</text>
    <path d="M330,60 L330,90" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Q0 -->
    <g transform="translate(180, 100)">
        <use href="#queue-box" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
        <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">Queue 0</text>
        <text x="150" y="50" text-anchor="middle" font-size="14" fill="#1E3A8A">Quantum: 2 steps | High Priority</text>
    </g>

    <!-- Q1 -->
    <g transform="translate(180, 210)">
        <use href="#queue-box" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400E">Queue 1</text>
        <text x="150" y="50" text-anchor="middle" font-size="14" fill="#92400E">Quantum: 8 steps | Medium Priority</text>
    </g>

    <!-- Q2 -->
    <g transform="translate(180, 320)">
        <use href="#queue-box" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
        <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#581C87">Queue 2</text>
        <text x="150" y="50" text-anchor="middle" font-size="14" fill="#581C87">Quantum: 32 steps | Low Priority</text>
    </g>

    <!-- Q3 -->
    <g transform="translate(180, 430)">
        <use href="#queue-box" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
        <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#831843">Queue 3</text>
        <text x="150" y="50" text-anchor="middle" font-size="14" fill="#831843">Quantum: 128 steps | Background</text>
    </g>

    <!-- Terminations -->
    <g transform="translate(600, 115)">
        <use href="#term-box" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
        <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#14532D">Terminated Success</text>
    </g>
    <path d="M480,135 L590,135" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="535" y="125" text-anchor="middle" font-size="12" fill="#4B5563">Finished</text>

    <g transform="translate(600, 225)">
        <use href="#term-box" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
        <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#14532D">Terminated Success</text>
    </g>
    <path d="M480,245 L590,245" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="535" y="235" text-anchor="middle" font-size="12" fill="#4B5563">Finished</text>

    <g transform="translate(600, 335)">
        <use href="#term-box" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
        <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#14532D">Terminated Success</text>
    </g>
    <path d="M480,355 L590,355" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="535" y="345" text-anchor="middle" font-size="12" fill="#4B5563">Finished</text>

    <g transform="translate(600, 445)">
        <use href="#term-box" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
        <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#14532D">Terminated Success</text>
    </g>
    <path d="M480,465 L590,465" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="535" y="455" text-anchor="middle" font-size="12" fill="#4B5563">Finished</text>

    <!-- Demotions -->
    <path d="M330,170 L330,200" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="190" font-size="12" fill="#4B5563">Quantum Expired</text>

    <path d="M330,280 L330,310" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="300" font-size="12" fill="#4B5563">Quantum Expired</text>

    <path d="M330,390 L330,420" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="410" font-size="12" fill="#4B5563">Quantum Expired</text>

    <!-- Boost -->
    <rect x="20" y="440" width="140" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="90" y="460" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Priority Boost Tick</text>
    <text x="90" y="475" text-anchor="middle" font-size="12" fill="#374151">(e.g., 60s)</text>
    
    <path d="M90,440 L90,135 L170,135" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <text x="100" y="280" font-size="12" fill="#6B7280" transform="rotate(-90, 100, 280)">Flush All Jobs Back</text>
</svg>
