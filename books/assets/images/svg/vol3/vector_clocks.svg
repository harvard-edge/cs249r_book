<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="font-family: Inter, sans-serif; background-color: #F9FAFB;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
    </marker>
    <rect id="participant" width="160" height="40" rx="4" fill="#E5E7EB" stroke="#4B5563" stroke-width="2" />
    <rect id="note" width="220" height="60" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
  </defs>

  <g transform="translate(100, 30)">
    <use href="#participant" x="0" y="0" />
    <text x="80" y="25" text-anchor="middle" font-weight="bold" fill="#1F2937">Supervisor (Actor A)</text>
    <line x1="80" y1="40" x2="80" y2="450" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4" />
  </g>

  <g transform="translate(320, 30)">
    <use href="#participant" x="0" y="0" />
    <text x="80" y="25" text-anchor="middle" font-weight="bold" fill="#1F2937">Worker 1 (Actor B)</text>
    <line x1="80" y1="40" x2="80" y2="450" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4" />
  </g>

  <g transform="translate(540, 30)">
    <use href="#participant" x="0" y="0" />
    <text x="80" y="25" text-anchor="middle" font-weight="bold" fill="#1F2937">Worker 2 (Actor C)</text>
    <line x1="80" y1="40" x2="80" y2="450" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4" />
  </g>

  <g transform="translate(70, 90)">
    <rect width="220" height="40" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
    <text x="110" y="18" text-anchor="middle" font-size="12" fill="#92400E">V_A = [1, 0, 0]</text>
    <text x="110" y="32" text-anchor="middle" font-size="12" fill="#92400E">Task Dispatch</text>
  </g>

  <path d="M 180 150 L 390 150" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="180" cy="150" r="10" fill="#3B82F6" /><text x="180" y="154" text-anchor="middle" font-size="10" fill="#FFFFFF">1</text>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#4B5563">Dispatch Subtask 1 (Msg: [1, 0, 0])</text>

  <g transform="translate(290, 170)">
    <use href="#note" x="0" y="0" />
    <text x="110" y="25" text-anchor="middle" font-size="12" fill="#92400E">V_B = max([0,0,0], [1,0,0]) + [0,1,0]</text>
    <text x="110" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">V_B = [1, 1, 0]</text>
  </g>

  <path d="M 180 260 L 610 260" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="180" cy="260" r="10" fill="#3B82F6" /><text x="180" y="264" text-anchor="middle" font-size="10" fill="#FFFFFF">2</text>
  <text x="395" y="250" text-anchor="middle" font-size="12" fill="#4B5563">Dispatch Dependency Context (Msg: [1, 0, 0])</text>

  <g transform="translate(510, 270)">
    <use href="#note" x="0" y="0" />
    <text x="110" y="25" text-anchor="middle" font-size="12" fill="#92400E">V_C = max([0,0,0], [1,0,0]) + [0,0,1]</text>
    <text x="110" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">V_C = [1, 0, 1]</text>
  </g>

  <path d="M 400 360 L 610 360" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="400" cy="360" r="10" fill="#3B82F6" /><text x="400" y="364" text-anchor="middle" font-size="10" fill="#FFFFFF">3</text>
  <text x="505" y="350" text-anchor="middle" font-size="12" fill="#4B5563">Intermediate Artifact Available (Msg: [1, 2, 0])</text>

  <g transform="translate(510, 370)">
    <rect width="220" height="75" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#92400E">Validate Causality: Msg[B] &lt;= V_C[B] + 1</text>
    <text x="110" y="35" text-anchor="middle" font-size="11" fill="#92400E">V_C = max([1,0,1], [1,2,0]) + [0,0,1]</text>
    <text x="110" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">V_C = [1, 2, 2]</text>
    <text x="110" y="65" text-anchor="middle" font-size="11" fill="#065F46">Causal Barrier Cleared: Safe to Merge</text>
  </g>
</svg>
