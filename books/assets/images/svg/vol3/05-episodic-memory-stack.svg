<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <style>
      .box { fill: #F3F4F6; stroke: #4B5563; stroke-width: 2; rx: 8; ry: 8; }
      .header { fill: #E5E7EB; stroke: #4B5563; stroke-width: 2; rx: 8; ry: 8; }
      .text-title { font-size: 16px; font-weight: bold; fill: #1F2937; }
      .text-desc { font-size: 12px; fill: #4B5563; }
      .arrow { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-dashed { fill: none; stroke: #374151; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <!-- Volatile Memory -->
  <rect x="50" y="50" width="700" height="150" class="box" fill="#FEF3C7" stroke="#D97706"/>
  <text x="60" y="70" class="text-title" fill="#92400E">Volatile Context Memory (Working Set)</text>

  <rect x="100" y="90" width="250" height="80" class="box" fill="#ffffff" />
  <text x="110" y="115" class="text-title">L1: Active Context</text>
  <text x="110" y="135" class="text-desc">GPU HBM / SRAM</text>
  <text x="110" y="150" class="text-desc">(Registers, FlashAttention)</text>

  <rect x="450" y="90" width="250" height="80" class="box" fill="#ffffff" />
  <text x="460" y="115" class="text-title">L2: Paged KV Cache</text>
  <text x="460" y="135" class="text-desc">Host DRAM / SSD</text>
  <text x="460" y="150" class="text-desc">(Speculative Prefill)</text>

  <path d="M 350 130 L 450 130" class="arrow" />
  <path d="M 450 140 L 350 140" class="arrow" />

  <!-- Boundary -->
  <rect x="50" y="230" width="700" height="40" rx="20" ry="20" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="400" y="255" class="text-title" fill="#3730A3" text-anchor="middle">Eviction &amp; Compaction Boundary (Transactional WAL)</text>

  <path d="M 400 200 L 400 230" class="arrow" />

  <!-- Persistent Storage -->
  <rect x="50" y="300" width="700" height="150" class="box" fill="#D1FAE5" stroke="#059669"/>
  <text x="60" y="320" class="text-title" fill="#065F46">Non-Volatile Episodic Storage (Secondary Tier)</text>

  <rect x="70" y="340" width="200" height="80" class="box" fill="#ffffff" />
  <text x="80" y="365" class="text-title">L3: Dense Vectors</text>
  <text x="80" y="385" class="text-desc">HNSW / IVF-PQ</text>
  <text x="80" y="400" class="text-desc">(Metric Spaces)</text>

  <rect x="300" y="340" width="200" height="80" class="box" fill="#ffffff" />
  <text x="310" y="365" class="text-title">L3: Topological Graphs</text>
  <text x="310" y="385" class="text-desc">Tree-Sitter AST</text>
  <text x="310" y="400" class="text-desc">(Symbol Repomaps)</text>

  <rect x="530" y="340" width="200" height="80" class="box" fill="#ffffff" />
  <text x="540" y="365" class="text-title">L3: Event Ledgers</text>
  <text x="540" y="385" class="text-desc">Append-Only SQLite</text>
  <text x="540" y="400" class="text-desc">(PostgreSQL WAL)</text>

  <!-- Connect Boundary to Storage -->
  <path d="M 170 270 L 170 340" class="arrow" />
  <path d="M 400 270 L 400 340" class="arrow" />
  <path d="M 630 270 L 630 340" class="arrow" />
</svg>
