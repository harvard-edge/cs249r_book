<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Inter, sans-serif">
  <defs>
    <style>
      .ring3 { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; }
      .gate { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; }
      .ring0 { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; }
      .sandbox { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .box { rx: 8; ry: 8; }
      .text-dark { fill: #1F2937; font-size: 14px; }
      .text-title { font-weight: bold; font-size: 16px; }
      .text-code { font-family: monospace; font-size: 12px; fill: #4B5563; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; }
      marker { fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff" />

  <!-- Ring 3 -->
  <rect x="50" y="50" width="900" height="200" class="ring3 box" />
  <text x="70" y="80" class="text-title" fill="#991B1B">Unprivileged User Space (Ring 3)</text>
  
  <rect x="100" y="100" width="450" height="120" fill="#ffffff" stroke="#DC2626" stroke-width="1" rx="4" />
  <text x="120" y="130" class="text-title">Stochastic Neural Processor (Foundation Model)</text>
  <text x="120" y="155" class="text-dark">- Autoregressive token generation over vocabulary V</text>
  <text x="120" y="175" class="text-dark">- Fail-plausible, untrusted execution core</text>
  <text x="120" y="195" class="text-dark">- Vulnerable to indirect prompt injection</text>

  <rect x="600" y="110" width="300" height="100" fill="#ffffff" stroke="#DC2626" stroke-width="1" rx="4" />
  <text x="620" y="140" class="text-title">Tool Invocation Token Stream</text>
  <text x="620" y="170" class="text-code">&lt;|call:tool_name|&gt; { params: ... }</text>

  <path d="M550 160 L590 160" class="arrow" marker-end="url(#arrowhead)" />
  <text x="560" y="150" class="text-dark" font-size="12px">Emits tokens</text>

  <!-- Trap Arrow -->
  <path d="M750 250 L750 310" class="arrow" marker-end="url(#arrowhead)" />
  <text x="760" y="285" class="text-dark" font-size="12px">Hardware-Style Supervisor Trap (SYS_TOOL_CALL)</text>

  <!-- Boundary Gate -->
  <rect x="250" y="320" width="500" height="80" class="gate box" />
  <text x="500" y="350" class="text-title" fill="#92400E" text-anchor="middle">Actuation Boundary (Complete Mediation Gate)</text>
  <text x="500" y="375" class="text-dark" text-anchor="middle">Authoritative Gateway Interception (Enforces Saltzer &amp; Schroeder)</text>

  <!-- Dispatch Arrow -->
  <path d="M500 400 L500 440" class="arrow" marker-end="url(#arrowhead)" />
  <text x="510" y="425" class="text-dark" font-size="12px">Dispatches to Kernel</text>

  <!-- Ring 0 -->
  <rect x="50" y="450" width="900" height="150" class="ring0 box" />
  <text x="70" y="480" class="text-title" fill="#166534">Supervisor Kernel Space (Ring 0)</text>

  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="200" height="70" fill="#ffffff" stroke="#16A34A" rx="4" />
    <text x="100" y="25" class="text-dark" font-weight="bold" text-anchor="middle">1. Tensor-Level DFA Masking</text>
    <text x="100" y="45" class="text-dark" font-size="11px" text-anchor="middle">CUDA logit mask kernel</text>
  </g>
  <path d="M280 535 L300 535" class="arrow" marker-end="url(#arrowhead)" />

  <g transform="translate(310, 500)">
    <rect x="0" y="0" width="200" height="70" fill="#ffffff" stroke="#16A34A" rx="4" />
    <text x="100" y="25" class="text-dark" font-weight="bold" text-anchor="middle">2. Structural Schema Valid.</text>
    <text x="100" y="45" class="text-dark" font-size="11px" text-anchor="middle">Rust Serde deserialization</text>
  </g>
  <path d="M510 535 L530 535" class="arrow" marker-end="url(#arrowhead)" />

  <g transform="translate(540, 500)">
    <rect x="0" y="0" width="200" height="70" fill="#ffffff" stroke="#16A34A" rx="4" />
    <text x="100" y="25" class="text-dark" font-weight="bold" text-anchor="middle">3. Cryptographic Verify</text>
    <text x="100" y="45" class="text-dark" font-size="11px" text-anchor="middle">Evaluate capability lease</text>
  </g>
  <path d="M740 535 L760 535" class="arrow" marker-end="url(#arrowhead)" />

  <g transform="translate(770, 500)">
    <rect x="0" y="0" width="160" height="70" fill="#ffffff" stroke="#16A34A" rx="4" />
    <text x="80" y="25" class="text-dark" font-weight="bold" text-anchor="middle">4. Idempotency</text>
    <text x="80" y="45" class="text-dark" font-size="11px" text-anchor="middle">Distributed lease lock</text>
  </g>

  <!-- To Sandbox -->
  <path d="M500 600 L500 640" class="arrow" marker-end="url(#arrowhead)" />
  <text x="510" y="625" class="text-dark" font-size="12px">Authorized &amp; Validated Dispatch</text>

  <!-- Sandbox -->
  <rect x="50" y="650" width="900" height="130" class="sandbox box" />
  <text x="70" y="680" class="text-title" fill="#1E40AF">Isolated Execution Domains (Sandboxed Workspaces)</text>

  <rect x="100" y="700" width="180" height="50" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="190" y="730" class="text-dark" font-size="12px" text-anchor="middle">MicroVM Sandboxes</text>

  <rect x="300" y="700" width="180" height="50" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="390" y="730" class="text-dark" font-size="12px" text-anchor="middle">Local FS Workspaces</text>

  <rect x="500" y="700" width="180" height="50" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="590" y="730" class="text-dark" font-size="12px" text-anchor="middle">Enterprise APIs/SQL</text>

  <rect x="700" y="700" width="180" height="50" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="790" y="730" class="text-dark" font-size="12px" text-anchor="middle">Interactive POSIX PTY</text>

  <!-- Return Path -->
  <path d="M50 715 L30 715 L30 160 L50 160" class="arrow" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <text x="40" y="440" class="text-dark" font-size="12px" transform="rotate(-90 40 440)">Execution Output (stdout, JSON) to LLM</text>

</svg>
