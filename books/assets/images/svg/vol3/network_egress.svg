<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
        </marker>
    </defs>

    <rect width="900" height="600" fill="#ffffff" />
    
    <text x="450" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Multi-Layer Zero-Trust Network Egress Architecture</text>

    <!-- MicroVM Sandbox -->
    <rect x="30" y="100" width="180" height="400" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="120" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">Untrusted MicroVM</text>
    
    <rect x="50" y="160" width="140" height="60" rx="4" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
    <text x="120" y="185" font-size="12" text-anchor="middle" fill="#1f2937">Agent Tool Process</text>
    <text x="120" y="200" font-size="10" text-anchor="middle" fill="#6b7280">(bash / python)</text>
    
    <rect x="50" y="400" width="140" height="40" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
    <text x="120" y="425" font-size="12" font-family="monospace" text-anchor="middle" fill="#374151">tap0 (Virtual IF)</text>
    
    <path d="M 120 220 L 120 400" stroke="#4B5563" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

    <!-- Layer 1: eBPF -->
    <rect x="250" y="100" width="200" height="400" rx="8" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
    <text x="350" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#0284C7">Layer 1: eBPF Filter</text>
    <text x="350" y="150" font-size="10" text-anchor="middle" fill="#0369a1">(tc kernel hook)</text>

    <polygon points="350,180 400,210 350,240 300,210" fill="#ffffff" stroke="#0284C7" stroke-width="2"/>
    <text x="350" y="215" font-size="12" text-anchor="middle" fill="#0c4a6e">Dest Check</text>

    <rect x="270" y="300" width="160" height="40" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="350" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">DROP: Raw IPs</text>

    <rect x="270" y="360" width="160" height="40" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="350" y="385" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">DROP: Ports != 443/53</text>

    <path d="M 190 420 L 350 420 L 350 240" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 350 240 L 350 300" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Layer 2: TLS Proxy -->
    <rect x="490" y="100" width="200" height="400" rx="8" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
    <text x="590" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">Layer 2: TLS Proxy</text>
    <text x="590" y="150" font-size="10" text-anchor="middle" fill="#14532d">Envoy / Secret Scanner</text>

    <polygon points="590,180 640,210 590,240 540,210" fill="#ffffff" stroke="#166534" stroke-width="2"/>
    <text x="590" y="215" font-size="12" text-anchor="middle" fill="#064e3b">SNI Check</text>

    <rect x="510" y="280" width="160" height="40" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="590" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">REJECT: attacker-c2</text>

    <rect x="510" y="360" width="160" height="40" rx="4" fill="#ffffff" stroke="#166534" stroke-width="1"/>
    <text x="590" y="385" font-size="12" text-anchor="middle" fill="#14532d">Payload Regex Scan</text>

    <path d="M 400 210 L 540 210" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="470" y="200" font-size="10" text-anchor="middle" fill="#166534">Port 443</text>
    
    <path d="M 590 240 L 590 280" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 590 240 L 670 240 L 670 340 L 590 340 L 590 360" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Layer 3: DNS -->
    <rect x="730" y="100" width="150" height="250" rx="8" fill="#F3E8FF" stroke="#C084FC" stroke-width="2"/>
    <text x="805" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#6B21A8">Layer 3: DNS</text>

    <rect x="745" y="170" width="120" height="40" rx="4" fill="#ffffff" stroke="#6B21A8" stroke-width="1"/>
    <text x="805" y="195" font-size="12" text-anchor="middle" fill="#581c87">Entropy Check</text>

    <rect x="745" y="250" width="120" height="40" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="805" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">DROP Tunnel</text>

    <path d="M 350 180 L 350 80 L 730 80 L 730 150 L 805 150 L 805 170" stroke="#9333EA" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="550" y="70" font-size="10" text-anchor="middle" fill="#6B21A8">Port 53 (DNS)</text>

    <path d="M 805 210 L 805 250" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 590 400 L 590 450 L 800 450 L 800 420" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="730" y="380" width="150" height="40" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="805" y="405" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534">Allowed External</text>

</svg>
