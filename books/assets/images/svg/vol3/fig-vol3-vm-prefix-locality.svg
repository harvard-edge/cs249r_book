<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, sans-serif">
  <defs>
    <style>
      .bar-done { fill: #E5E7EB; stroke: #9CA3AF; stroke-width: 1; rx: 4; }
      .bar-done-label { font-size: 12px; fill: #4B5563; text-anchor: middle; font-weight: 500; }
      .bar-active { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.5; rx: 4; }
      .bar-active-label { font-size: 12px; fill: #1D4ED8; text-anchor: middle; font-weight: 600; }
      .turn-label { font-size: 14px; font-weight: 600; fill: #374151; }
      .axis-line { stroke: #D1D5DB; stroke-width: 2; }
      .axis-tick { stroke: #D1D5DB; stroke-width: 2; }
      .axis-text { font-size: 11px; fill: #6B7280; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white" />

  <!-- Turn 1 -->
  <text x="50" y="40" class="turn-label">Turn 1</text>
  <!-- System Prompt (2k) -->
  <rect class="bar-done" x="50" y="50" width="70" height="30" />
  <text x="85" y="69" class="bar-done-label">Sys (2k)</text>
  <!-- Tool Schemas (4k) -->
  <rect class="bar-done" x="120" y="50" width="140" height="30" />
  <text x="190" y="69" class="bar-done-label">Tool Schemas (4k)</text>
  <!-- Repo Map Context (10k) -->
  <rect class="bar-done" x="260" y="50" width="350" height="30" />
  <text x="435" y="69" class="bar-done-label">Repo Map Context (10k)</text>
  <!-- Step 1 Action/Obs (1k) -->
  <rect class="bar-active" x="610" y="50" width="35" height="30" />
  <text x="627.5" y="45" class="bar-active-label">T1 (1k)</text>

  <!-- Turn 2 -->
  <text x="50" y="110" class="turn-label">Turn 2</text>
  <!-- Turn 1 Invariant Prefix (17k) -->
  <rect class="bar-done" x="50" y="120" width="595" height="30" />
  <text x="347.5" y="139" class="bar-done-label">Turn 1 Invariant Prefix (17k)</text>
  <!-- Step 2 Action/Obs (1.5k) -->
  <rect class="bar-active" x="645" y="120" width="52.5" height="30" />
  <text x="671.25" y="115" class="bar-active-label">T2 (1.5k)</text>

  <!-- Turn 3 -->
  <text x="50" y="180" class="turn-label">Turn 3</text>
  <!-- Turn 2 Invariant Prefix (18.5k) -->
  <rect class="bar-done" x="50" y="190" width="647.5" height="30" />
  <text x="373.75" y="209" class="bar-done-label">Turn 2 Invariant Prefix (18.5k)</text>
  <!-- Step 3 Action/Obs (0.8k) -->
  <rect class="bar-active" x="697.5" y="190" width="28" height="30" />
  <text x="711.5" y="185" class="bar-active-label">T3</text>

  <!-- Axis -->
  <line class="axis-line" x1="50" y1="250" x2="750" y2="250" />
  <line class="axis-tick" x1="50" y1="250" x2="50" y2="255" /><text x="50" y="270" class="axis-text">0</text>
  <line class="axis-tick" x1="225" y1="250" x2="225" y2="255" /><text x="225" y="270" class="axis-text">5k tokens</text>
  <line class="axis-tick" x1="400" y1="250" x2="400" y2="255" /><text x="400" y="270" class="axis-text">10k tokens</text>
  <line class="axis-tick" x1="575" y1="250" x2="575" y2="255" /><text x="575" y="270" class="axis-text">15k tokens</text>
  <line class="axis-tick" x1="750" y1="250" x2="750" y2="255" /><text x="750" y="270" class="axis-text">20k tokens</text>

  <!-- Legend -->
  <rect class="bar-done" x="550" y="20" width="15" height="15" />
  <text x="570" y="32" class="bar-done-label" text-anchor="start">Cached / Invariant</text>
  <rect class="bar-active" x="680" y="20" width="15" height="15" />
  <text x="700" y="32" class="bar-active-label" text-anchor="start">New Prefill</text>
</svg>
