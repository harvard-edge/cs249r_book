<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; fill: #111827; }
      .text-normal { font-family: 'Inter', sans-serif; font-size: 14px; fill: #374151; }
      .text-small { font-family: 'Inter', sans-serif; font-size: 12px; fill: #4B5563; }
      .text-code { font-family: 'monospace'; font-size: 12px; fill: #D97706; }
      .box { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.5; rx: 6; }
      .box-red { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #6B7280; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
      .label-bg { fill: #ffffff; opacity: 0.9; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Section (a) -->
  <text x="20" y="40" class="text-title">(a) Open-Loop Static Evaluation (MMLU, GSM8K)</text>
  <rect x="20" y="55" width="860" height="110" fill="none" stroke="#E5E7EB" stroke-width="2" rx="8" />

  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="160" height="60" class="box" />
    <text x="80" y="25" text-anchor="middle" class="text-normal">Static Input Query</text>
    <text x="80" y="45" text-anchor="middle" class="text-code">x</text>

    <line x1="160" y1="30" x2="240" y2="30" class="arrow" />

    <rect x="250" y="0" width="160" height="60" class="box-highlight" />
    <text x="330" y="25" text-anchor="middle" class="text-normal">Model Forward Pass</text>
    <text x="330" y="45" text-anchor="middle" class="text-code">P(y | x)</text>

    <line x1="410" y1="30" x2="490" y2="30" class="arrow" />

    <rect x="500" y="0" width="140" height="60" class="box" />
    <text x="570" y="25" text-anchor="middle" class="text-normal">Predicted Output</text>
    <text x="570" y="45" text-anchor="middle" class="text-code">y</text>

    <line x1="640" y1="30" x2="720" y2="30" class="arrow" />

    <rect x="730" y="0" width="120" height="60" class="box" />
    <text x="790" y="25" text-anchor="middle" class="text-normal">Scalar Metric</text>
    <text x="790" y="45" text-anchor="middle" class="text-code">Accuracy/BLEU</text>
  </g>

  <!-- Section (b) -->
  <text x="20" y="210" class="text-title">(b) Closed-Loop Agent Trajectory Execution (SWE-bench, WebArena)</text>
  <rect x="20" y="225" width="860" height="350" fill="none" stroke="#E5E7EB" stroke-width="2" rx="8" />

  <!-- Step t -->
  <g transform="translate(60, 260)">
    <text x="0" y="-10" class="text-title" fill="#4B5563">Execution Step t</text>
    <rect x="0" y="0" width="220" height="70" class="box" />
    <text x="110" y="25" text-anchor="middle" class="text-normal">Trajectory History</text>
    <text x="110" y="45" text-anchor="middle" class="text-code">s_t = (s_0, a_0, o_1, ...)</text>

    <line x1="110" y1="70" x2="110" y2="105" class="arrow" />

    <rect x="0" y="110" width="220" height="70" class="box-highlight" />
    <text x="110" y="135" text-anchor="middle" class="text-normal">Policy Inference</text>
    <text x="110" y="155" text-anchor="middle" class="text-code">a_t ~ π_θ(· | s_t)</text>
  </g>

  <!-- Environment Loop -->
  <g transform="translate(340, 260)">
    <text x="0" y="-10" class="text-title" fill="#4B5563">Environmental Mutation &amp; Feedback</text>
    
    <path d="M -60 145 L -10 145" class="arrow" />
    <rect x="-45" y="125" width="30" height="20" class="label-bg" />
    <text x="-30" y="140" text-anchor="middle" class="text-small">Execute</text>

    <rect x="0" y="110" width="220" height="70" class="box" />
    <text x="110" y="135" text-anchor="middle" class="text-normal">External Sandbox Env.</text>
    <text x="110" y="155" text-anchor="middle" class="text-code">s'_{t+1} ~ P_env(· | s_t, a_t)</text>

    <path d="M 110 110 L 110 70" class="arrow" />
    <text x="120" y="90" class="text-small">Dynamic Feedback</text>

    <rect x="0" y="0" width="220" height="70" class="box" />
    <text x="110" y="25" text-anchor="middle" class="text-normal">Observation Payload</text>
    <text x="110" y="45" text-anchor="middle" class="text-code">o_{t+1} (stdout, code)</text>
  </g>

  <!-- Step t+1 -->
  <g transform="translate(620, 260)">
    <text x="0" y="-10" class="text-title" fill="#EF4444">Execution Step t+1 (Compounding Error Risk)</text>
    
    <path d="M -60 35 L -10 35" class="arrow" />
    <text x="-35" y="25" text-anchor="middle" class="text-small">Append</text>

    <rect x="0" y="0" width="220" height="70" class="box" />
    <text x="110" y="25" text-anchor="middle" class="text-normal">Updated Context</text>
    <text x="110" y="45" text-anchor="middle" class="text-code">s_{t+1} = (s_t, a_t, o_{t+1})</text>

    <line x1="110" y1="70" x2="110" y2="105" class="arrow" />
    <text x="120" y="85" class="text-small" fill="#EF4444">P_success ≈ (1-ε)^H</text>

    <rect x="0" y="110" width="220" height="70" class="box-red" />
    <text x="110" y="135" text-anchor="middle" class="text-normal">Next Action Decision</text>
    <text x="110" y="155" text-anchor="middle" class="text-code">a_{t+1} ~ π_θ(· | s_{t+1})</text>
  </g>

</svg>
