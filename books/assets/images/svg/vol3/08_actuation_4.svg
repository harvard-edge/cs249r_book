<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Inter, sans-serif">
  <defs>
    <style>
      .start-style { fill: #F8FAFC; stroke: #64748B; stroke-width: 1.5; }
      .first-style { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; }
      .wait-style { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; }
      .replay-style { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .box { rx: 8; ry: 8; }
      .text-dark { fill: #1F2937; font-size: 14px; }
      .text-title { font-weight: bold; font-size: 16px; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; }
      marker { fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <rect width="1000" height="900" fill="#ffffff" />

  <!-- Start Node -->
  <rect x="250" y="50" width="500" height="60" class="start-style box" />
  <text x="500" y="75" class="text-title" text-anchor="middle">Agent Model Invokes Mutating Tool</text>
  <text x="500" y="95" class="text-dark" font-size="12px" text-anchor="middle">(e.g., filesystem_edit, execute_transaction)</text>
  <path d="M500 110 L500 150" class="arrow" marker-end="url(#arrowhead)" />

  <!-- NonceGen -->
  <rect x="250" y="150" width="500" height="100" class="start-style box" />
  <text x="500" y="180" class="text-title" text-anchor="middle">Trajectory Nonce Generation</text>
  <rect x="275" y="190" width="450" height="50" fill="#ffffff" stroke="#64748B" rx="4" />
  <text x="500" y="210" class="text-dark" font-size="13px" text-anchor="middle">Compute Trajectory Nonce η: SHA-256( SessionID || StepIndex || Tool || Args )</text>
  <text x="500" y="225" class="text-dark" font-size="12px" text-anchor="middle">Guarantees identical hash across key permutations</text>
  <path d="M500 250 L500 290" class="arrow" marker-end="url(#arrowhead)" />

  <!-- State Lookup -->
  <rect x="250" y="290" width="500" height="80" class="start-style box" />
  <text x="500" y="320" class="text-title" text-anchor="middle">Distributed State Store Check (Redis / DynamoDB)</text>
  <text x="500" y="345" class="text-dark" font-weight="bold" text-anchor="middle">Query Key: idempotency:η</text>

  <!-- Branching Arrows -->
  <path d="M500 370 L180 440" class="arrow" marker-end="url(#arrowhead)" />
  <text x="250" y="415" class="text-dark" font-size="12px" fill="#166534">NOT_FOUND (First Attempt)</text>

  <path d="M500 370 L500 440" class="arrow" marker-end="url(#arrowhead)" />
  <text x="510" y="415" class="text-dark" font-size="12px" fill="#991B1B">IN_FLIGHT (Concurrent)</text>

  <path d="M500 370 L820 440" class="arrow" marker-end="url(#arrowhead)" />
  <text x="750" y="415" class="text-dark" font-size="12px" fill="#1E40AF">COMPLETED (Replay)</text>

  <!-- First Attempt Pipeline -->
  <rect x="50" y="440" width="280" height="350" class="first-style box" />
  <text x="190" y="470" class="text-title" fill="#166534" text-anchor="middle">First-Time Execution</text>

  <rect x="65" y="485" width="250" height="60" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="190" y="510" class="text-dark" font-weight="bold" font-size="13px" text-anchor="middle">Acquire Atomic Lock</text>
  <text x="190" y="525" class="text-dark" font-size="11px" text-anchor="middle">SET idempotency:η 'IN_FLIGHT' NX</text>
  <path d="M190 545 L190 575" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="65" y="575" width="250" height="40" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="190" y="600" class="text-dark" font-size="13px" text-anchor="middle">Append Intent to Write-Ahead Log</text>
  <path d="M190 615 L190 645" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="65" y="645" width="250" height="50" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="190" y="665" class="text-dark" font-size="13px" text-anchor="middle">Execute Side-Effect in Sandbox</text>
  <text x="190" y="680" class="text-dark" font-size="11px" text-anchor="middle">(Apply diff / run command)</text>
  <path d="M190 695 L190 725" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="65" y="725" width="250" height="50" fill="#ffffff" stroke="#16A34A" rx="4" />
  <text x="190" y="745" class="text-dark" font-size="13px" text-anchor="middle">Commit WAL &amp; Update State Store</text>
  <text x="190" y="760" class="text-dark" font-size="11px" text-anchor="middle">SET ... 'COMPLETED' (Cache Output)</text>

  <!-- In-Flight Path -->
  <rect x="360" y="440" width="280" height="200" class="wait-style box" />
  <text x="500" y="470" class="text-title" fill="#991B1B" text-anchor="middle">Concurrency Protection</text>

  <rect x="375" y="485" width="250" height="50" fill="#ffffff" stroke="#DC2626" rx="4" />
  <text x="500" y="505" class="text-dark" font-size="13px" text-anchor="middle">Lock Contention Detected</text>
  <text x="500" y="520" class="text-dark" font-size="11px" text-anchor="middle">Identical nonce executing concurrently</text>
  <path d="M500 535 L500 565" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="375" y="565" width="250" height="60" fill="#ffffff" stroke="#DC2626" rx="4" />
  <text x="500" y="585" class="text-dark" font-size="13px" text-anchor="middle">Wait / Reject</text>
  <text x="500" y="600" class="text-dark" font-size="11px" text-anchor="middle">Return 409 OR await completion</text>
  <text x="500" y="615" class="text-dark" font-size="11px" text-anchor="middle">(Zero duplicate dispatch)</text>

  <!-- Replay Path -->
  <rect x="670" y="440" width="280" height="180" class="replay-style box" />
  <text x="810" y="470" class="text-title" fill="#1E40AF" text-anchor="middle">Deterministic Replay</text>

  <rect x="685" y="485" width="250" height="50" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="810" y="505" class="text-dark" font-weight="bold" font-size="12px" text-anchor="middle">BYPASS MICROVM SANDBOX</text>
  <text x="810" y="520" class="text-dark" font-size="11px" text-anchor="middle">Environment is never mutated twice</text>
  <path d="M810 535 L810 565" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="685" y="565" width="250" height="40" fill="#ffffff" stroke="#2563EB" rx="4" />
  <text x="810" y="590" class="text-dark" font-size="13px" text-anchor="middle">Retrieve Cached Observation</text>

  <!-- Return Observation Node -->
  <rect x="250" y="820" width="500" height="50" class="start-style box" />
  <text x="500" y="850" class="text-title" text-anchor="middle">Return Observation across Actuation Boundary to Model Context</text>

  <path d="M190 790 L250 840" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M500 640 L500 820" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M810 620 L750 840" class="arrow" marker-end="url(#arrowhead)" />

</svg>
