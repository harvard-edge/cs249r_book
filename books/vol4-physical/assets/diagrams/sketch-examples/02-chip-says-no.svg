<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">THE CHIP THAT SAYS NO</title>
  <desc id="desc">A proposal crosses a measured privilege boundary.</desc>
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="1" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#dce1e8"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf6"/>
  <rect x="0" y="0" width="1200" height="720" fill="url(#dots)" opacity="0.5"/>
  <text x="58" y="58" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="27" font-weight="700" fill="#1b2a4a">THE CHIP THAT SAYS NO</text>
  <text x="58" y="91" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="500" fill="#687386">A proposal crosses a measured privilege boundary.</text>
  <rect x="75" y="130" width="1050" height="470" rx="58" fill="#ffffff" stroke="#1b2a4a" stroke-width="3" stroke-dasharray="10 8" filter="url(#rough)"/>
  <text x="105" y="172" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="23" font-weight="700" fill="#1b2a4a"><tspan x="105" dy="0">inside one UNO Q</tspan></text>
  <ellipse cx="270" cy="327.5" rx="155" ry="117.5" fill="#e8edf6" stroke="#1b2a4a" stroke-width="3"  filter="url(#rough)"/>
  <text x="267" y="270" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="23" font-weight="700" fill="#1b2a4a"><tspan x="267" dy="0">MPU  ·  PROPOSE</tspan></text>
  <text x="267" y="315" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="20" font-weight="600" fill="#687386"><tspan x="267" dy="0">reasoner</tspan></text>
  <rect x="160" y="330" width="215" height="82" rx="8" fill="#e8edf6" stroke="#1b2a4a" stroke-width="2"  filter="url(#rough)"/>
  <text x="178" y="362" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#1b2a4a"><tspan x="178" dy="0">INTENT</tspan></text>
  <text x="178" y="395" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="178" dy="0">turn 140°, fast</tspan></text>
  <path d="M 410 327 Q 485 327 560 327" fill="none" stroke="#e8a33d" stroke-width="5" stroke-linecap="round"  filter="url(#rough)"/>
  <path d="M 548.9171812132264 333.79493397609855 L 560 327 L 548.9171812132264 320.20506602390145" fill="none" stroke="#e8a33d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="485" y="207" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="18" font-weight="700" fill="#e8a33d"><tspan x="485" dy="0">proposal crosses</tspan></text>
  <path d="M 485 219 Q 475 265.5 485 305" fill="none" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"  filter="url(#rough)"/>
  <path d="M 475.69291366175474 295.923759374474 L 485 305 L 488.86715418235633 292.58850860976474" fill="none" stroke="#e8a33d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="702.5" cy="328" rx="157.5" ry="120" fill="#dff5f1" stroke="#18a999" stroke-width="4"  filter="url(#rough)"/>
  <text x="702" y="270" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="23" font-weight="700" fill="#18a999"><tspan x="702" dy="0">MCU  ·  DISPOSE</tspan></text>
  <text x="702" y="315" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="600" fill="#687386"><tspan x="702" dy="0">the physical boundary</tspan></text>
  <text x="702" y="357" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="26" font-weight="700" fill="#1b2a4a"><tspan x="702" dy="0">|turn| ≤ 30°</tspan></text>
  <path d="M 673 382 Q 715.5 377.1 730 382" fill="none" stroke="#c0562b" stroke-width="5" stroke-linecap="round"  filter="url(#rough)"/>
  <path d="M 676 372 Q 702 382.5 728 393" fill="none" stroke="#c0562b" stroke-width="5" stroke-linecap="round"  filter="url(#rough)"/>
  <text x="790" y="400" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="30" font-weight="750" fill="#c0562b"><tspan x="790" dy="0">no.</tspan></text>
  <path d="M 845 327 Q 922.5 327 1000 327" fill="none" stroke="#18a999" stroke-width="5" stroke-linecap="round"  filter="url(#rough)"/>
  <path d="M 988.9171812132264 333.79493397609855 L 1000 327 L 988.9171812132264 320.20506602390145" fill="none" stroke="#18a999" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="1036" cy="327.5" rx="41" ry="72.5" fill="#fff1d5" stroke="#1b2a4a" stroke-width="3"  filter="url(#rough)"/>
  <path d="M 1036 327 Q 1048 311.5 1060 296" fill="none" stroke="#1b2a4a" stroke-width="4" stroke-linecap="round"  filter="url(#rough)"/>
  <path d="M 1036 327 Q 1026 312.5 1016 298" fill="none" stroke="#1b2a4a" stroke-width="4" stroke-linecap="round"  filter="url(#rough)"/>
  <text x="1035" y="438" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="18" font-weight="650" fill="#18a999"><tspan x="1035" dy="0">bounded motion</tspan></text>
  <rect x="125" y="475" width="285" height="88" rx="8" fill="#f8e4dc" stroke="#c0562b" stroke-width="2"  filter="url(#rough)"/>
  <text x="143" y="507" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#c0562b"><tspan x="143" dy="0">VISIBLE</tspan></text>
  <text x="143" y="540" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="143" dy="0">the bad command stops here</tspan></text>
  <rect x="455" y="475" width="285" height="88" rx="8" fill="#fff1d5" stroke="#e8a33d" stroke-width="2"  filter="url(#rough)"/>
  <text x="473" y="507" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#e8a33d"><tspan x="473" dy="0">NUMBER</tspan></text>
  <text x="473" y="540" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="473" dy="0">t_veto = ______ ms</tspan></text>
  <rect x="785" y="475" width="285" height="88" rx="8" fill="#dff5f1" stroke="#18a999" stroke-width="2"  filter="url(#rough)"/>
  <text x="803" y="507" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#18a999"><tspan x="803" dy="0">DECISION</tspan></text>
  <text x="803" y="540" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="803" dy="0">enforcement stays on MCU</tspan></text>
</svg>