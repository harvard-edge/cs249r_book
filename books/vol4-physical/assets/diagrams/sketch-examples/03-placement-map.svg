<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">THE PLACEMENT MAP</title>
  <desc id="desc">Every sticky note spends from the same physical budgets.</desc>
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="1" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#dce1e8"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf6"/>
  <rect x="0" y="0" width="1200" height="720" fill="url(#dots)" opacity="0.5"/>
  <text x="58" y="58" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="27" font-weight="700" fill="#1b2a4a">THE PLACEMENT MAP</text>
  <text x="58" y="91" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="500" fill="#687386">Every sticky note spends from the same physical budgets.</text>
  <rect x="190" y="105" width="185" height="42" rx="21" fill="#dff5f1" stroke="#18a999" stroke-width="2"  filter="url(#rough)"/>
  <text x="282.5" y="133" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="18" font-weight="600" fill="#18a999"><tspan x="282.5" dy="0">LATENCY  p99</tspan></text>
  <rect x="390" y="105" width="170" height="42" rx="21" fill="#fff1d5" stroke="#e8a33d" stroke-width="2"  filter="url(#rough)"/>
  <text x="475" y="133" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="18" font-weight="600" fill="#e8a33d"><tspan x="475" dy="0">ENERGY  J</tspan></text>
  <rect x="575" y="105" width="190" height="42" rx="21" fill="#f8e4dc" stroke="#c0562b" stroke-width="2"  filter="url(#rough)"/>
  <text x="670" y="133" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="18" font-weight="600" fill="#c0562b"><tspan x="670" dy="0">EGRESS  B/h</tspan></text>
  <rect x="780" y="105" width="240" height="42" rx="21" fill="#e8edf6" stroke="#1b2a4a" stroke-width="2"  filter="url(#rough)"/>
  <text x="900" y="133" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="18" font-weight="600" fill="#1b2a4a"><tspan x="900" dy="0">RECOVERY  t_safe</tspan></text>
  <ellipse cx="300" cy="390" rx="195" ry="195" fill="#dff5f1" stroke="#18a999" stroke-width="3" stroke-dasharray="10 8" filter="url(#rough)"/>
  <ellipse cx="600" cy="395" rx="190" ry="175" fill="#e8edf6" stroke="#1b2a4a" stroke-width="3" stroke-dasharray="10 8" filter="url(#rough)"/>
  <ellipse cx="905" cy="390" rx="195" ry="200" fill="#fff1d5" stroke="#e8a33d" stroke-width="3" stroke-dasharray="10 8" filter="url(#rough)"/>
  <text x="245" y="230" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="23" font-weight="700" fill="#18a999"><tspan x="245" dy="0">on the body</tspan></text>
  <text x="545" y="255" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="23" font-weight="700" fill="#1b2a4a"><tspan x="545" dy="0">nearby</tspan></text>
  <text x="875" y="225" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="23" font-weight="700" fill="#e8a33d"><tspan x="875" dy="0">far away</tspan></text>
  <rect x="150" y="285" width="210" height="82" rx="8" fill="#dff5f1" stroke="#18a999" stroke-width="2"  filter="url(#rough)"/>
  <text x="168" y="317" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#18a999"><tspan x="168" dy="0">SAFETY GATE</tspan></text>
  <text x="168" y="350" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="168" dy="0">MCU  ·  hard deadline</tspan></text>
  <rect x="245" y="405" width="215" height="82" rx="8" fill="#dff5f1" stroke="#18a999" stroke-width="2"  filter="url(#rough)"/>
  <text x="263" y="437" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#18a999"><tspan x="263" dy="0">TRACKING</tspan></text>
  <text x="263" y="470" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="263" dy="0">fast belief update</tspan></text>
  <rect x="485" y="320" width="230" height="82" rx="8" fill="#e8edf6" stroke="#1b2a4a" stroke-width="2"  filter="url(#rough)"/>
  <text x="503" y="352" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#1b2a4a"><tspan x="503" dy="0">WORLD MODEL</tspan></text>
  <text x="503" y="385" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="503" dy="0">predict through delay</tspan></text>
  <rect x="780" y="290" width="220" height="82" rx="8" fill="#fff1d5" stroke="#e8a33d" stroke-width="2"  filter="url(#rough)"/>
  <text x="798" y="322" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#e8a33d"><tspan x="798" dy="0">VLM MEANING</tspan></text>
  <text x="798" y="355" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="798" dy="0">slow semantic path</tspan></text>
  <rect x="830" y="445" width="240" height="82" rx="8" fill="#fff1d5" stroke="#e8a33d" stroke-width="2"  filter="url(#rough)"/>
  <text x="848" y="477" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#e8a33d"><tspan x="848" dy="0">ADAPTATION</tspan></text>
  <text x="848" y="510" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="17" font-weight="500" fill="#1b2a4a"><tspan x="848" dy="0">curate → train → return</tspan></text>
  <text x="55" y="335" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#18a999"><tspan x="55" dy="0">10 ms</tspan></text>
  <path d="M 88 330 Q 119 330 150 330" fill="none" stroke="#18a999" stroke-width="3" stroke-linecap="round"  filter="url(#rough)"/>
  <path d="M 138.91718121322643 336.79493397609855 L 150 330 L 138.91718121322643 323.20506602390145" fill="none" stroke="#18a999" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="455" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#1b2a4a"><tspan x="55" dy="0">1 s</tspan></text>
  <path d="M 88 450 Q 166.5 450 245 450" fill="none" stroke="#1b2a4a" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" filter="url(#rough)"/>
  <path d="M 233.91718121322643 456.79493397609855 L 245 450 L 233.91718121322643 443.20506602390145" fill="none" stroke="#1b2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="550" text-anchor="start" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="700" fill="#e8a33d"><tspan x="55" dy="0">days</tspan></text>
  <path d="M 100 545 Q 442.5 529.5 825 500" fill="none" stroke="#e8a33d" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" filter="url(#rough)"/>
  <path d="M 814.4724980499566 507.627037609179 L 825 500 L 813.4274938943944 494.07740745655076" fill="none" stroke="#e8a33d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 890 405 Q 698 369.7 390 375" fill="none" stroke="#c0562b" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" filter="url(#rough)"/>
  <path d="M 400.9642697903806 368.01538920456215 L 390 375 L 401.19808679923904 381.6032455684087" fill="none" stroke="#c0562b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="570" y="610" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="21" font-weight="700" fill="#c0562b"><tspan x="570" dy="0">move one sticky note</tspan></text>
  <text x="570" y="637" text-anchor="middle" font-family="Virgil, Chalkboard, 'Comic Sans MS', sans-serif" font-size="19" font-weight="500" fill="#1b2a4a"><tspan x="570" dy="0">then circle every number that moved</tspan></text>
</svg>