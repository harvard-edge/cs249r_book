<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320" role="img" aria-label="Three boxes across the top labeled ML systems, control theory, and robotics and embedded, each naming the simplifying assumption it makes. Arrows from all three converge into a larger central box labeled physical AI, which lists three assumptions that break at once and notes it is a new regime, not the overlap of the three.">
  <style>
    .bx{fill:none;stroke:currentColor;stroke-width:1.3;opacity:0.8}
    .cbx{fill:none;stroke:currentColor;stroke-width:2.2;opacity:0.95}
    .ar{stroke:currentColor;stroke-width:1.3;opacity:0.75}
    .ah{fill:currentColor;opacity:0.75}
    .nm{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
    .as{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.62}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;opacity:0.95}
    .br{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px}
    .note{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;font-style:italic;opacity:0.7}
  </style>

  <!-- three parent fields, each bracketing one hard thing -->
  <rect class="bx" x="12"  y="36" width="156" height="62" rx="3"/>
  <rect class="bx" x="192" y="36" width="156" height="62" rx="3"/>
  <rect class="bx" x="372" y="36" width="156" height="62" rx="3"/>

  <text class="nm" x="90"  y="56" text-anchor="middle">ML systems</text>
  <text class="as" x="90"  y="74" text-anchor="middle">assumes the data</text>
  <text class="as" x="90"  y="88" text-anchor="middle">is given (exogenous)</text>

  <text class="nm" x="270" y="56" text-anchor="middle">control theory</text>
  <text class="as" x="270" y="74" text-anchor="middle">assumes a known,</text>
  <text class="as" x="270" y="88" text-anchor="middle">characterized plant</text>

  <text class="nm" x="450" y="56" text-anchor="middle">robotics / embedded</text>
  <text class="as" x="450" y="74" text-anchor="middle">assumes a bounded</text>
  <text class="as" x="450" y="88" text-anchor="middle">task and place</text>

  <!-- arrows converging into the central box (top edge y=150) -->
  <line class="ar" x1="90"  y1="98" x2="150" y2="146"/>
  <polygon class="ah" points="146,140 152,148 142,147"/>
  <line class="ar" x1="270" y1="98" x2="270" y2="146"/>
  <polygon class="ah" points="266,140 270,148 274,140"/>
  <line class="ar" x1="450" y1="98" x2="390" y2="146"/>
  <polygon class="ah" points="398,147 388,148 394,140"/>

  <!-- physical AI: the regime where all three brackets come off -->
  <rect class="cbx" x="64" y="150" width="412" height="142" rx="4"/>
  <text class="ttl"  x="270" y="174" text-anchor="middle">physical AI</text>
  <text class="note" x="270" y="193" text-anchor="middle">where all three assumptions break at once</text>

  <text class="br" x="92" y="220">its own actions generate the data it learns from next</text>
  <text class="br" x="92" y="242">the model in the loop is learned, open-world, uncharacterized</text>
  <text class="br" x="92" y="264">it runs unbounded, in someone's home</text>

  <text class="note" x="270" y="285" text-anchor="middle">a regime of its own, not the overlap of the three</text>
</svg>
