<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="chip-no-title chip-no-desc">
  <title id="chip-no-title">The chip that says no</title>
  <desc id="chip-no-desc">A clean diagram of an Arduino UNO Q teaching implementation. The Qualcomm Dragonwing MPU proposes an intent through Arduino Bridge. The STM32 MCU applies an action contract, vetoes an out-of-bounds turn, and sends only a bounded primitive to the actuator. Three cards identify the visible effect, the veto-latency measurement, and the conditional placement decision.</desc>

  <defs>
    <marker id="chip-no-arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2a4a"/>
    </marker>
    <marker id="chip-no-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18a999"/>
    </marker>
    <marker id="chip-no-arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0562b"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'Liberation Sans', sans-serif; fill: #1b2a4a; }
      .subtitle { font: 400 17px Arial, 'Liberation Sans', sans-serif; fill: #687386; }
      .section { font: 700 20px Arial, 'Liberation Sans', sans-serif; }
      .label { font: 600 16px Arial, 'Liberation Sans', sans-serif; fill: #1b2a4a; }
      .body { font: 400 15px Arial, 'Liberation Sans', sans-serif; fill: #3f4a59; }
      .small { font: 400 13px Arial, 'Liberation Sans', sans-serif; fill: #687386; }
      .mono { font: 500 16px 'IBM Plex Mono', Menlo, 'Liberation Mono', monospace; fill: #1b2a4a; }
      .mono-small { font: 500 13px 'IBM Plex Mono', Menlo, 'Liberation Mono', monospace; fill: #1b2a4a; }
      .board { fill: #fbfaf6; stroke: #9aa3b0; stroke-width: 2; }
      .mpu { fill: #e8edf6; stroke: #1b2a4a; stroke-width: 2.5; }
      .mcu { fill: #e4f6f3; stroke: #18a999; stroke-width: 2.5; }
      .neutral { fill: #f4f6f7; stroke: #687386; stroke-width: 1.8; }
      .contract { fill: #ffffff; stroke: #18a999; stroke-width: 2; }
      .veto { fill: #fae9e2; stroke: #c0562b; stroke-width: 2; }
      .card-visible { fill: #fae9e2; stroke: #c0562b; stroke-width: 2; }
      .card-measure { fill: #e8edf6; stroke: #1b2a4a; stroke-width: 2; }
      .card-decision { fill: #e4f6f3; stroke: #18a999; stroke-width: 2; }
      .proposal { fill: none; stroke: #1b2a4a; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#chip-no-arrow-indigo); }
      .accepted { fill: none; stroke: #18a999; stroke-width: 3; marker-end: url(#chip-no-arrow-teal); }
      .rejected { fill: none; stroke: #c0562b; stroke-width: 3; marker-end: url(#chip-no-arrow-coral); }
      .guide { fill: none; stroke: #9aa3b0; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .pin { stroke: #687386; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#fbfaf6"/>

  <text class="title" x="64" y="56">The chip that says no</text>
  <text class="subtitle" x="64" y="84">A measured propose/dispose boundary on Arduino UNO Q</text>

  <!-- One physical board, two processing domains. -->
  <rect class="board" x="64" y="116" width="1072" height="394" rx="18"/>
  <text class="label" x="92" y="150">Arduino UNO Q · one board, two processing domains</text>
  <text class="small" x="1108" y="150" text-anchor="end">teaching implementation · not a certified safety channel</text>

  <!-- MPU domain. -->
  <rect class="mpu" x="112" y="188" width="300" height="244" rx="10"/>
  <rect x="112" y="188" width="300" height="54" rx="10" fill="#1b2a4a"/>
  <rect x="112" y="228" width="300" height="14" fill="#1b2a4a"/>
  <text x="134" y="222" font-family="Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="700" fill="#ffffff">MPU · proposes</text>
  <text class="label" x="136" y="278">Qualcomm Dragonwing QRB2210</text>
  <text class="body" x="136" y="304">Debian Linux · reasoner service</text>

  <rect x="136" y="334" width="252" height="72" rx="6" fill="#ffffff" stroke="#1b2a4a" stroke-width="1.5"/>
  <text class="small" x="154" y="358">PROPOSED INTENT</text>
  <text class="mono-small" x="154" y="380">turn = 140°</text>
  <text class="mono-small" x="154" y="399">speed = fast</text>

  <!-- Arduino Bridge. -->
  <rect class="neutral" x="462" y="260" width="164" height="104" rx="8"/>
  <text class="label" x="544" y="294" text-anchor="middle">Arduino Bridge</text>
  <text class="small" x="544" y="319" text-anchor="middle">RPC between domains</text>
  <text class="mono-small" x="544" y="344" text-anchor="middle">intent()</text>

  <path class="proposal" d="M 412 312 H 450"/>
  <path class="proposal" d="M 626 312 H 674"/>
  <text class="small" x="444" y="292" text-anchor="end">proposal</text>

  <!-- Privilege boundary and measurement point. -->
  <line class="guide" x1="650" y1="174" x2="650" y2="456"/>
  <circle cx="650" cy="312" r="6" fill="#fbfaf6" stroke="#1b2a4a" stroke-width="2"/>
  <text class="small" x="650" y="478" text-anchor="middle">privilege boundary</text>

  <!-- MCU domain. -->
  <rect class="mcu" x="674" y="188" width="300" height="244" rx="10"/>
  <rect x="674" y="188" width="300" height="54" rx="10" fill="#18a999"/>
  <rect x="674" y="228" width="300" height="14" fill="#18a999"/>
  <text x="696" y="222" font-family="Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="700" fill="#ffffff">MCU · disposes</text>
  <text class="label" x="698" y="278">STM32U585</text>
  <text class="body" x="698" y="304">Arduino Core on Zephyr · real-time I/O</text>

  <rect class="contract" x="698" y="326" width="172" height="82" rx="6"/>
  <text class="small" x="714" y="350">ACTION CONTRACT</text>
  <text class="mono" x="714" y="375">|turn| ≤ 30°</text>
  <text class="mono-small" x="714" y="397">speed ≤ v_max</text>

  <path class="rejected" d="M 870 366 H 904 V 398"/>
  <rect class="veto" x="884" y="398" width="68" height="30" rx="15"/>
  <text x="918" y="419" text-anchor="middle" font-family="Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#c0562b">VETO</text>

  <!-- MCU output and actuator. -->
  <path class="accepted" d="M 974 312 H 1018"/>
  <text class="small" x="920" y="335" text-anchor="middle">bounded</text>
  <text class="small" x="920" y="352" text-anchor="middle">primitive</text>

  <!-- Measurement spans Bridge receipt to bounded MCU output. -->
  <path d="M 650 438 V 448 H 974 V 438" fill="none" stroke="#1b2a4a" stroke-width="1.5"/>
  <circle cx="974" cy="438" r="4" fill="#fbfaf6" stroke="#1b2a4a" stroke-width="1.5"/>
  <text class="mono-small" x="812" y="469" text-anchor="middle">measure p99(t_veto)</text>

  <rect class="neutral" x="1020" y="244" width="84" height="136" rx="8"/>
  <text class="label" x="1062" y="274" text-anchor="middle">Actuator</text>
  <circle cx="1062" cy="318" r="24" fill="#ffffff" stroke="#687386" stroke-width="2"/>
  <line x1="1062" y1="318" x2="1077" y2="299" stroke="#1b2a4a" stroke-width="3"/>
  <line x1="1038" y1="358" x2="1086" y2="358" stroke="#687386" stroke-width="2"/>

  <!-- Minimal board-pin grammar. -->
  <g aria-hidden="true">
    <line class="pin" x1="112" y1="250" x2="100" y2="250"/>
    <line class="pin" x1="112" y1="274" x2="100" y2="274"/>
    <line class="pin" x1="112" y1="298" x2="100" y2="298"/>
    <line class="pin" x1="974" y1="250" x2="986" y2="250"/>
    <line class="pin" x1="974" y1="274" x2="986" y2="274"/>
    <line class="pin" x1="974" y1="298" x2="986" y2="298"/>
  </g>

  <!-- Visible signal, number, and engineering decision. -->
  <rect class="card-visible" x="64" y="550" width="320" height="118" rx="10"/>
  <text x="88" y="581" font-family="Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#c0562b">VISIBLE SIGNAL</text>
  <text class="label" x="88" y="614">The bad proposal stops</text>
  <text class="body" x="88" y="641">before it reaches the PWM output.</text>

  <rect class="card-measure" x="408" y="550" width="320" height="118" rx="10"/>
  <text x="432" y="581" font-family="Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1b2a4a">DEFENSIBLE NUMBER</text>
  <text class="mono" x="432" y="616">p99(t_veto) = measured</text>
  <text class="body" x="432" y="641">Bridge receipt to bounded output.</text>

  <rect class="card-decision" x="752" y="550" width="384" height="118" rx="10"/>
  <text x="776" y="581" font-family="Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#18a999">ENGINEERING DECISION</text>
  <text class="label" x="776" y="614">Keep enforcement on the MCU</text>
  <text class="body" x="776" y="639">when measured veto latency fits</text>
  <text class="body" x="776" y="659">the actuation deadline.</text>
</svg>
