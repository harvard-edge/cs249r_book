<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-label="A distance axis from a commanded stop to a harm boundary, with the gap between them labeled margin. Two stacked error bars start at the commanded stop, each made of sensing error, overshoot, and latency times speed. The 32-bit model's bar ends within the margin. The 8-bit model's bar has a much larger sensing-error segment and extends past the harm boundary.">
  <style>
    .axis{stroke:currentColor;stroke-width:1;opacity:0.35}
    .stop{stroke:currentColor;stroke-width:1.2;stroke-dasharray:3 3;opacity:0.6}
    .bound{stroke:currentColor;stroke-width:2.4;opacity:0.95}
    .marg{stroke:currentColor;stroke-width:1;opacity:0.6}
    .s1{fill:currentColor;fill-opacity:0.42;stroke:currentColor;stroke-width:0.8}
    .s2{fill:currentColor;fill-opacity:0.24;stroke:currentColor;stroke-width:0.8}
    .s3{fill:currentColor;fill-opacity:0.10;stroke:currentColor;stroke-width:0.8}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px}
    .seg{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:9.5px;opacity:0.7}
    .faint{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.62}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
  </style>

  <text class="ttl" x="40" y="22">the safety envelope: an AI choice is a control choice</text>

  <!-- commanded stop and harm boundary -->
  <line class="stop"  x1="110" y1="44" x2="110" y2="196"/>
  <text class="lab"   x="110" y="40" text-anchor="middle">commanded stop</text>
  <line class="bound" x1="440" y1="44" x2="440" y2="196"/>
  <text class="lab"   x="440" y="40" text-anchor="middle">harm boundary</text>

  <!-- margin -->
  <line class="marg" x1="110" y1="58" x2="440" y2="58"/>
  <text class="faint" x="275" y="54" text-anchor="middle">margin</text>

  <!-- segment legend above row 1 -->
  <text class="seg" x="145" y="80">sensing error</text>
  <text class="seg" x="210" y="80">overshoot</text>
  <text class="seg" x="300" y="80">stopping distance</text>

  <!-- row 1: 32-bit model, fits -->
  <rect class="s1" x="110" y="88" width="70"  height="22"/>
  <rect class="s2" x="180" y="88" width="60"  height="22"/>
  <rect class="s3" x="240" y="88" width="140" height="22"/>
  <text class="lab" x="388" y="103">32-bit model: fits</text>

  <!-- row 2: 8-bit model, sensing error grows, crosses -->
  <rect class="s1" x="110" y="128" width="160" height="22"/>
  <rect class="s2" x="270" y="128" width="60"  height="22"/>
  <rect class="s3" x="330" y="128" width="140" height="22"/>
  <text class="lab" x="300" y="172" text-anchor="middle">8-bit model: the same margin no longer holds</text>

  <text class="faint" x="40" y="214">the margin must cover every error; quantizing for speed grows the sensing error until it crosses.</text>
</svg>
