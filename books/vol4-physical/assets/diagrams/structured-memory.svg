<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="A small knowledge graph. A central node labeled child connects by labeled edges to four fact nodes: is called a name, likes blue, owns a toy rabbit, and a routine bedtime eight pm. The bedtime node is drawn with a dashed border and labeled forget on request, showing one fact can be removed on its own.">
  <style>
    .ed{stroke:currentColor;stroke-width:1.1;opacity:0.55}
    .nd{fill:none;stroke:currentColor;stroke-width:1.4;opacity:0.85}
    .ndc{fill:none;stroke:currentColor;stroke-width:2;opacity:0.95}
    .nf{fill:none;stroke:currentColor;stroke-width:1.3;stroke-dasharray:4 3;opacity:0.6}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px}
    .el{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10px;opacity:0.6}
    .fg{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10px;font-style:italic;opacity:0.7}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
  </style>

  <text class="ttl" x="60" y="24">structured memory</text>

  <!-- edges (drawn first, under the nodes) -->
  <line class="ed" x1="214" y1="142" x2="150" y2="88"/>
  <line class="ed" x1="214" y1="170" x2="156" y2="222"/>
  <line class="ed" x1="266" y1="142" x2="332" y2="88"/>
  <line class="ed" x1="266" y1="170" x2="330" y2="222"/>

  <!-- edge labels -->
  <text class="el" x="168" y="112">is called</text>
  <text class="el" x="168" y="205">likes</text>
  <text class="el" x="300" y="112">owns</text>
  <text class="el" x="300" y="205">routine</text>

  <!-- center node -->
  <rect class="ndc" x="206" y="140" width="68" height="32" rx="4"/>
  <text class="lab" x="240" y="161" text-anchor="middle">child</text>

  <!-- fact nodes -->
  <rect class="nd" x="74" y="58" width="76" height="30" rx="4"/>
  <text class="lab" x="112" y="78" text-anchor="middle">name</text>

  <rect class="nd" x="66" y="222" width="100" height="30" rx="4"/>
  <text class="lab" x="116" y="242" text-anchor="middle">likes blue</text>

  <rect class="nd" x="326" y="58" width="108" height="30" rx="4"/>
  <text class="lab" x="380" y="78" text-anchor="middle">toy: rabbit</text>

  <!-- forgettable fact -->
  <rect class="nf" x="320" y="222" width="116" height="30" rx="4"/>
  <text class="lab" x="378" y="242" text-anchor="middle">bedtime 8pm</text>
  <text class="fg" x="378" y="268" text-anchor="middle">forget on request</text>
</svg>
