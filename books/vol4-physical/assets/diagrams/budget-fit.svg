<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="Four horizontal bars labeled latency, memory, energy, and bandwidth, each showing used divided by limit against a dashed vertical limit line. Memory, energy, and bandwidth end before the line; latency extends past it and is labeled the binding constraint.">
  <style>
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px}
    .lim{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.65}
    .bind{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px;font-style:italic}
    .baru{fill:currentColor;fill-opacity:0.16;stroke:currentColor;stroke-width:1;stroke-opacity:0.75}
    .barb{fill:currentColor;fill-opacity:0.5;stroke:currentColor;stroke-width:1.2}
    .limln{stroke:currentColor;stroke-width:1.2;stroke-dasharray:4 4;opacity:0.65}
  </style>

  <text class="ttl" x="60" y="22">fits iff every budget closes</text>

  <!-- limit line at x=340 (used = limit = 1.0); scale: 200px = 1.0 -->
  <line class="limln" x1="340" y1="40" x2="340" y2="206"/>
  <text class="lim" x="340" y="36" text-anchor="middle">limit</text>

  <!-- rows: bar from x=140; width = (used/limit) * 200 -->
  <!-- latency 1.15 -> 230, over the line: the binding constraint -->
  <text class="lab" x="130" y="62" text-anchor="end">latency</text>
  <rect class="barb" x="140" y="51" width="230" height="20" rx="2"/>
  <text class="bind" x="378" y="65">binding constraint</text>

  <!-- memory 0.55 -> 110 -->
  <text class="lab" x="130" y="102" text-anchor="end">memory</text>
  <rect class="baru" x="140" y="91" width="110" height="20" rx="2"/>

  <!-- energy 0.70 -> 140 -->
  <text class="lab" x="130" y="142" text-anchor="end">energy</text>
  <rect class="baru" x="140" y="131" width="140" height="20" rx="2"/>

  <!-- bandwidth 0.40 -> 80 -->
  <text class="lab" x="130" y="182" text-anchor="end">bandwidth</text>
  <rect class="baru" x="140" y="171" width="80" height="20" rx="2"/>

  <text class="lim" x="140" y="222">used / limit, per budget. one over the line and the placement does not fit.</text>
</svg>
