<svg xmlns="http://www.w3.org/2000/svg" width="520" height="290" viewBox="0 0 520 290" role="img" aria-label="Three nested boxes: a small device box inside a home network box inside a cloud box. The device box holds the raw audio and video, about 28 megabytes a second, which stays inside. A single arrow leaves the device through a marked privacy gate, crosses the home and cloud boundaries, and carries only a small derived event of about 40 bytes.">
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.3;opacity:0.7}
    .dev{fill:none;stroke:currentColor;stroke-width:2;opacity:0.95}
    .gate{stroke:currentColor;stroke-width:3;opacity:0.95}
    .ar{stroke:currentColor;stroke-width:1.6;opacity:0.85}
    .ah{fill:currentColor;opacity:0.85}
    .nm{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;opacity:0.7}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px}
    .faint{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.6}
    .gt{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;font-style:italic}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
  </style>

  <text class="ttl" x="58" y="24">data egress: what leaves the device</text>

  <!-- nested boundaries -->
  <rect class="box" x="16"  y="44"  width="488" height="232" rx="4"/>
  <text class="nm" x="494" y="64" text-anchor="end">cloud</text>
  <rect class="box" x="38"  y="74"  width="372" height="172" rx="4"/>
  <text class="nm" x="400" y="94" text-anchor="end">home network</text>

  <!-- device, with the raw firehose that stays in -->
  <rect class="dev" x="58" y="120" width="152" height="104" rx="4"/>
  <text class="nm"  x="68"  y="140">device</text>
  <text class="lab" x="134" y="172" text-anchor="middle">raw audio + video</text>
  <text class="faint" x="134" y="190" text-anchor="middle">~28 MB/s, stays in</text>

  <!-- the privacy gate on the device boundary -->
  <line class="gate" x1="210" y1="150" x2="210" y2="158"/>
  <line class="gate" x1="210" y1="170" x2="210" y2="178"/>
  <text class="gt" x="214" y="140">privacy gate</text>

  <!-- only a small derived event crosses, out to the cloud -->
  <line class="ar" x1="210" y1="164" x2="466" y2="164"/>
  <polygon class="ah" points="466,159 476,164 466,169"/>
  <text class="lab" x="300" y="156">an event: ~40 bytes</text>

  <text class="faint" x="58" y="264">the raw firehose stays in; only derived events cross. the egress audit counts what crosses.</text>
</svg>
