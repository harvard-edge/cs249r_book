<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .port-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9px; fill: #475569; text-anchor: middle; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="580" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">END-TO-END SENSE-TO-ACTUATION LATENCY WATERFALL &amp; FRESHNESS BUDGET</text>
  <text x="480" y="45" class="subtitle">Cumulative Wall-Clock Decomposition: From Photon Transduction to Torque Generation vs. the Freshness Deadline</text>

  <!-- 8 Stage Cards Layout across 960 width: 8 cards of width 102px with 12px gap -->
  <!-- Card 1: Transduction -->
  <g transform="translate(30, 68)">
    <rect width="100" height="150" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <rect width="100" height="22" rx="6" fill="#EFF6FF"/>
    <text x="50" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#1E40AF" text-anchor="middle">1. SENSING</text>
    <text x="8" y="38" class="card-title" fill="#1E3A8A">Exposure</text>
    <text x="8" y="54" class="card-body">CMOS Shutter</text>
    <text x="8" y="70" class="card-sub">Photon well</text>
    <text x="8" y="86" class="card-sub">integration</text>
    <rect x="10" y="118" width="80" height="20" rx="10" fill="#EFF6FF"/>
    <text x="50" y="132" class="pill-text" fill="#1D4ED8">10–16 ms</text>
  </g>

  <!-- Card 2: Transport -->
  <g transform="translate(142, 68)">
    <rect width="100" height="150" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <rect width="100" height="22" rx="6" fill="#EFF6FF"/>
    <text x="50" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#1E40AF" text-anchor="middle">2. TRANSPORT</text>
    <text x="8" y="38" class="card-title" fill="#1E3A8A">SerDes / DMA</text>
    <text x="8" y="54" class="card-body">MIPI CSI-2</text>
    <text x="8" y="70" class="card-sub">PCIe Ring-buf</text>
    <text x="8" y="86" class="card-sub">Zero-copy</text>
    <rect x="10" y="118" width="80" height="20" rx="10" fill="#EFF6FF"/>
    <text x="50" y="132" class="pill-text" fill="#1D4ED8">12–25 ms</text>
  </g>

  <!-- Card 3: Ingestion -->
  <g transform="translate(254, 68)">
    <rect width="100" height="150" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <rect width="100" height="22" rx="6" fill="#EFF6FF"/>
    <text x="50" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#1E40AF" text-anchor="middle">3. INGESTION</text>
    <text x="8" y="38" class="card-title" fill="#1E3A8A">Debayer / Crop</text>
    <text x="8" y="54" class="card-body">Color Format</text>
    <text x="8" y="70" class="card-sub">Tensor scale</text>
    <text x="8" y="86" class="card-sub">PTP Sync</text>
    <rect x="10" y="118" width="80" height="20" rx="10" fill="#EFF6FF"/>
    <text x="50" y="132" class="pill-text" fill="#1D4ED8">2–5 ms</text>
  </g>

  <!-- Card 4: Inference (Cognition) -->
  <g transform="translate(366, 68)">
    <rect width="108" height="150" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.4"/>
    <rect width="108" height="22" rx="6" fill="#FEF3C7"/>
    <text x="54" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#B45309" text-anchor="middle">4. INFERENCE</text>
    <text x="8" y="38" class="card-title" fill="#B45309">Neural Policy</text>
    <text x="8" y="54" class="card-body">VLA / Diffusion</text>
    <text x="8" y="70" class="card-sub">M_weights / B_mem</text>
    <text x="8" y="86" class="card-sub">Memory Bound</text>
    <rect x="10" y="118" width="88" height="20" rx="10" fill="#FEF3C7"/>
    <text x="54" y="132" class="pill-text" fill="#B45309">30–80 ms</text>
  </g>

  <!-- Card 5: Planning -->
  <g transform="translate(486, 68)">
    <rect width="100" height="150" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <rect width="100" height="22" rx="6" fill="#FEF3C7"/>
    <text x="50" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#B45309" text-anchor="middle">5. PLANNING</text>
    <text x="8" y="38" class="card-title" fill="#B45309">IK &amp; Spline</text>
    <text x="8" y="54" class="card-body">Chunk Blending</text>
    <text x="8" y="70" class="card-sub">C² continuity</text>
    <text x="8" y="86" class="card-sub">Jerk limits</text>
    <rect x="10" y="118" width="80" height="20" rx="10" fill="#FEF3C7"/>
    <text x="50" y="132" class="pill-text" fill="#B45309">5–15 ms</text>
  </g>

  <!-- Card 6: Enforcement (Safety) -->
  <g transform="translate(598, 68)">
    <rect width="106" height="150" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
    <rect width="106" height="22" rx="6" fill="#D1FAE5"/>
    <text x="53" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#065F46" text-anchor="middle">6. ENFORCE</text>
    <text x="8" y="38" class="card-title" fill="#065F46">Safety Shield</text>
    <text x="8" y="54" class="card-body">CBF-QP Solver</text>
    <text x="8" y="70" class="card-sub">MCU Bare-Metal</text>
    <text x="8" y="86" class="card-sub">0-malloc 1 kHz</text>
    <rect x="10" y="118" width="86" height="20" rx="10" fill="#D1FAE5"/>
    <text x="53" y="132" class="pill-text" fill="#065F46">0.5–2 ms</text>
  </g>

  <!-- Card 7: Fieldbus -->
  <g transform="translate(716, 68)">
    <rect width="100" height="150" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
    <rect width="100" height="22" rx="6" fill="#FEE2E2"/>
    <text x="50" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#991B1B" text-anchor="middle">7. FIELDBUS</text>
    <text x="8" y="38" class="card-title" fill="#991B1B">EtherCAT</text>
    <text x="8" y="54" class="card-body">CAN-FD Frame</text>
    <text x="8" y="70" class="card-sub">1 kHz Sync</text>
    <text x="8" y="86" class="card-sub">Jitter &lt; 5 µs</text>
    <rect x="10" y="118" width="80" height="20" rx="10" fill="#FEE2E2"/>
    <text x="50" y="132" class="pill-text" fill="#991B1B">0.2–1 ms</text>
  </g>

  <!-- Card 8: Actuation Dynamics -->
  <g transform="translate(828, 68)">
    <rect width="102" height="150" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2"/>
    <rect width="102" height="22" rx="6" fill="#FEE2E2"/>
    <text x="51" y="15" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5px" font-weight="700" fill="#991B1B" text-anchor="middle">8. ACTUATE</text>
    <text x="8" y="38" class="card-title" fill="#991B1B">Inverter Drive</text>
    <text x="8" y="54" class="card-body">TIMx_CCR PWM</text>
    <text x="8" y="70" class="card-sub">L/R Winding</text>
    <text x="8" y="86" class="card-sub">Torque Rise</text>
    <rect x="10" y="118" width="82" height="20" rx="10" fill="#FEE2E2"/>
    <text x="51" y="132" class="pill-text" fill="#991B1B">2–8 ms</text>
  </g>

  <!-- WATERFALL TIMING BARS: Lower Half (y=245..540) -->
  <rect x="30" y="240" width="900" height="260" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Timing Axis Grid & Labels -->
  <text x="50" y="265" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10px" font-weight="700" fill="#1E293B">WALL-CLOCK LATENCY ACCUMULATION (T_lag)</text>
  <text x="910" y="265" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5px" font-weight="700" fill="#991B1B" text-anchor="end">PHYSICAL DISPLACEMENT: Δx = ∫ v dt</text>

  <!-- Cumulative Bar 1: Nominal P50 Latency (65 ms) -->
  <g transform="translate(50, 285)">
    <rect width="860" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="26" font-family="'IBM Plex Sans', sans-serif" font-size="11px" font-weight="700" fill="#1E3A8A">P50 Latency Budget (Nominal): 65 ms</text>
    <!-- Segments -->
    <rect x="250" y="8" width="60" height="26" fill="#3B82F6"/>
    <rect x="310" y="8" width="70" height="26" fill="#60A5FA"/>
    <rect x="380" y="8" width="160" height="26" fill="#F59E0B"/>
    <rect x="540" y="8" width="50" height="26" fill="#10B981"/>
    <rect x="590" y="8" width="30" height="26" fill="#EF4444"/>
    <text x="635" y="26" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10px" font-weight="700" fill="#1E3A8A">Δx = 13.0 cm (@ 2.0 m/s)</text>
  </g>

  <!-- Cumulative Bar 2: Tail P99 Latency (140 ms) -->
  <g transform="translate(50, 340)">
    <rect width="860" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="26" font-family="'IBM Plex Sans', sans-serif" font-size="11px" font-weight="700" fill="#991B1B">P99 Tail Excursion (Worst-Case): 140 ms</text>
    <!-- Segments -->
    <rect x="250" y="8" width="80" height="26" fill="#3B82F6"/>
    <rect x="330" y="8" width="110" height="26" fill="#60A5FA"/>
    <rect x="440" y="8" width="280" height="26" fill="#F59E0B"/>
    <rect x="720" y="8" width="70" height="26" fill="#10B981"/>
    <rect x="790" y="8" width="40" height="26" fill="#EF4444"/>
    <text x="840" y="26" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10px" font-weight="700" fill="#991B1B">Δx = 28.0 cm</text>
  </g>

  <!-- The Freshness Deadline Boundary Marker -->
  <line x1="720" y1="275" x2="720" y2="470" stroke="#991B1B" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="620" y="395" width="200" height="24" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
  <text x="720" y="411" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#991B1B" text-anchor="middle">FRESHNESS DEADLINE: Δt_fresh = 100 ms</text>

  <!-- Explanatory Legend / Formula -->
  <g transform="translate(50, 435)">
    <rect width="860" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#0F172A">Architectural Bedrock Law 2: Latency is Paid in Millimeters</text>
    <text x="14" y="38" font-family="'IBM Plex Sans', sans-serif" font-size="10px" fill="#475569">When sense-to-torque lag T_lag exceeds Δt_fresh, the machine acts on stale observations. At v = 2.0 m/s, every 10 ms of compute or bus delay translates into 20 mm of unguided displacement.</text>
  </g>

  <!-- Bottom Synthesis Subtitle -->
  <text x="480" y="555" class="subtitle">End-to-end sense-to-actuation latency combines sensor integration, bus transport, policy inference, safety validation, and actuator electromagnetic rise.</text>
</svg>
