<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15.5px; fill: #0F172A; text-anchor: middle; letter-spacing: 0.2px; }
      .subtitle { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
      .realm-tag { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.6px; }
      .card-title { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .card-body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #334155; }
      .math-expr { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9px; font-weight: 600; }
      .card-sub { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #64748B; font-style: italic; }
      .pill-text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
      .port-label { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 9px; fill: #475569; text-anchor: middle; font-weight: 600; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E40AF"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991B1B"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="570" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="480" y="28" class="title">THE TWO-SPEED BRAIN ARCHITECTURE &amp; PRIVILEGE BOUNDARY</text>
  <text x="480" y="45" class="subtitle">Slow Deliberative System 2 (1–5 Hz) ⟷ Fast Real-Time System 1 (100–1000 Hz) with Proposal–Permission Gating</text>

  <!-- TOP CONTAINER: Untrusted Deliberative Cognitive Realm -->
  <rect x="36" y="64" width="888" height="152" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M 36 72 Q 36 64 44 64 L 916 64 Q 924 64 924 72 L 924 90 L 36 90 Z" fill="#EEF2F6"/>
  <text x="48" y="81" class="realm-tag" fill="#1E40AF">UNTRUSTED DELIBERATIVE COGNITIVE REALM · APPLICATION PROCESSOR (HOST LINUX MPU / EDGE NPU)</text>
  <text x="912" y="81" class="realm-tag" fill="#B45309" text-anchor="end">UNPRIVILEGED CANDIDATE PROPOSALS ONLY</text>

  <!-- Card 1: System 2 Foundation Model -->
  <g transform="translate(48, 98)">
    <rect width="390" height="106" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="12" y="18" class="card-title" fill="#1E3A8A">System 2: Foundation Model / VLM Intent Proposer</text>
    <text x="12" y="34" class="card-body">Substrate: 7B–70B Multimodal Transformer on NPU/GPU</text>
    <text x="12" y="50" class="math-expr" fill="#1E40AF">Artifact: Intent Lease L_intent = ⟨G, V_scope, t_expire⟩</text>
    <text x="12" y="66" class="card-body">Function: Open-world semantic grounding &amp; affordance logic</text>
    <text x="12" y="82" class="card-sub" fill="#991B1B">Vulnerabilities: Semantic hallucinations, P99 tail latency spikes</text>
    <rect x="318" y="76" width="60" height="18" rx="9" fill="#EFF6FF"/>
    <text x="348" y="89" class="pill-text" fill="#1D4ED8">1–5 Hz</text>
  </g>

  <!-- Connection: System 2 -> System 1.5 -->
  <line x1="438" y1="151" x2="494" y2="151" stroke="#B45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="466" y="141" class="port-label" fill="#B45309">Intent Lease</text>

  <!-- Card 2: System 1.5 Trajectory Planner -->
  <g transform="translate(496, 98)">
    <rect width="416" height="106" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="12" y="18" class="card-title" fill="#B45309">System 1.5: Generative Trajectory Planner (ACT / Diffusion)</text>
    <text x="12" y="34" class="card-body">Substrate: Receding-Horizon Action Chunking Transformer</text>
    <text x="12" y="50" class="math-expr" fill="#B45309">Artifact: Candidate Proposal p_t = [q_1, q_2, ..., q_H] ∈ ℝ^(H × D)</text>
    <text x="12" y="66" class="card-body">Function: Synthesizes C² continuous splines (Horizon H=16..64)</text>
    <text x="12" y="82" class="card-sub">Amortizes VLA compute wall; smooth deceleration upon delay</text>
    <rect x="344" y="76" width="60" height="18" rx="9" fill="#FEF3C7"/>
    <text x="374" y="89" class="pill-text" fill="#B45309">20–50 Hz</text>
  </g>

  <!-- THE CAUSAL BOUNDARY: PROPOSAL-PERMISSION BARRIER -->
  <line x1="36" y1="240" x2="924" y2="240" stroke="#991B1B" stroke-width="1.8" stroke-dasharray="8,5"/>
  <g transform="translate(190, 226)">
    <rect width="580" height="28" rx="6" fill="#991B1B"/>
    <text x="290" y="18" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10px" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1px">PROPOSAL–PERMISSION PRIVILEGE BOUNDARY (ZERO DIRECT ACTUATOR ACCESS)</text>
  </g>

  <!-- Handoff of Candidate Proposal p_t -->
  <line x1="704" y1="204" x2="704" y2="280" stroke="#991B1B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-crimson)"/>
  <rect x="716" y="246" width="168" height="22" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
  <text x="800" y="261" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#991B1B" text-anchor="middle">Candidate Proposal p_t</text>

  <!-- BOTTOM CONTAINER: Trusted Real-Time Safety Realm -->
  <rect x="36" y="286" width="888" height="152" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <path d="M 36 294 Q 36 286 44 286 L 916 286 Q 924 286 924 294 L 924 312 L 36 312 Z" fill="#DCFCE7"/>
  <text x="48" y="303" class="realm-tag" fill="#166534">TRUSTED REAL-TIME SAFETY REALM · HARDWARE SAFETY SILICON (DUAL LOCKSTEP MCU / FPGA)</text>
  <text x="912" y="303" class="realm-tag" fill="#166534" text-anchor="end">SOLE PERMISSION TO ENERGIZE ACTUATORS</text>

  <!-- Card 3: System 1 Deterministic Barrier Enforcer -->
  <g transform="translate(48, 320)">
    <rect width="470" height="106" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="18" class="card-title" fill="#065F46">System 1: Deterministic Barrier Enforcer &amp; Safety Referee</text>
    <text x="12" y="34" class="card-body">Substrate: Bare-metal lockstep MCU / FreeRTOS (Zero heap allocation)</text>
    <text x="12" y="50" class="math-expr" fill="#065F46">Control Barrier Function: ḣ(x) + γ h(x) ≥ 0 (Active-Set QP)</text>
    <text x="12" y="66" class="card-body">Function: Evaluates dynamic stopping envelope d_stop ≤ D_clear</text>
    <text x="12" y="82" class="card-sub">Permit: u_t = argmin ‖u - p_t‖² s.t. safety barrier ∧ torque clamps</text>
    <rect x="396" y="76" width="62" height="18" rx="9" fill="#D1FAE5"/>
    <text x="427" y="89" class="pill-text" fill="#065F46">1000 Hz</text>
  </g>

  <!-- Connection: Safety Gate -> Motor Timers -->
  <line x1="518" y1="373" x2="574" y2="373" stroke="#059669" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="546" y="363" class="port-label" fill="#065F46">Permit u_t</text>

  <!-- Card 4: Physical Actuation Commit -->
  <g transform="translate(576, 320)">
    <rect width="336" height="106" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="18" class="card-title" fill="#065F46">Physical Actuation &amp; Gate Drivers</text>
    <text x="12" y="34" class="card-body">Substrate: Hardware PWM Timers (TIMx_CCR)</text>
    <text x="12" y="50" class="math-expr" fill="#065F46">Hardware Authority: PWM Gate Permit [0, 1]</text>
    <text x="12" y="66" class="card-body">Physical Action: 3-Phase Inverter Current Injection</text>
    <text x="12" y="82" class="card-sub" fill="#991B1B">Fallback: Hardware crowbar / Hi-Z trip upon invariant failure</text>
    <rect x="256" y="76" width="68" height="18" rx="9" fill="#D1FAE5"/>
    <text x="290" y="89" class="pill-text" fill="#065F46">20–100 kHz</text>
  </g>

  <!-- RETURN LOOP: Sensor Telemetry & Invariant Feedback (Around the perimeter) -->
  <path d="M 744 426 L 744 476 L 24 476 L 24 151 L 48 151" fill="none" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="260" y="462" width="440" height="26" rx="4" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
  <text x="480" y="479" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9px" font-weight="700" fill="#0369A1" text-anchor="middle">HARDWARE ENCODER &amp; CURRENT SENSOR TELEMETRY FEEDBACK</text>

  <!-- Bottom Subtitle / Synthesis -->
  <text x="480" y="540" class="subtitle">System 2 proposes open-world intent (1–5 Hz); System 1.5 unrolls candidate motion chunks (20–50 Hz); System 1 enforces deterministic safety barriers (1000 Hz).</text>
</svg>
