<rect width="960" height="550" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="480.0" y="28" class="title">CRYPTOGRAPHIC RELEASE RECORD ARCHITECTURE &amp; RUNTIME ENFORCEMENT PIPELINE</text>
<text x="480.0" y="44" class="subtitle">Immutable Engineering Ledger ⟷ Hardware Root of Trust ⟷ Envelope Trichotomy ⟷ Automatic Invalidation Triggers</text>
<rect x="35" y="66" width="285" height="455" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="35" y="66" width="285" height="28" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="177.5" y="85" font-size="10" font-weight="700" fill="#5B4B8A" text-anchor="middle">1. IMMUTABLE RELEASE RECORD LEDGER</text>
<rect x="43" y="102" width="269" height="56" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="43" y="102" width="3" height="56" rx="1" fill="#1F407A"/>
<text x="51" y="115" font-size="8.5" font-weight="700" fill="#1F407A">Claim Identifier</text>
<text x="51" y="128" font-size="7.5" font-family="monospace" fill="#475569">CLAIM-CH16-TACTILE-001</text>
<rect x="43" y="164" width="269" height="56" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="43" y="164" width="3" height="56" rx="1" fill="#1F407A"/>
<text x="51" y="177" font-size="8.5" font-weight="700" fill="#1F407A">GSN Tree Topology Hash</text>
<text x="51" y="190" font-size="7.5" font-family="monospace" fill="#475569">SHA256: 8f3c4e...d94a</text>
<rect x="43" y="226" width="269" height="56" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="43" y="226" width="3" height="56" rx="1" fill="#007A87"/>
<text x="51" y="239" font-size="8.5" font-weight="700" fill="#007A87">Verified Evidence Pointer Array</text>
<text x="51" y="252" font-size="7.5" font-family="monospace" fill="#475569">• LOG-TAC-2026-0814 (P99.9: 12 ms)</text>
<text x="51" y="263" font-size="7.5" font-family="monospace" fill="#475569">• DYN-IMP-2026-0922 (∫F dt: 1.1 N·s)</text>
<text x="51" y="274" font-size="7.5" font-family="monospace" fill="#475569">• LOG-MCU-2026-1105 (Jitter: 5 µs)</text>
<rect x="43" y="288" width="269" height="56" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="43" y="288" width="3" height="56" rx="1" fill="#215CAF"/>
<text x="51" y="301" font-size="8.5" font-weight="700" fill="#215CAF">Cryptographic Manifest Hashes</text>
<text x="51" y="314" font-size="7.5" font-family="monospace" fill="#475569">• Policy Checkpoint: SHA256: e4b7...10c2</text>
<text x="51" y="325" font-size="7.5" font-family="monospace" fill="#475569">• Safety FPGA Bitstream: SHA256: 3a91...fe78</text>
<text x="51" y="336" font-size="7.5" font-family="monospace" fill="#475569">• FreeRTOS Kernel: SHA256: 7d18...99b0</text>
<rect x="43" y="350" width="269" height="56" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="43" y="350" width="3" height="56" rx="1" fill="#D97706"/>
<text x="51" y="363" font-size="8.5" font-weight="700" fill="#D97706">Standing Conditions Contract</text>
<text x="51" y="376" font-size="7.5" font-family="monospace" fill="#475569">1. Max Payload Mass: m ≤ 1.5 kg</text>
<text x="51" y="387" font-size="7.5" font-family="monospace" fill="#475569">2. Optical Feeder Dryness: &lt; 2% sheen</text>
<text x="51" y="398" font-size="7.5" font-family="monospace" fill="#475569">3. Torque Observer Trip: F_trip = 18 N</text>
<rect x="43" y="412" width="269" height="56" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="43" y="412" width="3" height="56" rx="1" fill="#5B4B8A"/>
<text x="51" y="425" font-size="8.5" font-weight="700" fill="#5B4B8A">Signed Adjudicator Attestation</text>
<text x="51" y="438" font-size="7.5" font-family="monospace" fill="#475569">Lead Systems Adjudicator Key:</text>
<text x="51" y="449" font-size="7.5" font-family="monospace" fill="#475569">Ed25519: sig_44b9_88fa... (Verified)</text>
<text x="51" y="460" font-size="7.5" font-family="monospace" fill="#475569">Expiry: 2000 h / 10⁶ cycles</text>
<text x="177.5" y="488" font-size="7.5" font-weight="600" fill="#64748B" text-anchor="middle">Stored in Machine Notebook Ledger (Section 4.10)</text>
<rect x="340" y="66" width="285" height="455" rx="8" fill="#FFFFFF" stroke="#007A87" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="340" y="66" width="285" height="28" rx="8" fill="#007A87" fill-opacity="0.12"/>
<text x="482.5" y="85" font-size="10" font-weight="700" fill="#007A87" text-anchor="middle">2. HARDWARE ROOT OF TRUST &amp; ENFORCER</text>
<rect x="348" y="102" width="269" height="76" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="354" y="117" font-size="9" font-weight="700" fill="#1A202C">Hardware Secure Boot &amp; Manifest Verification</text>
<text x="354" y="131" font-size="7.8" fill="#475569">• Public key burned into silicon OTP eFuses</text>
<text x="354" y="143" font-size="7.8" fill="#475569">• Dual-Bank (A/B) flash with watchdog fallback</text>
<text x="354" y="155" font-size="7.8" fill="#475569">• 1-bit hash mismatch halts inverter gate power</text>
<text x="354" y="169" font-size="8" font-weight="700" fill="#DC2626">Refusal to energize without signed release record</text>
<rect x="348" y="186" width="269" height="135" rx="5" fill="#1F407A" fill-opacity="0.04" stroke="#1F407A" stroke-width="1"/>
<text x="354" y="201" font-size="9" font-weight="700" fill="#1F407A">Runtime Envelope Trichotomy (Section 16.5)</text>
<rect x="356" y="210" width="253" height="30" rx="3" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="0.8"/>
<text x="362" y="222" font-size="8" font-weight="700" fill="#10B981">1. KNOWN-TRUE (Inside Envelope)</text>
<text x="362" y="233" font-size="7.2" fill="#475569">Telemetry valid · Covariance bounded → Permit u_t = p_t</text>
<rect x="356" y="244" width="253" height="30" rx="3" fill="#DC2626" fill-opacity="0.1" stroke="#DC2626" stroke-width="0.8"/>
<text x="362" y="256" font-size="8" font-weight="700" fill="#DC2626">2. KNOWN-FALSE (Physical Boundary Breached)</text>
<text x="362" y="267" font-size="7.2" fill="#475569">F_norm &gt; 18 N or tracking error &gt; 50 mm → Trip brakes &lt; 1 ms</text>
<rect x="356" y="278" width="253" height="32" rx="3" fill="#A51C30" fill-opacity="0.15" stroke="#A51C30" stroke-width="1.1"/>
<text x="362" y="290" font-size="8" font-weight="700" fill="#A51C30">3. UNKNOWN (Epistemic Gap / Loss of Telemetry)</text>
<text x="362" y="303" font-size="7.2" font-weight="600" fill="#1A202C">CRC fail / blind lidar → MUST TREAT AS OUTSIDE → E-Stop</text>
<rect x="348" y="329" width="269" height="102" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="354" y="344" font-size="9" font-weight="700" fill="#1A202C">1 kHz Synchronous Condition Detectors</text>
<text x="354" y="359" font-size="7.8" fill="#475569">• Continuously Monitored: Load cell payload mass check</text>
<text x="354" y="371" font-size="7.8" fill="#475569">  (m ≤ 1.5 kg) before every arm acceleration cycle</text>
<text x="354" y="385" font-size="7.8" fill="#475569">• Optical Dryness Strobe: Pre-grasp surface reflectance</text>
<text x="354" y="397" font-size="7.8" fill="#475569">• Motor Thermistors: Winding temperature T ≤ 393 K</text>
<text x="354" y="411" font-size="7.8" fill="#475569">• Periodically Re-established: Joint torque calibration (500 h)</text>
<text x="354" y="423" font-size="7.8" fill="#475569">• Friction Brake Inspection: Lining wear check (250k cycles)</text>
<rect x="645" y="66" width="285" height="455" rx="8" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="645" y="66" width="285" height="28" rx="8" fill="#A51C30" fill-opacity="0.12"/>
<text x="787.5" y="85" font-size="10" font-weight="700" fill="#A51C30" text-anchor="middle">3. INVALIDATION TRIGGERS &amp; RE-DECISION</text>
<rect x="653" y="102" width="269" height="76" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="653" y="102" width="3" height="76" rx="1" fill="#DC2626"/>
<text x="661" y="116" font-size="8.5" font-weight="700" fill="#DC2626">Software Invalidation Triggers</text>
<text x="661" y="130" font-size="7.5" fill="#475569">• Any policy neural network weight update</text>
<text x="661" y="141" font-size="7.5" fill="#475569">• RTOS thread scheduling priority change</text>
<text x="661" y="152" font-size="7.5" fill="#475569">• Lower-level sensor driver / CAN patch</text>
<text x="661" y="163" font-size="7.5" fill="#475569">→ Automatically voids SHA-256 signature</text>
<rect x="653" y="184" width="269" height="76" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="653" y="184" width="3" height="76" rx="1" fill="#DC2626"/>
<text x="661" y="198" font-size="8.5" font-weight="700" fill="#DC2626">Hardware Invalidation Triggers</text>
<text x="661" y="212" font-size="7.5" fill="#475569">• Unverified actuator or sensor part swap</text>
<text x="661" y="223" font-size="7.5" fill="#475569">• Gearbox backlash &gt; 0.10° (15 ms phase lag)</text>
<text x="661" y="234" font-size="7.5" fill="#475569">• Brake lining wear &lt; 2.0 mm thickness</text>
<text x="661" y="245" font-size="7.5" fill="#475569">→ Hardware interlock inhibits power stage</text>
<rect x="653" y="266" width="269" height="76" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="653" y="266" width="3" height="76" rx="1" fill="#D97706"/>
<text x="661" y="280" font-size="8.5" font-weight="700" fill="#D97706">Operational Invalidation Triggers</text>
<text x="661" y="294" font-size="7.5" fill="#475569">• Ambient temperature T &gt; 40°C</text>
<text x="661" y="305" font-size="7.5" fill="#475569">• DC Bus voltage droop &lt; 21.6 V (10% drop)</text>
<text x="661" y="316" font-size="7.5" fill="#475569">• Workpiece mass &gt; 1.5 kg</text>
<text x="661" y="327" font-size="7.5" fill="#475569">→ Immediate safe stop &amp; operational latch</text>
<rect x="653" y="348" width="269" height="76" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<rect x="653" y="348" width="3" height="76" rx="1" fill="#007A87"/>
<text x="661" y="362" font-size="8.5" font-weight="700" fill="#007A87">Continuous Re-Decision Protocol</text>
<text x="661" y="376" font-size="7.5" fill="#475569">• Non-volatile circular buffer logs all residuals</text>
<text x="661" y="387" font-size="7.5" fill="#475569">• Periodic empirical audit every 500 op hours</text>
<text x="661" y="398" font-size="7.5" fill="#475569">• Sensor noise drift &gt; 15% triggers derating</text>
<text x="661" y="409" font-size="7.5" fill="#475569">• Re-adjudication required to renew authority</text>
<rect x="653" y="430" width="269" height="42" rx="4" fill="#A51C30" fill-opacity="0.12" stroke="#A51C30" stroke-width="1"/>
<text x="787.5" y="446" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle">REVOCATION OF OPERATING AUTHORITY</text>
<text x="787.5" y="460" font-size="7.5" fill="#1A202C" text-anchor="middle">Inverter gates clamped · Mandatory re-audit</text>
