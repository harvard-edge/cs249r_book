<text x="174.5" y="184" font-size="10" font-weight="700" fill="#1F407A" text-anchor="middle">THE BRAIN: COGNITIVE DELIBERATION</text>
<text x="39.0" y="208" font-size="11" font-weight="700" fill="#1A202C">High-Capacity Stochastic Policy (MPU)</text>
<text x="39.0" y="222" font-size="8.5" font-weight="600" fill="#215CAF">Cadence: 20–50 Hz · Linux / NPU · Latency τ_infer</text>
<text x="39.0" y="242" font-size="8.5" fill="#475569">• VLM Semantic Goal Grounding (Ch 10)</text>
<text x="39.0" y="259" font-size="8.5" fill="#475569">• SE(3) Dynamic Kinematic Frame Tree (Ch 9)</text>
<text x="39.0" y="276" font-size="8.5" fill="#475569">• Diffusion / ACT Action Chunks H=16 (Ch 11)</text>
<text x="39.0" y="293" font-size="8.5" fill="#475569">• Expiring Intent Lease Issuance t_expire (Ch 10)</text>
<text x="39.0" y="310" font-size="8.5" fill="#475569">• Epistemic Uncertainty &amp; Silent Drift (Ch 7, 17)</text>
