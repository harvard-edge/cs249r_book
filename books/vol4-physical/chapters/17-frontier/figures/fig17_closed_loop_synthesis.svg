<text x="849.5" y="184" font-size="10" font-weight="700" fill="#007A87" text-anchor="middle">THE NERVOUS SYSTEM: REFLEX ENFORCER</text>
<text x="714.0" y="208" font-size="11" font-weight="700" fill="#1A202C">Deterministic Invariant Filter (MCU)</text>
<text x="714.0" y="222" font-size="8.5" font-weight="600" fill="#007A87">Cadence: 1000 Hz · FreeRTOS / Cortex-M · Hard Real-Time</text>
<text x="714.0" y="242" font-size="8.5" fill="#475569">• Real-Time Active-Set QP Solver: h(x) ≥ 0 (Ch 12)</text>
<text x="714.0" y="259" font-size="8.5" fill="#475569">• Dynamic Stopping Clearance: d_stop(v) ≤ d_gap (Ch 2)</text>
<text x="714.0" y="276" font-size="8.5" fill="#475569">• Lock-Free Inter-Core Mailbox &amp; Lease Check (Ch 4)</text>
<text x="714.0" y="293" font-size="8.5" fill="#475569">• Shared Intervention &amp; C² Bumpless Takeover (Ch 14)</text>
<text x="714.0" y="310" font-size="8.5" fill="#475569">• Hardware Watchdog &amp; ISO 13849 Safety Relay (Ch 15)</text>
