<text x="266.0" y="406" font-size="10" font-weight="700" fill="#215CAF" text-anchor="middle">SENSORY TRANSDUCTION &amp; INFORMATION FRESHNESS</text>
<text x="41.0" y="430" font-size="10.5" font-weight="700" fill="#1A202C">Photons / Forces → Digital Bits (The Sensing Boundary)</text>
<text x="41.0" y="448" font-size="8.5" fill="#475569">• Transduction: MIPI CSI-2 CMOS, IMU gyros, optical wheel encoders (Ch 8)</text>
<text x="41.0" y="465" font-size="8.5" fill="#475569">• Zero-Copy DMA: Ring buffers, hardware PTP nanosecond timestamps</text>
<text x="41.0" y="482" font-size="8.5" fill="#475569">• Information Age Freshness: τ_total = τ_readout + τ_DMA + τ_infer + τ_act</text>
<text x="41.0" y="499" font-size="8.5" fill="#475569">• Spatial Displacement Lag: Unchecked motion d_lag = v · τ_total (Ch 2, 17)</text>
<text x="41.0" y="516" font-size="8.5" fill="#475569">• Endogenous Feedback: Action u_t shifts pose, shaping future observations y_t+1</text>
