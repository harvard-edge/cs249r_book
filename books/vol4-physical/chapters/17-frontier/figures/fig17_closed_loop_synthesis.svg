<line x1="367.0" y1="216" x2="657.0" y2="216" stroke="#CBD5E1" stroke-width="1"/>
<text x="366.0" y="234" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Shared SRAM TCM:</text>
<text x="366.0" y="246" font-size="8" fill="#475569">Zero-copy lock-free seqlock mailbox</text>
<text x="366.0" y="258" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Dead-Man Leases:</text>
<text x="366.0" y="270" font-size="8" fill="#475569">Lease t_expire bounds MPU stalls ≤ 50 ms</text>
<text x="366.0" y="282" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Invariant Projection:</text>
<text x="366.0" y="294" font-size="8" fill="#475569">u_t* = argmin ||u - û||² s.t. h(x) ≥ 0</text>
<text x="366.0" y="306" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Authority Hierarchy:</text>
<text x="366.0" y="318" font-size="8" fill="#475569">Reflex Stop > Human Override > Policy</text>
