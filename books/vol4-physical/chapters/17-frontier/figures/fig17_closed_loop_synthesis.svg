<text x="520.0" y="595" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">CHAPTER 17 FRONTIER SYNTHESIS: THE BOUNDARY OF VERIFIABLE KNOWLEDGE</text>
<text x="42.0" y="618" font-size="9" font-weight="700" fill="#1A202C">1. Detectorless Blind Spots</text>
<text x="42.0" y="632" font-size="8" fill="#475569">States S_A &amp; S_B produce identical telemetry prior to</text>
<text x="42.0" y="645" font-size="8" fill="#475569">deadline t_deadline (internal voids, friction drops, drift).</text>
<text x="367.3333333333333" y="618" font-size="9" font-weight="700" fill="#1A202C">2. Astronomical Exposure Limits</text>
<text x="367.3333333333333" y="632" font-size="8" fill="#475569">Proving p ≤ 10⁻⁹/h takes n ≥ 3.0×10⁹ h (342k yrs).</text>
<text x="367.3333333333333" y="645" font-size="8" fill="#475569">Empirical sampling cannot certify open-world safety.</text>
<text x="692.6666666666666" y="618" font-size="9" font-weight="700" fill="#1A202C">3. Structural Containment Mandate</text>
<text x="692.6666666666666" y="632" font-size="8" fill="#475569">Where evidence ends, nervous system clamps authority</text>
<text x="692.6666666666666" y="645" font-size="8" fill="#475569">(v_clamp, force limits) to render the unknown harmless.</text>
