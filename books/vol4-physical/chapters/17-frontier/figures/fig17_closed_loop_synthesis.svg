<text x="774.0" y="406" font-size="10" font-weight="700" fill="#A51C30" text-anchor="middle">THE PHYSICAL PLANT &amp; NEWTONIAN REALITY (W_t → W_t+1)</text>
<text x="549.0" y="430" font-size="10.5" font-weight="700" fill="#1A202C">Continuous Mechanics, Conservation Laws &amp; Irreversibility</text>
<text x="549.0" y="448" font-size="8.5" fill="#475569">• Inertial Momentum: Kinetic energy E_k = 1/2 m v² (No software rollback!)</text>
<text x="549.0" y="465" font-size="8.5" fill="#475569">• Tire/Surface Coulomb Friction Limits: F_friction ≤ μ N (Ch 2, 17)</text>
<text x="549.0" y="482" font-size="8.5" fill="#475569">• Non-Smooth Contact Dynamics: Painlevé paradoxes &amp; brittle yield (Ch 2)</text>
<text x="549.0" y="499" font-size="8.5" fill="#475569">• Actuator Dissipation: Thermal Joule heating P_loss = I²R, winding limits</text>
<text x="549.0" y="516" font-size="8.5" fill="#475569">• Physical State Update: W_t+1 = Dynamics(W_t, u_t*, Disturbances)</text>
