<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .main-title { font-weight: 800; font-size: 15px; fill: #1F407A; letter-spacing: 0.5px; }
      .main-subtitle { font-size: 11px; fill: #475569; }
      .panel-header { font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px; }
      .frame-title { font-weight: 700; font-size: 12px; }
      .frame-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-weight: 700; font-size: 11.5px; }
      .badge-txt { font-weight: 700; font-size: 8.5px; }
      .body-txt { font-size: 9.5px; fill: #334155; line-height: 1.35; }
      .bold-txt { font-weight: 700; font-size: 9.5px; }
      .math-txt { font-family: "STIX Two Text", "Times New Roman", serif; font-style: italic; font-size: 11px; }
      .code-sm { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.5px; font-weight: 600; }
    </style>

    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>

    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top Title Banner -->
  <rect x="20" y="14" width="920" height="42" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="32" class="main-title">REP 105 SPATIAL TRANSFORM TREE &amp; COVARIANCE PROPAGATION</text>
  <text x="36" y="47" class="main-subtitle">Decoupling Continuous Dead Reckoning from Discontinuous Global Localization Across Embodied Coordinate Frames</text>

  <!-- ================= LEFT COLUMN: THE KINEMATIC TRANSFORM TREE ================= -->
  <rect x="20" y="64" width="500" height="482" fill="#F8FAFC" rx="6" stroke="#E2E8F0" stroke-width="1"/>
  <text x="34" y="82" class="panel-header" fill="#1F407A">COORDINATE FRAME KINEMATIC HIERARCHY</text>
  <text x="320" y="82" font-size="9" font-weight="700" fill="#475569">SE(3) RIGID TRANSFORMS &amp; DRIFT</text>

  <!-- Level 0: earth Frame -->
  <g transform="translate(34, 94)">
    <rect width="472" height="44" rx="5" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="44" rx="2" fill="#5B4B8A"/>
    <text x="16" y="17" class="frame-code" fill="#5B4B8A">earth</text>
    <text x="62" y="17" class="frame-title" fill="#1E293B">Earth-Centered Geodetic Frame (ECEF / UTM / WGS-84)</text>
    <rect x="366" y="6" width="96" height="15" rx="3" fill="#5B4B8A" fill-opacity="0.12"/>
    <text x="414" y="17" class="badge-txt" fill="#5B4B8A" text-anchor="middle">GLOBAL PLANETARY</text>
    <text x="16" y="34" class="body-txt" fill="#64748B">Static planetary origin for GNSS / RTK constellations and geospatial coordinates</text>
  </g>

  <!-- Down Arrow: earth -> map -->
  <path d="M 270 138 L 270 152" stroke="#5B4B8A" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <rect x="195" y="141" width="150" height="15" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="270" y="152" class="code-sm" fill="#5B4B8A" text-anchor="middle">T_earth_to_map (Fixed Datum)</text>

  <!-- Level 1: map Frame -->
  <g transform="translate(34, 158)">
    <rect width="472" height="60" rx="5" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="60" rx="2" fill="#1F407A"/>
    <text x="16" y="18" class="frame-code" fill="#1F407A">map</text>
    <text x="50" y="18" class="frame-title" fill="#0F172A">World-Fixed Metric Map Reference Frame</text>
    <rect x="340" y="6" width="122" height="15" rx="3" fill="#1F407A" fill-opacity="0.12"/>
    <text x="401" y="17" class="badge-txt" fill="#1F407A" text-anchor="middle">GLOBAL CONSISTENT</text>
    
    <text x="16" y="35" class="body-txt"><tspan font-weight="700" fill="#1F407A">Characteristics:</tspan> Non-drifting global frame. Long-term accuracy bounded by map survey.</text>
    <text x="16" y="49" class="body-txt"><tspan font-weight="700" fill="#1F407A">Update Properties:</tspan> Low rate (1–10 Hz); <tspan fill="#A51C30" font-weight="700">Discontinuous step-jumps allowed</tspan> on relocalization.</text>
  </g>

  <!-- Down Arrow with Transform Card: map -> odom (The Key REP 105 Interface) -->
  <path d="M 270 218 L 270 248" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
  <g transform="translate(130, 224)">
    <rect width="280" height="22" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
    <text x="140" y="15" font-size="9" font-weight="700" fill="#A51C30" text-anchor="middle">T_map_to_odom(t) [Discontinuous Step Jumps on Loop Closure]</text>
  </g>

  <!-- Level 2: odom Frame -->
  <g transform="translate(34, 252)">
    <rect width="472" height="60" rx="5" fill="#FFFFFF" stroke="#007A87" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="60" rx="2" fill="#007A87"/>
    <text x="16" y="18" class="frame-code" fill="#007A87">odom</text>
    <text x="56" y="18" class="frame-title" fill="#0F172A">Locally Smooth Odometry Reference Frame</text>
    <rect x="330" y="6" width="132" height="15" rx="3" fill="#007A87" fill-opacity="0.12"/>
    <text x="396" y="17" class="badge-txt" fill="#007A87" text-anchor="middle">STRICTLY CONTINUOUS</text>
    
    <text x="16" y="35" class="body-txt"><tspan font-weight="700" fill="#007A87">Characteristics:</tspan> Dead reckoning (wheels + IMU + VO). Continuous &amp; differentiable (C¹/C²).</text>
    <text x="16" y="49" class="body-txt"><tspan font-weight="700" fill="#007A87">Drift Behavior:</tspan> High rate (50–200 Hz); <tspan fill="#B87333" font-weight="700">Continuous drift: Σ_drift(t) ∝ Q_rw · √t</tspan> without step jumps.</text>
  </g>

  <!-- Down Arrow: odom -> base_link -->
  <path d="M 270 312 L 270 342" stroke="#007A87" stroke-width="2" marker-end="url(#arr-petrol)"/>
  <g transform="translate(140, 318)">
    <rect width="260" height="22" rx="4" fill="#F0FDFA" stroke="#007A87" stroke-width="1"/>
    <text x="130" y="15" font-size="9" font-weight="700" fill="#007A87" text-anchor="middle">T_odom_to_body(t) [High-Rate Continuous Kinematic Pose]</text>
  </g>

  <!-- Level 3: base_link Frame -->
  <g transform="translate(34, 346)">
    <rect width="472" height="56" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="6" height="56" rx="2" fill="#A51C30"/>
    <text x="16" y="18" class="frame-code" fill="#A51C30">base_link</text>
    <text x="90" y="18" class="frame-title" fill="#0F172A">Robot Physical Center / Chassis Origin (body)</text>
    <rect x="340" y="6" width="122" height="15" rx="3" fill="#A51C30" fill-opacity="0.12"/>
    <text x="401" y="17" class="badge-txt" fill="#A51C30" text-anchor="middle">PHYSICAL CHASSIS</text>
    
    <text x="16" y="34" class="body-txt"><tspan font-weight="700" fill="#A51C30">Kinematic Anchor:</tspan> Center of mass / drive axle midpoint. Swept volume origin.</text>
    <text x="16" y="47" class="body-txt"><tspan font-weight="700" fill="#A51C30">Consumers:</tspan> Motor torque &amp; velocity controllers consume odom→base_link directly.</text>
  </g>

  <!-- Branching Arrows: base_link -> sensors -->
  <path d="M 150 402 L 110 430" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
  <path d="M 270 402 L 270 430" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
  <path d="M 390 402 L 430 430" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>

  <!-- Level 4: Sensor Extrinsics Frames -->
  <g transform="translate(34, 434)">
    <!-- Camera Frame -->
    <g transform="translate(0, 0)">
      <rect width="148" height="52" rx="4" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="8" y="15" class="frame-code" fill="#B87333">camera_optical</text>
      <text x="8" y="29" class="body-txt" font-size="8.5px">Z-forward / X-right / Y-down</text>
      <text x="8" y="43" class="code-sm" fill="#64748B">T_body_cam [Σ_ext]</text>
    </g>

    <!-- LiDAR Frame -->
    <g transform="translate(162, 0)">
      <rect width="148" height="52" rx="4" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="8" y="15" class="frame-code" fill="#B87333">lidar_link</text>
      <text x="8" y="29" class="body-txt" font-size="8.5px">Laser emitter / range center</text>
      <text x="8" y="43" class="code-sm" fill="#64748B">T_body_lidar [Σ_ext]</text>
    </g>

    <!-- IMU / Radar Frame -->
    <g transform="translate(324, 0)">
      <rect width="148" height="52" rx="4" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#card-shadow)"/>
      <text x="8" y="15" class="frame-code" fill="#B87333">imu_link / radar</text>
      <text x="8" y="29" class="body-txt" font-size="8.5px">Specific force &amp; Doppler array</text>
      <text x="8" y="43" class="code-sm" fill="#64748B">T_body_imu [Σ_ext]</text>
    </g>
  </g>

  <!-- Level 5: Target Observation in Sensor Frame -->
  <g transform="translate(34, 496)">
    <rect width="472" height="42" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="1"/>
    <text x="14" y="16" class="frame-code" fill="#EA580C">z_obs ∈ F_sensor</text>
    <text x="130" y="16" class="bold-txt" fill="#9A3412">Physical Observation with Measurement Covariance Σ_z ∈ ℝ³ˣ³</text>
    <text x="14" y="32" class="body-txt" fill="#7C2D12">Full Spatial Mapping: <tspan font-weight="700">p_map = T_map^odom · T_odom^body · T_body^sensor · z_obs</tspan></text>
  </g>


  <!-- ================= RIGHT COLUMN: SYSTEMS MECHANISMS & CONTRACTS ================= -->

  <!-- Panel 1: The Downstream Consumer Split (Why REP 105 matters) -->
  <g transform="translate(532, 64)">
    <rect width="408" height="182" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="408" height="26" rx="6" fill="#1F407A"/>
    <rect x="0" y="18" width="408" height="8" fill="#1F407A"/>
    <text x="14" y="18" font-size="10.5px" font-weight="700" fill="#FFFFFF">1. THE DOWNSTREAM CONSUMER SPLIT (REP 105 INVARIANT)</text>

    <!-- Branch A: Real-Time Motion Control -->
    <g transform="translate(12, 34)">
      <rect width="384" height="64" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1"/>
      <text x="10" y="15" font-size="10px" font-weight="700" fill="#007A87">A. Real-Time Tracking &amp; Enforcement (50 Hz – 1 kHz)</text>
      <text x="10" y="29" class="body-txt"><tspan font-weight="700" fill="#007A87">Consumes:</tspan> <tspan class="code-sm">T_odom_to_body(t)</tspan> (Smooth Odometric Frame)</text>
      <text x="10" y="43" class="body-txt"><tspan font-weight="700" fill="#007A87">Systems Invariant:</tspan> Must be <tspan font-weight="700" fill="#A51C30">strictly C¹/C² continuous</tspan>. Any step jump</text>
      <text x="10" y="56" class="body-txt">creates infinite derivative jerk (<tspan class="math-txt">x⃛ → ∞</tspan>), tripping motor inverter overcurrent.</text>
    </g>

    <!-- Branch B: Global Path Planning -->
    <g transform="translate(12, 106)">
      <rect width="384" height="64" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1"/>
      <text x="10" y="15" font-size="10px" font-weight="700" fill="#1F407A">B. Global Path Planning &amp; Memory (1 Hz – 10 Hz)</text>
      <text x="10" y="29" class="body-txt"><tspan font-weight="700" fill="#1F407A">Consumes:</tspan> <tspan class="code-sm">T_map_to_body = T_map^odom · T_odom^body</tspan> (Global Frame)</text>
      <text x="10" y="43" class="body-txt"><tspan font-weight="700" fill="#1F407A">Systems Invariant:</tspan> Absorbs SLAM loop closures &amp; GPS corrections in</text>
      <text x="10" y="56" class="body-txt"><tspan class="code-sm">T_map^odom</tspan> via discrete jumps without shaking the tracking controller.</text>
    </g>
  </g>

  <!-- Panel 2: Spatial Covariance Propagation Formula -->
  <g transform="translate(532, 254)">
    <rect width="408" height="152" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="408" height="26" rx="6" fill="#007A87"/>
    <rect x="0" y="18" width="408" height="8" fill="#007A87"/>
    <text x="14" y="18" font-size="10.5px" font-weight="700" fill="#FFFFFF">2. SPATIAL UNCERTAINTY COMPOSITION ACROSS FRAMES</text>

    <g transform="translate(12, 34)">
      <rect width="384" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="16" font-size="9px" font-weight="700" fill="#1E293B">First-Order Spatial Covariance Chain:</text>
      <text x="10" y="32" class="code-sm" fill="#1F407A">Σ_map ≈ J_odom·Σ_drift·J_odomᵀ + R_body·Σ_ext·R_bodyᵀ + R_tot·Σ_z·R_totᵀ</text>
    </g>

    <g transform="translate(12, 82)">
      <text x="8" y="14" class="body-txt"><tspan font-weight="700" fill="#B87333">• Extrinsic Mounting Drift (Σ_ext):</tspan> Thermal baseline expansion</text>
      <text x="16" y="26" class="code-sm" fill="#475569">Δb = α · L · ΔT  (e.g., 25°C rise on 120mm Al bar = 0.069mm shift)</text>
      <text x="8" y="42" class="body-txt"><tspan font-weight="700" fill="#A51C30">• Long-Range Lever-Arm Error:</tspan> Angular mount drift <tspan class="math-txt">θ</tspan> yields lateral</text>
      <text x="16" y="55" class="body-txt">error <tspan class="math-txt">δx ≈ z · θ</tspan> (0.29° error at 10m range = <tspan font-weight="700" fill="#A51C30">50.0 mm lateral bias</tspan>).</text>
    </g>
  </g>

  <!-- Panel 3: Mandatory Observation Handoff Contract -->
  <g transform="translate(532, 414)">
    <rect width="408" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="408" height="26" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="408" height="8" fill="#A51C30"/>
    <text x="14" y="18" font-size="10.5px" font-weight="700" fill="#FFFFFF">3. MANDATORY OBSERVATION HANDOFF CONTRACT</text>

    <g transform="translate(12, 34)">
      <!-- Property 1 -->
      <circle cx="8" cy="10" r="4" fill="#A51C30"/>
      <text x="18" y="14" class="bold-txt" fill="#A51C30">Capture Timestamp t₀ (Midpoint):</text>
      <text x="195" y="14" class="body-txt">Eliminates velocity lag <tspan class="math-txt">Δx = v · τ</tspan>.</text>

      <!-- Property 2 -->
      <circle cx="8" cy="34" r="4" fill="#1F407A"/>
      <text x="18" y="38" class="bold-txt" fill="#1F407A">Reference Frame Key F_sensor:</text>
      <text x="195" y="38" class="body-txt">Binds measurement to kinematic tree.</text>

      <!-- Property 3 -->
      <circle cx="8" cy="58" r="4" fill="#007A87"/>
      <text x="18" y="62" class="bold-txt" fill="#007A87">Uncertainty Envelope Σ_z:</text>
      <text x="195" y="62" class="body-txt">Weights Kalman innovation; avoids chatter.</text>

      <!-- Rejection Rule -->
      <rect x="4" y="74" width="376" height="20" rx="3" fill="#FEF2F2" stroke="#F87171" stroke-width="0.8"/>
      <text x="192" y="88" font-size="8.5px" font-weight="700" fill="#991B1B" text-anchor="middle">SAFETY RULE: Downstream enforcers reject any packet missing t₀, F_sensor, or Σ_z</text>
    </g>
  </g>

</svg>