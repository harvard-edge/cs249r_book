<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">THREE WORLD MODEL PARADIGMS FOR EMBODIED INTELLIGENCE</text>
<text x="440.0" y="44" class="subtitle">Pixel Video Rollouts vs Latent Space Dynamics (JEPA) vs Structured Geometric State Trees</text>
<rect x="45.0" y="70" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="45.0" y="70" width="250" height="24" rx="8" fill="#DC2626" fill-opacity="0.12"/>
<text x="170.0" y="86" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">PARADIGM 1: GENERATIVE VIDEO</text>
<text x="170.0" y="112" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Pixel-Level Diffusion Rollouts</text>
<text x="57.0" y="140" font-size="8.5" fill="#475569">• Predicts raw RGB video frames x̂_t+k</text>
<text x="57.0" y="164" font-size="8.5" fill="#475569">• High compute (> 500 ms per step)</text>
<text x="57.0" y="188" font-size="8.5" fill="#475569">• Hallucinates physics &amp; phantom obstacles</text>
<text x="57.0" y="212" font-size="8.5" fill="#475569">• Unusable for 1 kHz safety loops</text>
<rect x="315.0" y="70" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="315.0" y="70" width="250" height="24" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="440.0" y="86" font-size="8.5" font-weight="700" fill="#215CAF" text-anchor="middle">PARADIGM 2: LATENT WORLD MODEL</text>
<text x="440.0" y="112" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Joint Embedding Predictive Architecture</text>
<text x="327.0" y="140" font-size="8.5" fill="#475569">• Predicts abstract latent representations ẑ_t+k</text>
<text x="327.0" y="164" font-size="8.5" fill="#475569">• Focuses on predictable dynamics, ignores noise</text>
<text x="327.0" y="188" font-size="8.5" fill="#475569">• Fast feature prediction (15–30 ms)</text>
<text x="327.0" y="212" font-size="8.5" fill="#475569">• Requires spatial decoder for geometric bounds</text>
<rect x="585.0" y="70" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="585.0" y="70" width="250" height="24" rx="8" fill="#10B981" fill-opacity="0.12"/>
<text x="710.0" y="86" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">PARADIGM 3: STRUCTURED GEOMETRY</text>
<text x="710.0" y="112" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Dynamic SE(3) State Estimation</text>
<text x="597.0" y="140" font-size="8.5" fill="#475569">• Predicts metric poses, velocities &amp; covariances</text>
<text x="597.0" y="164" font-size="8.5" fill="#475569">• Deterministic Kalman / Factor Graph update</text>
<text x="597.0" y="188" font-size="8.5" fill="#475569">• Microsecond execution (≤ 100 µs on MCU)</text>
<text x="597.0" y="212" font-size="8.5" fill="#475569">• Directly feeds CBF safety enforcers h(x) ≥ 0</text>
</svg>
