# =============================================================================
# TINYTORCH MONOGRAPH — 1-TO-1 MODULE QUARTO BOOK CONFIGURATION
# =============================================================================

project:
  type: book
  output-dir: _build

book:
  title: "TinyTorch"
  subtitle: "The xv6 of Machine Learning Systems"
  author: "Prof. Vijay Janapa Reddi (Harvard University)"
  date: today
  output-file: TinyTorch-Book
  cover-image: assets/images/cover.png

  chapters:
    - index.qmd
    - preface.qmd
    - 00_welcome.qmd
    - part: "Part I: The Core Engine"
      chapters:
        - 01_tensors.qmd
        - 02_activations.qmd
        - 03_layers.qmd
        - 04_losses.qmd
        - 05_dataloader.qmd
        - 06_autograd.qmd
        - 07_optimizers.qmd
        - 08_training.qmd
        - milestone_01.qmd
    - part: "Part II: Deep Architectures"
      chapters:
        - 09_convolutions.qmd
        - 10_tokenization.qmd
        - 11_embeddings.qmd
        - 12_attention.qmd
        - 13_transformers.qmd
        - milestone_02.qmd
    - part: "Part III: Systems & Acceleration"
      chapters:
        - 14_profiling.qmd
        - 15_quantization.qmd
        - 16_compression.qmd
        - 17_acceleration.qmd
        - 18_memoization.qmd
        - 19_benchmarking.qmd
        - 20_capstone.qmd
        - milestone_03.qmd
    - part: "Part IV: Extensions & Future Frontiers"
      chapters:
        - 21_extensions.qmd

format:
  pdf:
    keep-tex: true
    documentclass: scrbook
    papersize: letter
    pdf-engine: lualatex
    
    mainfont: "texgyrepagella"
    mainfontoptions:
      - "Extension=.otf"
      - "UprightFont=*-regular"
      - "BoldFont=*-bold"
      - "ItalicFont=*-italic"
      - "BoldItalicFont=*-bolditalic"
      - "Ligatures=TeX"
    sansfont: "texgyreheros"
    sansfontoptions:
      - "Extension=.otf"
      - "UprightFont=*-regular"
      - "BoldFont=*-bold"
      - "ItalicFont=*-italic"
      - "BoldItalicFont=*-bolditalic"
    monofont: "texgyrecursor"
    monofontoptions:
      - "Extension=.otf"
      - "UprightFont=*-regular"
      - "BoldFont=*-bold"
      - "ItalicFont=*-italic"
      - "BoldItalicFont=*-bolditalic"
      - "Scale=0.88"
      
    toc: true
    toc-depth: 2
    number-sections: true
    linestretch: 1.12
    colorlinks: true
    linkcolor: crimson
    urlcolor: flameorange
    citecolor: crimson
    
    include-in-header:
      - file: tex/theme-colors.tex
      - file: tex/header-includes.tex
      
    fig-pos: "H"
    fig-align: center
    code-line-numbers: false
    code-block-bg: "#FFF9F4"
    code-block-border-left: "#A51C30"
    highlight-style: tango

execute:
  enabled: false

filters:
  - ../../packages/tinytorch/quarto/pdf/strip-emojis.lua
  - ../../packages/tinytorch/quarto/tools/diagrams/svg-to-pdf.lua
