name = "socratiq-api"
main = "worker.mjs"
compatibility_date = "2026-04-08"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "mlsysbook.ai/api/socratiq/*", zone_name = "mlsysbook.ai" },
]

[vars]
# Set false and redeploy to disable chat without removing the public route.
ENABLED = "true"
ALLOWED_ORIGINS = "https://mlsysbook.ai"

[[ratelimits]]
name = "AI_RATE_LIMITER"
# Reserved for SocratiQ production; keep staging/local counters separate.
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[observability]
enabled = false
