name = "socratiq-proxy"
main = "worker.mjs"
compatibility_date = "2026-04-08"
workers_dev = false
preview_urls = false

[vars]
# Fail closed until an operator configures origins, credentials, quota, and routing.
ENABLED = "false"
ALLOWED_ORIGINS = ""

[[ratelimits]]
name = "AI_RATE_LIMITER"
# Choose a namespace unique within the target account before deployment.
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = false
