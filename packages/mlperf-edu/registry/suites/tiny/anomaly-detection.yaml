id: anomaly-detection
model: mlperf-tiny-toycar-autoencoder
params: 265.86K
dataset: mlperf-tiny-anomaly-eval
dataset_source: Pinned MLPerf Tiny 248-recording accuracy set selected from the ToyADMOS ToyCar development archive
task: machine-sound-anomaly-detection
modes:
- inference
implemented_modes:
- inference
quality_target:
  metric: roc_auc
  value: 0.85
  direction: higher
  target_basis: mlcommons_derived
  target_kind: inherited_acceptance_gate
  tolerance: 0.0
  reference_runs: 0
  acceptance_runs: 1
  reviewer_notes:
  - The 0.85 ROC AUC threshold, ToyCar task, 248-recording index, feature recipe, and autoencoder are inherited from MLPerf Tiny.
  - The exact PyTorch adapter reproduces the official restricted-set float TFLite AUC at 0.9029100529100529.
  - Promotion still requires committed repeated timing evidence on the reference platform.
measurement_protocol:
  primary_metric: inference_seconds
  scenario: offline
  timing_scope: 10 repetitions of all 48,608 sliding-window autoencoder inferences after model, data, and one complete-set warmup are ready
  included_phases:
  - batched PyTorch autoencoder execution
  excluded_phases:
  - selective source-recording fetch and librosa feature extraction
  - TFLite weight parsing and PyTorch model construction
  - binary feature loading and sliding-window view construction
  - one shape warmup and one untimed complete accuracy-set pass
  - per-recording reconstruction-score aggregation and ROC AUC computation
  - report and provenance serialization
  device_synchronization: synchronize immediately before and after the measured inference region
  outer_reference_runs: 1
  outer_preconditioning_runs: 0
  outer_inter_execution_cooldown_seconds: 5
  repeatability_metric: inference_seconds
  repeatability_limit: 0.05
