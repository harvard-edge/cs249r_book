<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <filter id="subCardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3A5F" flood-opacity="0.05"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8246" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="backBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F5" />
      <stop offset="100%" stop-color="#FEEDEC" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E6F7E" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D22341" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="15" width="810" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="20" y="15" width="810" height="45" rx="10" fill="url(#torchGrad)"/>
  <rect x="20" y="45" width="810" height="15" fill="url(#torchGrad)"/>
  <text x="38" y="42" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.4">DYNAMIC AUTOGRAD ENGINE: TAPE RECORDING &amp; REVERSE-MODE ACCUMULATION</text>
  <rect x="685" y="27" width="130" height="22" rx="11" fill="#FF8246"/>
  <text x="750" y="42" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">TAPE DAG ENGINE</text>

  <!-- Left Card: Forward Tape Recording -->
  <g transform="translate(36, 72)">
    <rect x="0" y="0" width="360" height="278" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="360" height="10" fill="#1B3A5F"/>
    <text x="15" y="20" fill="#FFFFFF" font-size="11" font-weight="700">1. Forward Pass (Dynamic Graph Recording)</text>

    <!-- Inputs row -->
    <g transform="translate(12, 38)">
      <!-- Input x -->
      <rect x="0" y="0" width="65" height="36" rx="4" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2"/>
      <text x="32" y="16" fill="#2E6F7E" font-size="9.5" font-weight="700" text-anchor="middle">Input x</text>
      <text x="32" y="28" fill="#64748B" font-size="7.5" text-anchor="middle">req_grad=T</text>

      <!-- Weight W -->
      <rect x="75" y="0" width="68" height="36" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <text x="109" y="16" fill="#FF8246" font-size="9.5" font-weight="700" text-anchor="middle">Weight W</text>
      <text x="109" y="28" fill="#64748B" font-size="7.5" text-anchor="middle">p.data, p.grad</text>

      <!-- Bias b -->
      <rect x="152" y="0" width="55" height="36" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <text x="179" y="16" fill="#FF8246" font-size="9.5" font-weight="700" text-anchor="middle">Bias b</text>
      <text x="179" y="28" fill="#64748B" font-size="7.5" text-anchor="middle">[D_out]</text>

      <!-- Forward arrows from inputs -->
      <path d="M32 36 L70 54" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <path d="M109 36 L109 52" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <path d="M179 36 L140 54" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
    </g>

    <!-- Operation 1: Linear / MatMul + Bias -->
    <g transform="translate(12, 96)">
      <rect x="0" y="0" width="336" height="44" rx="5" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
      <rect x="5" y="7" width="80" height="30" rx="3" fill="#1B3A5F"/>
      <text x="45" y="21" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Linear Op</text>
      <text x="45" y="31" fill="#FF8246" font-size="7.5" text-anchor="middle">z = x @ W.T + b</text>
      
      <text x="92" y="19" fill="#1E293B" font-size="8.5" font-weight="600">Output: Tensor z</text>
      <text x="92" y="31" fill="#64748B" font-size="7.5">grad_fn = &lt;LinearBackward&gt;</text>
      <text x="235" y="25" fill="#2E6F7E" font-size="8" font-weight="600">ctx.save(x, W, b)</text>
    </g>

    <!-- Arrow Op1 -> Op2 -->
    <path d="M180 140 L180 150" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

    <!-- Operation 2: Activation (ReLU / GELU) -->
    <g transform="translate(12, 152)">
      <rect x="0" y="0" width="336" height="44" rx="5" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
      <rect x="5" y="7" width="80" height="30" rx="3" fill="#1B3A5F"/>
      <text x="45" y="21" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">ReLU / GELU</text>
      <text x="45" y="31" fill="#FF8246" font-size="7.5" text-anchor="middle">a = max(0, z)</text>

      <text x="92" y="19" fill="#1E293B" font-size="8.5" font-weight="600">Output: Activation a</text>
      <text x="92" y="31" fill="#64748B" font-size="7.5">grad_fn = &lt;ReLUBackward&gt;</text>
      <text x="235" y="25" fill="#2E6F7E" font-size="8" font-weight="600">ctx.save(z)</text>
    </g>

    <!-- Arrow Op2 -> Op3 -->
    <path d="M180 196 L180 206" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

    <!-- Operation 3: Criterion / Loss -->
    <g transform="translate(12, 208)">
      <rect x="0" y="0" width="336" height="56" rx="5" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <rect x="5" y="9" width="80" height="38" rx="3" fill="#FF8246"/>
      <text x="45" y="24" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">MSE / CE Loss</text>
      <text x="45" y="36" fill="#FFFFFF" font-size="7.5" text-anchor="middle">L = Mean((a - y)²)</text>

      <text x="92" y="22" fill="#1E293B" font-size="8.5" font-weight="700">Scalar Loss Tensor: L</text>
      <text x="92" y="35" fill="#64748B" font-size="7.5">grad_fn = &lt;MseLossBackward&gt;</text>
      <text x="92" y="47" fill="#D22341" font-size="7.5" font-weight="600">Root of Backward Graph DAG</text>
    </g>
  </g>

  <!-- Central Trigger Badge -->
  <g transform="translate(398, 160)">
    <rect x="0" y="0" width="54" height="95" rx="6" fill="#FFFFFF" stroke="#D22341" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <text x="27" y="16" fill="#D22341" font-size="8" font-weight="700" text-anchor="middle">TRIGGER</text>
    <path d="M27 25 L27 62" stroke="#D22341" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="27" y="75" fill="#1E293B" font-size="7.5" font-weight="700" text-anchor="middle">.backward()</text>
    <text x="27" y="87" fill="#64748B" font-size="7" font-weight="600" text-anchor="middle">Seed 1.0</text>
  </g>

  <!-- Right Card: Backward Pass Topological Propagation -->
  <g transform="translate(454, 72)">
    <rect x="0" y="0" width="360" height="278" rx="8" fill="url(#backBgGrad)" stroke="#FF8246" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#D22341"/>
    <rect x="0" y="20" width="360" height="10" fill="#D22341"/>
    <text x="15" y="20" fill="#FFFFFF" font-size="11" font-weight="700">2. Backward Pass (Topological Chain Rule)</text>

    <!-- Backward Step 1: Loss Backward -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="336" height="44" rx="5" fill="#FFFFFF" stroke="#D22341" stroke-width="1.2"/>
      <rect x="5" y="7" width="85" height="30" rx="3" fill="#D22341"/>
      <text x="47" y="21" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">&lt;LossBackward&gt;</text>
      <text x="47" y="31" fill="#FFFFFF" font-size="7.5" text-anchor="middle">Seed grad = 1.0</text>

      <text x="96" y="20" fill="#1E293B" font-size="8.5" font-weight="600">Output Grad: δ_a = dL/da</text>
      <text x="96" y="32" fill="#475569" font-size="7.5">dL/da = (2 / N) · (a - target)</text>
    </g>

    <!-- Arrow BStep1 -> BStep2 -->
    <path d="M180 82 L180 92" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Backward Step 2: Activation Backward -->
    <g transform="translate(12, 94)">
      <rect x="0" y="0" width="336" height="44" rx="5" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <rect x="5" y="7" width="85" height="30" rx="3" fill="#FF8246"/>
      <text x="47" y="21" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">&lt;ReLUBackward&gt;</text>
      <text x="47" y="31" fill="#FFFFFF" font-size="7.5" text-anchor="middle">Chain Rule: δ_z</text>

      <text x="96" y="20" fill="#1E293B" font-size="8.5" font-weight="600">Grad: δ_z = dL/dz = δ_a ⊙ (z &gt; 0)</text>
      <text x="96" y="32" fill="#475569" font-size="7.5">Saved tensor z restored from ctx</text>
    </g>

    <!-- Arrow BStep2 -> BStep3 -->
    <path d="M180 138 L180 148" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Backward Step 3: Linear Backward -->
    <g transform="translate(12, 150)">
      <rect x="0" y="0" width="336" height="54" rx="5" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
      <rect x="5" y="8" width="85" height="38" rx="3" fill="#1B3A5F"/>
      <text x="47" y="22" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">&lt;LinearBackward&gt;</text>
      <text x="47" y="34" fill="#FF8246" font-size="7.5" text-anchor="middle">dL/dW, dL/db</text>

      <text x="96" y="19" fill="#1E293B" font-size="8.5" font-weight="600">dL/dW = δ_z^T @ x | dL/db = Σ δ_z</text>
      <text x="96" y="32" fill="#10B981" font-size="8" font-weight="700">In-Place Accumulation:</text>
      <text x="96" y="45" fill="#2E6F7E" font-size="7.5">W.grad += dL/dW | b.grad += dL/db</text>
    </g>

    <!-- Result Parameter Leaves -->
    <g transform="translate(12, 212)">
      <rect x="0" y="0" width="104" height="52" rx="4" fill="#1B3A5F"/>
      <text x="52" y="18" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">W.grad Populated</text>
      <text x="52" y="32" fill="#FFFFFF" font-size="7.5" text-anchor="middle">accumulated tensor</text>
      <text x="52" y="44" fill="#10B981" font-size="7.5" font-weight="600" text-anchor="middle">Ready for step()</text>

      <rect x="114" y="0" width="104" height="52" rx="4" fill="#1B3A5F"/>
      <text x="166" y="18" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">b.grad Populated</text>
      <text x="166" y="32" fill="#FFFFFF" font-size="7.5" text-anchor="middle">bias gradient</text>
      <text x="166" y="44" fill="#10B981" font-size="7.5" font-weight="600" text-anchor="middle">Ready for step()</text>

      <rect x="228" y="0" width="108" height="52" rx="4" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2"/>
      <text x="282" y="18" fill="#2E6F7E" font-size="8.5" font-weight="700" text-anchor="middle">x.grad Computed</text>
      <text x="282" y="32" fill="#1E293B" font-size="7.5" text-anchor="middle">dL/dx = δ_z @ W</text>
      <text x="282" y="44" fill="#64748B" font-size="7.5" text-anchor="middle">Propagates to input</text>
    </g>
  </g>

  <!-- Bottom Systems Invariant Callout -->
  <g transform="translate(36, 360)">
    <rect x="0" y="0" width="778" height="62" rx="6" fill="#1B3A5F" stroke="#2E6F7E" stroke-width="1"/>
    <text x="20" y="24" fill="#FF8246" font-size="11.5" font-weight="700">⚡ Systems Invariant: Dynamic Tape Lifecycle &amp; In-Place Gradient Accumulation</text>
    <text x="20" y="42" fill="#FFFFFF" font-size="10">Forward operations dynamically register child-parent grad_fn edges and save activation context; backward evaluation executes a reverse</text>
    <text x="20" y="54" fill="#CBD5E1" font-size="9.5">topological DAG traversal with in-place accumulation (param.grad += grad) before releasing ephemeral graph tape memory.</text>
  </g>
</svg>