<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Navy Header Banner -->
  <rect x="15" y="15" width="820" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="15" y="45" width="820" height="20" fill="url(#headerGrad)"/>
  <text x="35" y="46" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">PRE-LN TRANSFORMER BLOCK &amp; LANGUAGE MODEL HEAD</text>
  <rect x="670" y="27" width="145" height="24" rx="12" fill="#FF8246"/>
  <text x="742" y="43" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">GPT-2 ARCHITECTURE</text>

  <!-- Panel 1: Pre-LN Residual Block (Left) -->
  <rect x="30" y="78" width="260" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="78" width="260" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="30" y="96" width="260" height="10" fill="#1B3A5F"/>
  <text x="42" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Pre-LN TransformerBlock</text>

  <!-- Block Visual Diagram -->
  <g transform="translate(42, 114)">
    <!-- Input Token Box -->
    <rect x="50" y="0" width="140" height="22" rx="3" fill="#1B3A5F"/>
    <text x="120" y="15" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">x₀ = Embed(t) + Pos(p)</text>

    <!-- Residual Highway 1 (Orange dashed arc) -->
    <path d="M50 11 C20 11 20 95 62 95" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="14" y="58" fill="#FF5722" font-size="7.5" font-weight="700">Residual 1</text>

    <!-- Sublayer 1: LN -> MHA -->
    <path d="M120 22 V36" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
    
    <rect x="70" y="36" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#1B3A5F"/>
    <text x="120" y="50" fill="#1B3A5F" font-size="8.5" font-weight="600" text-anchor="middle">LayerNorm 1</text>

    <path d="M120 56 V68" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

    <rect x="65" y="68" width="110" height="22" rx="3" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.2"/>
    <text x="120" y="83" fill="#FF5722" font-size="8.5" font-weight="700" text-anchor="middle">Causal Self-Attention</text>

    <!-- Add Circle 1 -->
    <path d="M120 90 V102" stroke="#FF8246" stroke-width="1.5"/>
    <circle cx="120" cy="112" r="10" fill="#1B3A5F"/>
    <text x="120" y="116" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">+</text>
    <path d="M62 95 C90 95 105 105 110 112" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>

    <!-- Residual Highway 2 (Orange dashed arc) -->
    <path d="M50 112 C20 112 20 190 62 190" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="14" y="155" fill="#FF5722" font-size="7.5" font-weight="700">Residual 2</text>

    <!-- Sublayer 2: LN -> MLP -->
    <path d="M120 122 V134" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

    <rect x="70" y="134" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#1B3A5F"/>
    <text x="120" y="148" fill="#1B3A5F" font-size="8.5" font-weight="600" text-anchor="middle">LayerNorm 2</text>

    <path d="M120 154 V166" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

    <rect x="65" y="166" width="110" height="22" rx="3" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="120" y="181" fill="#00695C" font-size="8.5" font-weight="700" text-anchor="middle">MLP (4x Expansion)</text>

    <!-- Add Circle 2 -->
    <path d="M120 188 V198" stroke="#2E6F7E" stroke-width="1.5"/>
    <circle cx="120" cy="208" r="10" fill="#1B3A5F"/>
    <text x="120" y="212" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">+</text>
    <path d="M62 190 C90 190 105 200 110 208" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>

    <!-- Block Output -->
    <path d="M120 218 V228" stroke="#FF8246" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
    <rect x="55" y="228" width="130" height="18" rx="3" fill="#1B3A5F"/>
    <text x="120" y="240" fill="#FF8246" font-size="8" font-weight="700" text-anchor="middle">x_out [Batch, Time, d_model]</text>
  </g>

  <!-- Panel 2: MLP 4x Expansion & GELU (Center) -->
  <rect x="305" y="78" width="250" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="305" y="78" width="250" height="28" rx="8" fill="#2E6F7E"/>
  <rect x="305" y="96" width="250" height="10" fill="#2E6F7E"/>
  <text x="317" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">2. MLP 4x Expansion &amp; GELU</text>

  <!-- Connect Arrow Left to Center -->
  <path d="M291 175 H303" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- MLP Expansion Architecture -->
  <g transform="translate(315, 114)">
    <!-- Step 1: Linear d -> 4d -->
    <rect x="0" y="0" width="230" height="24" rx="3" fill="#1B3A5F"/>
    <text x="115" y="16" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Linear 1: d_model → 4·d_model (768 → 3072)</text>

    <path d="M115 24 V34" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Step 2: GELU Activation -->
    <rect x="0" y="34" width="230" height="34" rx="3" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.2"/>
    <text x="115" y="48" fill="#D22341" font-size="8.5" font-weight="700" text-anchor="middle">GELU Non-Linearity</text>
    <text x="115" y="61" fill="#FF5722" font-size="7.5" text-anchor="middle">GELU(x) = x · Φ(x) ≈ 0.5x(1 + tanh(...))</text>

    <path d="M115 68 V78" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Step 3: Linear 4d -> d -->
    <rect x="0" y="78" width="230" height="24" rx="3" fill="#1B3A5F"/>
    <text x="115" y="94" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Linear 2: 4·d_model → d_model (3072 → 768)</text>

    <path d="M115 102 V112" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Step 4: Dropout -->
    <rect x="0" y="112" width="230" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="115" y="126" fill="#475569" font-size="8" text-anchor="middle">Dropout (p = 0.1)</text>
  </g>

  <!-- Pre-LN vs Post-LN Comparison Card -->
  <rect x="315" y="258" width="230" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="323" y="274" fill="#00695C" font-size="9.5" font-weight="700">✓  Pre-LN Gradient Highway:</text>
  <text x="323" y="289" fill="#475569" font-size="8">• LayerNorm inside branch, NOT on highway</text>
  <text x="323" y="303" fill="#475569" font-size="8">• Gradients flow O(1) across 100+ deep blocks</text>
  <text x="323" y="317" fill="#D22341" font-size="8">• Post-LN: O(1/L) decay requires delicate warmup</text>
  <text x="323" y="333" fill="#00695C" font-size="8.5" font-weight="600">→ Stable Zero-Warmup Training</text>

  <!-- Panel 3: Full LM Stack & Logits (Right) -->
  <rect x="570" y="78" width="250" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="570" y="78" width="250" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="570" y="96" width="250" height="10" fill="#1B3A5F"/>
  <text x="582" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Full LM Stack &amp; Logits</text>

  <!-- Connect Arrow Center to Right -->
  <path d="M556 175 H568" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Full Model Assembly Pipeline -->
  <g transform="translate(580, 114)">
    <!-- Stack of L blocks -->
    <rect x="0" y="0" width="230" height="42" rx="4" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="115" y="16" fill="#00695C" font-size="8.5" font-weight="700" text-anchor="middle">TransformerBlock × L Layers</text>
    <text x="115" y="30" fill="#00695C" font-size="8" text-anchor="middle">(L = 12 for GPT-2 Small, 117M params)</text>

    <path d="M115 42 V52" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Final LayerNorm -->
    <rect x="0" y="52" width="230" height="24" rx="3" fill="#FFFFFF" stroke="#1B3A5F"/>
    <text x="115" y="68" fill="#1B3A5F" font-size="8.5" font-weight="700" text-anchor="middle">Final LayerNorm (ln_f)</text>

    <path d="M115 76 V86" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- LM Head Projection -->
    <rect x="0" y="86" width="230" height="28" rx="3" fill="#1B3A5F"/>
    <text x="115" y="100" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">LM Head: W_head [d_model, V]</text>
    <text x="115" y="110" fill="#FF8246" font-size="7.5" text-anchor="middle">Weight-tied with W_embed</text>

    <path d="M115 114 V124" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Output Logits -->
    <rect x="0" y="124" width="230" height="26" rx="3" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.2"/>
    <text x="115" y="141" fill="#D22341" font-size="8.5" font-weight="700" text-anchor="middle">Output Logits Z [B, T, V=50257]</text>
  </g>

  <!-- Loss & Generation Callout -->
  <rect x="580" y="274" width="230" height="72" rx="6" fill="#1B3A5F"/>
  <text x="590" y="291" fill="#FF8246" font-size="9.5" font-weight="700">⚡ Training vs Inference Dual Mode</text>
  <text x="590" y="306" fill="#FFFFFF" font-size="8.5">• Train: CrossEntropy(Z, Targets) via teacher forcing</text>
  <text x="590" y="320" fill="#CBD5E1" font-size="8.5">• Inference: Slice Z[:, -1, :] for next-token sampling</text>
  <text x="590" y="334" fill="#38BDF8" font-size="8.5" font-weight="600">• Fully modular, end-to-end differentiable</text>

  <!-- Bottom Systems Invariant Callout Banner -->
  <rect x="30" y="368" width="790" height="54" rx="8" fill="#1B3A5F"/>
  <text x="45" y="388" fill="#FF8246" font-size="11" font-weight="700">⚡ Pre-LN Gradient Highway Invariant: ∂L/∂x_0 = ∂L/∂x_L + ∑ (∂L/∂SubLayer_l)</text>
  <text x="45" y="406" fill="#F8FAFC" font-size="9.5">Pre-LayerNorm establishes an unhindered identity highway through L layers, eliminating vanishing gradients</text>
  <text x="45" y="418" fill="#CBD5E1" font-size="9.5">and enabling stable deep transformer training without delicate warmup hyperparameter schedules.</text>

</svg>
