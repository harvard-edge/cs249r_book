<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <filter id="subCardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3A5F" flood-opacity="0.05"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="mlpBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D22341" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="15" width="810" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="20" y="15" width="810" height="45" rx="10" fill="url(#torchGrad)"/>
  <rect x="20" y="45" width="810" height="15" fill="url(#torchGrad)"/>
  <text x="38" y="42" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.4">MILESTONE 1: THE HISTORIC XOR CRISIS &amp; MANIFOLD TRANSFORMATION</text>
  <rect x="665" y="27" width="150" height="22" rx="11" fill="#FF8246"/>
  <text x="740" y="42" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">1958 PERCEPTRON VS 1986 MLP</text>

  <!-- Left Card: Single-Layer Perceptron Failure (1969 Minsky & Papert) -->
  <g transform="translate(36, 72)">
    <rect x="0" y="0" width="360" height="278" rx="8" fill="url(#warmBgGrad)" stroke="#D22341" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="360" height="10" fill="#1B3A5F"/>
    <text x="180" y="20" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">1. Input Space (x1, x2): Single-Layer Perceptron Failure</text>

    <!-- 2D Coordinate Grid -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="185" height="135" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      
      <!-- Coordinate Axes -->
      <line x1="25" y1="112" x2="170" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <line x1="25" y1="112" x2="25" y2="12" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <text x="172" y="116" fill="#1B3A5F" font-size="8.5" font-weight="700">x1</text>
      <text x="14" y="14" fill="#1B3A5F" font-size="8.5" font-weight="700">x2</text>

      <!-- Tick Labels -->
      <text x="55" y="124" fill="#64748B" font-size="7.5" text-anchor="middle">0</text>
      <text x="135" y="124" fill="#64748B" font-size="7.5" text-anchor="middle">1</text>
      <text x="16" y="98" fill="#64748B" font-size="7.5" text-anchor="middle">0</text>
      <text x="16" y="42" fill="#64748B" font-size="7.5" text-anchor="middle">1</text>

      <!-- Grid dashed lines -->
      <line x1="135" y1="112" x2="135" y2="38" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="25" y1="38" x2="135" y2="38" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Attempted Linear Hyperplane (Failing Line) -->
      <line x1="20" y1="80" x2="160" y2="50" stroke="#D22341" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="145" y="68" fill="#D22341" font-size="7" font-weight="700">w^T x + b = 0</text>

      <!-- XOR Data Points -->
      <!-- (0,0) -> 0 : Navy Ring -->
      <circle cx="55" cy="96" r="6" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="2.5"/>
      <text x="55" y="108" fill="#1B3A5F" font-size="6.5" font-weight="700" text-anchor="middle">(0,0)=0</text>

      <!-- (1,1) -> 0 : Navy Ring -->
      <circle cx="135" cy="38" r="6" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="2.5"/>
      <text x="135" y="28" fill="#1B3A5F" font-size="6.5" font-weight="700" text-anchor="middle">(1,1)=0</text>

      <!-- (0,1) -> 1 : Flame Filled Circle -->
      <circle cx="55" cy="38" r="6" fill="#FF8246" stroke="#FF5722" stroke-width="1.5"/>
      <text x="55" y="28" fill="#FF5722" font-size="6.5" font-weight="700" text-anchor="middle">(0,1)=1</text>

      <!-- (1,0) -> 1 : Flame Filled Circle -->
      <circle cx="135" cy="96" r="6" fill="#FF8246" stroke="#FF5722" stroke-width="1.5"/>
      <text x="135" y="108" fill="#FF5722" font-size="6.5" font-weight="700" text-anchor="middle">(1,0)=1</text>
    </g>

    <!-- Right Side Perceptron Diagram inside Card 1 -->
    <g transform="translate(215, 42)">
      <rect x="0" y="0" width="130" height="135" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="65" y="16" fill="#1B3A5F" font-size="8.5" font-weight="700" text-anchor="middle">1958 Perceptron</text>
      
      <!-- Neurons -->
      <circle cx="25" cy="45" r="10" fill="#1B3A5F"/>
      <text x="25" y="48" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">x1</text>
      
      <circle cx="25" cy="90" r="10" fill="#1B3A5F"/>
      <text x="25" y="93" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">x2</text>

      <circle cx="98" cy="68" r="14" fill="#D22341"/>
      <text x="98" y="71" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Step</text>

      <!-- Synapses -->
      <line x1="35" y1="45" x2="84" y2="64" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <line x1="35" y1="90" x2="84" y2="72" stroke="#1B3A5F" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <text x="58" y="50" fill="#64748B" font-size="7">w1</text>
      <text x="58" y="88" fill="#64748B" font-size="7">w2</text>

      <text x="65" y="122" fill="#D22341" font-size="7.5" font-weight="700" text-anchor="middle">Linear Boundary Only</text>
    </g>

    <!-- Bottom Failure Banner -->
    <g transform="translate(15, 190)">
      <rect x="0" y="0" width="330" height="75" rx="5" fill="#1B3A5F"/>
      <text x="12" y="18" fill="#FF8246" font-size="8.5" font-weight="700">⚡ The 1969 XOR Wall (Minsky &amp; Papert)</text>
      <text x="12" y="33" fill="#FFFFFF" font-size="7.5">• A single linear hyperplane cannot separate opposite diagonals</text>
      <text x="12" y="46" fill="#FFFFFF" font-size="7.5">• Maximum accuracy: 75% (1 of 4 logical states always fails)</text>
      <text x="12" y="60" fill="#EF4444" font-size="7.5" font-weight="600">• Caused the historic 17-year First AI Winter (1969–1986)</text>
    </g>
  </g>

  <!-- Central Manifold Warping Connector -->
  <g transform="translate(398, 155)">
    <rect x="0" y="0" width="54" height="95" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <text x="27" y="16" fill="#059669" font-size="8" font-weight="700" text-anchor="middle">WARP</text>
    <path d="M12 45 L42 45" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="27" y="65" fill="#1B3A5F" font-size="7" font-weight="700" text-anchor="middle">h = σ(Wx+b)</text>
    <text x="27" y="82" fill="#64748B" font-size="6.5" font-weight="600" text-anchor="middle">Non-Linear</text>
  </g>

  <!-- Right Card: Two-Layer MLP Solution (1986 Rumelhart et al.) -->
  <g transform="translate(454, 72)">
    <rect x="0" y="0" width="360" height="278" rx="8" fill="url(#mlpBgGrad)" stroke="#10B981" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#10B981"/>
    <rect x="0" y="20" width="360" height="10" fill="#10B981"/>
    <text x="180" y="20" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">2. Hidden Space (h1, h2): Two-Layer MLP Solution</text>

    <!-- 2D Coordinate Grid in Hidden Space -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="185" height="135" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      
      <!-- Coordinate Axes -->
      <line x1="25" y1="112" x2="170" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <line x1="25" y1="112" x2="25" y2="12" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
      <text x="172" y="116" fill="#1B3A5F" font-size="8.5" font-weight="700">h1</text>
      <text x="14" y="14" fill="#1B3A5F" font-size="8.5" font-weight="700">h2</text>

      <!-- Tick Labels -->
      <text x="55" y="124" fill="#64748B" font-size="7.5" text-anchor="middle">0</text>
      <text x="135" y="124" fill="#64748B" font-size="7.5" text-anchor="middle">1</text>
      <text x="16" y="98" fill="#64748B" font-size="7.5" text-anchor="middle">0</text>
      <text x="16" y="42" fill="#64748B" font-size="7.5" text-anchor="middle">1</text>

      <!-- Successful Linear Hyperplane separating Class 0 from Class 1 -->
      <line x1="20" y1="45" x2="110" y2="115" stroke="#10B981" stroke-width="2.5"/>
      <text x="110" y="65" fill="#059669" font-size="7.5" font-weight="700">w2^T h + b2 = 0</text>

      <!-- Transformed XOR Data Points in Hidden Space -->
      <!-- (0,0) and (1,1) both map to near (0,0) -> Class 0 cluster! -->
      <circle cx="55" cy="96" r="6" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="2.5"/>
      <text x="55" y="108" fill="#1B3A5F" font-size="6.5" font-weight="700" text-anchor="middle">(0,0) &amp; (1,1)=0</text>

      <!-- (0,1) -> (0, 1) in hidden space -->
      <circle cx="55" cy="38" r="6" fill="#FF8246" stroke="#FF5722" stroke-width="1.5"/>
      <text x="55" y="28" fill="#FF5722" font-size="6.5" font-weight="700" text-anchor="middle">(0,1)=1</text>

      <!-- (1,0) -> (1, 0) in hidden space -->
      <circle cx="135" cy="96" r="6" fill="#FF8246" stroke="#FF5722" stroke-width="1.5"/>
      <text x="135" y="108" fill="#FF5722" font-size="6.5" font-weight="700" text-anchor="middle">(1,0)=1</text>
    </g>

    <!-- Right Side 2-Layer MLP Architecture -->
    <g transform="translate(215, 42)">
      <rect x="0" y="0" width="130" height="135" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="65" y="16" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">1986 2-Layer MLP</text>
      
      <!-- Input layer -->
      <circle cx="20" cy="45" r="8" fill="#1B3A5F"/>
      <text x="20" y="48" fill="#FFFFFF" font-size="7" font-weight="700" text-anchor="middle">x1</text>
      
      <circle cx="20" cy="90" r="8" fill="#1B3A5F"/>
      <text x="20" y="93" fill="#FFFFFF" font-size="7" font-weight="700" text-anchor="middle">x2</text>

      <!-- Hidden layer (with non-linearity) -->
      <circle cx="65" cy="45" r="10" fill="#FF8246"/>
      <text x="65" y="48" fill="#FFFFFF" font-size="7.5" font-weight="700" text-anchor="middle">h1:σ</text>
      
      <circle cx="65" cy="90" r="10" fill="#FF8246"/>
      <text x="65" y="93" fill="#FFFFFF" font-size="7.5" font-weight="700" text-anchor="middle">h2:σ</text>

      <!-- Output layer -->
      <circle cx="108" cy="68" r="11" fill="#10B981"/>
      <text x="108" y="71" fill="#FFFFFF" font-size="7.5" font-weight="700" text-anchor="middle">y:σ</text>

      <!-- Synapse lines -->
      <line x1="28" y1="45" x2="55" y2="45" stroke="#1B3A5F" stroke-width="1"/>
      <line x1="28" y1="45" x2="55" y2="90" stroke="#1B3A5F" stroke-width="1"/>
      <line x1="28" y1="90" x2="55" y2="45" stroke="#1B3A5F" stroke-width="1"/>
      <line x1="28" y1="90" x2="55" y2="90" stroke="#1B3A5F" stroke-width="1"/>

      <line x1="75" y1="45" x2="97" y2="65" stroke="#FF8246" stroke-width="1.2"/>
      <line x1="75" y1="90" x2="97" y2="71" stroke="#FF8246" stroke-width="1.2"/>

      <text x="65" y="122" fill="#059669" font-size="7.5" font-weight="700" text-anchor="middle">Linearly Separable!</text>
    </g>

    <!-- Bottom Success Banner -->
    <g transform="translate(15, 190)">
      <rect x="0" y="0" width="330" height="75" rx="5" fill="#1B3A5F"/>
      <text x="12" y="18" fill="#10B981" font-size="8.5" font-weight="700">⚡ The 1986 Breakthrough (Rumelhart et al.)</text>
      <text x="12" y="33" fill="#FFFFFF" font-size="7.5">• Hidden non-linear activations (σ) warp and bend coordinate space</text>
      <text x="12" y="46" fill="#FFFFFF" font-size="7.5">• Collapses Class 0 points, making XOR 100% linearly separable</text>
      <text x="12" y="60" fill="#10B981" font-size="7.5" font-weight="600">• Backpropagation unlocks the modern Deep Learning Spring</text>
    </g>
  </g>

  <!-- Bottom Systems Invariant Callout -->
  <g transform="translate(36, 360)">
    <rect x="0" y="0" width="778" height="62" rx="6" fill="#1B3A5F" stroke="#2E6F7E" stroke-width="1"/>
    <text x="20" y="24" fill="#FF8246" font-size="11.5" font-weight="700">⚡ Foundational Invariant: Non-Linear Coordinate Warping &amp; Universal Approximation</text>
    <text x="20" y="42" fill="#FFFFFF" font-size="10">A single linear layer is strictly constrained to flat Euclidean hyperplanes; interleaving non-linear activations (σ) warps input coordinate</text>
    <text x="20" y="54" fill="#CBD5E1" font-size="9.5">manifolds, projecting non-linearly separable problems into higher-order representations where linear separation is provably achievable.</text>
  </g>
</svg>