<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">THE 16× CUMULATIVE ACCELERATION STACK: COMPOUNDING SPEEDUPS</text>
  <rect x="660" y="24" width="155" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="737" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">16.38× TOTAL LEAP</text>

  <!-- Left Panel: Speedup Waterfall Stack -->
  <rect x="35" y="72" width="490" height="295" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="50" y="94" fill="#1B3A5F" font-size="12" font-weight="700">Compounding Multiplier Waterfall (Decode Latency ms/token):</text>

  <!-- Stage Rows -->
  <!-- Stage 0 -->
  <g transform="translate(50, 108)">
    <rect x="0" y="0" width="460" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="12" y="21" fill="#1B3A5F" font-size="10.5" font-weight="700">Stage 0: Baseline TinyGPT (FP32)</text>
    <rect x="220" y="7" width="115" height="20" rx="3" fill="#D22341"/>
    <text x="277" y="21" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">100.0 ms</text>
    <rect x="345" y="7" width="105" height="20" rx="3" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="397" y="21" fill="#64748B" font-size="9" font-weight="700" text-anchor="middle">1.0× Baseline</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(50, 148)">
    <rect x="0" y="0" width="460" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="12" y="21" fill="#1B3A5F" font-size="10.5" font-weight="700">Stage 1: + INT8 Quantization</text>
    <rect x="220" y="7" width="58" height="20" rx="3" fill="#2E6F7E"/>
    <text x="249" y="21" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">50.0 ms</text>
    <rect x="345" y="7" width="105" height="20" rx="3" fill="#E6F4F6" stroke="#2E6F7E"/>
    <text x="397" y="21" fill="#2E6F7E" font-size="9" font-weight="700" text-anchor="middle">2.0× Multiplier</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(50, 188)">
    <rect x="0" y="0" width="460" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="12" y="21" fill="#1B3A5F" font-size="10.5" font-weight="700">Stage 2: + Structured SVD Pruning</text>
    <rect x="220" y="7" width="40" height="20" rx="3" fill="#10B981"/>
    <text x="240" y="21" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">33.3 ms</text>
    <rect x="345" y="7" width="105" height="20" rx="3" fill="#ECFDF5" stroke="#10B981"/>
    <text x="397" y="21" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">3.0× Multiplier</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(50, 228)">
    <rect x="0" y="0" width="460" height="34" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="12" y="21" fill="#1B3A5F" font-size="10.5" font-weight="700">Stage 3: + Fused Kernels &amp; Tiling</text>
    <rect x="220" y="7" width="32" height="20" rx="3" fill="#FF8246"/>
    <text x="260" y="21" fill="#FF8246" font-size="9" font-weight="700">25.6 ms</text>
    <rect x="345" y="7" width="105" height="20" rx="3" fill="#FFF8F0" stroke="#FF8246"/>
    <text x="397" y="21" fill="#FF8246" font-size="9" font-weight="700" text-anchor="middle">3.9× Multiplier</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(50, 268)">
    <rect x="0" y="0" width="460" height="34" rx="4" fill="#FFF0E6" stroke="#FF5722"/>
    <text x="12" y="21" fill="#1B3A5F" font-size="10.5" font-weight="700">Stage 4: + KV Cache Engine</text>
    <rect x="220" y="7" width="16" height="20" rx="2" fill="#FF5722"/>
    <text x="245" y="21" fill="#D22341" font-size="9" font-weight="700">6.1 ms</text>
    <rect x="335" y="6" width="115" height="22" rx="3" fill="#FF5722"/>
    <text x="392" y="21" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">16.38× LEAP</text>
  </g>

  <!-- Multiplier Equation Line -->
  <rect x="50" y="315" width="460" height="42" rx="6" fill="#1B3A5F"/>
  <text x="280" y="333" fill="#FF8246" font-size="10.5" font-weight="700" text-anchor="middle">2.0× (INT8) × 1.5× (SVD) × 1.3× (Fusion) × 4.2× (KV Cache)</text>
  <text x="280" y="348" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">= 16.38× TOTAL END-TO-END SPEEDUP!</text>

  <!-- Right Panel: Amdahl's Law Comparison -->
  <rect x="535" y="72" width="280" height="295" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="545" y="82" width="260" height="22" rx="4" fill="#1B3A5F"/>
  <text x="675" y="97" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">AMDAHL'S LAW CEILING</text>

  <!-- Isolated Trap Card -->
  <rect x="545" y="112" width="260" height="110" rx="6" fill="#FFF8F0" stroke="#FF5722" stroke-width="0.8"/>
  <text x="555" y="130" fill="#D22341" font-size="10" font-weight="700">The Isolated Optimization Trap:</text>
  <text x="555" y="148" fill="#475569" font-size="9.5">• Optimize ONLY MatMul by 10×</text>
  <text x="555" y="163" fill="#475569" font-size="9.5">• MatMul is 60% of runtime (f = 0.60):</text>
  <rect x="555" y="172" width="240" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="675" y="187" fill="#D22341" font-size="9.5" font-weight="700" text-anchor="middle">Speedup = 1 / (0.40 + 0.60/10) = 2.17×</text>
  <text x="555" y="210" fill="#D22341" font-size="8.5" font-weight="700">Unoptimized 40% bottlenecks total speedup!</text>

  <!-- Full Stack Solution Card -->
  <rect x="545" y="230" width="260" height="127" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
  <text x="555" y="248" fill="#059669" font-size="10" font-weight="700">The Full-Stack Multiplier Solution:</text>
  <text x="555" y="266" fill="#475569" font-size="9.5">• Tier 1 (Precision): Cuts memory bus 4×</text>
  <text x="555" y="281" fill="#475569" font-size="9.5">• Tier 2 (Geometry): Cuts matrix dimensions</text>
  <text x="555" y="296" fill="#475569" font-size="9.5">• Tier 3 (Kernel): Keeps data in SRAM</text>
  <text x="555" y="311" fill="#475569" font-size="9.5">• Tier 4 (Algorithm): Eliminates recompute</text>
  <text x="555" y="335" fill="#059669" font-size="9.5" font-weight="700">Compounding Across Every Layer!</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Multiplicative Acceleration Invariant: Speedup is cumulative across orthogonal architectural tiers.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Amdahl's Law caps single-operator gains; genuine 16x performance requires compounding optimizations across memory, math, and algorithms.</text>
</svg>
