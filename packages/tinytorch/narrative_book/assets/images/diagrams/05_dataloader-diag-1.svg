<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <filter id="subCardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3A5F" flood-opacity="0.05"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8246" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#0F2338" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="15" width="810" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="20" y="15" width="810" height="45" rx="10" fill="url(#torchGrad)"/>
  <rect x="20" y="45" width="810" height="15" fill="url(#torchGrad)"/>
  <text x="38" y="42" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.4">ASYNCHRONOUS DATALOADER: MULTI-PROCESS IPC &amp; PINNED MEMORY</text>
  <rect x="685" y="27" width="130" height="22" rx="11" fill="#FF8246"/>
  <text x="750" y="42" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">PREFETCH ENGINE</text>

  <!-- Main Pipeline Container -->
  <!-- 1. Dataset on NVMe / Disk -->
  <g transform="translate(38, 75)">
    <rect x="0" y="0" width="120" height="275" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="120" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="120" height="10" fill="#1B3A5F"/>
    <text x="60" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1. Disk Storage</text>

    <!-- Disk Platters / NVMe Storage visual -->
    <rect x="15" y="42" width="90" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="60" y="56" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">Dataset Samples</text>
    <text x="60" y="66" fill="#64748B" font-size="8" text-anchor="middle">100,000+ raw files</text>

    <g transform="translate(15, 78)">
      <rect x="0" y="0" width="90" height="22" rx="3" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1"/>
      <text x="45" y="15" fill="#2E6F7E" font-size="8.5" font-weight="600" text-anchor="middle">Shard 0 (idx 0..N)</text>
      
      <rect x="0" y="27" width="90" height="22" rx="3" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1"/>
      <text x="45" y="42" fill="#2E6F7E" font-size="8.5" font-weight="600" text-anchor="middle">Shard 1 (idx N..2N)</text>
      
      <rect x="0" y="54" width="90" height="22" rx="3" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1"/>
      <text x="45" y="69" fill="#2E6F7E" font-size="8.5" font-weight="600" text-anchor="middle">Shard 2 (idx 2N..3N)</text>
    </g>

    <!-- Sampler details -->
    <rect x="12" y="165" width="96" height="42" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/>
    <text x="60" y="181" fill="#FF8246" font-size="9.5" font-weight="700" text-anchor="middle">Sampler Stream</text>
    <text x="60" y="197" fill="#475569" font-size="8" text-anchor="middle">Deterministic / Shuffled</text>

    <rect x="12" y="215" width="96" height="46" rx="4" fill="#1B3A5F"/>
    <text x="60" y="232" fill="#FF8246" font-size="9" font-weight="700" text-anchor="middle">Dataset.__getitem__</text>
    <text x="60" y="247" fill="#FFFFFF" font-size="8" text-anchor="middle">Index-based lazy load</text>
  </g>

  <!-- Arrow 1: Dataset -> Workers -->
  <path d="M158 190 L183 190" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 2. Multi-Process Workers (Bypassing Python GIL) -->
  <g transform="translate(188, 75)">
    <rect x="0" y="0" width="165" height="275" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="165" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="165" height="10" fill="#1B3A5F"/>
    <text x="82" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2. Prefetch Workers (GIL Free)</text>

    <!-- Worker 0 -->
    <g transform="translate(10, 36)">
      <rect x="0" y="0" width="145" height="66" rx="5" fill="url(#workerGrad)" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="6" y="6" width="62" height="16" rx="3" fill="#2E6F7E"/>
      <text x="37" y="17" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Worker 0 (PID)</text>
      <text x="135" y="18" fill="#10B981" font-size="8" font-weight="700" text-anchor="end">⚡ Active</text>
      <text x="8" y="36" fill="#1E293B" font-size="8.5" font-weight="600">• Load &amp; Decode Sample</text>
      <text x="8" y="48" fill="#1E293B" font-size="8.5" font-weight="600">• Augment / Transform</text>
      <text x="8" y="60" fill="#64748B" font-size="8">• Yield batch [B, C, H, W]</text>
    </g>

    <!-- Worker 1 -->
    <g transform="translate(10, 108)">
      <rect x="0" y="0" width="145" height="66" rx="5" fill="url(#workerGrad)" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="6" y="6" width="62" height="16" rx="3" fill="#2E6F7E"/>
      <text x="37" y="17" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Worker 1 (PID)</text>
      <text x="135" y="18" fill="#10B981" font-size="8" font-weight="700" text-anchor="end">⚡ Active</text>
      <text x="8" y="36" fill="#1E293B" font-size="8.5" font-weight="600">• Collate mini-batch (t+1)</text>
      <text x="8" y="48" fill="#1E293B" font-size="8.5" font-weight="600">• Tensor allocation</text>
      <text x="8" y="60" fill="#64748B" font-size="8">• Push to shared memory</text>
    </g>

    <!-- Worker N Info -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="145" height="46" rx="5" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/>
      <text x="72" y="16" fill="#FF8246" font-size="9" font-weight="700" text-anchor="middle">collate_fn() Batching</text>
      <text x="72" y="29" fill="#475569" font-size="8" text-anchor="middle">Stack tuples → Tensor</text>
      <text x="72" y="40" fill="#64748B" font-size="7.5" text-anchor="middle">num_workers = 4 parallel</text>
    </g>

    <rect x="10" y="233" width="145" height="28" rx="4" fill="#1B3A5F"/>
    <text x="72" y="251" fill="#FFFFFF" font-size="8.5" font-weight="600" text-anchor="middle">Multi-Process IPC Queue</text>
  </g>

  <!-- Arrow 2: Workers -> Queue -->
  <path d="M353 190 L378 190" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 3. IPC Queue & Shared Memory Buffer -->
  <g transform="translate(383, 75)">
    <rect x="0" y="0" width="135" height="275" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="135" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="135" height="10" fill="#1B3A5F"/>
    <text x="67" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3. Shared IPC Queue</text>

    <!-- Queue slots -->
    <text x="67" y="47" fill="#1E293B" font-size="9" font-weight="700" text-anchor="middle">Producer-Consumer Ring</text>

    <g transform="translate(12, 54)">
      <!-- Slot 1 -->
      <rect x="0" y="0" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
      <text x="10" y="15" fill="#1B3A5F" font-size="9" font-weight="700">Batch t (Ready)</text>
      <text x="10" y="27" fill="#10B981" font-size="7.5" font-weight="600">Pop → Next in stream</text>

      <!-- Slot 2 -->
      <rect x="0" y="40" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/>
      <text x="10" y="55" fill="#1B3A5F" font-size="9" font-weight="700">Batch t+1 (Ready)</text>
      <text x="10" y="67" fill="#FF8246" font-size="7.5">Worker 0 wrote</text>

      <!-- Slot 3 -->
      <rect x="0" y="80" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="95" fill="#64748B" font-size="9" font-weight="600">Batch t+2 (Filling)</text>
      <text x="10" y="107" fill="#64748B" font-size="7.5">Worker 1 writing...</text>
    </g>

    <!-- Thread-safe synchronization -->
    <rect x="12" y="176" width="110" height="85" rx="5" fill="#1B3A5F"/>
    <text x="67" y="196" fill="#FF8246" font-size="9.5" font-weight="700" text-anchor="middle">Bounded Capacity</text>
    <text x="67" y="212" fill="#FFFFFF" font-size="8" text-anchor="middle">maxsize = 2 × workers</text>
    <text x="67" y="227" fill="#CBD5E1" font-size="8" text-anchor="middle">Prevents Host RAM leak</text>
    <text x="67" y="244" fill="#10B981" font-size="8" font-weight="600" text-anchor="middle">Zero compute stall</text>
  </g>

  <!-- Arrow 3: Queue -> Pinned Memory -->
  <path d="M518 190 L543 190" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 4. Pinned Host DRAM (cudaHostAlloc) -->
  <g transform="translate(548, 75)">
    <rect x="0" y="0" width="125" height="275" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="125" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="125" height="10" fill="#1B3A5F"/>
    <text x="62" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4. Pinned Host RAM</text>

    <!-- Pinned RAM visual -->
    <rect x="10" y="42" width="105" height="50" rx="4" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="62" y="57" fill="#2E6F7E" font-size="9" font-weight="700" text-anchor="middle">pin_memory=True</text>
    <text x="62" y="70" fill="#1E293B" font-size="8" text-anchor="middle">Page-Locked DRAM</text>
    <text x="62" y="82" fill="#64748B" font-size="7.5" text-anchor="middle">OS cannot swap page</text>

    <!-- DMA Controller -->
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="105" height="64" rx="4" fill="#F8FAFC" stroke="#FF8246" stroke-width="1.2"/>
      <text x="52" y="15" fill="#FF8246" font-size="9" font-weight="700" text-anchor="middle">Direct Memory Access</text>
      <text x="52" y="28" fill="#1E293B" font-size="7.5" text-anchor="middle">Physical bus address</text>
      <text x="52" y="40" fill="#1E293B" font-size="7.5" text-anchor="middle">GPU reads directly</text>
      <text x="52" y="54" fill="#10B981" font-size="7.5" font-weight="600" text-anchor="middle">Zero CPU copy overhead</text>
    </g>

    <!-- Fast PCIe bridge -->
    <rect x="10" y="170" width="105" height="91" rx="4" fill="#1B3A5F"/>
    <text x="62" y="190" fill="#FF8246" font-size="9" font-weight="700" text-anchor="middle">PCIe Gen 4/5 Bus</text>
    <text x="62" y="206" fill="#FFFFFF" font-size="8" text-anchor="middle">32 - 64 GB/s throughput</text>
    <text x="62" y="222" fill="#CBD5E1" font-size="8" text-anchor="middle">Async transfer stream</text>
    <text x="62" y="238" fill="#CBD5E1" font-size="7.5" text-anchor="middle">cudaMemcpyAsync()</text>
  </g>

  <!-- Arrow 4: Pinned Memory -> GPU Stream -->
  <path d="M673 190 L698 190" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 5. GPU VRAM & Compute Engine -->
  <g transform="translate(703, 75)">
    <rect x="0" y="0" width="125" height="275" rx="8" fill="url(#gpuGrad)" stroke="#FF8246" stroke-width="1.5" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="125" height="30" rx="8" fill="#FF8246"/>
    <rect x="0" y="20" width="125" height="10" fill="#FF8246"/>
    <text x="62" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">5. GPU VRAM &amp; Engine</text>

    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="105" height="42" rx="4" fill="#FFFFFF" fill-opacity="0.1" stroke="#FF8246" stroke-width="1"/>
      <text x="52" y="17" fill="#FF8246" font-size="9" font-weight="700" text-anchor="middle">HBM3 / GDDR6</text>
      <text x="52" y="31" fill="#FFFFFF" font-size="8" text-anchor="middle">Batch t Resides in VRAM</text>
    </g>

    <g transform="translate(10, 88)">
      <rect x="0" y="0" width="105" height="74" rx="4" fill="#FFFFFF" fill-opacity="0.08" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="52" y="16" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">CUDA Stream Overlap</text>
      <text x="52" y="31" fill="#FFFFFF" font-size="7.5" text-anchor="middle">Stream A: Forward Pass</text>
      <text x="52" y="44" fill="#FFFFFF" font-size="7.5" text-anchor="middle">Stream B: Backward Pass</text>
      <text x="52" y="58" fill="#FF8246" font-size="7.5" font-weight="600" text-anchor="middle">Stream C: Next Batch DMA</text>
    </g>

    <g transform="translate(10, 168)">
      <rect x="0" y="0" width="105" height="93" rx="4" fill="#0A1826" stroke="#10B981" stroke-width="1"/>
      <text x="52" y="18" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle">100% Saturation</text>
      <text x="52" y="34" fill="#FFFFFF" font-size="7.5" text-anchor="middle">Tensor Cores Never Idle</text>
      <text x="52" y="50" fill="#CBD5E1" font-size="7.5" text-anchor="middle">Zero GPU bubble stalls</text>
      <text x="52" y="66" fill="#FF8246" font-size="7.5" font-weight="600" text-anchor="middle">Max TFLOPS Achieved</text>
    </g>
  </g>

  <!-- Bottom Systems Invariant Callout -->
  <g transform="translate(38, 360)">
    <rect x="0" y="0" width="774" height="62" rx="6" fill="#1B3A5F" stroke="#2E6F7E" stroke-width="1"/>
    <text x="20" y="24" fill="#FF8246" font-size="11.5" font-weight="700">⚡ Systems Invariant: Decoupled Multi-Process I/O and Zero-Copy DMA Overlap</text>
    <text x="20" y="42" fill="#FFFFFF" font-size="10">By isolating dataset decoding into background worker processes and allocating tensors in page-locked pinned host RAM, PCIe transfers</text>
    <text x="20" y="54" fill="#CBD5E1" font-size="9.5">execute concurrently with GPU compute kernels via non-blocking CUDA streams—completely amortizing disk and preprocessing latency.</text>
  </g>
</svg>