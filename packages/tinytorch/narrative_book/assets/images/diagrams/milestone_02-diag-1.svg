<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Navy Header Banner -->
  <rect x="15" y="15" width="820" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="15" y="45" width="820" height="20" fill="url(#headerGrad)"/>
  <text x="35" y="46" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">AUTOREGRESSIVE GENERATIVE INFERENCE &amp; KV CACHE LOOP</text>
  <rect x="670" y="27" width="145" height="24" rx="12" fill="#FF8246"/>
  <text x="742" y="43" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">SAMPLING ENGINE</text>

  <!-- Panel 1: Prefill vs Decode Step (Left) -->
  <rect x="30" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="30" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="42" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Prefill &amp; KV Cache Decode</text>

  <!-- Prefill phase box -->
  <g transform="translate(40, 114)">
    <rect x="0" y="0" width="225" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="15" fill="#1B3A5F" font-size="9" font-weight="700">Phase A: Prompt Prefill (Parallel)</text>
    <text x="8" y="28" fill="#475569" font-size="8">Prompt: ["TinyTorch", "is"] → Forward pass</text>
    <text x="8" y="40" fill="#00695C" font-size="8" font-weight="600">Populates KV Cache [Tokens 0, 1]</text>
  </g>

  <!-- Decode step box -->
  <g transform="translate(40, 166)">
    <rect x="0" y="0" width="225" height="74" rx="4" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="8" y="15" fill="#00695C" font-size="9" font-weight="700">Phase B: Autoregressive Decode (Step-by-Step)</text>
    
    <!-- Token append row -->
    <rect x="8" y="22" width="209" height="20" rx="3" fill="#FFFFFF" stroke="#2E6F7E"/>
    <text x="14" y="35" fill="#1B3A5F" font-size="8">Input token t_step: <tspan fill="#FF5722" font-weight="700">["the"]</tspan> (Length = 1)</text>

    <!-- Cache append info -->
    <text x="8" y="55" fill="#00695C" font-size="8">• Append K_new, V_new to KV Cache</text>
    <text x="8" y="67" fill="#00695C" font-size="8">• O(1) compute vs O(S) full history recompute</text>
  </g>

  <!-- KV Cache status card -->
  <g transform="translate(40, 246)">
    <rect x="0" y="0" width="225" height="98" rx="6" fill="#1B3A5F"/>
    <text x="10" y="18" fill="#FF8246" font-size="9.5" font-weight="700">⚡ KV Cache Memory Geometry</text>
    <text x="10" y="34" fill="#FFFFFF" font-size="8.5">• Static buffer: [B, n_heads, MaxSeq, d_k]</text>
    <text x="10" y="48" fill="#CBD5E1" font-size="8.5">• No recomputation of past token representations</text>
    <text x="10" y="62" fill="#CBD5E1" font-size="8.5">• Latency shifts from compute-bound to memory-bound</text>
    <text x="10" y="78" fill="#38BDF8" font-size="8.5" font-weight="600">→ Constant Latency per Generated Token</text>
  </g>

  <!-- Panel 2: Temperature & Top-k Filtering (Center) -->
  <rect x="290" y="78" width="270" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="290" y="78" width="270" height="28" rx="8" fill="#2E6F7E"/>
  <rect x="290" y="96" width="270" height="10" fill="#2E6F7E"/>
  <text x="302" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">2. Logits &amp; Probability Shaping</text>

  <!-- Connect Arrow Left to Center -->
  <path d="M276 175 H288" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Temperature scaling equation -->
  <g transform="translate(300, 114)">
    <rect x="0" y="0" width="250" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="15" fill="#1B3A5F" font-size="9" font-weight="700">1. Temperature Scaling: z' = z / T</text>
    <text x="8" y="28" fill="#FF5722" font-size="8">• T = 0.7: Sharp, confident, deterministic</text>
    <text x="8" y="38" fill="#2E6F7E" font-size="8">• T = 1.2: Flattened, high diversity &amp; creativity</text>
  </g>

  <!-- Top-k Filtering graphic -->
  <g transform="translate(300, 162)">
    <rect x="0" y="0" width="250" height="80" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="14" fill="#1B3A5F" font-size="9" font-weight="700">2. Top-k Filtering (e.g. k = 3):</text>

    <!-- Bar chart of top candidates -->
    <!-- Token 1 (Keep) -->
    <rect x="8" y="20" width="70" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/>
    <text x="12" y="32" fill="#FF5722" font-size="7.5" font-weight="700">"the" (z=8.2)</text>
    <text x="85" y="32" fill="#00695C" font-size="7.5" font-weight="700">✓ Keep</text>

    <!-- Token 2 (Keep) -->
    <rect x="8" y="38" width="55" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/>
    <text x="12" y="50" fill="#FF5722" font-size="7.5" font-weight="700">"a" (z=6.1)</text>
    <text x="85" y="50" fill="#00695C" font-size="7.5" font-weight="700">✓ Keep</text>

    <!-- Token 3 (Keep) -->
    <rect x="8" y="56" width="45" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/>
    <text x="12" y="68" fill="#FF5722" font-size="7.5" font-weight="700">"our" (z=4.5)</text>
    <text x="85" y="68" fill="#00695C" font-size="7.5" font-weight="700">✓ Keep</text>

    <!-- Filtered Tail (Masked) -->
    <rect x="140" y="20" width="102" height="52" rx="3" fill="#FFF1F2" stroke="#E11D48"/>
    <text x="191" y="42" fill="#E11D48" font-size="8" font-weight="700" text-anchor="middle">Tail Logits &gt; k</text>
    <text x="191" y="56" fill="#E11D48" font-size="8" font-weight="700" text-anchor="middle">Set to -∞</text>
  </g>

  <!-- Softmax Normalized Output Box -->
  <g transform="translate(300, 248)">
    <rect x="0" y="0" width="250" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="16" fill="#00695C" font-size="9.5" font-weight="700">3. Softmax Probability Normalization:</text>
    <text x="8" y="32" fill="#1B3A5F" font-size="8.5">P(t_next = i) = exp(z'_i) / ∑ exp(z'_j)</text>
    <text x="8" y="48" fill="#475569" font-size="8">• Eliminates low-probability gibberish tail</text>
    <text x="8" y="62" fill="#475569" font-size="8">• Preserves natural stochastic variety</text>
    <text x="8" y="76" fill="#00695C" font-size="8.5" font-weight="600">• Clean probability distribution over top-k</text>
  </g>

  <!-- Panel 3: Categorical Sampling & Loop (Right) -->
  <rect x="575" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="575" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="575" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="587" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Stochastic Sampling &amp; Loop</text>

  <!-- Connect Arrow Center to Right -->
  <path d="M561 175 H573" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Sampling Execution Flow -->
  <g transform="translate(585, 114)">
    <!-- Categorical draw -->
    <rect x="0" y="0" width="225" height="28" rx="3" fill="#1B3A5F"/>
    <text x="112" y="14" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Categorical Sample: t_emit ~ P</text>
    <text x="112" y="24" fill="#FF8246" font-size="7.5" text-anchor="middle">Sampled ID: 18432 ("xv6")</text>

    <path d="M112 28 V38" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Detokenization -->
    <rect x="0" y="38" width="225" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="112" y="54" fill="#1E293B" font-size="8.5" text-anchor="middle">Detokenize: ID 18432 → Text <tspan fill="#FF5722" font-weight="700">"xv6"</tspan></text>

    <path d="M112 62 V72" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Check EOS condition -->
    <rect x="0" y="72" width="225" height="26" rx="3" fill="#E0F2F1" stroke="#2E6F7E"/>
    <text x="112" y="88" fill="#00695C" font-size="8.5" font-weight="700" text-anchor="middle">EOS Check: t_emit == &lt;|endoftext|&gt; ?</text>
  </g>

  <!-- Feedback Loop Arrow to Step N+1 -->
  <g transform="translate(585, 218)">
    <rect x="0" y="0" width="225" height="52" rx="4" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.2"/>
    <text x="10" y="16" fill="#D22341" font-size="9" font-weight="700">Autoregressive Feedback Loop:</text>
    <text x="10" y="30" fill="#475569" font-size="8">Append "xv6" → Sequence becomes:</text>
    <text x="10" y="44" fill="#FF5722" font-size="8" font-weight="700">["TinyTorch", "is", "the", "xv6"] → Next Step</text>
  </g>

  <!-- Complete Inference Loop Box -->
  <rect x="585" y="278" width="225" height="68" rx="6" fill="#1B3A5F"/>
  <text x="595" y="295" fill="#FF8246" font-size="9.5" font-weight="700">⚡ Autonomous Generation</text>
  <text x="595" y="310" fill="#FFFFFF" font-size="8.5">• Loops until max_new_tokens or &lt;|endoftext|&gt;</text>
  <text x="595" y="324" fill="#CBD5E1" font-size="8.5">• Seamless streaming token generator</text>
  <text x="595" y="338" fill="#38BDF8" font-size="8.5" font-weight="600">• Real-time terminal output streaming</text>

  <!-- Bottom Systems Invariant Callout Banner -->
  <rect x="30" y="368" width="790" height="54" rx="8" fill="#1B3A5F"/>
  <text x="45" y="388" fill="#FF8246" font-size="11" font-weight="700">⚡ Autoregressive KV Cache Invariant: O(1) FLOPs &amp; Sequential Memory Streaming per Token</text>
  <text x="45" y="406" fill="#F8FAFC" font-size="9.5">Pre-allocating static key-value cache buffers transforms generative decoding from quadratic O(S²) token recomputations</text>
  <text x="45" y="418" fill="#CBD5E1" font-size="9.5">into an O(1) compute, memory-bandwidth bound streaming kernel, enabling interactive real-time text generation.</text>

</svg>
