<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Navy Header Banner -->
  <rect x="15" y="15" width="820" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="15" y="45" width="820" height="20" fill="url(#headerGrad)"/>
  <text x="35" y="46" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">BYTE-PAIR ENCODING (BPE): SUBWORD COMPRESSION TREE</text>
  <rect x="670" y="27" width="145" height="24" rx="12" fill="#FF8246"/>
  <text x="742" y="43" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">SUBWORD ALGORITHM</text>

  <!-- Panel 1: Tokenization Spectrum & Raw Bytes (Left) -->
  <rect x="30" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="30" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="42" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Representation Tradeoffs</text>

  <!-- Spectrum Comparison Items -->
  <g transform="translate(40, 116)">
    <!-- Char-level -->
    <rect x="0" y="0" width="225" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="14" fill="#D22341" font-size="9.5" font-weight="700">Char/Byte (V=256)</text>
    <text x="8" y="27" fill="#64748B" font-size="8.5">• 10x sequence bloat → O(S²) Attention explosion</text>

    <!-- Word-level -->
    <rect x="0" y="40" width="225" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="54" fill="#D22341" font-size="9.5" font-weight="700">Word-Level (V=500k+)</text>
    <text x="8" y="67" fill="#64748B" font-size="8.5">• Massive memory table; fails on unseen &lt;UNK&gt;</text>

    <!-- Subword BPE -->
    <rect x="0" y="80" width="225" height="36" rx="4" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="8" y="94" fill="#00695C" font-size="9.5" font-weight="700">✓ Subword BPE (V=50,257)</text>
    <text x="8" y="107" fill="#00695C" font-size="8.5">• Bounded sequence length &amp; 0% OOV error</text>
  </g>

  <!-- Corpus Raw Byte Stream -->
  <text x="40" y="248" fill="#1E293B" font-size="10" font-weight="700">Initial Corpus (Byte Sequences):</text>
  <g transform="translate(40, 256)" font-size="9">
    <rect x="0" y="0" width="225" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="14" fill="#1B3A5F">"low _" : [ 'l', 'o', 'w', '_' ] (freq: 5)</text>

    <rect x="0" y="24" width="225" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="38" fill="#1B3A5F">"lower _" : [ 'l', 'o', 'w', 'e', 'r', '_' ] (freq: 2)</text>

    <rect x="0" y="48" width="225" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="62" fill="#1B3A5F">"newest _" : [ 'n', 'e', 'w', 'e', 's', 't', '_' ] (freq: 6)</text>

    <rect x="0" y="72" width="225" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="86" fill="#1B3A5F">"widest _" : [ 'w', 'i', 'd', 'e', 's', 't', '_' ] (freq: 3)</text>
  </g>

  <!-- Panel 2: Iterative Pair Merges & Tree (Center) -->
  <rect x="290" y="78" width="270" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="290" y="78" width="270" height="28" rx="8" fill="#2E6F7E"/>
  <rect x="290" y="96" width="270" height="10" fill="#2E6F7E"/>
  <text x="302" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">2. Pair Statistics &amp; Merge Hierarchy</text>

  <!-- Connect Arrow Left to Center -->
  <path d="M276 175 H288" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Frequency Table -->
  <g transform="translate(300, 116)">
    <text x="0" y="10" fill="#1E293B" font-size="10" font-weight="700">Top Frequency Statistics:</text>
    
    <rect x="0" y="16" width="250" height="18" fill="#1B3A5F" rx="2"/>
    <text x="8" y="29" fill="#FFFFFF" font-size="8.5" font-weight="700">Pair</text>
    <text x="75" y="29" fill="#FFFFFF" font-size="8.5" font-weight="700">Count</text>
    <text x="125" y="29" fill="#FFFFFF" font-size="8.5" font-weight="700">Action</text>
    <text x="195" y="29" fill="#FFFFFF" font-size="8.5" font-weight="700">Rank</text>

    <!-- Row 1 -->
    <rect x="0" y="36" width="250" height="18" fill="#FFE8DC" rx="2"/>
    <text x="8" y="49" fill="#FF5722" font-size="8.5" font-weight="700">('e', 's')</text>
    <text x="82" y="49" fill="#1E293B" font-size="8.5">9</text>
    <text x="125" y="49" fill="#FF5722" font-size="8.5" font-weight="700">Merge → 'es'</text>
    <text x="200" y="49" fill="#1B3A5F" font-size="8.5" font-weight="700">#0</text>

    <!-- Row 2 -->
    <rect x="0" y="56" width="250" height="18" fill="#FFFFFF" stroke="#CBD5E1" rx="2"/>
    <text x="8" y="69" fill="#1E293B" font-size="8.5">('es', 't')</text>
    <text x="82" y="69" fill="#1E293B" font-size="8.5">9</text>
    <text x="125" y="69" fill="#2E6F7E" font-size="8.5" font-weight="700">Merge → 'est'</text>
    <text x="200" y="69" fill="#1B3A5F" font-size="8.5" font-weight="700">#1</text>

    <!-- Row 3 -->
    <rect x="0" y="76" width="250" height="18" fill="#FFFFFF" stroke="#CBD5E1" rx="2"/>
    <text x="8" y="89" fill="#1E293B" font-size="8.5">('l', 'o')</text>
    <text x="82" y="89" fill="#1E293B" font-size="8.5">7</text>
    <text x="125" y="89" fill="#2E6F7E" font-size="8.5" font-weight="700">Merge → 'lo'</text>
    <text x="200" y="89" fill="#1B3A5F" font-size="8.5" font-weight="700">#2</text>
  </g>

  <!-- Hierarchical Merge Tree -->
  <text x="300" y="222" fill="#1E293B" font-size="10" font-weight="700">Hierarchical Subword Merge Tree:</text>
  <g transform="translate(305, 234)">
    <!-- Root 'est' -->
    <rect x="122" y="0" width="32" height="18" rx="3" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="138" y="13" font-size="8.5" font-weight="700" fill="#00695C" text-anchor="middle">'est'</text>

    <!-- 'new' -->
    <rect x="16" y="32" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1B3A5F"/>
    <text x="30" y="45" font-size="8.5" font-weight="700" fill="#1B3A5F" text-anchor="middle">'new'</text>

    <!-- 'es' -->
    <rect x="99" y="32" width="30" height="18" rx="3" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.2"/>
    <text x="114" y="45" font-size="8.5" font-weight="700" fill="#FF5722" text-anchor="middle">'es'</text>

    <!-- Tree lines -->
    <!-- est -> es and t -->
    <path d="M130 18 L114 32 M146 18 L161 68" stroke="#2E6F7E" stroke-width="1.5"/>
    <!-- es -> e and s -->
    <path d="M107 50 L101 68 M121 50 L127 68" stroke="#FF8246" stroke-width="1.5"/>
    <!-- new -> n, e, w -->
    <path d="M22 50 L11 68 M30 50 L37 68 M38 50 L63 68" stroke="#1B3A5F" stroke-width="1.2"/>

    <!-- Base characters -->
    <rect x="0" y="68" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/><text x="11" y="82" font-size="9" fill="#1B3A5F" text-anchor="middle">n</text>
    <rect x="26" y="68" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/><text x="37" y="82" font-size="9" fill="#1B3A5F" text-anchor="middle">e</text>
    <rect x="52" y="68" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/><text x="63" y="82" font-size="9" fill="#1B3A5F" text-anchor="middle">w</text>
    <rect x="90" y="68" width="22" height="20" rx="3" fill="#FFE8DC" stroke="#FF8246"/><text x="101" y="82" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">e</text>
    <rect x="116" y="68" width="22" height="20" rx="3" fill="#FFE8DC" stroke="#FF8246"/><text x="127" y="82" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">s</text>
    <rect x="150" y="68" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/><text x="161" y="82" font-size="9" fill="#1B3A5F" text-anchor="middle">t</text>
    <rect x="180" y="68" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/><text x="191" y="82" font-size="9" fill="#1B3A5F" text-anchor="middle">_</text>

    <!-- Combined Token Boundary -->
    <rect x="0" y="94" width="210" height="16" rx="2" fill="#F1F5F9"/>
    <text x="105" y="106" font-size="8" fill="#475569" text-anchor="middle">Resulting Subwords: [ 'new', 'est', '_' ]</text>
  </g>

  <!-- Panel 3: Tokenizer Engine & Rank Table (Right) -->
  <rect x="575" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="575" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="575" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="587" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Tokenizer Execution</text>

  <!-- Connect Arrow Center to Right -->
  <path d="M561 175 H573" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Encoding Execution Flow -->
  <text x="587" y="120" fill="#1E293B" font-size="10" font-weight="700">Runtime String Tokenization:</text>
  
  <g transform="translate(585, 126)">
    <!-- Input String -->
    <rect x="0" y="0" width="225" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="16" fill="#1E293B" font-size="9">Input: <tspan fill="#FF5722" font-weight="700">"newest lower"</tspan></text>

    <path d="M112 24 V34" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Step 1: Byte Split -->
    <rect x="0" y="34" width="225" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="50" fill="#475569" font-size="8.5">Byte split: ['n','e','w','e','s','t',' ','l','o','w','e','r']</text>

    <path d="M112 58 V68" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Step 2: Merge Rank Application -->
    <rect x="0" y="68" width="225" height="26" rx="4" fill="#E0F2F1" stroke="#2E6F7E"/>
    <text x="8" y="85" fill="#00695C" font-size="8.5" font-weight="700">Subwords: ['new', 'est', 'Ġ', 'low', 'er']</text>

    <path d="M112 94 V104" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Step 3: Token IDs -->
    <rect x="0" y="104" width="225" height="28" rx="4" fill="#1B3A5F"/>
    <text x="8" y="122" fill="#FF8246" font-size="9" font-weight="700">Token IDs: [1045, 891, 220, 412, 389]</text>
  </g>

  <!-- Systems Guarantee Box -->
  <rect x="585" y="272" width="225" height="72" rx="6" fill="#1B3A5F"/>
  <text x="595" y="290" fill="#FF8246" font-size="10" font-weight="700">⚡ 100% Byte Fallback Invariant</text>
  <text x="595" y="306" fill="#FFFFFF" font-size="8.5">• 256 base byte tokens catch any unknown symbol</text>
  <text x="595" y="320" fill="#CBD5E1" font-size="8.5">• Zero &lt;UNK&gt; tokens in vocabulary</text>
  <text x="595" y="334" fill="#38BDF8" font-size="8.5" font-weight="600">• Clean integer IDs stream directly into Embeddings</text>

  <!-- Bottom Systems Invariant Callout Banner -->
  <rect x="30" y="368" width="790" height="54" rx="8" fill="#1B3A5F"/>
  <text x="45" y="388" fill="#FF8246" font-size="11" font-weight="700">⚡ Information-Theoretic Compression Invariant: Prefix/Root Preservation with Zero OOV</text>
  <text x="45" y="406" fill="#F8FAFC" font-size="9.5">BPE compresses frequent character sequences into dense single tokens while preserving UTF-8 byte fallbacks,</text>
  <text x="45" y="418" fill="#CBD5E1" font-size="9.5">eliminating the O(S²) attention sequence length bloat of byte models and the catastrophic OOV failures of word dictionaries.</text>

</svg>
