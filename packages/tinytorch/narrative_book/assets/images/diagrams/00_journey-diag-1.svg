<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 475" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="820" height="445" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="15" y="15" width="820" height="46" rx="10" fill="url(#torchGrad)"/>
  <path d="M15 51 h820 v10 h-820 z" fill="url(#torchGrad)" />
  <text x="35" y="44" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.3">TINYTORCH ARCHITECTURE: 4-TIER LEARNING ARC &amp; SYSTEMS STACK</text>
  <rect x="640" y="27" width="175" height="22" rx="11" fill="#FF8246"/>
  <text x="727" y="42" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">4,558 SLOC • 0 ML DEPS</text>

  <!-- SECTION 1: THE 4-TIER LEARNING ROADMAP (y = 72 to 258) -->
  <!-- Tier 1: Foundations -->
  <rect x="30" y="72" width="180" height="184" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="72" width="180" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M30 90 h180 v10 h-180 z" fill="#1B3A5F"/>
  <text x="120" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">Tier 1: Foundations</text>

  <g transform="translate(40, 108)" font-size="10" font-weight="500" fill="#1E293B">
    <rect x="0" y="0" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="14">01. Tensors &amp; Strides</text>
    <rect x="0" y="24" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="38">02. Activations (GELU)</text>
    <rect x="0" y="48" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="62">03. Modular Layers &amp; Init</text>
    <rect x="0" y="72" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="86">04. Log-Sum-Exp Losses</text>
    <rect x="0" y="98" width="160" height="24" rx="4" fill="#FFF0E6" stroke="#FF8246" stroke-width="1.2"/>
    <text x="80" y="114" text-anchor="middle" fill="#FF5722" font-size="10" font-weight="700">★ Milestone 1: XOR Net</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M214 164 H226" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Tier 2: Core Engine -->
  <rect x="230" y="72" width="180" height="184" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="230" y="72" width="180" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M230 90 h180 v10 h-180 z" fill="#1B3A5F"/>
  <text x="320" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">Tier 2: Core Engine</text>

  <g transform="translate(240, 108)" font-size="10" font-weight="500" fill="#1E293B">
    <rect x="0" y="0" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="14">05. Async DataLoader</text>
    <rect x="0" y="24" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="38">06. Autograd Dynamic Tape</text>
    <rect x="0" y="48" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="62">07. AdamW &amp; Cosine Sched</text>
    <rect x="0" y="72" width="160" height="20" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="86">08. Training State Machine</text>
    <rect x="0" y="98" width="160" height="24" rx="4" fill="#FFF0E6" stroke="#FF8246" stroke-width="1.2"/>
    <text x="80" y="114" text-anchor="middle" fill="#FF5722" font-size="10" font-weight="700">★ Milestone 2: MNIST</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M414 164 H426" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Tier 3: Architectures -->
  <rect x="430" y="72" width="185" height="184" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="430" y="72" width="185" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M430 90 h185 v10 h-185 z" fill="#1B3A5F"/>
  <text x="522" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">Tier 3: Architectures</text>

  <g transform="translate(440, 106)" font-size="9.5" font-weight="500" fill="#1E293B">
    <rect x="0" y="0" width="165" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="13">09. Spatial Convolutions</text>
    <rect x="0" y="21" width="165" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="34">10. Byte-Pair Encoding</text>
    <rect x="0" y="42" width="165" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="55">11. Token Embeddings &amp; Pos</text>
    <rect x="0" y="63" width="165" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="76">12. Scaled Dot-Product Attn</text>
    <rect x="0" y="84" width="165" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="97">13. TinyGPT-2 Transformer</text>
    <rect x="0" y="105" width="165" height="21" rx="4" fill="#FFF0E6" stroke="#FF8246" stroke-width="1.2"/>
    <text x="82" y="120" text-anchor="middle" fill="#FF5722" font-size="10" font-weight="700">★ Milestone 3: TinyGPT</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M618 164 H630" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Tier 4: Acceleration -->
  <rect x="635" y="72" width="185" height="184" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="635" y="72" width="185" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M635 90 h185 v10 h-185 z" fill="#1B3A5F"/>
  <text x="727" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">Tier 4: Acceleration</text>

  <g transform="translate(645, 105)" font-size="9" font-weight="500" fill="#1E293B">
    <rect x="0" y="0" width="165" height="16" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="12">14. Roofline Model Profiler</text>
    <rect x="0" y="18" width="165" height="16" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="30">15. INT8 Quantization</text>
    <rect x="0" y="36" width="165" height="16" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="48">16. Structured Pruning</text>
    <rect x="0" y="54" width="165" height="16" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="66">17. Fused Activation Kernels</text>
    <rect x="0" y="72" width="165" height="16" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="84">18. KV-Cache Engine (O(1))</text>
    <rect x="0" y="90" width="165" height="16" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="6" y="102">19. MLPerf Benchmarking</text>
    <rect x="0" y="108" width="165" height="20" rx="4" fill="#FFF0E6" stroke="#FF8246" stroke-width="1.2"/>
    <text x="82" y="122" text-anchor="middle" fill="#FF5722" font-size="9.5" font-weight="700">20. Capstone &amp; 21. Triton</text>
  </g>

  <!-- SECTION 2: THE 4 VERTICAL SYSTEMS RUNTIME LAYERS (y = 266 to 376) -->
  <rect x="30" y="266" width="790" height="114" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  
  <!-- Left title tag for systems stack -->
  <rect x="30" y="266" width="115" height="114" rx="8" fill="#1B3A5F"/>
  <path d="M135 266 h10 v114 h-10 z" fill="#1B3A5F"/>
  <text x="87" y="316" text-anchor="middle" fill="#FF8246" font-size="11" font-weight="700">SYSTEMS</text>
  <text x="87" y="332" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">STACK</text>
  <text x="87" y="350" text-anchor="middle" fill="#CBD5E1" font-size="9">EXECUTION</text>

  <!-- 4 Horizontal Pipeline Rows -->
  <!-- Layer 1: API -->
  <g transform="translate(155, 274)">
    <rect x="0" y="0" width="150" height="21" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="8" y="14" fill="#1E3A8A" font-size="10" font-weight="700">1. User API Layer</text>
    <text x="160" y="14" fill="#475569" font-size="10">nn.Module, Linear, Sequential, AdamW, Dataset, DataLoader</text>
  </g>

  <!-- Layer 2: Autograd Engine -->
  <g transform="translate(155, 300)">
    <rect x="0" y="0" width="150" height="21" rx="4" fill="#FFF8F0" stroke="#FDBA74"/>
    <text x="8" y="14" fill="#C2410C" font-size="10" font-weight="700">2. Autograd Tape</text>
    <text x="160" y="14" fill="#475569" font-size="10">Dynamic Tape Recording, Reverse Topological Sort, Vector-Jacobian Products</text>
  </g>

  <!-- Layer 3: Tensor Storage Runtime -->
  <g transform="translate(155, 326)">
    <rect x="0" y="0" width="150" height="21" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="8" y="14" fill="#166534" font-size="10" font-weight="700">3. Tensor Runtime</text>
    <text x="160" y="14" fill="#475569" font-size="10">Flat 1D DRAM Storage, Shape/Strides Coordinates, O(1) Zero-Copy Slicing</text>
  </g>

  <!-- Layer 4: Compute Kernels -->
  <g transform="translate(155, 352)">
    <rect x="0" y="0" width="150" height="21" rx="4" fill="#1B3A5F" stroke="#2E6F7E"/>
    <text x="8" y="14" fill="#FF8246" font-size="10" font-weight="700">4. Hardware Kernels</text>
    <text x="160" y="14" fill="#334155" font-size="10" font-weight="600">CPU SIMD Vectorization, Cache-Tiled GEMM, Fused C++ Extensions, Triton JIT</text>
  </g>

  <!-- SECTION 3: BOTTOM SYSTEMS INVARIANT CALLOUT (y = 390 to 445) -->
  <rect x="30" y="390" width="790" height="55" rx="6" fill="#1B3A5F"/>
  <path d="M 45 408 L 52 401 L 49 408 L 54 408 L 46 419 L 48 411 Z" fill="#FF8246"/>
  <text x="60" y="411" fill="#FF8246" font-size="11.5" font-weight="700">The First-Principles Systems Invariant</text>
  <text x="45" y="430" fill="#FFFFFF" font-size="10">Every high-level machine learning abstraction compiles down to 1D DRAM byte ribbon layouts, coordinate strides, and register-level SIMD execution.</text>
</svg>
