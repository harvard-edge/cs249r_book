<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Logical 2D View vs. 1D Contiguous Physical Memory Layout</text>
  <line x1="30" y1="42" x2="850" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== LEFT: LOGICAL 2D TENSOR ==================== -->
  <g transform="translate(40, 70)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#111827">Logical Coordinate Space (A)</text>
    <text x="0" y="16" font-size="11" fill="#4B5563">Shape: [2, 3]  |  Strides: (3, 1)</text>

    <!-- Column indices -->
    <text x="70" y="42" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">j = 0</text>
    <text x="130" y="42" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">j = 1</text>
    <text x="190" y="42" font-size="10" font-weight="600" fill="#6B7280" text-anchor="middle">j = 2</text>

    <!-- Row indices -->
    <text x="28" y="73" font-size="10" font-weight="600" fill="#6B7280" text-anchor="end">i = 0</text>
    <text x="28" y="123" font-size="10" font-weight="600" fill="#6B7280" text-anchor="end">i = 1</text>

    <!-- Grid cells: Row 0 (Active / Highlighted in orange tint) -->
    <rect x="40" y="50" width="60" height="45" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
    <text x="70" y="72" font-size="13" font-weight="700" fill="#C85A17" text-anchor="middle">1.0</text>
    <text x="70" y="87" font-size="9" fill="#9A3412" text-anchor="middle">(0, 0)</text>

    <rect x="100" y="50" width="60" height="45" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
    <text x="130" y="72" font-size="13" font-weight="700" fill="#C85A17" text-anchor="middle">2.0</text>
    <text x="130" y="87" font-size="9" fill="#9A3412" text-anchor="middle">(0, 1)</text>

    <rect x="160" y="50" width="60" height="45" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
    <text x="190" y="72" font-size="13" font-weight="700" fill="#C85A17" text-anchor="middle">3.0</text>
    <text x="190" y="87" font-size="9" fill="#9A3412" text-anchor="middle">(0, 2)</text>

    <!-- Grid cells: Row 1 -->
    <rect x="40" y="95" width="60" height="45" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <text x="70" y="117" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">4.0</text>
    <text x="70" y="132" font-size="9" fill="#6B7280" text-anchor="middle">(1, 0)</text>

    <rect x="100" y="95" width="60" height="45" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <text x="130" y="117" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">5.0</text>
    <text x="130" y="132" font-size="9" fill="#6B7280" text-anchor="middle">(1, 1)</text>

    <rect x="160" y="95" width="60" height="45" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <text x="190" y="117" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">6.0</text>
    <text x="190" y="132" font-size="9" fill="#6B7280" text-anchor="middle">(1, 2)</text>
  </g>

  <!-- ==================== CENTER: STRIDE MAPPING FORMULA ==================== -->
  <g transform="translate(320, 100)">
    <!-- Mapping Arrow -->
    <path d="M 0 50 L 70 50" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <text x="35" y="38" font-size="11" font-weight="600" fill="#C85A17" text-anchor="middle">Strides: (3, 1)</text>

    <!-- Invariant equation box -->
    <rect x="-10" y="80" width="190" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" rx="2" />
    <text x="85" y="98" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">Offset Indexing Equation</text>
    <text x="85" y="116" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#0F172A" text-anchor="middle">Offset = i × 3 + j × 1</text>
    <text x="85" y="130" font-size="9" fill="#64748B" text-anchor="middle">Byte Address = Base + 4 × Offset</text>
  </g>

  <!-- ==================== RIGHT: 1D PHYSICAL CONTIGUOUS MEMORY ==================== -->
  <g transform="translate(510, 70)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#111827">1D Contiguous Physical DRAM Buffer</text>
    <text x="0" y="16" font-size="11" fill="#4B5563">Flat array of 6 × FP32 elements (24 contiguous bytes)</text>

    <!-- Array Elements -->
    <g transform="translate(0, 50)">
      <!-- Element 0 -->
      <rect x="0" y="0" width="55" height="45" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
      <text x="27" y="24" font-size="12" font-weight="700" fill="#C85A17" text-anchor="middle">1.0</text>
      <text x="27" y="38" font-size="9" fill="#9A3412" text-anchor="middle">elem [0]</text>
      <text x="27" y="58" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">+0x00</text>

      <!-- Element 1 -->
      <rect x="55" y="0" width="55" height="45" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
      <text x="82" y="24" font-size="12" font-weight="700" fill="#C85A17" text-anchor="middle">2.0</text>
      <text x="82" y="38" font-size="9" fill="#9A3412" text-anchor="middle">elem [1]</text>
      <text x="82" y="58" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">+0x04</text>

      <!-- Element 2 -->
      <rect x="110" y="0" width="55" height="45" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
      <text x="137" y="24" font-size="12" font-weight="700" fill="#C85A17" text-anchor="middle">3.0</text>
      <text x="137" y="38" font-size="9" fill="#9A3412" text-anchor="middle">elem [2]</text>
      <text x="137" y="58" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">+0x08</text>

      <!-- Element 3 -->
      <rect x="165" y="0" width="55" height="45" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="192" y="24" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">4.0</text>
      <text x="192" y="38" font-size="9" fill="#6B7280" text-anchor="middle">elem [3]</text>
      <text x="192" y="58" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">+0x0C</text>

      <!-- Element 4 -->
      <rect x="220" y="0" width="55" height="45" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="247" y="24" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">5.0</text>
      <text x="247" y="38" font-size="9" fill="#6B7280" text-anchor="middle">elem [4]</text>
      <text x="247" y="58" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">+0x10</text>

      <!-- Element 5 -->
      <rect x="275" y="0" width="55" height="45" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="302" y="24" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">6.0</text>
      <text x="302" y="38" font-size="9" fill="#6B7280" text-anchor="middle">elem [5]</text>
      <text x="302" y="58" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">+0x14</text>

      <!-- Bracket underneath -->
      <path d="M 0 68 L 0 74 L 330 74 L 330 68" stroke="#9CA3AF" stroke-width="1" fill="none" />
      <text x="165" y="88" font-size="10" fill="#4B5563" text-anchor="middle">Contiguous 64-Byte Cache Line Window</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: ZERO-COPY TRANSPOSE INVARIANT ==================== -->
  <g transform="translate(40, 270)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#E5E7EB" stroke-width="1" />
    <text x="0" y="22" font-size="11" font-weight="700" fill="#111827">Systems Principle: Zero-Copy Metadata Transposition (A.T)</text>
    <text x="0" y="38" font-size="10.5" fill="#4B5563">
      Calling <tspan font-family="monospace" font-weight="600" fill="#111827">A.transpose()</tspan> creates a view by swapping strides to <tspan font-family="monospace" font-weight="600" fill="#C85A17">(1, 3)</tspan> and shape to <tspan font-family="monospace" font-weight="600" fill="#C85A17">[3, 2]</tspan>. Physical memory is untouched ($0\text{ bytes copied}$).
    </text>
    <text x="0" y="54" font-size="10" fill="#6B7280">
      Transposed memory reads traverse indices <tspan font-family="monospace" fill="#111827">0 → 3 → 1 → 4 → 2 → 5</tspan>, sacrificing contiguous L1 cache locality for $O(1)$ constant-time view construction.
    </text>
  </g>
</svg>
