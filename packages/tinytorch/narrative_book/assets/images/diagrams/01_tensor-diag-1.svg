<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 475" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="445" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="15" y="15" width="820" height="46" rx="10" fill="url(#torchGrad)"/>
  <path d="M15 51 h820 v10 h-820 z" fill="url(#torchGrad)" />
  <text x="35" y="44" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.3">TENSOR ARCHITECTURE: N-D METADATA VS 1D CONTIGUOUS DRAM</text>
  <rect x="630" y="27" width="185" height="22" rx="11" fill="#FF8246"/>
  <text x="722" y="42" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">ZERO-COPY VIEWS &amp; STRIDES</text>

  <!-- LEFT CARD: N-D LOGICAL COORDINATE SPACE (x=30, y=72, w=380, h=308) -->
  <rect x="30" y="72" width="380" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="72" width="380" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M30 90 h380 v10 h-380 z" fill="#1B3A5F"/>
  <text x="45" y="91" fill="#FFFFFF" font-size="12" font-weight="700">1. Logical View &amp; Coordinate Indexing</text>

  <!-- Sub-block A: Standard 2x3 Matrix -->
  <g transform="translate(45, 108)">
    <text x="0" y="12" fill="#1B3A5F" font-size="11" font-weight="700">A [Shape: (2, 3), Strides: (3, 1), Offset: 0]</text>
    
    <!-- 2x3 Grid Table -->
    <g transform="translate(0, 20)" font-size="11" text-anchor="middle">
      <!-- Row 0 -->
      <rect x="0" y="0" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <text x="35" y="16" fill="#1B3A5F" font-weight="700">1.0</text>
      <text x="35" y="29" fill="#FF8246" font-size="9">(0,0)</text>

      <rect x="76" y="0" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <text x="111" y="16" fill="#1B3A5F" font-weight="700">2.0</text>
      <text x="111" y="29" fill="#FF8246" font-size="9">(0,1)</text>

      <rect x="152" y="0" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2"/>
      <text x="187" y="16" fill="#1B3A5F" font-weight="700">3.0</text>
      <text x="187" y="29" fill="#FF8246" font-size="9">(0,2)</text>

      <!-- Row 1 -->
      <rect x="0" y="38" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2"/>
      <text x="35" y="54" fill="#1B3A5F" font-weight="700">4.0</text>
      <text x="35" y="67" fill="#2E6F7E" font-size="9">(1,0)</text>

      <rect x="76" y="38" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2"/>
      <text x="111" y="54" fill="#1B3A5F" font-weight="700">5.0</text>
      <text x="111" y="67" fill="#2E6F7E" font-size="9">(1,1)</text>

      <rect x="152" y="38" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2"/>
      <text x="187" y="54" fill="#1B3A5F" font-weight="700">6.0</text>
      <text x="187" y="67" fill="#2E6F7E" font-size="9">(1,2)</text>

      <!-- Metadata summary badge -->
      <rect x="232" y="0" width="118" height="72" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
      <text x="291" y="18" fill="#1E3A8A" font-size="9.5" font-weight="700">Row-Major C Layout</text>
      <text x="291" y="34" fill="#475569" font-size="9">Stride[0] = 3 items</text>
      <text x="291" y="48" fill="#475569" font-size="9">Stride[1] = 1 item</text>
      <text x="291" y="62" fill="#166534" font-size="8.5" font-weight="600">Contiguous: True</text>
    </g>
  </g>

  <!-- Sub-block B: Zero-Copy Views (Transpose & Stride-0 Broadcasting) -->
  <g transform="translate(45, 218)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Transpose Box -->
    <rect x="0" y="10" width="170" height="66" rx="4" fill="#FFF8F0" stroke="#FDBA74"/>
    <text x="10" y="26" fill="#C2410C" font-size="10" font-weight="700">Transpose View (A.T)</text>
    <text x="10" y="41" fill="#1E293B" font-size="9">Shape: (3, 2) | Strides: (1, 3)</text>
    <text x="10" y="55" fill="#475569" font-size="8.5">Swaps stride tuple in O(1)</text>
    <text x="10" y="67" fill="#D97706" font-size="8.5" font-weight="600">Zero byte copying!</text>

    <!-- Stride-0 Broadcast Box -->
    <rect x="180" y="10" width="170" height="66" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="190" y="26" fill="#166534" font-size="10" font-weight="700">Stride-0 Broadcast (1×3→2×3)</text>
    <text x="190" y="41" fill="#1E293B" font-size="9">Shape: (2, 3) | Strides: (0, 1)</text>
    <text x="190" y="55" fill="#475569" font-size="8.5">Stride 0 repeats row without copy</text>
    <text x="190" y="67" fill="#16A34A" font-size="8.5" font-weight="600">0 bytes DRAM allocated</text>
  </g>

  <!-- FLOW ARROW (Between Left & Right Cards) -->
  <path d="M418 160 H432" stroke="#FF8246" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- RIGHT CARD: PHYSICAL 1D CONTIGUOUS DRAM BUFFER (x=440, y=72, w=380, h=308) -->
  <rect x="440" y="72" width="380" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="440" y="72" width="380" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M440 90 h380 v10 h-380 z" fill="#1B3A5F"/>
  <text x="455" y="91" fill="#FFFFFF" font-size="12" font-weight="700">2. Physical Storage (Flat 1D DRAM Ribbon)</text>

  <!-- 1D Buffer Ribbon -->
  <g transform="translate(455, 114)">
    <text x="0" y="12" fill="#1B3A5F" font-size="11" font-weight="700">Contiguous Byte Addresses (float32 = 4 bytes)</text>
    
    <!-- Flat buffer array -->
    <g transform="translate(0, 24)" font-size="10.5" text-anchor="middle">
      <rect x="0" y="0" width="56" height="46" rx="3" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.5"/>
      <text x="28" y="20" fill="#1B3A5F" font-weight="700">1.0</text>
      <text x="28" y="32" fill="#64748B" font-size="8.5">idx 0</text>
      <text x="28" y="42" fill="#FF8246" font-size="7.5">0x00</text>

      <rect x="58" y="0" width="56" height="46" rx="3" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.5"/>
      <text x="86" y="20" fill="#1B3A5F" font-weight="700">2.0</text>
      <text x="86" y="32" fill="#64748B" font-size="8.5">idx 1</text>
      <text x="86" y="42" fill="#FF8246" font-size="7.5">0x04</text>

      <rect x="116" y="0" width="56" height="46" rx="3" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.5"/>
      <text x="144" y="20" fill="#1B3A5F" font-weight="700">3.0</text>
      <text x="144" y="32" fill="#64748B" font-size="8.5">idx 2</text>
      <text x="144" y="42" fill="#FF8246" font-size="7.5">0x08</text>

      <rect x="174" y="0" width="56" height="46" rx="3" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.5"/>
      <text x="202" y="20" fill="#1B3A5F" font-weight="700">4.0</text>
      <text x="202" y="32" fill="#64748B" font-size="8.5">idx 3</text>
      <text x="202" y="42" fill="#2E6F7E" font-size="7.5">0x0C</text>

      <rect x="232" y="0" width="56" height="46" rx="3" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.5"/>
      <text x="260" y="20" fill="#1B3A5F" font-weight="700">5.0</text>
      <text x="260" y="32" fill="#64748B" font-size="8.5">idx 4</text>
      <text x="260" y="42" fill="#2E6F7E" font-size="7.5">0x10</text>

      <rect x="290" y="0" width="56" height="46" rx="3" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.5"/>
      <text x="318" y="20" fill="#1B3A5F" font-weight="700">6.0</text>
      <text x="318" y="32" fill="#64748B" font-size="8.5">idx 5</text>
      <text x="318" y="42" fill="#2E6F7E" font-size="7.5">0x14</text>
    </g>

    <!-- Cache Line Prefetch Banner -->
    <rect x="0" y="80" width="346" height="24" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="173" y="96" text-anchor="middle" fill="#1E3A8A" font-size="9.5" font-weight="600">64-Byte CPU Cache Line: Single Burst Fetch loads all 6 floats</text>
  </g>

  <!-- Coordinate Translation Box -->
  <g transform="translate(455, 232)">
    <rect x="0" y="0" width="350" height="66" rx="6" fill="#1B3A5F"/>
    <text x="12" y="18" fill="#FF8246" font-size="10.5" font-weight="700">Coordinate Translation Formula</text>
    <text x="12" y="36" fill="#FFFFFF" font-size="10">Offset = StorageOffset + Σ (Coord[k] × Stride[k])</text>
    <text x="12" y="52" fill="#CBD5E1" font-size="9">Example: Index(1, 2) = 0 + (1 × 3) + (2 × 1) = Flat Offset 5 (Val = 6.0)</text>
  </g>

  <!-- BOTTOM INVARIANT CALLOUT (y = 390 to 445) -->
  <rect x="30" y="390" width="790" height="55" rx="6" fill="#1B3A5F"/>
  <path d="M 45 408 L 52 401 L 49 408 L 54 408 L 46 419 L 48 411 Z" fill="#FF8246"/>
  <text x="60" y="411" fill="#FF8246" font-size="11.5" font-weight="700">The Zero-Copy View Invariant (c10::TensorImpl Principle)</text>
  <text x="45" y="430" fill="#FFFFFF" font-size="10">Reshape, transpose, slice, and broadcast operations never duplicate or allocate DRAM buffers; they alter lightweight metadata in O(1) time.</text>
</svg>
