<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 475" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="445" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="15" y="15" width="820" height="46" rx="10" fill="url(#torchGrad)"/>
  <path d="M15 51 h820 v10 h-820 z" fill="url(#torchGrad)" />
  <text x="35" y="44" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.3">MODULAR LAYERS: PARAMETER CONTAINERS &amp; KAIMING HE INITIALIZATION</text>
  <rect x="635" y="27" width="180" height="22" rx="11" fill="#FF8246"/>
  <text x="725" y="42" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">AFFINE PASS &amp; DROPOUT</text>

  <!-- 3 MAIN PANELS (y = 72 to 380) -->

  <!-- PANEL 1: MODULAR LINEAR LAYER (x=30, w=250) -->
  <rect x="30" y="72" width="250" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="72" width="250" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M30 90 h250 v10 h-250 z" fill="#1B3A5F"/>
  <text x="155" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Modular Linear Layer Container</text>

  <g transform="translate(42, 108)" font-size="9.5">
    <rect x="0" y="0" width="226" height="30" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="113" y="19" text-anchor="middle" fill="#1E3A8A" font-weight="700">Forward: Y = X · W^T + b</text>

    <rect x="0" y="36" width="226" height="66" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="52" fill="#1B3A5F" font-weight="600">• Input X:</text>
    <text x="85" y="52" fill="#475569">[Batch, In_Features]</text>
    <text x="8" y="68" fill="#1B3A5F" font-weight="600">• Weight W:</text>
    <text x="85" y="68" fill="#475569">[Out_Features, In_Features]</text>
    <text x="8" y="84" fill="#1B3A5F" font-weight="600">• Bias b:</text>
    <text x="85" y="84" fill="#475569">[Out_Features] (broadcasted)</text>
    <text x="8" y="96" fill="#166534" font-size="8.5">• Output Y:</text>
    <text x="85" y="96" fill="#166534" font-size="8.5">[Batch, Out_Features]</text>

    <rect x="0" y="108" width="226" height="68" rx="4" fill="#FFF8F0" stroke="#FDBA74"/>
    <text x="8" y="122" fill="#C2410C" font-weight="700">Parameter Registration Tree</text>
    <text x="8" y="137" fill="#1E293B">layer.parameters() → [W, b]</text>
    <text x="8" y="152" fill="#475569">Auto-registers learnable tensors</text>
    <text x="8" y="167" fill="#475569">Allocates grad accumulators: W.grad</text>
  </g>

  <!-- PANEL 2: KAIMING HE INITIALIZATION (x=290, w=270) -->
  <rect x="290" y="72" width="270" height="308" rx="8" fill="#FFF8F0" stroke="#FF8246" stroke-width="1.6"/>
  <rect x="290" y="72" width="270" height="28" rx="8" fill="#FF8246"/>
  <path d="M290 90 h270 v10 h-270 z" fill="#FF8246"/>
  <text x="425" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">2. Kaiming He Variance Law</text>

  <g transform="translate(302, 108)" font-size="9.5">
    <rect x="0" y="0" width="246" height="42" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text x="8" y="14" fill="#991B1B" font-weight="700">The Exploding Variance Crisis:</text>
    <text x="8" y="27" fill="#7F1D1D" font-size="8.5">W ~ N(0, 1) → Var(Y_10) = (D_in)¹⁰ ≈ 10³⁰</text>
    <text x="8" y="38" fill="#7F1D1D" font-size="8.5">Floating-point overflow into +inf! [Unstable]</text>

    <rect x="0" y="48" width="246" height="74" rx="4" fill="#FFFFFF" stroke="#FDBA74"/>
    <text x="8" y="62" fill="#C2410C" font-weight="700">Variance Preservation Proof:</text>
    <text x="8" y="76" fill="#1E293B">Var(ReLU(x)) = ½ Var(x)</text>
    <text x="8" y="90" fill="#1E293B">Var(y) = D_in × (½ Var(x)) × Var(W)</text>
    <text x="8" y="105" fill="#166534" font-weight="700">Enforce Var(y) = Var(x) ⇒ Var(W) = 2 / D_in</text>
    <text x="8" y="117" fill="#166534" font-weight="700">σ_w = √(2 / D_in)</text>

    <rect x="0" y="128" width="246" height="48" rx="4" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="8" y="142" fill="#92400E" font-weight="700">Sampling Distributions:</text>
    <text x="8" y="156" fill="#1E293B">Normal: W ~ N(0, √(2 / D_in))</text>
    <text x="8" y="169" fill="#1E293B">Uniform: W ~ U(-√(6/D_in), +√(6/D_in))</text>
  </g>

  <!-- PANEL 3: INVERTED DROPOUT (x=570, w=250) -->
  <rect x="570" y="72" width="250" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="570" y="72" width="250" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M570 90 h250 v10 h-250 z" fill="#1B3A5F"/>
  <text x="695" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Inverted Dropout Scaling</text>

  <g transform="translate(582, 108)" font-size="9.5">
    <rect x="0" y="0" width="226" height="80" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="8" y="15" fill="#1E3A8A" font-weight="700">Training Phase (mode = True)</text>
    <text x="8" y="30" fill="#1E293B">Mask: m ~ Bernoulli(1 - p)</text>
    <text x="8" y="46" fill="#1E3A8A" font-weight="600">Scaling Invariant: Y = (X ⊙ m) / (1 - p)</text>
    <text x="8" y="60" fill="#475569">Zeroes out fraction p of units</text>
    <text x="8" y="74" fill="#166534" font-weight="600">Preserves E[Y] = E[X]</text>

    <rect x="0" y="88" width="226" height="88" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="8" y="103" fill="#166534" font-weight="700">Evaluation Phase (mode = False)</text>
    <text x="8" y="119" fill="#1E293B">Forward: Y = X (Exact Identity)</text>
    <text x="8" y="135" fill="#166534" font-weight="700">Zero-Cost Inference Invariant:</text>
    <text x="8" y="150" fill="#475569">No masking, no scaling multiplier.</text>
    <text x="8" y="165" fill="#15803D" font-weight="600">O(1) No-Op at runtime!</text>
  </g>

  <!-- BOTTOM INVARIANT CALLOUT (y = 390 to 445) -->
  <rect x="30" y="390" width="790" height="55" rx="6" fill="#1B3A5F"/>
  <path d="M 45 408 L 52 401 L 49 408 L 54 408 L 46 419 L 48 411 Z" fill="#FF8246"/>
  <text x="60" y="411" fill="#FF8246" font-size="11.5" font-weight="700">The Variance Conservation &amp; Modular Encapsulation Invariant</text>
  <text x="45" y="430" fill="#FFFFFF" font-size="10">Layers encapsulate learnable state and enforce unit variance flow (σ = √(2/D_in)). Inverted dropout ensures evaluation is a zero-cost identity operation.</text>
</svg>
