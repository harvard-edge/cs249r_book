<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Scaled Dot-Product Attention Dataflow &amp; Memory Dimensions</text>
  <line x1="30" y1="42" x2="850" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== MAIN DATAFLOW PIPELINE ==================== -->
  <g transform="translate(40, 70)">

    <!-- INPUT TENSORS (Q, K, V) -->
    <!-- Query Q -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="80" height="42" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <text x="40" y="24" font-size="13" font-weight="700" fill="#C85A17" text-anchor="middle">Q</text>
      <text x="40" y="56" font-size="10" font-family="monospace" fill="#6B7280" text-anchor="middle">[B, H, S, d_k]</text>
    </g>

    <!-- Key K -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="80" height="42" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="40" y="24" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">K</text>
      <text x="40" y="56" font-size="10" font-family="monospace" fill="#6B7280" text-anchor="middle">[B, H, S, d_k]</text>
    </g>

    <!-- Value V -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="80" height="42" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="40" y="24" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">V</text>
      <text x="40" y="236" font-size="10" font-family="monospace" fill="#6B7280" text-anchor="middle">[B, H, S, d_v]</text>
    </g>

    <!-- Arrows from Q & K into MatMul 1 -->
    <path d="M 80 41 L 135 65" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <path d="M 80 116 L 135 95" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
    <text x="110" y="130" font-size="9" font-family="monospace" fill="#4B5563">K^T [d_k, S]</text>

    <!-- MatMul 1 (Q @ K.T) -->
    <g transform="translate(135, 54)">
      <circle cx="26" cy="26" r="24" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="26" y="30" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">MatMul</text>
    </g>

    <!-- Arrow to Scale -->
    <path d="M 185 80 L 230 80" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
    <text x="208" y="52" font-size="9" font-family="monospace" fill="#6B7280" text-anchor="middle">[B, H, S, S]</text>

    <!-- Scale 1 / sqrt(d_k) -->
    <g transform="translate(235, 58)">
      <rect x="0" y="0" width="75" height="44" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="37" y="22" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Scale</text>
      <text x="37" y="36" font-size="10" font-family="'Times New Roman', serif" font-style="italic" fill="#C85A17" text-anchor="middle">1 / √d_k</text>
    </g>

    <!-- Arrow to Mask -->
    <path d="M 310 80 L 355 80" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

    <!-- Causal Mask Block -->
    <g transform="translate(360, 50)">
      <rect x="0" y="0" width="85" height="60" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <text x="42" y="18" font-size="10.5" font-weight="700" fill="#C85A17" text-anchor="middle">Causal Mask</text>
      <!-- Mini mask grid (lower triangular) -->
      <g transform="translate(26, 26)">
        <rect x="0" y="0" width="8" height="8" fill="#C85A17" />
        <rect x="10" y="0" width="8" height="8" fill="#E5E7EB" />
        <rect x="20" y="0" width="8" height="8" fill="#E5E7EB" />
        <rect x="0" y="10" width="8" height="8" fill="#C85A17" />
        <rect x="10" y="10" width="8" height="8" fill="#C85A17" />
        <rect x="20" y="10" width="8" height="8" fill="#E5E7EB" />
        <rect x="0" y="20" width="8" height="8" fill="#C85A17" />
        <rect x="10" y="20" width="8" height="8" fill="#C85A17" />
        <rect x="20" y="20" width="8" height="8" fill="#C85A17" />
      </g>
    </g>

    <!-- Arrow to Softmax -->
    <path d="M 445 80 L 490 80" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

    <!-- Softmax Operator -->
    <g transform="translate(495, 58)">
      <rect x="0" y="0" width="75" height="44" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="37" y="26" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Softmax</text>
      <text x="37" y="38" font-size="8.5" fill="#6B7280" text-anchor="middle">(dim = -1)</text>
    </g>

    <!-- Attention Weights Matrix Arrow to MatMul 2 -->
    <path d="M 570 80 L 635 125" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <text x="590" y="112" font-size="9.5" font-family="monospace" fill="#C85A17">Scores [S, S]</text>

    <!-- Value Tensor Wire bypass to MatMul 2 -->
    <path d="M 80 201 L 600 201 L 635 155" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />

    <!-- MatMul 2 (Weights @ V) -->
    <g transform="translate(635, 116)">
      <circle cx="26" cy="26" r="24" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="26" y="30" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">MatMul</text>
    </g>

    <!-- Output Arrow -->
    <path d="M 687 142 L 730 142" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

    <!-- Output Context Tensor -->
    <g transform="translate(735, 120)">
      <rect x="0" y="0" width="85" height="44" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <text x="42" y="22" font-size="12" font-weight="700" fill="#C85A17" text-anchor="middle">Output</text>
      <text x="42" y="36" font-size="9.5" font-family="monospace" fill="#9A3412" text-anchor="middle">[B, H, S, d_v]</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: MATHEMATICAL & HARDWARE NOTES ==================== -->
  <g transform="translate(40, 310)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#E5E7EB" stroke-width="1" />
    <text x="0" y="22" font-size="11" font-weight="700" fill="#111827">Mathematical Invariant:</text>
    <text x="145" y="22" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">
      Attention(Q, K, V) = Softmax( (Q K^T) / √d_k + M_causal ) V
    </text>
    <text x="0" y="42" font-size="10" fill="#4B5563">
      <tspan font-weight="600" fill="#111827">FlashAttention Optimization:</tspan> Computes softmax scaling incrementally in on-chip SRAM blocks (128 KB), eliminating the need to materialize the intermediate O(S²) attention matrix in off-chip DRAM.
    </text>
  </g>
</svg>
