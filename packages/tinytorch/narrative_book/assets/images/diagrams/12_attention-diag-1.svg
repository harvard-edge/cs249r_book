<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Navy Header Banner -->
  <rect x="15" y="15" width="820" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="15" y="45" width="820" height="20" fill="url(#headerGrad)"/>
  <text x="35" y="46" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">SCALED DOT-PRODUCT MULTI-HEAD ATTENTION &amp; CAUSAL MASKING</text>
  <rect x="670" y="27" width="145" height="24" rx="12" fill="#FF8246"/>
  <text x="742" y="43" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">O(T²) ATTENTION</text>

  <!-- Panel 1: Q, K, V Projections (Left) -->
  <rect x="30" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="30" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="42" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Linear Q, K, V Projections</text>

  <!-- Input X -->
  <text x="42" y="120" fill="#1E293B" font-size="10" font-weight="700">Input Sequence X [B, T, d_model]</text>
  
  <g transform="translate(42, 128)">
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#1B3A5F"/>
    <text x="110" y="16" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Tensor X : [Batch=1, Time=T, Dim=768]</text>

    <!-- Branch Arrows to Q, K, V -->
    <path d="M40 24 V44" stroke="#FF8246" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
    <path d="M110 24 V44" stroke="#2E6F7E" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
    <path d="M180 24 V44" stroke="#1B3A5F" stroke-width="1.8" marker-end="url(#arrowNavy)"/>

    <!-- Projection Boxes -->
    <rect x="10" y="44" width="60" height="32" rx="3" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.2"/>
    <text x="40" y="58" fill="#FF5722" font-size="8.5" font-weight="700" text-anchor="middle">Query (Q)</text>
    <text x="40" y="70" fill="#FF5722" font-size="7.5" text-anchor="middle">X · W_q</text>

    <rect x="80" y="44" width="60" height="32" rx="3" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="110" y="58" fill="#00695C" font-size="8.5" font-weight="700" text-anchor="middle">Key (K)</text>
    <text x="110" y="70" fill="#00695C" font-size="7.5" text-anchor="middle">X · W_k</text>

    <rect x="150" y="44" width="60" height="32" rx="3" fill="#F1F5F9" stroke="#1B3A5F" stroke-width="1.2"/>
    <text x="180" y="58" fill="#1B3A5F" font-size="8.5" font-weight="700" text-anchor="middle">Value (V)</text>
    <text x="180" y="70" fill="#1B3A5F" font-size="7.5" text-anchor="middle">X · W_v</text>
  </g>

  <!-- Multi-Head Subspace Split Info -->
  <rect x="40" y="218" width="225" height="126" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="48" y="235" fill="#1B3A5F" font-size="9.5" font-weight="700">Multi-Head Subspace Partitioning:</text>
  <text x="48" y="250" fill="#475569" font-size="8.5">• d_k = d_model / n_heads = 768 / 12 = 64</text>
  <text x="48" y="264" fill="#475569" font-size="8.5">• Reshapes tensor to [B, n_heads, T, d_k]</text>
  <text x="48" y="278" fill="#00695C" font-size="8.5" font-weight="600">• Head 1: Syntactic grammatical links</text>
  <text x="48" y="292" fill="#00695C" font-size="8.5" font-weight="600">• Head 2: Long-range pronoun coreference</text>
  <text x="48" y="306" fill="#00695C" font-size="8.5" font-weight="600">• Head 3: Factual token associations</text>
  <text x="48" y="322" fill="#FF5722" font-size="8.5" font-weight="700">→ Parallel Independent Attention Maps</text>

  <!-- Panel 2: Scaled Dot-Product & Causal Mask (Center) -->
  <rect x="290" y="78" width="270" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="290" y="78" width="270" height="28" rx="8" fill="#2E6F7E"/>
  <rect x="290" y="96" width="270" height="10" fill="#2E6F7E"/>
  <text x="302" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">2. Scaled Dot-Product &amp; Causal Mask</text>

  <!-- Connect Arrow Left to Center -->
  <path d="M276 175 H288" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Attention Formula Box -->
  <g transform="translate(300, 114)">
    <rect x="0" y="0" width="250" height="30" rx="4" fill="#1B3A5F"/>
    <text x="125" y="19" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Attn(Q,K,V) = softmax( (QKᵀ / √d_k) + M ) · V</text>
  </g>

  <!-- Causal Lower-Triangular Mask Graphic -->
  <g transform="translate(300, 150)">
    <text x="0" y="10" fill="#1E293B" font-size="9.5" font-weight="700">Causal Mask M [T=4, T=4]:</text>
    
    <!-- 4x4 Attention Mask Matrix -->
    <g transform="translate(10, 16)" font-size="8" text-anchor="middle">
      <!-- Row 0: Token 0 -->
      <rect x="0" y="0" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="11" y="11" fill="#00695C" font-weight="700">0.0</text>
      <rect x="24" y="0" width="22" height="16" fill="#FFE8DC" stroke="#FF5722"/><text x="35" y="11" fill="#D22341">-∞</text>
      <rect x="48" y="0" width="22" height="16" fill="#FFE8DC" stroke="#FF5722"/><text x="59" y="11" fill="#D22341">-∞</text>
      <rect x="72" y="0" width="22" height="16" fill="#FFE8DC" stroke="#FF5722"/><text x="83" y="11" fill="#D22341">-∞</text>

      <!-- Row 1: Token 1 -->
      <rect x="0" y="18" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="11" y="29" fill="#00695C" font-weight="700">0.0</text>
      <rect x="24" y="18" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="35" y="29" fill="#00695C" font-weight="700">0.0</text>
      <rect x="48" y="18" width="22" height="16" fill="#FFE8DC" stroke="#FF5722"/><text x="59" y="29" fill="#D22341">-∞</text>
      <rect x="72" y="18" width="22" height="16" fill="#FFE8DC" stroke="#FF5722"/><text x="83" y="29" fill="#D22341">-∞</text>

      <!-- Row 2: Token 2 -->
      <rect x="0" y="36" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="11" y="47" fill="#00695C" font-weight="700">0.0</text>
      <rect x="24" y="36" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="35" y="47" fill="#00695C" font-weight="700">0.0</text>
      <rect x="48" y="36" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="59" y="47" fill="#00695C" font-weight="700">0.0</text>
      <rect x="72" y="36" width="22" height="16" fill="#FFE8DC" stroke="#FF5722"/><text x="83" y="47" fill="#D22341">-∞</text>

      <!-- Row 3: Token 3 -->
      <rect x="0" y="54" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="11" y="65" fill="#00695C" font-weight="700">0.0</text>
      <rect x="24" y="54" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="35" y="65" fill="#00695C" font-weight="700">0.0</text>
      <rect x="48" y="54" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="59" y="65" fill="#00695C" font-weight="700">0.0</text>
      <rect x="72" y="54" width="22" height="16" fill="#E0F2F1" stroke="#2E6F7E"/><text x="83" y="65" fill="#00695C" font-weight="700">0.0</text>
    </g>

    <!-- Explanatory text next to matrix -->
    <g transform="translate(112, 18)" font-size="8.5">
      <text x="0" y="12" fill="#00695C" font-weight="700">✓  Lower-Triangular:</text>
      <text x="0" y="24" fill="#475569">Attends to past tokens</text>

      <text x="0" y="42" fill="#D22341" font-weight="700">✕  Upper-Triangular (-∞):</text>
      <text x="0" y="54" fill="#475569">softmax(-∞) = 0.000</text>
      <text x="0" y="66" fill="#D22341" font-weight="600">Zero future leakage!</text>
    </g>
  </g>

  <!-- Variance Scaling Callout -->
  <rect x="300" y="248" width="250" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="308" y="265" fill="#FF8246" font-size="9.5" font-weight="700">⚡ 1/√d_k Variance Stabilization:</text>
  <text x="308" y="280" fill="#475569" font-size="8.5">• Var(q_i · k_i) = 1 → Var(∑ q · k) = d_k = 64</text>
  <text x="308" y="294" fill="#475569" font-size="8.5">• Without 1/√d_k: logits reach ±20 to ±50</text>
  <text x="308" y="308" fill="#D22341" font-size="8.5" font-weight="600">• Softmax saturates → all gradients ∂A/∂z ≈ 0</text>
  <text x="308" y="324" fill="#00695C" font-size="8.5" font-weight="700">✓ Scaling keeps Var = 1.0 &amp; gradients healthy</text>

  <!-- Panel 3: Multi-Head Fusion & FlashAttention (Right) -->
  <rect x="575" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="575" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="575" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="587" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Head Concatenation &amp; Output</text>

  <!-- Connect Arrow Center to Right -->
  <path d="M561 175 H573" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Output Projection Pipeline -->
  <text x="587" y="120" fill="#1E293B" font-size="10" font-weight="700">Head Concatenation &amp; W_o:</text>
  <g transform="translate(585, 126)">
    <!-- Concat heads box -->
    <rect x="0" y="0" width="225" height="26" rx="3" fill="#E0F2F1" stroke="#2E6F7E"/>
    <text x="112" y="16" fill="#00695C" font-size="8.5" font-weight="700" text-anchor="middle">Concat(head₁, head₂, ..., head₁₂) : [B, T, 768]</text>

    <path d="M112 26 V36" stroke="#2E6F7E" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

    <!-- Linear Output Projection -->
    <rect x="0" y="36" width="225" height="26" rx="3" fill="#1B3A5F"/>
    <text x="112" y="52" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Linear Output: Y = Concat · W_o [768, 768]</text>

    <path d="M112 62 V72" stroke="#FF8246" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Final Output Tensor -->
    <rect x="0" y="72" width="225" height="24" rx="3" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.2"/>
    <text x="112" y="87" fill="#D22341" font-size="8.5" font-weight="700" text-anchor="middle">MHA Output : [Batch, Time, d_model]</text>
  </g>

  <!-- FlashAttention Tiling Concept Box -->
  <rect x="585" y="235" width="225" height="109" rx="6" fill="#1B3A5F"/>
  <text x="595" y="252" fill="#FF8246" font-size="9.5" font-weight="700">⚡ FlashAttention Hardware Tiling</text>
  <text x="595" y="267" fill="#FFFFFF" font-size="8.5">• Standard: Allocates full O(T²) DRAM matrix</text>
  <text x="595" y="281" fill="#CBD5E1" font-size="8.5">• FlashAttention: Tiles Q, K, V in on-chip SRAM</text>
  <text x="595" y="295" fill="#CBD5E1" font-size="8.5">• Online Softmax: Incremental normalization</text>
  <text x="595" y="309" fill="#38BDF8" font-size="8.5" font-weight="600">• 0 bytes DRAM footprint for T × T attention</text>
  <text x="595" y="325" fill="#4ADE80" font-size="8.5" font-weight="700">→ 3x Faster &amp; 10x Less GPU Memory</text>

  <!-- Bottom Systems Invariant Callout Banner -->
  <rect x="30" y="368" width="790" height="54" rx="8" fill="#1B3A5F"/>
  <text x="45" y="388" fill="#FF8246" font-size="11" font-weight="700">⚡ Scaled Variance Invariant: Var(Q_i · K_jᵀ) = d_k → Softmax Entropy Stability</text>
  <text x="45" y="406" fill="#F8FAFC" font-size="9.5">Dividing by √d_k guarantees standard unit variance Var = 1.0 across the attention logits, preventing extreme values</text>
  <text x="45" y="418" fill="#CBD5E1" font-size="9.5">from pushing softmax into flat saturation zones where backpropagation gradients vanish to zero.</text>

</svg>
