<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="embedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Navy Header Banner -->
  <rect x="15" y="15" width="820" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="15" y="45" width="820" height="20" fill="url(#headerGrad)"/>
  <text x="35" y="46" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">TOKEN EMBEDDING LOOKUPS &amp; SINUSOIDAL POSITIONAL ENCODINGS</text>
  <rect x="670" y="27" width="145" height="24" rx="12" fill="#FF8246"/>
  <text x="742" y="43" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">TEMPORAL MANIFOLD</text>

  <!-- Panel 1: Embedding Table Gather (Left) -->
  <rect x="30" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="30" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="42" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Token ID Gather (DRAM Slicing)</text>

  <!-- Input Token IDs -->
  <text x="42" y="122" fill="#1E293B" font-size="10" font-weight="700">Input IDs: [1542, 42, 8931]</text>

  <!-- Embedding Table Matrix -->
  <g transform="translate(42, 130)">
    <!-- Header of table -->
    <rect x="0" y="0" width="125" height="16" fill="#1B3A5F" rx="2"/>
    <text x="62" y="11" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">W_embed [V=50257, d=768]</text>

    <!-- Table Rows -->
    <rect x="0" y="18" width="125" height="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="6" y="28" fill="#64748B" font-size="7.5">Row 0</text>
    
    <text x="62" y="42" fill="#64748B" font-size="8" text-anchor="middle">⋮</text>

    <!-- Target Row 1542 (Highlighted) -->
    <rect x="0" y="46" width="125" height="16" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.2" rx="2"/>
    <text x="6" y="58" fill="#FF5722" font-size="8" font-weight="700">Row 1542 ["king"]</text>

    <text x="62" y="72" fill="#64748B" font-size="8" text-anchor="middle">⋮</text>

    <rect x="0" y="76" width="125" height="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="6" y="86" fill="#64748B" font-size="7.5">Row 50256</text>

    <!-- Pointer Arrow -->
    <path d="M130 54 H155" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <!-- Gathered Vector Box -->
    <rect x="160" y="38" width="60" height="32" rx="3" fill="#1B3A5F"/>
    <text x="190" y="52" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">E_token</text>
    <text x="190" y="63" fill="#FF8246" font-size="7.5" font-weight="600" text-anchor="middle">[1 × 768]</text>
  </g>

  <!-- Systems Gather Card -->
  <rect x="40" y="238" width="225" height="106" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="48" y="254" fill="#00695C" font-size="10" font-weight="700">✓ Zero-FLOP Pointer Indexing</text>
  <text x="48" y="270" fill="#475569" font-size="8.5">• No matrix multiplication or GEMM FLOPs</text>
  <text x="48" y="284" fill="#475569" font-size="8.5">• Pure O(1) DRAM address stride gather</text>
  <text x="48" y="298" fill="#475569" font-size="8.5">• Gradients update only accessed token rows</text>
  <text x="48" y="312" fill="#475569" font-size="8.5">• Memory bandwidth bound lookup</text>
  <text x="48" y="328" fill="#00695C" font-size="8.5" font-weight="600">→ High Memory Locality</text>

  <!-- Panel 2: Sinusoidal Positional Encodings (Center) -->
  <rect x="290" y="78" width="270" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="290" y="78" width="270" height="28" rx="8" fill="#2E6F7E"/>
  <rect x="290" y="96" width="270" height="10" fill="#2E6F7E"/>
  <text x="302" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">2. Sinusoidal Fourier Waveforms</text>

  <!-- Connect Arrow Left to Center -->
  <path d="M276 175 H288" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Sinusoid Formulas -->
  <g transform="translate(300, 116)">
    <rect x="0" y="0" width="250" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="14" fill="#1B3A5F" font-size="8.5" font-weight="700">PE(pos, 2i) = sin(pos / 10000^(2i/d))</text>
    <text x="8" y="27" fill="#2E6F7E" font-size="8.5" font-weight="700">PE(pos, 2i+1) = cos(pos / 10000^(2i/d))</text>
  </g>

  <!-- Waveform Curves Plot -->
  <g transform="translate(300, 160)">
    <rect x="0" y="0" width="250" height="88" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    
    <!-- Axis line -->
    <line x1="8" y1="44" x2="242" y2="44" stroke="#E2E8F0" stroke-width="1"/>

    <!-- High Frequency Wave (Low dim i=0: Orange) -->
    <path d="M10 44 Q 22 14, 34 44 T 58 44 T 82 44 T 106 44 T 130 44 T 154 44 T 178 44 T 202 44 T 226 44 T 240 44" fill="none" stroke="#FF5722" stroke-width="1.8"/>
    <text x="12" y="14" fill="#FF5722" font-size="8" font-weight="700">dim 0 (λ = 2π, high freq)</text>

    <!-- Mid Frequency Wave (dim d/4: Teal) -->
    <path d="M10 44 Q 40 18, 70 44 T 130 44 T 190 44 T 240 44" fill="none" stroke="#2E6F7E" stroke-width="1.5" stroke-dasharray="3,1"/>
    <text x="145" y="14" fill="#2E6F7E" font-size="8" font-weight="700">dim d/4 (mid freq)</text>

    <!-- Low Frequency Wave (High dim d: Navy) -->
    <path d="M10 44 Q 125 10, 240 44" fill="none" stroke="#1B3A5F" stroke-width="2"/>
    <text x="135" y="80" fill="#1B3A5F" font-size="8" font-weight="700">dim d (λ = 10000·2π, slow)</text>

    <text x="12" y="80" fill="#64748B" font-size="7.5">Position (pos →)</text>
  </g>

  <!-- PE Matrix Heatmap Callout -->
  <rect x="300" y="258" width="250" height="86" rx="6" fill="#1B3A5F"/>
  <text x="310" y="274" fill="#FF8246" font-size="10" font-weight="700">⚡ Deterministic Unique Fingerprints</text>
  <text x="310" y="289" fill="#FFFFFF" font-size="8.5">• Every position pos ∈ [0, T] receives a unique d-dim code</text>
  <text x="310" y="303" fill="#CBD5E1" font-size="8.5">• Wavelength scales geometrically: λ_i = 2π · 10000^(2i/d)</text>
  <text x="310" y="317" fill="#CBD5E1" font-size="8.5">• Zero learnable parameters; generalizes past max sequence</text>
  <text x="310" y="332" fill="#38BDF8" font-size="8.5" font-weight="600">• Closed-form computation on CPU / GPU tensors</text>

  <!-- Panel 3: Element-wise Superposition (Right) -->
  <rect x="575" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="575" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="575" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="587" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Vector Superposition</text>

  <!-- Connect Arrow Center to Right -->
  <path d="M561 175 H573" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Superposition Equation Flow -->
  <text x="587" y="122" fill="#1E293B" font-size="10" font-weight="700">X_input = E_token ⊕ P_pos</text>

  <g transform="translate(585, 130)">
    <!-- Token Embed Vector -->
    <rect x="0" y="0" width="70" height="34" rx="3" fill="#1B3A5F"/>
    <text x="35" y="14" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Token Embed</text>
    <text x="35" y="26" fill="#FF8246" font-size="7.5" text-anchor="middle">E [T, d_model]</text>

    <!-- Plus Sign -->
    <text x="80" y="21" fill="#FF8246" font-size="16" font-weight="700" text-anchor="middle">+</text>

    <!-- Positional Embed Vector -->
    <rect x="90" y="0" width="70" height="34" rx="3" fill="#E0F2F1" stroke="#2E6F7E" stroke-width="1.2"/>
    <text x="125" y="14" fill="#00695C" font-size="8.5" font-weight="700" text-anchor="middle">Position Enc</text>
    <text x="125" y="26" fill="#00695C" font-size="7.5" text-anchor="middle">P [T, d_model]</text>

    <!-- Equals Sign -->
    <text x="170" y="21" fill="#1B3A5F" font-size="16" font-weight="700" text-anchor="middle">=</text>

    <!-- Combined Input Vector -->
    <rect x="180" y="0" width="45" height="34" rx="3" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.5"/>
    <text x="202" y="14" fill="#D22341" font-size="8.5" font-weight="700" text-anchor="middle">X_in</text>
    <text x="202" y="26" fill="#D22341" font-size="7.5" font-weight="600" text-anchor="middle">[T, d]</text>
  </g>

  <!-- Permutation Invariance Resolution Card -->
  <g transform="translate(585, 178)">
    <rect x="0" y="0" width="225" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="8" y="16" fill="#1B3A5F" font-size="9" font-weight="700">Breaking Permutation Invariance:</text>
    
    <text x="8" y="32" fill="#475569" font-size="8">• "Dog bites man" vs "Man bites dog"</text>
    <text x="8" y="46" fill="#475569" font-size="8">• Self-attention alone is permutation invariant</text>
    <text x="8" y="60" fill="#00695C" font-size="8" font-weight="600">• Adding P_pos shifts vector along distinct orbits</text>
    <text x="8" y="74" fill="#FF5722" font-size="8" font-weight="700">→ Preserves semantics + temporal order</text>
  </g>

  <!-- Output to Transformer -->
  <g transform="translate(585, 276)">
    <rect x="0" y="0" width="225" height="68" rx="6" fill="#1B3A5F"/>
    <text x="10" y="18" fill="#FF8246" font-size="9.5" font-weight="700">⚡ Input to Transformer Stack</text>
    <text x="10" y="33" fill="#FFFFFF" font-size="8.5">• Tensor Shape: [Batch, Time, d_model]</text>
    <text x="10" y="47" fill="#CBD5E1" font-size="8.5">• Broadcasted addition across batch items</text>
    <text x="10" y="59" fill="#38BDF8" font-size="8.5" font-weight="600">• Ready for Multi-Head Attention</text>
  </g>

  <!-- Bottom Systems Invariant Callout Banner -->
  <rect x="30" y="368" width="790" height="54" rx="8" fill="#1B3A5F"/>
  <text x="45" y="388" fill="#FF8246" font-size="11" font-weight="700">⚡ Vaswani Linear Orthogonal Shift Invariant: PE(pos + k) = M_k · PE(pos)</text>
  <text x="45" y="406" fill="#F8FAFC" font-size="9.5">Sinusoidal position encodings allow attention layers to compute relative distances (i - j) via a fixed linear rotation matrix M_k,</text>
  <text x="45" y="418" fill="#CBD5E1" font-size="9.5">enabling neural networks to extrapolate relative temporal ordering across variable-length text sequences.</text>

</svg>
