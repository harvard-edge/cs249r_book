<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">The Modern AI Systems Compiler Stack: From Python Frontend to Physical Silicon</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TIER 1: HIGH-LEVEL USER APIS ==================== -->
  <g transform="translate(40, 54)">
    <rect x="0" y="0" width="800" height="62" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Tier Tag -->
    <rect x="0" y="0" width="160" height="22" fill="#111827" />
    <text x="80" y="15" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TIER 1: USER FRONTEND</text>
    <text x="175" y="15" font-size="11" font-weight="700" fill="#111827">High-Level Framework APIs (PyTorch 2.0 / TinyTorch / JAX)</text>

    <!-- Sub-boxes -->
    <g transform="translate(14, 28)" font-size="8.5">
      <rect x="0" y="0" width="175" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="10" y="16" font-weight="700" fill="#111827">model(x) / Dynamic Eager Ops</text>
      
      <rect x="185" y="0" width="175" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="195" y="16" font-weight="700" fill="#111827">Autograd Tape Tracing (DAG)</text>
      
      <rect x="370" y="0" width="185" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="380" y="16" font-weight="700" fill="#111827">User Neural Network Modules</text>
      
      <rect x="565" y="0" width="207" height="24" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="575" y="16" font-weight="700" fill="#9A3412">Eager Trap: Python Dispatch Overhead</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440 116 V128" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  <text x="455" y="125" font-size="8.5" font-weight="700" fill="#C85A17">PEP 523 Bytecode Interception</text>

  <!-- ==================== TIER 2: GRAPH COMPILER ==================== -->
  <g transform="translate(40, 132)">
    <rect x="0" y="0" width="800" height="62" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Tier Tag -->
    <rect x="0" y="0" width="160" height="22" fill="#4B5563" />
    <text x="80" y="15" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TIER 2: GRAPH COMPILER</text>
    <text x="175" y="15" font-size="11" font-weight="700" fill="#111827">TorchDynamo &amp; AOTAutograd (FX Graph Intermediate Representation)</text>

    <!-- Sub-boxes -->
    <g transform="translate(14, 28)" font-size="8.5">
      <rect x="0" y="0" width="175" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="10" y="16" font-weight="700" fill="#111827">Frame Evaluation Capture</text>
      
      <rect x="185" y="0" width="175" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="195" y="16" font-weight="700" fill="#111827">AOT Forward &amp; Backward DAG</text>
      
      <rect x="370" y="0" width="185" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="380" y="16" font-weight="700" fill="#111827">Dead Code Elimination &amp; DCE</text>
      
      <rect x="565" y="0" width="207" height="24" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1" />
      <text x="575" y="16" font-weight="700" fill="#111827">Whole-Graph Optimization &amp; CSE</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440 194 V206" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  <text x="455" y="203" font-size="8.5" font-weight="700" fill="#C85A17">Graph Lowering &amp; Fusion</text>

  <!-- ==================== TIER 3: BLOCK JIT ENGINES ==================== -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="800" height="62" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Tier Tag -->
    <rect x="0" y="0" width="160" height="22" fill="#C85A17" />
    <text x="80" y="15" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TIER 3: BLOCK JIT ENGINE</text>
    <text x="175" y="15" font-size="11" font-weight="700" fill="#111827">OpenAI Triton &amp; TorchInductor (C++ / PTX Assembly JIT Generation)</text>

    <!-- Sub-boxes -->
    <g transform="translate(14, 28)" font-size="8.5">
      <rect x="0" y="0" width="175" height="24" rx="2" fill="#FFF7ED" stroke="#C85A17" />
      <text x="10" y="16" font-weight="700" fill="#9A3412">2D Block Programming (tl.load)</text>
      
      <rect x="185" y="0" width="175" height="24" rx="2" fill="#FFF7ED" stroke="#C85A17" />
      <text x="195" y="16" font-weight="700" fill="#9A3412">Automated Kernel Fusion</text>
      
      <rect x="370" y="0" width="185" height="24" rx="2" fill="#FFF7ED" stroke="#C85A17" />
      <text x="380" y="16" font-weight="700" fill="#9A3412">Shared Memory &amp; Warp Sched</text>
      
      <rect x="565" y="0" width="207" height="24" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="575" y="16" font-weight="700" fill="#C85A17">Replaces Hand-Written CUDA</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440 272 V284" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  <text x="455" y="281" font-size="8.5" font-weight="700" fill="#C85A17">Hardware Assembly Execution</text>

  <!-- ==================== TIER 4: PHYSICAL SILICON ==================== -->
  <g transform="translate(40, 288)">
    <rect x="0" y="0" width="800" height="66" rx="4" fill="#F9FAFB" stroke="#111827" stroke-width="1.5" />
    
    <!-- Tier Tag -->
    <rect x="0" y="0" width="160" height="22" fill="#111827" />
    <text x="80" y="15" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TIER 4: PHYSICAL SILICON</text>
    <text x="175" y="15" font-size="11" font-weight="700" fill="#111827">Domain-Specific Accelerators (GPUs, TPUs, NPUs, Edge ASICs)</text>

    <!-- Sub-boxes -->
    <g transform="translate(14, 28)" font-size="8.5">
      <rect x="0" y="0" width="175" height="26" rx="2" fill="#111827" />
      <text x="10" y="17" font-weight="700" fill="#FFFFFF">NVIDIA Tensor Cores (H100/B200)</text>
      
      <rect x="185" y="0" width="175" height="26" rx="2" fill="#111827" />
      <text x="195" y="17" font-weight="700" fill="#FFFFFF">Google TPU v5e (Matrix Units)</text>
      
      <rect x="370" y="0" width="185" height="26" rx="2" fill="#111827" />
      <text x="380" y="17" font-weight="700" fill="#FFFFFF">Apple Neural Engine (ANE)</text>
      
      <rect x="565" y="0" width="207" height="26" rx="2" fill="#111827" />
      <text x="575" y="17" font-weight="700" fill="#FFF7ED">Peak TFLOPs &amp; HBM3e Bandwidth</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 412)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Modern AI systems are hierarchical compilers that progressively lower abstract mathematical operators into block-tiled,
      <tspan x="0" dy="16">SRAM-resident machine code tuned specifically for systolic hardware execution.</tspan>
    </text>
  </g>
</svg>
