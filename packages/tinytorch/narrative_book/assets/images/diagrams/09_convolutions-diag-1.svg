<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Navy Header Banner -->
  <rect x="15" y="15" width="820" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="15" y="45" width="820" height="20" fill="url(#headerGrad)"/>
  <text x="35" y="46" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">2D SPATIAL CONVOLUTION &amp; IM2COL MATRIX UNROLLING</text>
  <rect x="680" y="27" width="135" height="24" rx="12" fill="#FF8246"/>
  <text x="747" y="43" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">SYSTOLIC GEMM</text>

  <!-- Panel 1: Spatial Sliding Window (Left) -->
  <rect x="30" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="30" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="42" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Spatial Input &amp; Kernel</text>

  <!-- Input Image Grid (4x4) -->
  <text x="42" y="122" fill="#1E293B" font-size="10" font-weight="700">Input X [1, 4, 4]</text>
  <g transform="translate(42, 130)">
    <!-- 4x4 Grid Cells -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="10" y="14" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₀₀</text>
    <rect x="22" y="0" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="32" y="14" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₀₁</text>
    <rect x="44" y="0" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="54" y="14" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₀₂</text>
    <rect x="66" y="0" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="76" y="14" font-size="8.5" fill="#64748B" text-anchor="middle">x₀₃</text>
    <!-- Row 1 -->
    <rect x="0" y="22" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="10" y="36" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₁₀</text>
    <rect x="22" y="22" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="32" y="36" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₁₁</text>
    <rect x="44" y="22" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="54" y="36" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₁₂</text>
    <rect x="66" y="22" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="76" y="36" font-size="8.5" fill="#64748B" text-anchor="middle">x₁₃</text>
    <!-- Row 2 -->
    <rect x="0" y="44" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="10" y="58" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₂₀</text>
    <rect x="22" y="44" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="32" y="58" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₂₁</text>
    <rect x="44" y="44" width="20" height="20" fill="#FFE8DC" stroke="#FF8246" stroke-width="1.5"/>
    <text x="54" y="58" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">x₂₂</text>
    <rect x="66" y="44" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="76" y="58" font-size="8.5" fill="#64748B" text-anchor="middle">x₂₃</text>
    <!-- Row 3 -->
    <rect x="0" y="66" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="10" y="80" font-size="8.5" fill="#64748B" text-anchor="middle">x₃₀</text>
    <rect x="22" y="66" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="32" y="80" font-size="8.5" fill="#64748B" text-anchor="middle">x₃₁</text>
    <rect x="44" y="66" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="54" y="80" font-size="8.5" fill="#64748B" text-anchor="middle">x₃₂</text>
    <rect x="66" y="66" width="20" height="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="76" y="80" font-size="8.5" fill="#64748B" text-anchor="middle">x₃₃</text>
    
    <!-- Highlight boundary for receptive window 0 -->
    <rect x="-2" y="-2" width="68" height="68" rx="3" fill="none" stroke="#FF5722" stroke-width="1.8" stroke-dasharray="3,2"/>
  </g>

  <!-- 3x3 Filter Kernel -->
  <text x="175" y="122" fill="#1E293B" font-size="10" font-weight="700">Kernel W [3×3]</text>
  <g transform="translate(175, 130)">
    <rect x="0" y="0" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="9" y="12" font-size="8" fill="#FFFFFF" text-anchor="middle">w₀</text>
    <rect x="20" y="0" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="29" y="12" font-size="8" fill="#FFFFFF" text-anchor="middle">w₁</text>
    <rect x="40" y="0" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="49" y="12" font-size="8" fill="#FFFFFF" text-anchor="middle">w₂</text>
    <rect x="0" y="20" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="9" y="32" font-size="8" fill="#FFFFFF" text-anchor="middle">w₃</text>
    <rect x="20" y="20" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="29" y="32" font-size="8" fill="#FFFFFF" text-anchor="middle">w₄</text>
    <rect x="40" y="20" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="49" y="32" font-size="8" fill="#FFFFFF" text-anchor="middle">w₅</text>
    <rect x="0" y="40" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="9" y="52" font-size="8" fill="#FFFFFF" text-anchor="middle">w₆</text>
    <rect x="20" y="40" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="29" y="52" font-size="8" fill="#FFFFFF" text-anchor="middle">w₇</text>
    <rect x="40" y="40" width="18" height="18" fill="#1B3A5F" rx="2"/><text x="49" y="52" font-size="8" fill="#FFFFFF" text-anchor="middle">w₈</text>
  </g>

  <!-- Sliding Loop Warning Box -->
  <rect x="40" y="235" width="225" height="108" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="48" y="252" fill="#D22341" font-size="10" font-weight="700">✕  Naive 6-Nested Loops</text>
  <text x="48" y="268" fill="#475569" font-size="8.5">for n, c_out, h_out, w_out, kh, kw:</text>
  <text x="48" y="282" fill="#475569" font-size="8.5">• Strided non-contiguous memory access</text>
  <text x="48" y="296" fill="#475569" font-size="8.5">• Hardware utilization: &lt; 5% peak FLOPs</text>
  <text x="48" y="310" fill="#475569" font-size="8.5">• Starves GPU tensor cores / SIMD lanes</text>
  <text x="48" y="326" fill="#D22341" font-size="9" font-weight="600">→ DRAM Bandwidth Bottleneck</text>

  <!-- Panel 2: im2col Unrolling Transformation (Center) -->
  <rect x="290" y="78" width="270" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="290" y="78" width="270" height="28" rx="8" fill="#2E6F7E"/>
  <rect x="290" y="96" width="270" height="10" fill="#2E6F7E"/>
  <text x="302" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">2. im2col Unrolling Transform</text>

  <!-- Connect Arrow Left to Center -->
  <path d="M276 175 H288" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Unrolled Matrix Illustration -->
  <text x="302" y="118" fill="#1E293B" font-size="9.5" font-weight="700">ColMatrix X_col [K²·C=9, H_out·W_out=4]</text>
  <g transform="translate(300, 134)">
    <!-- Column headers -->
    <text x="38" y="-4" font-size="8" font-weight="700" fill="#FF5722" text-anchor="middle">Patch 0</text>
    <text x="88" y="-4" font-size="8" font-weight="700" fill="#2E6F7E" text-anchor="middle">Patch 1</text>
    <text x="138" y="-4" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">Patch 2</text>
    <text x="188" y="-4" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">Patch 3</text>

    <!-- Column 0 (Orange: from Patch 0) -->
    <rect x="18" y="2" width="40" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/><text x="38" y="13" font-size="7.5" font-weight="700" fill="#FF5722" text-anchor="middle">x₀₀</text>
    <rect x="18" y="20" width="40" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/><text x="38" y="31" font-size="7.5" font-weight="700" fill="#FF5722" text-anchor="middle">x₀₁</text>
    <rect x="18" y="38" width="40" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/><text x="38" y="49" font-size="7.5" font-weight="700" fill="#FF5722" text-anchor="middle">x₀₂</text>
    <text x="38" y="66" font-size="8" fill="#FF5722" text-anchor="middle">⋮</text>
    <rect x="18" y="70" width="40" height="16" fill="#FFE8DC" stroke="#FF8246" rx="2"/><text x="38" y="81" font-size="7.5" font-weight="700" fill="#FF5722" text-anchor="middle">x₂₂</text>

    <!-- Column 1 (Teal: from Patch 1) -->
    <rect x="68" y="2" width="40" height="16" fill="#E0F2F1" stroke="#2E6F7E" rx="2"/><text x="88" y="13" font-size="7.5" fill="#00695C" text-anchor="middle">x₀₁</text>
    <rect x="68" y="20" width="40" height="16" fill="#E0F2F1" stroke="#2E6F7E" rx="2"/><text x="88" y="31" font-size="7.5" fill="#00695C" text-anchor="middle">x₀₂</text>
    <rect x="68" y="38" width="40" height="16" fill="#E0F2F1" stroke="#2E6F7E" rx="2"/><text x="88" y="49" font-size="7.5" fill="#00695C" text-anchor="middle">x₀₃</text>
    <text x="88" y="66" font-size="8" fill="#00695C" text-anchor="middle">⋮</text>
    <rect x="68" y="70" width="40" height="16" fill="#E0F2F1" stroke="#2E6F7E" rx="2"/><text x="88" y="81" font-size="7.5" fill="#00695C" text-anchor="middle">x₂₃</text>

    <!-- Column 2 (Patch 2) -->
    <rect x="118" y="2" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="138" y="13" font-size="7.5" fill="#64748B" text-anchor="middle">x₁₀</text>
    <rect x="118" y="20" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="138" y="31" font-size="7.5" fill="#64748B" text-anchor="middle">x₁₁</text>
    <rect x="118" y="38" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="138" y="49" font-size="7.5" fill="#64748B" text-anchor="middle">x₁₂</text>
    <text x="138" y="66" font-size="8" fill="#64748B" text-anchor="middle">⋮</text>
    <rect x="118" y="70" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="138" y="81" font-size="7.5" fill="#64748B" text-anchor="middle">x₃₂</text>

    <!-- Column 3 (Patch 3) -->
    <rect x="168" y="2" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="188" y="13" font-size="7.5" fill="#64748B" text-anchor="middle">x₁₁</text>
    <rect x="168" y="20" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="188" y="31" font-size="7.5" fill="#64748B" text-anchor="middle">x₁₂</text>
    <rect x="168" y="38" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="188" y="49" font-size="7.5" fill="#64748B" text-anchor="middle">x₁₃</text>
    <text x="188" y="66" font-size="8" fill="#64748B" text-anchor="middle">⋮</text>
    <rect x="168" y="70" width="40" height="16" fill="#F8FAFC" stroke="#CBD5E1" rx="2"/><text x="188" y="81" font-size="7.5" fill="#64748B" text-anchor="middle">x₃₃</text>
  </g>

  <!-- Transform explanation box -->
  <rect x="302" y="235" width="246" height="108" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="310" y="252" fill="#00695C" font-size="10" font-weight="700">✓  Contiguous Column Layout</text>
  <text x="310" y="268" fill="#475569" font-size="8.5">• Unrolls 2D spatial patches into 1D columns</text>
  <text x="310" y="282" fill="#475569" font-size="8.5">• Trades K_h × K_w memory for dense access</text>
  <text x="310" y="296" fill="#475569" font-size="8.5">• Enables highly-tuned BLAS gemm() execution</text>
  <text x="310" y="310" fill="#475569" font-size="8.5">• Forward: im2col | Backward: col2im</text>
  <text x="310" y="326" fill="#00695C" font-size="9" font-weight="600">→ High Cache Locality &amp; Linear DRAM</text>

  <!-- Panel 3: High-Throughput GEMM Execution (Right) -->
  <rect x="575" y="78" width="245" height="278" rx="8" fill="url(#warmCardGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="575" y="78" width="245" height="28" rx="8" fill="#1B3A5F"/>
  <rect x="575" y="96" width="245" height="10" fill="#1B3A5F"/>
  <text x="587" y="97" fill="#FFFFFF" font-size="11.5" font-weight="700">3. High-Throughput GEMM</text>

  <!-- Connect Arrow Center to Right -->
  <path d="M561 175 H573" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- GEMM Equation Layout -->
  <text x="587" y="118" fill="#1E293B" font-size="9.5" font-weight="700">Y_flat = W_row × X_col</text>
  
  <g transform="translate(585, 128)">
    <!-- W_row matrix -->
    <rect x="0" y="0" width="62" height="30" rx="3" fill="#1B3A5F"/>
    <text x="31" y="13" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">W_row</text>
    <text x="31" y="24" fill="#FF8246" font-size="7" text-anchor="middle">[C_out, K²·C]</text>

    <!-- Multiplier Sign -->
    <text x="70" y="18" fill="#FF8246" font-size="12" font-weight="700" text-anchor="middle">×</text>

    <!-- X_col matrix -->
    <rect x="78" y="0" width="62" height="48" rx="3" fill="#E0F2F1" stroke="#2E6F7E"/>
    <text x="109" y="20" fill="#00695C" font-size="8" font-weight="700" text-anchor="middle">X_col</text>
    <text x="109" y="32" fill="#00695C" font-size="7" text-anchor="middle">[K²·C, H_o·W_o]</text>

    <!-- Equal Sign -->
    <text x="148" y="18" fill="#1B3A5F" font-size="12" font-weight="700" text-anchor="middle">=</text>

    <!-- Y_flat matrix -->
    <rect x="156" y="0" width="65" height="30" rx="3" fill="#FFE8DC" stroke="#FF5722" stroke-width="1.2"/>
    <text x="188" y="13" fill="#D22341" font-size="8" font-weight="700" text-anchor="middle">Y_flat</text>
    <text x="188" y="24" fill="#D22341" font-size="7" text-anchor="middle">[C_out, H_o·W_o]</text>
  </g>

  <!-- Reshape arrow to 2D Output -->
  <g transform="translate(585, 184)">
    <path d="M110 0 V14" stroke="#2E6F7E" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
    <text x="120" y="10" fill="#2E6F7E" font-size="7.5" font-weight="600">reshape</text>

    <!-- 2x2 Output Grid -->
    <rect x="75" y="18" width="70" height="38" rx="3" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
    <text x="110" y="31" fill="#1B3A5F" font-size="8" font-weight="700" text-anchor="middle">Output Y</text>
    <text x="110" y="42" fill="#475569" font-size="7" text-anchor="middle">[C_out, H_out, W_out]</text>
    <text x="110" y="52" fill="#FF5722" font-size="7" font-weight="700" text-anchor="middle">[1, 2, 2]</text>
  </g>

  <!-- Performance Metric Card -->
  <rect x="585" y="246" width="225" height="97" rx="6" fill="#1B3A5F"/>
  <text x="595" y="264" fill="#FF8246" font-size="10" font-weight="700">⚡ Hardware Systolic Engine</text>
  <text x="595" y="280" fill="#FFFFFF" font-size="8.5">• 90%+ Peak TFLOP/s on Tensor Cores</text>
  <text x="595" y="295" fill="#CBD5E1" font-size="8.5">• Fully cached L1/L2 matrix tiling</text>
  <text x="595" y="310" fill="#CBD5E1" font-size="8.5">• Zero loop overhead in kernel execution</text>
  <text x="595" y="326" fill="#38BDF8" font-size="8.5" font-weight="600">• Single standard BLAS gemm() call</text>

  <!-- Bottom Systems Invariant Callout Banner -->
  <rect x="30" y="368" width="790" height="54" rx="8" fill="#1B3A5F"/>
  <text x="45" y="388" fill="#FF8246" font-size="11" font-weight="700">⚡ Chellapilla im2col Invariant: Memory Duplication for Peak GEMM Throughput</text>
  <text x="45" y="406" fill="#F8FAFC" font-size="9.5">im2col duplicates overlapping receptive fields in DRAM (K_h × K_w overhead) to convert O(N⁶) strided loops into</text>
  <text x="45" y="418" fill="#CBD5E1" font-size="9.5">contiguous matrix multiplication, executing at &gt;90% hardware roofline on systolic matrix engines.</text>

</svg>
