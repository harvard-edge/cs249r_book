<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 475" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="445" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="15" y="15" width="820" height="46" rx="10" fill="url(#torchGrad)"/>
  <path d="M15 51 h820 v10 h-820 z" fill="url(#torchGrad)" />
  <text x="35" y="44" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.3">LOSS FUNCTIONS: NUMERICAL STABILITY &amp; THE LOG-SUM-EXP TRICK</text>
  <rect x="635" y="27" width="180" height="22" rx="11" fill="#FF8246"/>
  <text x="725" y="42" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">IEEE 754 STABILIZATION</text>

  <!-- 3 MAIN PANELS (y = 72 to 380) -->

  <!-- PANEL 1: IEEE 754 HAZARDS (x=30, w=250) -->
  <rect x="30" y="72" width="250" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="72" width="250" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M30 90 h250 v10 h-250 z" fill="#1B3A5F"/>
  <text x="155" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">1. Naive Softmax &amp; FP32 Hazards</text>

  <g transform="translate(42, 108)" font-size="9">
    <rect x="0" y="0" width="226" height="28" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="113" y="18" text-anchor="middle" fill="#1B3A5F" font-weight="700">p_i = exp(z_i) / Σ exp(z_j)</text>

    <rect x="0" y="34" width="226" height="46" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="8" y="48" fill="#1E3A8A" font-weight="700">IEEE 754 Float32 Hardware Limits:</text>
    <text x="8" y="62" fill="#475569">• Max Float: 3.40 × 10³⁸ (exp(88.72))</text>
    <text x="8" y="74" fill="#475569">• Min Float: 1.17 × 10⁻³⁸ (exp(-87.33))</text>

    <rect x="0" y="86" width="226" height="88" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text x="8" y="100" fill="#991B1B" font-weight="700">Two Fatal FP32 Failure Modes:</text>
    
    <text x="8" y="115" fill="#7F1D1D" font-weight="600">1. Overflow Crash (z = 100):</text>
    <text x="14" y="128" fill="#7F1D1D">exp(100) → +inf ⇒ +inf / +inf = NaN [Dead]</text>

    <text x="8" y="145" fill="#7F1D1D" font-weight="600">2. Underflow Collapse (z = -100):</text>
    <text x="14" y="158" fill="#7F1D1D">exp(-100) → 0.0 ⇒ log(0.0) = -inf [Dead]</text>
    <text x="14" y="170" fill="#991B1B" font-weight="700">NaN poisons all model weights!</text>
  </g>

  <!-- PANEL 2: THE LOG-SUM-EXP SHIFT TRICK (x=290, w=270) -->
  <rect x="290" y="72" width="270" height="308" rx="8" fill="#FFF8F0" stroke="#FF8246" stroke-width="1.6"/>
  <rect x="290" y="72" width="270" height="28" rx="8" fill="#FF8246"/>
  <path d="M290 90 h270 v10 h-270 z" fill="#FF8246"/>
  <text x="425" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">2. Log-Sum-Exp Shift Invariance</text>

  <g transform="translate(302, 108)" font-size="9.5">
    <rect x="0" y="0" width="246" height="54" rx="4" fill="#FFFFFF" stroke="#FDBA74"/>
    <text x="8" y="16" fill="#C2410C" font-weight="700">Mathematical Shift Invariance:</text>
    <text x="8" y="32" fill="#1E293B">p_i = exp(z_i - c) / Σ exp(z_j - c)</text>
    <text x="8" y="47" fill="#166534" font-weight="700">where c = max_j(z_j)</text>

    <rect x="0" y="60" width="246" height="66" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="8" y="74" fill="#166534" font-weight="700">Guaranteed Mathematical Safety:</text>
    <text x="8" y="90" fill="#1E293B">Since z_j - c ≤ 0 for all j:</text>
    <text x="8" y="105" fill="#166534" font-weight="600">• exp(z_j - c) ∈ (0, 1]  (Zero overflow!)</text>
    <text x="8" y="120" fill="#166534" font-weight="600">• Σ exp(z_j - c) ≥ 1.0   (Zero div-by-zero!)</text>

    <rect x="0" y="132" width="246" height="42" rx="4" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="8" y="147" fill="#92400E" font-weight="700">Stable LSE Formulation:</text>
    <text x="8" y="163" fill="#1E293B">LSE(z) = c + log( Σ exp(z_j - c) )</text>
  </g>

  <!-- PANEL 3: FUSED CROSS-ENTROPY KERNEL (x=570, w=250) -->
  <rect x="570" y="72" width="250" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="570" y="72" width="250" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M570 90 h250 v10 h-250 z" fill="#1B3A5F"/>
  <text x="695" y="91" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">3. Fused Cross-Entropy Kernel</text>

  <g transform="translate(582, 108)" font-size="9.5">
    <rect x="0" y="0" width="226" height="54" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="8" y="16" fill="#1E3A8A" font-weight="700">Fused Negative Log-Likelihood:</text>
    <text x="8" y="32" fill="#1E293B">L = -log(p_target)</text>
    <text x="8" y="47" fill="#1E3A8A" font-weight="700">L = -z_target + LSE(z)</text>

    <rect x="0" y="60" width="226" height="54" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="75" fill="#1B3A5F" font-weight="700">Analytical Backward Gradient:</text>
    <text x="8" y="92" fill="#FF5722" font-size="10.5" font-weight="700">∂L / ∂z_i = p_i - y_i</text>
    <text x="8" y="107" fill="#475569">(Softmax prob minus one-hot label)</text>

    <rect x="0" y="120" width="226" height="54" rx="4" fill="#FFF8F0" stroke="#FDBA74"/>
    <text x="8" y="135" fill="#C2410C" font-weight="700">Systems Kernel Fusion:</text>
    <text x="8" y="150" fill="#475569">Avoids materializing [B, C] probs</text>
    <text x="8" y="164" fill="#166534" font-weight="600">Single-pass fused SRAM reduction</text>
  </g>

  <!-- BOTTOM INVARIANT CALLOUT (y = 390 to 445) -->
  <rect x="30" y="390" width="790" height="55" rx="6" fill="#1B3A5F"/>
  <path d="M 45 408 L 52 401 L 49 408 L 54 408 L 46 419 L 48 411 Z" fill="#FF8246"/>
  <text x="60" y="411" fill="#FF8246" font-size="11.5" font-weight="700">The Log-Sum-Exp Shift Invariance Invariant</text>
  <text x="45" y="430" fill="#FFFFFF" font-size="10">Subtracting max(z) guarantees all exponentials lie strictly in (0, 1], eliminating overflow and underflow hazards on IEEE 754 float32/float16 silicon.</text>
</svg>
