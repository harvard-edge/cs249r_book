<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 475" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="445" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="15" y="15" width="820" height="46" rx="10" fill="url(#torchGrad)"/>
  <path d="M15 51 h820 v10 h-820 z" fill="url(#torchGrad)" />
  <text x="35" y="44" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.3">NON-LINEAR ACTIVATIONS: BREAKING THE LINEAR COLLAPSE WALL</text>
  <rect x="635" y="27" width="180" height="22" rx="11" fill="#FF8246"/>
  <text x="725" y="42" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">MANIFOLD WARPING &amp; FUSION</text>

  <!-- 4 CARDS GRID (y = 72 to 380) -->

  <!-- CARD 1: ReLU (x=30, w=185) -->
  <rect x="30" y="72" width="185" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="30" y="72" width="185" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M30 90 h185 v10 h-185 z" fill="#1B3A5F"/>
  <text x="122" y="91" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">1. ReLU: max(0, x)</text>

  <!-- Graph 1: ReLU -->
  <g transform="translate(45, 110)">
    <line x1="10" y1="65" x2="145" y2="65" stroke="#94A3B8" stroke-width="1"/>
    <line x1="75" y1="10" x2="75" y2="80" stroke="#94A3B8" stroke-width="1"/>
    <text x="140" y="61" fill="#64748B" font-size="8">x</text>
    <text x="79" y="16" fill="#64748B" font-size="8">y</text>
    
    <line x1="15" y1="65" x2="75" y2="65" stroke="#FF8246" stroke-width="2.5"/>
    <line x1="75" y1="65" x2="135" y2="15" stroke="#FF8246" stroke-width="2.5"/>

    <rect x="10" y="72" width="60" height="15" rx="3" fill="#FEE2E2"/>
    <text x="40" y="83" text-anchor="middle" fill="#991B1B" font-size="7.5" font-weight="700">Grad = 0 (Dead)</text>
  </g>

  <!-- Info Box 1 -->
  <g transform="translate(40, 210)" font-size="9.5">
    <rect x="0" y="0" width="165" height="38" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="15" fill="#1B3A5F" font-weight="700">f(x) = max(0, x)</text>
    <text x="8" y="30" fill="#475569">f'(x) = 1 if x &gt; 0 else 0</text>

    <rect x="0" y="44" width="165" height="42" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="8" y="58" fill="#1E3A8A" font-weight="700">Systems Trait:</text>
    <text x="8" y="72" fill="#475569">Single SIMD `maxps` opcode</text>
    <text x="8" y="82" fill="#DC2626" font-size="8.5">Risk: Permanent dying neurons</text>
  </g>

  <!-- CARD 2: GELU (x=225, w=195) -->
  <rect x="225" y="72" width="195" height="308" rx="8" fill="#FFF8F0" stroke="#FF8246" stroke-width="1.6"/>
  <rect x="225" y="72" width="195" height="28" rx="8" fill="#FF8246"/>
  <path d="M225 90 h195 v10 h-195 z" fill="#FF8246"/>
  <text x="322" y="91" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">2. GELU (Modern Standard)</text>

  <!-- Graph 2: GELU -->
  <g transform="translate(245, 110)">
    <line x1="10" y1="65" x2="150" y2="65" stroke="#94A3B8" stroke-width="1"/>
    <line x1="80" y1="10" x2="80" y2="80" stroke="#94A3B8" stroke-width="1"/>
    <text x="145" y="61" fill="#64748B" font-size="8">x</text>
    <text x="84" y="16" fill="#64748B" font-size="8">y</text>
    
    <path d="M 15 65 C 40 65, 55 69, 65 70 C 72 70, 77 67, 80 65 C 92 56, 115 32, 140 15" fill="none" stroke="#FF5722" stroke-width="2.5"/>

    <rect x="40" y="73" width="75" height="15" rx="3" fill="#FFEDD5"/>
    <text x="77" y="84" text-anchor="middle" fill="#9A3412" font-size="7.5" font-weight="700">Smooth dip (non-zero)</text>
  </g>

  <!-- Info Box 2 -->
  <g transform="translate(235, 210)" font-size="9">
    <rect x="0" y="0" width="175" height="52" rx="4" fill="#FFFFFF" stroke="#FDBA74"/>
    <text x="8" y="14" fill="#C2410C" font-weight="700">x · Φ(x) Probabilistic Gate</text>
    <text x="8" y="28" fill="#1E293B">0.5x · (1 + tanh(√(2/π)(x+0.0447x³)))</text>
    <text x="8" y="42" fill="#475569">Smooth Gaussian CDF gating</text>

    <rect x="0" y="58" width="175" height="38" rx="4" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="8" y="72" fill="#92400E" font-weight="700">GPT-2 / BERT Backbone:</text>
    <text x="8" y="86" fill="#475569">Smooth derivative everywhere</text>
  </g>

  <!-- CARD 3: Sigmoid & Tanh (x=430, w=185) -->
  <rect x="430" y="72" width="185" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="430" y="72" width="185" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M430 90 h185 v10 h-185 z" fill="#1B3A5F"/>
  <text x="522" y="91" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">3. Sigmoid &amp; Tanh S-Curves</text>

  <!-- Graph 3: Sigmoid & Tanh -->
  <g transform="translate(445, 110)">
    <line x1="10" y1="45" x2="145" y2="45" stroke="#94A3B8" stroke-width="1"/>
    <line x1="75" y1="10" x2="75" y2="80" stroke="#94A3B8" stroke-width="1"/>
    <text x="140" y="41" fill="#64748B" font-size="8">x</text>
    
    <path d="M 15 75 C 50 75, 60 55, 75 45 C 90 35, 100 15, 135 15" fill="none" stroke="#1B3A5F" stroke-width="2"/>
    <path d="M 15 65 C 50 65, 60 52, 75 45 C 90 38, 100 25, 135 25" fill="none" stroke="#2E6F7E" stroke-width="2" stroke-dasharray="3,2"/>

    <text x="12" y="16" fill="#1B3A5F" font-size="8" font-weight="700">— Tanh</text>
    <text x="12" y="27" fill="#2E6F7E" font-size="8" font-weight="700">-- Sigmoid</text>
  </g>

  <!-- Info Box 3 -->
  <g transform="translate(440, 210)" font-size="9.5">
    <rect x="0" y="0" width="165" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="8" y="15" fill="#1B3A5F" font-weight="700">σ(x) = 1 / (1 + e⁻ˣ)</text>
    <text x="8" y="30" fill="#475569">tanh(x) = (eˣ - e⁻ˣ)/(eˣ + e⁻ˣ)</text>

    <rect x="0" y="46" width="165" height="44" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text x="8" y="60" fill="#991B1B" font-weight="700">Vanishing Gradient Hazard:</text>
    <text x="8" y="74" fill="#7F1D1D" font-size="8.5">|x| &gt; 4 → σ'(x) ≈ 0</text>
    <text x="8" y="85" fill="#7F1D1D" font-size="8.5">Deep backprop stalls completely</text>
  </g>

  <!-- CARD 4: Systems Layer: Fused Kernels (x=625, w=195) -->
  <rect x="625" y="72" width="195" height="308" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="625" y="72" width="195" height="28" rx="8" fill="#1B3A5F"/>
  <path d="M625 90 h195 v10 h-195 z" fill="#1B3A5F"/>
  <text x="722" y="91" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">4. Fused Kernel Systems</text>

  <!-- Architecture Flow Comparison -->
  <g transform="translate(635, 110)" font-size="8.5">
    <!-- Unfused Flow -->
    <rect x="0" y="0" width="175" height="82" rx="4" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="8" y="14" fill="#9F1239" font-weight="700">Unfused (Memory Bound)</text>
    <text x="8" y="30" fill="#475569">1. GEMM → Write DRAM Buffer</text>
    <text x="8" y="46" fill="#475569">2. Read DRAM → Compute GELU</text>
    <text x="8" y="62" fill="#475569">3. Write GELU Out → DRAM</text>
    <text x="8" y="75" fill="#E11D48" font-weight="600">3 DRAM Roundtrips [Slow]</text>

    <!-- Fused Flow -->
    <rect x="0" y="90" width="175" height="80" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="8" y="104" fill="#166534" font-weight="700">Fused Kernel (Compute Bound)</text>
    <text x="8" y="120" fill="#1E293B">1. GEMM in L1/SRAM Registers</text>
    <text x="8" y="136" fill="#166534" font-weight="600">2. Apply GELU directly in registers</text>
    <text x="8" y="152" fill="#1E293B">3. Single Write to DRAM (1 Pass)</text>
    <text x="8" y="164" fill="#15803D" font-weight="700">2.5x Bandwidth Speedup [Fast]</text>
  </g>

  <!-- BOTTOM INVARIANT CALLOUT (y = 390 to 445) -->
  <rect x="30" y="390" width="790" height="55" rx="6" fill="#1B3A5F"/>
  <path d="M 45 408 L 52 401 L 49 408 L 54 408 L 46 419 L 48 411 Z" fill="#FF8246"/>
  <text x="60" y="411" fill="#FF8246" font-size="11.5" font-weight="700">The Associative Linear Collapse Invariant</text>
  <text x="45" y="428" fill="#FFFFFF" font-size="9.5">Without non-linear activations, L consecutive linear layers collapse into W_eff = W1 · W2 ··· WL (a single shallow matrix).</text>
  <text x="45" y="440" fill="#CBD5E1" font-size="9">Non-linear gates break associativity to bend, fold, and warp high-dimensional decision manifolds.</text>
</svg>
