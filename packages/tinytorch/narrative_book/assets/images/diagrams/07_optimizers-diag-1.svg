<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <filter id="subCardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3A5F" flood-opacity="0.05"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="adamwBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#FFF0E5" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D22341" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="15" width="810" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="20" y="15" width="810" height="45" rx="10" fill="url(#torchGrad)"/>
  <rect x="20" y="45" width="810" height="15" fill="url(#torchGrad)"/>
  <text x="38" y="42" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.4">OPTIMIZATION DYNAMICS: VANILLA SGD VS. MOMENTUM VS. ADAMW</text>
  <rect x="685" y="27" width="130" height="22" rx="11" fill="#FF8246"/>
  <text x="750" y="42" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">CONVERGENCE PROFILES</text>

  <!-- Card 1: Vanilla SGD -->
  <g transform="translate(38, 72)">
    <rect x="0" y="0" width="245" height="278" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="245" height="30" rx="8" fill="#1B3A5F"/>
    <rect x="0" y="20" width="245" height="10" fill="#1B3A5F"/>
    <text x="122" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1. Vanilla SGD</text>

    <!-- Loss Surface Contour with Zigzag -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="221" height="105" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      
      <!-- Contour Ellipses (Ill-conditioned ravine) -->
      <ellipse cx="150" cy="52" rx="58" ry="36" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="42" ry="25" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="26" ry="15" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="12" ry="6" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="150" cy="52" r="2.5" fill="#1B3A5F"/>
      <text x="150" y="32" fill="#1B3A5F" font-size="7.5" font-weight="700" text-anchor="middle">Optimum θ*</text>

      <!-- Zigzag trajectory path -->
      <path d="M 22 20 L 36 84 L 56 24 L 78 80 L 100 28 L 120 74 L 136 38 L 146 52" fill="none" stroke="#D22341" stroke-width="1.6" marker-end="url(#arrowRed)"/>
      
      <!-- Start point -->
      <circle cx="22" cy="20" r="3" fill="#D22341"/>
      <text x="22" y="13" fill="#D22341" font-size="7.5" font-weight="700">θ₀</text>
      
      <!-- Warning tag -->
      <rect x="6" y="84" width="92" height="15" rx="3" fill="#D22341" fill-opacity="0.1" stroke="#D22341" stroke-width="0.8"/>
      <text x="52" y="95" fill="#D22341" font-size="7" font-weight="700" text-anchor="middle">Zigzag Oscillations</text>
    </g>

    <!-- Math Card -->
    <g transform="translate(12, 149)">
      <rect x="0" y="0" width="221" height="50" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="110" y="18" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">θ ← θ - η · g</text>
      <text x="110" y="33" fill="#64748B" font-size="7.5" text-anchor="middle">Gradient step along steepest descent</text>
      <text x="110" y="44" fill="#D22341" font-size="7" font-weight="600" text-anchor="middle">No velocity memory stored</text>
    </g>

    <!-- Characteristics Card -->
    <g transform="translate(12, 205)">
      <rect x="0" y="0" width="221" height="65" rx="4" fill="#1B3A5F"/>
      <text x="10" y="16" fill="#FF8246" font-size="8.5" font-weight="700">⚠️ Ravine Hazard</text>
      <text x="10" y="29" fill="#FFFFFF" font-size="7.5">• High-curvature axis causes jitter</text>
      <text x="10" y="41" fill="#FFFFFF" font-size="7.5">• Low-curvature progress is sluggish</text>
      <text x="10" y="53" fill="#CBD5E1" font-size="7.5">• Stalls in saddle points &amp; plateaus</text>
    </g>
  </g>

  <!-- Card 2: SGD + Momentum -->
  <g transform="translate(302, 72)">
    <rect x="0" y="0" width="245" height="278" rx="8" fill="url(#warmBgGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="245" height="30" rx="8" fill="#2E6F7E"/>
    <rect x="0" y="20" width="245" height="10" fill="#2E6F7E"/>
    <text x="122" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2. SGD + Momentum</text>

    <!-- Loss Surface Contour with Momentum -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="221" height="105" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      
      <!-- Contour Ellipses -->
      <ellipse cx="150" cy="52" rx="58" ry="36" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="42" ry="25" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="26" ry="15" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="12" ry="6" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="150" cy="52" r="2.5" fill="#1B3A5F"/>
      <text x="150" y="32" fill="#1B3A5F" font-size="7.5" font-weight="700" text-anchor="middle">Optimum θ*</text>

      <!-- Momentum smoothed trajectory path -->
      <path d="M 22 20 C 35 78, 65 72, 90 58 C 115 44, 130 54, 146 52" fill="none" stroke="#2E6F7E" stroke-width="2" marker-end="url(#arrowTeal)"/>
      
      <!-- Start point -->
      <circle cx="22" cy="20" r="3" fill="#2E6F7E"/>
      <text x="22" y="13" fill="#2E6F7E" font-size="7.5" font-weight="700">θ₀</text>
      
      <!-- Velocity badge -->
      <rect x="6" y="84" width="108" height="15" rx="3" fill="#2E6F7E" fill-opacity="0.1" stroke="#2E6F7E" stroke-width="0.8"/>
      <text x="60" y="95" fill="#2E6F7E" font-size="7" font-weight="700" text-anchor="middle">Velocity Vector Smoothing</text>
    </g>

    <!-- Math Card -->
    <g transform="translate(12, 149)">
      <rect x="0" y="0" width="221" height="50" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="110" y="15" fill="#2E6F7E" font-size="9" font-weight="700" text-anchor="middle">v ← β · v + g</text>
      <text x="110" y="29" fill="#1B3A5F" font-size="9" font-weight="700" text-anchor="middle">θ ← θ - η · v</text>
      <text x="110" y="42" fill="#64748B" font-size="7.5" text-anchor="middle">Inertia builds kinetic velocity</text>
    </g>

    <!-- Characteristics Card -->
    <g transform="translate(12, 205)">
      <rect x="0" y="0" width="221" height="65" rx="4" fill="#1B3A5F"/>
      <text x="10" y="16" fill="#FF8246" font-size="8.5" font-weight="700">⚡ Inertia Advantage</text>
      <text x="10" y="29" fill="#FFFFFF" font-size="7.5">• Cancels cross-canyon oscillations</text>
      <text x="10" y="41" fill="#FFFFFF" font-size="7.5">• Accelerates down the ravine floor</text>
      <text x="10" y="53" fill="#10B981" font-size="7.5" font-weight="600">• Powers through shallow saddles</text>
    </g>
  </g>

  <!-- Card 3: AdamW (Decoupled Weight Decay) -->
  <g transform="translate(566, 72)">
    <rect x="0" y="0" width="245" height="278" rx="8" fill="url(#adamwBgGrad)" stroke="#FF8246" stroke-width="1.4" filter="url(#subCardShadow)"/>
    <rect x="0" y="0" width="245" height="30" rx="8" fill="#FF8246"/>
    <rect x="0" y="20" width="245" height="10" fill="#FF8246"/>
    <text x="122" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3. AdamW (Modern Standard)</text>

    <!-- Loss Surface Contour with AdamW -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="221" height="105" rx="5" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/>
      
      <!-- Contour Ellipses -->
      <ellipse cx="150" cy="52" rx="58" ry="36" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="42" ry="25" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="26" ry="15" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
      <ellipse cx="150" cy="52" rx="12" ry="6" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="150" cy="52" r="2.5" fill="#1B3A5F"/>
      <text x="150" y="32" fill="#1B3A5F" font-size="7.5" font-weight="700" text-anchor="middle">Optimum θ*</text>

      <!-- Direct AdamW trajectory path -->
      <path d="M 22 20 Q 80 46 144 51" fill="none" stroke="#FF8246" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
      
      <!-- Start point -->
      <circle cx="22" cy="20" r="3" fill="#FF8246"/>
      <text x="22" y="13" fill="#FF8246" font-size="7.5" font-weight="700">θ₀</text>
      
      <!-- Optimal badge -->
      <rect x="6" y="84" width="126" height="15" rx="3" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="0.8"/>
      <text x="69" y="95" fill="#059669" font-size="7" font-weight="700" text-anchor="middle">Adaptive Curvature + Decoupled</text>
    </g>

    <!-- Math Card -->
    <g transform="translate(12, 149)">
      <rect x="0" y="0" width="221" height="50" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/>
      <text x="110" y="14" fill="#1E293B" font-size="7.5" font-weight="700" text-anchor="middle">m = β₁m + (1-β₁)g  |  v = β₂v + (1-β₂)g²</text>
      <text x="110" y="28" fill="#FF5722" font-size="8" font-weight="700" text-anchor="middle">θ ← θ - η · (m̂ / (√v̂ + ε)) - ηλθ</text>
      <text x="110" y="42" fill="#10B981" font-size="7" font-weight="600" text-anchor="middle">Decoupled true weight decay: -ηλθ</text>
    </g>

    <!-- Characteristics Card -->
    <g transform="translate(12, 205)">
      <rect x="0" y="0" width="221" height="65" rx="4" fill="#1B3A5F"/>
      <text x="10" y="16" fill="#FF8246" font-size="8.5" font-weight="700">⚡ AdamW Invariant</text>
      <text x="10" y="29" fill="#FFFFFF" font-size="7.5">• 1/sqrt(v) rescales anisotropic gradients</text>
      <text x="10" y="41" fill="#FFFFFF" font-size="7.5">• Prevents gradient-coupled distortion</text>
      <text x="10" y="53" fill="#10B981" font-size="7.5" font-weight="600">• Universal standard for LLMs</text>
    </g>
  </g>

  <!-- Bottom Systems Invariant Callout -->
  <g transform="translate(38, 360)">
    <rect x="0" y="0" width="774" height="62" rx="6" fill="#1B3A5F" stroke="#2E6F7E" stroke-width="1"/>
    <text x="20" y="24" fill="#FF8246" font-size="11.5" font-weight="700">⚡ Systems Invariant: Loshchilov &amp; Hutter Decoupled Weight Decay Principle</text>
    <text x="20" y="42" fill="#FFFFFF" font-size="10">Coupling L2 regularization with adaptive second-moment gradients (v) artificially inflates step sizes for large weights; AdamW strictly</text>
    <text x="20" y="54" fill="#CBD5E1" font-size="9.5">decouples weight decay (λθ), guaranteeing invariant regularization dynamics across sparse and dense gradient distributions.</text>
  </g>
</svg>