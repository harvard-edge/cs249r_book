# =============================================================================
# TINYTORCH: THE XV6 OF MACHINE LEARNING SYSTEMS — QUARTO CONFIGURATION
# Publication-Grade Textbook Format (Swift Book / Stripe Press / Pragmatic Style)
# =============================================================================

project:
  type: book
  output-dir: _build

book:
  title: "TinyTorch"
  subtitle: "The xv6 of Machine Learning Systems"
  author: "Prof. Vijay Janapa Reddi"
  date: today
  output-file: TinyTorch-xv6-Book
  cover-image: assets/images/cover.png

  chapters:
    - index.qmd
    - preface.qmd
    - 00_welcome.qmd
    - part: "Part I: The Core Engine"
      chapters:
        - 01_tensors.qmd
        - 02_activations.qmd
        - 03_layers.qmd
        - 04_losses.qmd
        - 05_dataloader.qmd
        - 06_autograd.qmd
        - 07_optimizers.qmd
        - 08_training.qmd
        - milestone_01.qmd
    - part: "Part II: Deep Architectures"
      chapters:
        - 09_convolutions.qmd
        - 10_tokenization.qmd
        - 11_embeddings.qmd
        - 12_attention.qmd
        - 13_transformers.qmd
        - milestone_02.qmd
    - part: "Part III: Systems & Acceleration"
      chapters:
        - 14_profiling.qmd
        - 15_quantization.qmd
        - 16_compression.qmd
        - 17_acceleration.qmd
        - 18_memoization.qmd
        - 19_benchmarking.qmd
        - 20_capstone.qmd
        - milestone_03.qmd
    - part: "Part IV: Extensions & Future Frontiers"
      chapters:
        - 21_extensions.qmd

metadata-files:
  - ../../../publishing/quarto/config/shared/base/crossref-labels.yml
  - ../../../publishing/quarto/config/shared/base/custom-numbered-blocks.yml
  - ../../../shared/config/navbar-common.yml
  - ../../../shared/config/footer-common.yml

format:
  pdf:
    documentclass: book
    papersize: letter
    geometry:
      - inner=1in
      - outer=1in
      - top=1in
      - bottom=1in
    pdf-engine: lualatex
    
    mainfont: "texgyrepagella"
    mainfontoptions:
      - "Extension=.otf"
      - "UprightFont=*-regular"
      - "BoldFont=*-bold"
      - "ItalicFont=*-italic"
      - "BoldItalicFont=*-bolditalic"
      - "Ligatures=TeX"
    sansfont: "texgyreheros"
    sansfontoptions:
      - "Extension=.otf"
      - "UprightFont=*-regular"
      - "BoldFont=*-bold"
      - "ItalicFont=*-italic"
      - "BoldItalicFont=*-bolditalic"
    monofont: "texgyrecursor"
    monofontoptions:
      - "Extension=.otf"
      - "UprightFont=*-regular"
      - "BoldFont=*-bold"
      - "ItalicFont=*-italic"
      - "BoldItalicFont=*-bolditalic"
      - "Scale=0.88"
      
    toc: true
    toc-depth: 2
    number-sections: true
    linestretch: 1.12
    colorlinks: true
    linkcolor: torchnavy
    urlcolor: flameorange
    citecolor: torchnavy
    
    template-partials:
      - tex/title.tex
    include-before-body:
      - tex/cover.tex
    include-in-header:
      text: |
        \usepackage{tikz}
        \usetikzlibrary{calc,positioning,decorations.pathmorphing}
        \usepackage[most]{tcolorbox}
        \usepackage{fancyhdr}
        \usepackage{titlesec}
        \usepackage{enumitem}
        \setlist[enumerate]{itemsep=0.3em,topsep=0.3em}
        \setlist[itemize]{itemsep=0.3em,topsep=0.3em}

        \definecolor{torchnavy}{RGB}{27,58,95}
        \definecolor{flameorange}{RGB}{255,130,70}
        \definecolor{flamered}{RGB}{210,35,65}
        \definecolor{bodygray}{RGB}{40,40,40}
        \definecolor{codebackground}{RGB}{255,248,240}
        \definecolor{accentwarm}{RGB}{255,160,100}

        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{%
          breaklines,%
          breakanywhere,%
          breaksymbolleft={\color{flameorange!60}\hookrightarrow\space},%
          breaksymbolright={},%
          breakanywheresymbolpre={},%
          breakanywheresymbolpost={},%
          commandchars=\\\{\}%
        }
        \RecustomVerbatimEnvironment{verbatim}{Verbatim}{%
          breaklines,%
          breakanywhere,%
          breaksymbolleft={\color{flameorange!60}\hookrightarrow\space},%
          breaksymbolright={}%
        }

        \usepackage[export]{adjustbox}
        \let\TTOrigIncludeGraphics\includegraphics
        \renewcommand{\includegraphics}[2][]{%
          \TTOrigIncludeGraphics[%
            keepaspectratio,#1,%
            max width=0.85\linewidth,%
            max height=0.55\textheight%
          ]{#2}%
        }

        \widowpenalty=10000
        \clubpenalty=10000
        \raggedbottom

        \setlength{\headheight}{18pt}
        \setlength{\headsep}{16pt}
        \renewcommand{\chaptermark}[1]{\markboth{Chapter \thechapter\ · #1}{}}
        \renewcommand{\sectionmark}[1]{\markright{\thesection\ · #1}}
        \fancypagestyle{tinytorch}{%
          \fancyhf{}%
          \fancyhead[LE]{\footnotesize\color{torchnavy!60}\scshape\nouppercase{\leftmark}}%
          \fancyhead[RO]{\footnotesize\color{torchnavy!60}\scshape\nouppercase{\rightmark}}%
          \fancyhead[C]{%
            \footnotesize\color{flameorange}Tiny%
            \kern1pt\raisebox{-1pt}{%
              \includegraphics[height=9pt]%
                {assets/images/logos/fire-emoji.png}%
            }%
            \kern1pt\color{torchnavy}Torch%
          }%
          \fancyfoot[LE,RO]{\small\color{torchnavy!60}\thepage}%
          \renewcommand{\headrulewidth}{0pt}%
          \renewcommand{\footrulewidth}{0pt}%
          \renewcommand{\headrule}{%
            \vbox to 0pt{%
              \vskip 3pt%
              {\color{flameorange!70}\hrule height 0.4pt}%
            }%
          }%
        }
        \pagestyle{tinytorch}
        \fancypagestyle{plain}{%
          \fancyhf{}%
          \fancyhead[C]{%
            \footnotesize\color{flameorange}Tiny%
            \kern1pt\raisebox{-1pt}{%
              \includegraphics[height=9pt]%
                {assets/images/logos/fire-emoji.png}%
            }%
            \kern1pt\color{torchnavy}Torch%
          }%
          \fancyfoot[LE,RO]{\small\color{torchnavy!60}\thepage}%
          \renewcommand{\headrulewidth}{0pt}%
          \renewcommand{\footrulewidth}{0pt}%
          \renewcommand{\headrule}{%
            \vbox to 0pt{%
              \vskip 3pt%
              {\color{flameorange!70}\hrule height 0.4pt}%
            }%
          }%
        }

        \titleformat{\chapter}[display]
          {\normalfont\sffamily}
          {\color{flameorange}\Large\bfseries
             \raisebox{-2pt}{%
               \includegraphics[height=1em]%
                 {assets/images/logos/fire-emoji.png}%
             }\,Chapter \thechapter}
          {0.6em}
          {\color{torchnavy}\Huge\bfseries}
          [\vspace{0.5em}%
           {\color{torchnavy!30}\titlerule[0.4pt]}]
        \titlespacing*{\chapter}{0pt}{10pt}{28pt}

        \titleformat{\part}[display]
          {\centering\normalfont\sffamily}
          {\vspace*{0.15\textheight}%
           {\color{flameorange!50}\titlerule[0.6pt]}\vspace{1em}%
           {\color{flameorange}\large\bfseries\MakeUppercase{\partname~\thepart}}}
          {0.8em}
          {\color{torchnavy}\Huge\bfseries}
          [\vspace{1em}{\color{flameorange!50}\titlerule[0.6pt]}]
        \titlespacing*{\part}{0pt}{0pt}{0pt}

        \titleformat{\section}
          {\normalfont\sffamily\Large\bfseries\color{torchnavy}}
          {\color{flameorange}\mdseries\thesection}{0.75em}{}
        \titleformat{\subsection}
          {\normalfont\sffamily\large\bfseries\color{torchnavy!85}}
          {\color{torchnavy!60}\thesubsection}{0.6em}{}
        \titleformat{\subsubsection}
          {\normalfont\sffamily\normalsize\bfseries\color{torchnavy!75}}
          {}{0em}{}
        \titlespacing*{\section}{0pt}{1.4em}{0.6em}
        \titlespacing*{\subsection}{0pt}{1.1em}{0.4em}
        \titlespacing*{\subsubsection}{0pt}{0.9em}{0.3em}

        \setlength{\parskip}{0pt plus 0.5pt}
        \setlength{\parindent}{1.2em}
        \renewcommand{\arraystretch}{1.2}

        \definecolor{quarto-callout-note-color}{RGB}{27,58,95}
        \definecolor{quarto-callout-tip-color}{RGB}{45,122,61}
        \definecolor{quarto-callout-warning-color}{RGB}{255,130,70}
        \definecolor{quarto-callout-caution-color}{RGB}{210,35,65}
        \definecolor{quarto-callout-important-color}{RGB}{196,82,96}
        \definecolor{quarto-callout-note-color-frame}{RGB}{27,58,95}
        \definecolor{quarto-callout-tip-color-frame}{RGB}{45,122,61}
        \definecolor{quarto-callout-warning-color-frame}{RGB}{255,130,70}
        \definecolor{quarto-callout-caution-color-frame}{RGB}{210,35,65}
        \definecolor{quarto-callout-important-color-frame}{RGB}{196,82,96}

        \tcbset{%
          fonttitle=\bfseries\sffamily\color{torchnavy},%
          beforeafter skip=6pt%
        }

    fig-pos: "H"
    fig-align: center
    code-line-numbers: false
    code-block-bg: "#FFF8F0"
    code-block-border-left: "#FF8246"
    highlight-style: tango

execute:
  enabled: false

filters:
  - strip-emojis.lua
  - ../quarto/tools/diagrams/svg-to-pdf.lua
