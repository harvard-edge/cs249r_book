<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="30" y="30" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Pre-LN Transformer Block &amp; GPT-2 Language Model Architecture</text>
  <line x1="30" y1="40" x2="850" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== PANEL 1: PRE-LN TRANSFORMER BLOCK ==================== -->
  <g transform="translate(30, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">1. Pre-LN TransformerBlock</text>

    <!-- Block Architecture Dataflow -->
    <g transform="translate(10, 24)">
      <!-- Input Box -->
      <rect x="50" y="0" width="140" height="20" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="120" y="13" font-size="8" font-family="monospace" font-weight="700" fill="#111827" text-anchor="middle">x₀ = Embed + Pos</text>

      <!-- Residual Highway 1 (Left orange dashed arc) -->
      <path d="M 50 10 C 15 10 15 78 54 78" fill="none" stroke="#C85A17" stroke-width="1.5" stroke-dasharray="3,2" />
      <text x="12" y="48" font-size="7.5" font-weight="700" fill="#C85A17">Skip 1</text>

      <!-- LN1 -> MHA -->
      <path d="M 120 20 L 120 30" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      
      <rect x="75" y="30" width="90" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
      <text x="120" y="42" font-size="8" fill="#4B5563" text-anchor="middle">LayerNorm 1</text>

      <path d="M 120 48 L 120 56" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="65" y="56" width="110" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <text x="120" y="69" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">Causal Self-Attention</text>

      <!-- Add Circle 1 -->
      <path d="M 120 76 L 120 84" stroke="#111827" stroke-width="1.2" />
      <circle cx="120" cy="91" r="7" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="120" y="94" font-size="9" font-weight="700" fill="#111827" text-anchor="middle">+</text>
      <path d="M 54 78 C 80 78 100 86 112 91" fill="none" stroke="#C85A17" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowOrange)" />

      <!-- Residual Highway 2 (Left orange dashed arc) -->
      <path d="M 50 91 C 15 91 15 158 54 158" fill="none" stroke="#C85A17" stroke-width="1.5" stroke-dasharray="3,2" />
      <text x="12" y="128" font-size="7.5" font-weight="700" fill="#C85A17">Skip 2</text>

      <!-- LN2 -> MLP -->
      <path d="M 120 98 L 120 108" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="75" y="108" width="90" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
      <text x="120" y="120" font-size="8" fill="#4B5563" text-anchor="middle">LayerNorm 2</text>

      <path d="M 120 126 L 120 134" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="65" y="134" width="110" height="20" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="120" y="147" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">MLP (4× Expansion)</text>

      <!-- Add Circle 2 -->
      <path d="M 120 154 L 120 162" stroke="#111827" stroke-width="1.2" />
      <circle cx="120" cy="169" r="7" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="120" y="172" font-size="9" font-weight="700" fill="#111827" text-anchor="middle">+</text>
      <path d="M 54 158 C 80 158 100 165 112 169" fill="none" stroke="#C85A17" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowOrange)" />

      <!-- Output Box -->
      <path d="M 120 176 L 120 186" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
      <rect x="50" y="186" width="140" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <text x="120" y="199" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">x_out [B, T, d_model]</text>
    </g>

    <!-- Pre-LN Invariant Note -->
    <g transform="translate(0, 236)">
      <text x="120" y="0" font-size="7.5" font-weight="600" fill="#C85A17" text-anchor="middle">Identity Highway: Unhindered ∂L/∂x Flow</text>
    </g>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <g transform="translate(262, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 2: 4X MLP EXPANSION & GELU ==================== -->
  <g transform="translate(285, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">2. MLP 4× Expansion &amp; GELU</text>

    <!-- MLP Flow -->
    <g transform="translate(0, 24)">
      <!-- Linear 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="265" height="24" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="8" y="15" font-size="8" font-weight="700" fill="#111827">Linear 1: <tspan font-family="monospace" fill="#4B5563">d_model → 4·d_model (768 → 3072)</tspan></text>
      </g>

      <path d="M 132 24 L 132 32" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- GELU Activation -->
      <g transform="translate(0, 34)">
        <rect x="0" y="0" width="265" height="34" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="#C85A17">GELU Non-Linearity</text>
        <text x="8" y="27" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#9A3412">GELU(x) = x · Φ(x) ≈ 0.5x ( 1 + tanh( √(2/π) (x + 0.0447x³) ) )</text>
      </g>

      <path d="M 132 68 L 132 76" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Linear 2 -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="265" height="24" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="8" y="15" font-size="8" font-weight="700" fill="#111827">Linear 2: <tspan font-family="monospace" fill="#4B5563">4·d_model → d_model (3072 → 768)</tspan></text>
      </g>

      <path d="M 132 102 L 132 110" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Dropout -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="265" height="20" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="8" y="14" font-size="8" font-family="monospace" fill="#4B5563">Dropout (p = 0.1) &amp; Residual Projection</text>
      </g>
    </g>

    <!-- Capacity Card -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="265" height="74" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Feed-Forward Reasoning Capacity:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• Acts as associative key-value memory store</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• 4× expansion holds ~66% of transformer parameters</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Applied independently to every token position</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ High-Capacity Pointwise Processing</text>
    </g>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <g transform="translate(558, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 3: FULL LM STACK & LOGITS ==================== -->
  <g transform="translate(582, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">3. Full LM Stack &amp; Logits</text>

    <!-- Pipeline Architecture -->
    <g transform="translate(0, 24)">
      <!-- Block Stack -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="265" height="34" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="132" y="14" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">TransformerBlock × L Layers</text>
        <text x="132" y="26" font-size="7.5" font-family="monospace" fill="#6B7280" text-anchor="middle">(L = 12 for GPT-2 Small, 117M params)</text>
      </g>

      <path d="M 132 34 L 132 42" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Final LayerNorm -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="265" height="22" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="132" y="14" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">Final LayerNorm (ln_f)</text>
      </g>

      <path d="M 132 66 L 132 74" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- LM Head -->
      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="265" height="26" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="132" y="12" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">LM Head: W_head [d_model, V]</text>
        <text x="132" y="22" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">(Weight-tied with W_embed)</text>
      </g>

      <path d="M 132 102 L 132 110" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

      <!-- Output Logits -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="265" height="24" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="132" y="16" font-size="8.5" font-family="monospace" font-weight="700" fill="#9A3412" text-anchor="middle">Logits Z [B, T, V=50257]</text>
      </g>
    </g>

    <!-- Execution Mode Card -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="265" height="74" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Dual-Mode Execution Contract:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• Train: CrossEntropy(Z, Targets) via teacher forcing</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• Inference: Slice Z[:, -1, :] for next-token sampling</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• End-to-end differentiable autograd graph</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ Unified Foundation Model Architecture</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS & HARDWARE NOTES ==================== -->
  <g transform="translate(30, 310)">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#E5E7EB" stroke-width="1.0" />
    <text x="0" y="18" font-size="11" font-weight="700" fill="#111827">Pre-LN Gradient Highway Invariant:</text>
    <text x="210" y="18" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">
      ∂L/∂x_0 = ∂L/∂x_L + ∑_(l=1)^L (∂L/∂SubLayer_l),    lim_(L→∞) ||∂L/∂x_0|| = O(1)
    </text>
    <text x="0" y="38" font-size="9.5" fill="#4B5563">
      <tspan font-weight="600" fill="#111827">Identity Highway Stability:</tspan> Pre-LayerNorm establishes an unhindered identity highway through L layers, eliminating vanishing gradients
    </text>
    <text x="0" y="52" font-size="9.5" fill="#4B5563">
      and enabling stable deep transformer training without delicate warmup hyperparameter schedules (unlike Post-LN O(1/L) gradient decay).
    </text>
  </g>
</svg>
