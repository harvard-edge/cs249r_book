<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">INT8 Quantization Geometry: Symmetric vs. Asymmetric Numerical Mapping</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TOP: BITWIDTH COMPARISON ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="800" height="42" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2" />
    
    <!-- FP32 Bit Layout -->
    <text x="16" y="18" font-size="11" font-weight="700" fill="#111827">FP32 (4 Bytes / element):</text>
    <g transform="translate(16, 23)">
      <rect x="0" y="0" width="18" height="12" fill="#111827" />
      <text x="9" y="9" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
      <rect x="20" y="0" width="68" height="12" fill="#4B5563" />
      <text x="54" y="9" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Exponent (8b)</text>
      <rect x="90" y="0" width="140" height="12" fill="#9CA3AF" />
      <text x="160" y="9" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mantissa (23b)</text>
    </g>

    <!-- Arrow to INT8 -->
    <path d="M260 21 H295" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <text x="277" y="14" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">4× Cut</text>

    <!-- INT8 Bit Layout -->
    <text x="315" y="18" font-size="11" font-weight="700" fill="#111827">INT8 (1 Byte / element):</text>
    <g transform="translate(315, 23)">
      <rect x="0" y="0" width="18" height="12" fill="#C85A17" />
      <text x="9" y="9" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
      <rect x="20" y="0" width="90" height="12" fill="#EA580C" />
      <text x="65" y="9" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Signed Mag (7b)</text>
    </g>

    <!-- Systems Benefit Note -->
    <rect x="445" y="7" width="340" height="28" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
    <text x="455" y="24" font-size="10" font-weight="700" fill="#9A3412">75% Bandwidth Reduction: Direct INT8 Tensor Core GEMMs</text>
  </g>

  <!-- ==================== MIDDLE LEFT: SYMMETRIC QUANTIZATION ==================== -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="390" height="268" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="390" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="390" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Symmetric Quantization (Z = 0)</text>
    <text x="376" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">Scale S = max(|X|) / 127</text>

    <!-- FP32 Continuous Axis -->
    <text x="16" y="52" font-size="10.5" font-weight="700" fill="#4B5563">FP32 Domain:</text>
    <line x1="100" y1="48" x2="360" y2="48" stroke="#111827" stroke-width="1.5" />
    <circle cx="110" cy="48" r="4" fill="#C85A17" />
    <circle cx="230" cy="48" r="4" fill="#111827" />
    <circle cx="350" cy="48" r="4" fill="#C85A17" />
    <text x="110" y="65" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">-max</text>
    <text x="230" y="65" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">0.0 (Zero)</text>
    <text x="350" y="65" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">+max</text>

    <!-- Projection Arrows -->
    <line x1="110" y1="72" x2="110" y2="92" stroke="#C85A17" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowOrange)" />
    <line x1="230" y1="72" x2="230" y2="92" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="350" y1="72" x2="350" y2="92" stroke="#C85A17" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowOrange)" />

    <!-- INT8 Integer Lattice -->
    <text x="16" y="114" font-size="10.5" font-weight="700" fill="#4B5563">INT8 Lattice:</text>
    <rect x="100" y="100" width="260" height="22" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1" />
    <!-- Tick lines -->
    <line x1="110" y1="100" x2="110" y2="122" stroke="#C85A17" stroke-width="1.5" />
    <line x1="230" y1="100" x2="230" y2="122" stroke="#111827" stroke-width="1.5" />
    <line x1="350" y1="100" x2="350" y2="122" stroke="#C85A17" stroke-width="1.5" />
    <text x="110" y="136" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">-127</text>
    <text x="230" y="136" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">q = 0 (Z = 0)</text>
    <text x="350" y="136" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">+127</text>

    <!-- Mathematical Formula Box -->
    <rect x="14" y="146" width="362" height="66" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
    <text x="24" y="165" font-size="10" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">Quantize:   q = clamp( round( x / S ), -127, 127 )</text>
    <text x="24" y="184" font-size="10" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">Dequantize: x̂ = q × S</text>
    <text x="24" y="202" font-size="9" fill="#4B5563">GEMM: W · x ≈ (S_w · S_x) × (Q_w · Q_x)</text>

    <!-- Properties / Systems Impact -->
    <g transform="translate(14, 222)">
      <text x="0" y="12" font-size="9.5" font-weight="700" fill="#111827">• Zero addition overhead: <tspan font-weight="400" fill="#4B5563">No zero-point runtime corrections.</tspan></text>
      <text x="0" y="28" font-size="9.5" font-weight="700" fill="#111827">• Standard for LLM Weights: <tspan font-weight="400" fill="#4B5563">Uniform zero-centered distributions.</tspan></text>
    </g>
  </g>

  <!-- ==================== MIDDLE RIGHT: ASYMMETRIC QUANTIZATION ==================== -->
  <g transform="translate(450, 110)">
    <rect x="0" y="0" width="390" height="268" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="390" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="390" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Asymmetric Quantization (Z ≠ 0)</text>
    <text x="376" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">S = (x_max - x_min) / 255</text>

    <!-- FP32 Continuous Axis (Skewed) -->
    <text x="16" y="52" font-size="10.5" font-weight="700" fill="#4B5563">FP32 Domain:</text>
    <line x1="100" y1="48" x2="360" y2="48" stroke="#111827" stroke-width="1.5" />
    <circle cx="110" cy="48" r="4" fill="#C85A17" />
    <circle cx="155" cy="48" r="4" fill="#111827" />
    <circle cx="350" cy="48" r="4" fill="#C85A17" />
    <text x="110" y="65" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">x_min (-1.5)</text>
    <text x="155" y="65" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">0.0</text>
    <text x="350" y="65" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">x_max (+8.5)</text>

    <!-- Projection Arrows -->
    <line x1="110" y1="72" x2="110" y2="92" stroke="#C85A17" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowOrange)" />
    <line x1="155" y1="72" x2="155" y2="92" stroke="#C85A17" stroke-width="1.2" marker-end="url(#arrowOrange)" />
    <line x1="350" y1="72" x2="350" y2="92" stroke="#C85A17" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowOrange)" />

    <!-- INT8 Integer Lattice (Asymmetric with Non-Zero Z) -->
    <text x="16" y="114" font-size="10.5" font-weight="700" fill="#4B5563">INT8 Lattice:</text>
    <rect x="100" y="100" width="260" height="22" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
    <!-- Tick lines -->
    <line x1="110" y1="100" x2="110" y2="122" stroke="#C85A17" stroke-width="1.5" />
    <line x1="155" y1="100" x2="155" y2="122" stroke="#C85A17" stroke-width="1.5" />
    <line x1="350" y1="100" x2="350" y2="122" stroke="#C85A17" stroke-width="1.5" />
    <text x="110" y="136" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">-128</text>
    <text x="155" y="136" font-size="9.5" font-weight="700" fill="#9A3412" text-anchor="middle">Z = -89</text>
    <text x="350" y="136" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">+127</text>

    <!-- Mathematical Formula Box -->
    <rect x="14" y="146" width="362" height="66" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
    <text x="24" y="165" font-size="10" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">Quantize:   q = clamp( round( x / S ) + Z, -128, 127 )</text>
    <text x="24" y="184" font-size="10" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">Dequantize: x̂ = ( q - Z ) × S</text>
    <text x="24" y="202" font-size="9" fill="#4B5563">GEMM: W · x requires offset correction ∑_j W_ij · Z_x</text>

    <!-- Properties / Systems Impact -->
    <g transform="translate(14, 222)">
      <text x="0" y="12" font-size="9.5" font-weight="700" fill="#111827">• Full Dynamic Range: <tspan font-weight="400" fill="#4B5563">Maximizes bit utilization on skewed data (ReLU).</tspan></text>
      <text x="0" y="28" font-size="9.5" font-weight="700" fill="#111827">• Runtime Penalty: <tspan font-weight="400" fill="#4B5563">Extra accumulator additions during GEMM steps.</tspan></text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Symmetric mapping (Z = 0) eliminates runtime zero-point cross-terms, enabling line-rate systolic INT8 GEMMs.
      <tspan x="0" dy="16">Asymmetric mapping (Z ≠ 0) preserves dynamic range for strictly non-negative activation distributions (e.g. ReLU/GELU).</tspan>
    </text>
  </g>
</svg>
