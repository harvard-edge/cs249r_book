<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <filter id="subCardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3A5F" flood-opacity="0.05"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="evalBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2E6F7E" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D22341" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="15" width="810" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header Banner -->
  <rect x="20" y="15" width="810" height="45" rx="10" fill="url(#torchGrad)"/>
  <rect x="20" y="45" width="810" height="15" fill="url(#torchGrad)"/>
  <text x="38" y="42" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.4">THE 5-STEP TRAINING ENGINE: RIGID STATE MACHINE CONTRACT</text>
  <rect x="685" y="27" width="130" height="22" rx="11" fill="#FF8246"/>
  <text x="750" y="42" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">EXECUTION PIPELINE</text>

  <!-- Top Section: 5 Sequential Pipeline Stages -->
  <g transform="translate(35, 75)">
    <!-- Stage 1: zero_grad() -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="142" height="125" rx="6" fill="url(#warmBgGrad)" stroke="#2E6F7E" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="142" height="24" rx="6" fill="#2E6F7E"/>
      <rect x="0" y="14" width="142" height="10" fill="#2E6F7E"/>
      <text x="71" y="16" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Step 1: Reset Grads</text>
      
      <rect x="8" y="32" width="126" height="24" rx="3" fill="#1B3A5F"/>
      <text x="71" y="48" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">opt.zero_grad()</text>
      
      <text x="71" y="72" fill="#1E293B" font-size="8" font-weight="600" text-anchor="middle">for p in params:</text>
      <text x="71" y="85" fill="#2E6F7E" font-size="8" font-weight="600" text-anchor="middle">p.grad = 0.0</text>
      <text x="71" y="108" fill="#64748B" font-size="7.5" text-anchor="middle">Clears stale buffers</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M145 62 L157 62" stroke="#1B3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>

    <!-- Stage 2: forward() -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="142" height="125" rx="6" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="142" height="24" rx="6" fill="#1B3A5F"/>
      <rect x="0" y="14" width="142" height="10" fill="#1B3A5F"/>
      <text x="71" y="16" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Step 2: Forward Pass</text>
      
      <rect x="8" y="32" width="126" height="24" rx="3" fill="#1B3A5F"/>
      <text x="71" y="48" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">y_pred = model(X)</text>
      
      <text x="71" y="72" fill="#1E293B" font-size="8" font-weight="600" text-anchor="middle">Dynamic Tape DAG</text>
      <text x="71" y="85" fill="#1B3A5F" font-size="8" font-weight="600" text-anchor="middle">Linear → GELU → Out</text>
      <text x="71" y="108" fill="#64748B" font-size="7.5" text-anchor="middle">Saves ctx for backward</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M305 62 L317 62" stroke="#1B3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>

    <!-- Stage 3: loss() -->
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="142" height="125" rx="6" fill="url(#warmBgGrad)" stroke="#FF8246" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="142" height="24" rx="6" fill="#FF8246"/>
      <rect x="0" y="14" width="142" height="10" fill="#FF8246"/>
      <text x="71" y="16" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Step 3: Evaluate Loss</text>
      
      <rect x="8" y="32" width="126" height="24" rx="3" fill="#1B3A5F"/>
      <text x="71" y="48" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">L = criterion(y_pred, y)</text>
      
      <text x="71" y="72" fill="#1E293B" font-size="8" font-weight="600" text-anchor="middle">Scalar Objective</text>
      <text x="71" y="85" fill="#D22341" font-size="8" font-weight="600" text-anchor="middle">CrossEntropy / MSE</text>
      <text x="71" y="108" fill="#64748B" font-size="7.5" text-anchor="middle">DAG Root Node</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M465 62 L477 62" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <!-- Stage 4: backward() -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="142" height="125" rx="6" fill="url(#warmBgGrad)" stroke="#D22341" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="142" height="24" rx="6" fill="#D22341"/>
      <rect x="0" y="14" width="142" height="10" fill="#D22341"/>
      <text x="71" y="16" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Step 4: Autograd Tape</text>
      
      <rect x="8" y="32" width="126" height="24" rx="3" fill="#1B3A5F"/>
      <text x="71" y="48" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">loss.backward()</text>
      
      <text x="71" y="72" fill="#1E293B" font-size="8" font-weight="600" text-anchor="middle">Reverse Topo Sort</text>
      <text x="71" y="85" fill="#D22341" font-size="8" font-weight="700" text-anchor="middle">p.grad += dL/dp</text>
      <text x="71" y="108" fill="#64748B" font-size="7.5" text-anchor="middle">In-place accumulation</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M625 62 L637 62" stroke="#D22341" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Stage 5: step() -->
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="140" height="125" rx="6" fill="url(#warmBgGrad)" stroke="#10B981" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="140" height="24" rx="6" fill="#10B981"/>
      <rect x="0" y="14" width="140" height="10" fill="#10B981"/>
      <text x="70" y="16" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Step 5: Parameter Step</text>
      
      <rect x="8" y="32" width="124" height="24" rx="3" fill="#1B3A5F"/>
      <text x="70" y="48" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">optimizer.step()</text>
      
      <text x="70" y="72" fill="#1E293B" font-size="8" font-weight="600" text-anchor="middle">In-Place Weight Update</text>
      <text x="70" y="85" fill="#10B981" font-size="8" font-weight="700" text-anchor="middle">p.data = p.data - η · Δ</text>
      <text x="70" y="108" fill="#64748B" font-size="7.5" text-anchor="middle">AdamW / SGD-M</text>
    </g>
  </g>

  <!-- Middle Section: Train vs Eval State Contracts -->
  <g transform="translate(35, 215)">
    <!-- Subcard A: Training Mode Contract -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="380" height="132" rx="6" fill="url(#warmBgGrad)" stroke="#FF8246" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="380" height="26" rx="6" fill="#1B3A5F"/>
      <rect x="0" y="16" width="380" height="10" fill="#1B3A5F"/>
      <text x="190" y="18" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Mode Contract: model.train()</text>
      
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="170" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="10" y="16" fill="#1B3A5F" font-size="8.5" font-weight="700">• Dropout Active</text>
        <text x="10" y="30" fill="#64748B" font-size="7.5">Stochastic neuron masking</text>

        <rect x="180" y="0" width="175" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="190" y="16" fill="#1B3A5F" font-size="8.5" font-weight="700">• BatchNorm Statistics</text>
        <text x="190" y="30" fill="#64748B" font-size="7.5">Updates running mean/variance</text>
        
        <rect x="0" y="48" width="355" height="40" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/>
        <text x="177" y="63" fill="#FF5722" font-size="8.5" font-weight="700" text-anchor="middle">Autograd Graph Memory Overhead Active</text>
        <text x="177" y="78" fill="#475569" font-size="7.5" text-anchor="middle">Tensors retain grad_fn and intermediate activations for backward()</text>
      </g>
    </g>

    <!-- Subcard B: Eval Mode Contract -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="380" height="132" rx="6" fill="url(#evalBgGrad)" stroke="#10B981" stroke-width="1.2" filter="url(#subCardShadow)"/>
      <rect x="0" y="0" width="380" height="26" rx="6" fill="#10B981"/>
      <rect x="0" y="16" width="380" height="10" fill="#10B981"/>
      <text x="190" y="18" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Mode Contract: model.eval() + torch.no_grad()</text>
      
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="170" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="10" y="16" fill="#1B3A5F" font-size="8.5" font-weight="700">• Dropout Disabled</text>
        <text x="10" y="30" fill="#64748B" font-size="7.5">Deterministic weight scaling</text>

        <rect x="180" y="0" width="175" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="190" y="16" fill="#1B3A5F" font-size="8.5" font-weight="700">• BatchNorm Frozen</text>
        <text x="190" y="30" fill="#64748B" font-size="7.5">Uses fixed population stats</text>
        
        <rect x="0" y="48" width="355" height="40" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
        <text x="177" y="63" fill="#059669" font-size="8.5" font-weight="700" text-anchor="middle">Zero Graph Memory Overhead (Peak Inference Speed)</text>
        <text x="177" y="78" fill="#475569" font-size="7.5" text-anchor="middle">Disables autograd tape recording; intermediate activations freed instantly</text>
      </g>
    </g>
  </g>

  <!-- Bottom Systems Invariant Callout -->
  <g transform="translate(35, 360)">
    <rect x="0" y="0" width="780" height="62" rx="6" fill="#1B3A5F" stroke="#2E6F7E" stroke-width="1"/>
    <text x="20" y="24" fill="#FF8246" font-size="11.5" font-weight="700">⚡ Systems Invariant: Non-Commutative State Lifecycle &amp; In-Place Mutation Safety</text>
    <text x="20" y="42" fill="#FFFFFF" font-size="10">The 5-step training pipeline is strictly non-commutative: zero_grad() must precede backward() to prevent ghost gradient accumulation,</text>
    <text x="20" y="54" fill="#CBD5E1" font-size="9.5">and optimizer.step() updates weights in-place (.data) without mutating or breaking active autograd computation graph nodes.</text>
  </g>
</svg>