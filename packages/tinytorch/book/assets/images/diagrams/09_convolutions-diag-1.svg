    <!-- Transform Details Box -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="220" height="74" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Memory Layout Property:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• Each column = 1 unrolled receptive patch</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• Memory overhead: K_h × K_w duplication</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Forward: im2col | Backward: col2im</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#111827">→ Dense, Contiguous Column Storage</text>
