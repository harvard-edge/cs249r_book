        <text x="18" y="52" font-size="8" fill="#C85A17" text-anchor="middle">⋮</text>
        <rect x="0" y="56" width="36" height="13" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="1" />
