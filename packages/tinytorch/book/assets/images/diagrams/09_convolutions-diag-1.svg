      <text x="10" y="80" font-size="8.5" fill="#6B7280" text-anchor="middle">x₃₀</text>
      <rect x="22" y="66" width="20" height="20" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" />
