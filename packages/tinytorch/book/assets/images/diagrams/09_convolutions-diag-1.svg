    <text x="0" y="32" font-size="10" font-family="monospace" fill="#4B5563">X_col [K²·C=9, H_out·W_out=4]</text>

    <!-- Matrix Columns Structure -->
    <g transform="translate(0, 40)">
      <!-- Column Headers -->
      <text x="24" y="10" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">Col 0</text>
      <text x="64" y="10" font-size="8" font-weight="600" fill="#4B5563" text-anchor="middle">Col 1</text>
      <text x="104" y="10" font-size="8" font-weight="600" fill="#4B5563" text-anchor="middle">Col 2</text>
      <text x="144" y="10" font-size="8" font-weight="600" fill="#4B5563" text-anchor="middle">Col 3</text>

