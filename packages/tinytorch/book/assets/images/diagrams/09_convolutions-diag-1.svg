    <text x="12" y="-8" font-size="8.5" font-family="monospace" fill="#C85A17" text-anchor="middle">GEMM</text>
  </g>

  <!-- ==================== PANEL 3: HIGH-THROUGHPUT GEMM & RESHAPE ==================== -->
  <g transform="translate(550, 54)">
    <!-- Panel Header -->
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">3. Systolic GEMM &amp; Output Reshape</text>
    <text x="0" y="32" font-size="10" font-family="monospace" fill="#4B5563">Y_flat = W_row × X_col</text>

    <!-- GEMM Formulation -->
    <g transform="translate(0, 40)">
      <!-- W_row -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="62" height="28" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="31" y="12" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">W_row</text>
        <text x="31" y="23" font-size="7" font-family="monospace" fill="#6B7280" text-anchor="middle">[C_out, K²·C]</text>
      </g>

      <!-- Multiplier -->
      <text x="70" y="18" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">×</text>

      <!-- X_col -->
      <g transform="translate(78, 0)">
        <rect x="0" y="0" width="68" height="42" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="2" />
        <text x="34" y="16" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">X_col</text>
        <text x="34" y="28" font-size="7" font-family="monospace" fill="#9A3412" text-anchor="middle">[K²·C, H_o·W_o]</text>
      </g>

      <!-- Equals -->
      <text x="154" y="18" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">=</text>

      <!-- Y_flat -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="72" height="28" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="36" y="12" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">Y_flat</text>
        <text x="36" y="23" font-size="7" font-family="monospace" fill="#9A3412" text-anchor="middle">[C_out, H_o·W_o]</text>
      </g>

      <!-- Reshape Down Arrow -->
      <path d="M 198 34 L 198 48" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      <text x="206" y="44" font-size="7.5" font-family="monospace" fill="#4B5563">reshape</text>

      <!-- Reshaped 2D Output Tensor -->
      <g transform="translate(162, 52)">
        <rect x="0" y="0" width="72" height="34" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="36" y="13" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">Output Y</text>
        <text x="36" y="23" font-size="7" font-family="monospace" fill="#4B5563" text-anchor="middle">[C_out, H_o, W_o]</text>
        <text x="36" y="31" font-size="7.5" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">[1, 2, 2]</text>
      </g>
    </g>

    <!-- Systolic Hardware Metric Card -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="235" height="74" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Hardware Execution Engine:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• 90%+ Peak TFLOP/s on Tensor Cores</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• Fully tiled L1/L2 SRAM caching</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Single standard BLAS gemm() dispatch</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ Maximum Compute Density</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS & HARDWARE NOTES ==================== -->
  <g transform="translate(30, 310)">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#E5E7EB" stroke-width="1.0" />
    <text x="0" y="18" font-size="11" font-weight="700" fill="#111827">Chellapilla im2col Invariant:</text>
    <text x="165" y="18" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">
      Y[n, c_out, h, w] = ∑ X[n, c_in, h·S + i, w·S + j] · W[c_out, c_in, i, j] ≡ reshape(W_row · X_col)
    </text>
    <text x="0" y="38" font-size="9.5" fill="#4B5563">
      <tspan font-weight="600" fill="#111827">Memory Duplication for Peak GEMM Throughput:</tspan> im2col duplicates overlapping receptive fields in DRAM (K_h × K_w overhead) to convert
    </text>
    <text x="0" y="52" font-size="9.5" fill="#4B5563">
      O(N⁶) strided loops into contiguous matrix multiplication, executing at &gt;90% hardware roofline on systolic matrix engines.
    </text>
  </g>
</svg>
