        <text x="18" y="10" font-size="8" fill="#4B5563" text-anchor="middle">x₁₀</text>
        <rect x="0" y="14" width="36" height="13" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
        <text x="18" y="24" font-size="8" fill="#4B5563" text-anchor="middle">x₁₁</text>
        <rect x="0" y="28" width="36" height="13" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
        <text x="18" y="38" font-size="8" fill="#4B5563" text-anchor="middle">x₁₂</text>
