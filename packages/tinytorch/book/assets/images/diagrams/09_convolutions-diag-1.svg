  <!-- Connection Arrow 1 -> 2 -->
  <g transform="translate(245, 136)">
    <path d="M 0 0 L 25 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <text x="12" y="-8" font-size="8.5" font-family="monospace" fill="#C85A17" text-anchor="middle">im2col</text>
  </g>

  <!-- ==================== PANEL 2: IM2COL UNROLLING TRANSFORM ==================== -->
