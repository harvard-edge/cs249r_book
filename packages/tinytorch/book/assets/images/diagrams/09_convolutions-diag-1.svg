      <text x="49" y="53" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">w₈</text>
    </g>

    <!-- Loop Complexity Callout -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="210" height="74" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Naive 6-Nested Loops:</text>
      <text x="8" y="29" font-size="8.5" font-family="monospace" fill="#4B5563">for n, c_out, h, w, kh, kw:</text>
      <text x="8" y="43" font-size="8.5" fill="#4B5563">• Strided non-contiguous memory</text>
      <text x="8" y="56" font-size="8.5" fill="#4B5563">• &lt;5% peak FLOPs (DRAM bound)</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ Starves GPU Tensor Cores</text>
    </g>
