<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">MODEL COMPRESSION SPECTRUM: SPARSITY, PRUNING &amp; LOW-RANK SVD</text>
  <rect x="670" y="24" width="145" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="742" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">STRUCTURAL EFFICIENCY</text>

  <!-- Column 1: Unstructured Magnitude Pruning -->
  <rect x="35" y="72" width="250" height="295" rx="8" fill="#FFF8F0" stroke="#FF5722" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="82" width="230" height="24" rx="4" fill="#FF5722"/>
  <text x="160" y="98" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1. UNSTRUCTURED SPARSITY</text>
  
  <!-- Matrix Grid with Random Zeros -->
  <g transform="translate(75, 118)">
    <text x="85" y="0" fill="#1B3A5F" font-size="10" font-weight="700" text-anchor="middle">W_sparse = W ⊙ M (80% Zeros)</text>
    <!-- Row 0 -->
    <rect x="15" y="12" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="30" y="27" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
    <rect x="50" y="12" width="30" height="22" rx="2" fill="#1B3A5F"/>
    <text x="65" y="27" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">1.4</text>
    <rect x="85" y="12" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="100" y="27" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
    <rect x="120" y="12" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="135" y="27" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>

    <!-- Row 1 -->
    <rect x="15" y="38" width="30" height="22" rx="2" fill="#1B3A5F"/>
    <text x="30" y="53" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">2.1</text>
    <rect x="50" y="38" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="65" y="53" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
    <rect x="85" y="38" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="100" y="53" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
    <rect x="120" y="38" width="30" height="22" rx="2" fill="#1B3A5F"/>
    <text x="135" y="53" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">0.8</text>

    <!-- Row 2 -->
    <rect x="15" y="64" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="30" y="79" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
    <rect x="50" y="64" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="65" y="79" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
    <rect x="85" y="64" width="30" height="22" rx="2" fill="#1B3A5F"/>
    <text x="100" y="79" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">3.5</text>
    <rect x="120" y="64" width="30" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722" stroke-dasharray="2,2"/>
    <text x="135" y="79" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">0.0</text>
  </g>

  <!-- Unstructured Diagnostics Box -->
  <rect x="45" y="230" width="230" height="125" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="55" y="238" width="210" height="18" rx="3" fill="#FFF0E6" stroke="#FF5722" stroke-width="0.8"/>
  <text x="160" y="250" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">[THE 0.0× SPARSITY TRAP]</text>
  <text x="55" y="272" fill="#475569" font-size="9.5">• Zeros scattered at random indices</text>
  <text x="55" y="287" fill="#475569" font-size="9.5">• Requires CSR index pointer tables</text>
  <text x="55" y="302" fill="#475569" font-size="9.5">• Irregular memory gathers thrash cache</text>
  <text x="55" y="317" fill="#475569" font-size="9.5">• GPU SIMD warps diverge &amp; stall</text>
  <text x="55" y="342" fill="#D22341" font-size="9.5" font-weight="700">Runs SLOWER than dense GEMM!</text>

  <!-- Column 2: Structured Channel Pruning -->
  <rect x="300" y="72" width="250" height="295" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="310" y="82" width="230" height="24" rx="4" fill="#10B981"/>
  <text x="425" y="98" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2. STRUCTURED PRUNING</text>

  <!-- Structured Pruning Diagram -->
  <g transform="translate(340, 118)">
    <text x="85" y="0" fill="#1B3A5F" font-size="10" font-weight="700" text-anchor="middle">Drop Entire Columns / Heads</text>
    <rect x="0" y="12" width="18" height="74" rx="2" fill="#1B3A5F"/>
    <rect x="22" y="12" width="18" height="74" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-dasharray="2,2"/>
    <rect x="44" y="12" width="18" height="74" rx="2" fill="#1B3A5F"/>
    <rect x="66" y="12" width="18" height="74" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-dasharray="2,2"/>

    <path d="M92 49 H110" stroke="#10B981" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="118" y="12" width="42" height="74" rx="4" fill="#10B981"/>
    <text x="139" y="45" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">4 × 2</text>
    <text x="139" y="58" fill="#FFFFFF" font-size="8.5" font-weight="600" text-anchor="middle">Dense</text>
  </g>

  <!-- Structured Diagnostics Box -->
  <rect x="310" y="230" width="230" height="125" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="320" y="238" width="210" height="18" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
  <text x="425" y="250" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">[GUARANTEED 2× ACCELERATION]</text>
  <text x="320" y="272" fill="#475569" font-size="9.5">• Deletes entire channels or heads</text>
  <text x="320" y="287" fill="#475569" font-size="9.5">• Matrix physically shrinks: M × N'</text>
  <text x="320" y="302" fill="#475569" font-size="9.5">• Pure dense GEMM layout preserved</text>
  <text x="320" y="317" fill="#475569" font-size="9.5">• Full tensor core vectorization</text>
  <text x="320" y="342" fill="#059669" font-size="9.5" font-weight="700">100% Hardware Line-Rate Speedup!</text>

  <!-- Column 3: Low-Rank SVD Factorization -->
  <rect x="565" y="72" width="250" height="295" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="575" y="82" width="230" height="24" rx="4" fill="#1B3A5F"/>
  <text x="690" y="98" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3. LOW-RANK SVD FACTORIZATION</text>

  <!-- SVD Diagram: W (M x N) -> A (M x r) * B (r x N) -->
  <g transform="translate(585, 118)">
    <text x="105" y="0" fill="#1B3A5F" font-size="10" font-weight="700" text-anchor="middle">W ≈ U_r Σ_r V_r^T = A · B</text>
    
    <rect x="5" y="16" width="52" height="68" rx="3" fill="#1B3A5F"/>
    <text x="31" y="54" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">M × N</text>

    <text x="68" y="54" fill="#1B3A5F" font-size="13" font-weight="700">≈</text>

    <rect x="85" y="16" width="22" height="68" rx="2" fill="#2E6F7E"/>
    <text x="96" y="54" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">M×r</text>

    <text x="114" y="54" fill="#FF8246" font-size="12" font-weight="700">×</text>

    <rect x="126" y="40" width="58" height="22" rx="2" fill="#FF8246"/>
    <text x="155" y="54" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">r × N</text>
  </g>

  <!-- SVD Diagnostics Box -->
  <rect x="575" y="230" width="230" height="125" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="585" y="238" width="210" height="18" rx="3" fill="#F1F5F9" stroke="#1B3A5F" stroke-width="0.8"/>
  <text x="690" y="250" fill="#1B3A5F" font-size="9" font-weight="700" text-anchor="middle">[PARAMETER &amp; FLOP COMPRESSION]</text>
  <text x="585" y="272" fill="#475569" font-size="9.5">• Rank r ≪ min(M, N)</text>
  <text x="585" y="287" fill="#475569" font-size="9.5">• Params: M·N → r(M + N)</text>
  <text x="585" y="302" fill="#475569" font-size="9.5">• Replaces 1 large GEMM with 2 small</text>
  <text x="585" y="317" fill="#475569" font-size="9.5">• Foundation for LoRA fine-tuning</text>
  <text x="585" y="342" fill="#1B3A5F" font-size="9.5" font-weight="700">Linear Compute &amp; Memory Savings!</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Structural Regularity Invariant: Modern systolic processors require contiguous, uniform strides.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Unstructured sparsity destroys cache locality; structured pruning and low-rank factorizations preserve dense GEMM throughput.</text>
</svg>
