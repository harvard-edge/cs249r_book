<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="30" y="30" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Token Embedding Lookups &amp; Sinusoidal Positional Encodings</text>
  <line x1="30" y1="40" x2="850" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== PANEL 1: TOKEN ID GATHER ==================== -->
  <g transform="translate(30, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">1. Token ID Gather (DRAM Slicing)</text>
    <text x="0" y="32" font-size="10" font-family="monospace" fill="#4B5563">Input IDs: [1542, 42, 8931]</text>

    <!-- Embedding Table Gathering -->
    <g transform="translate(0, 42)">
      <!-- Table Header -->
      <rect x="0" y="0" width="130" height="16" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="1" />
      <text x="65" y="11" font-size="7.5" font-family="monospace" font-weight="700" fill="#111827" text-anchor="middle">W_embed [50257, 768]</text>

      <!-- Row 0 -->
      <rect x="0" y="18" width="130" height="13" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
      <text x="6" y="27" font-size="7.5" font-family="monospace" fill="#6B7280">Row 0</text>

      <text x="65" y="40" font-size="8" fill="#6B7280" text-anchor="middle">⋮</text>

      <!-- Target Row 1542 (Highlight) -->
      <rect x="0" y="44" width="130" height="16" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="1" />
      <text x="6" y="55" font-size="7.5" font-family="monospace" font-weight="700" fill="#C85A17">Row 1542 ["king"]</text>

      <text x="65" y="69" font-size="8" fill="#6B7280" text-anchor="middle">⋮</text>

      <!-- Row 50256 -->
      <rect x="0" y="73" width="130" height="13" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
      <text x="6" y="82" font-size="7.5" font-family="monospace" fill="#6B7280">Row 50256</text>

      <!-- Gather Pointer Arrow -->
      <path d="M 134 52 L 154 52" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

      <!-- Gathered Vector Box -->
      <g transform="translate(158, 38)">
        <rect x="0" y="0" width="72" height="28" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="36" y="12" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">E_token</text>
        <text x="36" y="23" font-size="7.5" font-family="monospace" fill="#9A3412" text-anchor="middle">[1 × 768]</text>
      </g>
    </g>

    <!-- DRAM Pointer Systems Card -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="235" height="78" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Zero-FLOP Pointer Indexing:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• No matrix multiplication or GEMM FLOPs</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• O(1) DRAM address stride gather</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Gradients update only accessed token rows</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ Memory-Bandwidth Bound Lookup</text>
    </g>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <g transform="translate(272, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 2: SINUSOIDAL WAVEFORMS ==================== -->
  <g transform="translate(295, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">2. Sinusoidal Fourier Waveforms</text>

    <!-- Formula Box -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="265" height="32" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="10" y="13" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">PE(pos, 2i) = sin( pos / 10000^(2i/d) )</text>
      <text x="10" y="26" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#C85A17">PE(pos, 2i+1) = cos( pos / 10000^(2i/d) )</text>
    </g>

    <!-- Waveform Curves Plot -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="265" height="83" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      
      <!-- Center axis line -->
      <line x1="8" y1="41" x2="257" y2="41" stroke="#E5E7EB" stroke-width="1.0" />

      <!-- Dim 0: High freq (Orange) -->
      <path d="M 10 41 Q 22 15, 34 41 T 58 41 T 82 41 T 106 41 T 130 41 T 154 41 T 178 41 T 202 41 T 226 41 T 250 41" fill="none" stroke="#C85A17" stroke-width="1.6" />
      <text x="12" y="14" font-size="7.5" font-weight="700" fill="#C85A17">dim 0 (λ = 2π, high freq)</text>

      <!-- Dim d/4: Mid freq (Dashed charcoal) -->
      <path d="M 10 41 Q 40 19, 70 41 T 130 41 T 190 41 T 250 41" fill="none" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="3,2" />
      <text x="145" y="14" font-size="7.5" fill="#4B5563">dim d/4 (mid freq)</text>

      <!-- Dim d: Low freq / long wavelength -->
      <path d="M 10 41 Q 130 11, 250 41" fill="none" stroke="#111827" stroke-width="1.5" />
      <text x="120" y="74" font-size="7.5" font-weight="700" fill="#111827">dim d (λ = 10000·2π, slow)</text>
      <text x="12" y="74" font-size="7.5" fill="#6B7280">Position (pos →)</text>
    </g>

    <!-- Waveform Invariant Box -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="265" height="78" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Deterministic Unique Fingerprints:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• Unique d-dim positional signature for every pos</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• Wavelength scale: λ_i = 2π · 10000^(2i/d)</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Closed-form computation; zero learned weights</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ Generalizes to Arbitrary Sequence Lengths</text>
    </g>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <g transform="translate(566, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 3: VECTOR SUPERPOSITION ==================== -->
  <g transform="translate(588, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">3. Vector Superposition</text>
    <text x="0" y="32" font-size="10" font-family="monospace" fill="#4B5563">X_in = E_token ⊕ P_pos</text>

    <!-- Vector Addition Graphic -->
    <g transform="translate(0, 42)">
      <!-- Token Embed Vector -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="70" height="30" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="35" y="12" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">Token Embed</text>
        <text x="35" y="23" font-size="7" font-family="monospace" fill="#6B7280" text-anchor="middle">E [T, d_model]</text>
      </g>

      <!-- Plus sign -->
      <text x="78" y="19" font-size="12" font-weight="700" fill="#C85A17" text-anchor="middle">⊕</text>

      <!-- Positional Embed Vector -->
      <g transform="translate(86, 0)">
        <rect x="0" y="0" width="70" height="30" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="35" y="12" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">Pos Encode</text>
        <text x="35" y="23" font-size="7" font-family="monospace" fill="#6B7280" text-anchor="middle">P [T, d_model]</text>
      </g>

      <!-- Equals sign -->
      <text x="164" y="19" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">=</text>

      <!-- Combined Input Vector -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="68" height="30" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="34" y="12" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">X_input</text>
        <text x="34" y="23" font-size="7" font-family="monospace" font-weight="700" fill="#9A3412" text-anchor="middle">[T, d_model]</text>
      </g>
    </g>

    <!-- Permutation Invariance Resolution Card -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="250" height="60" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#111827">Breaking Permutation Invariance:</text>
      <text x="8" y="26" font-size="7.5" fill="#4B5563">• "Dog bites man" vs. "Man bites dog"</text>
      <text x="8" y="38" font-size="7.5" fill="#4B5563">• Self-attention is fundamentally permutation-invariant</text>
      <text x="8" y="50" font-size="7.5" font-weight="600" fill="#C85A17">→ P_pos shifts vector to distinct temporal coordinates</text>
    </g>

    <!-- Output Stream Card -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="250" height="78" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">Transformer Stack Feed:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• Tensor Shape: [Batch, Sequence_Len, d_model]</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• Broadcasted addition across batch items</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Direct input into Multi-Head Attention Q, K, V</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#111827">→ Dense Continuous Representation</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS & HARDWARE NOTES ==================== -->
  <g transform="translate(30, 310)">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#E5E7EB" stroke-width="1.0" />
    <text x="0" y="18" font-size="11" font-weight="700" fill="#111827">Vaswani Linear Shift Invariant:</text>
    <text x="180" y="18" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">
      PE(pos + k) = M_k · PE(pos),   where M_k is a block-diagonal rotation matrix by angle k·ω_i
    </text>
    <text x="0" y="38" font-size="9.5" fill="#4B5563">
      <tspan font-weight="600" fill="#111827">Relative Distance Linearity:</tspan> Sinusoidal position encodings allow attention layers to compute relative distances (i - j) via fixed linear rotation matrices,
    </text>
    <text x="0" y="52" font-size="9.5" fill="#4B5563">
      enabling neural networks to extrapolate relative temporal ordering across variable-length sequences without retraining.
    </text>
  </g>
</svg>
