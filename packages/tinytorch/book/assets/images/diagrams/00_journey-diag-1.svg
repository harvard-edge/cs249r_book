<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title & Section Divider Rule -->
  <text x="30" y="30" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">TinyTorch Systems Architecture: 4-Tier Learning Arc &amp; Vertical Execution Stack</text>
  <text x="870" y="30" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">4,558 SLOC • 0 ML Dependencies</text>
  <line x1="30" y1="40" x2="870" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== SECTION 1: THE 4-TIER LEARNING ROADMAP (y = 55 to 240) ==================== -->
  <text x="30" y="60" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="0.5">I. HORIZONTAL LEARNING ARC &amp; MILESTONE PROGRESSION</text>

  <!-- Tier 1: Foundations (x = 30, w = 195) -->
  <g transform="translate(30, 72)">
    <rect x="0" y="0" width="195" height="162" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="195" height="24" fill="#111827" />
    <text x="97" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 1: Foundations</text>

    <g transform="translate(10, 32)" font-size="9.5" fill="#111827">
      <rect x="0" y="0" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="13">01. Tensors &amp; Strides</text>

      <rect x="0" y="21" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="34">02. Activations (GELU)</text>

      <rect x="0" y="42" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="55">03. Modular Layers &amp; Init</text>

      <rect x="0" y="63" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="76">04. Log-Sum-Exp Losses</text>

      <rect x="0" y="85" width="175" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
      <text x="87" y="99" font-size="9.5" font-weight="700" fill="#9A3412" text-anchor="middle">Milestone 1: XOR Net</text>
    </g>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <path d="M 230 153 L 246 153" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

  <!-- Tier 2: Core Engine (x = 252, w = 195) -->
  <g transform="translate(252, 72)">
    <rect x="0" y="0" width="195" height="162" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="195" height="24" fill="#111827" />
    <text x="97" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 2: Core Engine</text>

    <g transform="translate(10, 32)" font-size="9.5" fill="#111827">
      <rect x="0" y="0" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="13">05. Async DataLoader</text>

      <rect x="0" y="21" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="34">06. Autograd Dynamic Tape</text>

      <rect x="0" y="42" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="55">07. AdamW Optimizer</text>

      <rect x="0" y="63" width="175" height="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="76">08. Training State Machine</text>

      <rect x="0" y="85" width="175" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
      <text x="87" y="99" font-size="9.5" font-weight="700" fill="#9A3412" text-anchor="middle">Milestone 2: MNIST Classifier</text>
    </g>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <path d="M 452 153 L 468 153" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

  <!-- Tier 3: Architectures (x = 474, w = 195) -->
  <g transform="translate(474, 72)">
    <rect x="0" y="0" width="195" height="162" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="195" height="24" fill="#111827" />
    <text x="97" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 3: Architectures</text>

    <g transform="translate(10, 30)" font-size="9" fill="#111827">
      <rect x="0" y="0" width="175" height="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="12">09. Spatial Convolutions</text>

      <rect x="0" y="18" width="175" height="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="30">10. Byte-Pair Encoding</text>

      <rect x="0" y="36" width="175" height="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="48">11. Token Embeddings &amp; Pos</text>

      <rect x="0" y="54" width="175" height="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="66">12. Scaled Dot-Product Attn</text>

      <rect x="0" y="72" width="175" height="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="84">13. TinyGPT-2 Transformer</text>

      <rect x="0" y="91" width="175" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
      <text x="87" y="105" font-size="9.5" font-weight="700" fill="#9A3412" text-anchor="middle">Milestone 3: TinyGPT</text>
    </g>
  </g>

  <!-- Connecting Arrow 3 -> 4 -->
  <path d="M 674 153 L 690 153" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

  <!-- Tier 4: Acceleration (x = 696, w = 174) -->
  <g transform="translate(696, 72)">
    <rect x="0" y="0" width="174" height="162" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="174" height="24" fill="#111827" />
    <text x="87" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 4: Acceleration</text>

    <g transform="translate(8, 30)" font-size="8.8" fill="#111827">
      <rect x="0" y="0" width="158" height="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="6" y="11">14. Roofline Model Profiler</text>

      <rect x="0" y="17" width="158" height="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="6" y="28">15. INT8 Quantization</text>

      <rect x="0" y="34" width="158" height="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="6" y="45">16. Structured Pruning</text>

      <rect x="0" y="51" width="158" height="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="6" y="62">17. Fused C++ Kernels</text>

      <rect x="0" y="68" width="158" height="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="6" y="79">18. KV-Cache Engine (O(1))</text>

      <rect x="0" y="85" width="158" height="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="6" y="96">19. MLPerf Benchmarking</text>

      <rect x="0" y="103" width="158" height="16" fill="#F3F4F6" stroke="#111827" stroke-width="1" />
      <text x="79" y="115" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">20. Capstone &amp; 21. Triton</text>
    </g>
  </g>

  <!-- ==================== SECTION 2: THE 4 VERTICAL SYSTEMS RUNTIME LAYERS (y = 252 to 380) ==================== -->
  <text x="30" y="260" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="0.5">II. VERTICAL SYSTEMS RUNTIME &amp; EXECUTION HIERARCHY</text>

  <!-- Left Header Tag -->
  <g transform="translate(30, 272)">
    <rect x="0" y="0" width="110" height="106" fill="#111827" stroke="#111827" stroke-width="1.2" />
    <text x="55" y="45" font-size="11" font-weight="700" fill="#FFF7ED" text-anchor="middle">SYSTEMS</text>
    <text x="55" y="61" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">STACK</text>
    <text x="55" y="77" font-size="9" fill="#9CA3AF" text-anchor="middle">EXECUTION</text>

    <!-- Downward execution arrow -->
    <path d="M 55 83 L 55 98" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- 4 Horizontal Pipeline Rows -->
  <!-- Layer 1: User API Layer -->
  <g transform="translate(148, 272)">
    <rect x="0" y="0" width="722" height="23" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
    <rect x="0" y="0" width="150" height="23" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" />
    <text x="10" y="16" font-size="10" font-weight="700" fill="#111827">1. User API Layer</text>
    <text x="165" y="16" font-size="10" fill="#374151">High-Level Abstractions: <tspan font-family="monospace" fill="#111827">nn.Module</tspan>, <tspan font-family="monospace" fill="#111827">Linear</tspan>, <tspan font-family="monospace" fill="#111827">Sequential</tspan>, <tspan font-family="monospace" fill="#111827">AdamW</tspan>, <tspan font-family="monospace" fill="#111827">Dataset</tspan>, <tspan font-family="monospace" fill="#111827">DataLoader</tspan></text>
  </g>

  <!-- Layer 2: Dynamic Autograd Engine -->
  <g transform="translate(148, 299)">
    <rect x="0" y="0" width="722" height="23" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" />
    <rect x="0" y="0" width="150" height="23" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1" />
    <text x="10" y="16" font-size="10" font-weight="700" fill="#9A3412">2. Autograd Tape</text>
    <text x="165" y="16" font-size="10" fill="#7C2D12">Dynamic Tape DAG Recording, Reverse Topological Sort, Vector-Jacobian Products (VJPs)</text>
  </g>

  <!-- Layer 3: Tensor Storage Runtime -->
  <g transform="translate(148, 326)">
    <rect x="0" y="0" width="722" height="23" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
    <rect x="0" y="0" width="150" height="23" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" />
    <text x="10" y="16" font-size="10" font-weight="700" fill="#111827">3. Tensor Storage</text>
    <text x="165" y="16" font-size="10" fill="#374151">Flat 1D DRAM Buffers, Coordinate Strides Mapping, Zero-Copy Views, <tspan font-family="monospace" fill="#111827">O(1)</tspan> Metadata Slicing</text>
  </g>

  <!-- Layer 4: Hardware Compute Kernels -->
  <g transform="translate(148, 353)">
    <rect x="0" y="0" width="722" height="25" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="25" fill="#111827" />
    <text x="10" y="17" font-size="10" font-weight="700" fill="#FFFFFF">4. Hardware Kernels</text>
    <text x="165" y="17" font-size="10" font-weight="600" fill="#111827">CPU SIMD Vectorization (AVX-512/NEON), Cache-Tiled GEMM, Fused C++ Extensions, Triton JIT</text>
  </g>

  <!-- ==================== SECTION 3: BOTTOM SYSTEMS INVARIANT ==================== -->
  <g transform="translate(30, 396)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#E5E7EB" stroke-width="1" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Systems Principle: The First-Principles Systems Invariant</text>
    <text x="0" y="36" font-size="10.5" fill="#4B5563">
      Every high-level machine learning abstraction compiles down to 1D DRAM byte ribbon layouts, coordinate strides, dynamic reverse-mode tape graphs, and register-level SIMD execution.
    </text>
    <text x="0" y="52" font-size="10" fill="#6B7280">
      Mastering deep learning requires traversing all four tiers: understanding how mathematical equations translate into low-level memory bandwidth and hardware FLOP throughput.
    </text>
  </g>
</svg>
