<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="30" y="30" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Autoregressive Generative Inference Loop &amp; KV Cache Geometry</text>
  <line x1="30" y1="40" x2="850" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== PANEL 1: PREFILL & KV CACHE DECODE ==================== -->
  <g transform="translate(30, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">1. Prefill vs. KV Cache Decode</text>

    <!-- Phase A: Prefill -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="235" height="38" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#111827">Phase A: Prompt Prefill (Parallel)</text>
      <text x="8" y="27" font-size="7.5" font-family="monospace" fill="#4B5563">["TinyTorch", "is"] → Populates KV [0, 1]</text>
    </g>

    <!-- Phase B: Decode Step -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="235" height="48" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <text x="8" y="14" font-size="8.5" font-weight="700" fill="#C85A17">Phase B: Autoregressive Decode Step</text>
      <text x="8" y="27" font-size="7.5" font-family="monospace" fill="#9A3412">Input: ["the"] (Len=1) → Append K_new, V_new</text>
      <text x="8" y="40" font-size="7.5" fill="#4B5563">• O(1) FLOPs vs. O(S) full history recompute</text>
    </g>

    <!-- KV Cache Memory Geometry Card -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="235" height="112" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">KV Cache Memory Geometry:</text>
      <text x="8" y="29" font-size="8.5" font-family="monospace" fill="#4B5563">Buffer: [B, H, S_max, d_k]</text>
      <text x="8" y="44" font-size="8.5" fill="#4B5563">• Pre-allocated contiguous tensors</text>
      <text x="8" y="58" font-size="8.5" fill="#4B5563">• Zero recomputation of past tokens</text>
      <text x="8" y="72" font-size="8.5" fill="#4B5563">• Compute-bound → Memory-bandwidth bound</text>
      <text x="8" y="86" font-size="8.5" font-weight="600" fill="#C85A17">→ Constant Latency per Token</text>
    </g>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <g transform="translate(272, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 2: PROBABILITY SHAPING ==================== -->
  <g transform="translate(295, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">2. Probability Shaping (T &amp; Top-k)</text>

    <!-- Temperature Scaling -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="265" height="34" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#111827">1. Temperature Scaling: <tspan font-family="'Times New Roman', serif" font-style="italic" fill="#C85A17">z' = z / T</tspan></text>
      <text x="8" y="26" font-size="7.5" fill="#4B5563">T &lt; 1.0 (Sharp / deterministic) | T &gt; 1.0 (Diverse / creative)</text>
    </g>

    <!-- Top-k Filtering Graphic -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="265" height="74" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#111827">2. Top-k Candidate Filtering (k = 3):</text>

      <!-- Token 1 (Keep) -->
      <g transform="translate(8, 17)">
        <rect x="0" y="0" width="85" height="15" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="1" />
        <text x="6" y="11" font-size="7.5" font-family="monospace" font-weight="700" fill="#C85A17">"the" (z'=8.2)</text>
        <text x="96" y="11" font-size="7.5" font-weight="700" fill="#111827">Keep</text>
      </g>

      <!-- Token 2 (Keep) -->
      <g transform="translate(8, 34)">
        <rect x="0" y="0" width="70" height="15" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="1" />
        <text x="6" y="11" font-size="7.5" font-family="monospace" font-weight="700" fill="#C85A17">"a"   (z'=6.1)</text>
        <text x="96" y="11" font-size="7.5" font-weight="700" fill="#111827">Keep</text>
      </g>

      <!-- Token 3 (Keep) -->
      <g transform="translate(8, 51)">
        <rect x="0" y="0" width="55" height="15" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="1" />
        <text x="6" y="11" font-size="7.5" font-family="monospace" font-weight="700" fill="#C85A17">"our" (z'=4.5)</text>
        <text x="96" y="11" font-size="7.5" font-weight="700" fill="#111827">Keep</text>
      </g>

      <!-- Tail Masked Box -->
      <g transform="translate(138, 17)">
        <rect x="0" y="0" width="118" height="49" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" stroke-dasharray="2,2" rx="2" />
        <text x="59" y="16" font-size="7.5" font-weight="700" fill="#6B7280" text-anchor="middle">Tail Logits &gt; k</text>
        <text x="59" y="30" font-size="8" font-family="monospace" font-weight="700" fill="#111827" text-anchor="middle">Set to -∞</text>
        <text x="59" y="42" font-size="7" fill="#6B7280" text-anchor="middle">(exp(-∞) = 0)</text>
      </g>
    </g>

    <!-- Softmax Normalization Box -->
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="265" height="90" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">3. Softmax Normalization:</text>
      <text x="8" y="32" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">P(t_next = i) = exp(z'_i) / ∑ exp(z'_j)</text>
      <text x="8" y="48" font-size="8.5" fill="#4B5563">• Truncates low-probability tail entropy</text>
      <text x="8" y="62" font-size="8.5" fill="#4B5563">• Preserves coherent stochastic diversity</text>
      <text x="8" y="76" font-size="8.5" font-weight="600" fill="#C85A17">→ Normalized Top-k Multinomial Distribution</text>
    </g>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <g transform="translate(566, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 3: STOCHASTIC SAMPLING & LOOP ==================== -->
  <g transform="translate(588, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">3. Stochastic Sampling &amp; Loop</text>

    <!-- Execution Flow -->
    <g transform="translate(0, 24)">
      <!-- Step 1: Draw -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="260" height="24" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="8" y="15" font-size="8" font-weight="700" fill="#111827">Categorical Sample: <tspan font-family="monospace" fill="#C85A17">t_emit ~ P (ID: 18432)</tspan></text>
      </g>

      <path d="M 130 24 L 130 32" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Step 2: Detokenize -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="260" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="8" y="15" font-size="8" font-weight="700" fill="#111827">Detokenize: <tspan font-family="monospace" fill="#4B5563">ID 18432 → Text </tspan><tspan font-family="monospace" font-weight="700" fill="#C85A17">"xv6"</tspan></text>
      </g>

      <path d="M 130 56 L 130 64" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Step 3: EOS Check -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="260" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="8" y="15" font-size="8" font-weight="700" fill="#111827">EOS Check: <tspan font-family="monospace" fill="#4B5563">t_emit == &lt;|endoftext|&gt; ?</tspan></text>
      </g>

      <path d="M 130 88 L 130 96" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

      <!-- Autoregressive Feedback Loop -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="260" height="42" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="8" y="15" font-size="8.5" font-weight="700" fill="#C85A17">Autoregressive Append &amp; Step N+1:</text>
        <text x="8" y="30" font-size="7.5" font-family="monospace" font-weight="700" fill="#9A3412">["TinyTorch", "is", "the", "xv6"] → Next</text>
      </g>
    </g>

    <!-- Autonomous Streaming Card -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="260" height="66" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="14" font-size="9.5" font-weight="700" fill="#111827">Autonomous Streaming Loop:</text>
      <text x="8" y="28" font-size="8.5" fill="#4B5563">• Loops until max_new_tokens or &lt;|endoftext|&gt;</text>
      <text x="8" y="41" font-size="8.5" fill="#4B5563">• Streams output tokens in real-time to stdout</text>
      <text x="8" y="55" font-size="8.5" font-weight="600" fill="#C85A17">→ Milestone 2 Complete Generative Engine</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS & HARDWARE NOTES ==================== -->
  <g transform="translate(30, 310)">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#E5E7EB" stroke-width="1.0" />
    <text x="0" y="18" font-size="11" font-weight="700" fill="#111827">Autoregressive KV Cache Invariant:</text>
    <text x="215" y="18" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">
      Decode FLOPs(S) = O(1),   KV Buffer ∈ ℝ^(2×B×H×S_max×d_k),   t_emit ~ Categorical( Softmax( Top-k( z / T ) ) )
    </text>
    <text x="0" y="38" font-size="9.5" fill="#4B5563">
      <tspan font-weight="600" fill="#111827">O(1) Streaming Decoding:</tspan> Pre-allocating static key-value cache buffers transforms generative decoding from quadratic O(S²) token recomputations
    </text>
    <text x="0" y="52" font-size="9.5" fill="#4B5563">
      into an O(1) compute, memory-bandwidth bound streaming kernel, enabling interactive real-time text generation.
    </text>
  </g>
</svg>
