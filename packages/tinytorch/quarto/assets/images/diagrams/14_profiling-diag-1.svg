<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8246" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8246" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF8246" stop-opacity="0.02" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B3A5F" />
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E6F7E" />
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="340" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="20" y="20" width="760" height="45" rx="10" fill="url(#torchGrad)"/>
  <text x="40" y="49" fill="#FFFFFF" font-size="16" font-weight="700">ROOFLINE PROFILING &amp; ARITHMETIC INTENSITY</text>

  <!-- Left Box -->
  <rect x="45" y="85" width="330" height="245" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2"/>
  <text x="65" y="115" fill="#1B3A5F" font-size="14" font-weight="700">Arithmetic Intensity</text>
  <g transform="translate(65, 135)" font-size="12" fill="#4A5568">
    <rect x="0" y="0" width="290" height="30" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/><text x="12" y="20">I = FLOPs / Memory_Bytes_Transferred</text><rect x="0" y="38" width="290" height="30" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/><text x="12" y="58">Low intensity: DRAM bandwidth bottleneck</text><rect x="0" y="76" width="290" height="30" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/><text x="12" y="96">High intensity: Tensor Core ALUs saturated</text>
  </g>

  <!-- Right Box -->
  <rect x="405" y="85" width="350" height="245" rx="8" fill="#FFF8F0" stroke="#FF8246" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="425" y="115" fill="#D22341" font-size="14" font-weight="700">Roofline Execution Zones</text>
  <g transform="translate(425, 135)" font-size="12" fill="#1B3A5F">
    <rect x="0" y="0" width="310" height="30" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/><text x="12" y="20" font-weight="600">Attainable Performance = min(Peak_FLOPs, I × Bandwidth)</text><rect x="0" y="38" width="310" height="30" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/><text x="12" y="58" font-weight="600">Operators below ridge point need kernel fusion</text><rect x="0" y="76" width="310" height="30" rx="4" fill="#FFFFFF" stroke="#FF8246" stroke-width="1"/><text x="12" y="96" font-weight="600">Operators above ridge point saturate ALUs</text>
  </g>

  <rect x="425" y="240" width="310" height="70" rx="6" fill="#1B3A5F"/>
  <text x="440" y="265" fill="#FF8246" font-size="12" font-weight="700">⚡ Williams Roofline Invariant</text>
  <text x="440" y="285" fill="#FFFFFF" font-size="11">Optimizing math on memory-bound kernels yields 0x speedup; reduce DRAM traffic.</text>

</svg>
