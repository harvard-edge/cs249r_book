<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="memBoundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8246" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#FF8246" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="computeBoundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E6F7E" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#2E6F7E" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">WILLIAMS ROOFLINE MODEL: MEMORY CEILINGS &amp; COMPUTE HORIZONS</text>
  <rect x="675" y="24" width="140" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="745" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">PHYSICAL LIMITS</text>

  <!-- Left Panel: Roofline Coordinate Chart -->
  <rect x="35" y="72" width="475" height="295" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  
  <!-- Shaded Regimes under Roofline -->
  <polygon points="95,315 95,285 320,135 320,315" fill="url(#memBoundGrad)"/>
  <polygon points="320,315 320,135 480,135 480,315" fill="url(#computeBoundGrad)"/>

  <!-- Grid Lines -->
  <line x1="95" y1="315" x2="480" y2="315" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="95" y1="255" x2="480" y2="255" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="95" y1="195" x2="480" y2="195" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="95" y1="135" x2="480" y2="135" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="95" y1="85" x2="95" y2="315" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="205" y1="85" x2="205" y2="315" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="85" x2="320" y2="315" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="430" y1="85" x2="430" y2="315" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Axes Labels & Ticks -->
  <text x="95" y="330" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">0.1</text>
  <text x="205" y="330" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">1.0</text>
  <text x="320" y="330" fill="#1E293B" font-size="10" font-weight="700" text-anchor="middle">I_ridge (60)</text>
  <text x="430" y="330" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">500</text>
  <text x="280" y="352" fill="#1B3A5F" font-size="11" font-weight="700" text-anchor="middle">Arithmetic Intensity I (FLOPs / Byte) [Log Scale] →</text>

  <text x="88" y="318" fill="#64748B" font-size="10" font-weight="600" text-anchor="end">10¹</text>
  <text x="88" y="258" fill="#64748B" font-size="10" font-weight="600" text-anchor="end">10²</text>
  <text x="88" y="198" fill="#64748B" font-size="10" font-weight="600" text-anchor="end">10³</text>
  <text x="88" y="138" fill="#1E293B" font-size="10" font-weight="700" text-anchor="end">P_peak</text>
  <text x="42" y="200" fill="#1B3A5F" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 42 200)">Attainable Performance (GFLOPs/s) →</text>

  <!-- The Roofline Curve -->
  <line x1="95" y1="285" x2="320" y2="135" stroke="#FF5722" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="320" y1="135" x2="480" y2="135" stroke="#2E6F7E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Ceiling Text Labels -->
  <rect x="100" y="130" width="160" height="20" rx="3" fill="#FFF0E6" stroke="#FF5722" stroke-width="0.8"/>
  <text x="180" y="143" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">Memory Ceiling: P = I × B_peak</text>
  <path d="M180 150 V205" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arrowOrange)"/>
  <text x="405" y="123" fill="#2E6F7E" font-size="9.5" font-weight="700" text-anchor="middle">Compute Ceiling: P = P_peak</text>

  <!-- Ridge Point Marker & Pointer -->
  <circle cx="320" cy="135" r="6" fill="#FF8246" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="320" y1="104" x2="320" y2="128" stroke="#1B3A5F" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="255" y="82" width="130" height="22" rx="4" fill="#1B3A5F"/>
  <text x="320" y="97" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Ridge Point (I_ridge)</text>

  <!-- Plotted Operators -->
  <circle cx="150" cy="248" r="5" fill="#D22341"/>
  <rect x="105" y="260" width="95" height="18" rx="3" fill="#FFF0E6" stroke="#FF5722" stroke-width="0.8"/>
  <text x="152" y="272" fill="#D22341" font-size="8.5" font-weight="700" text-anchor="middle">GELU / Elementwise</text>

  <circle cx="235" cy="192" r="5" fill="#FF8246"/>
  <line x1="165" y1="240" x2="222" y2="200" stroke="#FF8246" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arrowOrange)"/>
  <rect x="200" y="162" width="85" height="18" rx="3" fill="#FFFDF9" stroke="#FF8246" stroke-width="0.8"/>
  <text x="242" y="174" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">FlashAttention</text>

  <circle cx="415" cy="135" r="5" fill="#2E6F7E"/>
  <rect x="370" y="150" width="90" height="18" rx="3" fill="#E6F4F6" stroke="#2E6F7E" stroke-width="0.8"/>
  <text x="415" y="162" fill="#1B3A5F" font-size="8.5" font-weight="700" text-anchor="middle">Dense GEMM (W·X)</text>
  <text x="415" y="180" fill="#2E6F7E" font-size="8" font-weight="600" text-anchor="middle">I ≈ 200 FLOP/B</text>

  <!-- Right Panel: Diagnosis Cards -->
  <rect x="525" y="72" width="290" height="92" rx="6" fill="#FFF8F0" stroke="#FF8246" stroke-width="1.2"/>
  <rect x="535" y="82" width="145" height="18" rx="3" fill="#FF5722"/>
  <text x="607" y="94" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">MEMORY-BOUND REGIME</text>
  <text x="535" y="115" fill="#1E293B" font-size="10.5" font-weight="700">I &lt; I_ridge (e.g. Elementwise, Norm)</text>
  <text x="535" y="130" fill="#475569" font-size="9.5">• Hardware ALUs stall 90%+ waiting for DRAM</text>
  <text x="535" y="144" fill="#475569" font-size="9.5">• Fix: Kernel Fusion, Quantization, KV Caching</text>
  <text x="535" y="157" fill="#D22341" font-size="9.5" font-weight="700">FLOP cuts deliver 0.0% speedup!</text>

  <rect x="525" y="173" width="290" height="92" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
  <rect x="535" y="183" width="145" height="18" rx="3" fill="#10B981"/>
  <text x="607" y="195" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">COMPUTE-BOUND REGIME</text>
  <text x="535" y="216" fill="#1E293B" font-size="10.5" font-weight="700">I ≥ I_ridge (e.g. Large GEMMs, Conv)</text>
  <text x="535" y="231" fill="#475569" font-size="9.5">• Tensor Core ALUs fully saturated at peak</text>
  <text x="535" y="245" fill="#475569" font-size="9.5">• Fix: Pruning, Low-Rank SVD, INT8 Cores</text>
  <text x="535" y="258" fill="#059669" font-size="9.5" font-weight="700">Math reductions directly accelerate latency!</text>

  <rect x="525" y="274" width="290" height="93" rx="6" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2"/>
  <text x="535" y="293" fill="#1B3A5F" font-size="11" font-weight="700">Hardware Ridge Point Formula</text>
  <rect x="535" y="302" width="270" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="670" y="318" fill="#1B3A5F" font-size="10.5" font-weight="700" text-anchor="middle">I_ridge = Peak_Compute / Memory_Bandwidth</text>
  <text x="535" y="342" fill="#475569" font-size="9.5">H100 SXM: 1,979 TFLOPs / 3.35 TB/s ≈ 590 FLOP/B</text>
  <text x="535" y="356" fill="#475569" font-size="9.5">Intel Xeon: 2.0 TFLOPs / 0.15 TB/s ≈ 13.3 FLOP/B</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Williams Roofline Invariant: Attainable Performance = min(Peak Compute, Intensity × Bandwidth)</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Optimizing arithmetic on memory-bound operators yields 0x speedup; performance engineering must minimize off-chip DRAM traffic.</text>
</svg>
