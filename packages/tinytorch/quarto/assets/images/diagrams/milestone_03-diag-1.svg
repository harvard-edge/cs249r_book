<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8246" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">THE TORCH OLYMPICS: MULTI-METRIC MLPERF PERFORMANCE SHOWDOWN</text>
  <rect x="670" y="24" width="145" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="742" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">GOLD CERTIFIED</text>

  <!-- Left Panel: Multi-Metric Radar Chart -->
  <rect x="35" y="72" width="390" height="295" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="82" width="180" height="22" rx="4" fill="#1B3A5F"/>
  <text x="135" y="97" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">SYSTEMS EVALUATION RADAR</text>

  <!-- Radar Chart Center (230, 205), Radius 75 -->
  <g transform="translate(230, 205)">
    <!-- Concentric Web Rings (25%, 50%, 75%, 100%) -->
    <polygon points="0,-18.75 18.75,0 0,18.75 -18.75,0" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    <polygon points="0,-37.5 37.5,0 0,37.5 -37.5,0" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="0,-56.25 56.25,0 0,56.25 -56.25,0" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="0,-75 75,0 0,75 -75,0" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Radar Axes -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#CBD5E1" stroke-width="1.2"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Axis Labels -->
    <text x="0" y="-87" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">Accuracy Retention (99.8%)</text>
    <text x="88" y="4" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="start">Speedup (16.4×)</text>
    <text x="0" y="95" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">VRAM Cut (4.0×)</text>
    <text x="-88" y="4" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="end">Throughput (165 t/s)</text>

    <!-- Baseline Polygon (Dotted Red) -->
    <polygon points="0,-75 5,0 0,18 -5,0" fill="#FF5722" fill-opacity="0.1" stroke="#D22341" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- TinyTorch Champion Polygon -->
    <polygon points="0,-74 74,0 0,74 -72,0" fill="url(#radarGrad)" stroke="#FF5722" stroke-width="2.5"/>
    <circle cx="0" cy="-74" r="4" fill="#FF5722"/>
    <circle cx="74" cy="0" r="4" fill="#FF5722"/>
    <circle cx="0" cy="74" r="4" fill="#FF5722"/>
    <circle cx="-72" cy="0" r="4" fill="#FF5722"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 340)" font-size="9" font-weight="700">
    <line x1="0" y1="5" x2="20" y2="5" stroke="#D22341" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="25" y="8" fill="#D22341">Naive Baseline</text>
    <rect x="130" y="0" width="20" height="10" rx="2" fill="#FF5722"/>
    <text x="155" y="8" fill="#1B3A5F">TinyTorch Accelerated Stack</text>
  </g>

  <!-- Right Panel: Official Olympic Scorecard & Leaderboard -->
  <rect x="435" y="72" width="380" height="295" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="445" y="82" width="230" height="22" rx="4" fill="#1B3A5F"/>
  <text x="560" y="97" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">OFFICIAL OLYMPIC SCORECARD</text>

  <!-- Event 1: Accuracy Contest -->
  <rect x="445" y="112" width="360" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="128" fill="#1B3A5F" font-size="10" font-weight="700">[EVENT 1] Accuracy Contest (Top-1 Match)</text>
  <rect x="730" y="118" width="65" height="20" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
  <text x="762" y="132" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">99.8% PASS</text>
  <text x="455" y="148" fill="#475569" font-size="9">Threshold: ≥ 99.0% | INT8 &amp; SVD preserve representation</text>

  <!-- Event 2: Memory Challenge -->
  <rect x="445" y="166" width="360" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="182" fill="#1B3A5F" font-size="10" font-weight="700">[EVENT 2] Memory Challenge (Peak VRAM)</text>
  <rect x="730" y="172" width="65" height="20" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
  <text x="762" y="186" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">4.0× PASS</text>
  <text x="455" y="202" fill="#475569" font-size="9">Threshold: ≥ 4.0× Cut | 100 MB → 25 MB footprint</text>

  <!-- Event 3: Latency Sprint -->
  <rect x="445" y="220" width="360" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="236" fill="#1B3A5F" font-size="10" font-weight="700">[EVENT 3] Latency Sprint (Decode Speedup)</text>
  <rect x="730" y="226" width="65" height="20" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
  <text x="762" y="240" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">16.4× PASS</text>
  <text x="455" y="256" fill="#475569" font-size="9">Threshold: ≥ 10.0× | 100 ms → 6.1 ms per token</text>

  <!-- Overall Certification Banner -->
  <rect x="445" y="276" width="360" height="80" rx="6" fill="#1B3A5F"/>
  <text x="455" y="296" fill="#FF8246" font-size="11" font-weight="700">[CERTIFIED] MLPerf Gold Medal Framework</text>
  <text x="455" y="315" fill="#FFFFFF" font-size="9.5">Techniques Applied: INT8 Quantization + SVD Pruning +</text>
  <text x="455" y="330" fill="#FFFFFF" font-size="9.5">Kernel Fusion + Tiled MatMul + Pre-Allocated KV Cache.</text>
  <text x="455" y="348" fill="#10B981" font-size="9.5" font-weight="700">All 3 Olympic Performance Gates Conquered!</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Multi-Objective Tradeoff Invariant: Performance cannot sacrifice mathematical fidelity.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">The Torch Olympics proves that extreme hardware acceleration, memory compression, and numerical precision can coexist without degradation.</text>
</svg>
