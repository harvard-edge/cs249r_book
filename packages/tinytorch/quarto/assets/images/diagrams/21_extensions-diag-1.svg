<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">THE MODERN AI SYSTEMS HIERARCHY: FROM PYTHON API TO SILICON</text>
  <rect x="670" y="24" width="145" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="742" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">PRODUCTION STACK</text>

  <!-- Tier 1: High-Level Python Frameworks (Top) -->
  <rect x="35" y="72" width="780" height="64" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="80" width="160" height="20" rx="3" fill="#1B3A5F"/>
  <text x="125" y="94" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TIER 1: HIGH-LEVEL API</text>
  <text x="215" y="94" fill="#1B3A5F" font-size="11" font-weight="700">Python Frameworks (PyTorch 2.0 / TinyTorch / JAX)</text>
  <g transform="translate(45, 105)" font-size="9" fill="#475569">
    <rect x="0" y="0" width="170" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="10" y="16" font-weight="600">model(x) / Dynamic Tensors</text>
    <rect x="180" y="0" width="170" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="190" y="16" font-weight="600">Autograd Tape Tracing</text>
    <rect x="360" y="0" width="180" height="24" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="370" y="16" font-weight="600">User Neural Architectures</text>
    <rect x="550" y="0" width="210" height="24" rx="3" fill="#FFF0E6" stroke="#FF5722"/>
    <text x="560" y="16" fill="#D22341" font-weight="700">Eager Overhead: Slow Dispatch</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M425 136 V146" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="445" y="144" fill="#FF8246" font-size="8.5" font-weight="700">Bytecode Interception</text>

  <!-- Tier 2: AOT Graph Compilers (Middle-Top) -->
  <rect x="35" y="148" width="780" height="64" rx="8" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="156" width="160" height="20" rx="3" fill="#2E6F7E"/>
  <text x="125" y="170" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TIER 2: GRAPH COMPILER</text>
  <text x="215" y="170" fill="#1B3A5F" font-size="11" font-weight="700">TorchDynamo &amp; AOTAutograd (FX Graph Intermediate Representation)</text>
  <g transform="translate(45, 181)" font-size="9" fill="#475569">
    <rect x="0" y="0" width="170" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="10" y="16" font-weight="600">TorchDynamo Frame Capture</text>
    <rect x="180" y="0" width="170" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="190" y="16" font-weight="600">AOT Forward &amp; Backward DAG</text>
    <rect x="360" y="0" width="180" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="370" y="16" font-weight="600">Dead Code Elimination &amp; DCE</text>
    <rect x="550" y="0" width="210" height="24" rx="3" fill="#ECFDF5" stroke="#10B981"/>
    <text x="560" y="16" fill="#059669" font-weight="700">Whole-Graph Optimization</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M425 212 V222" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="445" y="220" fill="#FF8246" font-size="8.5" font-weight="700">Graph Lowering</text>

  <!-- Tier 3: Block-Level JIT Engines (Middle-Bottom) -->
  <rect x="35" y="224" width="780" height="64" rx="8" fill="#FFFFFF" stroke="#FF8246" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="232" width="160" height="20" rx="3" fill="#FF5722"/>
  <text x="125" y="246" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TIER 3: BLOCK JIT ENGINE</text>
  <text x="215" y="246" fill="#1B3A5F" font-size="11" font-weight="700">OpenAI Triton &amp; TorchInductor (C++ / PTX Assembly JIT)</text>
  <g transform="translate(45, 257)" font-size="9" fill="#475569">
    <rect x="0" y="0" width="170" height="24" rx="3" fill="#FFF8F0" stroke="#FF8246"/>
    <text x="10" y="16" font-weight="600">2D Block Programming (tl.load)</text>
    <rect x="180" y="0" width="170" height="24" rx="3" fill="#FFF8F0" stroke="#FF8246"/>
    <text x="190" y="16" font-weight="600">Automated Kernel Fusion</text>
    <rect x="360" y="0" width="180" height="24" rx="3" fill="#FFF8F0" stroke="#FF8246"/>
    <text x="370" y="16" font-weight="600">Shared Memory &amp; Warp Sched</text>
    <rect x="550" y="0" width="210" height="24" rx="3" fill="#FFF0E6" stroke="#FF5722"/>
    <text x="560" y="16" fill="#D22341" font-weight="700">Replaces Hand-Written CUDA</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M425 288 V298" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="445" y="296" fill="#FF8246" font-size="8.5" font-weight="700">Hardware Execution</text>

  <!-- Tier 4: Hardware Accelerators & Silicon (Bottom) -->
  <rect x="35" y="300" width="780" height="68" rx="8" fill="#1B3A5F" filter="url(#cardShadow)"/>
  <rect x="45" y="308" width="160" height="20" rx="3" fill="#FF8246"/>
  <text x="125" y="322" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TIER 4: PHYSICAL SILICON</text>
  <text x="215" y="322" fill="#FFFFFF" font-size="11" font-weight="700">Domain-Specific Accelerators (GPUs, TPUs, NPUs, Edge ASICs)</text>
  <g transform="translate(45, 333)" font-size="9" fill="#FFFFFF">
    <rect x="0" y="0" width="170" height="24" rx="3" fill="#2E6F7E"/>
    <text x="10" y="16" font-weight="600">NVIDIA Tensor Cores (H100/B200)</text>
    <rect x="180" y="0" width="170" height="24" rx="3" fill="#2E6F7E"/>
    <text x="190" y="16" font-weight="600">Google TPU v5e (Matrix Units)</text>
    <rect x="360" y="0" width="180" height="24" rx="3" fill="#2E6F7E"/>
    <text x="370" y="16" font-weight="600">Apple Silicon Neural Engine</text>
    <rect x="550" y="0" width="210" height="24" rx="3" fill="#10B981"/>
    <text x="560" y="16" font-weight="700">Peak FLOPs &amp; HBM Bandwidth</text>
  </g>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">The Unified Systems Invariant: Every tier is an abstraction designed to bridge neural mathematics to memory hierarchies.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Modern AI systems transform high-level Python computation graphs into block-tiled machine code tuned for physical accelerator silicon.</text>
</svg>
