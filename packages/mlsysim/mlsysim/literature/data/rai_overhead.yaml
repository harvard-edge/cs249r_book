ApproxShapMemoryLowPct: {value: 20, provenance: RESPONSIBLE_AI_OVERHEAD, name: Approx SHAP memory overhead low}
ApproxShapMemoryHighPct: {value: 100, provenance: RESPONSIBLE_AI_OVERHEAD, name: Approx SHAP memory overhead high}

# --- Exact SHAP (inference stored as a multiplier) ---
ExactShapInferenceLowX: {value: 50, provenance: RESPONSIBLE_AI_OVERHEAD, name: Exact SHAP inference multiplier low}
ExactShapInferenceHighX: {value: 1000, provenance: RESPONSIBLE_AI_OVERHEAD, name: Exact SHAP inference multiplier high}
