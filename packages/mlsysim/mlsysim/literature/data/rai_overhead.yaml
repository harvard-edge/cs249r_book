# Responsible-AI technique overhead ranges for @tbl-responsible-ai-overhead.
# Accuracy impact stored as signed percentage points (negative = accuracy drop);
# training/inference/memory overheads stored as positive percent unless marked
# as a multiplier (Exact SHAP inference, stored as a x-factor).
# Order-of-magnitude empirical ranges across published responsible-AI benchmarks.

# --- Differential Privacy (DP-SGD) ---
DpAccuracyLowPct: {value: -2, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP accuracy impact low}
DpAccuracyHighPct: {value: -5, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP accuracy impact high}
DpTrainingLowPct: {value: 15, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP training overhead low}
DpTrainingHighPct: {value: 30, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP training overhead high}
DpMemoryLowPct: {value: 10, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP memory overhead low}
DpMemoryHighPct: {value: 20, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP memory overhead high}

# --- Fairness-Aware Training ---
FairnessAccuracyLowPct: {value: -1, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness accuracy impact low}
FairnessAccuracyHighPct: {value: -3, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness accuracy impact high}
FairnessTrainingLowPct: {value: 5, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness training overhead low}
FairnessTrainingHighPct: {value: 15, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness training overhead high}
FairnessMemoryLowPct: {value: 5, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness memory overhead low}
FairnessMemoryHighPct: {value: 10, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness memory overhead high}

