<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="600" height="470" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827" /></marker></defs>
<text x="30" y="30" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Token table: scatter-add by ID</text>
<text x="315" y="30" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Position table: sum by position</text>
<path d="M300 20 V315" stroke="#D1D5DB" stroke-width="1" />
<rect x="30" y="50" width="255" height="85" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="45" y="73" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Two samples, two tokens each</text>
<text x="45" y="97" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">IDs = [[2, 0], [2, 1]]</text>
<text x="45" y="120" text-anchor="start" font-size="13" font-weight="400" fill="#111827">Token 2 repeats; 0 and 1 occur once.</text>
<rect x="315" y="50" width="255" height="85" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="330" y="73" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Shared position rows</text>
<text x="330" y="97" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">start_pos = 1 → rows [1, 2]</text>
<text x="330" y="120" text-anchor="start" font-size="13" font-weight="400" fill="#111827">Each sample uses rows 1 and 2.</text>
<path d="M157 135 V160" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<path d="M442 135 V160" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<rect x="30" y="160" width="255" height="60" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="45" y="183" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Scatter-add by token identity</text>
<text x="45" y="205" text-anchor="start" font-size="13" font-weight="400" fill="#111827">Add [1, 1] for each occurrence.</text>
<rect x="315" y="160" width="255" height="60" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="330" y="183" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Sum batch, then restore rows</text>
<text x="330" y="205" text-anchor="start" font-size="13" font-weight="400" fill="#111827">Each used row: [1, 1] + [1, 1].</text>
<path d="M157 220 V247" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<path d="M442 220 V247" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<text x="40" y="267" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Table row</text>
<text x="110" y="267" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Gradient</text>
<text x="200" y="267" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Source</text>
<rect x="30" y="280" width="255" height="25" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="50" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">0</text>
<text x="110" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[1, 1]</text>
<text x="200" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#111827">once</text>
<rect x="30" y="308" width="255" height="25" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="50" y="325" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">1</text>
<text x="110" y="325" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[1, 1]</text>
<text x="200" y="325" text-anchor="start" font-size="13" font-weight="400" fill="#111827">once</text>
<rect x="30" y="336" width="255" height="25" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="50" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">2</text>
<text x="110" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[2, 2]</text>
<text x="200" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#111827">twice</text>
<rect x="30" y="364" width="255" height="25" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="50" y="381" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">3</text>
<text x="110" y="381" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[0, 0]</text>
<text x="200" y="381" text-anchor="start" font-size="13" font-weight="400" fill="#111827">unused</text>
<text x="325" y="267" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Table row</text>
<text x="395" y="267" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Gradient</text>
<text x="485" y="267" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Source</text>
<rect x="315" y="280" width="255" height="25" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="335" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">0</text>
<text x="395" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[0, 0]</text>
<text x="485" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#111827">unused</text>
<rect x="315" y="308" width="255" height="25" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="335" y="325" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">1</text>
<text x="395" y="325" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[2, 2]</text>
<text x="485" y="325" text-anchor="start" font-size="13" font-weight="400" fill="#111827">2 samples</text>
<rect x="315" y="336" width="255" height="25" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="335" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">2</text>
<text x="395" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[2, 2]</text>
<text x="485" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#111827">2 samples</text>
<rect x="315" y="364" width="255" height="25" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" />
<text x="335" y="381" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">3</text>
<text x="395" y="381" text-anchor="start" font-size="13" font-weight="400" fill="#111827" font-family="'TeX Gyre Cursor', 'Courier New', monospace">[0, 0]</text>
<text x="485" y="381" text-anchor="start" font-size="13" font-weight="400" fill="#111827">unused</text>
<text x="30" y="433" text-anchor="start" font-size="13" font-weight="400" fill="#111827">Both tables: 4 rows, width 2.</text>
<text x="30" y="453" text-anchor="start" font-size="13" font-weight="400" fill="#111827">Every output gradient vector is [1, 1].</text>
</svg>
