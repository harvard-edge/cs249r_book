<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">RIGOROUS STATISTICAL BENCHMARKING: SYNCHRONIZATION &amp; TAIL LATENCIES</text>
  <rect x="670" y="24" width="145" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="742" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">MLPERF DISCIPLINE</text>

  <!-- Step 1: Warmup Cycles -->
  <rect x="35" y="72" width="250" height="295" rx="8" fill="#FFF8F0" stroke="#FF5722" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="82" width="230" height="24" rx="4" fill="#FF5722"/>
  <text x="160" y="98" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1. WARMUP STABILIZATION</text>
  
  <!-- Warmup Iteration Rows -->
  <g transform="translate(50, 118)">
    <text x="0" y="10" fill="#1B3A5F" font-size="10" font-weight="700">Iterations 1..N_warmup (Discarded):</text>
    
    <rect x="0" y="18" width="220" height="18" rx="3" fill="#D22341"/>
    <text x="10" y="31" fill="#FFFFFF" font-size="8.5" font-weight="700">Run 1 (Cold): 45.2 ms</text>
    
    <rect x="0" y="40" width="220" height="18" rx="3" fill="#FFF0E6" stroke="#CBD5E1"/>
    <rect x="0" y="40" width="150" height="18" rx="3" fill="#FF8246"/>
    <text x="10" y="53" fill="#FFFFFF" font-size="8.5" font-weight="700">Run 2 (JIT): 22.8 ms</text>
    
    <rect x="0" y="62" width="220" height="18" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect x="0" y="62" width="105" height="18" rx="3" fill="#2E6F7E"/>
    <text x="10" y="75" fill="#FFFFFF" font-size="8.5" font-weight="700">Run 3: 8.4 ms</text>

    <rect x="0" y="84" width="220" height="18" rx="3" fill="#ECFDF5" stroke="#CBD5E1"/>
    <rect x="0" y="84" width="70" height="18" rx="3" fill="#10B981"/>
    <text x="10" y="97" fill="#FFFFFF" font-size="8.5" font-weight="700">Run 10: 6.1 ms</text>
    <text x="120" y="97" fill="#059669" font-size="8.5" font-weight="700">[Steady State]</text>
  </g>

  <!-- Warmup Details -->
  <rect x="45" y="235" width="230" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="55" y="252" fill="#1B3A5F" font-size="9.5" font-weight="700">Why Warmup is Mandatory:</text>
  <text x="55" y="270" fill="#475569" font-size="9">• Primes CPU L1/L2 instruction caches</text>
  <text x="55" y="285" fill="#475569" font-size="9">• GPU memory allocator pools VRAM</text>
  <text x="55" y="300" fill="#475569" font-size="9">• JIT kernels compiled to native code</text>
  <text x="55" y="315" fill="#475569" font-size="9">• OS pages faulted into physical RAM</text>
  <text x="55" y="340" fill="#059669" font-size="9.5" font-weight="700">Prevents 10× First-Run Outlier Skew!</text>

  <!-- Step 2: Device Synchronization Barrier -->
  <rect x="300" y="72" width="250" height="295" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="310" y="82" width="230" height="24" rx="4" fill="#1B3A5F"/>
  <text x="425" y="98" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">2. HARDWARE SYNC BARRIERS</text>

  <!-- Async CPU vs GPU Timeline -->
  <g transform="translate(310, 118)">
    <text x="0" y="10" fill="#1B3A5F" font-size="10" font-weight="700">CPU Host vs GPU Accelerator:</text>
    
    <!-- CPU Host -->
    <rect x="0" y="20" width="40" height="22" rx="2" fill="#1B3A5F"/>
    <text x="20" y="34" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">CPU</text>
    <rect x="45" y="20" width="65" height="22" rx="2" fill="#FFF0E6" stroke="#FF5722"/>
    <text x="77" y="34" fill="#D22341" font-size="8" font-weight="700" text-anchor="middle">0.02ms</text>
    
    <text x="115" y="34" fill="#D22341" font-size="8" font-weight="700">[Returns Early!]</text>

    <!-- GPU Execution Bar -->
    <rect x="0" y="52" width="40" height="22" rx="2" fill="#2E6F7E"/>
    <text x="20" y="66" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">GPU</text>
    <rect x="45" y="52" width="145" height="22" rx="2" fill="#10B981"/>
    <text x="117" y="66" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Compute Kernel (15.0 ms)</text>

    <!-- Barrier line -->
    <line x1="190" y1="20" x2="190" y2="85" stroke="#FF5722" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="190" y="96" fill="#D22341" font-size="8" font-weight="700" text-anchor="middle">cuda.synchronize()</text>
  </g>

  <!-- Synchronization Details -->
  <rect x="310" y="235" width="230" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="320" y="252" fill="#1B3A5F" font-size="9.5" font-weight="700">The Asynchronous Timing Trap:</text>
  <text x="320" y="270" fill="#475569" font-size="9">• model(x) only enqueues CUDA commands</text>
  <text x="320" y="285" fill="#475569" font-size="9">• time.time() without sync measures 0.02ms</text>
  <text x="320" y="300" fill="#475569" font-size="9">• Must use torch.cuda.synchronize()</text>
  <text x="320" y="315" fill="#475569" font-size="9">• Or hardware CUDA Events on GPU clock</text>
  <text x="320" y="340" fill="#059669" font-size="9.5" font-weight="700">Measures True Physical Silicon Time!</text>

  <!-- Step 3: Statistical Tail Distribution -->
  <rect x="565" y="72" width="250" height="295" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="575" y="82" width="230" height="24" rx="4" fill="#10B981"/>
  <text x="690" y="98" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">3. TAIL LATENCY PERCENTILES</text>

  <!-- Distribution Histogram / Curve -->
  <g transform="translate(580, 118)">
    <text x="0" y="10" fill="#1B3A5F" font-size="10" font-weight="700">N_measure = 100 Runs Distribution:</text>
    
    <path d="M10 75 Q 45 15, 60 40 T 110 75 T 190 78" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <line x1="10" y1="80" x2="210" y2="80" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- P50 Line -->
    <line x1="50" y1="25" x2="50" y2="80" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="50" y="94" fill="#059669" font-size="8.5" font-weight="700" text-anchor="middle">P50 (6.1ms)</text>

    <!-- P95 Line -->
    <line x1="105" y1="55" x2="105" y2="80" stroke="#FF8246" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="105" y="94" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">P95 (7.2ms)</text>

    <!-- P99 Line -->
    <line x1="170" y1="50" x2="170" y2="80" stroke="#D22341" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="170" y="94" fill="#D22341" font-size="8.5" font-weight="700" text-anchor="middle">P99 (14.5ms)</text>
  </g>

  <!-- Distribution Details -->
  <rect x="575" y="235" width="230" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="585" y="252" fill="#1B3A5F" font-size="9.5" font-weight="700">MLPerf Metrics Standard:</text>
  <text x="585" y="270" fill="#475569" font-size="9">• Arithmetic mean hides catastrophic tails</text>
  <text x="585" y="285" fill="#475569" font-size="9">• P50 (Median): Typical user experience</text>
  <text x="585" y="300" fill="#475569" font-size="9">• P99 (Worst 1%): Cloud SLA violations</text>
  <text x="585" y="315" fill="#475569" font-size="9">• Throughput = Total_Tokens / Total_Time</text>
  <text x="585" y="340" fill="#10B981" font-size="9.5" font-weight="700">Statistically Honest Performance!</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Hardware Synchronization Invariant: Host CPU queues are asynchronous and decoupled from GPU execution.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Rigorous benchmarking requires warmup phase priming, hardware synchronization barriers, and statistical P50/P95/P99 percentile reporting.</text>
</svg>
