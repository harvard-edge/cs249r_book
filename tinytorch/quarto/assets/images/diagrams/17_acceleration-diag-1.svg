<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">HARDWARE ACCELERATION: KERNEL FUSION &amp; SRAM CACHE TILING</text>
  <rect x="670" y="24" width="145" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="742" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">SRAM RESIDENCY</text>

  <!-- Left Panel: Kernel Fusion -->
  <rect x="35" y="72" width="400" height="295" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="82" width="180" height="22" rx="4" fill="#FF5722"/>
  <text x="135" y="97" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">1. OPERATOR KERNEL FUSION</text>
  <rect x="235" y="82" width="190" height="22" rx="4" fill="#1B3A5F"/>
  <text x="330" y="97" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">DRAM Round-Trip Elimination</text>

  <!-- Unfused Box -->
  <rect x="45" y="112" width="380" height="108" rx="6" fill="#FFF8F0" stroke="#FF5722" stroke-width="0.8"/>
  <text x="55" y="128" fill="#D22341" font-size="10" font-weight="700">[UNFUSED] 2 Kernel Launches &amp; 4 DRAM Passes:</text>
  <g transform="translate(55, 138)" font-size="8.5" font-weight="600">
    <rect x="0" y="0" width="60" height="28" rx="3" fill="#1B3A5F"/>
    <text x="30" y="17" fill="#FFFFFF" text-anchor="middle">DRAM: h, b</text>
    <path d="M60 14 H80" stroke="#FF5722" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
    <rect x="80" y="0" width="80" height="28" rx="3" fill="#FFF0E6" stroke="#FF5722"/>
    <text x="120" y="17" fill="#D22341" text-anchor="middle">Kernel 1 (Add)</text>
    <path d="M160 14 H180" stroke="#FF5722" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
    <rect x="180" y="0" width="65" height="28" rx="3" fill="#FF5722"/>
    <text x="212" y="17" fill="#FFFFFF" text-anchor="middle">DRAM: z (Stall)</text>
    <path d="M245 14 H265" stroke="#FF5722" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
    <rect x="265" y="0" width="85" height="28" rx="3" fill="#FFF0E6" stroke="#FF5722"/>
    <text x="307" y="17" fill="#D22341" text-anchor="middle">Kernel 2 (GELU)</text>
  </g>
  <text x="55" y="185" fill="#475569" font-size="9">• 12.8 MB transferred across narrow DRAM bus</text>
  <text x="55" y="200" fill="#D22341" font-size="9" font-weight="700">• 88% of execution time stalled waiting for memory bus!</text>

  <!-- Fused Box -->
  <rect x="45" y="228" width="380" height="128" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
  <text x="55" y="246" fill="#059669" font-size="10" font-weight="700">[FUSED KERNEL] 1 Launch &amp; 2 DRAM Passes:</text>
  <g transform="translate(55, 256)" font-size="8.5" font-weight="600">
    <rect x="0" y="0" width="70" height="32" rx="3" fill="#1B3A5F"/>
    <text x="35" y="19" fill="#FFFFFF" text-anchor="middle">DRAM: Read h, b</text>
    <path d="M70 16 H95" stroke="#10B981" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <rect x="95" y="0" width="180" height="32" rx="4" fill="#10B981"/>
    <text x="185" y="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">On-Chip SRAM Registers</text>
    <text x="185" y="26" fill="#FFFFFF" text-anchor="middle">z = h + b  ──►  a = GELU(z)</text>
    <path d="M275 16 H300" stroke="#10B981" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <rect x="300" y="0" width="70" height="32" rx="3" fill="#1B3A5F"/>
    <text x="335" y="19" fill="#FFFFFF" text-anchor="middle">DRAM: Write a</text>
  </g>
  <text x="55" y="308" fill="#475569" font-size="9">• Zero intermediate writes to off-chip DRAM</text>
  <text x="55" y="323" fill="#475569" font-size="9">• Data stays in ultra-fast 20 TB/s SRAM registers</text>
  <text x="55" y="342" fill="#059669" font-size="9.5" font-weight="700">Exactly 2.0× reduction in memory bandwidth traffic!</text>

  <!-- Right Panel: Cache Tiling & Memory Hierarchy -->
  <rect x="445" y="72" width="370" height="295" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="455" y="82" width="180" height="22" rx="4" fill="#1B3A5F"/>
  <text x="545" y="97" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">2. CACHE-TILED MATMUL</text>
  <rect x="645" y="82" width="160" height="22" rx="4" fill="#2E6F7E"/>
  <text x="725" y="97" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">B_k × B_k SRAM Tiling</text>

  <!-- Tiling Graphic -->
  <g transform="translate(465, 115)">
    <!-- Matrix A Tile -->
    <rect x="0" y="12" width="44" height="54" rx="3" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
    <rect x="14" y="24" width="22" height="22" rx="2" fill="#FF8246"/>
    <text x="25" y="38" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">A_tile</text>
    <text x="22" y="78" fill="#1B3A5F" font-size="9" font-weight="700" text-anchor="middle">Matrix A</text>

    <text x="52" y="44" fill="#1B3A5F" font-size="12" font-weight="700">×</text>

    <!-- Matrix B Tile -->
    <rect x="65" y="2" width="58" height="44" rx="3" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
    <rect x="76" y="12" width="22" height="22" rx="2" fill="#2E6F7E"/>
    <text x="87" y="26" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">B_tile</text>
    <text x="94" y="58" fill="#1B3A5F" font-size="9" font-weight="700" text-anchor="middle">Matrix B</text>

    <!-- Arrow to SRAM Accumulator -->
    <path d="M130 40 H150" stroke="#1B3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>

    <!-- Matrix C Tile in Registers -->
    <rect x="158" y="8" width="64" height="64" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <rect x="174" y="24" width="32" height="32" rx="2" fill="#10B981"/>
    <text x="190" y="44" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">C_acc</text>
    <text x="190" y="84" fill="#059669" font-size="8.5" font-weight="700" text-anchor="middle">SRAM Accumulator</text>

    <!-- Badge -->
    <rect x="235" y="14" width="105" height="52" rx="4" fill="#1B3A5F"/>
    <text x="287" y="32" fill="#FF8246" font-size="8.5" font-weight="700" text-anchor="middle">Data Reused B_k Times</text>
    <text x="287" y="50" fill="#FFFFFF" font-size="8" text-anchor="middle">DRAM: O(N³) → O(N³/B_k)</text>
  </g>

  <!-- Hardware Hierarchy Table Box -->
  <rect x="455" y="228" width="350" height="128" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="465" y="245" fill="#1B3A5F" font-size="10" font-weight="700">Hardware Memory Hierarchy Latency Gap:</text>
  
  <g transform="translate(465, 255)" font-size="8.5">
    <rect x="0" y="0" width="330" height="18" fill="#F8FAFC"/>
    <text x="8" y="12" fill="#1B3A5F" font-weight="700">Level</text>
    <text x="110" y="12" fill="#1B3A5F" font-weight="700">Capacity</text>
    <text x="185" y="12" fill="#1B3A5F" font-weight="700">Latency</text>
    <text x="260" y="12" fill="#1B3A5F" font-weight="700">Bandwidth</text>

    <rect x="0" y="18" width="330" height="16" fill="#ECFDF5"/>
    <text x="8" y="30" fill="#059669" font-weight="700">SRAM / Registers</text>
    <text x="110" y="30" fill="#475569">256 KB / SM</text>
    <text x="185" y="30" fill="#059669" font-weight="700">~1 ns</text>
    <text x="260" y="30" fill="#059669" font-weight="700">~20.0 TB/s</text>

    <rect x="0" y="34" width="330" height="16" fill="#FFFFFF"/>
    <text x="8" y="46" fill="#2E6F7E" font-weight="600">L2 Cache</text>
    <text x="110" y="46" fill="#475569">~50 MB</text>
    <text x="185" y="46" fill="#475569">~5 ns</text>
    <text x="260" y="46" fill="#2E6F7E" font-weight="600">~6.0 TB/s</text>

    <rect x="0" y="50" width="330" height="16" fill="#FFF0E6"/>
    <text x="8" y="62" fill="#D22341" font-weight="700">Off-Chip DRAM / HBM</text>
    <text x="110" y="62" fill="#475569">80 GB</text>
    <text x="185" y="62" fill="#D22341" font-weight="700">~200 ns</text>
    <text x="260" y="62" fill="#D22341" font-weight="700">~2.0 TB/s</text>
  </g>
  <text x="465" y="345" fill="#D22341" font-size="9" font-weight="700">Off-chip DRAM is 200× slower than on-chip registers!</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">SRAM Register Residency Invariant: On-chip register access is 200× faster with 10× higher bandwidth than DRAM.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Kernel fusion eliminates redundant DRAM roundtrips; matrix cache tiling maximizes data reuse inside SRAM registers.</text>
</svg>
