<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title & Section Divider Rule -->
  <text x="30" y="30" font-size="14" font-weight="700" fill="#111827" letter-spacing="0.2">Loss Functions: Numerical Stability, Log-Sum-Exp &amp; Fused Cross-Entropy</text>
  <text x="870" y="30" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="end">IEEE 754 Safety, Shift Invariance &amp; Fused VJP</text>
  <line x1="30" y1="40" x2="870" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== 3 MAIN MONOGRAPH PANELS (y = 55 to 380) ==================== -->

  <!-- ==================== PANEL 1: IEEE 754 HAZARDS (w = 265) ==================== -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="265" height="325" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="265" height="24" fill="#111827" />
    <text x="132" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Naive Softmax &amp; FP32 Hazards</text>

    <g transform="translate(15, 36)" font-size="9.5">
      <!-- Naive Softmax Equation -->
      <rect x="0" y="0" width="235" height="36" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="117" y="18" font-size="9" font-weight="700" fill="#6B7280" text-anchor="middle">Naive Softmax Formulation</text>
      <text x="117" y="30" font-family="'Times New Roman', serif" font-style="italic" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">p_i = exp(z_i) / ∑ exp(z_j)</text>

      <!-- FP32 Hardware Limits -->
      <rect x="0" y="44" width="235" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="59" font-size="9" font-weight="700" fill="#111827">IEEE 754 FP32 Hardware Limits:</text>
      <text x="10" y="74" font-size="8.5" fill="#374151">• Max Float: <tspan font-family="monospace">3.4028 × 10³⁸</tspan> (<tspan font-family="'Times New Roman', serif" font-style="italic">exp(88.72)</tspan>)</text>
      <text x="10" y="89" font-size="8.5" fill="#374151">• Min Float: <tspan font-family="monospace">1.1755 × 10⁻³⁸</tspan> (<tspan font-family="'Times New Roman', serif" font-style="italic">exp(-87.33)</tspan>)</text>
      <text x="10" y="100" font-size="8" fill="#6B7280">Exceeding boundaries triggers hardware traps.</text>

      <!-- Two Failure Modes -->
      <rect x="0" y="112" width="235" height="164" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="128" font-size="9" font-weight="700" fill="#991B1B">Two Fatal Floating-Point Catastrophes:</text>

      <!-- Hazard 1: Overflow -->
      <text x="10" y="146" font-size="8.8" font-weight="700" fill="#7F1D1D">1. Overflow Crash (z_i = 100):</text>
      <text x="10" y="160" font-family="'Times New Roman', serif" font-style="italic" font-size="8.8" fill="#7F1D1D">• exp(100.0) → +inf</text>
      <text x="10" y="174" font-family="'Times New Roman', serif" font-style="italic" font-size="8.8" fill="#7F1D1D">• (+inf) / (+inf) = NaN (Not a Number!)</text>

      <line x1="10" y1="184" x2="225" y2="184" stroke="#E5E7EB" stroke-width="0.8" />

      <!-- Hazard 2: Underflow -->
      <text x="10" y="200" font-size="8.8" font-weight="700" fill="#7F1D1D">2. Underflow Collapse (z_i = -100):</text>
      <text x="10" y="214" font-family="'Times New Roman', serif" font-style="italic" font-size="8.8" fill="#7F1D1D">• exp(-100.0) → 0.0 (exact zero)</text>
      <text x="10" y="228" font-family="'Times New Roman', serif" font-style="italic" font-size="8.8" fill="#7F1D1D">• 0.0 / 0.0 = NaN | log(0.0) = -inf</text>

      <line x1="10" y1="238" x2="225" y2="238" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="10" y="254" font-size="8.5" font-weight="700" fill="#991B1B">Result: NaN destroys all model weights! [Fatal]</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: LOG-SUM-EXP SHIFT TRICK (w = 295) ==================== -->
  <g transform="translate(305, 55)">
    <rect x="0" y="0" width="295" height="325" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
    <rect x="0" y="0" width="295" height="24" fill="#C85A17" />
    <text x="147" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Log-Sum-Exp Shift Invariance</text>

    <g transform="translate(15, 36)" font-size="9.5">
      <!-- Shift Invariance Proof Box -->
      <rect x="0" y="0" width="265" height="66" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="10" y="16" font-size="9" font-weight="700" fill="#9A3412">Mathematical Shift Invariance Proof:</text>
      <text x="10" y="32" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#111827">p_i = exp(z_i - c) / ∑ exp(z_j - c)</text>
      <text x="10" y="47" font-size="8.8" fill="#4B5563">Multiplying numerator &amp; denominator by <tspan font-family="'Times New Roman', serif" font-style="italic">exp(-c)</tspan></text>
      <text x="10" y="60" font-size="8.8" font-weight="700" fill="#111827">Optimal Constant: <tspan font-family="'Times New Roman', serif" font-style="italic">c = max_j(z_j)</tspan></text>

      <!-- Guaranteed Invariants -->
      <rect x="0" y="74" width="265" height="106" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="10" y="90" font-size="9" font-weight="700" fill="#15803D">Guaranteed Mathematical Safety:</text>
      <text x="10" y="106" font-size="8.5" fill="#374151">Since <tspan font-family="'Times New Roman', serif" font-style="italic">z_j - c ≤ 0</tspan> for ALL logits <tspan font-family="'Times New Roman', serif" font-style="italic">j</tspan>:</text>
      <text x="10" y="122" font-size="8.5" font-weight="600" fill="#15803D">1. Zero Overflow Hazard:</text>
      <text x="22" y="136" font-family="'Times New Roman', serif" font-style="italic" font-size="8.5" fill="#374151">exp(z_j - c) ∈ (0, 1]  (Maximum value is exp(0)=1.0!)</text>
      <text x="10" y="152" font-size="8.5" font-weight="600" fill="#15803D">2. Zero Division-by-Zero Hazard:</text>
      <text x="22" y="166" font-family="'Times New Roman', serif" font-style="italic" font-size="8.5" fill="#374151">Denominator ∑ exp(z_j - c) ≥ 1.0 (Contains exp(0)=1)</text>

      <!-- Stable LSE Formula -->
      <rect x="0" y="188" width="265" height="88" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="10" y="204" font-size="9" font-weight="700" fill="#9A3412">Stable LSE Reduction Formula:</text>
      <text x="10" y="222" font-family="'Times New Roman', serif" font-style="italic" font-size="10.5" font-weight="700" fill="#111827">LSE(z) = c + log( ∑ exp(z_j - c) )</text>
      <line x1="10" y1="234" x2="255" y2="234" stroke="#FDBA74" stroke-width="0.8" />
      <text x="10" y="250" font-size="8.5" font-weight="700" fill="#15803D">100% immune to float overflow &amp; underflow [Stable]</text>
      <text x="10" y="264" font-size="8" fill="#6B7280">Works identically across float16, bfloat16, and float32.</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: FUSED CROSS-ENTROPY (w = 260) ==================== -->
  <g transform="translate(610, 55)">
    <rect x="0" y="0" width="260" height="325" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="260" height="24" fill="#111827" />
    <text x="130" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Fused Cross-Entropy Kernel</text>

    <g transform="translate(15, 36)" font-size="9.5">
      <!-- Forward NLL Box -->
      <rect x="0" y="0" width="230" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="16" font-size="9" font-weight="700" fill="#111827">Fused Forward Pass (NLL):</text>
      <text x="8" y="34" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#111827">L = -log(p_target) = -log(exp(z_target) / ∑ exp(z_j))</text>
      <text x="8" y="52" font-family="'Times New Roman', serif" font-style="italic" font-size="10.5" font-weight="700" fill="#9A3412">L_CE = LSE(z) - z_target</text>
      <text x="8" y="68" font-size="8.5" fill="#15803D" font-weight="600">Zero division; zero temporary DRAM buffers</text>

      <!-- Analytical Backward VJP -->
      <rect x="0" y="88" width="230" height="88" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="104" font-size="9" font-weight="700" fill="#111827">Analytical Backward VJP:</text>
      <text x="8" y="122" font-size="10.5" font-weight="700" fill="#9A3412">∂L_CE / ∂z_i = p_i - y_i</text>
      <text x="8" y="140" font-size="8.5" fill="#374151">• <tspan font-family="'Times New Roman', serif" font-style="italic">p_i</tspan> : Softmax predicted probability</text>
      <text x="8" y="154" font-size="8.5" fill="#374151">• <tspan font-family="'Times New Roman', serif" font-style="italic">y_i</tspan> : One-hot ground truth label</text>
      <text x="8" y="168" font-size="8.2" fill="#15803D" font-weight="600">Extremely elegant &amp; computationally cheap!</text>

      <!-- Systems Kernel Fusion -->
      <rect x="0" y="184" width="230" height="92" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="200" font-size="9" font-weight="700" fill="#111827">Systems Kernel Fusion:</text>
      <text x="8" y="216" font-size="8.5" fill="#374151">• Avoids allocating [B, C] float array</text>
      <text x="8" y="230" font-size="8.5" fill="#374151">• Fused single-pass SRAM reduction</text>
      <text x="8" y="244" font-size="8.5" fill="#374151">• 3× memory bandwidth reduction</text>
      <line x1="8" y1="252" x2="222" y2="252" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="8" y="266" font-size="8.5" font-weight="700" fill="#15803D">Production ML Standard (FlashCE)</text>
    </g>
  </g>

  <!-- ==================== SECTION 3: BOTTOM SYSTEMS INVARIANT ==================== -->
  <g transform="translate(30, 396)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#E5E7EB" stroke-width="1" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Systems Principle: The Log-Sum-Exp Shift Invariance Invariant</text>
    <text x="0" y="36" font-size="10.5" fill="#4B5563">
      Subtracting <tspan font-family="'Times New Roman', serif" font-style="italic">max(z)</tspan> guarantees all exponentials lie strictly in <tspan font-family="'Times New Roman', serif" font-style="italic">(0, 1]</tspan>, mathematically eliminating overflow and underflow hazards on IEEE 754 float32 silicon.
    </text>
    <text x="0" y="52" font-size="10" fill="#6B7280">
      Fusing Softmax and Negative Log-Likelihood into <tspan font-family="'Times New Roman', serif" font-style="italic">LSE(z) - z_target</tspan> eliminates intermediate probability matrix allocations in DRAM, yielding a clean analytical gradient <tspan font-family="'Times New Roman', serif" font-style="italic">p - y</tspan>.
    </text>
  </g>
</svg>
