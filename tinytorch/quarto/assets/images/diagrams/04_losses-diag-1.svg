<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530" font-family="TeX Gyre Heros, Helvetica Neue, Arial, sans-serif">
<rect width="600" height="530" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="20" width="540" height="80" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="300.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">z = [1000, 1002, 1001], target class = 1</text>
<text x="300.0" y="68" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">logits shape (1, 3) · target shape (1,)</text>
<text x="160" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Direct exponentiation</text>
<text x="440" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Shift by the maximum</text>
<rect x="30" y="150" width="260" height="90" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="160.0" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">exp(z) overflows in float32</text>
<text x="160.0" y="198" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">[∞, ∞, ∞]</text>
<text x="160.0" y="221" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Sum = ∞</text>
<rect x="310" y="150" width="260" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="440.0" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Maximum = 1002</text>
<text x="440.0" y="198" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">z − max(z) = [−2, 0, −1]</text>
<text x="440.0" y="221" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">exp = [0.1353, 1, 0.3679]</text>
<path d="M160 240 V280" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440 240 V280" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="280" width="260" height="90" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="160.0" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Normalize: ∞ / ∞</text>
<text x="160.0" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Probabilities = [NaN, NaN, NaN]</text>
<text x="160.0" y="351" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Target log-probability = NaN</text>
<rect x="310" y="280" width="260" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="440.0" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Sum of exponentials ≈ 1.5032</text>
<text x="440.0" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Log of sum ≈ 0.4076</text>
<text x="440.0" y="351" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Target log-probability = 0 − 0.4076</text>
<path d="M160 370 V410" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440 370 V410" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="410" width="260" height="70" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="160.0" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Cross-entropy = NaN</text>
<text x="160.0" y="458" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Result shape ()</text>
<rect x="310" y="410" width="260" height="70" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
<text x="440.0" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Cross-entropy ≈ 0.4076</text>
<text x="440.0" y="458" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Result shape ()</text>
<text x="300" y="510" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Cross-entropy negates the target log-probability; decimals are rounded.</text>
</svg>
