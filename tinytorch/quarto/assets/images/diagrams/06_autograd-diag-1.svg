<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 485" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Title & Section Header -->
  <text x="30" y="28" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">Dynamic Autograd Tape: Forward Execution DAG &amp; Reverse Topological Sweep</text>
  <line x1="30" y1="38" x2="890" y2="38" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TOP: DYNAMIC COMPUTATIONAL GRAPH ==================== -->

  <!-- Inputs Column (x=30) -->
  <g transform="translate(30, 52)">
    <!-- Input X -->
    <rect x="0" y="0" width="100" height="46" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="8" y="18" font-size="9.5" font-weight="700" fill="#111827">Input Tensor X</text>
    <text x="8" y="32" font-size="8" font-family="monospace" fill="#4B5563">[B, D] req_grad</text>

    <!-- Weight W1 -->
    <rect x="0" y="60" width="100" height="46" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="2" />
    <text x="8" y="78" font-size="9.5" font-weight="700" fill="#9A3412">Weight W₁</text>
    <text x="8" y="92" font-size="8" font-family="monospace" fill="#C85A17">[D, H] Param</text>
  </g>

  <!-- Forward / Backward Arrows from Inputs to MatMul -->
  <!-- X to MatMul -->
  <path d="M 130 70 L 158 70" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <path d="M 158 78 L 130 78" stroke="#C85A17" stroke-width="1.3" marker-end="url(#arrowOrange)" />
  <text x="144" y="63" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">X</text>
  <text x="144" y="90" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">∂L/∂X</text>

  <!-- W to MatMul -->
  <path d="M 130 130 L 158 130" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <path d="M 158 138 L 130 138" stroke="#C85A17" stroke-width="1.3" marker-end="url(#arrowOrange)" />
  <text x="144" y="123" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">W₁</text>
  <text x="144" y="150" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">∂L/∂W₁</text>

  <!-- Node 1: MatMulOp (x=160) -->
  <g transform="translate(160, 52)">
    <rect x="0" y="0" width="130" height="152" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="130" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="65" y="15" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">Op: MatMul (Z=X·W)</text>

    <text x="8" y="38" font-size="8" font-weight="700" fill="#1E293B">Saved Tensors:</text>
    <text x="8" y="50" font-size="7.5" font-family="monospace" fill="#4B5563">[X, W₁] cached</text>

    <line x1="8" y1="58" x2="122" y2="58" stroke="#E5E7EB" stroke-width="0.8" />

    <text x="8" y="72" font-size="8" font-weight="700" fill="#9A3412">Vector-Jacobian (VJP):</text>
    <text x="8" y="88" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">∂L/∂X = G · W₁ᵀ</text>
    <text x="8" y="104" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">∂L/∂W₁ = Xᵀ · G</text>

    <rect x="8" y="118" width="114" height="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
    <text x="65" y="130" font-size="7.5" fill="#4B5563" text-anchor="middle">Output: Z [B, H]</text>
    <text x="65" y="140" font-size="7" font-family="monospace" fill="#6B7280" text-anchor="middle">In-degree: 2</text>
  </g>

  <!-- Arrows Node 1 -> Node 2 -->
  <path d="M 290 85 L 322 85" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="306" y="77" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">Z</text>
  <path d="M 322 95 L 290 95" stroke="#C85A17" stroke-width="1.3" marker-end="url(#arrowOrange)" />
  <text x="306" y="107" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">∂L/∂Z</text>

  <!-- Node 2: AddOp (x=325) -->
  <g transform="translate(325, 52)">
    <rect x="0" y="0" width="125" height="106" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="125" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="62" y="15" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">Op: Add (U=Z+b)</text>

    <text x="8" y="38" font-size="8" font-weight="700" fill="#1E293B">Saved Tensors:</text>
    <text x="8" y="50" font-size="7.5" fill="#4B5563">None (Identity VJP)</text>

    <line x1="8" y1="56" x2="117" y2="56" stroke="#E5E7EB" stroke-width="0.8" />

    <text x="8" y="70" font-size="8" font-weight="700" fill="#9A3412">Vector-Jacobian (VJP):</text>
    <text x="8" y="84" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">∂L/∂Z = G</text>
    <text x="8" y="98" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">∂L/∂b₁ = ∑_batch G</text>
  </g>

  <!-- Bias Parameter b1 (Directly underneath AddOp) -->
  <g transform="translate(325, 172)">
    <rect x="0" y="0" width="125" height="32" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="2" />
    <text x="62" y="14" font-size="9" font-weight="700" fill="#9A3412" text-anchor="middle">Bias b₁ [H]</text>
    <text x="62" y="26" font-size="7.5" font-family="monospace" fill="#C85A17" text-anchor="middle">Parameter</text>
  </g>

  <!-- Vertical Arrows between AddOp and Bias b1 -->
  <path d="M 368 172 L 368 160" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <path d="M 405 160 L 405 172" stroke="#C85A17" stroke-width="1.3" marker-end="url(#arrowOrange)" />

  <!-- Arrows Node 2 -> Node 3 -->
  <path d="M 450 85 L 478 85" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="464" y="77" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">U</text>
  <path d="M 478 95 L 450 95" stroke="#C85A17" stroke-width="1.3" marker-end="url(#arrowOrange)" />
  <text x="464" y="107" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">∂L/∂U</text>

  <!-- Node 3: GELUOp (x=480) -->
  <g transform="translate(480, 52)">
    <rect x="0" y="0" width="125" height="152" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="125" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="62" y="15" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">Op: GELU (A=σ(U))</text>

    <text x="8" y="38" font-size="8" font-weight="700" fill="#1E293B">Saved Tensors:</text>
    <text x="8" y="50" font-size="7.5" font-family="monospace" fill="#4B5563">[U] cached input</text>

    <line x1="8" y1="58" x2="117" y2="58" stroke="#E5E7EB" stroke-width="0.8" />

    <text x="8" y="72" font-size="8" font-weight="700" fill="#9A3412">Vector-Jacobian (VJP):</text>
    <text x="8" y="88" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">∂L/∂U = G ⊙ σ'(U)</text>
    <text x="8" y="102" font-size="7" fill="#4B5563">Hadamard Product</text>

    <rect x="8" y="118" width="109" height="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
    <text x="62" y="130" font-size="7.5" fill="#4B5563" text-anchor="middle">Output: A [B, H]</text>
    <text x="62" y="140" font-size="7" font-family="monospace" fill="#6B7280" text-anchor="middle">In-degree: 1</text>
  </g>

  <!-- Arrows Node 3 -> Node 4 -->
  <path d="M 605 85 L 638 85" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="621" y="77" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">A</text>
  <path d="M 638 95 L 605 95" stroke="#C85A17" stroke-width="1.3" marker-end="url(#arrowOrange)" />
  <text x="621" y="107" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">∂L/∂A</text>

  <!-- Target Y Label top -->
  <rect x="642" y="44" width="115" height="18" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2,2" rx="1" />
  <text x="699" y="56" font-size="7.5" font-family="monospace" fill="#4B5563" text-anchor="middle">Target Y [B] (Label)</text>
  <path d="M 699 62 L 699 70" stroke="#9CA3AF" stroke-width="1" marker-end="url(#arrowGray)" />

  <!-- Node 4: LossOp (x=642) -->
  <g transform="translate(642, 72)">
    <rect x="0" y="0" width="120" height="132" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="120" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="60" y="15" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">Op: CrossEntropy</text>

    <text x="8" y="36" font-size="8" font-weight="700" fill="#1E293B">Saved Tensors:</text>
    <text x="8" y="48" font-size="7.5" font-family="monospace" fill="#4B5563">[softmax(A), Y]</text>

    <line x1="8" y1="54" x2="112" y2="54" stroke="#E5E7EB" stroke-width="0.8" />

    <text x="8" y="68" font-size="8" font-weight="700" fill="#9A3412">Loss VJP:</text>
    <text x="8" y="82" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">∂L/∂A = p - Y</text>
    <text x="8" y="96" font-size="7" fill="#4B5563">Softmax - 1-hot target</text>

    <rect x="8" y="104" width="104" height="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="1" />
    <text x="60" y="117" font-size="7.5" font-family="monospace" fill="#6B7280" text-anchor="middle">Scalar Loss L</text>
  </g>

  <!-- Arrows Node 4 -> Loss Root Node -->
  <path d="M 762 135 L 795 135" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <path d="M 795 145 L 762 145" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

  <!-- Root Loss Node (Highlighted in Orange) -->
  <g transform="translate(800, 100)">
    <rect x="0" y="0" width="85" height="80" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
    <text x="42" y="20" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">Loss L</text>
    <text x="42" y="34" font-size="8" font-family="monospace" fill="#7C2D12" text-anchor="middle">Scalar Loss</text>

    <line x1="6" y1="42" x2="79" y2="42" stroke="#FDBA74" stroke-width="0.8" />

    <text x="42" y="55" font-size="7.5" font-weight="700" fill="#C85A17" text-anchor="middle">Gradient Seed</text>
    <text x="42" y="69" font-size="9.5" font-family="'Times New Roman', serif" font-style="italic" font-weight="700" fill="#9A3412" text-anchor="middle">∂L/∂L = 1.0</text>
  </g>

  <!-- ==================== MIDDLE: IN-PLACE GRADIENT ACCUMULATION DETAIL ==================== -->
  <g transform="translate(30, 226)">
    <rect x="0" y="0" width="855" height="136" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="2" />
    
    <!-- Header of Middle Box -->
    <rect x="0" y="0" width="855" height="22" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="12" y="15" font-size="9.5" font-weight="700" fill="#111827">Branching Computation &amp; In-Place Gradient Accumulation Contract (param.grad += grad)</text>
    <text x="843" y="15" font-size="8.5" font-family="monospace" font-weight="600" fill="#C85A17" text-anchor="end">Topological In-Degree = 0 Traversal</text>

    <!-- Left visual: Fork DAG -->
    <g transform="translate(18, 30)">
      <!-- Parameter box -->
      <rect x="0" y="24" width="88" height="40" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="2" />
      <text x="44" y="40" font-size="9" font-weight="700" fill="#9A3412" text-anchor="middle">Param W</text>
      <text x="44" y="54" font-size="7.5" font-family="monospace" fill="#C85A17" text-anchor="middle">Shared Tensor</text>

      <!-- Forward fork paths -->
      <path d="M 88 36 L 138 18" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      <path d="M 88 52 L 138 70" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Branch Op 1 -->
      <rect x="142" y="4" width="75" height="28" fill="#F9FAFB" stroke="#111827" stroke-width="1" rx="2" />
      <text x="179" y="21" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">Op Branch A</text>

      <!-- Branch Op 2 -->
      <rect x="142" y="56" width="75" height="28" fill="#F9FAFB" stroke="#111827" stroke-width="1" rx="2" />
      <text x="179" y="73" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">Op Branch B</text>

      <!-- Backward confluence paths -->
      <path d="M 142 28 L 92 40" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
      <text x="122" y="22" font-size="7" font-family="monospace" fill="#C85A17">g_A</text>
      
      <path d="M 142 64 L 92 52" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
      <text x="122" y="74" font-size="7" font-family="monospace" fill="#C85A17">g_B</text>
    </g>

    <!-- Middle code logic -->
    <g transform="translate(260, 30)">
      <rect x="0" y="0" width="315" height="95" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
      <text x="10" y="16" font-size="8" font-weight="700" fill="#475569">ACCUMULATION INVARIANT IMPLEMENTATION</text>
      <text x="10" y="32" font-size="8" font-family="monospace" fill="#1E293B">def accumulate_grad(param, grad):</text>
      <text x="24" y="46" font-size="8" font-family="monospace" fill="#1E293B">if param.grad is None:</text>
      <text x="38" y="60" font-size="8" font-family="monospace" fill="#2563EB">param.grad = grad.copy()</text>
      <text x="24" y="74" font-size="8" font-family="monospace" fill="#1E293B">else:</text>
      <text x="38" y="88" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17">param.grad += grad  # In-place sum</text>
    </g>

    <!-- Right explanation -->
    <g transform="translate(585, 30)">
      <rect x="0" y="0" width="260" height="95" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" rx="2" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#9A3412">Multivariate Chain Rule Confluence</text>
      <text x="10" y="32" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#7C2D12">∇_W L = (∂L/∂Branch_A) + (∂L/∂Branch_B)</text>
      <text x="10" y="48" font-size="8" fill="#7C2D12">When a tensor feeds multiple operations,</text>
      <text x="10" y="60" font-size="8" fill="#7C2D12">derivatives from all outgoing branches</text>
      <text x="10" y="72" font-size="8" font-weight="700" fill="#9A3412">must sum linearly into the parameter buffer.</text>
      <text x="10" y="86" font-size="7.5" fill="#6B7280">Zero intermediate memory allocations.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INVARIANT CALLOUT ==================== -->
  <g transform="translate(30, 376)">
    <line x1="0" y1="0" x2="855" y2="0" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Computational Complexity Invariant: Reverse-Mode O(1) vs. Numerical Finite Differences O(N)</text>
    <text x="0" y="36" font-size="9.5" fill="#374151">
      Numerical finite differences require <tspan font-family="'Times New Roman', serif" font-style="italic">N + 1</tspan> forward passes to compute partial derivatives for <tspan font-family="'Times New Roman', serif" font-style="italic">N</tspan> parameters (taking years for a 100M-parameter model).
    </text>
    <text x="0" y="52" font-size="9.5" fill="#374151">
      Reverse-mode autograd traverses the DAG tape in reverse topological order, evaluating Vector-Jacobian Products (VJPs) for all <tspan font-family="'Times New Roman', serif" font-style="italic">N</tspan> parameters in a single reverse pass bounded by <tspan font-weight="600" fill="#111827">2× forward FLOPs</tspan>.
    </text>
    <text x="0" y="68" font-size="9" fill="#6B7280">
      Calling <tspan font-family="monospace" fill="#111827">loss.backward()</tspan> builds topological order via depth-first search, executing backward functions in exact reverse order of registration.
    </text>
  </g>
</svg>