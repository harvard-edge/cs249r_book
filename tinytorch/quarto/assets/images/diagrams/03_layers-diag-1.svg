<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title & Section Divider Rule -->
  <text x="30" y="30" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">Modular Layers: Affine Transformations, Kaiming Init &amp; Inverted Dropout</text>
  <text x="870" y="30" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">Parameter Tree, Variance Preservation &amp; Zero-Cost Eval</text>
  <line x1="30" y1="40" x2="870" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== 3 MAIN MONOGRAPH PANELS (y = 55 to 380) ==================== -->

  <!-- ==================== PANEL 1: LINEAR AFFINE CONTAINER (w = 265) ==================== -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="265" height="325" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="265" height="24" fill="#111827" />
    <text x="132" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Modular Linear Layer Container</text>

    <g transform="translate(15, 36)" font-size="9.5">
      <!-- Forward Equation Box -->
      <rect x="0" y="0" width="235" height="36" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="117" y="18" font-size="9" font-weight="700" fill="#6B7280" text-anchor="middle">Affine Forward Transformation</text>
      <text x="117" y="30" font-family="'Times New Roman', serif" font-style="italic" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">Y = X · Wᵀ + b</text>

      <!-- Tensor Shapes Table -->
      <rect x="0" y="44" width="235" height="110" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="60" font-size="9" font-weight="700" fill="#111827">Tensor Dimensions &amp; Layout:</text>

      <!-- Row X -->
      <text x="10" y="77" font-weight="600" fill="#111827">• Input X:</text>
      <text x="80" y="77" font-family="monospace" font-size="9" fill="#4B5563">[B, D_in]</text>
      <text x="155" y="77" font-size="8.5" fill="#6B7280">(Activations)</text>

      <!-- Row W -->
      <text x="10" y="94" font-weight="600" fill="#111827">• Weight W:</text>
      <text x="80" y="94" font-family="monospace" font-size="9" fill="#4B5563">[D_out, D_in]</text>
      <text x="155" y="94" font-size="8.5" fill="#6B7280">(Learnable)</text>

      <!-- Row b -->
      <text x="10" y="111" font-weight="600" fill="#111827">• Bias b:</text>
      <text x="80" y="111" font-family="monospace" font-size="9" fill="#4B5563">[D_out]</text>
      <text x="155" y="111" font-size="8.5" fill="#6B7280">(Broadcasted)</text>

      <!-- Row Y -->
      <line x1="10" y1="120" x2="225" y2="120" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="10" y="136" font-weight="700" fill="#9A3412">• Output Y:</text>
      <text x="80" y="136" font-family="monospace" font-size="9" font-weight="700" fill="#9A3412">[B, D_out]</text>
      <text x="155" y="136" font-size="8.5" fill="#9A3412">(Result)</text>

      <!-- Parameter Tree Registration -->
      <rect x="0" y="162" width="235" height="114" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="178" font-size="9" font-weight="700" fill="#111827">Parameter Encapsulation Tree:</text>
      <text x="10" y="195" font-family="monospace" font-size="8.8" fill="#111827">layer.parameters() → [W, b]</text>
      <text x="10" y="210" font-size="8.5" fill="#4B5563">• Automatically registers tensors</text>
      <text x="10" y="225" font-size="8.5" fill="#4B5563">• Allocates accumulators: <tspan font-family="monospace" fill="#111827">W.grad</tspan></text>
      <text x="10" y="240" font-size="8.5" fill="#4B5563">• Traversed by <tspan font-family="monospace" fill="#111827">optimizer.step()</tspan></text>
      <text x="10" y="255" font-size="8.5" fill="#4B5563">• Modular recursive sub-modules</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: KAIMING HE INITIALIZATION (w = 295) ==================== -->
  <g transform="translate(305, 55)">
    <rect x="0" y="0" width="295" height="325" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
    <rect x="0" y="0" width="295" height="24" fill="#C85A17" />
    <text x="147" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Kaiming He Variance Law (He et al., 2015)</text>

    <g transform="translate(15, 36)" font-size="9.5">
      <!-- Exploding Variance Hazard -->
      <rect x="0" y="0" width="265" height="52" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="10" y="15" font-size="9" font-weight="700" fill="#991B1B">The Exploding/Vanishing Variance Crisis:</text>
      <text x="10" y="30" font-family="'Times New Roman', serif" font-style="italic" font-size="9" fill="#7F1D1D">W ~ N(0, 1) ⇒ Var(y₁₀) = (D_in)¹⁰ ≈ (1024)¹⁰ ≈ 10³⁰</text>
      <text x="10" y="44" font-size="8.5" font-weight="600" fill="#991B1B">Activations explode to +inf [FP32 Overflow Hazard]</text>

      <!-- Mathematical Derivation -->
      <rect x="0" y="60" width="265" height="114" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="10" y="75" font-size="9" font-weight="700" fill="#9A3412">Variance Preservation Derivation:</text>
      <text x="10" y="92" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#111827">1. ReLU zeros 50% of units: Var(ReLU(x)) = ½ Var(x)</text>
      <text x="10" y="108" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#111827">2. Layer output: Var(y) = D_in · (½ Var(x)) · Var(W)</text>
      <text x="10" y="124" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#111827">3. Enforce Var(y) = Var(x) ⇒ (D_in / 2) · Var(W) = 1.0</text>
      <line x1="10" y1="134" x2="255" y2="134" stroke="#FDBA74" stroke-width="0.8" />
      <text x="10" y="150" font-size="10" font-weight="700" fill="#9A3412">⇒ Var(W) = 2 / D_in  |  σ_w = √(2 / D_in)</text>
      <text x="10" y="164" font-size="8.5" fill="#15803D" font-weight="700">Unit variance perfectly preserved across 100+ layers</text>

      <!-- Initialization Sampling -->
      <rect x="0" y="182" width="265" height="94" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="10" y="198" font-size="9" font-weight="700" fill="#111827">TinyTorch Weight Initializers:</text>
      <text x="10" y="215" font-family="'Times New Roman', serif" font-style="italic" font-size="9" fill="#111827">• Normal:  W ~ N(0, √(2 / D_in))</text>
      <text x="10" y="232" font-family="'Times New Roman', serif" font-style="italic" font-size="9" fill="#111827">• Uniform: W ~ U(-√(6 / D_in), +√(6 / D_in))</text>
      <text x="10" y="249" font-family="'Times New Roman', serif" font-style="italic" font-size="9" fill="#111827">• Linear (Xavier): σ_w = √(1 / D_in)</text>
      <text x="10" y="264" font-size="8.5" fill="#6B7280">Guarantees stable forward signal flow at init.</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: INVERTED DROPOUT (w = 260) ==================== -->
  <g transform="translate(610, 55)">
    <rect x="0" y="0" width="260" height="325" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="260" height="24" fill="#111827" />
    <text x="130" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Inverted Dropout (Zero-Cost Eval)</text>

    <g transform="translate(15, 36)" font-size="9.5">
      <!-- Training Phase Box -->
      <rect x="0" y="0" width="230" height="110" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <rect x="0" y="0" width="230" height="18" fill="#FFF7ED" />
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#9A3412">Training Phase (self.training = True)</text>

      <text x="8" y="32" font-family="'Times New Roman', serif" font-style="italic" font-size="9" fill="#111827">• Mask: m ~ Bernoulli(1 - p)</text>
      <text x="8" y="48" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" font-weight="700" fill="#C85A17">• Forward: Y = (X ⊙ m) / (1 - p)</text>
      <text x="8" y="64" font-size="8.5" fill="#4B5563">• Zeroes out fraction p of units</text>
      <text x="8" y="78" font-size="8.5" fill="#4B5563">• Pre-scales active units by 1/(1-p)</text>
      <line x1="8" y1="86" x2="222" y2="86" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="8" y="100" font-size="8.5" font-weight="700" fill="#15803D">Preserves Invariant: E[Y] = E[X]</text>

      <!-- Evaluation Phase Box -->
      <rect x="0" y="118" width="230" height="158" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <rect x="0" y="118" width="230" height="18" fill="#F3F4F6" />
      <text x="8" y="131" font-size="8.5" font-weight="700" fill="#111827">Evaluation Phase (self.training = False)</text>

      <text x="8" y="152" font-family="'Times New Roman', serif" font-style="italic" font-size="10.5" font-weight="700" fill="#111827">• Forward: Y = X (Exact Identity)</text>
      <text x="8" y="170" font-size="9" font-weight="700" fill="#15803D">Zero-Cost Inference Invariant:</text>
      <text x="8" y="186" font-size="8.5" fill="#374151">• Zero random mask generation</text>
      <text x="8" y="200" font-size="8.5" fill="#374151">• Zero scaling multiplications</text>
      <text x="8" y="214" font-size="8.5" fill="#374151">• Zero memory bandwidth overhead</text>
      <line x1="8" y1="224" x2="222" y2="224" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="8" y="240" font-size="8.5" font-weight="700" fill="#15803D">O(1) No-Op at runtime</text>
      <text x="8" y="255" font-size="8" fill="#6B7280">(Standard dropout required test-time mul)</text>
    </g>
  </g>

  <!-- ==================== SECTION 3: BOTTOM SYSTEMS INVARIANT ==================== -->
  <g transform="translate(30, 396)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#E5E7EB" stroke-width="1" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Systems Principle: The Variance Conservation &amp; Modular Encapsulation Invariant</text>
    <text x="0" y="36" font-size="10.5" fill="#4B5563">
      Layers modularize state by encapsulating parameter tensors and automatic gradient accumulators. Kaiming initialization preserves unit variance across depth (<tspan font-family="'Times New Roman', serif" font-style="italic">σ_w = √(2/D_in)</tspan>).
    </text>
    <text x="0" y="52" font-size="10" fill="#6B7280">
      Inverted dropout scales activations during training (<tspan font-family="'Times New Roman', serif" font-style="italic">1/(1-p)</tspan>) so inference executes as a completely transparent zero-FLOP identity pass.
    </text>
  </g>
</svg>
