<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">INT8 QUANTIZATION GEOMETRY: SYMMETRIC &amp; ASYMMETRIC MAPPING</text>
  <rect x="660" y="24" width="155" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="737" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4× MEMORY CUT</text>

  <!-- Top Banner: Precision Bitwidth Comparison -->
  <rect x="35" y="70" width="780" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g transform="translate(45, 78)">
    <text x="0" y="16" fill="#1B3A5F" font-size="11" font-weight="700">FP32 (4 Bytes):</text>
    <rect x="100" y="4" width="24" height="20" rx="2" fill="#FF5722"/>
    <text x="112" y="18" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">S(1)</text>
    <rect x="126" y="4" width="60" height="20" rx="2" fill="#2E6F7E"/>
    <text x="156" y="18" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Exp (8b)</text>
    <rect x="188" y="4" width="120" height="20" rx="2" fill="#1B3A5F"/>
    <text x="248" y="18" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Mantissa (23 bits)</text>
    <text x="100" y="34" fill="#64748B" font-size="8.5">32 bits / element (High DRAM Bandwidth Demand)</text>
  </g>
  <path d="M375 94 H415" stroke="#FF8246" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <g transform="translate(435, 78)">
    <text x="0" y="16" fill="#1B3A5F" font-size="11" font-weight="700">INT8 (1 Byte):</text>
    <rect x="90" y="4" width="24" height="20" rx="2" fill="#FF5722"/>
    <text x="102" y="18" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">S(1)</text>
    <rect x="116" y="4" width="100" height="20" rx="2" fill="#10B981"/>
    <text x="166" y="18" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Signed Mag (7b)</text>
    <rect x="225" y="4" width="125" height="20" rx="3" fill="#FFF0E6" stroke="#FF5722" stroke-width="0.8"/>
    <text x="287" y="18" fill="#D22341" font-size="9.5" font-weight="700" text-anchor="middle">75% Bandwidth Cut</text>
    <text x="90" y="34" fill="#059669" font-size="8.5" font-weight="600">8 bits / element (Direct INT8 Tensor Core GEMMs)</text>
  </g>

  <!-- Middle Left: Symmetric Quantization Card -->
  <rect x="35" y="128" width="380" height="238" rx="8" fill="url(#warmBgGrad)" stroke="#FF8246" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="138" width="165" height="22" rx="4" fill="#FF5722"/>
  <text x="127" y="153" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">SYMMETRIC (Z = 0)</text>
  <rect x="220" y="138" width="185" height="22" rx="4" fill="#1B3A5F"/>
  <text x="312" y="153" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Scale: S = max(|X|) / 127</text>

  <!-- Symmetric Float Axis -->
  <g transform="translate(55, 172)">
    <text x="0" y="12" fill="#1B3A5F" font-size="10" font-weight="700">FP32 Domain:</text>
    <line x1="90" y1="8" x2="330" y2="8" stroke="#64748B" stroke-width="2"/>
    <circle cx="90" cy="8" r="4" fill="#FF5722"/>
    <circle cx="210" cy="8" r="4" fill="#1B3A5F"/>
    <circle cx="330" cy="8" r="4" fill="#FF5722"/>
    <text x="90" y="24" fill="#D22341" font-size="9.5" font-weight="700" text-anchor="middle">-max</text>
    <text x="210" y="24" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">0.0 (Zero)</text>
    <text x="330" y="24" fill="#D22341" font-size="9.5" font-weight="700" text-anchor="middle">+max</text>
  </g>

  <!-- Projection Arrows -->
  <path d="M145 200 V215" stroke="#FF8246" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowOrange)"/>
  <path d="M265 200 V215" stroke="#1B3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <path d="M385 200 V215" stroke="#FF8246" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowOrange)"/>

  <!-- Symmetric INT8 Grid -->
  <g transform="translate(55, 230)">
    <text x="0" y="14" fill="#1B3A5F" font-size="10" font-weight="700">INT8 Range:</text>
    <rect x="90" y="0" width="240" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="102" y="14" fill="#D22341" font-size="9" font-weight="700">-127</text>
    <text x="210" y="14" fill="#1B3A5F" font-size="9" font-weight="700" text-anchor="middle">0 (Z=0)</text>
    <text x="318" y="14" fill="#D22341" font-size="9" font-weight="700" text-anchor="end">+127</text>
  </g>

  <!-- Symmetric Summary Box -->
  <rect x="45" y="270" width="360" height="84" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="55" y="288" fill="#1B3A5F" font-size="10" font-weight="700">Quantize:   q = clamp(round(x / S), -127, 127)</text>
  <text x="55" y="305" fill="#1B3A5F" font-size="10" font-weight="700">Dequantize: x̂ = q × S</text>
  <text x="55" y="325" fill="#059669" font-size="9.5" font-weight="700">[PASS] Zero point is strictly 0: Zero runtime addition overhead.</text>
  <text x="55" y="342" fill="#475569" font-size="9">Standard choice for weights (W) in modern LLM inference.</text>

  <!-- Middle Right: Asymmetric Quantization Card -->
  <rect x="435" y="128" width="380" height="238" rx="8" fill="#F8FAFC" stroke="#2E6F7E" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="445" y="138" width="165" height="22" rx="4" fill="#2E6F7E"/>
  <text x="527" y="153" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">ASYMMETRIC (Z ≠ 0)</text>
  <rect x="620" y="138" width="185" height="22" rx="4" fill="#1B3A5F"/>
  <text x="712" y="153" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Scale: S = (max - min) / 255</text>

  <!-- Asymmetric Float Axis -->
  <g transform="translate(455, 172)">
    <text x="0" y="12" fill="#1B3A5F" font-size="10" font-weight="700">FP32 Domain:</text>
    <line x1="90" y1="8" x2="330" y2="8" stroke="#64748B" stroke-width="2"/>
    <circle cx="90" cy="8" r="4" fill="#2E6F7E"/>
    <circle cx="150" cy="8" r="4" fill="#1B3A5F"/>
    <circle cx="330" cy="8" r="4" fill="#2E6F7E"/>
    <text x="90" y="24" fill="#2E6F7E" font-size="9.5" font-weight="700" text-anchor="middle">x_min (-1.5)</text>
    <text x="150" y="24" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">0.0</text>
    <text x="330" y="24" fill="#2E6F7E" font-size="9.5" font-weight="700" text-anchor="middle">x_max (+8.5)</text>
  </g>

  <!-- Projection Arrows -->
  <path d="M545 200 V215" stroke="#2E6F7E" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowNavy)"/>
  <path d="M605 200 V215" stroke="#FF5722" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M785 200 V215" stroke="#2E6F7E" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrowNavy)"/>

  <!-- Asymmetric INT8 Grid -->
  <g transform="translate(455, 230)">
    <text x="0" y="14" fill="#1B3A5F" font-size="10" font-weight="700">INT8 Range:</text>
    <rect x="90" y="0" width="240" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="102" y="14" fill="#2E6F7E" font-size="9" font-weight="700">-128</text>
    <text x="150" y="14" fill="#FF5722" font-size="9" font-weight="700" text-anchor="middle">Z = -89</text>
    <text x="318" y="14" fill="#2E6F7E" font-size="9" font-weight="700" text-anchor="end">+127</text>
  </g>

  <!-- Asymmetric Summary Box -->
  <rect x="445" y="270" width="360" height="84" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="455" y="288" fill="#1B3A5F" font-size="10" font-weight="700">Quantize:   q = clamp(round(x / S) + Z, -128, 127)</text>
  <text x="455" y="305" fill="#1B3A5F" font-size="10" font-weight="700">Dequantize: x̂ = (q - Z) × S</text>
  <text x="455" y="325" fill="#2E6F7E" font-size="9.5" font-weight="700">[NOTE] Non-zero Z maximizes bit utilization on skewed data (ReLU).</text>
  <text x="455" y="342" fill="#475569" font-size="9">Requires extra offset arithmetic during GEMM accumulations.</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Symmetric Quantization Invariant: S = max(|X|) / 127, q = clamp(round(x / S), -127, 127)</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Symmetric mapping eliminates zero-point runtime offset calculations, enabling line-rate INT8 GEMMs on systolic tensor cores.</text>
</svg>
