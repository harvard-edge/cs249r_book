<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="370" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Current token</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Project Q_t, K_t, V_t</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">One new position per step</text>
<rect x="250" y="30" width="400" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="450.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Static per-layer K and V buffers</text>
<text x="450.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Each buffer: [B, H, S_max, d_k]</text>
<text x="450.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Append K_t and V_t at the current position</text>
<path d="M 210 75 H 250 V 75" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="270" y="150" width="70" height="40" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
<text x="305" y="174" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">1</text>
<rect x="340" y="150" width="70" height="40" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
<text x="375" y="174" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">2</text>
<rect x="410" y="150" width="70" height="40" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
<text x="445" y="174" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">…</text>
<rect x="480" y="150" width="70" height="40" rx="0" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2"/>
<text x="515" y="174" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">t</text>
<rect x="550" y="150" width="70" height="40" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
<text x="585" y="174" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">unused</text>
<text x="450" y="215" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Read the active prefix, positions 1 through t</text>
<rect x="30" y="250" width="290" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="175.0" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Attention at this step</text>
<text x="175.0" y="295" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">softmax(Q_t K[1:t]ᵀ / √d_k) V[1:t]</text>
<text x="175.0" y="312" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">O(t) work for fixed batch, heads, width</text>
<rect x="360" y="250" width="290" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="505.0" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Memory trade-off</text>
<text x="505.0" y="295" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">2 × L × B × H × S_max × d_k × bytes</text>
<text x="505.0" y="312" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Preallocation avoids growing K/V buffers</text>
<path d="M 450 120 H 450 V 150" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
