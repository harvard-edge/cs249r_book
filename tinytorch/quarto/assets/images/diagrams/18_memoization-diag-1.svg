<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B3A5F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5F" />
      <stop offset="100%" stop-color="#2E6F7E" />
    </linearGradient>
    <linearGradient id="warmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EC" />
    </linearGradient>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF8246" />
    </marker>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B3A5F" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="820" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="44" rx="10" fill="url(#torchGrad)"/>
  <rect x="15" y="45" width="820" height="14" fill="url(#torchGrad)"/>
  <text x="35" y="42" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">KV CACHE ARCHITECTURE: O(S²) → O(1) MEMOIZATION &amp; RING BUFFERS</text>
  <rect x="660" y="24" width="155" height="24" rx="12" fill="#FF8246" fill-opacity="0.25"/>
  <text x="737" y="40" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">AUTOREGRESSIVE ENGINE</text>

  <!-- Top Complexity Comparison Bar -->
  <rect x="35" y="70" width="780" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g transform="translate(45, 78)">
    <rect x="0" y="4" width="145" height="22" rx="3" fill="#FFF0E6" stroke="#FF5722" stroke-width="0.8"/>
    <text x="72" y="19" fill="#D22341" font-size="10" font-weight="700" text-anchor="middle">Naive: O(S²) Recompute</text>
    <text x="155" y="19" fill="#475569" font-size="9.5">Step t re-projects tokens 1..t from scratch (99.8% redundant work)</text>
  </g>
  <g transform="translate(480, 78)">
    <rect x="0" y="4" width="135" height="22" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
    <text x="67" y="19" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">KV Cache: O(1) Append</text>
    <text x="145" y="19" fill="#1B3A5F" font-size="9.5" font-weight="700">Only compute single token t!</text>
  </g>

  <!-- Left / Middle Panel: Pre-Allocated Static Cache Buffer Architecture -->
  <rect x="35" y="128" width="490" height="238" rx="8" fill="url(#warmBgGrad)" stroke="#1B3A5F" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="45" y="138" width="235" height="22" rx="4" fill="#1B3A5F"/>
  <text x="162" y="153" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">STATIC VRAM BUFFER TENSORS</text>
  <rect x="290" y="138" width="225" height="22" rx="4" fill="#2E6F7E"/>
  <text x="402" y="153" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Shape: [Batch, Heads, S_max, D_k]</text>

  <!-- Key Cache Buffer Visualization -->
  <g transform="translate(45, 172)">
    <text x="0" y="14" fill="#1B3A5F" font-size="10.5" font-weight="700">Key Cache Tensor (K_cache):</text>
    
    <!-- Slots for Tokens -->
    <rect x="0" y="24" width="42" height="32" rx="2" fill="#1B3A5F"/>
    <text x="21" y="44" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">k_1</text>
    <rect x="44" y="24" width="42" height="32" rx="2" fill="#1B3A5F"/>
    <text x="65" y="44" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">k_2</text>
    <rect x="88" y="24" width="42" height="32" rx="2" fill="#1B3A5F"/>
    <text x="109" y="44" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">k_3</text>

    <rect x="132" y="24" width="42" height="32" rx="2" fill="#2E6F7E"/>
    <text x="153" y="44" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">k_4</text>
    <rect x="176" y="24" width="42" height="32" rx="2" fill="#2E6F7E"/>
    <text x="197" y="44" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">k_5</text>

    <!-- Active New Token t -->
    <rect x="220" y="24" width="50" height="32" rx="3" fill="#FF5722" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="245" y="44" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">k_t [NEW]</text>

    <!-- Unfilled Future Slots -->
    <rect x="272" y="24" width="42" height="32" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="2,2"/>
    <text x="293" y="44" fill="#94A3B8" font-size="8.5" text-anchor="middle">...</text>
    <rect x="316" y="24" width="55" height="32" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="2,2"/>
    <text x="343" y="44" fill="#94A3B8" font-size="8.5" text-anchor="middle">k_Smax</text>

    <!-- Write Cursor Indicator -->
    <path d="M245 68 V58" stroke="#FF5722" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <text x="245" y="80" fill="#D22341" font-size="9" font-weight="700" text-anchor="middle">pos = t (Write Pointer)</text>
  </g>

  <!-- Query Vector & Attention Projection Flow -->
  <g transform="translate(45, 265)">
    <rect x="0" y="10" width="80" height="34" rx="4" fill="#FF8246"/>
    <text x="40" y="25" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Query Q_t</text>
    <text x="40" y="37" fill="#FFFFFF" font-size="8" text-anchor="middle">[1, 1, D]</text>

    <path d="M85 27 H110" stroke="#1B3A5F" stroke-width="2" marker-end="url(#arrowNavy)"/>

    <rect x="115" y="4" width="165" height="46" rx="4" fill="#FFFFFF" stroke="#1B3A5F" stroke-width="1.2"/>
    <text x="197" y="22" fill="#1B3A5F" font-size="9.5" font-weight="700" text-anchor="middle">Attn = Softmax(Q_t · K_pastᵀ / √d)</text>
    <text x="197" y="38" fill="#2E6F7E" font-size="8.5" font-weight="600" text-anchor="middle">Attends over all 1..t cached tokens</text>

    <path d="M285 27 H310" stroke="#10B981" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="315" y="10" width="155" height="34" rx="4" fill="#10B981"/>
    <text x="392" y="25" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Output = Attn · V_past</text>
    <text x="392" y="37" fill="#FFFFFF" font-size="8" text-anchor="middle">Single Step Invariant</text>
  </g>

  <!-- Right Panel: PagedAttention & Memory Management -->
  <rect x="535" y="128" width="280" height="238" rx="8" fill="#FFFFFF" stroke="#2E6F7E" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="545" y="138" width="170" height="22" rx="4" fill="#2E6F7E"/>
  <text x="630" y="153" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">PAGEDATTENTION BLOCKS</text>

  <!-- Block Mapping Table -->
  <g transform="translate(545, 170)">
    <text x="0" y="12" fill="#1B3A5F" font-size="10" font-weight="700">Logical Tokens → Physical Pages:</text>
    
    <rect x="0" y="20" width="260" height="65" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <g font-size="8.5" fill="#475569">
      <text x="10" y="35" font-weight="700" fill="#1B3A5F">Logical Block 0 (Tokens 1..16)</text>
      <text x="190" y="35" font-weight="700" fill="#2E6F7E">→ Page #41</text>
      <text x="10" y="52" font-weight="700" fill="#1B3A5F">Logical Block 1 (Tokens 17..32)</text>
      <text x="190" y="52" font-weight="700" fill="#2E6F7E">→ Page #88</text>
      <text x="10" y="69" font-weight="700" fill="#FF5722">Logical Block 2 (Tokens 33..48)</text>
      <text x="190" y="69" font-weight="700" fill="#FF5722">→ Page #12 [ACTIVE]</text>
    </g>
  </g>

  <!-- VRAM Footprint Box -->
  <rect x="545" y="265" width="260" height="90" rx="4" fill="#FFF8F0" stroke="#FF8246" stroke-width="0.8"/>
  <text x="555" y="282" fill="#D22341" font-size="9.5" font-weight="700">VRAM Footprint Equation:</text>
  <text x="555" y="298" fill="#1B3A5F" font-size="9" font-weight="600">Bytes = 2 × L × H × S × D_k × sizeof(dtype)</text>
  <text x="555" y="316" fill="#475569" font-size="8.5">• 32 layers, 32 heads, dim 128, FP16:</text>
  <text x="555" y="330" fill="#475569" font-size="8.5">• 1 Token = 524 KB | 4096 Tokens = 2.1 GB / req</text>
  <text x="555" y="346" fill="#059669" font-size="9" font-weight="700">Zero recomputation saves 99% compute!</text>

  <!-- Bottom Invariant Footer Banner -->
  <rect x="35" y="377" width="780" height="42" rx="6" fill="#1B3A5F"/>
  <text x="50" y="396" fill="#FF8246" font-size="11" font-weight="700">Past Projection Immutability Invariant: Key/Value projections of past tokens are static and never change.</text>
  <text x="50" y="411" fill="#FFFFFF" font-size="9.5">Pre-allocated static ring buffers eliminate redundant matrix multiplications, transforming quadratic decode latency into O(1) memory streaming.</text>
</svg>
