<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="360" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C85A17" /></marker>
  </defs>
  <text x="30" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Token lookup</text>
  <rect x="30" y="60" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="105.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Token IDs</text>
  <text x="105.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[2, 0, 2]</text>
  <rect x="240" y="60" width="180" height="60" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2" />
  <text x="330.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Embedding table</text>
  <text x="330.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">W has shape [V, D]</text>
  <rect x="480" y="60" width="170" height="60" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
  <text x="565.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Gathered vectors</text>
  <text x="565.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[W₂, W₀, W₂]</text>
  <path d="M180,90 H240" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M420,90 H480" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="30" y="175" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Add position information</text>
  <rect x="30" y="200" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="120.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Token vectors E</text>
  <text x="120.0" y="241.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[B, S, D]</text>
  <rect x="250" y="200" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="340.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Position vectors P</text>
  <text x="340.0" y="241.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[S, D], broadcast over B</text>
  <rect x="470" y="200" width="180" height="60" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
  <text x="560.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Elementwise addition</text>
  <text x="560.0" y="241.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">X = E + P; [B, S, D]</text>
  <path d="M210,230 H230 V280 H560 V260" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,230 H470" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M30,295 H650" stroke="#D1D5DB" stroke-width="0.8" />
  <text x="340" y="315" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Positions may be learned or sinusoidal, within the configured position-table length.</text>
  <text x="340" y="331" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Optional token scaling precedes addition. Repeated token IDs add their gradient contributions to one table row.</text>
</svg>
