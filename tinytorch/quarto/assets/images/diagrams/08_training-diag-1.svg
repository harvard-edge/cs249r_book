<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="360" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C85A17" /></marker>
  </defs>
  <text x="30" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Within each accumulation window</text>
  <rect x="30" y="60" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="120.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Forward pass</text>
  <text x="120.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">outputs = model(inputs)</text>
  <rect x="250" y="60" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="340.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Scalar batch-mean loss</text>
  <text x="340.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">loss_fn(outputs, targets)</text>
  <rect x="470" y="60" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="560.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Backward, sample weighted</text>
  <text x="560.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">seed = batch sample count</text>
  <path d="M210,90 H250" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,90 H470" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="340" y="155" text-anchor="middle" font-size="9.5" font-weight="400" fill="#111827">Repeat for configured batches; also update the final partial window</text>
  <text x="30" y="195" text-anchor="start" font-size="12" font-weight="700" fill="#111827">At the window boundary</text>
  <rect x="30" y="220" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="120.0" y="245.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Average gradients</text>
  <text x="120.0" y="261.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">divide by window samples</text>
  <rect x="250" y="220" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="340.0" y="245.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Optional norm clipping</text>
  <text x="340.0" y="261.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">scale if above threshold</text>
  <rect x="470" y="220" width="180" height="60" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
  <text x="560.0" y="245.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Update, then clear</text>
  <text x="560.0" y="261.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">step(); zero_grad()</text>
  <path d="M210,250 H250" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,250 H470" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M30,300 H650" stroke="#D1D5DB" stroke-width="0.8" />
  <text x="340" y="320" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Trainer clears gradients before the epoch and sets the scheduled learning rate before processing batches.</text>
  <text x="340" y="336" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Averaging by actual sample count handles unequal batch sizes and a short final window.</text>
</svg>
