<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="360" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C85A17" /></marker>
  </defs>
  <text x="30" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">SGD</text>
  <text x="250" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Adam</text>
  <text x="470" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">AdamW</text>
  <rect x="30" y="60" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="120.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Gradient + coupled decay</text>
  <text x="120.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">g′ = g + λθ</text>
  <rect x="30" y="150" width="180" height="80" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
  <text x="120.0" y="177.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Optional momentum</text>
  <text x="120.0" y="193.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">v = βv + g′</text>
  <text x="120.0" y="209.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">θ ← θ − ηv</text>
  <path d="M120,120 V150" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="250" y="60" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="340.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Gradient + coupled decay</text>
  <text x="340.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">g′ = g + λθ</text>
  <rect x="250" y="150" width="180" height="80" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
  <text x="340.0" y="177.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Bias-corrected moments</text>
  <text x="340.0" y="193.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">m̂ and v̂ from g′</text>
  <text x="340.0" y="209.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">θ ← θ − ηm̂ / (√v̂ + ε)</text>
  <path d="M340,120 V150" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="470" y="60" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="560.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Gradient moments</text>
  <text x="560.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">m̂ and v̂ from g</text>
  <rect x="470" y="150" width="180" height="80" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
  <text x="560.0" y="177.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Separate weight decay</text>
  <text x="560.0" y="193.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">θ ← (1 − ηλ)θ</text>
  <text x="560.0" y="209.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">θ ← θ − ηm̂ / (√v̂ + ε)</text>
  <path d="M560,120 V150" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M30,250 H650" stroke="#D1D5DB" stroke-width="0.8" />
  <text x="340" y="270" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">η: learning rate; λ: weight decay; β: momentum; g: current gradient.</text>
  <text x="340" y="286" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Without SGD momentum, the update uses g′ directly.</text>
  <text x="340" y="302" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">All three skip parameters whose gradient is None. Moments and momentum are optimizer state.</text>
</svg>
