<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="290" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker></defs>
<rect x="30" y="40" width="180" height="70" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="120.0" y="71.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Start or resume</text>
<text x="120.0" y="85.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">tito module start N</text>
<path d="M210,75 H250" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="250" y="40" width="180" height="70" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="340.0" y="71.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Implement in notebook</text>
<text x="340.0" y="85.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Run inline checks</text>
<path d="M430,75 H470" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="470" y="40" width="180" height="70" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="560.0" y="71.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Validate and export</text>
<text x="560.0" y="85.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">tito module complete N</text>
<rect x="250" y="170" width="180" height="60" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="340.0" y="196.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Inspect results</text>
<text x="340.0" y="210.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">tito module status</text>
<path d="M560,110 V140 H340 V170" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<text x="340.0" y="270" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Complete each module, resolve failed checks, and then continue to the next module.</text>
</svg>
