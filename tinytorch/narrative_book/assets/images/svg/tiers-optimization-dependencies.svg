<text x="340.0" y="261.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">19 Benchmarking</text>
<text x="340.0" y="275.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Measure time, memory, and correctness</text>
<text x="340.0" y="330" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Conceptual workflow: select techniques for the measured bottleneck, then evaluate.</text>
