<text x="100.0" y="148.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Lower-precision</text>
<text x="100.0" y="162.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">representations</text>
<path d="M340,70 V90 H100 V110" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<path d="M100,180 V210 H340 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="190" y="110" width="140" height="70" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
