<text x="260.0" y="155.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Prune redundant parameters</text>
<path d="M340,70 V90 H260 V110" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<path d="M260,180 V210 H340 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="350" y="110" width="140" height="70" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="420.0" y="141.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">17 Acceleration</text>
<text x="420.0" y="155.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Vectorize operations</text>
<path d="M340,70 V90 H420 V110" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<path d="M420,180 V210 H340 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="510" y="110" width="140" height="70" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="580.0" y="141.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">18 Memoization</text>
<text x="580.0" y="155.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Cache reusable computation</text>
<path d="M340,70 V90 H580 V110" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<path d="M580,180 V210 H340 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
