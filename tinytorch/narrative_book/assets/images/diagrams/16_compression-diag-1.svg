<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Model Compression Spectrum: Unstructured Sparsity vs. Structured Pruning vs. Low-Rank SVD</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== COLUMN 1: UNSTRUCTURED SPARSITY ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="256" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="256" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="256" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="12" y="19" font-size="11.5" font-weight="700" fill="#111827">1. Unstructured Sparsity</text>
    <text x="244" y="19" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="end">W ⊙ M (80% Zeros)</text>

    <!-- Matrix Grid Diagram with Scattered Zeros -->
    <g transform="translate(50, 42)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="17" y="15" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
      <rect x="40" y="0" width="34" height="22" fill="#111827" />
      <text x="57" y="15" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.4</text>
      <rect x="80" y="0" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="97" y="15" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
      <rect x="120" y="0" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="137" y="15" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>

      <!-- Row 1 -->
      <rect x="0" y="26" width="34" height="22" fill="#111827" />
      <text x="17" y="41" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2.1</text>
      <rect x="40" y="26" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="57" y="41" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
      <rect x="80" y="26" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="97" y="41" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
      <rect x="120" y="26" width="34" height="22" fill="#111827" />
      <text x="137" y="41" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.8</text>

      <!-- Row 2 -->
      <rect x="0" y="52" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="17" y="67" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
      <rect x="40" y="52" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="57" y="67" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
      <rect x="80" y="52" width="34" height="22" fill="#111827" />
      <text x="97" y="67" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3.5</text>
      <rect x="120" y="52" width="34" height="22" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
      <text x="137" y="67" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">0.0</text>
    </g>

    <!-- Diagnostics / Systems Trap Box -->
    <g transform="translate(12, 130)">
      <rect x="0" y="0" width="232" height="24" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="116" y="16" font-size="10" font-weight="700" fill="#9A3412" text-anchor="middle">The 0.0× Speedup Trap</text>

      <text x="0" y="42" font-size="9" font-weight="700" fill="#111827">• Scattered random zero indices</text>
      <text x="0" y="57" font-size="9" fill="#4B5563">• Requires CSR index pointer tables</text>
      <text x="0" y="72" font-size="9" fill="#4B5563">• Non-coalesced irregular memory gathers</text>
      <text x="0" y="87" font-size="9" fill="#4B5563">• GPU SIMD warps diverge &amp; stall</text>
      
      <line x1="0" y1="98" x2="232" y2="98" stroke="#E5E7EB" stroke-width="1" />
      <text x="116" y="114" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="middle">Physical Speedup: ≤ 1.0× (Slower)</text>
      <text x="116" y="128" font-size="8.5" fill="#6B7280" text-anchor="middle">Zero systolic tensor core speedup</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: STRUCTURED PRUNING ==================== -->
  <g transform="translate(312, 56)">
    <rect x="0" y="0" width="256" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="256" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="256" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="12" y="19" font-size="11.5" font-weight="700" fill="#111827">2. Structured Pruning</text>
    <text x="244" y="19" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="end">Drop Columns / Heads</text>

    <!-- Structured Pruning Diagram -->
    <g transform="translate(24, 42)">
      <!-- Original with pruned column marks -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="20" height="74" fill="#111827" />
        <rect x="24" y="0" width="20" height="74" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
        <line x1="24" y1="0" x2="44" y2="74" stroke="#C85A17" stroke-width="1.5" />
        <rect x="48" y="0" width="20" height="74" fill="#111827" />
        <rect x="72" y="0" width="20" height="74" fill="#FFF7ED" stroke="#C85A17" stroke-dasharray="2,2" />
        <line x1="72" y1="0" x2="92" y2="74" stroke="#C85A17" stroke-width="1.5" />
        <text x="46" y="90" font-size="8.5" font-weight="700" fill="#4B5563" text-anchor="middle">4 × 4 (Prune Col 1, 3)</text>
      </g>

      <!-- Arrow -->
      <path d="M104 37 H124" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

      <!-- Shrunk Matrix -->
      <g transform="translate(136, 0)">
        <rect x="0" y="0" width="48" height="74" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.5" />
        <rect x="4" y="4" width="18" height="66" fill="#111827" />
        <rect x="26" y="4" width="18" height="66" fill="#111827" />
        <text x="24" y="90" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">4 × 2 Dense</text>
      </g>
    </g>

    <!-- Diagnostics / Performance Box -->
    <g transform="translate(12, 142)">
      <rect x="0" y="0" width="232" height="24" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="116" y="16" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">Line-Rate Hardware Speedup</text>

      <text x="0" y="42" font-size="9" font-weight="700" fill="#111827">• Deletes full channels, heads, layers</text>
      <text x="0" y="57" font-size="9" fill="#4B5563">• Matrix physically contracts: M × N'</text>
      <text x="0" y="72" font-size="9" fill="#4B5563">• Preserves contiguous strided layout</text>
      <text x="0" y="87" font-size="9" fill="#4B5563">• Full Tensor Core vectorization</text>
      
      <line x1="0" y1="98" x2="232" y2="98" stroke="#E5E7EB" stroke-width="1" />
      <text x="116" y="114" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">Physical Speedup: ~2.0× Exact</text>
      <text x="116" y="128" font-size="8.5" fill="#4B5563" text-anchor="middle">Proportional to FLOP reduction</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: LOW-RANK SVD FACTORIZATION ==================== -->
  <g transform="translate(584, 56)">
    <rect x="0" y="0" width="256" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="256" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="256" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="12" y="19" font-size="11.5" font-weight="700" fill="#111827">3. Low-Rank SVD</text>
    <text x="244" y="19" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="end">W ≈ A · B</text>

    <!-- SVD Matrix Decomposition Diagram -->
    <g transform="translate(18, 42)">
      <!-- Matrix W (M x N) -->
      <rect x="0" y="8" width="56" height="66" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
      <text x="28" y="45" font-size="9" font-weight="700" fill="#111827" text-anchor="middle">M × N</text>
      <text x="28" y="88" font-size="8.5" font-weight="700" fill="#4B5563" text-anchor="middle">Weight W</text>

      <!-- Approx Sign -->
      <text x="68" y="46" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">≈</text>

      <!-- Matrix A (M x r) -->
      <rect x="82" y="8" width="24" height="66" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
      <text x="94" y="45" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">M × r</text>
      <text x="94" y="88" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">A</text>

      <!-- Multiply Sign -->
      <text x="118" y="46" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">×</text>

      <!-- Matrix B (r x N) -->
      <rect x="130" y="32" width="76" height="24" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
      <text x="168" y="48" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">r × N</text>
      <text x="168" y="70" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">B</text>
    </g>

    <!-- Diagnostics / Math Properties Box -->
    <g transform="translate(12, 142)">
      <rect x="0" y="0" width="232" height="24" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="116" y="16" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">Rank-r Factorization (r ≪ min(M, N))</text>

      <text x="0" y="42" font-size="9" font-weight="700" fill="#111827">• Params: M · N → r(M + N)</text>
      <text x="0" y="57" font-size="9" fill="#4B5563">• Replaces 1 large GEMM with 2 small</text>
      <text x="0" y="72" font-size="9" fill="#4B5563">• Preserves dense matrix hardware path</text>
      <text x="0" y="87" font-size="9" fill="#4B5563">• Foundation for LoRA fine-tuning</text>
      
      <line x1="0" y1="98" x2="232" y2="98" stroke="#E5E7EB" stroke-width="1" />
      <text x="116" y="114" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">FLOPs: 2MN → 2r(M + N)</text>
      <text x="116" y="128" font-size="8.5" fill="#4B5563" text-anchor="middle">Linear parameter compression</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Systolic array processors demand contiguous, strided memory buffers. Unstructured sparsity thrashes memory caches and diverges SIMD execution,
      <tspan x="0" dy="16">while structured channel pruning and low-rank SVD decompositions physically shrink matrix dimensions and guarantee line-rate acceleration.</tspan>
    </text>
  </g>
</svg>
