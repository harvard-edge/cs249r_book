<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">The Torch Olympics: Multi-Metric Systems Evaluation &amp; MLPerf Scorecard</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== LEFT PANEL: RADAR CHART ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="410" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="410" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="410" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Systems Evaluation Radar</text>
    <text x="396" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">4-Axis Performance Envelope</text>

    <!-- Radar Coordinate System (Center: 205, 168, Radius: 80) -->
    <g transform="translate(205, 168)">
      <!-- Concentric Grid Polygons (25%, 50%, 75%, 100%) -->
      <polygon points="0,-20 20,0 0,20 -20,0" fill="none" stroke="#F3F4F6" stroke-width="1" />
      <polygon points="0,-40 40,0 0,40 -40,0" fill="none" stroke="#E5E7EB" stroke-width="1" />
      <polygon points="0,-60 60,0 0,60 -60,0" fill="none" stroke="#E5E7EB" stroke-width="1" />
      <polygon points="0,-80 80,0 0,80 -80,0" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- Axes -->
      <line x1="0" y1="-85" x2="0" y2="85" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="-85" y1="0" x2="85" y2="0" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Baseline Polygon (Dashed Gray/Black) -->
      <polygon points="0,-80 5,0 0,20 -5,0" fill="#9CA3AF" fill-opacity="0.15" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="3,3" />

      <!-- TinyTorch Champion Polygon -->
      <polygon points="0,-79 79,0 0,79 -76,0" fill="#FFF7ED" fill-opacity="0.8" stroke="#C85A17" stroke-width="2" />
      <circle cx="0" cy="-79" r="4" fill="#C85A17" />
      <circle cx="79" cy="0" r="4" fill="#C85A17" />
      <circle cx="0" cy="79" r="4" fill="#C85A17" />
      <circle cx="-76" cy="0" r="4" fill="#C85A17" />

      <!-- Axis Labels -->
      <text x="0" y="-93" font-size="9" font-weight="700" fill="#111827" text-anchor="middle">Accuracy Retention (99.8%)</text>
      <text x="94" y="3.5" font-size="9" font-weight="700" fill="#111827" text-anchor="start">Speedup (16.4×)</text>
      <text x="0" y="100" font-size="9" font-weight="700" fill="#111827" text-anchor="middle">VRAM Cut (4.0×)</text>
      <text x="-94" y="3.5" font-size="9" font-weight="700" fill="#111827" text-anchor="end">Throughput (165 t/s)</text>
    </g>

    <!-- Legend -->
    <g transform="translate(48, 298)">
      <rect x="0" y="0" width="314" height="24" rx="2" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      
      <!-- Naive item -->
      <line x1="16" y1="12" x2="36" y2="12" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="42" y="15" font-size="8.5" font-weight="700" fill="#4B5563">Naive Baseline</text>

      <!-- TinyTorch item -->
      <rect x="150" y="6" width="16" height="12" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
      <text x="172" y="15" font-size="8.5" font-weight="700" fill="#9A3412">TinyTorch Accelerated Stack</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: OFFICIAL SCORECARD ==================== -->
  <g transform="translate(465, 56)">
    <rect x="0" y="0" width="375" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="375" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="375" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Official Olympic Scorecard</text>
    <text x="361" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">Gold Certified</text>

    <!-- Event 1: Accuracy Contest -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="347" height="48" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">[EVENT 1] Accuracy Contest (Top-1 Match)</text>
      <rect x="260" y="8" width="77" height="20" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="298" y="22" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">99.8% PASS</text>
      <text x="10" y="36" font-size="8.5" fill="#4B5563">Threshold: ≥ 99.0% | Quantization &amp; SVD preserve representation</text>
    </g>

    <!-- Event 2: Memory Challenge -->
    <g transform="translate(14, 94)">
      <rect x="0" y="0" width="347" height="48" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">[EVENT 2] Memory Challenge (Peak VRAM)</text>
      <rect x="260" y="8" width="77" height="20" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="298" y="22" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">4.0× PASS</text>
      <text x="10" y="36" font-size="8.5" fill="#4B5563">Threshold: ≥ 4.0× Cut | 100 MB → 25 MB static footprint</text>
    </g>

    <!-- Event 3: Latency Sprint -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="347" height="48" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">[EVENT 3] Latency Sprint (Decode Speedup)</text>
      <rect x="260" y="8" width="77" height="20" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="298" y="22" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">16.4× PASS</text>
      <text x="10" y="36" font-size="8.5" fill="#4B5563">Threshold: ≥ 10.0× | 100 ms → 6.1 ms per generated token</text>
    </g>

    <!-- Overall Certification Banner -->
    <g transform="translate(14, 208)">
      <rect x="0" y="0" width="347" height="112" rx="3" fill="#111827" />
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#FFF7ED">MLPerf Gold Medal Performance Certification</text>
      
      <line x1="12" y1="28" x2="335" y2="28" stroke="#374151" stroke-width="1" />
      <text x="12" y="46" font-size="8.5" fill="#E5E7EB">• Techniques: INT8 Quant + SVD Pruning + Fused GELU</text>
      <text x="12" y="60" font-size="8.5" fill="#E5E7EB">  + Tiled MatMul + Pre-Allocated KV Cache Engine</text>
      <text x="12" y="76" font-size="8.5" fill="#E5E7EB">• Verified against strict MLPerf systems inference standards</text>
      
      <rect x="12" y="84" width="323" height="20" rx="2" fill="#FFF7ED" />
      <text x="173" y="98" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">All 3 Olympic Performance Gates Conquered!</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Systems acceleration cannot sacrifice mathematical fidelity.
      <tspan x="0" dy="16">The Torch Olympics scorecard proves that aggressive 16× acceleration, 4× VRAM compression, and numerical precision stably coexist on the Pareto frontier.</tspan>
    </text>
  </g>
</svg>
