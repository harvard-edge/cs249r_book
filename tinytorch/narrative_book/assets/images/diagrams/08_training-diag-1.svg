<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Title & Section Header -->
  <text x="30" y="28" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">The Rigid Five-Step Training Loop State Machine &amp; Execution Mode Contracts</text>
  <line x1="30" y1="38" x2="910" y2="38" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TOP: 5-STEP TRAINING LOOP STATE MACHINE ==================== -->

  <!-- Step 1: zero_grad -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="150" height="92" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="150" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="75" y="15" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">1. optimizer.zero_grad()</text>

    <text x="8" y="36" font-size="8" font-family="monospace" fill="#111827">param.grad = None</text>
    <text x="8" y="48" font-size="7.5" fill="#4B5563">Resets gradient buffer</text>
    
    <rect x="6" y="56" width="138" height="30" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8" rx="1" />
    <text x="75" y="68" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">Hazard if Omitted:</text>
    <text x="75" y="79" font-size="7" fill="#7F1D1D" text-anchor="middle">Cross-batch accumulation → NaN</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 180 98 L 208 98" fill="none" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Step 2: forward -->
  <g transform="translate(210, 52)">
    <rect x="0" y="0" width="150" height="92" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="150" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="75" y="15" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">2. out = model(inputs)</text>

    <text x="8" y="36" font-size="8" font-family="monospace" fill="#111827">Forward DAG Pass</text>
    <text x="8" y="48" font-size="7.5" fill="#4B5563">Traverses compute graph</text>

    <rect x="6" y="56" width="138" height="30" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" rx="1" />
    <text x="75" y="68" font-size="7.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Dynamic Tape Invariant:</text>
    <text x="75" y="79" font-size="7" fill="#1E40AF" text-anchor="middle">Records Op tape &amp; caches inputs</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 360 98 L 388 98" fill="none" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Step 3: loss -->
  <g transform="translate(390, 52)">
    <rect x="0" y="0" width="150" height="92" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="150" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="75" y="15" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">3. loss = loss_fn(out, y)</text>

    <text x="8" y="36" font-size="8" font-family="monospace" fill="#111827">Objective Evaluation</text>
    <text x="8" y="48" font-size="7.5" fill="#4B5563">Log-Sum-Exp CrossEntropy</text>

    <rect x="6" y="56" width="138" height="30" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" rx="1" />
    <text x="75" y="68" font-size="7.5" font-weight="700" fill="#334155" text-anchor="middle">Scalar Loss Output:</text>
    <text x="75" y="79" font-size="7" font-family="'Times New Roman', serif" font-style="italic" fill="#475569" text-anchor="middle">L ∈ ℝ (Root of Autograd DAG)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 540 98 L 568 98" fill="none" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Step 4: backward -->
  <g transform="translate(570, 52)">
    <rect x="0" y="0" width="150" height="92" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="150" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="75" y="15" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">4. loss.backward()</text>

    <text x="8" y="36" font-size="8" font-family="monospace" fill="#111827">Reverse Mode Sweep</text>
    <text x="8" y="48" font-size="7.5" fill="#4B5563">Topological DFS on Tape</text>

    <rect x="6" y="56" width="138" height="30" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" rx="1" />
    <text x="75" y="68" font-size="7.5" font-weight="700" fill="#9A3412" text-anchor="middle">VJP Accumulation:</text>
    <text x="75" y="79" font-size="7" font-family="monospace" fill="#C85A17" text-anchor="middle">param.grad += local_vjp</text>
  </g>

  <!-- Arrow 4 -> Guardrail -->
  <path d="M 720 98 L 748 98" fill="none" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

  <!-- Intermediate Guardrail: Grad Norm Clipping (Highlighted) -->
  <g transform="translate(750, 52)">
    <rect x="0" y="0" width="160" height="92" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
    <rect x="0" y="0" width="160" height="22" fill="#FFEDD5" stroke="#C85A17" stroke-width="1.2" rx="2" />
    <text x="80" y="15" font-size="10" font-weight="700" fill="#9A3412" text-anchor="middle">Guard: Grad Norm Clip</text>

    <text x="8" y="36" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#7C2D12">||g||_global = √( ∑ ||g_i||₂² )</text>
    <text x="8" y="50" font-size="7.5" fill="#7C2D12">If ||g|| &gt; γ_max: scale uniformly</text>

    <rect x="6" y="56" width="148" height="30" fill="#FFFFFF" stroke="#EA580C" stroke-width="0.8" rx="1" />
    <text x="74" y="68" font-size="7.5" font-weight="700" fill="#9A3412" text-anchor="middle">Direction Invariant:</text>
    <text x="74" y="79" font-size="7" font-family="'Times New Roman', serif" font-style="italic" fill="#C85A17" text-anchor="middle">Preserves angle, clamps length</text>
  </g>

  <!-- Path from Guardrail down to Step 5 -->
  <path d="M 830 144 L 830 204 L 724 204" fill="none" stroke="#C85A17" stroke-width="1.4" marker-end="url(#arrowOrange)" />

  <!-- Step 5: step -->
  <g transform="translate(570, 158)">
    <rect x="0" y="0" width="150" height="92" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="150" height="22" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="75" y="15" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">5. optimizer.step()</text>

    <text x="8" y="36" font-size="8" font-family="monospace" fill="#111827">Parameter Update</text>
    <text x="8" y="48" font-size="7.5" fill="#4B5563">Applies AdamW / SGD rule</text>

    <rect x="6" y="56" width="138" height="30" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8" rx="1" />
    <text x="75" y="68" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">In-Place Mutation:</text>
    <text x="75" y="79" font-size="7" font-family="monospace" fill="#15803D" text-anchor="middle">param.data -= η * update</text>
  </g>

  <!-- Cyclic Loop-back path from Step 5 to Step 1 -->
  <path d="M 570 215 L 18 215 L 18 98 L 26 98" fill="none" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arrowGray)" stroke-dasharray="3,3" />

  <!-- Middle Left: Cosine Annealing Learning Rate Schedule -->
  <g transform="translate(30, 158)">
    <rect x="0" y="0" width="520" height="92" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <rect x="0" y="0" width="520" height="20" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="12" y="14" font-size="9" font-weight="700" fill="#111827">Dynamic Cosine Annealing Learning Rate Schedule (Loshchilov &amp; Hutter 2016)</text>

    <!-- Mini-plot of cosine decay -->
    <g transform="translate(15, 24)">
      <line x1="30" y1="52" x2="160" y2="52" stroke="#94A3B8" stroke-width="0.8" />
      <line x1="30" y1="12" x2="30" y2="52" stroke="#94A3B8" stroke-width="0.8" />
      
      <text x="25" y="15" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827" text-anchor="end">η_max</text>
      <text x="25" y="52" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280" text-anchor="end">η_min</text>
      <text x="160" y="60" font-size="7" fill="#6B7280" text-anchor="middle">Epochs (T)</text>

      <!-- Half-cosine curve -->
      <path d="M 30 14 C 70 14, 100 50, 160 50" fill="none" stroke="#C85A17" stroke-width="1.8" />
      <circle cx="30" cy="14" r="2" fill="#C85A17" />
      <circle cx="160" cy="50" r="2" fill="#C85A17" />
    </g>

    <!-- Formula & Explanation -->
    <g transform="translate(195, 24)">
      <text x="0" y="14" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#9A3412">η_t = η_min + ½ · (η_max - η_min) · ( 1 + cos( π t / T ) )</text>
      <text x="0" y="30" font-size="7.5" fill="#4B5563">• Early Epochs (high η): Escapes sharp local minima and saddles.</text>
      <text x="0" y="44" font-size="7.5" fill="#4B5563">• Late Epochs (infinitesimal η): Settles into deep, flat, generalizing basins.</text>
      <text x="0" y="58" font-size="7.5" fill="#1D4ED8">• Updated deterministically per epoch via <tspan font-family="monospace">scheduler.step()</tspan>.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: TRAIN VS EVAL MODE CONTRACTS ==================== -->
  <g transform="translate(30, 265)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#E5E7EB" stroke-width="1.2" />

    <!-- Left Box: model.train() Contract -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="430" height="205" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
      <rect x="0" y="0" width="430" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
      <text x="14" y="16" font-size="11" font-weight="700" fill="#111827">model.train() — Active Training Contract</text>

      <g transform="translate(12, 32)" font-size="8.5">
        <!-- Item 1: Autograd Tape -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="406" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
          <text x="8" y="14" font-weight="700" fill="#111827">Autograd Tape Recording: <tspan fill="#16A34A">ENABLED</tspan></text>
          <text x="8" y="28" fill="#4B5563">Every operation dynamically appends Op node to tape and caches activations.</text>
        </g>

        <!-- Item 2: Dropout -->
        <g transform="translate(0, 43)">
          <rect x="0" y="0" width="406" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
          <text x="8" y="14" font-weight="700" fill="#111827">Dropout Regularization: <tspan fill="#D97706">STOCHASTIC ACTIVE</tspan></text>
          <text x="8" y="28" fill="#4B5563">Randomly masks activations with probability p, scaling survivors by 1 / (1 - p).</text>
        </g>

        <!-- Item 3: Parameters -->
        <g transform="translate(0, 86)">
          <rect x="0" y="0" width="406" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
          <text x="8" y="14" font-weight="700" fill="#111827">Parameter Mutability: <tspan fill="#C85A17">MUTABLE</tspan></text>
          <text x="8" y="28" fill="#4B5563">Optimizer mutates param.data in-place using accumulated analytical gradients.</text>
        </g>

        <!-- Item 4: Memory Invariant -->
        <g transform="translate(0, 129)">
          <rect x="0" y="0" width="406" height="32" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" rx="2" />
          <text x="8" y="13" font-weight="700" fill="#1D4ED8">Memory Footprint:</text>
          <text x="8" y="25" fill="#1E40AF">Peak VRAM required for forward activation storage + backward graph.</text>
        </g>
      </g>
    </g>

    <!-- Right Box: model.eval() Contract -->
    <g transform="translate(450, 10)">
      <rect x="0" y="0" width="430" height="205" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
      <rect x="0" y="0" width="430" height="24" fill="#FFEDD5" stroke="#C85A17" stroke-width="1.2" rx="2" />
      <text x="14" y="16" font-size="11" font-weight="700" fill="#9A3412">model.eval() + with no_grad: — Inference Contract</text>

      <g transform="translate(12, 32)" font-size="8.5">
        <!-- Item 1: Autograd Tape -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="406" height="38" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" rx="2" />
          <text x="8" y="14" font-weight="700" fill="#9A3412">Autograd Tape Recording: <tspan fill="#DC2626">DISABLED (Zero-Overhead)</tspan></text>
          <text x="8" y="28" fill="#7C2D12">No graph allocation or activation caching; intermediate tensors freed immediately.</text>
        </g>

        <!-- Item 2: Dropout -->
        <g transform="translate(0, 43)">
          <rect x="0" y="0" width="406" height="38" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" rx="2" />
          <text x="8" y="14" font-weight="700" fill="#9A3412">Dropout Regularization: <tspan fill="#16A34A">IDENTITY PASS-THROUGH</tspan></text>
          <text x="8" y="28" fill="#7C2D12">f(x) = x without masking; produces deterministic full-expectation inference.</text>
        </g>

        <!-- Item 3: Parameters -->
        <g transform="translate(0, 86)">
          <rect x="0" y="0" width="406" height="38" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" rx="2" />
          <text x="8" y="14" font-weight="700" fill="#9A3412">Parameter Mutability: <tspan fill="#16A34A">IMMUTABLE / FROZEN</tspan></text>
          <text x="8" y="28" fill="#7C2D12">Guarantees zero parameter mutation, preventing test-set data contamination.</text>
        </g>

        <!-- Item 4: Memory Invariant -->
        <g transform="translate(0, 129)">
          <rect x="0" y="0" width="406" height="32" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8" rx="2" />
          <text x="8" y="13" font-weight="700" fill="#166534">Memory Footprint:</text>
          <text x="8" y="25" fill="#15803D">~50% VRAM reduction compared to training pass; maximal throughput.</text>
        </g>
      </g>
    </g>
  </g>
</svg>