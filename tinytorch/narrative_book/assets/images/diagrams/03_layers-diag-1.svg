<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="350" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827" /></marker></defs>
<rect x="180" y="25" width="320" height="75" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
<text x="192" y="47" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Layer interface</text>
<text x="192" y="66" text-anchor="start" font-size="11" font-weight="400" fill="#111827">forward(x), __call__(x), parameters()</text>
<rect x="30" y="165" width="180" height="95" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="42" y="187" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Linear</text>
<text x="42" y="206" text-anchor="start" font-size="11" font-weight="400" fill="#111827">y = x @ weight + bias</text>
<text x="42" y="225" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Trainable weight and bias</text>
<path d="M340 100 V130 H120 V165" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<rect x="250" y="165" width="180" height="95" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="262" y="187" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Dropout</text>
<text x="262" y="206" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Training: random mask</text>
<text x="262" y="225" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Evaluation: identity</text>
<path d="M340 100 V130 H340 V165" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<rect x="470" y="165" width="180" height="95" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="482" y="187" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Sequential</text>
<text x="482" y="206" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Apply layers in order</text>
<text x="482" y="225" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Collect each parameter once</text>
<path d="M340 100 V130 H560 V165" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<path d="M30 293 H650" stroke="#D1D5DB" stroke-width="1" />
<text x="30" y="310" text-anchor="start" font-size="10" font-weight="400" fill="#4B5563">All three provide the interface; Sequential composes layers into a network.</text>
</svg>
