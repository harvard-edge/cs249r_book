<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="310" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="130" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Vectorized matmul</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">A @ B through NumPy</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Library handles the inner loops</text>
<text x="120.0" y="109" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Compare against loop baseline</text>
<rect x="250" y="30" width="180" height="130" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="340.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GELU expressions</text>
<text x="340.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">unfused_gelu: staged arrays</text>
<text x="340.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">fused_gelu: one expression</text>
<text x="340.0" y="109" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">NumPy may create temporaries</text>
<rect x="470" y="30" width="180" height="130" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="560.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Tiled matmul</text>
<text x="560.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Partition A, B, and C</text>
<text x="560.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Accumulate tile products</text>
<text x="560.0" y="109" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Python loops add overhead</text>
<path d="M 120 160 H 120 V 210" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 340 160 H 340 V 210" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 560 160 H 560 V 210" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="210" width="620" height="70" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2"/>
<text x="340.0" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Check outputs, then measure the same workload</text>
<text x="340.0" y="255" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">CPU / NumPy execution; no guaranteed speedup or single fused hardware kernel</text>
</svg>
