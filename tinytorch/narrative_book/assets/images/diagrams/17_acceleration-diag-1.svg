<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Hardware Memory Hierarchy &amp; Acceleration: Kernel Fusion vs. Cache-Tiled MatMul</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== LEFT PANEL: KERNEL FUSION ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="395" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="395" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="395" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">1. Operator Kernel Fusion</text>
    <text x="381" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">DRAM Roundtrip Elimination</text>

    <!-- Sub-block A: Unfused Pipeline -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="367" height="106" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#9A3412">Unfused Execution (2 Launches &amp; 4 DRAM Passes):</text>
      
      <!-- Flow Diagram -->
      <g transform="translate(10, 24)">
        <!-- DRAM Read 1 -->
        <rect x="0" y="4" width="60" height="24" rx="2" fill="#111827" />
        <text x="30" y="19" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">DRAM: h, b</text>
        <path d="M62 16 H78" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- Kernel 1 -->
        <rect x="80" y="4" width="65" height="24" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1" />
        <text x="112" y="19" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">Add Kernel</text>
        <path d="M147 16 H163" stroke="#C85A17" stroke-width="1.2" marker-end="url(#arrowOrange)" />

        <!-- DRAM Write/Read Intermediate -->
        <rect x="165" y="4" width="75" height="24" rx="2" fill="#C85A17" />
        <text x="202" y="19" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">DRAM: z (Stall)</text>
        <path d="M242 16 H258" stroke="#C85A17" stroke-width="1.2" marker-end="url(#arrowOrange)" />

        <!-- Kernel 2 -->
        <rect x="260" y="4" width="65" height="24" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1" />
        <text x="292" y="19" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">GELU Kernel</text>
      </g>

      <text x="10" y="70" font-size="8.5" fill="#4B5563">• High DRAM bus pressure: 2 reads + 2 writes per element</text>
      <text x="10" y="84" font-size="8.5" font-weight="700" fill="#C85A17">• Bottleneck: ~88% of execution time stalled waiting on memory bus</text>
      <text x="10" y="98" font-size="8.5" fill="#4B5563">• Intermediate tensor z pollutes L2 cache &amp; global memory</text>
    </g>

    <!-- Sub-block B: Fused Pipeline -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="367" height="114" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#111827">Fused Kernel (1 Launch &amp; 2 DRAM Passes):</text>
      
      <!-- Flow Diagram -->
      <g transform="translate(10, 24)">
        <!-- DRAM Read -->
        <rect x="0" y="4" width="70" height="26" rx="2" fill="#111827" />
        <text x="35" y="20" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">DRAM: Read h, b</text>
        <path d="M72 17 H88" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- On-Chip SRAM -->
        <rect x="90" y="0" width="168" height="34" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
        <text x="174" y="13" font-size="8" font-weight="700" fill="#9A3412" text-anchor="middle">On-Chip SRAM Registers (~20 TB/s)</text>
        <text x="174" y="26" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">z = h + b  ──►  a = GELU(z)</text>
        <path d="M260 17 H276" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- DRAM Write -->
        <rect x="278" y="4" width="68" height="26" rx="2" fill="#111827" />
        <text x="312" y="20" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">DRAM: Write a</text>
      </g>

      <text x="10" y="74" font-size="8.5" fill="#4B5563">• Zero intermediate memory traffic: z remains in fast SRAM registers</text>
      <text x="10" y="88" font-size="8.5" font-weight="700" fill="#111827">• Bandwidth reduction: Exactly 2.0× fewer DRAM roundtrips</text>
      <text x="10" y="102" font-size="8.5" fill="#4B5563">• Minimal kernel launch scheduling overhead</text>
    </g>

    <!-- Bottom summary note -->
    <g transform="translate(14, 274)">
      <rect x="0" y="0" width="367" height="46" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#111827">TinyTorch Implementation: <tspan font-weight="400" fill="#4B5563">FusedBiasGELU combines linear bias</tspan></text>
      <text x="10" y="30" font-size="8.5" fill="#4B5563">addition and non-linear activation into a single vectorized kernel pass.</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: CACHE TILING & HIERARCHY ==================== -->
  <g transform="translate(445, 56)">
    <rect x="0" y="0" width="395" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="395" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="395" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">2. Cache-Tiled MatMul &amp; Memory Wall</text>
    <text x="381" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">B_k × B_k Tiling</text>

    <!-- Tiling Diagram -->
    <g transform="translate(14, 36)">
      <rect x="0" y="0" width="367" height="114" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#111827">SRAM Block Tiling Dataflow:</text>
      
      <g transform="translate(10, 24)">
        <!-- Matrix A Tile -->
        <rect x="0" y="4" width="36" height="44" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
        <rect x="8" y="12" width="18" height="18" fill="#C85A17" />
        <text x="17" y="24" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">A_tile</text>
        <text x="18" y="58" font-size="7.5" font-weight="700" fill="#4B5563" text-anchor="middle">Matrix A</text>

        <text x="44" y="28" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">×</text>

        <!-- Matrix B Tile -->
        <rect x="52" y="0" width="44" height="36" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
        <rect x="60" y="8" width="18" height="18" fill="#C85A17" />
        <text x="69" y="20" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">B_tile</text>
        <text x="74" y="46" font-size="7.5" font-weight="700" fill="#4B5563" text-anchor="middle">Matrix B</text>

        <!-- Arrow -->
        <path d="M102 22 H118" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- SRAM Accumulator -->
        <rect x="124" y="2" width="50" height="50" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
        <rect x="135" y="12" width="28" height="28" fill="#C85A17" />
        <text x="149" y="30" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">C_acc</text>
        <text x="149" y="62" font-size="7.5" font-weight="700" fill="#9A3412" text-anchor="middle">SRAM Acc</text>

        <!-- Complexity Badge -->
        <rect x="185" y="6" width="162" height="42" rx="3" fill="#111827" />
        <text x="266" y="21" font-size="8.5" font-weight="700" fill="#FFF7ED" text-anchor="middle">Tile Reused B_k Times</text>
        <text x="266" y="36" font-size="8" fill="#E5E7EB" text-anchor="middle">DRAM: O(N³) → O(N³ / B_k)</text>
      </g>

      <text x="10" y="102" font-size="8.5" fill="#4B5563">Tiling keeps operative sub-blocks in SRAM, boosting arithmetic intensity.</text>
    </g>

    <!-- Memory Hierarchy Latency Table -->
    <g transform="translate(14, 158)">
      <rect x="0" y="0" width="367" height="162" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">Hardware Memory Hierarchy Latency &amp; Bandwidth Wall:</text>
      
      <!-- Table Header -->
      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="347" height="18" fill="#F9FAFB" />
        <text x="8" y="13" font-size="8.5" font-weight="700" fill="#111827">Memory Level</text>
        <text x="110" y="13" font-size="8.5" font-weight="700" fill="#111827">Capacity</text>
        <text x="185" y="13" font-size="8.5" font-weight="700" fill="#111827">Latency</text>
        <text x="260" y="13" font-size="8.5" font-weight="700" fill="#111827">Bandwidth</text>

        <!-- Row 1: Registers / SRAM -->
        <rect x="0" y="20" width="347" height="20" fill="#FFF7ED" />
        <text x="8" y="34" font-size="8.5" font-weight="700" fill="#9A3412">SRAM / Registers</text>
        <text x="110" y="34" font-size="8.5" fill="#4B5563">256 KB / SM</text>
        <text x="185" y="34" font-size="8.5" font-weight="700" fill="#9A3412">~1 ns (1×)</text>
        <text x="260" y="34" font-size="8.5" font-weight="700" fill="#9A3412">~20.0 TB/s</text>

        <!-- Row 2: L2 Cache -->
        <rect x="0" y="42" width="347" height="20" fill="#F9FAFB" />
        <text x="8" y="56" font-size="8.5" font-weight="700" fill="#111827">On-Chip L2 Cache</text>
        <text x="110" y="56" font-size="8.5" fill="#4B5563">~50 MB</text>
        <text x="185" y="56" font-size="8.5" fill="#4B5563">~5 ns (5×)</text>
        <text x="260" y="56" font-size="8.5" fill="#4B5563">~6.0 TB/s</text>

        <!-- Row 3: Off-Chip DRAM / HBM -->
        <rect x="0" y="64" width="347" height="20" fill="#FFFFFF" />
        <text x="8" y="78" font-size="8.5" font-weight="700" fill="#111827">Off-Chip DRAM / HBM</text>
        <text x="110" y="78" font-size="8.5" fill="#4B5563">80 GB</text>
        <text x="185" y="78" font-size="8.5" font-weight="700" fill="#C85A17">~200 ns (200×)</text>
        <text x="260" y="78" font-size="8.5" font-weight="700" fill="#C85A17">~2.0 TB/s</text>
      </g>

      <line x1="10" y1="118" x2="357" y2="118" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="134" font-size="8.5" font-weight="700" fill="#C85A17">• DRAM latency penalty: 200 cycles of stalled execution per memory miss</text>
      <text x="10" y="148" font-size="8.5" fill="#4B5563">• Goal of systems engineering: Keep active data residing inside SRAM registers</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Off-chip DRAM access is 200× slower with 10× lower bandwidth than on-chip SRAM registers.
      <tspan x="0" dy="16">Kernel fusion eliminates wasteful roundtrips for elementwise operations, while matrix cache tiling amortizes memory fetches over B_k inner-product reuses.</tspan>
    </text>
  </g>
</svg>
