<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Title & Section Header -->
  <text x="30" y="30" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Asynchronous Multi-Worker Data Pipeline &amp; Page-Locked DMA Transfers</text>
  <line x1="30" y1="40" x2="910" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TOP: PIPELINE ARCHITECTURE ==================== -->
  
  <!-- 1. Dataset on Storage -->
  <g transform="translate(30, 58)">
    <rect x="0" y="0" width="130" height="190" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="130" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="65" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">1. Storage (NVMe)</text>
    
    <text x="10" y="42" font-size="9.5" font-weight="700" fill="#111827">Dataset Contract</text>
    <text x="10" y="56" font-size="8.5" font-family="monospace" fill="#4B5563">__len__() → N</text>
    <text x="10" y="70" font-size="8.5" font-family="monospace" fill="#4B5563">__getitem__(i)</text>

    <!-- Visual Sample Slots -->
    <g transform="translate(10, 82)">
      <rect x="0" y="0" width="110" height="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8" />
      <text x="6" y="12" font-size="8" font-family="monospace" fill="#6B7280">sample_0001.bin</text>
      
      <rect x="0" y="19" width="110" height="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8" />
      <text x="6" y="31" font-size="8" font-family="monospace" fill="#6B7280">sample_0002.bin</text>
      
      <rect x="0" y="38" width="110" height="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8" />
      <text x="6" y="50" font-size="8" font-family="monospace" fill="#6B7280">sample_0003.bin</text>
    </g>

    <!-- Sampler permutation tag -->
    <rect x="8" y="148" width="114" height="32" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2,2" rx="2" />
    <text x="65" y="161" font-size="8" font-weight="700" fill="#374151" text-anchor="middle">BatchSampler (i.i.d.)</text>
    <text x="65" y="173" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280" text-anchor="middle">π ~ S_N (Random Shuffle)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 160 152 L 192 152" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="176" y="142" font-size="7.5" font-family="monospace" fill="#4B5563" text-anchor="middle">indices</text>

  <!-- 2. Multiprocess Worker Pool -->
  <g transform="translate(198, 58)">
    <rect x="0" y="0" width="150" height="190" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="150" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="75" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">2. Worker Pool (N=4)</text>

    <!-- Worker Sub-boxes -->
    <g transform="translate(10, 32)">
      <rect x="0" y="0" width="130" height="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9" rx="2" />
      <text x="6" y="15" font-size="8.5" font-family="monospace" font-weight="700" fill="#1E293B">Worker 0:</text>
      <text x="64" y="15" font-size="8" fill="#4B5563">Decode &amp; Augment</text>

      <rect x="0" y="27" width="130" height="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9" rx="2" />
      <text x="6" y="42" font-size="8.5" font-family="monospace" font-weight="700" fill="#1E293B">Worker 1:</text>
      <text x="64" y="42" font-size="8" fill="#4B5563">Decode &amp; Augment</text>

      <rect x="0" y="54" width="130" height="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9" rx="2" />
      <text x="6" y="69" font-size="8.5" font-family="monospace" font-weight="700" fill="#1E293B">Worker 2:</text>
      <text x="64" y="69" font-size="8" fill="#4B5563">Decode &amp; Augment</text>

      <rect x="0" y="81" width="130" height="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9" rx="2" />
      <text x="6" y="96" font-size="8.5" font-family="monospace" font-weight="700" fill="#1E293B">Worker 3:</text>
      <text x="64" y="96" font-size="8" fill="#4B5563">Decode &amp; Augment</text>
    </g>

    <!-- Collation block -->
    <rect x="10" y="144" width="130" height="36" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" rx="2" />
    <text x="75" y="158" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">collate_fn([s_1..s_B])</text>
    <text x="75" y="172" font-size="8" font-family="monospace" fill="#2563EB" text-anchor="middle">Stack → Tensor [B, ...]</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 348 152 L 382 152" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="365" y="142" font-size="7.5" font-family="monospace" fill="#4B5563" text-anchor="middle">batches</text>

  <!-- 3. IPC Shared Memory Queue -->
  <g transform="translate(388, 58)">
    <rect x="0" y="0" width="145" height="190" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="145" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="72" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">3. IPC Queue (shm)</text>

    <!-- Queue FIFO slots -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="121" height="25" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9" rx="2" />
      <text x="60" y="16" font-size="8.5" font-family="monospace" fill="#1E293B" text-anchor="middle">Batch t+2 (Ready)</text>

      <rect x="0" y="30" width="121" height="25" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9" rx="2" />
      <text x="60" y="46" font-size="8.5" font-family="monospace" fill="#1E293B" text-anchor="middle">Batch t+1 (Ready)</text>

      <rect x="0" y="60" width="121" height="25" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" rx="2" />
      <text x="60" y="76" font-size="8.5" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">Batch t (Popped)</text>
    </g>

    <!-- IPC Semantics -->
    <rect x="10" y="132" width="125" height="48" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8" rx="2" />
    <text x="72" y="146" font-size="8" font-weight="700" fill="#374151" text-anchor="middle">POSIX Shared Memory</text>
    <text x="72" y="159" font-size="7.5" fill="#6B7280" text-anchor="middle">Zero-copy FD passing</text>
    <text x="72" y="171" font-size="7.5" fill="#6B7280" text-anchor="middle">Producer-Consumer sync</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 533 152 L 567 152" stroke="#111827" stroke-width="1.3" marker-end="url(#arrow)" />
  <text x="550" y="142" font-size="7.5" font-family="monospace" fill="#4B5563" text-anchor="middle">pin()</text>

  <!-- 4. Pinned Host Memory (Highlighted Spot Block) -->
  <g transform="translate(573, 58)">
    <rect x="0" y="0" width="155" height="190" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
    <rect x="0" y="0" width="155" height="24" fill="#FFEDD5" stroke="#C85A17" stroke-width="1.2" rx="2" />
    <text x="77" y="16" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">4. Page-Locked DRAM</text>

    <text x="12" y="42" font-size="9" font-weight="700" fill="#9A3412">pin_memory=True</text>
    <text x="12" y="56" font-size="8" font-family="monospace" fill="#7C2D12">mlock() OS Syscall</text>

    <!-- Physical page representation -->
    <g transform="translate(10, 66)">
      <rect x="0" y="0" width="135" height="20" fill="#FFFFFF" stroke="#F97316" stroke-width="0.9" rx="1" />
      <text x="67" y="13" font-size="8" font-family="monospace" fill="#9A3412" text-anchor="middle">Physical Page: 0x4A00</text>

      <rect x="0" y="24" width="135" height="20" fill="#FFFFFF" stroke="#F97316" stroke-width="0.9" rx="1" />
      <text x="67" y="37" font-size="8" font-family="monospace" fill="#9A3412" text-anchor="middle">Physical Page: 0x4A40</text>
    </g>

    <!-- Key benefit callout -->
    <rect x="10" y="122" width="135" height="58" fill="#FFFFFF" stroke="#EA580C" stroke-width="0.8" rx="2" />
    <text x="77" y="136" font-size="8" font-weight="700" fill="#9A3412" text-anchor="middle">Direct Hardware Access</text>
    <text x="77" y="149" font-size="7.5" fill="#7C2D12" text-anchor="middle">Pages locked against swap.</text>
    <text x="77" y="161" font-size="7.5" fill="#7C2D12" text-anchor="middle">GPU DMA engine reads</text>
    <text x="77" y="173" font-size="7.5" fill="#7C2D12" text-anchor="middle">host physical RAM directly.</text>
  </g>

  <!-- Arrow 4 -> 5 (PCIe DMA Highlighted) -->
  <path d="M 728 152 L 762 152" stroke="#C85A17" stroke-width="1.8" marker-end="url(#arrowOrange)" />
  <text x="745" y="138" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">PCIe DMA</text>
  <text x="745" y="166" font-size="7" font-family="monospace" fill="#9A3412" text-anchor="middle">64 GB/s</text>

  <!-- 5. GPU VRAM & Compute -->
  <g transform="translate(768, 58)">
    <rect x="0" y="0" width="142" height="190" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="142" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="71" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">5. GPU Device (HBM)</text>

    <text x="8" y="42" font-size="8.5" font-family="monospace" font-weight="700" fill="#111827">batch.to('cuda',</text>
    <text x="18" y="54" font-size="8.5" font-family="monospace" font-weight="700" fill="#C85A17">non_blocking=True)</text>

    <!-- GPU Tensor Memory -->
    <g transform="translate(8, 64)">
      <rect x="0" y="0" width="126" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9" rx="2" />
      <text x="63" y="16" font-size="8" font-weight="700" fill="#1E293B" text-anchor="middle">Batch Tensor in VRAM</text>
      <text x="63" y="32" font-size="7.5" font-family="monospace" fill="#6B7280" text-anchor="middle">[B, C, H, W] FP32</text>
    </g>

    <!-- Compute ALUs -->
    <rect x="8" y="116" width="126" height="64" fill="#F0FDF4" stroke="#16A34A" stroke-width="1" rx="2" />
    <text x="63" y="132" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">Saturated ALUs</text>
    <text x="63" y="146" font-size="7.5" fill="#166534" text-anchor="middle">Forward &amp; Backward Pass</text>
    <text x="63" y="160" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">100% Compute Duty</text>
    <text x="63" y="172" font-size="7" fill="#166534" text-anchor="middle">(Zero I/O stall cycles)</text>
  </g>

  <!-- ==================== MIDDLE: TIMELINE COMPARISON ==================== -->
  
  <!-- Left Timeline: Synchronous I/O Starvation -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="415" height="98" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="12" y="18" font-size="10" font-weight="700" fill="#991B1B">Synchronous Execution (Single-Worker, Unpinned)</text>
    <text x="402" y="18" font-size="9" font-weight="700" fill="#DC2626" text-anchor="end">GPU Utilization: ~2.0%</text>

    <!-- Timeline 1 Bar -->
    <g transform="translate(12, 28)">
      <!-- Step 0 -->
      <rect x="0" y="0" width="155" height="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8" />
      <text x="77" y="13" font-size="7.5" font-family="monospace" fill="#991B1B" text-anchor="middle">Disk Read: 10.0 ms</text>

      <rect x="155" y="0" width="22" height="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.8" />
      <text x="166" y="13" font-size="7" font-family="monospace" fill="#1E40AF" text-anchor="middle">ALU</text>

      <!-- Step 1 -->
      <rect x="182" y="0" width="155" height="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8" />
      <text x="259" y="13" font-size="7.5" font-family="monospace" fill="#991B1B" text-anchor="middle">Disk Read: 10.0 ms</text>

      <rect x="337" y="0" width="22" height="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.8" />
      <text x="348" y="13" font-size="7" font-family="monospace" fill="#1E40AF" text-anchor="middle">ALU</text>

      <!-- Stall label -->
      <path d="M 0 25 L 155 25" stroke="#DC2626" stroke-width="1" />
      <text x="77" y="37" font-size="7.5" fill="#991B1B" text-anchor="middle">ALU sitting IDLE 98% of total time</text>

      <text x="0" y="58" font-size="8" fill="#4B5563">Total Step Time = 10.21 ms  |  Compute Time = 0.21 ms</text>
    </g>
  </g>

  <!-- Right Timeline: Asynchronous Prefetching Overlap -->
  <g transform="translate(460, 260)">
    <rect x="0" y="0" width="450" height="98" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="12" y="18" font-size="10" font-weight="700" fill="#15803D">Asynchronous Prefetching (Multi-Worker + Pinned DMA)</text>
    <text x="438" y="18" font-size="9" font-weight="700" fill="#16A34A" text-anchor="end">GPU Utilization: 100%</text>

    <!-- Overlapped Timeline Bar -->
    <g transform="translate(12, 28)">
      <!-- Row 1: Worker I/O -->
      <text x="0" y="12" font-size="7.5" font-weight="600" fill="#4B5563">CPU I/O:</text>
      <rect x="72" y="0" width="105" height="16" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" />
      <text x="124" y="11" font-size="7" font-family="monospace" fill="#92400E" text-anchor="middle">Prefetch Batch 1</text>

      <rect x="182" y="0" width="105" height="16" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" />
      <text x="234" y="11" font-size="7" font-family="monospace" fill="#92400E" text-anchor="middle">Prefetch Batch 2</text>

      <rect x="292" y="0" width="105" height="16" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" />
      <text x="344" y="11" font-size="7" font-family="monospace" fill="#92400E" text-anchor="middle">Prefetch Batch 3</text>

      <!-- Row 2: GPU Compute -->
      <text x="0" y="32" font-size="7.5" font-weight="600" fill="#4B5563">GPU Compute:</text>
      <rect x="72" y="20" width="105" height="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8" />
      <text x="124" y="31" font-size="7" font-family="monospace" font-weight="700" fill="#15803D" text-anchor="middle">Step Batch 0</text>

      <rect x="182" y="20" width="105" height="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8" />
      <text x="234" y="31" font-size="7" font-family="monospace" font-weight="700" fill="#15803D" text-anchor="middle">Step Batch 1</text>

      <rect x="292" y="20" width="105" height="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8" />
      <text x="344" y="31" font-size="7" font-family="monospace" font-weight="700" fill="#15803D" text-anchor="middle">Step Batch 2</text>

      <text x="0" y="58" font-size="8" fill="#4B5563">I/O latency hidden entirely behind concurrent compute passes.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INVARIANT CALLOUT ==================== -->
  <g transform="translate(30, 372)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Systems Invariant: Page-Locked Host DRAM vs. OS Pageable Bounce Buffers</text>
    <text x="0" y="36" font-size="9.5" fill="#374151">
      Standard pageable DRAM can be relocated by the OS virtual memory manager at any moment, forcing the CPU to perform an extra copy into an intermediate bounce buffer before initiating transfer.
    </text>
    <text x="0" y="52" font-size="9.5" fill="#374151">
      Specifying <tspan font-family="monospace" font-weight="600" fill="#C85A17">pin_memory=True</tspan> locks virtual pages into physical RAM via <tspan font-family="monospace" font-weight="600" fill="#111827">mlock()</tspan>, enabling the GPU PCIe DMA controller to stream batches directly from host DRAM to VRAM in a single asynchronous pass.
    </text>
    <text x="0" y="68" font-size="9" fill="#6B7280">
      Combined with <tspan font-family="monospace" fill="#111827">non_blocking=True</tspan>, host-to-device transfers execute concurrently on a dedicated CUDA copy engine without blocking the compute stream.
    </text>
  </g>
</svg>