<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="370" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827" /></marker></defs>
<rect x="30" y="30" width="270" height="90" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="42" y="52" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Dataset interface</text>
<text x="42" y="71" text-anchor="start" font-size="11" font-weight="400" fill="#111827">__len__(): sample count</text>
<text x="42" y="90" text-anchor="start" font-size="11" font-weight="400" fill="#111827">__getitem__(index): one sample</text>
<rect x="350" y="30" width="300" height="90" rx="3" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
<text x="362" y="52" text-anchor="start" font-size="11" font-weight="700" fill="#111827">TensorDataset</text>
<text x="362" y="71" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Matching leading tensor dimensions</text>
<text x="362" y="90" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Retrieve corresponding sample entries</text>
<path d="M300 75 H350" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<rect x="30" y="180" width="180" height="100" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="42" y="202" text-anchor="start" font-size="11" font-weight="700" fill="#111827">DataLoader</text>
<text x="42" y="221" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Choose index order</text>
<text x="42" y="240" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Optional shuffle</text>
<text x="42" y="259" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Select batch indices</text>
<rect x="245" y="180" width="180" height="100" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="257" y="202" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Iterator</text>
<text x="257" y="221" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Fetch selected samples</text>
<text x="257" y="240" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Stack batch tensors</text>
<rect x="460" y="180" width="190" height="100" rx="3" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
<text x="472" y="202" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Training loop</text>
<text x="472" y="221" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Receive Tensor batches</text>
<text x="472" y="240" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Compute loss and update</text>
<path d="M500 120 V145 H120 V180" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<path d="M210 230 H245" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<path d="M425 230 H460" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<path d="M30 308 H650" stroke="#D1D5DB" stroke-width="1" />
<text x="30" y="325" text-anchor="start" font-size="10" font-weight="400" fill="#4B5563">This implementation iterates synchronously on CPU using NumPy-backed tensors.</text>
<text x="30" y="343" text-anchor="start" font-size="10" font-weight="400" fill="#4B5563">A final batch may contain fewer samples; pinned memory and worker pools are not implemented.</text>
</svg>
