<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">The Williams Roofline Model: Arithmetic Intensity &amp; Hardware Ceilings</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== PLOT COORDINATE SYSTEM ==================== -->
  <!-- Origin: (120, 340), X-span: 640px (from 0.1 to 100 FLOPs/Byte), Y-span: 240px (from 0.01 to 10 TFLOPs/s) -->
  <g transform="translate(120, 80)">

    <!-- Shaded Regimes -->
    <!-- Memory-Bound Polygon: (0, 260) -> (280, 50) -> (280, 260) -->
    <polygon points="0,260 280,50 280,260" fill="#FFF7ED" opacity="0.7" />
    <text x="110" y="210" font-size="12" font-weight="700" fill="#C85A17">Memory-Bound</text>
    <text x="110" y="226" font-size="10.5" fill="#9A3412">Attainable = I × BW</text>

    <!-- Compute-Bound Polygon: (280, 50) -> (640, 50) -> (640, 260) -> (280, 260) -->
    <polygon points="280,50 640,50 640,260 280,260" fill="#F3F4F6" opacity="0.8" />
    <text x="420" y="210" font-size="12" font-weight="700" fill="#374151">Compute-Bound</text>
    <text x="420" y="226" font-size="10.5" fill="#4B5563">Attainable = Peak FLOP/s</text>

    <!-- Background Grid Lines (Logarithmic) -->
    <!-- Horizontal decades -->
    <line x1="0" y1="260" x2="640" y2="260" stroke="#E5E7EB" stroke-width="1" />
    <line x1="0" y1="180" x2="640" y2="180" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="0" y1="100" x2="640" y2="100" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="0" y1="20" x2="640" y2="20" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Vertical decades: 0.1 (0), 1.0 (213), 10.0 (427), 100.0 (640) -->
    <line x1="213" y1="0" x2="213" y2="260" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="427" y1="0" x2="427" y2="260" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Ridge Point Drop Line -->
    <line x1="280" y1="50" x2="280" y2="260" stroke="#111827" stroke-width="1.2" stroke-dasharray="4,4" />
    <text x="280" y="278" font-size="10.5" font-weight="700" fill="#111827" text-anchor="middle">I_ridge = 2.5 FLOPs/B</text>

    <!-- Axes -->
    <line x1="0" y1="260" x2="660" y2="260" stroke="#111827" stroke-width="1.5" marker-end="url(#axisArrow)" />
    <line x1="0" y1="260" x2="0" y2="-15" stroke="#111827" stroke-width="1.5" marker-end="url(#axisArrow)" />

    <!-- Y-Axis Labels -->
    <text x="-12" y="264" font-size="10.5" fill="#4B5563" text-anchor="end">0.01</text>
    <text x="-12" y="184" font-size="10.5" fill="#4B5563" text-anchor="end">0.1</text>
    <text x="-12" y="104" font-size="10.5" fill="#4B5563" text-anchor="end">1.0</text>
    <text x="-12" y="24" font-size="10.5" fill="#4B5563" text-anchor="end">10.0</text>
    <text x="-45" y="130" font-size="12" font-weight="700" fill="#111827" text-anchor="middle" transform="rotate(-90, -45, 130)">Performance (TFLOP/s)</text>

    <!-- X-Axis Labels -->
    <text x="0" y="278" font-size="10.5" fill="#4B5563" text-anchor="middle">0.1</text>
    <text x="213" y="278" font-size="10.5" fill="#4B5563" text-anchor="middle">1.0</text>
    <text x="427" y="278" font-size="10.5" fill="#4B5563" text-anchor="middle">10.0</text>
    <text x="640" y="278" font-size="10.5" fill="#4B5563" text-anchor="middle">100.0</text>
    <text x="320" y="305" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Operational / Arithmetic Intensity (FLOPs / Byte)</text>

    <!-- The Roofline Curve -->
    <!-- Diagonal Memory Ceiling (Slope = Peak Bandwidth) -->
    <line x1="0" y1="260" x2="280" y2="50" stroke="#C85A17" stroke-width="2.5" />
    <text x="110" y="145" font-size="11" font-weight="700" fill="#C85A17" transform="rotate(-36.8, 110, 145)">Peak Bandwidth (200 GB/s)</text>

    <!-- Horizontal Compute Plateau -->
    <line x1="280" y1="50" x2="640" y2="50" stroke="#111827" stroke-width="2.5" />
    <text x="460" y="38" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Peak Compute Horizon (1.0 TFLOP/s)</text>

    <!-- Ridge Point Dot -->
    <circle cx="280" cy="50" r="4.5" fill="#C85A17" stroke="#111827" stroke-width="1.5" />
    <text x="280" y="38" font-size="11" font-weight="700" fill="#C85A17" text-anchor="middle">Ridge Point</text>

    <!-- Benchmark Data Points -->
    <!-- Point 1: GELU (I = 0.25 FLOPs/B, P = 0.025 TFLOPs) -> x = 85, y = 196 -->
    <circle cx="85" cy="196" r="4" fill="#C85A17" stroke="#FFFFFF" stroke-width="1" />
    <text x="95" y="200" font-size="10.5" font-weight="700" fill="#111827">GELU (0.25)</text>

    <!-- Point 2: Softmax / Attention (I = 0.8 FLOPs/B, P = 0.08 TFLOPs) -> x = 190, y = 118 -->
    <circle cx="190" cy="118" r="4" fill="#C85A17" stroke="#FFFFFF" stroke-width="1" />
    <text x="200" y="122" font-size="10.5" font-weight="700" fill="#111827">Attention (0.8)</text>

    <!-- Point 3: MatMul / GEMM (I = 32.0 FLOPs/B, P = 1.0 TFLOPs) -> x = 520, y = 50 -->
    <circle cx="520" cy="50" r="4" fill="#111827" stroke="#FFFFFF" stroke-width="1" />
    <text x="520" y="70" font-size="10.5" font-weight="700" fill="#111827" text-anchor="middle">Dense GEMM (32.0)</text>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 400)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Operations with intensity below I_ridge (e.g., activations, attention) are bound strictly by DRAM bandwidth; doubling compute ALUs delivers 0× speedup.
    </text>
  </g>
</svg>
