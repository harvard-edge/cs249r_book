<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">The 16× Cumulative Acceleration Stack: Compounding Multipliers Across Systems Tiers</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== LEFT PANEL: SPEEDUP WATERFALL STACK ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="490" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="490" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="490" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Orthogonal Systems Waterfall (Decode Latency ms/token)</text>
    <text x="476" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">16.38× Total Leap</text>

    <!-- Waterfall Rows -->
    <g transform="translate(14, 38)">
      <!-- Stage 0 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="462" height="32" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
        <text x="10" y="20" font-size="9.5" font-weight="700" fill="#111827">Stage 0: Baseline TinyGPT (FP32)</text>
        <rect x="225" y="6" width="130" height="20" rx="2" fill="#111827" />
        <text x="290" y="20" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">100.0 ms</text>
        <rect x="365" y="6" width="88" height="20" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
        <text x="409" y="20" font-size="8.5" font-weight="700" fill="#4B5563" text-anchor="middle">1.0× Baseline</text>
      </g>

      <!-- Stage 1 -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="462" height="32" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
        <text x="10" y="20" font-size="9.5" font-weight="700" fill="#111827">Stage 1: + INT8 Quantization</text>
        <rect x="225" y="6" width="65" height="20" rx="2" fill="#4B5563" />
        <text x="257" y="20" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">50.0 ms</text>
        <rect x="365" y="6" width="88" height="20" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
        <text x="409" y="20" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">2.0× Multiplier</text>
      </g>

      <!-- Stage 2 -->
      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="462" height="32" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
        <text x="10" y="20" font-size="9.5" font-weight="700" fill="#111827">Stage 2: + Structured SVD Pruning</text>
        <rect x="225" y="6" width="43" height="20" rx="2" fill="#4B5563" />
        <text x="246" y="20" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">33.3 ms</text>
        <rect x="365" y="6" width="88" height="20" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
        <text x="409" y="20" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">3.0× Multiplier</text>
      </g>

      <!-- Stage 3 -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="462" height="32" rx="3" fill="#F9FAFB" stroke="#E5E7EB" />
        <text x="10" y="20" font-size="9.5" font-weight="700" fill="#111827">Stage 3: + Fused Kernels &amp; Tiling</text>
        <rect x="225" y="6" width="33" height="20" rx="2" fill="#EA580C" />
        <text x="241" y="20" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">25.6 ms</text>
        <rect x="365" y="6" width="88" height="20" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
        <text x="409" y="20" font-size="8.5" font-weight="700" fill="#111827" text-anchor="middle">3.9× Multiplier</text>
      </g>

      <!-- Stage 4 -->
      <g transform="translate(0, 152)">
        <rect x="0" y="0" width="462" height="32" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
        <text x="10" y="20" font-size="9.5" font-weight="700" fill="#9A3412">Stage 4: + Pre-Allocated KV Cache</text>
        <rect x="225" y="6" width="16" height="20" rx="2" fill="#C85A17" />
        <text x="250" y="20" font-size="8.5" font-weight="700" fill="#C85A17">6.1 ms</text>
        <rect x="365" y="6" width="88" height="20" rx="2" fill="#C85A17" />
        <text x="409" y="20" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">16.38× LEAP</text>
      </g>
    </g>

    <!-- Multiplier Formula Box -->
    <g transform="translate(14, 236)">
      <rect x="0" y="0" width="462" height="42" rx="3" fill="#111827" />
      <text x="231" y="18" font-size="9.5" font-weight="700" fill="#FFF7ED" text-anchor="middle">2.0× (INT8) × 1.5× (SVD) × 1.3× (Fusion) × 4.2× (KV Cache)</text>
      <text x="231" y="32" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">= 16.38× TOTAL END-TO-END ACCELERATION</text>
    </g>

    <!-- Takeaway footnote -->
    <g transform="translate(14, 290)">
      <text x="0" y="10" font-size="8.5" fill="#4B5563">• Each optimization targets a disjoint bottleneck: Bitwidth × Matrix Rank × DRAM Traffic × FLOPs.</text>
      <text x="0" y="24" font-size="8.5" font-weight="700" fill="#111827">• Multiplicative gains compose cleanly because no two techniques compete for the same resource.</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: AMDAHL'S LAW CEILING ==================== -->
  <g transform="translate(545, 56)">
    <rect x="0" y="0" width="295" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="295" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="295" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Amdahl's Law vs. Full Stack</text>

    <!-- Isolated Optimization Trap -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="267" height="114" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#9A3412">The Single-Kernel Optimization Trap:</text>
      
      <text x="10" y="34" font-size="8.5" fill="#4B5563">• Speed up only GEMM by 10×</text>
      <text x="10" y="48" font-size="8.5" fill="#4B5563">• GEMM is 60% of total runtime (f = 0.60):</text>
      
      <rect x="10" y="58" width="247" height="22" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
      <text x="133" y="73" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#C85A17" text-anchor="middle">S_total = 1 / ( 0.40 + 0.60/10 ) = 2.17×</text>
      
      <text x="10" y="96" font-size="8" font-weight="700" fill="#C85A17">• Unoptimized 40% (softmax, layernorm, I/O)</text>
      <text x="10" y="108" font-size="8" font-weight="700" fill="#C85A17">  caps the theoretical ceiling at 2.5×</text>
    </g>

    <!-- Full Stack Solution -->
    <g transform="translate(14, 162)">
      <rect x="0" y="0" width="267" height="152" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">The Full-Stack Systems Solution:</text>
      
      <text x="10" y="38" font-size="8.5" font-weight="700" fill="#111827">1. Precision Tier: <tspan font-weight="400" fill="#4B5563">Cuts memory bus pressure 4×.</tspan></text>
      <text x="10" y="54" font-size="8.5" font-weight="700" fill="#111827">2. Geometry Tier: <tspan font-weight="400" fill="#4B5563">Cuts matrix parameter count.</tspan></text>
      <text x="10" y="70" font-size="8.5" font-weight="700" fill="#111827">3. Kernel Tier: <tspan font-weight="400" fill="#4B5563">Eliminates DRAM roundtrips.</tspan></text>
      <text x="10" y="86" font-size="8.5" font-weight="700" fill="#111827">4. Algorithm Tier: <tspan font-weight="400" fill="#4B5563">Eliminates quadratic recomputes.</tspan></text>

      <line x1="10" y1="100" x2="257" y2="100" stroke="#E5E7EB" stroke-width="1" />
      <rect x="10" y="108" width="247" height="34" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="133" y="122" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">Compounding Acceleration</text>
      <text x="133" y="134" font-size="8" fill="#C85A17" text-anchor="middle">Every fraction f is reduced simultaneously</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Amdahl's Law severely caps single-operator speedups.
      <tspan x="0" dy="16">True 16× acceleration requires a full-stack methodology that compounds orthogonal optimizations across numerical precision, matrix geometry, kernel fusion, and memoization.</tspan>
    </text>
  </g>
</svg>
