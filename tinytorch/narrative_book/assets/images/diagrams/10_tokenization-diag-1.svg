<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title / Section Label -->
  <text x="30" y="30" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Byte-Pair Encoding (BPE): Subword Compression Tree &amp; Runtime Pipeline</text>
  <line x1="30" y1="40" x2="850" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== PANEL 1: REPRESENTATION TRADEOFFS ==================== -->
  <g transform="translate(30, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">1. Representation Tradeoffs</text>

    <!-- Spectrum Comparison Blocks -->
    <g transform="translate(0, 26)">
      <!-- Char/Byte Level -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="225" height="32" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="8" y="13" font-size="8.5" font-weight="700" fill="#111827">Byte / Char-Level (V = 256)</text>
        <text x="8" y="25" font-size="7.5" fill="#4B5563">• 10× sequence bloat → O(S²) Attention explosion</text>
      </g>

      <!-- Word Level -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="225" height="32" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="8" y="13" font-size="8.5" font-weight="700" fill="#111827">Word-Level (V = 500k+)</text>
        <text x="8" y="25" font-size="7.5" fill="#4B5563">• Massive table; fails on unseen &lt;UNK&gt; words</text>
      </g>

      <!-- Subword BPE (Active) -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="225" height="34" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="8" y="14" font-size="8.5" font-weight="700" fill="#C85A17">Subword BPE (V = 50,257)</text>
        <text x="8" y="26" font-size="7.5" font-weight="600" fill="#9A3412">• Bounded sequence length &amp; 0% OOV error</text>
      </g>
    </g>

    <!-- Initial Corpus Byte Sequences -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="225" height="92" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="14" font-size="9" font-weight="700" fill="#111827">Corpus Byte Splits (Training):</text>
      
      <text x="8" y="30" font-size="8" font-family="monospace" fill="#111827">"low"   (×5): ['l', 'o', 'w', '_']</text>
      <text x="8" y="46" font-size="8" font-family="monospace" fill="#111827">"lower" (×2): ['l', 'o', 'w', 'e', 'r']</text>
      <text x="8" y="62" font-size="8" font-family="monospace" fill="#C85A17" font-weight="700">"newest"(×6): ['n','e','w','e','s','t']</text>
      <text x="8" y="78" font-size="8" font-family="monospace" fill="#111827">"widest"(×3): ['w','i','d','e','s','t']</text>
    </g>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <g transform="translate(260, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 2: PAIR STATISTICS & MERGE TREE DAG ==================== -->
  <g transform="translate(280, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">2. Pair Statistics &amp; Merge Tree DAG</text>

    <!-- Top Frequency Statistics Table -->
    <g transform="translate(0, 26)">
      <!-- Table Header -->
      <rect x="0" y="0" width="250" height="18" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="1" />
      <text x="8" y="12" font-size="8" font-weight="700" fill="#111827">Pair</text>
      <text x="70" y="12" font-size="8" font-weight="700" fill="#111827">Count</text>
      <text x="120" y="12" font-size="8" font-weight="700" fill="#111827">Merge Action</text>
      <text x="210" y="12" font-size="8" font-weight="700" fill="#111827">Rank</text>

      <!-- Row 0 (Top rank - Highlighted) -->
      <rect x="0" y="20" width="250" height="18" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="1" />
      <text x="8" y="32" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17">('e', 's')</text>
      <text x="78" y="32" font-size="8" font-family="monospace" font-weight="700" fill="#111827">9</text>
      <text x="120" y="32" font-size="8" font-weight="700" fill="#C85A17">Merge → 'es'</text>
      <text x="215" y="32" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17">#0</text>

      <!-- Row 1 -->
      <rect x="0" y="40" width="250" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
      <text x="8" y="52" font-size="8" font-family="monospace" fill="#111827">('es', 't')</text>
      <text x="78" y="52" font-size="8" font-family="monospace" fill="#111827">9</text>
      <text x="120" y="52" font-size="8" fill="#4B5563">Merge → 'est'</text>
      <text x="215" y="52" font-size="8" font-family="monospace" fill="#4B5563">#1</text>

      <!-- Row 2 -->
      <rect x="0" y="60" width="250" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
      <text x="8" y="72" font-size="8" font-family="monospace" fill="#111827">('l', 'o')</text>
      <text x="78" y="72" font-size="8" font-family="monospace" fill="#111827">7</text>
      <text x="120" y="72" font-size="8" fill="#4B5563">Merge → 'lo'</text>
      <text x="215" y="72" font-size="8" font-family="monospace" fill="#4B5563">#2</text>
    </g>

    <!-- Hierarchical Subword Merge Tree DAG -->
    <g transform="translate(0, 114)">
      <text x="0" y="12" font-size="9" font-weight="700" fill="#111827">Hierarchical Merge Tree DAG:</text>

      <g transform="translate(10, 20)">
        <!-- Root node 'est' -->
        <rect x="135" y="0" width="34" height="18" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="152" y="12" font-size="8" font-family="monospace" font-weight="700" fill="#111827" text-anchor="middle">'est'</text>

        <!-- Sub-node 'new' -->
        <rect x="18" y="26" width="32" height="18" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="34" y="38" font-size="8" font-family="monospace" font-weight="700" fill="#111827" text-anchor="middle">'new'</text>

        <!-- Sub-node 'es' (Highlight) -->
        <rect x="110" y="26" width="32" height="18" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="126" y="38" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">'es'</text>

        <!-- DAG Lines -->
        <!-- 'est' -> 'es' and 't' -->
        <path d="M 143 18 L 126 26" stroke="#111827" stroke-width="1.2" />
        <path d="M 160 18 L 182 54" stroke="#111827" stroke-width="1.2" />
        <!-- 'es' -> 'e' and 's' -->
        <path d="M 118 44 L 110 54" stroke="#C85A17" stroke-width="1.5" />
        <path d="M 134 44 L 142 54" stroke="#C85A17" stroke-width="1.5" />
        <!-- 'new' -> 'n', 'e', 'w' -->
        <path d="M 24 44 L 14 54" stroke="#111827" stroke-width="1.0" />
        <path d="M 34 44 L 44 54" stroke="#111827" stroke-width="1.0" />
        <path d="M 44 44 L 74 54" stroke="#111827" stroke-width="1.0" />

        <!-- Leaf Base Byte Characters -->
        <g transform="translate(0, 54)">
          <rect x="2" y="0" width="22" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
          <text x="13" y="12" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">n</text>

          <rect x="32" y="0" width="22" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
          <text x="43" y="12" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">e</text>

          <rect x="62" y="0" width="22" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
          <text x="73" y="12" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">w</text>

          <rect x="98" y="0" width="22" height="18" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="1" />
          <text x="109" y="12" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">e</text>

          <rect x="130" y="0" width="22" height="18" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="1" />
          <text x="141" y="12" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">s</text>

          <rect x="170" y="0" width="22" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
          <text x="181" y="12" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">t</text>

          <rect x="200" y="0" width="22" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="1" />
          <text x="211" y="12" font-size="8" font-family="monospace" fill="#111827" text-anchor="middle">_</text>
        </g>

        <!-- Resulting Subwords Tag -->
        <g transform="translate(0, 80)">
          <rect x="2" y="0" width="220" height="18" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
          <text x="110" y="12" font-size="7.5" font-family="monospace" fill="#4B5563" text-anchor="middle">Resulting Subwords: ['new', 'est', '_']</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <g transform="translate(540, 140)">
    <path d="M 0 0 L 15 0" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  </g>

  <!-- ==================== PANEL 3: RUNTIME TOKENIZATION PIPELINE ==================== -->
  <g transform="translate(565, 54)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#111827">3. Runtime Tokenization Pipeline</text>

    <!-- Execution Flow -->
    <g transform="translate(0, 26)">
      <!-- Input String -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="260" height="22" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
        <text x="8" y="14" font-size="8" font-weight="700" fill="#111827">Input String: <tspan font-family="monospace" fill="#C85A17">"newest lower"</tspan></text>
      </g>

      <path d="M 130 22 L 130 30" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Step 1: Byte Split -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="260" height="22" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
        <text x="8" y="14" font-size="7.5" font-family="monospace" fill="#4B5563">Byte split: ['n','e','w','e','s','t',' ','l','o','w','e','r']</text>
      </g>

      <path d="M 130 54 L 130 62" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Step 2: Merge Rank Application -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="260" height="24" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" rx="2" />
        <text x="8" y="15" font-size="8" font-family="monospace" font-weight="700" fill="#C85A17">Subwords: ['new', 'est', 'Ġ', 'low', 'er']</text>
      </g>

      <path d="M 130 88 L 130 96" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />

      <!-- Step 3: Token IDs -->
      <g transform="translate(0, 98)">
        <rect x="0" y="0" width="260" height="24" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
        <text x="8" y="15" font-size="8" font-family="monospace" font-weight="700" fill="#9A3412">Token IDs: [1045, 891, 220, 412, 389]</text>
      </g>
    </g>

    <!-- Byte Fallback Invariant Card -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="260" height="74" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.0" rx="2" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#111827">256 Base Byte Fallback Guarantee:</text>
      <text x="8" y="29" font-size="8.5" fill="#4B5563">• 256 base byte tokens catch any unknown symbol</text>
      <text x="8" y="42" font-size="8.5" fill="#4B5563">• Exactly 0% &lt;UNK&gt; tokens in vocabulary</text>
      <text x="8" y="55" font-size="8.5" fill="#4B5563">• Clean integer stream directly into Embeddings</text>
      <text x="8" y="68" font-size="8.5" font-weight="600" fill="#C85A17">→ Universal UTF-8 Robustness</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS & HARDWARE NOTES ==================== -->
  <g transform="translate(30, 310)">
    <line x1="0" y1="0" x2="820" y2="0" stroke="#E5E7EB" stroke-width="1.0" />
    <text x="0" y="18" font-size="11" font-weight="700" fill="#111827">Information-Theoretic Invariant:</text>
    <text x="185" y="18" font-size="11" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">
      V_BPE = Σ_base ∪ { merge_0, merge_1, …, merge_(K-1) },   |Σ_base| = 256  ⇒  OOV Rate ≡ 0%
    </text>
    <text x="0" y="38" font-size="9.5" fill="#4B5563">
      <tspan font-weight="600" fill="#111827">Compression Balance &amp; Sequence Optimization:</tspan> BPE compresses frequent character sequences into dense single tokens while preserving UTF-8 byte fallbacks,
    </text>
    <text x="0" y="52" font-size="9.5" fill="#4B5563">
      eliminating the O(S²) attention sequence length bloat of pure byte models and the catastrophic out-of-vocabulary failures of static word dictionaries.
    </text>
  </g>
</svg>
