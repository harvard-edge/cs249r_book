<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="340" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8246" /></marker>
  </defs>
  <text x="30" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Forward values</text>
  <rect x="30" y="70" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="120.0" y="103.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">x = 3</text>
  <rect x="240" y="70" width="180" height="60" rx="3" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="330.0" y="95.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Multiply: x × x</text>
  <text x="330.0" y="111.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">y = 9</text>
  <rect x="450" y="70" width="180" height="60" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
  <text x="540.0" y="95.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Add: y + x</text>
  <text x="540.0" y="111.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">L = 12</text>
  <path d="M210,100 H240" fill="none" stroke="#ff8246" stroke-width="1.2" marker-end="url(#orange)" />
  <path d="M420,100 H450" fill="none" stroke="#ff8246" stroke-width="1.2" marker-end="url(#orange)" />
  <path d="M120,70 V50 H540 V70" fill="none" stroke="#ff8246" stroke-width="1.2" marker-end="url(#orange)" />
  <text x="330" y="43" text-anchor="middle" font-size="9.5" font-weight="400" fill="#111827">Direct x input</text>
  <text x="30" y="180" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Backward contributions</text>
  <rect x="30" y="210" width="180" height="60" rx="3" fill="#f4f5f7" stroke="#4b5563" stroke-width="1.2" />
  <text x="120.0" y="235.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Seed at scalar output</text>
  <text x="120.0" y="251.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">dL/dL = 1</text>
  <rect x="240" y="210" width="180" height="60" rx="3" fill="#f4f5f7" stroke="#4b5563" stroke-width="1.2" />
  <text x="330.0" y="235.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Add backward</text>
  <text x="330.0" y="251.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">dL/dy = 1; direct = 1</text>
  <rect x="450" y="210" width="180" height="60" rx="3" fill="#f4f5f7" stroke="#4b5563" stroke-width="1.2" />
  <text x="540.0" y="235.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Multiply backward</text>
  <text x="540.0" y="251.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">3 + 3; total dx = 7</text>
  <path d="M210,240 H240" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#blue)" />
  <path d="M420,240 H450" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#blue)" />
  <path d="M30,290 H650" stroke="#D1D5DB" stroke-width="0.8" />
  <text x="340" y="310" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Backward visits reachable operations in reverse topological order; shared inputs accumulate contributions.</text>
</svg>
