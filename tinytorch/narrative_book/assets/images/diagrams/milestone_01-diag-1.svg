<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="380" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827" /></marker></defs>
<rect x="30" y="30" width="295" height="100" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="42" y="52" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Single affine classifier</text>
<text x="42" y="71" text-anchor="start" font-size="11" font-weight="400" fill="#111827">One straight decision boundary</text>
<text x="42" y="90" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Cannot separate the four XOR points</text>
<rect x="355" y="30" width="295" height="100" rx="3" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
<text x="367" y="52" text-anchor="start" font-size="11" font-weight="700" fill="#111827">One possible hidden representation</text>
<text x="367" y="71" text-anchor="start" font-size="11" font-weight="400" fill="#111827">h₁ = ReLU(x₁ + x₂)</text>
<text x="367" y="90" text-anchor="start" font-size="11" font-weight="400" fill="#111827">h₂ = ReLU(x₁ + x₂ − 1)</text>
<circle cx="75" cy="275" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="87" y="279" text-anchor="start" font-size="11" font-weight="400" fill="#111827">0</text>
<circle cx="175" cy="275" r="7" fill="#ff8246" stroke="#111827" stroke-width="1.2" />
<text x="187" y="279" text-anchor="start" font-size="11" font-weight="400" fill="#111827">1</text>
<circle cx="75" cy="175" r="7" fill="#ff8246" stroke="#111827" stroke-width="1.2" />
<text x="87" y="179" text-anchor="start" font-size="11" font-weight="400" fill="#111827">1</text>
<circle cx="175" cy="175" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="187" y="179" text-anchor="start" font-size="11" font-weight="400" fill="#111827">0</text>
<circle cx="400" cy="275" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="412" y="279" text-anchor="start" font-size="11" font-weight="400" fill="#111827">0</text>
<circle cx="480" cy="275" r="7" fill="#ff8246" stroke="#111827" stroke-width="1.2" />
<text x="492" y="279" text-anchor="start" font-size="11" font-weight="400" fill="#111827">1 (two inputs)</text>
<circle cx="560" cy="195" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="572" y="199" text-anchor="start" font-size="11" font-weight="400" fill="#111827">0</text>
<text x="75" y="310" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Original XOR inputs</text>
<text x="375" y="310" text-anchor="start" font-size="11" font-weight="700" fill="#111827">h₁ − 2h₂ gives the XOR target</text>
<path d="M30 333 H650" stroke="#D1D5DB" stroke-width="1" />
<text x="30" y="350" text-anchor="start" font-size="10" font-weight="400" fill="#4B5563">Filled points have target 1; empty points have target 0. This is a constructed solution.</text>
</svg>
