<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Title & Section Header -->
  <text x="30" y="28" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">Milestone I: The 1958 Single-Layer Perceptron Wall vs. 1986 MLP Manifold Warping</text>
  <line x1="30" y1="38" x2="910" y2="38" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== LEFT: 1958 SINGLE-LAYER PERCEPTRON (FAILS) ==================== -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="425" height="315" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="425" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="212" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">1. 1958 Single-Layer Perceptron (Linear Wall)</text>

    <!-- Architecture flow mini-bar -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="395" height="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
      <text x="10" y="18" font-size="8.5" font-family="monospace" fill="#111827">[x₁, x₂]</text>
      <path d="M 58 14 L 80 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="85" y="4" width="95" height="20" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8" rx="1" />
      <text x="132" y="17" font-size="8" font-family="monospace" fill="#1E293B" text-anchor="middle">Linear(2, 1)</text>
      <path d="M 183 14 L 205 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="210" y="4" width="70" height="20" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8" rx="1" />
      <text x="245" y="17" font-size="8" font-family="monospace" fill="#1E293B" text-anchor="middle">Step(·)</text>
      <path d="M 283 14 L 305 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <text x="315" y="18" font-size="8.5" font-family="monospace" font-weight="700" fill="#DC2626">ŷ ∈ {0, 1} [Fail]</text>
    </g>

    <!-- 2D Coordinate Space Plot -->
    <g transform="translate(15, 68)">
      <rect x="0" y="0" width="220" height="150" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
      
      <!-- Coordinate Axes -->
      <line x1="30" y1="125" x2="195" y2="125" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="30" y1="125" x2="30" y2="15" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      
      <text x="190" y="138" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">x₁</text>
      <text x="20" y="20" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">x₂</text>

      <!-- Grid lines -->
      <line x1="150" y1="125" x2="150" y2="35" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="2,2" />
      <line x1="30" y1="35" x2="150" y2="35" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="2,2" />

      <!-- Axis ticks & labels -->
      <text x="30" y="138" font-size="7.5" fill="#6B7280" text-anchor="middle">0</text>
      <text x="150" y="138" font-size="7.5" fill="#6B7280" text-anchor="middle">1</text>
      <text x="22" y="128" font-size="7.5" fill="#6B7280" text-anchor="end">0</text>
      <text x="22" y="38" font-size="7.5" fill="#6B7280" text-anchor="end">1</text>

      <!-- XOR Data Points -->
      <!-- Point (0, 0) = 0 (Negative class - Open circle) -->
      <circle cx="30" cy="125" r="5" fill="#FFFFFF" stroke="#111827" stroke-width="1.5" />
      <text x="44" y="118" font-size="7.5" font-family="monospace" fill="#4B5563">(0,0)=0</text>

      <!-- Point (1, 1) = 0 (Negative class - Open circle) -->
      <circle cx="150" cy="35" r="5" fill="#FFFFFF" stroke="#111827" stroke-width="1.5" />
      <text x="160" y="30" font-size="7.5" font-family="monospace" fill="#4B5563">(1,1)=0</text>

      <!-- Point (0, 1) = 1 (Positive class - Filled Orange circle) -->
      <circle cx="30" cy="35" r="5" fill="#C85A17" stroke="#9A3412" stroke-width="1.2" />
      <text x="44" y="30" font-size="7.5" font-family="monospace" font-weight="700" fill="#9A3412">(0,1)=1</text>

      <!-- Point (1, 0) = 1 (Positive class - Filled Orange circle) -->
      <circle cx="150" cy="125" r="5" fill="#C85A17" stroke="#9A3412" stroke-width="1.2" />
      <text x="160" y="118" font-size="7.5" font-family="monospace" font-weight="700" fill="#9A3412">(1,0)=1</text>

      <!-- Single Linear Decision Hyperplane (Fails!) -->
      <line x1="15" y1="80" x2="165" y2="80" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2" />
      <text x="90" y="74" font-size="7" font-weight="700" fill="#DC2626" text-anchor="middle">w₁x₁ + w₂x₂ + b = 0</text>
    </g>

    <!-- Side Explanation Box -->
    <g transform="translate(245, 68)">
      <rect x="0" y="0" width="165" height="150" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8" rx="2" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991B1B">Linear Inseparability:</text>
      <text x="10" y="32" font-size="8" fill="#7F1D1D">• Diagonal class geometry</text>
      <text x="10" y="44" font-size="8" fill="#7F1D1D">  is linearly non-separable.</text>
      <text x="10" y="58" font-size="8" fill="#7F1D1D">• Any straight hyperplane</text>
      <text x="10" y="70" font-size="8" fill="#7F1D1D">  misclassifies ≥ 1 point.</text>
      
      <line x1="10" y1="78" x2="155" y2="78" stroke="#FECDD3" stroke-width="0.8" />
      
      <text x="10" y="92" font-size="8" font-weight="700" fill="#991B1B">Training Outcome:</text>
      <text x="10" y="106" font-size="8" font-family="monospace" font-weight="700" fill="#DC2626">Accuracy: 50.0%</text>
      <text x="10" y="118" font-size="7.5" fill="#7F1D1D">(No better than random coin)</text>
      <text x="10" y="132" font-size="7.5" font-weight="700" fill="#991B1B">Gradient: Zero progress</text>
    </g>

    <!-- Historical Callout -->
    <g transform="translate(15, 226)">
      <rect x="0" y="0" width="395" height="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#111827">Minsky &amp; Papert (1969): The XOR Wall &amp; First AI Winter</text>
      <text x="10" y="29" font-size="7.5" fill="#4B5563">
        In <tspan font-style="italic">Perceptrons</tspan>, Minsky &amp; Papert proved mathematically that single-layer
      </text>
      <text x="10" y="41" font-size="7.5" fill="#4B5563">
        networks cannot compute XOR, triggering a 17-year funding freeze.
      </text>
      <text x="10" y="57" font-size="7.5" font-weight="700" fill="#991B1B">
        Historical Consequence: Neural network research halted (1969–1986).
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT: 1986 TWO-LAYER MLP (SOLVES) ==================== -->
  <g transform="translate(485, 52)">
    <rect x="0" y="0" width="425" height="315" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
    <rect x="0" y="0" width="425" height="24" fill="#FFEDD5" stroke="#C85A17" stroke-width="1.2" rx="2" />
    <text x="212" y="16" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">2. 1986 Multi-Layer Perceptron (Manifold Warping)</text>

    <!-- Architecture flow mini-bar -->
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="395" height="28" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" rx="2" />
      <text x="6" y="18" font-size="7.5" font-family="monospace" fill="#111827">[x₁,x₂]</text>
      <path d="M 40 14 L 54 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="58" y="4" width="68" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="0.8" rx="1" />
      <text x="92" y="17" font-size="7" font-family="monospace" fill="#9A3412" text-anchor="middle">Linear(2,2)</text>
      <path d="M 129 14 L 143 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="147" y="4" width="55" height="20" fill="#FFEDD5" stroke="#C85A17" stroke-width="0.8" rx="1" />
      <text x="174" y="17" font-size="7" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">ReLU(·)</text>
      <path d="M 205 14 L 219 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <rect x="223" y="4" width="68" height="20" fill="#FFF7ED" stroke="#C85A17" stroke-width="0.8" rx="1" />
      <text x="257" y="17" font-size="7" font-family="monospace" fill="#9A3412" text-anchor="middle">Linear(2,1)</text>
      <path d="M 294 14 L 308 14" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <text x="314" y="18" font-size="7.5" font-family="monospace" font-weight="700" fill="#15803D">ŷ ∈ [0,1] [100%]</text>
    </g>

    <!-- Hidden Representation Space Plot -->
    <g transform="translate(15, 68)">
      <rect x="0" y="0" width="220" height="150" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" />
      
      <!-- Hidden Coordinate Axes -->
      <line x1="30" y1="125" x2="195" y2="125" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="30" y1="125" x2="30" y2="15" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
      
      <text x="190" y="138" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#9A3412">h₁</text>
      <text x="20" y="20" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#9A3412">h₂</text>

      <!-- Transformed Coordinates in Hidden Space -->
      <!-- (0,0) maps to (30, 125) -> (0,0) -->
      <circle cx="30" cy="125" r="5" fill="#FFFFFF" stroke="#111827" stroke-width="1.5" />
      <text x="44" y="118" font-size="7.5" font-family="monospace" fill="#4B5563">(0,0)→0</text>

      <!-- (1,1) maps to (30, 35) -> (0, 1) in hidden space -->
      <circle cx="30" cy="35" r="5" fill="#FFFFFF" stroke="#111827" stroke-width="1.5" />
      <text x="44" y="32" font-size="7.5" font-family="monospace" fill="#4B5563">(1,1)→0</text>

      <!-- Both positive points (0,1) and (1,0) map to (150, 80) -> (1, 0.5) -->
      <circle cx="150" cy="80" r="6" fill="#C85A17" stroke="#9A3412" stroke-width="1.5" />
      <text x="160" y="76" font-size="7.5" font-family="monospace" font-weight="700" fill="#9A3412">{(0,1),</text>
      <text x="160" y="88" font-size="7.5" font-family="monospace" font-weight="700" fill="#9A3412">(1,0)}→1</text>

      <!-- Clean Linear Separator in Hidden Space -->
      <line x1="85" y1="20" x2="85" y2="135" stroke="#16A34A" stroke-width="1.8" />
      <text x="90" y="18" font-size="7" font-weight="700" fill="#15803D">Linearly Separable!</text>

      <!-- Warping label -->
      <text x="100" y="142" font-size="7" font-weight="600" fill="#C85A17">Warped Latent Manifold</text>
    </g>

    <!-- Side Explanation Box -->
    <g transform="translate(245, 68)">
      <rect x="0" y="0" width="165" height="150" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8" rx="2" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#166534">Coordinate Warping:</text>
      <text x="10" y="30" font-size="8" fill="#14532D">• ReLU non-linearity bends</text>
      <text x="10" y="42" font-size="8" fill="#14532D">  and folds input space.</text>
      <text x="10" y="56" font-size="8" fill="#14532D">• Collapses (0,1) &amp; (1,0)</text>
      <text x="10" y="68" font-size="8" fill="#14532D">  onto common subspace.</text>
      <text x="10" y="82" font-size="8" fill="#14532D">• Linear layer 2 easily</text>
      <text x="10" y="94" font-size="8" fill="#14532D">  partitions classes.</text>
      
      <line x1="10" y1="102" x2="155" y2="102" stroke="#BBF7D0" stroke-width="0.8" />
      
      <text x="10" y="116" font-size="8" font-weight="700" fill="#166534">Validation Outcome:</text>
      <text x="10" y="130" font-size="8.5" font-family="monospace" font-weight="700" fill="#15803D">Accuracy: 100.0%</text>
      <text x="10" y="142" font-size="7.5" fill="#14532D">Converged in &lt; 50 epochs</text>
    </g>

    <!-- Historical Callout -->
    <g transform="translate(15, 226)">
      <rect x="0" y="0" width="395" height="78" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" rx="2" />
      <text x="10" y="15" font-size="8.5" font-weight="700" fill="#9A3412">Rumelhart, Hinton &amp; Williams (1986): Backprop Thaws AI</text>
      <text x="10" y="29" font-size="7.5" fill="#7C2D12">
        By deriving reverse-mode gradient propagation through non-linear hidden
      </text>
      <text x="10" y="41" font-size="7.5" fill="#7C2D12">
        units, Rumelhart et al. showed networks can discover representations automatically.
      </text>
      <text x="10" y="57" font-size="7.5" font-weight="700" fill="#15803D">
        Foundation of Modern Deep Learning: Conquered the XOR dilemma.
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INVARIANT CALLOUT ==================== -->
  <g transform="translate(30, 376)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Mathematical Invariant: Associative Linear Collapse vs. Non-Linear Manifold Warping</text>
    <text x="0" y="36" font-size="9.5" fill="#374151">
      A stack of purely linear operations <tspan font-family="'Times New Roman', serif" font-style="italic">L_n(···L₁(x))</tspan> collapses algebraically to a single shallow transformation <tspan font-family="'Times New Roman', serif" font-style="italic">W_eff = W_n ··· W₁</tspan>, bounded by linear hyperplanes.
    </text>
    <text x="0" y="52" font-size="9.5" fill="#374151">
      Non-linear activation gates (<tspan font-weight="600" fill="#C85A17">ReLU, GELU</tspan>) break associativity, enabling hidden layers to fold, stretch, and warp coordinate geometry so that
    </text>
    <text x="0" y="66" font-size="9.5" fill="#374151">
      non-linearly separable inputs become <tspan font-weight="600" fill="#15803D">linearly separable</tspan> in latent representation space.
    </text>
    <text x="0" y="80" font-size="9" fill="#6B7280">
      Reverse-mode autograd propagates loss gradients across the manifold, updating hidden weights without manual analytical derivations.
    </text>
  </g>
</svg>