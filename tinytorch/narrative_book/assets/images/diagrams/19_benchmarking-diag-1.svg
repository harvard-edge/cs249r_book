<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">Rigorous Statistical Benchmarking: Warmup Stabilization, Sync Barriers &amp; Tail Latencies</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== PILLAR 1: WARMUP STABILIZATION ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="256" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="256" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="256" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="12" y="19" font-size="11.5" font-weight="700" fill="#111827">1. Warmup Stabilization</text>
    <text x="244" y="19" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="end">Discard First N Runs</text>

    <!-- Warmup Iterations Bar Chart -->
    <g transform="translate(14, 40)">
      <text x="0" y="10" font-size="9.5" font-weight="700" fill="#111827">Iterations 1..N_warmup (Discarded):</text>
      
      <!-- Run 1 Cold -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="228" height="18" rx="2" fill="#FFF7ED" stroke="#C85A17" />
        <rect x="0" y="0" width="228" height="18" rx="2" fill="#C85A17" />
        <text x="8" y="12.5" font-size="8.5" font-weight="700" fill="#FFFFFF">Run 1 (Cold / JIT): 45.2 ms</text>
      </g>

      <!-- Run 2 -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="228" height="18" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
        <rect x="0" y="0" width="130" height="18" rx="2" fill="#EA580C" />
        <text x="8" y="12.5" font-size="8.5" font-weight="700" fill="#FFFFFF">Run 2: 22.8 ms</text>
      </g>

      <!-- Run 3 -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="228" height="18" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
        <rect x="0" y="0" width="80" height="18" rx="2" fill="#111827" />
        <text x="8" y="12.5" font-size="8.5" font-weight="700" fill="#FFFFFF">Run 3: 8.4 ms</text>
      </g>

      <!-- Run 10 Steady -->
      <g transform="translate(0, 86)">
        <rect x="0" y="0" width="228" height="18" rx="2" fill="#F9FAFB" stroke="#E5E7EB" />
        <rect x="0" y="0" width="50" height="18" rx="2" fill="#111827" />
        <text x="58" y="12.5" font-size="8.5" font-weight="700" fill="#111827">Run 10: 6.1 ms [Steady State]</text>
      </g>
    </g>

    <!-- Details Box -->
    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="232" height="158" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">Why Warmup is Mandatory:</text>
      
      <text x="10" y="38" font-size="8.5" font-weight="700" fill="#111827">• CUDA Context Creation: <tspan font-weight="400" fill="#4B5563">Driver init overhead.</tspan></text>
      <text x="10" y="54" font-size="8.5" font-weight="700" fill="#111827">• JIT Kernel Compilation: <tspan font-weight="400" fill="#4B5563">PTX lowering to SASS.</tspan></text>
      <text x="10" y="70" font-size="8.5" font-weight="700" fill="#111827">• Memory Allocator: <tspan font-weight="400" fill="#4B5563">cudaMalloc pool priming.</tspan></text>
      <text x="10" y="86" font-size="8.5" font-weight="700" fill="#111827">• Instruction Caches: <tspan font-weight="400" fill="#4B5563">L1/L2 hardware warmup.</tspan></text>

      <line x1="10" y1="102" x2="222" y2="102" stroke="#E5E7EB" stroke-width="1" />
      <rect x="10" y="112" width="212" height="34" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="116" y="126" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">Prevents 10× First-Run Skew</text>
      <text x="116" y="138" font-size="8" fill="#C85A17" text-anchor="middle">Discard N_warm ≥ 10 before timing</text>
    </g>
  </g>

  <!-- ==================== PILLAR 2: HARDWARE SYNC BARRIERS ==================== -->
  <g transform="translate(312, 56)">
    <rect x="0" y="0" width="256" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="256" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="256" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="12" y="19" font-size="11.5" font-weight="700" fill="#111827">2. Sync Barriers</text>
    <text x="244" y="19" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="end">Async Execution Trap</text>

    <!-- Timeline Comparison -->
    <g transform="translate(14, 40)">
      <text x="0" y="10" font-size="9.5" font-weight="700" fill="#111827">Host CPU vs. Device GPU Execution:</text>

      <!-- CPU Row -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="34" height="22" rx="2" fill="#111827" />
        <text x="17" y="14" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">CPU</text>

        <rect x="38" y="0" width="46" height="22" rx="2" fill="#FFF7ED" stroke="#C85A17" />
        <text x="61" y="14" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">0.02 ms</text>
        <text x="92" y="14" font-size="8" font-weight="700" fill="#C85A17">[Async Return!]</text>
      </g>

      <!-- GPU Row -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="34" height="22" rx="2" fill="#4B5563" />
        <text x="17" y="14" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPU</text>

        <rect x="38" y="0" width="144" height="22" rx="2" fill="#111827" />
        <text x="110" y="14" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kernel Execution (15.0 ms)</text>
      </g>

      <!-- Sync barrier drop line -->
      <line x1="182" y1="18" x2="182" y2="82" stroke="#C85A17" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="182" y="94" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">cuda.synchronize()</text>
    </g>

    <!-- Details Box -->
    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="232" height="158" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">The Asynchronous Timing Trap:</text>
      
      <text x="10" y="38" font-size="8.5" fill="#4B5563">• model(x) only enqueues work onto stream</text>
      <text x="10" y="54" font-size="8.5" fill="#4B5563">• CPU timer without sync measures 0.02ms</text>
      <text x="10" y="70" font-size="8.5" font-weight="700" fill="#111827">• Must call torch.cuda.synchronize()</text>
      <text x="10" y="86" font-size="8.5" fill="#4B5563">• Or record hardware CUDA Events on GPU</text>

      <line x1="10" y1="102" x2="222" y2="102" stroke="#E5E7EB" stroke-width="1" />
      <rect x="10" y="112" width="212" height="34" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="116" y="126" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">True Physical Silicon Timing</text>
      <text x="116" y="138" font-size="8" fill="#C85A17" text-anchor="middle">Measures actual compute completion</text>
    </g>
  </g>

  <!-- ==================== PILLAR 3: TAIL LATENCY PERCENTILES ==================== -->
  <g transform="translate(584, 56)">
    <rect x="0" y="0" width="256" height="332" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="256" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="256" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="12" y="19" font-size="11.5" font-weight="700" fill="#111827">3. Tail Percentiles</text>
    <text x="244" y="19" font-size="9.5" font-weight="700" fill="#C85A17" text-anchor="end">P50 / P95 / P99</text>

    <!-- Distribution Curve -->
    <g transform="translate(14, 40)">
      <text x="0" y="10" font-size="9.5" font-weight="700" fill="#111827">Latency Distribution (N = 100 Runs):</text>

      <!-- Curve Graphic -->
      <g transform="translate(10, 18)">
        <!-- Axis -->
        <line x1="0" y1="70" x2="200" y2="70" stroke="#111827" stroke-width="1.2" />
        
        <!-- Density polygon / path -->
        <path d="M 0 70 Q 40 10, 60 30 T 110 65 T 190 69 L 190 70 Z" fill="#FFF7ED" opacity="0.8" />
        <path d="M 0 70 Q 40 10, 60 30 T 110 65 T 190 69" fill="none" stroke="#C85A17" stroke-width="2" />

        <!-- P50 Marker -->
        <line x1="50" y1="20" x2="50" y2="70" stroke="#111827" stroke-width="1.2" stroke-dasharray="2,2" />
        <text x="50" y="82" font-size="8" font-weight="700" fill="#111827" text-anchor="middle">P50 (6.1ms)</text>

        <!-- P95 Marker -->
        <line x1="110" y1="45" x2="110" y2="70" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="2,2" />
        <text x="110" y="82" font-size="8" font-weight="700" fill="#EA580C" text-anchor="middle">P95 (7.2ms)</text>

        <!-- P99 Marker -->
        <line x1="170" y1="55" x2="170" y2="70" stroke="#C85A17" stroke-width="1.2" stroke-dasharray="2,2" />
        <text x="170" y="82" font-size="8" font-weight="700" fill="#C85A17" text-anchor="middle">P99 (14.5ms)</text>
      </g>
    </g>

    <!-- Details Box -->
    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="232" height="158" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#111827">MLPerf Metrics Standard:</text>
      
      <text x="10" y="38" font-size="8.5" fill="#4B5563">• Arithmetic mean hides catastrophic tail delays</text>
      <text x="10" y="54" font-size="8.5" font-weight="700" fill="#111827">• P50 (Median): <tspan font-weight="400" fill="#4B5563">Typical end-user latency</tspan></text>
      <text x="10" y="70" font-size="8.5" font-weight="700" fill="#C85A17">• P99 (Tail): <tspan font-weight="400" fill="#4B5563">Cloud SLA violation threshold</tspan></text>
      <text x="10" y="86" font-size="8.5" fill="#4B5563">• Throughput = Generated_Tokens / Total_Sec</text>

      <line x1="10" y1="102" x2="222" y2="102" stroke="#E5E7EB" stroke-width="1" />
      <rect x="10" y="112" width="212" height="34" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="116" y="126" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">Statistical Integrity</text>
      <text x="116" y="138" font-size="8" fill="#C85A17" text-anchor="middle">Report distributions, not single runs</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Asynchronous GPU execution queues decouple host timers from actual silicon completion.
      <tspan x="0" dy="16">Honest ML benchmarking demands warmup phase stabilization, hardware synchronization barriers, and statistical percentile reporting (P50/P95/P99).</tspan>
    </text>
  </g>
</svg>
