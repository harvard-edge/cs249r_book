<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="360" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8246" /></marker>
  </defs>
  <rect x="30" y="60" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="120.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Q and K</text>
  <text x="120.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[B, H, S, d]</text>
  <rect x="250" y="60" width="180" height="60" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="340.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Scaled score matrix</text>
  <text x="340.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">QKᵀ / √d; [B, H, S, S]</text>
  <rect x="470" y="60" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="560.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Apply mask, if supplied</text>
  <text x="560.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">0 = blocked; 1 = allowed</text>
  <path d="M210,90 H250" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,90 H470" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="30" y="200" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="120.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Masked scores</text>
  <text x="120.0" y="241.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[B, H, S, S]</text>
  <rect x="250" y="200" width="180" height="60" rx="2" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2" />
  <text x="340.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Softmax over keys</text>
  <text x="340.0" y="241.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">weights: [B, H, S, S]</text>
  <rect x="470" y="200" width="180" height="60" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="560.0" y="225.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Weighted sum: weights × V</text>
  <text x="560.0" y="241.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">output: [B, H, S, d]</text>
  <path d="M560,120 V150 H120 V200" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M210,230 H250" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,230 H470" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="470" y="300" width="180" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="560.0" y="323.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">V: [B, H, S, d]</text>
  <path d="M560,300 V260" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
</svg>
