<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="315" viewBox="0 0 680 315" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="315" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Left Container: Protected Student Workspace -->
  <rect x="25" y="20" width="305" height="195" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.4"/>
  <rect x="25" y="20" width="305" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
  <text x="35" y="36" font-size="9" font-weight="700" fill="#c85a17">STUDENT WORKSPACE (STRICTLY PRESERVED)</text>
  <text x="260" y="36" font-size="8" font-family="monospace" font-weight="bold" fill="#c85a17">SAFE</text>

  <!-- modules/ -->
  <rect x="35" y="54" width="285" height="44" rx="2" fill="#fff8f5" stroke="#ff8246" stroke-width="1"/>
  <text x="47" y="70" font-size="8.5" font-family="monospace" font-weight="700" fill="#1f2937">modules/NN_name/notebook.ipynb</text>
  <text x="47" y="85" font-size="7.5" fill="#6b7280">Your active working notebooks &amp; exercise solutions</text>

  <!-- tinytorch/core/ -->
  <rect x="35" y="106" width="285" height="44" rx="2" fill="#fff8f5" stroke="#ff8246" stroke-width="1"/>
  <text x="47" y="122" font-size="8.5" font-family="monospace" font-weight="700" fill="#1f2937">tinytorch/core/*.py</text>
  <text x="47" y="137" font-size="7.5" fill="#6b7280">Your clean exported framework implementation</text>

  <!-- .tito/ -->
  <rect x="35" y="158" width="285" height="44" rx="2" fill="#fff8f5" stroke="#ff8246" stroke-width="1"/>
  <text x="47" y="174" font-size="8.5" font-family="monospace" font-weight="700" fill="#1f2937">.tito/progress.json &amp; backups/</text>
  <text x="47" y="189" font-size="7.5" fill="#6b7280">Milestone ledger &amp; automatic pre-update snapshots</text>

  <!-- Right Container: Upstream Tooling -->
  <rect x="350" y="20" width="305" height="195" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="350" y="20" width="305" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="360" y="36" font-size="9" font-weight="700" fill="#1f2937">FRAMEWORK INFRASTRUCTURE (UPDATABLE)</text>
  <text x="575" y="36" font-size="8" font-family="monospace" fill="#6b7280">UPSTREAM</text>

  <!-- tests/ -->
  <rect x="360" y="54" width="285" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="372" y="70" font-size="8.5" font-family="monospace" font-weight="700" fill="#1f2937">tests/</text>
  <text x="372" y="85" font-size="7.5" fill="#6b7280">Unit, educational, &amp; progressive integration suites</text>

  <!-- tito/ -->
  <rect x="360" y="106" width="285" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="372" y="122" font-size="8.5" font-family="monospace" font-weight="700" fill="#1f2937">tito/ (CLI Assistant)</text>
  <text x="372" y="137" font-size="7.5" fill="#6b7280">Workflow management, exporters, &amp; diagnostics</text>

  <!-- milestones/ -->
  <rect x="360" y="158" width="285" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="372" y="174" font-size="8.5" font-family="monospace" font-weight="700" fill="#1f2937">milestones/</text>
  <text x="372" y="189" font-size="7.5" fill="#6b7280">Historical benchmarks &amp; reproduction runners</text>

  <!-- Bottom Container: Safe Update Contract -->
  <rect x="25" y="227" width="630" height="72" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="227" width="630" height="22" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="242" font-size="9" font-weight="700" fill="#1f2937">THE SAFE UPDATE CONTRACT: tito update</text>
  <text x="495" y="242" font-size="8" font-family="monospace" fill="#6b7280">Zero Work Destruction</text>

  <text x="35" y="266" font-size="8" fill="#1f2937">1. Pulls upstream bugfixes and new test cases without touching <tspan font-family="monospace" font-weight="700" fill="#c85a17">modules/</tspan> or <tspan font-family="monospace" font-weight="700" fill="#c85a17">tinytorch/core/</tspan>.</text>
  <text x="35" y="284" font-size="8" fill="#1f2937">2. Automatically creates an isolated recovery snapshot at <tspan font-family="monospace" font-weight="700">.tito/backups/pre_update_&lt;timestamp&gt;/</tspan> before modifying files.</text>

</svg>