<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="360" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8246" /></marker>
  </defs>
  <text x="30" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Training</text>
  <rect x="30" y="60" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="120.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Split corpus into words</text>
  <text x="120.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Count word frequencies</text>
  <rect x="250" y="60" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="340.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Build character vocabulary</text>
  <text x="340.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Mark each word ending</text>
  <rect x="470" y="60" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="560.0" y="85.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Count adjacent pairs</text>
  <text x="560.0" y="101.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Merge most frequent pair</text>
  <path d="M210,90 H250" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,90 H470" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="560" y="145" text-anchor="middle" font-size="9.5" font-weight="400" fill="#111827">Repeat until target or no pairs</text>
  <text x="30" y="195" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Encoding with learned merges</text>
  <rect x="30" y="220" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="120.0" y="245.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Word: low</text>
  <text x="120.0" y="261.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[l, o, w&lt;/w&gt;]</text>
  <rect x="250" y="220" width="180" height="60" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="340.0" y="245.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">If (l, o) was learned</text>
  <text x="340.0" y="261.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[lo, w&lt;/w&gt;]</text>
  <rect x="470" y="220" width="180" height="60" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="560.0" y="245.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Look up token IDs</text>
  <text x="560.0" y="261.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Unknown token → ID 0</text>
  <path d="M210,250 H250" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M430,250 H470" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M30,300 H650" stroke="#D1D5DB" stroke-width="0.8" />
  <text x="340" y="320" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">Merges are applied in learned order within each word; token IDs depend on the trained vocabulary.</text>
  <text x="340" y="336" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">The alphabet comes from the corpus. This implementation uses characters and an unknown-token fallback.</text>
</svg>
