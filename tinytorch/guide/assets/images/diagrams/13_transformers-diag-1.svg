<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="460" fill="#FFFFFF" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker>
    <marker id="blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563" /></marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff8246" /></marker>
  </defs>
  <text x="30" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Pre-LN transformer block</text>
  <rect x="60" y="60" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="190.0" y="83.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Input x</text>
  <rect x="60" y="130" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="190.0" y="153.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">LayerNorm → self-attention</text>
  <rect x="60" y="200" width="260" height="40" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="190.0" y="223.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Add residual: h = x + attention</text>
  <rect x="60" y="270" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="190.0" y="293.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">LayerNorm → MLP</text>
  <rect x="60" y="340" width="260" height="40" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="190.0" y="363.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Add residual: output = h + MLP</text>
  <path d="M190,100 V130" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M190,170 V200" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M190,240 V270" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M190,310 V340" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M60,80 H30 V220 H60" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M320,220 H350 V360 H320" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="400" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">GPT forward path</text>
  <rect x="390" y="60" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="520.0" y="83.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Token + learned position embeddings</text>
  <rect x="390" y="130" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="520.0" y="145.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Transformer blocks × N</text>
  <text x="520.0" y="161.0" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">with causal mask</text>
  <rect x="390" y="200" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="520.0" y="223.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Final LayerNorm</text>
  <rect x="390" y="270" width="260" height="40" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2" />
  <text x="520.0" y="293.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Separate Linear head: D → V</text>
  <rect x="390" y="340" width="260" height="40" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
  <text x="520.0" y="363.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Logits: [B, S, V]</text>
  <path d="M520,100 V130" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M520,170 V200" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M520,240 V270" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M520,310 V340" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M30,395 H650" stroke="#D1D5DB" stroke-width="0.8" />
  <text x="340" y="415" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">MLP: Linear(D, hidden) → GELU → Linear(hidden, D); hidden defaults to 4D.</text>
  <text x="340" y="431" text-anchor="middle" font-size="9.5" font-weight="400" fill="#4B5563">The LM head has its own weights. Residual connections provide additive paths through the block.</text>
</svg>
