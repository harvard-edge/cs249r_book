<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="420" fill="#FFFFFF"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827"/></marker></defs>
  
  <!-- Column Headers -->
  <text x="90" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Same input</text>
  <text x="300" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Independent function</text>
  <text x="545" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Separate result</text>

  <!-- Row 1: ReLU -->
  <rect x="30" y="45" width="120" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="90" y="72" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[−1, 0, 1]</text>
  
  <rect x="185" y="45" width="230" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="300" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ReLU</text>
  <text x="300" y="79" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">max(0, x)</text>
  
  <rect x="450" y="45" width="190" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="545" y="72" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[0, 0, 1]</text>
  
  <path d="M150 67 H185" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M415 67 H450" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 2: Sigmoid -->
  <rect x="30" y="100" width="120" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="90" y="127" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[−1, 0, 1]</text>
  
  <rect x="185" y="100" width="230" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="300" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Sigmoid</text>
  <text x="300" y="134" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">1 / (1 + exp(−x))</text>
  
  <rect x="450" y="100" width="190" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="545" y="127" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">≈ [0.2689, 0.5, 0.7311]</text>
  
  <path d="M150 122 H185" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M415 122 H450" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 3: Tanh -->
  <rect x="30" y="155" width="120" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="90" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[−1, 0, 1]</text>
  
  <rect x="185" y="155" width="230" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="300" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Tanh</text>
  <text x="300" y="189" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">tanh(x)</text>
  
  <rect x="450" y="155" width="190" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="545" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">≈ [−0.7616, 0, 0.7616]</text>
  
  <path d="M150 177 H185" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M415 177 H450" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 4: GELU -->
  <rect x="30" y="210" width="120" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="90" y="237" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[−1, 0, 1]</text>
  
  <rect x="185" y="210" width="230" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Sigmoid-GELU</text>
  <text x="300" y="244" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">x × sigmoid(1.702x)</text>
  
  <rect x="450" y="210" width="190" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="545" y="237" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">≈ [−0.1542, 0, 0.8458]</text>
  
  <path d="M150 232 H185" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M415 232 H450" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Mid Divider and note -->
  <text x="340" y="278" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">Elementwise alternatives; the input is unchanged.</text>
  <path d="M30 292 H650" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Row 5: Softmax -->
  <rect x="30" y="310" width="120" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="90" y="337" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[−1, 0, 1]</text>
  
  <rect x="185" y="310" width="230" height="44" rx="2" fill="#FFFFFF" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="300" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Softmax</text>
  <text x="300" y="344" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">Normalize over the vector</text>
  
  <rect x="450" y="310" width="190" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="545" y="337" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">≈ [0.0900, 0.2447, 0.6652]</text>
  
  <path d="M150 332 H185" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M415 332 H450" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="340" y="395" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">Every result has shape (3,). Softmax entries sum to 1.</text>
</svg>
