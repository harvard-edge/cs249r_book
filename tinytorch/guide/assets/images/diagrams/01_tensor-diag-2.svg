<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="350" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827" /></marker></defs>
<rect x="30" y="35" width="185" height="145" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="42" y="57" text-anchor="start" font-size="11" font-weight="700" fill="#111827">A: shape (2, 3)</text>
<text x="42" y="76" text-anchor="start" font-size="11" font-weight="400" fill="#111827">[1, 2, 3]</text>
<text x="42" y="95" text-anchor="start" font-size="11" font-weight="400" fill="#111827">[4, 5, 6]</text>
<rect x="245" y="35" width="175" height="145" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="257" y="57" text-anchor="start" font-size="11" font-weight="700" fill="#111827">b: shape (3,)</text>
<text x="257" y="76" text-anchor="start" font-size="11" font-weight="400" fill="#111827">[10, 20, 30]</text>
<text x="257" y="95" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Align trailing axes</text>
<rect x="450" y="35" width="200" height="145" rx="3" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2" />
<text x="462" y="57" text-anchor="start" font-size="11" font-weight="700" fill="#111827">A + b: shape (2, 3)</text>
<text x="462" y="76" text-anchor="start" font-size="11" font-weight="400" fill="#111827">[11, 22, 33]</text>
<text x="462" y="95" text-anchor="start" font-size="11" font-weight="400" fill="#111827">[14, 25, 36]</text>
<text x="230" y="114" text-anchor="middle" font-size="14" fill="#111827">+</text>
<path d="M420 110 H450" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
<rect x="30" y="210" width="620" height="65" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
<text x="42" y="232" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Broadcast compatibility</text>
<text x="42" y="251" text-anchor="start" font-size="11" font-weight="400" fill="#111827">Aligned dimensions must match, or one must be 1; missing leading axes act as 1.</text>
<path d="M30 298 H650" stroke="#D1D5DB" stroke-width="1" />
<text x="30" y="315" text-anchor="start" font-size="10" font-weight="400" fill="#4B5563">The vector is reused across rows during arithmetic; the result has newly allocated storage.</text>
</svg>
