<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="285" viewBox="0 0 680 285" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="285" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- 1. Workloads Container -->
  <rect x="25" y="20" width="630" height="66" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="20" width="630" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="35" font-size="9" font-weight="700" fill="#1f2937">1. ARCHITECTURAL TRIAD BENCHMARK WORKLOADS</text>

  <!-- Workload Nodes -->
  <g transform="translate(35, 48)">
    <rect x="0" y="0" width="190" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="95" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">DigitMLP (Dense)</text>
    <text x="95" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">8×8 TinyDigits • Parameter-Bound</text>
  </g>

  <g transform="translate(245, 48)">
    <rect x="0" y="0" width="190" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="95" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">SimpleCNN (Spatial)</text>
    <text x="95" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">Conv2d + MaxPool • Compute-Bound</text>
  </g>

  <g transform="translate(455, 48)">
    <rect x="0" y="0" width="190" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="95" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">TinyGPT (Autoregressive)</text>
    <text x="95" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">Causal Self-Attention • Prefix-Bound</text>
  </g>

  <!-- Connectors: Workloads to Optimization Stack -->
  <path d="M 130 86 V 104" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <path d="M 340 86 V 104" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <path d="M 550 86 V 104" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- 2. Optimization Stack Container -->
  <rect x="25" y="104" width="630" height="66" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="104" width="630" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="119" font-size="9" font-weight="700" fill="#1f2937">2. TINYTORCH OPTIMIZATION STACK (YOUR MODULES 14–18)</text>

  <!-- Optimization Nodes -->
  <g transform="translate(35, 132)">
    <rect x="0" y="0" width="142" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">INT8 Quantization</text>
    <text x="71" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 15: 4× Footprint</text>
  </g>

  <g transform="translate(187, 132)">
    <rect x="0" y="0" width="142" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">Magnitude Pruning</text>
    <text x="71" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 16: 50% Sparsity</text>
  </g>

  <g transform="translate(339, 132)">
    <rect x="0" y="0" width="142" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="71" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">Kernel Acceleration</text>
    <text x="71" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 17: SIMD &amp; im2col</text>
  </g>

  <g transform="translate(491, 132)">
    <rect x="0" y="0" width="154" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="77" y="13" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">KV-Cache Memoization</text>
    <text x="77" y="24" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 18: O(1) Attention</text>
  </g>

  <!-- Connectors: Optimization to Telemetry -->
  <path d="M 106 170 V 188" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <path d="M 340 170 V 188" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <path d="M 568 170 V 188" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- 3. Telemetry & Pareto Evaluation (ACCENT) -->
  <rect x="25" y="188" width="630" height="85" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
  <rect x="25" y="188" width="630" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="35" y="204" font-size="9.5" font-weight="700" fill="#c85a17">3. MLPERF TELEMETRY &amp; MULTI-OBJECTIVE PARETO EVALUATION (MODULE 19)</text>

  <g transform="translate(35, 218)">
    <rect x="0" y="0" width="285" height="46" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="142" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">Standardized Benchmark Harness</text>
    <text x="142" y="32" text-anchor="middle" font-size="7.5" fill="#6b7280">Warmup passes • Multi-iteration timing • Mean ± std • P95 latency</text>
  </g>

  <g transform="translate(330, 218)">
    <rect x="0" y="0" width="315" height="46" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="157" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c85a17">Pareto Frontier Classification</text>
    <text x="157" y="32" text-anchor="middle" font-size="7.5" fill="#1f2937">Identifies non-dominated models across Memory, Accuracy &amp; Latency</text>
  </g>
</svg>
