<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="300" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Container -->
  <rect x="25" y="20" width="630" height="260" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="20" width="630" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#1f2937">TITO DIAGNOSTIC TRIAGE: RESOLVE ANY EXECUTION FRICTION</text>
  <text x="480" y="36" font-size="8.5" font-family="monospace" fill="#6b7280">4-Level Root-Cause Tree</text>

  <!-- Level 1: Shell -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="138" height="175" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="138" height="22" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1f2937">1. Shell Activation</text>

    <text x="10" y="36" font-size="7.5" font-weight="bold" fill="#475569">Symptom:</text>
    <text x="10" y="48" font-size="7" font-family="monospace" fill="#dc2626">tito: command not</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#dc2626">found</text>

    <text x="10" y="78" font-size="7.5" font-weight="bold" fill="#475569">Root Cause:</text>
    <text x="10" y="90" font-size="7" fill="#6b7280">New terminal opened</text>
    <text x="10" y="100" font-size="7" fill="#6b7280">without venv active</text>

    <text x="10" y="122" font-size="7.5" font-weight="bold" fill="#15803d">Immediate Fix:</text>
    <text x="10" y="136" font-size="6.8" font-family="monospace" fill="#15803d">source .venv/bin/</text>
    <text x="10" y="146" font-size="6.8" font-family="monospace" fill="#15803d">activate</text>
    <text x="10" y="162" font-size="6.5" font-style="italic" fill="#6b7280">Win: Scripts/activate</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 178 143 H 198" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Level 2: Environment -->
  <g transform="translate(198, 56)">
    <rect x="0" y="0" width="138" height="175" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="138" height="22" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1f2937">2. Environment</text>

    <text x="10" y="36" font-size="7.5" font-weight="bold" fill="#475569">Symptom:</text>
    <text x="10" y="48" font-size="7" font-family="monospace" fill="#dc2626">ModuleNotFoundError</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#dc2626">Kernel dead</text>

    <text x="10" y="78" font-size="7.5" font-weight="bold" fill="#475569">Root Cause:</text>
    <text x="10" y="90" font-size="7" fill="#6b7280">Jupyter kernel</text>
    <text x="10" y="100" font-size="7" fill="#6b7280">unregistered</text>

    <text x="10" y="122" font-size="7.5" font-weight="bold" fill="#15803d">Immediate Fix:</text>
    <text x="10" y="136" font-size="7" font-family="monospace" fill="#15803d">tito system health</text>
    <text x="10" y="150" font-size="7" font-family="monospace" fill="#15803d">tito setup --force</text>
    <text x="10" y="164" font-size="6.5" font-style="italic" fill="#6b7280">Safe &amp; in-place</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 336 143 H 356" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Level 3: Notebook Unit -->
  <g transform="translate(356, 56)">
    <rect x="0" y="0" width="138" height="175" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="138" height="22" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8.5" font-weight="700" fill="#1f2937">3. Exercise Tests</text>

    <text x="10" y="36" font-size="7.5" font-weight="bold" fill="#475569">Symptom:</text>
    <text x="10" y="48" font-size="7" font-family="monospace" fill="#dc2626">Unit tests failed</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#dc2626">AssertionError</text>

    <text x="10" y="78" font-size="7.5" font-weight="bold" fill="#475569">Root Cause:</text>
    <text x="10" y="90" font-size="7" fill="#6b7280">Stub not replaced</text>
    <text x="10" y="100" font-size="7" fill="#6b7280">or math boundary edge</text>

    <text x="10" y="122" font-size="7.5" font-weight="bold" fill="#15803d">Immediate Fix:</text>
    <text x="10" y="136" font-size="7" font-family="monospace" fill="#15803d">tito module test NN</text>
    <text x="10" y="150" font-size="7" fill="#6b7280">Inspect inline cell</text>
    <text x="10" y="162" font-size="6.5" font-style="italic" fill="#6b7280">No export needed</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 494 143 H 514" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- Level 4: Integration / Milestone (ACCENT) -->
  <g transform="translate(514, 56)">
    <rect x="0" y="0" width="130" height="175" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
    <rect x="0" y="0" width="130" height="22" rx="2" fill="#ff8246" stroke="#ff8246" stroke-width="1.4"/>
    <text x="8" y="15" font-size="8.5" font-weight="700" fill="#ffffff">4. Integration &amp; Sync</text>

    <text x="8" y="36" font-size="7.5" font-weight="bold" fill="#c85a17">Symptom:</text>
    <text x="8" y="48" font-size="6.8" font-family="monospace" fill="#c85a17">Integration failed</text>
    <text x="8" y="58" font-size="6.8" font-family="monospace" fill="#c85a17">Prereqs Not Met</text>

    <text x="8" y="78" font-size="7.5" font-weight="bold" fill="#c85a17">Root Cause:</text>
    <text x="8" y="90" font-size="7" fill="#7c2d12">Earlier module shape</text>
    <text x="8" y="100" font-size="7" fill="#7c2d12">or unexported code</text>

    <text x="8" y="122" font-size="7.5" font-weight="bold" fill="#15803d">Immediate Fix:</text>
    <text x="8" y="136" font-size="6.8" font-family="monospace" fill="#15803d">tito module status</text>
    <text x="8" y="150" font-size="6.8" font-family="monospace" fill="#15803d">tito module complete</text>
    <text x="8" y="164" font-size="6.5" font-style="italic" fill="#c85a17">Exports to tinytorch/</text>
  </g>

  <!-- Bottom Triage Rule -->
  <text x="340" y="258" text-anchor="middle" font-size="8.5" font-style="italic" fill="#6b7280">When in doubt: Always run <tspan font-family="monospace" font-weight="bold" font-style="normal" fill="#1f2937">tito system health</tspan> first. If all green, the issue is code logic, not your environment.</text>

</svg>