<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="470" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#111827"/></marker></defs>

<!-- Input logits and target -->
<rect x="30" y="25" width="620" height="65" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="340" y="51" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">z = [1000, 1002, 1001], target class = 1</text>
<text x="340" y="71" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">logits shape (1, 3) · target shape (1,)</text>

<!-- Column titles -->
<text x="175" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Direct exponentiation</text>
<text x="505" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Shift by the maximum</text>

<!-- Row 1: Exponentiation vs Max Shift -->
<rect x="30" y="132" width="290" height="74" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="175" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">exp(z) overflows in float32</text>
<text x="175" y="171" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">[∞, ∞, ∞]</text>
<text x="175" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Sum = ∞</text>

<rect x="360" y="132" width="290" height="74" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="505" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Maximum = 1002</text>
<text x="505" y="171" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">z − max(z) = [−2, 0, −1]</text>
<text x="505" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">exp = [0.1353, 1, 0.3679]</text>

<path d="M175 206 V238" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M505 206 V238" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Row 2: Normalization -->
<rect x="30" y="238" width="290" height="74" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="175" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">Normalize: ∞ / ∞</text>
<text x="175" y="277" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Probabilities = [NaN, NaN, NaN]</text>
<text x="175" y="296" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Target log-probability = NaN</text>

<rect x="360" y="238" width="290" height="74" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="505" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Sum of exponentials ≈ 1.5032</text>
<text x="505" y="277" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Log of sum ≈ 0.4076</text>
<text x="505" y="296" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Target log-probability = 0 − 0.4076</text>

<path d="M175 312 V344" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M505 312 V344" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Row 3: Result -->
<rect x="30" y="344" width="290" height="58" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="175" y="367" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Cross-entropy = NaN</text>
<text x="175" y="386" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">Result shape ()</text>

<rect x="360" y="344" width="290" height="58" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
<text x="505" y="367" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Cross-entropy ≈ 0.4076</text>
<text x="505" y="386" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">Result shape ()</text>

<!-- Footer -->
<path d="M30 422 H650" stroke="#D1D5DB" stroke-width="1"/>
<text x="340" y="445" text-anchor="middle" font-size="10" font-weight="400" fill="#4B5563">Cross-entropy negates the target log-probability; decimals are rounded.</text>
</svg>
