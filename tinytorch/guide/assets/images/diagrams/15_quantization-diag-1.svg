<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="300" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Floating-point values</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Include zero in the range</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">s = (max − min) / 255</text>
<rect x="250" y="30" width="180" height="90" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
<text x="340.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Affine integer codes</text>
<text x="340.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">q = clip(round(x/s + z))</text>
<text x="340.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">−128 ≤ q ≤ 127</text>
<rect x="470" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="560.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Reconstructed values</text>
<text x="560.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">x̂ = (q − z) × s</text>
<text x="560.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Rounding changes values</text>
<path d="M 210 75 H 250 V 75" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 430 75 H 470 V 75" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="160" width="290" height="100" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="175.0" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Packed storage model</text>
<text x="175.0" y="205" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">One byte per code + scale / zero point</text>
<text x="175.0" y="222" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">FP32 weights use four bytes each</text>
<rect x="360" y="160" width="290" height="100" rx="2" fill="#F9FAFB" stroke="#9ca3af" stroke-width="1.2"/>
<text x="505.0" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">TinyTorch execution</text>
<text x="505.0" y="205" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Tensor widens codes to float32</text>
<text x="505.0" y="222" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">QuantizedLinear uses float32 arithmetic</text>
</svg>
