<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  
  <defs>
    <marker id="arrow-down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#ea580c"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Top Container: TinyTorch Extension Ecosystem -->
  <g id="extension-ecosystem">
    <rect x="25" y="16" width="630" height="195" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect x="25" y="16" width="630" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Overwrite bottom rounded corners of header bar -->
    <rect x="26" y="38" width="628" height="6" fill="#f8fafc"/>
    <line x1="25" y1="44" x2="655" y2="44" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="40" y="34" font-size="10" font-weight="700" fill="#0f172a" letter-spacing="0.5">TINYTORCH EXTENSION ECOSYSTEM (tinytorch.extensions)</text>
    <rect x="525" y="22" width="118" height="16" rx="3" fill="#ea580c" fill-opacity="0.1"/>
    <text x="584" y="33.5" font-size="8.5" font-weight="700" fill="#c2410c" text-anchor="middle">CONTRIB WORKSHOP</text>

    <!-- 6 Extension Cards (3 columns x 2 rows) -->
    <!-- Col 1, Row 1: LoRA -->
    <g transform="translate(40, 56)">
      <rect width="190" height="64" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Parameter-Efficient Fine-Tuning</text>
      <text x="10" y="31" font-size="8" font-family="monospace" font-weight="600" fill="#ea580c">LoRALinear(in, out, rank)</text>
      <text x="10" y="45" font-size="7.5" fill="#64748b">Freezes base weights W0; trains rank-r</text>
      <text x="10" y="55" font-size="7.5" fill="#64748b">adapters. Cuts Adam state by &gt;98%</text>
    </g>

    <!-- Col 2, Row 1: Checkpointing -->
    <g transform="translate(245, 56)">
      <rect width="190" height="64" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Activation Checkpointing</text>
      <text x="10" y="31" font-size="8" font-family="monospace" font-weight="600" fill="#ea580c">checkpoint(fn, *args)</text>
      <text x="10" y="45" font-size="7.5" fill="#64748b">Drops activations during forward pass;</text>
      <text x="10" y="55" font-size="7.5" fill="#64748b">recomputes in backward. O(N) to O(√N)</text>
    </g>

    <!-- Col 3, Row 1: Loss Scaler -->
    <g transform="translate(450, 56)">
      <rect width="190" height="64" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Mixed-Precision Training</text>
      <text x="10" y="31" font-size="8" font-family="monospace" font-weight="600" fill="#ea580c">LossScaler(scale=65536)</text>
      <text x="10" y="45" font-size="7.5" fill="#64748b">Scales loss to shift small gradients</text>
      <text x="10" y="55" font-size="7.5" fill="#64748b">above IEEE 754 float16 underflow floor</text>
    </g>

    <!-- Col 1, Row 2: Graph Fusion -->
    <g transform="translate(40, 130)">
      <rect width="190" height="64" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Graph Fusion Compiler</text>
      <text x="10" y="31" font-size="8" font-family="monospace" font-weight="600" fill="#ea580c">compile_graph(fn, *inputs)</text>
      <text x="10" y="45" font-size="7.5" fill="#64748b">Traces tape into AST; emits fused</text>
      <text x="10" y="55" font-size="7.5" fill="#64748b">single-loop kernel. -40% DRAM traffic</text>
    </g>

    <!-- Col 2, Row 2: Vectorized SIMD -->
    <g transform="translate(245, 130)">
      <rect width="190" height="64" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">Vectorized CPU Kernels</text>
      <text x="10" y="31" font-size="8" font-family="monospace" font-weight="600" fill="#ea580c">simd_matmul, simd_fused_bias_gelu</text>
      <text x="10" y="45" font-size="7.5" fill="#64748b">C++ FFI via ctypes with AVX2/NEON</text>
      <text x="10" y="55" font-size="7.5" fill="#64748b">vector registers and OpenMP threading</text>
    </g>

    <!-- Col 3, Row 2: GPU Dispatch -->
    <g transform="translate(450, 130)">
      <rect width="190" height="64" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="700" fill="#0f172a">GPU Accelerator Dispatch</text>
      <text x="10" y="31" font-size="8" font-family="monospace" font-weight="600" fill="#ea580c">mps_matmul, triton_fused_gelu</text>
      <text x="10" y="45" font-size="7.5" fill="#64748b">Offloads GEMM to Apple Silicon Metal &amp;</text>
      <text x="10" y="55" font-size="7.5" fill="#64748b">launches OpenAI Triton GPU shaders</text>
    </g>
  </g>

  <!-- Connecting Bus / Arrow -->
  <g id="connector">
    <line x1="340" y1="211" x2="340" y2="242" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arrow-down)"/>
    <rect x="220" y="217" width="240" height="18" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="340" y="229.5" font-size="8" font-weight="700" fill="#c2410c" text-anchor="middle" letter-spacing="0.2">PLUGS INTO 4 CORE EXTENSION POINTS</text>
  </g>

  <!-- Bottom Container: TinyTorch Core Engine -->
  <g id="core-engine">
    <rect x="25" y="250" width="630" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#card-shadow)"/>
    <rect x="25" y="250" width="630" height="24" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="26" y="268" width="628" height="6" fill="#f1f5f9"/>
    <line x1="25" y1="274" x2="655" y2="274" stroke="#cbd5e1" stroke-width="1"/>

    <text x="40" y="266" font-size="9.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">TINYTORCH CORE ENGINE (MODULES 01 TO 20)</text>
    <rect x="525" y="254" width="118" height="16" rx="3" fill="#0284c7" fill-opacity="0.1"/>
    <text x="584" y="265.5" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">IMMUTABLE FOUNDATION</text>

    <!-- 4 Core Lego Bricks Pills -->
    <g transform="translate(40, 282)">
      <!-- Pill 1: Tensor -->
      <rect x="0" y="0" width="138" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="69" y="14" font-size="8.5" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">Tensor</text>
      <text x="69" y="25" font-size="7" fill="#64748b" text-anchor="middle">Memory &amp; Zero-Copy Strides</text>

      <!-- Pill 2: Autograd -->
      <rect x="150" y="0" width="138" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="219" y="14" font-size="8.5" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">Function &amp; Autograd</text>
      <text x="219" y="25" font-size="7" fill="#64748b" text-anchor="middle">Topological Tape &amp; VJP</text>

      <!-- Pill 3: Layer -->
      <rect x="300" y="0" width="138" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="369" y="14" font-size="8.5" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">Layer</text>
      <text x="369" y="25" font-size="7" fill="#64748b" text-anchor="middle">Composable Parameters</text>

      <!-- Pill 4: Optimizer -->
      <rect x="450" y="0" width="140" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="520" y="14" font-size="8.5" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">Optimizer</text>
      <text x="520" y="25" font-size="7" fill="#64748b" text-anchor="middle">Param Updates &amp; State</text>
    </g>
  </g>
</svg>