<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="310" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="100" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Baseline</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Save model and workload</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Measure accuracy, bytes, time</text>
<rect x="250" y="30" width="180" height="100" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
<text x="340.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Candidate</text>
<text x="340.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Apply one transformation</text>
<text x="340.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Keep evaluation inputs fixed</text>
<rect x="470" y="30" width="180" height="100" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="560.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Recheck and benchmark</text>
<text x="560.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Check quality after the change</text>
<text x="560.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Measure the artifact that runs</text>
<path d="M 210 80 H 250 V 80" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 430 80 H 470 V 80" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="190" width="290" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="175.0" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Compare against the same baseline</text>
<text x="175.0" y="235" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Size ratio = baseline bytes / candidate bytes</text>
<text x="175.0" y="252" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Speedup = baseline time / candidate time</text>
<rect x="360" y="190" width="290" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="505.0" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Record the evidence</text>
<text x="505.0" y="235" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Report configuration and measured results</text>
<text x="505.0" y="252" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Recheck combined optimizations together</text>
</svg>
