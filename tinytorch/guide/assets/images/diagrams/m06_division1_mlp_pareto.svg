<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="270" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Left Box: Plot Canvas (ACCENT) -->
  <rect x="25" y="20" width="385" height="235" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
  <rect x="25" y="20" width="385" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#c85a17">DIVISION 1: DIGITMLP (DENSE, PARAMETER-BOUND)</text>
  <text x="35" y="56" font-size="8" fill="#6b7280">Held-Out Test Accuracy (%) vs Memory Footprint (KB)</text>

  <!-- Axes -->
  <line x1="55" y1="205" x2="380" y2="205" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="55" y1="205" x2="55" y2="70" stroke="#1f2937" stroke-width="1.2"/>
  <text x="380" y="222" text-anchor="end" font-size="7.5" font-family="monospace" fill="#1f2937">Memory Footprint (KB) →</text>
  <text x="55" y="64" font-size="7.5" font-family="monospace" fill="#1f2937">Test Accuracy (%) ↑</text>

  <!-- Ticks X -->
  <text x="55" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">0</text>
  <text x="136" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">3 KB</text>
  <text x="217" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">6 KB</text>
  <text x="298" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">9 KB</text>
  <text x="375" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">12 KB</text>

  <!-- Ticks Y -->
  <text x="50" y="207" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">85.0%</text>
  <text x="50" y="174" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">85.5%</text>
  <text x="50" y="141" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">86.0%</text>
  <text x="50" y="108" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">86.5%</text>

  <!-- Grid lines -->
  <line x1="55" y1="108" x2="380" y2="108" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="141" x2="380" y2="141" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Candidate 1: INT8 Quantized (121, 108) - Pareto Optimum -->
  <circle cx="121" cy="108" r="6" fill="#ff8246" stroke="#ffffff" stroke-width="1.8"/>
  <text x="132" y="102" font-size="7.5" font-family="monospace" font-weight="bold" fill="#ff8246">★ INT8 (2.4 KB, 86.5%) Peak</text>

  <!-- Candidate 2: Baseline FP32 (315, 108) - Dominated by INT8 (same acc, 4x larger) -->
  <circle cx="315" cy="108" r="4" fill="#9ca3af"/>
  <text x="315" y="94" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#6b7280">Baseline FP32 (9.6 KB, 86.5%) ● Dominated</text>

  <!-- Candidate 3: 50% Pruned (315, 141) - Dominated -->
  <circle cx="315" cy="141" r="4" fill="#9ca3af"/>
  <text x="315" y="154" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#6b7280">50% Pruned (9.6 KB, 86.0%) ● Dominated</text>

  <!-- Annotation Card -->
  <rect x="65" y="152" width="145" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="73" y="166" font-size="7.5" font-weight="bold" fill="#1f2937">★ Pareto Peak: INT8</text>
  <text x="73" y="178" font-size="7" fill="#6b7280">3.95× memory compression.</text>
  <text x="73" y="188" font-size="7" fill="#6b7280">100% test accuracy preserved (86.5%).</text>

  <!-- Right: Decision Card -->
  <rect x="425" y="20" width="230" height="235" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="425" y="20" width="230" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="435" y="36" font-size="9.5" font-weight="700" fill="#1f2937">SYSTEMS VERDICT: DENSE MLP</text>

  <rect x="435" y="54" width="210" height="52" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
  <text x="443" y="69" font-size="8" font-weight="bold" fill="#c85a17">★ INT8 Quantization (Pareto Peak)</text>
  <text x="443" y="83" font-size="7.5" fill="#1f2937">Slashes memory by 3.95× (2.4 KB vs 9.6 KB)</text>
  <text x="443" y="95" font-size="7.5" fill="#1f2937">while preserving 100% test accuracy (86.5%).</text>

  <rect x="435" y="114" width="210" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="443" y="129" font-size="8" font-weight="bold" fill="#1f2937">● Baseline &amp; Pruning (Dominated)</text>
  <text x="443" y="143" font-size="7.5" fill="#6b7280">Baseline requires 4× more SRAM with zero</text>
  <text x="443" y="155" font-size="7.5" fill="#6b7280">gain in quality. Pruning drops 0.5% accuracy.</text>

  <rect x="435" y="174" width="210" height="68" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="443" y="189" font-size="8" font-weight="bold" fill="#1f2937">Storage vs Execution Note</text>
  <text x="443" y="203" font-size="7.2" fill="#6b7280">Simulated quantization unpacks to FP32</text>
  <text x="443" y="215" font-size="7.2" fill="#6b7280">for BLAS GEMM. Weight storage drops 4×,</text>
  <text x="443" y="227" font-size="7.2" fill="#6b7280">but CPU latency remains flat without HW INT8.</text>
</svg>
