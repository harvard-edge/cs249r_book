<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="270" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Left Box: Plot Canvas (ACCENT) -->
  <rect x="25" y="20" width="385" height="235" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
  <rect x="25" y="20" width="385" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#c85a17">DIVISION 2: SIMPLECNN (SPATIAL, COMPUTE-BOUND)</text>
  <text x="35" y="56" font-size="8" fill="#6b7280">Output Signal Fidelity (%) vs Memory Footprint (KB)</text>

  <!-- Axes -->
  <line x1="55" y1="205" x2="380" y2="205" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="55" y1="205" x2="55" y2="70" stroke="#1f2937" stroke-width="1.2"/>
  <text x="380" y="222" text-anchor="end" font-size="7.5" font-family="monospace" fill="#1f2937">Memory Footprint (KB) →</text>
  <text x="55" y="64" font-size="7.5" font-family="monospace" fill="#1f2937">Signal Fidelity (%) ↑</text>

  <!-- Ticks X -->
  <text x="55" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">0</text>
  <text x="148" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">1.0 KB</text>
  <text x="241" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">2.0 KB</text>
  <text x="334" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">3.0 KB</text>

  <!-- Ticks Y -->
  <text x="50" y="207" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">92%</text>
  <text x="50" y="179" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">94%</text>
  <text x="50" y="152" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">96%</text>
  <text x="50" y="125" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">98%</text>
  <text x="50" y="98" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">100%</text>

  <!-- Grid lines -->
  <line x1="55" y1="98" x2="380" y2="98" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="165" x2="380" y2="165" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Pareto Frontier Line -->
  <line x1="121" y1="98" x2="302" y2="98" stroke="#ff8246" stroke-width="2.5"/>

  <!-- Candidate 1: INT8 Quantized (121, 98) -->
  <circle cx="121" cy="98" r="5" fill="#ff8246" stroke="#ffffff" stroke-width="1.5"/>
  <text x="132" y="93" font-size="7.5" font-family="monospace" font-weight="bold" fill="#ff8246">★ INT8 (0.71 KB, 100%)</text>

  <!-- Candidate 2: Baseline FP32 (302, 98) -->
  <circle cx="302" cy="98" r="4.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="302" y="86" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#1f2937">Baseline FP32 (2.66 KB, 100%) ★</text>

  <!-- Candidate 3: 50% Pruned (302, 165) -->
  <circle cx="302" cy="165" r="3.5" fill="#9ca3af"/>
  <text x="302" y="177" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#6b7280">50% Pruned (2.7 KB, 95%) ● Dominated</text>

  <!-- Annotation Card -->
  <rect x="65" y="145" width="145" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="73" y="159" font-size="7.5" font-weight="bold" fill="#1f2937">★ Pareto: INT8 Compression</text>
  <text x="73" y="171" font-size="7" fill="#6b7280">3.7× footprint reduction.</text>
  <text x="73" y="181" font-size="7" fill="#6b7280">100% output signal fidelity.</text>

  <!-- Right: Decision Card -->
  <rect x="425" y="20" width="230" height="235" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="425" y="20" width="230" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="435" y="36" font-size="9.5" font-weight="700" fill="#1f2937">SYSTEMS VERDICT: SPATIAL CNN</text>

  <rect x="435" y="54" width="210" height="52" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
  <text x="443" y="69" font-size="8" font-weight="bold" fill="#c85a17">Kernel Acceleration (Module 17)</text>
  <text x="443" y="83" font-size="7.5" fill="#1f2937">im2col lowers 7 nested loops into a single</text>
  <text x="443" y="95" font-size="7.5" fill="#1f2937">contiguous BLAS GEMM for &gt;70× speedup.</text>

  <rect x="435" y="114" width="210" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="443" y="129" font-size="8" font-weight="bold" fill="#1f2937">★ INT8 Quantization (Pareto)</text>
  <text x="443" y="143" font-size="7.5" fill="#6b7280">Compresses weights from 2.66 KB to 714 B</text>
  <text x="443" y="155" font-size="7.5" fill="#6b7280">with 100.0% output signal preservation.</text>

  <rect x="435" y="174" width="210" height="68" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="443" y="189" font-size="8" font-weight="bold" fill="#1f2937">● Unstructured Pruning (Discarded)</text>
  <text x="443" y="203" font-size="7.2" fill="#6b7280">Incurs 5% signal distortion without</text>
  <text x="443" y="215" font-size="7.2" fill="#6b7280">saving dense memory allocations.</text>
  <text x="443" y="227" font-size="7.2" fill="#6b7280">Kernel lowering provides actual compute gains.</text>
</svg>
