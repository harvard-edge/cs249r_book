<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="300" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Left Container: The 1969 Crisis -->
  <rect x="25" y="20" width="305" height="260" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="20" width="305" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9" font-weight="700" fill="#1f2937">1969: SINGLE LAYER (LINEAR INSEPARABILITY)</text>
  <text x="262" y="36" font-size="8" font-family="monospace" fill="#dc2626">CRISIS</text>

  <!-- 2D Coordinate Grid -->
  <g transform="translate(50, 58)">
    <!-- Axes -->
    <line x1="30" y1="130" x2="170" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="30" y1="130" x2="30" y2="10" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <text x="165" y="144" font-size="8" font-family="monospace" fill="#6b7280">x₁</text>
    <text x="18" y="18" font-size="8" font-family="monospace" fill="#6b7280">x₂</text>

    <!-- Tick marks and labels -->
    <text x="48" y="142" font-size="7.5" font-family="monospace" fill="#6b7280">0</text>
    <text x="128" y="142" font-size="7.5" font-family="monospace" fill="#6b7280">1</text>
    <text x="18" y="112" font-size="7.5" font-family="monospace" fill="#6b7280">0</text>
    <text x="18" y="42" font-size="7.5" font-family="monospace" fill="#6b7280">1</text>

    <!-- Grid box (0,0) to (1,1) -->
    <rect x="50" y="38" width="80" height="70" fill="none" stroke="#e2e8f0" stroke-dasharray="2,2"/>

    <!-- Point (0,0) = Class 0 -->
    <circle cx="50" cy="108" r="6" fill="#ff8246"/>
    <text x="50" y="123" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#c85a17">(0,0):0</text>

    <!-- Point (1,1) = Class 0 -->
    <circle cx="130" cy="38" r="6" fill="#ff8246"/>
    <text x="130" y="30" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#c85a17">(1,1):0</text>

    <!-- Point (0,1) = Class 1 -->
    <circle cx="50" cy="38" r="6" fill="#1e293b"/>
    <text x="50" y="30" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#1e293b">(0,1):1</text>

    <!-- Point (1,0) = Class 1 -->
    <circle cx="130" cy="108" r="6" fill="#1e293b"/>
    <text x="130" y="123" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#1e293b">(1,0):1</text>

    <!-- Failing Attempted Lines -->
    <line x1="25" y1="85" x2="160" y2="60" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="162" y="63" font-size="7" font-weight="bold" fill="#dc2626">Line 1: 50%</text>

    <line x1="90" y1="20" x2="90" y2="130" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="95" y="20" font-size="7" font-weight="bold" fill="#dc2626">Line 2: 50%</text>
  </g>

  <!-- Left Footer Explanation -->
  <rect x="35" y="214" width="285" height="56" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="230" font-size="8" font-weight="700" fill="#1f2937">Minsky &amp; Papert's Proof:</text>
  <text x="45" y="244" font-size="7.5" fill="#475569">A single hyperplane can never separate the diagonals.</text>
  <text x="45" y="258" font-size="7.5" font-weight="bold" fill="#dc2626">Max accuracy = 75% • Triggered the 17-Year AI Winter</text>

  <!-- Right Container: The 1986 Solution (ACCENT) -->
  <rect x="350" y="20" width="305" height="260" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.4"/>
  <rect x="350" y="20" width="305" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
  <text x="360" y="36" font-size="9" font-weight="700" fill="#c85a17">1986: TWO-LAYER MLP (SPACE FOLDING)</text>
  <text x="585" y="36" font-size="8" font-family="monospace" font-weight="bold" fill="#16a34a">SOLVED</text>

  <!-- Transformed Hidden Space Plot -->
  <g transform="translate(375, 58)">
    <!-- Axes in Hidden Space h1, h2 -->
    <line x1="30" y1="130" x2="170" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <line x1="30" y1="130" x2="30" y2="10" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow-gray)"/>
    <text x="165" y="144" font-size="8" font-family="monospace" fill="#6b7280">h₁</text>
    <text x="18" y="18" font-size="8" font-family="monospace" fill="#6b7280">h₂</text>

    <!-- Transformed Points under ReLU -->
    <!-- (0,0) -> (0,0) Class 0 -->
    <circle cx="35" cy="125" r="6" fill="#ff8246"/>
    <text x="35" y="142" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#c85a17">(0,0)</text>

    <!-- (1,1) -> Folded nearby Class 0 -->
    <circle cx="55" cy="125" r="6" fill="#ff8246"/>
    <text x="58" y="114" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#c85a17">(1,1)</text>

    <!-- (0,1) and (1,0) -> Lifted to separate region Class 1 -->
    <circle cx="110" cy="55" r="6" fill="#1e293b"/>
    <text x="110" y="46" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#1e293b">(0,1)</text>

    <circle cx="145" cy="55" r="6" fill="#1e293b"/>
    <text x="145" y="46" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#1e293b">(1,0)</text>

    <!-- Clean Linear Separator in Hidden Space -->
    <line x1="25" y1="75" x2="165" y2="105" stroke="#16a34a" stroke-width="1.8"/>
    <text x="140" y="102" font-size="7.5" font-weight="bold" fill="#16a34a">w₂ᵀ·h + b₂ = 0</text>
  </g>

  <!-- Right Footer Explanation -->
  <rect x="360" y="214" width="285" height="56" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
  <text x="370" y="230" font-size="8" font-weight="700" fill="#c85a17">Rumelhart, Hinton &amp; Williams (1986):</text>
  <text x="370" y="244" font-size="7.5" fill="#475569">Hidden layer + ReLU bends input coordinates into line-separable space.</text>
  <text x="370" y="258" font-size="7.5" font-weight="bold" fill="#16a34a">Accuracy = 100% • Loss collapses to 0.005</text>

</svg>