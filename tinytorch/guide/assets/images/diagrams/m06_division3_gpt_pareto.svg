<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="270" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Left Box: Plot Canvas (ACCENT) -->
  <rect x="25" y="20" width="385" height="235" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
  <rect x="25" y="20" width="385" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#c85a17">DIVISION 3: TINYGPT (AUTOREGRESSIVE SERVING)</text>
  <text x="35" y="56" font-size="8" fill="#6b7280">Memory Footprint (KB) vs Replay Latency (ms)</text>

  <!-- Axes -->
  <line x1="55" y1="205" x2="380" y2="205" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="55" y1="205" x2="55" y2="70" stroke="#1f2937" stroke-width="1.2"/>
  <text x="380" y="222" text-anchor="end" font-size="7.5" font-family="monospace" fill="#1f2937">Replay Latency (ms) →</text>
  <text x="55" y="64" font-size="7.5" font-family="monospace" fill="#1f2937">Footprint (KB) ↑</text>

  <!-- Ticks X (3.0 to 6.0 ms) -->
  <text x="55" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">3.0 ms</text>
  <text x="163" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">4.0 ms</text>
  <text x="271" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">5.0 ms</text>
  <text x="380" y="215" text-anchor="middle" font-size="7" font-family="monospace" fill="#6b7280">6.0 ms</text>

  <!-- Ticks Y (0 to 160 KB) -->
  <text x="50" y="207" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">0</text>
  <text x="50" y="174" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">40 KB</text>
  <text x="50" y="141" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">80 KB</text>
  <text x="50" y="108" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">120 KB</text>
  <text x="50" y="75" text-anchor="end" font-size="7" font-family="monospace" fill="#6b7280">160 KB</text>

  <!-- Grid lines -->
  <line x1="55" y1="108" x2="380" y2="108" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="141" x2="380" y2="141" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="55" y1="174" x2="380" y2="174" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Pareto Frontier Curve -->
  <path d="M 101 102 Q 103 155, 103 169 T 251 182" fill="none" stroke="#ff8246" stroke-width="2.5"/>

  <!-- Candidate 1: Full Stack (103, 169) - 3.44 ms, 45 KB -->
  <circle cx="103" cy="169" r="5.5" fill="#ff8246" stroke="#ffffff" stroke-width="1.5"/>
  <text x="113" y="167" font-size="7.5" font-family="monospace" font-weight="bold" fill="#ff8246">Full Stack (3.4 ms, 45 KB) ★ Peak</text>

  <!-- Candidate 2: KV-Cached (101, 102) - 3.42 ms, 130 KB -->
  <circle cx="101" cy="102" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <text x="111" y="99" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1f2937">KV-Cached (3.4 ms, 130 KB) ★</text>

  <!-- Candidate 3: INT8 Quantized (251, 182) - 4.81 ms, 29 KB -->
  <circle cx="251" cy="182" r="4" fill="#ffffff" stroke="#ff8246" stroke-width="1.5"/>
  <text x="259" y="185" font-size="7" font-family="monospace" fill="#1f2937">INT8 Recompute (4.8 ms, 29 KB) ★</text>

  <!-- Candidate 4: Baseline FP32 (265, 115) - 4.94 ms, 113 KB -->
  <circle cx="265" cy="115" r="3.5" fill="#9ca3af"/>
  <text x="265" y="128" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#6b7280">Baseline FP32 (4.9 ms, 113 KB) ● Dominated</text>

  <!-- Right: Decision Card -->
  <rect x="425" y="20" width="230" height="235" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="425" y="20" width="230" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="435" y="36" font-size="9.5" font-weight="700" fill="#1f2937">SYSTEMS VERDICT: TINYGPT</text>

  <rect x="435" y="54" width="210" height="52" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
  <text x="443" y="69" font-size="8" font-weight="bold" fill="#c85a17">★ Full Stack (Pareto Peak)</text>
  <text x="443" y="83" font-size="7.5" fill="#1f2937">Combines O(1) KV-caching with INT8 weights.</text>
  <text x="443" y="95" font-size="7.5" fill="#1f2937">Fastest latency + ultra-compact 45 KB footprint.</text>

  <rect x="435" y="114" width="210" height="52" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="443" y="129" font-size="8" font-weight="bold" fill="#1f2937">KV-Cache Memoization (Mod 18)</text>
  <text x="443" y="143" font-size="7.5" fill="#6b7280">Eliminates quadratic recomputation, cutting</text>
  <text x="443" y="155" font-size="7.5" fill="#6b7280">replay time from 4.94 ms to 3.42 ms (1.44× faster).</text>

  <rect x="435" y="174" width="210" height="68" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="443" y="189" font-size="8" font-weight="bold" fill="#1f2937">Exact Numerical Equivalence</text>
  <text x="443" y="203" font-size="7.2" fill="#6b7280">Memoized attention guarantees 100.0% logit</text>
  <text x="443" y="215" font-size="7.2" fill="#6b7280">cosine fidelity against full recomputation.</text>
  <text x="443" y="227" font-size="7.2" fill="#6b7280">Zero representation loss across all tokens.</text>
</svg>
