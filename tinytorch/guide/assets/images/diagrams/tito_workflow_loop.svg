<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="280" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Container 1: The Daily Development Loop -->
  <rect x="25" y="20" width="630" height="134" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="20" width="630" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#1f2937">THE DAILY DEVELOPMENT LOOP: FROM SPECIFICATION TO EXPORT</text>
  <text x="480" y="36" font-size="8.5" font-family="monospace" fill="#6b7280">Non-Destructive • In-Place</text>

  <!-- Step 1: Start Module -->
  <g transform="translate(40, 54)">
    <rect x="0" y="0" width="124" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="62" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">1. Start / Resume</text>
    <text x="62" y="31" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">tito module start</text>
    <text x="62" y="45" text-anchor="middle" font-size="7.5" fill="#6b7280">Creates local notebook</text>
    <text x="62" y="55" text-anchor="middle" font-size="7" font-family="monospace" fill="#9ca3af">modules/NN_name/</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 164 85 H 192" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Step 2: Implement -->
  <g transform="translate(192, 54)">
    <rect x="0" y="0" width="124" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="62" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">2. Implement</text>
    <text x="62" y="31" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">VS Code / Jupyter</text>
    <text x="62" y="45" text-anchor="middle" font-size="7.5" fill="#6b7280">Fill stubs &amp; inline tests</text>
    <text x="62" y="55" text-anchor="middle" font-size="7" font-family="monospace" fill="#9ca3af"># YOUR CODE HERE</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 316 85 H 344" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Step 3: Test Incrementally -->
  <g transform="translate(344, 54)">
    <rect x="0" y="0" width="124" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="62" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">3. Test Fast</text>
    <text x="62" y="31" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">tito module test</text>
    <text x="62" y="45" text-anchor="middle" font-size="7.5" fill="#6b7280">Run CLI tests anytime</text>
    <text x="62" y="55" text-anchor="middle" font-size="7" font-family="monospace" fill="#9ca3af">Zero state side effects</text>
  </g>

  <!-- Feedback Loop: Step 3 back to Step 2 if tests fail -->
  <path d="M 406 116 V 134 H 254 V 118" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-gray)"/>
  <text x="330" y="142" text-anchor="middle" font-size="7" font-style="italic" fill="#6b7280">tests fail • edit &amp; rerun</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 468 85 H 496" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- Step 4: Complete & Export (ACCENT) -->
  <g transform="translate(496, 54)">
    <rect x="0" y="0" width="140" height="62" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
    <text x="70" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c85a17">4. Complete &amp; Export</text>
    <text x="70" y="31" text-anchor="middle" font-size="8" font-family="monospace" font-weight="700" fill="#c85a17">tito module complete</text>
    <text x="70" y="45" text-anchor="middle" font-size="7.5" fill="#c85a17">4-stage verification</text>
    <text x="70" y="55" text-anchor="middle" font-size="7" font-family="monospace" fill="#c85a17">exports to tinytorch/</text>
  </g>

  <!-- Downward Flow from Step 4 to Container 2 -->
  <path d="M 566 116 V 166" fill="none" stroke="#ff8246" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <text x="572" y="145" font-size="7" font-weight="bold" fill="#ff8246">all pass</text>

  <!-- Container 2: Downstream Outcome -->
  <rect x="25" y="166" width="630" height="94" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="25" y="166" width="630" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="35" y="182" font-size="9.5" font-weight="700" fill="#1f2937">DOWNSTREAM OUTCOME: WHAT MODULE COMPLETION PRODUCES</text>

  <!-- Outcome 1: Core Package Export -->
  <g transform="translate(40, 198)">
    <rect x="0" y="0" width="180" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#1f2937">Core Package Export</text>
    <text x="12" y="30" font-size="7.5" font-family="monospace" fill="#1f2937">tinytorch/core/*.py</text>
    <text x="12" y="43" font-size="7.5" fill="#6b7280">Clean Python code, importable</text>
  </g>

  <!-- Outcome 2: Progress Ledger -->
  <g transform="translate(232, 198)">
    <rect x="0" y="0" width="180" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#1f2937">Progress Ledger Verified</text>
    <text x="12" y="30" font-size="7.5" font-family="monospace" fill="#1f2937">.tito/progress.json</text>
    <text x="12" y="43" font-size="7.5" fill="#6b7280">Module marked done in status</text>
  </g>

  <!-- Outcome 3: Milestone & Next Step (ACCENT) -->
  <g transform="translate(424, 198)">
    <rect x="0" y="0" width="212" height="52" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#c85a17">Next Module &amp; Milestones</text>
    <text x="12" y="30" font-size="7.5" font-family="monospace" font-weight="700" fill="#c85a17">tito milestone run &lt;name&gt;</text>
    <text x="12" y="43" font-size="7.5" fill="#c85a17">Historical capabilities unlocked</text>
  </g>

</svg>