<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="280" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Container 1: Forward Inference Flow -->
  <rect x="25" y="20" width="630" height="128" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="20" width="630" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#1f2937">ROSENBLATT'S 1958 PERCEPTRON: THE FORWARD PASS (YOUR CODE)</text>
  <text x="470" y="36" font-size="8.5" font-family="monospace" fill="#6b7280">Forward Inference Only</text>

  <!-- Node 1: Input Tensor -->
  <g transform="translate(40, 54)">
    <rect x="0" y="0" width="120" height="58" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">Input Features</text>
    <text x="60" y="30" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">x = [x₁, x₂]</text>
    <text x="60" y="46" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 01: Tensor</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 160 83 H 192" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Node 2: Linear Layer -->
  <g transform="translate(192, 54)">
    <rect x="0" y="0" width="132" height="58" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="66" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">Linear Projection</text>
    <text x="66" y="30" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">z = x · Wᵀ + b</text>
    <text x="66" y="46" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 03: Linear</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 324 83 H 356" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Node 3: Sigmoid Activation -->
  <g transform="translate(356, 54)">
    <rect x="0" y="0" width="126" height="58" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="63" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f2937">Activation</text>
    <text x="63" y="30" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">y = σ(z) ∈ (0, 1)</text>
    <text x="63" y="46" text-anchor="middle" font-size="7.5" fill="#6b7280">Module 02: Sigmoid</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 482 83 H 514" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- Node 4: Decision (ACCENT) -->
  <g transform="translate(514, 54)">
    <rect x="0" y="0" width="125" height="58" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
    <text x="62" y="16" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c85a17">Classification</text>
    <text x="62" y="30" text-anchor="middle" font-size="8" font-family="monospace" font-weight="700" fill="#c85a17">ŷ = 1 if y ≥ 0.5</text>
    <text x="62" y="46" text-anchor="middle" font-size="7.5" fill="#c85a17">Binary Output</text>
  </g>

  <!-- Container 2: Missing Feedback Loop -->
  <rect x="25" y="160" width="630" height="102" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="25" y="160" width="630" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="35" y="176" font-size="9.5" font-weight="700" fill="#1f2937">THE 1958 DILEMMA: WHY RANDOM WEIGHTS REMAIN ARBITRARY</text>

  <!-- Missing Loop Card 1 -->
  <g transform="translate(40, 194)">
    <rect x="0" y="0" width="180" height="56" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#1f2937">1. Untrained Weights</text>
    <text x="12" y="32" font-size="7.5" font-family="monospace" fill="#6b7280">W ~ Uniform(-1, 1)</text>
    <text x="12" y="46" font-size="7.5" fill="#6b7280">Weights are random numbers</text>
  </g>

  <!-- Missing Loop Card 2 -->
  <g transform="translate(235, 194)">
    <rect x="0" y="0" width="180" height="56" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#1f2937">2. No Feedback Loop</text>
    <text x="12" y="32" font-size="7.5" font-family="monospace" fill="#6b7280">Loss (04) &amp; Autograd (06)</text>
    <text x="12" y="46" font-size="7.5" fill="#6b7280">No error gradient signal yet</text>
  </g>

  <!-- Missing Loop Card 3 (ACCENT) -->
  <g transform="translate(430, 194)">
    <rect x="0" y="0" width="209" height="56" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8.5" font-weight="700" fill="#c85a17">3. The Historical Lesson</text>
    <text x="12" y="32" font-size="7.5" font-weight="bold" fill="#c85a17">Accuracy depends on luck</text>
    <text x="12" y="46" font-size="7.5" fill="#c85a17">Learning is what makes AI intelligent</text>
  </g>

</svg>