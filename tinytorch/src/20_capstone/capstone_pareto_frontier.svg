<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120" viewBox="0 0 220 120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="120" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="110" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="18" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="17" font-size="8.5" font-weight="700" fill="#1f2937">CAPSTONE OPTIMIZATION PARETO</text>

  <!-- Axes & Grid -->
  <!-- Y Axis -->
  <line x1="30" y1="32" x2="30" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="28" text-anchor="middle" font-size="4.5" font-family="monospace" fill="#64748b">PPL</text>

  <text x="26" y="42" text-anchor="end" font-size="4" font-family="monospace" fill="#9ca3af">18.7</text>
  <line x1="28" y1="40" x2="30" y2="40" stroke="#cbd5e1" stroke-width="0.8"/>

  <text x="26" y="54" text-anchor="end" font-size="4" font-family="monospace" fill="#9ca3af">18.4</text>
  <line x1="28" y1="52" x2="30" y2="52" stroke="#cbd5e1" stroke-width="0.8"/>

  <text x="26" y="62" text-anchor="end" font-size="4" font-family="monospace" fill="#9ca3af">18.2</text>
  <line x1="28" y1="60" x2="30" y2="60" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- X Axis (Scale: 1x to 5x, 32px per 1x) -->
  <line x1="30" y1="72" x2="198" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <text x="198" y="68" text-anchor="end" font-size="4.6" font-family="monospace" fill="#64748b">Throughput →</text>

  <!-- X Ticks -->
  <line x1="50" y1="72" x2="50" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="50" y="80" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#9ca3af">1×</text>

  <line x1="82" y1="72" x2="82" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="82" y="80" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#9ca3af">2×</text>

  <line x1="114" y1="72" x2="114" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="114" y="80" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#9ca3af">3×</text>

  <line x1="146" y1="72" x2="146" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="146" y="80" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#9ca3af">4×</text>

  <line x1="178" y1="72" x2="178" y2="74" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="178" y="80" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#9ca3af">5×</text>

  <!-- Pareto Frontier Connecting Path -->
  <!-- 1.0x at 50, 1.4x at 62.8, 2.8x at 107.6, 4.8x at 171.6 -->
  <path d="M 50 60 Q 56 55 62.8 52 Q 85 43 107.6 40 L 171.6 40" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>

  <!-- Point 1: Baseline (1.0x, PPL 18.2) -->
  <circle cx="50" cy="60" r="2.5" fill="#9ca3af"/>
  <line x1="50" y1="57" x2="50" y2="50" stroke="#9ca3af" stroke-width="0.6"/>
  <text x="50" y="47" text-anchor="middle" font-size="4.5" fill="#6b7280">1. Baseline</text>
  <text x="50" y="68" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#9ca3af">1.0×</text>

  <!-- Point 2: Distilled (1.4x, PPL 18.4) -->
  <circle cx="62.8" cy="52" r="2.5" fill="#6b7280"/>
  <text x="64" y="46" font-size="4.5" fill="#6b7280">2. Distilled</text>
  <text x="62.8" y="65" text-anchor="middle" font-size="4.2" font-family="monospace" fill="#6b7280">1.4×</text>

  <!-- Point 3: INT8 (2.8x, PPL 18.7) -->
  <circle cx="107.6" cy="40" r="2.5" fill="#c85a17"/>
  <text x="107.6" y="32" text-anchor="middle" font-size="5" font-weight="bold" fill="#c85a17">3. INT8</text>
  <text x="107.6" y="50" text-anchor="middle" font-size="4.5" font-family="monospace" font-weight="bold" fill="#c85a17">2.8×</text>

  <!-- Point 4: Fused + Cached (4.8x, PPL 18.7) -->
  <circle cx="171.6" cy="40" r="3.5" fill="#ff8246" stroke="#c85a17" stroke-width="1"/>
  <text x="171.6" y="31" text-anchor="middle" font-size="5.2" font-weight="bold" fill="#c85a17">4. Fused+Cached</text>
  <text x="171.6" y="51" text-anchor="middle" font-size="4.8" font-family="monospace" font-weight="bold" fill="#c85a17">4.8×</text>

  <!-- Summary Badge -->
  <rect x="25" y="86" width="170" height="19" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
  <text x="110" y="98" text-anchor="middle" font-size="5.8" font-weight="bold" fill="#c85a17">Total speedup: 4.8× · Footprint reduced 75%</text>
</svg>
