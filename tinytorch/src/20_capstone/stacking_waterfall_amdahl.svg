<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
    </marker>
  </defs>

  <!-- Title & Scope Header -->
  <rect x="25" y="10" width="630" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="26" font-size="9" font-weight="700" fill="#1f2937">CUMULATIVE LATENCY COLLAPSE ACROSS OPTIMIZATION TIERS</text>
  <text x="645" y="26" text-anchor="end" font-size="8" font-family="monospace" fill="#64748b">MEASURED PER-TOKEN GENERATION TIME (FP32 BASELINE = 100.0 ms)</text>

  <!-- Latency Y Axis (0 to 100 ms, 1.4 px / ms) -->
  <line x1="50" y1="45" x2="50" y2="185" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="49" text-anchor="end" font-size="7.5" font-family="monospace" fill="#64748b">100 ms</text>
  <line x1="47" y1="45" x2="50" y2="45" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="50" y1="45" x2="650" y2="45" stroke="#f1f5f9" stroke-dasharray="3,3" stroke-width="0.8"/>

  <text x="44" y="84" text-anchor="end" font-size="7.5" font-family="monospace" fill="#9ca3af">75 ms</text>
  <line x1="47" y1="80" x2="50" y2="80" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="50" y1="80" x2="650" y2="80" stroke="#f8fafc" stroke-dasharray="3,3" stroke-width="0.8"/>

  <text x="44" y="119" text-anchor="end" font-size="7.5" font-family="monospace" fill="#9ca3af">50 ms</text>
  <line x1="47" y1="115" x2="50" y2="115" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="50" y1="115" x2="650" y2="115" stroke="#f8fafc" stroke-dasharray="3,3" stroke-width="0.8"/>

  <text x="44" y="154" text-anchor="end" font-size="7.5" font-family="monospace" fill="#9ca3af">25 ms</text>
  <line x1="47" y1="150" x2="50" y2="150" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="50" y1="150" x2="650" y2="150" stroke="#f1f5f9" stroke-dasharray="3,3" stroke-width="0.8"/>

  <text x="44" y="188" text-anchor="end" font-size="7.5" font-family="monospace" fill="#64748b">0 ms</text>

  <!-- Ground Line -->
  <line x1="45" y1="185" x2="655" y2="185" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Bar 1: Baseline (100.0 ms -> height 140px) -->
  <rect x="60" y="45" width="95" height="140" rx="1" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="107" y="65" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f2937">Baseline</text>
  <text x="107" y="80" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#64748b">100.0 ms</text>
  <text x="107" y="115" text-anchor="middle" font-size="7.5" fill="#6b7280">Naive Python</text>
  <text x="107" y="128" text-anchor="middle" font-size="7.5" fill="#6b7280">&amp; dynamic</text>
  <text x="107" y="141" text-anchor="middle" font-size="7.5" fill="#6b7280">allocations</text>
  <rect x="70" y="155" width="75" height="16" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="107" y="166" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#64748b">1.0× (Ref)</text>

  <!-- Step 1 Arrow -->
  <line x1="160" y1="115" x2="175" y2="115" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Bar 2: + Vectorized (25.0 ms -> height 35px) -->
  <text x="227" y="95" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1f2937">+ Vectorized</text>
  <text x="227" y="108" text-anchor="middle" font-size="7.5" fill="#6b7280">BLAS GEMM</text>
  <rect x="180" y="116" width="95" height="18" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="227" y="128" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#1f2937">4.0× (25.0 ms)</text>
  <!-- True scale bar -->
  <rect x="180" y="150" width="95" height="35" rx="1" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="227" y="171" text-anchor="middle" font-size="8" font-family="monospace" font-weight="bold" fill="#1f2937">25.0 ms</text>

  <!-- Step 2 Arrow -->
  <line x1="280" y1="130" x2="295" y2="130" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Bar 3: + Fused (10.0 ms -> height 14px) -->
  <text x="347" y="115" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1f2937">+ Fused</text>
  <text x="347" y="128" text-anchor="middle" font-size="7.5" fill="#6b7280">Register reuse</text>
  <rect x="300" y="136" width="95" height="18" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="347" y="148" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#1f2937">10.0× (10.0 ms)</text>
  <!-- True scale bar -->
  <rect x="300" y="171" width="95" height="14" rx="1" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Step 3 Arrow -->
  <line x1="400" y1="145" x2="415" y2="145" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- Bar 4: + INT8 Quant (4.0 ms -> height 5.6px) -->
  <text x="467" y="130" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1f2937">+ INT8 Quant</text>
  <text x="467" y="143" text-anchor="middle" font-size="7.5" fill="#6b7280">4× Memory choke relief</text>
  <rect x="420" y="151" width="95" height="18" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="467" y="163" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#1f2937">25.0× (4.0 ms)</text>
  <!-- True scale bar -->
  <rect x="420" y="179.4" width="95" height="5.6" rx="1" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>

  <!-- Step 4 Arrow -->
  <line x1="520" y1="155" x2="535" y2="155" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- Bar 5: + KV Cache (1.2 ms -> height 2.5px floor, ACCENT) -->
  <rect x="545" y="125" width="105" height="42" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="597" y="140" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#c85a17">+ KV Cache</text>
  <text x="597" y="152" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#c85a17">1.2 ms (83×)</text>
  <text x="597" y="162" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#ff8246">O(N) vs O(N²)</text>
  <!-- True scale bar -->
  <rect x="545" y="182.5" width="105" height="2.5" rx="0.5" fill="#ff8246" stroke="#c85a17" stroke-width="0.8"/>

  <!-- Bottom: Amdahl Law Box -->
  <rect x="25" y="200" width="630" height="72" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="200" width="630" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="215" font-size="9" font-weight="700" fill="#1f2937">AMDAHL'S LAW CEILING: S_max = 1 / ( (1 - P) + P / S )</text>
  <text x="35" y="238" font-size="8.2" fill="#6b7280">Once tensor math is 99% accelerated (P = 0.99), Python bytecode interpreter dispatch (the 1% serial tail) caps overall speedup at 100×.</text>
  <text x="35" y="252" font-size="8.2" fill="#6b7280">At 1.2 ms, runtime dispatch takes ~0.4 ms (33% of execution time). Further gains require ahead-of-time compilation (C++ / CUDA).</text>

  <!-- Bottom Annotation -->
  <text x="340" y="295" text-anchor="middle" font-size="8.5" fill="#6b7280">Compounding optimizations address orthogonal bottlenecks until Amdahl's Law shifts the constraint to language runtime overhead.</text>
</svg>
