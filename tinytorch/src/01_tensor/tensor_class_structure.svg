<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <rect width="680" height="280" fill="#ffffff"/>

  <defs>
    <style>
      .hdr { font-family: 'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 700; }
      .txt { font-family: 'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; fill: #4b5563; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #1f2937; }
      .acc-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #c85a17; font-weight: 600; }
      .dim-txt { font-family: 'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif; font-size: 8px; fill: #9ca3af; }
    </style>
  </defs>

  <!-- Left: Core Storage & Attributes (Accent Card) -->
  <g transform="translate(20, 20)">
    <rect width="200" height="235" rx="4" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
    <path d="M 0,4 Q 0,0 4,0 L 196,0 Q 200,0 200,4 L 200,26 L 0,26 Z" fill="#fff1e8"/>
    <text x="12" y="17" class="hdr" fill="#c85a17">Tensor Core State</text>
    
    <text x="12" y="46" class="code">data: np.ndarray</text>
    <text x="12" y="58" class="dim-txt">Underlying contiguous buffer</text>

    <text x="12" y="78" class="code">shape: Tuple[int, ...]</text>
    <text x="12" y="90" class="dim-txt">Dimensional coordinate axes</text>

    <text x="12" y="110" class="code">dtype: np.dtype</text>
    <text x="12" y="122" class="dim-txt">Precision (default: float32)</text>

    <text x="12" y="142" class="code">grad: Optional[Tensor]</text>
    <text x="12" y="154" class="dim-txt">Accumulated gradient values</text>

    <text x="12" y="174" class="code">creator: Optional[Function]</text>
    <text x="12" y="186" class="dim-txt">Autograd operation history</text>

    <rect x="10" y="202" width="180" height="22" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8"/>
    <text x="16" y="216" class="acc-code">Autonomous Data Structure</text>
  </g>

  <!-- Middle: Operations & Methods -->
  <g transform="translate(235, 20)">
    <!-- Arithmetic & Linear -->
    <rect width="215" height="112" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 211,0 Q 215,0 215,4 L 215,24 L 0,24 Z" fill="#f1f5f9"/>
    <text x="12" y="16" class="hdr" fill="#1f2937">Arithmetic &amp; Linear Algebra</text>

    <text x="12" y="42" class="code">__add__, __sub__, __mul__, __truediv__</text>
    <text x="12" y="54" class="dim-txt">Element-wise broadcasting operations</text>

    <text x="12" y="72" class="code">matmul(other), @ operator</text>
    <text x="12" y="84" class="dim-txt">Inner-dimension contract (M×K @ K×N)</text>

    <text x="12" y="100" class="code">sum(), mean(), max()</text>

    <!-- Shape & Memory Transformation -->
    <g transform="translate(0, 122)">
      <rect width="215" height="113" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
      <path d="M 0,4 Q 0,0 4,0 L 211,0 Q 215,0 215,4 L 215,24 L 0,24 Z" fill="#f1f5f9"/>
      <text x="12" y="16" class="hdr" fill="#1f2937">Shape &amp; View Transformation</text>

      <text x="12" y="42" class="code">reshape(*shape)  /  view(*shape)</text>
      <text x="12" y="54" class="dim-txt">Zero-copy strides when contiguous</text>

      <text x="12" y="72" class="code">transpose(*axes), .T</text>
      <text x="12" y="84" class="dim-txt">Permute dimensional strides</text>

      <text x="12" y="100" class="code">contiguous(), masked_fill()</text>
    </g>
  </g>

  <!-- Right: Computational Delegation -->
  <g transform="translate(465, 20)">
    <rect width="195" height="235" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <path d="M 0,4 Q 0,0 4,0 L 191,0 Q 195,0 195,4 L 195,24 L 0,24 Z" fill="#f1f5f9"/>
    <text x="12" y="16" class="hdr" fill="#1f2937">Operation Delegation</text>

    <text x="12" y="46" class="txt">Tensors never compute ops directly.</text>
    <text x="12" y="58" class="txt">All forward/backward passes delegate</text>
    <text x="12" y="70" class="txt">to <tspan class="code">Function</tspan> subclasses:</text>

    <!-- Delegation Flow Box -->
    <rect x="10" y="84" width="175" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="18" y="101" class="code">Tensor.apply(Function, *args)</text>
    <text x="18" y="116" class="dim-txt">Builds DAG dynamic history</text>

    <text x="12" y="146" class="code">Utility &amp; Inspection</text>
    <text x="12" y="162" class="code">• memory_footprint()</text>
    <text x="12" y="176" class="code">• numpy() -&gt; np.ndarray</text>
    <text x="12" y="190" class="code">• __repr__(), __str__()</text>
    <text x="12" y="204" class="code">• ndim, numel</text>

    <line x1="12" y1="218" x2="183" y2="218" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="12" y="230" class="dim-txt">Foundation for Modules 02–20</text>
  </g>
</svg>