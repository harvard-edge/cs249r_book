<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="500" height="460" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker></defs>
<rect x="130" y="30" width="240" height="55" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="250.0" y="53.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Token IDs</text>
<text x="250.0" y="67.5" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Example: [2, 5]</text>
<path d="M250,85 V105" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="130" y="105" width="240" height="55" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="250.0" y="128.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Embeddings</text>
<text x="250.0" y="142.5" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Token + position</text>
<path d="M250,160 V180" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="130" y="180" width="240" height="55" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="250.0" y="203.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Transformer blocks × N</text>
<text x="250.0" y="217.5" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">LayerNorm, attention, residual, MLP</text>
<path d="M250,235 V255" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="130" y="255" width="240" height="55" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="250.0" y="285.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Final LayerNorm</text>
<path d="M250,310 V330" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="130" y="330" width="240" height="55" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="250.0" y="353.5" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Language head</text>
<text x="250.0" y="367.5" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Vocabulary logits</text>
<text x="250.0" y="440" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Causal attention permits each position to attend only to its prefix.</text>
</svg>
