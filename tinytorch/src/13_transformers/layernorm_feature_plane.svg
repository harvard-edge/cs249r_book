<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
    </marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
    </marker>
  </defs>

  <!-- Title Band -->
  <rect x="15" y="12" width="650" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="28" y="32" font-size="11" font-weight="700" fill="#1f2937">LAYER NORMALIZATION: FEATURE-AXIS NORMALIZATION &amp; AFFINE RESTORATION</text>
  <text x="650" y="32" text-anchor="end" font-size="9" font-family="monospace" font-weight="bold" fill="#c85a17">dim = -1 (Independent of B, S)</text>

  <!-- Stage 1: Input Tensor & Feature Slice -->
  <g transform="translate(15, 52)">
    <rect x="0" y="0" width="195" height="150" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="10" y="15" font-size="9" font-weight="700" fill="#1f2937">1. PER-TOKEN FEATURE VECTOR</text>

    <text x="10" y="38" font-size="8" font-family="monospace" fill="#475569">x[b, s, :] ∈ ℝ^{d_model}</text>

    <!-- Visual 1D token vector with highlighted elements -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="17" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">1.2</text>
      <rect x="32" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="48" y="17" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">4.8</text>
      <rect x="64" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="17" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">-0.6</text>
      <rect x="96" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="112" y="17" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">2.6</text>
      <rect x="128" y="0" width="46" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="151" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#64748b">... d_model</text>
    </g>

    <!-- Statistics Calculation -->
    <rect x="10" y="86" width="175" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="101" font-size="8" font-weight="700" fill="#1f2937">Compute Moments:</text>
    <text x="16" y="116" font-size="7.8" font-family="monospace" fill="#c85a17">μ = (1/d) Σ x_i</text>
    <text x="16" y="129" font-size="7.8" font-family="monospace" fill="#c85a17">σ² = (1/d) Σ (x_i - μ)²</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="215" y1="127" x2="238" y2="127" stroke="#ff8246" stroke-width="1.6" marker-end="url(#arrow-coral)"/>

  <!-- Stage 2: Normalization (Zero Mean, Unit Variance) -->
  <g transform="translate(242, 52)">
    <rect x="0" y="0" width="200" height="150" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="22" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="10" y="15" font-size="9" font-weight="700" fill="#c85a17">2. STANDARDIZE (ZERO-CENTER)</text>

    <text x="10" y="38" font-size="8" font-family="monospace" fill="#475569">x̂ = (x - μ) / √(σ² + ε)</text>

    <!-- Visual 1D normalized vector -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="34" height="28" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="17" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">-0.41</text>
      <rect x="34" y="0" width="34" height="28" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="51" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">+1.48</text>
      <rect x="68" y="0" width="34" height="28" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="85" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">-1.35</text>
      <rect x="102" y="0" width="34" height="28" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="119" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">+0.28</text>
      <rect x="136" y="0" width="44" height="28" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="158" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#c85a17">... x̂_d</text>
    </g>

    <!-- Properties -->
    <rect x="10" y="86" width="180" height="52" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="16" y="101" font-size="8" font-weight="700" fill="#c85a17">Normalized Properties:</text>
    <text x="16" y="116" font-size="7.8" font-family="monospace" fill="#1f2937">• E[x̂] = 0.0 (zero-centered)</text>
    <text x="16" y="129" font-size="7.8" font-family="monospace" fill="#1f2937">• Var(x̂) ≈ 1.0 (unit variance)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="447" y1="127" x2="470" y2="127" stroke="#ff8246" stroke-width="1.6" marker-end="url(#arrow-coral)"/>

  <!-- Stage 3: Learnable Affine Transform -->
  <g transform="translate(475, 52)">
    <rect x="0" y="0" width="190" height="150" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="10" y="15" font-size="9" font-weight="700" fill="#1f2937">3. LEARNABLE AFFINE</text>

    <text x="10" y="38" font-size="8" font-family="monospace" fill="#475569">y = γ ⊙ x̂ + β</text>

    <!-- Visual 1D output vector -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#1e293b">y_0</text>
      <rect x="32" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="48" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#1e293b">y_1</text>
      <rect x="64" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#1e293b">y_2</text>
      <rect x="96" y="0" width="32" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="112" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#1e293b">y_3</text>
      <rect x="128" y="0" width="42" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="149" y="17" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#64748b">... y_d</text>
    </g>

    <!-- Parameters box -->
    <rect x="10" y="86" width="170" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="101" font-size="8" font-weight="700" fill="#1f2937">Learnable Parameters:</text>
    <text x="16" y="116" font-size="7.8" font-family="monospace" fill="#1e293b">• γ ∈ ℝ^{d_model} (scale, init 1.0)</text>
    <text x="16" y="129" font-size="7.8" font-family="monospace" fill="#1e293b">• β ∈ ℝ^{d_model} (shift, init 0.0)</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <rect x="15" y="210" width="650" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="25" y="226" font-size="8" font-weight="700" fill="#1f2937">Systems Invariant:</text>
  <text x="110" y="226" font-size="7.8" fill="#475569">Normalizes across feature dimension D for each token (b, s) independently. Memory traffic is O(B · S · D).</text>
  <text x="25" y="240" font-size="7.8" fill="#64748b">Unlike BatchNorm, statistics are identical during training and single-token autoregressive decoding, preventing train-test skew.</text>
</svg>
