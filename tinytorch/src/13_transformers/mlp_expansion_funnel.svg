<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
    </marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
    </marker>
  </defs>

  <!-- Title Band -->
  <rect x="15" y="12" width="650" height="30" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="28" y="32" font-size="11" font-weight="700" fill="#1f2937">FEED-FORWARD NETWORK (MLP): TWO-STAGE EXPANSION FUNNEL</text>
  <text x="650" y="32" text-anchor="end" font-size="9" font-family="monospace" font-weight="bold" fill="#c85a17">8 · d_model² Parameters (~66% of Block)</text>

  <!-- Stage 1: Input & Up-Projection -->
  <g transform="translate(15, 52)">
    <rect x="0" y="0" width="185" height="150" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="0" y="0" width="185" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="10" y="15" font-size="9" font-weight="700" fill="#1f2937">1. EXPANSION (4× PROJECTION)</text>

    <text x="10" y="38" font-size="8" font-family="monospace" fill="#475569">h_1 = Linear_1(x) = x W_1 + b_1</text>

    <!-- Matrix Shape Visualization -->
    <rect x="10" y="48" width="165" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="64" font-size="7.5" font-family="monospace" fill="#1e293b">Input x:   [B, S, d_model]</text>
    <text x="18" y="79" font-size="7.5" font-family="monospace" fill="#c85a17">Weight W1: [d_model, 4 · d_model]</text>

    <!-- Dimension Expansion Metric -->
    <rect x="10" y="96" width="165" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="16" y="112" font-size="7.8" font-weight="700" fill="#c85a17">Dimension Growth:</text>
    <text x="16" y="128" font-size="7.8" font-family="monospace" fill="#c85a17">512 dims → 2,048 dims (4× capacity)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="205" y1="127" x2="228" y2="127" stroke="#ff8246" stroke-width="1.6" marker-end="url(#arrow-coral)"/>

  <!-- Stage 2: Non-Linear Activation (GELU) -->
  <g transform="translate(233, 52)">
    <rect x="0" y="0" width="205" height="150" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
    <rect x="0" y="0" width="205" height="22" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="10" y="15" font-size="9" font-weight="700" fill="#c85a17">2. NON-LINEAR ACTIVATION (GELU)</text>

    <text x="10" y="38" font-size="8" font-family="monospace" fill="#475569">a = GELU(h_1) ≈ 0.5x(1 + tanh(...))</text>

    <!-- Graph Representation -->
    <rect x="10" y="48" width="185" height="42" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="0.8"/>
    <!-- Axes and curve -->
    <line x1="20" y1="78" x2="180" y2="78" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="95" y1="52" x2="95" y2="86" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 30,78 Q 75,78 95,74 T 170,54" fill="none" stroke="#ff8246" stroke-width="1.8"/>
    <text x="145" y="85" font-size="6.5" font-family="monospace" fill="#64748b">Smooth curvature</text>

    <!-- Key Property -->
    <rect x="10" y="96" width="185" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="16" y="112" font-size="7.8" font-weight="700" fill="#c85a17">Differentiable Gating:</text>
    <text x="16" y="128" font-size="7.5" fill="#1f2937">Stochastic zeroing prevents dead neurons</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="443" y1="127" x2="466" y2="127" stroke="#ff8246" stroke-width="1.6" marker-end="url(#arrow-coral)"/>

  <!-- Stage 3: Contraction & Down-Projection -->
  <g transform="translate(471, 52)">
    <rect x="0" y="0" width="194" height="150" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="0" y="0" width="194" height="22" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="10" y="15" font-size="9" font-weight="700" fill="#1f2937">3. CONTRACTION (PROJECTION)</text>

    <text x="10" y="38" font-size="8" font-family="monospace" fill="#475569">output = Linear_2(a) = a W_2 + b_2</text>

    <!-- Matrix Shape Visualization -->
    <rect x="10" y="48" width="174" height="42" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="64" font-size="7.5" font-family="monospace" fill="#1e293b">Input a:   [B, S, 4 · d_model]</text>
    <text x="16" y="79" font-size="7.5" font-family="monospace" fill="#c85a17">Weight W2: [4 · d_model, d_model]</text>

    <!-- Dimension Contraction Metric -->
    <rect x="10" y="96" width="174" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="112" font-size="7.8" font-weight="700" fill="#1f2937">Channel Compression:</text>
    <text x="16" y="128" font-size="7.8" font-family="monospace" fill="#475569">2,048 dims → 512 dims (highway bus)</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <rect x="15" y="210" width="650" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="25" y="226" font-size="8" font-weight="700" fill="#1f2937">Computational Profile:</text>
  <text x="135" y="226" font-size="7.8" fill="#475569">Two dense GEMMs per token with arithmetic intensity ~d_model FLOPs/byte. Highly optimized for GPU Tensor Cores.</text>
  <text x="25" y="240" font-size="7.8" fill="#64748b">Operates token-independently (no cross-sequence attention). Acts as key-value memory retrieval (Geva et al., 2021).</text>
</svg>
