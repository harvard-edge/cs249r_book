<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
    </marker>
  </defs>

  <!-- Upper Axis: Float32 Continuous Space -->
  <rect x="25" y="20" width="630" height="115" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="20" width="630" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="35" y="36" font-size="9.5" font-weight="700" fill="#1f2937">1. CONTINUOUS FLOAT32 DOMAIN [α = -3.2, β = +4.8]</text>
  <text x="645" y="36" text-anchor="end" font-size="8.5" font-family="monospace" fill="#6b7280">Scale S = (β - α) / 255 = 0.03137</text>

  <!-- Number Line Float32 (x=80 to 580) -->
  <line x1="50" y1="82" x2="610" y2="82" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Ticks & Values (Proportional: 62.5 px / unit) -->
  <!-- α = -3.20 at x=80 -->
  <line x1="80" y1="77" x2="80" y2="87" stroke="#1f2937" stroke-width="1.2"/>
  <text x="80" y="100" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">-3.20 (min)</text>

  <!-- -1.50 at x=186 -->
  <line x1="186" y1="77" x2="186" y2="87" stroke="#1f2937" stroke-width="1"/>
  <text x="186" y="100" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">-1.50</text>

  <!-- 0.00 at x=280 (ACCENT) -->
  <line x1="280" y1="73" x2="280" y2="91" stroke="#ff8246" stroke-width="2"/>
  <circle cx="280" cy="82" r="3.5" fill="#ff8246"/>
  <text x="280" y="68" text-anchor="middle" font-size="8.5" font-family="monospace" font-weight="bold" fill="#ff8246">0.00 (Real Zero)</text>
  <text x="280" y="100" text-anchor="middle" font-size="8" font-family="monospace" font-weight="bold" fill="#ff8246">x = 0.0</text>

  <!-- +2.10 at x=411 -->
  <line x1="411" y1="77" x2="411" y2="87" stroke="#1f2937" stroke-width="1"/>
  <text x="411" y="100" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">+2.10</text>

  <!-- β = +4.80 at x=580 -->
  <line x1="580" y1="77" x2="580" y2="87" stroke="#1f2937" stroke-width="1.2"/>
  <text x="580" y="100" text-anchor="middle" font-size="8" font-family="monospace" fill="#1f2937">+4.80 (max)</text>

  <!-- Lower Axis: Discrete INT8 Grid (ACCENT) -->
  <rect x="25" y="150" width="630" height="135" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
  <rect x="25" y="150" width="630" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="35" y="166" font-size="9.5" font-weight="700" fill="#c85a17">2. DISCRETE INT8 QUANTIZED DOMAIN [-128, +127]</text>
  <text x="645" y="166" text-anchor="end" font-size="8.5" font-family="monospace" font-weight="bold" fill="#c85a17">Zero-point Z = round(-α / S) - 128 = -26</text>

  <!-- INT8 Number line -->
  <line x1="50" y1="208" x2="610" y2="208" stroke="#ff8246" stroke-width="1.5"/>

  <!-- Left Clamping Shelf at x=80 -->
  <rect x="55" y="198" width="45" height="20" rx="1" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="77" y="211" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#6b7280">Clamp</text>
  <text x="80" y="228" text-anchor="middle" font-size="8" font-family="monospace" font-weight="bold" fill="#1f2937">-128</text>

  <!-- q = -74 at x=186 -->
  <line x1="186" y1="203" x2="186" y2="213" stroke="#ff8246" stroke-width="1"/>
  <text x="186" y="228" text-anchor="middle" font-size="8" font-family="monospace" fill="#6b7280">q = -74</text>

  <!-- Zero Point INT8 tick at x=280 (Exact 1:1 vertical alignment with 0.00!) -->
  <line x1="280" y1="199" x2="280" y2="217" stroke="#ff8246" stroke-width="2"/>
  <circle cx="280" cy="208" r="3.5" fill="#ff8246"/>
  <text x="280" y="194" text-anchor="middle" font-size="8.5" font-family="monospace" font-weight="bold" fill="#c85a17">q = -26 (Z)</text>
  <text x="280" y="228" text-anchor="middle" font-size="8" font-family="monospace" font-weight="bold" fill="#c85a17">q = Z</text>

  <!-- q = +41 at x=411 -->
  <line x1="411" y1="203" x2="411" y2="213" stroke="#ff8246" stroke-width="1"/>
  <text x="411" y="228" text-anchor="middle" font-size="8" font-family="monospace" fill="#6b7280">q = +41</text>

  <!-- Right Clamping Shelf at x=580 -->
  <rect x="560" y="198" width="45" height="20" rx="1" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="582" y="211" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#6b7280">Clamp</text>
  <text x="580" y="228" text-anchor="middle" font-size="8" font-family="monospace" font-weight="bold" fill="#1f2937">+127</text>

  <!-- Vertical Alignment Connector between Real Zero and Integer Z -->
  <line x1="280" y1="86" x2="280" y2="204" stroke="#ff8246" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Zero Distortion Invariant Note -->
  <text x="35" y="254" font-size="8.5" font-weight="bold" fill="#1f2937">Zero Distortion Invariant: Zero in float32 maps exactly to integer Z without rounding error.</text>
  <text x="35" y="268" font-size="8" fill="#6b7280">This ensures tensor padding (0.0) and ReLU activations do not accumulate numerical bias during inference.</text>

  <!-- Bottom Annotation -->
  <text x="340" y="306" text-anchor="middle" font-size="9" fill="#6b7280">Affine uniform quantization maps continuous FP32 values to discrete INT8 bins while strictly preserving exact zero representation.</text>
</svg>
