<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="240" fill="#ffffff"/>
  <defs>
    <marker id="pipe-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e293b"/>
    </marker>
    <marker id="pipe-arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
    </marker>
  </defs>

  <!-- Title Band -->
  <rect x="20" y="10" width="640" height="24" rx="2" fill="#1e293b"/>
  <text x="32" y="26" font-size="9" font-weight="700" fill="#ffffff">PROFILER ARCHITECTURE &amp; DIAGNOSTIC PIPELINE</text>
  <text x="645" y="26" text-anchor="end" font-size="8" font-family="monospace" fill="#94a3b8">tinytorch.perf.profiling.Profiler</text>

  <!-- Left Column: Input Model & Spec -->
  <g transform="translate(20, 44)">
    <rect x="0" y="0" width="130" height="180" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="130" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="16" font-size="8" font-weight="700" fill="#1e293b">INPUT WORKLOAD</text>

    <rect x="8" y="34" width="114" height="42" rx="2" fill="#f1f5f9"/>
    <text x="14" y="49" font-size="7.5" font-weight="700" fill="#1e293b">Model Architecture</text>
    <text x="14" y="65" font-size="7" font-family="monospace" fill="#475569">Linear, Conv2d,</text>
    <text x="14" y="75" font-size="7" font-family="monospace" fill="#475569">TransformerBlock</text>

    <rect x="8" y="86" width="114" height="42" rx="2" fill="#f1f5f9"/>
    <text x="14" y="101" font-size="7.5" font-weight="700" fill="#1e293b">Evaluation Shape</text>
    <text x="14" y="117" font-size="7" font-family="monospace" fill="#475569">(B, S, D) or (B, C, H, W)</text>

    <rect x="8" y="138" width="114" height="34" rx="2" fill="#f1f5f9"/>
    <text x="14" y="152" font-size="7.5" font-weight="700" fill="#1e293b">Runtime Harness</text>
    <text x="14" y="165" font-size="7" font-family="monospace" fill="#475569">Warmup &amp; Iters</text>
  </g>

  <!-- Connector Left to Center -->
  <line x1="150" y1="134" x2="168" y2="134" stroke="#1e293b" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- Center Column: Core Measurement Engines -->
  <g transform="translate(170, 44)">
    <rect x="0" y="0" width="280" height="180" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="280" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="16" font-size="8" font-weight="700" fill="#1e293b">CORE MEASUREMENT ENGINES</text>

    <!-- Subrow 1: Parameter & FLOP Counters -->
    <rect x="8" y="32" width="128" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="47" font-size="7.5" font-weight="700" fill="#ff8246">count_parameters()</text>
    <text x="14" y="61" font-size="6.8" font-family="monospace" fill="#475569">Σ (weight.size + bias.size)</text>
    <text x="14" y="73" font-size="6.8" font-family="monospace" fill="#475569">FP32: 4 bytes / param</text>
    <text x="14" y="87" font-size="6.8" font-family="monospace" fill="#64748b">Persistent VRAM budget</text>

    <rect x="144" y="32" width="128" height="64" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="47" font-size="7.5" font-weight="700" fill="#ff8246">count_flops()</text>
    <text x="150" y="61" font-size="6.8" font-family="monospace" fill="#475569">GEMM: 2 · M · N · K</text>
    <text x="150" y="73" font-size="6.8" font-family="monospace" fill="#475569">Conv: 2·H·W·k²·C_in·C_out</text>
    <text x="150" y="87" font-size="6.8" font-family="monospace" fill="#64748b">Hardware-independent</text>

    <!-- Subrow 2: Memory & Latency Timers -->
    <rect x="8" y="104" width="128" height="68" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="119" font-size="7.5" font-weight="700" fill="#1e293b">measure_memory()</text>
    <text x="14" y="133" font-size="6.8" font-family="monospace" fill="#475569">tracemalloc baseline/peak</text>
    <text x="14" y="145" font-size="6.8" font-family="monospace" fill="#475569">Act: batch · intermediate</text>
    <text x="14" y="159" font-size="6.8" font-family="monospace" fill="#64748b">Allocation efficiency</text>

    <rect x="144" y="104" width="128" height="68" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="119" font-size="7.5" font-weight="700" fill="#1e293b">measure_latency()</text>
    <text x="150" y="133" font-size="6.8" font-family="monospace" fill="#475569">time.perf_counter_ns()</text>
    <text x="150" y="145" font-size="6.8" font-family="monospace" fill="#475569">Warmup (3+) + Iters (10+)</text>
    <text x="150" y="159" font-size="6.8" font-family="monospace" fill="#64748b">Median filter (outliers)</text>
  </g>

  <!-- Connector Center to Right -->
  <line x1="450" y1="134" x2="468" y2="134" stroke="#ff8246" stroke-width="1.5" marker-end="url(#pipe-arrow-orange)"/>

  <!-- Right Column: Derived Diagnostic Metrics -->
  <g transform="translate(470, 44)">
    <rect x="0" y="0" width="190" height="180" rx="3" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="10" y="16" font-size="8" font-weight="700" fill="#c85a17">SYNTHESIZED METRICS</text>

    <g transform="translate(8, 32)">
      <rect x="0" y="0" width="174" height="30" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="0.8"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#1e293b">GFLOP/s &amp; Throughput</text>
      <text x="8" y="24" font-size="6.8" font-family="monospace" fill="#c85a17">P = (FLOPs / 1e9) / (sec)</text>
    </g>

    <g transform="translate(8, 68)">
      <rect x="0" y="0" width="174" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#1e293b">Memory Bandwidth</text>
      <text x="8" y="24" font-size="6.8" font-family="monospace" fill="#475569">BW = (Bytes / 1e6) / (sec)</text>
    </g>

    <g transform="translate(8, 104)">
      <rect x="0" y="0" width="174" height="30" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#1e293b">Backward Pass Multiplier</text>
      <text x="8" y="24" font-size="6.8" font-family="monospace" fill="#475569">Compute: 2× FWD, Grads: 1× W</text>
    </g>

    <g transform="translate(8, 140)">
      <rect x="0" y="0" width="174" height="32" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
      <text x="8" y="13" font-size="7.5" font-weight="700" fill="#c85a17">Bottleneck Classification</text>
      <text x="8" y="25" font-size="6.8" font-family="monospace" fill="#c85a17">Memory-bound vs Compute-bound</text>
    </g>
  </g>
</svg>
