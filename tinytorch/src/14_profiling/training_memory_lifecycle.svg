<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="230" fill="#ffffff"/>
  <defs>
    <marker id="mem-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Title Band -->
  <rect x="20" y="10" width="640" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="26" font-size="9" font-weight="700" fill="#1e293b">DEEP LEARNING TRAINING MEMORY LIFECYCLE</text>
  <text x="645" y="26" text-anchor="end" font-size="8" font-family="monospace" fill="#64748b">FP32 EXAMPLE: 125M PARAMETER MODEL (TOTAL ~2,200 MB)</text>

  <!-- Stage 1: Parameters -->
  <g transform="translate(20, 44)">
    <rect x="0" y="0" width="145" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="16" font-size="8" font-weight="700" fill="#1e293b">1. PARAMETERS</text>

    <text x="10" y="42" font-size="7.5" font-weight="700" fill="#ff8246">500 MB (1.0×)</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#334155">• Linear weights</text>
    <text x="10" y="72" font-size="7" font-family="monospace" fill="#334155">• LayerNorm γ, β</text>
    <text x="10" y="86" font-size="7" font-family="monospace" fill="#334155">• Token embeddings</text>
    <rect x="10" y="102" width="125" height="22" rx="2" fill="#f1f5f9"/>
    <text x="72" y="116" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#475569">Persistent in VRAM</text>
  </g>

  <!-- Plus 1 -->
  <text x="175" y="115" font-size="16" font-weight="700" fill="#9ca3af" text-anchor="middle">+</text>

  <!-- Stage 2: Activations -->
  <g transform="translate(185, 44)">
    <rect x="0" y="0" width="145" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="16" font-size="8" font-weight="700" fill="#1e293b">2. ACTIVATIONS</text>

    <text x="10" y="42" font-size="7.5" font-weight="700" fill="#ff8246">200 MB (~0.4×)</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#334155">• Attention scores</text>
    <text x="10" y="72" font-size="7" font-family="monospace" fill="#334155">• GELU intermediates</text>
    <text x="10" y="86" font-size="7" font-family="monospace" fill="#334155">• Residual buffers</text>
    <rect x="10" y="102" width="125" height="22" rx="2" fill="#f1f5f9"/>
    <text x="72" y="116" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#475569">Scales with Batch × Seq</text>
  </g>

  <!-- Plus 2 -->
  <text x="340" y="115" font-size="16" font-weight="700" fill="#9ca3af" text-anchor="middle">+</text>

  <!-- Stage 3: Gradients -->
  <g transform="translate(350, 44)">
    <rect x="0" y="0" width="145" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="16" font-size="8" font-weight="700" fill="#1e293b">3. GRADIENTS</text>

    <text x="10" y="42" font-size="7.5" font-weight="700" fill="#ff8246">500 MB (1.0×)</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#334155">• ∂L / ∂W weights</text>
    <text x="10" y="72" font-size="7" font-family="monospace" fill="#334155">• ∂L / ∂b biases</text>
    <text x="10" y="86" font-size="7" font-family="monospace" fill="#334155">• Backprop buffers</text>
    <rect x="10" y="102" width="125" height="22" rx="2" fill="#f1f5f9"/>
    <text x="72" y="116" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#475569">Exact 1:1 shape with W</text>
  </g>

  <!-- Plus 3 -->
  <text x="505" y="115" font-size="16" font-weight="700" fill="#9ca3af" text-anchor="middle">+</text>

  <!-- Stage 4: Optimizer State -->
  <g transform="translate(515, 44)">
    <rect x="0" y="0" width="145" height="135" rx="3" fill="#ffffff" stroke="#ff8246" stroke-width="1.4"/>
    <rect x="0" y="0" width="145" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
    <text x="10" y="16" font-size="8" font-weight="700" fill="#c85a17">4. OPTIMIZER STATE</text>

    <text x="10" y="42" font-size="7.5" font-weight="700" fill="#c85a17">1,000 MB (2.0×)</text>
    <text x="10" y="58" font-size="7" font-family="monospace" fill="#334155">• Adam 1st moment m</text>
    <text x="10" y="72" font-size="7" font-family="monospace" fill="#334155">• Adam 2nd moment v</text>
    <text x="10" y="86" font-size="7" font-family="monospace" fill="#64748b">(SGD: 0 MB / 0.0×)</text>
    <rect x="10" y="102" width="125" height="22" rx="2" fill="#fff1e8"/>
    <text x="72" y="116" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#c85a17">Dominates VRAM Budget</text>
  </g>

  <!-- Bottom Total Bar -->
  <g transform="translate(20, 190)">
    <rect x="0" y="0" width="640" height="28" rx="2" fill="#1e293b"/>
    <text x="16" y="18" font-size="8.5" font-weight="700" fill="#ffffff">TOTAL TRAINING MEMORY BUDGET:</text>
    <text x="215" y="18" font-size="8" font-family="monospace" fill="#ff8246">500 MB (W) + 200 MB (Acts) + 500 MB (∇W) + 1,000 MB (Adam) = 2,200 MB (4.4× Model Size)</text>
  </g>
</svg>
