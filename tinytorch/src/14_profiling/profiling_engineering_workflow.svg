<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="220" fill="#ffffff"/>
  <defs>
    <marker id="wf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
    </marker>
    <marker id="wf-arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title Band -->
  <rect x="20" y="12" width="640" height="24" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="28" font-size="9" font-weight="700" fill="#1e293b">SYSTEMS PROFILING &amp; OPTIMIZATION WORKFLOW</text>
  <text x="645" y="28" text-anchor="end" font-size="8" font-family="monospace" fill="#64748b">MEASURE → ANALYZE → OPTIMIZE → VALIDATE</text>

  <!-- Step 1: Measure -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="145" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="17" font-size="8.5" font-weight="700" fill="#1e293b">1. MEASURE</text>
    <text x="10" y="44" font-size="7.5" font-weight="700" fill="#ff8246">Baseline Telemetry</text>
    <text x="10" y="60" font-size="7.5" font-family="monospace" fill="#334155">• Latency (median)</text>
    <text x="10" y="76" font-size="7.5" font-family="monospace" fill="#334155">• Peak memory (MB)</text>
    <text x="10" y="92" font-size="7.5" font-family="monospace" fill="#334155">• Parameter footprint</text>
    <text x="10" y="108" font-size="7.5" font-family="monospace" fill="#334155">• Theoretical FLOPs</text>
    <rect x="10" y="122" width="125" height="18" rx="2" fill="#f1f5f9"/>
    <text x="72" y="134" text-anchor="middle" font-size="7" font-family="monospace" fill="#475569">Profiler.profile_pass()</text>
  </g>

  <!-- Connector 1-2 -->
  <line x1="165" y1="123" x2="183" y2="123" stroke="#ff8246" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

  <!-- Step 2: Analyze -->
  <g transform="translate(185, 48)">
    <rect x="0" y="0" width="145" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="17" font-size="8.5" font-weight="700" fill="#1e293b">2. ANALYZE</text>
    <text x="10" y="44" font-size="7.5" font-weight="700" fill="#ff8246">Bottleneck Isolation</text>
    <text x="10" y="60" font-size="7.5" font-family="monospace" fill="#334155">• Arithmetic Intensity</text>
    <text x="10" y="76" font-size="7" font-family="monospace" fill="#64748b">  I = FLOPs / Bytes</text>
    <text x="10" y="92" font-size="7.5" font-family="monospace" fill="#334155">• Roofline position</text>
    <text x="10" y="108" font-size="7.5" font-family="monospace" fill="#334155">• Memory vs Compute</text>
    <rect x="10" y="122" width="125" height="18" rx="2" fill="#f1f5f9"/>
    <text x="72" y="134" text-anchor="middle" font-size="7" font-family="monospace" fill="#475569">analyze_bottleneck()</text>
  </g>

  <!-- Connector 2-3 -->
  <line x1="330" y1="123" x2="348" y2="123" stroke="#ff8246" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

  <!-- Step 3: Optimize -->
  <g transform="translate(350, 48)">
    <rect x="0" y="0" width="145" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="17" font-size="8.5" font-weight="700" fill="#1e293b">3. OPTIMIZE</text>
    <text x="10" y="44" font-size="7.5" font-weight="700" fill="#ff8246">Targeted Execution</text>
    <text x="10" y="60" font-size="7.5" font-family="monospace" fill="#334155">• Memory: Quantize</text>
    <text x="10" y="76" font-size="7" font-family="monospace" fill="#64748b">  FP32 → INT8 (4× VRAM)</text>
    <text x="10" y="92" font-size="7.5" font-family="monospace" fill="#334155">• Cache: KV Caching</text>
    <text x="10" y="108" font-size="7.5" font-family="monospace" fill="#334155">• Compute: Vectorize</text>
    <rect x="10" y="122" width="125" height="18" rx="2" fill="#f1f5f9"/>
    <text x="72" y="134" text-anchor="middle" font-size="7" font-family="monospace" fill="#475569">Modules 15, 17, 18</text>
  </g>

  <!-- Connector 3-4 -->
  <line x1="495" y1="123" x2="513" y2="123" stroke="#ff8246" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

  <!-- Step 4: Validate -->
  <g transform="translate(515, 48)">
    <rect x="0" y="0" width="145" height="150" rx="3" fill="#ffffff" stroke="#ff8246" stroke-width="1.4"/>
    <rect x="0" y="0" width="145" height="26" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
    <text x="10" y="17" font-size="8.5" font-weight="700" fill="#c85a17">4. VALIDATE</text>
    <text x="10" y="44" font-size="7.5" font-weight="700" fill="#c85a17">Verified Speedup</text>
    <text x="10" y="60" font-size="7.5" font-family="monospace" fill="#334155">• Speedup ratio (S×)</text>
    <text x="10" y="76" font-size="7.5" font-family="monospace" fill="#334155">• Memory savings (%)</text>
    <text x="10" y="92" font-size="7.5" font-family="monospace" fill="#334155">• Numerical parity</text>
    <text x="10" y="108" font-size="7.5" font-family="monospace" fill="#334155">• Roofline shift</text>
    <rect x="10" y="122" width="125" height="18" rx="2" fill="#fff1e8"/>
    <text x="72" y="134" text-anchor="middle" font-size="7" font-family="monospace" fill="#c85a17">Module 19 Benchmarks</text>
  </g>
</svg>
