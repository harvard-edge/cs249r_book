<svg xmlns="http://www.w3.org/2000/svg" width="220" height="230" viewBox="0 0 220 230" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="230" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="220" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">HEAD SPLIT COORDINATE ORIGAMI</text>

  <rect x="12" y="28" width="196" height="13" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="37.5" text-anchor="middle" font-size="6.4" font-weight="600" fill="#475569">Memory Layout for Batched 2D GEMM</text>

  <g transform="translate(12, 44)">
    <rect x="0" y="0" width="196" height="25" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="6" y="11" font-size="6.5" font-weight="bold" fill="#334155">1. Linear Projections</text>
    <text x="190" y="11" text-anchor="end" font-family="monospace" font-size="6.5" font-weight="bold" fill="#1e293b">(B, S, D)</text>
    <text x="6" y="20" font-size="5.8" fill="#64748b">Batch B × Sequence S × Feature Dimension D</text>
  </g>

  <line x1="110" y1="69" x2="110" y2="76" stroke="#9ca3af" stroke-width="1"/>
  <polygon points="108,74 110,77 112,74" fill="#9ca3af"/>
  <text x="116" y="75" font-size="5.6" font-family="monospace" fill="#2563eb">.reshape(B, S, H, d_k)</text>

  <g transform="translate(12, 78)">
    <rect x="0" y="0" width="196" height="25" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="6" y="11" font-size="6.5" font-weight="bold" fill="#1e40af">2. Partition Feature Axis</text>
    <text x="190" y="11" text-anchor="end" font-family="monospace" font-size="6.5" font-weight="bold" fill="#1e40af">(B, S, H, d_k)</text>
    <text x="6" y="20" font-size="5.8" fill="#3b82f6">D partitioned into H heads of width d_k = D / H</text>
  </g>

  <line x1="110" y1="103" x2="110" y2="111" stroke="#ff8246" stroke-width="1.2"/>
  <polygon points="108,109 110,112 112,109" fill="#ff8246"/>
  <text x="116" y="110" font-size="5.6" font-family="monospace" font-weight="bold" fill="#c85a17">.transpose(1, 2) [SWAP AXES]</text>

  <g transform="translate(12, 113)">
    <rect x="0" y="0" width="196" height="35" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="6" y="11" font-size="6.5" font-weight="bold" fill="#c85a17">3. Batched Head Subspaces</text>
    <text x="190" y="11" text-anchor="end" font-family="monospace" font-size="6.5" font-weight="bold" fill="#c85a17">(B, H, S, d_k)</text>
    <text x="6" y="21" font-size="5.8" fill="#9a3412">Axes (B, H) act as batch dims for hardware</text>
    <rect x="4" y="24" width="188" height="9" rx="1" fill="#ffffff" stroke="#fed7aa" stroke-width="0.6"/>
    <text x="98" y="31" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#c85a17">Q @ K.T → (B, H, S, S) parallel GEMM</text>
  </g>

  <line x1="110" y1="148" x2="110" y2="155" stroke="#0d9488" stroke-width="1"/>
  <polygon points="108,153 110,156 112,153" fill="#0d9488"/>
  <text x="116" y="154" font-size="5.6" font-family="monospace" fill="#0d9488">Weights @ V → (B, H, S, d_k)</text>

  <g transform="translate(12, 157)">
    <rect x="0" y="0" width="196" height="28" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="6" y="11" font-size="6.5" font-weight="bold" fill="#0f766e">4. Merge Heads Pipeline</text>
    <text x="190" y="11" text-anchor="end" font-family="monospace" font-size="6.5" font-weight="bold" fill="#0f766e">(B, S, D)</text>
    <text x="6" y="21" font-size="5.6" font-family="monospace" fill="#115e59">.transpose(1, 2).reshape(B, S, D) → out_proj</text>
  </g>

  <g transform="translate(12, 190)">
    <rect x="0" y="0" width="196" height="25" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="98" y="10" text-anchor="middle" font-size="5.8" font-weight="bold" fill="#334155">Why transpose: Matrix multiply operates on last 2 axes.</text>
    <text x="98" y="19" text-anchor="middle" font-size="5.5" fill="#64748b">Placing H before S isolates each head into a 2D plane.</text>
  </g>
</svg>
