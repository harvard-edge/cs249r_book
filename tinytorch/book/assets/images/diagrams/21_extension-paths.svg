<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="334" viewBox="0 0 680 334" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="334" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7280"/></marker></defs>

<!-- Source: the Tensor's NumPy buffer -->
<rect x="190" y="20" width="300" height="46" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="340" y="39" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2937">TinyTorch Tensor</text>
<text x="340" y="55" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#6b7280">.data: one contiguous NumPy array</text>

<!-- Arrows to four routes -->
<path d="M 340 66 V 80 H 95 V 98" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>
<path d="M 340 66 V 80 H 260 V 98" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>
<path d="M 340 80 H 425 V 98" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>
<path d="M 340 80 H 590 V 98" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>

<!-- Route 1: NumPy -->
<g transform="translate(20,100)">
  <rect width="150" height="120" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect width="150" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="75" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2937">NumPy (Modules 01–20)</text>
  <text x="10" y="44" font-size="8.5" font-family="monospace" fill="#1f2937">np.matmul, np.tanh</text>
  <text x="10" y="64" font-size="8.5" fill="#6b7280">a BLAS library does</text>
  <text x="10" y="77" font-size="8.5" fill="#6b7280">the matrix product</text>
  <text x="10" y="104" font-size="8.5" fill="#1f2937">no copy</text>
</g>

<!-- Route 2: C++ via ctypes (accent) -->
<g transform="translate(185,100)">
  <rect width="150" height="120" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.4"/>
  <rect width="150" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.4"/>
  <text x="75" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c85a17">C++ through ctypes</text>
  <text x="10" y="44" font-size="8.5" font-family="monospace" fill="#1f2937">simd_matmul</text>
  <text x="10" y="57" font-size="8.5" font-family="monospace" fill="#1f2937">simd_fused_bias_gelu</text>
  <text x="10" y="77" font-size="8.5" fill="#6b7280">compiled on first use</text>
  <text x="10" y="104" font-size="8.5" fill="#1f2937">no copy for float32</text>
</g>

<!-- Route 3: MPS -->
<g transform="translate(350,100)">
  <rect width="150" height="120" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect width="150" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="75" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2937">PyTorch MPS</text>
  <text x="10" y="44" font-size="8.5" font-family="monospace" fill="#1f2937">mps_matmul</text>
  <text x="10" y="64" font-size="8.5" fill="#6b7280">needs PyTorch on an</text>
  <text x="10" y="77" font-size="8.5" fill="#6b7280">Apple M-series Mac</text>
  <text x="10" y="104" font-size="8.5" fill="#1f2937">copy in and out</text>
</g>

<!-- Route 4: Triton -->
<g transform="translate(515,100)">
  <rect width="150" height="120" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect width="150" height="24" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="75" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2937">Triton</text>
  <text x="10" y="44" font-size="8.5" font-family="monospace" fill="#1f2937">triton_fused_gelu</text>
  <text x="10" y="64" font-size="8.5" fill="#6b7280">needs PyTorch, Triton,</text>
  <text x="10" y="77" font-size="8.5" fill="#6b7280">and an NVIDIA GPU</text>
  <text x="10" y="104" font-size="8.5" fill="#1f2937">copy across PCIe</text>
</g>

<!-- Arrows to hardware -->
<path d="M 95 220 V 246" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>
<path d="M 260 220 V 246" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>
<path d="M 425 220 V 246" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>
<path d="M 590 220 V 246" fill="none" stroke="#6b7280" stroke-width="1.1" marker-end="url(#ah)"/>

<!-- Hardware row -->
<g font-size="8.5" fill="#1f2937" text-anchor="middle">
  <rect x="20" y="248" width="315" height="40" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="177.5" y="265" font-weight="700" font-size="9">CPU</text>
  <text x="177.5" y="279" fill="#6b7280">vector units in each core; OpenMP spreads work across cores</text>
  <rect x="350" y="248" width="150" height="40" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="425" y="265" font-weight="700" font-size="9">Apple GPU</text>
  <text x="425" y="279" fill="#6b7280">memory shared with CPU</text>
  <rect x="515" y="248" width="150" height="40" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="590" y="265" font-weight="700" font-size="9">NVIDIA GPU</text>
  <text x="590" y="279" fill="#6b7280">its own memory</text>
</g>

<text x="340" y="322" text-anchor="middle" font-size="9" fill="#6b7280">Each extension falls back to NumPy when its compiler, library, or hardware is missing.</text>
</svg>
