<svg xmlns="http://www.w3.org/2000/svg" width="220" height="165" viewBox="0 0 220 165" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#ff8246"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="220" height="165" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="155" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">TOPOLOGICAL TAPE EXECUTION</text>

  <rect x="15" y="28" width="190" height="14" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="38" text-anchor="middle" font-size="6.8" font-weight="600" fill="#475569">Reverse Post-Order Stack Traversal</text>

  <rect x="72" y="46" width="76" height="16" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1"/>
  <text x="110" y="57" text-anchor="middle" font-size="7.2" font-weight="bold" fill="#1f2937">1. Loss L (seed=1)</text>

  <path d="M 92 62 L 64 71" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 128 62 L 156 71" stroke="#9ca3af" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="16" y="72" width="86" height="17" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="59" y="83" text-anchor="middle" font-size="7" font-weight="bold" fill="#1e40af">2. Branch h₁ (g₁)</text>

  <rect x="118" y="72" width="86" height="17" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="161" y="83" text-anchor="middle" font-size="7" font-weight="bold" fill="#1e40af">3. Branch h₂ (g₂)</text>

  <path d="M 59 89 L 88 98" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <path d="M 161 89 L 132 98" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <rect x="30" y="99" width="160" height="21" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="110" y="110" text-anchor="middle" font-size="7.2" font-weight="bold" fill="#c85a17">4. h.backward(pending[h])</text>
  <text x="110" y="117" text-anchor="middle" font-size="6.2" font-family="monospace" fill="#c85a17">pending[h] = g₁ + g₂</text>

  <path d="M 110 120 L 110 126" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-teal)"/>

  <rect x="42" y="127" width="136" height="16" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
  <text x="110" y="138" text-anchor="middle" font-size="7.2" font-weight="bold" fill="#115e59">5. Leaf x.grad += dx</text>

  <rect x="15" y="147" width="190" height="11" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="110" y="155" text-anchor="middle" font-size="6.3" font-weight="600" fill="#475569">Rule: All consumers finish before parent executes</text>
</svg>
