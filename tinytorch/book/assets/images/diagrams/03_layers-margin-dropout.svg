<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="210" fill="#ffffff"/>
  <!-- Outer card -->
  <rect x="5" y="5" width="210" height="200" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <!-- Header banner -->
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">INVERTED DROPOUT: TRAIN VS EVAL</text>
  <text x="202" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">p = 0.5</text>

  <!-- Training Mode Block -->
  <rect x="12" y="30" width="196" height="74" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.9"/>
  <text x="18" y="42" font-size="7.5" font-weight="700" fill="#c85a17">TRAINING (training=True)</text>
  <text x="202" y="42" text-anchor="end" font-size="7" font-family="monospace" fill="#ea580c">scale = 2.0x</text>

  <!-- Unit 1 Keep -->
  <rect x="18" y="47" width="58" height="39" rx="2" fill="#ffffff" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="47" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#9a3412">Unit 1 (Keep)</text>
  <text x="47" y="68" text-anchor="middle" font-size="7" font-family="monospace" fill="#475569">x1 = 1.0</text>
  <text x="47" y="80" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="700" fill="#c85a17">y1 = 2.0</text>

  <!-- Unit 2 Drop -->
  <rect x="81" y="47" width="58" height="39" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="110" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#64748b">Unit 2 (Drop)</text>
  <text x="110" y="68" text-anchor="middle" font-size="7" font-family="monospace" fill="#94a3b8">x2 = 2.0</text>
  <text x="110" y="80" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="700" fill="#dc2626">y2 = 0.0</text>

  <!-- Unit 3 Keep -->
  <rect x="144" y="47" width="58" height="39" rx="2" fill="#ffffff" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="173" y="57" text-anchor="middle" font-size="6.5" font-weight="700" fill="#9a3412">Unit 3 (Keep)</text>
  <text x="173" y="68" text-anchor="middle" font-size="7" font-family="monospace" fill="#475569">x3 = 3.0</text>
  <text x="173" y="80" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="700" fill="#c85a17">y3 = 6.0</text>

  <text x="18" y="97" font-size="6.5" font-family="monospace" fill="#7c2d12">Active sum: 2.0 + 0.0 + 6.0 = 8.0</text>
  <text x="202" y="97" text-anchor="end" font-size="6.5" font-family="monospace" fill="#7c2d12">E[sum] = 6.0</text>

  <!-- Evaluation Mode Block -->
  <rect x="12" y="110" width="196" height="52" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.9"/>
  <text x="18" y="122" font-size="7.5" font-weight="700" fill="#0f766e">EVALUATION (training=False)</text>
  <text x="202" y="122" text-anchor="end" font-size="7" font-family="monospace" fill="#0d9488">y = x</text>

  <!-- Eval Units -->
  <rect x="18" y="127" width="58" height="21" rx="2" fill="#ffffff" stroke="#99f6e4" stroke-width="0.8"/>
  <text x="47" y="141" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#0f766e">y1 = 1.0</text>

  <rect x="81" y="127" width="58" height="21" rx="2" fill="#ffffff" stroke="#99f6e4" stroke-width="0.8"/>
  <text x="110" y="141" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#0f766e">y2 = 2.0</text>

  <rect x="144" y="127" width="58" height="21" rx="2" fill="#ffffff" stroke="#99f6e4" stroke-width="0.8"/>
  <text x="173" y="141" text-anchor="middle" font-size="7" font-family="monospace" font-weight="bold" fill="#0f766e">y3 = 3.0</text>

  <text x="18" y="156" font-size="6.2" font-family="monospace" fill="#115e59">Sum: 1.0 + 2.0 + 3.0 = 6.0</text>
  <text x="202" y="156" text-anchor="end" font-size="6.0" font-family="monospace" fill="#0f766e">Zero Overhead</text>

  <!-- Expectation Invariant Block -->
  <rect x="12" y="168" width="196" height="32" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="0.9"/>
  <text x="18" y="180" font-size="7" font-weight="700" fill="#1e40af">EXPECTATION INVARIANT</text>
  <text x="202" y="180" text-anchor="end" font-size="7" font-family="monospace" font-weight="bold" fill="#2563eb">E[y_train] = y_eval</text>
  <text x="18" y="193" font-size="6.5" fill="#3b82f6">Train-time scaling preserves inference speed</text>
</svg>
