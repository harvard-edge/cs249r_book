<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="155" viewBox="0 0 220 155" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="155" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="145" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">MODULAR VS FUSED BCE LOSS</text>

  <g transform="translate(12, 28)">
    <text x="0" y="8" font-size="6.8" font-weight="700" fill="#475569">MODULAR (TINYTORCH)</text>
    <text x="196" y="8" text-anchor="end" font-size="6.0" font-weight="700" fill="#c85a17">DRAM TRIP + CLIP</text>

    <rect x="0" y="12" width="56" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="28" y="23" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1f2937">Sigmoid</text>
    <text x="28" y="32" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">&#963;(z)</text>

    <path d="M 57 24 H 65" stroke="#9ca3af" stroke-width="0.8"/>
    <polygon points="65 22, 68 24, 65 26" fill="#9ca3af"/>

    <rect x="69" y="13" width="46" height="22" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="92" y="22" text-anchor="middle" font-size="5.5" font-weight="700" fill="#c85a17">DRAM Bus</text>
    <text x="92" y="31" text-anchor="middle" font-size="4.8" fill="#64748b">Write + Read</text>

    <path d="M 116 24 H 124" stroke="#9ca3af" stroke-width="0.8"/>
    <polygon points="124 22, 127 24, 124 26" fill="#9ca3af"/>

    <rect x="128" y="12" width="68" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="162" y="23" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1f2937">BCELoss</text>
    <text x="162" y="32" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#64748b">clip [1e-7, 1-1e-7]</text>

    <rect x="0" y="40" width="196" height="14" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.7"/>
    <text x="5" y="50" font-size="5.5" fill="#c85a17">Saturated logit (|z| &gt; 16): clip creates zero gradient cliff (&#8711;z = 0)</text>
  </g>

  <line x1="12" y1="87" x2="208" y2="87" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2,2"/>

  <g transform="translate(12, 92)">
    <text x="0" y="8" font-size="6.8" font-weight="700" fill="#115e59">FUSED (PYTORCH BCEWITHLOGITS)</text>
    <text x="196" y="8" text-anchor="end" font-size="6.0" font-weight="700" fill="#0d9488">STABLE, NO CLIP</text>

    <rect x="0" y="12" width="196" height="25" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.0"/>
    
    <rect x="4" y="15.5" width="50" height="18" rx="1.5" fill="#ccfbf1" stroke="#14b8a6" stroke-width="0.6"/>
    <text x="29" y="24" text-anchor="middle" font-size="5.5" font-weight="700" fill="#115e59">One Formula</text>
    <text x="29" y="31" text-anchor="middle" font-size="4.6" fill="#134e4a">log-sum-exp</text>

    <text x="59" y="23" font-size="5.8" font-family="monospace" font-weight="bold" fill="#0f766e">max(z,0) - z&#183;y + log(1+e^(-|z|))</text>
    <text x="59" y="32" font-size="5.2" fill="#134e4a">Simplified gradient: &#8711;z = &#963;(z) - y</text>

    <rect x="0" y="41" width="196" height="14" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.7"/>
    <text x="5" y="51" font-size="5.5" fill="#115e59">Full dynamic range: no underflow, active gradient everywhere</text>
  </g>
</svg>
