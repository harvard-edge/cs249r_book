<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120" viewBox="0 0 220 120" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="120" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="110" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.2" font-weight="700" fill="#1f2937">GRADIENT DECAY: SIGMOID VS RELU</text>

  <g transform="translate(15, 25)">
    <!-- Axes -->
    <line x1="25" y1="75" x2="185" y2="75" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="25" y1="15" x2="25" y2="75" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Y-axis labels -->
    <text x="21" y="20" font-size="6.5" font-family="monospace" text-anchor="end" fill="#9ca3af">1.0</text>
    <text x="21" y="50" font-size="6.5" font-family="monospace" text-anchor="end" fill="#9ca3af">0.5</text>
    <text x="21" y="77" font-size="6.5" font-family="monospace" text-anchor="end" fill="#9ca3af">0.0</text>
    
    <!-- X-axis labels -->
    <text x="25" y="85" font-size="6.5" font-family="monospace" text-anchor="middle" fill="#9ca3af">L1</text>
    <text x="65" y="85" font-size="6.5" font-family="monospace" text-anchor="middle" fill="#9ca3af">L3</text>
    <text x="105" y="85" font-size="6.5" font-family="monospace" text-anchor="middle" fill="#9ca3af">L5</text>
    <text x="145" y="85" font-size="6.5" font-family="monospace" text-anchor="middle" fill="#9ca3af">L7</text>
    <text x="180" y="85" font-size="6.5" font-family="monospace" text-anchor="middle" fill="#9ca3af">L10</text>
    
    <!-- Grid line at 1.0 -->
    <line x1="25" y1="18" x2="185" y2="18" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- ReLU constant slope = 1.0 -->
    <line x1="25" y1="18" x2="180" y2="18" stroke="#16a34a" stroke-width="1.8"/>
    <circle cx="180" cy="18" r="2" fill="#16a34a"/>
    <text x="105" y="13" font-size="6.5" font-family="monospace" font-weight="bold" fill="#16a34a">ReLU: 1.0^n = 1.0</text>
    
    <!-- Sigmoid vanishing slope = 0.25^n -->
    <!-- L1: 0.25 -> y = 75 - (0.25 * 57) = 60.75 -->
    <!-- L2: 0.0625 -> y = 75 - (0.0625 * 57) = 71.4 -->
    <!-- L3+: ~74.5 -->
    <path d="M 25 61 Q 38 71 50 74 T 180 74.8" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <circle cx="25" cy="61" r="2" fill="#dc2626"/>
    <circle cx="180" cy="74.8" r="2" fill="#dc2626"/>
    <text x="65" y="66" font-size="6.5" font-family="monospace" font-weight="bold" fill="#dc2626">Sigmoid: 0.25^n → 0</text>
    <text x="180" y="68" font-size="6" font-family="monospace" text-anchor="end" fill="#991b1b">~9.5e-7</text>
  </g>
</svg>
