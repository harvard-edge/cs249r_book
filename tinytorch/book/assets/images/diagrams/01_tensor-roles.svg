<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="270" fill="#ffffff" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c85a17" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Panel 1: Input Data -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="190" height="135" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
    <text x="14" y="24" font-size="12" font-weight="700" fill="#111827">1. Input Data</text>
    <text x="14" y="42" font-size="9" fill="#4b5563">Sensory batches &amp; features</text>
    
    <rect x="14" y="55" width="162" height="32" rx="2" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
    <text x="22" y="70" font-size="10" font-weight="600" fill="#111827">Vision: (B, C, H, W)</text>
    <text x="22" y="82" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#6b7280">B images, RGB, 28×28</text>

    <rect x="14" y="93" width="162" height="32" rx="2" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
    <text x="22" y="108" font-size="10" font-weight="600" fill="#111827">Language: (B, S, D)</text>
    <text x="22" y="120" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#6b7280">B prompts, S tokens, D dim</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 210 87 H 240" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Panel 2: Model Parameters -->
  <g transform="translate(245, 20)">
    <rect x="0" y="0" width="190" height="135" rx="3" fill="#fff7ed" stroke="#c85a17" stroke-width="1.5" />
    <text x="14" y="24" font-size="12" font-weight="700" fill="#9a3412">2. Model Parameters</text>
    <text x="14" y="42" font-size="9" fill="#9a3412">Persistent learned weights</text>
    
    <rect x="14" y="55" width="162" height="32" rx="2" fill="#ffffff" stroke="#fed7aa" stroke-width="1" />
    <text x="22" y="70" font-size="10" font-weight="600" fill="#9a3412">Linear: (D_in, D_out)</text>
    <text x="22" y="82" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#78350f">Weight matrix + bias</text>

    <rect x="14" y="93" width="162" height="32" rx="2" fill="#ffffff" stroke="#fed7aa" stroke-width="1" />
    <text x="22" y="108" font-size="10" font-weight="600" fill="#9a3412">Conv: (C_out, C_in, K, K)</text>
    <text x="22" y="120" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#78350f">Spatial filter kernel bank</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 435 87 H 465" fill="none" stroke="#c85a17" stroke-width="1.2" marker-end="url(#arrowOrange)" />

  <!-- Panel 3: Activations & Gradients -->
  <g transform="translate(470, 20)">
    <rect x="0" y="0" width="190" height="135" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" />
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1e40af">3. Activations &amp; Gradients</text>
    <text x="14" y="42" font-size="9" fill="#1e40af">Dynamic forward &amp; backward</text>
    
    <rect x="14" y="55" width="162" height="32" rx="2" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
    <text x="22" y="70" font-size="10" font-weight="600" fill="#1e40af">Forward: Activations (A)</text>
    <text x="22" y="82" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#1d4ed8">Pinned in memory for autograd</text>

    <rect x="14" y="93" width="162" height="32" rx="2" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
    <text x="22" y="108" font-size="10" font-weight="600" fill="#1e40af">Backward: Gradients (∇_W)</text>
    <text x="22" y="120" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#1d4ed8">Same shape as weight tensors</text>
  </g>

  <!-- Vertical projection bus lines from the 3 panels down to the physical memory ribbon -->
  <path d="M 115 155 V 180" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3" />
  <path d="M 340 155 V 180" fill="none" stroke="#c85a17" stroke-width="1" stroke-dasharray="3,3" />
  <path d="M 565 155 V 180" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Bottom Panel: The Physical Memory Substrate (1D DRAM Ribbon) -->
  <g transform="translate(20, 185)">
    <rect x="0" y="0" width="640" height="72" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" />
    <text x="14" y="20" font-size="11" font-weight="700" fill="#111827">Physical Memory Substrate: Flat 1D Byte Ribbon in DRAM</text>
    <text x="440" y="20" font-size="9" font-family="'TeX Gyre Cursor', monospace" fill="#4b5563">Hardware has no dimensions</text>
    
    <!-- DRAM Byte cells with rx="0" -->
    <g transform="translate(14, 28)">
      <!-- Cell 0 -->
      <rect x="0" y="0" width="72" height="34" rx="0" fill="#ffffff" stroke="#111827" stroke-width="1" />
      <text x="36" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#6b7280">0x0000</text>
      <text x="36" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">val[0,0]</text>

      <!-- Cell 1 -->
      <rect x="72" y="0" width="72" height="34" rx="0" fill="#ffffff" stroke="#111827" stroke-width="1" />
      <text x="108" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#6b7280">0x0004</text>
      <text x="108" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">val[0,1]</text>

      <!-- Cell 2 -->
      <rect x="144" y="0" width="72" height="34" rx="0" fill="#ffffff" stroke="#111827" stroke-width="1" />
      <text x="180" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#6b7280">0x0008</text>
      <text x="180" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#111827">val[0,2]</text>

      <!-- Cell 3 (stride step) -->
      <rect x="216" y="0" width="72" height="34" rx="0" fill="#fff7ed" stroke="#c85a17" stroke-width="1.2" />
      <text x="252" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#c85a17">0x000C</text>
      <text x="252" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">val[1,0]</text>

      <!-- Cell 4 -->
      <rect x="288" y="0" width="72" height="34" rx="0" fill="#fff7ed" stroke="#c85a17" stroke-width="1.2" />
      <text x="324" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#c85a17">0x0010</text>
      <text x="324" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">val[1,1]</text>

      <!-- Cell 5 -->
      <rect x="360" y="0" width="72" height="34" rx="0" fill="#fff7ed" stroke="#c85a17" stroke-width="1.2" />
      <text x="396" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#c85a17">0x0014</text>
      <text x="396" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">val[1,2]</text>

      <!-- Ellipsis / Next buffer segment -->
      <rect x="432" y="0" width="50" height="34" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2" />
      <text x="457" y="22" text-anchor="middle" font-size="12" fill="#6b7280">···</text>

      <!-- Weight buffer block -->
      <rect x="482" y="0" width="130" height="34" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
      <text x="547" y="15" text-anchor="middle" font-size="8" font-family="'TeX Gyre Cursor', monospace" fill="#2563eb">Weight / Grad Tape</text>
      <text x="547" y="28" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Offset: S_0 × i + S_1 × j</text>
    </g>
  </g>
</svg>
