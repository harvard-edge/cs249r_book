<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="205" viewBox="0 0 220 205" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#475569"/>
    </marker>
  </defs>

  
  <rect width="220" height="205" fill="#ffffff"/>

  
  <rect x="5" y="5" width="210" height="195" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">INT32 ACCUMULATOR WIDENING</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">GEMM</text>

  
  <g transform="translate(14, 29)">
    
    <rect x="0" y="0" width="92" height="26" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="46" y="10" text-anchor="middle" font-size="6.3" font-weight="bold" fill="#1e40af">ACTIVATION</text>
    <text x="46" y="18" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#2563eb">q_x - Z_x (8-bit)</text>
    <text x="46" y="24" text-anchor="middle" font-size="5.0" fill="#64748b">Range: [0, 255]</text>

    
    <rect x="100" y="0" width="92" height="26" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="146" y="10" text-anchor="middle" font-size="6.3" font-weight="bold" fill="#1e40af">WEIGHT</text>
    <text x="146" y="18" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#2563eb">q_w - Z_w (8-bit)</text>
    <text x="146" y="24" text-anchor="middle" font-size="5.0" fill="#64748b">Range: [0, 255]</text>
  </g>

  
  <path d="M 60 55 L 102 65" stroke="#93c5fd" stroke-width="1"/>
  <path d="M 160 55 L 118 65" stroke="#93c5fd" stroke-width="1"/>
  <circle cx="110" cy="65" r="7" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="110" y="68" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#c85a17">×</text>

  
  <g transform="translate(14, 76)">
    <rect x="0" y="0" width="192" height="22" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="96" y="9.5" text-anchor="middle" font-size="6.3" font-weight="bold" fill="#c85a17">16-Bit Product: 255 × 255 = 65,025</text>
    <text x="96" y="18" text-anchor="middle" font-size="5.6" fill="#9a3412">16-bit registers overflow after only 2 MAC steps</text>
  </g>

  
  <line x1="110" y1="98" x2="110" y2="105" stroke="#0d9488" stroke-width="1.2" marker-end="url(#arrow-teal)"/>

  
  <g transform="translate(14, 107)">
    <rect x="0" y="0" width="192" height="34" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-size="7.0" font-weight="bold" fill="#115e59">32-BIT INTEGER ACCUMULATOR (INT32)</text>
    <text x="96" y="21" text-anchor="middle" font-size="6.0" font-family="monospace" fill="#0d9488">acc = Σ (q_x - Z_x)(q_w - Z_w)</text>
    <text x="96" y="29.5" text-anchor="middle" font-size="5.7" fill="#134e4a">Capacity: 2.14B (safe for K &gt; 33,000 dot products)</text>
  </g>

  
  <line x1="110" y1="141" x2="110" y2="148" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>

  
  <g transform="translate(14, 150)">
    <rect x="0" y="0" width="192" height="28" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="96" y="9.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#1f2937">Epilogue: Float Rescaling</text>
    <text x="96" y="18" text-anchor="middle" font-size="6.0" font-family="monospace" fill="#0f172a">y = acc × (S_x · S_w) + bias</text>
    <text x="96" y="24.5" text-anchor="middle" font-size="5.3" fill="#64748b">Only one float multiply per output activation</text>
  </g>

  
  <g transform="translate(14, 183)">
    <rect x="0" y="0" width="192" height="12" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="96" y="8.5" text-anchor="middle" font-size="5.7" font-weight="bold" fill="#1e40af">Bandwidth: 8-bit load | Compute: 32-bit integer MAC</text>
  </g>
</svg>
