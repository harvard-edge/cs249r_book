<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="175" viewBox="0 0 220 175" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="175" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="165" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">CACHE LINE SPATIAL LOCALITY</text>
  <text x="205" y="19" text-anchor="end" font-size="6.5" font-family="monospace" fill="#64748b">64B LINE</text>

  <g transform="translate(14, 27)">
    <text x="0" y="8" font-size="6.8" font-weight="700" fill="#334155">64-Byte Transfer Unit (16 × Float32)</text>
    <text x="192" y="8" text-anchor="end" font-size="5.8" font-family="monospace" fill="#64748b">DRAM → L1</text>

    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="19" height="16" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
      <text x="9.5" y="11" text-anchor="middle" font-size="5.8" font-family="monospace" font-weight="bold" fill="#1e40af">f0</text>

      <rect x="22" y="0" width="19" height="16" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="31.5" y="11" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#475569">f1</text>

      <rect x="44" y="0" width="19" height="16" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="53.5" y="11" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#475569">f2</text>

      <rect x="66" y="0" width="19" height="16" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="75.5" y="11" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#475569">f3</text>

      <text x="97" y="11" text-anchor="middle" font-size="6" fill="#9ca3af">···</text>

      <rect x="108" y="0" width="19" height="16" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="117.5" y="11" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#475569">f14</text>

      <rect x="130" y="0" width="19" height="16" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="139.5" y="11" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#475569">f15</text>

      <rect x="153" y="0" width="39" height="16" rx="1" fill="#f1f5f9" stroke="#9ca3af" stroke-width="0.8"/>
      <text x="172.5" y="11" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#334155">64 Bytes</text>
    </g>
  </g>

  <g transform="translate(14, 66)">
    <rect x="0" y="0" width="192" height="39" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="6" y="10" font-size="6.5" font-weight="700" fill="#0f766e">Row Walk (Stride = 4 B)</text>
    <text x="186" y="10" text-anchor="end" font-size="5.8" font-family="monospace" font-weight="700" fill="#0f766e">1 MISS / 15 HITS</text>

    <g transform="translate(6, 14)">
      <rect x="0" y="0" width="28" height="19" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="14" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#c85a17">f[i, 0]</text>
      <text x="14" y="15.5" text-anchor="middle" font-size="4.8" font-weight="bold" fill="#c85a17">1 Miss</text>

      <rect x="32" y="0" width="90" height="19" rx="1" fill="#ccfbf1" stroke="#14b8a6" stroke-width="0.8"/>
      <text x="77" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#0f766e">f[i, 1] ... f[i, 15]</text>
      <text x="77" y="15.5" text-anchor="middle" font-size="4.8" fill="#0f766e">15 L1 Cache Hits (0 B DRAM)</text>

      <rect x="126" y="0" width="54" height="19" rx="1" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
      <text x="153" y="8.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#0f766e">100% Used</text>
      <text x="153" y="15.5" text-anchor="middle" font-size="4.8" font-family="monospace" fill="#0f766e">16 / 16 floats</text>
    </g>
  </g>

  <g transform="translate(14, 110)">
    <rect x="0" y="0" width="192" height="39" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="6" y="10" font-size="6.5" font-weight="700" fill="#c85a17">Column Walk (Stride = 8192 B)</text>
    <text x="186" y="10" text-anchor="end" font-size="5.8" font-family="monospace" font-weight="700" fill="#c85a17">16 MISSES / 0 HITS</text>

    <g transform="translate(6, 14)">
      <rect x="0" y="0" width="28" height="19" rx="1" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
      <text x="14" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#b91c1c">f[0, j]</text>
      <text x="14" y="15.5" text-anchor="middle" font-size="4.8" font-weight="bold" fill="#b91c1c">1 Miss</text>

      <rect x="32" y="0" width="90" height="19" rx="1" fill="#fff7ed" stroke="#fdba74" stroke-width="0.8" stroke-dasharray="2 2"/>
      <text x="77" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#9a3412">15 floats evicted unread</text>
      <text x="77" y="15.5" text-anchor="middle" font-size="4.8" fill="#c2410c">Next read jumps to row + 1</text>

      <rect x="126" y="0" width="54" height="19" rx="1" fill="#ffffff" stroke="#c85a17" stroke-width="0.8"/>
      <text x="153" y="8.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#c85a17">6.25% Used</text>
      <text x="153" y="15.5" text-anchor="middle" font-size="4.8" font-family="monospace" fill="#c85a17">1 / 16 floats</text>
    </g>
  </g>

  <g transform="translate(14, 154)">
    <rect x="0" y="0" width="192" height="12" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="96" y="8.5" text-anchor="middle" font-size="5.7" font-weight="bold" fill="#334155">Column walks trigger 16× more DRAM cache line loads</text>
  </g>
</svg>
