<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="235" viewBox="0 0 220 235" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="220" height="235" fill="#ffffff"/>

  <!-- Outer Card -->
  <rect x="5" y="5" width="210" height="225" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">3-ENGINE SYSTEMS ROSETTA</text>

  <!-- Framework Legend Badges -->
  <g transform="translate(0, 0)">
    <rect x="12" y="29" width="62" height="13" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="43" y="38.5" text-anchor="middle" font-size="5.4" font-weight="700" fill="#c85a17">TinyTorch (Ref)</text>

    <rect x="78" y="29" width="62" height="13" rx="1.5" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="109" y="38.5" text-anchor="middle" font-size="5.4" font-weight="700" fill="#1e40af">PyTorch (Dynamic)</text>

    <rect x="144" y="29" width="64" height="13" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
    <text x="176" y="38.5" text-anchor="middle" font-size="5.4" font-weight="700" fill="#0f766e">JAX (Functional)</text>
  </g>

  <!-- Section 1: Tensor Storage -->
  <rect x="12" y="46" width="196" height="14" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="18" y="56" font-size="6.5" font-weight="700" fill="#1f2937">1. TENSOR STORAGE</text>
  <text x="202" y="56" text-anchor="end" font-size="5.2" fill="#64748b">Memory Substrate</text>

  <rect x="15" y="63" width="17" height="10" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.6"/>
  <text x="23.5" y="70.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#c85a17">TT</text>
  <text x="36" y="70.5" font-size="5.8" fill="#1f2937"><tspan font-family="monospace" font-weight="600">ndarray</tspan>: flat buffer, shape + strides</text>

  <rect x="15" y="75" width="17" height="10" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.6"/>
  <text x="23.5" y="82.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#1e40af">PT</text>
  <text x="36" y="82.5" font-size="5.8" fill="#1f2937"><tspan font-family="monospace" font-weight="600">TensorImpl</tspan>: intrusive ptr to Storage</text>

  <rect x="15" y="87" width="17" height="10" rx="1" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.6"/>
  <text x="23.5" y="94.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#0f766e">JX</text>
  <text x="36" y="94.5" font-size="5.8" fill="#1f2937"><tspan font-family="monospace" font-weight="600">jax.Array</tspan>: immutable XLA buffer ptr</text>

  <!-- Section 2: Autograd Engine -->
  <rect x="12" y="103" width="196" height="14" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="18" y="113" font-size="6.5" font-weight="700" fill="#1f2937">2. AUTOGRAD ENGINE</text>
  <text x="202" y="113" text-anchor="end" font-size="5.2" fill="#64748b">Reverse Differentiation</text>

  <rect x="15" y="120" width="17" height="10" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.6"/>
  <text x="23.5" y="127.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#c85a17">TT</text>
  <text x="36" y="127.5" font-size="5.8" fill="#1f2937">Dynamic tape with DFS topological traversal</text>

  <rect x="15" y="132" width="17" height="10" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.6"/>
  <text x="23.5" y="139.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#1e40af">PT</text>
  <text x="36" y="139.5" font-size="5.8" fill="#1f2937">C++ <tspan font-family="monospace">Node</tspan> DAG with topological engine</text>

  <rect x="15" y="144" width="17" height="10" rx="1" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.6"/>
  <text x="23.5" y="151.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#0f766e">JX</text>
  <text x="36" y="151.5" font-size="5.8" fill="#1f2937">Pure functional <tspan font-family="monospace">jax.vjp</tspan> pull-back closure</text>

  <!-- Section 3: Compiler Lowering -->
  <rect x="12" y="160" width="196" height="14" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="18" y="170" font-size="6.5" font-weight="700" fill="#1f2937">3. COMPILER LOWERING</text>
  <text x="202" y="170" text-anchor="end" font-size="5.2" fill="#64748b">Kernel Lowering</text>

  <rect x="15" y="177" width="17" height="10" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.6"/>
  <text x="23.5" y="184.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#c85a17">TT</text>
  <text x="36" y="184.5" font-size="5.8" fill="#1f2937">Fused C++ SIMD and custom Triton kernels</text>

  <rect x="15" y="189" width="17" height="10" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.6"/>
  <text x="23.5" y="196.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#1e40af">PT</text>
  <text x="36" y="196.5" font-size="5.8" fill="#1f2937">Dynamo FX graph to Inductor Triton kernels</text>

  <rect x="15" y="201" width="17" height="10" rx="1" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.6"/>
  <text x="23.5" y="208.5" text-anchor="middle" font-size="5.2" font-weight="700" fill="#0f766e">JX</text>
  <text x="36" y="208.5" font-size="5.8" fill="#1f2937"><tspan font-family="monospace">jaxpr</tspan> IR to StableHLO to XLA executable</text>

  <!-- Summary Footer -->
  <rect x="12" y="217" width="196" height="11" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.7"/>
  <text x="110" y="224.5" text-anchor="middle" font-size="5.2" font-weight="600" fill="#64748b">Unified systems contracts across modern ML engines</text>
</svg>
