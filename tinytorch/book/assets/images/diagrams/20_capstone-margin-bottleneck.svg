<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="175" viewBox="0 0 220 175" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="175" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="165" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">BOTTLENECK MIGRATION</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">DECODE</text>

  <g transform="translate(14, 27)">
    <text x="0" y="6.5" font-size="6.0" font-family="monospace" font-weight="bold" fill="#1e293b">T = max(M, C) + L</text>
    <rect x="95" y="1" width="6" height="6" rx="1" fill="#cbd5e1" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="104" y="6.5" font-size="5.5" fill="#475569">Launch (L)</text>
    <rect x="145" y="1" width="6" height="6" rx="1" fill="#ff8246"/>
    <text x="154" y="6.5" font-size="5.5" fill="#475569">Memory (M)</text>
  </g>

  <g transform="translate(14, 40)">
    <text x="0" y="6" font-size="6.8" font-weight="700" fill="#1f2937">1. Baseline (Unfused FP32)</text>
    <text x="192" y="6" text-anchor="end" font-size="6.5" font-family="monospace" font-weight="bold" fill="#1f2937">1.06 ms</text>
    <rect x="0" y="10" width="140" height="10" rx="1" fill="#e2e8f0" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="70" y="18" text-anchor="middle" font-size="5.4" font-weight="600" fill="#475569">Launch 1.04 ms (98.2%)</text>
    <rect x="141" y="10" width="4" height="10" rx="1" fill="#ff8246"/>
    <text x="0" y="27" font-size="5.4" fill="#64748b">208 ops at 5 μs launch: memory traffic is completely masked</text>
  </g>

  <g transform="translate(14, 75)">
    <text x="0" y="6" font-size="6.8" font-weight="700" fill="#1f2937">2. + Kernel Fusion (49 → 9 ops/block)</text>
    <text x="192" y="6" text-anchor="end" font-size="6.5" font-family="monospace" font-weight="bold" fill="#0d9488">0.21 ms (4.9×)</text>
    <rect x="0" y="10" width="28" height="10" rx="1" fill="#e2e8f0" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="14" y="18" text-anchor="middle" font-size="5" font-weight="600" fill="#475569">0.20 ms</text>
    <rect x="29" y="10" width="4" height="10" rx="1" fill="#ff8246"/>
    <text x="0" y="27" font-size="5.4" fill="#64748b">Launch drops 5.3×: memory transfers now expose 9% of step</text>
  </g>

  <g transform="translate(14, 110)">
    <text x="0" y="6" font-size="6.8" font-weight="700" fill="#1f2937">3. + INT8 Quantization &amp; KV Cache</text>
    <text x="192" y="6" text-anchor="end" font-size="6.5" font-family="monospace" font-weight="bold" fill="#c85a17">0.20 ms (5.3×)</text>
    <rect x="0" y="10" width="28" height="10" rx="1" fill="#e2e8f0" stroke="#9ca3af" stroke-width="0.8"/>
    <rect x="29" y="10" width="2" height="10" rx="1" fill="#ff8246"/>
    <text x="0" y="27" font-size="5.4" fill="#64748b">Weights 4× smaller: attention recompute drops from O(S²) to O(S)</text>
  </g>

  <g transform="translate(14, 144)">
    <rect x="0" y="0" width="192" height="21" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="6" y="9" font-size="5.8" font-weight="700" fill="#c85a17">Bottleneck Migration Principle:</text>
    <text x="6" y="17" font-size="5.3" fill="#1f2937">Optimizing memory buys nothing while launch overhead dominates.</text>
  </g>
</svg>
