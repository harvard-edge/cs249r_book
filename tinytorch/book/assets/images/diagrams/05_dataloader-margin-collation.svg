<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="205" viewBox="0 0 220 205" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="205" fill="#ffffff"/>
  <!-- Outer Card -->
  <rect x="5" y="5" width="210" height="195" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Header Banner -->
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">BATCH COLLATION MEMORY</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">B=4, D=2</text>

  <!-- Section 1: Scattered Sample Buffers in Heap -->
  <text x="12" y="37" font-size="7" font-weight="700" fill="#334155">1. Scattered Sample Buffers (Disjoint Heap)</text>

  <g transform="translate(12, 42)">
    <!-- Sample 7 -->
    <rect x="0" y="0" width="95" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="4" y="11.5" font-size="5.5" font-family="monospace" fill="#64748b">0x10A0</text>
    <text x="46" y="11.5" text-anchor="middle" font-size="6.5" font-family="monospace" font-weight="bold" fill="#1f2937">[7.0, 7.5]</text>
    <text x="91" y="11.5" text-anchor="end" font-size="6" font-weight="bold" fill="#c85a17">S7</text>

    <!-- Sample 8 -->
    <rect x="101" y="0" width="95" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="11.5" font-size="5.5" font-family="monospace" fill="#64748b">0x24C0</text>
    <text x="147" y="11.5" text-anchor="middle" font-size="6.5" font-family="monospace" font-weight="bold" fill="#1f2937">[8.0, 8.5]</text>
    <text x="192" y="11.5" text-anchor="end" font-size="6" font-weight="bold" fill="#c85a17">S8</text>

    <!-- Sample 1 -->
    <rect x="0" y="21" width="95" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="4" y="32.5" font-size="5.5" font-family="monospace" fill="#64748b">0x08E0</text>
    <text x="46" y="32.5" text-anchor="middle" font-size="6.5" font-family="monospace" font-weight="bold" fill="#1f2937">[1.0, 1.5]</text>
    <text x="91" y="32.5" text-anchor="end" font-size="6" font-weight="bold" fill="#c85a17">S1</text>

    <!-- Sample 5 -->
    <rect x="101" y="21" width="95" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="32.5" font-size="5.5" font-family="monospace" fill="#64748b">0x31F0</text>
    <text x="147" y="32.5" text-anchor="middle" font-size="6.5" font-family="monospace" font-weight="bold" fill="#1f2937">[5.0, 5.5]</text>
    <text x="192" y="32.5" text-anchor="end" font-size="6" font-weight="bold" fill="#c85a17">S5</text>
  </g>

  <!-- Section 2: Collation Action Pill -->
  <g transform="translate(12, 85)">
    <rect x="0" y="0" width="196" height="19" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="8" y="12.5" font-size="6.8" font-family="monospace" font-weight="bold" fill="#c85a17">np.stack(tensors, axis=0)</text>
    <text x="190" y="12.5" text-anchor="end" font-size="6.2" fill="#ea580c">allocates + memcpy</text>
  </g>

  <!-- Section 3: Contiguous Batch Buffer -->
  <text x="12" y="117" font-size="7" font-weight="700" fill="#0f766e">2. Contiguous Batch Buffer (Row-Major)</text>

  <g transform="translate(12, 122)">
    <rect x="0" y="0" width="196" height="56" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>

    <!-- Row 0 -->
    <rect x="3" y="3" width="190" height="11" rx="0.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>
    <text x="8" y="11" font-size="5.5" font-family="monospace" fill="#0d9488">+0</text>
    <text x="32" y="11" font-size="6" font-weight="bold" fill="#1f2937">Row 0 (S7)</text>
    <text x="110" y="11" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">7.0</text>
    <text x="160" y="11" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">7.5</text>

    <!-- Row 1 -->
    <rect x="3" y="16" width="190" height="11" rx="0.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>
    <text x="8" y="24" font-size="5.5" font-family="monospace" fill="#0d9488">+2</text>
    <text x="32" y="24" font-size="6" font-weight="bold" fill="#1f2937">Row 1 (S8)</text>
    <text x="110" y="24" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">8.0</text>
    <text x="160" y="24" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">8.5</text>

    <!-- Row 2 -->
    <rect x="3" y="29" width="190" height="11" rx="0.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>
    <text x="8" y="37" font-size="5.5" font-family="monospace" fill="#0d9488">+4</text>
    <text x="32" y="37" font-size="6" font-weight="bold" fill="#1f2937">Row 2 (S1)</text>
    <text x="110" y="37" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">1.0</text>
    <text x="160" y="37" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">1.5</text>

    <!-- Row 3 -->
    <rect x="3" y="42" width="190" height="11" rx="0.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>
    <text x="8" y="50" font-size="5.5" font-family="monospace" fill="#0d9488">+6</text>
    <text x="32" y="50" font-size="6" font-weight="bold" fill="#1f2937">Row 3 (S5)</text>
    <text x="110" y="50" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">5.0</text>
    <text x="160" y="50" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#115e59">5.5</text>
  </g>

  <!-- Section 4: Hardware Invariant Banner -->
  <rect x="12" y="183" width="196" height="15" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="193.5" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#115e59">Strides (2, 1) elements: saturates SIMD and BLAS GEMM</text>
</svg>
