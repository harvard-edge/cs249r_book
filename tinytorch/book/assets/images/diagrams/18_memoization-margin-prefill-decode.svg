<svg xmlns="http://www.w3.org/2000/svg" width="220" height="215" viewBox="0 0 220 215" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="215" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="205" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">PREFILL VS DECODE PHASES</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">INFERENCE</text>

  <g transform="translate(12, 30)">
    <rect x="0" y="0" width="196" height="73" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <rect x="4" y="4" width="94" height="12" rx="1.5" fill="#ccfbf1"/>
    <text x="51" y="12.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#0f766e">1. PREFILL (PROMPT)</text>
    <text x="190" y="13" text-anchor="end" font-size="6.0" font-family="monospace" font-weight="bold" fill="#0d9488">Compute-Bound</text>

    <rect x="6" y="20" width="14" height="14" rx="1" fill="#99f6e4" stroke="#0d9488" stroke-width="0.8"/>
    <text x="13" y="29.5" text-anchor="middle" font-size="6.0" font-family="monospace" font-weight="bold" fill="#134e4a">x₁</text>
    <rect x="22" y="20" width="14" height="14" rx="1" fill="#99f6e4" stroke="#0d9488" stroke-width="0.8"/>
    <text x="29" y="29.5" text-anchor="middle" font-size="6.0" font-family="monospace" font-weight="bold" fill="#134e4a">x₂</text>
    <rect x="38" y="20" width="18" height="14" rx="1" fill="#99f6e4" stroke="#0d9488" stroke-width="0.8"/>
    <text x="47" y="29.5" text-anchor="middle" font-size="6.0" font-family="monospace" font-weight="bold" fill="#134e4a">x_P</text>

    <text x="64" y="25" font-size="6.0" font-weight="bold" fill="#134e4a">Query:</text>
    <text x="90" y="25" font-size="6.0" font-family="monospace" fill="#0f766e">S_q = P prompt rows</text>
    <text x="64" y="34" font-size="6.0" font-weight="bold" fill="#134e4a">Math:</text>
    <text x="90" y="34" font-size="6.0" font-family="monospace" fill="#0f766e">GEMM (P × P score matrix)</text>

    <text x="6" y="45" font-size="5.8" font-family="monospace" fill="#115e59">Cache: Bulk populates slots 0 to P-1</text>

    <rect x="4" y="52" width="188" height="16" rx="1.5" fill="#ffffff" stroke="#99f6e4" stroke-width="0.8"/>
    <text x="10" y="63" font-size="5.8" font-family="monospace" fill="#134e4a">Intensity: High FLOP/Byte</text>
    <text x="186" y="63" text-anchor="end" font-size="5.8" font-weight="bold" fill="#0d9488">PARALLEL GEMM</text>
  </g>

  <g transform="translate(12, 109)">
    <rect x="0" y="0" width="196" height="74" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <rect x="4" y="4" width="94" height="12" rx="1.5" fill="#ffedd5"/>
    <text x="51" y="12.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#c85a17">2. DECODE (GENERATION)</text>
    <text x="190" y="13" text-anchor="end" font-size="6.0" font-family="monospace" font-weight="bold" fill="#c85a17">Memory-Bound</text>

    <rect x="6" y="20" width="22" height="14" rx="1" fill="#fed7aa" stroke="#ff8246" stroke-width="1"/>
    <text x="17" y="29.5" text-anchor="middle" font-size="6.0" font-family="monospace" font-weight="bold" fill="#c85a17">x_t</text>
    <text x="34" y="29.5" text-anchor="middle" font-size="6.5" fill="#ea580c">→</text>
    <rect x="40" y="20" width="16" height="14" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="48" y="29.5" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">1×t</text>

    <text x="64" y="25" font-size="6.0" font-weight="bold" fill="#7c2d12">Query:</text>
    <text x="90" y="25" font-size="6.0" font-family="monospace" fill="#c85a17">S_q = 1 single row</text>
    <text x="64" y="34" font-size="6.0" font-weight="bold" fill="#7c2d12">Math:</text>
    <text x="90" y="34" font-size="6.0" font-family="monospace" fill="#c85a17">GEMV (1 × t score vector)</text>

    <text x="6" y="45" font-size="5.8" font-family="monospace" fill="#9a3412">Cache: Writes slot t, reads past 0 to t</text>

    <rect x="4" y="52" width="188" height="16" rx="1.5" fill="#ffffff" stroke="#fed7aa" stroke-width="0.8"/>
    <text x="10" y="63" font-size="5.8" font-family="monospace" fill="#7c2d12">Intensity: &lt;&lt; 1 FLOP/Byte</text>
    <text x="186" y="63" text-anchor="end" font-size="5.8" font-weight="bold" fill="#ea580c">BANDWIDTH BOUND</text>
  </g>

  <rect x="12" y="189" width="196" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="200" text-anchor="middle" font-size="5.8" font-weight="600" fill="#475569">Invariant: Prefill builds cache; decode reads history</text>
</svg>
