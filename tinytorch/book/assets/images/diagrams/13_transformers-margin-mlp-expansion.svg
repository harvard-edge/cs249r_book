<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="175" viewBox="0 0 220 175" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="175" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="165" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">MLP 4X CHANNEL EXPANSION</text>

  <g transform="translate(0, 0)">
    <text x="15" y="44" font-size="6.5" fill="#6b7280">Input vector</text>
    <rect x="85" y="32" width="50" height="18" rx="1" fill="#f1f5f9" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="110" y="44" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1f2937">x [D]</text>
    <text x="205" y="44" text-anchor="end" font-size="6.5" font-family="monospace" fill="#6b7280">[B, S, D]</text>
  </g>

  <g transform="translate(0, 0)">
    <path d="M 85 50 L 18 66 M 135 50 L 202 66" fill="none" stroke="#ff8246" stroke-width="0.8" stroke-dasharray="2 2"/>
    <rect x="42" y="52" width="136" height="12" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="0.6"/>
    <text x="110" y="61" text-anchor="middle" font-size="6" font-family="monospace" font-weight="bold" fill="#c85a17">Linear1: W₁ (D → 4D) + b₁</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="16" y="66" width="188" height="24" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="110" y="78" text-anchor="middle" font-size="7" font-weight="700" fill="#c85a17">GELU Non-Linear Activation</text>
    <text x="110" y="87" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#c85a17">Expanded channel dimension: 4D</text>
  </g>

  <g transform="translate(0, 0)">
    <path d="M 18 90 L 85 106 M 202 90 L 135 106" fill="none" stroke="#ff8246" stroke-width="0.8" stroke-dasharray="2 2"/>
    <rect x="42" y="93" width="136" height="12" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="0.6"/>
    <text x="110" y="102" text-anchor="middle" font-size="6" font-family="monospace" font-weight="bold" fill="#c85a17">Linear2: W₂ (4D → D) + b₂</text>
  </g>

  <g transform="translate(0, 0)">
    <text x="15" y="119" font-size="6.5" fill="#6b7280">Output delta</text>
    <rect x="85" y="107" width="50" height="18" rx="1" fill="#f1f5f9" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="110" y="119" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1f2937">Δx [D]</text>
    <text x="205" y="119" text-anchor="end" font-size="6.5" font-family="monospace" fill="#6b7280">Adds to stream</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="13" y="130" width="194" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="19" y="140" font-size="6" font-weight="700" fill="#1f2937">Parameter Cost:</text>
    <text x="73" y="140" font-size="6" fill="#6b7280">8D² weights (double MHA's 4D²)</text>

    <text x="19" y="150" font-size="6" font-weight="700" fill="#1f2937">Channel Mixing:</text>
    <text x="73" y="150" font-size="6" fill="#6b7280">Transforms features per position</text>

    <text x="19" y="160" font-size="6" font-weight="700" fill="#1f2937">Token Isolation:</text>
    <text x="71" y="160" font-size="6" fill="#6b7280">Zero communication across sequence S</text>
  </g>
</svg>
