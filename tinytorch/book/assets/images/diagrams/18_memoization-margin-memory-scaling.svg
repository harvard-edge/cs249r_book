<svg xmlns="http://www.w3.org/2000/svg" width="220" height="215" viewBox="0 0 220 215" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="215" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="205" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">KV CACHE MEMORY SCALING</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">BYTES</text>

  <g transform="translate(12, 30)">
    <rect x="0" y="0" width="196" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="98" y="11" text-anchor="middle" font-size="6.8" font-family="monospace" font-weight="bold" fill="#1e293b">Bytes = 2 · B · L · H_kv · S · d_k · b</text>

    <rect x="4" y="16" width="34" height="13" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.6"/>
    <text x="21" y="25" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#c85a17">2: K+V</text>

    <rect x="41" y="16" width="46" height="13" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.6"/>
    <text x="64" y="25" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#1e40af">B · L · H_kv</text>

    <rect x="90" y="16" width="46" height="13" rx="1" fill="#f0fdfa" stroke="#99f6e4" stroke-width="0.6"/>
    <text x="113" y="25" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#0f766e">S · d_k</text>

    <rect x="139" y="16" width="53" height="13" rx="1" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.6"/>
    <text x="165.5" y="25" text-anchor="middle" font-size="5.4" font-family="monospace" font-weight="bold" fill="#475569">b: 2B or 4B</text>
  </g>

  <text x="14" y="74" font-size="6.8" font-weight="700" fill="#334155">Scale Comparison: Weights vs KV Cache</text>

  <g transform="translate(12, 79)">
    <rect x="0" y="0" width="196" height="30" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
    <text x="6" y="11" font-size="6.0" font-weight="bold" fill="#0f766e">TinyGPT (B=1, S=512, FP32):</text>
    <text x="190" y="11" text-anchor="end" font-size="5.8" font-family="monospace" font-weight="bold" fill="#0d9488">1.0 MB (L2 Cache)</text>

    <rect x="6" y="16" width="184" height="8" rx="1" fill="#ccfbf1"/>
    <rect x="6" y="16" width="45" height="8" rx="1" fill="#0d9488"/>
    <text x="8" y="22.5" font-size="5.0" font-weight="bold" fill="#ffffff">Weights 0.3MB</text>
    <text x="56" y="22.5" font-size="5.0" font-family="monospace" fill="#0f766e">KV Cache: 1.0 MB (Per sequence)</text>
  </g>

  <g transform="translate(12, 114)">
    <rect x="0" y="0" width="196" height="42" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="6" y="11" font-size="6.0" font-weight="bold" fill="#c85a17">LLaMA-3-8B (S=8,192, BF16):</text>
    <text x="190" y="11" text-anchor="end" font-size="5.8" font-family="monospace" fill="#9a3412">128 KB / token</text>

    <text x="6" y="21" font-size="5.6" font-family="monospace" fill="#7c2d12">Batch 1: 1.05 GB | Batch 64: 67.2 GB KV Cache</text>

    <rect x="6" y="26" width="184" height="11" rx="1" fill="#fed7aa"/>
    <rect x="6" y="26" width="38" height="11" rx="1" fill="#ff8246"/>
    <text x="9" y="34.5" font-size="5.0" font-weight="bold" fill="#ffffff">Weights 16GB</text>
    <text x="48" y="34.5" font-size="5.0" font-family="monospace" font-weight="bold" fill="#c85a17">KV Cache (B=64): 67.2 GB (4.2× Weights!)</text>
  </g>

  <g transform="translate(12, 161)">
    <rect x="0" y="0" width="196" height="23" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="6" y="9.5" font-size="5.8" font-weight="bold" fill="#334155">Production Mitigation: GQA &amp; PagedAttention</text>
    <text x="6" y="18" font-size="5.4" font-family="monospace" fill="#64748b">GQA reduces H_kv by 4× to 8×; vLLM eliminates gaps</text>
  </g>

  <rect x="12" y="189" width="196" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="200" text-anchor="middle" font-size="5.8" font-weight="600" fill="#475569">Invariant: Cache footprint scales O(B · S), outgrowing weights</text>
</svg>
