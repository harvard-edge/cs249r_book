<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="225" viewBox="0 0 220 225" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="225" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="215" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">THE FIVE-STEP STATE CONTRACT</text>

  <g transform="translate(12, 30)">
    <rect x="0" y="0" width="196" height="27" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="4" y="4" width="16" height="19" rx="1.5" fill="#e2e8f0"/>
    <text x="12" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#334155">1</text>
    <text x="26" y="13" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1e293b">zero_grad()</text>
    <text x="26" y="22" font-size="6.5" fill="#64748b">Clears stale buffers</text>
    <text x="190" y="17" text-anchor="end" font-size="7" font-family="monospace" font-weight="bold" fill="#475569">∇W = None</text>
  </g>

  <path d="M 110 57 L 110 63" stroke="#9ca3af" stroke-width="1.2"/>
  <polygon points="108,61 110,64 112,61" fill="#9ca3af"/>

  <g transform="translate(12, 64)">
    <rect x="0" y="0" width="196" height="27" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <rect x="4" y="4" width="16" height="19" rx="1.5" fill="#dbeafe"/>
    <text x="12" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">2</text>
    <text x="26" y="13" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1e40af">forward(batch_x)</text>
    <text x="26" y="22" font-size="6.5" fill="#2563eb">Evaluates model at W</text>
    <text x="190" y="17" text-anchor="end" font-size="7" font-family="monospace" font-weight="bold" fill="#1e40af">Tape + Act</text>
  </g>

  <path d="M 110 91 L 110 97" stroke="#9ca3af" stroke-width="1.2"/>
  <polygon points="108,95 110,98 112,95" fill="#9ca3af"/>

  <g transform="translate(12, 98)">
    <rect x="0" y="0" width="196" height="27" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <rect x="4" y="4" width="16" height="19" rx="1.5" fill="#ccfbf1"/>
    <text x="12" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#0f766e">3</text>
    <text x="26" y="13" font-size="7.5" font-family="monospace" font-weight="bold" fill="#115e59">criterion(y_pred, y)</text>
    <text x="26" y="22" font-size="6.5" fill="#0d9488">Computes batch mean</text>
    <text x="190" y="17" text-anchor="end" font-size="7" font-family="monospace" font-weight="bold" fill="#115e59">Scalar L</text>
  </g>

  <path d="M 110 125 L 110 131" stroke="#9ca3af" stroke-width="1.2"/>
  <polygon points="108,129 110,132 112,129" fill="#9ca3af"/>

  <g transform="translate(12, 132)">
    <rect x="0" y="0" width="196" height="27" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <rect x="4" y="4" width="16" height="19" rx="1.5" fill="#ffedd5"/>
    <text x="12" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#c85a17">4</text>
    <text x="26" y="13" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">loss.backward()</text>
    <text x="26" y="22" font-size="6.5" fill="#ea580c">Traverses tape backwards</text>
    <text x="190" y="17" text-anchor="end" font-size="7" font-family="monospace" font-weight="bold" fill="#c85a17">∇W += ∂L/∂W</text>
  </g>

  <path d="M 110 159 L 110 165" stroke="#9ca3af" stroke-width="1.2"/>
  <polygon points="108,163 110,166 112,163" fill="#9ca3af"/>

  <g transform="translate(12, 166)">
    <rect x="0" y="0" width="196" height="27" rx="2" fill="#f8fafc" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="4" y="4" width="16" height="19" rx="1.5" fill="#1e293b"/>
    <text x="12" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">5</text>
    <text x="26" y="13" font-size="7.5" font-family="monospace" font-weight="bold" fill="#0f172a">optimizer.step()</text>
    <text x="26" y="22" font-size="6.5" fill="#475569">In-place parameter update</text>
    <text x="190" y="17" text-anchor="end" font-size="7" font-family="monospace" font-weight="bold" fill="#0f172a">W ← W - η·∇W</text>
  </g>

  <rect x="12" y="199" width="196" height="16" rx="2" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="110" y="210" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#c85a17">Invariant: Parameters stay fixed from Step 1 to 4</text>
</svg>
