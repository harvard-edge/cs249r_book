<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="290" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="100" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Fix the experiment</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Same inputs and model mode</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Record environment and seed</text>
<rect x="250" y="30" width="180" height="100" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="340.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Warm up</text>
<text x="340.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Run untimed iterations</text>
<text x="340.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Then use perf_counter</text>
<rect x="470" y="30" width="180" height="100" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="560.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Repeat measurements</text>
<text x="560.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Time completed CPU forwards</text>
<text x="560.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Retain latency samples</text>
<path d="M 210 80 H 250 V 80" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 430 80 H 470 V 80" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="180" width="290" height="80" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="175.0" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Report the distribution</text>
<text x="175.0" y="225" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Mean, variation, and percentiles</text>
<text x="175.0" y="242" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Show units and repetition count</text>
<rect x="360" y="180" width="290" height="80" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="505.0" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Measure quality and storage too</text>
<text x="505.0" y="225" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Use labeled data for accuracy</text>
<text x="505.0" y="242" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Distinguish estimates from measurements</text>
</svg>
