<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="340" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<text x="50" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Illustrative hardware limits</text>
<text x="420" y="30" text-anchor="start" font-size="12" font-weight="700" fill="#111827">Peak / bandwidth = ridge</text>
<text x="420" y="60" text-anchor="start" font-size="11" font-weight="400" fill="#111827">1,000 GFLOP/s ÷ 200 GB/s</text>
<text x="420" y="82" text-anchor="start" font-size="11" font-weight="700" fill="#ff8246">= 5 FLOP/byte</text>
<text x="420" y="120" text-anchor="start" font-size="10" font-weight="400" fill="#111827">P ≤ min(Peak, I × bandwidth)</text>
<text x="420" y="152" text-anchor="start" font-size="10" font-weight="400" fill="#111827">At I = 2 FLOP/byte:</text>
<text x="420" y="172" text-anchor="start" font-size="10" font-weight="700" fill="#111827">P ≤ 400 GFLOP/s</text>
<text x="420" y="210" text-anchor="start" font-size="10" font-weight="400" fill="#111827">This bound is a model.</text>
<text x="420" y="230" text-anchor="start" font-size="10" font-weight="400" fill="#111827">Measured performance can be lower.</text>
<text x="50" y="55" text-anchor="start" font-size="10" font-weight="400" fill="#111827">GFLOP/s</text>
<path d="M 70 270 L 380 270" fill="none" stroke="#6B7280" stroke-width="1.2"/>
<path d="M 70 270 L 70 70" fill="none" stroke="#6B7280" stroke-width="1.2"/>
<text x="60" y="273" text-anchor="end" font-size="9.5" font-weight="400" fill="#111827">0</text>
<text x="60" y="183" text-anchor="end" font-size="9.5" font-weight="400" fill="#111827">500</text>
<text x="60" y="93" text-anchor="end" font-size="9.5" font-weight="400" fill="#111827">1000</text>
<text x="70" y="290" text-anchor="middle" font-size="9.5" font-weight="400" fill="#111827">0</text>
<text x="220" y="290" text-anchor="middle" font-size="9.5" font-weight="400" fill="#111827">5</text>
<text x="370" y="290" text-anchor="middle" font-size="9.5" font-weight="400" fill="#111827">10</text>
<path d="M 70 270 L 220 90" fill="none" stroke="#ff8246" stroke-width="1.2"/>
<path d="M 220 90 L 370 90" fill="none" stroke="#ff8246" stroke-width="1.2"/>
<path d="M220 100 V270" fill="none" stroke="#6B7280" stroke-dasharray="4,2"/>
<text x="140" y="240" text-anchor="start" font-size="10" font-weight="400" fill="#111827">Bandwidth limit</text>
<text x="260" y="78" text-anchor="start" font-size="10" font-weight="400" fill="#111827">Compute limit</text>
<text x="220" y="320" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Arithmetic intensity (FLOP/byte)</text>
</svg>
