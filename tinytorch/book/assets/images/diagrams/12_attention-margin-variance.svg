<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="210" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="200" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">VARIANCE SCALING &amp; GRADIENTS</text>

  <rect x="12" y="28" width="196" height="13" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="37.5" text-anchor="middle" font-size="6.4" font-weight="600" fill="#475569">Dot Product Variance: Var(q · k) = d_k</text>

  <g transform="translate(12, 44)">
    <rect x="0" y="0" width="196" height="66" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <rect x="4" y="4" width="76" height="12" rx="1.5" fill="#ffedd5"/>
    <text x="42" y="12.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#c85a17">UNSCALED (Q Kᵀ)</text>
    <text x="190" y="13" text-anchor="end" font-size="6.0" font-family="monospace" fill="#ea580c">Var = 64, σ = 8</text>

    <text x="6" y="27" font-size="6.2" font-weight="bold" fill="#7c2d12">Logits:</text>
    <text x="36" y="27" font-family="monospace" font-size="5.8" fill="#c85a17">[+24.0, -8.0, 0.0]</text>
    <text x="190" y="27" text-anchor="end" font-size="5.8" fill="#9a3412">Extreme spread</text>

    <text x="6" y="39" font-size="6.2" font-weight="bold" fill="#7c2d12">Softmax:</text>
    <text x="40" y="39" font-family="monospace" font-size="5.8" fill="#c85a17">[0.9999, 0.0000, 0.0000]</text>
    <text x="190" y="39" text-anchor="end" font-size="5.8" font-weight="bold" fill="#c2410c">Saturated</text>

    <rect x="4" y="45" width="188" height="16" rx="1.5" fill="#ffffff" stroke="#fed7aa" stroke-width="0.8"/>
    <text x="10" y="56" font-size="6.0" font-family="monospace" font-weight="bold" fill="#c85a17">∂p/∂z = p(1 - p) ≈ 0.000</text>
    <text x="186" y="56" text-anchor="end" font-size="5.8" font-weight="bold" fill="#dc2626">VANISHED GRADIENT</text>
  </g>

  <g transform="translate(12, 114)">
    <rect x="0" y="0" width="196" height="66" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <rect x="4" y="4" width="82" height="12" rx="1.5" fill="#ccfbf1"/>
    <text x="45" y="12.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#0f766e">SCALED (/ √d_k = 8)</text>
    <text x="190" y="13" text-anchor="end" font-size="6.0" font-family="monospace" fill="#0d9488">Var = 1.0, σ = 1.0</text>

    <text x="6" y="27" font-size="6.2" font-weight="bold" fill="#134e4a">Logits:</text>
    <text x="36" y="27" font-family="monospace" font-size="5.8" fill="#0f766e">[+3.0, -1.0, 0.0]</text>
    <text x="190" y="27" text-anchor="end" font-size="5.8" fill="#115e59">Controlled range</text>

    <text x="6" y="39" font-size="6.2" font-weight="bold" fill="#134e4a">Softmax:</text>
    <text x="40" y="39" font-family="monospace" font-size="5.8" fill="#0f766e">[0.936, 0.017, 0.047]</text>
    <text x="190" y="39" text-anchor="end" font-size="5.8" font-weight="bold" fill="#0d9488">Smooth</text>

    <rect x="4" y="45" width="188" height="16" rx="1.5" fill="#ffffff" stroke="#99f6e4" stroke-width="0.8"/>
    <text x="10" y="56" font-size="6.0" font-family="monospace" font-weight="bold" fill="#0f766e">∂p/∂z = p(1 - p) ≈ 0.060</text>
    <text x="186" y="56" text-anchor="end" font-size="5.8" font-weight="bold" fill="#16a34a">ACTIVE GRADIENTS</text>
  </g>

  <rect x="12" y="185" width="196" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="196" text-anchor="middle" font-size="5.8" font-weight="600" fill="#475569">Invariant: Division preserves unit variance across any d_k</text>
</svg>
