<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="210" fill="#ffffff"/>
  
  <rect x="5" y="5" width="210" height="200" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">THERMAL &amp; GOVERNOR DRIFT</text>
  <text x="205" y="19" text-anchor="end" font-size="6.2" font-family="monospace" fill="#64748b">HW NOISE</text>

  
  <g transform="translate(12, 28)">
    <rect x="0" y="0" width="196" height="98" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

    
    <rect x="34" y="2" width="42" height="74" fill="#eff6ff" opacity="0.6"/>
    <text x="55" y="10" text-anchor="middle" font-size="5" font-weight="700" fill="#1e40af">1. DVFS Ramp</text>

    <rect x="76" y="2" width="62" height="74" fill="#f0fdfa" opacity="0.6"/>
    <text x="107" y="10" text-anchor="middle" font-size="5" font-weight="700" fill="#0f766e">2. Steady Boost</text>

    <rect x="138" y="2" width="56" height="74" fill="#fef2f2" opacity="0.6"/>
    <text x="166" y="10" text-anchor="middle" font-size="5" font-weight="700" fill="#991b1b">3. Throttled</text>

    
    <line x1="34" y1="18" x2="194" y2="18" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="34" y1="44" x2="194" y2="44" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="34" y1="66" x2="194" y2="66" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 2"/>

    
    <line x1="34" y1="12" x2="34" y2="76" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="34" y1="76" x2="194" y2="76" stroke="#cbd5e1" stroke-width="0.8"/>

    
    <text x="31" y="20" text-anchor="end" font-size="4.8" fill="#475569">4.2G</text>
    <text x="31" y="46" text-anchor="end" font-size="4.8" fill="#475569">2.4G</text>
    <text x="31" y="68" text-anchor="end" font-size="4.8" fill="#475569">1.2G</text>

    
    <text x="34" y="84" text-anchor="middle" font-size="4.8" fill="#64748b">Run 0</text>
    <text x="76" y="84" text-anchor="middle" font-size="4.8" fill="#64748b">Run 50</text>
    <text x="138" y="84" text-anchor="middle" font-size="4.8" fill="#64748b">Run 300</text>
    <text x="190" y="84" text-anchor="middle" font-size="4.8" fill="#64748b">Run 1k</text>

    
    <path d="M 34 66 C 46 66, 62 26, 76 18 L 138 18 C 146 18, 154 42, 165 44 L 194 44" fill="none" stroke="#2563eb" stroke-width="1.8"/>

    
    <circle cx="138" cy="18" r="2.2" fill="#ef4444"/>
    <text x="138" y="28" text-anchor="middle" font-size="4.8" font-weight="700" fill="#b91c1c">Die &gt; 90°C</text>

    
    <text x="55" y="93" text-anchor="middle" font-size="4.6" fill="#1e40af">Cold governor lag</text>
    <text x="107" y="93" text-anchor="middle" font-size="4.6" font-weight="700" fill="#0f766e">Valid window</text>
    <text x="166" y="93" text-anchor="middle" font-size="4.6" fill="#991b1b">Frequency drops 43%</text>
  </g>

  
  <g transform="translate(12, 130)">
    <rect x="0" y="0" width="196" height="70" rx="1.5" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="6" y="11" font-size="6.5" font-weight="700" fill="#1f2937">Systems Mitigation Protocol</text>

    
    <circle cx="11" cy="21" r="2" fill="#2563eb"/>
    <text x="17" y="23" font-size="5.4" font-weight="700" fill="#1e40af">Pin Governor:</text>
    <text x="62" y="23" font-size="5" font-family="monospace" fill="#334155">cpupower -g performance</text>
    <text x="17" y="30" font-size="4.7" fill="#64748b">Locks max frequency: eliminates Phase 1 governor ramp.</text>

    
    <circle cx="11" cy="39" r="2" fill="#0d9488"/>
    <text x="17" y="41" font-size="5.4" font-weight="700" fill="#0f766e">Core Affinity:</text>
    <text x="61" y="41" font-size="5" font-family="monospace" fill="#334155">taskset -c 0-3</text>
    <text x="17" y="48" font-size="4.7" fill="#64748b">Pins threads: prevents scheduler hops and cache flushes.</text>

    
    <circle cx="11" cy="57" r="2" fill="#ea580c"/>
    <text x="17" y="59" font-size="5.4" font-weight="700" fill="#c85a17">Cooldown Pauses:</text>
    <text x="75" y="59" font-size="4.9" fill="#334155">Interleave idle pauses</text>
    <text x="17" y="66" font-size="4.7" fill="#64748b">Dissipates silicon heat: prevents Phase 3 downclocking.</text>
  </g>
</svg>
