<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="152" viewBox="0 0 220 152" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="152" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="142" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">2:4 STRUCTURED SPARSITY</text>

  <text x="14" y="34" font-size="6.5" font-weight="bold" fill="#475569">Dense Row Block (16B in FP32):</text>

  <rect x="24" y="38" width="38" height="17" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.9"/>
  <text x="43" y="50" text-anchor="middle" font-size="6.8" font-weight="bold" fill="#c85a17">0.7</text>

  <rect x="66" y="38" width="38" height="17" rx="1.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="85" y="50" text-anchor="middle" font-size="6.8" fill="#9ca3af">0.0</text>

  <rect x="108" y="38" width="38" height="17" rx="1.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="127" y="50" text-anchor="middle" font-size="6.8" fill="#9ca3af">0.0</text>

  <rect x="150" y="38" width="38" height="17" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.9"/>
  <text x="169" y="50" text-anchor="middle" font-size="6.8" font-weight="bold" fill="#c85a17">-1.2</text>

  <text x="110" y="63" text-anchor="middle" font-size="5.6" fill="#64748b">Constraint: exactly 2 non-zeros per 4 entries</text>

  <path d="M 110 66 L 110 73" stroke="#ff8246" stroke-width="1.2"/>
  <polygon points="108 73, 110 77, 112 73" fill="#ff8246"/>

  <text x="14" y="85" font-size="6.5" font-weight="bold" fill="#475569">Packed Hardware Storage (50% Traffic):</text>

  <rect x="20" y="90" width="86" height="21" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="23" y="92" width="38" height="17" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
  <text x="42" y="104" text-anchor="middle" font-size="6.8" font-weight="bold" fill="#c85a17">0.7</text>
  <rect x="65" y="92" width="38" height="17" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
  <text x="84" y="104" text-anchor="middle" font-size="6.8" font-weight="bold" fill="#c85a17">-1.2</text>
  <text x="63" y="118" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#64748b">2 Stored Values (8B)</text>

  <rect x="114" y="90" width="86" height="21" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="117" y="92" width="38" height="17" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="136" y="100" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#1e40af">col: 0</text>
  <text x="136" y="107" text-anchor="middle" font-size="5.0" font-family="monospace" fill="#2563eb">(00b)</text>

  <rect x="159" y="92" width="38" height="17" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="178" y="100" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#1e40af">col: 3</text>
  <text x="178" y="107" text-anchor="middle" font-size="5.0" font-family="monospace" fill="#2563eb">(11b)</text>
  <text x="157" y="118" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#64748b">2-bit Indices (4 bits)</text>

  <rect x="14" y="123" width="192" height="19" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
  <text x="110" y="132" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#115e59">Ampere and Hopper: 2.0x Math Throughput</text>
  <text x="110" y="139" text-anchor="middle" font-size="5.2" fill="#0d9488">Hardware unpacks indices in register with zero CSR overhead</text>
</svg>
