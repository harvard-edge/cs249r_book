<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="155" viewBox="0 0 220 155" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="155" fill="#ffffff"/>
  <!-- Outer Card Frame -->
  <rect x="5" y="5" width="210" height="145" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <!-- Header Banner -->
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">2D SPATIAL PATCH VS FLAT DRAM</text>

  <!-- Section 1: 2D Spatial Layout -->
  <g transform="translate(12, 28)">
    <text x="0" y="6" font-size="6.2" font-weight="700" fill="#475569">2D Spatial Grid (W = 4)</text>

    <!-- 4x4 Image Grid -->
    <g transform="translate(0, 10)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="11" height="11" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="5.5" y="7.5" font-size="5.5" font-family="monospace" font-weight="bold" fill="#c85a17" text-anchor="middle">a</text>

      <rect x="12" y="0" width="11" height="11" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="17.5" y="7.5" font-size="5.5" font-family="monospace" font-weight="bold" fill="#c85a17" text-anchor="middle">b</text>

      <rect x="24" y="0" width="11" height="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="29.5" y="7.5" font-size="5" font-family="monospace" fill="#94a3b8" text-anchor="middle">c</text>

      <rect x="36" y="0" width="11" height="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="41.5" y="7.5" font-size="5" font-family="monospace" fill="#94a3b8" text-anchor="middle">d</text>

      <!-- Row 1 -->
      <rect x="0" y="12" width="11" height="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="5.5" y="19.5" font-size="5.5" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">e</text>

      <rect x="12" y="12" width="11" height="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="17.5" y="19.5" font-size="5.5" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">f</text>

      <rect x="24" y="12" width="11" height="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="29.5" y="19.5" font-size="5" font-family="monospace" fill="#94a3b8" text-anchor="middle">g</text>

      <rect x="36" y="12" width="11" height="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="41.5" y="19.5" font-size="5" font-family="monospace" fill="#94a3b8" text-anchor="middle">h</text>

      <!-- 2x2 Kernel Patch Highlight Boundary -->
      <rect x="-1" y="-1" width="25" height="25" rx="1" fill="none" stroke="#c85a17" stroke-width="0.9" stroke-dasharray="2 1.5"/>
      <text x="23.5" y="30" font-size="5.2" font-weight="700" fill="#c85a17" text-anchor="middle">2×2 Patch</text>
    </g>

    <!-- Stride Explanation Labels (Right of Grid) -->
    <g transform="translate(56, 10)">
      <!-- Unit Stride Step -->
      <rect x="0" y="1" width="6" height="6" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
      <text x="10" y="6" font-size="5.8" font-weight="700" fill="#1f2937">Step w: Stride = +1 float</text>
      <text x="10" y="13" font-size="5" fill="#16a34a">Contiguous DRAM cache line hit</text>

      <!-- Row Stride Step -->
      <rect x="0" y="18" width="6" height="6" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
      <text x="10" y="23" font-size="5.8" font-weight="700" fill="#1f2937">Step h: Stride = +W floats</text>
      <text x="10" y="30" font-size="5" fill="#dc2626">Row jump causes cache misses</text>
    </g>
  </g>

  <!-- Section 2: 1D DRAM Memory Ribbon -->
  <g transform="translate(12, 80)">
    <text x="0" y="4" font-size="6.2" font-weight="700" fill="#475569">Physical DRAM Layout (Flat 1D Buffer):</text>

    <!-- DRAM Cells with clearance from title -->
    <g transform="translate(0, 18)">
      <!-- Cell a -->
      <rect x="0" y="0" width="18" height="13" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="9" y="9" font-size="6" font-family="monospace" font-weight="bold" fill="#c85a17" text-anchor="middle">a</text>

      <!-- Cell b -->
      <rect x="18" y="0" width="18" height="13" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
      <text x="27" y="9" font-size="6" font-family="monospace" font-weight="bold" fill="#c85a17" text-anchor="middle">b</text>

      <!-- Cell c -->
      <rect x="36" y="0" width="18" height="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="45" y="9" font-size="5.5" font-family="monospace" fill="#94a3b8" text-anchor="middle">c</text>

      <!-- Cell d -->
      <rect x="54" y="0" width="18" height="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="63" y="9" font-size="5.5" font-family="monospace" fill="#94a3b8" text-anchor="middle">d</text>

      <!-- Cell e -->
      <rect x="72" y="0" width="18" height="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="81" y="9" font-size="6" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">e</text>

      <!-- Cell f -->
      <rect x="90" y="0" width="18" height="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
      <text x="99" y="9" font-size="6" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">f</text>

      <!-- Cell g -->
      <rect x="108" y="0" width="18" height="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="117" y="9" font-size="5.5" font-family="monospace" fill="#94a3b8" text-anchor="middle">g</text>

      <!-- Cell h -->
      <rect x="126" y="0" width="18" height="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="135" y="9" font-size="5.5" font-family="monospace" fill="#94a3b8" text-anchor="middle">h</text>

      <!-- Rest of row -->
      <rect x="144" y="0" width="52" height="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="170" y="9" font-size="5.2" fill="#64748b" text-anchor="middle">... [next row]</text>

      <!-- Jump Path Annotation from b to e -->
      <path d="M 27 -2 C 27 -8, 81 -8, 81 -2" fill="none" stroke="#2563eb" stroke-width="0.9" stroke-dasharray="2 1.5"/>
      <polygon points="79 -2, 81 0, 83 -2" fill="#2563eb"/>
      <text x="54" y="-8.5" font-size="5.2" font-weight="bold" fill="#2563eb" text-anchor="middle">+W elements jump</text>
    </g>
  </g>

  <!-- Section 3: Summary Footer -->
  <line x1="12" y1="127" x2="208" y2="127" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="110" y="136" font-size="5.8" font-weight="700" fill="#1f2937" text-anchor="middle">im2col packs [a, b, e, f] contiguously</text>
  <text x="110" y="144" font-size="5.1" fill="#475569" text-anchor="middle">Trades buffer storage for streaming GEMM throughput</text>
</svg>
