<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="280" fill="#ffffff"/>
<defs>
  <marker id="arrow-rf" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
  </marker>
</defs>

  <!-- Title / Concept Banner -->
  <rect x="20" y="15" width="640" height="28" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="33" font-size="10.5" font-weight="700" fill="#1e293b">HIERARCHICAL RECEPTIVE FIELD EXPANSION (STACKED 3x3 CONVOLUTIONS)</text>
  <text x="480" y="33" font-size="9" font-weight="600" fill="#64748b">r<tspan baseline-shift="sub" font-size="7">ℓ</tspan> = r<tspan baseline-shift="sub" font-size="7">ℓ-1</tspan> + (K<tspan baseline-shift="sub" font-size="7">ℓ</tspan> − 1)</text>

  <!-- Projection Pyramids (Translucent Polygons) -->
  <!-- Layer 0 (Input) to Layer 1 -->
  <polygon points="55,90 145,90 220,110 220,190 145,210 55,210" fill="#10b981" opacity="0.08"/>
  <!-- Layer 1 to Layer 2 -->
  <polygon points="220,110 280,110 370,125 370,175 280,190 220,190" fill="#8b5cf6" opacity="0.08"/>
  <!-- Layer 2 to Layer 3 -->
  <polygon points="370,125 410,125 505,140 505,160 410,175 370,175" fill="#ff8246" opacity="0.08"/>

  <!-- GRID 0: Input Image (Layer 0) - Receptive Field: 7x7 -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="140" height="155" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="20" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="8" y="14" font-size="8.5" font-weight="700" fill="#334155">Input Image (L0)</text>
    
    <!-- 7x7 Receptive Field Grid -->
    <rect x="15" y="28" width="110" height="110" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <!-- Grid lines -->
    <path d="M30.7,28 v110 M46.4,28 v110 M62.1,28 v110 M77.8,28 v110 M93.5,28 v110 M109.2,28 v110 M15,43.7 h110 M15,59.4 h110 M15,75.1 h110 M15,90.8 h110 M15,106.5 h110 M15,122.2 h110" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="25" y="87" font-size="10" font-weight="700" fill="#15803d">7 x 7 pixels</text>
    <text x="32" y="100" font-size="7.5" font-weight="600" fill="#166534">Receptive Field</text>
  </g>

  <!-- Arrow L0 -> L1 -->
  <line x1="175" y1="150" x2="195" y2="150" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-rf)"/>
  <text x="175" y="140" font-size="7" font-weight="600" fill="#64748b">Conv 1</text>
  <text x="175" y="165" font-size="6.5" fill="#94a3b8">3x3 (s=1)</text>

  <!-- GRID 1: Feature Map (Layer 1) - Receptive Field: 5x5 -->
  <g transform="translate(205, 80)">
    <rect x="0" y="0" width="125" height="140" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="125" height="20" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="8" y="14" font-size="8.5" font-weight="700" fill="#334155">Conv 1 Map (L1)</text>
    
    <!-- 5x5 Grid -->
    <rect x="18" y="28" width="90" height="90" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <path d="M36,28 v90 M54,28 v90 M72,28 v90 M90,28 v90 M18,46 h90 M18,64 h90 M18,82 h90 M18,100 h90" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="35" y="77" font-size="9.5" font-weight="700" fill="#6d28d9">5 x 5</text>
    <text x="30" y="89" font-size="7" font-weight="600" fill="#7c3aed">Effective RF</text>
  </g>

  <!-- Arrow L1 -> L2 -->
  <line x1="335" y1="150" x2="355" y2="150" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-rf)"/>
  <text x="335" y="140" font-size="7" font-weight="600" fill="#64748b">Conv 2</text>
  <text x="335" y="165" font-size="6.5" fill="#94a3b8">3x3 (s=1)</text>

  <!-- GRID 2: Feature Map (Layer 2) - Receptive Field: 3x3 -->
  <g transform="translate(365, 95)">
    <rect x="0" y="0" width="110" height="120" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="110" height="20" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="8" y="14" font-size="8.5" font-weight="700" fill="#334155">Conv 2 Map (L2)</text>
    
    <!-- 3x3 Grid -->
    <rect x="22" y="30" width="66" height="66" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <path d="M44,30 v66 M66,30 v66 M22,52 h66 M22,74 h66" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="38" y="67" font-size="9" font-weight="700" fill="#1d4ed8">3 x 3</text>
    <text x="31" y="78" font-size="7" font-weight="600" fill="#2563eb">Kernel</text>
  </g>

  <!-- Arrow L2 -> L3 -->
  <line x1="480" y1="150" x2="500" y2="150" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-rf)"/>
  <text x="480" y="140" font-size="7" font-weight="600" fill="#64748b">Conv 3</text>
  <text x="480" y="165" font-size="6.5" fill="#94a3b8">3x3 (s=1)</text>

  <!-- GRID 3: Output Activation (Layer 3) - 1x1 neuron -->
  <g transform="translate(510, 110)">
    <rect x="0" y="0" width="150" height="100" rx="2" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="20" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="8" y="14" font-size="8.5" font-weight="700" fill="#c85a17">Output Neuron (L3)</text>
    
    <!-- 1x1 Target Box -->
    <rect x="55" y="32" width="38" height="38" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="64" y="55" font-size="10" font-weight="700" fill="#c2410c">1 x 1</text>
    <text x="18" y="85" font-size="7.5" font-weight="600" fill="#9a3412">Sees full 7x7 input patch!</text>
  </g>

  <!-- Parameter Efficiency Comparison Callout (Bottom Bar) -->
  <rect x="20" y="235" width="640" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="250" font-size="8.5" font-weight="700" fill="#1e293b">Architectural Efficiency:</text>
  <text x="145" y="250" font-size="8" fill="#475569">Three stacked 3x3 layers: 3 * (3² * C) = <tspan font-weight="700" fill="#0f766e">27 C parameters</tspan> + 3 non-linearities (higher representational power).</text>
  <text x="145" y="262" font-size="8" fill="#475569">One single 7x7 layer: 7² * C = <tspan font-weight="700" fill="#b91c1c">49 C parameters</tspan> (+81% memory/compute) + only 1 non-linearity.</text>

</svg>
