<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="185" viewBox="0 0 220 185" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="185" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="175" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">OPERATIONAL INTENSITY: X + b</text>

  <text x="15" y="37" font-size="7.2" font-weight="700" fill="#1f2937">DRAM BUS TRAFFIC: 40 BYTES</text>
  
  <g transform="translate(15, 42)">
    <rect x="0" y="0" width="76" height="16" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="5" y="11" font-size="6.5" font-family="monospace" fill="#1e40af">Read X: 16 B</text>
    
    <rect x="78" y="0" width="38" height="16" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="81" y="11" font-size="6.5" font-family="monospace" fill="#c85a17">b: 8 B</text>

    <rect x="118" y="0" width="72" height="16" rx="1" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
    <text x="122" y="11" font-size="6.5" font-family="monospace" fill="#115e59">Write: 16 B</text>
  </g>

  <text x="15" y="75" font-size="7.2" font-weight="700" fill="#1f2937">ARITHMETIC WORK: 4 FLOPS</text>
  
  <g transform="translate(15, 80)">
    <rect x="0" y="0" width="190" height="16" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="8" y="11" font-size="6.8" font-family="monospace" fill="#4b5563">4 Float Additions (1 FLOP each)</text>
  </g>

  <g transform="translate(15, 106)">
    <rect x="0" y="0" width="190" height="36" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="10" y="14" font-size="7.5" font-weight="700" fill="#c85a17">Arithmetic Intensity:</text>
    <text x="10" y="28" font-size="8" font-family="monospace" font-weight="700" fill="#c85a17">4 FLOPs / 40 Bytes = 0.10 FLOP/B</text>
  </g>

  <g transform="translate(15, 149)">
    <rect x="0" y="0" width="190" height="22" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="8" y="15" font-size="6.8" font-weight="700" fill="#991b1b">Status: Severely Memory Bandwidth Bound</text>
  </g>
</svg>
