<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="310" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f2937"/>
  </marker>
  <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
  </marker>
  <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
  </marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff8246"/>
  </marker>
</defs>

  <!-- Left Panel: Standard Attention (DRAM Wall) -->
  <rect x="20" y="20" width="310" height="270" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="20" y="20" width="310" height="26" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="32" y="37" font-size="10" font-weight="700" fill="#b91c1c">STANDARD ATTENTION: DRAM MEMORY WALL</text>

  <!-- Slow DRAM / HBM Box -->
  <rect x="35" y="58" width="280" height="150" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="74" font-size="9" font-weight="700" fill="#475569">High-Bandwidth Memory (HBM / DRAM)</text>
  <text x="250" y="74" font-size="8" font-weight="600" fill="#94a3b8">~3 TB/s</text>

  <!-- Q, K, V blocks in DRAM -->
  <rect x="45" y="85" width="45" height="50" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="58" y="113" font-size="9" font-weight="700" fill="#0369a1">Q</text>
  <text x="49" y="145" font-size="7.5" fill="#64748b">S x d</text>

  <rect x="98" y="85" width="45" height="50" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="112" y="113" font-size="9" font-weight="700" fill="#0369a1">K</text>
  <text x="102" y="145" font-size="7.5" fill="#64748b">S x d</text>

  <!-- Materialized S x S Attention Matrix with RED X -->
  <rect x="165" y="85" width="65" height="65" rx="1" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="175" y="115" font-size="9" font-weight="700" fill="#b91c1c">S x S Matrix</text>
  <text x="173" y="128" font-size="7.5" font-weight="600" fill="#dc2626">O(S²) Memory</text>
  <!-- Red Cross Lines -->
  <line x1="167" y1="87" x2="228" y2="148" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="228" y1="87" x2="167" y2="148" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

  <rect x="250" y="85" width="45" height="50" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="264" y="113" font-size="9" font-weight="700" fill="#0369a1">V</text>
  <text x="254" y="145" font-size="7.5" fill="#64748b">S x d</text>

  <!-- DRAM Traffic Warning Badge -->
  <rect x="45" y="165" width="260" height="35" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="53" y="179" font-size="8" font-weight="700" fill="#be123c">Bandwidth Bottleneck:</text>
  <text x="53" y="192" font-size="7.5" fill="#9f1239">3 DRAM Round-Trips (Scores -> Softmax -> Probs -> Matmul)</text>

  <!-- Explanation bullets -->
  <text x="35" y="226" font-size="8" fill="#4b5563">1. Computes QKᵀ and writes massive S x S matrix to DRAM</text>
  <text x="35" y="240" font-size="8" fill="#4b5563">2. Reads S x S back to chip to compute Softmax probabilities</text>
  <text x="35" y="254" font-size="8" fill="#4b5563">3. Writes P back to DRAM, then reads P and V to produce O</text>
  <text x="35" y="272" font-size="8" font-weight="700" fill="#dc2626">Result: Memory-bound stall (Arithmetic Intensity &lt; 2 FLOP/B)</text>

  <!-- Right Panel: FlashAttention (SRAM-Aware Tiling) -->
  <rect x="350" y="20" width="310" height="270" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <rect x="350" y="20" width="310" height="26" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="362" y="37" font-size="10" font-weight="700" fill="#047857">FLASHATTENTION: SRAM TILING &amp; ONLINE SOFTMAX</text>

  <!-- Fast On-Chip SRAM Box -->
  <rect x="365" y="58" width="280" height="150" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="375" y="74" font-size="9" font-weight="700" fill="#166534">Fast On-Chip SRAM / Cache</text>
  <text x="580" y="74" font-size="8" font-weight="600" fill="#15803d">~19 TB/s</text>

  <!-- Tiled Blocks inside SRAM -->
  <rect x="375" y="85" width="45" height="40" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="385" y="103" font-size="8.5" font-weight="700" fill="#15803d">Q_i</text>
  <text x="378" y="117" font-size="7" fill="#166534">Br x d</text>

  <rect x="428" y="85" width="45" height="40" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="438" y="103" font-size="8.5" font-weight="700" fill="#15803d">K_j</text>
  <text x="431" y="117" font-size="7" fill="#166534">Bc x d</text>

  <rect x="481" y="85" width="45" height="40" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="491" y="103" font-size="8.5" font-weight="700" fill="#15803d">V_j</text>
  <text x="484" y="117" font-size="7" fill="#166534">Bc x d</text>

  <!-- Online Softmax Accumulator Box -->
  <rect x="535" y="85" width="100" height="60" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="1.2"/>
  <text x="542" y="99" font-size="8" font-weight="700" fill="#c85a17">Online Accumulator</text>
  <text x="542" y="113" font-size="7" font-family="monospace" fill="#1f2937">m_i = max(m_i, S_ij)</text>
  <text x="542" y="125" font-size="7" font-family="monospace" fill="#1f2937">l_i = scale*l_i + e^S</text>
  <text x="542" y="137" font-size="7" font-family="monospace" fill="#1f2937">O_i = scale*O_i + PV</text>

  <!-- Normalization formula badge -->
  <rect x="375" y="152" width="260" height="28" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="383" y="166" font-size="7.5" font-weight="700" fill="#1e40af">Final Normalization Epilogue:</text>
  <text x="383" y="176" font-size="7.5" font-family="monospace" fill="#1e3a8a">O_i = diag(l_i)^(-1) * O_i   (Zero DRAM Matrix!)</text>

  <!-- Success note -->
  <text x="365" y="226" font-size="8" fill="#4b5563">1. Stream Q, K, V in small cache-sized blocks (Br, Bc &lt;&lt; S)</text>
  <text x="365" y="240" font-size="8" fill="#4b5563">2. Incrementally accumulate row max m_i and normalizer l_i</text>
  <text x="365" y="254" font-size="8" fill="#4b5563">3. Recompute scores in backward pass directly from Q, K, V</text>
  <text x="365" y="272" font-size="8" font-weight="700" fill="#047857">Result: Peak memory O(S), 2x-4x wall-clock GPU speedup</text>

</svg>
