<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="142" viewBox="0 0 220 142" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="142" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="132" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.2" font-weight="700" fill="#1f2937">LOGSUMEXP SUBTRACTION ORDER</text>

  <g transform="translate(15, 31)">
    <!-- Naive order panel -->
    <rect x="0" y="0" width="190" height="42" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="8" y="12" font-size="7.5" font-weight="700" fill="#c85a17">Naive: Big Numbers First</text>
    <text x="8" y="24" font-size="6.8" font-family="monospace" fill="#4b5563">(c + log_sum) - z_t</text>
    <text x="8" y="35" font-size="7.2" font-family="monospace" font-weight="700" fill="#b91c1c">At 10^6: 0.4375 (7% Mantissa Loss)</text>

    <!-- Stabilized order panel -->
    <rect x="0" y="48" width="190" height="42" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="8" y="60" font-size="7.5" font-weight="700" fill="#0f766e">Stable: Small Numbers First</text>
    <text x="8" y="72" font-size="6.8" font-family="monospace" fill="#4b5563">log_sum - (z_t - c)</text>
    <text x="8" y="83" font-size="7.2" font-family="monospace" font-weight="700" fill="#0d9488">At 10^6: 0.407606 (Exact to 6 digits)</text>

    <!-- Bottom takeaway pill -->
    <rect x="0" y="95" width="190" height="11" rx="1.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="95" y="103" text-anchor="middle" font-size="6.2" font-weight="600" fill="#334155">Subtract row max before computing log-sum</text>
  </g>
</svg>
