<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="142" viewBox="0 0 220 142" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="142" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="132" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.2" font-weight="700" fill="#1f2937">SCALAR LOSS: VJP VS JACOBIAN</text>

  <g transform="translate(15, 31)">
    <!-- Vector loss panel (inefficient full Jacobian) -->
    <rect x="0" y="0" width="190" height="42" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="8" y="12" font-size="7.5" font-weight="700" fill="#c85a17">Vector Loss (B,): Full Jacobian</text>
    <text x="8" y="24" font-size="6.8" font-family="monospace" fill="#4b5563">J ∈ ℝ^(B×P) = 128 × 100M × 4B</text>
    <text x="8" y="35" font-size="7.2" font-family="monospace" font-weight="700" fill="#b91c1c">DRAM: 51.2 GB (OOM Crash)</text>

    <!-- Scalar loss panel (efficient VJP) -->
    <rect x="0" y="48" width="190" height="42" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="8" y="60" font-size="7.5" font-weight="700" fill="#0f766e">Scalar Loss (): Vector-Jacobian</text>
    <text x="8" y="72" font-size="6.8" font-family="monospace" fill="#4b5563">v^T J ∈ ℝ^(1×P) = 1 × 100M × 4B</text>
    <text x="8" y="83" font-size="7.2" font-family="monospace" font-weight="700" fill="#0d9488">DRAM: 400 MB (128× Reduction)</text>

    <!-- Bottom takeaway pill -->
    <rect x="0" y="95" width="190" height="11" rx="1.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="95" y="103" text-anchor="middle" font-size="6.2" font-weight="600" fill="#334155">Enables reverse-mode autograd in O(P) memory</text>
  </g>
</svg>
