<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="180" viewBox="0 0 220 180" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="180" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="170" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">GRADIENT ACCUMULATION BUG</text>

  <g transform="translate(12, 30)">
    <rect x="0" y="0" width="196" height="60" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="15" rx="2" fill="#dcfce7"/>
    <text x="6" y="11" font-size="6.8" font-weight="bold" fill="#15803d">&#10003; WITH ZERO_GRAD()</text>
    <text x="190" y="11" text-anchor="end" font-size="6.5" font-family="monospace" fill="#166534">w → 0.4305</text>

    <text x="6" y="26" font-size="6.5" font-family="monospace" fill="#1e293b">Batch 1: ∇w = g₁       → step(g₁)</text>
    <text x="6" y="38" font-size="6.5" font-family="monospace" fill="#1e293b">Batch 2: ∇w = g₂       → step(g₂)</text>
    <text x="6" y="50" font-size="6.5" font-family="monospace" fill="#15803d">Batch 3: ∇w = g₃       → Convergence</text>
  </g>

  <g transform="translate(12, 95)">
    <rect x="0" y="0" width="196" height="64" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="15" rx="2" fill="#fee2e2"/>
    <text x="6" y="11" font-size="6.8" font-weight="bold" fill="#b91c1c">&#10007; FORGOTTEN ZERO_GRAD()</text>
    <text x="190" y="11" text-anchor="end" font-size="6.5" font-family="monospace" fill="#991b1b">w → -0.9153</text>

    <text x="6" y="26" font-size="6.5" font-family="monospace" fill="#1e293b">Batch 1: ∇w = g₁</text>
    <text x="6" y="38" font-size="6.5" font-family="monospace" fill="#b91c1c">Batch 2: ∇w = g₁ + g₂  (ghost gradient!)</text>
    <text x="6" y="50" font-size="6.5" font-family="monospace" fill="#b91c1c">Batch 3: ∇w = g₁ + g₂ + g₃ (diverging)</text>
    <text x="6" y="59" font-size="5.8" font-style="italic" fill="#7f1d1d">Oscillates past zero into runaway swing</text>
  </g>

  <text x="110" y="170" text-anchor="middle" font-size="6.2" fill="#64748b">autograd accumulates (+=); zero_grad() prevents cross-batch leak</text>
</svg>
