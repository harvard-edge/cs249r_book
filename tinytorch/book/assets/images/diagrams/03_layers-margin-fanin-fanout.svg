<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="175" viewBox="0 0 240 175" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="240" height="175" fill="#ffffff" rx="4" stroke="#94a3b8" stroke-width="1.2"/>
  <rect width="240" height="22" fill="#f1f5f9" rx="4" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="10" y="15" font-size="9" font-weight="bold" fill="#1e293b" letter-spacing="0.3">FAN-IN VS FAN-OUT DUALITY</text>

  <!-- Forward section -->
  <g transform="translate(8, 28)">
    <rect width="224" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="8" y="13" font-size="8" font-weight="bold" fill="#2563eb">FORWARD: Fan-In (D_in)</text>
    <text x="8" y="26" font-size="7.5" fill="#475569">x · W → y : sums D_in inputs</text>
    <text x="8" y="38" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1e293b">Needs: σ² = 1 / D_in</text>
  </g>

  <!-- Backward section -->
  <g transform="translate(8, 76)">
    <rect width="224" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="8" y="13" font-size="8" font-weight="bold" fill="#ea580c">BACKWARD: Fan-Out (D_out)</text>
    <text x="8" y="26" font-size="7.5" fill="#475569">∂L/∂y · W^T → ∂L/∂x : sums D_out</text>
    <text x="8" y="38" font-size="7.5" font-family="monospace" font-weight="bold" fill="#1e293b">Needs: σ² = 1 / D_out</text>
  </g>

  <!-- Xavier compromise footer badge -->
  <g transform="translate(8, 124)">
    <rect width="224" height="43" rx="3" fill="#fff7ed" stroke="#fdba74" stroke-width="0.8"/>
    <text x="8" y="14" font-size="8" font-weight="bold" fill="#c2410c">Xavier Compromise (Harmonic Mean)</text>
    <text x="8" y="28" font-size="8" font-family="monospace" font-weight="bold" fill="#9a3412">Var(w) = 2 / (D_in + D_out)</text>
    <text x="8" y="38" font-size="7" fill="#7c2d12">Balances forward signal and backward grad</text>
  </g>
</svg>
