<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="175" viewBox="0 0 220 175" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#ff8246"/>
    </marker>
  </defs>

  <rect width="220" height="175" fill="#ffffff"/>
  <!-- Outer Card -->
  <rect x="5" y="5" width="210" height="165" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Header Banner -->
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">STRIDED COORDINATE INDEXING</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">SHAPE (2, 3)</text>

  <!-- Section 1: 2D Logical Tensor -->
  <g transform="translate(14, 30)">
    <text x="0" y="8" font-size="7.2" font-weight="700" fill="#334155">2D Logical Grid (Strides: S₀=3, S₁=1)</text>

    <!-- Grid Cells -->
    <!-- Row 0 -->
    <rect x="0" y="13" width="41" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20.5" y="24" text-anchor="middle" font-size="6.5" fill="#475569">(0,0): 1.0</text>

    <rect x="44" y="13" width="41" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="64.5" y="24" text-anchor="middle" font-size="6.5" fill="#475569">(0,1): 2.0</text>

    <rect x="88" y="13" width="41" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="108.5" y="24" text-anchor="middle" font-size="6.5" fill="#475569">(0,2): 3.0</text>

    <!-- Row 1 -->
    <rect x="0" y="33" width="41" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20.5" y="44" text-anchor="middle" font-size="6.5" fill="#475569">(1,0): 4.0</text>

    <rect x="44" y="33" width="41" height="17" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="64.5" y="44" text-anchor="middle" font-size="6.5" fill="#475569">(1,1): 5.0</text>

    <!-- Target Cell (1,2) -->
    <rect x="88" y="33" width="41" height="17" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="108.5" y="44" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#c85a17">(1,2): 6.0</text>

    <!-- Target Badge on Right -->
    <rect x="135" y="13" width="57" height="37" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="163.5" y="24" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1e40af">TARGET</text>
    <text x="163.5" y="34" text-anchor="middle" font-size="7" font-weight="bold" fill="#1e40af">Coord (1, 2)</text>
    <text x="163.5" y="44" text-anchor="middle" font-size="6" fill="#2563eb">Value: 6.0</text>
  </g>

  <!-- Section 2: Stride Formula Box -->
  <g transform="translate(14, 85)">
    <rect x="0" y="0" width="192" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="6" y="11" font-size="6.5" font-family="monospace" fill="#334155">offset + (row × S₀) + (col × S₁) = index</text>
    <text x="6" y="21" font-size="6.8" font-family="monospace" font-weight="bold" fill="#0f172a">0 + (1 × 3) + (2 × 1) = <tspan fill="#c85a17">Slot 5</tspan></text>
  </g>

  <!-- Arrow from Formula to Slot 5 -->
  <path d="M 190 111 L 190 124" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- Section 3: 1D Physical DRAM Buffer -->
  <g transform="translate(14, 116)">
    <text x="0" y="7" font-size="7.2" font-weight="700" fill="#334155">1D Physical Buffer (Flat Bytes in DRAM)</text>

    <!-- 6 Flat Buffer Slots -->
    <g transform="translate(0, 11)">
      <!-- Slot 0 -->
      <rect x="0" y="0" width="30" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="8" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">[0]</text>
      <text x="15" y="16" text-anchor="middle" font-size="6.5" fill="#1f2937">1.0</text>

      <!-- Slot 1 -->
      <rect x="32" y="0" width="30" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="47" y="8" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">[1]</text>
      <text x="47" y="16" text-anchor="middle" font-size="6.5" fill="#1f2937">2.0</text>

      <!-- Slot 2 -->
      <rect x="64" y="0" width="30" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="79" y="8" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">[2]</text>
      <text x="79" y="16" text-anchor="middle" font-size="6.5" fill="#1f2937">3.0</text>

      <!-- Slot 3 -->
      <rect x="96" y="0" width="30" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="111" y="8" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">[3]</text>
      <text x="111" y="16" text-anchor="middle" font-size="6.5" fill="#1f2937">4.0</text>

      <!-- Slot 4 -->
      <rect x="128" y="0" width="30" height="20" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="143" y="8" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#64748b">[4]</text>
      <text x="143" y="16" text-anchor="middle" font-size="6.5" fill="#1f2937">5.0</text>

      <!-- Slot 5: Target -->
      <rect x="160" y="0" width="32" height="20" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1.3"/>
      <text x="176" y="8" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#c85a17">[5]</text>
      <text x="176" y="16" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#c85a17">6.0</text>

      <!-- Bracket guides -->
      <line x1="2" y1="23" x2="92" y2="23" stroke="#cbd5e1" stroke-width="0.8"/>
      <line x1="98" y1="23" x2="190" y2="23" stroke="#ff8246" stroke-width="0.8"/>

      <!-- Bottom Labels -->
      <text x="47" y="30" text-anchor="middle" font-size="6" fill="#64748b">Row 0 (Slots 0..2)</text>
      <text x="127" y="30" text-anchor="middle" font-size="6" fill="#64748b">Row 1 (Slots 3..5)</text>
      <text x="176" y="30" text-anchor="middle" font-size="6" font-weight="bold" fill="#c85a17">Byte 20</text>
    </g>
  </g>
</svg>
