<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="330" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Token prefix</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Encode the prompt</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Append each sampled token</text>
<rect x="250" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="340.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">TinyGPT forward</text>
<text x="340.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Run on the current prefix</text>
<text x="340.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Take the last row of logits</text>
<rect x="470" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="560.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Shape probabilities</text>
<text x="560.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Divide by temperature T &gt; 0</text>
<text x="560.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Keep top-k; then softmax</text>
<path d="M 210 75 H 250 V 75" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 430 75 H 470 V 75" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="470" y="180" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="560.0" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Sample next token</text>
<text x="560.0" y="225" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Draw from the distribution</text>
<text x="560.0" y="242" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Repeat up to the token budget</text>
<path d="M 560 120 H 560 V 180" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M470 225 H120 V120" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="270" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Append and repeat</text>
<text x="340" y="307" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">This milestone uses full-prefix generation; KV caching is introduced in Module 18.</text>
</svg>
