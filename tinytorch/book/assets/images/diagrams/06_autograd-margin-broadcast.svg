<svg xmlns="http://www.w3.org/2000/svg" width="220" height="160" viewBox="0 0 220 160" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#ff8246"/>
    </marker>
  </defs>

  <rect width="220" height="160" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="150" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">BROADCAST GRAD REDUCTION</text>

  <rect x="15" y="28" width="190" height="50" rx="2" fill="#eff6ff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="22" y="38" font-size="6.8" font-weight="700" fill="#1e40af">FORWARD: REPLICATE (3,) TO (2, 3)</text>
  <rect x="22" y="42" width="70" height="12" rx="1" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="57" y="50.5" text-anchor="middle" font-size="6" font-family="monospace" fill="#1e40af">Bias b: [3]</text>
  <path d="M 94 48 L 108 48" stroke="#2563eb" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <rect x="112" y="42" width="86" height="28" rx="1" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="155" y="52" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#1e40af">Row 0: [b₀, b₁, b₂]</text>
  <text x="155" y="64" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#1e40af">Row 1: [b₀, b₁, b₂]</text>

  <rect x="15" y="82" width="190" height="56" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
  <text x="22" y="92" font-size="6.8" font-weight="700" fill="#c85a17">BACKWARD: SUM AXIS 0 TO (3,)</text>
  <rect x="20" y="96" width="94" height="28" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="0.8"/>
  <text x="67" y="106.5" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#c85a17">dY₀: [g₀₀, g₀₁, g₀₂]</text>
  <text x="67" y="118.5" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#c85a17">dY₁: [g₁₀, g₁₁, g₁₂]</text>
  <path d="M 116 110 L 126 110" stroke="#ff8246" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <rect x="130" y="102" width="68" height="16" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="1"/>
  <text x="164" y="112.5" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#c85a17">Σ axis 0 → [3]</text>

  <rect x="15" y="142" width="190" height="10" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="110" y="149.5" text-anchor="middle" font-size="6.2" font-weight="600" fill="#475569">Contract: Broadcast in forward, sum in backward</text>
</svg>
