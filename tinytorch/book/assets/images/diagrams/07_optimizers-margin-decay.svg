<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="145" viewBox="0 0 220 145" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="220" height="145" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="135" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">WEIGHT DECAY: ADAM VS ADAMW</text>

  <rect x="12" y="31" width="196" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="18" y="42" font-size="7" font-weight="700" fill="#475569">Adam (Coupled L2 Penalty)</text>
  <text x="18" y="54" font-size="6.8" font-family="'DejaVu Sans Mono', monospace" fill="#1e293b">&#916;&#952; = &#8722;&#951;(g + &#955;&#952;) / (&#8730;v&#770; + &#949;)</text>
  <text x="18" y="66" font-size="6.2" fill="#64748b">Large &#8711; increases v&#770;, suppressing decay</text>

  <rect x="12" y="78" width="196" height="42" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="18" y="89" font-size="7" font-weight="700" fill="#c85a17">AdamW (Decoupled Weight Decay)</text>
  <text x="18" y="101" font-size="6.8" font-family="'DejaVu Sans Mono', monospace" font-weight="bold" fill="#c85a17">&#952; &#8592; (1 &#8722; &#951;&#955;)&#952; &#8722; &#951;(m&#770; / (&#8730;v&#770; + &#949;))</text>
  <text x="18" y="113" font-size="6.2" fill="#1f2937">Decay rate is strictly &#951;&#955; across all weights</text>

  <rect x="12" y="124" width="196" height="12" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
  <text x="110" y="132.5" text-anchor="middle" font-size="6" font-weight="700" fill="#0d9488">Scale-invariant: active features remain regularized</text>
</svg>
