<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="202" viewBox="0 0 220 202" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="202" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="192" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">FOOTPRINT VS MEMORY TRAFFIC</text>

  <g transform="translate(0, 0)">
    <rect x="12" y="30" width="196" height="62" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="18" y="42" font-size="6.8" font-weight="700" fill="#1e40af">1. Resident Footprint (Capacity)</text>
    <text x="18" y="53" font-size="5.8" fill="#1f2937">Live tensors in RAM at peak instant</text>
    <text x="18" y="63" font-size="5.8" fill="#1f2937">Weights plus active intermediate buffers</text>
    <text x="18" y="73" font-size="5.8" font-weight="600" fill="#2563eb">Bound: Device capacity (triggers OOM)</text>
    <text x="18" y="83" font-size="5.4" font-family="monospace" fill="#475569">Tool: tracemalloc, cudaMemGetInfo</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="12" y="97" width="196" height="62" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="18" y="109" font-size="6.8" font-weight="700" fill="#c85a17">2. Memory Bus Traffic Q (Movement)</text>
    <text x="18" y="120" font-size="5.8" fill="#1f2937">Cumulative bytes moved across memory bus</text>
    <text x="18" y="130" font-size="5.8" fill="#1f2937">Reads and writes across DRAM channels</text>
    <text x="18" y="140" font-size="5.8" font-weight="600" fill="#c85a17">Bound: Bandwidth time lower limit (Q / B)</text>
    <text x="18" y="150" font-size="5.4" font-family="monospace" fill="#475569">Tool: Hardware PMU, NVIDIA Nsight</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="12" y="164" width="196" height="27" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="18" y="175" font-size="5.8" font-weight="700" fill="#0f172a">Systems Insight: Capacity != Traffic</text>
    <text x="18" y="185" font-size="5.3" fill="#64748b">Cache hits consume RAM, but create 0 bus traffic.</text>
  </g>
</svg>
