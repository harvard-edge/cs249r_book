<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="150" viewBox="0 0 220 150" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="150" fill="#ffffff"/>
  <!-- Outer Card Frame -->
  <rect x="5" y="5" width="210" height="140" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <!-- Header Banner -->
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">COL2IM: SCATTER-ADD GRADIENTS</text>

  <!-- Section 1: Overlapping Windows to Accumulator -->
  <g transform="translate(12, 28)">
    <!-- 3x3 Input Spatial Patch -->
    <g transform="translate(0, 4)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="11" y="0" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="22" y="0" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Row 1 -->
      <rect x="0" y="11" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <!-- Shared Center Pixel X[1,1] -->
      <rect x="11" y="11" width="10" height="10" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
      <text x="16" y="18.5" font-size="6" font-family="monospace" font-weight="bold" fill="#c85a17" text-anchor="middle">x</text>
      <rect x="22" y="11" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

      <!-- Row 2 -->
      <rect x="0" y="22" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="11" y="22" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <rect x="22" y="22" width="10" height="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

      <text x="16" y="39" font-size="5.2" font-weight="700" fill="#475569" text-anchor="middle">Shared Center Pixel</text>
      <text x="16" y="45" font-size="4.8" fill="#64748b" text-anchor="middle">(Touched by 4 windows)</text>
    </g>

    <!-- Upstream Gradient Rows from G_col -->
    <g transform="translate(48, 2)">
      <text x="8" y="4" font-size="5" font-weight="700" fill="#64748b" text-anchor="middle">G_col terms</text>

      <!-- Row 1 -->
      <rect x="0" y="6" width="16" height="8" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
      <text x="8" y="12.2" font-size="5" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">δ₁</text>
      <path d="M 16 10 L 36 24" stroke="#2563eb" stroke-width="0.7"/>

      <!-- Row 2 -->
      <rect x="0" y="16" width="16" height="8" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
      <text x="8" y="22.2" font-size="5" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">δ₂</text>
      <path d="M 16 20 L 36 25" stroke="#2563eb" stroke-width="0.7"/>

      <!-- Row 3 -->
      <rect x="0" y="26" width="16" height="8" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
      <text x="8" y="32.2" font-size="5" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">δ₃</text>
      <path d="M 16 30 L 36 27" stroke="#2563eb" stroke-width="0.7"/>

      <!-- Row 4 -->
      <rect x="0" y="36" width="16" height="8" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
      <text x="8" y="42.2" font-size="5" font-family="monospace" font-weight="bold" fill="#1e40af" text-anchor="middle">δ₄</text>
      <path d="M 16 40 L 36 28" stroke="#2563eb" stroke-width="0.7"/>
    </g>

    <!-- Central Accumulator (Scatter-Add col2im) -->
    <g transform="translate(94, 15)">
      <circle cx="11" cy="11" r="11" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
      <text x="11" y="15" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle">+=</text>
      <text x="11" y="-2" font-size="5.8" font-weight="700" fill="#0d9488" text-anchor="middle">col2im</text>
      <text x="11" y="28" font-size="5" font-weight="700" fill="#115e59" text-anchor="middle">Scatter-Add</text>

      <!-- Arrow out to target tensor -->
      <path d="M 23 11 H 37" stroke="#0d9488" stroke-width="1.1"/>
      <polygon points="35 9, 39 11, 35 13" fill="#0d9488"/>
    </g>

    <!-- Output Input Gradient Buffer Cell -->
    <g transform="translate(138, 14)">
      <rect x="0" y="0" width="56" height="22" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
      <text x="28" y="9" font-size="5.8" font-family="monospace" font-weight="bold" fill="#c85a17" text-anchor="middle">∇X[1, 1]</text>
      <text x="28" y="17" font-size="5.2" font-family="monospace" fill="#c85a17" text-anchor="middle">= δ₁+δ₂+δ₃+δ₄</text>
    </g>
  </g>

  <!-- Section 2: Multivariate Chain Rule Banner -->
  <g transform="translate(12, 82)">
    <rect x="0" y="0" width="196" height="23" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="98" y="9.5" font-size="5.8" font-weight="700" fill="#1f2937" text-anchor="middle">Multivariate Chain Rule: Used 4× in forward</text>
    <text x="98" y="18" font-size="5.2" fill="#0d9488" font-weight="700" text-anchor="middle">Must accumulate 4× in backward via scatter-add (+=)</text>
  </g>

  <!-- Section 3: Summary Code & Pitfall Footer -->
  <line x1="12" y1="112" x2="208" y2="112" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="110" y="122" font-size="5.8" font-family="monospace" font-weight="bold" fill="#0d9488" text-anchor="middle">grad_input_padded[...] += grad_patch</text>
  <text x="110" y="131" font-size="5.1" fill="#dc2626" text-anchor="middle">Assignment (=) overwrites; scatter-add (+=) accumulates</text>
  <text x="110" y="139" font-size="4.7" fill="#64748b" text-anchor="middle">GPU libraries implement col2im using atomicAdd</text>
</svg>
