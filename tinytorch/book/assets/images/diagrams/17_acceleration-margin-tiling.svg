<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="185" viewBox="0 0 220 185" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="185" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="175" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">2D BLOCK TILING IN L1 CACHE</text>
  <text x="205" y="19" text-anchor="end" font-size="6.5" font-family="monospace" fill="#64748b">GEMM</text>

  <g transform="translate(14, 27)">
    <text x="0" y="8" font-size="6.6" font-weight="700" fill="#334155">2D Partitioning: C[I,J] += A[I,K] × B[K,J]</text>

    <g transform="translate(0, 12)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="36" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <line x1="12" y1="0" x2="12" y2="34" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="24" y1="0" x2="24" y2="34" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="0" y1="11.3" x2="36" y2="11.3" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="0" y1="22.7" x2="36" y2="22.7" stroke="#e2e8f0" stroke-width="0.7"/>
        <rect x="12" y="11.3" width="12" height="11.4" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
        <text x="18" y="19.5" text-anchor="middle" font-size="4.6" font-family="monospace" font-weight="bold" fill="#c85a17">A_ik</text>
        <text x="18" y="42" text-anchor="middle" font-size="5" font-weight="bold" fill="#475569">A (M×K)</text>
      </g>

      <text x="44" y="19" text-anchor="middle" font-size="8.5" fill="#64748b">×</text>

      <g transform="translate(52, 0)">
        <rect x="0" y="0" width="36" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <line x1="12" y1="0" x2="12" y2="34" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="24" y1="0" x2="24" y2="34" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="0" y1="11.3" x2="36" y2="11.3" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="0" y1="22.7" x2="36" y2="22.7" stroke="#e2e8f0" stroke-width="0.7"/>
        <rect x="12" y="11.3" width="12" height="11.4" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
        <text x="18" y="19.5" text-anchor="middle" font-size="4.6" font-family="monospace" font-weight="bold" fill="#c85a17">B_kj</text>
        <text x="18" y="42" text-anchor="middle" font-size="5" font-weight="bold" fill="#475569">B (K×N)</text>
      </g>

      <text x="96" y="18.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0d9488">+=</text>

      <g transform="translate(104, 0)">
        <rect x="0" y="0" width="36" height="34" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <line x1="12" y1="0" x2="12" y2="34" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="24" y1="0" x2="24" y2="34" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="0" y1="11.3" x2="36" y2="11.3" stroke="#e2e8f0" stroke-width="0.7"/>
        <line x1="0" y1="22.7" x2="36" y2="22.7" stroke="#e2e8f0" stroke-width="0.7"/>
        <rect x="12" y="11.3" width="12" height="11.4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
        <text x="18" y="19.5" text-anchor="middle" font-size="4.6" font-family="monospace" font-weight="bold" fill="#0f766e">C_ij</text>
        <text x="18" y="42" text-anchor="middle" font-size="5" font-weight="bold" fill="#0f766e">C (M×N)</text>
      </g>

      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="44" height="43" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="22" y="10" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#334155">Tile Size T</text>
        <text x="22" y="19" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#0f766e">T = 32</text>
        <text x="22" y="27" text-anchor="middle" font-size="4.8" fill="#64748b">1,024 floats</text>
        <text x="22" y="36" text-anchor="middle" font-size="4.5" fill="#64748b">(4 KB / tile)</text>
      </g>
    </g>
  </g>

  <g transform="translate(14, 88)">
    <rect x="0" y="0" width="192" height="47" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="6" y="10" font-size="6.5" font-weight="700" fill="#0f766e">L1 Cache (3 Resident Blocks)</text>
    <text x="186" y="10" text-anchor="end" font-size="5.8" font-family="monospace" font-weight="bold" fill="#0f766e">3T² × 4 B ≤ CACHE</text>

    <g transform="translate(6, 14)">
      <rect x="0" y="0" width="49" height="26" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="1"/>
      <text x="24.5" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#c85a17">A_tile (T×T)</text>
      <text x="24.5" y="16" text-anchor="middle" font-size="4.8" font-family="monospace" fill="#64748b">4 KB (T=32)</text>
      <text x="24.5" y="22.5" text-anchor="middle" font-size="4.5" font-weight="bold" fill="#0f766e">Reused T times</text>

      <text x="56" y="15" text-anchor="middle" font-size="8" fill="#64748b">×</text>

      <rect x="63" y="0" width="49" height="26" rx="1" fill="#ffffff" stroke="#ff8246" stroke-width="1"/>
      <text x="87.5" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#c85a17">B_tile (T×T)</text>
      <text x="87.5" y="16" text-anchor="middle" font-size="4.8" font-family="monospace" fill="#64748b">4 KB (T=32)</text>
      <text x="87.5" y="22.5" text-anchor="middle" font-size="4.5" font-weight="bold" fill="#0f766e">Reused T times</text>

      <text x="120" y="15" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0d9488">+=</text>

      <rect x="127" y="0" width="53" height="26" rx="1" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
      <text x="153.5" y="8.5" text-anchor="middle" font-size="5.2" font-family="monospace" font-weight="bold" fill="#0f766e">C_accum (T×T)</text>
      <text x="153.5" y="16" text-anchor="middle" font-size="4.8" font-family="monospace" fill="#64748b">4 KB (T=32)</text>
      <text x="153.5" y="22.5" text-anchor="middle" font-size="4.5" font-weight="bold" fill="#0f766e">In-place sum</text>
    </g>
  </g>

  <g transform="translate(14, 139)">
    <rect x="0" y="0" width="192" height="37" rx="1.5" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
    <text x="6" y="9.5" font-size="6" font-weight="700" fill="#1e40af">Working Set:</text>
    <text x="56" y="9.5" font-size="5.6" font-family="monospace" fill="#1e40af">3 × 32² × 4 B = 12 KB (≤ 32 KB L1)</text>

    <text x="6" y="19" font-size="6" font-weight="700" fill="#1e40af">DRAM Traffic:</text>
    <text x="56" y="19" font-size="5.6" font-family="monospace" fill="#1e40af">2MNK (naive) → 2MNK / T (tiled)</text>

    <rect x="4" y="23" width="184" height="10.5" rx="1" fill="#dbeafe"/>
    <text x="96" y="30.5" text-anchor="middle" font-size="5.7" font-weight="bold" fill="#1e40af">T = 32 reduces DRAM memory traffic by 32×</text>
  </g>
</svg>
