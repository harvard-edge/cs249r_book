<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="205" viewBox="0 0 220 205" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="205" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="195" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">LINEAR INTENSITY: I &#8776; R / 2</text>

  <g transform="translate(0, 0)">
    <rect x="12" y="30" width="196" height="46" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="18" y="41" font-size="6.2" font-weight="700" fill="#1f2937">Arithmetic Intensity Derivation</text>
    <text x="18" y="51" font-size="5.6" fill="#475569">Work: F = 2 · R · n · m FLOPs</text>
    <text x="18" y="60" font-size="5.6" fill="#475569">Traffic: Q = 4nm + 4R(n + m) &#8776; 4nm bytes</text>
    <text x="18" y="69" font-size="5.8" font-weight="700" fill="#c85a17">Result: I = F / Q &#8776; 2Rnm / 4nm = R / 2 FLOP/B</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="12" y="81" width="196" height="38" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="18" y="92" font-size="6.4" font-weight="700" fill="#c85a17">R &#8804; 8: Memory-Bound (I &lt; 5.0)</text>
    <text x="18" y="102" font-size="5.6" fill="#1f2937">Weight read dominates; compute units stall on bus.</text>
    <text x="18" y="111" font-size="5.4" fill="#475569">Latency is flat (~0.34 ms): rows 1 to 8 cost the same.</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="12" y="124" width="196" height="38" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="18" y="135" font-size="6.4" font-weight="700" fill="#1e40af">R &#8805; 16: Compute-Bound (I &gt; 5.0)</text>
    <text x="18" y="145" font-size="5.6" fill="#1f2937">Weights reused in cache; ALUs reach saturation.</text>
    <text x="18" y="154" font-size="5.4" fill="#475569">Latency scales linearly: doubling R doubles time.</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="12" y="167" width="196" height="26" rx="1" fill="#f1f5f9" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="18" y="177" font-size="5.8" font-weight="700" fill="#0f172a">Batching Principle: Ridge Transition</text>
    <text x="18" y="187" font-size="5.3" fill="#64748b">Batching raises intensity by amortizing weight fetches.</text>
  </g>
</svg>
