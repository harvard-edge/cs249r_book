<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="156" viewBox="0 0 220 156" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="156" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="146" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">LOW-RANK: ACTIVATION TRAFFIC</text>

  <text x="14" y="34" font-size="6.5" font-weight="bold" fill="#475569">1. Dense Layer (Direct GEMM)</text>

  <rect x="14" y="38" width="28" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="28" y="49" text-anchor="middle" font-size="5.5" fill="#1f2937">x (B×M)</text>

  <path d="M 44 46 L 52 46" stroke="#9ca3af" stroke-width="1"/>
  <polygon points="51 44.5, 54 46, 51 47.5" fill="#9ca3af"/>

  <rect x="56" y="38" width="94" height="16" rx="1.5" fill="#f1f5f9" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="103" y="49" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1f2937">W (M×N) Kernel</text>

  <path d="M 152 46 L 160 46" stroke="#9ca3af" stroke-width="1"/>
  <polygon points="159 44.5, 162 46, 159 47.5" fill="#9ca3af"/>

  <rect x="164" y="38" width="42" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="185" y="49" text-anchor="middle" font-size="5.5" fill="#1f2937">y (B×N)</text>

  <text x="110" y="61" text-anchor="middle" font-size="5.2" fill="#64748b">Weights: M·N floats | Intermediate activations: 0 B</text>

  <text x="14" y="73" font-size="6.5" font-weight="bold" fill="#475569">2. Low-Rank SVD (Unfused GEMM Chain)</text>

  <rect x="12" y="78" width="24" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="24" y="89" text-anchor="middle" font-size="5.2" fill="#1f2937">x</text>

  <path d="M 38 86 L 43 86" stroke="#9ca3af" stroke-width="0.9"/>
  <polygon points="42 84.8, 45 86, 42 87.2" fill="#9ca3af"/>

  <rect x="47" y="78" width="38" height="16" rx="1.5" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="66" y="89" text-anchor="middle" font-size="5.2" font-weight="bold" fill="#1e40af">W_A (M×r)</text>

  <path d="M 87 86 L 92 86" stroke="#ff8246" stroke-width="1"/>
  <polygon points="91 84.5, 94 86, 91 87.5" fill="#ff8246"/>

  <rect x="96" y="75" width="38" height="22" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
  <text x="115" y="85" text-anchor="middle" font-size="5.8" font-weight="bold" fill="#c85a17">h (B×r)</text>
  <text x="115" y="93" text-anchor="middle" font-size="4.8" fill="#c85a17">DRAM traffic</text>

  <path d="M 136 86 L 141 86" stroke="#ff8246" stroke-width="1"/>
  <polygon points="140 84.5, 143 86, 140 87.5" fill="#ff8246"/>

  <rect x="145" y="78" width="38" height="16" rx="1.5" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="164" y="89" text-anchor="middle" font-size="5.2" font-weight="bold" fill="#1e40af">W_B (r×N)</text>

  <path d="M 185 86 L 190 86" stroke="#9ca3af" stroke-width="0.9"/>
  <polygon points="189 84.8, 192 86, 189 87.2" fill="#9ca3af"/>

  <rect x="194" y="78" width="14" height="16" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="201" y="89" text-anchor="middle" font-size="5.2" fill="#1f2937">y</text>

  <text x="110" y="106" text-anchor="middle" font-size="5.3" font-weight="bold" fill="#c85a17">Unfused overhead: +2·B·r floats streamed to DRAM</text>
  <text x="110" y="114" text-anchor="middle" font-size="5.0" fill="#64748b">Weights drop to r(M+N), but large batch B inflates I/O</text>

  <rect x="14" y="121" width="192" height="23" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
  <text x="110" y="131" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#115e59">Systems Fix: Kernel Chaining and Fusion</text>
  <text x="110" y="140" text-anchor="middle" font-size="5.0" fill="#0d9488">Fusing xW_AW_B in SRAM eliminates intermediate DRAM round-trips</text>
</svg>
