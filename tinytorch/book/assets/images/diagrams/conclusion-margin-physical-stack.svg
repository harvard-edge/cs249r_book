<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="220" height="220" fill="#ffffff"/>
<defs>
  <marker id="arr-gray" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
    <polygon points="0 0, 6 2, 0 4" fill="#9ca3af"/>
  </marker>
  <marker id="arr-orange" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
    <polygon points="0 0, 6 2, 0 4" fill="#ff8246"/>
  </marker>
  <marker id="arr-teal" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
    <polygon points="0 0, 6 2, 0 4" fill="#0d9488"/>
  </marker>
</defs>

  <!-- Outer Card -->
  <rect x="5" y="5" width="210" height="210" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">PHYSICAL EXECUTION STACK</text>

  <!-- Layer 1: User Script -->
  <rect x="12" y="30" width="196" height="27" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="32" y1="30" x2="32" y2="57" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="22" y="47" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">L1</text>
  <text x="38" y="42" font-size="7.2" font-weight="700" fill="#1f2937">User Application Script</text>
  <text x="202" y="42" text-anchor="end" font-size="5.5" font-family="monospace" fill="#6b7280">Python API</text>
  <text x="38" y="52" font-size="6" font-family="monospace" fill="#4b5563">y = x @ W + b; loss.backward()</text>

  <line x1="110" y1="57" x2="110" y2="64" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-gray)"/>

  <!-- Layer 2: Tensor Coordinate Lens -->
  <rect x="12" y="65" width="196" height="27" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="32" y1="65" x2="32" y2="92" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="22" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">L2</text>
  <text x="38" y="77" font-size="7.2" font-weight="700" fill="#1f2937">Tensor Coordinate Lens</text>
  <text x="202" y="77" text-anchor="end" font-size="5.5" fill="#6b7280">Metadata</text>
  <text x="38" y="87" font-size="6" font-family="monospace" fill="#4b5563">shape=(B, D), strides=(D, 1), ptr</text>

  <line x1="110" y1="92" x2="110" y2="99" stroke="#ff8246" stroke-width="1" marker-end="url(#arr-orange)"/>

  <!-- Layer 3: Autograd Tape -->
  <rect x="12" y="100" width="196" height="27" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.1"/>
  <line x1="32" y1="100" x2="32" y2="127" stroke="#ff8246" stroke-width="0.8"/>
  <text x="22" y="117" text-anchor="middle" font-size="7.5" font-weight="700" fill="#c85a17">L3</text>
  <text x="38" y="112" font-size="7.2" font-weight="700" fill="#c85a17">Autograd Tape &amp; DAG</text>
  <text x="202" y="112" text-anchor="end" font-size="5.5" font-weight="600" fill="#c85a17">DFS Sort</text>
  <text x="38" y="122" font-size="6" font-family="monospace" fill="#9a3412">Function backward closures &amp; tapes</text>

  <line x1="110" y1="127" x2="110" y2="134" stroke="#ff8246" stroke-width="1" marker-end="url(#arr-orange)"/>

  <!-- Layer 4: Flat DRAM Ribbon -->
  <rect x="12" y="135" width="196" height="27" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.9"/>
  <line x1="32" y1="135" x2="32" y2="162" stroke="#0d9488" stroke-width="0.8"/>
  <text x="22" y="152" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f766e">L4</text>
  <text x="38" y="147" font-size="7.2" font-weight="700" fill="#0f766e">Flat DRAM Ribbon</text>
  <text x="202" y="147" text-anchor="end" font-size="5.5" font-weight="600" fill="#0f766e">1D Storage</text>
  <text x="38" y="157" font-size="6" font-family="monospace" fill="#115e59">Contiguous bytes: float32, int8 buffers</text>

  <line x1="110" y1="162" x2="110" y2="169" stroke="#0d9488" stroke-width="1" marker-end="url(#arr-teal)"/>

  <!-- Layer 5: Silicon Execution Engine -->
  <rect x="12" y="170" width="196" height="27" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="0.9"/>
  <line x1="32" y1="170" x2="32" y2="197" stroke="#2563eb" stroke-width="0.8"/>
  <text x="22" y="187" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e40af">L5</text>
  <text x="38" y="182" font-size="7.2" font-weight="700" fill="#1e40af">Silicon Execution Engine</text>
  <text x="202" y="182" text-anchor="end" font-size="5.5" font-weight="600" fill="#1e40af">Compute</text>
  <text x="38" y="192" font-size="6" font-family="monospace" fill="#1e3a8a">SIMD AVX2/NEON, BLAS GEMM, Triton</text>

  <!-- Summary Footer -->
  <rect x="12" y="201" width="196" height="10" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.7"/>
  <text x="110" y="208.5" text-anchor="middle" font-size="5.2" font-weight="600" fill="#64748b">Raw DRAM buffers lower to parallel silicon compute</text>
</svg>
