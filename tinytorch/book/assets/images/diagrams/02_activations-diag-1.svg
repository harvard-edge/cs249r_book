<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- Title & Section Divider Rule -->
  <text x="30" y="30" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">Non-Linear Activations: Breaking Linear Collapse &amp; Systems Arithmetic Intensity</text>
  <text x="870" y="30" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">Manifold Warping &amp; In-Register Fusion</text>
  <line x1="30" y1="40" x2="870" y2="40" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== 4-COLUMN COMPARISON GRID (y = 55 to 385) ==================== -->

  <!-- ==================== COLUMN 1: ReLU ==================== -->
  <g transform="translate(30, 55)">
    <!-- Column Frame -->
    <rect x="0" y="0" width="200" height="330" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="24" fill="#111827" />
    <text x="100" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. ReLU: max(0, x)</text>

    <!-- Technical Plot (w = 170, h = 105) -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="170" height="105" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      
      <!-- Dead regime shading for x < 0 -->
      <rect x="5" y="5" width="80" height="95" fill="#F3F4F6" opacity="0.6" />
      <text x="45" y="22" font-size="8" font-weight="600" fill="#9CA3AF" text-anchor="middle">Dead Zone</text>
      <text x="45" y="32" font-size="7.5" fill="#9CA3AF" text-anchor="middle">f'(x) = 0</text>

      <!-- Axes (Origin at x=85, y=85) -->
      <line x1="10" y1="85" x2="160" y2="85" stroke="#9CA3AF" stroke-width="1" />
      <line x1="85" y1="10" x2="85" y2="98" stroke="#9CA3AF" stroke-width="1" />
      <text x="156" y="96" font-size="8" fill="#6B7280">x</text>
      <text x="89" y="18" font-size="8" fill="#6B7280">y</text>

      <!-- Function Curve: y = max(0, x) -->
      <line x1="15" y1="85" x2="85" y2="85" stroke="#C85A17" stroke-width="2" />
      <line x1="85" y1="85" x2="155" y2="15" stroke="#C85A17" stroke-width="2" />

      <!-- Annotations -->
      <text x="125" y="60" font-size="8" font-weight="700" fill="#C85A17">Grad = 1.0</text>
      <circle cx="85" cy="85" r="2.5" fill="#111827" />
    </g>

    <!-- Formula & Specifications -->
    <g transform="translate(15, 150)" font-size="9.5">
      <!-- Math Box -->
      <rect x="0" y="0" width="170" height="42" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="16" font-family="'Times New Roman', serif" font-style="italic" font-size="10.5" fill="#111827">f(x) = max(0, x)</text>
      <text x="10" y="32" font-size="9" fill="#4B5563">f'(x) = 1 if x &gt; 0 else 0</text>

      <!-- Systems Properties -->
      <rect x="0" y="48" width="170" height="120" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="63" font-size="9" font-weight="700" fill="#111827">Systems Characteristics:</text>
      <text x="8" y="78" font-size="8.8" fill="#374151">• 1 opcode: SIMD <tspan font-family="monospace">maxps</tspan></text>
      <text x="8" y="93" font-size="8.8" fill="#374151">• Zero transcendental math</text>
      <text x="8" y="108" font-size="8.8" fill="#374151">• Rescues deep networks</text>
      <line x1="8" y1="116" x2="162" y2="116" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="8" y="130" font-size="8.5" font-weight="600" fill="#9A3412">Failure Mode:</text>
      <text x="8" y="143" font-size="8.2" fill="#6B7280">Dying ReLU (units stuck at 0)</text>
      <text x="8" y="156" font-size="8.2" fill="#6B7280">when bias becomes large -ve</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: GELU ==================== -->
  <g transform="translate(245, 55)">
    <!-- Column Frame (Highlighted) -->
    <rect x="0" y="0" width="205" height="330" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="24" fill="#C85A17" />
    <text x="102" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. GELU (Modern LLM Standard)</text>

    <!-- Technical Plot (w = 175, h = 105) -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="175" height="105" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />

      <!-- Axes (Origin at x=85, y=78) -->
      <line x1="10" y1="78" x2="165" y2="78" stroke="#9CA3AF" stroke-width="1" />
      <line x1="85" y1="10" x2="85" y2="98" stroke="#9CA3AF" stroke-width="1" />
      <text x="160" y="89" font-size="8" fill="#6B7280">x</text>
      <text x="89" y="18" font-size="8" fill="#6B7280">y</text>

      <!-- Smooth GELU Curve with Dip -->
      <path d="M 15 78 C 38 78, 52 82, 65 84 C 74 85, 80 81, 85 78 C 95 70, 120 40, 160 15" fill="none" stroke="#C85A17" stroke-width="2.2" />

      <!-- Negative Dip Callout -->
      <circle cx="65" cy="84" r="2.5" fill="#C85A17" />
      <text x="65" y="97" font-size="7.5" font-weight="700" fill="#9A3412" text-anchor="middle">Smooth Dip ≈ -0.17</text>
    </g>

    <!-- Formula & Specifications -->
    <g transform="translate(15, 150)" font-size="9.5">
      <!-- Math Box -->
      <rect x="0" y="0" width="175" height="42" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="8" y="15" font-family="'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#9A3412">f(x) = x · Φ(x) = x · P(X ≤ x)</text>
      <text x="8" y="30" font-family="'Times New Roman', serif" font-style="italic" font-size="8.8" fill="#111827">≈ 0.5x(1 + tanh(√(2/π)(x + 0.0447x³)))</text>

      <!-- Systems Properties -->
      <rect x="0" y="48" width="175" height="120" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1" />
      <text x="8" y="63" font-size="9" font-weight="700" fill="#9A3412">Transformer Backbone:</text>
      <text x="8" y="78" font-size="8.8" fill="#374151">• Smooth non-monotonic gate</text>
      <text x="8" y="93" font-size="8.8" fill="#374151">• Non-zero grad for small x &lt; 0</text>
      <text x="8" y="108" font-size="8.8" fill="#374151">• Used in GPT-2, BERT, LLaMA</text>
      <line x1="8" y1="116" x2="167" y2="116" stroke="#FDBA74" stroke-width="0.8" />
      <text x="8" y="130" font-size="8.5" font-weight="600" fill="#9A3412">Key Advantage:</text>
      <text x="8" y="143" font-size="8.2" fill="#374151">Eliminates dead neurons via</text>
      <text x="8" y="156" font-size="8.2" fill="#374151">probabilistic stochastic flow</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: Sigmoid & Tanh ==================== -->
  <g transform="translate(465, 55)">
    <!-- Column Frame -->
    <rect x="0" y="0" width="200" height="330" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="24" fill="#111827" />
    <text x="100" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Sigmoid &amp; Tanh S-Curves</text>

    <!-- Technical Plot (w = 170, h = 105) -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="170" height="105" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />

      <!-- Saturation Zones -->
      <rect x="5" y="5" width="35" height="95" fill="#FEE2E2" opacity="0.5" />
      <rect x="130" y="5" width="35" height="95" fill="#FEE2E2" opacity="0.5" />
      <text x="22" y="20" font-size="7" font-weight="600" fill="#991B1B" text-anchor="middle">Sat.</text>
      <text x="148" y="20" font-size="7" font-weight="600" fill="#991B1B" text-anchor="middle">Sat.</text>

      <!-- Axes (Origin at x=85, y=55) -->
      <line x1="10" y1="55" x2="160" y2="55" stroke="#9CA3AF" stroke-width="1" />
      <line x1="85" y1="10" x2="85" y2="98" stroke="#9CA3AF" stroke-width="1" />
      <text x="156" y="65" font-size="8" fill="#6B7280">x</text>

      <!-- Tanh curve (Solid Dark) -->
      <path d="M 15 88 C 50 88, 65 65, 85 55 C 105 45, 120 22, 155 22" fill="none" stroke="#111827" stroke-width="1.8" />

      <!-- Sigmoid curve (Dashed Orange) -->
      <path d="M 15 78 C 50 78, 68 62, 85 55 C 102 48, 120 32, 155 32" fill="none" stroke="#C85A17" stroke-width="1.8" stroke-dasharray="4,2" />

      <!-- Legend -->
      <line x1="12" y1="94" x2="26" y2="94" stroke="#111827" stroke-width="1.8" />
      <text x="29" y="97" font-size="7.5" fill="#111827">Tanh</text>
      <line x1="56" y1="94" x2="70" y2="94" stroke="#C85A17" stroke-width="1.8" stroke-dasharray="3,1" />
      <text x="73" y="97" font-size="7.5" fill="#C85A17">Sigmoid</text>
    </g>

    <!-- Formula & Specifications -->
    <g transform="translate(15, 150)" font-size="9.5">
      <!-- Math Box -->
      <rect x="0" y="0" width="170" height="42" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="16" font-family="'Times New Roman', serif" font-style="italic" font-size="9.2" fill="#111827">σ(x) = 1 / (1 + exp(-x))</text>
      <text x="8" y="32" font-family="'Times New Roman', serif" font-style="italic" font-size="9.2" fill="#111827">tanh(x) = (exp(x) - exp(-x)) / (exp(x) + exp(-x))</text>

      <!-- Systems Properties -->
      <rect x="0" y="48" width="170" height="120" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="63" font-size="9" font-weight="700" fill="#991B1B">Vanishing Gradient Crisis:</text>
      <text x="8" y="78" font-size="8.8" fill="#374151">• Max σ'(0) = 0.25 (At peak)</text>
      <text x="8" y="93" font-size="8.8" fill="#374151">• 10 layers: (0.25)¹⁰ ≈ 9.5×10⁻⁷</text>
      <text x="8" y="108" font-size="8.8" fill="#374151">• Gradients decay exponentially</text>
      <line x1="8" y1="116" x2="162" y2="116" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="8" y="130" font-size="8.5" font-weight="600" fill="#991B1B">Hardware Impact:</text>
      <text x="8" y="143" font-size="8.2" fill="#6B7280">Heavy exp() transcendental</text>
      <text x="8" y="156" font-size="8.2" fill="#6B7280">instructions stall execution</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: Systems Layer (Fusion) ==================== -->
  <g transform="translate(680, 55)">
    <!-- Column Frame -->
    <rect x="0" y="0" width="190" height="330" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
    <rect x="0" y="0" width="190" height="24" fill="#111827" />
    <text x="95" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Systems Kernel Fusion</text>

    <!-- Dataflow Architecture Comparison -->
    <g transform="translate(10, 36)" font-size="9">
      <!-- Unfused Flow -->
      <rect x="0" y="0" width="170" height="88" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <rect x="0" y="0" width="170" height="18" fill="#F3F4F6" />
      <text x="8" y="13" font-size="8.5" font-weight="700" fill="#991B1B">Unfused (Memory Bound)</text>

      <text x="8" y="32" font-size="8" fill="#374151">1. GEMM → Store to DRAM (4 B)</text>
      <text x="8" y="46" font-size="8" fill="#374151">2. Read from DRAM (4 B)</text>
      <text x="8" y="60" font-size="8" fill="#374151">3. Compute GELU → Store DRAM (4 B)</text>
      <line x1="8" y1="67" x2="162" y2="67" stroke="#E5E7EB" stroke-width="0.8" />
      <text x="8" y="80" font-size="8" font-weight="700" fill="#991B1B">3 DRAM Roundtrips • I = 0.125</text>

      <!-- Fused Flow -->
      <rect x="0" y="96" width="170" height="96" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" />
      <rect x="0" y="96" width="170" height="18" fill="#FFEDD5" />
      <text x="8" y="109" font-size="8.5" font-weight="700" fill="#9A3412">Fused Kernel (Compute Bound)</text>

      <text x="8" y="128" font-size="8" fill="#7C2D12">1. GEMM in L1/SRAM registers</text>
      <text x="8" y="142" font-size="8" font-weight="600" fill="#9A3412">2. Apply GELU in registers (0 DRAM)</text>
      <text x="8" y="156" font-size="8" fill="#7C2D12">3. Single Store to DRAM (4 B)</text>
      <line x1="8" y1="164" x2="162" y2="164" stroke="#FDBA74" stroke-width="0.8" />
      <text x="8" y="178" font-size="8" font-weight="700" fill="#15803D">2.5× Bandwidth Speedup</text>

      <!-- Roofline Summary -->
      <rect x="0" y="198" width="170" height="84" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
      <text x="8" y="214" font-size="8.5" font-weight="700" fill="#111827">Roofline Implication:</text>
      <text x="8" y="228" font-size="8" fill="#4B5563">Elementwise ops have low</text>
      <text x="8" y="240" font-size="8" fill="#4B5563">intensity (0.125 FLOPs/Byte).</text>
      <text x="8" y="254" font-size="8" fill="#4B5563">Fusing into GEMM SRAM tiles</text>
      <text x="8" y="268" font-size="8" font-weight="600" fill="#15803D">eliminates memory stall!</text>
    </g>
  </g>

  <!-- ==================== SECTION 3: BOTTOM SYSTEMS INVARIANT ==================== -->
  <g transform="translate(30, 404)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#E5E7EB" stroke-width="1" />
    <text x="0" y="20" font-size="11" font-weight="700" fill="#111827">Systems Principle: The Associative Linear Collapse Invariant</text>
    <text x="0" y="36" font-size="10.5" fill="#4B5563">
      Without non-linear activations, <tspan font-family="'Times New Roman', serif" font-style="italic">L</tspan> consecutive linear layers collapse into a single matrix product <tspan font-family="'Times New Roman', serif" font-style="italic">W_eff = W₁ · W₂ ··· W_L</tspan> due to associativity.
    </text>
    <text x="0" y="52" font-size="10" fill="#6B7280">
      Non-linear gates <tspan font-family="'Times New Roman', serif" font-style="italic">σ(·)</tspan> break matrix associativity (<tspan font-family="'Times New Roman', serif" font-style="italic">σ(AB) ≠ σ(A)σ(B)</tspan>), empowering the network to carve complex multi-dimensional decision manifolds.
    </text>
  </g>
</svg>
