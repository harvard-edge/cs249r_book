<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="185" viewBox="0 0 220 185" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#9ca3af"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="220" height="185" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="175" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">STACKING ORDER &amp; SVD</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">4.89× TOTAL</text>

  <g transform="translate(14, 0)">
    <rect x="0" y="28" width="192" height="20" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="96" y1="28" x2="96" y2="48" stroke="#cbd5e1" stroke-width="0.8"/>
    
    <text x="6" y="36" font-size="5.5" font-weight="700" fill="#64748b">SOLO PRODUCT PREDICTION</text>
    <text x="6" y="44" font-size="6.0" font-family="monospace" fill="#1f2937">1.0×1.01×3.6×1.1 = <tspan font-weight="bold" fill="#475569">4.00×</tspan></text>
    
    <text x="102" y="36" font-size="5.5" font-weight="700" fill="#c85a17">MODELED COMPOUNDED</text>
    <text x="102" y="44" font-size="6.0" font-family="monospace" font-weight="bold" fill="#c85a17">149.8ms → 30.6ms = 4.89×</text>

    <text x="0" y="58" font-size="6.5" font-weight="700" fill="#334155">Forward Order (Quant → SVD → Fuse → Cache):</text>
    
    <g transform="translate(0, 63)">
      <rect x="0" y="0" width="41" height="15" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="20.5" y="7" text-anchor="middle" font-size="5.2" fill="#64748b">INT8</text>
      <text x="20.5" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1f2937">1.00×</text>
      
      <line x1="42" y1="7.5" x2="48" y2="7.5" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-gray)"/>

      <rect x="50" y="0" width="41" height="15" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="70.5" y="7" text-anchor="middle" font-size="5.2" fill="#64748b">SVD</text>
      <text x="70.5" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1f2937">1.01×</text>

      <line x1="92" y1="7.5" x2="98" y2="7.5" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-gray)"/>

      <rect x="100" y="0" width="41" height="15" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
      <text x="120.5" y="7" text-anchor="middle" font-size="5.2" fill="#2563eb">Fusion</text>
      <text x="120.5" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1e40af">3.66×</text>

      <line x1="142" y1="7.5" x2="148" y2="7.5" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-gray)"/>

      <rect x="150" y="0" width="42" height="15" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
      <text x="171" y="7" text-anchor="middle" font-size="5.2" fill="#c85a17">KV Cache</text>
      <text x="171" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#c85a17">1.33×</text>
    </g>
    <text x="0" y="86" font-size="5.3" font-family="monospace" fill="#64748b">Marginal progression leads to 4.89× cumulative gain</text>

    <text x="0" y="97" font-size="6.5" font-weight="700" fill="#334155">Reverse Order (Cache → Fuse → SVD → Quant):</text>
    
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="41" height="15" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="20.5" y="7" text-anchor="middle" font-size="5.2" fill="#64748b">KV Cache</text>
      <text x="20.5" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1f2937">1.10×</text>
      
      <line x1="42" y1="7.5" x2="48" y2="7.5" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-gray)"/>

      <rect x="50" y="0" width="41" height="15" rx="1" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
      <text x="70.5" y="7" text-anchor="middle" font-size="5.2" fill="#2563eb">Fusion</text>
      <text x="70.5" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1e40af">4.93×</text>

      <line x1="92" y1="7.5" x2="98" y2="7.5" stroke="#ef4444" stroke-width="1" marker-end="url(#arr-red)"/>

      <rect x="100" y="0" width="41" height="15" rx="1" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
      <text x="120.5" y="7" text-anchor="middle" font-size="5.2" font-weight="bold" fill="#dc2626">SVD</text>
      <text x="120.5" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#dc2626">0.87×</text>

      <line x1="142" y1="7.5" x2="148" y2="7.5" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-gray)"/>

      <rect x="150" y="0" width="42" height="15" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="171" y="7" text-anchor="middle" font-size="5.2" fill="#64748b">INT8</text>
      <text x="171" y="13" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1f2937">1.03×</text>
    </g>
    <text x="0" y="125" font-size="5.3" font-family="monospace" fill="#dc2626">SVD becomes an active 0.87× latency penalty</text>

    <g transform="translate(0, 131)">
      <rect x="0" y="0" width="192" height="40" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
      <text x="6" y="9" font-size="5.8" font-weight="700" fill="#c85a17">Why SVD Causes a Slowdown (0.87×) in Reverse:</text>
      <text x="6" y="18" font-size="5.2" fill="#1f2937">Factorizing W into A·B replaces 1 matmul with 2 sequential calls.</text>
      <text x="6" y="27" font-size="5.2" fill="#1f2937">At single-token decode (B=1), two extra dispatches per block</text>
      <text x="6" y="35" font-size="5.2" fill="#1f2937">(39 → 47 per fused step) outweigh the FLOP reduction.</text>
    </g>
  </g>
</svg>
