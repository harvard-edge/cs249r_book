<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="165" viewBox="0 0 220 165" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="165" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="155" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">EVALUATION DUAL SWITCH</text>

  <g transform="translate(12, 30)">
    <rect x="0" y="0" width="196" height="45" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="14" rx="2" fill="#dbeafe"/>
    <text x="6" y="10" font-size="6.5" font-weight="bold" fill="#1e40af">1. LAYERS: set_training_mode(m, False)</text>
    <text x="6" y="24" font-size="6.5" font-family="monospace" fill="#1e293b">Dropout: identity (no neuron dropping)</text>
    <text x="6" y="36" font-size="6.0" fill="#2563eb">Ensures deterministic inference predictions</text>
  </g>

  <g transform="translate(12, 80)">
    <rect x="0" y="0" width="196" height="45" rx="2" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="14" rx="2" fill="#ccfbf1"/>
    <text x="6" y="10" font-size="6.5" font-weight="bold" fill="#0f766e">2. AUTOGRAD ENGINE: with no_grad():</text>
    <text x="6" y="24" font-size="6.5" font-family="monospace" fill="#1e293b">Tape: disabled (no OpNodes or caching)</text>
    <text x="6" y="36" font-size="6.0" fill="#0d9488">Reclaims activation memory immediately</text>
  </g>

  <rect x="12" y="132" width="196" height="18" rx="2" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="110" y="144" text-anchor="middle" font-size="6.0" font-weight="bold" fill="#c85a17">Both required: eval mode alone still leaks RAM</text>
</svg>
