<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="210" fill="#ffffff"/>
  
  <rect x="5" y="5" width="210" height="200" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">CONFIDENCE INTERVAL VS TAIL</text>
  <text x="205" y="19" text-anchor="end" font-size="6.2" font-family="monospace" fill="#64748b">STAT</text>

  
  <text x="12" y="36" font-size="7" font-weight="700" fill="#1e40af">1. Mean 95% Confidence Interval</text>
  <text x="12" y="45" font-size="5.4" fill="#64748b">Estimator uncertainty: error band shrinks as 1/√N</text>

  <g transform="translate(12, 49)">
    <rect x="0" y="0" width="196" height="44" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

    
    <text x="7" y="14" font-size="5.6" font-weight="700" fill="#334155">N = 10:</text>
    
    <line x1="60" y1="12" x2="130" y2="12" stroke="#2563eb" stroke-width="1.6"/>
    <line x1="60" y1="8" x2="60" y2="16" stroke="#2563eb" stroke-width="1.2"/>
    <line x1="130" y1="8" x2="130" y2="16" stroke="#2563eb" stroke-width="1.2"/>
    <circle cx="95" cy="12" r="2.2" fill="#1e40af"/>
    <text x="136" y="14" font-size="5.2" fill="#2563eb">Wide (±1.2 ms)</text>

    
    <text x="7" y="28" font-size="5.6" font-weight="700" fill="#334155">N = 1k:</text>
    
    <line x1="90" y1="26" x2="100" y2="26" stroke="#2563eb" stroke-width="1.6"/>
    <line x1="90" y1="22" x2="90" y2="30" stroke="#2563eb" stroke-width="1.2"/>
    <line x1="100" y1="22" x2="100" y2="30" stroke="#2563eb" stroke-width="1.2"/>
    <circle cx="95" cy="26" r="2.2" fill="#1e40af"/>
    <text x="136" y="28" font-size="5.2" fill="#2563eb">Narrow (±0.1 ms)</text>

    <text x="98" y="39" text-anchor="middle" font-size="5.1" font-style="italic" fill="#64748b">As N grows, mean CI collapses toward zero width</text>
  </g>

  
  <text x="12" y="106" font-size="7" font-weight="700" fill="#c85a17">2. Tail Latency: P95 and P99 Percentiles</text>
  <text x="12" y="115" font-size="5.4" fill="#64748b">Request distribution: does not shrink with N</text>

  <g transform="translate(12, 119)">
    <rect x="0" y="0" width="196" height="52" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

    
    <line x1="15" y1="38" x2="185" y2="38" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="35" y="45" text-anchor="middle" font-size="5" fill="#9ca3af">5 ms</text>
    <text x="80" y="45" text-anchor="middle" font-size="5" fill="#9ca3af">10 ms</text>
    <text x="135" y="45" text-anchor="middle" font-size="5" fill="#9ca3af">15 ms</text>
    <text x="175" y="45" text-anchor="middle" font-size="5" fill="#9ca3af">20 ms</text>

    
    <path d="M 22 38 C 34 10, 48 10, 62 22 C 85 32, 125 36, 178 38 L 178 38 L 22 38 Z" fill="#fff1e8"/>
    <path d="M 22 38 C 34 10, 48 10, 62 22 C 85 32, 125 36, 178 38" fill="none" stroke="#ea580c" stroke-width="1.3"/>

    
    <line x1="58" y1="18" x2="58" y2="38" stroke="#64748b" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
    <text x="58" y="14" text-anchor="middle" font-size="5" fill="#475569">Mean</text>

    
    <line x1="48" y1="12" x2="48" y2="38" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="2 1"/>
    <text x="48" y="8" text-anchor="middle" font-size="5" font-weight="bold" fill="#0d9488">P50</text>

    
    <line x1="128" y1="28" x2="128" y2="38" stroke="#c85a17" stroke-width="1.1"/>
    <circle cx="128" cy="28" r="1.5" fill="#c85a17"/>
    <text x="128" y="24" text-anchor="middle" font-size="5.2" font-weight="bold" fill="#c85a17">P95</text>

    
    <line x1="162" y1="35" x2="162" y2="38" stroke="#dc2626" stroke-width="1.1"/>
    <circle cx="162" cy="35" r="1.5" fill="#dc2626"/>
    <text x="162" y="31" text-anchor="middle" font-size="5.2" font-weight="bold" fill="#dc2626">P99</text>
  </g>

  
  <g transform="translate(12, 176)">
    <rect x="0" y="0" width="196" height="23" rx="1.5" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="98" y="9" text-anchor="middle" font-size="5.6" font-weight="700" fill="#991b1b">Fallacy: High N gives narrow CI, not low tail!</text>
    <text x="98" y="18" text-anchor="middle" font-size="5.1" fill="#7f1d1d">Confidence intervals check estimator, percentiles check SLAs.</text>
  </g>
</svg>
