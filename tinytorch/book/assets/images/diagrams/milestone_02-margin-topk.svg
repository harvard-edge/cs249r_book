<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="145" viewBox="0 0 220 145" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="145" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="135" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">TOP-K PROBABILITY TRUNCATION</text>

  <!-- Step 1: Logit partition and cutoff -->
  <text x="14" y="33" font-size="6.8" font-weight="700" fill="#4b5563">1. Top-2 Partition</text>

  <!-- Retained Top-2 Logits -->
  <rect x="14" y="42" width="34" height="22" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="31" y="56" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">A: +4.0</text>

  <rect x="52" y="42" width="34" height="22" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="69" y="56" text-anchor="middle" font-size="7.5" font-family="monospace" font-weight="bold" fill="#c85a17">B: +2.0</text>

  <!-- Cutoff divider -->
  <line x1="90" y1="41" x2="90" y2="66" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="90" y="38" text-anchor="middle" font-size="5.2" font-weight="700" fill="#dc2626">CUTOFF</text>

  <!-- Filtered Logits clamped to -inf -->
  <rect x="94" y="42" width="34" height="22" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="111" y="56" text-anchor="middle" font-size="7" font-family="monospace" fill="#9ca3af">C: -inf</text>

  <rect x="132" y="42" width="34" height="22" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="149" y="56" text-anchor="middle" font-size="7" font-family="monospace" fill="#9ca3af">D: -inf</text>

  <rect x="170" y="42" width="34" height="22" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="187" y="56" text-anchor="middle" font-size="7" font-family="monospace" fill="#9ca3af">E: -inf</text>

  <!-- Clamping Formula Banner -->
  <rect x="14" y="70" width="190" height="17" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="109" y="82" text-anchor="middle" font-size="6.8" font-family="monospace" fill="#1f2937">z &lt; kth &#x2192; -inf | exp(-inf) = 0</text>

  <!-- Step 2: Renormalized Softmax Probabilities -->
  <text x="14" y="102" font-size="7" font-weight="700" fill="#4b5563">2. Renormalized Softmax (Sum = 1.0)</text>

  <!-- Probability bar container -->
  <rect x="14" y="107" width="190" height="15" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Token A bar (92.4% of 190 = 175.5) -->
  <rect x="14" y="107" width="175" height="15" rx="2" fill="#ff8246"/>
  <!-- Token B bar (7.6% of 190 = 14.5) -->
  <rect x="189" y="107" width="15" height="15" rx="2" fill="#ffa07a"/>

  <!-- Bar labels -->
  <text x="20" y="118" font-size="7" font-family="monospace" font-weight="bold" fill="#ffffff">A: 92.4%</text>

  <!-- Footer explanation -->
  <text x="14" y="134" font-size="6.5" font-family="monospace" font-weight="bold" fill="#c85a17">B: 7.6%</text>
  <text x="204" y="134" text-anchor="end" font-size="6.5" font-family="monospace" fill="#9ca3af">Tail (C, D, E): 0.0%</text>
</svg>
