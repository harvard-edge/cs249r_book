<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="#111827" letter-spacing="0.2">KV Cache Architecture: Pre-Allocated Ring Buffers and PagedAttention Memoization</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TOP: COMPLEXITY COMPARISON ==================== -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="800" height="38" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2" />
    
    <rect x="12" y="8" width="140" height="22" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
    <text x="82" y="23" font-size="9.5" font-weight="700" fill="#9A3412" text-anchor="middle">Naive: O(S²) Recompute</text>
    <text x="160" y="23" font-size="9" fill="#4B5563">Step t re-projects tokens 1..t from scratch (99% redundant FLOPs)</text>

    <path d="M480 19 H505" stroke="#C85A17" stroke-width="1.2" marker-end="url(#arrowOrange)" />

    <rect x="515" y="8" width="135" height="22" rx="3" fill="#111827" />
    <text x="582" y="23" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">KV Cache: O(1) Append</text>
    <text x="658" y="23" font-size="9" font-weight="700" fill="#111827">Only projects token t!</text>
  </g>

  <!-- ==================== LEFT / CENTER PANEL: STATIC BUFFER ARCHITECTURE ==================== -->
  <g transform="translate(40, 106)">
    <rect x="0" y="0" width="490" height="282" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="490" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="490" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">Pre-Allocated Static Cache Buffer Architecture</text>
    <text x="476" y="19" font-size="10" font-weight="700" fill="#C85A17" text-anchor="end">Shape: [B, H, S_max, d_k]</text>

    <!-- Key Cache Buffer Grid -->
    <g transform="translate(16, 40)">
      <text x="0" y="12" font-size="10" font-weight="700" fill="#111827">Key Cache Buffer (K_cache):</text>
      
      <!-- Token slots -->
      <g transform="translate(0, 20)">
        <!-- Cached past tokens 1..5 -->
        <rect x="0" y="0" width="38" height="28" rx="2" fill="#111827" />
        <text x="19" y="18" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">k_1</text>
        <rect x="42" y="0" width="38" height="28" rx="2" fill="#111827" />
        <text x="61" y="18" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">k_2</text>
        <rect x="84" y="0" width="38" height="28" rx="2" fill="#111827" />
        <text x="103" y="18" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">k_3</text>
        <rect x="126" y="0" width="38" height="28" rx="2" fill="#111827" />
        <text x="145" y="18" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">k_4</text>
        <rect x="168" y="0" width="38" height="28" rx="2" fill="#111827" />
        <text x="187" y="18" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">k_5</text>

        <!-- Active New Token t -->
        <rect x="210" y="0" width="54" height="28" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" />
        <text x="237" y="18" font-size="9" font-weight="700" fill="#C85A17" text-anchor="middle">k_t [NEW]</text>

        <!-- Future Unfilled Slots -->
        <rect x="268" y="0" width="38" height="28" rx="2" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="2,2" />
        <text x="287" y="18" font-size="9" fill="#9CA3AF" text-anchor="middle">...</text>
        <rect x="310" y="0" width="48" height="28" rx="2" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="2,2" />
        <text x="334" y="18" font-size="8" fill="#9CA3AF" text-anchor="middle">k_Smax</text>

        <!-- Static Allocation Badge -->
        <rect x="366" y="0" width="90" height="28" rx="2" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
        <text x="411" y="18" font-size="8" font-weight="700" fill="#4B5563" text-anchor="middle">Zero malloc in loop</text>
      </g>

      <!-- Write Pointer Arrow -->
      <path d="M237 62 V52" stroke="#C85A17" stroke-width="1.5" marker-end="url(#arrowOrange)" />
      <text x="237" y="74" font-size="8.5" font-weight="700" fill="#C85A17" text-anchor="middle">pos = t (In-Place Slice Write)</text>
    </g>

    <!-- Attention Projection Math & Dataflow -->
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="456" height="74" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      
      <!-- Query Q_t -->
      <g transform="translate(12, 14)">
        <rect x="0" y="0" width="70" height="32" rx="2" fill="#111827" />
        <text x="35" y="15" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Query Q_t</text>
        <text x="35" y="26" font-size="7.5" fill="#E5E7EB" text-anchor="middle">[1, 1, d_k]</text>
      </g>

      <!-- Arrow -->
      <path d="M88 30 H104" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Attention Equation Box -->
      <g transform="translate(110, 8)">
        <rect x="0" y="0" width="180" height="44" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1" />
        <text x="90" y="18" font-size="9" font-family="'Times New Roman', serif" font-style="italic" fill="#111827" text-anchor="middle">Attn = Softmax( Q_t · K_pastᵀ / √d_k )</text>
        <text x="90" y="34" font-size="8" fill="#4B5563" text-anchor="middle">Attends over all 1..t cached tokens</text>
      </g>

      <!-- Arrow -->
      <path d="M296 30 H312" stroke="#C85A17" stroke-width="1.2" marker-end="url(#arrowOrange)" />

      <!-- Value Multiply & Output -->
      <g transform="translate(318, 14)">
        <rect x="0" y="0" width="124" height="32" rx="2" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.2" />
        <text x="62" y="15" font-size="8.5" font-weight="700" fill="#9A3412" text-anchor="middle">Output = Attn · V_past</text>
        <text x="62" y="26" font-size="7.5" fill="#C85A17" text-anchor="middle">[1, 1, d_k] Single Step</text>
      </g>

      <text x="12" y="64" font-size="8.5" fill="#4B5563">O(1) Step Cost: Single vector-matrix multiply per decode token instead of full M × N projection.</text>
    </g>

    <!-- Invariant text -->
    <g transform="translate(16, 230)">
      <text x="0" y="12" font-size="9" font-weight="700" fill="#111827">• Static Memory Pre-Allocation: <tspan font-weight="400" fill="#4B5563">Buffers allocated once before decoding loop starts.</tspan></text>
      <text x="0" y="26" font-size="9" font-weight="700" fill="#111827">• Zero Recomputation: <tspan font-weight="400" fill="#4B5563">Past token keys and values are mathematically invariant.</tspan></text>
      <text x="0" y="40" font-size="9" font-weight="700" fill="#111827">• Dynamic Masking: <tspan font-weight="400" fill="#4B5563">Causal mask automatically handled by slicing active 1..t length.</tspan></text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: PAGEDATTENTION & FOOTPRINT ==================== -->
  <g transform="translate(545, 106)">
    <rect x="0" y="0" width="295" height="282" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.2" />
    
    <!-- Section Header -->
    <rect x="0" y="0" width="295" height="28" fill="#F9FAFB" />
    <line x1="0" y1="28" x2="295" y2="28" stroke="#E5E7EB" stroke-width="1.2" />
    <text x="14" y="19" font-size="12" font-weight="700" fill="#111827">PagedAttention &amp; Memory Table</text>

    <!-- Page Table Mapping Diagram -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="267" height="98" rx="3" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#111827">Virtual Logical Blocks → Physical Pages:</text>
      
      <g transform="translate(10, 24)" font-size="8.5">
        <!-- Row 0 -->
        <rect x="0" y="2" width="135" height="18" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
        <text x="8" y="14" font-weight="700" fill="#111827">Block 0 (Tokens 1..16)</text>
        <path d="M140 11 H156" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
        <rect x="162" y="2" width="85" height="18" rx="2" fill="#111827" />
        <text x="204" y="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Page #41</text>

        <!-- Row 1 -->
        <rect x="0" y="24" width="135" height="18" rx="2" fill="#FFFFFF" stroke="#D1D5DB" />
        <text x="8" y="36" font-weight="700" fill="#111827">Block 1 (Tokens 17..32)</text>
        <path d="M140 33 H156" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)" />
        <rect x="162" y="24" width="85" height="18" rx="2" fill="#111827" />
        <text x="204" y="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">Page #88</text>

        <!-- Row 2 Active -->
        <rect x="0" y="46" width="135" height="18" rx="2" fill="#FFF7ED" stroke="#C85A17" />
        <text x="8" y="58" font-weight="700" fill="#C85A17">Block 2 (Tokens 33..48)</text>
        <path d="M140 55 H156" stroke="#C85A17" stroke-width="1.2" marker-end="url(#arrowOrange)" />
        <rect x="162" y="46" width="85" height="18" rx="2" fill="#C85A17" />
        <text x="204" y="58" font-weight="700" fill="#FFFFFF" text-anchor="middle">Page #12 [Active]</text>
      </g>
    </g>

    <!-- Footprint Formula & Stats -->
    <g transform="translate(14, 146)">
      <rect x="0" y="0" width="267" height="124" rx="3" fill="#FFF7ED" stroke="#C85A17" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#9A3412">KV Cache VRAM Footprint:</text>
      <text x="10" y="32" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#111827">Bytes = 2 × L × H × S × d_k × sizeof(dtype)</text>
      
      <line x1="10" y1="42" x2="257" y2="42" stroke="#E5E7EB" stroke-width="1" />
      <text x="10" y="56" font-size="8" font-weight="700" fill="#111827">Llama-3 (32 Layers, 32 Heads, d_k=128, FP16):</text>
      <text x="10" y="70" font-size="8" fill="#4B5563">• Per-Token KV Memory = 524 KB</text>
      <text x="10" y="84" font-size="8" fill="#4B5563">• 4,096 Context Length = 2.1 GB / sequence</text>
      <text x="10" y="98" font-size="8" font-weight="700" fill="#C85A17">• Batch size 16 = 33.6 GB static KV VRAM</text>
      <text x="10" y="114" font-size="8" font-weight="700" fill="#111827">PagedAttention cuts memory fragmentation to &lt;4%.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SYSTEMS INSIGHT ==================== -->
  <g transform="translate(40, 404)">
    <text x="0" y="0" font-size="10.5" fill="#4B5563">
      <tspan font-weight="700" fill="#111827">Key Insight:</tspan> Past Key/Value vector projections are mathematically immutable and never change during autoregressive decoding.
      <tspan x="0" dy="16">Pre-allocated static ring buffers eliminate quadratic recomputation, turning generative decoding from compute-bound O(S²) into memory-streamed O(1).</tspan>
    </text>
  </g>
</svg>
