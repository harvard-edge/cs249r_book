<svg xmlns="http://www.w3.org/2000/svg" width="220" height="196" viewBox="0 0 220 196" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="196" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="186" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">REGEX BOUNDARY ISOLATION</text>

  <!-- Input String Box -->
  <rect x="12" y="29" width="196" height="23" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="18" y="44" font-size="6.5" font-weight="bold" fill="#64748b">INPUT:</text>
  <text x="48" y="44" font-family="monospace" font-size="7.5" font-weight="bold" fill="#1e293b">"Hello, world!  42"</text>

  <!-- Arrow down -->
  <path d="M 110 52 L 110 58" stroke="#2563eb" stroke-width="1"/>
  <polygon points="108,57 110,60 112,57" fill="#2563eb"/>

  <!-- Regex Pre-tokenization Chunks -->
  <g transform="translate(12, 60)">
    <rect x="0" y="0" width="196" height="58" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="15" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="8" y="11" font-size="6.8" font-weight="bold" fill="#1e40af">REGEX PRE-TOKENIZATION SPLIT</text>
    <text x="188" y="11" text-anchor="end" font-family="monospace" font-size="6.0" fill="#2563eb">GPT-2 pattern</text>

    <!-- Chunk items -->
    <rect x="6" y="20" width="36" height="18" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="24" y="32" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#1e40af">Hello</text>

    <line x1="45" y1="18" x2="45" y2="40" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="2 1"/>

    <rect x="48" y="20" width="16" height="18" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="56" y="32" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#c85a17">,</text>

    <line x1="67" y1="18" x2="67" y2="40" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="2 1"/>

    <rect x="70" y="20" width="44" height="18" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="92" y="32" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#1e40af">Ġworld</text>

    <line x1="117" y1="18" x2="117" y2="40" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="2 1"/>

    <rect x="120" y="20" width="16" height="18" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="128" y="32" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#c85a17">!</text>

    <line x1="139" y1="18" x2="139" y2="40" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="2 1"/>

    <rect x="142" y="20" width="48" height="18" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="166" y="32" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#1e40af">ĠĠ42</text>

    <text x="98" y="50.5" text-anchor="middle" font-size="6.2" font-style="italic" fill="#1e40af">BPE merges execute strictly inside each chunk</text>
  </g>

  <!-- Arrow down -->
  <path d="M 110 119 L 110 125" stroke="#9ca3af" stroke-width="1"/>
  <polygon points="108,124 110,127 112,124" fill="#9ca3af"/>

  <!-- Isolation Benefits -->
  <g transform="translate(12, 127)">
    <rect x="0" y="0" width="196" height="51" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="15" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="8" y="11" font-size="6.8" font-weight="bold" fill="#334155">ISOLATION BENEFITS</text>

    <circle cx="12" cy="23" r="2.2" fill="#ef4444"/>
    <text x="18" y="25.5" font-size="6.2" fill="#334155"><tspan font-weight="bold">No cross-boundary merges:</tspan> Prevents ",world"</text>

    <circle cx="12" cy="33" r="2.2" fill="#0d9488"/>
    <text x="18" y="35.5" font-size="6.2" fill="#334155"><tspan font-weight="bold">Punctuation reuse:</tspan> Keeps "," and "!" reusable</text>

    <circle cx="12" cy="43" r="2.2" fill="#2563eb"/>
    <text x="18" y="45.5" font-size="6.2" fill="#334155"><tspan font-weight="bold">Structure fidelity:</tspan> Preserves indentation spaces</text>
  </g>

  <!-- Invariant summary line -->
  <rect x="12" y="181" width="196" height="10" rx="1" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.6"/>
  <text x="110" y="188.5" text-anchor="middle" font-size="5.8" font-weight="bold" fill="#c85a17">Rule: BPE never merges across regex boundaries</text>
</svg>
