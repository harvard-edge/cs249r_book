<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
