<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
<rect width="220" height="130" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="120" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.2" font-weight="700" fill="#1f2937">LINEAR COLLAPSE: N LAYERS → 1</text>

  <g transform="translate(12, 30)">
    <!-- Top row: Two distinct linear layers -->
    <!-- Layer 1 -->
    <rect x="0" y="0" width="85" height="28" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="42.5" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#1f2937">Layer 1 (Linear)</text>
    <text x="42.5" y="22" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#2563eb">h = x W₁ + b₁</text>

    <!-- Arrow between layers -->
    <line x1="88" y1="14" x2="104" y2="14" stroke="#9ca3af" stroke-width="1.2"/>
    <polygon points="104,11 108,14 104,17" fill="#9ca3af"/>

    <!-- Layer 2 -->
    <rect x="111" y="0" width="85" height="28" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="153.5" y="12" text-anchor="middle" font-size="7" font-weight="700" fill="#1f2937">Layer 2 (Linear)</text>
    <text x="153.5" y="22" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#2563eb">y = h W₂ + b₂</text>

    <!-- Middle: Collapse indicator -->
    <line x1="98" y1="31" x2="98" y2="42" stroke="#ff8246" stroke-width="1.5"/>
    <polygon points="95,42 98,46 101,42" fill="#ff8246"/>
    <text x="105" y="41" font-size="6.5" font-weight="700" fill="#c85a17">Associative Collapse</text>

    <!-- Bottom row: Single equivalent layer -->
    <rect x="0" y="49" width="196" height="30" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
    <text x="10" y="62" font-size="7" font-weight="700" fill="#c85a17">Equivalent Single Layer:</text>
    <text x="106" y="62" font-size="6.8" font-family="monospace" font-weight="bold" fill="#1f2937">y = x W_eff + b_eff</text>
    <text x="10" y="73" font-size="6.2" font-family="monospace" fill="#475569">W_eff = W₁·W₂ ,  b_eff = b₁·W₂ + b₂</text>

    <!-- Footer takeaway -->
    <text x="98" y="90" text-anchor="middle" font-size="6.3" font-style="italic" fill="#64748b">No activation = 100 layers collapse to 1 hyperplane</text>
  </g>
</svg>
