<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="175" viewBox="0 0 220 175" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="175" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="165" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">CSR SPARSITY OVERHEAD TRAP</text>

  
  <text x="14" y="34" font-size="6.8" font-weight="700" fill="#4b5563">Storage Footprint: Dense INT8 vs 50% CSR</text>

  
  <g transform="translate(14, 40)">
    <text x="0" y="7" font-size="6.2" font-weight="700" fill="#1e40af">DENSE INT8 (2,442 BYTES)</text>
    <rect x="0" y="11" width="168" height="14" rx="1.5" fill="#eff6ff" stroke="#2563eb" stroke-width="0.8"/>
    <text x="84" y="21" text-anchor="middle" font-size="5.8" font-family="monospace" fill="#1e40af">2,410 B code values (1 B/weight)</text>
    <rect x="170" y="11" width="22" height="14" rx="1.5" fill="#e2e8f0" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="181" y="21" text-anchor="middle" font-size="5.0" font-family="monospace" fill="#475569">32 B</text>
  </g>

  
  <g transform="translate(14, 72)">
    <text x="0" y="7" font-size="6.2" font-weight="700" fill="#c85a17">50% PRUNED CSR (2,638 BYTES, +8% LARGER)</text>
    
    <rect x="0" y="11" width="83" height="14" rx="1.5" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8"/>
    <text x="41.5" y="21" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#c85a17">Vals: 1,184 B</text>
    
    <rect x="85" y="11" width="83" height="14" rx="1.5" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="126.5" y="21" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#b45309">Col Idx: 1,184 B</text>
    
    <rect x="170" y="11" width="22" height="14" rx="1.5" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="181" y="21" text-anchor="middle" font-size="4.8" font-family="monospace" fill="#b91c1c">270 B</text>
  </g>

  
  <g transform="translate(14, 104)">
    <rect x="0" y="0" width="192" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="6" y="10" font-size="5.8" font-family="monospace" fill="#1f2937">Dense INT8: 1 byte per weight</text>
    <text x="6" y="19" font-size="5.8" font-family="monospace" fill="#b45309">CSR Nonzero: 1 B val + 1 B col_idx = 2 B</text>
    <text x="6" y="28" font-size="5.8" font-family="monospace" fill="#475569">50% sparsity: 1,184 x 2 B = 2,368 B + ptrs</text>
    <text x="6" y="37" font-size="5.8" font-family="monospace" font-weight="bold" fill="#0d9488">Break-even threshold requires &gt; 54% sparsity</text>
  </g>

  
  <rect x="14" y="152" width="192" height="13" rx="1.5" fill="#fef2f2" stroke="#ef4444" stroke-width="0.6"/>
  <text x="110" y="161" text-anchor="middle" font-size="5.7" font-family="monospace" font-weight="bold" fill="#b91c1c">Index tax negates savings for 8-bit weights</text>
</svg>
