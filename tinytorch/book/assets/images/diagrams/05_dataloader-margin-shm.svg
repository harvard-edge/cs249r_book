<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="200" viewBox="0 0 220 200" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="200" fill="#ffffff"/>
  <!-- Outer Card -->
  <rect x="5" y="5" width="210" height="190" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Header Banner -->
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.0" font-weight="700" fill="#1f2937">MULTI-WORKER IPC: /DEV/SHM</text>
  <text x="205" y="19" text-anchor="end" font-size="6.2" font-family="monospace" fill="#64748b">IPC</text>

  <!-- Section 1: Standard IPC Pipe -->
  <text x="12" y="37" font-size="7" font-weight="700" fill="#991b1b">1. Pickling Queue (Serialized Pipe)</text>

  <g transform="translate(12, 42)">
    <rect x="0" y="0" width="196" height="48" rx="1.5" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>

    <!-- Worker Box -->
    <rect x="5" y="5" width="52" height="22" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="31" y="14" text-anchor="middle" font-size="6" font-weight="bold" fill="#991b1b">Worker</text>
    <text x="31" y="22" text-anchor="middle" font-size="5" font-family="monospace" fill="#7f1d1d">dumps()</text>

    <!-- Pipe Middle -->
    <path d="M 59 16 L 73 16" stroke="#ef4444" stroke-width="1"/>
    <polygon points="71,14 74,16 71,18" fill="#ef4444"/>

    <rect x="76" y="5" width="44" height="22" rx="1" fill="#fee2e2" stroke="#f87171" stroke-width="0.8"/>
    <text x="98" y="14" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#991b1b">OS Pipe</text>
    <text x="98" y="22" text-anchor="middle" font-size="5" fill="#7f1d1d">Kernel Copy</text>

    <path d="M 122 16 L 136 16" stroke="#ef4444" stroke-width="1"/>
    <polygon points="134,14 137,16 134,18" fill="#ef4444"/>

    <!-- Main Process Box -->
    <rect x="139" y="5" width="52" height="22" rx="1" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="165" y="14" text-anchor="middle" font-size="6" font-weight="bold" fill="#991b1b">Main Proc</text>
    <text x="165" y="22" text-anchor="middle" font-size="5" font-family="monospace" fill="#7f1d1d">loads()</text>

    <text x="98" y="39" text-anchor="middle" font-size="6" font-weight="bold" fill="#b91c1c">Redundant byte copies thrash memory bus</text>
  </g>

  <!-- Section 2: POSIX Shared Memory -->
  <text x="12" y="104" font-size="7" font-weight="700" fill="#0f766e">2. POSIX Shared Memory (/dev/shm)</text>

  <g transform="translate(12, 109)">
    <rect x="0" y="0" width="196" height="54" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>

    <!-- Shared Memory Pool -->
    <rect x="5" y="5" width="186" height="18" rx="1" fill="#ccfbf1" stroke="#0d9488" stroke-width="0.8"/>
    <text x="98" y="16.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#115e59">Shared RAM Pages: /dev/shm (Single Batch Buffer)</text>

    <!-- Pointers from Worker and Main -->
    <text x="25" y="34" text-anchor="middle" font-size="6" font-weight="bold" fill="#0f766e">Worker Proc</text>
    <text x="25" y="42" text-anchor="middle" font-size="5" fill="#134e4a">writes buffer</text>

    <path d="M 52 35 L 75 35" stroke="#0d9488" stroke-width="1"/>
    <polygon points="73,33 76,35 73,37" fill="#0d9488"/>

    <!-- FD handle token -->
    <rect x="78" y="28" width="40" height="15" rx="1" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
    <text x="98" y="38" text-anchor="middle" font-size="5.5" font-family="monospace" font-weight="bold" fill="#0f766e">FD handle</text>

    <path d="M 120 35 L 143 35" stroke="#0d9488" stroke-width="1"/>
    <polygon points="141,33 144,35 141,37" fill="#0d9488"/>

    <text x="171" y="34" text-anchor="middle" font-size="6" font-weight="bold" fill="#0f766e">Main Proc</text>
    <text x="171" y="42" text-anchor="middle" font-size="5" fill="#134e4a">mmap zero-copy</text>

    <text x="98" y="50" text-anchor="middle" font-size="5.5" font-style="italic" fill="#134e4a">IPC transmits tiny handle; memory pages are mapped zero-copy</text>
  </g>

  <!-- Section 3: Invariant Banner -->
  <rect x="12" y="171" width="196" height="18" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="182.5" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#115e59">Zero-copy IPC: eliminates serialization bottlenecks</text>
</svg>
