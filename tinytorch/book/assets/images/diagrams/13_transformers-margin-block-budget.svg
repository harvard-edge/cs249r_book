<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="165" viewBox="0 0 220 165" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="165" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="155" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">BLOCK PARAMETER BUDGET (12D²)</text>

  <g transform="translate(0, 0)">
    <rect x="13" y="32" width="64" height="24" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="45" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1e40af">Attention (1/3)</text>
    <text x="45" y="52" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#2563eb">4D² weights</text>

    <rect x="79" y="32" width="128" height="24" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="143" y="43" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c85a17">Feed-Forward MLP (2/3)</text>
    <text x="143" y="52" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#c85a17">8D² weights</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="13" y="62" width="94" height="56" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="18" y="73" font-size="6.2" font-weight="700" fill="#1e40af">Token Communication</text>
    <text x="18" y="83" font-size="5.8" fill="#1f2937">W_q, W_k, W_v: 3D²</text>
    <text x="18" y="93" font-size="5.8" fill="#1f2937">W_o (out proj): D²</text>
    <text x="18" y="103" font-size="5.8" fill="#6b7280">Biases: 4D</text>
    <text x="18" y="113" font-size="5.8" font-weight="700" fill="#2563eb">Spatial mixing (S)</text>

    <rect x="113" y="62" width="94" height="56" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="118" y="73" font-size="6.2" font-weight="700" fill="#c85a17">Channel Transformation</text>
    <text x="118" y="83" font-size="5.8" fill="#1f2937">W₁ (D → 4D): 4D²</text>
    <text x="118" y="93" font-size="5.8" fill="#1f2937">W₂ (4D → D): 4D²</text>
    <text x="118" y="103" font-size="5.8" fill="#6b7280">Biases: 5D (4D + D)</text>
    <text x="118" y="113" font-size="5.8" font-weight="700" fill="#c85a17">Channel mixing (D)</text>
  </g>

  <g transform="translate(0, 0)">
    <rect x="13" y="124" width="194" height="33" rx="1" fill="#f1f5f9" stroke="#9ca3af" stroke-width="0.8"/>
    <text x="20" y="134" font-size="6.2" font-weight="700" fill="#1f2937">Block Total: 12D² + 13D parameters</text>
    <text x="20" y="144" font-size="5.6" fill="#6b7280">Matrix: 12D² | Biases: 9D | LayerNorm: 4D</text>
    <text x="20" y="153" font-size="5.6" fill="#1f2937">For S ≪ D, MLP accounts for ~67% of block FLOPs.</text>
  </g>
</svg>
