<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="205" viewBox="0 0 220 205" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  
  <rect width="220" height="205" fill="#ffffff"/>

  
  <rect x="5" y="5" width="210" height="195" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">ROUNDING VS CLIPPING ERROR</text>
  <text x="205" y="19" text-anchor="end" font-size="7" font-family="monospace" fill="#64748b">RANGE</text>

  
  <g transform="translate(14, 29)">
    
    <rect x="0" y="0" width="38" height="22" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="19" y="9" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#c85a17">Clip Zone</text>
    <text x="19" y="17" text-anchor="middle" font-size="5.0" font-family="monospace" fill="#9a3412">q = -128</text>

    
    <rect x="40" y="0" width="112" height="22" rx="1" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="96" y="9" text-anchor="middle" font-size="5.8" font-weight="bold" fill="#0f766e">In-Range Grid: 256 Bins</text>
    <text x="96" y="17" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#115e59">Dynamic Range = 255 × S</text>

    
    <rect x="154" y="0" width="38" height="22" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="173" y="9" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#c85a17">Clip Zone</text>
    <text x="173" y="17" text-anchor="middle" font-size="5.0" font-family="monospace" fill="#9a3412">q = 127</text>

    
    <text x="40" y="30" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#64748b">x_min</text>
    <text x="96" y="30" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#0d9488">0.0 (Z)</text>
    <text x="152" y="30" text-anchor="middle" font-size="5.2" font-family="monospace" fill="#64748b">x_max</text>
  </g>

  
  <g transform="translate(14, 67)">
    <rect x="0" y="0" width="192" height="34" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <text x="8" y="10.5" font-size="6.5" font-weight="bold" fill="#115e59">1. In-Range Rounding Noise</text>
    <text x="8" y="20.5" font-size="5.8" font-family="monospace" fill="#0f766e">|x - x_rec| ≤ S / 2 (bounded)</text>
    <text x="8" y="28.5" font-size="5.3" fill="#134e4a">Uniform discretization error; scales directly with S</text>
  </g>

  
  <g transform="translate(14, 106)">
    <rect x="0" y="0" width="192" height="34" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="8" y="10.5" font-size="6.5" font-weight="bold" fill="#c85a17">2. Out-of-Range Saturation Error</text>
    <text x="8" y="20.5" font-size="5.8" font-family="monospace" fill="#9a3412">|x - x_bound| &gt;&gt; S / 2 (unbounded)</text>
    <text x="8" y="28.5" font-size="5.3" fill="#7c2d12">Clamped to boundary; truncates distribution tails</text>
  </g>

  
  <g transform="translate(14, 145)">
    <rect x="0" y="0" width="192" height="49" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="8" y="10" font-size="6.2" font-weight="bold" fill="#1f2937">The Calibration Dilemma:</text>
    <text x="8" y="20" font-size="5.4" fill="#475569">• Wider range: prevents clipping, but inflates S</text>
    <text x="8" y="29" font-size="5.4" fill="#475569">• Narrow range: minimizes S, but clips activations</text>
    <line x1="8" y1="35" x2="184" y2="35" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="8" y="43.5" font-size="5.2" font-style="italic" fill="#64748b">Optimal clipping balances rounding vs saturation</text>
  </g>
</svg>
