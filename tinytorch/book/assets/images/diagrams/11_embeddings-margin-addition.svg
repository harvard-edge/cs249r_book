<svg xmlns="http://www.w3.org/2000/svg" width="220" height="165" viewBox="0 0 220 165" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="165" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="155" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">POSITION: ADD VS CONCAT</text>

  <!-- Elementwise Addition -->
  <rect x="12" y="30" width="196" height="48" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="18" y="41" font-size="7" font-weight="700" fill="#c85a17">Elementwise Addition: x = w + p</text>
  <text x="18" y="52" font-size="6.2" font-family="'DejaVu Sans Mono', monospace" font-weight="bold" fill="#c85a17">Vector width: D (channel dimension fixed)</text>
  <text x="18" y="63" font-size="6.0" fill="#1f2937">Attention weights W_Q, W_K, W_V remain D &#215; D</text>
  <text x="18" y="73" font-size="5.8" fill="#475569">Nearly orthogonal subspaces in high dimensions</text>

  <!-- Feature Concatenation -->
  <rect x="12" y="84" width="196" height="48" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="18" y="95" font-size="7" font-weight="700" fill="#475569">Feature Concatenation: x = [w ; p]</text>
  <text x="18" y="106" font-size="6.2" font-family="'DejaVu Sans Mono', monospace" fill="#1e293b">Vector width: 2D (doubles representation width)</text>
  <text x="18" y="117" font-size="6.0" fill="#64748b">Attention projections expand to 2D &#215; D (2&#215; weights)</text>
  <text x="18" y="127" font-size="5.8" fill="#64748b">Self-attention projection FLOPs scale up to 4&#215;</text>

  <!-- Bottom Takeaway Badge -->
  <rect x="12" y="138" width="196" height="15" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
  <text x="110" y="148.5" text-anchor="middle" font-size="6" font-weight="700" fill="#0d9488">Addition preserves parameter and compute budget</text>
</svg>
