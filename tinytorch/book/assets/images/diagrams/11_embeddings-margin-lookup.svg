<svg xmlns="http://www.w3.org/2000/svg" width="220" height="155" viewBox="0 0 220 155" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="155" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="145" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">LOOKUP: GATHER VS ONE-HOT</text>

  <!-- Naive One-Hot Multiply -->
  <rect x="12" y="31" width="196" height="44" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="18" y="42" font-size="7" font-weight="700" fill="#475569">Naive One-Hot GEMM (X &#183; W)</text>
  <text x="18" y="54" font-size="6.3" font-family="'DejaVu Sans Mono', monospace" fill="#1e293b">Input: 1024 &#215; 50,257 (206 MB float32)</text>
  <text x="18" y="66" font-size="6.2" fill="#64748b">39B FLOPs: 99.998% wasted on zeros</text>

  <!-- Direct Table Gather -->
  <rect x="12" y="81" width="196" height="44" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
  <text x="18" y="92" font-size="7" font-weight="700" fill="#c85a17">Direct Table Gather: W[idx, :]</text>
  <text x="18" y="104" font-size="6.3" font-family="'DejaVu Sans Mono', monospace" font-weight="bold" fill="#c85a17">Payload: 1024 &#215; 768 (3.1 MB float32)</text>
  <text x="18" y="116" font-size="6.2" fill="#1f2937">0 FLOPs: physical DRAM pointer stride</text>

  <!-- Bottom Takeaway Badge -->
  <rect x="12" y="131" width="196" height="14" rx="1.5" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.8"/>
  <text x="110" y="140.5" text-anchor="middle" font-size="6" font-weight="700" fill="#0d9488">Bandwidth bound: 66&#215; less traffic, zero arithmetic</text>
</svg>
