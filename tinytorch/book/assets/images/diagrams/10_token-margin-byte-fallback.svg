<svg xmlns="http://www.w3.org/2000/svg" width="220" height="196" viewBox="0 0 220 196" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="196" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="186" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">BYTE-LEVEL ZERO-OOV FALLBACK</text>

  <!-- Character-Level BPE (TinyTorch) -->
  <g transform="translate(12, 30)">
    <rect x="0" y="0" width="196" height="66" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="16" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="8" y="11" font-size="6.8" font-weight="bold" fill="#475569">CHARACTER BPE (TINYTORCH)</text>

    <!-- Flow row -->
    <rect x="8" y="21" width="32" height="18" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="24" y="33" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#0f172a">'ï'</text>

    <path d="M 44 30 L 56 30" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="54,28 58,30 54,32" fill="#94a3b8"/>

    <rect x="60" y="21" width="70" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="95" y="32" text-anchor="middle" font-size="6.2" fill="#64748b">Absent from vocab</text>

    <path d="M 134 30 L 146 30" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="144,28 148,30 144,32" fill="#94a3b8"/>

    <rect x="150" y="21" width="38" height="18" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1"/>
    <text x="169" y="33" text-anchor="middle" font-family="monospace" font-size="6.8" font-weight="bold" fill="#c85a17">&lt;UNK&gt;</text>

    <!-- Explanation footer -->
    <rect x="8" y="44" width="180" height="16" rx="1.5" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.6"/>
    <text x="98" y="55" text-anchor="middle" font-size="6.0" font-weight="bold" fill="#c2410c">Irreversible: ID 0 destroys character identity</text>
  </g>

  <!-- Byte-Level BPE (GPT-2, LLaMA) -->
  <g transform="translate(12, 102)">
    <rect x="0" y="0" width="196" height="74" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="16" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="0.8"/>
    <text x="8" y="11" font-size="6.8" font-weight="bold" fill="#0f766e">BYTE-LEVEL BPE (GPT-2, LLAMA)</text>

    <!-- Flow row -->
    <rect x="8" y="21" width="32" height="18" rx="2" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
    <text x="24" y="33" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#0f172a">'ï'</text>

    <path d="M 44 30 L 52 30" stroke="#0d9488" stroke-width="1"/>
    <polygon points="50,28 54,30 50,32" fill="#0d9488"/>

    <rect x="56" y="21" width="74" height="18" rx="2" fill="#ffffff" stroke="#0d9488" stroke-width="0.8"/>
    <text x="93" y="29" text-anchor="middle" font-family="monospace" font-size="6.2" font-weight="bold" fill="#0f766e">0xC3 0xAF</text>
    <text x="93" y="36.5" text-anchor="middle" font-size="5.5" fill="#64748b">Raw UTF-8 bytes</text>

    <path d="M 134 30 L 142 30" stroke="#0d9488" stroke-width="1"/>
    <polygon points="140,28 144,30 140,32" fill="#0d9488"/>

    <rect x="146" y="21" width="42" height="18" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
    <text x="167" y="33" text-anchor="middle" font-family="monospace" font-size="6.0" font-weight="bold" fill="#0f766e">[195, 175]</text>

    <!-- Explanation footer -->
    <rect x="8" y="44" width="180" height="24" rx="1.5" fill="#ffffff" stroke="#99f6e4" stroke-width="0.8"/>
    <text x="98" y="54" text-anchor="middle" font-size="6.0" font-weight="bold" fill="#0f766e">100% Lossless: Zero UNK tokens needed</text>
    <text x="98" y="63" text-anchor="middle" font-size="5.5" fill="#115e59">Base alphabet seeds all 256 byte values</text>
  </g>

  <!-- Invariant summary line -->
  <rect x="12" y="181" width="196" height="10" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="110" y="188.5" text-anchor="middle" font-size="5.8" font-weight="600" fill="#475569">UTF-8 bytes guarantee universal fallback coverage</text>
</svg>
