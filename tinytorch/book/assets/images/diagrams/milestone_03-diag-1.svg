<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="280" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111827"/></marker></defs>
<rect x="30" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="120.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Accuracy retention</text>
<text x="120.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">R = candidate accuracy</text>
<text x="120.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">÷ baseline accuracy</text>
<rect x="250" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="340.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Stored-size ratio</text>
<text x="340.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">C = baseline bytes</text>
<text x="340.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">÷ candidate bytes</text>
<rect x="470" y="30" width="180" height="90" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="560.0" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Speedup</text>
<text x="560.0" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">S = baseline time</text>
<text x="560.0" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">÷ candidate time</text>
<rect x="30" y="180" width="290" height="70" rx="2" fill="#fff1e8" stroke="#ff8246" stroke-width="1.2"/>
<text x="175.0" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">MLPerf-style scorecard gate</text>
<text x="175.0" y="225" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Require R ≥ 0.99 before comparing C and S</text>
<rect x="360" y="180" width="290" height="70" rx="2" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
<text x="505.0" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Classroom benchmark discipline</text>
<text x="505.0" y="225" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Report measured values and event policy</text>
<text x="505.0" y="242" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Inspired by MLPerf Inference rules</text>
</svg>
