<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="193" viewBox="0 0 220 193" font-family="'TeX Gyre Heros', 'Helvetica Neue', Arial, sans-serif">
  <rect width="220" height="193" fill="#ffffff"/>
  <rect x="5" y="5" width="210" height="183" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="5" y="5" width="210" height="20" rx="2" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1f2937">MLPERF INFERENCE SCENARIOS</text>

  
  <text x="14" y="34" font-size="6.8" font-weight="700" fill="#4b5563">Workload Regimes &amp; Primary Metrics</text>

  
  <g transform="translate(14, 39)">
    <rect x="0" y="0" width="192" height="23" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="4" y="3.5" width="56" height="16" rx="1" fill="#eff6ff" stroke="#2563eb" stroke-width="0.7"/>
    <text x="32" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#1e40af">Single-Stream</text>
    <text x="65" y="9" font-size="5.5" font-family="monospace" fill="#1f2937">Serial query (Q = 1)</text>
    <text x="65" y="18" font-size="5.3" font-family="monospace" fill="#2563eb">Metric: p90 latency (ms)</text>
  </g>

  
  <g transform="translate(14, 65)">
    <rect x="0" y="0" width="192" height="23" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="4" y="3.5" width="56" height="16" rx="1" fill="#fff1e8" stroke="#ff8246" stroke-width="0.7"/>
    <text x="32" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#c85a17">Server</text>
    <text x="65" y="9" font-size="5.5" font-family="monospace" fill="#1f2937">Poisson arrival queue</text>
    <text x="65" y="18" font-size="5.3" font-family="monospace" fill="#c85a17">Metric: Max QPS @ p99 SLA</text>
  </g>

  
  <g transform="translate(14, 91)">
    <rect x="0" y="0" width="192" height="23" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="4" y="3.5" width="56" height="16" rx="1" fill="#f0fdfa" stroke="#0d9488" stroke-width="0.7"/>
    <text x="32" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#0f766e">Offline</text>
    <text x="65" y="9" font-size="5.5" font-family="monospace" fill="#1f2937">Batch resident in memory</text>
    <text x="65" y="18" font-size="5.3" font-family="monospace" fill="#0d9488">Metric: Peak samples / sec</text>
  </g>

  
  <g transform="translate(14, 117)">
    <rect x="0" y="0" width="192" height="23" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="4" y="3.5" width="56" height="16" rx="1" fill="#f1f5f9" stroke="#64748b" stroke-width="0.7"/>
    <text x="32" y="14" text-anchor="middle" font-size="5.8" font-weight="700" fill="#334155">Multi-Stream</text>
    <text x="65" y="9" font-size="5.5" font-family="monospace" fill="#1f2937">Periodic sensor feeds</text>
    <text x="65" y="18" font-size="5.3" font-family="monospace" fill="#475569">Metric: Max stream count</text>
  </g>

  
  <g transform="translate(14, 145)">
    <rect x="0" y="0" width="192" height="34" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="96" y="11" text-anchor="middle" font-size="6.3" font-family="monospace" font-weight="bold" fill="#b91c1c">ACCURACY RETENTION FLOOR (R &gt;= 0.99)</text>
    <text x="96" y="21" text-anchor="middle" font-size="5.4" fill="#7f1d1d">Candidate accuracy must clear 99% of baseline</text>
    <text x="96" y="29" text-anchor="middle" font-size="5.4" fill="#7f1d1d">Disqualified if floor breached regardless of speed</text>
  </g>
</svg>
