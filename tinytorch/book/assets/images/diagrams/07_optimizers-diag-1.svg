<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 495" width="100%" height="100%" style="background:#FFFFFF; font-family:'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp technical arrowheads -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111827" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C85A17" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>

    <!-- Clip path to keep contour plots strictly within bounds -->
    <clipPath id="plotClip">
      <rect x="0" y="0" width="250" height="150" />
    </clipPath>
  </defs>

  <!-- Title & Section Header -->
  <text x="30" y="28" font-size="14.5" font-weight="700" fill="#111827" letter-spacing="0.2">Optimization Dynamics on Ill-Conditioned Ravines (κ = λ_max / λ_min ≫ 1)</text>
  <line x1="30" y1="38" x2="910" y2="38" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- ==================== TOP: THREE OPTIMIZATION LANDSCAPES ==================== -->

  <!-- PANEL 1: Vanilla SGD -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="280" height="305" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="280" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="140" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">1. Vanilla SGD (No Inertia)</text>

    <!-- Contour Plot Container -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="250" height="150" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8" />
      
      <!-- Clipped Contours -->
      <g clip-path="url(#plotClip)">
        <!-- Coordinate Axes -->
        <line x1="10" y1="75" x2="240" y2="75" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2,2" />
        <line x1="180" y1="10" x2="180" y2="140" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2,2" />

        <!-- Ravine Contours (High curvature along theta_2) -->
        <ellipse cx="180" cy="75" rx="140" ry="55" fill="none" stroke="#E2E8F0" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="100" ry="40" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="65" ry="26" fill="none" stroke="#94A3B8" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="30" ry="12" fill="none" stroke="#64748B" stroke-width="1" />
        
        <!-- Optimum Target -->
        <circle cx="180" cy="75" r="2.5" fill="#111827" />

        <!-- SGD Zig-Zag Trajectory -->
        <path d="M 30 25 L 45 125 L 62 32 L 78 118 L 95 40 L 110 110 L 125 48 L 138 102 L 148 55 L 158 95 L 165 62 L 171 88 L 176 68" fill="none" stroke="#DC2626" stroke-width="1.4" />
        
        <!-- Start point -->
        <circle cx="30" cy="25" r="3" fill="#DC2626" />
      </g>

      <!-- Labels on top of plot -->
      <text x="30" y="18" font-size="7.5" font-family="monospace" font-weight="700" fill="#DC2626" text-anchor="middle">θ₀</text>
      <text x="238" y="70" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280" text-anchor="end">θ₁ (Flat, λ_min)</text>
      <text x="184" y="22" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280">θ₂ (Steep, λ_max)</text>
      <text x="180" y="100" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">θ* (Minimum)</text>

      <!-- Direction annotations -->
      <text x="75" y="142" font-size="7.5" font-weight="600" fill="#991B1B">Violent Cross-Ravine Oscillations</text>
    </g>

    <!-- Formula & Properties -->
    <g transform="translate(15, 194)">
      <rect x="0" y="0" width="250" height="98" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#111827">Update Equation:</text>
      <text x="10" y="32" font-size="9" font-family="'Times New Roman', serif" font-style="italic" fill="#991B1B">θ_t = θ_t₋₁ - η · g_t</text>
      
      <line x1="10" y1="40" x2="240" y2="40" stroke="#E5E7EB" stroke-width="0.8" />

      <text x="10" y="54" font-size="8" font-weight="700" fill="#475569">Systemic Failure Mode:</text>
      <text x="10" y="68" font-size="8" fill="#4B5563">• Perpendicular gradient g_⊥ dominates step.</text>
      <text x="10" y="80" font-size="8" fill="#4B5563">• Increasing η causes explosive divergence.</text>
      <text x="10" y="92" font-size="8" fill="#991B1B">• Decreasing η stalls progress along floor.</text>
    </g>
  </g>

  <!-- PANEL 2: Heavy-Ball Momentum -->
  <g transform="translate(330, 52)">
    <rect x="0" y="0" width="280" height="305" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" rx="2" />
    <rect x="0" y="0" width="280" height="24" fill="#F3F4F6" stroke="#111827" stroke-width="1.2" rx="2" />
    <text x="140" y="16" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">2. Heavy-Ball Momentum</text>

    <!-- Contour Plot Container -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="250" height="150" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8" />
      
      <!-- Clipped Contours -->
      <g clip-path="url(#plotClip)">
        <!-- Coordinate Axes -->
        <line x1="10" y1="75" x2="240" y2="75" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2,2" />
        <line x1="180" y1="10" x2="180" y2="140" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2,2" />

        <!-- Ravine Contours -->
        <ellipse cx="180" cy="75" rx="140" ry="55" fill="none" stroke="#E2E8F0" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="100" ry="40" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="65" ry="26" fill="none" stroke="#94A3B8" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="30" ry="12" fill="none" stroke="#64748B" stroke-width="1" />
        
        <!-- Optimum Target -->
        <circle cx="180" cy="75" r="2.5" fill="#111827" />

        <!-- Momentum Smooth Trajectory -->
        <path d="M 30 25 C 55 110, 75 45, 105 85 C 125 95, 150 70, 168 76 L 180 75" fill="none" stroke="#2563EB" stroke-width="1.8" />
        
        <!-- Start point -->
        <circle cx="30" cy="25" r="3" fill="#2563EB" />
      </g>

      <!-- Labels on top of plot -->
      <text x="30" y="18" font-size="7.5" font-family="monospace" font-weight="700" fill="#2563EB" text-anchor="middle">θ₀</text>
      <text x="238" y="70" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280" text-anchor="end">θ₁ (Flat, λ_min)</text>
      <text x="184" y="22" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280">θ₂ (Steep, λ_max)</text>
      <text x="180" y="100" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">θ* (Minimum)</text>

      <!-- Direction annotations -->
      <text x="80" y="142" font-size="7.5" font-weight="600" fill="#1D4ED8">Lateral Noise Dampened (EWMA)</text>
    </g>

    <!-- Formula & Properties -->
    <g transform="translate(15, 194)">
      <rect x="0" y="0" width="250" height="98" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" rx="2" />
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#111827">Update Equations (Polyak 1964):</text>
      <text x="10" y="30" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#1D4ED8">v_t = β · v_t₋₁ + g_t</text>
      <text x="10" y="44" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#1D4ED8">θ_t = θ_t₋₁ - η · v_t</text>
      
      <line x1="10" y1="50" x2="240" y2="50" stroke="#E5E7EB" stroke-width="0.8" />

      <text x="10" y="64" font-size="8" font-weight="700" fill="#475569">Dynamical System Properties:</text>
      <text x="10" y="76" font-size="8" fill="#4B5563">• Opposing lateral forces cancel (+g + -g → 0).</text>
      <text x="10" y="88" font-size="8" fill="#1D4ED8">• Valley velocity accelerates by 1 / (1 - β) ≈ 10×.</text>
    </g>
  </g>

  <!-- PANEL 3: AdamW (Decoupled Weight Decay) -->
  <g transform="translate(630, 52)">
    <rect x="0" y="0" width="280" height="305" fill="#FFF7ED" stroke="#C85A17" stroke-width="1.5" rx="2" />
    <rect x="0" y="0" width="280" height="24" fill="#FFEDD5" stroke="#C85A17" stroke-width="1.2" rx="2" />
    <text x="140" y="16" font-size="11" font-weight="700" fill="#9A3412" text-anchor="middle">3. AdamW (Adaptive + Decoupled)</text>

    <!-- Contour Plot Container -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="250" height="150" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" />
      
      <!-- Clipped Contours -->
      <g clip-path="url(#plotClip)">
        <!-- Coordinate Axes -->
        <line x1="10" y1="75" x2="240" y2="75" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2,2" />
        <line x1="180" y1="10" x2="180" y2="140" stroke="#D1D5DB" stroke-width="0.8" stroke-dasharray="2,2" />

        <!-- Ravine Contours -->
        <ellipse cx="180" cy="75" rx="140" ry="55" fill="none" stroke="#E2E8F0" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="100" ry="40" fill="none" stroke="#CBD5E1" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="65" ry="26" fill="none" stroke="#94A3B8" stroke-width="1" />
        <ellipse cx="180" cy="75" rx="30" ry="12" fill="none" stroke="#64748B" stroke-width="1" />
        
        <!-- Optimum Target -->
        <circle cx="180" cy="75" r="2.5" fill="#111827" />

        <!-- AdamW Direct Geodesic Trajectory -->
        <path d="M 30 25 Q 105 50 180 75" fill="none" stroke="#C85A17" stroke-width="2.2" />
        
        <!-- Start point -->
        <circle cx="30" cy="25" r="3" fill="#C85A17" />
      </g>

      <!-- Labels on top of plot -->
      <text x="30" y="18" font-size="7.5" font-family="monospace" font-weight="700" fill="#C85A17" text-anchor="middle">θ₀</text>
      <text x="238" y="70" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280" text-anchor="end">θ₁ (Flat, λ_min)</text>
      <text x="184" y="22" font-size="7.5" font-family="'Times New Roman', serif" font-style="italic" fill="#6B7280">θ₂ (Steep, λ_max)</text>
      <text x="180" y="100" font-size="7.5" font-family="monospace" fill="#111827" text-anchor="middle">θ* (Minimum)</text>

      <!-- Direction annotations -->
      <text x="80" y="142" font-size="7.5" font-weight="700" fill="#C85A17">Isotropic Curvature Rescaling (κ_eff ≈ 1)</text>
    </g>

    <!-- Formula & Properties -->
    <g transform="translate(15, 194)">
      <rect x="0" y="0" width="250" height="98" fill="#FFFFFF" stroke="#FDBA74" stroke-width="0.8" rx="2" />
      <text x="10" y="14" font-size="8" font-weight="700" fill="#9A3412">AdamW Update (Loshchilov &amp; Hutter 2017):</text>
      <text x="10" y="27" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#7C2D12">m_t = β₁ · m_t₋₁ + (1 - β₁) · g_t</text>
      <text x="10" y="40" font-size="8" font-family="'Times New Roman', serif" font-style="italic" fill="#7C2D12">v_t = β₂ · v_t₋₁ + (1 - β₂) · g_t²</text>
      <text x="10" y="54" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" font-weight="700" fill="#9A3412">θ_t = θ_t₋₁ - η ( m̂_t / (√v̂_t + ε) + λ · θ_t₋₁ )</text>

      <line x1="10" y1="60" x2="240" y2="60" stroke="#FED7AA" stroke-width="0.8" />

      <text x="10" y="74" font-size="8" font-weight="700" fill="#9A3412">Decoupled Weight Decay:</text>
      <text x="10" y="86" font-size="8" fill="#7C2D12">• Direct subtraction: -η λ θ_t₋₁ untouched by v_t.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: L2 REGULARIZATION VS ADAMW INVARIANT ==================== -->
  <g transform="translate(30, 372)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#E5E7EB" stroke-width="1.2" />

    <!-- Left Box: Coupled L2 Flaw -->
    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="425" height="95" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.9" rx="2" />
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#991B1B">Standard Adam + L2 Regularization (Coupled Flaw)</text>
      <text x="12" y="34" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" fill="#7F1D1D">g_t ← g_t + λ · θ_t₋₁  ⟹  v_t ← β₂ · v_t₋₁ + (1 - β₂) · (g_t + λ · θ_t₋₁)²</text>
      
      <text x="12" y="52" font-size="8" fill="#7F1D1D">
        • Adding weight decay directly to gradient mixes penalty into second moment <tspan font-family="'Times New Roman', serif" font-style="italic">v_t</tspan>.
      </text>
      <text x="12" y="66" font-size="8" fill="#7F1D1D">
        • Parameters with large historical gradients experience <tspan font-weight="700">less</tspan> weight decay (<tspan font-family="'Times New Roman', serif" font-style="italic">λθ / √v</tspan>).
      </text>
      <text x="12" y="80" font-size="8" font-weight="700" fill="#991B1B">
        • Inverts the mathematical intent of L2 weight penalty!
      </text>
    </g>

    <!-- Right Box: Decoupled AdamW Invariant -->
    <g transform="translate(455, 12)">
      <rect x="0" y="0" width="425" height="95" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" rx="2" />
      <text x="12" y="18" font-size="9.5" font-weight="700" fill="#9A3412">AdamW Decoupled Weight Decay (The True Regularizer)</text>
      <text x="12" y="34" font-size="8.5" font-family="'Times New Roman', serif" font-style="italic" font-weight="700" fill="#9A3412">θ_t ← θ_t₋₁ - η · ( m̂_t / (√v̂_t + ε) ) - η · λ · θ_t₋₁</text>
      
      <text x="12" y="52" font-size="8" fill="#7C2D12">
        • Weight decay <tspan font-family="'Times New Roman', serif" font-style="italic">-ηλθ</tspan> is applied directly to weights without entering <tspan font-family="'Times New Roman', serif" font-style="italic">v_t</tspan>.
      </text>
      <text x="12" y="66" font-size="8" fill="#7C2D12">
        • Every parameter decays at a rate strictly proportional to its magnitude <tspan font-family="'Times New Roman', serif" font-style="italic">||θ||</tspan>.
      </text>
      <text x="12" y="80" font-size="8" font-weight="700" fill="#C85A17">
        • Standard optimizer for GPT-2, LLaMA, and modern foundation models.
      </text>
    </g>
  </g>
</svg>