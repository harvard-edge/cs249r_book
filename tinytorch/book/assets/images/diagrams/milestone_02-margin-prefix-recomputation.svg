  <g transform="translate(14, 95)">
    <rect x="0" y="0" width="45" height="9" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="47" y="0" width="70" height="9" rx="1" fill="#fed7aa" stroke="#fdba74" stroke-width="0.6"/>
