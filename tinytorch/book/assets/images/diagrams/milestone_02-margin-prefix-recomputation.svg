    <rect x="47" y="0" width="6" height="9" rx="1" fill="#ff8246"/>
    <text x="58" y="7" font-size="6" font-family="monospace" fill="#1f2937">Step 1 (13 rows)</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(14, 54)">
    <rect x="0" y="0" width="45" height="9" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="47" y="0" width="4" height="9" rx="1" fill="#fed7aa" stroke="#fdba74" stroke-width="0.6"/>
    <rect x="53" y="0" width="6" height="9" rx="1" fill="#ff8246"/>
    <text x="64" y="7" font-size="6" font-family="monospace" fill="#1f2937">Step 2 (14 rows)</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(14, 66)">
    <rect x="0" y="0" width="45" height="9" rx="1" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="47" y="0" width="8" height="9" rx="1" fill="#fed7aa" stroke="#fdba74" stroke-width="0.6"/>
    <rect x="57" y="0" width="6" height="9" rx="1" fill="#ff8246"/>
    <text x="68" y="7" font-size="6" font-family="monospace" fill="#1f2937">Step 3 (15 rows)</text>
  </g>

  <!-- Continuation Dots -->
  <g transform="translate(14, 78)">
    <circle cx="22" cy="4" r="1.1" fill="#9ca3af"/>
