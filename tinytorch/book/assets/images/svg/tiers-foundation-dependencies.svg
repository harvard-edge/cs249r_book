<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="380" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker></defs>
<rect x="70" y="30" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="170.0" y="51.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">01 Tensor</text>
<text x="170.0" y="65.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Multidimensional arrays</text>
<path d="M170,80 V100" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="70" y="100" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="170.0" y="121.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">02 Activations</text>
<text x="170.0" y="135.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Nonlinear functions</text>
<path d="M170,150 V170" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="70" y="170" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="170.0" y="191.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">03 Layers</text>
<text x="170.0" y="205.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Linear transformations</text>
<path d="M170,220 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="70" y="240" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="170.0" y="261.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">04 Losses</text>
<text x="170.0" y="275.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Prediction error</text>
<rect x="410" y="30" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="510.0" y="51.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">05 DataLoader</text>
<text x="510.0" y="65.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Batches and iteration</text>
<path d="M510,80 V100" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="410" y="100" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="510.0" y="121.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">06 Autograd</text>
<text x="510.0" y="135.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Automatic differentiation</text>
<path d="M510,150 V170" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="410" y="170" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="510.0" y="191.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">07 Optimizers</text>
<text x="510.0" y="205.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Parameter updates</text>
<path d="M510,220 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="410" y="240" width="200" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="510.0" y="261.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">08 Training</text>
<text x="510.0" y="275.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Complete learning loop</text>
<path d="M270,265 H310 V15 H510 V30" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<text x="340.0" y="360" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Arrows show curriculum order; modules reuse earlier components as needed.</text>
</svg>
