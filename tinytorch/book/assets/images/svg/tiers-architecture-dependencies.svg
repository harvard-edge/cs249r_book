<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'TeX Gyre Heros', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="440" fill="#FFFFFF" />
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111827" /></marker></defs>
<rect x="190" y="20" width="300" height="60" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="340.0" y="46.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Foundation: modules 01–08</text>
<text x="340.0" y="60.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Tensor, layers, data, autograd, and training</text>
<rect x="50" y="130" width="230" height="60" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="165.0" y="156.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">09 Convolutions</text>
<text x="165.0" y="170.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Conv2d and pooling</text>
<path d="M340,80 V100 H165 V130" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="50" y="240" width="230" height="60" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="165.0" y="266.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Vision models</text>
<text x="165.0" y="280.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Spatial feature extraction</text>
<path d="M165,190 V240" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="400" y="130" width="230" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="515.0" y="151.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">10 Tokenization</text>
<text x="515.0" y="165.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Text to integer IDs</text>
<path d="M515,180 V200" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="400" y="200" width="230" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="515.0" y="221.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">11 Embeddings</text>
<text x="515.0" y="235.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">IDs to vectors</text>
<path d="M515,250 V270" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="400" y="270" width="230" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="515.0" y="291.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">12 Attention</text>
<text x="515.0" y="305.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Context-dependent representations</text>
<path d="M515,320 V340" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<rect x="400" y="340" width="230" height="50" rx="3" fill="#F9FAFB" stroke="#111827" stroke-width="1.2" />
<text x="515.0" y="361.0" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">13 Transformers</text>
<text x="515.0" y="375.0" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Attention and feed-forward blocks</text>
<path d="M340,80 V100 H515 V130" stroke="#111827" stroke-width="1.2" fill="none" marker-end="url(#arrow)" />
<text x="340.0" y="420" text-anchor="middle" font-size="9" font-weight="400" fill="#111827">Conceptual learning paths share foundation components; arrows are not an import graph.</text>
</svg>
