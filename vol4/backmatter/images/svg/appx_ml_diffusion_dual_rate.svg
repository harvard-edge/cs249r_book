<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/></marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87333"/></marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A4D3E"/></marker>
  </defs>

  <!-- ================= (a) mode averaging vs sampling ================= -->
  <g transform="translate(14,14)">
    <rect width="210" height="372" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="22" font-size="10.5" font-weight="700" fill="#1A202C">(a) Two demonstrated modes</text>

    <rect x="10" y="34" width="190" height="158" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="52" font-size="9.5" font-weight="700" fill="#4A5568">Direct regression (MSE)</text>
    <path d="M 34 118 Q 90 58 184 70" fill="none" stroke="#007A87" stroke-width="1.6" stroke-dasharray="4,3"/>
    <path d="M 34 118 Q 90 178 184 166" fill="none" stroke="#007A87" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="186" y="84" font-size="8.5" fill="#007A87" text-anchor="end">mode A</text>
    <text x="186" y="160" font-size="8.5" fill="#007A87" text-anchor="end">mode B</text>
    <circle cx="150" cy="118" r="15" fill="#FBEAEC" stroke="#A51C30" stroke-width="1.2"/>
    <text x="150" y="146" font-size="8.5" fill="#A51C30" text-anchor="middle">obstacle</text>
    <line x1="34" y1="118" x2="131" y2="118" stroke="#A51C30" stroke-width="2" marker-end="url(#arr-crimson)"/>
    <text x="78" y="111" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle">mean</text>
    <circle cx="34" cy="118" r="3.5" fill="#1A202C"/>
    <text x="34" y="134" font-size="8.5" fill="#4A5568" text-anchor="middle">s<tspan font-size="7" dy="2">t</tspan></text>

    <rect x="10" y="202" width="190" height="160" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="220" font-size="9.5" font-weight="700" fill="#4A5568">Conditional diffusion</text>
    <ellipse cx="150" cy="255" rx="38" ry="17" fill="#E6F4F5" stroke="#007A87" stroke-width="1"/>
    <circle cx="150" cy="255" r="2.6" fill="#007A87"/>
    <text x="150" y="249" font-size="8.5" fill="#007A87" text-anchor="middle">mode A</text>
    <ellipse cx="150" cy="330" rx="38" ry="17" fill="#E6F4F5" stroke="#007A87" stroke-width="1"/>
    <circle cx="150" cy="330" r="2.6" fill="#007A87"/>
    <text x="150" y="342" font-size="8.5" fill="#007A87" text-anchor="middle">mode B</text>
    <line x1="92" y1="292" x2="190" y2="292" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="36" cy="298" r="3.5" fill="#B87333"/>
    <text x="36" y="315" font-size="8.5" fill="#B87333" text-anchor="middle">noise</text>
    <path d="M 36 298 Q 72 292 108 264" fill="none" stroke="#B87333" stroke-width="1.8" marker-end="url(#arr-bronze)"/>
    <text x="62" y="272" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">sample</text>
  </g>

  <!-- ================= (b) iterative denoising ================= -->
  <g transform="translate(235,14)">
    <rect width="210" height="372" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="22" font-size="10.5" font-weight="700" fill="#1A202C">(b) Iterative denoising</text>

    <rect x="10" y="34" width="190" height="92" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="52" font-size="9.5" font-weight="700" fill="#4A5568">step N: Gaussian noise</text>
    <path d="M 24 96 L 44 72 L 64 108 L 88 76 L 112 102 L 138 70 L 162 104 L 184 80" fill="none" stroke="#A0AEC0" stroke-width="1.5"/>

    <line x1="105" y1="128" x2="105" y2="148" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <rect x="10" y="152" width="190" height="92" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="170" font-size="9.5" font-weight="700" fill="#4A5568">intermediate step: coarse</text>
    <path d="M 24 214 Q 64 186 104 216 T 184 196" fill="none" stroke="#B87333" stroke-width="1.6" stroke-dasharray="5,3"/>

    <line x1="105" y1="246" x2="105" y2="266" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>

    <rect x="10" y="270" width="190" height="92" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.2"/>
    <text x="20" y="288" font-size="9.5" font-weight="700" fill="#1A202C">step 0: candidate chunk A<tspan font-size="7" dy="-4">0</tspan></text>
    <path d="M 24 336 Q 44 318 64 318 Q 86 318 104 330 Q 126 342 146 318 Q 166 298 184 302" fill="none" stroke="#B87333" stroke-width="2"/>
    <circle cx="24" cy="336" r="2.8" fill="#B87333"/>
    <circle cx="64" cy="318" r="2.8" fill="#B87333"/>
    <circle cx="104" cy="330" r="2.8" fill="#B87333"/>
    <circle cx="146" cy="318" r="2.8" fill="#B87333"/>
    <circle cx="184" cy="302" r="2.8" fill="#B87333"/>
  </g>

  <!-- ================= (c) dual-rate decoupling (M1: discrete MCU, no shared memory) ================= -->
  <g transform="translate(456,14)">
    <rect width="210" height="372" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="22" font-size="10.5" font-weight="700" fill="#1A202C">(c) Dual-rate decoupling</text>

    <rect x="14" y="34" width="182" height="50" rx="0" fill="#FBF3EC" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="105" y="55" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">application processor</text>
    <text x="105" y="71" font-size="8.5" fill="#4A5568" text-anchor="middle">sampler, 15 Hz</text>

    <line x1="105" y1="84" x2="105" y2="106" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
    <text x="113" y="99" font-size="8.5" font-weight="700" fill="#B87333">chunk A<tspan font-size="7" dy="-4">0</tspan></text>

    <rect x="14" y="110" width="182" height="46" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="105" y="129" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">black-channel link</text>
    <text x="105" y="145" font-size="8.5" fill="#4A5568" text-anchor="middle">CRC, sequence number</text>

    <line x1="105" y1="156" x2="105" y2="178" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <rect x="14" y="182" width="182" height="126" rx="0" fill="#EEF4F2" stroke="#1A4D3E" stroke-width="1.4"/>
    <text x="105" y="200" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">safety MCU, 1 kHz tick</text>
    <text x="105" y="214" font-size="8.5" fill="#4A5568" text-anchor="middle">own memory</text>
    <rect x="26" y="224" width="76" height="30" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="1"/>
    <text x="64" y="237" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">buffer 0</text>
    <text x="64" y="249" font-size="8" fill="#4A5568" text-anchor="middle">active</text>
    <rect x="108" y="224" width="76" height="30" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="146" y="237" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">buffer 1</text>
    <text x="146" y="249" font-size="8" fill="#4A5568" text-anchor="middle">filling</text>
    <text x="105" y="276" font-size="8.5" fill="#1A202C" text-anchor="middle">freshness check,</text>
    <text x="105" y="290" font-size="8.5" fill="#1A202C" text-anchor="middle">spline, slew clamp</text>

    <line x1="105" y1="308" x2="105" y2="330" stroke="#1A4D3E" stroke-width="1.4" marker-end="url(#arr-pine)"/>
    <text x="113" y="323" font-size="8.5" font-weight="700" fill="#1A4D3E">admitted command</text>

    <rect x="40" y="334" width="130" height="28" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <text x="105" y="352" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">drives</text>
  </g>
</svg>
