<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="100" fill="#ffffff"/>
  <!-- To scale: 172 px = 82 ms (2.0976 px/ms), bar from x=4 to x=176 -->
  <text x="90" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#5e6b73">82 ms from last renewal</text>
  <line x1="4" y1="25" x2="176" y2="25" stroke="#5e6b73" stroke-width="1.8"/>
  <line x1="4" y1="20.5" x2="4" y2="29.5" stroke="#5e6b73" stroke-width="1.4"/>
  <line x1="176" y1="20.5" x2="176" y2="29.5" stroke="#5e6b73" stroke-width="1.4"/>
  <!-- Tick + bus label above the bar, leader to the 2 ms sliver -->
  <text x="124" y="45" text-anchor="end" font-size="12" fill="#333333">Tick + bus 2 ms</text>
  <polyline points="126,41 132,41 132,53" fill="none" stroke="#333333" stroke-width="0.9"/>
  <!-- Segments: lease 60 ms, tick + bus 2 ms, drive 20 ms -->
  <rect x="4" y="54" width="125.86" height="22" fill="#5e6b73" stroke="#ffffff" stroke-width="0.9"/>
  <rect x="129.86" y="54" width="4.19" height="22" fill="#cccccc" stroke="#ffffff" stroke-width="0.9"/>
  <rect x="134.05" y="54" width="41.95" height="22" fill="#cccccc" stroke="#ffffff" stroke-width="0.9"/>
  <text x="66.9" y="69.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">60</text>
  <text x="155" y="69.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">20</text>
  <text x="66.9" y="92" text-anchor="middle" font-size="12" fill="#333333">Lease</text>
  <text x="155" y="92" text-anchor="middle" font-size="12" fill="#333333">Drive</text>
</svg>
