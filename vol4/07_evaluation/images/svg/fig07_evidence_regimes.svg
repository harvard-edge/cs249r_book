<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="462" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- quadrant panels (neutral: the regimes are a classification) -->
  <rect x="58" y="16" width="294" height="184" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="370" y="16" width="294" height="184" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="58" y="216" width="294" height="184" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="370" y="216" width="294" height="184" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

  <!-- axes -->
  <line x1="44" y1="400" x2="44" y2="22" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <text x="30" y="108" font-size="9" fill="#4A5568" text-anchor="middle" transform="rotate(-90 30 108)">live hardware</text>
  <text x="30" y="208" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle" transform="rotate(-90 30 208)">Physical realism</text>
  <text x="30" y="308" font-size="9" fill="#4A5568" text-anchor="middle" transform="rotate(-90 30 308)">logged or synthetic</text>
  <line x1="58" y1="414" x2="664" y2="414" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <text x="205" y="430" font-size="9" fill="#4A5568" text-anchor="middle">open loop</text>
  <text x="517" y="430" font-size="9" fill="#4A5568" text-anchor="middle">closed loop</text>
  <text x="361" y="450" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Causal feedback</text>

  <!-- ============ Shadow mode (top-left) ============ -->
  <text x="70" y="36" font-size="11" font-weight="700" fill="#1A202C">Shadow mode</text>
  <!-- feedback (drawn first) -->
  <path d="M 338 70 H 344 V 150 H 98 V 118" fill="none" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <rect x="70" y="70" width="56" height="46" rx="0" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2"/>
  <text x="98" y="90" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">f<tspan font-size="8" dy="3">real</tspan></text>
  <text x="98" y="107" font-size="9" fill="#007A87" text-anchor="middle">z<tspan font-size="8" dy="3">t</tspan></text>
  <path d="M 126 93 H 146 V 70 H 164" fill="none" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <path d="M 146 93 V 118 H 164" fill="none" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <rect x="166" y="56" width="64" height="28" rx="3" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2"/>
  <text x="198" y="74" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">π<tspan font-size="8" dy="3">base</tspan></text>
  <rect x="166" y="104" width="64" height="28" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="198" y="122" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">π<tspan font-size="8" dy="3">θ</tspan></text>
  <line x1="230" y1="70" x2="272" y2="70" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <text x="251" y="64" font-size="9" fill="#4A5568" text-anchor="middle">a<tspan font-size="8" dy="3">base</tspan></text>
  <line x1="230" y1="118" x2="272" y2="118" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <text x="251" y="112" font-size="9" fill="#B87333" text-anchor="middle">a<tspan font-size="8" dy="3">cand</tspan></text>
  <rect x="274" y="56" width="64" height="28" rx="0" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2"/>
  <text x="306" y="74" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">drives</text>
  <rect x="274" y="104" width="64" height="28" rx="3" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="306" y="122" font-size="10" font-weight="700" fill="#4A5568" text-anchor="middle">logged</text>
  <rect x="140" y="164" width="130" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="205" y="179" font-size="9.5" fill="#1A202C" text-anchor="middle">s<tspan font-size="8" dy="3">t</tspan><tspan dy="-3" dx="3">∼ d(π</tspan><tspan font-size="8" dy="3">base</tspan><tspan dy="-3">)</tspan></text>

  <!-- ============ Constrained testing (top-right) ============ -->
  <text x="382" y="36" font-size="11" font-weight="700" fill="#1A202C">Constrained testing</text>
  <rect x="634" y="48" width="22" height="100" fill="#EDF2F7"/>
  <text x="645" y="98" font-size="8.5" fill="#4A5568" text-anchor="middle" transform="rotate(-90 645 98)">open deployment</text>
  <path d="M 588 102 V 130 H 407 V 104" fill="none" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <text x="497" y="143" font-size="9" fill="#4A5568" text-anchor="middle">s<tspan font-size="8" dy="3">t+1</tspan></text>
  <rect x="382" y="70" width="50" height="32" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="407" y="90" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">π<tspan font-size="8" dy="3">θ</tspan></text>
  <line x1="432" y1="86" x2="458" y2="86" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>
  <text x="445" y="80" font-size="9" fill="#B87333" text-anchor="middle">a<tspan font-size="8" dy="3">t</tspan></text>
  <rect x="460" y="66" width="80" height="40" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="500" y="83" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">permission</text>
  <text x="500" y="96" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">path</text>
  <line x1="540" y1="86" x2="564" y2="86" stroke="#1A4D3E" stroke-width="1.2" marker-end="url(#arr-pine)"/>
  <text x="552" y="80" font-size="9" fill="#1A4D3E" text-anchor="middle">u<tspan font-size="8" dy="3">t</tspan></text>
  <rect x="566" y="70" width="44" height="32" rx="0" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2"/>
  <text x="588" y="90" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">f<tspan font-size="8" dy="3">real</tspan></text>
  <line x1="624" y1="50" x2="624" y2="150" stroke="#A51C30" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="624" y="44" font-size="10" font-weight="700" fill="#A51C30" text-anchor="middle">∂𝒮</text>
  <rect x="452" y="164" width="110" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="507" y="179" font-size="9.5" fill="#1A202C" text-anchor="middle">s<tspan font-size="8" dy="3">t</tspan><tspan dy="-3" dx="3">∈ 𝒮</tspan><tspan font-size="8" dy="3">safe</tspan></text>

  <!-- ============ Recorded replay (bottom-left) ============ -->
  <text x="70" y="236" font-size="11" font-weight="700" fill="#1A202C">Recorded replay</text>
  <path d="M 102 312 V 351 H 150" fill="none" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 260 351 H 301 V 308" fill="none" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="70" y="270" width="64" height="42" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="102" y="288" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">𝒟<tspan font-size="8" dy="3">demo</tspan></text>
  <text x="102" y="304" font-size="8.5" fill="#4A5568" text-anchor="middle">z<tspan font-size="8" dy="2">0</tspan><tspan dy="-2" dx="3">…</tspan><tspan dx="3">z</tspan><tspan font-size="8" dy="2">T</tspan></text>
  <line x1="134" y1="291" x2="168" y2="291" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <text x="151" y="285" font-size="9" fill="#007A87" text-anchor="middle">z<tspan font-size="8" dy="3">t</tspan></text>
  <rect x="170" y="275" width="50" height="32" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="195" y="295" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">π<tspan font-size="8" dy="3">θ</tspan></text>
  <line x1="220" y1="291" x2="262" y2="291" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>
  <text x="241" y="285" font-size="9" fill="#B87333" text-anchor="middle">â<tspan font-size="8" dy="3">t</tspan></text>
  <rect x="264" y="275" width="74" height="32" rx="3" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2"/>
  <text x="301" y="295" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">|&#8201;â − a*&#8201;|</text>
  <rect x="150" y="340" width="110" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="205" y="355" font-size="9.5" fill="#1A202C" text-anchor="middle">∂s / ∂â = 0</text>

  <!-- ============ Simulation (bottom-right) ============ -->
  <text x="382" y="236" font-size="11" font-weight="700" fill="#1A202C">Simulation</text>
  <path d="M 602 307 V 351 H 562" fill="none" stroke="#4A5568" stroke-width="1.2"/>
  <path d="M 452 351 H 407 V 309" fill="none" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <rect x="382" y="275" width="50" height="32" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="407" y="295" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">π<tspan font-size="8" dy="3">θ</tspan></text>
  <line x1="432" y1="291" x2="468" y2="291" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>
  <text x="450" y="285" font-size="9" fill="#B87333" text-anchor="middle">a<tspan font-size="8" dy="3">t</tspan></text>
  <rect x="470" y="275" width="56" height="32" rx="0" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="498" y="295" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">f<tspan font-size="8" dy="3">sim</tspan></text>
  <line x1="526" y1="291" x2="570" y2="291" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-ink)"/>
  <text x="548" y="285" font-size="9" fill="#4A5568" text-anchor="middle">s<tspan font-size="8" dy="3">t+1</tspan></text>
  <rect x="572" y="275" width="60" height="32" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="602" y="295" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">ô<tspan font-size="8" dy="3">t+1</tspan></text>
  <rect x="452" y="340" width="110" height="22" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="507" y="355" font-size="9.5" fill="#1A202C" text-anchor="middle">f<tspan font-size="8" dy="3">sim</tspan><tspan dy="-3" dx="3">≠</tspan><tspan dx="3">f</tspan><tspan font-size="8" dy="3">real</tspan></text>
</svg>
