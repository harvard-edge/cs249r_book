<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="438" fill="#ffffff"/>
  <defs>
    <marker id="arr-proposal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-measured" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== Governance envelope: surrounds all five levels, no control rate ===== -->
  <rect x="36" y="16" width="608" height="406" rx="4" fill="none" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="52" y="36" font-size="9.5" font-weight="700" fill="#1A202C">Governance<tspan dx="6" font-weight="400" font-size="8.5" fill="#4A5568">who may command, what licenses operation, when it expires · no control rate</tspan></text>

  <!-- ===== Proposal boundary (drawn under the arrows that cross it) ===== -->
  <line x1="44" y1="112" x2="636" y2="112" stroke="#4A5568" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="280" y="103" width="170" height="18" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="0.8"/>
  <text x="365" y="115.5" text-anchor="middle" font-size="9" font-weight="700" font-style="italic" fill="#4A5568">proposal boundary</text>

  <!-- ===== Brain (proposal role) ===== -->
  <rect x="56" y="50" width="440" height="44" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="72" y="67" font-size="10.5" font-weight="700" fill="#1A202C">Brain</text>
  <text x="72" y="83" font-size="8.5" font-weight="400" fill="#4A5568">learned proposers · intent model 2 Hz (336 ms inference) · chunk renewed every 50 ms</text>

  <!-- ===== Nervous System (structural role): application processor + discrete safety MCU ===== -->
  <rect x="56" y="130" width="440" height="78" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="72" y="147" font-size="10.5" font-weight="700" fill="#1A202C">Nervous System</text>
  <text x="480" y="147" text-anchor="end" font-size="8.5" font-weight="400" fill="#4A5568">admit, modify, or refuse · lease · fallback</text>
  <rect x="72" y="156" width="160" height="42" rx="3" fill="#ffffff" stroke="#1A4D3E" stroke-width="1"/>
  <text x="152" y="173" text-anchor="middle" font-size="9" font-weight="700" fill="#1A202C">application processor</text>
  <text x="152" y="188" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">setpoint every 25 ms</text>
  <rect x="312" y="156" width="168" height="42" rx="3" fill="#ffffff" stroke="#1A4D3E" stroke-width="1"/>
  <text x="396" y="173" text-anchor="middle" font-size="9" font-weight="700" fill="#1A202C">discrete safety MCU</text>
  <text x="396" y="188" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">permission path · 1 kHz tick</text>
  <!-- black-channel link: no shared memory -->
  <line x1="232" y1="184" x2="310" y2="184" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="271" y="170" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">black-channel</text>
  <text x="271" y="179" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">link</text>

  <!-- ===== Boundary (structural role, placed in causal actuation order) ===== -->
  <rect x="56" y="230" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="72" y="247" font-size="10.5" font-weight="700" fill="#1A202C">Boundary</text>
  <text x="72" y="263" font-size="8.5" font-weight="400" fill="#4A5568">actuator register write (causal boundary) and sensor capture · event-timed</text>

  <!-- ===== Body (structural role) ===== -->
  <rect x="56" y="296" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="72" y="313" font-size="10.5" font-weight="700" fill="#1A202C">Body</text>
  <text x="72" y="329" font-size="8.5" font-weight="400" fill="#4A5568">drives close current loops at 20 kHz · gearing, windings · 47.7 V drive bus</text>

  <!-- ===== World (measured role) ===== -->
  <rect x="56" y="362" width="440" height="44" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="72" y="379" font-size="10.5" font-weight="700" fill="#1A202C">World</text>
  <text x="72" y="395" font-size="8.5" font-weight="400" fill="#4A5568">contact, friction, payload, people · continuous · not every state reaches a sensor</text>

  <!-- ===== Downward causal path: proposal -> admitted command -> register write -> winding current -> force and motion ===== -->
  <line x1="186" y1="94" x2="186" y2="154" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-proposal)"/>
  <text x="194" y="107" font-size="8.5" font-weight="400" fill="#4A5568">proposal</text>
  <line x1="396" y1="198" x2="396" y2="228" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="404" y="222" font-size="8.5" font-weight="400" fill="#4A5568">admitted command</text>
  <line x1="396" y1="274" x2="396" y2="294" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="404" y="288" font-size="8.5" font-weight="400" fill="#4A5568">current in a winding</text>
  <line x1="396" y1="340" x2="396" y2="360" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="404" y="354" font-size="8.5" font-weight="400" fill="#4A5568">force and motion</text>

  <!-- ===== Upward sensing path: World -> Boundary (sensor capture) -> MCU & Brain ===== -->
  <path d="M 496 384 H 594 V 262 H 498" fill="none" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <text x="545" y="379" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">light and force</text>

  <!-- Perimeter feedback lane: measurements with capture time -->
  <path d="M 496 242 H 594 V 72 H 498" fill="none" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <line x1="594" y1="177" x2="482" y2="177" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <text x="545" y="237" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">capture</text>
  <text x="545" y="172" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">fresh state</text>
  <text x="545" y="67" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">observations</text>
</svg>
