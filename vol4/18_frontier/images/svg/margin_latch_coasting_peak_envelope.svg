<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="102" fill="#ffffff"/>
  <!-- force scale: bars start at x=88, 0.38 px per N; 100 N floor at x=126 -->
  <rect x="126" y="20" width="52" height="80" fill="#f2d7d5" opacity="0.34"/>
  <line x1="126" y1="20" x2="126" y2="100" stroke="#cb202d" stroke-width="1.6" stroke-dasharray="4,2.5"/>
  <text x="126" y="14" font-size="12" fill="#cb202d" text-anchor="middle">100 N floor</text>
  <!-- rigid, 0.03 m/s: 67 N -->
  <rect x="88" y="26" width="25.5" height="18" fill="#d97706" stroke="#ffffff" stroke-width="0.8"/>
  <text x="100.7" y="39.3" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">67</text>
  <text x="83" y="39.3" font-size="12" fill="#333333" text-anchor="end">rigid, 0.03 m/s</text>
  <!-- rigid, 0.1 m/s: 220 N, segment past the floor in red -->
  <rect x="88" y="52" width="38" height="18" fill="#d97706" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="126" y="52" width="45.6" height="18" fill="#cb202d" stroke="#ffffff" stroke-width="0.8"/>
  <text x="107" y="65.3" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">220</text>
  <text x="83" y="65.3" font-size="12" fill="#333333" text-anchor="end">rigid, 0.1 m/s</text>
  <!-- spring, 0.1 m/s: 75 N -->
  <rect x="88" y="78" width="28.5" height="18" fill="#d97706" stroke="#ffffff" stroke-width="0.8"/>
  <text x="102.2" y="91.3" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">75</text>
  <text x="83" y="91.3" font-size="12" fill="#333333" text-anchor="end">spring, 0.1 m/s</text>
</svg>
