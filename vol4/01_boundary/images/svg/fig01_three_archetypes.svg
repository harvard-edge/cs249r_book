<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Headers are neutral: the classification is not a hazard ranking.
       Red (consequence #A51C30) marks only limits: D_clear, the stiff
       fixture's force, T_max. Measured = petrol #007A87. -->
  <rect width="680" height="236" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="tick" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="8" orient="auto">
      <rect x="0.4" y="0" width="1.2" height="10" fill="#A51C30"/>
    </marker>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#E2E8F0"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#718096" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ===================== (a) Mass-dominated mobility ===================== -->
  <g transform="translate(20, 10)">
    <rect width="200" height="216" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 Q 0 0 4 0 L 196 0 Q 200 0 200 4 L 200 38 L 0 38 Z" fill="#F1F5F9"/>
    <line x1="0" y1="38" x2="200" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <text x="100" y="17" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">(a) Class 1</text>
    <text x="100" y="31" font-size="9" fill="#4A5568" text-anchor="middle">mass-dominated mobility</text>

    <!-- floor -->
    <line x1="10" y1="128" x2="190" y2="128" stroke="#718096" stroke-width="1.2"/>
    <!-- rack end (fixed obstacle) -->
    <rect x="166" y="72" width="12" height="56" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
    <!-- base -->
    <rect x="18" y="98" width="56" height="20" rx="0" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>
    <rect x="38" y="90" width="16" height="8" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
    <circle cx="30" cy="121" r="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <circle cx="62" cy="121" r="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <!-- velocity -->
    <line x1="80" y1="106" x2="124" y2="106" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>
    <text x="100" y="99" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">v</text>
    <!-- clearance: the limit -->
    <line x1="74" y1="62" x2="166" y2="62" stroke="#A51C30" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <text x="120" y="56" font-size="9.5" font-style="italic" fill="#A51C30" text-anchor="middle">D<tspan baseline-shift="sub" font-size="7" font-style="normal">clear</tspan></text>

    <!-- governing relation -->
    <line x1="12" y1="146" x2="188" y2="146" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="168" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">d<tspan baseline-shift="sub" font-size="7" font-style="normal">stop</tspan> = v τ<tspan baseline-shift="sub" font-size="7" font-style="normal">delay</tspan> + v²/(2a<tspan baseline-shift="sub" font-size="7" font-style="normal">brake</tspan>)</text>
    <text x="100" y="198" font-size="9" fill="#4A5568" text-anchor="middle">spends stopping clearance</text>
  </g>

  <!-- ===================== (b) Contact-dominated manipulation ===================== -->
  <g transform="translate(240, 10)">
    <rect width="200" height="216" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 Q 0 0 4 0 L 196 0 Q 200 0 200 4 L 200 38 L 0 38 Z" fill="#F1F5F9"/>
    <line x1="0" y1="38" x2="200" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <text x="100" y="17" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">(b) Class 2</text>
    <text x="100" y="31" font-size="9" fill="#4A5568" text-anchor="middle">contact-dominated manipulation</text>

    <!-- mount -->
    <line x1="10" y1="128" x2="100" y2="128" stroke="#718096" stroke-width="1.2"/>
    <rect x="22" y="116" width="26" height="12" rx="0" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>
    <!-- links and joints -->
    <line x1="35" y1="116" x2="58" y2="76" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="58" y1="76" x2="104" y2="96" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="116" r="4.5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <circle cx="58" cy="76" r="4.5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <!-- gripper -->
    <rect x="104" y="89" width="8" height="14" rx="0" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>
    <!-- contact stiffness as a spring into the fixture -->
    <polyline points="112,96 117,96 120,90 126,102 132,90 138,102 144,90 147,96 152,96" fill="none" stroke="#334155" stroke-width="1.2"/>
    <text x="132" y="82" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">k<tspan baseline-shift="sub" font-size="7" font-style="normal">contact</tspan></text>
    <!-- stiff fixture -->
    <rect x="152" y="64" width="14" height="64" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
    <!-- penetration and resulting force (the limit) -->
    <line x1="138" y1="116" x2="152" y2="116" stroke="#334155" stroke-width="1"/>
    <line x1="138" y1="111" x2="138" y2="121" stroke="#334155" stroke-width="1"/>
    <line x1="152" y1="111" x2="152" y2="121" stroke="#334155" stroke-width="1"/>
    <text x="145" y="134" font-size="9" font-style="italic" fill="#4A5568" text-anchor="middle">Δx</text>
    <line x1="184" y1="96" x2="170" y2="96" stroke="#A51C30" stroke-width="1.6" marker-end="url(#arr-red)"/>
    <text x="180" y="86" font-size="9.5" font-style="italic" fill="#A51C30" text-anchor="middle">F</text>

    <line x1="12" y1="146" x2="188" y2="146" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="168" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">F ≈ k<tspan baseline-shift="sub" font-size="7" font-style="normal">contact</tspan> Δx</text>
    <text x="100" y="198" font-size="9" fill="#4A5568" text-anchor="middle">spends force and deformation margin</text>
  </g>

  <!-- ===================== (c) Energy- and thermal-dominated operation ===================== -->
  <g transform="translate(460, 10)">
    <rect width="200" height="216" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0 4 Q 0 0 4 0 L 196 0 Q 200 0 200 4 L 200 38 L 0 38 Z" fill="#F1F5F9"/>
    <line x1="0" y1="38" x2="200" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <text x="100" y="17" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">(c) Class 3</text>
    <text x="100" y="31" font-size="9" fill="#4A5568" text-anchor="middle">energy- and thermal-dominated</text>

    <!-- electrical power in -->
    <line x1="14" y1="104" x2="44" y2="104" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-slate)"/>
    <text x="28" y="96" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">P<tspan baseline-shift="sub" font-size="7" font-style="normal">in</tspan></text>
    <!-- winding with thermal capacitance -->
    <rect x="46" y="86" width="84" height="36" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
    <path d="M 54 104 Q 59 92 64 104 Q 69 116 74 104 Q 79 92 84 104 Q 89 116 94 104 Q 99 92 104 104 Q 109 116 114 104 Q 119 92 122 104" fill="none" stroke="#4A5568" stroke-width="1.6"/>
    <text x="88" y="136" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">C<tspan baseline-shift="sub" font-size="7" font-style="normal">th</tspan></text>
    <!-- heat out -->
    <path d="M 68 82 Q 64 74 70 68 Q 76 62 72 54" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#arr-slate)"/>
    <path d="M 92 82 Q 88 74 94 68 Q 100 62 96 54" fill="none" stroke="#334155" stroke-width="1.1" marker-end="url(#arr-slate)"/>
    <text x="118" y="62" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">P<tspan baseline-shift="sub" font-size="7" font-style="normal">out</tspan></text>
    <!-- winding temperature against its limit -->
    <rect x="160" y="58" width="12" height="70" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <rect x="161" y="84" width="10" height="43" fill="#E3F3F5"/>
    <line x1="160" y1="84" x2="172" y2="84" stroke="#007A87" stroke-width="1.2"/>
    <line x1="154" y1="66" x2="178" y2="66" stroke="#A51C30" stroke-width="1.4"/>
    <text x="166" y="54" font-size="9.5" font-style="italic" fill="#A51C30" text-anchor="middle">T<tspan baseline-shift="sub" font-size="7" font-style="normal">limit</tspan></text>
    <text x="175" y="88" font-size="9.5" font-style="italic" fill="#007A87" text-anchor="start">T<tspan baseline-shift="sub" font-size="7" font-style="normal">wind</tspan></text>

    <line x1="12" y1="146" x2="188" y2="146" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="168" font-size="9.5" font-style="italic" fill="#1A202C" text-anchor="middle">dT<tspan baseline-shift="sub" font-size="7" font-style="normal">wind</tspan>/dt = (P<tspan baseline-shift="sub" font-size="7" font-style="normal">in</tspan> − P<tspan baseline-shift="sub" font-size="7" font-style="normal">out</tspan>)/C<tspan baseline-shift="sub" font-size="7" font-style="normal">th</tspan></text>
    <text x="100" y="198" font-size="9" fill="#4A5568" text-anchor="middle">spends heat and supply margin</text>
  </g>
</svg>
