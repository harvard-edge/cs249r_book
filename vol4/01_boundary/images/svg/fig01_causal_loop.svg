<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Vol IV roles from tex/theme-colors.tex: measured = petrol #007A87,
       proposal = bronze #B87333, structural = pine #1A4D3E,
       consequence = crimson #A51C30 (used only on the causal boundary). -->
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
  </defs>

  <!-- ==================== (a) Advisory output ==================== -->
  <text x="25" y="24" font-size="10.5" font-weight="700" fill="#1A202C">(a) Advisory output</text>

  <!-- informational interface: output leaves the machine as information only -->
  <line x1="420" y1="50" x2="420" y2="114" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="420" y="44" font-size="8.5" font-weight="700" fill="#4A5568" text-anchor="middle">informational interface</text>

  <rect x="60" y="58" width="110" height="48" rx="3" fill="#F8FAFC" stroke="#A0AEC0" stroke-width="1.2"/>
  <text x="115" y="79" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Input</text>
  <text x="115" y="95" font-size="9" fill="#4A5568" text-anchor="middle" font-style="italic">x</text>

  <line x1="170" y1="82" x2="228" y2="82" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <rect x="230" y="58" width="130" height="48" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="295" y="79" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Learned model</text>
  <text x="295" y="95" font-size="9" fill="#4A5568" text-anchor="middle" font-style="italic">f(x)</text>

  <line x1="360" y1="82" x2="478" y2="82" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <rect x="480" y="58" width="120" height="48" rx="3" fill="#F8FAFC" stroke="#A0AEC0" stroke-width="1.2"/>
  <text x="540" y="79" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Prediction</text>
  <text x="540" y="95" font-size="9" fill="#4A5568" text-anchor="middle" font-style="italic">ŷ</text>

  <!-- divider -->
  <line x1="25" y1="134" x2="655" y2="134" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ==================== (b) Physical AI, closed loop ==================== -->
  <text x="25" y="158" font-size="10.5" font-weight="700" fill="#1A202C">(b) Physical AI, closed loop</text>

  <!-- causal boundary: the only red on the figure -->
  <line x1="429" y1="182" x2="429" y2="250" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="429" y="176" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle">causal boundary</text>

  <!-- Sensors (measured) -->
  <rect x="25" y="190" width="84" height="48" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="67" y="211" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Sensors</text>
  <text x="67" y="227" font-size="9" fill="#4A5568" text-anchor="middle" font-style="italic">o<tspan baseline-shift="sub" font-size="7">t</tspan></text>

  <line x1="109" y1="214" x2="133" y2="214" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Policy (proposal) -->
  <rect x="135" y="190" width="80" height="48" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="175" y="211" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Policy</text>
  <text x="175" y="227" font-size="9" fill="#4A5568" text-anchor="middle">proposal</text>

  <line x1="215" y1="214" x2="239" y2="214" stroke="#B87333" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-bronze)"/>

  <!-- Permission path (structural) -->
  <rect x="241" y="190" width="108" height="48" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="295" y="211" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Permission</text>
  <text x="295" y="227" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">path</text>

  <!-- admitted command crosses the causal boundary -->
  <line x1="349" y1="214" x2="447" y2="214" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-pine)"/>
  <text x="389" y="196" font-size="8.5" fill="#1A4D3E" text-anchor="middle">admitted</text>
  <text x="389" y="206" font-size="8.5" fill="#1A4D3E" text-anchor="middle">command</text>

  <!-- Actuators (hardware, sharp corners) -->
  <rect x="449" y="190" width="88" height="48" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="493" y="211" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Actuators</text>
  <text x="493" y="227" font-size="9" fill="#4A5568" text-anchor="middle">current, force</text>

  <line x1="537" y1="214" x2="561" y2="214" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Physical plant (hardware, sharp corners) -->
  <rect x="563" y="190" width="92" height="48" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="609" y="211" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Physical</text>
  <text x="609" y="227" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">plant</text>

  <!-- feedback, routed around the perimeter -->
  <path d="M 609 238 L 609 272 L 67 272 L 67 240" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <rect x="283" y="263" width="112" height="18" rx="3" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
  <text x="339" y="275.5" font-size="9" fill="#4A5568" text-anchor="middle">sensory feedback</text>
</svg>
