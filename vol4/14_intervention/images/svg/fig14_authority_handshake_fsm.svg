<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A202C"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <rect width="680" height="392" fill="#ffffff"/>

  <!-- Superstate: every state above can be pre-empted by the protective input -->
  <rect x="20" y="16" width="640" height="266" rx="4" fill="none" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="650" y="31" font-size="9" font-style="italic" fill="#4A5568" text-anchor="end">any of these states</text>

  <!-- ===================== EDGES (drawn before boxes) ===================== -->
  <g fill="none" stroke-width="1.4">
    <!-- AUTO -> PEND : request -->
    <path d="M 190 90 H 263" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- PEND -> BLEND : ACK + commit -->
    <path d="M 415 90 H 488" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- AUTO -> BLEND : operator-initiated takeover -->
    <path d="M 115 70 V 46 H 565 V 68" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- BLEND -> MAN -->
    <path d="M 610 128 V 188" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- BLEND -> FALLBACK -->
    <path d="M 505 128 V 150 H 395 V 188" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- PEND -> FALLBACK -->
    <path d="M 300 128 V 188" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- MAN -> FALLBACK -->
    <path d="M 490 222 H 417" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- AUTO -> FALLBACK -->
    <path d="M 160 128 V 205 H 263" stroke="#1A202C" marker-end="url(#arr-ink)"/>
    <!-- FALLBACK -> AUTO : reset from rest (dashed) -->
    <path d="M 265 238 H 80 V 130" stroke="#4A5568" stroke-dasharray="5,3" marker-end="url(#arr-soft)"/>
    <!-- superstate -> PROTECTIVE -->
    <path d="M 340 282 V 316" stroke="#A51C30" stroke-width="1.8" marker-end="url(#arr-crimson)"/>
  </g>

  <!-- ===================== EDGE LABELS ===================== -->
  <g font-size="9" fill="#4A5568">
    <text x="227" y="84" text-anchor="middle">request</text>
    <text x="452" y="84" text-anchor="middle">ACK + commit</text>
    <text x="452" y="104" text-anchor="middle">on a control tick</text>
    <text x="340" y="41" text-anchor="middle">operator ACK + commit: fresh state, feasible target, stopping reserve</text>
    <text x="604" y="164" text-anchor="end">profile done,</text>
    <text x="604" y="175" text-anchor="end">manual lease valid</text>
    <text x="450" y="144" text-anchor="middle">invalid state</text>
    <text x="294" y="162" text-anchor="end">timeout</text>
    <text x="453" y="216" text-anchor="middle">lease lapse or</text>
    <text x="453" y="236" text-anchor="middle">enabling loss</text>
    <text x="212" y="199" text-anchor="middle">lease expiry</text>
    <text x="90" y="256">reset from rest: standstill, faults cleared,</text>
    <text x="90" y="268">fresh authenticated re-admission handshake</text>
    <text x="348" y="298" fill="#A51C30">hardwired protective input</text>
    <text x="348" y="309" fill="#A51C30">or qualified critical fault</text>
  </g>

  <!-- ===================== STATES ===================== -->
  <!-- AUTO (policy proposes) -->
  <rect x="40" y="70" width="150" height="58" rx="3" fill="#F7EEE6" stroke="#B87333" stroke-width="1.5"/>
  <text x="115" y="90" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#8A5526" text-anchor="middle">AUTO</text>
  <text x="115" y="105" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Autonomous</text>
  <text x="115" y="119" font-size="9" fill="#4A5568" text-anchor="middle">policy proposes</text>

  <!-- PEND -->
  <rect x="265" y="70" width="150" height="58" rx="3" fill="#F7EEE6" stroke="#B87333" stroke-width="1.5"/>
  <text x="340" y="90" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#8A5526" text-anchor="middle">PEND</text>
  <text x="340" y="105" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Handover-Pending</text>
  <text x="340" y="119" font-size="9" fill="#4A5568" text-anchor="middle">policy proposes, timer runs</text>

  <!-- BLEND (enforcer owns) -->
  <rect x="490" y="70" width="150" height="58" rx="3" fill="#E9F1EE" stroke="#1A4D3E" stroke-width="1.5"/>
  <text x="565" y="90" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle">BLEND</text>
  <text x="565" y="105" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Blend</text>
  <text x="565" y="119" font-size="9" fill="#4A5568" text-anchor="middle">enforcer owns the profile</text>

  <!-- FALLBACK -->
  <rect x="265" y="190" width="150" height="58" rx="3" fill="#E9F1EE" stroke="#1A4D3E" stroke-width="1.5"/>
  <text x="340" y="210" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle">FALLBACK</text>
  <text x="340" y="225" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Fallback</text>
  <text x="340" y="239" font-size="9" fill="#4A5568" text-anchor="middle">validated HOLD or STOP</text>

  <!-- MAN (operator proposes) -->
  <rect x="490" y="190" width="150" height="58" rx="3" fill="#EFEDF5" stroke="#5B4B8A" stroke-width="1.5"/>
  <text x="565" y="210" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#5B4B8A" text-anchor="middle">MAN</text>
  <text x="565" y="225" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Human-Manual</text>
  <text x="565" y="239" font-size="9" fill="#4A5568" text-anchor="middle">operator proposes</text>

  <!-- PROTECTIVE (hazard response) -->
  <rect x="265" y="318" width="150" height="58" rx="3" fill="#F9E9EB" stroke="#A51C30" stroke-width="1.5"/>
  <text x="340" y="338" font-family="Menlo, Courier New, monospace" font-size="11" font-weight="700" fill="#A51C30" text-anchor="middle">PROTECTIVE</text>
  <text x="340" y="353" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Protective</text>
  <text x="340" y="367" font-size="9" fill="#4A5568" text-anchor="middle">safety circuit: brake or hold</text>
</svg>
