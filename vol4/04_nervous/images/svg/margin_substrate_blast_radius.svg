<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#aaaaaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="180" height="124" fill="#ffffff"/>

  <!-- source: the shared drive bus -->
  <text x="2" y="15" font-size="13" font-weight="bold" fill="#cb202d">drive bus sag</text>
  <rect x="2" y="28" width="26" height="34" fill="#cb202d"/>

  <!-- loads on the shared bus -->
  <line x1="30" y1="40" x2="46" y2="35" stroke="#aaaaaa" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arr-grey)"/>
  <line x1="30" y1="50" x2="46" y2="64" stroke="#aaaaaa" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arr-grey)"/>
  <circle cx="56" cy="34" r="8" fill="#cb202d"/>
  <text x="68" y="38" font-size="12" fill="#333333">motor drives</text>
  <circle cx="56" cy="67" r="8" fill="#cb202d"/>
  <text x="68" y="71" font-size="12" fill="#333333">host lockout 33 V</text>

  <!-- isolated, held-up permission rail -->
  <line x1="24" y1="64" x2="39" y2="101" stroke="#aaaaaa" stroke-width="1.7" stroke-dasharray="3.4,2.5" stroke-linecap="round"/>
  <line x1="42" y1="90" x2="42" y2="116" stroke="#008f45" stroke-width="3.6"/>
  <circle cx="56" cy="103" r="8" fill="#008f45"/>
  <text x="68" y="99" font-size="12" fill="#333333">permission rail,</text>
  <text x="68" y="114" font-size="12" fill="#333333">2 s hold-up</text>
</svg>
