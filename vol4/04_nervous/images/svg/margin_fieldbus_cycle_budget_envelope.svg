<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="180" height="104" fill="#ffffff"/>

  <!-- CAN FD: each message is its own arbitrated frame (schematic, not to scale: three drives, a command and a feedback frame each) -->
  <text x="2" y="14" font-size="12.5" fill="#333333">CAN FD</text>
  <line x1="2" y1="43" x2="178" y2="43" stroke="#aaaaaa" stroke-width="1.2"/>
  <rect x="2" y="21" width="24" height="20" fill="#7e317b"/>
  <rect x="31" y="21" width="24" height="20" fill="#7e317b"/>
  <rect x="60" y="21" width="24" height="20" fill="#7e317b"/>
  <rect x="89" y="21" width="24" height="20" fill="#7e317b"/>
  <rect x="118" y="21" width="24" height="20" fill="#7e317b"/>
  <rect x="147" y="21" width="24" height="20" fill="#7e317b"/>
  <g font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="14" y="35.5">1</text>
    <text x="43" y="35.5">1</text>
    <text x="72" y="35.5">2</text>
    <text x="101" y="35.5">2</text>
    <text x="130" y="35.5">3</text>
    <text x="159" y="35.5">3</text>
  </g>

  <!-- EtherCAT: one short frame streams through every drive; each reads and writes its own slot on the fly -->
  <text x="2" y="70" font-size="12.5" fill="#333333">EtherCAT</text>
  <line x1="2" y1="99" x2="178" y2="99" stroke="#aaaaaa" stroke-width="1.2"/>
  <rect x="2" y="77" width="39" height="20" fill="#7e317b"/>
  <line x1="15" y1="81" x2="15" y2="93" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="28" y1="81" x2="28" y2="93" stroke="#ffffff" stroke-width="0.8"/>
  <g font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="8.5" y="91.5">1</text>
    <text x="21.5" y="91.5">2</text>
    <text x="34.5" y="91.5">3</text>
  </g>
</svg>
