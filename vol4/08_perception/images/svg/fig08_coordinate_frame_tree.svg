<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="350" fill="#fff"/>
  <defs>
    <marker id="arr-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A202C"/>
    </marker>
    <marker id="arr-petrol" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#007A87"/>
    </marker>
    <marker id="arr-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A5568"/>
    </marker>
    <marker id="arr-pale" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#A0AEC0"/>
    </marker>
  </defs>

  <g transform="translate(55,0)">
  <!-- ===== Frame nodes (parent above child) ===== -->
  <rect x="60" y="20" width="200" height="40" rx="3" fill="#F8FAFC" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="160" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#1A202C"><tspan font-family="STIX Two Math, STIXGeneral, Cambria Math, Latin Modern Math, serif" font-weight="400">ℱ</tspan><tspan font-size="9" dy="3">earth</tspan></text>
  <text x="160" y="53" text-anchor="middle" font-size="9" fill="#4A5568">optional geodetic datum</text>

  <rect x="60" y="90" width="200" height="40" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="160" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#1A202C"><tspan font-family="STIX Two Math, STIXGeneral, Cambria Math, Latin Modern Math, serif" font-weight="400">ℱ</tspan><tspan font-size="9" dy="3">map</tspan></text>
  <text x="160" y="123" text-anchor="middle" font-size="9" fill="#4A5568">map: global localization</text>

  <rect x="60" y="160" width="200" height="40" rx="3" fill="#F8FAFC" stroke="#007A87" stroke-width="1.2"/>
  <text x="160" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1A202C"><tspan font-family="STIX Two Math, STIXGeneral, Cambria Math, Latin Modern Math, serif" font-weight="400">ℱ</tspan><tspan font-size="9" dy="3">odom</tspan></text>
  <text x="160" y="193" text-anchor="middle" font-size="9" fill="#4A5568">odom: locally continuous</text>

  <rect x="60" y="230" width="200" height="40" rx="0" fill="#F8FAFC" stroke="#1A202C" stroke-width="1.2"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1A202C"><tspan font-family="STIX Two Math, STIXGeneral, Cambria Math, Latin Modern Math, serif" font-weight="400">ℱ</tspan><tspan font-size="9" dy="3">body</tspan></text>
  <text x="160" y="263" text-anchor="middle" font-size="9" fill="#4A5568">base_link: body-fixed</text>

  <rect x="60" y="300" width="200" height="40" rx="0" fill="#F8FAFC" stroke="#1A202C" stroke-width="1.2"/>
  <text x="160" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#1A202C"><tspan font-family="STIX Two Math, STIXGeneral, Cambria Math, Latin Modern Math, serif" font-weight="400">ℱ</tspan><tspan font-size="9" dy="3">sensor</tspan></text>
  <text x="160" y="333" text-anchor="middle" font-size="9" fill="#4A5568">sensor_link: mounting frame</text>

  <!-- ===== Edges (parent to child) with their property and uncertainty ===== -->
  <path d="M160,60 V88" fill="none" stroke="#A0AEC0" stroke-width="1.2" stroke-dasharray="1,2" marker-end="url(#arr-pale)"/>
  <text x="172" y="79" font-size="9" fill="#4A5568">fixed datum, if present</text>

  <path d="M160,130 V158" fill="none" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-soft)"/>
  <text x="172" y="149" font-size="9" fill="#4A5568">may jump at relocalization · <tspan font-style="italic">Σ</tspan><tspan font-size="8" dy="2">map</tspan></text>

  <path d="M160,200 V228" fill="none" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-petrol)"/>
  <text x="172" y="219" font-size="9" fill="#007A87">continuous (REP 105), drifts · <tspan font-style="italic">Σ</tspan><tspan font-size="8" dy="2">odom</tspan></text>

  <path d="M160,270 V298" fill="none" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <text x="172" y="289" font-size="9" fill="#1A202C">rigid, calibrated · <tspan font-style="italic">Σ</tspan><tspan font-size="8" dy="2">ext</tspan></text>

  <!-- ===== Consumers (right column) ===== -->
  <path d="M380,92 H388 V128 H380" fill="none" stroke="#4A5568" stroke-width="1"/>
  <text x="398" y="107" font-size="9.5" font-weight="700" fill="#1A202C">global planner</text>
  <text x="398" y="120" font-size="9" fill="#4A5568">reconciles jumps before use</text>

  <path d="M380,162 H388 V268 H380" fill="none" stroke="#007A87" stroke-width="1"/>
  <text x="398" y="211" font-size="9.5" font-weight="700" fill="#1A202C">local tracking loops</text>
  <text x="398" y="224" font-size="9" fill="#4A5568">reject transform jumps</text>

  <path d="M380,302 H388 V338 H380" fill="none" stroke="#1A202C" stroke-width="1"/>
  <text x="398" y="317" font-size="9.5" font-weight="700" fill="#1A202C">observation</text>
  <text x="398" y="330" font-size="9" fill="#4A5568">frame, epoch <tspan font-style="italic">t</tspan><tspan font-size="8" dy="2">0</tspan><tspan dy="-2">, covariance</tspan><tspan dx="3" font-style="italic">Σ</tspan><tspan font-size="8" dy="2">z</tspan></text>
  </g>
</svg>
