<?xml version="1.0" encoding="utf-8"?>
<!-- Phase margin vs observation age, linear axes: x = 4 + 1.45 px per ms (0-120 ms), y = 100 - 1.2 px per degree.
     PM 45 deg at zero age falls to zero at 78.5 ms (PM/omega_c, omega_c = 10 rad/s); 60 ms marks the perception age.
     Red only past the zero-margin wall. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="156" fill="#ffffff"/>
  <!-- unstable region past the zero-margin age -->
  <rect x="117.8" y="2" width="60.2" height="152" fill="#f2d7d5" opacity="0.34"/>
  <!-- left axis and zero-margin line -->
  <line x1="3" y1="2" x2="3" y2="154" stroke="#cccccc" stroke-width="1.4"/>
  <line x1="4" y1="100" x2="178" y2="100" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="4,3"/>
  <!-- margin line: green while positive, red once exhausted -->
  <line x1="4" y1="46" x2="117.8" y2="100" stroke="#008f45" stroke-width="2.8"/>
  <line x1="117.8" y1="100" x2="178" y2="128.5" stroke="#cb202d" stroke-width="2.8"/>
  <!-- markers -->
  <circle cx="91" cy="87.3" r="4.3" fill="#333333"/>
  <circle cx="117.8" cy="100" r="5" fill="#cb202d"/>
  <!-- labels -->
  <text x="6" y="32" font-size="13" fill="#008f45">PM 45&#176;</text>
  <text x="98" y="76" font-size="13" fill="#333333" text-anchor="middle">60 ms</text>
  <text x="112" y="119" font-size="13" font-weight="bold" fill="#cb202d" text-anchor="end">78.5 ms</text>
  <text x="148" y="64" font-size="13" fill="#cb202d" text-anchor="middle">unstable</text>
  <text x="176" y="150" font-size="13" fill="#333333" text-anchor="end">age</text>
</svg>
