<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Vol IV roles (tex/theme-colors.tex): proposal = bronze #B87333,
       structural = pine #1A4D3E, measured = petrol #007A87; hardware in slate
       with sharp corners. No red: nothing here is a consequence.
       Rates are the running machine's, guarded by the brain-two-speed-rates
       cell in 03_brain.qmd (2 Hz, 336 ms, 20 Hz, 40 ms, 1 kHz). -->
  <rect width="680" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== Realms ===== -->
  <rect x="20" y="36" width="280" height="300" rx="4" fill="#FCF8F4" stroke="#B87333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="34" y="55" font-size="10" font-weight="700" fill="#1A202C">Brain: learned proposers</text>
  <rect x="380" y="36" width="280" height="300" rx="4" fill="#F6FAF8" stroke="#1A4D3E" stroke-width="1"/>
  <text x="394" y="55" font-size="10" font-weight="700" fill="#1A202C">Nervous System and Body</text>

  <!-- ===== Proposal boundary (neutral: a partition of authority, not a hazard) ===== -->
  <line x1="340" y1="32" x2="340" y2="340" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="340" y="24" font-size="9" font-weight="700" font-style="italic" fill="#4A5568" text-anchor="middle">proposal boundary</text>

  <!-- ===== Left column ===== -->
  <rect x="40" y="70" width="240" height="40" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="160" y="87" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Observations</text>
  <text x="160" y="101" font-size="8.5" fill="#4A5568" text-anchor="middle">timestamped camera frames</text>

  <rect x="40" y="140" width="240" height="40" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="160" y="157" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Intent model</text>
  <text x="160" y="171" font-size="8.5" fill="#4A5568" text-anchor="middle">2 Hz · 336 ms per evaluation</text>

  <rect x="40" y="210" width="240" height="40" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="160" y="227" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Chunk policy</text>
  <text x="160" y="241" font-size="8.5" fill="#4A5568" text-anchor="middle">20 Hz renewal · 40 ms inference</text>

  <rect x="40" y="280" width="240" height="40" rx="3" fill="#F8FAFC" stroke="#A0AEC0" stroke-width="1.2"/>
  <text x="160" y="297" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">State resynchronization</text>
  <text x="160" y="311" font-size="8.5" fill="#4A5568" text-anchor="middle">re-plan from measured state</text>

  <!-- observations to intent; intent goal to chunk policy -->
  <line x1="160" y1="110" x2="160" y2="138" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <line x1="160" y1="180" x2="160" y2="208" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>
  <text x="168" y="198" font-size="8.5" fill="#4A5568">goal</text>
  <!-- fresh observations also reach the chunk policy (left perimeter) -->
  <path d="M 40 90 L 30 90 L 30 230 L 38 230" fill="none" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <!-- resynchronization restarts the chunk policy -->
  <line x1="160" y1="280" x2="160" y2="252" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-slate)"/>

  <!-- ===== Right column ===== -->
  <rect x="400" y="70" width="220" height="40" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="510" y="87" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Encoders and scanner</text>
  <text x="510" y="101" font-size="8.5" fill="#4A5568" text-anchor="middle">measured state</text>

  <rect x="400" y="140" width="220" height="40" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.5"/>
  <text x="510" y="157" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Permission path</text>
  <text x="510" y="171" font-size="8.5" fill="#4A5568" text-anchor="middle">1 kHz tick</text>

  <rect x="400" y="210" width="220" height="40" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="510" y="227" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Drives</text>
  <text x="510" y="241" font-size="8.5" fill="#4A5568" text-anchor="middle">current and velocity loops</text>

  <rect x="400" y="280" width="220" height="40" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="510" y="297" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">Physical plant</text>
  <text x="510" y="311" font-size="8.5" fill="#4A5568" text-anchor="middle">mass, contact, payload</text>

  <line x1="510" y1="110" x2="510" y2="138" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-petrol)"/>
  <line x1="510" y1="180" x2="510" y2="208" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-pine)"/>
  <text x="518" y="198" font-size="8.5" fill="#1A4D3E">admitted command</text>
  <line x1="510" y1="250" x2="510" y2="278" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <!-- plant back to sensing (right perimeter) -->
  <path d="M 620 300 L 640 300 L 640 90 L 622 90" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- ===== Across the boundary ===== -->
  <!-- proposal: chunk of setpoints, dashed because it carries no authority -->
  <path d="M 280 224 L 320 224 L 320 154 L 398 154" fill="none" stroke="#B87333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <text x="370" y="147" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">proposal</text>
  <!-- refusal returns to resynchronization -->
  <path d="M 400 168 L 360 168 L 360 300 L 282 300" fill="none" stroke="#1A4D3E" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-pine)"/>
  <text x="322" y="293" font-size="8.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">refusal</text>
</svg>
