<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="180" height="180" fill="#ffffff"/>
  <!-- Log exceedance axis measured from p = 1 at x = 10; 23.5 px per decade (to scale). -->
  <!-- p99 budget: 1e-2 -> 2 decades -->
  <text x="10" y="16" font-size="13" fill="#333333">p99 budget</text>
  <rect x="10" y="22" width="47" height="20" fill="#5e6b73"/>
  <text x="33.5" y="36.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">0.01</text>
  <!-- mission (whole run): 1e-3 -> 3 decades -->
  <text x="10" y="62" font-size="13" fill="#333333">mission (whole run)</text>
  <rect x="10" y="68" width="70.5" height="20" fill="#5e6b73"/>
  <text x="45.25" y="82.6" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">0.001</text>
  <!-- per handoff: 1e-3 / 3000 = 3.3e-7 -> 6.48 decades -->
  <text x="10" y="108" font-size="13" fill="#333333">per handoff</text>
  <text x="10" y="123" font-size="13" fill="#333333">= mission ÷ 3000</text>
  <rect x="10" y="129" width="152.3" height="20" fill="#5e6b73"/>
  <text x="86" y="144" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3.3×10<tspan font-size="12" dy="-5">−7</tspan></text>
  <!-- axis with decade ticks -->
  <line x1="10" y1="155" x2="174.5" y2="155" stroke="#bbbbbb" stroke-width="1"/>
  <g stroke="#bbbbbb" stroke-width="1">
    <line x1="10" y1="155" x2="10" y2="159"/>
    <line x1="33.5" y1="155" x2="33.5" y2="159"/>
    <line x1="57" y1="155" x2="57" y2="159"/>
    <line x1="80.5" y1="155" x2="80.5" y2="159"/>
    <line x1="104" y1="155" x2="104" y2="159"/>
    <line x1="127.5" y1="155" x2="127.5" y2="159"/>
    <line x1="151" y1="155" x2="151" y2="159"/>
    <line x1="174.5" y1="155" x2="174.5" y2="159"/>
  </g>
  <text x="10" y="173" font-size="12" fill="#777777" text-anchor="middle" dx="2">1</text>
  <text x="174.5" y="173" font-size="12" fill="#777777" text-anchor="end">log scale, rarer →</text>
</svg>
