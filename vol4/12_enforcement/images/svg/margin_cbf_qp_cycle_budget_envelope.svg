<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 128" width="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- One declared 250 us WCET bar split into QP solve (150), other stages (70) and reserve (30), against the 400 us deadline.
       Linear scale: x = 10 + 0.42 px per us (0 us at x=10, 400 us at x=178). -->
  <rect x="0" y="0" width="200" height="128" fill="#ffffff"/>
  <!-- past the deadline -->
  <rect x="178" y="8" width="18" height="112" fill="#f2d7d5" opacity="0.35"/>
  <!-- deadline label, set beside its line -->
  <text x="174" y="22" font-size="14" fill="#cb202d" text-anchor="end">400 µs deadline</text>
  <!-- WCET bracket spanning 0-250 us -->
  <path d="M 10.5 54 L 10.5 48 L 114.5 48 L 114.5 54" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="10" y="42" font-size="14" fill="#333333">WCET 250</text>
  <!-- stacked bar -->
  <rect x="10" y="58" width="63" height="26" fill="#e67817" stroke="#ffffff" stroke-width="0.9"/>
  <rect x="73" y="58" width="29.4" height="26" fill="#5e6b73" stroke="#ffffff" stroke-width="0.9"/>
  <rect x="102.4" y="58" width="12.6" height="26" fill="#a3adb3" stroke="#ffffff" stroke-width="0.9"/>
  <text x="41.5" y="76" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">QP 150</text>
  <!-- deadline line -->
  <line x1="178" y1="8" x2="178" y2="120" stroke="#cb202d" stroke-width="1.8" stroke-dasharray="6.8,2.9"/>
  <!-- unloaded run, illustrative: small tick below the bar -->
  <line x1="66.7" y1="88" x2="66.7" y2="97" stroke="#4a5568" stroke-width="1.6"/>
  <text x="66.7" y="113" font-size="14" fill="#4a5568" text-anchor="middle">unloaded 135</text>
</svg>
