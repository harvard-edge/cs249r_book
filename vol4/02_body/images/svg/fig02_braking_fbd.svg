<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Braking free-body diagram of the running machine (Ch2).
       Vol IV roles (tex/theme-colors.tex): hardware in slate with sharp
       corners; the drive's torque and floor force in pine (structural);
       crimson only on the tip-over limit (consequence). Every number drawn
       here is pinned by check() in the body-braking-fbd-guard cell of
       02_body.qmd. Geometry is schematic, not to scale. -->
  <rect width="680" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 5 0 L 5 10" stroke="#4A5568" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- ==================== (a) side view ==================== -->
  <text x="24" y="26" font-size="10.5" font-weight="700" fill="#1A202C">(a) Loaded base braking, side view</text>

  <!-- floor -->
  <line x1="24" y1="252" x2="446" y2="252" stroke="#4A5568" stroke-width="1.4"/>
  <g stroke="#A0AEC0" stroke-width="0.8">
    <line x1="34" y1="252" x2="26" y2="260"/><line x1="64" y1="252" x2="56" y2="260"/>
    <line x1="94" y1="252" x2="86" y2="260"/><line x1="214" y1="252" x2="206" y2="260"/>
    <line x1="244" y1="252" x2="236" y2="260"/><line x1="274" y1="252" x2="266" y2="260"/>
    <line x1="394" y1="252" x2="386" y2="260"/><line x1="424" y1="252" x2="416" y2="260"/>
  </g>

  <!-- tote rack and arm (schematic) -->
  <rect x="96" y="96" width="120" height="66" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <line x1="96" y1="118" x2="216" y2="118" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="96" y1="140" x2="216" y2="140" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="156" y="112" font-size="8" fill="#64748B" text-anchor="middle">tote rack</text>
  <rect x="300" y="104" width="14" height="58" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
  <line x1="307" y1="104" x2="352" y2="74" stroke="#475569" stroke-width="5" stroke-linecap="square"/>
  <text x="330" y="66" font-size="8" fill="#64748B" text-anchor="middle">arm</text>

  <!-- chassis -->
  <rect x="68" y="162" width="304" height="58" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>

  <!-- wheels: rear caster, driven hub wheel, front caster (leading support) -->
  <line x1="92" y1="220" x2="92" y2="232" stroke="#334155" stroke-width="1.2"/>
  <circle cx="92" cy="242" r="10" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>
  <circle cx="160" cy="232" r="20" fill="#E3F0EC" stroke="#1A4D3E" stroke-width="1.6"/>
  <circle cx="160" cy="232" r="4" fill="#1A4D3E"/>
  <line x1="340" y1="220" x2="340" y2="232" stroke="#334155" stroke-width="1.2"/>
  <circle cx="340" cy="242" r="10" fill="#E2E8F0" stroke="#334155" stroke-width="1.2"/>

  <!-- center of gravity -->
  <circle cx="226" cy="150" r="7" fill="#ffffff" stroke="#1A202C" stroke-width="1.2"/>
  <path d="M 226 143 A 7 7 0 0 1 233 150 L 226 150 Z" fill="#1A202C"/>
  <path d="M 226 157 A 7 7 0 0 1 219 150 L 226 150 Z" fill="#1A202C"/>
  <text x="236" y="140" font-size="8.5" fill="#475569">CoG</text>

  <!-- weight -->
  <line x1="226" y1="158" x2="226" y2="204" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="232" y="200" font-size="9" font-style="italic" fill="#1A202C">mg</text>
  <!-- inertial load of the deceleration, acting forward at the CoG -->
  <line x1="234" y1="150" x2="286" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="258" y="176" font-size="9" fill="#1A202C" text-anchor="middle"><tspan font-style="italic">m a</tspan><tspan font-size="7" dy="2">brake</tspan></text>

  <!-- direction of travel -->
  <line x1="384" y1="118" x2="432" y2="118" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="408" y="110" font-size="8.5" fill="#4A5568" text-anchor="middle">travel, <tspan font-style="italic">v</tspan></text>

  <!-- h_cg dimension -->
  <line x1="204" y1="150" x2="204" y2="250" stroke="#4A5568" stroke-width="0.9" stroke-dasharray="3,2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="198" y="186" font-size="9" font-style="italic" fill="#1A202C" text-anchor="end">h<tspan font-size="7" dy="2">cg</tspan></text>
  <text x="198" y="206" font-size="8" fill="#64748B" text-anchor="end">unmeasured</text>

  <!-- d dimension: CoG to the leading support -->
  <line x1="226" y1="274" x2="340" y2="274" stroke="#4A5568" stroke-width="0.9" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="226" y1="252" x2="226" y2="280" stroke="#A0AEC0" stroke-width="0.7" stroke-dasharray="2,2"/>
  <text x="283" y="288" font-size="9" font-style="italic" fill="#1A202C" text-anchor="middle">d<tspan font-size="7" font-style="normal" dy="2">lead</tspan></text>

  <!-- normal loads -->
  <line x1="160" y1="300" x2="160" y2="256" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="166" y="298" font-size="9" fill="#1A202C"><tspan font-style="italic">φ mg</tspan></text>
  <line x1="352" y1="300" x2="352" y2="256" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="358" y="298" font-size="9" fill="#1A202C">casters</text>

  <!-- floor friction on the driven wheel, opposing travel -->
  <line x1="158" y1="262" x2="100" y2="262" stroke="#1A4D3E" stroke-width="2" marker-end="url(#arr-pine)"/>
  <text x="100" y="280" font-size="9" fill="#1A4D3E"><tspan font-style="italic">F</tspan> ≤ <tspan font-style="italic">μ φ mg</tspan></text>

  <!-- tip-over: pitching about the leading support -->
  <path d="M 384 206 A 44 44 0 0 1 380 244" fill="none" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
  <text x="392" y="220" font-size="8.5" fill="#A51C30">tips if</text>
  <text x="392" y="232" font-size="8.5" fill="#A51C30"><tspan font-style="italic">h</tspan><tspan font-size="6.5" dy="2">cg</tspan><tspan dy="-2">/</tspan><tspan font-style="italic">d</tspan><tspan font-size="6.5" dy="2">lead</tspan><tspan dy="-2" dx="3">&gt; 4.90</tspan></text>

  <!-- traction premise -->
  <text x="24" y="318" font-size="8.5" fill="#1A202C">Traction premise for <tspan font-style="italic">a</tspan><tspan font-size="6.5" dy="2">brake</tspan><tspan dy="-2">:</tspan>  <tspan font-style="italic">μ</tspan> ≥ 0.204 at <tspan font-style="italic">φ</tspan> = 1;  <tspan font-style="italic">μ</tspan> ≥ 0.250 at the rated <tspan font-style="italic">φ</tspan> = 0.815</text>

  <!-- ==================== (b) one hub wheel ==================== -->
  <rect x="466" y="12" width="198" height="312" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="478" y="30" font-size="10.5" font-weight="700" fill="#1A202C">(b) One driven hub wheel</text>

  <line x1="480" y1="232" x2="650" y2="232" stroke="#4A5568" stroke-width="1.4"/>
  <circle cx="565" cy="152" r="80" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="565" cy="152" r="30" fill="#E3F0EC" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="565" y="149" font-size="8" fill="#1A4D3E" text-anchor="middle">hub motor</text>
  <text x="565" y="160" font-size="8" fill="#1A4D3E" text-anchor="middle"><tspan font-style="italic">N</tspan><tspan font-size="6.5" dy="2">gear</tspan><tspan dy="-2" dx="2">= 1</tspan></text>

  <!-- braking torque (counterclockwise against clockwise rolling) -->
  <path d="M 612 118 A 58 58 0 0 0 518 118" fill="none" stroke="#1A4D3E" stroke-width="1.8" marker-end="url(#arr-pine)"/>
  <text x="565" y="60" font-size="9" fill="#1A4D3E" text-anchor="middle"><tspan font-style="italic">τ = K</tspan><tspan font-size="7" dy="2">t</tspan><tspan dy="-2" font-style="italic" dx="2">I</tspan><tspan font-size="7" dy="2">max</tspan><tspan dy="-2" dx="2">= 60 N·m</tspan></text>

  <!-- radius -->
  <line x1="565" y1="182" x2="565" y2="231" stroke="#4A5568" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="571" y="210" font-size="9" fill="#1A202C"><tspan font-style="italic">r</tspan> = 133 mm</text>

  <!-- contact force -->
  <line x1="563" y1="244" x2="496" y2="244" stroke="#1A4D3E" stroke-width="2" marker-end="url(#arr-pine)"/>
  <text x="572" y="248" font-size="9" fill="#1A4D3E"><tspan font-style="italic">F = τ/r</tspan> = 451 N</text>

  <text x="478" y="276" font-size="8.5" fill="#1A202C">two wheels: 902 N</text>
  <text x="478" y="292" font-size="8.5" fill="#1A202C">rotating parts in <tspan font-style="italic">m</tspan><tspan font-size="6.5" dy="2">eff</tspan><tspan dy="-2" dx="3">≤ 387 kg</tspan></text>
  <text x="478" y="308" font-size="8.5" fill="#1A202C">ceiling <tspan font-style="italic">F/m</tspan><tspan font-size="6.5" dy="2">eff</tspan><tspan dy="-2" dx="3">≥ 2.33 m/s²</tspan></text>
</svg>
