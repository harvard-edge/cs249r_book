<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1A4D3E"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#ffffff"/>

  <!-- ============ APPLICATION SoC (one die) ============ -->
  <rect x="20" y="20" width="410" height="262" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="32" y="38" font-size="10.5" font-weight="bold" fill="#1A202C">Application SoC: one die, one package</text>

  <!-- compute row -->
  <rect x="32" y="50" width="88" height="54" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.1"/>
  <text x="76" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">application</text>
  <text x="76" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">cores</text>
  <text x="76" y="97" font-size="8" fill="#4A5568" text-anchor="middle">Linux, proposer</text>

  <rect x="128" y="50" width="88" height="54" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.1"/>
  <text x="172" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">neural</text>
  <text x="172" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">accelerator</text>
  <text x="172" y="97" font-size="8" fill="#4A5568" text-anchor="middle">chunk policy</text>

  <rect x="224" y="50" width="88" height="54" rx="3" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.1"/>
  <text x="268" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">real-time</text>
  <text x="268" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">cluster</text>
  <text x="268" y="97" font-size="8" fill="#4A5568" text-anchor="middle">host domain</text>

  <!-- safety island: own crystal, rail, TCM -->
  <rect x="330" y="50" width="88" height="128" rx="3" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.1" stroke-dasharray="5,3"/>
  <text x="374" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">safety</text>
  <text x="374" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">island</text>
  <text x="374" y="97" font-size="8" fill="#4A5568" text-anchor="middle">not enabled</text>
  <text x="374" y="107" font-size="8" fill="#4A5568" text-anchor="middle">on the module</text>
  <rect x="340" y="116" width="68" height="16" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="127.5" font-size="8" fill="#1A202C" text-anchor="middle">own crystal</text>
  <rect x="340" y="136" width="68" height="16" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="147.5" font-size="8" fill="#1A202C" text-anchor="middle">own rail</text>
  <rect x="340" y="156" width="68" height="16" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="167.5" font-size="8" fill="#1A202C" text-anchor="middle">TCM, SRAM</text>

  <!-- shared die infrastructure (a tick on the die can lose these) -->
  <g font-size="9" fill="#1A202C" text-anchor="middle">
    <rect x="32" y="116" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="100" y="131">last-level cache</text>
    <rect x="176" y="116" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="244" y="131">DRAM controller</text>
    <rect x="32" y="144" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="100" y="159">clock governor</text>
    <rect x="176" y="144" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="244" y="159">core supply rail</text>
    <rect x="32" y="172" width="280" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="172" y="187">reset and boot chain</text>
  </g>
  <!-- on-chip fabric spans all four blocks; island sits behind a firewall -->
  <rect x="32" y="202" width="386" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
  <text x="172" y="217" font-size="9" fill="#1A202C" text-anchor="middle">on-chip fabric (carries proposals)</text>
  <line x1="374" y1="178" x2="374" y2="202" stroke="#1A4D3E" stroke-width="1.1"/>
  <rect x="340" y="185" width="68" height="12" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="194" font-size="8" fill="#1A4D3E" text-anchor="middle">firewall</text>
  <!-- die temperature and package: shared even by the island -->
  <rect x="32" y="234" width="386" height="36" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
  <text x="225" y="250" font-size="9" fill="#1A202C" text-anchor="middle">die temperature, package, heat path</text>
  <text x="225" y="263" font-size="8" fill="#4A5568" text-anchor="middle">shared by every block on the die</text>

  <!-- external DRAM -->
  <line x1="244" y1="282" x2="244" y2="298" stroke="#A51C30" stroke-width="1.2"/>
  <rect x="176" y="298" width="136" height="26" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
  <text x="244" y="315" font-size="9" fill="#1A202C" text-anchor="middle">LPDDR5 DRAM</text>

  <!-- placement badges (a) (b) (c) -->
  <g font-size="9" font-weight="bold" text-anchor="middle">
    <circle cx="112" cy="58" r="7.5" fill="#ffffff" stroke="#1A202C" stroke-width="1"/>
    <text x="112" y="61.2" fill="#1A202C">a</text>
    <circle cx="304" cy="58" r="7.5" fill="#ffffff" stroke="#1A202C" stroke-width="1"/>
    <text x="304" y="61.2" fill="#1A202C">b</text>
    <circle cx="410" cy="58" r="7.5" fill="#ffffff" stroke="#1A202C" stroke-width="1"/>
    <text x="410" y="61.2" fill="#1A202C">c</text>
  </g>

  <!-- ============ board link ============ -->
  <text x="455" y="182" font-size="8.5" font-weight="bold" fill="#1A202C" text-anchor="middle">board link</text>
  <text x="462" y="228" font-size="8" fill="#4A5568" text-anchor="middle">CRC, sequence</text>

  <!-- ============ DISCRETE SAFETY MCU ============ -->
  <rect x="502" y="20" width="158" height="220" rx="0" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="514" y="38" font-size="10.5" font-weight="bold" fill="#1A202C">Discrete safety MCU</text>
  <text x="514" y="51" font-size="8" fill="#4A5568">own package</text>
  <circle cx="645" cy="34" r="7.5" fill="#1A4D3E" stroke="#1A4D3E" stroke-width="1"/>
  <text x="645" y="37.2" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">d</text>
  <g font-size="9" fill="#1A202C" text-anchor="middle">
    <rect x="514" y="60" width="134" height="30" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="73" font-weight="bold">lockstep cores</text>
    <text x="581" y="85" font-size="8" fill="#4A5568">400 MHz, 1 kHz tick</text>
    <rect x="514" y="96" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="111">TCM, no shared DRAM</text>
    <rect x="514" y="124" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="139">own clock</text>
    <rect x="514" y="152" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="167">reset supervisor</text>
    <rect x="514" y="180" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="195">local mailbox</text>
  </g>
  <text x="581" y="224" font-size="8" fill="#4A5568" text-anchor="middle">only master of the drive bus</text>

  <!-- MCU to drives -->
  <path d="M600,240 V262" fill="none" stroke="#1A4D3E" stroke-width="1.3" marker-end="url(#arr-pine)"/>
  <rect x="534" y="264" width="126" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="597" y="281" font-size="9" fill="#1A202C" text-anchor="middle">EtherCAT to drives</text>

  <!-- isolated rail -->
  <rect x="502" y="310" width="158" height="30" rx="0" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1"/>
  <text x="581" y="323" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">isolated rail</text>
  <text x="581" y="335" font-size="8" fill="#4A5568" text-anchor="middle">2 s hold-up</text>
  <path d="M514,310 V240" fill="none" stroke="#1A4D3E" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- ============ common board supply ============ -->
  <rect x="20" y="356" width="640" height="28" rx="0" fill="#F4F6F9" stroke="#4A5568" stroke-width="1"/>
  <text x="340" y="374" font-size="9" fill="#1A202C" text-anchor="middle">battery and common board supply: shared by all four placements</text>
  <path d="M60,356 V282" fill="none" stroke="#4A5568" stroke-width="1.1" stroke-dasharray="3,2"/>
  <path d="M581,356 V340" fill="none" stroke="#4A5568" stroke-width="1.1" stroke-dasharray="3,2"/>
  <path d="M418,213 H478 V191 H513" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>
</svg>
