[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsysbook-forge"
version = "0.1.0"
description = "Optional, explicit experiment publishing for MLSysBook lessons"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
tracking = ["wandb>=0.22,<1"]
agents = ["wandb>=0.22,<1", "weave>=0.52,<1", "openai>=2,<3"]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlsysbook_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
