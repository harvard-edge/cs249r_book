<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
    <!-- token ruler: one tick per token slot, 10 px pitch -->
    <pattern id="tick-blue" width="10" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7dd3fc" stroke-width="1"/>
    </pattern>
    <pattern id="tick-green" width="10" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#86efac" stroke-width="1"/>
    </pattern>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="680" height="392" fill="#ffffff"/>

  <!-- ===== Zone headers, ordered by change rate ===== -->
  <text x="185" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Root</text>
  <text x="185" y="52" text-anchor="middle" font-size="12" fill="#475569">instructions, tools</text>
  <text x="340" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Trunk</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#475569">constraints, progress, source</text>
  <text x="490" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Leaf</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#475569">latest result</text>
  <text x="590" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Output</text>
  <text x="590" y="52" text-anchor="middle" font-size="12" fill="#475569">reserve</text>
  <path d="M130,70 H538" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="130" y="88" font-size="12" fill="#64748b">changes rarely</text>
  <text x="540" y="88" text-anchor="end" font-size="12" fill="#64748b">changes every call</text>
  <!-- ===== Row 1: call n ===== -->
  <text x="120" y="131" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">call <tspan font-style="italic">n</tspan></text>
  <text x="120" y="147" text-anchor="end" font-size="12" fill="#475569">cold start</text>
  <rect x="130" y="116" width="110" height="34" fill="#e0f2fe"/>
  <rect x="130" y="116" width="110" height="6" fill="url(#tick-blue)"/>
  <rect x="130" y="144" width="110" height="6" fill="url(#tick-blue)"/>
  <rect x="130" y="116" width="110" height="34" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="185" y="138" text-anchor="middle" font-size="13" fill="#0f172a">root</text>
  <rect x="240" y="116" width="200" height="34" fill="#e0f2fe"/>
  <rect x="240" y="116" width="200" height="6" fill="url(#tick-blue)"/>
  <rect x="240" y="144" width="200" height="6" fill="url(#tick-blue)"/>
  <rect x="240" y="116" width="200" height="34" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="340" y="138" text-anchor="middle" font-size="13" fill="#0f172a">trunk @ r17</text>
  <rect x="440" y="116" width="100" height="34" fill="#e0f2fe"/>
  <rect x="440" y="116" width="100" height="6" fill="url(#tick-blue)"/>
  <rect x="440" y="144" width="100" height="6" fill="url(#tick-blue)"/>
  <rect x="440" y="116" width="100" height="34" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="490" y="138" text-anchor="middle" font-size="13" fill="#0f172a">leaf <tspan font-style="italic">n</tspan></text>
  <rect x="540" y="116" width="100" height="34" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <!-- ===== Row 2: call n+1 ===== -->
  <text x="120" y="211" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">call <tspan font-style="italic">n</tspan>+1</text>
  <text x="120" y="227" text-anchor="end" font-size="12" fill="#475569">new observation</text>
  <rect x="130" y="196" width="110" height="34" fill="#dcfce7"/>
  <rect x="130" y="196" width="110" height="6" fill="url(#tick-green)"/>
  <rect x="130" y="224" width="110" height="6" fill="url(#tick-green)"/>
  <rect x="130" y="196" width="110" height="34" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="185" y="218" text-anchor="middle" font-size="13" fill="#0f172a">root</text>
  <rect x="240" y="196" width="200" height="34" fill="#dcfce7"/>
  <rect x="240" y="196" width="200" height="6" fill="url(#tick-green)"/>
  <rect x="240" y="224" width="200" height="6" fill="url(#tick-green)"/>
  <rect x="240" y="196" width="200" height="34" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="340" y="218" text-anchor="middle" font-size="13" fill="#0f172a">trunk @ r17</text>
  <rect x="440" y="196" width="100" height="34" fill="#e0f2fe"/>
  <rect x="440" y="196" width="100" height="6" fill="url(#tick-blue)"/>
  <rect x="440" y="224" width="100" height="6" fill="url(#tick-blue)"/>
  <rect x="440" y="196" width="100" height="34" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="490" y="218" text-anchor="middle" font-size="13" fill="#0f172a">leaf <tspan font-style="italic">n</tspan>+1</text>
  <rect x="540" y="196" width="100" height="34" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <rect x="440" y="196" width="10" height="34" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="438" y1="186" x2="438" y2="240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="432" y="182" text-anchor="end" font-size="12" fill="#b91c1c">first changed token</text>
  <!-- ===== Row 3: call n+2 ===== -->
  <text x="120" y="291" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">call <tspan font-style="italic">n</tspan>+2</text>
  <text x="120" y="307" text-anchor="end" font-size="12" fill="#475569">trunk refreshed</text>
  <rect x="130" y="276" width="110" height="34" fill="#dcfce7"/>
  <rect x="130" y="276" width="110" height="6" fill="url(#tick-green)"/>
  <rect x="130" y="304" width="110" height="6" fill="url(#tick-green)"/>
  <rect x="130" y="276" width="110" height="34" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="185" y="298" text-anchor="middle" font-size="13" fill="#0f172a">root</text>
  <rect x="240" y="276" width="200" height="34" fill="#e0f2fe"/>
  <rect x="240" y="276" width="200" height="6" fill="url(#tick-blue)"/>
  <rect x="240" y="304" width="200" height="6" fill="url(#tick-blue)"/>
  <rect x="240" y="276" width="200" height="34" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="340" y="298" text-anchor="middle" font-size="13" fill="#0f172a">trunk @ r18</text>
  <rect x="440" y="276" width="100" height="34" fill="#e0f2fe"/>
  <rect x="440" y="276" width="100" height="6" fill="url(#tick-blue)"/>
  <rect x="440" y="304" width="100" height="6" fill="url(#tick-blue)"/>
  <rect x="440" y="276" width="100" height="34" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="490" y="298" text-anchor="middle" font-size="13" fill="#0f172a">leaf <tspan font-style="italic">n</tspan>+2</text>
  <rect x="540" y="276" width="100" height="34" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <rect x="240" y="276" width="10" height="34" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="238" y1="266" x2="238" y2="320" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="232" y="262" text-anchor="end" font-size="12" fill="#b91c1c">first changed token</text>
  <!-- ===== Input limit ===== -->
  <line x1="540" y1="104" x2="540" y2="322" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <text xml:space="preserve" x="540" y="340" text-anchor="middle" font-size="12" fill="#475569"><tspan font-style="italic">S</tspan><tspan font-size="11" dy="3">max</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">K</tspan><tspan font-size="11" dy="3">max</tspan></text>
  <!-- ===== Key ===== -->
  <rect x="130" y="358" width="16" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="152" y="368" font-size="12" fill="#0f172a">prefix reused</text>
  <rect x="260" y="358" width="16" height="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="282" y="368" font-size="12" fill="#0f172a">processed</text>
  <rect x="380" y="358" width="16" height="12" fill="url(#hatch)" stroke="#94a3b8" stroke-width="1"/>
  <text xml:space="preserve" x="402" y="368" font-size="12" fill="#0f172a">output reserve <tspan font-style="italic">K</tspan><tspan font-size="11" dy="3">max</tspan></text>
</svg>
