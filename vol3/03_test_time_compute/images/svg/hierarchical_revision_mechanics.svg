<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-mini" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>

  <!-- ===== Trigger ===== -->
  <rect x="20" y="20" width="240" height="44" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="140" y="38" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">New evidence</text>
  <text x="140" y="55" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">removes support from an artifact</text>
  <path d="M140,64 V86" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Decisions ===== -->
  <path d="M40,128 L140,88 L240,128 L140,168 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="140" y="125" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dependents’ needs</text>
  <text x="140" y="141" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">still met?</text>
  <path d="M280,128 L380,88 L480,128 L380,168 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="380" y="125" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Task premises</text>
  <text x="380" y="141" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">still hold?</text>
  <path d="M240,128 H278" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="259" y="120" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">No</text>
  <path d="M480,128 H620 V208" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="500" y="120" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">No</text>
  <path d="M140,168 V208" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="150" y="192" font-size="12" font-weight="700" fill="#475569" text-anchor="start">Yes</text>
  <path d="M380,168 V208" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="390" y="192" font-size="12" font-weight="700" fill="#475569" text-anchor="start">Yes</text>

  <!-- ===== Outcome cards, each with the same dependency graph ===== -->
  <rect x="30" y="210" width="220" height="132" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="30.75" y="210.75" width="218.5" height="26" rx="2" fill="#e0f2fe"/>
  <text x="140" y="228" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Local repair</text>
  <rect x="101" y="252" width="28" height="28" rx="3" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M76,280 H92 V266 H107.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M92,280 V296 H107.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M122,266 H147.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M162,266 H187.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <rect x="64" y="274" width="12" height="12" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="115" cy="266" r="7" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="155" cy="266" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="195" cy="266" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="115" cy="296" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="140" y="328" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">replace one artifact</text>
  <rect x="270" y="210" width="220" height="132" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="270.75" y="210.75" width="218.5" height="26" rx="2" fill="#e0f2fe"/>
  <text x="380" y="228" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Subgraph resynthesis</text>
  <rect x="341" y="252" width="108" height="28" rx="3" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M316,280 H332 V266 H347.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M332,280 V296 H347.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M362,266 H387.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M402,266 H427.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <rect x="304" y="274" width="12" height="12" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="355" cy="266" r="7" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="395" cy="266" r="7" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="435" cy="266" r="7" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="355" cy="296" r="7" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="380" y="328" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">replace artifact + descendants</text>
  <rect x="510" y="210" width="220" height="132" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="510.75" y="210.75" width="218.5" height="26" rx="2" fill="#fee2e2"/>
  <text x="620" y="228" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Stop deliberation</text>
  <path d="M556,280 H572 V266 H587.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M572,280 V296 H587.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M602,266 H627.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <path d="M642,266 H667.5" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-mini)"/>
  <rect x="544" y="274" width="12" height="12" rx="1" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="595" cy="266" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="635" cy="266" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="675" cy="266" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="595" cy="296" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="620" y="328" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle">report unresolved or escalate</text>

  <!-- ===== Ordering axis ===== -->
  <path d="M30,366 H728" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="30" y="388" font-size="12" font-weight="400" fill="#475569" text-anchor="start">less support removed</text>
  <text x="730" y="388" font-size="12" font-weight="400" fill="#475569" text-anchor="end">more support removed</text>
</svg>
