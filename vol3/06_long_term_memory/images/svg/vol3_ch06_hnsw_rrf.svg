<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Hybrid retrieval narrows: two ranked lists (the chapter's B,A,D / C,A,E example), identity join + RRF
       with each bar built from 1/(k_rrf + rank) contributions at k_rrf = 60, a short pool to the cross-encoder, a small staged set. -->
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="316" fill="#ffffff"/>
  <!-- ===== Query ===== -->
  <rect x="20" y="126" width="80" height="54" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="60" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">query</text>
  <text x="60" y="166" text-anchor="middle" font-size="12" fill="#475569">symptom</text>
  <!-- ===== Candidate generators ===== -->
  <text x="130" y="40" font-size="13" font-weight="700" fill="#0f172a">lexical (BM25)</text>
  <rect x="130" y="50" width="96" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="130" y="50" width="8" height="24" rx="0" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="150" y="66" font-size="12" fill="#64748b">1</text>
  <text x="180" y="66" font-size="13" font-weight="700" fill="#0f172a">B</text>
  <rect x="130" y="80" width="96" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="130" y="80" width="8" height="24" rx="0" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="150" y="96" font-size="12" fill="#64748b">2</text>
  <text x="180" y="96" font-size="13" font-weight="700" fill="#0f172a">A</text>
  <rect x="130" y="110" width="96" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="130" y="110" width="8" height="24" rx="0" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="150" y="126" font-size="12" fill="#64748b">3</text>
  <text x="180" y="126" font-size="13" font-weight="700" fill="#0f172a">D</text>
  <text x="130" y="166" font-size="13" font-weight="700" fill="#0f172a">dense (ANN)</text>
  <rect x="130" y="176" width="96" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="130" y="176" width="8" height="24" rx="0" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
  <text x="150" y="192" font-size="12" fill="#64748b">1</text>
  <text x="180" y="192" font-size="13" font-weight="700" fill="#0f172a">C</text>
  <rect x="130" y="206" width="96" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="130" y="206" width="8" height="24" rx="0" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
  <text x="150" y="222" font-size="12" fill="#64748b">2</text>
  <text x="180" y="222" font-size="13" font-weight="700" fill="#0f172a">A</text>
  <rect x="130" y="236" width="96" height="24" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <rect x="130" y="236" width="8" height="24" rx="0" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
  <text x="150" y="252" font-size="12" fill="#64748b">3</text>
  <text x="180" y="252" font-size="13" font-weight="700" fill="#0f172a">E</text>
  <path d="M 126 52 H 121 V 124 H 126" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 126 178 H 121 V 250 H 126" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 100 153 H 108 V 88 H 120" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 108 153 V 214 H 120" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <!-- ===== Identity join + RRF ===== -->
  <rect x="270" y="20" width="200" height="272" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="284" y="40" font-size="13" font-weight="700" fill="#0f172a">join on identity</text>
  <text x="284" y="56" font-size="12" fill="#475569">scope, path, version, span</text>
  <text x="284" y="72" font-size="12" fill="#475569">r17 span ≠ r18 span</text>
  <text x="284" y="98" font-size="13" font-weight="700" fill="#0f172a">reciprocal rank fusion</text>
  <path d="M 232 52 H 238 V 126 H 232" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 232 178 H 238 V 252 H 232" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 238 89 H 250 V 160 H 267" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <path d="M 238 215 H 250 V 160" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <text x="294" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">A</text>
  <rect x="310" y="114" width="60.0" height="16" rx="0" fill="#86efac" stroke="#16a34a" stroke-width="0.8"/>
  <rect x="370.0" y="114" width="60.0" height="16" rx="0" fill="#4ade80" stroke="#16a34a" stroke-width="0.8"/>
  <rect x="310" y="114" width="120.0" height="16" rx="0" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="294" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">B</text>
  <rect x="310" y="144" width="61.0" height="16" rx="0" fill="#86efac" stroke="#16a34a" stroke-width="0.8"/>
  <text x="294" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">C</text>
  <rect x="310" y="174" width="61.0" height="16" rx="0" fill="#4ade80" stroke="#16a34a" stroke-width="0.8"/>
  <text x="294" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">D</text>
  <rect x="310" y="204" width="59.0" height="16" rx="0" fill="#86efac" stroke="#16a34a" stroke-width="0.8"/>
  <text x="294" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">E</text>
  <rect x="310" y="234" width="59.0" height="16" rx="0" fill="#4ade80" stroke="#16a34a" stroke-width="0.8"/>
  <text x="284" y="274" font-size="12" fill="#475569">bar segment: 1 / (<tspan font-style="italic">k</tspan><tspan font-size="12" dy="3">rrf</tspan><tspan dx="3" dy="-3">+ rank)</tspan></text>
  <path d="M 478 112 H 484 V 192 H 478" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <text x="490" y="98" font-size="12" font-weight="700" fill="#0369a1">short pool</text>
  <line x1="484" y1="152" x2="507" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="510" y="122" width="100" height="60" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="560" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">cross-</text>
  <text x="560" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">encoder</text>
  <text x="560" y="204" text-anchor="middle" font-size="12" fill="#475569">work grows with</text>
  <text x="560" y="219" text-anchor="middle" font-size="12" fill="#475569">pool and pair length</text>
  <line x1="610" y1="152" x2="637" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="640" y="106" width="60" height="92" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="670" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">stage</text>
  <rect x="650" y="136" width="40" height="22" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670" y="151" text-anchor="middle" font-size="12" fill="#15803d">r18</text>
  <rect x="650" y="164" width="40" height="22" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="670" y="179" text-anchor="middle" font-size="12" fill="#15803d">r18</text>
  <text x="670" y="216" text-anchor="middle" font-size="12" fill="#475569">payload</text>
  <text x="670" y="231" text-anchor="middle" font-size="12" fill="#475569">budget</text>
</svg>
