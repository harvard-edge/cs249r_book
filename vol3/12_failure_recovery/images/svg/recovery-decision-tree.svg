<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="462" fill="#ffffff"/>

  <!-- ===== Failure evidence ===== -->
  <rect x="210" y="22" width="200" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="310" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Failure evidence recorded</text>
  <path d="M310,56 V74" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 1: evidence class (selects which lanes exist) ===== -->
  <rect x="30" y="76" width="560" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">1 · Evidence class</text>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="#475569">unknown · established absent · established</text>

  <path d="M100,120 V144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M385,120 V144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- candidate groups (dashed = candidates, not yet admitted) -->
  <rect x="30" y="146" width="140" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="100" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Outcome unknown</text>
  <rect x="180" y="146" width="410" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="385" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Established absent or established</text>

  <!-- lanes: group to gate 2 (every candidate enters) -->
  <path d="M100,180 V230" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <!-- confirmed pre-execution rejection (established absent) may also enter retry lane -->
  <path d="M200,180 V208 H101" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="150" y="201" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">if absent</text>
  <path d="M240,180 V230" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M380,180 V230" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M520,180 V230" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 2: admissibility (filter) ===== -->
  <rect x="30" y="232" width="560" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">2 · Admissibility</text>
  <text x="310" y="268" text-anchor="middle" font-size="12" fill="#475569">authority · repeat contract · allowance with finalization reserve · deadline</text>

  <!-- none admissible exit -->
  <path d="M590,254 H680 V390" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="672" y="322" text-anchor="end" font-size="12" fill="#b91c1c">none</text>
  <text x="672" y="337" text-anchor="end" font-size="12" fill="#b91c1c">admissible</text>

  <!-- lanes: gate 2 to gate 3 (dashed = only admissible candidates survive) -->
  <path d="M100,276 V310" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M240,276 V310" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M380,276 V310" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M520,276 V310" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="170" y="297" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">survivors only</text>

  <!-- ===== Gate 3: expected cost (ranks survivors) ===== -->
  <rect x="30" y="312" width="560" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="331" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">3 · Expected cost at a matched endpoint</text>
  <text x="310" y="348" text-anchor="middle" font-size="12" fill="#475569">repair first when <tspan font-style="italic">p</tspan> &gt; <tspan font-style="italic">C</tspan><tspan font-size="12" dy="3">repair</tspan><tspan dy="-3"> / </tspan><tspan font-style="italic">C</tspan><tspan font-size="12" dy="3">fallback</tspan><tspan dy="-3">, per axis (seconds, dollars)</tspan></text>

  <!-- lanes: gate 3 to actions -->
  <path d="M100,356 V390" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M240,356 V390" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M380,356 V390" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M520,356 V390" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="170" y="377" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">ranked by cost</text>

  <!-- ===== Recovery actions ===== -->
  <rect x="40" y="392" width="120" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Retry</text>
  <text x="100" y="430" text-anchor="middle" font-size="12" fill="#475569">same operation</text>

  <rect x="180" y="392" width="120" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="240" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">New proposal</text>

  <rect x="320" y="392" width="120" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Repair</text>
  <text x="380" y="430" text-anchor="middle" font-size="12" fill="#475569">using feedback</text>

  <rect x="460" y="392" width="120" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Compensate</text>

  <rect x="620" y="392" width="120" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Hold or</text>
  <text x="680" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">escalate</text>
</svg>
