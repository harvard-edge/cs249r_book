<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#ffffff"/>
  <g transform="translate(0,6)">

  <!-- ===== Panel a: coverage of reference states ===== -->
  <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">(a) Training on reference states</text>

  <!-- corpus band -->
  <text x="30" y="46" font-size="12" fill="#6d28d9">states in the corpus</text>
  <rect x="30" y="54" width="380" height="52" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- reference chain -->
  <g stroke="#64748b" stroke-width="1.2" fill="none">
    <path d="M86,80 H122" marker-end="url(#arr-gray)"/>
    <path d="M156,80 H192" marker-end="url(#arr-gray)"/>
    <path d="M226,80 H262" marker-end="url(#arr-gray)"/>
    <path d="M318,80 H352" marker-end="url(#arr-gray)"/>
  </g>
  <g fill="#ffffff" stroke="#475569" stroke-width="1.2">
    <circle cx="70" cy="80" r="16"/>
    <circle cx="140" cy="80" r="16"/>
    <circle cx="210" cy="80" r="16"/>
    <circle cx="370" cy="80" r="16"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="70" y="85"><tspan font-style="italic">s</tspan><tspan font-size="11" dy="3">1</tspan></text>
    <text x="140" y="85"><tspan font-style="italic">s</tspan><tspan font-size="11" dy="3">2</tspan></text>
    <text x="210" y="85"><tspan font-style="italic">s</tspan><tspan font-size="11" dy="3">3</tspan></text>
    <text x="290" y="84" fill="#64748b">&#183; &#183; &#183;</text>
    <text x="370" y="85"><tspan font-style="italic">s</tspan><tspan font-size="11" font-style="italic" dy="3">H</tspan></text>
  </g>

  <!-- learner deviation: leaves the band and keeps drifting -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M140,96 V134 Q140,146 152,146 H184" marker-end="url(#arr-red)"/>
    <path d="M214,149 L254,156" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
    <path d="M284,159 L324,166" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  </g>
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2">
    <circle cx="200" cy="146" r="14"/>
    <circle cx="270" cy="156" r="14"/>
    <circle cx="340" cy="166" r="14"/>
  </g>
  <text x="130" y="128" text-anchor="end" font-size="12" fill="#b91c1c">learner deviates</text>
  <text x="270" y="200" text-anchor="middle" font-size="12" fill="#b91c1c">no recorded correction</text>

  <!-- reference-state bound -->
  <rect x="440" y="54" width="218" height="68" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="549" y="78" text-anchor="middle" font-size="12" fill="#475569">reference-state bound</text>
  <text x="549" y="106" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>) &#8722; <tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>*) &#8804; min{<tspan font-style="italic">H</tspan>, <tspan font-style="italic">H</tspan><tspan font-size="11" dy="-5">2</tspan><tspan font-style="italic" dy="5">&#949;</tspan><tspan font-size="11" dy="3">E</tspan><tspan dy="-3">}</tspan></text>

  <line x1="20" y1="218" x2="658" y2="218" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Panel b: labeling rounds ===== -->
  <text x="20" y="246" font-size="13" font-weight="700" fill="#0f172a">(b) Labeling learner-visited states</text>

  <!-- next-round return lane (perimeter) -->
  <path d="M610,284 V264 H70 V282" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="450" y="258" text-anchor="middle" font-size="12" fill="#475569">next round</text>

  <!-- stages: x = 25 + 108 i, width 90 -->
  <rect x="25" y="284" width="90" height="56" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <rect x="133" y="284" width="90" height="56" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="241" y="284" width="90" height="56" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="349" y="284" width="90" height="56" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="457" y="284" width="90" height="56" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="565" y="284" width="90" height="56" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="70" y="307">Run <tspan font-style="italic" font-weight="400">&#960;</tspan><tspan font-size="11" font-style="italic" font-weight="400" dy="3">k</tspan></text>
    <text x="178" y="307">Visited</text>
    <text x="178" y="324">states</text>
    <text x="286" y="307">Labeler</text>
    <text x="286" y="324">proposes</text>
    <text x="394" y="307">Sandbox</text>
    <text x="394" y="324">verifier</text>
    <text x="502" y="307">Aggregate</text>
    <text x="610" y="307">Retrain</text>
    <text x="610" y="326" font-weight="400"><tspan font-style="italic">&#960;</tspan><tspan font-size="11" font-style="italic" dy="3">k</tspan><tspan font-size="11" dy="0">+1</tspan></text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="70" y="326" fill="#b45309">ref. w.p. <tspan font-style="italic">&#955;</tspan><tspan font-size="11" font-style="italic" dy="3">k</tspan></text>
    <text x="502" y="326" font-size="11" fill="#6d28d9"><tspan font-style="italic">D</tspan><tspan font-size="10.6" font-style="italic" dy="3">k</tspan><tspan font-size="10.6" dy="0">+1</tspan><tspan dx="1" dy="-3">=</tspan><tspan dx="1" font-style="italic">D</tspan><tspan font-size="10.6" font-style="italic" dy="3">k</tspan><tspan dx="1" dy="-3">&#8746;</tspan><tspan dx="1">new</tspan></text>
  </g>
  <g stroke="#64748b" stroke-width="1.2" fill="none">
    <path d="M115,312 H131" marker-end="url(#arr-gray)"/>
    <path d="M223,312 H239" marker-end="url(#arr-gray)"/>
    <path d="M331,312 H347" marker-end="url(#arr-gray)"/>
    <path d="M439,312 H455" marker-end="url(#arr-gray)"/>
    <path d="M547,312 H563" marker-end="url(#arr-gray)"/>
  </g>

  <!-- verifier rejects: label discarded -->
  <path d="M394,340 V366" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="394" y="384" text-anchor="middle" font-size="12" fill="#475569">discard</text>

  <!-- fault-injected record, same mask vocabulary as the loss-masking figure -->
  <text x="25" y="368" font-size="12" font-weight="700" fill="#0f172a">Fault-injected record</text>
  <path d="M178,376 V342" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M25,382 V376 H321 V382" fill="none" stroke="#64748b" stroke-width="1"/>
  <rect x="25" y="386" width="96" height="28" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <rect x="125" y="386" width="96" height="28" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="225" y="386" width="96" height="28" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="73" y="404">injected error</text>
    <text x="173" y="404">diagnosis</text>
    <text x="273" y="404">corrective call</text>
  </g>
  <rect x="25" y="418" width="96" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="125" y="418" width="96" height="22" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="225" y="418" width="96" height="22" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="73" y="433" fill="#64748b"><tspan font-style="italic" font-weight="400">m</tspan><tspan font-size="11" font-style="italic" font-weight="400" dy="3">t</tspan><tspan dx="3" dy="-3">=</tspan><tspan dx="3">0</tspan></text>
    <text x="173" y="433" fill="#ffffff"><tspan font-style="italic" font-weight="400">m</tspan><tspan font-size="11" font-style="italic" font-weight="400" dy="3">t</tspan><tspan dx="3" dy="-3">=</tspan><tspan dx="3">1</tspan></text>
    <text x="273" y="433" fill="#ffffff"><tspan font-style="italic" font-weight="400">m</tspan><tspan font-size="11" font-style="italic" font-weight="400" dy="3">t</tspan><tspan dx="3" dy="-3">=</tspan><tspan dx="3">1</tspan></text>
  </g>

  <!-- learner-state bound -->
  <rect x="440" y="372" width="218" height="80" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="549" y="393" text-anchor="middle" font-size="12" fill="#475569">learner-state bound</text>
  <text x="549" y="411" text-anchor="middle" font-size="12" fill="#475569">disadvantage &#8804; <tspan font-style="italic">u</tspan></text>
  <text x="549" y="437" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>) &#8722; <tspan font-style="italic">J</tspan>(<tspan font-style="italic">&#960;</tspan>*) &#8804; min{<tspan font-style="italic">H</tspan>, <tspan font-style="italic">uH&#949;</tspan><tspan font-size="11" font-style="italic" dy="3">&#960;</tspan><tspan dy="-3">}</tspan></text>
  </g>
</svg>
