<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="540" fill="#ffffff"/>
  <defs>
    <style>
      .panel { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .name { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 12px; fill: #475569; text-anchor: middle; }
      .lbl { font-size: 13px; fill: #334155; text-anchor: middle; }
      .row { font-size: 13px; fill: #0f172a; }
    </style>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ================= (a) Prototype loop ================= -->
  <text x="20" y="30" class="panel">(a) Prototype loop</text>

  <!-- outside requests: nowhere to land -->
  <text x="290" y="60" class="lbl">pause, cancel</text>
  <text x="380" y="60" class="lbl">spend ceiling</text>
  <text x="470" y="60" class="lbl">approval</text>
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" fill="none">
    <line x1="290" y1="68" x2="290" y2="94"/>
    <line x1="380" y1="68" x2="380" y2="94"/>
    <line x1="470" y1="68" x2="470" y2="94"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.8" stroke-linecap="round">
    <line x1="284" y1="98" x2="296" y2="110"/><line x1="296" y1="98" x2="284" y2="110"/>
    <line x1="374" y1="98" x2="386" y2="110"/><line x1="386" y1="98" x2="374" y2="110"/>
    <line x1="464" y1="98" x2="476" y2="110"/><line x1="476" y1="98" x2="464" y2="110"/>
  </g>

  <!-- model and tools -->
  <rect x="20" y="110" width="140" height="46" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="90" y="138" class="name" fill="#0369a1">Model</text>
  <rect x="600" y="110" width="140" height="46" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="670" y="138" class="name" fill="#b45309">Tools</text>

  <!-- proposed call runs directly -->
  <line x1="160" y1="133" x2="598" y2="133" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="380" y="154" class="lbl">proposed call runs at once</text>

  <!-- return path through the message list -->
  <polyline points="670,156 670,195 462,195" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="300" y="180" width="160" height="30" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="380" y="200" class="name" style="font-size:13px" fill="#15803d">message list</text>
  <polyline points="300,195 90,195 90,158" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="380" y="230" class="sub">all state lives here</text>

  <line x1="20" y1="244" x2="740" y2="244" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ================= (b) Same loop inside a harness ================= -->
  <text x="20" y="280" class="panel">(b) The same loop inside a harness</text>

  <!-- outside requests land on the harness -->
  <text x="290" y="306" class="lbl">pause, cancel</text>
  <text x="380" y="306" class="lbl">spend ceiling</text>
  <text x="470" y="306" class="lbl">approval</text>
  <g stroke="#64748b" stroke-width="1.2" fill="none">
    <line x1="290" y1="314" x2="290" y2="338" marker-end="url(#arr-gray)"/>
    <line x1="380" y1="314" x2="380" y2="338" marker-end="url(#arr-gray)"/>
    <line x1="470" y1="314" x2="470" y2="338" marker-end="url(#arr-gray)"/>
  </g>

  <!-- harness -->
  <rect x="250" y="340" width="260" height="180" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="266" y="364" class="panel" fill="#6d28d9" style="fill:#6d28d9">Harness</text>
  <g fill="#ffffff" stroke="#c4b5fd" stroke-width="1">
    <rect x="266" y="376" width="228" height="28" rx="2"/>
    <rect x="266" y="410" width="228" height="28" rx="2"/>
    <rect x="266" y="444" width="228" height="28" rx="2"/>
    <rect x="266" y="478" width="228" height="28" rx="2"/>
  </g>
  <text x="280" y="395" class="row">Trajectory record</text>
  <text x="280" y="429" class="row">Guarded transitions</text>
  <text x="280" y="463" class="row">Control and approval paths</text>
  <text x="280" y="497" class="row">Budgets, reserved first</text>

  <!-- model and tools, same positions as (a) -->
  <rect x="20" y="404" width="140" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="90" y="427" class="name" fill="#0369a1">Model</text>
  <text x="90" y="445" class="sub">proposes only</text>
  <rect x="600" y="404" width="140" height="52" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="670" y="427" class="name" fill="#b45309">Tools</text>
  <text x="670" y="445" class="sub">settle outcomes</text>

  <!-- model <-> harness -->
  <line x1="160" y1="418" x2="248" y2="418" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="205" y="410" class="lbl">proposal</text>
  <line x1="250" y1="442" x2="162" y2="442" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="205" y="462" class="lbl">context</text>

  <!-- harness <-> tools -->
  <line x1="510" y1="418" x2="598" y2="418" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="555" y="410" class="lbl">admitted call</text>
  <line x1="600" y1="442" x2="512" y2="442" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="555" y="462" class="lbl">observation</text>
</svg>
