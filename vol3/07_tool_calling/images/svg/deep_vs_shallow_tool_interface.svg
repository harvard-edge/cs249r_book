<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="428" fill="#ffffff"/>

  <!-- ===== (a) Low-level composition ===== -->
  <text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">(a) Low-level composition</text>
  <text x="740" y="30" text-anchor="end" font-size="14" font-weight="700" fill="#0369a1">4 model calls</text>

  <text x="20" y="74" font-size="13" fill="#475569">trajectory</text>
  <text x="20" y="160" font-size="13" fill="#475569">tool</text>

  <!-- trajectory spine carrying state between calls -->
  <path d="M215,70 H285 M375,70 H445 M535,70 H605" fill="none" stroke="#16a34a" stroke-width="1.2"/>

  <rect x="125" y="50" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="170" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">call 1</text>
  <rect x="285" y="50" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="330" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">call 2</text>
  <rect x="445" y="50" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="490" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">call 3</text>
  <rect x="605" y="50" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="650" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">call 4</text>

  <!-- state the model must carry between calls -->
  <rect x="222" y="60" width="56" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="250" y="74" text-anchor="middle" font-size="12" fill="#15803d">handle</text>
  <rect x="382" y="60" width="56" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="410" y="74" text-anchor="middle" font-size="12" fill="#15803d">cursor</text>
  <rect x="540" y="60" width="60" height="20" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="570" y="74" text-anchor="middle" font-size="12" fill="#15803d">cleanup</text>

  <!-- interface line -->
  <path d="M100,115 H740" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="740" y="108" text-anchor="end" font-size="12" fill="#64748b">interface</text>

  <!-- round trips -->
  <path d="M160,90 V138" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M180,140 V92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M320,90 V138" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M340,140 V92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M480,90 V138" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M500,140 V92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M640,90 V138" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M660,140 V92" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- shallow operations -->
  <rect x="110" y="140" width="120" height="32" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="170" y="161" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Menlo, Courier New, monospace">open_file</text>
  <rect x="270" y="140" width="120" height="32" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="330" y="161" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Menlo, Courier New, monospace">seek_cursor</text>
  <rect x="430" y="140" width="120" height="32" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="490" y="161" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Menlo, Courier New, monospace">write_bytes</text>
  <rect x="590" y="140" width="120" height="32" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="650" y="161" text-anchor="middle" font-size="12.5" fill="#0f172a" font-family="Menlo, Courier New, monospace">close_file</text>

  <!-- divider -->
  <path d="M20,200 H740" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- ===== (b) Task-level operation ===== -->
  <text x="20" y="232" font-size="14" font-weight="700" fill="#0f172a">(b) Task-level operation</text>
  <text x="740" y="232" text-anchor="end" font-size="14" font-weight="700" fill="#0369a1">1 model call</text>

  <text x="20" y="276" font-size="13" fill="#475569">trajectory</text>
  <text x="20" y="362" font-size="13" fill="#475569">tool</text>

  <rect x="125" y="252" width="90" height="40" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="170" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">call 1</text>

  <!-- possible results, back in the trajectory -->
  <rect x="250" y="252" width="150" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="325" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">version conflict</text>
  <text x="420" y="277" text-anchor="middle" font-size="13" fill="#475569">or</text>
  <rect x="440" y="252" width="150" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="515" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">diff, new version</text>

  <!-- interface line -->
  <path d="M100,317 H740" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="740" y="310" text-anchor="end" font-size="12" fill="#64748b">interface</text>

  <!-- deep operation: obligations behind the interface -->
  <rect x="110" y="340" width="560" height="64" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="124" y="380" font-size="12.5" fill="#0f172a" font-family="Menlo, Courier New, monospace">apply_patch</text>
  <rect x="250" y="358" width="150" height="32" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="325" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">check version</text>
  <rect x="440" y="358" width="150" height="32" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="515" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">apply change</text>
  <path d="M400,374 H438" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <path d="M170,292 V338" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <path d="M515,358 V294" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M325,358 V294" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
</svg>
