<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="760" height="404" fill="#ffffff"/>
  <g transform="translate(10,12)">

  <!-- ===== Panel cards ===== -->
  <rect x="10" y="90" width="340" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="90" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="22" y="108" font-size="13" font-weight="700" fill="#0f172a">(a) <tspan font-weight="400" font-family="Courier New, monospace">one_for_one</tspan></text>
  <rect x="370" y="90" width="340" height="280" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="370" y="90" width="340" height="26" rx="2" fill="#e2e8f0"/>
  <text x="382" y="108" font-size="13" font-weight="700" fill="#0f172a">(b) <tspan font-weight="400" font-family="Courier New, monospace">one_for_all</tspan></text>
  <!-- blast-radius key in each header -->
  <rect x="216" y="97" width="16" height="12" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="238" y="108" font-size="12" fill="#b91c1c">blast radius</text>
  <rect x="576" y="97" width="16" height="12" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="598" y="108" font-size="12" fill="#b91c1c">blast radius</text>

  <!-- ===== Parent supervisor and tree edges ===== -->
  <rect x="290" y="18" width="140" height="36" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">parent supervisor</text>
  <path d="M330,54 V72 H180 V130" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M390,54 V72 H540 V130" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <!-- ===== (a) one_for_one ===== -->
  <rect x="120" y="130" width="120" height="34" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="151" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">supervisor</text>
  <path d="M180,164 V187 M75,210 V187 H285 V210 M180,187 V210" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <!-- blast radius: the failed worker only -->
  <rect x="129" y="200" width="102" height="64" rx="4" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="32" y="210" width="86" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="75" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <text x="75" y="244" text-anchor="middle" font-size="12" fill="#334155">continues</text>
  <rect x="137" y="210" width="86" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <text x="180" y="244" text-anchor="middle" font-size="12" fill="#b91c1c">failed</text>
  <rect x="242" y="210" width="86" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="285" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">worker</text>
  <text x="285" y="244" text-anchor="middle" font-size="12" fill="#334155">continues</text>
  <!-- restart -->
  <path d="M180,264 V309" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="188" y="291" font-size="12" fill="#0369a1">restart</text>
  <rect x="120" y="310" width="120" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="180" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">new attempt</text>
  <text x="180" y="344" text-anchor="middle" font-size="12" fill="#334155">own reservation</text>

  <!-- ===== (b) one_for_all ===== -->
  <rect x="480" y="130" width="120" height="34" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="151" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">supervisor</text>
  <path d="M540,164 V187 M435,210 V187 H645 V210 M540,187 V210" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <!-- blast radius: every coupled sibling -->
  <rect x="384" y="200" width="312" height="64" rx="4" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="392" y="210" width="86" height="44" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="435" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">interface</text>
  <text x="435" y="244" text-anchor="middle" font-size="12" fill="#334155">stopped</text>
  <rect x="497" y="210" width="86" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="540" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">caller</text>
  <text x="540" y="244" text-anchor="middle" font-size="12" fill="#b91c1c">failed</text>
  <rect x="602" y="210" width="86" height="44" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="645" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">test</text>
  <text x="645" y="244" text-anchor="middle" font-size="12" fill="#334155">stopped</text>
  <!-- group restart -->
  <path d="M435,264 V309" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M540,264 V309" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M645,264 V309" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="392" y="310" width="296" height="44" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="540" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">group restarts</text>
  <text x="540" y="344" text-anchor="middle" font-size="12" fill="#334155">new attempts from recorded inputs</text>

  <!-- ===== Escalation when restart intensity is exceeded ===== -->
  <path d="M600,147 H726 V36 H431" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="446" y="28" font-size="12" fill="#b91c1c">restart intensity exceeded: escalate</text>
  </g>
</svg>
