  - data-leakage-skew
  - experiment-management
  - retirement
  - cost-economics
- id: post-training-engineer
  label: Post-training engineer
  summary: Turns pretrained models into instruction-following, reasoning, and tool-using models through fine-tuning, preference
    optimization, and reinforcement learning, including the rollout inference inside the training loop.
  core:
  - post-training
  - fine-tuning
  - training-memory
  - parallelism-planning
  - llm-inference
  - generative-agent-eval
  working:
  - data-curation
  - test-time-compute
  - collectives
  - numerics
  - checkpoint-recovery
  - experiment-management
  - runtime-enforcement
- id: ml-data-engineer
  label: ML data engineer
  summary: Builds the data collection, curation, validation, and delivery that training and serving depend on.
  core:
