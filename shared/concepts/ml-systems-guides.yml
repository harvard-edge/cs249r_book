symptoms_note: Each symptom lists the concepts most often behind it, what to check, and what to change. Every check and lever
  must share a relationship with one of the listed causes, so the guide cannot point at an idea the graph does not connect
  to the problem. Causes are starting points for diagnosis, not a complete fault tree.
symptoms:
- id: training-oom
  label: Training runs out of accelerator memory
  signal: Out-of-memory errors when model size, batch, or sequence length grows, or reserved memory well above allocated memory
    (fragmentation).
  causes:
  - mlsys.training-state
  - mlsys.memory-footprint
  - mlsys.memory-fragmentation
  - mlsys.memory-capacity
  - mlsys.batch-size
  checks:
  - mlsys.profiling
  levers:
  - mlsys.activation-recompute
  - mlsys.state-sharding
  - mlsys.mixed-precision
  - mlsys.gradient-accumulation
  - mlsys.memory-offloading
  - mlsys.memory-efficient-optimizer
  - mlsys.memory-planning
  - mlsys.pipeline-parallel
- id: low-utilization
  label: Useful throughput is far below what the hardware can deliver
  signal: Model FLOPs utilization or step throughput well below what the workload's roofline allows, from idle gaps between
    kernels or steps, exposed communication, or pipeline bubbles.
  causes:
  - mlsys.bound-regime
  - mlsys.memory-bandwidth
  - mlsys.dispatch
  - mlsys.input-pipeline
  - mlsys.collectives
  - mlsys.pipeline-bubble
  checks:
  - mlsys.bottleneck-analysis
  - mlsys.cross-stack-profiling
  - mlsys.model-flops-utilization
  levers:
  - mlsys.fusion
  - mlsys.graph-replay
  - mlsys.device-streams
  - mlsys.persistent-kernel
  - mlsys.input-prefetching
  - mlsys.communication-overlap
  - mlsys.pipeline-schedule
  - mlsys.sequence-packing
- id: loss-spikes
  label: Training loss spikes or diverges
  signal: Sudden loss jumps, NaN or Inf values, or a run that stops improving after a change in scale or precision.
  causes:
  - mlsys.training-instability
  - mlsys.numerical-stability
  - mlsys.precision
  - mlsys.activation-outliers
  - mlsys.data-quality
  - mlsys.silent-data-corruption
  checks:
  - mlsys.training-diagnostics
  - mlsys.abft
  levers:
  - mlsys.gradient-clipping
  - mlsys.learning-rate-schedule
  - mlsys.normalization-layer
  - mlsys.loss-scaling
  - mlsys.accumulation-precision
  - mlsys.weight-initialization
  - mlsys.checkpoint
- id: collective-hang
  label: A distributed job hangs or times out
  signal: Ranks stall waiting in a collective, or the job times out with no error from the failing rank.
  causes:
  - mlsys.gray-failure
  - mlsys.process-group-rendezvous
  - mlsys.stragglers
  - mlsys.collectives
  checks:
  - mlsys.distributed-hang-diagnosis
  - mlsys.distributed-tracing
  levers:
  - mlsys.elastic-training
- id: slow-steps
  label: Step time varies and the job runs at the pace of its slowest worker
  signal: Per-step time with a long tail, or adding workers that adds little speed.
  causes:
  - mlsys.stragglers
  - mlsys.performance-interference
  - mlsys.gray-failure
  - mlsys.input-pipeline
  - mlsys.collectives
  - mlsys.thermal-dynamics
  checks:
  - mlsys.profiling
  - mlsys.distributed-tracing
  levers:
  - mlsys.variable-length-parallelism
  - mlsys.expert-placement
  - mlsys.traffic-classes
  - mlsys.congestion-control
  - mlsys.load-balancing-loss
  - mlsys.input-prefetching
  - mlsys.fine-grained-accelerator-sharing
- id: ttft-spike
  label: Time to first token rises under load
  signal: First tokens arrive late for some requests while decode speed looks normal.
  causes:
  - mlsys.ttft
  - mlsys.queueing
  - mlsys.prefill-decode
  - mlsys.arrival-burstiness
  - mlsys.cold-start
  checks:
  - mlsys.latency-percentiles
  - mlsys.workload-trace
  levers:
  - mlsys.prefix-cache
  - mlsys.pd-disaggregation
  - mlsys.autoscaling
  - mlsys.admission
  - mlsys.load-balancing
  - mlsys.non-prefix-kv-reuse
  - mlsys.dynamic-sparse-attention
  - mlsys.mmap-weights
- id: kv-exhaustion
  label: Serving runs out of KV-cache memory
  signal: Requests are preempted, recomputed, or rejected as context lengths or concurrency grow.
  causes:
  - mlsys.kv-cache
  - mlsys.context
  - mlsys.memory-fragmentation
  - mlsys.memory-footprint
  checks:
  - mlsys.inference-compute-estimate
  - mlsys.littles-law
  - mlsys.profiling
  levers:
  - mlsys.paged-kv
  - mlsys.kv-cache-quantization
  - mlsys.kv-cache-eviction
  - mlsys.kv-cache-offload
  - mlsys.prefix-cache
  - mlsys.admission
  - mlsys.reasoning-budget
  - mlsys.grouped-query-attention
  - mlsys.multi-head-latent-attention
  - mlsys.sliding-window-attention
- id: tail-latency
  label: p99 latency is far above the median
  signal: Most requests are fast, a few are much slower, and the gap widens with load or fan-out.
  causes:
  - mlsys.tail-latency
  - mlsys.queueing
  - mlsys.fan-out-tail-amplification
  - mlsys.arrival-burstiness
  - mlsys.performance-interference
  - mlsys.batching
  - mlsys.cold-start
  - mlsys.metastable-failure
  checks:
  - mlsys.latency-percentiles
  - mlsys.workload-trace
  levers:
  - mlsys.hedged-requests
  - mlsys.admission
  - mlsys.backpressure
  - mlsys.load-balancing
  - mlsys.autoscaling
  - mlsys.llm-request-scheduling
  - mlsys.gpu-partitioning
- id: quality-drop
  label: Production quality drops with no error or alert
  signal: Business metrics or user feedback worsen while the service stays up and offline evaluation still passes.
  causes:
  - mlsys.distribution-shift
  - mlsys.concept-drift
  - mlsys.train-serve-skew
  - mlsys.feedback-loop
  - mlsys.schema-evolution
  - mlsys.feature-freshness
  - mlsys.data-quality
  - mlsys.rollout
  checks:
  - mlsys.data-validation
  - mlsys.drift-detection
  - mlsys.monitoring
  - mlsys.ood-detection
  - mlsys.shadow-deployment
  - mlsys.integration-testing
  levers:
  - mlsys.retraining
  - mlsys.online-feature-consistency
  - mlsys.feature-store
  - mlsys.feature-backfill
  - mlsys.data-contract
  - mlsys.rollback
- id: offline-online-gap
  label: The model wins offline and loses online
  signal: A model that beats the baseline on held-out data does not improve, or hurts, the live metric.
  causes:
  - mlsys.train-serve-skew
  - mlsys.leakage
  - mlsys.proxy-objective
  - mlsys.selection-bias
  - mlsys.feedback-loop
  - mlsys.distribution-shift
  checks:
  - mlsys.shadow-deployment
  - mlsys.online-experiment
  - mlsys.integration-testing
  - mlsys.feature-attribution
  levers:
  - mlsys.point-in-time
  - mlsys.online-feature-consistency
  - mlsys.feature-store
  - mlsys.evaluation-split
  - mlsys.multiple-comparisons
- id: device-throttling
  label: On-device inference slows after a few minutes
  signal: During sustained use, latency rises as the device heats and clocks drop, or the battery drains faster than the workload
    should need.
  causes:
  - mlsys.thermal-dynamics
  - mlsys.tdp
  - mlsys.energy-per-inference
  levers:
  - mlsys.duty-cycling
  - mlsys.edge-npu
  - mlsys.always-on-cascade
  - mlsys.early-exit
  - mlsys.device-cloud-partitioning
  checks:
  - mlsys.energy-measurement
- id: serving-cost
  label: Serving cost grows faster than traffic
  signal: Cost per request or per token rises as usage grows, or capacity sits idle between peaks.
  causes:
  - mlsys.cost-per-token
  - mlsys.utilization
  - mlsys.reasoning-budget
  - mlsys.unit-cost
  - mlsys.workload
  checks:
  - mlsys.cost-attribution
  - mlsys.profiling
  levers:
  - mlsys.batching
  - mlsys.model-routing
  - mlsys.model-cascade
  - mlsys.semantic-cache
  - mlsys.reasoning-budget
  - mlsys.multi-model-serving
  - mlsys.gpu-partitioning
  - mlsys.autoscaling
  - mlsys.quantization
- id: over-refusal-complaints
  label: Users report that the assistant refuses harmless requests
  signal: Evaluations or reviewed reports show benign requests rejected, with traces showing whether an input filter, the
    model, or an output filter refused.
  causes:
  - mlsys.over-refusal
  - mlsys.guardrails
  - mlsys.decision-policy
  checks:
  - mlsys.sliced-evaluation
  - mlsys.calibration
  levers:
  - mlsys.guardrails
  - mlsys.cost-sensitive-decision
  - mlsys.preference-optimization
- id: runaway-agent
  label: An agent loops, overspends, or takes an unintended action
  signal: Runs that exceed step or cost limits, repeat tool calls, or act on injected instructions.
  causes:
  - mlsys.model-directed-control-flow
  - mlsys.coordination-failure
  - mlsys.prompt-injection
  - mlsys.confused-deputy
  - mlsys.irreversible-effects
  checks:
  - mlsys.llm-call-tracing
  - mlsys.agent-loop-detection
  levers:
  - mlsys.agent-budget
  - mlsys.agent-loop-detection
  - mlsys.approval-gate
  - mlsys.capability-based-security
  - mlsys.least-privilege
  - mlsys.agent-credentials
  - mlsys.information-flow-control
- id: slow-decode
  label: Token generation is slow even when lightly loaded
  signal: High time per output token that does not improve with spare capacity, or streaming that stutters as context or batch
    grows.
  causes:
  - mlsys.tpot
  - mlsys.memory-bandwidth
  - mlsys.prefill-decode
  checks:
  - mlsys.inter-token-latency
  - mlsys.roofline
  levers:
  - mlsys.speculative-decoding
  - mlsys.weight-only-quantization
  - mlsys.kv-cache-quantization
  - mlsys.grouped-query-attention
  - mlsys.pd-disaggregation
  - mlsys.graph-replay
- id: checkpoint-stall
  label: Training loses hours to checkpointing or recovery
  signal: Periodic step-time gaps at each save, or long recomputation after a failure because saves are infrequent.
  causes:
  - mlsys.checkpoint-io
  - mlsys.checkpoint-interval
  - mlsys.mtbf
  checks:
  - mlsys.training-goodput
  - mlsys.recovery-objectives
  levers:
  - mlsys.async-checkpointing
  - mlsys.incremental-checkpointing
  - mlsys.parallel-file-system
- id: rag-ungrounded
  label: Retrieval-augmented answers are wrong or out of date
  signal: Answers cite stale or irrelevant passages, miss recently updated documents, or state facts absent from the retrieved
    context.
  causes:
  - mlsys.hallucination
  - mlsys.retrieval
  - mlsys.dense-retrieval
  - mlsys.context-staleness
  - mlsys.context-degradation
  checks:
  - mlsys.llm-judge
  - mlsys.index-freshness
  levers:
  - mlsys.hybrid-retrieval
  - mlsys.reranking
  - mlsys.document-chunking
  - mlsys.context-selection
paths_note: Learning paths are authored reading orders through subjects for a stated goal. They are suggestions, not prerequisite
  claims; each step says why it comes where it does.
learning_paths:
- id: single-machine
  label: ML systems on one machine
  audience: A first course in ML systems, following Introduction to Machine Learning Systems.
  steps:
  - subject: requirements-slos
    why: Start from what the system must achieve; every later choice is judged against it.
  - subject: workload-characterization
    why: Count the compute, memory, and data a model needs before choosing hardware.
  - subject: roofline-locality
    why: Learn to tell whether a workload is limited by compute or by memory.
  - subject: memory-systems
    why: See why bandwidth, not arithmetic, usually sets the limit.
  - subject: accelerator-architecture
    why: See why accelerators are built the way they are.
  - subject: programming-models
    why: Learn how a framework turns a model into accelerator work.
  - subject: data-loading
    why: Feed training without starving the accelerator.
  - subject: training-optimization
    why: Train a model and see how optimization choices affect speed and stability.
  - subject: training-memory
    why: Fit parameters, optimizer state, and activations into device memory.
  - subject: profiling-utilization
    why: Measure where time actually goes before optimizing.
  - subject: model-compression
    why: Shrink a model to fit a budget.
  - subject: serving-architecture
    why: Serve it to users.
  - subject: monitoring
    why: Keep it working after launch.
- id: fleet
  label: Scaling to the fleet
  audience: Engineers who know single-node ML systems and now run training or serving across many machines.
  steps:
  - subject: speedup-limits
    why: Know what adding machines can and cannot buy.
  - subject: parallelism
    why: Learn the ways to split a model and its data.
  - subject: collectives
    why: Understand the communication that parallelism creates.
  - subject: node-interconnect
    why: See the fast links inside a node or scale-up domain first.
  - subject: network-fabrics
    why: Then the network that connects nodes.
  - subject: parallelism-planning
    why: Choose and place a parallelism plan for real hardware.
  - subject: storage-systems
    why: Feed data to the fleet and absorb concurrent checkpoint writes.
  - subject: hardware-faults
    why: Expect the crashes, gray failures, and silent corruption that scale makes routine.
  - subject: checkpoint-recovery
    why: Survive those failures without losing the run.
  - subject: cluster-scheduling
    why: Share the fleet among many jobs.
  - subject: queueing-models
    why: Relate load and variability to waiting time before sizing a service.
  - subject: capacity-provisioning
    why: Size and share serving capacity across tenants.
  - subject: energy-carbon
    why: Account for the power and carbon a fleet consumes.
- id: generative-agentic
  label: Generative and agentic systems
  audience: Engineers building LLM services and agents, following Agentic Machine Learning Systems.
  steps:
  - subject: requirements-slos
    why: Define task success, latency, spend, and action limits before choosing an architecture.
  - subject: llm-inference
    why: Learn how token generation uses memory and compute.
  - subject: structured-generation
    why: Control what the model emits.
  - subject: test-time-compute
    why: Spend extra inference to buy accuracy, and know what it costs.
  - subject: retrieval-rag
    why: Ground answers in external data.
  - subject: compound-ai
    why: Compose several models and tools into one system.
  - subject: tool-interfaces
    why: Let a model act through tools.
  - subject: access-isolation
    why: Limit what injected instructions and tools can reach.
  - subject: agent-harness
    why: Run the loop that decides each next step.
  - subject: context-memory
    why: Manage what the agent knows from step to step.
  - subject: durable-execution
    why: Make long runs survive failures without repeating effects.
  - subject: generative-agent-eval
    why: Measure whether the agent did the task, against the targets set at the start.
  - subject: runtime-enforcement
    why: Bound what it is allowed to do in production.
- id: physical
  label: Learned systems that act in the physical world
  audience: Engineers putting ML on robots and vehicles, following Physical AI.
  steps:
  - subject: hazards-operating-domain
    why: Define where the system may operate and what must never happen, before design choices.
  - subject: perception-sensing
    why: Turn sensor data into an understanding of the scene.
  - subject: state-estimation
    why: Track where the system and the things around it are.
  - subject: planning-control
    why: Choose and carry out actions.
  - subject: real-time-systems
    why: Meet the deadlines that physical action imposes.
  - subject: edge-embedded-hardware
    why: Run the time-critical parts on the machine itself.
  - subject: robot-learning
    why: Learn policies and close the gap between simulation and reality.
  - subject: runtime-enforcement
    why: Bound what learned components may command.
  - subject: verification-validation
    why: Gather closed-loop and scenario evidence that the system stays within its domain.
  - subject: safety-cases
    why: Argue, with that evidence, that it is safe enough to deploy.
- id: production
  label: Taking a model into production
  audience: Model developers and platform engineers moving a trained model into a tested, monitored production service.
  steps:
  - subject: requirements-slos
    why: Define the outcome, acceptance criteria, service targets, and budgets.
  - subject: objectives-decisions
    why: Tie the model's output to the decision it drives and the proxy it optimizes.
  - subject: data-quality
    why: Validate incoming data and keep feature definitions consistent.
  - subject: data-leakage-skew
    why: Rule out leakage and training-serving skew before trusting offline results.
  - subject: evaluation-protocols
    why: Design offline comparisons and online experiments that support the launch decision.
  - subject: pipelines-reproducibility
    why: Make the model-producing process repeatable.
  - subject: ml-testing
    why: Test data, model, and service integration before users see it.
  - subject: serving-architecture
    why: Choose how predictions reach consumers.
  - subject: release-management
    why: Roll out gradually with a working rollback.
  - subject: monitoring
    why: Watch service health and quality with production signals.
  - subject: incident-response
    why: Find and contain regressions when they happen.
  - subject: drift-retraining
    why: Decide when new evidence warrants a replacement model.
