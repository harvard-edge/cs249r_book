  - storage-systems
  - cluster-scheduling
  - speedup-limits
  - numerics
  - training-optimization
  - data-loading
- id: mlops-engineer
  label: ML platform and MLOps engineer
  summary: Builds the shared ML platform and runs the pipelines, releases, and monitoring that keep models reproducible, current,
    and correct in production.
  core:
  - pipelines-reproducibility
  - release-management
  - monitoring
  - drift-retraining
  - ml-platforms
  - data-lineage
  working:
