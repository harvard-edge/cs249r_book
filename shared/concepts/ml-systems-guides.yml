# Ways into the ML Systems Taxonomy for specific readers: roles, production symptoms, and learning paths.
# Every reference is a subject (row) or concept identity; the compiler rejects unknown ones, and rejects a symptom
# check or lever that shares no relationship with one of that symptom's causes.
schema_version: 1
roles_note: Role profiles name the subjects an interviewer or hiring manager in that role would expect a strong engineer to
  know (core) and to be able to work with (working). They describe knowledge, not seniority; depth comes from the level at
  which a question or task is posed.
roles:
- id: inference-engineer
  label: ML inference and serving engineer
  summary: Builds and operates the systems that answer model requests within latency, throughput, and cost targets.
  core:
  - serving-architecture
  - latency-goodput
  - request-scheduling
  - llm-inference
  - model-compression
  - profiling-utilization
  working:
  - requirements-slos
  - queueing-models
  - runtime-dispatch
  - memory-systems
  - parallelism
  - capacity-provisioning
  - failure-semantics
  - monitoring
  - cost-economics
- id: training-infra-engineer
  label: Training infrastructure engineer
  summary: Makes large training jobs fit, scale, and survive failures across accelerators and nodes.
  core:
  - parallelism
  - parallelism-planning
  - collectives
  - training-memory
  - checkpoint-recovery
  - profiling-utilization
  working:
  - hardware-faults
  - node-interconnect
