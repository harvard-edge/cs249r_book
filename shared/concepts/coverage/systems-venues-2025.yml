# Recorded coverage judgments; numbers come from `binder concepts coverage`.
schema_version: 1
id: systems-venues-2025
title: ML systems papers at OSDI, SOSP, NSDI, EuroSys, and ASPLOS 2025
basis: '135 machine-learning-systems papers from the 2025 programs of OSDI, SOSP, NSDI, EuroSys, and ASPLOS, compiled by one
  model (gpt-6.1-sol, from official program pages, without access to the taxonomy) and judged against 0.3-draft by a second
  (gemini-4-argon-high), with every partial re-judged by a third (claude-opus-5-5); a topic is covered only when a concept
  definition names its central mechanism. Held out at first measurement (2026-10-27, 0.3-draft: 51.1% covered by a concept
  and 100% homed); the recurring gaps it surfaced (two or more independent papers) were then closed in 0.3, so it now serves
  as a design input.'
held_out: false
