schema_version: 1
id: mlsysbook-taxonomy
status: editorial-draft
title: MLSysBook Taxonomy of Machine Learning Systems
scope: Engineering systems that learn from data. This pilot distinguishes subject hierarchy from navigation
  collections and conditional technical relationships.
sources:
- id: skos
  title: W3C SKOS Reference
  url: https://www.w3.org/TR/skos-reference/
  role: Representation standard; not a subject inventory or endorsement.
- id: cs2023
  title: CS2023 knowledge areas
  url: https://csed.acm.org/knowledge-areas/
  role: Broad curriculum comparison; no exact concept mappings asserted.
- id: dlsys
  title: Deep Learning Systems
  url: https://dlsyscourse.org/
  role: Systems topic comparison; no per-edge verification asserted.
- id: mlperf
  title: MLCommons benchmarks
  url: https://mlcommons.org/benchmarks/
  role: Measurement scope comparison; not completeness evidence.
topics:
- id: mlsys.topic.parallel-execution
  label: Parallel execution strategies
  definition: Strategies for partitioning or replicating computation and state so work can execute concurrently.
  status: draft
- id: mlsys.topic.learning-paradigms
  label: Learning paradigms
  definition: Approaches to learning distinguished by their training signals, observations, and interaction
    with an environment.
  status: draft
hierarchy:
- narrower: mlsys.data-parallel
  broader: mlsys.topic.parallel-execution
  rationale: Replicates model computation over different examples while coordinating learning state.
  status: draft
- narrower: mlsys.tensor-parallel
  broader: mlsys.topic.parallel-execution
  rationale: Partitions tensor operations and state for concurrent execution.
  status: draft
- narrower: mlsys.pipeline-parallel
  broader: mlsys.topic.parallel-execution
  rationale: Partitions computation into concurrently executing stages.
  status: draft
- narrower: mlsys.supervised-learning
  broader: mlsys.topic.learning-paradigms
  rationale: A learning approach distinguished by the source and structure of training signals; sibling
    topics may overlap.
  status: draft
- narrower: mlsys.self-supervised-learning
  broader: mlsys.topic.learning-paradigms
  rationale: A learning approach distinguished by the source and structure of training signals; sibling
    topics may overlap.
  status: draft
- narrower: mlsys.unsupervised-learning
  broader: mlsys.topic.learning-paradigms
  rationale: A learning approach distinguished by the source and structure of training signals; sibling
    topics may overlap.
  status: draft
- narrower: mlsys.reinforcement-learning
  broader: mlsys.topic.learning-paradigms
  rationale: A learning approach distinguished by the source and structure of training signals; sibling
    topics may overlap.
  status: draft
- narrower: mlsys.imitation-learning
  broader: mlsys.topic.learning-paradigms
  rationale: A learning approach distinguished by the source and structure of training signals; sibling
    topics may overlap.
  status: draft
collections:
- id: mlsys.collection.objectives
  label: Objectives and decisions
  scope_note: What should the system achieve, and within which limits?
  family: objectives
- id: mlsys.collection.data
  label: Data and representation
  scope_note: What information reaches learning and execution?
  family: data
- id: mlsys.collection.models
  label: Model regimes
  scope_note: How does model structure change computation and behavior?
  family: models
- id: mlsys.collection.learning
  label: Learning and experimentation
  scope_note: How should learning work and experimental effort be allocated?
  family: learning
- id: mlsys.collection.execution
  label: Numerical execution
  scope_note: How does a mathematical model become machine work?
  family: execution
- id: mlsys.collection.hardware
  label: Hardware and performance
  scope_note: Which physical resource limits useful work?
  family: hardware
- id: mlsys.collection.distributed
  label: Distributed execution and state
  scope_note: How do communication and failures affect collective work?
  family: distributed
- id: mlsys.collection.serving
  label: Serving and capacity
  scope_note: How are requests admitted, executed, and completed?
  family: serving
- id: mlsys.collection.evaluation
  label: Evaluation and uncertainty
  scope_note: What does the evidence justify?
  family: evaluation
- id: mlsys.collection.operations
  label: Operations and recovery
  scope_note: How is behavior maintained after deployment?
  family: operations
- id: mlsys.collection.trust
  label: Security, privacy, and responsibility
  scope_note: Whose data, authority, and outcomes need protection?
  family: trust
- id: mlsys.collection.economics
  label: Energy and economics
  scope_note: What does useful work cost over the system lifecycle?
  family: economics
- id: mlsys.collection.agents
  label: Agent systems
  scope_note: How are model-directed trajectories bounded and evaluated?
  family: agents
- id: mlsys.collection.physical
  label: Physical systems
  scope_note: When is a computed action feasible and admissible?
  family: physical
- id: mlsys.collection.retrieval
  label: Retrieval and search
  scope_note: How is relevant information located within a resource budget?
  family: retrieval
top_concepts:
- mlsys.topic.parallel-execution
- mlsys.topic.learning-paradigms
