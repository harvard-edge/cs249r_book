tagging_rules:
- Tag an item with the one to three concepts it centrally teaches or tests. Do not tag prerequisites or passing mentions.
- Tag a subject alone when the item covers the subject broadly or no concept is specific enough. A subject tag is a valid,
  complete tag.
- When no concept fits, tag the closest subject and record the missing idea as a proposed concept; proposals feed the next
  version.
- Store concept identities (mlsys.kv-cache) and subject identities, not codes; codes can be renumbered between versions and
  identities cannot.
- When a concept seems to belong to two subjects, use its home and follow the home rule and its worked examples; related subjects
  are navigation, not alternative tags.
- Do not tag a workload-class concept (Large language model, Transformer) only because the item involves one; tag it when
  the item is about that workload class.
- Depth is recorded separately (for example, StaffML levels L1 to L6+). A competency is a concept or subject paired with a
  depth.
- When a concept is retired, its identity maps to the concept named in replaced_by. When a concept is split, the old identity
  is retired and existing tags are re-reviewed; until then they resolve to the replacement.
placement_examples:
- concept: mlsys.kv-cache
  home: llm-inference
  why: Implements generative serving; it exists for speed but is part of how decoding works.
- concept: mlsys.kv-cache-quantization
  home: model-compression
  why: Its only purpose is efficiency, and the same technique applies to weights and activations across layers.
- concept: mlsys.speculative-decoding
  home: llm-inference
  why: Changes how the serving stage generates tokens.
- concept: mlsys.activation-recompute
  home: training-memory
  why: Implements a training-stage memory plan.
- concept: mlsys.carbon-aware-scheduling
  home: energy-carbon
  why: Its only purpose is lower carbon, and it applies to training, batch inference, and data jobs alike.
- concept: mlsys.fusion
  home: ml-compilers
  why: Implements the compiler layer.
- concept: mlsys.dp-sgd
  home: privacy-dp
  why: Its only purpose is privacy.
