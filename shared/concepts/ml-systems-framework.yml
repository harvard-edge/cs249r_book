row_rule: A row identifies a body of engineering knowledge with mechanisms, assumptions, and failure modes. Activities/layers/concerns/contexts
  are relevance facets, not substitute row identities.
secondary_policy: Explicit secondary associations are editorial candidates subjected to placement review; not duplicate
  identities or independent semantic verification. They do not change the unique browsing home.
warrant_policy: Warrants identify an established reading or framework lens for the row scope. They are not verified
  exact matches, endorsements, complete evidence for every contained concept, or book-coverage proof. Narrow technical
  assertions still need concept/edge-level sources; sparse warrants are not padded to a quota.
scope: A candidate classification of the engineering knowledge needed to construct, evaluate, deploy, and operate
  machine learning systems, including generative, agentic, and physical settings. The focus is systems for ML; using
  ML to optimize unrelated systems is adjacent. This is a scoped editorial proposal, not an exhaustive or community-validated
  definition of the field.
