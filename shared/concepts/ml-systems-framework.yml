context_policy: Context vocabulary is proposed. Empty row contexts means not assessed. No automatic context assignment;
  relevance will not imply all constituent mechanisms apply universally.
rationale:
- Exactly one home supports predictable browsing; related relationships and facets expose legitimate cross-area
  connections.
- Energy/carbon/cost have explicit accounting concepts in system formulation, with sustainability and cost concern
  facets across relevant rows.
- Distillation is placed with adaptation/experimental methods rather than treated as a numerical data type; quantization/sparsity
  remain compact execution methods with model-quality links.
- Tokenization is placed with representations although its implementation is also a data pipeline and runtime concern.
- Automatic differentiation is placed under numerical software because it is a computation mechanism; optimization
  remains learning.
- Agent trajectory evaluation is grouped with other context-sensitive evaluation rather than isolated in an agent
  silo.
- Physical/control foundations are explicit under interaction/action/control, while timing spans runtime/infrastructure
  and assurance spans evaluation.
- Fairness, privacy, and security are distinct method subjects and concern facets; responsibility is an editorial
  collection, not a claim of interchangeable properties.
- Irreversible effects sits with action boundaries instead of implying rollback can undo externally committed effects.
- 'Model artifacts and artifact versioning are separate subjects: the learned entity versus the engineering practice.'
- The candidates are authored synthesis for review and do not certify complete field or book coverage.
- Federated learning now has its own knowledge row rather than being grouped with distributed action failure semantics.
- Timing analysis and physical motion/contact feasibility are distinct bodies of knowledge.
- Human oversight has its home under responsibility and a secondary association with closed-loop decision systems.
- Unpopulated candidate rows identify knowledge areas for inventory work; they make no claim of missing book coverage.
