# Candidate subject framework. Concept definitions remain in ml-systems-field.yml.
schema_version: 1
id: mlsys-subject-framework-candidate
status: editorial-draft
title: 'Machine learning systems: candidate organizing framework'
relationship_semantics: Each concept has one candidate browsing home row. Areas and rows are editorial subject collections,
  not exclusive classes, prerequisite claims, or replacements for the strict SKOS hierarchy pilot.
