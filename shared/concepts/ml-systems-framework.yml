    - data
    - learn
    - evaluate
    - operate
    layers:
    - application
    - model
    - environment
    concerns:
    - quality
    - reliability
    contexts: []
    status: draft
    includes:
    - Event-time validity, leakage, training-serving differences, changing distributions, and delayed labels/outcomes.
