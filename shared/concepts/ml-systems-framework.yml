    behavior. Reading basis, not independent assertion validation.
- id: iceberg-schema
  title: 'Apache Iceberg specification: Schema evolution'
  url: https://iceberg.apache.org/spec/#schema-evolution
  role: Describes adding/deleting/renaming/reordering fields, permitted type promotions, schema IDs, and compatibility
    mechanisms for that format. Reading basis, not independent assertion validation.
- id: oracle-survey
  title: 'The Oracle Problem in Software Testing: A Survey'
  url: https://philmcminn.com/publications/barr2015.pdf
  role: Author-hosted paper distinguishing desired from incorrect observed behavior; includes specifications, partial
    oracles, metamorphic relations, and human judgment. Reading basis, not independent assertion validation.
- id: sre-testing
  title: 'Google SRE: Testing for Reliability'
  url: https://sre.google/sre-book/testing-reliability/
  role: Defines integration/system tests and discusses statistical fault-oriented testing; passing tests does not
    prove reliability. Reading basis, not independent assertion validation.
- id: chaos-principles
  title: Principles of Chaos Engineering
  url: https://principlesofchaos.org/
  role: Authors describe experiments with disruptive events, observable steady-state hypotheses, and containing
    experimental impact; production experiments are not required by our concept. Reading basis, not independent
    assertion validation.
- id: mlflow-dependencies
  title: 'MLflow: Managing Dependencies in Models'
  url: https://mlflow.org/docs/latest/ml/model/dependencies/
  role: Documents model environment metadata, dependencies, direct/transitive version locking, and inference limitations;
    locking does not guarantee identical execution. Reading basis, not independent assertion validation.
- id: kfp-pipeline
  title: 'Kubeflow Pipelines: Pipeline concepts'
  url: https://www.kubeflow.org/docs/components/pipelines/concepts/pipeline/
  role: Describes component ordering, conditions, parameters/artifacts, caching, retries, and orchestration; an
    implementation example rather than a universal DAG requirement. Reading basis, not independent assertion validation.
- id: pytorch-reproducibility
  title: 'PyTorch: Reproducibility'
  url: https://docs.pytorch.org/docs/2.14/notes/randomness.html
  role: States limits across versions/platforms and distinguishes randomness controls, algorithm determinism, and
    associated performance tradeoffs. Reading basis, not independent assertion validation.
- id: cuda-model
  title: 'CUDA Programming Guide: Programming Model'
  url: https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html
  role: A vendor example of accelerator execution and memory organization; not a universal accelerator definition.
- id: nvidia-smi
  title: NVIDIA System Management Interface documentation
  url: https://docs.nvidia.com/deploy/nvidia-smi/index.html
  role: Vendor-specific power limits, thermal slowdown, and operating telemetry; not a physical-system safety qualification.
- id: book-hardware
  title: MLSysBook hardware acceleration and physical placement
  url: https://mlsysbook.ai/vol1/
  role: 'Internal manuscript reading basis: Volume I hardware acceleration, Volume II compute infrastructure, and
    Volume IV placement. Electrical and thermal scope remains draft.'
areas:
- id: formulation
  label: System formulation and accounting
  question: What should the system achieve, and within which constraints?
  scope: Framing decisions, intended outcomes, workloads, and resource consequences.
  rows:
  - id: requirements
    label: Requirements and workloads
    definition: Describe intended use, acceptance targets, and the work presented to a system.
    concepts:
    - mlsys.requirements
    - mlsys.baseline
    - mlsys.slo
    - mlsys.workload
    activities:
    - define
    - evaluate
    - operate
    layers:
    - application
    - environment
    concerns:
    - quality
    - performance
    - reliability
    contexts: []
    status: draft
    includes:
    - Requirements elicitation, acceptance criteria, baselines, and workload specification.
    excludes:
    - Requirements do not by themselves demonstrate achieved quality or constitute a prescribed project phase.
    warrants:
    - se4ml
    - sre
    warrant_role: reading-scope-not-exact-semantic-match
    secondary_concepts: []
    display_label: Requirements & workloads
  - id: decision-design
    label: Objectives and decisions
    definition: Connect optimized signals to decisions and intended outcomes.
    concepts:
    - mlsys.proxy-objective
    - mlsys.decision-policy
    - mlsys.reward-hacking
    activities:
    - define
    - learn
    - evaluate
    layers:
    - application
    - model
    concerns:
    - quality
    - fairness
    - human-control
    contexts: []
    status: draft
    includes:
    - Proxy objectives, decision policies, intended utility, and the gap between optimized signals and outcomes.
    excludes:
    - Exclude the optimization algorithm implementation and claims that proxy improvement guarantees real-world
      benefit.
    warrants:
    - rules
    - ml-test-score
    warrant_role: reading-scope-not-exact-semantic-match
    secondary_concepts: []
    display_label: Objectives & decisions
  - id: system-accounting
    label: Energy, carbon, and cost
    definition: Account for useful outcomes and resource consequences within explicit boundaries.
    concepts:
    - mlsys.energy
    - mlsys.carbon
    - mlsys.unit-cost
    activities:
    - define
    - evaluate
    - deploy
    - operate
    - retire
    layers:
    - application
    - infrastructure
    - environment
    concerns:
    - performance
    - sustainability
    - cost
    contexts: []
    status: draft
    includes:
    - Operational energy, lifecycle carbon, monetary unit cost, and capacity budgets under declared accounting boundaries.
    excludes:
    - Do not equate energy, carbon, and money; do not infer whole-lifecycle impact from device power or observed
      throughput alone.
    warrants:
    - green
    - bloom-carbon
    - sre
    warrant_role: reading-scope-not-exact-semantic-match
    secondary_concepts:
    - mlsys.capacity-planning
    - mlsys.utilization
    display_label: Energy, carbon, cost
  display_label: Formulation & accounting
- id: data
