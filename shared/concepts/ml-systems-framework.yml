# Candidate body of knowledge for ML systems. Concept definitions remain in ml-systems-field.yml.
schema_version: 1
id: mlsys-subject-framework-candidate
status: editorial-draft
version: 0.2-draft
title: 'Machine learning systems: a candidate body of knowledge'
scope: A candidate classification of the engineering knowledge needed to construct, evaluate, deploy, and operate machine
  learning systems, including generative, agentic, and physical settings. The focus is systems for ML; using ML to optimize
  unrelated systems is adjacent. This is a scoped editorial proposal, not an exhaustive or community-validated definition
  of the field.
relationship_semantics: Each concept has one candidate browsing home row. Areas and rows are editorial subject collections,
  not exclusive classes, prerequisite claims, or replacements for the strict SKOS hierarchy pilot.
groups:
- id: foundations
  code: F
  label: Foundations
  question: What does the system compute, what must it achieve, and how do we reason about its cost?
- id: stack
  code: S
  label: Stack
  question: What does the system run on, from silicon to the fleet?
- id: lifecycle
  code: P
  label: Lifecycle
  question: What do engineers do to build, ship, and keep the system working?
- id: qualities
  code: Q
  label: Qualities
  question: By which properties is the system judged, and how are they engineered?
- id: system-types
  code: T
  label: System types
  question: What is distinctive when the system acts as an agent or in the physical world?
areas:
- id: workloads-requirements
  code: F1
  group: foundations
  label: Workloads & requirements
  display_label: Workloads & requirements
  question: What must the system achieve, for which workload, and how is success decided?
  scope: Targets, workload descriptions, and objectives that every later engineering choice is judged against.
  rows:
  - id: requirements-slos
    code: F1.1
    label: Requirements, SLOs & baselines
    display_label: Requirements & SLOs
    definition: Stating measurable targets for a system's behavior and service, and the baselines and budgets against which
      they are judged.
    concepts:
    - mlsys.requirements
    - mlsys.baseline
    - mlsys.slo
    - mlsys.sli
    - mlsys.error-budget
    - mlsys.latency-budget
    secondary_concepts:
    - mlsys.tail-latency
    - mlsys.slo-goodput
    activities:
    - define
    - evaluate
    - operate
    layers:
    - application
    - runtime
    concerns:
    - quality
    - performance
    - reliability
    contexts:
    - interactive
    - batch
    status: draft
    includes:
    - Acceptance criteria and baselines
    - SLIs, SLOs, error budgets
    - Latency budgets across a request path
    excludes:
    - Measured latency behavior and goodput ([[latency-goodput]])
    - Statistical evaluation of model quality ([[evaluation]])
    warrants:
    - se4ml
    - sre-slo
    warrant_role: reading-scope-not-exact-semantic-match
    book_chapters:
    - v1/03
    - v1/12
    - v1/13
  - id: workload-characterization
