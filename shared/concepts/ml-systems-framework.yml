    - application
    - model
    concerns:
    - quality
    - reliability
    contexts: []
    status: draft
    includes:
    - Feature transformations, missing-data handling, deduplication, and explicit quality checks.
    excludes:
    - Exclude model-internal representations and guarantees of downstream fairness or generalization from clean
      data alone.
    warrants:
    - rules
    - ml-test-score
    warrant_role: reading-scope-not-exact-semantic-match
    secondary_concepts: []
    display_label: Preparation & quality
  - id: temporal-data
    label: Time and distribution
    definition: Manage temporal validity and changes between data collection, learning, and use.
    concepts:
    - mlsys.leakage
    - mlsys.point-in-time
    - mlsys.train-serve-skew
    - mlsys.distribution-shift
    - mlsys.delayed-outcomes
