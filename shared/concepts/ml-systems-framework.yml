row_rule: A row identifies a body of engineering knowledge with mechanisms, assumptions, and failure modes. Activities/layers/concerns/contexts
  are relevance facets, not substitute row identities.
secondary_policy: Explicit secondary associations are editorial candidates subjected to placement review; not duplicate identities
  or independent semantic verification. They do not change the unique browsing home.
warrant_policy: Warrants identify an established reading or framework lens for the row scope. They are not verified exact
  matches, endorsements, complete evidence for every contained concept, or book-coverage proof. Narrow technical assertions
  still need concept/edge-level sources; sparse warrants are not padded to a quota.
context_policy: Context vocabulary is proposed. Empty row contexts means not assessed. No automatic context assignment; relevance
  will not imply all constituent mechanisms apply universally.
book_mapping_policy: Related passage links are joined by stable field identity. No home-row assignment establishes chapter
  ownership, coverage depth, or learner proficiency.
competency_policy: Competencies are separately authored observable actions with conditions, evidence, and criteria, linked
  many-to-many to concepts.
rationale:
- Home rule. A mechanism that implements a layer of the stack or a stage of the lifecycle lives in that Stack or Lifecycle
  subject, even when it exists for speed or cost. A mechanism whose only purpose is one quality, and which applies across
  layers, lives in that Quality, beside the measurement of that quality. Measurement and trade-off reasoning always live in
  Qualities, except metrics defined by one lifecycle stage, such as serving latency targets, which live with that stage.
- The frame reads as one sentence. An ML system is a stack, run through a lifecycle, judged by qualities, built on shared
  foundations, with two system types whose engineering is distinctive enough to need their own areas.
- Foundations hold what every other area reasons with. The workload and its requirements, the model as a computation, and
  the quantitative models (roofline, Amdahl, queueing, scaling laws) that predict where time, memory, and money go.
- Stack areas are layers, silicon to fleet. Hardware, the software that maps programs onto it, parallel execution across devices,
  and the datacenter and fleet that host it all.
- Lifecycle areas are engineering activities. Data, training, evaluation, serving, and operations follow the order in which
  a system is built and changed, but they impose no course sequence.
- System types hold only what has no general home. Agentic systems own context engineering, tool interfaces, the agent harness,
  durable agent state, and multi-agent coordination. Embodied systems own sensing, estimation, planning and control, real-time
  computing, and robot learning. Agent evaluation stays in evaluation and prompt injection in security, with secondary links.
- Safety and assurance is a quality distinct from reliability and from security. Reliability asks whether the system keeps
  working, security whether an adversary can subvert it, and safety whether it can cause unacceptable harm even when working
  as designed.
- Generative, edge, classical, batch, interactive, streaming, distributed, and federated settings are contexts, not areas.
  They change the emphasis within every area rather than defining a separate body of knowledge.
- The scope is systems for ML. Using ML to optimize systems (learned schedulers, ML for chip design) is an adjacent field
  and is out of scope, as are ML algorithms studied apart from their systems consequences.
- Programming, linear algebra, probability, operating systems, and networking fundamentals are background. The taxonomy names
  where ML systems depend on them but does not enumerate those disciplines.
- Each concept has exactly one candidate home so editorial maintenance is predictable. Homes do not assert exclusive membership,
  a SKOS broader relation, or a prerequisite.
- Chapter pointers name where MLSysBook teaches a row at chapter grain. They are reading pointers, not passage-level alignment,
  and an absent pointer is not evidence that the books omit the subject.
- Rows with fewer than two home concepts are recorded as candidate gaps for inventory work. They make no claim of missing
  book coverage.
- The candidates are authored synthesis for review and do not certify complete field or book coverage.
- 'A system type earns its own area only when, after placement, it keeps a body of core concepts with no general home. Agentic
  systems pass on context engineering, tool interfaces, the agent harness, and multi-agent coordination. Embodied systems
  pass on real-time computing and robot learning; their perception and control concepts are imported background. Recommendation,
  multimodal, generative, and edge systems are lenses: their concepts have general homes.'
- Excludes name the row that owns an excluded topic by its identity, so a relabeled row cannot leave a dangling pointer.
- 'Background concepts are knowledge developed outside ML systems that ML systems reasoning depends on, such as loss functions,
  consensus, or feedback control. The tag records origin, not importance: a background concept is not optional and implies
  no lower depth.'
- Subjects differ in size because fields do. A three-concept subject is not a weaker subject, and subject size is not a weight.
- Lifecycle codes use the letter P (for process) so that a code never reads as a StaffML depth level (L1 to L6+).
