# Tagging-agreement record for the ML systems taxonomy. Scored by `binder concepts agreement`.
schema_version: 1
id: staffml-300-2026-10
title: StaffML questions, 300-item sample (October 2026)
basis: 300 StaffML interview questions sampled round-robin across all 88 topics with seed 2026 (cloud 96, edge 83, global 61, mobile 46, TinyML 14). Each tagger saw the taxonomy packet with its tagging
  rules and the question title, scenario, question, and model answer, and never saw the other tagger's output. Taggers are models, not people; agreement between two model families measures how unambiguous
  the vocabulary and rules are, not human reliability.
