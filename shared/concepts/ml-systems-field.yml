  label: Tree ensembles
  family: models
  definition: Collections of decision trees whose branch traversal and aggregation determine predictions.
  status: draft
  scope: background
- id: mlsys.kernel-method
  label: Kernel methods
  family: models
  definition: Models using similarity functions whose storage and evaluation costs depend on their representation.
  status: draft
  scope: background
- id: mlsys.nearest-neighbor
  label: Nearest-neighbor models
