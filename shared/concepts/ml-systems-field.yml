  family: objectives
  definition: Measurable desired behavior and constraints for a specified workload.
  status: draft
- id: mlsys.baseline
  label: Baseline
  family: objectives
  definition: A reference method or system used to justify the value of a proposed change.
  status: draft
- id: mlsys.proxy-objective
  label: Proxy objective
  family: objectives
  definition: A measurable target used in place of the outcome actually desired.
  status: draft
- id: mlsys.slo
  label: Service-level objective
  family: objectives
  definition: A target for a defined service measure over a specified population and window.
  status: draft
  aliases:
  - SLO
