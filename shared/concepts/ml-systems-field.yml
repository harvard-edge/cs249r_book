  label: Workload characterization
  family: objectives
  definition: The input, request, model, and execution distributions that a system must support.
  status: draft
- id: mlsys.placement
  label: Execution placement
  family: objectives
  definition: The choice of where system components execute, such as device, edge, or datacenter.
  status: draft
- id: mlsys.data-quality
  label: Data quality
  family: data
  definition: Fitness of recorded examples for the intended task, including validity, coverage, and error.
