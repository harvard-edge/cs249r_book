schema_version: 1
id: ml-systems-field
status: editorial-draft
title: 'Machine learning systems: a field landscape'
scope: Engineering learned systems across data, computation, deployment, operation, and effects. Agent and physical-system
  concepts are explicitly marked domain extensions.
limitations:
- An evolving editorial reference model, not a definitive ontology or completeness claim.
- Curricula support topic selection; they do not establish every relationship. Relationship warrants are authored
  synthesis unless explicitly stated otherwise.
- A missing book alignment means not yet mapped, not absent from the books.
- Field relationships are not automatically prerequisite links.
