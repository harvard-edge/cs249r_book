  status: draft
  scope: generative-extension
- id: mlsys.slo-goodput
  label: SLO goodput
  family: serving
  definition: The rate of useful completed work that satisfies the specified quality and service criteria.
  status: draft
- id: mlsys.generalization
  label: Generalization
  family: evaluation
  definition: Performance on relevant examples or conditions beyond those used to fit the system.
