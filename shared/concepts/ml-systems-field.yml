schema_version: 1
id: ml-systems-field
status: editorial-draft
title: 'Machine learning systems: a field landscape'
scope: Engineering learned systems across data, computation, deployment, operation, and effects. Agent and physical-system
  concepts are explicitly marked domain extensions.
limitations:
- An evolving editorial reference model, not a definitive ontology or completeness claim.
- Curricula support topic selection; they do not establish every relationship. Relationship warrants are authored
  synthesis unless explicitly stated otherwise.
- A missing book alignment means not yet mapped, not absent from the books.
- Field relationships are not automatically prerequisite links.
sources:
- id: cmu
  title: CMU Deep Learning Systems
  url: https://dlsyscourse.org/
  kind: curriculum
  scope: Frameworks, numerical execution, and hardware efficiency.
- id: cs329s
  title: Stanford CS329S, 2021 syllabus
  url: https://stanford-cs329s.github.io/2021/syllabus.html
  kind: curriculum
  scope: Production lifecycle, data, evaluation, deployment, and monitoring.
- id: fsdl
  title: Full Stack Deep Learning, 2022
  url: https://fullstackdeeplearning.com/course/2022/
  kind: curriculum
  scope: Problem selection, development workflow, deployment, and operations.
- id: cs336
  title: Stanford CS336, Spring 2025
  url: https://cs336.stanford.edu/spring2025/index.html
  kind: curriculum
  scope: Language-model data, computation, scaling, inference, and post-training.
- id: sklearn
  title: scikit-learn supervised learning guide
  url: https://scikit-learn.org/stable/supervised_learning.html
  kind: documentation
  scope: Linear, tree, kernel, neighbor, ensemble, and neural model regimes.
- id: metrics
  title: scikit-learn model evaluation guide
  url: https://scikit-learn.org/stable/modules/model_evaluation.html
  kind: documentation
  scope: Predictive metrics, thresholds, and scoring.
- id: rules
  title: Google Rules of Machine Learning
  url: https://developers.google.com/machine-learning/guides/rules-of-ml
  kind: engineering-guide
  scope: Practical pipeline correctness and lifecycle concerns.
- id: debt
  title: Hidden Technical Debt in Machine Learning Systems
  url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  kind: research
  scope: Data dependencies, feedback loops, and production-system coupling.
- id: roofline
  title: Roofline performance model
  url: https://www2.eecs.berkeley.edu/Pubs/TechRpts/2008/EECS-2008-134.html
  kind: research
  scope: Performance bounds in relation to arithmetic intensity and bandwidth.
- id: random-search
  title: Random Search for Hyper-Parameter Optimization
  url: https://jmlr.org/papers/v13/bergstra12a.html
  kind: research
  scope: Search strategies under a bounded evaluation budget.
- id: hyperband
  title: Hyperband
  url: https://jmlr.org/papers/v18/16-558.html
  kind: research
  scope: Adaptive allocation of resources to configuration evaluation.
- id: selection-bias
  title: Over-fitting in Model Selection and Subsequent Selection Bias
  url: https://jmlr.org/papers/v11/cawley10a.html
  kind: research
  scope: Optimism from optimizing a finite-sample model-selection criterion.
- id: calibration
  title: On Calibration of Modern Neural Networks
  url: https://proceedings.mlr.press/v70/guo17a.html
  kind: research
  scope: Probability calibration and temperature scaling.
- id: flash
  title: FlashAttention
  url: https://arxiv.org/abs/2205.14135
  kind: research
  scope: IO-aware attention computation.
- id: paged
  title: PagedAttention
  url: https://arxiv.org/abs/2309.06180
  kind: research
  scope: KV allocation, sharing, and serving capacity.
- id: zero
  title: ZeRO
  url: https://arxiv.org/abs/1910.02054
  kind: research
  scope: Partitioning distributed training state.
- id: agents
  title: Berkeley LLM Agents, Fall 2024
  url: https://llmagents-learning.org/f24
  kind: curriculum
  scope: Planning, tools, retrieval, evaluation, and human-agent interaction.
- id: control
  title: MIT Underactuated Robotics
  url: https://underactuated.mit.edu/index.html
  kind: textbook
  scope: Dynamics, estimation, planning, control, and physical learning.
- id: dp
  title: The Algorithmic Foundations of Differential Privacy
  url: https://www.cis.upenn.edu/~aaroth/Papers/privacybook.pdf
  kind: textbook
  scope: Formal privacy guarantees and their assumptions.
- id: sre
  title: Google Site Reliability Engineering
  url: https://sre.google/sre-book/table-of-contents/
  kind: textbook
  scope: Distributed state, overload, monitoring, and incident response.
- id: ann
  title: Billion-scale similarity search with GPUs
  url: https://arxiv.org/abs/1702.08734
  kind: research
  scope: Indexed similarity retrieval and resource trade-offs.
- id: aml
  title: NIST Adversarial ML taxonomy, 2025
  url: https://csrc.nist.gov/pubs/ai/100/2/e2025/final
  kind: taxonomy
  scope: Attack surfaces and terminology; not a guarantee of defenses.
- id: green
  title: 'Green Algorithms: Quantifying the Carbon Footprint of Computation'
  url: https://arxiv.org/abs/2007.07610
  kind: research
  scope: Operational emissions accounting; not a complete embodied lifecycle inventory.
- id: bloom-carbon
  title: Estimating the Carbon Footprint of BLOOM
  url: https://arxiv.org/abs/2211.02001
  kind: research
  scope: A case study including training, wider operation, and equipment manufacturing under declared boundaries.
- id: int8
  title: Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference
  url: https://arxiv.org/abs/1712.05877
  kind: research
  scope: Integer quantization and compatible inference execution.
- id: parquet-layout
  title: Apache Parquet file format
  url: https://parquet.apache.org/docs/file-format/
  kind: documentation
  scope: Describes row groups, column chunks, metadata, and selective sequential column reading; one concrete storage-layout
    design.
- id: beam-io
  title: 'Apache Beam programming guide: Pipeline I/O'
  url: https://beam.apache.org/documentation/programming-guide/#pipeline-io
  kind: documentation
  scope: Defines reading from and writing to external sources through pipeline I/O transforms; adapters differ in
    behavior.
- id: iceberg-schema
  title: 'Apache Iceberg specification: Schema evolution'
  url: https://iceberg.apache.org/spec/#schema-evolution
  kind: documentation
  scope: Describes adding/deleting/renaming/reordering fields, permitted type promotions, schema IDs, and compatibility
    mechanisms for that format.
- id: oracle-survey
  title: 'The Oracle Problem in Software Testing: A Survey'
  url: https://philmcminn.com/publications/barr2015.pdf
  kind: research
  scope: Author-hosted paper distinguishing desired from incorrect observed behavior; includes specifications, partial
    oracles, metamorphic relations, and human judgment.
- id: sre-testing
  title: 'Google SRE: Testing for Reliability'
  url: https://sre.google/sre-book/testing-reliability/
  kind: documentation
  scope: Defines integration/system tests and discusses statistical fault-oriented testing; passing tests does not
    prove reliability.
- id: chaos-principles
  title: Principles of Chaos Engineering
  url: https://principlesofchaos.org/
  kind: documentation
  scope: Authors describe experiments with disruptive events, observable steady-state hypotheses, and containing
    experimental impact; production experiments are not required by our concept.
- id: mlflow-dependencies
  title: 'MLflow: Managing Dependencies in Models'
  url: https://mlflow.org/docs/latest/ml/model/dependencies/
  kind: documentation
  scope: Documents model environment metadata, dependencies, direct/transitive version locking, and inference limitations;
    locking does not guarantee identical execution.
- id: kfp-pipeline
  title: 'Kubeflow Pipelines: Pipeline concepts'
  url: https://www.kubeflow.org/docs/components/pipelines/concepts/pipeline/
  kind: documentation
  scope: Describes component ordering, conditions, parameters/artifacts, caching, retries, and orchestration; an
    implementation example rather than a universal DAG requirement.
- id: pytorch-reproducibility
  title: 'PyTorch: Reproducibility'
  url: https://docs.pytorch.org/docs/2.14/notes/randomness.html
  kind: documentation
  scope: States limits across versions/platforms and distinguishes randomness controls, algorithm determinism, and
    associated performance tradeoffs.
- id: cuda-model
  title: 'CUDA Programming Guide: Programming Model'
  url: https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html
  kind: documentation
  scope: A vendor example of accelerator execution and memory organization; not a universal accelerator definition.
- id: nvidia-smi
  title: NVIDIA System Management Interface documentation
  url: https://docs.nvidia.com/deploy/nvidia-smi/index.html
  kind: documentation
  scope: Vendor-specific power limits, thermal slowdown, and operating telemetry; not a physical-system safety qualification.
- id: book-hardware
  title: MLSysBook hardware acceleration and physical placement
  url: https://mlsysbook.ai/vol1/
  kind: textbook
  scope: 'Internal manuscript reading basis: Volume I hardware acceleration, Volume II compute infrastructure, and
    Volume IV placement. Electrical and thermal scope remains draft.'
families:
- id: objectives
  label: Objectives and decisions
  scope: core
  references:
  - fsdl
  - cs329s
  question: What should the system achieve, and within which limits?
- id: data
  label: Data and representation
  scope: core
  references:
  - rules
  - cs329s
  - debt
  question: What information reaches learning and execution?
- id: models
  label: Model regimes
  scope: core
  references:
  - sklearn
  - cmu
  - cs336
  question: How does model structure change computation and behavior?
- id: learning
  label: Learning and experimentation
  scope: core
  references:
  - cmu
  - cs336
  - random-search
  - hyperband
  question: How should learning work and experimental effort be allocated?
- id: execution
  label: Numerical execution
  scope: core
  references:
  - cmu
  question: How does a mathematical model become machine work?
- id: hardware
  label: Hardware and performance
  scope: core
  references:
  - roofline
  - cmu
  question: Which physical resource limits useful work?
- id: distributed
  label: Distributed execution and state
  scope: core
  references:
  - cs336
  - zero
  - sre
  question: How do communication and failures affect collective work?
- id: serving
  label: Serving and capacity
  scope: core
  references:
  - cs329s
  - paged
  - sre
  question: How are requests admitted, executed, and completed?
- id: evaluation
  label: Evaluation and uncertainty
  scope: core
  references:
  - metrics
  - selection-bias
  - calibration
  question: What does the evidence justify?
- id: operations
  label: Operations and recovery
  scope: core
  references:
  - fsdl
  - cs329s
  - debt
  - sre
  question: How is behavior maintained after deployment?
- id: trust
  label: Security, privacy, and responsibility
  scope: core
  references:
  - aml
  - dp
  - cs329s
  question: Whose data, authority, and outcomes need protection?
- id: economics
  label: Energy and economics
  scope: core
  references:
  - green
  - bloom-carbon
  - fsdl
  question: What does useful work cost over the system lifecycle?
- id: agents
  label: Agent systems
  scope: agent-extension
  references:
  - agents
  question: How are model-directed trajectories bounded and evaluated?
- id: physical
  label: Physical systems
  scope: physical-extension
  references:
  - control
  question: When is a computed action feasible and admissible?
- id: retrieval
  label: Retrieval and search
  scope: core
  references:
  - ann
  - sklearn
  question: How is relevant information located within a resource budget?
concepts:
- id: mlsys.requirements
  label: System requirements
  family: objectives
  definition: Measurable desired behavior and constraints for a specified workload.
  status: draft
- id: mlsys.baseline
  label: Baseline
  family: objectives
  definition: A reference method or system used to justify the value of a proposed change.
  status: draft
- id: mlsys.proxy-objective
  label: Proxy objective
  family: objectives
  definition: A measurable target used in place of the outcome actually desired.
  status: draft
- id: mlsys.slo
  label: Service-level objective
  family: objectives
  definition: A target for a defined service measure over a specified population and window.
  status: draft
  aliases:
  - SLO
- id: mlsys.workload
  label: Workload characterization
  family: objectives
  definition: The input, request, model, and execution distributions that a system must support.
  status: draft
- id: mlsys.placement
  label: Execution placement
  family: objectives
  definition: The choice of where system components execute, such as device, edge, or datacenter.
  status: draft
- id: mlsys.data-quality
  label: Data quality
  family: data
  definition: Fitness of recorded examples for the intended task, including validity, coverage, and error.
  status: draft
- id: mlsys.labels
  label: Label quality
  family: data
  definition: Correctness, consistency, and availability of supervisory targets.
  status: draft
- id: mlsys.features
  label: Feature engineering
  family: data
  definition: Constructing model inputs whose semantics and availability match the task.
  status: draft
- id: mlsys.missing-data
  label: Missing data
  family: data
  definition: Absent observations whose pattern and treatment can change learned behavior.
  status: draft
- id: mlsys.leakage
  label: Data leakage
  family: data
  definition: Information unavailable at the intended prediction boundary entering development or evaluation.
  status: draft
- id: mlsys.point-in-time
  label: Point-in-time correctness
  family: data
  definition: Constructing examples using only information available at their stated prediction time.
  status: draft
- id: mlsys.lineage
  label: Data lineage
  family: data
  definition: Recorded dependencies that identify the sources and transformations of a dataset or artifact.
  status: draft
- id: mlsys.train-serve-skew
  label: Training-serving skew
  family: data
  definition: A mismatch between the data transformations or feature semantics used in training and serving.
  status: draft
- id: mlsys.deduplication
  label: Dataset deduplication
  family: data
  definition: Identifying and managing repeated or near-duplicate examples.
  status: draft
- id: mlsys.data-selection
  label: Data selection
  family: data
  definition: Allocating learning effort to examples according to value, coverage, and acquisition cost.
  status: draft
- id: mlsys.tokenization
  label: Tokenization
  family: data
  definition: Mapping text into vocabulary-dependent symbols and their identifiers.
  status: draft
  scope: model-extension
- id: mlsys.distribution-shift
  label: Distribution shift
  family: data
  definition: A difference between development and deployment data-generating distributions.
  status: draft
- id: mlsys.linear-model
  label: Linear models
  family: models
  definition: Models whose score is linear in their supplied features, with a possible output link function.
  status: draft
- id: mlsys.tree-ensemble
  label: Tree ensembles
  family: models
  definition: Collections of decision trees whose branch traversal and aggregation determine predictions.
  status: draft
- id: mlsys.kernel-method
  label: Kernel methods
  family: models
  definition: Models using similarity functions whose storage and evaluation costs depend on their representation.
  status: draft
- id: mlsys.nearest-neighbor
  label: Nearest-neighbor models
  family: models
  definition: Predictions or retrieval based on similarity to stored examples or vectors.
  status: draft
- id: mlsys.neural-network
  label: Neural networks
  family: models
  definition: Parameterized compositions of differentiable operations used to learn representations and predictions.
  status: draft
- id: mlsys.inductive-bias
  label: Inductive bias
  family: models
  definition: Structural assumptions that favor some learned functions over others.
  status: draft
- id: mlsys.embeddings
  label: Embeddings
  family: models
  definition: Vector representations whose dimension and lookup or construction method affect storage and computation.
  status: draft
- id: mlsys.attention
  label: Attention
  family: models
  definition: Input-dependent aggregation of value vectors using query-key compatibility scores.
  status: draft
  scope: model-extension
- id: mlsys.position-encoding
  label: Position encoding
  family: models
  definition: Representations that make sequence position available to a model.
  status: draft
  scope: model-extension
  aliases:
  - Positional encoding
- id: mlsys.loss
  label: Training loss
  family: learning
  definition: A computable criterion optimized on training examples.
  status: draft
- id: mlsys.autodiff
  label: Automatic differentiation
  family: learning
  definition: Computing derivatives by composing local derivative rules through an execution graph.
  status: draft
- id: mlsys.optimizer
  label: Optimization algorithm
  family: learning
  definition: A rule that uses training information to update model parameters and optimizer state.
  status: draft
- id: mlsys.regularization
  label: Regularization
  family: learning
  definition: Constraints or training procedures used to control sensitivity and generalization behavior.
  status: draft
- id: mlsys.batch-size
  label: Training batch size
  family: learning
  definition: The number of examples contributing to an optimization update or microstep.
  status: draft
- id: mlsys.training-state
  label: Training state
  family: learning
  definition: The parameters, gradients, optimizer variables, and other state needed to continue training.
  status: draft
- id: mlsys.activation-recompute
  label: Activation recomputation
  family: learning
  definition: Recreating forward intermediates during backward execution to reduce retained memory.
  status: draft
  aliases:
  - Activation checkpointing
  - Gradient checkpointing
- id: mlsys.scaling-laws
  label: Empirical scaling laws
  family: learning
  definition: Fitted relationships between resources, data, model size, and observed model performance.
  status: draft
- id: mlsys.hyperparameter-search
  label: Hyperparameter search
  family: learning
  definition: Choosing model or training settings through a sequence of evaluations.
  status: draft
  aliases:
  - Hyperparameter optimization
  - HPO
- id: mlsys.experiment-budget
  label: Experiment-budget allocation
  family: learning
  definition: Dividing a finite evaluation budget across configurations, repetitions, and fidelities.
  status: draft
- id: mlsys.transfer-learning
  label: Transfer learning
  family: learning
  definition: Adapting representations or parameters learned from one setting to another.
  status: draft
- id: mlsys.peft
  label: Parameter-efficient adaptation
  family: learning
  definition: Adapting a model by changing a limited parameter subset or added parameterization.
  status: draft
  aliases:
  - PEFT
- id: mlsys.tensor-layout
  label: Tensor layout
  family: execution
  definition: The mapping from tensor indices to storage locations, including strides and materialization.
  status: draft
- id: mlsys.matrix-multiply
  label: Matrix multiplication
  family: execution
  definition: A dense linear-algebra operation whose tiling, shape, and precision affect execution cost.
  status: draft
- id: mlsys.precision
  label: Numerical precision
  family: execution
  definition: The representable values and arithmetic behavior of a numerical format.
  status: draft
- id: mlsys.numerical-stability
  label: Numerical stability
  family: execution
  definition: Sensitivity of a computed result to finite-precision operations and intermediate representations.
  status: draft
- id: mlsys.mixed-precision
  label: Mixed-precision training
  family: execution
  definition: Training with multiple numerical formats and explicit handling of their range and accumulation behavior.
  status: draft
- id: mlsys.quantization
  label: Quantization
  family: execution
  definition: Representing values using a reduced discrete set with a specified encoding and approximation rule.
  status: draft
  references:
  - int8
- id: mlsys.sparsity
  label: Sparsity
  family: execution
  definition: A pattern of absent or zero values whose execution benefit depends on representation and support.
  status: draft
- id: mlsys.distillation
  label: Knowledge distillation
  family: execution
  definition: Training a student model using signals from a teacher model or ensemble.
  status: draft
- id: mlsys.compilation
  label: Graph compilation
  family: execution
  definition: Transforming a model or execution graph into an executable representation.
  status: draft
- id: mlsys.fusion
  label: Kernel fusion
  family: execution
  definition: Combining compatible operations to reduce intermediate materialization or dispatch.
  status: draft
  references:
  - cmu
  - flash
- id: mlsys.dispatch
  label: Host dispatch overhead
  family: execution
  definition: Host-side work required to launch or orchestrate device operations.
  status: draft
- id: mlsys.memory-capacity
  label: Memory capacity
  family: hardware
  definition: Available storage for concurrently resident state and intermediates.
  status: draft
- id: mlsys.memory-bandwidth
  label: Memory bandwidth
  family: hardware
  definition: The sustainable rate at which bytes move across a specified memory interface.
  status: draft
- id: mlsys.compute-throughput
  label: Compute throughput
  family: hardware
  definition: The sustainable rate of a specified arithmetic workload on an execution resource.
  status: draft
- id: mlsys.arithmetic-intensity
  label: Arithmetic intensity
  family: hardware
  definition: Arithmetic work per byte transferred at a specified memory boundary.
  status: draft
- id: mlsys.roofline
  label: Roofline bound
  family: hardware
  definition: A performance bound combining a compute ceiling with an intensity-dependent bandwidth ceiling.
  status: draft
- id: mlsys.locality
  label: Data locality
  family: hardware
  definition: Reuse of data near its consumers across time or execution locations.
  status: draft
- id: mlsys.tiling
  label: Tiling
  family: hardware
  definition: Partitioning computation so working data can be reused within a chosen storage level.
  status: draft
- id: mlsys.profiling
  label: Profiling
  family: hardware
  definition: Measuring execution to attribute time, work, stalls, and resource use.
  status: draft
- id: mlsys.utilization
  label: Resource utilization
  family: hardware
  definition: The fraction of a resource's defined service capacity that is occupied over a stated interval.
  status: draft
- id: mlsys.serial-fraction
  label: Serial fraction
  family: hardware
  definition: The portion of execution that a proposed parallel or accelerated transformation leaves unchanged.
  status: draft
- id: mlsys.collectives
  label: Collective communication
  family: distributed
  definition: Coordinated data exchange and reduction across a process group.
  status: draft
- id: mlsys.data-parallel
  label: Data parallelism
  family: distributed
  definition: Executing model replicas on different examples while coordinating learning state.
  status: draft
- id: mlsys.tensor-parallel
  label: Tensor parallelism
  family: distributed
  definition: Partitioning tensor operations and their state across devices.
  status: draft
- id: mlsys.pipeline-parallel
  label: Pipeline parallelism
  family: distributed
  definition: Partitioning a computation into stages that process different microbatches concurrently.
  status: draft
- id: mlsys.state-sharding
  label: Training-state sharding
  family: distributed
  definition: Partitioning parameters, gradients, or optimizer state across workers.
  status: draft
- id: mlsys.communication-overlap
  label: Communication overlap
  family: distributed
  definition: Scheduling communication concurrently with independent computation.
  status: draft
- id: mlsys.network-topology
  label: Network topology
  family: distributed
  definition: The connectivity and capacity structure that constrains communication paths.
  status: draft
- id: mlsys.stragglers
  label: Stragglers
  family: distributed
  definition: Workers or tasks whose delayed completion holds back coordinated work.
  status: draft
- id: mlsys.checkpoint
  label: Recovery checkpoint
  family: distributed
  definition: A persisted state from which a specified computation can resume.
  status: draft
- id: mlsys.consistent-cut
  label: Consistent checkpoint cut
  family: distributed
  definition: A recoverable collection of distributed states with compatible dependencies.
  status: draft
- id: mlsys.consensus
  label: Replicated-log consensus
  family: distributed
  definition: Agreement on an ordered state history under specified timing and failure assumptions.
  status: draft
- id: mlsys.fencing
  label: Fencing
  family: distributed
  definition: Rejecting effects from an actor whose epoch or authority is stale.
  status: draft
- id: mlsys.federated-learning
  label: Federated learning
  family: distributed
  definition: Coordinating model learning across separately controlled data holders.
  status: draft
- id: mlsys.arrival-rate
  label: Arrival rate
  family: serving
  definition: The frequency and distribution of requests reaching a service boundary.
  status: draft
- id: mlsys.service-capacity
  label: Service capacity
  family: serving
  definition: The completion rate supported by a service under a stated workload and operating point.
  status: draft
- id: mlsys.queueing
  label: Queueing delay
  family: serving
  definition: Time a request waits for a resource before receiving service.
  status: draft
- id: mlsys.tail-latency
  label: Tail latency
  family: serving
  definition: A high quantile of a defined request-latency distribution.
  status: draft
- id: mlsys.batching
  label: Request batching
  family: serving
  definition: Executing requests together to share work or improve resource use.
  status: draft
- id: mlsys.admission
  label: Admission control
  family: serving
  definition: Accepting, delaying, or rejecting work according to capacity, policy, and service constraints.
  status: draft
- id: mlsys.autoscaling
  label: Autoscaling
  family: serving
  definition: Changing provisioned service resources in response to measured or predicted demand.
  status: draft
- id: mlsys.kv-cache
  label: KV cache
  family: serving
  definition: Retained attention keys and values reused during autoregressive execution.
  status: draft
  scope: generative-extension
  aliases:
  - Key-value cache
- id: mlsys.prefill-decode
  label: Prefill and decode
  family: serving
  definition: The prompt-processing and incremental token-generation phases of autoregressive inference.
  status: draft
  scope: generative-extension
- id: mlsys.paged-kv
  label: Paged KV allocation
  family: serving
  definition: Managing attention state in blocks to reduce allocation waste and support sharing.
  status: draft
  scope: generative-extension
- id: mlsys.prefix-cache
  label: Prefix caching
  family: serving
  definition: Reusing compatible computed state for an identical request prefix.
  status: draft
  scope: generative-extension
- id: mlsys.speculative-decoding
  label: Speculative decoding
  family: serving
  definition: Using proposed tokens and a validating procedure to accelerate generation while preserving a specified
