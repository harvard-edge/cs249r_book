  definition: Predictions or retrieval based on similarity to stored examples or vectors.
  status: draft
  scope: background
- id: mlsys.neural-network
  label: Neural networks
  family: models
  definition: Parameterized compositions of differentiable operations used to learn representations and predictions.
  status: draft
  scope: background
- id: mlsys.inductive-bias
