  - microbenchmark vs. end-to-end benchmark
  - benchmark realism
  references:
  - mlperf-inference
  - mlperf-training
- id: mlsys.data-model-licensing
  label: Data and model licensing
  family: trust
  definition: Legal terms governing how datasets and model weights may be used, modified, redistributed, or deployed, which
    constrain acquisition, fine-tuning, and release decisions.
  status: draft
  aliases:
  - dataset license
  - model license
  - open-weight license
- id: mlsys.content-provenance
  label: Content provenance
  family: trust
  definition: Cryptographically signed metadata attached to media that records its origin and edit history, including model
    generation, so recipients can verify source claims.
  status: draft
  aliases:
  - C2PA
  - content credentials
  scope: generative-extension
  references:
  - c2pa
- id: mlsys.fleet-data-engine
  label: Fleet data engine
  family: operations
  definition: Collecting training data from deployed devices through on-device triggers that flag rare or uncertain events,
    uploading selected samples under bandwidth budgets for labeling and retraining.
  status: draft
  aliases:
  - data engine
  - triggered data collection
  - edge-case mining
  - data flywheel
- id: mlsys.robotics-middleware
  label: Robotics middleware and dataflow
  family: physical
  definition: Software connecting sensing, perception, planning, and control processes as nodes that exchange typed messages
    over publish-subscribe topics with configurable delivery and timing policies.
  status: draft
  aliases:
  - ROS 2
  - publish-subscribe middleware
  - DDS
  scope: physical-extension
  references:
  - ros2
- id: mlsys.parallel-simulation
  label: Parallel physics simulation
  family: physical
  definition: Running many simulated robot environments concurrently, often batched on accelerators, so policy learning and
    data generation gather experience faster than physical collection.
  status: draft
  aliases:
  - GPU-parallel simulation
  - simulated environments
  - vectorized environments
  scope: physical-extension
  references:
  - isaac-gym
- id: mlsys.agent-credentials
  label: Agent credentials and delegated authority
  family: agents
  definition: Issuing tool-using agents scoped, short-lived credentials that act on a user's behalf, brokering secrets outside
    model context so authority stays bounded and revocable.
  status: draft
  aliases:
  - agent identity
  - delegated tokens
  - secret brokering
  scope: agent-extension
  references:
  - oauth-token-exchange
  - mcp
- id: mlsys.gnn-graph-partitioning
  label: Graph partitioning for GNN training
  family: distributed
  definition: Splitting a large graph across workers to balance computation while minimizing cut edges, whose cross-partition
    neighbor features must be fetched remotely.
  status: draft
  aliases:
  - graph partitioning
  - METIS partitioning
  - distributed GNN training
  references:
  - distdgl
- id: mlsys.host-data-loader
  label: Host-side data loading
  family: data
  definition: Reading, decoding, augmenting, and collating examples on host CPU worker processes and staging batches in pinned
    memory so that a single machine's accelerators are not left waiting for input.
  aliases:
  - data loader
  - DataLoader workers
  - pinned memory
  references:
  - tf-data-performance
  - data-stalls
  status: draft
- id: mlsys.streaming-inference
  label: Streaming inference
  family: serving
  definition: Serving a model over an open stream of input, producing outputs incrementally from partial input while carrying
    state between chunks, rather than answering one complete request at a time.
  aliases:
  - incremental inference
  - online streaming inference
  references:
  - streaming-asr
  - streaming-llm
  status: draft
- id: mlsys.inference-api
  label: Inference API and payload serialization
  family: serving
  definition: The request and response protocol of a model server, including the transport (HTTP, gRPC, streaming connections),
    the tensor and payload encoding, and the cost of serializing inputs and outputs.
  aliases:
  - prediction API
  - gRPC inference
  - tensor serialization
  references:
  - clipper
  status: draft
- id: mlsys.request-throughput
  label: Request throughput
  family: serving
  definition: The number of requests, or tokens, a serving system completes per unit time at a stated load and latency target.
  aliases:
  - queries per second
  - QPS
  - tokens per second
  references:
  - mlperf-inference
  status: draft
- id: mlsys.latency-percentiles
  label: Latency percentiles
  family: serving
  definition: Summarizing a latency distribution by percentiles such as p50, p95, and p99, so that a service is judged by
    the experience of most requests and of the slow tail rather than by the mean.
  aliases:
  - p50
  - p99
  - percentile latency
  references:
  - tail-at-scale
  status: draft
- id: mlsys.cache-aware-routing
  label: Cache-aware request routing
  family: serving
  definition: Sending each request to the replica that already holds a reusable prefix or KV cache for it, trading load balance
    against cache reuse.
  aliases:
  - prefix-affinity routing
  - KV-aware routing
  - session affinity
  references:
  - sglang
  - mooncake
  status: draft
- id: mlsys.process-group-rendezvous
  label: Distributed job launch and process groups
  family: distributed
  definition: Starting the processes of a distributed job, having them discover each other through a rendezvous, assigning
    ranks, and forming the process groups and communicators that collectives run over.
  aliases:
  - rendezvous
  - ranks
  - communicator initialization
  - torchrun
  references:
  - torch-distributed
  - torch-elastic
  status: draft
- id: mlsys.agentic-workload
  label: Agentic workload
  family: agents
  definition: The load an agent places on the serving stack, including context that grows each turn, idle gaps while tools
    run, many short dependent model calls, and reuse of KV state across steps.
  aliases:
  - agent workload
  - multi-turn inference load
  references:
  - building-agents
  - sglang
  status: draft
- id: mlsys.performance-regression-testing
  label: Performance regression testing
  family: evaluation
  definition: Benchmarking every change to code, kernels, models, or configuration continuously and failing the change when
    throughput, latency, or memory degrades beyond a set tolerance.
  aliases:
  - continuous benchmarking
  - perf regression gate
  references:
  - ml-test-score
  status: draft
- id: mlsys.measurement-variability
  label: Performance measurement variability
  family: evaluation
  definition: Run-to-run variation in measured time and throughput from warm-up, asynchronous execution, clock and thermal
    state, and contention, handled by synchronizing, repeating runs, and reporting spread.
  aliases:
  - benchmark noise
  - warm-up effects
  - timing variance
  references:
  - mlperf-inference
  - eval-error-bars
  status: draft
- id: mlsys.pii-deidentification
  label: PII detection and de-identification
  family: data
  definition: Finding personal identifiers in training corpora, logs, and prompts and removing, masking, or pseudonymizing
    them before the data is stored, trained on, or shared.
  aliases:
  - PII scrubbing
  - data anonymization
  - redaction
  references:
  - gdpr
  status: draft
- id: mlsys.gradient-clipping
  label: Gradient clipping
  family: learning
  scope: background
  definition: Rescaling or truncating gradients whose norm exceeds a threshold so that a single large update cannot destabilize
    training.
  aliases:
  - gradient norm clipping
  references:
  - pascanu-clipping
  status: draft
- id: mlsys.weight-initialization
  label: Weight initialization
  family: learning
  scope: background
  definition: Choosing the scale and distribution of initial parameters so that activations and gradients keep stable variance
    through depth at the start of training.
  aliases:
  - Xavier initialization
  - He initialization
  references:
  - he-init
  status: draft
- id: mlsys.delivery-semantics
  label: Processing delivery semantics
  family: data
  definition: The guarantee a data pipeline gives about how often each record takes effect (at most once, at least once, or
    effectively once) under retries, replays, and failures, and the idempotent or transactional sinks that achieve it.
  aliases:
  - exactly-once processing
  - at-least-once delivery
  - duplicate events
  references:
  - beam-guide
  status: draft
- id: mlsys.online-feature-consistency
  label: Online and offline feature consistency
  family: data
  definition: Keeping the feature values materialized in the low-latency online store consistent with the offline values used
    for training, as features are recomputed, backfilled, and updated.
  aliases:
  - feature materialization
  - online store consistency
  references:
  - feast
  status: draft
- id: mlsys.ood-detection
  label: Out-of-distribution detection
  family: evaluation
  definition: Flagging individual inputs that differ from the training distribution so the system can abstain, defer, or fall
    back instead of trusting the prediction.
  aliases:
  - OOD detection
  - novelty detection
  references:
  - failing-loudly
  status: draft
- id: mlsys.model-feature-compatibility
  label: Model and feature compatibility
  family: operations
  definition: Ensuring that a model version, its tokenizer and feature transformations, the schemas it reads, and the consumers
    of its outputs remain compatible as each is versioned and released independently.
  aliases:
  - interface compatibility
  - tokenizer compatibility
  references:
  - debt
  status: draft
- id: mlsys.secrets-management
  label: Workload identity and secrets management
  family: trust
  definition: Giving training jobs, model servers, and pipelines verifiable identities and provisioning, rotating, and revoking
    the keys and credentials they use, without embedding secrets in code or images.
  aliases:
  - secrets management
  - workload identity
  - credential rotation
  references:
  - saltzer-schroeder
  status: draft
- id: mlsys.deletion-propagation
  label: Data deletion propagation
  family: operations
  definition: Carrying a deletion request through every copy and derivative of the data, including datasets, features, caches,
    replicas, backups, and models trained on it.
  aliases:
  - right to erasure
  - deletion requests
  references:
  - gdpr
  - sisa-unlearning
  status: draft
- id: mlsys.memory-fragmentation
  label: Runtime memory fragmentation
  family: execution
  definition: Free device memory split into blocks too small to satisfy new allocations, so a job runs out of memory while
    reserved memory exceeds what live tensors use.
  aliases:
  - allocator fragmentation
  - reserved versus allocated memory
  references:
  - pytorch-cuda
  status: draft
- id: mlsys.perception-latency-budget
  label: Perception latency budget
  family: physical
  definition: The share of a robot's sense-to-act deadline allotted to sensing and perception, which bounds model size, input
    resolution, and frame rate on the onboard computer.
  aliases:
  - sense-to-act latency budget
  references:
  - wcet-survey
  status: draft
- id: mlsys.onboard-compute-partitioning
  label: Onboard compute partitioning
  family: physical
  definition: Assigning perception, planning, and control workloads to the CPUs, accelerators, and microcontrollers of a robot,
    or offloading them, so each meets its deadline and criticality level.
  aliases:
  - onboard workload placement
  - robot compute offloading
  references:
  - neurosurgeon
  - mixed-crit-vestal
  status: draft
- id: mlsys.health-checks
  label: Health checks and readiness probes
  family: operations
  definition: Periodic liveness and readiness checks that let an orchestrator or load balancer stop routing traffic to, or
    restart, a replica that is unhealthy or still loading its model.
  aliases:
  - readiness probe
  - liveness probe
  - health endpoint
  references:
  - k8s-probes
  status: draft
- id: mlsys.python-gil
  label: Python GIL and host-language concurrency
  family: execution
  definition: The CPython global interpreter lock serializes Python bytecode across threads, so ML host code achieves concurrency
    through native kernels that release the lock, multiple processes, or asynchronous I/O.
  aliases:
  - GIL
  - global interpreter lock
  - multiprocessing workers
  references:
  - python-gil
  status: draft
- id: mlsys.flash-endurance
  label: Flash write endurance
  family: hardware
  definition: Flash memory cells wear out after a limited number of program and erase cycles, which bounds how often embedded
    and edge devices can write logs, checkpoints, or model updates; wear leveling spreads writes to extend life.
  aliases:
  - flash wear-out
  - wear leveling
  - program/erase cycles
  references:
  - tflm
  status: draft
- id: mlsys.intermittent-computing
  label: Energy-harvesting intermittent computing
  family: hardware
  definition: Running inference on devices powered by harvested energy that lose power unpredictably, which requires checkpointing
    progress to nonvolatile memory so computation resumes rather than restarts.
  aliases:
  - energy harvesting
  - batteryless inference
  - intermittent inference
  references:
  - intermittent-dnn
  status: draft
- id: mlsys.mmap-weights
  label: Memory-mapped model weights
  family: execution
  definition: Mapping a weight file into virtual memory so pages load on demand and read-only weights are shared across processes,
    cutting load time and duplicate memory at the cost of page faults.
  aliases:
  - mmap weights
  - shared weight mapping
  - zero-copy model loading
  references:
  - safetensors
  status: draft
- id: mlsys.os-memory-pressure
  label: OS memory pressure and paging
  family: execution
  definition: How an operating system reclaims memory from a model process under pressure, by evicting file-backed pages,
    swapping or compressing memory, or killing the app, which shows up as page thrashing, latency spikes, or abrupt termination.
  aliases:
  - page thrashing
  - low-memory killer
  - app memory limit
  - memory reclamation
  references:
  - ondevice-256kb
  status: draft
- id: mlsys.managed-runtime-interop
  label: Managed-runtime interop and garbage collection
  family: execution
  definition: Crossing between a managed language runtime (Java, Kotlin, Swift, C#) and native inference code, where buffer
    copies, object pinning, and garbage-collection pauses add latency and memory.
  aliases:
  - JNI overhead
  - GC pauses
  - native interop
  references:
  - tflm
  status: draft
- id: mlsys.zero-copy-dma
  label: Zero-copy sensor input via DMA
  family: data
  definition: Having sensors or peripherals write input directly into model input buffers by direct memory access, avoiding
    CPU copies between capture and inference.
  aliases:
  - DMA input buffers
  - zero-copy capture
  references:
  - tflm
  status: draft
- id: mlsys.sensor-interference
  label: Active sensor interference
  family: physical
  definition: Crosstalk between active sensors, such as lidars, radars, or structured-light cameras, that emit into the same
    environment and corrupt each other's measurements.
  aliases:
  - sensor crosstalk
  - lidar interference
  references:
  - lidar-spoofing
  status: draft
- id: mlsys.network-propagation-delay
  label: Network propagation delay
  family: distributed
  definition: The minimum latency set by the distance a signal travels at the speed of light in fiber, which bounds round
    trips between regions regardless of bandwidth.
  aliases:
  - speed-of-light latency
  - round-trip time
  - RTT
  references:
  - tail-at-scale
  status: draft
- id: mlsys.cap-tradeoff
  label: Consistency-availability trade-off
  family: distributed
  definition: Under a network partition, a replicated system must choose between answering with possibly stale state and refusing
    requests until replicas agree.
  aliases:
  - CAP theorem
  - partition tolerance
  references:
  - brewer-cap
  status: draft
- id: mlsys.gossip-averaging
  label: Decentralized gossip averaging
  family: distributed
  definition: Training in which each worker averages its model with a few neighbors instead of a central server or global
    all-reduce, so updates diffuse through the communication graph.
  aliases:
  - gossip SGD
  - decentralized SGD
  references:
  - gossip-sgd
  status: draft
- id: mlsys.interrupt-latency
  label: Interrupt latency
  family: physical
  definition: The delay between a hardware event and its interrupt handler running, plus the handler's own run time, which
    must fit inside a real-time sensing or control budget alongside inference.
  aliases:
  - ISR latency
  - interrupt service routine budget
  references:
  - wcet-survey
  status: draft
