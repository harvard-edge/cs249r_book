  label: Accelerator dataflow
  family: hardware
  definition: The mapping that decides which operands stay resident in local storage while others stream, such as weight-,
    output-, or row-stationary schedules.
  status: draft
  aliases:
  - stationarity
- id: mlsys.domain-specific-architecture
  label: Domain-specific architecture
  family: hardware
  definition: Hardware specialized to a class of workloads, trading programmability for higher performance per watt on its
    target operations.
  status: draft
  aliases:
  - DSA
- id: mlsys.hbm
  label: High-bandwidth memory
  family: hardware
  definition: Stacked DRAM placed beside the processor on an interposer, providing very high bandwidth with limited capacity
    per stack.
  status: draft
  aliases:
  - HBM
- id: mlsys.on-chip-sram
  label: On-chip SRAM and scratchpads
  family: hardware
  definition: Small, fast on-die storage, such as caches, shared memory, and register files, used to stage reused operands
    near compute units.
  status: draft
- id: mlsys.memory-wall
  label: Memory wall
  family: hardware
  definition: The widening gap between processor arithmetic throughput and memory bandwidth or latency, which makes data movement
    the limiting factor.
  status: draft
- id: mlsys.scale-up-interconnect
  label: Scale-up interconnect
  family: hardware
  definition: High-bandwidth links and switches, such as NVLink-class fabrics, joining accelerators within a node or rack
    into one tightly coupled domain.
  status: draft
- id: mlsys.coherent-interconnect
  label: Cache-coherent interconnect
  family: hardware
  definition: A link protocol that lets hosts and devices share or pool memory with hardware coherence, such as CXL over a
    PCIe physical layer.
  status: draft
  aliases:
  - CXL
- id: mlsys.peer-to-peer-transfer
  label: Peer-to-peer device transfer
  family: hardware
  definition: Direct memory access between accelerators, or between accelerators and NICs or storage, without staging data
    through host memory.
  status: draft
  aliases:
  - GPUDirect
- id: mlsys.tdp
  label: Thermal design power
  family: hardware
  definition: The sustained heat dissipation a cooling solution is designed to remove, used as a chip's nominal power envelope.
  status: draft
  aliases:
  - TDP
- id: mlsys.dvfs
  label: Dynamic voltage and frequency scaling
  family: hardware
  definition: Adjusting supply voltage and clock frequency at runtime to trade performance for power, since dynamic power
    grows superlinearly with voltage.
  status: draft
  aliases:
  - DVFS
- id: mlsys.dark-silicon
  label: Dark silicon
  family: hardware
  definition: The fraction of a chip that cannot be powered at full frequency simultaneously within its power and thermal
    budget.
  status: draft
- id: mlsys.power-capping
  label: Power capping
  family: hardware
  definition: Enforcing a maximum power draw on a device or group by limiting clocks or activity, trading peak throughput
    for bounded power.
  status: draft
- id: mlsys.microcontroller
  label: Microcontroller-class device
  family: hardware
  definition: A low-power processor with on-chip flash and kilobytes to a few megabytes of SRAM, typically without an operating
    system or virtual memory.
  status: draft
  aliases:
  - MCU
  - TinyML device
- id: mlsys.heterogeneous-soc
  label: Heterogeneous mobile SoC
  family: hardware
  definition: A system-on-chip combining CPU, GPU, DSP, and NPU blocks under shared memory and power limits, across which
    model operators are partitioned.
  status: draft
- id: mlsys.edge-npu
  label: On-device neural accelerator
  family: hardware
  definition: An accelerator integrated in mobile or embedded silicon for low-precision neural inference, usually supporting
    a restricted set of operators.
  status: draft
  aliases:
  - NPU
- id: mlsys.energy-per-inference
  label: Energy per inference
  family: economics
  definition: Energy consumed to process one input end to end on a device, the binding metric for battery-powered and energy-harvesting
    deployments.
  status: draft
- id: mlsys.on-device-memory-budget
  label: On-device memory budget
  family: hardware
  definition: The flash and SRAM limits that bound a deployed model's stored weights and peak activation memory on embedded
    hardware.
  status: draft
  aliases:
  - app memory limit
  - mobile memory budget
- id: mlsys.tensor
  label: Tensor
  family: execution
  definition: A multidimensional array carrying shape, element type, device, and layout metadata, the core data abstraction
    of ML frameworks.
  status: draft
- id: mlsys.computation-graph
  label: Computation graph
  family: execution
  definition: A directed graph of tensor operations and their data dependencies representing a model program, used for differentiation,
    optimization, and scheduling.
  status: draft
- id: mlsys.eager-execution
  label: Eager vs. graph execution
  family: execution
  definition: The choice between running each operation as the host program issues it and building a whole graph first for
    later optimization and execution.
  status: draft
  aliases:
  - define-by-run
- id: mlsys.tracing-jit
  label: Tracing and JIT capture
  family: execution
  definition: Recording operations executed on example inputs to build a graph compiled just in time, with guards or retracing
    when shapes or control flow change.
  status: draft
  aliases:
  - JIT compilation
- id: mlsys.io-aware-attention
  label: IO-aware attention kernel
  family: execution
  definition: An exact attention implementation that tiles queries, keys, and values through on-chip memory to avoid materializing
    the full score matrix in off-chip memory.
  status: draft
  aliases:
  - FlashAttention
- id: mlsys.convolution-lowering
  label: Convolution lowering
  family: execution
  definition: Implementing convolution by rearranging input patches into matrices for GEMM, or by direct, FFT, or Winograd
    algorithms with different memory costs.
  status: draft
  aliases:
  - im2col
- id: mlsys.kernel-library
  label: Vendor kernel library
  family: execution
  definition: Tuned implementations of common operators supplied for a hardware platform, which frameworks call rather than
    generating their own kernels.
  status: draft
  aliases:
  - cuBLAS
  - cuDNN
- id: mlsys.intermediate-representation
  label: ML compiler IR
  family: execution
  definition: Program representations at graph, tensor, and loop levels on which compilers apply lowering and optimization
    passes.
  status: draft
  aliases:
  - graph IR
  - MLIR
- id: mlsys.autotuning
  label: Kernel autotuning
  family: execution
  definition: Searching kernel schedule parameters, such as tile sizes and loop orders, by measurement or learned cost models
    to find fast implementations for a target.
  status: draft
- id: mlsys.kernel-dsl
  label: Kernel DSL
  family: execution
  definition: A domain-specific language for writing tiled tensor kernels above the level of vendor assembly, with the compiler
    handling memory and thread mapping.
  status: draft
  aliases:
  - Triton
- id: mlsys.memory-planning
  label: Static memory planning
  family: execution
  definition: Compile-time assignment of tensor buffers to memory with lifetime-based reuse, reducing peak memory and runtime
    allocation.
  status: draft
- id: mlsys.device-streams
  label: Device streams
  family: execution
  definition: Ordered queues of device work that the host enqueues asynchronously, with events expressing dependencies and
    allowing overlap across queues.
  status: draft
  aliases:
  - CUDA streams
- id: mlsys.caching-allocator
  label: Caching memory allocator
  family: execution
  definition: A runtime allocator that retains and reuses freed device memory blocks to avoid costly allocation calls, at
    the risk of fragmentation.
  status: draft
- id: mlsys.graph-replay
  label: Captured graph replay
  family: execution
  definition: Recording a fixed sequence of kernel launches once and replaying it as a unit to remove per-launch host overhead.
  status: draft
  aliases:
  - CUDA Graphs
- id: mlsys.loss-scaling
  label: Loss scaling
  family: execution
  definition: Multiplying the loss before backpropagation so small gradients remain representable in reduced-precision formats,
    then unscaling before the optimizer step.
  status: draft
- id: mlsys.block-scaled-format
  label: Block-scaled number formats
  family: execution
  definition: Low-precision formats in which small blocks of values share a scale factor, extending dynamic range for FP8,
    FP6, FP4, or INT8 elements.
  status: draft
  aliases:
  - MX
  - microscaling
  - MXFP8
  - FP8 with block scaling
- id: mlsys.accumulation-precision
  label: Accumulation precision
  family: execution
  definition: The numerical format used to sum products in dot products and reductions, which may differ from input precision
    and governs rounding-error growth.
  status: draft
- id: mlsys.expert-parallel
  label: Expert parallelism
  family: distributed
  definition: Placing different experts of a mixture-of-experts layer on different devices and exchanging routed tokens among
    them.
  status: draft
  aliases:
  - EP
- id: mlsys.sequence-parallel
  label: Sequence and context parallelism
  family: distributed
  definition: Partitioning activations along the sequence dimension across devices, exchanging keys, values, or partial results
    so long sequences fit.
  status: draft
  aliases:
  - context parallelism
  - ring attention
- id: mlsys.hybrid-parallel
  label: Hybrid parallelism
  family: distributed
  definition: Combining data, tensor, pipeline, and other parallelism dimensions, mapped onto the hardware hierarchy so the
    most communication-intensive dimension uses the fastest links.
  status: draft
  aliases:
  - 3D parallelism
- id: mlsys.pipeline-bubble
  label: Pipeline bubble
  family: distributed
  definition: Idle device time during pipeline fill and drain, whose fraction shrinks as the number of microbatches grows
    relative to pipeline stages.
  status: draft
- id: mlsys.ring-allreduce
  label: Ring all-reduce
  family: distributed
  definition: An all-reduce performed as reduce-scatter then all-gather around a ring, bandwidth-optimal for large messages
    but with latency linear in participants.
  status: draft
- id: mlsys.tree-allreduce
  label: Tree and hierarchical all-reduce
  family: distributed
  definition: All-reduce schedules over trees or hierarchical groups, with latency logarithmic in participants, suited to
    small messages and multi-level networks.
  status: draft
- id: mlsys.all-to-all
  label: All-to-all exchange
  family: distributed
  definition: A collective in which every participant sends distinct data to every other, as in expert routing; its throughput
    is sensitive to bisection bandwidth.
  status: draft
  aliases:
  - AllToAll
- id: mlsys.alpha-beta-model
  label: Alpha-beta communication model
  family: distributed
  definition: A cost model estimating message time as a fixed latency term plus message size times a per-byte cost, used to
    compare collective algorithms.
  status: draft
  aliases:
  - latency-bandwidth model
- id: mlsys.gradient-compression
  label: Gradient compression
  family: distributed
  definition: Reducing gradient communication through quantization, sparsification, or low-rank approximation, often with
    error feedback to preserve convergence.
  status: draft
- id: mlsys.lease
  label: Lease
  family: distributed
  definition: A time-bounded grant of authority or cached state that expires unless renewed, letting a system recover from
    failed holders without explicit release.
  status: draft
  scope: background
- id: mlsys.leader-election
  label: Leader election
  family: distributed
  definition: Selecting a single coordinator among replicas, typically through consensus and leases, so control decisions
    have one authoritative source.
  status: draft
  scope: background
- id: mlsys.bounded-staleness
  label: Bounded staleness
  family: distributed
  definition: A consistency model in which workers may compute on parameters up to a fixed number of updates old, trading
    freshness for less waiting.
  status: draft
  aliases:
  - stale synchronous parallel
- id: mlsys.federated-averaging
  label: Federated averaging
  family: learning
  definition: A federated algorithm in which sampled clients run several local optimization steps and a server averages their
    model updates, weighted by data size.
  status: draft
  aliases:
  - FedAvg
- id: mlsys.non-iid-data
  label: Statistical heterogeneity
  family: data
  definition: Differences in data distribution and quantity across federated clients, which slow convergence and can bias
    a shared model.
  status: draft
  aliases:
  - non-IID data
- id: mlsys.client-sampling
  label: Client selection
  family: distributed
  definition: Choosing which available devices participate in each federated round, subject to availability, connectivity,
    and power constraints.
  status: draft
- id: mlsys.federation-setting
  label: Cross-device vs. cross-silo federation
  family: distributed
  definition: The distinction between federations of many intermittently available devices and federations of a few reliable
    organizational data holders.
  status: draft
- id: mlsys.pue
  label: Power usage effectiveness
  family: economics
  definition: Total facility energy divided by IT equipment energy, measuring overhead from cooling, power conversion, and
    other non-compute loads.
  status: draft
  aliases:
  - PUE
- id: mlsys.liquid-cooling
  label: Liquid cooling
  family: hardware
  definition: Removing heat with liquid through cold plates or immersion, enabling rack power densities beyond the practical
    limits of air cooling.
  status: draft
- id: mlsys.rack-power-density
  label: Rack power density
  family: hardware
  definition: Electrical power drawn per rack, which determines cooling technology, floor layout, and how many accelerators
    fit within a facility's power envelope.
  status: draft
- id: mlsys.power-oversubscription
  label: Power oversubscription
  family: economics
  definition: Deploying more equipment than the sum of nameplate power a feed supports, relying on non-coincident peaks and
    power capping to stay within limits.
  status: draft
- id: mlsys.warehouse-scale-computer
  label: Warehouse-scale computer
  family: hardware
  definition: A datacenter treated as a single computer whose power, cooling, network, and software are co-designed for a
    common workload.
  status: draft
  aliases:
  - WSC
- id: mlsys.rdma
  label: Remote direct memory access
  family: distributed
  definition: Network transfers that read or write remote memory directly through the network interface without remote CPU
    involvement, giving low latency and high throughput.
  status: draft
  aliases:
  - RDMA
  - InfiniBand
  - RoCE
- id: mlsys.lossless-fabric
  label: Lossless network fabric
  family: distributed
  definition: A network that avoids packet drops through credit-based or priority flow control, as RDMA transports expect,
    at the risk of head-of-line blocking.
  status: draft
  aliases:
  - PFC
- id: mlsys.congestion-control
  label: Datacenter congestion control
  family: distributed
  definition: End-host and switch mechanisms, such as ECN-driven rate control, that limit queue buildup from incast and synchronized
    collective traffic.
  status: draft
  aliases:
  - DCQCN
- id: mlsys.fat-tree
  label: Fat-tree (Clos) topology
  family: distributed
  definition: A multistage switch topology providing many equal-cost paths and, without oversubscription, full bisection bandwidth
    between endpoints.
  status: draft
  aliases:
  - Clos
- id: mlsys.rail-optimized
  label: Rail-optimized topology
  family: distributed
  definition: A fabric design connecting the same-index accelerator of every node to a common leaf switch, keeping most collective
    traffic within one switch hop.
  status: draft
- id: mlsys.bisection-bandwidth
  label: Bisection bandwidth
  family: distributed
  definition: The minimum total bandwidth across any cut dividing a network into two equal halves, bounding throughput of
    all-to-all and global exchanges.
  status: draft
- id: mlsys.in-network-reduction
  label: In-network reduction
  family: distributed
  definition: Performing collective reductions inside network switches so data crosses each link fewer times, lowering all-reduce
    traffic and latency.
  status: draft
  aliases:
  - SHARP
- id: mlsys.parallel-file-system
  label: Parallel file system
  family: data
  definition: A distributed file system that stripes data across many storage servers to deliver aggregate bandwidth to many
    concurrent clients.
  status: draft
  aliases:
  - Lustre
  - GPFS
- id: mlsys.object-storage
  label: Object storage
  family: data
  definition: Storage of immutable named objects behind an HTTP-style interface, offering scalable capacity and throughput
    with higher per-request latency than file systems.
  status: draft
- id: mlsys.input-pipeline
  label: Training input pipeline
  family: data
  definition: The read, decode, transform, shuffle, and prefetch stages that deliver batches to accelerators; when slower
    than compute, they cause data stalls.
  status: draft
  aliases:
  - data loader
- id: mlsys.checkpoint-io
  label: Checkpoint I/O
  family: distributed
  definition: Writing and reading large training-state snapshots, where storage bandwidth, asynchronous persistence, and sharded
    layout determine checkpoint cost.
  status: draft
- id: mlsys.storage-tiering
  label: Storage tiering and caching
  family: data
  definition: Placing data across tiers, from memory and local NVMe caches to shared and archival storage, according to access
    frequency and cost.
  status: draft
- id: mlsys.gang-scheduling
  label: Gang scheduling
  family: operations
  definition: Allocating all resources a parallel job needs at once, or none, so tightly coupled workers start together and
    partial allocations cannot deadlock.
  status: draft
- id: mlsys.job-preemption
  label: Job preemption
  family: operations
  definition: Suspending or evicting a running job to reclaim its resources for higher-priority work, at a cost set by checkpointing
    and lost progress.
  status: draft
- id: mlsys.dominant-resource-fairness
  label: Dominant resource fairness
  family: economics
  definition: A multi-resource fair-sharing policy that equalizes each user's largest share across resource types such as
    accelerators, CPUs, and memory.
  status: draft
  aliases:
  - DRF
- id: mlsys.elastic-training
  label: Elastic training
  family: distributed
  definition: Training that continues while the number of workers changes, resharding state and adjusting batch size or learning
    rate as resources join or leave.
  status: draft
- id: mlsys.topology-aware-placement
  label: Topology-aware placement
  family: distributed
  definition: Assigning a job's workers to devices and nodes so that heavily communicating groups share fast links or switches.
  status: draft
- id: mlsys.bin-packing
  label: Bin packing
  family: operations
  definition: Placing jobs onto nodes to minimize fragmentation of resources such as accelerators, trading packing density
    against interference and locality.
  status: draft
- id: mlsys.multi-tenancy
  label: Multi-tenancy
  family: operations
  definition: Sharing infrastructure among teams, jobs, or customers under policies for allocation, isolation, priority, and
    accounting.
  status: draft
- id: mlsys.resource-quota
  label: Resource quota
  family: operations
  definition: A limit on the resources a tenant may hold or request, sometimes with guaranteed minimums and borrowing of idle
    capacity.
  status: draft
- id: mlsys.gpu-partitioning
  label: Accelerator sharing and partitioning
  family: hardware
  definition: Running several workloads on one accelerator by time-slicing, concurrent contexts, or hardware partitions with
    dedicated memory and compute slices.
  status: draft
  aliases:
  - MIG
  - GPU sharing
- id: mlsys.spot-capacity
  label: Spot and preemptible capacity
  family: economics
  definition: Discounted compute that the provider may reclaim at short notice, usable by workloads that tolerate interruption.
  status: draft
- id: mlsys.performance-interference
  label: Performance interference
  family: operations
  definition: Slowdown of one workload caused by co-located workloads contending for shared caches, memory bandwidth, network,
    or power.
  status: draft
  aliases:
  - noisy neighbor
- id: mlsys.weak-supervision
  label: Weak supervision
  definition: Producing training labels from noisy programmatic sources such as heuristics, rules, or distant supervision,
    then modeling and combining their errors.
  family: data
  status: draft
- id: mlsys.active-learning
  label: Active learning
  definition: Selecting which unlabeled examples to annotate next according to their expected value to the model.
  family: data
  status: draft
- id: mlsys.annotator-agreement
  label: Inter-annotator agreement
  definition: The degree to which independent annotators assign the same label to the same item, used to measure label reliability
    and task ambiguity.
  family: data
  status: draft
- id: mlsys.quality-filtering
  label: Quality filtering
  definition: Removing or down-weighting training examples judged low quality by heuristics, classifiers, or model scores.
  family: data
  status: draft
- id: mlsys.data-mixture
  label: Data mixture
  definition: The proportions in which source domains or datasets are sampled during training.
  family: data
  status: draft
  aliases:
  - domain mixture
- id: mlsys.synthetic-data
  label: Synthetic data
  definition: Training or evaluation examples generated by simulators, programs, or models rather than collected from the
    target environment.
  family: data
  status: draft
- id: mlsys.data-augmentation
  label: Data augmentation
  definition: Creating additional training examples by applying label-preserving transformations to existing ones.
  family: data
  status: draft
- id: mlsys.data-validation
  label: Data validation
  definition: Automated checks of incoming data against expected schema, value ranges, and distributions before it is used
    for training or serving.
  family: data
  status: draft
- id: mlsys.feature-store
  label: Feature store
  definition: A system that defines, computes, stores, and serves features consistently for offline training and online inference.
  family: data
  status: draft
- id: mlsys.stream-processing
  label: Stream processing
  definition: Continuously transforming unbounded event streams with low latency and incrementally maintained state.
  family: data
  status: draft
- id: mlsys.feature-backfill
  label: Feature backfill
  definition: Recomputing a feature's historical values under a new or corrected definition so training data matches what
    serving will produce.
  family: data
  status: draft
- id: mlsys.data-versioning
  label: Dataset versioning
  definition: Recording immutable, addressable versions of datasets so that a training run or evaluation can identify exactly
    which data it used.
  family: data
  status: draft
- id: mlsys.data-dependency
  label: Data dependency debt
  definition: Undeclared, unstable, or underused input signals on which a model depends, which can change or break its behavior
    silently.
  family: data
  status: draft
- id: mlsys.feature-freshness
  label: Feature freshness
  definition: The age of a feature value at the time it is used for a prediction, relative to the freshness assumed during
    training.
  family: data
  status: draft
- id: mlsys.learning-rate-schedule
  label: Learning-rate schedule
  definition: The planned variation of the optimizer step size over training, such as warmup followed by decay.
  family: learning
  status: draft
- id: mlsys.critical-batch-size
  label: Critical batch size
  definition: The batch size beyond which increasing it further yields diminishing reductions in optimization steps to reach
    a target loss.
  family: learning
  status: draft
- id: mlsys.training-instability
  label: Training instability
  definition: Loss spikes, divergence, or collapse during training, often mitigated by gradient clipping, schedule changes,
    normalization, or restarting from a checkpoint.
  family: learning
  status: draft
- id: mlsys.gradient-accumulation
  label: Gradient accumulation
  definition: Summing gradients over several micro-batches before one optimizer update to emulate a larger batch within limited
    memory.
  family: learning
  status: draft
- id: mlsys.memory-offloading
  label: Training-state offloading
  definition: Moving optimizer state, parameters, or activations from accelerator memory to host memory or storage between
    uses.
  family: learning
  status: draft
- id: mlsys.experiment-tracking
  label: Experiment tracking
  definition: Recording each run's code, data, configuration, metrics, and artifacts in a queryable store for comparison and
    reproduction.
  family: learning
  status: draft
- id: mlsys.hyperparameter-transfer
  label: Hyperparameter transfer
  definition: Tuning hyperparameters on smaller proxy models and reusing them at larger scale under a parameterization designed
    to keep them stable.
  family: learning
  status: draft
  aliases:
  - muP
- id: mlsys.supervised-fine-tuning
  label: Supervised fine-tuning
  definition: Continued training of a pretrained model on input-output demonstrations, such as instruction-response pairs,
    to shape task behavior.
  family: learning
  status: draft
  aliases:
  - SFT
  - instruction tuning
- id: mlsys.lora
  label: Low-rank adaptation
  definition: Fine-tuning by learning low-rank update matrices added to frozen pretrained weights.
  family: learning
  status: draft
  aliases:
  - LoRA
- id: mlsys.rlhf
  label: RL from human feedback
  definition: Optimizing a model's policy against a reward model trained on human preference comparisons, usually with a penalty
    for drifting from a reference model.
  family: learning
  status: draft
  aliases:
  - RLHF
  scope: generative-extension
- id: mlsys.reward-model
  label: Reward model
  definition: A learned model that scores outputs or trajectories to supply the training signal for policy optimization.
  family: learning
  status: draft
  scope: generative-extension
- id: mlsys.preference-optimization
  label: Direct preference optimization
  definition: Training a policy directly on preferred-versus-rejected output pairs with a classification-style loss, without
    a separate reward model or RL loop.
  family: learning
  status: draft
  aliases:
  - DPO
  scope: generative-extension
- id: mlsys.rlvr
  label: RL with verifiable rewards
  definition: Reinforcement learning in which rewards come from programmatic checks of outcomes, such as answer matching or
    test execution, rather than learned preference models.
  family: learning
  status: draft
  aliases:
  - RLVR
  - GRPO-style training
  scope: generative-extension
- id: mlsys.rl-rollout
  label: RL rollout generation
  definition: Sampling responses or trajectories from the current policy, often with an inference engine, to produce experience
    for policy updates.
  family: learning
  status: draft
  scope: generative-extension
- id: mlsys.weight-sync
  label: Policy weight synchronization
  definition: Transferring updated policy weights from training workers to rollout workers, whose cost and frequency shape
    RL post-training throughput.
  family: distributed
  status: draft
  scope: generative-extension
- id: mlsys.policy-staleness
  label: Policy staleness
  definition: The lag between the policy version that generated rollouts and the version being updated, introduced by asynchronous
    rollout and training.
  family: learning
  status: draft
  aliases:
  - off-policy lag
  scope: generative-extension
- id: mlsys.online-learning
  label: Online learning
  definition: Updating a model incrementally as each example or small batch arrives, rather than retraining on a fixed dataset.
  family: learning
  status: draft
- id: mlsys.incremental-training
  label: Incremental training
  definition: Continuing training of an existing model from its current weights on new data instead of training from scratch.
  family: learning
  status: draft
  aliases:
  - stateful training
  - warm-start training
- id: mlsys.catastrophic-forgetting
  label: Catastrophic forgetting
  definition: Loss of previously learned capability when a model is trained on new data or tasks.
  family: learning
  status: draft
- id: mlsys.experience-replay
  label: Experience replay
  definition: Mixing stored past examples into updates on new data to reduce forgetting or reuse experience.
  family: learning
  status: draft
- id: mlsys.on-device-training
  label: On-device training
  definition: Updating model parameters on the deployment device using local data under its memory, energy, and compute limits.
  family: learning
  status: draft
- id: mlsys.cross-validation
  label: Cross-validation
  definition: Estimating performance by repeatedly training on some data partitions and evaluating on the held-out remainder.
  family: evaluation
  status: draft
  scope: background
- id: mlsys.sequential-testing
  label: Sequential testing
  definition: Experimental analysis that permits repeated looks at accumulating data while controlling error rates, unlike
    fixed-horizon tests.
  family: evaluation
  status: draft
  aliases:
  - SPRT
  - always-valid inference
- id: mlsys.experiment-interference
  label: Experiment interference
  definition: Treatment of one experimental unit affecting outcomes of another, violating the no-interference assumption (SUTVA)
    of standard A/B analysis.
  family: evaluation
  status: draft
  aliases:
  - SUTVA violation
- id: mlsys.conformal-prediction
  label: Conformal prediction
  definition: Constructing prediction sets with finite-sample coverage guarantees under exchangeability, using held-out calibration
    scores.
  family: evaluation
  status: draft
  scope: background
- id: mlsys.slice-discovery
  label: Slice discovery
  definition: Automatically finding coherent data subsets on which a model underperforms, without predefined slice labels.
  family: evaluation
  status: draft
- id: mlsys.llm-judge
  label: Model-based grading
  definition: Using a language model to score or compare generated outputs against a rubric, with its own biases and error
    rates to be measured.
  family: evaluation
  status: draft
  aliases:
  - LLM-as-judge
  scope: generative-extension
- id: mlsys.pass-at-k
  label: pass@k
  definition: The probability that at least one of k sampled outputs satisfies a correctness check.
  family: evaluation
  status: draft
  scope: generative-extension
- id: mlsys.pairwise-preference-eval
  label: Pairwise preference evaluation
  definition: Ranking models from judgments of which of two outputs is better, typically aggregated with a Bradley-Terry or
    Elo-style model.
  family: evaluation
  status: draft
  scope: generative-extension
- id: mlsys.human-evaluation
  label: Human evaluation
  definition: Assessment of system outputs by people following a protocol, used where automatic metrics or model graders are
    not trusted.
  family: evaluation
  status: draft
- id: mlsys.benchmark-contamination
  label: Benchmark contamination
  definition: Presence of evaluation items, or close variants, in a model's training data, inflating measured performance.
  family: evaluation
  status: draft
  scope: generative-extension
- id: mlsys.time-to-train
  label: Time to train
  definition: Wall-clock time for a system to train a specified model to a specified quality target under fixed run rules.
  family: evaluation
  status: draft
- id: mlsys.inference-load-scenario
  label: Inference load scenario
  definition: A specified query-arrival pattern and latency constraint, such as single-stream, server, or offline, under which
    inference performance is measured.
  family: evaluation
  status: draft
- id: mlsys.metamorphic-testing
  label: Metamorphic testing
  definition: Testing by checking that known relations hold between outputs for related inputs, when correct outputs for single
    inputs are unknown.
  family: evaluation
  status: draft
- id: mlsys.behavioral-testing
  label: Behavioral testing
  definition: Testing model capabilities with targeted input suites for invariance, directional change, and minimum functionality,
    independent of aggregate accuracy.
  family: evaluation
  status: draft
- id: mlsys.production-readiness
  label: Production-readiness assessment
  definition: A structured rubric of data, model, infrastructure, and monitoring tests used to judge whether an ML system
    is ready to operate.
  family: evaluation
  status: draft
- id: mlsys.online-inference
  label: Online inference
  definition: Producing predictions on demand for individual requests within a latency target.
  family: serving
  status: draft
  aliases:
  - real-time prediction
- id: mlsys.batch-inference
  label: Batch inference
  definition: Computing predictions for many inputs in scheduled jobs and storing them for later lookup.
  family: serving
  status: draft
  aliases:
  - offline prediction
- id: mlsys.model-server
  label: Model server
  definition: A service that loads model artifacts and executes inference requests behind a network interface, managing versions,
    batching, and resources.
  family: serving
  status: draft
  aliases:
  - inference server
- id: mlsys.multi-model-serving
  label: Multi-model serving
  definition: Hosting many models or adapters on shared serving resources, trading isolation and load time against utilization.
  family: serving
  status: draft
- id: mlsys.model-cascade
  label: Model cascade
  definition: Sending a request to cheaper models first and escalating to more capable models only when a confidence or quality
    criterion is not met.
  family: serving
  status: draft
- id: mlsys.model-routing
  label: Model routing
  definition: Choosing which model serves each request from request features, predicted quality, and cost.
  family: serving
  status: draft
- id: mlsys.ttft
  label: Time to first token
  definition: Latency from request arrival until the first generated token is returned, dominated by queueing and prefill.
  family: serving
  status: draft
  aliases:
  - TTFT
  scope: generative-extension
- id: mlsys.tpot
  label: Time per output token
  definition: Average latency between successive generated tokens after the first, dominated by decode step time.
  family: serving
  status: draft
  aliases:
  - TPOT
  - inter-token latency
  scope: generative-extension
- id: mlsys.hedged-requests
  label: Hedged requests
  definition: Issuing a duplicate request to another replica when the first has not responded within a delay, and using whichever
    returns first.
  family: serving
  status: draft
- id: mlsys.continuous-batching
  label: Continuous batching
  definition: Scheduling at each generation iteration so finished sequences leave and new requests join a running batch.
  family: serving
  status: draft
  aliases:
  - iteration-level batching
  - in-flight batching
  scope: generative-extension
- id: mlsys.load-balancing
  label: Request load balancing
  definition: Distributing requests across replicas according to load, locality, or cached state.
  family: serving
  status: draft
- id: mlsys.cold-start
  label: Model cold start
  definition: Delay before a newly started replica can serve, from provisioning, loading weights, and warming runtime state.
  family: serving
  status: draft
- id: mlsys.chunked-prefill
  label: Chunked prefill
  definition: Splitting a long prompt's prefill into chunks interleaved with decode steps to bound per-iteration latency.
  family: serving
  status: draft
  scope: generative-extension
- id: mlsys.pd-disaggregation
  label: Prefill-decode disaggregation
  definition: Running prefill and decode on separate resource pools, transferring KV state between them, so each phase is
    provisioned and batched independently.
  family: serving
  status: draft
  aliases:
  - disaggregated serving
  scope: generative-extension
- id: mlsys.sampling-controls
  label: Decoding and sampling controls
  definition: Parameters and rules, such as greedy, temperature, top-k, and nucleus sampling, that determine how tokens are
    chosen from a model's distribution.
  family: serving
  status: draft
  scope: generative-extension
- id: mlsys.constrained-decoding
  label: Constrained decoding
  definition: Masking disallowed tokens at each step, typically from a grammar or schema automaton, so output satisfies a
    structural constraint.
  family: serving
  status: draft
  aliases:
  - grammar-guided decoding
  scope: generative-extension
- id: mlsys.output-validation
  label: Output validation
  definition: Checking generated output against a schema or rules after generation and repairing, retrying, or rejecting it
    on failure.
  family: serving
  status: draft
  scope: generative-extension
- id: mlsys.reasoning-budget
  label: Reasoning budget
  definition: A limit on the intermediate tokens or steps a model may spend before answering, set to trade quality against
    latency and cost.
  family: serving
  status: draft
  aliases:
  - thinking budget
  scope: generative-extension
- id: mlsys.best-of-n
  label: Best-of-n sampling
  definition: Generating n candidate outputs and returning the one ranked highest by a scorer or verifier.
  family: serving
  status: draft
  scope: generative-extension
- id: mlsys.self-consistency
  label: Self-consistency voting
  definition: Sampling multiple reasoning paths and returning the most frequent final answer.
  family: serving
  status: draft
  aliases:
  - majority voting
  scope: generative-extension
- id: mlsys.verifier
  label: Verifier
  definition: A model or program that judges whether a candidate output or reasoning step is correct, used for selection,
    search, or reward.
  family: evaluation
  status: draft
  aliases:
  - outcome reward model
  scope: generative-extension
- id: mlsys.process-reward-model
  label: Process reward model
  definition: A verifier that scores intermediate reasoning steps rather than only final answers.
  family: evaluation
  status: draft
  aliases:
  - PRM
  scope: generative-extension
- id: mlsys.inference-time-search
  label: Inference-time search
  definition: Exploring a tree of partial solutions, as in beam or tree search, guided by a scorer, to find a higher-quality
    output.
  family: serving
  status: draft
  scope: generative-extension
- id: mlsys.test-time-scaling
  label: Test-time scaling
  definition: The empirical relation between inference compute spent per query and output quality, used to allocate compute
    between model size and inference.
  family: serving
  status: draft
  scope: generative-extension
- id: mlsys.rag
  label: Retrieval-augmented generation
  definition: Conditioning generation on documents retrieved for the request so outputs can draw on information outside the
    model's parameters.
  family: retrieval
  status: draft
  aliases:
  - RAG
  scope: generative-extension
- id: mlsys.dense-retrieval
  label: Dense retrieval
  definition: Retrieving records by similarity between learned embeddings of query and records.
  family: retrieval
  status: draft
- id: mlsys.lexical-retrieval
  label: Lexical retrieval
  definition: Retrieving records by weighted term overlap with the query using an inverted index, as in BM25.
  family: retrieval
  status: draft
  aliases:
  - sparse retrieval
  - BM25
  scope: background
- id: mlsys.reranking
  label: Reranking
  definition: Reordering a retrieved candidate set with a more expensive relevance model before use.
  family: retrieval
  status: draft
- id: mlsys.model-conversion
  label: Model conversion
  definition: Translating a trained model into the format and operator set of a target runtime, possibly changing numerics
    and supported operations.
  family: serving
  status: draft
  aliases:
  - model export
- id: mlsys.on-device-runtime
  label: On-device inference runtime
  definition: An interpreter or compiled engine that executes models on mobile, embedded, or microcontroller targets within
    their memory and operator limits.
  family: serving
  status: draft
- id: mlsys.ota-model-update
  label: Over-the-air model update
  definition: Delivering new model versions to deployed devices remotely, with staging, verification, and rollback across
    the device fleet.
  family: operations
  status: draft
  aliases:
  - OTA update
- id: mlsys.device-cloud-partitioning
  label: Device-cloud partitioning
  definition: Splitting inference between device and server, by layer or by model, to balance latency, energy, bandwidth,
    and privacy.
  family: serving
  status: draft
  aliases:
  - split computing
  - offloading
- id: mlsys.device-heterogeneity
  label: Device heterogeneity
  definition: Variation in hardware, operating system, and runtime capability across a deployed device fleet that a single
    model release must accommodate.
  family: serving
  status: draft
- id: mlsys.model-registry
  label: Model registry
  definition: A versioned store of model artifacts with metadata, lineage, and lifecycle stage used to govern promotion and
    deployment.
  family: operations
  status: draft
- id: mlsys.shadow-deployment
  label: Shadow deployment
  definition: Running a candidate model on live traffic without serving its outputs, to compare it against the production
    model.
  family: operations
  status: draft
  aliases:
  - shadow mode
- id: mlsys.ml-ci-cd
  label: CI/CD for ML
  definition: Automated building, testing, and deployment of ML code, data checks, and model artifacts on each change.
  family: operations
  status: draft
- id: mlsys.release-gate
  label: Release gate
  definition: A predeclared set of checks a candidate model must pass before it advances to a wider deployment stage.
  family: operations
  status: draft
  aliases:
  - validation gate
- id: mlsys.drift-detection
  label: Drift detection
  definition: Statistical tests or distances comparing production and reference distributions of inputs, predictions, or outcomes
    to flag change.
  family: operations
  status: draft
- id: mlsys.inference-logging
  label: Prediction logging
  definition: Recording requests, model versions, outputs, and later outcomes so production behavior can be analyzed, debugged,
    and reused as data.
  family: operations
  status: draft
- id: mlsys.alerting
  label: Alerting
  definition: Rules that turn monitored signals into notifications for responders, tuned to balance missed incidents against
    alert fatigue.
  family: operations
  status: draft
- id: mlsys.concept-drift
  label: Concept drift
  definition: Change over time in the relationship between inputs and targets, so the same input warrants a different prediction.
  family: operations
  status: draft
- id: mlsys.continuous-training
  label: Continuous training
  definition: An automated pipeline that retrains, validates, and proposes models on a schedule or when triggered by data
    or performance signals.
  family: operations
  status: draft
  aliases:
  - CT
- id: mlsys.postmortem
  label: Blameless postmortem
  definition: A written analysis after an incident of its timeline, causes, and corrective actions, focused on system fixes
    rather than blame.
  family: operations
  status: draft
  scope: background
- id: mlsys.failure-attribution
  label: ML failure attribution
  definition: Determining whether a production failure stems from data, model, code, configuration, or infrastructure, or
    from an adversary.
  family: operations
  status: draft
- id: mlsys.configuration-management
  label: ML configuration management
  definition: Treating model, feature, and pipeline configuration as versioned, reviewed, and tested code.
  family: operations
  status: draft
- id: mlsys.infrastructure-as-code
  label: Infrastructure as code
  definition: Declaring compute, storage, and service infrastructure in versioned machine-readable files from which environments
    are provisioned.
  family: operations
  status: draft
  aliases:
  - IaC
  scope: background
- id: mlsys.ml-platform
  label: ML platform
  definition: Shared internal infrastructure and services that standardize how teams train, deploy, and operate models.
  family: operations
  status: draft
- id: mlsys.technical-debt
  label: ML technical debt
  definition: Accumulated system costs from shortcuts in ML code, data dependencies, configuration, and pipelines that make
    future change slower and riskier.
  family: operations
  status: draft
- id: mlsys.entanglement
  label: Entanglement
  definition: The property that changing any input, feature, or hyperparameter of a model can change its behavior on everything
    else.
  family: operations
  status: draft
  aliases:
  - CACE
- id: mlsys.undeclared-consumers
  label: Undeclared consumers
  definition: Systems that use a model's outputs without the model owner's knowledge, creating hidden coupling.
  family: operations
  status: draft
- id: mlsys.mlops-maturity
  label: MLOps maturity
  definition: Staged levels of automation, from manual training and deployment to automated continuous training and delivery.
  family: operations
  status: draft
- id: mlsys.ml-roles
  label: ML team roles
  definition: The division of responsibilities among data, modeling, platform, and operations roles that owns an ML system
    across its lifecycle.
  family: operations
  status: draft
- id: mlsys.model-deprecation
  label: Model deprecation
  definition: Planned withdrawal of a model from service, including notifying and migrating its consumers before removing
    it.
  family: operations
  status: draft
- id: mlsys.artifact-archival
  label: Artifact archival
  definition: Preserving retired models, data references, and evaluation records needed for audit, reproduction, or rollback
    after service ends.
  family: operations
  status: draft
- id: mlsys.data-retention
  label: Data retention
  definition: Policy and mechanisms that set how long data, logs, and derived artifacts are kept and when they are deleted.
  family: trust
  status: draft
- id: mlsys.model-flops-utilization
  label: Model FLOPs utilization
  aliases:
  - MFU
  definition: Model-required floating-point operations per second achieved, divided by the aggregate peak FLOP rate of the
    hardware used, excluding recomputation.
  family: hardware
  status: draft
- id: mlsys.bottleneck-analysis
  label: Bottleneck analysis
  definition: Identifying the resource or stage, such as compute, memory bandwidth, I/O, or communication, whose capacity
    limits end-to-end throughput or latency for a workload.
  family: hardware
  status: draft
- id: mlsys.training-goodput
  label: Training goodput
  aliases:
  - ML goodput
  definition: The fraction of allocated accelerator time that produces retained training progress, after losses to scheduling,
    failures, restarts, and lost work.
  family: hardware
  status: draft
- id: mlsys.pruning
  label: Pruning
  definition: Removing weights, neurons, channels, or other structures judged unimportant from a network, usually followed
    by fine-tuning to recover quality.
  family: execution
  status: draft
- id: mlsys.structured-pruning
  label: Structured pruning
  definition: Pruning whole channels, filters, heads, or layers so that the remaining model stays dense and runs faster without
    sparse-execution support.
  family: execution
  status: draft
- id: mlsys.low-rank-factorization
  label: Low-rank factorization
  aliases:
  - low-rank approximation
  definition: Approximating a weight matrix or tensor by a product of smaller factors of reduced rank to cut parameters and
    operations.
  family: execution
  status: draft
- id: mlsys.quantization-aware-training
  label: Quantization-aware training
  aliases:
  - QAT
  definition: Training or fine-tuning with simulated quantization in the forward pass so the model adapts to reduced precision,
    in contrast to post-training quantization.
  family: execution
  status: draft
- id: mlsys.neural-architecture-search
  label: Neural architecture search
  aliases:
  - NAS
  definition: Automated search over a defined space of network architectures for designs that optimize a stated objective
    such as accuracy under a cost budget.
  family: models
  status: draft
- id: mlsys.hardware-aware-nas
  label: Hardware-aware NAS
  aliases:
  - platform-aware NAS
  definition: Architecture search whose objective includes latency, energy, or memory measured or predicted on the target
    device rather than proxy counts such as FLOPs.
  family: models
  status: draft
- id: mlsys.depthwise-separable-convolution
  label: Depthwise separable convolution
  definition: Factoring a standard convolution into a per-channel spatial convolution followed by a pointwise convolution,
    reducing operations and parameters.
  family: models
  status: draft
- id: mlsys.efficiency-frontier
  label: Accuracy-efficiency frontier
  aliases:
  - Pareto frontier
  definition: The set of model configurations for which no alternative improves quality without worsening a stated cost measure
    on a stated platform.
  family: objectives
  status: draft
- id: mlsys.model-hardware-co-design
  label: Model-hardware co-design
  definition: Jointly choosing model architecture and hardware or kernel design so that each exploits the other's structure.
  family: hardware
  status: draft
- id: mlsys.retry-backoff
  label: Retry with backoff
  definition: Reissuing a failed request after increasing, typically jittered, delays and within a retry budget, so that transient
    faults recover without overloading dependencies.
  family: operations
  status: draft
  scope: background
- id: mlsys.circuit-breaker
  label: Circuit breaker
  definition: A client-side guard that stops sending requests to a failing dependency after an error threshold and probes
    it before resuming traffic.
  family: operations
  status: draft
  scope: background
- id: mlsys.replication-failover
  label: Replication and failover
  definition: Maintaining redundant replicas of a service or state and redirecting work to a healthy replica when one fails.
  family: operations
  status: draft
- id: mlsys.graceful-degradation
  label: Graceful degradation
  definition: Continuing to serve with reduced quality, features, or freshness under failure or overload instead of failing
    outright.
  family: operations
  status: draft
- id: mlsys.checkpoint-interval
  label: Optimal checkpoint interval
  aliases:
  - Young-Daly interval
  definition: The checkpoint period that minimizes expected lost time, balancing checkpoint write cost against expected rework,
    approximately the square root of twice the write cost times MTBF.
  family: distributed
  status: draft
- id: mlsys.async-checkpointing
  label: Asynchronous checkpointing
  definition: Snapshotting training state quickly to host memory and persisting it in the background so computation resumes
    before the durable write completes.
  family: distributed
  status: draft
- id: mlsys.silent-data-corruption
  label: Silent data corruption
  aliases:
  - SDC
  definition: Hardware producing wrong computational results without raising an error or crash, so the corruption propagates
    undetected.
  family: hardware
  status: draft
- id: mlsys.mtbf
  label: Mean time between failures
  aliases:
  - MTBF
  definition: The expected operating time between failures of a component or system; for independent components, system MTBF
    shrinks roughly in inverse proportion to component count.
  family: operations
  status: draft
- id: mlsys.availability
  label: Availability
  definition: The fraction of time or requests for which a system performs its specified function, approximately MTBF divided
    by MTBF plus mean time to repair.
  family: operations
  status: draft
- id: mlsys.gray-failure
  label: Gray failure
  definition: A partial or degraded failure that some observers detect and others do not, such as a slow or lossy node that
    still passes health checks.
  family: operations
  status: draft
- id: mlsys.failure-domain
  label: Failure domain
  aliases:
  - correlated failure
  definition: A set of components that can fail together from a shared cause, such as a rack, power feed, switch, or software
    release.
  family: operations
  status: draft
- id: mlsys.abft
  label: Algorithm-based fault tolerance
  aliases:
  - ABFT
  definition: Detecting or correcting computational errors by carrying checksums through an algorithm, such as matrix multiplication,
    and verifying invariants on its outputs.
  family: execution
  status: draft
  scope: specialist
- id: mlsys.chaos-engineering
  label: Chaos engineering
  definition: Running controlled experiments that inject real-world failures into production-like systems to test a hypothesis
    about steady-state behavior.
  family: operations
  status: draft
  scope: background
- id: mlsys.game-day
  label: Game day
  aliases:
  - disaster recovery exercise
  definition: A scheduled exercise in which teams deliberately trigger failure scenarios to rehearse detection, response,
    and recovery procedures.
  family: operations
  status: draft
  scope: background
- id: mlsys.hardware-fault-injection
  label: Hardware fault injection
  definition: Emulating hardware faults such as bit flips in weights, activations, or registers to measure how errors propagate
    to model outputs.
  family: hardware
  status: draft
- id: mlsys.blast-radius
  label: Blast radius
  definition: The extent of users, components, or effects that a single fault, change, or experiment can impact.
  family: operations
  status: draft
- id: mlsys.backdoor
  label: Backdoor attack
  aliases:
  - trojan attack
  definition: Implanting a hidden behavior in a model, via poisoned data or modified weights, that activates only on inputs
    containing an attacker-chosen trigger.
  family: trust
  status: draft
- id: mlsys.jailbreak
  label: Jailbreak
  definition: A user-crafted input that induces a model to bypass its safety training or usage policy and produce disallowed
    output.
  family: trust
  status: draft
  scope: generative-extension
- id: mlsys.adversarial-training
  label: Adversarial training
  definition: Training on adversarially perturbed inputs generated during training to increase robustness within a specified
    perturbation set.
  family: trust
  status: draft
- id: mlsys.model-extraction
  label: Model extraction
  aliases:
  - model stealing
  definition: Reconstructing a functionally equivalent copy or the parameters of a model by querying its prediction interface.
  family: trust
  status: draft
- id: mlsys.model-watermarking
  label: Model watermarking
  aliases:
  - model fingerprinting
  definition: Embedding a verifiable signature in a model's parameters or behavior so that ownership of copies or derivatives
    can later be demonstrated.
  family: trust
  status: draft
- id: mlsys.artifact-signing
  label: Model artifact signing
  definition: Cryptographically signing model files and their provenance metadata so that consumers can verify integrity and
    origin before loading.
  family: trust
  status: draft
- id: mlsys.unsafe-deserialization
  label: Unsafe model deserialization
  definition: Code execution triggered by loading a model stored in an executable serialization format, such as pickle, from
    an untrusted source.
  family: trust
  status: draft
- id: mlsys.supply-chain-compromise
  label: ML supply-chain compromise
  definition: Introducing malicious or vulnerable components into an ML system through third-party datasets, pretrained weights,
    libraries, build tools, or hardware.
  family: trust
  status: draft
- id: mlsys.membership-inference
  label: Membership inference
  definition: Inferring whether a specific record was in a model's training data from the model's outputs or parameters.
  family: trust
  status: draft
- id: mlsys.model-inversion
  label: Model inversion
  definition: Reconstructing sensitive attributes or representative training inputs from a model's outputs, confidence scores,
    or gradients.
  family: trust
  status: draft
- id: mlsys.dp-sgd
  label: DP-SGD
  aliases:
  - differentially private SGD
  definition: Stochastic gradient descent with per-example gradient clipping and calibrated noise, with privacy loss tracked
    across steps by an accountant.
  family: trust
  status: draft
- id: mlsys.machine-unlearning
  label: Machine unlearning
  definition: Removing the influence of specified training records from a trained model, either exactly by retraining or approximately
    at lower cost.
  family: trust
  status: draft
- id: mlsys.secure-aggregation
  label: Secure aggregation
  definition: A cryptographic protocol that lets a server compute the sum of client updates without seeing any individual
    client's update.
  family: trust
  status: draft
- id: mlsys.least-privilege
  label: Least privilege
  definition: Granting each component or actor only the permissions its task requires, for only as long as it requires them.
  family: trust
  status: draft
- id: mlsys.confidential-computing
  label: Confidential computing
  aliases:
  - trusted execution environment
  - TEE
  definition: Protecting data and models while in use by running computation inside hardware-isolated, attestable trusted
    execution environments.
  family: trust
  status: draft
- id: mlsys.remote-attestation
  label: Remote attestation
  definition: A procedure by which a platform proves to a remote verifier the identity and measured state of its hardware
    and software before receiving secrets.
  family: trust
  status: draft
- id: mlsys.side-channel
  label: Side-channel attack
  definition: Inferring secrets from observable resource behavior, such as timing, power, memory, or cache contention, across
    an isolation boundary.
  family: trust
  status: draft
- id: mlsys.energy-efficiency
  label: Energy efficiency
  aliases:
  - performance per watt
  definition: Useful work completed per unit energy, such as inferences or tokens per joule, measured within a stated system
    boundary.
  family: economics
  status: draft
- id: mlsys.carbon-intensity
  label: Grid carbon intensity
  definition: Greenhouse-gas emissions per unit of electricity supplied, varying by region, time, and generation mix, in grams
    CO2-equivalent per kilowatt-hour.
  family: economics
  status: draft
- id: mlsys.operational-carbon
  label: Operational carbon
  definition: Emissions from electricity consumed while operating a system, computed from energy use and the carbon intensity
    of its supply.
  family: economics
  status: draft
- id: mlsys.emission-scopes
  label: Emission scopes
  aliases:
  - Scope 1, 2, and 3 emissions
  - GHG scopes
  definition: The GHG Protocol classification of emissions into direct (Scope 1), purchased energy (Scope 2), and value-chain
    (Scope 3) categories.
  family: economics
  status: draft
- id: mlsys.carbon-aware-scheduling
  label: Carbon-aware scheduling
  definition: Shifting flexible workloads in time or location toward periods and regions of lower grid carbon intensity, subject
    to deadlines and capacity.
  family: economics
  status: draft
- id: mlsys.embodied-carbon
  label: Embodied carbon
  definition: Emissions from manufacturing, transporting, and disposing of hardware and facilities, attributed to a system
    independent of its operation.
  family: economics
  status: draft
- id: mlsys.lifecycle-assessment
  label: Life cycle assessment
  aliases:
  - LCA
  definition: A standardized method for compiling and evaluating a product's environmental inputs, outputs, and impacts from
    raw materials through disposal.
  family: economics
  status: draft
- id: mlsys.water-footprint
  label: Water footprint
  aliases:
  - WUE
  definition: Water withdrawn or consumed by a system, on site for cooling and off site for electricity generation, per unit
    of work or over its lifetime.
  family: economics
  status: draft
- id: mlsys.hardware-lifetime
  label: Hardware service lifetime
  aliases:
  - refresh cycle
  definition: The period a hardware asset stays in service before replacement, over which its embodied impacts and capital
    cost are amortized.
  family: economics
  status: draft
- id: mlsys.e-waste
  label: Electronic waste
  aliases:
  - e-waste
  definition: Discarded electronic equipment and components, including retired accelerators and servers, and the hazards and
    lost materials of their disposal.
  family: economics
  status: draft
- id: mlsys.tco
  label: Total cost of ownership
  aliases:
  - TCO
  definition: The full cost of acquiring and operating a system over its life, including capital, energy, facilities, networking,
    staff, and amortization.
  family: economics
  status: draft
- id: mlsys.cost-per-token
  label: Cost per token
  definition: Serving or API expenditure divided by tokens processed or generated, often priced separately for input and output
    tokens.
  family: economics
  status: draft
  scope: generative-extension
- id: mlsys.cost-attribution
  label: Cost attribution
  aliases:
  - FinOps
  - chargeback
  definition: Allocating shared infrastructure spend to teams, models, or workloads so that owners see and act on their costs.
  family: economics
  status: draft
- id: mlsys.hazard-analysis
  label: Hazard analysis
  definition: Systematically identifying conditions under which a system could contribute to harm, with their causes, severity,
    and required controls.
  family: trust
  status: draft
- id: mlsys.stpa
  label: System-theoretic process analysis
  aliases:
  - STPA
  definition: Hazard analysis that models a system as a control structure and identifies unsafe control actions and the flawed
    feedback or process models that cause them.
  family: trust
  status: draft
- id: mlsys.fmea
  label: Failure modes and effects analysis
  aliases:
  - FMEA
  definition: Enumerating each component's possible failure modes and tracing their effects on system behavior to rank and
    mitigate them.
  family: trust
  status: draft
- id: mlsys.functional-insufficiency
  label: Functional insufficiency (SOTIF)
  aliases:
  - SOTIF
  - safety of the intended functionality
  definition: Hazardous behavior arising without any fault, from limits of a specification or of a component's performance,
    such as perception errors under particular triggering conditions.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.safety-filter
  label: Safety filter
  definition: A runtime component that passes a proposed action when it is certified safe and otherwise replaces it with a
    minimally different safe action.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.control-barrier-function
  label: Control barrier function
  aliases:
  - CBF
  definition: A function whose sign defines a safe set and whose derivative condition yields input constraints that keep the
    system state inside that set.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.simplex-architecture
  label: Simplex architecture
  definition: Pairing an unverified high-performance controller with a verified safety controller and a decision module that
    switches to the safety controller before safety is lost.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.minimal-risk-condition
  label: Minimal-risk condition
  aliases:
  - MRC
  - safe fallback
  - fallback ladder
  definition: A predefined reduced-capability state the system reaches when it can no longer operate safely, often via an
    ordered ladder of fallback behaviors.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.guardrails
  label: Guardrails
  aliases:
  - content safety filter
  - safety classifier
  definition: Runtime checks on model inputs and outputs that detect and block, rewrite, or escalate content or actions violating
    a stated safety policy.
  family: trust
  scope: generative-extension
  status: draft
- id: mlsys.scenario-based-testing
  label: Scenario-based testing
  definition: Validating a system against a structured catalog of operating scenarios and their parameter ranges, with coverage
    measured over the operating domain.
  family: evaluation
  scope: physical-extension
  status: draft
- id: mlsys.falsification
  label: Simulation-based falsification
  definition: Searching scenario parameters, often guided by temporal-logic robustness, to find counterexamples that violate
    a safety specification.
  family: evaluation
  status: draft
- id: mlsys.formal-verification
  label: Formal verification
  definition: Mathematically proving that a model of a system satisfies a formal specification for all behaviors within stated
    assumptions.
  family: evaluation
  status: draft
- id: mlsys.neural-network-verification
  label: Neural network verification
  definition: Proving or refuting input-output properties of a trained network over a bounded input region, such as local
    robustness, using exact or bound-propagation methods.
  family: evaluation
  status: draft
- id: mlsys.rare-event-validation
  label: Rare-event safety validation
  definition: Estimating or bounding failure probabilities too small to observe in feasible exposure, using importance sampling,
    extreme-value models, or zero-failure statistical bounds.
  family: evaluation
  status: draft
- id: mlsys.xil-testing
  label: X-in-the-loop testing
  aliases:
  - SIL
  - HIL
  - software-in-the-loop
  - hardware-in-the-loop
  definition: A qualification ladder that runs the real software, then real hardware, against simulated or recorded environments
    before physical trials.
  family: evaluation
  scope: physical-extension
  status: draft
- id: mlsys.goal-structuring-notation
  label: Goal Structuring Notation
  aliases:
  - GSN
  definition: A graphical notation for safety cases that links goals, strategies, solutions (evidence), context, and assumptions
    into an explicit argument structure.
  family: trust
  status: draft
  scope: background
- id: mlsys.functional-safety
  label: Functional safety
  definition: Absence of unreasonable risk from malfunctioning electrical or electronic systems, achieved through a standardized
    safety lifecycle such as IEC 61508 or ISO 26262.
  family: trust
  scope: physical-extension
  status: draft
- id: mlsys.safety-integrity-level
  label: Safety integrity level
  aliases:
  - SIL
  - ASIL
  definition: A graded risk class assigned to a safety function that sets the rigor of development, verification, and tolerable
    failure rate required.
  family: trust
  scope: background
  status: draft
- id: mlsys.safety-performance-indicator
  label: Safety performance indicator
  aliases:
  - SPI
  definition: A field-measured metric tied to a safety-case claim whose threshold violation signals that the argument may
    no longer hold.
  family: trust
  status: draft
- id: mlsys.group-fairness-metric
  label: Group fairness metrics
  aliases:
  - demographic parity
  - equalized odds
  - predictive parity
  definition: Statistics comparing selection rates, error rates, or calibration of a model's decisions across protected groups.
  family: trust
  status: draft
- id: mlsys.individual-fairness
  label: Individual fairness
  definition: A requirement that individuals who are similar with respect to the task receive similar outcomes under a stated
    similarity metric.
  family: trust
  status: draft
- id: mlsys.fairness-incompatibility
  label: Fairness criteria incompatibility
  definition: The result that calibration and error-rate parity across groups cannot generally hold together when base rates
    differ, forcing an explicit choice among criteria.
  family: trust
  status: draft
- id: mlsys.bias-mitigation
  label: Bias mitigation
  definition: Interventions on data (pre-processing), training objective (in-processing), or decisions (post-processing) that
    reduce measured disparities, usually at some cost in other metrics.
  family: trust
  status: draft
- id: mlsys.feature-attribution
  label: Feature attribution
  aliases:
  - SHAP
  - LIME
  - integrated gradients
  - saliency
  definition: Post-hoc explanation assigning each input feature a contribution to a specific prediction.
  family: trust
  status: draft
- id: mlsys.counterfactual-explanation
  label: Counterfactual explanation
  definition: An explanation stating the smallest feasible change to an input that would change the model's decision.
  family: trust
  status: draft
- id: mlsys.interpretable-model
  label: Inherently interpretable model
  definition: A model whose structure, such as a sparse linear model, short rule list, or shallow tree, can be directly inspected
    to understand its predictions.
  family: trust
  status: draft
- id: mlsys.model-card
  label: Model card
  definition: A standardized document reporting a model's intended use, evaluation results across conditions and groups, limitations,
    and ethical considerations.
  family: trust
  status: draft
- id: mlsys.datasheet
  label: Datasheet for datasets
  aliases:
  - data card
  definition: A standardized document recording a dataset's motivation, composition, collection process, preprocessing, intended
    uses, and maintenance.
  family: trust
  status: draft
- id: mlsys.contestability
  label: Contestability and recourse
  definition: The ability of an affected person to understand, challenge, and obtain review or reversal of a consequential
    automated decision.
  family: trust
  status: draft
- id: mlsys.automation-bias
  label: Automation bias
  aliases:
  - automation complacency
  - ironies of automation
  definition: The tendency of human supervisors to over-rely on automated outputs and to lose the vigilance and skill needed
    to catch their errors.
  family: trust
  status: draft
- id: mlsys.authority-handover
  label: Authority handover
  aliases:
  - takeover
  - shared autonomy
  definition: Transfer of control between an automated system and a human operator, bounded by human reaction time, situational
    awareness, and mode clarity.
  family: trust
  status: draft
- id: mlsys.ai-risk-management
  label: AI risk management
  aliases:
  - NIST AI RMF
  - ISO/IEC 42001
  definition: An organizational process to govern, map, measure, and manage risks of AI systems throughout their lifecycle.
  family: trust
  status: draft
- id: mlsys.impact-assessment
  label: Algorithmic impact assessment
  definition: A structured pre-deployment analysis of who an AI system could affect, how, and with what severity, used to
    decide mitigations or whether to deploy.
  family: trust
  status: draft
- id: mlsys.algorithmic-audit
  label: Algorithmic audit
  definition: An internal or independent examination of an AI system's development records and behavior against stated requirements,
    standards, or law.
  family: trust
  status: draft
- id: mlsys.risk-tiered-regulation
  label: Risk-tiered AI regulation
  aliases:
  - EU AI Act
  definition: Law that classifies AI uses by risk level and imposes obligations, such as conformity assessment, documentation,
    and human oversight, scaled to that level.
  family: trust
  status: draft
- id: mlsys.frontier-safety-framework
  label: Frontier safety framework
  aliases:
  - responsible scaling policy
  - preparedness framework
  definition: A developer policy that ties dangerous-capability evaluation thresholds to required safeguards before further
    training or deployment of frontier models.
  family: trust
  scope: generative-extension
  status: draft
- id: mlsys.context-compaction
  label: Context compaction
  definition: Replacing older parts of an agent's context with summaries or structured records so a long task fits the model's
    input budget.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.context-degradation
  label: Long-context degradation
  aliases:
  - lost in the middle
  - context rot
  definition: Decline in a model's use of relevant information as context grows or as that information sits away from the
    context's start or end.
  family: agents
  scope: generative-extension
  status: draft
- id: mlsys.agent-memory
  label: Long-term agent memory
  definition: A persistent store an agent writes to and retrieves from across calls and sessions, with policies for consolidation,
    expiry, and invalidation.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.function-calling
  label: Function calling
  aliases:
  - tool calling
  - tool use
  definition: A model emitting a structured invocation of a declared tool, which the harness validates, executes, and returns
    as an observation.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.model-context-protocol
  label: Tool discovery protocol
  aliases:
  - Model Context Protocol
  - MCP
  definition: An open client-server protocol through which agent hosts discover and invoke tools, resources, and prompts exposed
    by external servers.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.computer-use
  label: Computer use
  aliases:
  - GUI agent
  - browser agent
  definition: An agent operating graphical software through screenshots or accessibility trees and synthesized keyboard and
    pointer input.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.agent-harness
  label: Agent harness
  aliases:
  - agent loop
  - agent runtime
  definition: The runtime that repeatedly calls a model, dispatches its tool actions, appends observations, and decides whether
    the trajectory continues, pauses, or ends.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.agent-budget
  label: Agent execution budget
  definition: Limits on turns, tokens, wall-clock time, or spend for a trajectory, with stopping rules applied when a limit
    or completion criterion is reached.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.approval-gate
  label: Action approval gate
  aliases:
  - human-in-the-loop approval
  definition: A harness checkpoint that holds a specific proposed action until an authorized human or policy approves it,
    binding the approval to that exact action.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.durable-execution
  label: Durable execution
  definition: Recording each workflow step's intent and result in a persistent log so execution resumes after failure without
    repeating completed steps.
  family: agents
  status: draft
- id: mlsys.deterministic-replay
  label: Record and replay
  aliases:
  - deterministic replay
  definition: Re-executing a trajectory from its log by substituting recorded model outputs and tool results, to reproduce,
    debug, or test a divergence.
  family: agents
  status: draft
- id: mlsys.suspend-resume
  label: Suspend and resume
  definition: Persisting a trajectory while it waits on a human, timer, or external event, then resuming with a validated
    state and authority.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.multi-agent-orchestration
  label: Multi-agent orchestration
  aliases:
  - orchestrator-worker
  - delegation
  definition: Structuring a task as delegated subtasks among agents under a topology, such as orchestrator-worker or peer,
    with typed handoffs and result merging.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.shared-agent-state
  label: Shared agent state
  definition: Task state read and written by several agents, requiring concurrency control such as leases or optimistic versioning
    to avoid lost or conflicting updates.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.coordination-failure
  label: Multi-agent coordination failure
  definition: Task failure arising from interaction among agents, such as mis-specified delegation, lost context at handoff,
    conflicting actions, or premature termination.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.correlated-agent-errors
  label: Correlated agent errors
  definition: Errors shared across agents built on the same model or prompts, which make voting, debate, or cross-checking
    less independent than assumed.
  family: agents
  scope: agent-extension
  status: draft
- id: mlsys.robot-perception
  label: Robot perception
  definition: Models that convert raw sensor streams into task-relevant scene estimates, such as detections, segmentation,
    depth, and pose, under latency limits.
  family: physical
  scope: background
  status: draft
- id: mlsys.sensor-fusion
  label: Sensor fusion
  definition: Combining measurements from multiple sensors or modalities, at raw, feature, or decision level, into one estimate
    more accurate or robust than any single source.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.time-synchronization
  label: Sensor time synchronization
  definition: Aligning clocks and timestamps across sensors, compute, and actuators so measurements can be associated with
    the physical instant they describe.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.recursive-filtering
  label: Recursive state filtering
  aliases:
  - Kalman filter
  - EKF
  - particle filter
  definition: Updating a state estimate and its uncertainty by alternating model-based prediction with measurement correction
    at each step.
  family: physical
  scope: background
  status: draft
- id: mlsys.slam
  label: Simultaneous localization and mapping
  aliases:
  - SLAM
  definition: Jointly estimating a platform's pose and a map of an unknown environment from its own sensor observations.
  family: physical
  scope: background
  status: draft
- id: mlsys.world-model
  label: Learned world model
  definition: A learned model that predicts future observations or latent states conditioned on actions, used for planning,
    policy training, or simulation.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.motion-planning
  label: Motion planning
  definition: Computing a collision-free path or trajectory from a start to a goal configuration using search, sampling, or
    trajectory optimization.
  family: physical
  scope: background
  status: draft
- id: mlsys.model-predictive-control
  label: Model predictive control
  aliases:
  - MPC (control)
  definition: Repeatedly solving a finite-horizon constrained optimal control problem from the current state and applying
    only the first input.
  family: physical
  scope: background
  status: draft
- id: mlsys.real-time-scheduling
  label: Real-time scheduling
  aliases:
  - rate-monotonic
  - EDF
  - response-time analysis
  definition: Assigning processor time to periodic and sporadic tasks so that each meets its deadline, with schedulability
    established by analysis.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.mixed-criticality
  label: Mixed-criticality partitioning
  definition: Running functions of different assurance levels on shared hardware while preventing lower-criticality work from
    delaying or corrupting higher-criticality functions.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.vla-model
  label: Vision-language-action model
  aliases:
  - VLA
  - robot foundation model
  definition: A policy built on a pretrained vision-language backbone that maps images and language instructions to robot
    actions.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.teleoperation-data
  label: Teleoperation data
  definition: Robot demonstrations collected by humans driving the robot remotely, whose cost, coverage, and action-label
    fidelity bound imitation-learned policies.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.action-chunking
  label: Action chunking
  definition: Predicting a short sequence of future actions per policy inference, decoupling model invocation rate from control
    rate and reducing compounding error.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.domain-randomization
  label: Domain randomization
  definition: Training in simulation over randomized visual and physical parameters so the policy treats the real world as
    one more variation.
  family: physical
  scope: physical-extension
  status: draft
- id: mlsys.thread-hierarchy
  label: Thread hierarchy
  family: execution
  definition: The decomposition of a kernel into grids of thread blocks and warps that share on-chip memory and synchronize
    at defined scopes.
  status: draft
  aliases:
  - grid/block/warp
  references:
  - cuda-model
  - cmu
- id: mlsys.memory-coalescing
  label: Memory coalescing and bank conflicts
  family: execution
  definition: Access patterns that merge a warp's loads into few memory transactions, or that serialize on shared-memory banks.
  status: draft
  aliases:
  - coalesced access
  references:
  - cuda-model
- id: mlsys.occupancy
  label: Occupancy and latency hiding
  family: execution
  definition: The ratio of resident to maximum warps, and how oversubscribing threads hides memory latency at the cost of
    registers and shared memory per thread.
  status: draft
  aliases:
  - occupancy
  references:
  - cuda-model
- id: mlsys.async-data-movement
  label: Asynchronous data movement
  family: execution
  definition: Hardware-assisted bulk copies into on-chip memory and producer-consumer warp roles that overlap loads with matrix-engine
    compute.
  status: draft
  aliases:
  - warp specialization
  - TMA
  references:
  - cuda-model
  - triton
- id: mlsys.matrix-engine-programming
  label: Matrix-engine programming
  family: execution
  definition: Issuing tile-level matrix-multiply-accumulate instructions with the layouts, fragment shapes, and precisions
    a tensor-core-class unit requires.
  status: draft
  aliases:
  - tensor core programming
  - MMA
  references:
  - cuda-model
  - triton
- id: mlsys.embedding-table-sharding
  label: Embedding-table sharding
  family: distributed
  definition: Partitioning very large sparse embedding tables row-, column-, or table-wise across devices, usually model-parallel
    beside data-parallel dense layers.
  status: draft
  aliases:
  - DLRM sharding
  references:
  - dlrm
- id: mlsys.embedding-cache
  label: Embedding cache and tiering
  family: hardware
  definition: Keeping frequently accessed embedding rows in accelerator memory and cold rows in host memory or SSD, exploiting
    the skew of lookups.
  status: draft
  aliases:
  - embedding offload
  references:
  - dlrm
- id: mlsys.parameter-server
  label: Parameter server
  family: distributed
  definition: An architecture in which workers pull and push model parameters from sharded server processes, common for sparse
    recommendation models and asynchronous training.
  status: draft
  aliases:
  - PS architecture
  references:
  - parameter-server
- id: mlsys.ranking-funnel
  label: Multi-stage retrieval and ranking
  family: serving
  definition: Candidate generation followed by progressively costlier ranking stages under one latency budget, the dominant
    architecture for recommendation and search.
  status: draft
  aliases:
  - ranking funnel
  - candidate generation
  references:
  - dlrm
  - cs329s
- id: mlsys.multimodal-model
  label: Multimodal model
  family: models
  definition: A model that consumes or produces several modalities, such as text, images, audio, or video, through modality
    encoders feeding a shared backbone.
  status: draft
  aliases:
  - vision-language model
  - VLM
  references:
  - llava
  scope: generative-extension
- id: mlsys.modality-encoder
  label: Modality encoder
  family: models
  definition: A network that turns images, audio, or video into token sequences for a shared backbone; visual tokens often
    dominate prefill cost and KV size.
  status: draft
  aliases:
  - visual tokens
  - vision encoder
  references:
  - llava
  scope: generative-extension
- id: mlsys.encoder-disaggregation
  label: Multimodal encoder disaggregation
  family: serving
  definition: Scheduling modality encoders separately from prefill and decode and caching encoder outputs so image or audio
    inputs do not stall token generation.
  status: draft
  aliases:
  - encode-prefill-decode disaggregation
  references:
  - paged
  scope: generative-extension
- id: mlsys.auto-parallelization
  label: Automatic parallelization
  family: distributed
  definition: Compiler-derived multi-device partitioning of a single-device program, found by propagating sharding annotations
    or by searching parallelism strategies under a cost model.
  status: draft
  aliases:
  - auto-sharding
  - automatic parallelism
  references:
  - gspmd
  - alpa
- id: mlsys.sharding-propagation
  label: Sharding annotation and propagation
  family: distributed
  definition: Annotating a few tensors with layouts over a device mesh and letting the compiler infer the remaining layouts
    and insert required collectives, yielding one SPMD program.
  status: draft
  aliases:
  - SPMD partitioning
  - GSPMD-style sharding
  references:
  - gspmd
- id: mlsys.device-mesh
  label: Device mesh
  family: distributed
  definition: A logical multidimensional arrangement of devices whose axes are assigned to parallelism dimensions, usually
    aligned so the busiest axis maps to the fastest interconnect.
  status: draft
  references:
  - gspmd
  - alpa
- id: mlsys.function-transformations
  label: Composable function transformations
  family: execution
  definition: Higher-order operations that map pure array functions to new functions, such as differentiation, vectorization,
