name: "Bug Report"
description: "Report a bug in TinyTorch, StaffML, Kits, or the website. For textbook content, use the Book feedback forms."
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reporting something in a textbook chapter? Use the **Book feedback** form for that volume instead. It asks for the chapter and routes the issue correctly.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - "TinyTorch"
        - "StaffML"
        - "Kits"
        - "Website"
        - "Other"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: "Module, page, or file where the issue is (e.g., 'Module 06 Autograd' or 'staffml/cloud-0042')."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is wrong? Be as specific as possible."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should happen instead?"
  - type: textarea
    id: environment
    attributes:
      label: Environment (TinyTorch bugs only)
      description: "Paste the output of: tito --version && python3 --version && echo $VIRTUAL_ENV"
