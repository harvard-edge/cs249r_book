name: "📖 Book feedback: Vol II (Scaling)"
description: "Report an error, unclear passage, or suggestion in Volume II: Scaling Machine Learning Systems."
title: "[Vol II] "
labels: ["area: book", "volume: II"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Volume II is a preview edition in final polish, so this is a good time to catch things.

        Choose the chapter, describe what you found, and submit. Every other field is optional.
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      description: "Which chapter is this about?"
      options:
        - "Whole volume or general"
        - "Front matter (preface, acknowledgments, about)"
        - "Introduction"
        - "Compute Infrastructure"
        - "Network Fabrics"
        - "Data Storage"
        - "Distributed Training"
        - "Collective Communication"
        - "Fault Tolerance"
        - "Fleet Orchestration"
        - "Performance Engineering"
        - "Inference at Scale"
        - "Edge Intelligence"
        - "ML Operations at Scale"
        - "Security and Privacy"
        - "Robust AI"
        - "Sustainable AI"
        - "Responsible AI"
        - "Conclusion"
        - "Back matter (appendices, glossary, references)"
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or location
      description: "Section heading, figure or table number, page number in the PDF, or a short quote so I can find the spot."
      placeholder: "e.g. Section 3.2, Figure 4, or a few words from the sentence"
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - "Technical or factual error"
        - "Unclear or confusing explanation"
        - "Typo, grammar, or formatting"
        - "Figure, table, or code listing"
        - "Math or derivation"
        - "Citation or reference"
        - "Missing topic or suggestion"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What did you find?
      description: "Describe the problem or suggestion. For errors, say what the text claims and what you believe is correct."
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: "If you have a proposed correction or rewording, put it here. Optional."
  - type: dropdown
    id: format
    attributes:
      label: Where were you reading?
      options:
        - "Website (mlsysbook.ai)"
        - "PDF"
        - "ePub"
        - "Source files on GitHub"
        - "Printed copy"
