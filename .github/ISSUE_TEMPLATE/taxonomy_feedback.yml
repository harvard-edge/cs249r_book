name: "🧭 Taxonomy: Suggest a concept, subject, or correction"
description: "Propose a new concept, relationship, subject refinement, chapter link, or correction for the ML Systems Taxonomy (mlsysbook.ai/taxonomy/)."
title: "[Taxonomy] "
labels: ["area: website", "type: improvement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the [ML Systems Taxonomy](https://mlsysbook.ai/taxonomy/). We built this taxonomy to organize the four-volume *Machine Learning Systems* textbook series (along with its labs, simulators, and StaffML questions) and share it openly as a community resource.

        Choose the kind of feedback below, describe your suggestion, and submit. Every other field is optional.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - "New concept (propose a concept and its home subject)"
        - "Concept definition or placement (refine an existing concept)"
        - "Relationship / trade-off edge (add or revise a directed link)"
        - "Subject scope or area structure (split, merge, or refine a subject)"
        - "Book chapter / StaffML link (connect a concept to a chapter or question)"
        - "Guide (role profile, symptom triage, or learning path)"
        - "Bug or visualization issue on mlsysbook.ai/taxonomy/"
        - "Other"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Concept ID, Subject Code, or View (optional)
      description: "Identifier or location on mlsysbook.ai/taxonomy/ if this applies to an existing entry."
      placeholder: "e.g. mlsys.kv-cache, P4.3 (LLM Inference), or #view=guides"
  - type: dropdown
    id: group
    attributes:
      label: Taxonomy Group (optional)
      description: "Which top-level group does this primarily belong to?"
      options:
        - "Not sure or cross-cutting"
        - "P: Lifecycle (Data, Training, Evaluation, Serving, MLOps)"
        - "S: Stack (Hardware, Frameworks and Compilers, Parallelism, Datacenter)"
        - "Q: Qualities (Performance, Reliability, Security and Privacy, Safety, Responsible AI, Sustainability)"
        - "F: Foundations (Workloads, Models and Architectures, System Models)"
        - "T: System Types (Agentic, Embodied and Physical)"
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to add or change?
      description: "Describe the concept, subject, relationship, or correction. For a new concept, include a one-sentence definition and which subject owns its mechanism (its home)."
      placeholder: "e.g. Add concept `mlsys.prefill-decode-disaggregation` under P4.3 (LLM Inference): Separating prompt prefill and token decode onto distinct worker pools so compute-bound prefill does not stall bandwidth-bound decode."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale, condition, or reference (optional)
      description: "For relationships, state the condition under which the link holds. For new concepts or subjects, share a paper, course syllabus, or production system reference."
      placeholder: "e.g. Holds when long-prompt prefill bursts cause inter-token latency (ITL) spikes on co-located decode batches (DistServe, Splitwise)."
