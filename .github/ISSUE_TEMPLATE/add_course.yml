name: "🎓 Add your course"
description: "Teaching with Machine Learning Systems? List your course on mlsysbook.ai/community/courses."
title: "[Course] "
labels: ["area: community", "adopter"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for teaching with the book. Courses listed here appear on the [Courses Using the Book](https://mlsysbook.ai/community/courses.html) page after a quick check.

        Only the institution, course, and a link are published. Your name is never listed unless you tick the box below.
  - type: input
    id: institution
    attributes:
      label: Institution
      placeholder: "University of Example"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: City and country
      placeholder: "Pittsburgh, United States"
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: Course code and title
      placeholder: "CS 5xx Machine Learning Systems"
    validations:
      required: true
  - type: input
    id: term
    attributes:
      label: Term(s) taught
      placeholder: "Fall 2026"
  - type: input
    id: url
    attributes:
      label: Course page or syllabus
      description: "A public link that mentions the book helps us verify quickly. Leave blank if the course page is private."
  - type: dropdown
    id: usage
    attributes:
      label: How do you use the book?
      options:
        - "Primary textbook"
        - "One of several assigned texts"
        - "Selected chapters"
        - "Labs, kits, or TinyTorch"
        - "Other"
  - type: checkboxes
    id: consent
    attributes:
      label: Listing
      options:
        - label: "List this course on mlsysbook.ai (institution, course, term, link)."
          required: true
        - label: "You may also use the school's logo on the site."
        - label: "You may name me as the instructor."
