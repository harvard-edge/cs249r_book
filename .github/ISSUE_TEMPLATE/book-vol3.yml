name: "📖 Book feedback: Vol III (Agentic)"
description: "Report an error, unclear passage, or suggestion in Volume III: Agentic Machine Learning Systems."
title: "[Vol III] "
labels: ["area: book", "volume: III"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Volume III is still being written, so chapter names may not match what you read. Pick the closest one.

        Choose the chapter, describe what you found, and submit. Every other field is optional.
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      description: "Which chapter is this about?"
      options:
        - "Whole volume or general"
        - "Front matter (preface, acknowledgments, about)"
        - "Introduction"
        - "Execution Descriptors"
        - "Control Topologies"
        - "Trajectory Fine-Tuning"
        - "Reinforcement Learning"
        - "Test-Time Search"
        - "Context Working Sets"
        - "Prefix Caching and Paging"
        - "Trajectory Scheduling"
        - "Tool Interfaces"
        - "Sandboxing and Isolation"
        - "Verification and Recovery"
        - "Multi-Agent Systems and Coordination Topologies"
        - "Telemetry, Distributed Tracing, and Trajectory Benchmarking"
        - "Conclusion"
        - "Back matter (appendices, glossary, references)"
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or location
      description: "Section heading, figure or table number, page number in the PDF, or a short quote so I can find the spot."
      placeholder: "e.g. Section 3.2, Figure 4, or a few words from the sentence"
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - "Technical or factual error"
        - "Unclear or confusing explanation"
        - "Typo, grammar, or formatting"
        - "Figure, table, or code listing"
        - "Math or derivation"
        - "Citation or reference"
        - "Missing topic or suggestion"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What did you find?
      description: "Describe the problem or suggestion. For errors, say what the text claims and what you believe is correct."
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: "If you have a proposed correction or rewording, put it here. Optional."
  - type: dropdown
    id: format
    attributes:
      label: Where were you reading?
      options:
        - "Website (mlsysbook.ai)"
        - "PDF"
        - "ePub"
        - "Source files on GitHub"
        - "Printed copy"
