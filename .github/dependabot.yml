# Dependabot: security updates only, grouped.
#
# Version updates stay off (open-pull-requests-limit: 0). These entries only
# shape Dependabot *security* updates: all security fixes for one ecosystem in
# one directory arrive as a single pull request, instead of one pull request per
# package that then conflict with each other on the same lockfile.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/customizing-dependabot-security-prs
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # The build container (ubuntu:22.04) ships Python 3.10. filelock 4.2+ and
    # Pillow 13+ require Python 3.11, so their updates cannot resolve there.
    # Remove these entries when the container moves to Python 3.11.
    ignore:
      - dependency-name: "filelock"
        versions: [">=4.2"]
      - dependency-name: "pillow"
        versions: [">=13"]
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # The build container (ubuntu:22.04) ships Python 3.10. filelock 4.2+ and
    # Pillow 13+ require Python 3.11, so their updates cannot resolve there.
    # Remove these entries when the container moves to Python 3.11.
    ignore:
      - dependency-name: "filelock"
        versions: [">=4.2"]
      - dependency-name: "pillow"
        versions: [">=13"]
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
