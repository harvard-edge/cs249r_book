name: '🌐 Landing Site · 🎓 Course Intake'

# =============================================================================
# "Add your course" issue → pull request that lists the course
# =============================================================================
#
# An instructor fills in the "Add your course" issue form. This workflow
# reads it, places the school (domain, location, logo when the submitter
# consented), appends the course to site/community/adopters.yml on a branch,
# and opens a pull request against dev. A maintainer opens the course link,
# checks it assigns the book, and merges; the course appears on the next
# site deploy. Editing the issue refreshes the same pull request.
#
# The issue body is untrusted input. It reaches the script only through the
# ISSUE_BODY environment variable, never interpolated into a shell command,
# and the script writes it with yaml.safe_dump after length-capping each
# field. Nothing is published without a human merge.
#
# Triggered by the form's "[Course] " title prefix rather than a label, so
# it works whatever labels the repository has.
#
# Note: pull requests opened with GITHUB_TOKEN do not start other workflows,
# so the validate run starts when a maintainer pushes to or merges the PR.
# =============================================================================

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: adopters-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    name: '🎓 Prepare course PR'
    if: startsWith(github.event.issue.title, '[Course]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: adopters/course-${{ github.event.issue.number }}

    steps:
      - name: 📥 Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: 📦 Install dependencies
        run: pip install pyyaml

      - name: 🎓 Read the form and add the course
        id: intake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 site/scripts/adopters_intake.py --issue "$ISSUE" --summary pr-body.md

      - name: 🚀 Open or update the pull request
        if: steps.intake.outputs.status == 'ok'
        env:
          TITLE: ${{ steps.intake.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add site/community/adopters.yml site/community/assets/images/adopters/
          git commit -m "feat(site): $TITLE" -m "Submitted in #$ISSUE."
          # The branch belongs to this issue alone; an edit to the issue
          # rebuilds it from dev, so a force push is the intended update.
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body-file pr-body.md
            echo "✅ Updated PR #$existing"
          else
            url=$(gh pr create --base dev --head "$BRANCH" --title "$TITLE" \
                    --body-file pr-body.md --label "action: auto-pr")
            gh issue comment "$ISSUE" --body "Thank you! A pull request that lists this course is ready for review: $url. It appears on https://mlsysbook.ai/community/courses.html once merged and the site redeploys."
            echo "✅ Opened $url"
          fi

      - name: 💬 Ask for what is missing
        if: steps.intake.outputs.status == 'needs-info' && github.event.action == 'opened'
        env:
          MESSAGE: ${{ steps.intake.outputs.message }}
        run: |
          gh issue comment "$ISSUE" --body "Thanks for sending this. $MESSAGE Edit the issue to fix it and the listing will be prepared automatically."
