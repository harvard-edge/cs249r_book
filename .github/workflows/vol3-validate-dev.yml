name: '🟣 Vol III: Agentic AI · ✅ Validate (Dev)'

# =============================================================================
# Volume III: Agentic AI Systems — Validation
# =============================================================================

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'books/vol3/**'
      - 'shared/**'
      - '.github/workflows/vol3-*'
  push:
    branches: [dev]
    paths:
      - 'books/vol3/**'
      - 'shared/**'
      - '.github/workflows/vol3-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  VOL3_ROOT: books/vol3
  VOL3_BUILD_DIR: publishing/quarto/_build/html-vol3
  GLOBAL_PYTHON_VERSION: '3.12'

jobs:
  validate-content:
    name: '🔍 Validate Content & Checks'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.GLOBAL_PYTHON_VERSION }}

      - name: 📦 Install CLI Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install rich pyyaml pydantic

      - name: 📋 Run Vol III checks
        run: |
          ./publishing/binder check --vol3

  build-site:
    name: '🔨 Build HTML Website'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.GLOBAL_PYTHON_VERSION }}

      - name: 📦 Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/mlsysim

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📦 Install SVG/Image tools
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: 🔨 Render HTML via Binder
        run: ./publishing/binder build html --vol3

      - name: 🔍 Validate HTML Output
        run: |
          if [ ! -f "${{ env.VOL3_BUILD_DIR }}/index.html" ]; then
            echo "❌ CRITICAL: ${{ env.VOL3_BUILD_DIR }}/index.html missing."
            exit 1
          fi
          echo "✅ HTML build succeeded!"
