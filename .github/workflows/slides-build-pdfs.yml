name: '📊 Slides · 🔨 Build PDFs'

# =============================================================================
# Lecture Slides — Build All Slide Deck PDFs
# =============================================================================
#
# Compiles every Beamer slide deck in Volumes I-IV to PDF using pdflatex +
# inkscape, converts to PPTX for presenter mode, and uploads as workflow
# artifacts. The job fails if any deck folder with a .tex produced no PDF.
#
# Flow:
#   0. NUMBERS      — Every deck's images/numbers.tex matches its calcs.py
#                     (values from MLSysIM); a stale file fails the run
#   1. INSTALL      — TeX Live + Inkscape + Metropolis theme
#   2. CONVERT_SVGS — Makefile-driven SVG-to-PDF conversion
#   3. BUILD_DECKS  — Compile Vol I-IV slide decks (pdflatex, 2-pass)
#   4. CONVERT_PPTX — PDF-to-PPTX conversion for presenter mode
#   5. UPLOAD       — Upload artifacts (slides-vol1 ... slides-vol4)
#   6. CHECK        — Fail if any deck did not build (rebuilds it with log tail)
#
# Triggers:
#   - push: dev branch, slides/vol{1..4}/**/*.tex, *.svg, or calcs.py,
#     slides/assets/** (theme + kit affect every deck), slides/Makefile, and
#     mlsysim/mlsysim/** (a registry change can change a deck's numbers)
#   - workflow_dispatch: manual
#
# Deploys to: N/A (artifacts only — slides-vol1 ... slides-vol4)
#
# Related:
#   - slides-publish-live.yml — Downloads these for GitHub Release
#   - slides-preview-dev.yml  — Portal only (no PDFs)
#   - slides-validate-dev.yml — Content validation
#
# =============================================================================

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'slides/vol1/**/*.tex'
      - 'slides/vol1/**/*.svg'
      - 'slides/vol2/**/*.tex'
      - 'slides/vol2/**/*.svg'
      - 'slides/vol3/**/*.tex'
      - 'slides/vol3/**/*.svg'
      - 'slides/vol4/**/*.tex'
      - 'slides/vol4/**/*.svg'
      - 'slides/vol*/**/calcs.py'
      - 'mlsysim/mlsysim/**'
      - 'slides/assets/**'
      - 'slides/Makefile'
      - '.github/workflows/slides-build-pdfs.yml'

permissions:
  contents: read

concurrency:
  group: slides-build-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdfs:
    name: '📄 Compile Slide Decks'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: 🔢 Check computed numbers
        working-directory: slides
        run: |
          # Each deck's calcs.py reads MLSysIM and writes images/numbers.tex,
          # which the deck prints with \val{key}. The file is committed so a
          # deck builds with LaTeX alone; this fails if any is stale.
          pip install ../mlsysim/
          make numbers-check

      - name: 🔧 Install TeX Live + Inkscape + Poppler
        run: |
          # pdflatex + helvet (Helvetica clone via NimbusSans) + courier
          # — all standard PostScript fonts that ship with
          # texlive-fonts-recommended. No fontspec, no OS-font lookups.
          # Was xelatex+fontspec, which silently fell back to Liberation
          # Sans on the Ubuntu runner and shipped blank-text PDFs
          # (2026-05-12). Dropping texlive-xetex (engine) and
          # texlive-fonts-extra (was for tex-gyre) since we no longer
          # need either.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            lmodern \
            inkscape \
            poppler-utils

      - name: 🔧 Install Beamer Metropolis Theme
        run: |
          # Metropolis theme (base for our custom theme)
          tlmgr install beamertheme-metropolis pgfopts || true

      - name: 📄 Convert SVGs to PDFs
        working-directory: slides
        run: make svgs

      - name: 📄 Build Slide Decks (Vol I-IV)
        working-directory: slides
        run: |
          # Failed decks are recorded as vol/folder/tex_name, one per line,
          # for the final check step (which rebuilds them with output shown).
          mkdir -p _build
          : > _build/failed-decks.txt
          for vol in vol1 vol2 vol3 vol4; do
            echo "Building ${vol} slides..."
            mkdir -p _build/$vol
            for ch_dir in $vol/*_*/; do
              tex_file=$(ls $ch_dir/*.tex 2>/dev/null | head -1)
              [ -z "$tex_file" ] && continue
              tex_name=$(basename "$tex_file" .tex)
              echo "  Building $tex_name..."
              cd "$ch_dir"
              pdflatex -interaction=nonstopmode "$tex_name.tex" > /dev/null 2>&1 || true
              pdflatex -interaction=nonstopmode "$tex_name.tex" > /dev/null 2>&1 || true
              cd - > /dev/null
              if [ -f "$ch_dir/$tex_name.pdf" ]; then
                cp "$ch_dir/$tex_name.pdf" "_build/$vol/$tex_name.pdf"
                echo "    ✓ $tex_name.pdf"
              else
                echo "    ✗ $tex_name (build failed)"
                echo "${ch_dir%/}/$tex_name" >> _build/failed-decks.txt
              fi
              # Clean artifacts
              rm -f $ch_dir/*.aux $ch_dir/*.nav $ch_dir/*.out $ch_dir/*.snm \
                    $ch_dir/*.toc $ch_dir/*.vrb $ch_dir/*.fls $ch_dir/*.log \
                    $ch_dir/$tex_name.pdf 2>/dev/null
            done
          done

      - name: 📦 Install PPTX dependencies
        run: pip install python-pptx Pillow

      - name: 📊 Convert PDFs to PPTX
        working-directory: slides
        run: |
          echo "Converting PDFs to PowerPoint..."
          for vol in vol1 vol2 vol3 vol4; do
            if ls _build/$vol/*.pdf 1>/dev/null 2>&1; then
              python3 scripts/pdf2pptx.py _build/$vol/*.pdf --output-dir _build/$vol --dpi 300
            fi
          done

      - name: 📊 Build Summary
        working-directory: slides
        run: |
          echo "## 📊 Slide Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Volume | PDFs | PPTX |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|------|" >> $GITHUB_STEP_SUMMARY
          total_pdf=0
          total_pptx=0
          for vol in vol1 vol2 vol3 vol4; do
            case $vol in
              vol1) label="Vol I" ;;
              vol2) label="Vol II" ;;
              vol3) label="Vol III" ;;
              vol4) label="Vol IV" ;;
            esac
            n_pdf=$(ls _build/$vol/*.pdf 2>/dev/null | wc -l)
            n_pptx=$(ls _build/$vol/*.pptx 2>/dev/null | wc -l)
            echo "| $label | $n_pdf | $n_pptx |" >> $GITHUB_STEP_SUMMARY
            total_pdf=$((total_pdf + n_pdf))
            total_pptx=$((total_pptx + n_pptx))
          done
          echo "| **Total** | **$total_pdf** | **$total_pptx** |" >> $GITHUB_STEP_SUMMARY
          n_failed=$(grep -c . _build/failed-decks.txt 2>/dev/null || true)
          if [ "${n_failed:-0}" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **$n_failed deck(s) failed to build:**" >> $GITHUB_STEP_SUMMARY
            sed 's/^/- /' _build/failed-decks.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo ""
          echo "✅ Built $total_pdf PDFs + $total_pptx PPTX"

      - name: 📦 Upload Vol1 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slides-vol1
          path: |
            slides/_build/vol1/*.pdf
            slides/_build/vol1/*.pptx
          retention-days: 30

      - name: 📦 Upload Vol2 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slides-vol2
          path: |
            slides/_build/vol2/*.pdf
            slides/_build/vol2/*.pptx
          retention-days: 30

      - name: 📦 Upload Vol3 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slides-vol3
          path: |
            slides/_build/vol3/*.pdf
            slides/_build/vol3/*.pptx
          retention-days: 30

      - name: 📦 Upload Vol4 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slides-vol4
          path: |
            slides/_build/vol4/*.pdf
            slides/_build/vol4/*.pptx
          retention-days: 30

      # Runs after the uploads so the decks that did build stay downloadable.
      # Each failed deck is rebuilt once with the tail of its .log printed, so
      # the LaTeX error is readable here without reproducing it locally.
      - name: 🔍 Fail on missing deck PDFs
        working-directory: slides
        run: |
          if ! grep -q . _build/failed-decks.txt 2>/dev/null; then
            echo "✅ Every deck folder with a .tex produced a PDF"
            exit 0
          fi
          while read -r deck; do
            [ -z "$deck" ] && continue
            ch_dir=$(dirname "$deck")
            tex_name=$(basename "$deck")
            echo "::group::✗ $deck — rebuild with log tail"
            (cd "$ch_dir" && pdflatex -interaction=nonstopmode "$tex_name.tex" > /dev/null 2>&1) || true
            if [ -f "$ch_dir/$tex_name.log" ]; then
              tail -n 60 "$ch_dir/$tex_name.log"
            else
              echo "(no $tex_name.log produced)"
            fi
            echo "::endgroup::"
          done < _build/failed-decks.txt
          echo "❌ $(grep -c . _build/failed-decks.txt) deck(s) did not produce a PDF:"
          sed 's/^/   - /' _build/failed-decks.txt
          exit 1
