name: '🔥 TinyTorch · ✅ Validate (Dev)'

# =============================================================================
# TinyTorch — Comprehensive Testing Workflow
# =============================================================================
#
# Runs a 7-stage progressive test suite for the TinyTorch educational
# framework. Stages are sequential with fail-fast; parallel where possible.
#
# Flow:
#   1. INLINE_BUILD     — Build package from src/ modules
#   2. UNIT_TESTS       — Test individual module functions (parallel with 3-4)
#   3. INTEGRATION      — Cross-module validation (parallel with 2, 4)
#   4. CLI_TESTS        — Verify CLI commands work (parallel with 2-3)
#   5. E2E_TESTS        — Full end-to-end validation (gates on 2-4)
#   6. FRESH_INSTALL    — Docker-based student install simulation
#   7. USER_JOURNEY     — Destructive full journey (resets + rebuilds)
#   9. MILESTONES       — Slow milestone training/accuracy gates (release path)
#   2b. PY_COMPAT       — Unit tests on Python 3.10 / 3.13 (Linux; standard+all)
#
# Triggers:
#   - push: dev/main branches, tinytorch/** paths (all tests)
#   - pull_request: dev/main branches (standard tests, stages 1-5)
#   - workflow_call: from publish workflow (pre-release gate). The caller
#     passes `ref` = the exact commit it will ship; every stage checks it out.
#   - workflow_dispatch: manual with test type + OS selection
#
# OS Support:
#   - Default: Both Linux and Windows (ubuntu-latest, windows-2022)
#   - Manual trigger can select: linux, windows, or all
#   - Windows uses Git Bash (shell: bash) for cross-platform compatibility
#
# Deploys to: N/A (validate only)
#
# Related:
#   - tinytorch-preview-dev.yml  — Gated on this workflow passing
#   - tinytorch-publish-live.yml — Calls this as preflight check
#   - tinytorch-build-pdfs.yml   — Reusable PDF build
#
# =============================================================================

on:
  push:
    branches: [dev]
    paths:
      - 'tinytorch/**'
      - '.github/workflows/tinytorch-validate-dev.yml'
      - '.github/workflows/tinytorch-preview-dev.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'tinytorch/**'
      - '.github/workflows/tinytorch-validate-dev.yml'
      - '.github/workflows/tinytorch-preview-dev.yml'
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to test (publish-live passes the SHA it will ship). Blank = github.sha.'
        required: false
        default: ''
        type: string
      test_type:
        description: 'Test type to run'
        required: false
        default: 'all'
        type: string
      os:
        description: 'Operating system (linux, windows, all)'
        required: false
        default: 'all'
        type: string
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run (matches: tito dev test --<type>)'
        required: false
        default: 'all'
        type: choice
        options:
          - all           # --all: Full validation (stages 1-7)
          - quick         # --unit --cli: Fast feedback, no inline build
          - standard      # Stages 1-5: inline + unit + integration + cli + e2e
          - user-journey  # --user-journey: Full destructive journey test
      os:
        description: 'Operating system to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all         # Both Linux and Windows (default)
          - linux       # Ubuntu only
          - windows     # Windows only

permissions:
  contents: read
  actions: read

concurrency:
  # `head_ref || run_id` keeps PR cancel-on-amend behavior while making
  # push, workflow_call, and workflow_dispatch runs unique per-run, so a
  # manual dispatch on the same SHA as a push (or publish-live's `uses:`
  # call) doesn't collide on a shared group and leave the README badge
  # red on a healthy SHA. See kits-validate-dev.yml.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TITO_ALLOW_SYSTEM: "1"
  TINYTORCH_QUIET: "1"
  PYTHONIOENCODING: "utf-8"  # Required for Windows emoji support in Rich
  PYTHONUTF8: "1"            # Force UTF-8 for all Python I/O (subprocess pipes)

jobs:
  # ===========================================================================
  # Configuration: Determine what tests to run
  # ===========================================================================
  configure:
    name: 📋 Configure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test_type: ${{ steps.config.outputs.test_type }}
      os_matrix: ${{ steps.config.outputs.os_matrix }}
      run_inline: ${{ steps.config.outputs.run_inline }}
      run_unit: ${{ steps.config.outputs.run_unit }}
      run_integration: ${{ steps.config.outputs.run_integration }}
      run_cli: ${{ steps.config.outputs.run_cli }}
      run_e2e: ${{ steps.config.outputs.run_e2e }}
      run_release: ${{ steps.config.outputs.run_release }}
      run_py_compat: ${{ steps.config.outputs.run_py_compat }}

    steps:
      - name: Determine test configuration
        id: config
        env:
          # `inputs` is populated for both workflow_call and workflow_dispatch.
          # Do NOT branch on github.event_name == 'workflow_call': inside a
          # called workflow, event_name is the CALLER's event, so that branch
          # never fires. Before 2026-09-28 this left TEST_TYPE empty on every
          # publish-live preflight and all seven stages were silently skipped.
          INPUT_TEST_TYPE: ${{ inputs.test_type }}
          INPUT_OS: ${{ inputs.os }}
        run: |
          # Determine test type: explicit input wins, otherwise infer from trigger
          if [ -n "$INPUT_TEST_TYPE" ]; then
            TEST_TYPE="$INPUT_TEST_TYPE"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TEST_TYPE="standard"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TEST_TYPE="all"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # dev must be rock solid - run everything
            TEST_TYPE="all"
          else
            # feature branches get quick feedback
            TEST_TYPE="quick"
          fi

          echo "test_type=$TEST_TYPE" >> $GITHUB_OUTPUT

          # Determine OS matrix based on input (default: both Linux and Windows)
          if [ -n "$INPUT_OS" ]; then
            OS_INPUT="$INPUT_OS"
          else
            # Automatic triggers run both Linux and Windows
            OS_INPUT="all"
          fi

          case "$OS_INPUT" in
            windows)
              # Use windows-2022: windows-latest (2025) has D: drive removed but runner still expects D:\a
              # See: https://github.com/actions/runner-images/issues/12416
              echo 'os_matrix=["windows-2022"]' >> $GITHUB_OUTPUT
              ;;
            all)
              # Use windows-2022: windows-latest (2025) has D: drive removed but runner still expects D:\a
              echo 'os_matrix=["ubuntu-latest","windows-2022"]' >> $GITHUB_OUTPUT
              ;;
            *)
              # Default: Linux only
              echo 'os_matrix=["ubuntu-latest"]' >> $GITHUB_OUTPUT
              ;;
          esac

          # Set flags based on test type
          # Stages: inline → unit → integration → cli → e2e → fresh-install → user-journey
          case "$TEST_TYPE" in
            quick)
              # Fast feedback: skip inline build, just unit + cli
              echo "run_inline=false" >> $GITHUB_OUTPUT
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_cli=true" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_release=false" >> $GITHUB_OUTPUT
              echo "run_py_compat=false" >> $GITHUB_OUTPUT
              ;;
            standard)
              # Stages 1-5: inline + unit + integration + cli + e2e
              echo "run_inline=true" >> $GITHUB_OUTPUT
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_cli=true" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_release=false" >> $GITHUB_OUTPUT
              echo "run_py_compat=true" >> $GITHUB_OUTPUT
              ;;
            all|user-journey)
              # All stages 1-7 (full validation including destructive user journey)
              echo "run_inline=true" >> $GITHUB_OUTPUT
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_cli=true" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_release=true" >> $GITHUB_OUTPUT
              echo "run_py_compat=true" >> $GITHUB_OUTPUT
              ;;
            *)
              # Fail loudly: an unrecognized or empty test type would otherwise
              # skip every stage and let the caller report a green preflight.
              echo "::error::Unknown test_type '$TEST_TYPE' (expected quick|standard|all|user-journey)"
              exit 1
              ;;
          esac

          echo "📋 Test configuration: $TEST_TYPE"

  # ===========================================================================
  # STAGE 1: INLINE BUILD - Build package from src/
  # ===========================================================================
  stage-1-inline:
    name: 📝 Stage 1 · Inline Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: configure
    if: needs.configure.outputs.run_inline == 'true'
    timeout-minutes: 30
    # Windows runners have flaky infrastructure issues - don't block CI
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.configure.outputs.os_matrix) }}

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Inline Tests (Progressive Build)
        run: |
          echo "📝 Building package from src/ modules..."
          echo "   Tests each module exports correctly in sequence."
          ./bin/tito dev test --inline --ci

      # 2026-09-11: check reference behavior and execution with only prior modules.
      - name: Validate Reference Solutions and Progressive Notebooks
        run: |
          python3 tools/check_reference.py
          python3 -m tito.main dev export --all
          python3 tools/release_check.py -k "student journey"

  # ===========================================================================
  # STAGE 2: UNIT TESTS - Test individual module functions
  # Runs in PARALLEL with Stages 3 and 4 (all depend only on Stage 1)
  # ===========================================================================
  stage-2-unit:
    name: 🧪 Stage 2 · Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [configure, stage-1-inline]
    if: |
      always() &&
      needs.configure.outputs.run_unit == 'true' &&
      (needs.stage-1-inline.result == 'success' || needs.stage-1-inline.result == 'skipped')
    timeout-minutes: 30
    # Windows runners have flaky infrastructure issues - don't block CI
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.configure.outputs.os_matrix) }}

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          ./bin/tito dev test --unit --ci

  # ===========================================================================
  # STAGE 3: INTEGRATION TESTS - Cross-module validation
  # Runs in PARALLEL with Stages 2 and 4 (all depend only on Stage 1)
  # ===========================================================================
  stage-3-integration:
    name: 🔗 Stage 3 · Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [configure, stage-1-inline]
    if: |
      always() &&
      needs.configure.outputs.run_integration == 'true' &&
      (needs.stage-1-inline.result == 'success' || needs.stage-1-inline.result == 'skipped')
    timeout-minutes: 15
    # Windows runners have flaky infrastructure issues - don't block CI
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.configure.outputs.os_matrix) }}

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integration Tests
        run: |
          ./bin/tito dev test --integration --ci

  # ===========================================================================
  # STAGE 4: CLI TESTS - Verify CLI commands work
  # Runs in PARALLEL with Stages 2 and 3 (all depend only on Stage 1)
  # ===========================================================================
  stage-4-cli:
    name: 💻 Stage 4 · CLI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [configure, stage-1-inline]
    if: |
      always() &&
      needs.configure.outputs.run_cli == 'true' &&
      (needs.stage-1-inline.result == 'success' || needs.stage-1-inline.result == 'skipped')
    timeout-minutes: 10
    # Windows runners have flaky infrastructure issues - don't block CI
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.configure.outputs.os_matrix) }}

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CLI Tests
        run: |
          ./bin/tito dev test --cli --ci

  # ===========================================================================
  # STAGE 2b: PYTHON COMPATIBILITY - unit tests on the other supported Pythons
  # pyproject declares >=3.10 with 3.10-3.13 classifiers; the stages above run
  # 3.11 only. Linux-only, standard/all runs; 3.11 stays the full path.
  # ===========================================================================
  stage-2b-py-compat:
    name: 🐍 Stage 2b · Unit Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [configure, stage-1-inline]
    if: |
      always() &&
      needs.configure.outputs.run_py_compat == 'true' &&
      (needs.stage-1-inline.result == 'success' || needs.stage-1-inline.result == 'skipped')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export package from src/
        run: python3 -m tito.main dev export --all

      - name: Run Unit Tests
        run: |
          ./bin/tito dev test --unit --ci

  # ===========================================================================
  # STAGE 5: E2E TESTS - Full user journey validation
  # Depends on Stages 2, 3, and 4 ALL passing (the integration gate)
  # ===========================================================================
  stage-5-e2e:
    name: 🌐 Stage 5 · E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [configure, stage-2-unit, stage-3-integration, stage-4-cli]
    if: |
      always() &&
      needs.configure.outputs.run_e2e == 'true' &&
      (needs.stage-2-unit.result == 'success' || needs.stage-2-unit.result == 'skipped') &&
      (needs.stage-3-integration.result == 'success' || needs.stage-3-integration.result == 'skipped') &&
      (needs.stage-4-cli.result == 'success' || needs.stage-4-cli.result == 'skipped')
    # 52aea3c1bd widened E2E (module_flow + milestone_flow markers, 600 s
    # pytest cap); 25 min leaves room for install + Windows until a real run
    # measures it.
    timeout-minutes: 25
    # Windows runners have flaky infrastructure issues - don't block CI
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.configure.outputs.os_matrix) }}

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E Tests
        run: |
          ./bin/tito dev test --e2e --ci

  # ===========================================================================
  # STAGE 6: FRESH INSTALL - Simulates real student experience
  # ===========================================================================
  # Note: Skipped for fork PRs because the branch doesn't exist in main repo
  stage-6-fresh-install:
    name: 📦 Stage 6 · Fresh Install
    runs-on: ubuntu-latest
    needs: [configure, stage-5-e2e]
    # Run on standard/all/release test types, after stage 5 passes
    # Skip for fork PRs (branch doesn't exist in main repo for install script)
    if: |
      always() &&
      (needs.configure.outputs.run_e2e == 'true' || needs.configure.outputs.run_release == 'true') &&
      (needs.stage-5-e2e.result == 'success' || needs.stage-5-e2e.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30

    steps:
      - name: Checkout (for test script only)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tinytorch/scripts/test-fresh-install.sh

      - name: Run Fresh Install Test (Docker)
        env:
          # Install the exact commit under test, not a branch tip that may have
          # moved: raw.githubusercontent.com serves install.sh by SHA, and the
          # installer fetches a full 40-hex ref as a commit (TINYTORCH_BRANCH is
          # set from --branch inside the script). For PRs this is the merge
          # commit, i.e. what the other stages tested.
          REF_UNDER_TEST: ${{ inputs.ref || github.sha }}
        run: |
          chmod +x tinytorch/scripts/test-fresh-install.sh
          ./tinytorch/scripts/test-fresh-install.sh --branch "$REF_UNDER_TEST"

  # ===========================================================================
  # STAGE 7: USER JOURNEY - Destructive full journey (after all stages)
  # ===========================================================================
  stage-7-user-journey:
    name: 🎓 Stage 7 · User Journey
    runs-on: ubuntu-latest
    needs: [configure, stage-5-e2e]
    # Only run if: release enabled AND all previous stages passed
    if: |
      always() &&
      needs.configure.outputs.run_release == 'true' &&
      (needs.stage-5-e2e.result == 'success' || needs.stage-5-e2e.result == 'skipped')
    timeout-minutes: 45

    defaults:
      run:
        working-directory: tinytorch

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run User Journey Validation
        run: |
          echo "🎓 Running user journey validation..."
          echo "   This resets all modules and runs the full user journey."
          ./bin/tito dev test --user-journey --ci

  # ===========================================================================
  # STAGE 9: MILESTONE TRAINING GATES - slow tests (release path only)
  # ===========================================================================
  # Stage 2 runs tests with -m "not slow" and Stage 7 only checks milestone exit
  # codes, so nothing else proves the milestones actually learn (gradients reach
  # every parameter, reported accuracy clears its target). Runs in parallel
  # with Stage 7 on the `all` / `user-journey` path, i.e. push-to-dev and the
  # publish preflight.
  stage-9-milestones:
    name: 🏁 Stage 9 · Milestone Training Gates
    runs-on: ubuntu-latest
    needs: [configure, stage-5-e2e]
    if: |
      always() &&
      needs.configure.outputs.run_release == 'true' &&
      (needs.stage-5-e2e.result == 'success' || needs.stage-5-e2e.result == 'skipped')
    # 2026-09-30: the slow milestone suite takes about 15 minutes locally but
    # was still passing at 78% when a 30-minute limit cancelled it on
    # ubuntu-latest. 75 leaves margin and still bounds a hung run.
    timeout-minutes: 75

    defaults:
      run:
        working-directory: tinytorch
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tinytorch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export package from src/
        run: python3 -m tito.main dev export --all

      - name: Slow milestone tests (train + accuracy gates)
        env:
          PYTHONPATH: ${{ github.workspace }}/tinytorch
        run: python3 -m pytest tests/milestones -m slow -v --tb=short -o addopts=

  # ===========================================================================
  # Stage 8: Link integrity (Tier 2 — non-blocking baseline)
  # ===========================================================================
  # Tier 1 pre-commit (shared/scripts/check-internal-links.py) already blocks
  # broken internal links + anchors in markdown. This pass adds external
  # reachability as a warning across the Quarto site. Flip fail_on_broken=true
  # once the baseline is clean.
  stage-8-links:
    name: 🔗 Stage 8 · Link Check
    uses: ./.github/workflows/infra-link-check.yml
    with:
      path_pattern: './tinytorch/guide/**/*.qmd'
      lycheeignore_path: 'shared/config/.lycheeignore'
      fail_on_broken: false
      max_concurrency: 8

  # ===========================================================================
  # Summary: Collect and report all results
  # ===========================================================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [configure, stage-1-inline, stage-2-unit, stage-2b-py-compat, stage-3-integration, stage-4-cli, stage-5-e2e, stage-6-fresh-install, stage-7-user-journey, stage-8-links, stage-9-milestones]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Generate Summary
        run: |
          echo "## 🔥 TinyTorch CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Type** | \`${{ needs.configure.outputs.test_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Progression (Sequential)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY

          # Stage 1: Inline
          if [ "${{ needs.configure.outputs.run_inline }}" = "true" ]; then
            case "${{ needs.stage-1-inline.result }}" in
              success) echo "| 1 | 📝 Inline Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 1 | 📝 Inline Build | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 1 | 📝 Inline Build | ⏭️ ${{ needs.stage-1-inline.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 1 | 📝 Inline Build | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 2: Unit
          if [ "${{ needs.configure.outputs.run_unit }}" = "true" ]; then
            case "${{ needs.stage-2-unit.result }}" in
              success) echo "| 2 | 🧪 Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 2 | 🧪 Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 2 | 🧪 Unit Tests | ⏭️ ${{ needs.stage-2-unit.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 2 | 🧪 Unit Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 2b: Python compatibility
          if [ "${{ needs.configure.outputs.run_py_compat }}" = "true" ]; then
            case "${{ needs.stage-2b-py-compat.result }}" in
              success) echo "| 2b | 🐍 Py 3.10/3.13 Unit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 2b | 🐍 Py 3.10/3.13 Unit | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 2b | 🐍 Py 3.10/3.13 Unit | ⏭️ ${{ needs.stage-2b-py-compat.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 2b | 🐍 Py 3.10/3.13 Unit | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 3: Integration
          if [ "${{ needs.configure.outputs.run_integration }}" = "true" ]; then
            case "${{ needs.stage-3-integration.result }}" in
              success) echo "| 3 | 🔗 Integration | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 3 | 🔗 Integration | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 3 | 🔗 Integration | ⏭️ ${{ needs.stage-3-integration.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 3 | 🔗 Integration | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 4: CLI
          if [ "${{ needs.configure.outputs.run_cli }}" = "true" ]; then
            case "${{ needs.stage-4-cli.result }}" in
              success) echo "| 4 | 💻 CLI Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 4 | 💻 CLI Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 4 | 💻 CLI Tests | ⏭️ ${{ needs.stage-4-cli.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 4 | 💻 CLI Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 5: E2E
          if [ "${{ needs.configure.outputs.run_e2e }}" = "true" ]; then
            case "${{ needs.stage-5-e2e.result }}" in
              success) echo "| 5 | 🌐 E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 5 | 🌐 E2E Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 5 | 🌐 E2E Tests | ⏭️ ${{ needs.stage-5-e2e.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 5 | 🌐 E2E Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 6: Fresh Install
          if [ "${{ needs.configure.outputs.run_e2e }}" = "true" ] || [ "${{ needs.configure.outputs.run_release }}" = "true" ]; then
            case "${{ needs.stage-6-fresh-install.result }}" in
              success) echo "| 6 | 📦 Fresh Install | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 6 | 📦 Fresh Install | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 6 | 📦 Fresh Install | ⏭️ ${{ needs.stage-6-fresh-install.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 6 | 📦 Fresh Install | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 7: User Journey
          if [ "${{ needs.configure.outputs.run_release }}" = "true" ]; then
            case "${{ needs.stage-7-user-journey.result }}" in
              success) echo "| 7 | 🎓 User Journey | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 7 | 🎓 User Journey | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 7 | 🎓 User Journey | ⏭️ ${{ needs.stage-7-user-journey.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 7 | 🎓 User Journey | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 9: Milestone training gates
          if [ "${{ needs.configure.outputs.run_release }}" = "true" ]; then
            case "${{ needs.stage-9-milestones.result }}" in
              success) echo "| 9 | 🏁 Milestone Gates | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
              failure) echo "| 9 | 🏁 Milestone Gates | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| 9 | 🏁 Milestone Gates | ⏭️ ${{ needs.stage-9-milestones.result }} |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          else
            echo "| 9 | 🏁 Milestone Gates | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Stage 8: Link Check (non-blocking)
          case "${{ needs.stage-8-links.result }}" in
            success) echo "| 8 | 🔗 Link Check | ✅ Passed (non-blocking) |" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "| 8 | 🔗 Link Check | ⚠️ Issues found (non-blocking) |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| 8 | 🔗 Link Check | ⏭️ ${{ needs.stage-8-links.result }} |" >> $GITHUB_STEP_SUMMARY ;;
          esac

      # Windows stages run with continue-on-error (flaky runners; whether they
      # should block is an open decision). A failed Windows leg therefore reports
      # success through needs.*.result, so read the per-job conclusions from the
      # API to at least make the failure visible. Reporting only, never blocking.
      - name: Report Windows failures (non-blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # filter=latest = most recent execution of each job across attempts,
          # so "Re-run failed jobs" still sees legs carried over from attempt 1.
          FAILED_WIN=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select((.name | test("[(]windows-")) and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")) | "\(.name) [\(.conclusion)]"')
          if [ -n "$FAILED_WIN" ]; then
            echo "⚠️ Windows failures (non-blocking):"
            {
              echo ""
              echo "### ⚠️ Windows failures (non-blocking)"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r job; do
              echo "  - $job"
              echo "- $job" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$FAILED_WIN"
            echo "::warning title=Windows failures (non-blocking)::$(echo "$FAILED_WIN" | paste -sd ';' -)"
          else
            echo "No Windows stage failures."
          fi

      - name: Check for failures
        run: |
          FAILED=false

          # A requested stage must END in success. Checking only for "failure"
          # let a skipped or cancelled stage count as a pass, which is how an
          # empty test_type once produced a green preflight with zero tests run.
          require() {  # require <enabled> <result> <label>
            if [ "$1" = "true" ] && [ "$2" != "success" ]; then
              echo "❌ $3 did not pass (result: ${2:-none})"
              FAILED=true
            fi
          }

          if [ "${{ needs.configure.result }}" != "success" ]; then
            echo "❌ Configure did not succeed (result: ${{ needs.configure.result }})"
            FAILED=true
          fi

          require "${{ needs.configure.outputs.run_inline }}"      "${{ needs.stage-1-inline.result }}"      "Stage 1 (Inline Build)"
          require "${{ needs.configure.outputs.run_unit }}"        "${{ needs.stage-2-unit.result }}"        "Stage 2 (Unit Tests)"
          require "${{ needs.configure.outputs.run_py_compat }}"   "${{ needs.stage-2b-py-compat.result }}"  "Stage 2b (Python 3.10/3.13 Unit)"
          require "${{ needs.configure.outputs.run_integration }}" "${{ needs.stage-3-integration.result }}" "Stage 3 (Integration)"
          require "${{ needs.configure.outputs.run_cli }}"         "${{ needs.stage-4-cli.result }}"         "Stage 4 (CLI Tests)"
          require "${{ needs.configure.outputs.run_e2e }}"         "${{ needs.stage-5-e2e.result }}"         "Stage 5 (E2E Tests)"

          # Stage 6 is legitimately skipped for fork PRs (install script needs an in-repo branch)
          FRESH_RESULT="${{ needs.stage-6-fresh-install.result }}"
          IS_FORK_PR="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"
          if [ "$IS_FORK_PR" = "true" ] && [ "$FRESH_RESULT" = "skipped" ]; then
            FRESH_RESULT="success"
          fi
          FRESH_ENABLED=false
          if [ "${{ needs.configure.outputs.run_e2e }}" = "true" ] || [ "${{ needs.configure.outputs.run_release }}" = "true" ]; then
            FRESH_ENABLED=true
          fi
          require "$FRESH_ENABLED" "$FRESH_RESULT" "Stage 6 (Fresh Install)"
          require "${{ needs.configure.outputs.run_release }}"     "${{ needs.stage-7-user-journey.result }}" "Stage 7 (User Journey)"
          require "${{ needs.configure.outputs.run_release }}"     "${{ needs.stage-9-milestones.result }}"   "Stage 9 (Milestone Gates)"

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "❌ CI FAILED - See above for details"
            exit 1
          else
            echo "✅ All enabled tests passed"
          fi
