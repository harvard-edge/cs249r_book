name: '🌐 All · 🚀 Publish (Live)'

# =============================================================================
# 🚀 Publish All (Live) — Orchestrator that deploys ALL subsites sequentially
# =============================================================================
#
# Thin orchestrator that delegates each subsite deployment to its own
# *-publish-live.yml standalone workflow via `uses:`. No build logic lives
# here — the standalones own the build/deploy details so the orchestrator
# stays in lockstep with what runs when each standalone is dispatched
# directly.
#
# Flow (each step waits on the previous; toggle per-site via inputs):
#   1. BOOK        — book-publish-live.yml        (Quarto render + release)
#   2. KITS        — kits-publish-live.yml
#   3. TINYTORCH   — tinytorch-publish-live.yml
#   4. MLSYSIM     — mlsysim-publish-live.yml     (with quartodoc)
#   5. LABS        — labs-publish-live.yml
#   6. STAFFML     — staffml-publish-live.yml     (Next.js + D1 + worker)
#   7. SLIDES      — slides-publish-live.yml      (lecture-deck PDFs)
#   8. MLPERF EDU  — mlperf-edu-publish-live.yml  (independent preview docs)
#   9. SITE        — site-publish-live.yml        (landing + about + community)
#  10. INSTRUCTORS — instructors-publish-live.yml
#
# Triggers:
#   - workflow_dispatch: Manual with per-site toggles + shared release knobs
#
# Concurrency:
#   No workflow-level lock here. Each standalone declares its own
#   `gh-pages-deploy` lock on its deploy job. A workflow-level lock here
#   would deadlock against the children (parent holds lock → child waits
#   on it → parent waits on child → forever).
#
# Defaults:
#   - deploy_book = false  (book release is heavier; opt in explicitly)
#   - site_only   = true   (most "publish all" runs are content refreshes)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Release description (used by all subsites)'
        required: false
        default: 'Content updates and improvements'
      site_only:
        description: 'Website-only deploy across subsites (no version bump, no tag)'
        type: boolean
        default: true
      release_type:
        description: 'Release type (only applied when site_only=false)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      deploy_book:
        description: 'Deploy Book (vol1+vol2)? Off by default — opt in.'
        type: boolean
        default: false
      deploy_kits:
        description: 'Deploy Kits?'
        type: boolean
        default: true
      deploy_tinytorch:
        description: 'Deploy TinyTorch?'
        type: boolean
        default: true
      deploy_mlsysim:
        description: 'Deploy MLSYSIM?'
        type: boolean
        default: true
      deploy_labs:
        description: 'Deploy Labs?'
        type: boolean
        default: true
      deploy_staffml:
        description: 'Deploy StaffML?'
        type: boolean
        default: true
      deploy_slides:
        description: 'Deploy Slides?'
        type: boolean
        default: true
      deploy_mlperf_edu:
        description: 'Deploy MLPerf EDU independent preview? Off by default.'
        type: boolean
        default: false
      deploy_site:
        description: 'Deploy Site (landing + about + community + newsletter)?'
        type: boolean
        default: true
      deploy_physical:
        description: 'Deploy Physical AI?'
        type: boolean
        default: true
      deploy_instructors:
        description: 'Deploy Instructors?'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  packages: read
  pages: write

jobs:
  # ==========================================================================
  # Step 1: Book (vol1 + vol2). Off by default — opt in via deploy_book=true.
  # ==========================================================================
  deploy-book:
    name: '📚 Deploy Book'
    if: ${{ inputs.deploy_book }}
    uses: ./.github/workflows/book-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH
      ai_generated_notes: 'yes'
      testing_mode: 'no'
      deploy_target: all

  # ==========================================================================
  # Step 2: Kits
  # ==========================================================================
  deploy-kits:
    name: '📦 Deploy Kits'
    needs: [deploy-book]
    if: |
      always()
      && inputs.deploy_kits
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
    uses: ./.github/workflows/kits-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 3: TinyTorch
  # ==========================================================================
  deploy-tinytorch:
    name: '🔥 Deploy TinyTorch'
    needs: [deploy-book, deploy-kits]
    if: |
      always()
      && inputs.deploy_tinytorch
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
    uses: ./.github/workflows/tinytorch-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 4: MLSYSIM (with quartodoc)
  # ==========================================================================
  deploy-mlsysim:
    name: '🧮 Deploy MLSYSIM'
    needs: [deploy-book, deploy-kits, deploy-tinytorch]
    if: |
      always()
      && inputs.deploy_mlsysim
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
    uses: ./.github/workflows/mlsysim-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 5: Labs
  # ==========================================================================
  deploy-labs:
    name: '🔬 Deploy Labs'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim]
    if: |
      always()
      && inputs.deploy_labs
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
    uses: ./.github/workflows/labs-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 6: StaffML (Next.js + D1 ship + Cloudflare worker deploy)
  # ==========================================================================
  deploy-staffml:
    name: '🎯 Deploy StaffML'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs]
    if: |
      always()
      && inputs.deploy_staffml
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
      && (!inputs.deploy_labs || needs.deploy-labs.result == 'success')
    uses: ./.github/workflows/staffml-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 7: Slides
  # ==========================================================================
  deploy-slides:
    name: '📊 Deploy Slides'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs, deploy-staffml]
    if: |
      always()
      && inputs.deploy_slides
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
      && (!inputs.deploy_labs || needs.deploy-labs.result == 'success')
      && (!inputs.deploy_staffml || needs.deploy-staffml.result == 'success')
    uses: ./.github/workflows/slides-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 8: MLPerf EDU independent preview. Off by default until explicitly selected.
  # ==========================================================================
  deploy-mlperf-edu:
    name: '🎓 Deploy MLPerf EDU Preview'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs, deploy-staffml, deploy-slides]
    if: |
      always()
      && inputs.deploy_mlperf_edu
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
      && (!inputs.deploy_labs || needs.deploy-labs.result == 'success')
      && (!inputs.deploy_staffml || needs.deploy-staffml.result == 'success')
      && (!inputs.deploy_slides || needs.deploy-slides.result == 'success')
    uses: ./.github/workflows/mlperf-edu-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 9: Landing Site (landing + about + community + newsletter)
  # ==========================================================================
  deploy-site:
    name: '🌐 Deploy Landing Site'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs, deploy-staffml, deploy-slides, deploy-mlperf-edu]
    if: |
      always()
      && inputs.deploy_site
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
      && (!inputs.deploy_labs || needs.deploy-labs.result == 'success')
      && (!inputs.deploy_staffml || needs.deploy-staffml.result == 'success')
      && (!inputs.deploy_slides || needs.deploy-slides.result == 'success')
      && (!inputs.deploy_mlperf_edu || needs.deploy-mlperf-edu.result == 'success')
    uses: ./.github/workflows/site-publish-live.yml
    secrets: inherit

  # ==========================================================================
  # Step 10: Instructors
  # ==========================================================================
  deploy-instructors:
    name: '🎓 Deploy Instructors'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs, deploy-staffml, deploy-slides, deploy-mlperf-edu, deploy-site]
    if: |
      always()
      && inputs.deploy_instructors
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
      && (!inputs.deploy_labs || needs.deploy-labs.result == 'success')
      && (!inputs.deploy_staffml || needs.deploy-staffml.result == 'success')
      && (!inputs.deploy_slides || needs.deploy-slides.result == 'success')
      && (!inputs.deploy_mlperf_edu || needs.deploy-mlperf-edu.result == 'success')
      && (!inputs.deploy_site || needs.deploy-site.result == 'success')
    uses: ./.github/workflows/instructors-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Step 11: Physical AI
  # ==========================================================================
  deploy-physical:
    name: '🤖 Deploy Physical AI'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs, deploy-staffml, deploy-slides, deploy-mlperf-edu, deploy-site, deploy-instructors]
    if: |
      always()
      && inputs.deploy_physical
      && (!inputs.deploy_book || needs.deploy-book.result == 'success')
      && (!inputs.deploy_kits || needs.deploy-kits.result == 'success')
      && (!inputs.deploy_tinytorch || needs.deploy-tinytorch.result == 'success')
      && (!inputs.deploy_mlsysim || needs.deploy-mlsysim.result == 'success')
      && (!inputs.deploy_labs || needs.deploy-labs.result == 'success')
      && (!inputs.deploy_staffml || needs.deploy-staffml.result == 'success')
      && (!inputs.deploy_slides || needs.deploy-slides.result == 'success')
      && (!inputs.deploy_mlperf_edu || needs.deploy-mlperf-edu.result == 'success')
      && (!inputs.deploy_site || needs.deploy-site.result == 'success')
      && (!inputs.deploy_instructors || needs.deploy-instructors.result == 'success')
    uses: ./.github/workflows/physical-publish-live.yml
    secrets: inherit
    with:
      description: ${{ inputs.description }}
      site_only: ${{ inputs.site_only }}
      release_type: ${{ inputs.release_type }}
      confirm: PUBLISH

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: '📋 Deployment Summary'
    needs: [deploy-book, deploy-kits, deploy-tinytorch, deploy-mlsysim, deploy-labs, deploy-staffml, deploy-slides, deploy-mlperf-edu, deploy-site, deploy-instructors, deploy-physical]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          {
            echo "## 🚀 Publish All Complete"
            echo ""
            echo "**Description**: ${{ inputs.description }}"
            echo "**Site only**: ${{ inputs.site_only }}"
            echo "**Release type**: ${{ inputs.release_type }}"
            echo ""
            echo "| Site | Status |"
            echo "|------|--------|"
            echo "| 📚 Book | ${{ needs.deploy-book.result }} |"
            echo "| 📦 Kits | ${{ needs.deploy-kits.result }} |"
            echo "| 🔥 TinyTorch | ${{ needs.deploy-tinytorch.result }} |"
            echo "| 🧮 MLSYSIM | ${{ needs.deploy-mlsysim.result }} |"
            echo "| 🔬 Labs | ${{ needs.deploy-labs.result }} |"
            echo "| 🎯 StaffML | ${{ needs.deploy-staffml.result }} |"
            echo "| 📊 Slides | ${{ needs.deploy-slides.result }} |"
            echo "| 🎓 MLPerf EDU Preview | ${{ needs.deploy-mlperf-edu.result }} |"
            echo "| 🌐 Landing Site | ${{ needs.deploy-site.result }} |"
            echo "| 🎓 Instructors | ${{ needs.deploy-instructors.result }} |"
            echo "| 🤖 Physical AI | ${{ needs.deploy-physical.result }} |"
            echo ""
            echo "### 🌐 Live URLs"
            echo "- 📖 [Volume I](https://mlsysbook.ai/${{ vars.VOL1_DEPLOY_PATH }}/)"
            echo "- 📘 [Volume II](https://mlsysbook.ai/${{ vars.VOL2_DEPLOY_PATH }}/)"
            echo "- 🤖 [Physical AI](https://mlsysbook.ai/${{ vars.DEV_PHYSICAL_PATH || 'physical' }}/)"
            echo "- 📦 [Kits](https://mlsysbook.ai/kits/)"
            echo "- 🔥 [TinyTorch](https://mlsysbook.ai/tinytorch/)"
            echo "- 🧮 [MLSYSIM](https://mlsysbook.ai/mlsysim/)"
            echo "- 🔬 [Labs](https://mlsysbook.ai/labs/)"
            echo "- 🎯 [StaffML](https://mlsysbook.ai/staffml/)"
            echo "- 📊 [Slides](https://mlsysbook.ai/slides/)"
            echo "- 🎓 [MLPerf EDU Preview](https://mlsysbook.ai/mlperf-edu/)"
            echo "- 🏠 [Landing](https://mlsysbook.ai/)"
            echo "- 📋 [About](https://mlsysbook.ai/about/)"
            echo "- 🌍 [Community](https://mlsysbook.ai/community/)"
            echo "- 📬 [Newsletter](https://mlsysbook.ai/newsletter/)"
            echo "- 🎓 [Instructors](https://mlsysbook.ai/instructors/)"
          } >> "$GITHUB_STEP_SUMMARY"
