name: '📝 Study Sheets · 👁️ Preview (Dev)'

# =============================================================================
# Chapter Study Sheets — Dev Preview Release
# =============================================================================
#
# Validates and builds every study sheet, all four volumes, and publishes them
# to the `studysheets-dev` prerelease. The dev book preview links unreleased
# volumes' chapters there (books/shared/studysheet/build.py sheet_url); released
# volumes link to studysheets-latest on both the dev preview and the live site.
#
# Flow:
#   1. VALIDATE — studysheets-validate-dev.yml (build, tests, stage artifact)
#   2. RELEASE  — replace the studysheets-dev prerelease's files with the new
#                 set and drop files no longer built (a renamed sheet)
#
# Triggers:
#   - push: dev branch, study-sheet sources
#   - workflow_dispatch: manual
#
# Deploys to: GitHub Release `studysheets-dev` (prerelease, never "latest")
#
# Related:
#   - studysheets-validate-dev.yml — build and checks
#   - studysheets-publish-live.yml — live volumes to studysheets-latest
#
# =============================================================================

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'books/shared/studysheet/**'
      - 'books/vol*/**/*_studysheet.tex'
      - 'books/vol*/**/*_studysheet_numbers.py'
      - 'books/vol*/tex/theme-colors.tex'

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: studysheets-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release only what a green validate built (same gating as slides-preview-dev.yml).
  validate:
    name: '✅ Validate (Dev)'
    uses: ./.github/workflows/studysheets-validate-dev.yml

  release-dev:
    name: '🏷️ Update studysheets-dev'
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 15

    steps:
      - name: 📥 Download staged sheets
        uses: actions/download-artifact@v8
        with:
          name: studysheets-release
          path: release/

      - name: 🏷️ Upload to the studysheets-dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=studysheets-dev
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --prerelease --latest=false \
              --target "${{ github.sha }}" \
              --title "Study Sheets (Dev Preview)" \
              --notes "Chapter study sheets for every volume, rebuilt from dev on each change. Preview only; the released sheets are in studysheets-latest."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber release/*.pdf
          # Drop assets this build no longer produces.
          for name in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            [ -f "release/$name" ] || gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes
          done
          echo "✅ $(ls release/*.pdf | wc -l) files on $TAG (commit ${GITHUB_SHA:0:8})"
