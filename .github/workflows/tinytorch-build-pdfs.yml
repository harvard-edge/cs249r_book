name: '🔥 TinyTorch · 🔨 Build PDFs'

# =============================================================================
# TinyTorch — Build PDF Artifacts
# =============================================================================
#
# Builds the TinyTorch Book (Quarto → XeLaTeX) and the Research Paper
# (LuaLaTeX), then uploads both as workflow artifacts. PDFs are injected
# into the site during deployment (not committed to repo).
#
# Research Paper build is independent (from tinytorch/paper/).
#
# Flow:
#   1. BUILD_BOOK   — diagrams to PDF, then Quarto book render (LuaLaTeX via TinyTeX)
#   2. BUILD_PAPER  — LuaLaTeX compile of research paper
#   3. SUMMARY      — Build status report
#
# Triggers:
#   - workflow_dispatch: manual
#   - workflow_call: called by preview and publish workflows
#
# Deploys to: N/A (artifacts only — TinyTorch-Book, TinyTorch-Paper)
#
# Related:
#   - tinytorch-preview-dev.yml  — Downloads artifacts for dev deploy
#   - tinytorch-publish-live.yml — Downloads artifacts for live deploy
#   - tinytorch-update-pdfs.yml  — Rebuilds + deploys PDFs without site
#
# =============================================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Can be called by publish workflows
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (branch, tag, or SHA)"
        type: string
        required: false
        default: ''
    outputs:
      book_built:
        description: "Whether the textbook PDF was built successfully"
        value: ${{ jobs.build-pdf-book.result == 'success' }}
      paper_built:
        description: "Whether the paper PDF was built successfully"
        value: ${{ jobs.build-pdf-paper.result == 'success' }}

permissions:
  contents: read

jobs:
  build-pdf-book:
    name: '📘 Build Textbook'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 📝 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📚 Setup TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: 🟢 Setup Node.js (for Mermaid)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: 📦 Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: 📦 Install build dependencies (apt + TeX)
        working-directory: tinytorch/book
        run: make install-deps

      - name: 📘 Render Textbook PDF (Quarto + LuaLaTeX)
        # `make pdf` converts the book's SVG diagrams to the PDF siblings the
        # svg-to-pdf filter points LaTeX at, then runs `quarto render`.
        working-directory: tinytorch/book
        run: |
          make pdf
          test -f _build/TinyTorch-Book.pdf || {
            echo "::error::_build/TinyTorch-Book.pdf was not produced"
            exit 1
          }
          echo "PDF produced at _build/TinyTorch-Book.pdf ($(du -h _build/TinyTorch-Book.pdf | cut -f1))"

      - name: 📤 Upload PDF Book
        uses: actions/upload-artifact@v7
        with:
          name: TinyTorch-Book
          path: tinytorch/book/_build/TinyTorch-Book.pdf
          retention-days: 90

  build-pdf-paper:
    name: '📑 Build Research Paper'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 📑 Compile Paper with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.tex
          working_directory: tinytorch/paper
          latexmk_use_lualatex: true

      - name: 📤 Upload PDF Paper
        uses: actions/upload-artifact@v7
        with:
          name: TinyTorch-Paper
          path: tinytorch/paper/paper.pdf
          retention-days: 90

  summary:
    name: '📊 Build Summary'
    runs-on: ubuntu-latest
    needs: [build-pdf-book, build-pdf-paper]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 📚 TinyTorch PDF Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| PDF | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📘 Textbook | ${{ needs.build-pdf-book.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📑 Research Paper | ${{ needs.build-pdf-paper.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "PDFs are uploaded as artifacts and will be injected during site deployment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy with these PDFs, run the appropriate publish workflow:" >> $GITHUB_STEP_SUMMARY
          echo "- **Live**: TinyTorch Publish (Live)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev**: TinyTorch Preview (Dev)" >> $GITHUB_STEP_SUMMARY
