name: SocratiQ validation

on:
  pull_request:
    paths:
      - 'socratiq/**'
      - 'books/shared/assets/scripts/socratiq/**'
      - 'books/config/_quarto-html-vol*.yml'
      - 'binder/tests/test_socratiq_html_integration.py'
      - '.github/workflows/socratiq-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socratiq/package-lock.json
      - run: npm ci
        working-directory: socratiq
      - run: npm run build:reader
        working-directory: socratiq
      - run: npm run build:vite
        working-directory: socratiq
      - name: Check published bundles match source
        run: |
          git ls-files --error-unmatch books/shared/assets/scripts/socratiq/reader.js
          git ls-files --error-unmatch books/shared/assets/scripts/socratiq/study.js
          git diff --exit-code -- books/shared/assets/scripts/socratiq binder/tools/scripts/socratiQ/bundle.js
      - run: npx playwright install --with-deps chromium webkit
        working-directory: socratiq
      - name: Check transport, storage, study workflows, and lazy integration
        run: npm run test:local
        working-directory: socratiq
      - name: Check replacement gateway policy and forwarding
        run: npm run test:gateway
        working-directory: socratiq
      - run: npm run test:reader:browser
        working-directory: socratiq
      - name: Check study storage transactions in WebKit
        run: node --test --test-concurrency=1 tests/night-storage.test.mjs tests/night-settings-browser.test.mjs tests/night-quiz-storage.test.mjs
        working-directory: socratiq
        env:
          SOCRATIQ_TEST_BROWSER: webkit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest -q binder/tests/test_socratiq_html_integration.py --confcutdir=binder/tests
