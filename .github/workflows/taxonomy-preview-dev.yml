name: '🧭 Taxonomy · 👁️ Preview (Dev)'

# =============================================================================
# ML Systems Taxonomy — Dev Preview Deploy
# =============================================================================
#
# Builds ONLY the taxonomy subsite and deploys it to the dev preview site,
# without rebuilding or redeploying the landing page, newsletter, or courses.
#
# Flow:
#   1. VALIDATE  — taxonomy-validate-dev.yml (inline gate)
#   2. BUILD     — Quarto render of taxonomy/ only
#   3. REWRITE   — Adjust URLs for dev site path prefix
#   4. DEPLOY    — SSH push of /taxonomy/ to the dev preview repo
#
# Triggers:
#   - Push to dev: when taxonomy-related files change
#   - Manual: workflow_dispatch
#
# Deploys to: DEV_REPO_URL (SSH) → /taxonomy/
# Secrets:    SSH_DEPLOY_KEY
# Vars:       DEV_REPO_URL
#
# Related:
#   - taxonomy-validate-dev.yml  — Content & build validation (gates this)
#   - taxonomy-publish-live.yml  — Same subsite, deployed to mlsysbook.ai
#   - site-preview-dev.yml       — Whole unified site (also contains /taxonomy/)
#
# =============================================================================

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths:
      - 'taxonomy/**'
      - 'books/vol*/**/*_concepts.yml'
      - 'books/config/_quarto-pdf-vol*.yml'
      - 'binder/cli/**'
      - 'binder/tests/**'
      - 'staffml/app/src/data/mlsys-taxonomy.json'
      - 'staffml/vault/schema/**'
      - 'staffml/vault-cli/**'
      - 'site/_quarto.yml'
      - 'site/scripts/build_concept_explorer.py'
      - 'site/scripts/fingerprint_assets.py'
      - 'shared/**'
      - '.github/workflows/taxonomy-validate-dev.yml'
      - '.github/workflows/taxonomy-preview-dev.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: taxonomy-dev-deploy
  cancel-in-progress: true

jobs:
  # Run the full validate-dev workflow inline. Deploy depends on it so
  # Preview can never deploy on a SHA where validate failed.
  validate:
    name: '✅ Validate (Dev)'
    uses: ./.github/workflows/taxonomy-validate-dev.yml

  build-and-deploy:
    name: '🔨 Build & Deploy Taxonomy (Dev)'
    runs-on: ubuntu-latest
    needs: [validate]
    concurrency:
      group: cs249r-book-dev-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: 📦 Install taxonomy & concept map dependencies
        run: |
          python3 -m pip install -r taxonomy/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 🔨 Build Taxonomy subsite
        working-directory: site
        run: |
          python3 scripts/build_concept_explorer.py
          TAXONOMY_ONLY=1 TAXONOMY_PRESTAGED=1 quarto render taxonomy
          QUARTO_PROJECT_RENDER_ALL=1 python3 scripts/build_concept_explorer.py --clean
          python3 scripts/fingerprint_assets.py
          python3 scripts/build_concept_explorer.py --check-staged
          echo "✅ Taxonomy rendered: $(find _build/taxonomy -name '*.html' | wc -l) HTML pages"

      - name: 🔗 Rewrite URLs for dev site
        run: |
          bash .github/scripts/rewrite-dev-urls.sh taxonomy site/_build/taxonomy
          DEV_REPO_NAME=$(basename "${{ vars.DEV_REPO_URL || 'cs249r_book_dev' }}" .git)
          while IFS= read -r -d '' html_file; do
            sed -i.bak "s|\"/site_libs/|\"/${DEV_REPO_NAME}/site_libs/|g; s|'/site_libs/|'/${DEV_REPO_NAME}/site_libs/|g; s|\"/assets/|\"/${DEV_REPO_NAME}/assets/|g; s|'/assets/|'/${DEV_REPO_NAME}/assets/|g" "$html_file"
            rm -f "${html_file}.bak"
          done < <(find site/_build/taxonomy -name '*.html' -print0)

      - name: 🔍 Validate build
        run: |
          if [ ! -f "site/_build/taxonomy/index.html" ]; then
            echo "❌ CRITICAL: taxonomy/index.html missing from build. Aborting."
            exit 1
          fi
          echo "✅ Taxonomy validated"

      - name: 🔧 Modify announcement for dev preview
        run: |
          COMMIT_HASH="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:8}"

          python3 binder/tools/scripts/publish/modify_dev_announcement.py \
            site/_build/taxonomy \
            --verbose \
            --commit-hash "$COMMIT_HASH" \
            --commit-short "$COMMIT_SHORT"

      - name: 🚀 Deploy to Dev Site via SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          echo "🔐 Starting ssh-agent..."
          eval "$(ssh-agent -s)"
          echo "$SSH_DEPLOY_KEY" | tr -d '\r' | ssh-add - > /dev/null

          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          echo "🔄 Cloning dev preview repository..."
          git clone --depth=1 ${{ vars.DEV_REPO_URL }} target-repo
          cd target-repo

          BUILD_DIR="${{ github.workspace }}/site/_build"
          SITE_ASSETS_DIR="${{ github.workspace }}/site/assets"

          stage_taxonomy() {
            rm -rf taxonomy
            mkdir -p taxonomy
            cp -a "$BUILD_DIR/taxonomy/." taxonomy/
            if [ -d "$BUILD_DIR/site_libs" ]; then
              mkdir -p site_libs
              cp -a "$BUILD_DIR/site_libs/." site_libs/
            fi
            if [ -d "$BUILD_DIR/assets" ]; then
              mkdir -p assets
              cp -a "$BUILD_DIR/assets/." assets/
            elif [ -d "$SITE_ASSETS_DIR" ]; then
              mkdir -p assets
              cp -a "$SITE_ASSETS_DIR/." assets/
            fi
            touch .nojekyll
          }

          stage_taxonomy
          [ -f "taxonomy/index.html" ] || { echo "❌ CRITICAL: taxonomy/index.html missing."; exit 1; }

          echo "📦 Committing and pushing..."
          git add -A taxonomy site_libs assets .nojekyll
          git commit -m "🧭 Deploy taxonomy dev preview from ${{ github.sha }}" --allow-empty || echo "🟡 Nothing to commit"

          PUSHED=false
          for i in 1 2 3; do
            if git push origin main 2>/dev/null; then
              echo "✅ Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "⚠️ Push failed (attempt $i/3), resetting to latest origin/main and re-staging..."
            git fetch origin main
            git reset --hard origin/main
            stage_taxonomy
            git add -A taxonomy site_libs assets .nojekyll
            git commit -m "🧭 Deploy taxonomy dev preview from ${{ github.sha }}" --allow-empty || true
          done
          if [ "$PUSHED" != "true" ]; then
            echo "❌ Push failed after 3 attempts."
            exit 1
          fi

          echo "✅ Taxonomy deployed to dev preview"
