name: '🤖 Physical AI · 📚 Build PDFs & EPUB'

# =============================================================================
# Physical AI — Reusable PDF and EPUB Compilation
# =============================================================================
#
# Compiles the Physical AI LuaLaTeX PDF and EPUB book and uploads them as
# GitHub Actions artifacts for downstream preview/publish workflows.
# =============================================================================

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA)'
        type: string
        required: false
        default: ''

env:
  PHYSICAL_ROOT: ${{ vars.PHYSICAL_ROOT || 'physical' }}
  PHYSICAL_BOOK_DIR: ${{ vars.PHYSICAL_BOOK_DIR || 'physical/book' }}
  PHYSICAL_BUILD_DIR: ${{ vars.PHYSICAL_BOOK_DIR || 'physical/book' }}/_build
  PHYSICAL_PDF_NAME: ${{ vars.PHYSICAL_PDF_NAME || 'Physical-AI.pdf' }}
  PHYSICAL_EPUB_NAME: ${{ vars.PHYSICAL_EPUB_NAME || 'Physical-AI.epub' }}
  PHYSICAL_ARTIFACT_NAME: ${{ vars.PHYSICAL_ARTIFACT_NAME || 'Physical-AI-Builds' }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}

jobs:
  build-pdf-epub:
    name: '📄 Compile Physical AI PDF & EPUB'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📚 Setup TeX Live / LuaLaTeX
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: |
            scheme-full
            lualatex-math
            fontspec
            koma-script

      - name: 📦 Install SVG tools
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: 📄 Render LuaLaTeX PDF
        working-directory: ${{ env.PHYSICAL_BOOK_DIR }}
        run: quarto render --to pdf

      - name: 📱 Render EPUB
        working-directory: ${{ env.PHYSICAL_BOOK_DIR }}
        run: quarto render --to epub

      - name: 📦 Stage Artifacts for Upload
        run: |
          mkdir -p physical-artifacts
          cp "${{ env.PHYSICAL_BUILD_DIR }}/${{ env.PHYSICAL_PDF_NAME }}" physical-artifacts/
          cp "${{ env.PHYSICAL_BUILD_DIR }}/${{ env.PHYSICAL_EPUB_NAME }}" physical-artifacts/

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PHYSICAL_ARTIFACT_NAME }}
          path: physical-artifacts/
          if-no-files-found: error
