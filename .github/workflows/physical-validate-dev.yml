name: '🤖 Physical AI · ✅ Validate (Dev)'

# =============================================================================
# Physical AI — Content & Build Validation
# =============================================================================
#
# Validates Physical AI content integrity and build output (HTML, PDF, EPUB).
#
# Flow:
#   1. VALIDATE_CONTENT — Check image references, cross-references, and layout
#   2. BUILD_SITE       — Quarto HTML render succeeds
#   3. BUILD_PDF        — LuaLaTeX PDF compiles successfully
#   4. BUILD_EPUB       — EPUB compiles successfully
#
# Triggers:
#   - push: dev branch, physical/** paths
#   - pull_request: physical/** or workflow file changes
#   - workflow_dispatch: manual
#
# Deploys to: N/A (validate only)
# =============================================================================

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'physical/**'
      - 'shared/**'
      - '.github/workflows/physical-*'
  push:
    branches: [dev]
    paths:
      - 'physical/**'
      - 'shared/**'
      - '.github/workflows/physical-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Workflow-level environment. Declared here rather than repository vars
# so pull requests from forks don't hit empty variable references.
env:
  PHYSICAL_ROOT: physical
  PHYSICAL_BOOK_DIR: physical/book
  PHYSICAL_BUILD_DIR: physical/book/_build
  PDF_NAME: Physical-AI.pdf
  EPUB_NAME: Physical-AI.epub
  PYTHON_VERSION: '3.12'

jobs:
  # ===========================================================================
  # Stage 1: Content validation
  # ===========================================================================
  validate-content:
    name: '🔍 Validate Content & Checks'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔍 Check image references exist
        working-directory: ${{ env.PHYSICAL_ROOT }}
        run: |
          echo "🔍 Checking that all referenced images exist..."
          python3 - <<'PYEOF'
          import re, os, sys, glob

          pattern = re.compile(r'!\[.*?\]\(([^)]+)\)')
          fails = []

          for qmd in glob.glob("book/**/*.qmd", recursive=True):
              qmd_dir = os.path.dirname(qmd)
              with open(qmd) as f:
                  for lineno, line in enumerate(f, 1):
                      for m in pattern.finditer(line):
                          img = m.group(1).split("{")[0].strip()
                          if img.startswith(("http://", "https://", "#", "@")) or not img:
                              continue
                          if not os.path.isfile(os.path.join(qmd_dir, img)) and not os.path.isfile(os.path.join("book", img)) and not os.path.isfile(img):
                              fails.append(f"  {qmd}:{lineno} -> {img}")

          if fails:
              print(f"❌ {len(fails)} missing image reference(s):")
              for f in fails:
                  print(f)
              sys.exit(1)
          else:
              print("✅ All image references are valid")
          PYEOF

      - name: 📋 Run Physical AI static checks
        working-directory: ${{ env.PHYSICAL_ROOT }}
        run: |
          python3 cli check

  # ===========================================================================
  # Stage 2: Quarto HTML site build
  # ===========================================================================
  build-site:
    name: '🔨 Build HTML Website'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📦 Install SVG/Image tools
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: 🔨 Render HTML
        working-directory: ${{ env.PHYSICAL_BOOK_DIR }}
        run: quarto render --to html

      - name: 🔍 Validate HTML Output
        run: |
          if [ ! -f "${{ env.PHYSICAL_BUILD_DIR }}/index.html" ]; then
            echo "❌ CRITICAL: ${{ env.PHYSICAL_BUILD_DIR }}/index.html missing."
            exit 1
          fi
          echo "✅ HTML build succeeded!"

  # ===========================================================================
  # Stage 3: LuaLaTeX PDF build
  # ===========================================================================
  build-pdf:
    name: '📄 Build PDF Textbook'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📚 Setup TeX Live / LuaLaTeX
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: |
            scheme-full
            lualatex-math
            fontspec
            koma-script

      - name: 📦 Install SVG tools
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: 🔨 Render PDF
        working-directory: ${{ env.PHYSICAL_BOOK_DIR }}
        run: quarto render --to pdf

      - name: 🔍 Validate PDF Output
        run: |
          if [ ! -f "${{ env.PHYSICAL_BUILD_DIR }}/${{ env.PDF_NAME }}" ]; then
            echo "❌ CRITICAL: ${{ env.PDF_NAME }} missing from build output."
            exit 1
          fi
          echo "✅ PDF build succeeded!"

  # ===========================================================================
  # Stage 4: EPUB build
  # ===========================================================================
  build-epub:
    name: '📱 Build EPUB'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 🔨 Render EPUB
        working-directory: ${{ env.PHYSICAL_BOOK_DIR }}
        run: quarto render --to epub

      - name: 🔍 Validate EPUB Output
        run: |
          if [ ! -f "${{ env.PHYSICAL_BUILD_DIR }}/${{ env.EPUB_NAME }}" ]; then
            echo "❌ CRITICAL: ${{ env.EPUB_NAME }} missing from build output."
            exit 1
          fi
          echo "✅ EPUB build succeeded!"
