name: Optional Forge integration

on:
  pull_request:
    branches: [dev]
    paths:
      - integrations/forge/**
      - .github/workflows/forge-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e 'integrations/forge[dev]' -e mlsysim
      - run: python -m pytest integrations/forge/tests -q
