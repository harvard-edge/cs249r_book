name: '🔥 TinyTorch · 🚀 Publish (Live)'

# =============================================================================
# TinyTorch — Production Deploy with Semantic Versioning
# =============================================================================
#
# Builds and deploys the TinyTorch site to production with automatic
# semantic versioning, release tagging, and PDF generation.
#
# Flow:
#   1. VALIDATE_INPUTS  — Pin SOURCE_SHA (dev tip, once); next version from tags
#   2. PREFLIGHT        — Full test suite (tinytorch-validate-dev.yml) ON SOURCE_SHA
#   3. UPDATE_VERSION   — Bump commit on top of SOURCE_SHA, fast-forward dev
#                         (fails closed if dev moved). Output RELEASE_SHA.
#                         (skip if site_only; then RELEASE_SHA = SOURCE_SHA)
#   4. SYNC_DEV_MAIN    — Merge exactly RELEASE_SHA into main; tinytorch/ tree
#                         must equal RELEASE_SHA's. Output MAIN_SHA.
#   5. BUILD_PDFS       — Guide + paper PDFs from MAIN_SHA (skip if site_only)
#   6. BUILD_DEPLOY     — Quarto render of MAIN_SHA, deploy to gh-pages/tinytorch/
#   7. CREATE_RELEASE   — Immutable tag on MAIN_SHA + draft Release (skip if site_only)
#
# Pinning: no step after VALIDATE_INPUTS re-reads a branch tip. What was tested
# is what ships. On a partial failure use "Re-run failed jobs" (keeps the
# pinned SHAs and version); a fresh dispatch pins a new SHA and re-tests.
#
# Modes:
#   - Full Release: version bump + tag + PDFs (default)
#   - Site Only:    website deploy without version/tag/PDFs
#
# Triggers:
#   - workflow_dispatch: manual with PUBLISH confirmation
#
# Deploys to: mlsysbook.ai/tinytorch/
# Secrets:    GITHUB_TOKEN
#
# Related:
#   - tinytorch-validate-dev.yml — Preflight test suite
#   - tinytorch-build-pdfs.yml   — Reusable PDF build
#   - tinytorch-preview-dev.yml  — Dev preview deploy
#
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'What are you publishing? [Content updates and improvements]'
        required: false
        default: 'Content updates and improvements'
      site_only:
        description: 'Website-only deploy? (no version bump, no tag, no PDFs)'
        required: false
        type: boolean
        default: false
      release_type:
        description: 'Release type (ignored if site_only OR if explicit_version is set) [patch]'
        required: true
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
        default: 'patch'
      explicit_version:
        description: 'Override: explicit X.Y.Z to release (skips patch/minor/major math). Leave blank to auto-bump.'
        required: false
        default: ''
      confirm:
        description: 'Type "PUBLISH" to confirm (safety check) [required]'
        required: true
        default: ''
  workflow_call:
    inputs:
      description:
        type: string
        required: false
        default: 'Content updates and improvements'
      site_only:
        type: boolean
        required: false
        default: false
      release_type:
        type: string
        required: false
        default: 'patch'
      explicit_version:
        type: string
        required: false
        default: ''
      confirm:
        type: string
        required: true

# Least privilege: read-only by default; the four jobs that push (dev bump,
# main merge, gh-pages deploy, tag/release) opt in to contents: write.
# actions: read is needed by the guard and the preflight's Windows report.
permissions:
  contents: read
  actions: read

# One TinyTorch publish at a time, never cancelled mid-flight: two concurrent
# runs would compute the same version and race the tag. Literal group name,
# because inside workflow_call (publish-all-live) github.workflow is the
# caller's name. publish-all-live holds no lock, so this cannot deadlock.
concurrency:
  group: tinytorch-publish-live
  cancel-in-progress: false

# NB: gh-pages-deploy concurrency is declared on the build-and-deploy job
# only. The guard, preflight, version bump, dev→main sync, and PDF build
# run without holding the lock.

jobs:
  # Block publish unless the latest dev validate run for tinytorch is green.
  # NB: the existing `preflight` job re-runs validate-dev against this commit
  # in-band; this guard is the cheaper outer check that the dev branch *was*
  # green before someone clicked Publish, so we fail fast on stale dev.
  guard:
    name: '🛡️ Validate-Dev Green Gate'
    if: inputs.confirm == 'PUBLISH'
    uses: ./.github/workflows/infra-publish-guard.yml
    with:
      validate_workflow: tinytorch-validate-dev.yml
      # Ignore PR runs (a fork branch named "dev" matches branch=dev) and
      # manual quick dispatches. The SHA-exact gate is the preflight below.
      event: push

  validate-inputs:
    name: '🔍 Validate Inputs'
    runs-on: ubuntu-latest
    needs: [guard]
    timeout-minutes: 15
    if: inputs.confirm == 'PUBLISH'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      site_only: ${{ steps.mode.outputs.site_only }}
      source_sha: ${{ steps.pin.outputs.source_sha }}

    steps:
      - name: 📥 Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - name: 📌 Pin the commit this publish will test and ship
        id: pin
        run: |
          # The workflow definition and the shipped content must both be dev.
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::Dispatch the TinyTorch publish from dev (got $GITHUB_REF)."
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "📌 Will test and ship dev @ $SOURCE_SHA"
          echo "**Pinned source:** \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 🏷️ Fetch tags
        run: git fetch --tags --depth=1 origin

      - name: 🔀 Determine deploy mode
        id: mode
        run: |
          SITE_ONLY="${{ inputs.site_only }}"
          echo "site_only=$SITE_ONLY" >> $GITHUB_OUTPUT
          if [ "$SITE_ONLY" = "true" ]; then
            echo "🌐 Mode: SITE-ONLY deploy (no version bump, no tag, no PDFs)"
          else
            echo "🚀 Mode: FULL RELEASE (version bump + tag + PDFs)"
          fi

      - name: 🏷️ Calculate Next Version
        id: version
        env:
          EXPLICIT_VERSION: ${{ inputs.explicit_version }}
        run: |
          # In site-only mode, just output the current version (no bump)
          if [ "${{ inputs.site_only }}" = "true" ]; then
            LATEST_VERSION=$(git tag -l "tinytorch-v*" | sort -V | tail -n1)
            LATEST_VERSION=${LATEST_VERSION:-"tinytorch-v0.0.0"}
            echo "🌐 Site-only mode — keeping current version: $LATEST_VERSION"
            echo "new_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            echo "previous_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Always look up the previous tag (used as previous_version output)
          LATEST_VERSION=$(git tag -l "tinytorch-v*" | sort -V | tail -n1)
          LATEST_VERSION=${LATEST_VERSION:-"tinytorch-v0.0.0"}
          echo "📊 Latest TinyTorch tag: $LATEST_VERSION"

          # Explicit-version override: bypass major/minor/patch math.
          # Used for non-incremental jumps (e.g. 0.1.x → 0.10.0 alongside Vol II launch).
          EXPLICIT="${EXPLICIT_VERSION}"
          if [ -n "$EXPLICIT" ]; then
            if ! echo "$EXPLICIT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "❌ explicit_version '$EXPLICIT' is not a valid X.Y.Z semver triple."
              exit 1
            fi
            NEW_VERSION="tinytorch-v$EXPLICIT"
            # Guard against re-tagging an existing release
            if git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
              echo "❌ Tag $NEW_VERSION already exists. Refusing to re-release."
              exit 1
            fi
            echo "🎯 Explicit version override: $NEW_VERSION (bypassing ${{ inputs.release_type }} bump)"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "previous_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔄 Auto-calculating next ${{ inputs.release_type }} version..."

          # Remove 'tinytorch-v' prefix for calculation
          VERSION_NUM=${LATEST_VERSION#tinytorch-v}

          # Split version into components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          echo "📊 Previous version: $MAJOR.$MINOR.$PATCH"

          # Calculate new version based on release type
          case "${{ inputs.release_type }}" in
            "major")
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            "minor")
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            "patch")
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="tinytorch-v$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "🎯 New version: $NEW_VERSION (${{ inputs.release_type }} release)"

          # Export for other steps
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "previous_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: 🛡️ No-downgrade guard
        if: steps.mode.outputs.site_only != 'true'
        run: |
          # ----------------------------------------------------------------
          # No-downgrade guard.
          #
          # The version-bump step computes NEW_VERSION from the latest git
          # tag (`tinytorch-v*`). That works perfectly when the source files
          # are kept in lockstep with the tags. It silently DOWNGRADES the
          # source if someone manually pre-bumps `pyproject.toml` and then
          # forgets to also tag.
          #
          # Concrete failure mode this guard prevents:
          #   - latest tag:        tinytorch-v0.1.9
          #   - pyproject.toml:    0.10.0   (manually pre-bumped for a non-
          #                                  incremental jump)
          #   - workflow dispatch: release_type=patch (the default!)
          #   - workflow computes: 0.1.10
          #   - sed step rewrites: pyproject.toml = 0.1.10
          #   → silent downgrade from 0.10.0 to 0.1.10, no error.
          #
          # The guard refuses to proceed if the planned NEW_VERSION is not
          # strictly greater (semver-wise) than the version already in the
          # source-of-truth file. The fix when this trips:
          #   1. If you intended the higher version, re-run with
          #      explicit_version=<higher>. The override path is exempt
          #      from the source-comparison only if it equals the source
          #      (no-op write) or exceeds it (forward bump).
          #   2. If you intended a lower version (rare, e.g. backing out
          #      a botched bump), edit pyproject.toml manually first so
          #      source and intent agree.
          # ----------------------------------------------------------------

          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          NEW_BARE="${NEW_VERSION#tinytorch-v}"
          SRC_BARE=$(grep -E '^version *= *"' tinytorch/pyproject.toml \
                     | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "📂 source-of-truth (pyproject.toml): $SRC_BARE"
          echo "🎯 planned new version:              $NEW_BARE"

          if [ -z "$SRC_BARE" ]; then
            echo "❌ Could not read version from tinytorch/pyproject.toml — refusing to proceed."
            exit 1
          fi

          if [ "$NEW_BARE" = "$SRC_BARE" ]; then
            echo "✅ planned version equals source — no-op write, allowed."
            exit 0
          fi

          # sort -V puts the higher semver last
          HIGHEST=$(printf '%s\n%s\n' "$NEW_BARE" "$SRC_BARE" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$NEW_BARE" ]; then
            echo ""
            echo "❌ DOWNGRADE BLOCKED"
            echo "   pyproject.toml is at $SRC_BARE but this run would write $NEW_BARE."
            echo "   sort -V says $SRC_BARE > $NEW_BARE."
            echo ""
            echo "   This usually means pyproject.toml was manually pre-bumped"
            echo "   to $SRC_BARE without a matching tinytorch-v$SRC_BARE tag."
            echo ""
            echo "   To proceed, re-run this workflow with:"
            echo "     explicit_version: $SRC_BARE          (publish current source as-is)"
            echo "   or a higher value if you want to jump further. Or revert the"
            echo "   manual pre-bump in pyproject.toml so source matches latest tag."
            exit 1
          fi

          echo "✅ planned $NEW_BARE > source $SRC_BARE — forward bump, allowed."

  preflight:
    name: '✈️ Preflight Checks'
    needs: validate-inputs
    uses: ./.github/workflows/tinytorch-validate-dev.yml
    with:
      test_type: 'all'
      ref: ${{ needs.validate-inputs.outputs.source_sha }}

  update-version:
    name: '📝 Update Version in Code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-inputs, preflight]
    if: needs.preflight.result == 'success' && needs.validate-inputs.outputs.site_only != 'true'
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.bump.outputs.release_sha }}

    steps:
      - name: 📥 Checkout the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Update version in pyproject.toml (single source of truth)
        run: |
          echo "📝 Updating version in tinytorch/pyproject.toml..."

          VERSION_NUM="${{ needs.validate-inputs.outputs.new_version }}"
          VERSION_NUM=${VERSION_NUM#tinytorch-v}

          # Update version in pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION_NUM\"/" tinytorch/pyproject.toml

          echo "✅ pyproject.toml version updated"
          cat tinytorch/pyproject.toml | grep "^version"

      - name: 📝 Update version in settings.ini (nbdev / tito metadata)
        run: |
          echo "📝 Updating version in tinytorch/settings.ini..."

          VERSION_NUM="${{ needs.validate-inputs.outputs.new_version }}"
          VERSION_NUM=${VERSION_NUM#tinytorch-v}

          # nbdev settings.ini uses unquoted "version = X.Y.Z" (no quotes)
          sed -i "s/^version = .*/version = $VERSION_NUM/" tinytorch/settings.ini

          echo "✅ settings.ini version updated"
          grep "^version" tinytorch/settings.ini

      - name: 📝 Update version in installer
        run: |
          # Installer lives under the Quarto site (tinytorch/guide/install.sh)
          # since the retirement of the legacy Jupyter Book tree; served at
          # mlsysbook.ai/tinytorch/install.sh via the site's `resources:` key.
          echo "📝 Updating version in tinytorch/guide/install.sh..."

          VERSION_NUM="${{ needs.validate-inputs.outputs.new_version }}"
          VERSION_NUM=${VERSION_NUM#tinytorch-v}

          sed -i "s/TINYTORCH_DEFAULT_VERSION=\"[0-9.]*\"/TINYTORCH_DEFAULT_VERSION=\"$VERSION_NUM\"/" tinytorch/guide/install.sh

          echo "✅ install.sh updated"
          grep "TINYTORCH_DEFAULT_VERSION" tinytorch/guide/install.sh

      # NB: A previous version of this workflow rewrote
      # tinytorch/guide/config/announcement.yml on every publish with a
      # release-only banner, silently replacing the 4-line ecosystem
      # cross-link template the file is supposed to hold. The regression
      # hit v0.1.10 (commit 0009f55a9, 2026-04-22) and again v0.1.11
      # (2026-05-11). The version is already surfaced by:
      #   - the footer release pill (rendered from release-manifest.json)
      #   - the navbar version chip (templated from tinytorch/settings.ini)
      # so the announcement bar doesn't need a third release-version
      # surface. If a future release warrants a top-of-bar mention,
      # prepend a transient `release_note` line to the existing content
      # (ruamel.yaml round-trip on the same file) rather than rewriting
      # the whole document. Until then this step is deliberately absent.

      - name: 📝 Update README badge
        run: |
          echo "📝 Updating version badge in tinytorch/README.md..."

          VERSION_NUM="${{ needs.validate-inputs.outputs.new_version }}"
          VERSION_NUM=${VERSION_NUM#tinytorch-v}

          # Update version badge in README.md
          sed -i "s/version-[0-9.]*-D4740C/version-$VERSION_NUM-D4740C/" tinytorch/README.md

          echo "✅ README.md badge updated"
          grep "version-" tinytorch/README.md | head -1

      - name: 📝 Update navbar version chip
        run: |
          # The chip lives in tinytorch/guide/assets/scripts/sidebar-subtitle.html
          # as a literal `🔥 TinyTorch v0.1.X →` string with a TINYTORCH_VERSION_CHIP
          # sed anchor on the same line. Without this step the chip drifts behind
          # settings.ini on every release — the v0.1.10 → v0.1.11 cycle on 2026-05-11
          # left the chip showing v0.1.10 long after the rest of the site moved on.
          echo "📝 Updating navbar version chip in sidebar-subtitle.html..."

          VERSION_NUM="${{ needs.validate-inputs.outputs.new_version }}"
          VERSION_NUM=${VERSION_NUM#tinytorch-v}

          # Address-anchored: only touch the line that carries the TINYTORCH_VERSION_CHIP
          # marker, then bump the v\d+.\d+.\d+ token on that line.
          sed -i "/TINYTORCH_VERSION_CHIP/s/v[0-9][0-9.]*/v$VERSION_NUM/" \
            tinytorch/guide/assets/scripts/sidebar-subtitle.html

          echo "✅ chip updated"
          grep "TINYTORCH_VERSION_CHIP" tinytorch/guide/assets/scripts/sidebar-subtitle.html

      - name: 💾 Commit version update
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            tinytorch/pyproject.toml \
            tinytorch/settings.ini \
            tinytorch/guide/install.sh \
            tinytorch/README.md \
            tinytorch/guide/assets/scripts/sidebar-subtitle.html
          git commit -m "chore(tinytorch): bump version to ${{ needs.validate-inputs.outputs.new_version }}" || echo "No changes to commit"

          # Fast-forward only: the bump sits directly on the tested commit. If
          # dev moved during preflight, this push is rejected and the publish
          # stops before main, gh-pages, or tags are touched.
          if ! git push origin "HEAD:refs/heads/dev"; then
            echo "::error::dev moved since preflight pinned ${{ needs.validate-inputs.outputs.source_sha }}. Re-dispatch to test and ship the new tip."
            exit 1
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  sync-from-dev:
    name: '🔄 Sync dev → main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-inputs, preflight, update-version]
    if: always() && needs.preflight.result == 'success' && (needs.update-version.result == 'success' || needs.update-version.result == 'skipped')
    permissions:
      contents: write
    outputs:
      main_sha: ${{ steps.merge.outputs.main_sha }}

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Merge the tested commit into main
        id: merge
        env:
          DESCRIPTION: ${{ inputs.description }}
          # Bump commit on a full release; the pinned source on site_only.
          RELEASE_SHA: ${{ needs.update-version.outputs.release_sha || needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! echo "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::No pinned release SHA (got '$RELEASE_SHA')."
            exit 1
          fi
          echo "📥 Fetching pinned commit $RELEASE_SHA..."
          git fetch origin "$RELEASE_SHA"

          SITE_ONLY="${{ needs.validate-inputs.outputs.site_only }}"
          if [ "$SITE_ONLY" = "true" ]; then
            MERGE_MSG="🌐 TinyTorch website update: ${DESCRIPTION}"
          else
            MERGE_MSG="🔥 TinyTorch ${{ needs.validate-inputs.outputs.new_version }}: ${DESCRIPTION}"
          fi

          echo "🔄 Merging $RELEASE_SHA into main..."
          git merge --no-ff --no-edit -m "$MERGE_MSG" "$RELEASE_SHA"

          # What ships must be what was tested: main's tinytorch/ tree has to
          # be byte-identical to the tested commit (+ its version bump). Fails
          # if main carries tinytorch/ changes that never went through dev.
          if ! git diff --quiet "$RELEASE_SHA" HEAD -- tinytorch/; then
            echo "::error::main's tinytorch/ differs from tested commit $RELEASE_SHA; refusing to ship untested content."
            git diff --stat "$RELEASE_SHA" HEAD -- tinytorch/
            exit 1
          fi

          echo "🚀 Pushing updated main..."
          # Plain push: rejected (fail closed) if main moved since checkout.
          git push origin HEAD:refs/heads/main
          MAIN_SHA=$(git rev-parse HEAD)
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ main @ $MAIN_SHA"

  build-pdfs:
    name: '📚 Build PDFs'
    needs: [validate-inputs, preflight, sync-from-dev]
    if: needs.validate-inputs.outputs.site_only != 'true'
    uses: ./.github/workflows/tinytorch-build-pdfs.yml
    with:
      ref: ${{ needs.sync-from-dev.outputs.main_sha }}

  build-and-deploy:
    name: '🔥 Build & Deploy'
    runs-on: ubuntu-latest
    needs: [validate-inputs, preflight, update-version, sync-from-dev, build-pdfs]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.sync-from-dev.result == 'success' &&
      (needs.update-version.result == 'success' || needs.update-version.result == 'skipped') &&
      (needs.build-pdfs.result == 'success' || needs.build-pdfs.result == 'skipped')
    # Holds the cross-site gh-pages-deploy lock; never let a hang block every
    # site's deploy for the 360-minute default (observed: ~2.5 min).
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync-from-dev.outputs.main_sha }}  # the pinned, tested merge
          persist-credentials: false

      - name: 🔧 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The community dashboard HTML now lives in-tree at
      # tinytorch/guide/community/ and is published by Quarto via the
      # `resources: community/**` entry in _quarto.yml. No pre-render copy
      # step is needed here (or in tinytorch-preview-dev.yml).
      - name: 🔨 Build Quarto Site
        working-directory: tinytorch/guide
        run: |
          echo "🔨 Building TinyTorch Quarto site..."
          quarto render
          touch _build/.nojekyll
          echo "✅ Build complete"

      - name: 📥 Download PDF Book
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: TinyTorch-Book
          path: ./pdf-artifacts/book

      - name: 📥 Download PDF Paper
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: TinyTorch-Paper
          path: ./pdf-artifacts/paper

      - name: 📁 Inject PDFs into site
        env:
          SITE_ONLY: ${{ needs.validate-inputs.outputs.site_only }}
        run: |
          echo "📁 Injecting PDFs into built site..."
          mkdir -p tinytorch/guide/_build/assets/downloads

          if [ -f ./pdf-artifacts/book/TinyTorch-Book.pdf ]; then
            cp ./pdf-artifacts/book/TinyTorch-Book.pdf tinytorch/guide/_build/assets/downloads/TinyTorch-Book.pdf
            echo "✅ Injected TinyTorch-Book.pdf"
          else
            echo "⚠️ Book PDF not found"
          fi

          if [ -f ./pdf-artifacts/paper/paper.pdf ]; then
            cp ./pdf-artifacts/paper/paper.pdf tinytorch/guide/_build/assets/downloads/TinyTorch-Paper.pdf
            echo "✅ Injected TinyTorch-Paper.pdf"
          else
            echo "⚠️ Paper PDF not found"
          fi

          echo ""
          echo "📦 Downloads folder contents:"
          ls -la tinytorch/guide/_build/assets/downloads/ || echo "No downloads folder"

          # A full release replaces the whole gh-pages tinytorch/ subtree. If a
          # PDF did not arrive, stop HERE, before the deploy step wipes the
          # live folder, so the current site and its PDFs stay up.
          if [ "$SITE_ONLY" != "true" ]; then
            for f in TinyTorch-Book.pdf TinyTorch-Paper.pdf; do
              if [ ! -f "tinytorch/guide/_build/assets/downloads/$f" ]; then
                echo "::error::$f missing on a full release; not deploying (live site left untouched)."
                exit 1
              fi
            done
          fi

      - name: 📊 Download slide decks from release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📊 Downloading slide decks from GitHub release..."
          mkdir -p tinytorch/guide/_build/assets/slides

          # Download all PDFs from the slides release
          gh release download tinytorch-slides-v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.pdf" \
            --dir tinytorch/guide/_build/assets/slides || echo "⚠️ No slides release found"

          echo ""
          echo "📦 Slides folder contents:"
          ls -la tinytorch/guide/_build/assets/slides/ || echo "No slides folder"
          echo "✅ Downloaded $(ls tinytorch/guide/_build/assets/slides/*.pdf 2>/dev/null | wc -l) slide decks"

      - name: 📦 Emit release manifest
        # Single source of truth for "what release does this bundle ship?".
        # The footer pill (shared/release/release-pill.html) fetches this
        # at runtime; the BibTeX/citation card consumes it at build time.
        # Always emitted — for site-only redeploys we keep the existing
        # release_id but stamp a fresh buildDate so users on stale tabs
        # still get the drift-detection signal.
        env:
          NEW_VERSION: ${{ needs.validate-inputs.outputs.new_version }}
        run: |
          set -euo pipefail
          RELEASE_ID="${NEW_VERSION#tinytorch-v}"

          # Inputs that DEFINE a TinyTorch release. We hash framework source
          # (modules/), the user-facing site (guide/, but never its build
          # output), and the release-defining metadata (pyproject.toml,
          # MANIFEST.in). Scripts are intentionally excluded — they're build
          # tooling, not part of the citable artifact.
          RELEASE_HASH=$(python3 scripts/version/release.py compute-hash \
            --paths tinytorch/modules tinytorch/guide \
                    tinytorch/pyproject.toml tinytorch/MANIFEST.in \
            --exclude '_build' '__pycache__' '*.pyc' '.DS_Store' \
                      '.ipynb_checkpoints' '*.egg-info')

          echo "📦 Release: tinytorch v${RELEASE_ID} (hash ${RELEASE_HASH:0:12})"

          python3 scripts/version/release.py emit-manifest \
            --output tinytorch/guide/_build/release-manifest.json \
            --project tinytorch \
            --tier A \
            --release-id "$RELEASE_ID" \
            --release-hash "$RELEASE_HASH"

          echo "✅ Manifest written to tinytorch/guide/_build/release-manifest.json"
          cat tinytorch/guide/_build/release-manifest.json

      - name: 🚀 Deploy to GitHub Pages
        env:
          MAIN_SHA: ${{ needs.sync-from-dev.outputs.main_sha }}
        run: |
          set -euo pipefail

          rm -rf gh-pages-repo
          git clone --depth=50 --branch=gh-pages \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            gh-pages-repo

          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BUILD_DIR="${{ github.workspace }}/tinytorch/guide/_build"
          PRESERVED_DOWNLOADS="$(mktemp -d)"

          [ -f "$BUILD_DIR/index.html" ] || {
            echo "❌ CRITICAL: TinyTorch build index.html missing."
            exit 1
          }

          preserve_site_only_download() {
            local filename="$1"
            local source_path="tinytorch/assets/downloads/$filename"
            local dest_path="$PRESERVED_DOWNLOADS/$filename"

            if [ -f "$source_path" ]; then
              cp "$source_path" "$dest_path"
              echo "✅ Preserved existing $filename from gh-pages"
              return 0
            fi

            # A prior clean deploy may already have removed site-only PDFs.
            # Recover the latest historical copy from recent gh-pages history.
            while read -r rev; do
              if git cat-file -e "$rev:$source_path" 2>/dev/null; then
                git show "$rev:$source_path" > "$dest_path"
                echo "✅ Recovered $filename from gh-pages history ($rev)"
                return 0
              fi
            done < <(git rev-list --max-count=50 HEAD -- "$source_path")

            echo "⚠️ No existing $filename found to preserve"
            return 1
          }

          if [ "${{ needs.validate-inputs.outputs.site_only }}" = "true" ]; then
            preserve_site_only_download TinyTorch-Book.pdf || true
            preserve_site_only_download TinyTorch-Paper.pdf || true
          fi

          # Replace only the TinyTorch subtree. The previous peaceiris overlay
          # deploy used keep_files=true, which preserved retired Sphinx pages
          # such as /tinytorch/intro.html beside the Quarto site.
          rm -rf tinytorch
          mkdir -p tinytorch
          cp -a "$BUILD_DIR"/. tinytorch/
          touch .nojekyll

          if [ "${{ needs.validate-inputs.outputs.site_only }}" = "true" ]; then
            mkdir -p tinytorch/assets/downloads
            for filename in TinyTorch-Book.pdf TinyTorch-Paper.pdf; do
              if [ ! -f "tinytorch/assets/downloads/$filename" ] && [ -f "$PRESERVED_DOWNLOADS/$filename" ]; then
                cp "$PRESERVED_DOWNLOADS/$filename" "tinytorch/assets/downloads/$filename"
                echo "✅ Restored $filename for site-only deploy"
              fi
            done
          fi

          if [ -f tinytorch/intro.html ] || [ -d tinytorch/_sources ] || [ -d tinytorch/_static ]; then
            echo "❌ CRITICAL: retired Sphinx TinyTorch artifacts remain after clean deploy staging."
            exit 1
          fi

          git add -A tinytorch .nojekyll

          if [ "${{ needs.validate-inputs.outputs.site_only }}" = "true" ]; then
            COMMIT_MESSAGE="🌐 TinyTorch website update - ${MAIN_SHA}"
          else
            COMMIT_MESSAGE="🔥 Deploy TinyTorch ${{ needs.validate-inputs.outputs.new_version }} - ${MAIN_SHA}"
          fi

          git commit -m "$COMMIT_MESSAGE" --allow-empty || echo "🟡 Nothing to commit"

          PUSHED=false
          for i in 1 2 3; do
            if git push origin gh-pages 2>/dev/null; then
              echo "✅ Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "⚠️ Push failed (attempt $i/3), pulling with rebase..."
            git pull --rebase origin gh-pages || true
          done
          if [ "$PUSHED" != "true" ]; then
            echo "❌ Push failed after 3 attempts."
            exit 1
          fi

  create-tag:
    name: '🏷️ Create Tag & Release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-inputs, sync-from-dev, build-and-deploy]
    if: needs.build-and-deploy.result == 'success' && needs.validate-inputs.outputs.site_only != 'true'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout the deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync-from-dev.outputs.main_sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create and push tag
        env:
          DESCRIPTION: ${{ inputs.description }}
          TAG: ${{ needs.validate-inputs.outputs.new_version }}
          MAIN_SHA: ${{ needs.sync-from-dev.outputs.main_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Published tags are immutable. Tag exactly the commit that was
          # merged, built, and deployed; never whatever main is now.
          git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING=$(git rev-parse "$TAG^{commit}")
            if [ "$EXISTING" = "$MAIN_SHA" ]; then
              echo "✅ $TAG already points at $MAIN_SHA (re-run); nothing to do."
              exit 0
            fi
            echo "::error::$TAG already exists at $EXISTING, not $MAIN_SHA. Refusing to move a published tag."
            exit 1
          fi

          echo "🏷️ Creating tag: $TAG on commit $MAIN_SHA"
          git tag -a "$TAG" "$MAIN_SHA" -m "TinyTorch $TAG: ${DESCRIPTION}"
          git push origin "refs/tags/$TAG"

          echo "✅ Tag $TAG created and pushed"

      - name: 📦 Create GitHub Release (Draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          TAG="${{ needs.validate-inputs.outputs.new_version }}"
          PREV_TAG="${{ needs.validate-inputs.outputs.previous_version }}"
          VERSION_NUM=${TAG#tinytorch-v}

          # Idempotent on "Re-run failed jobs": don't create a second draft.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "✅ Release for $TAG already exists; nothing to do."
            exit 0
          fi

          echo "📦 Creating GitHub Release for $TAG..."

          # Generate auto release notes from GitHub (includes contributors automatically)
          AUTO_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" \
            -f previous_tag_name="$PREV_TAG" \
            --jq '.body')

          # Build release notes with custom header + auto-generated content
          cat > /tmp/release-notes.md << NOTES_EOF
          ## TinyTorch v${VERSION_NUM}

          ${DESCRIPTION}

          ${AUTO_NOTES}

          ---

          **Website**: https://mlsysbook.ai/tinytorch/
          NOTES_EOF

          # Create the release as draft
          gh release create "$TAG" \
            --title "TinyTorch v${VERSION_NUM} - ${DESCRIPTION}" \
            --notes-file /tmp/release-notes.md \
            --draft

          echo "✅ Draft release created"
          echo "📝 Review and publish at: https://github.com/${{ github.repository }}/releases"

  summary:
    name: '📋 Publication Summary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guard, validate-inputs, preflight, update-version, sync-from-dev, build-pdfs, build-and-deploy, create-tag]
    if: always()
    permissions: {}

    steps:
      - name: 🧮 Verdict
        env:
          SITE_ONLY: ${{ needs.validate-inputs.outputs.site_only }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          MAIN_SHA: ${{ needs.sync-from-dev.outputs.main_sha }}
          R_GUARD: ${{ needs.guard.result }}
          R_INPUTS: ${{ needs.validate-inputs.result }}
          R_PRE: ${{ needs.preflight.result }}
          R_BUMP: ${{ needs.update-version.result }}
          R_SYNC: ${{ needs.sync-from-dev.result }}
          R_PDF: ${{ needs.build-pdfs.result }}
          R_DEPLOY: ${{ needs.build-and-deploy.result }}
          R_TAG: ${{ needs.create-tag.result }}
        run: |
          OK=true
          [ "$R_DEPLOY" = "success" ] || OK=false
          if [ "$SITE_ONLY" != "true" ] && [ "$R_TAG" != "success" ]; then OK=false; fi
          if [ "$OK" = "true" ]; then
            echo "✅ Publish complete (source ${SOURCE_SHA:0:10} → main ${MAIN_SHA:0:10})"
            exit 0
          fi
          {
            echo "## ❌ TinyTorch publish INCOMPLETE"
            echo ""
            echo "| guard | inputs | preflight | bump (dev) | sync (main) | PDFs | deploy (gh-pages) | tag + release |"
            echo "|---|---|---|---|---|---|---|---|"
            echo "| $R_GUARD | $R_INPUTS | $R_PRE | $R_BUMP | $R_SYNC | $R_PDF | $R_DEPLOY | $R_TAG |"
            echo ""
            echo "**Pinned source:** \`${SOURCE_SHA:-none}\` · **main:** \`${MAIN_SHA:-not merged}\`"
            echo ""
            echo "Mutations already made: dev bump=\`$R_BUMP\`, main merge=\`$R_SYNC\`, gh-pages=\`$R_DEPLOY\`, tag=\`$R_TAG\`."
            echo "Recover with **Re-run failed jobs** (keeps the pinned SHA and version). A fresh dispatch pins and re-tests a new SHA."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::TinyTorch publish incomplete (deploy=$R_DEPLOY, tag=$R_TAG)."
          exit 1

      - name: 📋 Summary
        env:
          DESCRIPTION: ${{ inputs.description }}
        run: |
          SITE_ONLY="${{ needs.validate-inputs.outputs.site_only }}"

          if [ "$SITE_ONLY" = "true" ]; then
            echo "## 🌐 TinyTorch Website Deploy Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Mode:** Website-only (no version bump)" >> $GITHUB_STEP_SUMMARY
            echo "**Description:** ${DESCRIPTION}" >> $GITHUB_STEP_SUMMARY
            echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🌐 Access:" >> $GITHUB_STEP_SUMMARY
            echo "- 📖 [TinyTorch Website](https://mlsysbook.ai/tinytorch/)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🔥 TinyTorch Publication Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** ${{ needs.validate-inputs.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Previous:** ${{ needs.validate-inputs.outputs.previous_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Release Type:** ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
            echo "**Description:** ${DESCRIPTION}" >> $GITHUB_STEP_SUMMARY
            echo "**Published by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🌐 Access:" >> $GITHUB_STEP_SUMMARY
            echo "- 📖 [TinyTorch Website](https://mlsysbook.ai/tinytorch/)" >> $GITHUB_STEP_SUMMARY
            echo "- 🏷️ [Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-inputs.outputs.new_version }})" >> $GITHUB_STEP_SUMMARY
          fi

  fail-validation:
    name: '❌ Validation Failed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.confirm != 'PUBLISH'
    permissions: {}

    steps:
      - name: ❌ Invalid confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          echo "## ❌ Publication Cancelled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** You must type exactly 'PUBLISH' to confirm" >> $GITHUB_STEP_SUMMARY
          echo "**Received:** ${CONFIRM_INPUT}" >> $GITHUB_STEP_SUMMARY
          exit 1
