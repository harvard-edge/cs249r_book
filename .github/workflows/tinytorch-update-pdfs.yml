name: '🔥 TinyTorch · 📑 Update PDFs'

# =============================================================================
# TinyTorch — PDF-Only Update (No Site Rebuild)
# =============================================================================
#
# Rebuilds and deploys TinyTorch PDFs directly to gh-pages without touching
# the website, version numbers, or release tags. Use when only the paper
# or guide PDF content has changed.
#
# Flow:
#   1. BUILD_PAPER  — Compile research paper with LuaLaTeX
#   2. BUILD_GUIDE  — Compile course guide with XeLaTeX
#   3. DEPLOY_PDFS  — Copy PDFs into gh-pages/tinytorch/_static/downloads/
#   4. SUMMARY      — Build status report
#
# Triggers:
#   - workflow_dispatch: manual (select which PDFs to rebuild)
#
# Deploys to: mlsysbook.ai/tinytorch/_static/downloads/
# Secrets:    GITHUB_TOKEN
#
# Related:
#   - tinytorch-build-pdfs.yml   — Reusable PDF build (used by preview/publish)
#   - tinytorch-publish-live.yml — Full site + PDF deploy with versioning
#
# =============================================================================

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      update_book:
        description: 'Update Textbook PDF'
        type: boolean
        default: true
      update_guide:
        description: 'Update Lab Guide PDF'
        type: boolean
        default: true
      update_paper:
        description: 'Update Research Paper PDF'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-paper:
    name: '📑 Build Research Paper'
    runs-on: ubuntu-latest
    if: inputs.update_paper
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 📑 Compile Paper with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.tex
          working_directory: tinytorch/paper
          latexmk_use_lualatex: true

      - name: 📤 Upload PDF Paper
        uses: actions/upload-artifact@v7
        with:
          name: TinyTorch-Paper
          path: tinytorch/paper/paper.pdf
          retention-days: 7

  build-book:
    name: '📘 Build Textbook'
    runs-on: ubuntu-latest
    if: inputs.update_book
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 📝 Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 📚 Setup TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: 🟢 Setup Node.js (for Mermaid)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: 📦 Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: 📦 Install build dependencies (apt + TeX)
        working-directory: tinytorch/book
        run: make install-deps

      - name: 📘 Render Textbook PDF (Quarto + LuaLaTeX)
        # `make pdf` converts the book's SVG diagrams to PDF, then renders.
        working-directory: tinytorch/book
        run: |
          make pdf
          if [ ! -f _build/TinyTorch-Book.pdf ]; then
            echo "::error::PDF missing — _build/TinyTorch-Book.pdf was not produced"
            exit 1
          fi
          echo "PDF produced at _build/TinyTorch-Book.pdf ($(du -h _build/TinyTorch-Book.pdf | cut -f1))"

      - name: 📤 Upload PDF Book
        uses: actions/upload-artifact@v7
        with:
          name: TinyTorch-Book
          path: tinytorch/book/_build/TinyTorch-Book.pdf
          retention-days: 7

  deploy-pdfs:
    name: '🚀 Deploy PDFs to gh-pages'
    runs-on: ubuntu-latest
    needs: [build-paper, build-book]
    if: always() && (needs.build-paper.result == 'success' || needs.build-book.result == 'success')
    steps:
      - name: 📥 Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: 📥 Download Paper PDF
        if: needs.build-paper.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: TinyTorch-Paper
          path: ./artifacts/paper

      - name: 📥 Download Book PDF
        if: needs.build-book.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: TinyTorch-Book
          path: ./artifacts/book

      - name: 📁 Update PDFs in gh-pages
        # The Quarto site serves static assets out of `assets/downloads/`
        # (legacy Sphinx used `_static/downloads/`). Writing to both
        # paths during the transition would confuse deploys — we
        # commit only to the canonical Quarto path.
        run: |
          cd gh-pages
          mkdir -p tinytorch/assets/downloads

          if [ -f ../artifacts/paper/paper.pdf ]; then
            cp ../artifacts/paper/paper.pdf tinytorch/assets/downloads/TinyTorch-Paper.pdf
            echo "✅ Updated TinyTorch-Paper.pdf"
          fi

          if [ -f ../artifacts/book/TinyTorch-Book.pdf ]; then
            cp ../artifacts/book/TinyTorch-Book.pdf tinytorch/assets/downloads/TinyTorch-Book.pdf
            echo "✅ Updated TinyTorch-Book.pdf"
          fi

          echo ""
          echo "📦 Downloads folder:"
          ls -la tinytorch/assets/downloads/

      - name: 🚀 Push to gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tinytorch/assets/downloads/
          git commit -m "📄 Update TinyTorch PDFs" || echo "No changes to commit"
          git push origin gh-pages

  summary:
    name: '📊 Summary'
    runs-on: ubuntu-latest
    needs: [build-paper, build-book, deploy-pdfs]
    if: always()
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 📄 TinyTorch PDF Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| PDF | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📘 Textbook | ${{ needs.build-book.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📑 Research Paper | ${{ needs.build-paper.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deploy | ${{ needs.deploy-pdfs.result }} |" >> $GITHUB_STEP_SUMMARY
