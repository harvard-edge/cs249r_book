# Provenance and review queue for the ML Systems Taxonomy tags in staffml/vault/questions/.
schema_version: 1
taxonomy:
  name: ML Systems Taxonomy
  version: 0.2-draft
  source: shared/concepts/ml-systems-framework.yml, shared/concepts/ml-systems-field.yml
  explorer: https://mlsysbook.ai/explore/
method: Each question's title, scenario, question, and model answer, with the taxonomy and its tagging_rules, were given to one model tagger, which chose one subject
  and up to three concepts. The 748 questions first left without a concept were retagged after the eight concepts their proposals pointed to were added. Tags cite
  identities; vault check --strict verifies them.
primary_tagger: gpt-6.1-sol via Codex CLI
second_tagger: claude-opus-5-5 as an isolated subagent
agreement: 'Recorded and recomputed in shared/concepts/agreement/ by ./binder/binder concepts agreement (sample a: rules revised on it; sample b: held out).'
subject_only_questions: 449
