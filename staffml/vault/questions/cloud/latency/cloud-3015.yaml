title: 'Latency Decomposition: Compare KV-Cache vs. No-Cache Decode Latency on H100'
scenario: A serving team debates whether to enable KV-cache for a 7B-parameter model on H100. With KV-cache, each decode step streams the weights from HBM and reads the cached K/V state. Without KV-cache, the full prefix is recomputed.
question: At sequence length 1024, how does per-token decode latency compare with and without a KV cache for the 7B model?
details:
  realistic_solution: |
    With KV-cache, each batch-1 decode step still streams all 14GB of FP16 weights from HBM ("resident" means resident in HBM, not on-chip) and adds a read of the cached K/V state, about 512MiB for a 1024-token prefix. That gives a bandwidth floor of about (14GB + 0.54GB) / 3.35TB/s = 4.3ms per token; the KV read alone is only about 0.16ms of it. Without KV cache, generating the next token requires recomputing the full 1024-token prefix through the model; the ideal compute lower bound is about 14-15ms, and about 48ms at a realistic 30% utilization. KV-cache is therefore the correct decode path, roughly 3-11x faster per token at this length, and the gap widens as the prefix grows.
  common_mistake: |
    **The Pitfall:** Forgetting that without KV-cache, attention cost scales quadratically.
    **The Rationale:** Candidates fail to internalize the asymptotic complexity of self-attention during generation.
    **The Consequence:** They erroneously conclude that recomputation is cheaper than memory bandwidth at sequence length 1024, ignoring the massive FLOP explosion.
  napkin_math: |
    **Assumptions & Constraints:**
    - 7B params (14 GB at FP16).
    - H100: 3.35 TB/s bandwidth, 989 TFLOPS.
    - Sequence: 1024 tokens. Approximate 7B layout: 32 layers, 4096 hidden dim, FP16 KV.
    - Weights are resident in HBM, not on-chip, so each batch-1 decode step streams all 14 GB of them; the KV read is counted on top.

    **Calculations:**
    - KV cache read for existing tokens: 32 layers × 1024 tokens × 2 (K,V) × 4096 dim × 2 bytes = 536,870,912 bytes = 512 MiB.
    - KV read time alone: 0.54 GB / 3.35 TB/s = ~0.16 ms/token, a small increment on top of the weight stream.
    - With-cache batch-1 floor: (14 GB weights + ~0.54 GB KV) / 3.35 TB/s = ~4.3 ms/token.
    - Without cache lower bound: recompute the 1024-token prefix through the 7B model, roughly 2 × 7B × 1024 = 14.3 TFLOPs.
    - Ideal compute-only time = 14.3 TFLOPs / 989 TFLOPS = ~14.5 ms; at 30% effective utilization this is ~48 ms before extra memory traffic.

    **Conclusion & Interpretation:**
    - **Result: KV-cache decode is about 4.3 ms/token at batch 1 (set by the 14 GB weight stream, with the KV read adding only ~0.16 ms), while no-cache decode is at least ~14.5 ms/token and often ~48 ms in practice.** KV cache wins by roughly 3-11x at this length by avoiding full-prefix recomputation, and the gap grows with the prefix.
