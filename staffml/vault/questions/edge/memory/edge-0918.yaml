title: Edge LLM Decode Bandwidth Ceiling
scenario: You are deploying a 2B parameter LLM (INT4, 1GB weights) on an edge device with a 50 TOPS NPU and 25 GB/s memory bandwidth. During the prefill phase (prompt length 1024), you achieve 200 tokens/s. During decoding, token generation drops abruptly to 22 tokens/s. The KV cache size averages 128MB during decoding.
question: Why is decode bandwidth-bound despite 50 TOPS, and what single optimization best improves throughput?
details:
  realistic_solution: Batch-1 decode has an arithmetic intensity of only a few operations per byte, so the 50 TOPS peak is not the limit, and every generated token must stream all 1 GB of weights plus the 128 MB KV cache from DRAM. That is 1.128 GB per token, and 25 GB/s / 1.128 GB = 22.2 tokens/s, which matches the measured rate. Because the weights are 89% of the traffic, the single best optimization reduces weight bytes per generated token, most effectively speculative decoding (one weight pass verifies several draft tokens) or lower-bit weights; GQA/MQA only shrinks the 11% KV share and caps out near 25 tokens/s.
  common_mistake: |
    **The Pitfall:** Assuming the NPU compute units are underutilized due to software bugs or overheating.
    **The Rationale:** Candidates try to optimize matrix multiplication kernels, missing the fundamental difference in arithmetic intensity between prefill (compute-bound) and decode (memory-bound).
    **The Consequence:** Time is wasted on compute optimizations that yield zero improvement since the system is strictly starved for memory bandwidth.
  napkin_math: |
    **Assumptions & Constraints:**
    - Model: 1 GB weights (INT4), resident in DRAM (not on-chip), so batch-1 decode streams all of them once per generated token.
    - KV Cache: 128 MB (0.128 GB), read once per generated token.
    - Memory Bandwidth: 25 GB/s.

    **Calculations:**
    - Bytes per generated token = 1 GB weights + 0.128 GB KV = 1.128 GB.
    - Bandwidth-bound decode rate = 25 GB/s / 1.128 GB = 22.2 tokens/s, which matches the measured 22 tokens/s.
    - Weights are 1 / 1.128 = 89% of those bytes; the KV cache is 11%.
    - GQA/MQA only shrinks the KV term: even removing the KV cache entirely gives 25 GB/s / 1 GB = 25 tokens/s (+13%).
    - Speculative decoding amortizes the weight pass: if each 1.128 GB target pass accepts ~2.5 tokens, throughput is about 22.2 * 2.5 = 55 tokens/s before draft-model overhead.

    **Conclusion & Interpretation:**
    - **Result: decode is memory-bandwidth bound, and the weight stream (89% of bytes) sets the ceiling.** The best single optimization cuts weight bytes per generated token, through speculative decoding (one weight pass verifies several tokens) or lower-bit weights. GQA/MQA helps only the 11% KV share, so it is worth at most ~13% here; it becomes the main lever at long contexts, where the KV cache rivals the weights.
