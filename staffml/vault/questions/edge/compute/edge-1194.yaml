title: Analyze Prefill vs Decode Cost Split on Jetson Orin
scenario: A Jetson Orin NX runs a 7B parameter language model in INT4 (3.5GB model size). A typical request has 512 prompt tokens (prefill) and generates 128 output tokens (decode). Assume 100 TOPS peak compute, 64 GB/s memory bandwidth, 32 layers, hidden size 4096, and INT8 KV cache.
question: How do prefill and decode times split for a 7B INT4 model on Orin NX with a 512-token prompt and 128-token response, and why?
details:
  realistic_solution: Prefill has high arithmetic intensity because the 512 prompt tokens share each weight read, so its 71.7 ms compute bound exceeds the 55 ms needed to read the 3.5 GB of weights once, and prefill takes about 72 ms. Decode is sequential at batch 1, so every generated token streams all 3.5 GB of weights from DRAM ("resident" means resident in DRAM, not on-chip) plus its KV-cache reads and writes. For 128 tokens that is 448 GB of weights (7.0 s at 64 GB/s) plus about 19.3 GB of INT8 KV traffic (0.3 s), so decode takes about 7.3 s and is about 99% of the request, with the weights making up 96% of decode traffic.
  common_mistake: |
    **The Pitfall:** Treating prefill and decode as having the same per-token cost.
    **The Rationale:** Candidates fail to realize prefill processes all tokens in parallel while decode is sequential.
    **The Consequence:** Incorrectly assessing the pipeline bottleneck and failing to apply KV caching or speculative decoding optimizations.
  napkin_math: |
    **Assumptions & Constraints:**
    - Model: 7B params (INT4 = 3.5GB), resident in DRAM (not on-chip).
    - Orin NX: 100 TOPS; 64 GB/s effective memory bandwidth (the module's peak is 102.4 GB/s).
    - Request: 512 prefill, 128 decode.
    - KV shape: 32 layers, hidden=4096, INT8 KV.
    - Decode assumption: at batch 1, each generated token streams all 3.5 GB of weights once, plus its KV reads and writes.

    **Calculations:**
    - Prefill compute lower bound: (2 * 7B * 512) / 100 TOPS = 71.7 ms.
    - Prefill weight read: 3.5 GB / 64 GB/s = 54.7 ms, so prefill is compute-bound at about 72 ms.
    - Decode compute lower bound: 128 * (2 * 7B) / 100 TOPS = 17.9 ms.
    - Decode weight traffic: 128 * 3.5 GB = 448 GB, and 448 GB / 64 GB/s = 7.0 s.
    - INT8 KV bytes per token in cache: 2 * 32 * 4096 * 1 byte = 262,144 bytes.
    - Average decode context read: (512 + 639) / 2 = 575.5 tokens.
    - KV traffic per decode token: 262,144 * (575.5 reads + 1 write) = 151 MB.
    - Total KV traffic: 151 MB * 128 = 19.3 GB.
    - KV bandwidth time: 19.3 GB / 64 GB/s = 302 ms.
    - Total decode estimate: 7.0 s + 0.3 s ≈ 7.3 s (the 17.9 ms of compute overlaps with the memory traffic).

    **Conclusion & Interpretation:**
    - **Result: prefill is about 72 ms and decode is about 7.3 s, so decode is about 99% of the request.** Decode is bound by streaming the 3.5 GB of weights once per generated token (96% of decode bytes); KV traffic is only about 4% at this context length. The levers are speculative decoding, lower-bit weights, or batching, not KV compression.
