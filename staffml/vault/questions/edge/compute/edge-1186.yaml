title: Phi-3-Mini INT8 vs INT4 Decode SLO on Jetson Orin
scenario: You are sizing the memory footprint and decode latency for Phi-3-Mini (3.8B params) on an edge device with 102.4GB/s bandwidth. Assume 32 transformer layers, 2048 hidden dim, 32 attention heads, seq=512, batch=1.
question: Is the 2-second P99 SLO met for 100 output tokens using either INT8 or INT4 quantization?
details:
  realistic_solution: At batch 1, every decode step streams all of the weights from DRAM once ("resident" means resident in DRAM, not on-chip), plus the KV-cache reads and writes. For 100 tokens from a 512-token context, an INT8 KV cache adds about 7.37 GB of traffic, while the weights add 380 GB at INT8 or 190 GB at INT4. At 102.4 GB/s, INT8 takes about 3.78 s and misses the 2-second P99 SLO, while INT4 takes about 1.93 s and meets it only at peak bandwidth (about 2.4 s at 80% of peak), so INT4 is necessary but still needs headroom.
  common_mistake: |
    **The Pitfall:** Counting only the KV-cache traffic because the weights are "resident".
    **The Rationale:** Resident means resident in DRAM, not on-chip, so at batch 1 every decode step still streams all 3.8 GB (INT8) or 1.9 GB (INT4) of weights, about 25-50x the 74 MB of KV traffic per token at this context.
    **The Consequence:** Concluding that INT8 meets a 2-second SLO that it misses by almost 2x.
  napkin_math: |
    **Assumptions & Constraints:**
    - Model: Phi-3-Mini (3.8B params): INT8 weights = 3.8 GB, INT4 weights = 1.9 GB.
    - Hardware bandwidth: 102.4 GB/s.
    - Architecture: 32 layers, 2048 hidden dim, 32 heads, seq=512, batch=1.
    - Decode assumption: weights are resident in DRAM, not on-chip, so at batch 1 every decode step streams all weights once, plus the KV read/write traffic.
    - KV precision: INT8 KV cache = 1 byte per K or V element.

    **Calculations:**
    - Per-token K+V entry size at INT8 = 2 * 32 layers * 2048 hidden * 1 byte = 131,072 bytes.
    - Starting KV cache footprint at seq=512 = 131,072 * 512 = 67.1 MB.
    - For 100 generated tokens, average context read is about (512 + 611) / 2 = 561.5 tokens.
    - KV traffic per generated token = 131,072 * (561.5 reads + 1 write) = 73.7 MB.
    - Total KV traffic for 100 tokens = 73.7 MB * 100 = 7.37 GB.
    - Weight traffic for 100 tokens: INT8 = 100 * 3.8 GB = 380 GB; INT4 = 100 * 1.9 GB = 190 GB.
    - INT8 decode time = (380 GB + 7.37 GB) / 102.4 GB/s = 3.78 s.
    - INT4 decode time = (190 GB + 7.37 GB) / 102.4 GB/s = 1.93 s.

    **Conclusion & Interpretation:**
    - **Result: INT8 misses the 2-second P99 SLO (3.78 s); INT4 meets it only at peak bandwidth (1.93 s).** Weight streaming is 96-98% of decode traffic at this context length, so weight precision, not the KV cache, decides the SLO. At a more typical 80% of peak bandwidth INT4 takes about 2.4 s, so it needs extra headroom (shorter outputs, speculative decoding) to hold the P99.
