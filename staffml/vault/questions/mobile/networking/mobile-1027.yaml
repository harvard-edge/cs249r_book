title: 'Network Bandwidth Bottlenecks: Fluency — LPDDR5 BW and TPOT Math in 30 Seconds'
scenario: 'Without reference, in 30 seconds: A 1B INT8 model (1GB) runs on A17 Pro (51.2 GB/s LPDDR5).'
question: What is the TPOT and what fraction of the memory bus does it saturate during decode?
details:
  realistic_solution: 'TPOT: 1GB / 51.2 GB/s = 19.5ms/token. BW saturation: during decode, reads 1GB per 19.5ms = 51.2 GB/s = 100% of memory bandwidth. The memory bus is saturated during active decode. Between tokens: 0% saturation.'
  common_mistake: |
    **The Pitfall:** Dividing model size by total device RAM instead of memory bandwidth.
    **The Rationale:** Candidates often confuse GB of storage capacity with GB/s of memory bandwidth.
    **The Consequence:** The resulting time-per-output-token (TPOT) calculation is fundamentally meaningless.
  napkin_math: |
    **Assumptions & Constraints:**

    **Calculations:**
    1. **TPOT Calculation:** 1 GB / 51.2 GB/s = 0.0195 seconds = **19.5 ms/token**.
    2. **Bandwidth Saturation:** During decode, reading 1GB in 19.5ms requires 51.2 GB/s.

    **Conclusion & Interpretation:**
    3. **Utilization:** 51.2 GB/s / 51.2 GB/s = **100% saturation** of the memory bus during active decode.
