title: Core ML Palettization vs GGUF Quantization for LLM on iPhone
scenario: A team compares Apple Core ML palettization (4-bit lookup table per weight block) vs GGUF Q4_K_M (4-bit mixed quantization) for deploying Llama-3-8B on iPhone 15 Pro. Core ML achieves 9 tok/s with a 4.5GB model; GGUF achieves 11 tok/s with a 4.3GB model.
question: Why does GGUF Q4_K_M reach 11 tok/s while Core ML palettization reaches 9 tok/s for Llama-3-8B on iPhone 15 Pro?
details:
  realistic_solution: |
    Core ML palettization stores weights as 4-bit indices into a lookup table executed by the Neural Engine. It suffers from lookup table dereference overhead and graph compilation constraints. GGUF Q4_K_M uses mixed-precision (K-quant) running on the CPU with BLAS and Metal GPU fallback. The CPU+GPU combo effectively utilizes memory bandwidth for token generation.
  common_mistake: |
    **The Pitfall:** Assuming fewer bits directly yields faster inference.
    **The Rationale:** Candidates ignore the runtime engine, operator fusion, and hardware unit utilization, assuming quantization format is the sole determinant of speed.
    **The Consequence:** They misattribute the performance gap to the model size rather than execution overhead.
  napkin_math: |
    **Assumptions & Constraints:**
    - Memory Bandwidth (BW) limit: 51.2 GB/s (A17 Pro LPDDR5).
    - GGUF size: 4.3GB; Core ML size: 4.5GB.

    **Calculations:**
    - GGUF time per token limit = 4.3GB / 51.2 GB/s = ~84 ms/token, so max speed = 1000 ms / 84 ms = 11.9 tok/s.
    - Core ML time per token limit = 4.5GB / 51.2 GB/s = ~88 ms/token, so max speed = 1000 ms / 88 ms = 11.4 tok/s.
    - GGUF utilization = 11 / 11.9 = 92%.
    - Core ML utilization = 9 / 11.4 = 79%.

    **Conclusion & Interpretation:**
    - **Result: ~11.9 tok/s limit for GGUF (Memory-Bandwidth-Bound)**. Both runtimes sit near the bandwidth roof; Core ML's lookup-table and ANE scheduling overhead costs about 13 points of bandwidth utilization, on top of reading 5% more bytes per token.
