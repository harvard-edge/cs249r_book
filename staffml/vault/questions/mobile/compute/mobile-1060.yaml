title: 'Mobile Transformer Cost Recall: Mobile LLM Memory Bandwidth Facts'
scenario: Mobile LLM decode throughput at batch=1 is heavily memory-bandwidth bound. A 3B parameter model quantized to INT4 needs to be evaluated across A17 Pro, Snapdragon 8 Gen 3, and Tensor G3 SoCs.
question: What is the memory bandwidth for these SoCs, and what is the decode tokens/second for a 3B INT4 model on each?
details:
  realistic_solution: 'A17 Pro: 51.2GB/s (LPDDR5). Snap 8G3: 77GB/s. Tensor G3: 60GB/s. LLM decode at batch=1 is memory-bandwidth-bound: each decode step loads all model weights (INT4: 0.5 bytes/param) from DRAM. Formula: tok/s = bandwidth_GB/s / model_size_GB = bandwidth / (params * 0.5 / 1e9). 3B INT4 = 1.5GB. A17: 51.2/1.5=34.1 tok/s. Snap: 77/1.5=51.3 tok/s. Tensor G3: 60/1.5=40.0 tok/s. Ranking: Snap 8G3 (51.3) > Tensor G3 (40.0) > A17 Pro (34.1). The ranking follows bandwidth, not TOPS (35 vs 45 vs 7.5): Tensor G3 has by far the lowest TOPS yet decodes faster than the A17 Pro. TOPS only matters for compute-bound operations (prefill at large batch).'
  common_mistake: |
    **The Pitfall:** Using TOPS to estimate LLM decode latency.
    **The Rationale:** Memorizing peak compute specs instead of recognizing that autoregressive decode at batch=1 is purely memory-bandwidth bound.
    **The Consequence:** Incorrectly ranking chips for LLM performance and vastly overestimating token generation speed.
  napkin_math: |
    **Assumptions & Constraints:**
    - Bandwidth: A17 Pro (51.2 GB/s), Snap 8G3 (77 GB/s), Tensor G3 (60 GB/s).
    - Model size (3B INT4): 1.5 GB.

    **Calculations:**
    - Formula: Decode tok/s = Bandwidth / Model_size.
    - A17 Pro: 51.2 / 1.5 = 34.1 tok/s.
    - Snap 8G3: 77 / 1.5 = 51.3 tok/s.
    - Tensor G3: 60 / 1.5 = 40.0 tok/s.

    **Conclusion & Interpretation:**
    - **Result: 51.3 tok/s for Snap 8G3, 40.0 for Tensor G3, 34.1 for A17 Pro (Memory-Bandwidth Bound)**. Autoregressive decode is memory-bandwidth bound, so Tensor G3 beats the A17 Pro despite roughly 5x lower TOPS.
