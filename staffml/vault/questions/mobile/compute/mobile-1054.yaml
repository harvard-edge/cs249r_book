title: 'Mobile Transformer Cost Implement: Calculate Token Budget for Mobile LLM'
scenario: Implement the maximum context length calculation for Phi-3-Mini-3.8B (INT4, 32 layers, 32 heads, head_dim=64) on Snapdragon 8 Gen 3 (45 TOPS, 16GB, 77GB/s) that meets a target of P99 < 2s for 100 output tokens, leaving 4GB RAM for OS.
question: How would you calculate model memory, KV cache per token, max context tokens given RAM constraints, and verify the throughput SLO?
details:
  realistic_solution: 'Memory budget allows about 39K context tokens: 3.8B INT4 weights are ~1.9GB, leaving 10.1GB for KV after reserving 4GB for the OS, and the FP16 KV cache is 256KB/token. The throughput SLO is stricter: 100 output tokens in 2s requires TPOT <=20ms, which at 77GB/s is a budget of 1.54GB read per token. At batch 1 every decode step streams all 1.9GB of weights (resident in DRAM, not on-chip) plus the active KV cache, so the weights alone take 24.7ms per token and no context length meets the SLO; a 4K context takes about 38.6ms and the memory-fit context about 156ms. Capping the context is therefore not enough: the implementation needs fewer weight bytes per generated token, for example speculative decoding (about 15ms effective TPOT at 4K if ~2.5 tokens are accepted per target pass) or a smaller or lower-bit model.'
  common_mistake: |
    **The Pitfall:** Incorrectly calculating KV cache size and ignoring the bandwidth-limited throughput SLO.
    **The Rationale:** Candidates often use `hidden_dim` instead of calculating `num_heads * head_dim * 2 * num_layers`, and they assume fitting in memory guarantees meeting the speed target.
    **The Consequence:** Off-by-32x errors in cache sizing, and deploying a model that fits in RAM but catastrophically fails the latency requirements.
  napkin_math: |
    **Assumptions & Constraints:**
    - Model Memory: 3.8B INT4 = ~1.9 GB resident in memory.
    - Available RAM: 16 GB - 4 GB (OS) - 1.9 GB (model) = 10.1 GB.
    - KV per cached context token: 2 (K+V) * 32 layers * 32 heads * 64 dim * 2 bytes = 262,144 bytes = 256 KiB.
    - Decode bandwidth model: weights are resident in DRAM, not on-chip, so at batch 1 each generated token streams all 1.9 GB of weights plus the active KV cache once.
    - SLO Target: 2s / 100 tokens = 20 ms TPOT.

    **Calculations:**
    - Memory-fit context: 10.1 GB / 256 KiB = ~39K tokens.
    - Per-token byte budget at 20 ms: 77 GB/s * 0.020 s = 1.54 GB/token.
    - Weights alone: 1.9 GB / 77 GB/s = 24.7 ms/token, already over the 20 ms TPOT.
    - KV traffic at 4K context: 4096 * 256 KiB = 1.0 GiB/token (1.07 GB).
    - TPOT at 4K: (1.9 GB + 1.07 GB) / 77 GB/s ≈ 38.6 ms.
    - KV traffic at memory-fit context: ~10.1 GB/token.
    - TPOT at memory-fit context: (1.9 GB + 10.1 GB) / 77 GB/s ≈ 156 ms/token.
    - Speculative decoding at 4K with ~2.5 accepted tokens per target pass: 38.6 ms / 2.5 ≈ 15.4 ms effective TPOT, before draft-model overhead.

    **Conclusion & Interpretation:**
    - **Result: ~39K tokens fit in RAM, but no context length meets the 20 ms TPOT SLO.** The 1.9 GB weight stream alone takes 24.7 ms per token, so capping the active context cannot fix it. The design needs fewer weight bytes per generated token (speculative decoding, or a smaller or lower-bit model), plus a capped active window so that KV traffic stays small.
