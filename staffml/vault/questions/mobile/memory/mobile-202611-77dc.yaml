title: Sizing a Phone for Qwen3-30B-A3B by Active Parameters
scenario: A team wants to run Qwen3-30B-A3B (30.5B total parameters, 3.3B activated per token, 128 experts with 8 routed per token) on a flagship phone with 16 GB of LPDDR5X at 76.8 GB/s. They quantize all weights to 4-bit and argue that, since only 3.3B parameters are active, the model costs the same as a 3B dense model.
question: What decode throughput does the active-parameter count bound, and why does the phone still fail to run the model?
details:
  realistic_solution: |
    Active parameters set the per-token bandwidth cost: at 4-bit each decoded token reads about 1.65 GB of weights, which bounds decode near 46 tokens/s on 76.8 GB/s. Memory capacity, though, is set by total parameters. The router picks different experts per token and per layer, so every expert must stay reachable at DRAM speed: about 15.3 GB of 4-bit weights, more than one app can hold on a 16 GB phone once the OS and resident apps take their share. The model is capacity-bound, not bandwidth-bound; the options are a smaller MoE, lower-bit experts, or offloading experts to flash behind a cache, which trades capacity for flash bandwidth.
  common_mistake: |
    **The Pitfall:** Sizing the device's memory by the 3.3B active parameters, as if the model were a 3B dense network.
    **The Rationale:** Routing selects a different subset of experts for every token and layer, so the full 30.5B parameters must be resident even though each token reads only 3.3B of them.
    **The Consequence:** The app exceeds its memory budget and is killed, or falls back to paging experts from flash and decodes an order of magnitude slower than the bandwidth estimate.
  napkin_math: |
    **Assumptions & Constraints:**
    - Qwen3-30B-A3B: 30.5B total and 3.3B activated parameters (model card).
    - 4-bit weights: 0.5 bytes per parameter, ignoring quantization scales.
    - LPDDR5X-9600 on a 64-bit bus: 76.8 GB/s; batch 1 decode streams the active weights once per token.

    **Calculations:**
    - Weights read per token: 3.3e9 * 0.5 B = 1.65 GB.
    - Decode bound: 76.8 GB/s / 1.65 GB = 46.5 tokens/s.
    - Resident weights: 30.5e9 * 0.5 B = 15.25 GB, against 16 GB of total RAM shared with the OS.
    - A 3B dense model at 4-bit, for comparison: 1.5 GB resident and 1.5 GB read per token.

    **Conclusion & Interpretation:**
    - **Result: Capacity-bound.** Bandwidth follows active parameters (about 46 tokens/s at best), but capacity follows total parameters (about 15.3 GB), which a 16 GB phone cannot give one app.
