<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280" role="img" aria-label="A curve of accuracy against cost. Accuracy rises steeply while cost is low, then flattens. The knee, where it stops rising, is marked as the operating point; the flat region to its right is labeled diminishing returns.">
  <style>
    .ax{stroke:currentColor;stroke-width:1.2;opacity:0.6;fill:none}
    .curve{stroke:currentColor;stroke-width:2.2;fill:none;opacity:0.9}
    .tick{stroke:currentColor;stroke-width:1;stroke-dasharray:3 3;opacity:0.45}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px;opacity:0.75}
    .note{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px}
    .faint{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:10.5px;opacity:0.6}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
    .pt{fill:currentColor}
  </style>

  <text class="ttl" x="70" y="24">the tradeoff knee</text>

  <!-- axes -->
  <line class="ax" x1="70" y1="236" x2="432" y2="236"/>
  <line class="ax" x1="70" y1="236" x2="70" y2="46"/>

  <!-- accuracy(cost): steep, then flat -->
  <path class="curve" d="M78 226 C 130 226 152 132 180 106 C 250 64 358 60 426 58"/>

  <!-- the knee = the operating point -->
  <line class="tick" x1="180" y1="106" x2="180" y2="236"/>
  <circle class="pt" cx="180" cy="106" r="5"/>
  <text class="note" x="192" y="103">operating point</text>
  <text class="faint" x="192" y="119">sit at the knee, not the peak</text>

  <text class="faint" x="350" y="48" text-anchor="middle">diminishing returns</text>

  <!-- axis labels -->
  <text class="lab" x="251" y="266" text-anchor="middle">cost: latency + energy</text>
  <text class="lab" x="30" y="141" text-anchor="middle" transform="rotate(-90 30 141)">accuracy</text>
</svg>
