# Physical AI — a backward-designed systems book.
# The concept track is complete before its end-of-chapter lab.
#   quarto render            # both formats
#   quarto preview           # live HTML
#   quarto render --to pdf   # PDF only

project:
  type: book
  output-dir: _build

bibliography: references.bib
link-citations: true

# Numbers in the book come from code (see rules/inline-computation.md). Chapters
# use pure-Python cells, so they execute with the python3 on PATH, no extra deps.
jupyter: python3

website:
  site-url: "https://mlsysbook.ai/physical/"
  announcement:
    icon: exclamation-triangle
    dismissable: false
    content: "**Written in the open, and in progress.** Live, evolving working draft planned for release in early 2027. Chapters and lab contracts are under active development."
    type: warning
    position: above-navbar

book:
  title: "Physical AI"
  subtitle: "Machine Learning Systems That Sense and Act"
  author:
    name: Vijay Janapa Reddi
    affiliations:
      - name: Harvard University
      - name: ETH Zurich
  date: today
  date-format: long
  cover-image: assets/cover.png
  cover-image-alt: "Cover of Physical AI: Machine Learning Systems That Sense and Act"
  image: assets/cover.png
  description: >
    A systems-first book about turning learned capabilities into continuous,
    measurable, dependable, and accountable systems that sense and act in the
    real world.
  repo-url: "https://github.com/harvard-edge/physical-ai"
  repo-subdir: book
  repo-branch: dev
  repo-actions: [source, issue]
  open-graph: true
  twitter-card: true
  page-navigation: true
  reader-mode: true
  search: true
  sidebar:
    style: docked
    search: false
    collapse-level: 2
    logo: assets/cover.png
  page-footer:
    left: "Physical AI · **Working Draft** (Planned Release Early 2027)"
    center: "Part of the [mlsysbook.ai](https://mlsysbook.ai) family"
    right: "Harvard University · ETH Zurich"
  chapters:
    - index.qmd
    - front-matter/syllabus.qmd
    - front-matter/notation.qmd
    - chapters/01-boundary/01-boundary.qmd
    - part: parts/part-i.qmd
      chapters:
        - chapters/02-body/02-body.qmd
        - chapters/03-brain/03-brain.qmd
        - chapters/04-nervous/04-nervous.qmd
    - part: parts/part-ii.qmd
      chapters:
        - chapters/05-data/05-data.qmd
        - chapters/06-training/06-training.qmd
        - chapters/07-evaluation/07-evaluation.qmd
    - part: parts/part-iii.qmd
      chapters:
        - chapters/08-perception/08-perception.qmd
        - chapters/09-memory/09-memory.qmd
        - chapters/10-intent/10-intent.qmd
        - chapters/11-planning/11-planning.qmd
        - chapters/12-enforcement/12-enforcement.qmd
        - chapters/13-placement/13-placement.qmd
    - part: parts/part-iv.qmd
      chapters:
        - chapters/14-intervention/14-intervention.qmd
        - chapters/15-verification/15-verification.qmd
        - chapters/16-release/16-release.qmd
    - chapters/17-frontier/17-frontier.qmd

  appendices:
    - appendix/math-reference.qmd
    - appendix/glossary.qmd
    - appendix/cross-disciplinary-lexicon.qmd
    - appendix/hardware-reference.qmd
    - appendix/standards-and-incidents.qmd
    - appendix/notebook-templates.qmd
    - appendix/heterogeneous-soc-reference.qmd
    - references.qmd

# Custom callouts (vendored pae-ext/custom-numbered-blocks Quarto extension).
# One Lua filter renders <details> in HTML and a tcolorbox in PDF. The recurring
# recurring roles are learning objective, decision, and end-of-chapter lab.
# Question and teaching-note callouts remain available when a chapter genuinely
# needs them, but they are not part of the universal visible template.
# colors = [PDF title-bar fill, accent].
filters:
  - pae-ext/custom-numbered-blocks

filter-metadata:
  pae-ext/custom-numbered-blocks:
    icon-path: "assets/images/icons/callouts"
    icon-format: "svg"
    groups:
      objective:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      definition:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      incident:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      math:
        colors: ["EEF4FB", "215CAF"]
        collapse: false
        numbered: false
      rule:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
      algorithm:
        colors: ["F4F6F9", "1A365D"]
        collapse: false
        numbered: false
      decision:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      lab:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      teaching:
        colors: ["F3F0F8", "5B4B8A"]
        collapse: false
        numbered: false
      autopsy:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      contract:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
      law:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      archetype:
        colors: ["F0F7F4", "1B6B48"]
        collapse: false
        numbered: false
      fallacy:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      case:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
      takeaways:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
    classes:
      callout-objective:
        group: objective
        label: "Learning Objectives"
      callout-definition:
        group: definition
        label: "Definition"
      callout-incident:
        group: incident
        label: "Landmark Engineering Incident"
      callout-math:
        group: math
        label: "Fermi Math"
      callout-rule:
        group: rule
        label: "Architect's Rule of Thumb"
      callout-algorithm:
        group: algorithm
        label: "Algorithm"
      callout-decision:
        group: decision
        label: "Design Decision"
      callout-lab:
        group: lab
        label: "Hands-On Lab"
      callout-teaching:
        group: teaching
        label: "Teaching Note"
      callout-autopsy:
        group: autopsy
        label: "Incident Autopsy"
      callout-contract:
        group: contract
        label: "Proposal–Permission Contract"
      callout-law:
        group: law
        label: "Bedrock Law"
      callout-case:
        group: case
        label: "Micro-Case"
      callout-fallacy:
        group: fallacy
        label: "Fallacy & Pitfall"
      callout-archetype:
        group: archetype
        label: "Archetype Focus"
      callout-takeaways:
        group: takeaways
        label: "Key Chapter Takeaways"

format:
  html:
    theme:
      light: [default, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    link-citations: true
    # Default Quarto article measure, centered as a block (see theme.scss).
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5rem
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
          <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  pdf:
    keep-tex: true
    pdf-engine: lualatex
    documentclass: scrbook
    fontsize: 9.5pt
    linestretch: 1.14
    mainfont: "STIX Two Text"
    mainfontoptions:
      - "BoldFont=STIX Two Text Bold"
      - "ItalicFont=STIX Two Text Italic"
      - "BoldItalicFont=STIX Two Text Bold Italic"
    sansfont: "Avenir Next"
    sansfontoptions:
      - "Scale=0.90"
    monofont: "Menlo"
    monofontoptions:
      - "Scale=0.78"
    colorlinks: true
    link-citations: true
    linkcolor: structural
    urlcolor: measured
    citecolor: measured
    toc: true
    toc-depth: 1
    number-depth: 3
    reference-location: margin
    fig-pos: "t"
    tbl-pos: "htbp"
    tbl-cap-location: top
    classoption:
      - open=right
      - numbers=noenddot
      - captions=tableheading
    geometry:
      - paperwidth=7.5in
      - paperheight=10in
      - top=0.75in
      - bottom=0.80in
      - inner=0.80in
      - outer=1.90in
      - textwidth=4.60in
      - marginparsep=0.20in
      - marginparwidth=1.50in
      - footskip=0.35in
      - headheight=14pt
      - headsep=0.18in
      - heightrounded
    include-in-header:
      - file: "tex/theme-colors-physical.tex"
      - file: "tex/preamble.tex"
      - file: "tex/cover.tex"
      - text: |
          \usepackage{needspace}
          \let\Needspace\needspace

metadata-files:
  - ../../shared/config/navbar-common.yml
  - ../../shared/config/footer-common.yml





