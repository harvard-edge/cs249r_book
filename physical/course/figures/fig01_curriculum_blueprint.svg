<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="auto" role="img" aria-label="The Physical AI Curriculum and Chapter Blueprint">
  <defs>
    <style>
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .part-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .part-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .ch-num { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .ch-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .ch-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748B; }
      .dossier-pill { font-family: 'SF Mono', Menlo, monospace; font-size: 9.5px; font-weight: 600; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Canvas Surface -->
  <rect width="940" height="560" fill="#FFFFFF" rx="8"/>

  <!-- Top Title Banner -->
  <rect x="20" y="14" width="900" height="42" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="main-title" x="470" y="33" text-anchor="middle">THE PHYSICAL AI CURRICULUM AND CHAPTER BLUEPRINT</text>
  <text class="main-sub" x="470" y="47" text-anchor="middle">11-Chapter Backward-Designed Progression: From Causal Foundations to Heterogeneous Placement &amp; Defensible Release</text>

  <!-- ================= PART I ================= -->
  <g transform="translate(20, 68)">
    <rect width="900" height="120" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    
    <!-- Part Badge & Title -->
    <rect x="12" y="10" width="120" height="20" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text class="part-badge" x="72" y="24" text-anchor="middle" fill="#2563EB">PART I · FOUNDATIONS</text>
    <text class="part-title" x="145" y="25">Foundations &amp; The Co-Design Matrix</text>

    <!-- Chapters Grid -->
    <g transform="translate(12, 38)">
      <!-- Ch 1 -->
      <g transform="translate(0, 0)">
        <rect width="280" height="70" rx="4" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
        <text class="ch-num" x="10" y="20" fill="#1D4ED8">Chapter 1</text>
        <text class="ch-title" x="70" y="20">The Causal Boundary</text>
        <text class="ch-desc" x="10" y="38">The Sense-and-Act loop, Proposal–Permission split, and the 4 Bedrock Laws.</text>
        <rect x="10" y="48" width="80" height="15" rx="3" fill="#EFF6FF"/>
        <text class="dossier-pill" x="50" y="59" text-anchor="middle" fill="#1D4ED8">LOOP-01</text>
      </g>

      <!-- Ch 2 -->
      <g transform="translate(295, 0)">
        <rect width="280" height="70" rx="4" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
        <text class="ch-num" x="10" y="20" fill="#1D4ED8">Chapter 2</text>
        <text class="ch-title" x="70" y="20">Physical Constraints</text>
        <text class="ch-desc" x="10" y="38">Information Freshness, Latency Waterfalls, Dynamic Stopping, and Silicon.</text>
        <rect x="10" y="48" width="80" height="15" rx="3" fill="#EFF6FF"/>
        <text class="dossier-pill" x="50" y="59" text-anchor="middle" fill="#1D4ED8">BUDGET-01</text>
      </g>

      <!-- Ch 3 -->
      <g transform="translate(590, 0)">
        <rect width="286" height="70" rx="4" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
        <text class="ch-num" x="10" y="20" fill="#1D4ED8">Chapter 3</text>
        <text class="ch-title" x="70" y="20">Cognitive Agency</text>
        <text class="ch-desc" x="10" y="38">The 5 Cognitive Dimensions, 3 Cadences, and the Co-Design Matrix.</text>
        <rect x="10" y="48" width="80" height="15" rx="3" fill="#EFF6FF"/>
        <text class="dossier-pill" x="50" y="59" text-anchor="middle" fill="#1D4ED8">MAP-01</text>
      </g>
    </g>
  </g>

  <!-- Flow Down Arrow 1 -> 2 -->
  <line x1="470" y1="190" x2="470" y2="202" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= PART II ================= -->
  <g transform="translate(20, 204)">
    <rect width="900" height="195" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
    
    <!-- Part Badge & Title -->
    <rect x="12" y="10" width="180" height="20" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
    <text class="part-badge" x="102" y="24" text-anchor="middle" fill="#059669">PART II · THE 5-STAGE EMBODIED LIFECYCLE</text>
    <text class="part-title" x="205" y="25">Solving the Co-Design Matrix Row by Row</text>

    <!-- Lifecycle Grid (5 chapters) -->
    <g transform="translate(12, 38)">
      <!-- Row 1: Ch 4, Ch 5, Ch 6 -->
      <g transform="translate(0, 0)">
        <!-- Ch 4 -->
        <g transform="translate(0, 0)">
          <rect width="280" height="66" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
          <text class="ch-num" x="10" y="18" fill="#047857">Chapter 4 · Stage 1/2</text>
          <text class="ch-title" x="135" y="18">Perception &amp; ViT</text>
          <text class="ch-desc" x="10" y="34">Transduction, DMA QoS, and 3D Affordances.</text>
          <rect x="10" y="44" width="75" height="15" rx="3" fill="#ECFDF5"/>
          <text class="dossier-pill" x="47" y="55" text-anchor="middle" fill="#047857">OBS-01</text>
        </g>

        <!-- Ch 5 -->
        <g transform="translate(295, 0)">
          <rect width="280" height="66" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
          <text class="ch-num" x="10" y="18" fill="#047857">Chapter 5 · Stage 3</text>
          <text class="ch-title" x="125" y="18">World Models</text>
          <text class="ch-desc" x="10" y="34">SE(3) Trees, Latent JEPAs, and State TTL.</text>
          <rect x="10" y="44" width="75" height="15" rx="3" fill="#ECFDF5"/>
          <text class="dossier-pill" x="47" y="55" text-anchor="middle" fill="#047857">STATE-01</text>
        </g>

        <!-- Ch 6 -->
        <g transform="translate(590, 0)">
          <rect width="286" height="66" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
          <text class="ch-num" x="10" y="18" fill="#047857">Chapter 6 · Stage 4</text>
          <text class="ch-title" x="125" y="18">Semantic Intent</text>
          <text class="ch-desc" x="10" y="34">VLM Reasoning, Reachability, and Leases.</text>
          <rect x="10" y="44" width="75" height="15" rx="3" fill="#ECFDF5"/>
          <text class="dossier-pill" x="47" y="55" text-anchor="middle" fill="#047857">INTENT-01</text>
        </g>
      </g>

      <!-- Row 2: Ch 7, Ch 8 -->
      <g transform="translate(0, 76)">
        <!-- Ch 7 -->
        <g transform="translate(0, 0)">
          <rect width="425" height="66" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
          <text class="ch-num" x="10" y="18" fill="#047857">Chapter 7 · Stage 5</text>
          <text class="ch-title" x="125" y="18">Planning &amp; Action Chunking</text>
          <text class="ch-desc" x="10" y="34">Diffusion Policies, C^2 Jerk Continuity, and Asynchronous State Re-Anchoring.</text>
          <rect x="10" y="44" width="75" height="15" rx="3" fill="#ECFDF5"/>
          <text class="dossier-pill" x="47" y="55" text-anchor="middle" fill="#047857">PLAN-01</text>
        </g>

        <!-- Ch 8 -->
        <g transform="translate(445, 0)">
          <rect width="431" height="66" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
          <text class="ch-num" x="10" y="18" fill="#047857">Chapter 8 · Stage 6</text>
          <text class="ch-title" x="125" y="18">Safety Barrier Reflexes</text>
          <text class="ch-desc" x="10" y="34">1000 Hz MCU QP Barrier Solves, IEC 60204-1 Stops, and Hardware Interlocks.</text>
          <rect x="10" y="44" width="75" height="15" rx="3" fill="#ECFDF5"/>
          <text class="dossier-pill" x="47" y="55" text-anchor="middle" fill="#047857">SAFE-01</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Flow Down Arrow 2 -> 3 -->
  <line x1="470" y1="401" x2="470" y2="413" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= PART III ================= -->
  <g transform="translate(20, 415)">
    <rect width="900" height="130" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
    
    <!-- Part Badge & Title -->
    <rect x="12" y="10" width="160" height="20" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
    <text class="part-badge" x="92" y="24" text-anchor="middle" fill="#7C3AED">PART III · SYSTEM SYNTHESIS</text>
    <text class="part-title" x="185" y="25">Placement, Governance, Assurance &amp; Capstone Defense</text>

    <!-- Chapters Grid (Ch 9, 10, 11, 99) -->
    <g transform="translate(12, 38)">
      <!-- Ch 9 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="76" rx="4" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
        <text class="ch-num" x="8" y="18" fill="#6D28D9">Chapter 9</text>
        <text class="ch-title" x="68" y="18">Placement</text>
        <text class="ch-desc" x="8" y="34">Heterogeneous Silicon, Cloud vs. Edge, and UMA bus QoS.</text>
        <rect x="8" y="52" width="65" height="15" rx="3" fill="#F5F3FF"/>
        <text class="dossier-pill" x="40" y="63" text-anchor="middle" fill="#6D28D9">PLACE-01</text>
      </g>

      <!-- Ch 10 -->
      <g transform="translate(222, 0)">
        <rect width="210" height="76" rx="4" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
        <text class="ch-num" x="8" y="18" fill="#6D28D9">Chapter 10</text>
        <text class="ch-title" x="72" y="18">Governance</text>
        <text class="ch-desc" x="8" y="34">Bumpless Takeover, Episode Slicing, and Lineage Audit.</text>
        <rect x="8" y="52" width="65" height="15" rx="3" fill="#F5F3FF"/>
        <text class="dossier-pill" x="40" y="63" text-anchor="middle" fill="#6D28D9">GOV-01</text>
      </g>

      <!-- Ch 11 -->
      <g transform="translate(444, 0)">
        <rect width="210" height="76" rx="4" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
        <text class="ch-num" x="8" y="18" fill="#6D28D9">Chapter 11</text>
        <text class="ch-title" x="72" y="18">Assurance</text>
        <text class="ch-desc" x="8" y="34">4-Rung Ladder, Seeded Faults, and CAE Cases.</text>
        <rect x="8" y="52" width="65" height="15" rx="3" fill="#F5F3FF"/>
        <text class="dossier-pill" x="40" y="63" text-anchor="middle" fill="#6D28D9">REL-01</text>
      </g>

      <!-- Ch 99 / Capstone -->
      <g transform="translate(666, 0)">
        <rect width="210" height="76" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
        <text class="ch-num" x="8" y="18" fill="#A51C30">Capstone</text>
        <text class="ch-title" x="68" y="18">Bench Defense</text>
        <text class="ch-desc" x="8" y="34">Complete Integration under Live Seeded Fault Injection.</text>
        <rect x="8" y="52" width="105" height="15" rx="3" fill="#A51C30"/>
        <text class="dossier-pill" x="60" y="63" text-anchor="middle" fill="#FFFFFF">RELEASE VERDICT</text>
      </g>
    </g>
  </g>
</svg>
