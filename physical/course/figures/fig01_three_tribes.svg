<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="auto" role="img" aria-label="The Three Engineering Tribes Converging into Physical AI">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .card-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #64748B; }
      .section-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .body-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #334155; line-height: 1.45; }
      .bullet-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
      .blindspot-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #A51C30; }
      .blindspot-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-style: italic; fill: #64748B; line-height: 1.4; }
      .synth-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #A51C30; }
      .synth-body { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1E293B; line-height: 1.45; }
    </style>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Canvas Surface -->
  <rect width="920" height="460" fill="#FFFFFF" rx="8"/>

  <!-- Top Title Banner -->
  <rect x="20" y="14" width="880" height="42" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="banner-title" x="460" y="33" text-anchor="middle">THE THREE ENGINEERING TRIBES CONVERGING INTO PHYSICAL AI</text>
  <text class="banner-sub" x="460" y="47" text-anchor="middle">Synthesizing Machine Learning representation, Embedded timing determinism, and Robotics physical dynamics</text>

  <!-- ================= TRIBE 1: THE BRAIN ================= -->
  <g transform="translate(20, 68)">
    <rect width="280" height="248" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    
    <!-- Tag Pill -->
    <rect x="12" y="10" width="160" height="20" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text class="card-tag" x="92" y="24" text-anchor="middle" fill="#2563EB">TRIBE 1 · THE BRAIN</text>
    
    <!-- Titles -->
    <text class="card-title" x="12" y="48">The ML / AI Engineer</text>
    <text class="card-sub" x="12" y="62">Computer Science &amp; Modern AI</text>
    
    <!-- Core Strength -->
    <text class="section-hdr" x="12" y="82" fill="#1D4ED8">Core Strength:</text>
    <text class="body-txt" x="12" y="96">Semantic Competence &amp; Open Worlds</text>
    <text class="bullet-txt" x="16" y="112">• Vision-Language Models (VLMs)</text>
    <text class="bullet-txt" x="16" y="127">• Trajectory Action Chunks (ACT / Diffusion)</text>
    <text class="bullet-txt" x="16" y="142">• Latent World Models (JEPAs)</text>
    
    <!-- Divider -->
    <line x1="12" y1="154" x2="268" y2="154" stroke="#DBEAFE" stroke-width="1"/>
    
    <!-- Blindspot -->
    <text class="blindspot-hdr" x="12" y="172">Critical Blindspot:</text>
    <text class="blindspot-txt" x="12" y="188">
      <tspan x="12" dy="0">The Digital Sandbox Illusion: assuming</tspan>
      <tspan x="12" dy="14">simulation guarantees safety and OS crashes</tspan>
      <tspan x="12" dy="14">cleanly de-energize motor stator coils.</tspan>
    </text>
  </g>

  <!-- ================= TRIBE 2: THE NERVOUS SYSTEM ================= -->
  <g transform="translate(320, 68)">
    <rect width="280" height="248" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
    
    <!-- Tag Pill -->
    <rect x="12" y="10" width="190" height="20" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
    <text class="card-tag" x="107" y="24" text-anchor="middle" fill="#059669">TRIBE 2 · THE NERVOUS SYSTEM</text>
    
    <!-- Titles -->
    <text class="card-title" x="12" y="48">The Embedded / ECE Engineer</text>
    <text class="card-sub" x="12" y="62">Silicon &amp; Real-Time Systems</text>
    
    <!-- Core Strength -->
    <text class="section-hdr" x="12" y="82" fill="#047857">Core Strength:</text>
    <text class="body-txt" x="12" y="96">Silicon Privilege &amp; Multi-Rate Cadence</text>
    <text class="bullet-txt" x="16" y="112">• IEEE 1588 PTP Clocks &amp; P99 Metrology</text>
    <text class="bullet-txt" x="16" y="127">• Zero-Copy DMA &amp; Lock-Free SRAM IPC</text>
    <text class="bullet-txt" x="16" y="142">• Zero-Allocation Bare-Metal / FreeRTOS</text>
    
    <!-- Divider -->
    <line x1="12" y1="154" x2="268" y2="154" stroke="#D1FAE5" stroke-width="1"/>
    
    <!-- Blindspot -->
    <text class="blindspot-hdr" x="12" y="172">Critical Blindspot:</text>
    <text class="blindspot-txt" x="12" y="188">
      <tspan x="12" dy="0">Static Automation: treating systems as rigid</tspan>
      <tspan x="12" dy="14">rule engines unable to parse unstructured,</tspan>
      <tspan x="12" dy="14">open-world environments or semantic text.</tspan>
    </text>
  </g>

  <!-- ================= TRIBE 3: THE BODY ================= -->
  <g transform="translate(620, 68)">
    <rect width="280" height="248" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
    
    <!-- Tag Pill -->
    <rect x="12" y="10" width="160" height="20" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
    <text class="card-tag" x="92" y="24" text-anchor="middle" fill="#7C3AED">TRIBE 3 · THE BODY</text>
    
    <!-- Titles -->
    <text class="card-title" x="12" y="48">The Robotics / MechE Engineer</text>
    <text class="card-sub" x="12" y="62">Mechanical Dynamics &amp; Safe Sets</text>
    
    <!-- Core Strength -->
    <text class="section-hdr" x="12" y="82" fill="#6D28D9">Core Strength:</text>
    <text class="body-txt" x="12" y="96">Physical Invariants &amp; Dynamics M(q)</text>
    <text class="bullet-txt" x="16" y="112">• Kinetic Momentum (p=mv) &amp; Braking</text>
    <text class="bullet-txt" x="16" y="127">• Control Barrier Functions: h(x) ≥ 0</text>
    <text class="bullet-txt" x="16" y="142">• Motor Thermal Dissipation &amp; Gear Backlash</text>
    
    <!-- Divider -->
    <line x1="12" y1="154" x2="268" y2="154" stroke="#EDE9FE" stroke-width="1"/>
    
    <!-- Blindspot -->
    <text class="blindspot-hdr" x="12" y="172">Critical Blindspot:</text>
    <text class="blindspot-txt" x="12" y="188">
      <tspan x="12" dy="0">The Closed-World Illusion: assuming the</tspan>
      <tspan x="12" dy="14">environment is fully modeled in CAD; distrusting</tspan>
      <tspan x="12" dy="14">learned models out of fear of non-determinism.</tspan>
    </text>
  </g>

  <!-- ================= BOTTOM CARD: THE SYNTHESIS ================= -->
  <g transform="translate(20, 328)">
    <rect width="880" height="116" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.4"/>
    
    <!-- Header -->
    <text class="synth-title" x="16" y="24">THE PHYSICAL AI SYSTEMS SYNTHESIS: THE PROPOSAL–PERMISSION DUAL-BRAIN</text>
    
    <!-- Body Content -->
    <text class="synth-body" x="16" y="46">
      <tspan x="16" dy="0">• <tspan font-weight="700">Host Brain (Linux MPU / NPU):</tspan> High-capacity untrusted proposal engine emitting expiring intent leases (<tspan font-style="italic">L_intent</tspan>) and multi-step action chunks.</tspan>
      <tspan x="16" dy="20">• <tspan font-weight="700">Reflex Brain (Real-Time MCU):</tspan> Deterministic zero-allocation safety reflex evaluating Control Barrier Functions (<tspan font-style="italic">h(x) ≥ 0</tspan>) at 1000 Hz with sole motor PWM authority.</tspan>
      <tspan x="16" dy="20">• <tspan font-weight="700">Governed Physical Consequence:</tspan> Unifies semantic intelligence with provable safety invariants, surviving MPU panics and tail latency spikes.</tspan>
    </text>
  </g>

  <!-- Convergence Arrows -->
  <line x1="160" y1="316" x2="160" y2="326" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
  <line x1="460" y1="316" x2="460" y2="326" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
  <line x1="760" y1="316" x2="760" y2="326" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
</svg>
