<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" role="img" aria-label="The Four Eras of AI Systems: Historical Evolution from Cloud ML to Physical AI">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .era-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
      .era-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .era-date { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #64748B; }
      .sec-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; }
      .body-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.45; }
      .bullet-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; }
      .limitation-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #A51C30; }
      .limitation-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-style: italic; fill: #64748B; line-height: 1.35; }
      .arrow-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1F407A; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Canvas Surface -->
  <rect width="920" height="440" fill="#FFFFFF" rx="8"/>

  <!-- Top Title Banner -->
  <rect x="20" y="14" width="880" height="42" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="banner-title" x="460" y="33" text-anchor="middle">THE EVOLUTIONARY ARC OF MACHINE LEARNING SYSTEMS</text>
  <text class="banner-sub" x="460" y="47" text-anchor="middle">From disembodied cloud perception and edge micro-sensing to closed-loop actuation under physical laws</text>

  <!-- ================= ERA 1: CLOUD ML ================= -->
  <g transform="translate(20, 70)">
    <rect width="205" height="345" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    
    <!-- Badge -->
    <rect x="10" y="10" width="105" height="18" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text class="era-badge" x="62" y="23" text-anchor="middle" fill="#475569">ERA 1 · CLOUD</text>
    
    <!-- Titles -->
    <text class="era-title" x="10" y="46">Disembodied ML</text>
    <text class="era-date" x="10" y="60">2012 – 2020 · Cloud GPU</text>
    
    <!-- Core Focus -->
    <text class="sec-hdr" x="10" y="80" fill="#334155">Systems Paradigm:</text>
    <text class="body-txt" x="10" y="94">Stateless digital perception</text>
    <text class="bullet-txt" x="12" y="110">• AlexNet &amp; ResNet backbones</text>
    <text class="bullet-txt" x="12" y="124">• Transformer attention (NLP)</text>
    <text class="bullet-txt" x="12" y="138">• Data-parallel GPU clusters</text>
    <text class="bullet-txt" x="12" y="152">• MLPerf benchmark suites</text>
    
    <!-- Divider -->
    <line x1="10" y1="166" x2="195" y2="166" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Execution Substrate -->
    <text class="sec-hdr" x="10" y="184" fill="#334155">Execution Boundary:</text>
    <text class="body-txt" x="10" y="198">Behind glass in cloud containers</text>
    <text class="bullet-txt" x="12" y="214">• Errors caught with try/catch</text>
    <text class="bullet-txt" x="12" y="228">• HTTP 500 retry semantics</text>
    <text class="bullet-txt" x="12" y="242">• World state W_t unchanged</text>
    
    <!-- Divider -->
    <line x1="10" y1="256" x2="195" y2="256" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Limitation -->
    <text class="limitation-hdr" x="10" y="274">Physical Limitation:</text>
    <text class="limitation-txt" x="10" y="290">
      <tspan x="10" dy="0">Purely digital software;</tspan>
      <tspan x="10" dy="13">zero interaction with kinetic</tspan>
      <tspan x="10" dy="13">mass, energy, or matter.</tspan>
    </text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="228" y1="230" x2="242" y2="230" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= ERA 2: TINYML ================= -->
  <g transform="translate(245, 70)">
    <rect width="205" height="345" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
    
    <!-- Badge -->
    <rect x="10" y="10" width="110" height="18" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <text class="era-badge" x="65" y="23" text-anchor="middle" fill="#D97706">ERA 2 · TINYML</text>
    
    <!-- Titles -->
    <text class="era-title" x="10" y="46">Edge Micro-Sensing</text>
    <text class="era-date" x="10" y="60">2018 – 2023 · Microcontroller</text>
    
    <!-- Core Focus -->
    <text class="sec-hdr" x="10" y="80" fill="#B45309">Systems Paradigm:</text>
    <text class="body-txt" x="10" y="94">Ultra-low-power edge inference</text>
    <text class="bullet-txt" x="12" y="110">• INT8 quantization &amp; pruning</text>
    <text class="bullet-txt" x="12" y="124">• Kilobytes of SRAM memory</text>
    <text class="bullet-txt" x="12" y="138">• Milliwatt power budgets</text>
    <text class="bullet-txt" x="12" y="152">• TinyMLPerf benchmark suite</text>
    
    <!-- Divider -->
    <line x1="10" y1="166" x2="195" y2="166" stroke="#FEF3C7" stroke-width="1"/>
    
    <!-- Execution Substrate -->
    <text class="sec-hdr" x="10" y="184" fill="#B45309">Deployment Mode:</text>
    <text class="body-txt" x="10" y="198">On-device acoustic &amp; IMU sensing</text>
    <text class="bullet-txt" x="12" y="214">• Keyword spotting (KWS)</text>
    <text class="bullet-txt" x="12" y="228">• Anomaly vibration monitors</text>
    <text class="bullet-txt" x="12" y="242">• Micro-vision presence detect</text>
    
    <!-- Divider -->
    <line x1="10" y1="256" x2="195" y2="256" stroke="#FEF3C7" stroke-width="1"/>
    
    <!-- Limitation -->
    <text class="limitation-hdr" x="10" y="274">Physical Limitation:</text>
    <text class="limitation-txt" x="10" y="290">
      <tspan x="10" dy="0">Open-loop sensing only;</tspan>
      <tspan x="10" dy="13">models emit digital flags</tspan>
      <tspan x="10" dy="13">without closing control loops.</tspan>
    </text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="453" y1="230" x2="467" y2="230" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= ERA 3: FOUNDATION MODELS ================= -->
  <g transform="translate(470, 70)">
    <rect width="205" height="345" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    
    <!-- Badge -->
    <rect x="10" y="10" width="130" height="18" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text class="era-badge" x="75" y="23" text-anchor="middle" fill="#2563EB">ERA 3 · FOUNDATION</text>
    
    <!-- Titles -->
    <text class="era-title" x="10" y="46">Semantic Reasoning</text>
    <text class="era-date" x="10" y="60">2023 – 2026 · VLM / VLA</text>
    
    <!-- Core Focus -->
    <text class="sec-hdr" x="10" y="80" fill="#1D4ED8">Systems Paradigm:</text>
    <text class="body-txt" x="10" y="94">Open-world semantic scene parsing</text>
    <text class="bullet-txt" x="12" y="110">• Multimodal vision-language</text>
    <text class="bullet-txt" x="12" y="124">• Spatial affordance grounding</text>
    <text class="bullet-txt" x="12" y="138">• Trajectory diffusion policies</text>
    <text class="bullet-txt" x="12" y="152">• Billions of parameters</text>
    
    <!-- Divider -->
    <line x1="10" y1="166" x2="195" y2="166" stroke="#DBEAFE" stroke-width="1"/>
    
    <!-- Execution Substrate -->
    <text class="sec-hdr" x="10" y="184" fill="#1D4ED8">Operating Cadence:</text>
    <text class="body-txt" x="10" y="198">Slow deliberation on host NPUs</text>
    <text class="bullet-txt" x="12" y="214">• Slow cadences: 0.5–2 Hz</text>
    <text class="bullet-txt" x="12" y="228">• Tail latency spikes (P99)</text>
    <text class="bullet-txt" x="12" y="242">• High power draw (15–50W)</text>
    
    <!-- Divider -->
    <line x1="10" y1="256" x2="195" y2="256" stroke="#DBEAFE" stroke-width="1"/>
    
    <!-- Limitation -->
    <text class="limitation-hdr" x="10" y="274">Physical Limitation:</text>
    <text class="limitation-txt" x="10" y="290">
      <tspan x="10" dy="0">No physical safety reflex;</tspan>
      <tspan x="10" dy="13">lacks awareness of inertia,</tspan>
      <tspan x="10" dy="13">bus stalls, or clock jitter.</tspan>
    </text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="678" y1="230" x2="692" y2="230" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= ERA 4: PHYSICAL AI ================= -->
  <g transform="translate(695, 70)">
    <rect width="205" height="345" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
    
    <!-- Badge -->
    <rect x="10" y="10" width="135" height="18" rx="9" fill="#059669" stroke="#059669" stroke-width="1"/>
    <text class="era-badge" x="77" y="23" text-anchor="middle" fill="#FFFFFF">ERA 4 · PHYSICAL AI</text>
    
    <!-- Titles -->
    <text class="era-title" x="10" y="46" fill="#047857">Closed-Loop Actuation</text>
    <text class="era-date" x="10" y="60" fill="#059669">2026+ · Dual-Brain Systems</text>
    
    <!-- Core Focus -->
    <text class="sec-hdr" x="10" y="80" fill="#047857">Systems Paradigm:</text>
    <text class="body-txt" x="10" y="94">Delegated physical authority</text>
    <text class="bullet-txt" x="12" y="110">• Proposal–Permission Split</text>
    <text class="bullet-txt" x="12" y="124">• Multi-rate asynchronous IPC</text>
    <text class="bullet-txt" x="12" y="138">• 1 kHz Control Barrier Functions</text>
    <text class="bullet-txt" x="12" y="152">• Dynamic stopping physics (d_stop)</text>
    
    <!-- Divider -->
    <line x1="10" y1="166" x2="195" y2="166" stroke="#A7F3D0" stroke-width="1"/>
    
    <!-- Execution Substrate -->
    <text class="sec-hdr" x="10" y="184" fill="#047857">Dual-Brain Silicon:</text>
    <text class="body-txt" x="10" y="198">Untrusted MPU + Trusted MCU</text>
    <text class="bullet-txt" x="12" y="214">• Expiring Intent Leases (L_intent)</text>
    <text class="bullet-txt" x="12" y="228">• Survives Linux kernel crashes</text>
    <text class="bullet-txt" x="12" y="242">• Matter &amp; Momentum Mutate (W_t+1)</text>
    
    <!-- Divider -->
    <line x1="10" y1="256" x2="195" y2="256" stroke="#A7F3D0" stroke-width="1"/>
    
    <!-- Core Achievement -->
    <text class="sec-hdr" x="10" y="274" fill="#047857">Core Breakthrough:</text>
    <text class="body-txt" x="10" y="290" fill="#0F5132">
      <tspan x="10" dy="0" font-weight="600">Open-world semantic intelligence</tspan>
      <tspan x="10" dy="13">caged within deterministic,</tspan>
      <tspan x="10" dy="13">provable physical safety laws.</tspan>
    </text>
  </g>
</svg>
