<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sbcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <marker id="arrowHeadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowHeadPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f8fafc" rx="16" />

  <!-- Left Domain: Hard Real-Time MCU -->
  <rect x="30" y="30" width="440" height="540" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <text x="250" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1.5">HARD REAL-TIME (MCU)</text>
  <text x="250" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Deterministic Reflex · 1000 Hz · malloc = 0</text>

  <!-- Right Domain: Soft Real-Time SBC -->
  <rect x="530" y="30" width="440" height="540" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2" />
  <text x="750" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#6b21a8" text-anchor="middle" letter-spacing="1.5">SOFT REAL-TIME (SBC / MPU)</text>
  <text x="750" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7e22ce" text-anchor="middle">Asynchronous Deliberation · 0.5–20 Hz · Linux / NPU</text>

  <!-- The Privilege Boundary (Dashed Line) -->
  <line x1="500" y1="30" x2="500" y2="570" stroke="#0f172a" stroke-width="4" stroke-dasharray="10 10" />
  <rect x="440" y="280" width="120" height="40" rx="8" fill="#0f172a" />
  <text x="500" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">PRIVILEGE BOUNDARY</text>

  <!-- Node 1: PERCEIVE (Top Left) -->
  <g transform="translate(100, 140)" filter="url(#cardShadow)">
    <rect width="300" height="110" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="3" />
    <text x="150" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Perceive</text>
    <text x="150" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">Fast Sensor Ingestion &amp; Proprioception</text>
    <text x="150" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">IMU · Encoders · PTP Hardware Timestamps</text>
  </g>

  <!-- Node 2: ACT (Bottom Left) -->
  <g transform="translate(100, 390)" filter="url(#cardShadow)">
    <rect width="300" height="110" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="3" />
    <text x="150" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Act</text>
    <text x="150" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">1 kHz Safety Reflex &amp; Motor Commutation</text>
    <text x="150" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Control Barrier Functions · PWM Gate Locks</text>
  </g>

  <!-- Node 3: REASON (Right Center) -->
  <g transform="translate(600, 245)" filter="url(#cardShadow)">
    <rect width="300" height="130" rx="12" fill="#ffffff" stroke="#a855f7" stroke-width="3" />
    <text x="150" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Reason</text>
    <text x="150" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7e22ce" text-anchor="middle">Semantic Deliberation &amp; Action Chunking</text>
    <text x="150" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Vision-Language Models · World Models</text>
    <text x="150" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle">Untrusted Proposal Generator</text>
  </g>

  <!-- Flow 1: Fast Closed-Loop (Act -> Perceive on MCU) -->
  <path d="M 250 390 L 250 260" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrowHeadGreen)" />
  <rect x="180" y="310" width="140" height="26" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1" />
  <text x="250" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">1000 Hz Fast Reflex Loop</text>

  <!-- Flow 2: Perceive -> Reason (Crossing to SBC) -->
  <path d="M 400 195 C 550 195, 620 220, 680 245" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowHeadBlue)" />
  <rect x="470" y="180" width="160" height="26" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
  <text x="550" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">Sensory Evidence (Tokens)</text>

  <!-- Flow 3: Reason -> Act (Crossing back to MCU) -->
  <path d="M 680 375 C 620 410, 550 445, 400 445" fill="none" stroke="#a855f7" stroke-width="4" marker-end="url(#arrowHeadPurple)" />
  <rect x="470" y="420" width="160" height="26" rx="4" fill="#fae8ff" stroke="#a855f7" stroke-width="1" />
  <text x="550" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Expiring Intent Proposals</text>

</svg>
