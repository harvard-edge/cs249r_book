  <!-- PART 3: INTEGRATION, GOVERNANCE & DEPLOYMENT -->
  <g transform="translate(35, 420)">
    <rect x="0" y="0" width="890" height="145" rx="6" fill="#FBF2F3" stroke="#A51C30" stroke-width="1.2"/>
    <rect x="0" y="0" width="890" height="28" rx="6" fill="#F6E4E6"/>
