<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #1F407A; }
      .header { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .item { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; fill: #2D3748; }
      .item-bold { font-weight: 600; fill: #1F407A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="35" y="36" class="title">The Physical AI Curriculum &amp; Chapter Blueprint</text>

  <!-- PART I BOX -->
  <g transform="translate(35, 60)">
    <rect x="0" y="0" width="830" height="120" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.4"/>
    <text x="415" y="28" text-anchor="middle" class="header">PART I: FOUNDATIONS &amp; THE CO-DESIGN MATRIX</text>
    <line x1="0" y1="40" x2="830" y2="40" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="65" class="item">• <tspan class="item-bold">Chapter 1:</tspan> The Causal Boundary &amp; The Co-Design Challenge</text>
    <text x="24" y="88" class="item">• <tspan class="item-bold">Chapter 2:</tspan> The Physical Constraints (The Matrix Columns)</text>
    <text x="24" y="111" class="item">• <tspan class="item-bold">Chapter 3:</tspan> The Cognitive Dimensions (The Matrix Rows &amp; The Populated Matrix)</text>
  </g>

  <!-- Down Arrow 1 -->
  <line x1="450" y1="180" x2="450" y2="215" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PART II BOX -->
  <g transform="translate(35, 220)">
    <rect x="0" y="0" width="830" height="175" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.4"/>
    <text x="415" y="24" text-anchor="middle" class="header">PART II: THE 5-STAGE EMBODIED LIFECYCLE</text>
    <text x="415" y="42" text-anchor="middle" class="item" style="font-size: 11.5px; fill: #475569;">(Solving the Co-Design Matrix Row-by-Row)</text>
    <line x1="0" y1="52" x2="830" y2="52" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="75" class="item">• <tspan class="item-bold">Chapter 4: Stage 1 — Perceive</tspan> (Spatial Tokens vs. DMA Ingestion Taxes)</text>
    <text x="24" y="98" class="item">• <tspan class="item-bold">Chapter 5: Stage 2 — Remember</tspan> (Latent World Models vs. Occlusion Uncertainty Drift)</text>
    <text x="24" y="121" class="item">• <tspan class="item-bold">Chapter 6: Stage 3 — Reason</tspan> (Multimodal VLMs vs. Slow Deliberation Latency)</text>
    <text x="24" y="144" class="item">• <tspan class="item-bold">Chapter 7: Stage 4 — Plan</tspan> (Diffusion Chunking vs. Delay &amp; Gearbox Jerk)</text>
    <text x="24" y="167" class="item">• <tspan class="item-bold">Chapter 8: Stage 5 — Execute</tspan> (Candidate Proposals vs. 1 kHz MCU Safety Barriers)</text>
  </g>

  <!-- Down Arrow 2 -->
  <line x1="450" y1="395" x2="450" y2="430" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PART III BOX -->
  <g transform="translate(35, 435)">
    <rect x="0" y="0" width="830" height="150" rx="3" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.4"/>
    <text x="415" y="28" text-anchor="middle" class="header">PART III: PLACEMENT, GOVERNANCE &amp; RELEASE</text>
    <line x1="0" y1="40" x2="830" y2="40" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="65" class="item">• <tspan class="item-bold">Chapter 9:</tspan>  Heterogeneous Silicon Placement (MPU vs NPU vs MCU, SRAM, UMA QoS)</text>
    <text x="24" y="88" class="item">• <tspan class="item-bold">Chapter 10:</tspan> Human-Machine Authority &amp; Governed Data Flywheels (Bumpless Slicing)</text>
    <text x="24" y="111" class="item">• <tspan class="item-bold">Chapter 11:</tspan> System Assurance &amp; Safety Cases (The 4-Rung Ladder &amp; Seeded Faults)</text>
    <text x="24" y="134" class="item">• <tspan class="item-bold">Chapter 99:</tspan> Whole-System Bench Defense (The Live Capstone Trial)</text>
  </g>
</svg>