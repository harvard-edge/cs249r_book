# =============================================================================
# MLSys·im WEBSITE CONFIGURATION
# =============================================================================
# First-principles analytical modeling for ML systems.
# Part of the MLSysBook ecosystem: mlsysbook.ai/mlsysim/
#
# Look and feel come from the shared ecosystem layer (shared/styles/ and
# shared/config/navbar-common.yml); this site only sets its cyan accent
# (shared/styles/themes/_theme-mlsysim.scss) and page-specific components.
# =============================================================================

project:
  type: website
  output-dir: _build
  # Regenerates api/ from the package docstrings and fails the render if a
  # public symbol has no API page. See scripts/build_api.py.
  pre-render: scripts/build_api.py
  resources:
    - mlsysim-paper.pdf
    - manifest.json
    - site.webmanifest
    - favicon.ico
    - favicon-16x16.png
    - favicon-32x32.png
    - apple-touch-icon.png
    - android-chrome-192x192.png
    - android-chrome-512x512.png
    # Tutorial slide PDFs are injected by mlsysim-publish-live.yml /
    # mlsysim-preview-dev.yml at the site root, alongside the paper.
    - tutorial_module1.pdf
    - tutorial_module2.pdf
    - tutorial_module3.pdf
    - tutorial_module4.pdf

website:
  title: "MLSys·im"
  description: "First-principles analytical modeling of ML system performance, cost, and carbon, from edge devices to datacenter fleets."
  site-url: https://mlsysbook.ai/mlsysim/
  favicon: assets/images/mlsysim-mark.svg

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    title: "MLSys·im: First-Principles Modeling for ML Systems"
    description: "Predict ML system performance, cost, and carbon from first principles. Companion to the Machine Learning Systems textbook."
  twitter-card:
    title: "MLSys·im: First-Principles Modeling for ML Systems"
    description: "Predict ML system performance, cost, and carbon from first principles. Open source."
    card-style: summary

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  # Shared navbar from navbar-common.yml; the site-local dropdown below is
  # merged in by Quarto. Responsive props (background, pinned, collapse) come
  # from shared/config/navbar-common.yml via metadata-files.
  navbar:
    logo: assets/images/logo.png
    search: true
    title: "Machine Learning Systems"
    left:
      - text: "MLSys·im"
        menu:
          - icon: house
            text: "MLSys·im Home"
            href: ./index.qmd
          - text: "---"
          - icon: play-circle
            text: "Getting Started"
            href: getting-started.qmd
          - icon: journal-code
            text: "Tutorials"
            href: tutorials/index.qmd
          - text: "---"
          - icon: collection
            text: "The Zoo"
            href: zoo/index.qmd
          - icon: code-square
            text: "API Reference"
            href: api/index.qmd
          - icon: terminal
            text: "CLI Reference"
            href: cli-reference.qmd
          - text: "---"
          - icon: easel
            text: "Tutorial Slides"
            href: slides.qmd
          - icon: pencil-square
            text: "Blog"
            href: blog/index.qmd
          # The paper is injected at the site root by the publish workflow,
          # matching the TinyTorch pattern.
          - icon: file-pdf
            text: "MLSys·im Paper (PDF)"
            href: mlsysim-paper.pdf
            target: _blank

  sidebar:
    style: "floating"
    background: light
    logo:
      light: assets/images/mlsysim-wordmark-light.svg
      dark: assets/images/mlsysim-wordmark-dark.svg
    logo-href: index.qmd
    search: true
    collapse-level: 1
    contents:
      - text: "MLSys·im Home"
        href: index.qmd
      - text: "---"

      # ── GET STARTED ──────────────────────────────────
      - section: "Get Started"
        contents:
          - getting-started.qmd
          - models-and-solvers.qmd
          - solver-guide.qmd
          - cli-reference.qmd
          - text: "For Students"
            href: for-students.qmd
          - text: "For Instructors"
            href: for-instructors.qmd
          - text: "For Engineers & Researchers"
            href: for-engineers.qmd

      # ── LEARN ────────────────────────────────────────
      - section: "Tutorials"
        href: tutorials/index.qmd
        contents:
          - section: "Foundations"
            contents:
              - tutorials/00_hello_roofline.qmd
              - tutorials/01_memory_wall.qmd
              - tutorials/02_two_phases.qmd
              - tutorials/03_kv_cache.qmd
          - section: "Optimization"
            contents:
              - tutorials/04_starving_the_gpu.qmd
              - tutorials/05_quantization.qmd
          - section: "Scale & Cost"
            contents:
              - tutorials/06_scaling_1000_gpus.qmd
              - tutorials/07_geography.qmd
              - tutorials/08_nine_million_dollar.qmd
          - section: "Analysis"
            contents:
              - tutorials/09_sensitivity.qmd
              - tutorials/10_gpu_vs_wafer.qmd
              - tutorials/11_training_memory_capacity_moe.qmd
              - tutorials/12_design_space_exploration.qmd
              - tutorials/12_full_stack_audit.qmd
          - section: "Extending MLSys·im"
            contents:
              - tutorials/01_pipeline_callbacks.qmd
              - tutorials/02_differential_explainer.qmd
          - section: "Self-Paced Tutorial"
            href: tutorial/index.qmd
            contents:
              - text: "Tutorial Exercises"
                href: tutorial/exercises.qmd
              - text: "Cheat Sheet"
                href: tutorial/cheatsheet.qmd
              - text: "Laws Explained"
                href: laws-explained.qmd

      # ── REFERENCE ────────────────────────────────────
      - section: "The Zoo"
        href: zoo/index.qmd
        contents:
          - zoo/hardware.qmd
          - zoo/models.qmd
          - zoo/fleets.qmd
          - zoo/infra.qmd
          - zoo/platforms.qmd
          - zoo/datasets.qmd
          - zoo/scenarios.qmd
          - zoo/embodied.qmd
          - zoo/sensors.qmd
          - zoo/actuators.qmd
          - zoo/agents.qmd
          - zoo/literature.qmd
          - zoo/ops.qmd

      - section: "API Reference"
        href: api/index.qmd
        contents:
          - text: "Engine"
            href: api/engine.engine.Engine.qmd
          - text: "Scenario"
            href: api/engine.scenarios.Scenario.qmd
          - section: "Physics formulas"
            contents:
              - text: "Performance"
                href: api/physics.performance.qmd
              - text: "Memory"
                href: api/physics.memory.qmd
              - text: "Transformer"
                href: api/physics.transformer.qmd
              - text: "Quantities"
                href: api/physics.quantities.qmd
              - text: "Communication"
                href: api/physics.communication.qmd
              - text: "Networking"
                href: api/physics.networking.qmd
              - text: "Serving"
                href: api/physics.serving.qmd
              - text: "Reliability"
                href: api/physics.reliability.qmd
              - text: "Statistics"
                href: api/physics.statistics.qmd
              - text: "Economics"
                href: api/physics.economics.qmd
              - text: "Agents"
                href: api/physics.agents.qmd
              - text: "Drivetrain"
                href: api/physics.drivetrain.qmd
              - text: "Robotics: stopping"
                href: api/physics.robotics.stopping.qmd
              - text: "Robotics: actuation"
                href: api/physics.robotics.actuation.qmd
              - text: "Robotics: control"
                href: api/physics.robotics.control.qmd
              - text: "Robotics: perception"
                href: api/physics.robotics.perception.qmd
              - text: "Robotics: assurance"
                href: api/physics.robotics.assurance.qmd

      # ── UNDERSTAND ───────────────────────────────────
      - section: "Concepts"
        contents:
          - philosophy.qmd
          - architecture.qmd
          - math.qmd
          - accuracy.qmd
          - understanding-efficiency.md
          - empirical-calibration.md
          - api-stability.md
          - glossary.qmd

      # ── CONTRIBUTE ───────────────────────────────────
      - section: "Contribute"
        contents:
          - extending-the-engine.qmd
          - provenance.qmd
          - contributing.qmd

  # Footer — ecosystem pattern (matches Kits and TinyTorch)
  page-footer:
    left: |
      &copy; 2024-2026 Harvard University. Code: <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache-2.0</a> · Docs: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC-BY-NC-SA 4.0</a>
    center: |
      Part of the <a href="../">Machine Learning Systems</a> textbook · <a href="mlsysim-paper.pdf" target="_blank">MLSys·im paper (PDF)</a>
    right:
      - text: |
          <span class="release-pill" data-release-pill></span>
      - icon: github
        href: "https://github.com/harvard-edge/cs249r_book"
        aria-label: "View source on GitHub"
    background: light
    border: true

bibliography: references.bib
csl: config/ieee.csl

format:
  html:
    theme:
      light:
        - default
        - styles/style.scss
      dark:
        - default
        - styles/style.scss
        - styles/dark-mode.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    highlight-style:
      light: github
      dark: github-dark
    link-external-icon: false
    link-external-newwindow: false
    anchor-sections: true
    fig-width: 7
    fig-height: 4.5
    fig-format: png
    fig-dpi: 120
    include-in-header:
      - file: ../../shared/config/site-head.html
      - text: |
          <meta name="theme-color" content="#0284C7">
          <!-- Absolute URLs: Quarto rewrites root-relative paths in header
               includes against the project root (/mlsysim/x -> ./mlsysim/x). -->
          <link rel="apple-touch-icon" href="https://mlsysbook.ai/mlsysim/apple-touch-icon.png">
          <link rel="manifest" href="https://mlsysbook.ai/mlsysim/site.webmanifest">
          <!-- Release identity (rendered into the footer pill below).
               The publish workflow drops release-manifest.json at the
               site root before deploy. -->
          <meta name="release-manifest" content="/mlsysim/release-manifest.json">
    include-after-body:
      - text: |
          <script src="https://mlsysbook.ai/mlsysim/scripts/subscribe-modal.js" defer></script>
      - file: config/sidebar-brand.html
      - file: ../../shared/release/release-pill.html

# Announcement bar configuration
metadata-files:
  - ../../shared/config/navbar-common.yml
  - config/announcement.yml

quartodoc:
  # Regenerated on every preview/publish (see mlsysim-*.yml workflows) and
  # checked for drift by mlsysim/docs/scripts/check_api_coverage.py.
  # Do not hand-edit files under api/; edit docstrings or this block instead.
  package: mlsysim
  dir: api
  title: API Reference
  renderer:
    style: markdown
    display_name: relative
  options:
    include_imports: false
    include_inherited: false
  sections:
    - title: Engine and scenarios
      desc: Entry points that turn a workload and a system into an estimate.
      contents:
        - engine.engine.Engine
        - engine.scenarios.Scenario
        - engine.dse.DSE
        - engine.calibration

    - title: Workloads and systems
      desc: Typed objects that describe what runs and what it runs on.
      contents:
        - models.types.Workload
        - models.types.TransformerWorkload
        - models.types.SparseTransformerWorkload
        - models.types.CNNWorkload
        - hardware.HardwareNode
        - systems.types.Node
        - systems.types.Fleet

    - title: Registries
      desc: Vetted, sourced catalogs of hardware, models, fleets, and physical systems. Browse their contents in the Zoo.
      contents:
        - hardware.Hardware
        - models.Models
        - systems.Systems
        - infrastructure.Infrastructure
        - platforms.Platforms
        - datasets.Datasets
        - literature.Literature
        - ops.Ops
        - embodied.Embodied
        - embodied.EmbodiedPlatform
        - sensors.Sensors
        - sensors.Sensor
        - actuators.Actuators
        - actuators.ActuatorJoint
        - agents.Agents
        - agents.AgentArchitecture
        - agents.AgentWorkload

    - title: Solvers
      desc: Analytical models, solvers, and optimizers. Import them from `mlsysim.solvers`.
      contents:
        - solvers.SingleNodeModel
        - solvers.NetworkRooflineModel
        - solvers.EfficiencyModel
        - solvers.ForwardModel
        - solvers.ServingModel
        - solvers.TrainingMemoryModel
        - solvers.ServingCapacityModel
        - solvers.ContinuousBatchingModel
        - solvers.WeightStreamingModel
        - solvers.TailLatencyModel
        - solvers.DataModel
        - solvers.TransformationModel
        - solvers.TopologyModel
        - solvers.ScalingModel
        - solvers.InferenceScalingModel
        - solvers.CompressionModel
        - solvers.DistributedModel
        - solvers.MoERoutingModel
        - solvers.ReliabilityModel
        - solvers.OrchestrationModel
        - solvers.EconomicsModel
        - solvers.SustainabilityModel
        - solvers.CheckpointModel
        - solvers.ResponsibleEngineeringModel
        - solvers.SensitivitySolver
        - solvers.SynthesisSolver
        - solvers.ParallelismOptimizer
        - solvers.BatchingOptimizer
        - solvers.PlacementOptimizer

    - title: "Physics: compute and memory"
      desc: Closed-form formulas behind the solvers. Every function is also importable from `mlsysim.physics`.
      contents:
        - name: physics.performance
          children: embedded
        - name: physics.memory
          children: embedded
        - name: physics.transformer
          children: embedded
        - name: physics.quantities
          children: embedded

    - title: "Physics: communication and serving"
      contents:
        - name: physics.communication
          children: embedded
        - name: physics.networking
          children: embedded
        - name: physics.serving
          children: embedded

    - title: "Physics: reliability, statistics, and economics"
      contents:
        - name: physics.reliability
          children: embedded
        - name: physics.statistics
          children: embedded
        - name: physics.economics
          children: embedded

    - title: "Physics: agents and physical AI"
      contents:
        - name: physics.agents
          children: embedded
        - name: physics.drivetrain
          children: embedded
        - name: physics.robotics.stopping
          children: embedded
        - name: physics.robotics.actuation
          children: embedded
        - name: physics.robotics.control
          children: embedded
        - name: physics.robotics.perception
          children: embedded
        - name: physics.robotics.assurance
          children: embedded

    - title: Provenance and formatting
      desc: How sourced values carry their audit trail, and how quantities are formatted for prose.
      contents:
        - core.provenance.Provenance
        - core.provenance.ProvenanceKind
        - core.provenance.Sourced
        - fmt.fmt
        - fmt.fmt_int
