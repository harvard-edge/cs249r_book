# -----------------------------------------------------------------------------
# Per-tutorial textbook reading bridges ("Where This Clicks in the Textbook")
# -----------------------------------------------------------------------------
tutorials:
  00_hello_roofline:
    links:
      - ref: "vol1.11_hw_acceleration"
        role: "Foundation"
        why: "Derives the Roofline model, arithmetic intensity, and ridge points from systolic-array and HBM physics."
      - ref: "vol1.05_nn_computation"
        role: "Workload Math"
        why: "Counts layer FLOPs, parameter bytes, and intermediate feature-map traffic that set arithmetic intensity."
      - ref: "vol1.12_benchmarking"
        role: "Measurement"
        why: "Shows how to validate analytical Roofline bounds against hardware counters without measurement traps."

  01_memory_wall:
    links:
      - ref: "vol1.11_hw_acceleration"
        role: "Single Chip"
        why: "Explains why peak Tensor Core FLOP/s outpaced HBM bandwidth and pushed batch-1 inference below the ridge point."
      - ref: "vol2.02_compute_infrastructure"
        role: "Fleet Silicon"
        why: "Compares HBM generations, memory capacity tiers, and bandwidth-per-dollar across datacenter accelerators."
      - ref: "vol2.09_performance_engineering"
        role: "Optimization"
        why: "Covers operator fusion and SRAM tiling (FlashAttention) to cut HBM round-trips when bandwidth binds."

  02_two_phases:
    links:
      - ref: "vol1.13_model_serving"
        role: "Single Node"
        why: "Formalizes Time to First Token (compute-bound prefill) vs. Inter-Token Latency (memory-bound decode)."
      - ref: "vol1.06_nn_architectures"
        role: "Architecture"
        why: "Contrasts quadratic self-attention prefill FLOPs against single-token autoregressive decoding."
      - ref: "vol2.10_inference"
        role: "At Scale"
        why: "Scales two-phase serving with continuous batching, chunked prefill, and prefill/decode disaggregation."
      - ref: "vol3.02_foundation_model"
        role: "Agent Loops"
        why: "Shows how multi-turn agent calls repeatedly pay prefill and decode latency across long tool horizons."

  03_kv_cache:
    links:
      - ref: "vol1.13_model_serving"
        role: "KV Sizing"
        why: "Derives exact KV-cache byte growth with sequence length, batch size, and Grouped-Query Attention (GQA)."
      - ref: "vol2.10_inference"
        role: "PagedAttention"
        why: "Replaces contiguous max-length reservation with block-paged KV allocation to eliminate fragmentation."
      - ref: "vol3.05_kv_cache"
        role: "Agent State"
        why: "Extends KV management to multi-turn prefix caching, eviction policies, and long-running agent sessions."
      - ref: "vol3.04_context_engineering"
        role: "Context Budget"
        why: "Balances prompt assembly and compaction cadence when append-only trajectories exhaust KV memory."

  04_starving_the_gpu:
    links:
      - ref: "vol1.04_data_engineering"
        role: "Single Node"
        why: "Analyzes storage ingestion, CPU decoding/augmentation pipelines, and host-to-device PCIe bottlenecks."
      - ref: "vol2.04_data_storage"
        role: "At Scale"
        why: "Scales dataset streaming, distributed caching, and checkpoint I/O bandwidth across multi-node clusters."
      - ref: "vol4.05_data"
        role: "Physical AI"
        why: "Applies ingestion and replay-bandwidth accounting to multi-modal robot sensor logs."

  05_quantization:
    links:
      - ref: "vol1.10_model_compression"
        role: "Core Theory"
        why: "Covers PTQ, QAT, group-quantization scale overhead, structured sparsity, and accuracy-fidelity trade-offs."
      - ref: "vol1.11_hw_acceleration"
        role: "Silicon Support"
        why: "Distinguishes weight-only dequantization (W4A16 bandwidth relief) from native INT8/FP8 Tensor Core throughput."
      - ref: "vol2.11_edge_intelligence"
        role: "Edge Envelopes"
        why: "Applies aggressive quantization and pruning to fit strict on-device SRAM, DRAM, and milliwatt budgets."

  distributed:
    links:
      - ref: "vol2.05_collective_communication"
        role: "Collectives"
        why: "Derives alpha-beta latency and bandwidth bounds for Ring AllReduce, Tree AllReduce, ReduceScatter, and All-to-All."
      - ref: "vol2.06_distributed_training"
        role: "4D Parallelism"
        why: "Composes DP, TP, PP (1F1B bubbles), ZeRO sharding, and Expert Parallelism across cluster hierarchies."
      - ref: "vol2.03_network_fabrics"
        role: "Fabrics"
        why: "Explains NVLink vs. InfiniBand/RoCE hierarchies, fat-tree bisection bandwidth, and oversubscription."

  06_scaling_1000_gpus:
    links:
      - ref: "vol2.06_distributed_training"
        role: "Scaling Laws"
        why: "Analyzes how communication-to-computation ratio and pipeline bubbles erode MFU at thousand-GPU scale."
      - ref: "vol2.07_fault_tolerance"
        role: "Reliability"
        why: "Derives cluster MTBF degradation (M/N) and the Young-Daly optimal checkpoint interval."
      - ref: "vol2.08_fleet_orchestration"
        role: "Scheduling"
        why: "Covers topology-aware gang scheduling, spare-node pools, and elastic recovery after node failures."
      - ref: "vol3.11_durable_execution"
        role: "Durable State"
        why: "Carries checkpoint/replay economics into long-horizon stateful agent workflows."

  07_geography:
    links:
      - ref: "vol2.15_sustainable_ai"
        role: "Core Theory"
        why: "Formulates operational energy (PUE), grid carbon intensity, embodied carbon, and site-based water usage (WUE)."
      - ref: "vol2.02_compute_infrastructure"
        role: "Datacenters"
        why: "Examines power delivery, air vs. liquid cooling loops, and geographic siting constraints."
      - ref: "vol1.15_responsible_engr"
        role: "Governance"
        why: "Places environmental footprint alongside privacy and fairness in system-level engineering trade-offs."

  08_nine_million_dollar:
    links:
      - ref: "vol2.02_compute_infrastructure"
        role: "Fleet TCO"
        why: "Breaks down amortized CapEx, facility power OpEx, and utilization break-even between cloud and on-prem."
      - ref: "vol2.10_inference"
        role: "Serving Cost"
        why: "Shows why lifetime serving fleet CapEx/OpEx dominates one-time training cost at production QPS."
      - ref: "vol3.03_test_time_compute"
        role: "Reasoning Scale"
        why: "Quantifies how Chain-of-Thought length and best-of-N deliberation multiply token budgets per query."
      - ref: "vol3.19_agent_economics"
        role: "Task Economics"
        why: "Models total cost per accepted task when retries, tool calls, and verification loops compound."

  09_sensitivity:
    links:
      - ref: "vol1.12_benchmarking"
        role: "Diagnostics"
        why: "Teaches systematic bottleneck attribution, ablation discipline, and Amdahl/Roofline sensitivity reasoning."
      - ref: "vol2.09_performance_engineering"
        role: "Optimization Loop"
        why: "Uses marginal elasticity to prioritize kernel, memory, or fabric investments that move the binding wall."
      - ref: "vol1.11_hw_acceleration"
        role: "Co-Design"
        why: "Applies inverse-Roofline synthesis to derive minimum bandwidth and FLOP/s targets from an SLA."

  10_gpu_vs_wafer:
    links:
      - ref: "vol1.11_hw_acceleration"
        role: "Architectures"
        why: "Contrasts HBM-backed GPU dataflows against wafer-scale SRAM weight-streaming architectures."
      - ref: "vol2.02_compute_infrastructure"
        role: "System Envelope"
        why: "Evaluates packaging, power density, memory disaggregation, and interconnect trade-offs across custom silicon."

  11_training_memory_capacity_moe:
    links:
      - ref: "vol1.08_training"
        role: "Training State"
        why: "Decomposes mixed-precision weights, gradients, Adam optimizer state, and activation checkpointing."
      - ref: "vol2.06_distributed_training"
        role: "ZeRO & MoE"
        why: "Shards training state across DP/TP/PP/EP ranks and models sparse MoE hot-expert all-to-all imbalance."
      - ref: "vol2.10_inference"
        role: "Replica Sizing"
        why: "Combines paged KV concurrency with M/M/c tail-latency queueing to size serving replicas for P99 SLAs."

  12_design_space_exploration:
    links:
      - ref: "vol1.02_system_paradigms"
        role: "Design Space"
        why: "Frames ML systems engineering as constrained multi-objective optimization across latency, cost, and quality."
      - ref: "vol2.08_fleet_orchestration"
        role: "Resource Allocation"
        why: "Maps declarative SLA constraints and Pareto trade-offs onto heterogeneous cluster hardware."
      - ref: "vol4.13_placement"
        role: "Onboard vs. Cloud"
        why: "Extends design-space search to partitioning perception and planning across robot compute and cloud links."

  12_full_stack_audit:
    links:
      - ref: "vol1.08_training"
        role: "Single-Node Base"
        why: "Establishes the 6PD training compute rule and per-GPU memory state before scaling out."
      - ref: "vol2.06_distributed_training"
        role: "Cluster Scale"
        why: "Connects 4D parallelism, fabric bandwidth, and scaling efficiency across a frontier training cluster."
      - ref: "vol2.07_fault_tolerance"
        role: "Goodput"
        why: "Couples failure rates and checkpoint I/O bursts to net cluster goodput over multi-week runs."
      - ref: "vol2.15_sustainable_ai"
        role: "TCO & Carbon"
        why: "Closes the end-to-end audit with total energy, water, carbon emissions, and amortized dollar cost."

  01_pipeline_callbacks:
    links:
      - ref: "vol1.07_frameworks"
        role: "Graph & Passes"
        why: "Mirrors how ML compilers and execution engines compose modular passes and instrumentation hooks."
      - ref: "vol1.14_ml_ops"
        role: "Telemetry"
        why: "Connects solver pipeline callbacks to experiment tracking, artifact lineage, and operational telemetry."

  02_differential_explainer:
    links:
      - ref: "vol1.12_benchmarking"
        role: "Regime Shifts"
        why: "Explains why hardware or batch-size changes trigger non-linear bottleneck transitions across the ridge point."
      - ref: "vol2.09_performance_engineering"
        role: "Root-Cause Attribution"
        why: "Automates comparative bottleneck diagnosis before committing engineering time to kernel rewrites."

# -----------------------------------------------------------------------------
# Cross-Volume Physics Threads ("How One Constraint Connects Volumes I–IV")
# -----------------------------------------------------------------------------
threads:
  - id: "roofline-compute"
    title: "1. Compute, Bandwidth & the Roofline Ceiling"
    summary: "Every ML workload is bounded by the slower of arithmetic throughput and data movement. Across the four volumes, that single ratio governs GPU kernels, cluster fabrics, reasoning token budgets, and real-time robot compute."
    solvers: ["SingleNodeModel", "EfficiencyModel", "InferenceScalingModel", "SynthesisSolver"]
    tutorials:
      - { title: "0 · Hello, Roofline", href: "tutorials/00_hello_roofline.qmd" }
      - { title: "1 · The Memory Wall", href: "tutorials/01_memory_wall.qmd" }
      - { title: "10 · GPU vs. Wafer", href: "tutorials/10_gpu_vs_wafer.qmd" }
    stops:
      - ref: "vol1.11_hw_acceleration"
        note: "Single-chip arithmetic intensity, Tensor Cores, HBM bandwidth, and the ridge point."
      - ref: "vol2.09_performance_engineering"
        note: "Kernel fusion and SRAM tiling (FlashAttention IO complexity) across fleet accelerators."
      - ref: "vol3.03_test_time_compute"
        note: "Inference-time compute scaling: reasoning steps and verification budgets per query."
      - ref: "vol4.03_brain"
        note: "Onboard sensorimotor compute ceilings under hard millisecond control deadlines."

  - id: "stateful-inference"
    title: "2. Two-Phase Inference & Stateful Memory"
    summary: "Autoregressive generation splits into compute-bound prefill and memory-bound decode, while retained state grows with horizon—from single-request KV caches to paged fleet pools, agent trajectories, and 3D spatial maps."
    solvers: ["ServingModel", "ContinuousBatchingModel", "ServingCapacityModel", "AppendOnlyContextModel", "ObservationAgeModel"]
    tutorials:
      - { title: "2 · Two Phases", href: "tutorials/02_two_phases.qmd" }
      - { title: "3 · KV-Cache Tax", href: "tutorials/03_kv_cache.qmd" }
      - { title: "11 · Capacity & MoE", href: "tutorials/11_training_memory_capacity_moe.qmd" }
    stops:
      - ref: "vol1.13_model_serving"
        note: "TTFT vs. ITL physics and per-token GQA KV-cache capacity on one accelerator."
      - ref: "vol2.10_inference"
        note: "PagedAttention fragmentation bounds, chunked prefill stalls, and M/M/c replica sizing."
      - ref: "vol3.05_kv_cache"
        note: "Prefix-cache hit economics and append-only context growth across multi-turn agent loops."
      - ref: "vol4.09_memory"
        note: "Bounded spatial memory, voxel raymarching traffic, and map freshness in physical environments."

  - id: "compression-fidelity"
    title: "3. Precision, Quantization & Fidelity Margins"
    summary: "Lowering bitwidth shrinks memory footprint and raises arithmetic intensity, but effective savings depend on group-scale overhead, hardware Tensor Core support, and how much error the downstream task or control loop can tolerate."
    solvers: ["CompressionModel", "PrecisionDividendModel", "StoppingBudgetModel"]
    tutorials:
      - { title: "5 · Quantization Regimes", href: "tutorials/05_quantization.qmd" }
      - { title: "9 · Sensitivity Analysis", href: "tutorials/09_sensitivity.qmd" }
    stops:
      - ref: "vol1.10_model_compression"
        note: "Group quantization (b_eff = b + b_scale/g), structured sparsity, and regime-dependent speedup."
      - ref: "vol2.11_edge_intelligence"
        note: "Fitting foundation and vision models inside edge DRAM, SRAM, and battery envelopes."
      - ref: "vol3.02_foundation_model"
        note: "Capability-per-bit trade-offs when quantized models drive multi-step tool calling."
      - ref: "vol4.12_enforcement"
        note: "Worst-case perception error and latency margins inside physical safety envelopes."

  - id: "data-parallelism-fabrics"
    title: "4. Data Pipelines, Fabrics & Distributed Coordination"
    summary: "Fast silicon starves whenever host preprocessing, storage, network collectives, RPC sandboxes, or deterministic fieldbuses cannot deliver bytes in time."
    solvers: ["DataModel", "TransformationModel", "DistributedModel", "MoERoutingModel", "TopologyModel", "EtherCatCycleModel"]
    tutorials:
      - { title: "4 · Starving the GPU", href: "tutorials/04_starving_the_gpu.qmd" }
      - { title: "Distributed Training", href: "tutorials/distributed.qmd" }
      - { title: "6 · Scaling to 1000 GPUs", href: "tutorials/06_scaling_1000_gpus.qmd" }
    stops:
      - ref: "vol1.04_data_engineering"
        note: "Storage read rates and CPU decode/augmentation pipelines feeding a local accelerator."
      - ref: "vol2.06_distributed_training"
        note: "4D parallelism (DP/TP/PP/EP), Ring/Tree AllReduce, pipeline bubbles, and MoE All-to-All."
      - ref: "vol3.18_multi_agent"
        note: "Tool-sandbox serialization overhead and coordination fan-out across multi-agent graphs."
      - ref: "vol4.04_nervous"
        note: "CAN-FD and EtherCAT cycle-time budgets linking sensors, compute, and actuators."

  - id: "reliability-recovery"
    title: "5. Fault Tolerance, Checkpointing & Recovery"
    summary: "At scale or over long horizons, component and step failures become routine. Analytical checkpointing and replay budgets separate net useful progress (goodput) from raw throughput."
    solvers: ["ReliabilityModel", "CheckpointModel", "GroupCommitModel", "RepairBreakEvenModel", "TakeoverBudgetModel"]
    tutorials:
      - { title: "6 · Scaling to 1000 GPUs", href: "tutorials/06_scaling_1000_gpus.qmd" }
      - { title: "13 · Full-Stack Audit", href: "tutorials/12_full_stack_audit.qmd" }
    stops:
      - ref: "vol1.14_ml_ops"
        note: "Monitoring, silent degradation, and rollback contracts for single-service deployments."
      - ref: "vol2.07_fault_tolerance"
        note: "Series cluster MTBF (M/N) and Young-Daly optimal checkpoint waste."
