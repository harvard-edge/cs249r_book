<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="100%" height="100%" style="background-color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b" />
    </marker>
    <style>
      .node-rect { stroke-width: 1.5; rx: 6; ry: 6; }
      .node-text-title { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .node-text-sub { font-size: 11px; fill: #475569; text-anchor: middle; }
      .edge-line { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .edge-label { font-size: 11px; fill: #475569; text-anchor: middle; font-weight: 500; }
      .layer-label { font-size: 11px; fill: #334155; text-anchor: middle; font-weight: 600; }
    </style>
  </defs>

  <!-- Dashed bounding box for Layer D: Systems (drawn first so edges/labels sit cleanly above) -->
  <rect x="36" y="122" width="388" height="196" fill="#f8fafc" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,4" rx="8" />
  <rect x="54" y="113" width="116" height="18" rx="4" fill="white" />
  <text x="112" y="126" class="layer-label">Layer D: Systems</text>

  <!-- HardwareNode (Layer B) -->
  <g transform="translate(260, 28)">
    <rect width="136" height="52" class="node-rect" fill="#e0f2fe" stroke="#0284c7" />
    <text x="68" y="23" class="node-text-title">HardwareNode</text>
    <text x="68" y="39" class="node-text-sub">Silicon / Chip</text>
  </g>

  <!-- Edge: HardwareNode -> Node -->
  <path d="M 328 80 L 328 140" class="edge-line" marker-end="url(#arrowhead)" />
  <rect x="292" y="99" width="72" height="16" rx="3" fill="white" />
  <text x="328" y="111" class="edge-label">accelerates</text>

  <!-- NetworkFabric -->
  <g transform="translate(60, 142)">
    <rect width="136" height="52" class="node-rect" fill="white" stroke="#94a3b8" />
    <text x="68" y="23" class="node-text-title">NetworkFabric</text>
    <text x="68" y="39" class="node-text-sub">Interconnect</text>
  </g>

  <!-- Node -->
  <g transform="translate(260, 142)">
    <rect width="136" height="52" class="node-rect" fill="white" stroke="#94a3b8" />
    <text x="68" y="23" class="node-text-title">Node</text>
    <text x="68" y="39" class="node-text-sub">Server Chassis</text>
  </g>

  <!-- Edge: Node -> Fleet -->
  <path d="M 328 194 L 328 246" class="edge-line" marker-end="url(#arrowhead)" />
  <rect x="295" y="210" width="66" height="16" rx="3" fill="white" />
  <text x="328" y="222" class="edge-label">composes</text>

  <!-- Edge: NetworkFabric -> Fleet (connects to left edge of Fleet) -->
  <path d="M 128 194 C 128 274, 195 274, 258 274" class="edge-line" marker-end="url(#arrowhead)" />
  <rect x="148" y="253" width="58" height="16" rx="3" fill="white" />
  <text x="177" y="265" class="edge-label">connects</text>

  <!-- Fleet -->
  <g transform="translate(260, 248)">
    <rect width="136" height="52" class="node-rect" fill="#e0f2fe" stroke="#0284c7" />
    <text x="68" y="23" class="node-text-title">Fleet</text>
    <text x="68" y="39" class="node-text-sub">Cluster</text>
  </g>

  <!-- Edge: Fleet -> Datacenter (label sits below dashed Layer D border) -->
  <path d="M 328 300 L 328 376" class="edge-line" marker-end="url(#arrowhead)" />
  <rect x="290" y="336" width="76" height="16" rx="3" fill="white" />
  <text x="328" y="348" class="edge-label">is hosted in</text>

  <!-- GridProfile (Layer C) -->
  <g transform="translate(44, 378)">
    <rect width="136" height="52" class="node-rect" fill="#dcfce7" stroke="#16a34a" />
    <text x="68" y="23" class="node-text-title">GridProfile</text>
    <text x="68" y="39" class="node-text-sub">Regional Power</text>
  </g>

  <!-- Datacenter (Layer C) -->
  <g transform="translate(260, 378)">
    <rect width="136" height="52" class="node-rect" fill="white" stroke="#94a3b8" />
    <text x="68" y="23" class="node-text-title">Datacenter</text>
    <text x="68" y="39" class="node-text-sub">Physical Facility</text>
  </g>

  <!-- Edge: GridProfile -> Datacenter -->
  <path d="M 180 404 L 258 404" class="edge-line" marker-end="url(#arrowhead)" />
  <rect x="194" y="396" width="46" height="16" rx="3" fill="white" />
  <text x="217" y="408" class="edge-label">powers</text>
</svg>