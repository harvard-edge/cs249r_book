# Added 2026-09-28. STM32F407 (Cortex-M4F). See prov:st-stm32f407-datasheet:
# capacity/SRAM/flash/clock are datasheet figures; peak_flops (1 SP FLOP per
# cycle) and memory.bandwidth (32-bit AHB x 168 MHz = 672 MB/s) are derived.
__key__: STM32F4
name: STM32F407 (Cortex-M4F)
release_year: 2011
compute:
  peak_flops: 168 MFLOPs / s
  precision_flops: {}
  clock_rate: 168 MHz
memory:
  capacity: 192 KiB
  bandwidth: 672 MB / s
  sram_capacity: 192 KiB
  flash_capacity: 1 MiB
metadata:
  provenance: '@prov:ST_STM32F407_DATASHEET'
