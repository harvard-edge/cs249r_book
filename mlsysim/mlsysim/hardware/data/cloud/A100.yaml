__key__: A100
name: NVIDIA A100
release_year: 2020
compute:
  peak_flops: 312.0 TFLOPs / s
  precision_flops:
    fp32: 19.5 TFLOPs / s
    tf32: 156.0 TFLOPs / s
    int8: 624 TOPS
    fp16_sparse: 624.0 TFLOPs / s
memory:
  capacity: 80 GiB
  bandwidth: 2039.0 GB / s
interconnect:
  name: PCIe Gen4 x16
  bandwidth: 32.0 GB / s
nvlink:
  name: NVLink 3.0
  direction: bidirectional_total  # datasheet quotes send+receive summed
  bandwidth: 600.0 GB / s
  latency: '@tech:Interconnect.NVLink.latency'
tdp: 400 W
unit_cost: 15000 dollar
# Manufacturing embodied carbon per A100, ~150 kg CO2e (Luccioni et al. 2023,
# "Estimating the Carbon Footprint of BLOOM"; arxiv.org/abs/2211.02001). Cited
# directly in the sustainable_ai chapter; aligns registry, cells, and prose.
embodied_carbon_kg: 150.0
dispatch_tax: 0.015 ms
# A100-80GB Multi-Instance GPU partition profiles (NVIDIA MIG User Guide:
# docs.nvidia.com/datacenter/tesla/mig-user-guide). Each compute slice is 14 SMs
# (7 slices = 98 usable SMs of 108); each memory slice is 10 GB (8 slices = 80 GB).
mig_profiles:
  - name: "1g.10gb"
    gpu_memory: 10 GiB
    sm_count: 14
    typical_workload: Small inference
  - name: "2g.20gb"
    gpu_memory: 20 GiB
    sm_count: 28
    typical_workload: Medium inference
  - name: "3g.40gb"
    gpu_memory: 40 GiB
    sm_count: 42
    typical_workload: Large inference
  - name: "7g.80gb"
    gpu_memory: 80 GiB
    sm_count: 98
    typical_workload: Training
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA A100 datasheet; Choquette et al. (2021), IEEE Micro
    url: https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-us-nvidia-1758950-r4-web.pdf
    verified: '2026-03-06'
    id: prov:nvidia-a100-datasheet
