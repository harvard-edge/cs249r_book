# Added 2026-09-28. The 40 GB HBM2 SKU of the A100 (SXM4). Compute, host I/O,
# and NVLink are identical to the 80 GB SKU (A100.yaml); memory, bandwidth,
# and the MIG profile set differ (NVIDIA A100 datasheet; MIG User Guide).
__key__: A100_40GB
name: NVIDIA A100 40GB
release_year: 2020
compute:
  peak_flops: 312.0 TFLOPs / s
  precision_flops:
    fp32: 19.5 TFLOPs / s
    tf32: 156.0 TFLOPs / s
    int8: 624 TOPS
    fp16_sparse: 624.0 TFLOPs / s
memory:
  capacity: 40 GiB
  bandwidth: 1555.0 GB / s
interconnect:
  name: PCIe Gen4 x16
  bandwidth: 32.0 GB / s
nvlink:
  name: NVLink 3.0
  direction: bidirectional_total  # datasheet quotes send+receive summed
  bandwidth: 600.0 GB / s
  latency: '@tech:Interconnect.NVLink.latency'
tdp: 400 W
dispatch_tax: 0.015 ms
# A100-40GB MIG profiles (NVIDIA MIG User Guide): 7 compute slices of 14 SMs,
# 8 memory slices of 5 GB.
mig_profiles:
  - name: "1g.5gb"
    gpu_memory: 5 GiB
    sm_count: 14
    typical_workload: Small inference
  - name: "2g.10gb"
    gpu_memory: 10 GiB
    sm_count: 28
    typical_workload: Medium inference
  - name: "3g.20gb"
    gpu_memory: 20 GiB
    sm_count: 42
    typical_workload: Large inference
  - name: "7g.40gb"
    gpu_memory: 40 GiB
    sm_count: 98
    typical_workload: Training
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA A100 datasheet (40GB SXM column); NVIDIA MIG User Guide
    url: https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-us-nvidia-1758950-r4-web.pdf
    verified: '2026-09-28'
    id: prov:nvidia-a100-datasheet
