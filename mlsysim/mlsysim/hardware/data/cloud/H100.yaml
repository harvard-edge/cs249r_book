__key__: H100
name: NVIDIA H100
release_year: 2022
compute:
  peak_flops: 989.0 TFLOPs / s
  precision_flops:
    tf32: 494.0 TFLOPs / s
    fp16_dense: 989.0 TFLOPs / s
    fp16_sparse: 1979.0 TFLOPs / s
    fp8: 1979.0 TFLOPs / s
    int8: 1979 TOPS
    # Added 2026-10-20: the datasheet's starred rows (2:4 structured sparsity),
    # quoted as printed (nvidia.com/en-us/data-center/h100, retrieved 2026-10-18);
    # each is twice the dense rate above.
    tf32_sparse: 989.0 TFLOPs / s
    int8_sparse: 3958 TOPS
    fp32: 67.0 TFLOPs / s  # non-tensor CUDA-core FP32; must use the canonical 'fp32' key so resolve_precision('fp32') reaches it (was 'fp32_cuda', which fell through to peak_flops=989, the FP16 rate)
  sm_count: 132
  fp32_cores_per_sm: 128  # NVIDIA Hopper Architecture In-Depth, Table 3 (H100 SXM5): 16,896 FP32 cores per GPU
  tensor_cores_per_sm: 4  # same table: 528 Tensor Cores per GPU
memory:
  capacity: 80 GiB
  bandwidth: 3.35 TB / s
  l2_cache: 50 MiB
  register_file_per_sm: 256 KiB
  shared_memory_per_sm: 228 KiB
  hbm_stacks: 5  # five active HBM3 stacks of six sites (prov:nvidia-hopper-blackwell-hbm-stacks)
storage:
  capacity: 2 TiB
  bandwidth: 7.0 GB / s
interconnect:
  name: PCIe Gen5 x16
  bandwidth: 64.0 GB / s
nvlink:
  name: NVLink 4.0
  direction: bidirectional_total  # datasheet quotes send+receive summed
  bandwidth: 900.0 GB / s
  latency: '@tech:Interconnect.NVLink.latency'
tdp: 700 W
die_area: 814 mm^2
transistor_count: 80.0e9  # 80 billion transistors (NVIDIA Hopper Architecture In-Depth); added 2026-10-20
unit_cost: 25000 dollar
unit_cost_max: 30000 dollar
embodied_carbon_kg: 164.0
dispatch_tax: 0.01 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA H100 datasheet; NVIDIA Hopper Architecture In-Depth; Choquette (2023), IEEE Micro; NVIDIA HGX H100 product carbon footprint
    url: https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/
    verified: '2026-06-11'
    notes: die_area is the GH100 GPU die size reported in NVIDIA Hopper architecture material; unit_cost/unit_cost_max capture the representative $25K-$30K H100 list-price range used for cost-performance examples.
    id: prov:nvidia-h100-datasheet
