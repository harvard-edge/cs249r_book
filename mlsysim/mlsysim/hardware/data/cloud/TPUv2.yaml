__key__: TPUv2
name: Google TPU v2
# Announced Google I/O May 2017; Jouppi et al. (2021, ISCA) Table 1 lists TPUv2
# "First deployed (GA date) Q3 2017". Registry TPU convention = public
# announcement year (cf. TPUv3 2018, TPUv4 2021).
release_year: 2017
# Jouppi et al. (2020), CACM 63(7), Table 3 "Key processor features":
# Peak TeraFLOPS/Chip 46 (bf16); Memory 32MiB/16GiB; Memory GB/s/Chip 700;
# TDP (Watts)/Chip 280. 46 = 2 cores x 1 MXU x 128x128 x 2 FLOP x 700 MHz (45.9).
# The 45 TFLOP/s figure is 11.5 PFLOP/s / 256 chips from the Hot Chips 2020 pod slide;
# the 180 TFLOP/s Cloud TPU v2 device rating is a 4-chip board.
compute:
  peak_flops: 46.0 TFLOPs / s
  precision_flops:
    bf16: 46.0 TFLOPs / s
memory:
  capacity: 16 GiB
  bandwidth: 700.0 GB / s
tdp: 280 W
dispatch_tax: 0.04 ms
metadata:
  provenance:
    kind: literature
    ref: Jouppi et al. (2020), A Domain-Specific Supercomputer for Training Deep Neural Networks, CACM 63(7), Table 3
    url: https://doi.org/10.1145/3360307
    verified: '2026-09-29'
    id: prov:google-tpu-v2-v3
