__key__: TPUv4
name: Google TPU v4
release_year: 2021
compute:
  peak_flops: 275.0 TFLOPs / s
  precision_flops:
    bf16: 275.0 TFLOPs / s
memory:
  capacity: 32 GiB
  bandwidth: 1200.0 GB / s
# Inter-chip interconnect (ICI): "6 links @ 50 GB/s" (Jouppi et al. 2023, Table 4).
# The same table lists the A100 at "12 links @ 25 GB/s", i.e. NVLink 3.0 per
# direction, so the per-link rate is one-way: 6 x 50 = 300 GB/s per direction.
nvlink:
  name: ICI
  direction: per_direction
  bandwidth: 300.0 GB / s
tdp: 200 W
dispatch_tax: 0.04 ms
metadata:
  provenance:
    kind: literature
    ref: 'Jouppi et al. (2023), TPU v4: An Optically Reconfigurable Supercomputer for Machine Learning with Hardware Support for Embeddings, ISCA, Table 4'
    url: https://arxiv.org/abs/2304.01433
    verified: '2026-09-15'
    id: prov:google-tpu-v4
