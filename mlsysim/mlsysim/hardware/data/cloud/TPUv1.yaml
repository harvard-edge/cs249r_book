__key__: TPUv1
name: Google TPU v1
release_year: 2017
compute:
  peak_flops: 92 TOPS
  # Added 2026-10-20 (Jouppi et al. 2017, Sec. 2): a 256 x 256 array of 8-bit
  # MACs clocked at 700 MHz; 65,536 x 2 ops x 700 MHz gives the 92 TOPS peak.
  clock_rate: 700 MHz
  systolic_array_dim: 256
  precision_flops:
    int8: 92 TOPS
memory:
  capacity: 8 GiB
  bandwidth: 34.0 GB / s
  sram_capacity: 24 MiB  # Unified Buffer for activations (Jouppi et al. 2017); added 2026-10-20
tdp: 75 W
dispatch_tax: 0.05 ms
metadata:
  provenance:
    kind: literature
    ref: Jouppi et al. (2017), In-Datacenter Performance Analysis of a Tensor Processing Unit
    url: https://arxiv.org/abs/1704.04760
    verified: '2026-03-06'
    id: prov:google-tpu-v1
