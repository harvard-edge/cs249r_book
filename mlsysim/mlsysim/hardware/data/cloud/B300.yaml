__key__: B300
name: NVIDIA B300
release_year: 2025
compute:
  # Same convention as the B200 entry: HGX B300 8-GPU totals divided by 8, with
  # "Dense is 1/2 sparse spec shown" (FP16/BF16 36 PFLOPS sparse; FP8 72 PFLOPS
  # sparse; FP4 144 sparse | 108 dense). The per-GPU blog table states FP8 5 | 10
  # and NVFP4 15 | 20 PFLOPS dense | sparse; the two NVIDIA sources differ, and the
  # HGX table is kept so B200 and B300 compare on one basis.
  peak_flops: 2250.0 TFLOPs / s
  precision_flops:
    fp16_dense: 2250.0 TFLOPs / s
    fp16_sparse: 4500.0 TFLOPs / s
    fp8: 4500.0 TFLOPs / s
    fp4: 13500.0 TFLOPs / s
memory:
  # Labeled capacity, stored as GiB like the B200 entry (labeled-capacity convention).
  capacity: 288 GiB
  bandwidth: 8.0 TB / s
tdp: 1400 W
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA Technical Blog, Inside NVIDIA Blackwell Ultra (2025-08-22), Table 2; NVIDIA HGX B300 specifications
    url: https://developer.nvidia.com/blog/inside-nvidia-blackwell-ultra-the-chip-powering-the-ai-factory-era/
    verified: '2026-11-20'
    notes: Blog states 288 GB HBM3E per GPU, 8 TB/s, and "Max power (TGP) Up to 1,400W". The HGX and DGX B300 pages state 2.1 TB total GPU memory for eight GPUs. Compute from https://www.nvidia.com/en-us/data-center/hgx/.
    id: prov:nvidia-b300-datasheet
