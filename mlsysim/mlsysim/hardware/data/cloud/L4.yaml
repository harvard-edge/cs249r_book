__key__: L4
name: NVIDIA L4
release_year: 2023
compute:
  peak_flops: 121.0 TFLOPs / s
  precision_flops:
    # The datasheet prints FP16 Tensor Core "242 teraFLOPS*" with "* Shown with sparsity. Specifications are
    # one-half lower without sparsity." The dense rate is peak_flops.
    fp16_sparse: 242.0 TFLOPs / s
    fp32: 30.3 TFLOPs / s
memory:
  capacity: 24 GiB
  bandwidth: 300.0 GB / s
tdp: 72 W
# Not on the datasheet: the T4's dispatch tax is reused for this PCIe inference part.
dispatch_tax: 0.03 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA L4 Tensor Core GPU product page
    url: https://www.nvidia.com/en-us/data-center/l4/
    verified: '2026-11-12'
    id: prov:nvidia-l4-datasheet
