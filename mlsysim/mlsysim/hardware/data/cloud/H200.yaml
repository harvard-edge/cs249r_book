__key__: H200
name: NVIDIA H200
release_year: 2023
compute:
  peak_flops: 989.0 TFLOPs / s
  precision_flops:
    tf32: 494.0 TFLOPs / s
    fp8: 1979.0 TFLOPs / s
    int8: 1979 TOPS
    fp32: 67.0 TFLOPs / s  # non-tensor CUDA-core FP32; must use the canonical 'fp32' key so resolve_precision('fp32') reaches it (was 'fp32_cuda', which fell through to peak_flops=989, the FP16 rate)
memory:
  # Fixed 2026-10-20: the registry stores the vendor's HBM label as GiB (H100 "80 GB" is
  # 80 GiB, MI300X "192 GB" is 192 GiB); this entry had converted NVIDIA's "141 GB"
  # to 131 GiB, which made H200/H100 capacity 1.6x instead of the labeled 1.76x.
  capacity: 141 GiB
  bandwidth: 4.8 TB / s
storage:
  capacity: 4 TiB
  bandwidth: 7.0 GB / s
interconnect:
  name: PCIe Gen5 x16
  bandwidth: 64.0 GB / s
nvlink:
  name: NVLink 4.0
  direction: bidirectional_total  # datasheet quotes send+receive summed
  bandwidth: 900.0 GB / s
  latency: '@tech:Interconnect.NVLink.latency'
tdp: 700 W
unit_cost: 35000 dollar
dispatch_tax: 0.01 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA H200 Tensor Core GPU product documentation
    url: https://www.nvidia.com/en-us/data-center/h200/
    verified: '2026-03-06'
    id: prov:nvidia-h200-datasheet
