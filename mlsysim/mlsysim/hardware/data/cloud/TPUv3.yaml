__key__: TPUv3
name: Google TPU v3
# Announced Google I/O May 2018; Jouppi et al. 2023 Table 4 lists TPU v3
# "Production deployment 2018". Registry TPU convention = public announcement year (cf. TPUv4 2021).
release_year: 2018
# Jouppi et al. (2020), CACM 63(7), Table 3 "Key processor features":
# Peak TeraFLOPS/Chip 123 (16b); Memory 32MiB/32GiB; Memory GB/s/Chip 900;
# TDP (Watts)/Chip 450. 123 = 2 cores x 2 MXUs x 128x128 x 2 FLOP x 940 MHz.
# The 420 TFLOP/s Cloud TPU v3 "device" (4-chip board) rating is not per chip.
compute:
  peak_flops: 123.0 TFLOPs / s
  precision_flops:
    bf16: 123.0 TFLOPs / s
memory:
  capacity: 32 GiB
  bandwidth: 900.0 GB / s
# Inter-chip interconnect (ICI): "4 links @ 70 GB/s" (Jouppi et al. 2023, ISCA, Table 4,
# arXiv:2304.01433), the same table and one-way convention as TPUv4 "6 links @ 50 GB/s".
# Jouppi et al. 2020 Table 3 lists "4 x 656" Gbits/s per chip, per direction (raw line
# rate = 328 GB/s); the two papers differ, and 280 keeps the v3->v4 comparison on one source.
nvlink:
  name: ICI
  direction: per_direction
  bandwidth: 280.0 GB / s
tdp: 450 W
dispatch_tax: 0.04 ms
metadata:
  provenance:
    kind: literature
    ref: Jouppi et al. (2020), A Domain-Specific Supercomputer for Training Deep Neural Networks, CACM 63(7), Table 3
    url: https://doi.org/10.1145/3360307
    verified: '2026-09-29'
    id: prov:google-tpu-v2-v3
