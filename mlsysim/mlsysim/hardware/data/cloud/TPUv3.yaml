__key__: TPUv3
name: Google TPU v3
release_year: 2019
# Jouppi et al. (2020), CACM 63(7), Table 3 "Key processor features":
# Peak TeraFLOPS/Chip 123 (16b); Memory 32MiB/32GiB; Memory GB/s/Chip 900;
# TDP (Watts)/Chip 450. 123 = 2 cores x 2 MXUs x 128x128 x 2 FLOP x 940 MHz.
# The 420 TFLOP/s Cloud TPU v3 "device" (4-chip board) rating is not per chip.
compute:
  peak_flops: 123.0 TFLOPs / s
  precision_flops:
    bf16: 123.0 TFLOPs / s
memory:
  capacity: 32 GiB
  bandwidth: 900.0 GB / s
tdp: 450 W
dispatch_tax: 0.04 ms
metadata:
  provenance:
    kind: literature
    ref: Jouppi et al. (2020), A Domain-Specific Supercomputer for Training Deep Neural Networks, CACM 63(7), Table 3
    url: https://doi.org/10.1145/3360307
    verified: '2026-09-29'
    id: prov:google-tpu-v2-v3
