__key__: A10
name: NVIDIA A10
release_year: 2021
compute:
  peak_flops: 125.0 TFLOPs / s
  precision_flops:
    # Datasheet: FP16 Tensor Core "125 TF | 250 TF*", TF32 Tensor Core "62.5 TF | 125 TF*", * with sparsity.
    fp16_sparse: 250.0 TFLOPs / s
    tf32: 62.5 TFLOPs / s
    fp32: 31.2 TFLOPs / s
memory:
  capacity: 24 GiB
  bandwidth: 600.0 GB / s
tdp: 150 W
# Not on the datasheet: the T4's dispatch tax is reused for this PCIe part.
dispatch_tax: 0.03 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA A10 Tensor Core GPU datasheet
    url: https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a10/pdf/a10-datasheet.pdf
    verified: '2026-11-12'
    id: prov:nvidia-a10-datasheet
