__key__: JetsonAGXOrin
name: NVIDIA Jetson AGX Orin
release_year: 2022
compute:
  peak_flops: 275 TOPS
  precision_flops:
    int8: 275 TOPS
    fp16: 43 TFLOPs / s
memory:
  capacity: 64 GiB
  bandwidth: 204.0 GB / s
  bus_width: 256 bit
  pin_data_rate: 6.4 Gbit / s
tdp: 60 W
tdp_min: 15 W
tdp_max: 60 W
dispatch_tax: 0.2 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA Jetson Orin Compute Comparison, AGX Orin 64GB
    url: https://www.nvidia.com/en-gb/autonomous-machines/embedded-systems/jetson-orin/
    verified: '2026-09-28'
    id: prov:nvidia-jetson-agx-orin
    notes: >-
      fp16 is the published rounded dense GPU Tensor Core throughput (43 TFLOP/s).
      peak_flops and int8 retain the aggregate sparse INT8 rating (275 TOPS),
      including GPU and DLA; they are not FP16 throughput. The memory bandwidth
      retains the rounded 204 GB/s modeling value; the datasheet gives 204.8 GB/s.
      bus_width (256-bit LPDDR5) and pin_data_rate (6400 MT/s, "3200 MHz ... 6400
      Gbps per pin", i.e. 6.4 Gb/s per pin) are from the NVIDIA Jetson AGX Orin
      Series Technical Brief v1.2 (July 2022, TB_10749-001_v1.2), checked
      2026-09-29 at https://www.nvidia.com/content/dam/en-zz/Solutions/gtcf21/jetson-orin/nvidia-jetson-agx-orin-technical-brief.pdf
