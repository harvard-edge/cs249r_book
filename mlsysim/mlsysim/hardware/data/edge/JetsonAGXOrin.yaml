__key__: JetsonAGXOrin
name: NVIDIA Jetson AGX Orin
release_year: 2022
compute:
  peak_flops: 43 TFLOPs / s
  precision_flops:
    fp16: 43 TFLOPs / s
    int8: 137.5 TOPS
    int8_sparse: 275 TOPS
memory:
  capacity: 64 GiB
  bandwidth: 204.0 GB / s
  bus_width: 256 bit
  pin_data_rate: 6.4 Gbit / s
tdp: 60 W
tdp_min: 15 W
tdp_max: 60 W
dispatch_tax: 0.2 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA Jetson Orin Compute Comparison, AGX Orin 64GB
    url: https://www.nvidia.com/en-gb/autonomous-machines/embedded-systems/jetson-orin/
    verified: '2026-09-28'
    id: prov:nvidia-jetson-agx-orin
    notes: >-
      peak_flops and fp16 are the published rounded dense GPU Tensor Core FP16
      throughput (43 TFLOP/s), matching the dense-peak convention of Jetson Orin
      Nano, Jetson Orin NX, H100, A100, B200, and DGX Spark. int8 (137.5 TOPS) is
      the dense aggregate GPU + 2x NVDLA v2.0 INT8 throughput (half the 2:4 sparse
      rating); int8_sparse (275 TOPS) retains the datasheet's 2:4 structured-sparse
      aggregate GPU + DLA rating (170 GPU + 105 DLA sparse). The memory bandwidth
      retains the rounded 204 GB/s modeling value; the datasheet gives 204.8 GB/s.
      bus_width (256-bit LPDDR5) and pin_data_rate (6400 MT/s, "3200 MHz ... 6400
      Gbps per pin", i.e. 6.4 Gb/s per pin) are from the NVIDIA Jetson AGX Orin
      Series Technical Brief v1.2 (July 2022, TB_10749-001_v1.2), checked
      2026-09-29 at https://www.nvidia.com/content/dam/en-zz/Solutions/gtcf21/jetson-orin/nvidia-jetson-agx-orin-technical-brief.pdf
