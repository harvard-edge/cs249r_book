metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA Jetson Orin Nano series datasheet (8 GB module, original 2023 spec) — 40 TOPS sparse INT8, 7-15 W
    url: https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/
    verified: '2026-06-10'
    id: prov:nvidia-jetson-orin-nano
    notes: >-
      Original (pre-"Super") Orin Nano 8GB: 40 TOPS sparse INT8, 1024-core Ampere
      GPU + 32 tensor cores, 8 GB 128-bit LPDDR5 at 68 GB/s, 7-15 W configurable.
      peak_flops is the FP16-dense equivalent (sparse INT8 TOPS / 4), matching the
      Jetson Orin NX/AGX entries' convention. The 2024 "Super" update raises the
      8GB module to 67 TOPS / 7-25 W; this entry tracks the 7-15 W era cited in prose.
