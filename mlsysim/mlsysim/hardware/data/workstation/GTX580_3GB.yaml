__key__: GTX580_3GB
# The consumer GPU AlexNet was trained on (two of them; Krizhevsky et al. 2012
# name "two NVIDIA GTX 580 3GB GPUs"). NVIDIA's reference board carries
# 1.5 GB; the 3 GB boards were partner variants of the same GF110 chip, with
# the same clocks and memory interface. Added 2026-10-20.
name: NVIDIA GeForce GTX 580 (3 GB)
release_year: 2010
compute:
  # 512 CUDA cores x 1544 MHz shader clock x 2 FLOPs per FMA.
  peak_flops: 1.5811 TFLOPs / s
  precision_flops:
    fp32: 1.5811 TFLOPs / s
memory:
  capacity: 3 GiB
  # 384-bit GDDR5 at 4008 MT/s.
  bandwidth: 192.4 GB / s
interconnect:
  name: PCIe Gen2 x16
  bandwidth: 8.0 GB / s
tdp: 244 W
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA GeForce GTX 580 specifications (reference board); 3 GB capacity per Krizhevsky et al. (2012)
    url: https://www.nvidia.com/docs/IO/100940/GeForce_GTX_580_Datasheet.pdf
    verified: '2026-10-20'
    id: prov:nvidia-gtx580-datasheet
