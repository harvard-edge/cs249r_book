__key__: DGX_Spark
name: NVIDIA DGX Spark (GB10)
release_year: 2025
compute:
  # Dense figures (registry convention). NVIDIA's marketed "1 petaflop of AI
  # performance" is FP4 WITH sparsity — kept under fp4_sparse, matching the
  # A100 fp16_sparse pattern. (Audit fix 2026-06-06; dense ladder was 2x high.)
  peak_flops: 125.0 TFLOPs / s
  precision_flops:
    fp8: 250.0 TFLOPs / s
    fp4: 500.0 TFLOPs / s
    fp4_sparse: 1000.0 TFLOPs / s
memory:
  capacity: 128 GiB
  # 256-bit LPDDR5x-8533: 273 GB/s per NVIDIA spec. (Audit fix 2026-06-06; was 500.)
  bandwidth: 273.0 GB / s
storage:
  capacity: 4 TiB
  bandwidth: 7.0 GB / s
tdp: 200 W
unit_cost: 3000 dollar
unit_cost_max: 5000 dollar
dispatch_tax: 0.01 ms
metadata:
  provenance:
    kind: datasheet
    ref: NVIDIA DGX Spark (GB10 Grace Blackwell) product page
    url: https://www.nvidia.com/en-us/products/workstations/dgx-spark/
    verified: '2026-03-06'
    id: prov:nvidia-dgx-spark-gb10
