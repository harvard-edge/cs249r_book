# DRAM holds Horowitz (2014) 45 nm access energies only. Horowitz reports
# energy, not latency; access latency lives in HostDram_Latency2009 (CPU main
# memory) and HopperGlobalMemory (accelerator HBM), each with its own source.
DRAM:
  name: DRAM (off-chip)
  energy_per_access: 640 pJ
  energy_per_byte: 160.0 pJ / B
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
DDR4_3200:
  name: DDR4-3200
  bandwidth: 51.2 GB / s
  metadata:
    provenance: '@prov:MEMORY_INTERFACE_BANDWIDTH_TIERS'
LPDDR5_6400:
  name: LPDDR5-6400
  t_ck: 1.25 ns
  t_rcd: 18.75 ns
  t_rp: 18.75 ns
  t_rcd_min: 18 ns
  t_rp_min: 18 ns
  t_rpab_min: 21 ns
  channel_width: 16 bit
  metadata:
    provenance: '@prov:LPDDR5_6400_TIMINGS'
HBM2:
  name: HBM2
  bandwidth: 900 GB / s
  metadata:
    provenance: '@prov:MEMORY_INTERFACE_BANDWIDTH_TIERS'
HBM2_AccessEnergy2017:
  # Added 2026-10-15. Energy to access one bit of an HBM2 stack (activation,
  # on-die data movement and I/O) as estimated by O'Connor et al. (2017); a
  # separate entry because the HBM2 bandwidth tier above has a different source. 3.97 pJ/bit = 31.76 pJ/B.
  name: HBM2 access energy (2017)
  energy_per_byte: 31.76 pJ / B
  metadata:
    provenance: '@prov:OCONNOR_FGDRAM_2017'
HBM3:
  name: HBM3
  bandwidth: 1600 GB / s
  # Added 2026-10-20: 1,024-bit interface per stack (16 channels of 64 bits),
  # JEDEC JESD238. The width, not the clock, gives HBM its bandwidth.
  interface_width: 1024 bit
  metadata:
    provenance: '@prov:MEMORY_INTERFACE_BANDWIDTH_TIERS'
# Added 2026-10-20: DDR5 DIMM channel, 64 data bits as two 32-bit subchannels
# (JEDEC JESD79-5). Host-memory bandwidth tiers stay in Hardware.Tech.Storage.
DDR5:
  name: DDR5
  interface_width: 64 bit
  metadata:
    provenance: '@prov:JEDEC_MEMORY_INTERFACE_WIDTHS'
# Added 2026-10-20: the DDR5-4800 speed grade, 4,800 MT/s on a 64-bit DIMM
# channel (JEDEC JESD79-5); peak bandwidth is width x rate.
DDR5_4800:
  name: DDR5-4800
  interface_width: 64 bit
  pin_data_rate: 4.8 Gbit / s
  metadata:
    provenance: '@prov:JEDEC_MEMORY_INTERFACE_WIDTHS'
GDDR6X:
  name: GDDR6X
  bandwidth: 760 GB / s
  metadata:
    provenance: '@prov:MEMORY_INTERFACE_BANDWIDTH_TIERS'
L1:
  name: L1 / SRAM
  latency: 1 ns
  energy_per_access: 0.5 pJ
  metadata:
    provenance: '@prov:ON_CHIP_MEMORY_ACCESS_ENERGY_ANCHORS'
L2:
  name: L2 cache
  latency: 4 ns
  energy_per_access: 2.0 pJ
  metadata:
    provenance: '@prov:ON_CHIP_MEMORY_ACCESS_ENERGY_ANCHORS'
Register:
  name: Register file
  latency: 0.3 ns
  energy_per_access: 0.1 pJ
  metadata:
    provenance: '@prov:ON_CHIP_MEMORY_ACCESS_ENERGY_ANCHORS'
# Added 2026-09-28. Hopper-generation on-chip latencies measured by Luo et al.
# (2024) on an H800 PCIe (Hopper) at 1,755 MHz (Tables III-IV). latency is the
# derived wall-clock value latency_cycles / 1.755 GHz. Named with the Hopper
# generation (invariant 3) so later generations coexist; the generic L1/L2
# tiers above are CPU-scale anchors and are unchanged.
# Added 2026-10-20. The book's range for the on-chip SRAM of one modern
# accelerator chip (registers, shared memory, and caches together): 30 to 50 MB
# at roughly 15 to 20 TB/s, against 1.5 to 3.5 TB/s for HBM.
AcceleratorOnChipSram:
  name: Accelerator on-chip SRAM (one chip, all levels)
  capacity_low: 30 MB
  capacity_high: 50 MB
  bandwidth_low: 15 TB / s
  bandwidth_high: 20 TB / s
  metadata:
    provenance: '@prov:ACCELERATOR_ONCHIP_SRAM_RANGE'
HopperSharedMemory:
  name: Hopper shared memory (SMEM)
  latency_cycles: 29.0
  latency: 16.52 ns
  metadata:
    provenance: '@prov:HOPPER_MICROBENCHMARK_LATENCY'
HopperL2:
  name: Hopper L2 cache
  latency_cycles: 263.0
  latency: 149.86 ns
  metadata:
    provenance: '@prov:HOPPER_MICROBENCHMARK_LATENCY'
# Added 2026-10-20. Hopper global-memory (HBM) load latency, Luo et al. (2024)
# Table IV: 478.8 cycles on an H800 PCIe at 1,755 MHz, with a buffer larger
# than L2 so loads miss to HBM. latency = 478.8 / 1.755 GHz.
HopperGlobalMemory:
  name: Hopper global memory (HBM)
  latency_cycles: 478.8
  latency: 272.82 ns
  metadata:
    provenance: '@prov:HOPPER_MICROBENCHMARK_LATENCY'
# Added 2026-10-20. CPU main-memory reference latency, Dean (2009) "Numbers
# Everyone Should Know": "Main memory reference 100 ns". Dated per invariant 3.
HostDram_Latency2009:
  name: Host DRAM main-memory reference (2009)
  latency: 100 ns
  metadata:
    provenance: '@prov:DEAN_NUMBERS_EVERYONE_SHOULD_KNOW'
# Added 2026-10-12. Horowitz (2014) 45 nm SRAM read energies for 32-bit words, by
# array size; the book's energy-per-operation table and figure use these three.
SRAM_8KB:
  name: SRAM read, 8 KB array (32-bit word, 45 nm)
  energy_per_access: 5.0 pJ
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
SRAM_32KB:
  name: SRAM read, 32 KB array (32-bit word, 45 nm)
  energy_per_access: 10.0 pJ
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
SRAM_1MB:
  name: SRAM read, 1 MB array (32-bit word, 45 nm)
  energy_per_access: 50.0 pJ
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
