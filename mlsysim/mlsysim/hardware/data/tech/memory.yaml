  energy_per_access: 5.0 pJ
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
SRAM_32KB:
  name: SRAM read, 32 KB array (32-bit word, 45 nm)
  energy_per_access: 10.0 pJ
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
SRAM_1MB:
  name: SRAM read, 1 MB array (32-bit word, 45 nm)
  energy_per_access: 50.0 pJ
  metadata:
    provenance: '@prov:HOROWITZ_ENERGY'
