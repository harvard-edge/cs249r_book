# Do not edit by hand: change the script or the data and rerun it.
provenance:
  kind: derived
  ref: 'MLSys·im paper data: paper/data/serverless-gpu-energy (GPU board energy on Modal serverless GPUs,
    NVML total-energy counter, November 2026)'
  verified: '2026-11-12'
  notes: 'Board energy only: host CPU, memory, networking and facility energy are excluded. loaded_idle_power_w
    is the mean over the last 300 s of a 600 s idle period with Qwen2.5-1.5B loaded, and reserved_idle_power_w
    the mean over the whole 600 s, so the decay right after the job is included (3 runs per GPU). coldstart_energy_j
    runs from the first NVML read in a fresh container to the first generated token (GPU energy before
    the function body starts is not visible). crossover_wait_s is cold-start energy over reserved idle
    power. pause_overhead_j is checkpoint save plus load plus the resume''s energy above steady training,
    floored at zero. HFU and BWU in the power runs are MLSys·im''s roofline utilization scaled by measured
    over predicted throughput.'
  id: prov:mlsysim-serverless-gpu-energy-2026
power_model:
  form: min(TDP, loaded_idle_power_w + (b_hfu * HFU + c_bwu * BWU) * TDP)
  b_hfu: 5.05
  c_bwu: 0.65
  fit: 'least squares over 148 power runs on 7 GPUs and 7 workloads (grid: b from 0 to 8 in steps of 0.05,
    c from 0 to 3 in steps of 0.025)'
  median_abs_error_pct_leave_one_gpu_out: 11.4
  median_abs_error_pct_leave_one_workload_out: 14.2
  median_abs_error_pct_engine_default: 35.8
  evaluation: Exploratory, within these runs. Hold-out errors refit b and c without one GPU or one workload
    and are conditional on each GPU's measured idle power and on HFU and BWU scaled by measured throughput.
    The form was chosen after inspecting the first runs. The H200, B200 and W6 runs came after it was
    fixed. Not a prospective accuracy.
