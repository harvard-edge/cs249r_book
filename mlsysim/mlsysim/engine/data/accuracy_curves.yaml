# Example accuracy curves for mlsysim.engine.accuracy_curve.
#
# Each curve is a set of published measurements for one model, one method,
# one metric and one dataset. Accuracy is a fraction. A bitwidth level is the
# nominal bits per weight, and a sparsity level is the fraction of weights
# removed. Every number below was read from the cited table on the date in
# `verified`. tests/test_accuracy_curve.py repeats every value, so a change
# here needs the same change there.
curves:
  qwen-7b-chat-gptq:
    axis: bitwidth
    measured_model: Qwen-7B-Chat
    method: GPTQ post-training weight quantization, as run by Jin et al.
    metric: mean accuracy over MMLU, C-EVAL, GSM8K, SNLI and TruthfulQA
    dataset: the five benchmarks' evaluation sets, as used in the paper
    retrained: false
    baseline_accuracy: 0.5710
    points:
      - [2, 0.1652]
      - [3, 0.5142]
      - [4, 0.5486]
      - [8, 0.5721]
      - [16, 0.5710]
    provenance:
      kind: literature
      ref: >-
        Jin et al. (2024), A Comprehensive Evaluation of Quantization Strategies for
        Large Language Models, Table 2, column Average Accuracy, rows Qwen-7B-Chat
      url: https://arxiv.org/abs/2402.16775
      verified: '2026-11-16'
      notes: >-
        The 16-bit point is the paper's BFloat16 row, which is also the baseline.
        The 8-bit accuracy is 0.11 points above it.
      id: prov:jin2024-quantization-table2-qwen7b-gptq

  qwen-7b-chat-spqr:
    axis: bitwidth
    measured_model: Qwen-7B-Chat
    method: SpQR post-training weight quantization, as run by Jin et al.
    metric: mean accuracy over MMLU, C-EVAL, GSM8K, SNLI and TruthfulQA
    dataset: the five benchmarks' evaluation sets, as used in the paper
    retrained: false
    baseline_accuracy: 0.5710
    points:
      - [2, 0.5318]
      - [3, 0.5545]
      - [4, 0.5641]
      - [8, 0.5649]
      - [16, 0.5710]
    provenance:
      kind: literature
      ref: >-
        Jin et al. (2024), A Comprehensive Evaluation of Quantization Strategies for
        Large Language Models, Table 2, column Average Accuracy, rows Qwen-7B-Chat
      url: https://arxiv.org/abs/2402.16775
      verified: '2026-11-16'
      notes: >-
        Levels are nominal bits. SpQR keeps outlier weights at high precision:
        11.336% of the weights at 2 bits and 1.676% at 3 bits (the paper's Table 5).
        The stored size per weight is therefore above the nominal level.
      id: prov:jin2024-quantization-table2-qwen7b-spqr

  resnet50-magnitude-pruning-during-training:
    axis: sparsity
    measured_model: ResNet-50 trained on ImageNet by Gale et al.
    method: unstructured magnitude pruning applied gradually during training
    metric: top-1 accuracy
    dataset: ImageNet (ILSVRC-2012), as evaluated by the authors
    retrained: true
    baseline_accuracy: 0.7669
    points:
      - [0.0, 0.7669]
      - [0.5, 0.7653]
      - [0.7, 0.7638]
      - [0.8, 0.7558]
      - [0.9, 0.7391]
      - [0.95, 0.7059]
      - [0.98, 0.579]
    provenance:
      kind: literature
      ref: >-
        Gale, Elsen and Hooker (2019), The State of Sparsity in Deep Neural Networks.
        Dense accuracy from Section 5 of the paper. Pruned accuracies from the
        authors' checkpoint table, rows ResNet-50 Magnitude Pruning
      url: https://github.com/google-research/google-research/blob/master/state_of_sparsity/README.md
      verified: '2026-11-16'
      notes: >-
        The dense accuracy is the paper's mean over three runs. The table lists the
        top performing checkpoint at each sparsity, so each change from the baseline
        compares a best checkpoint with a mean. The table's "extended/non-uniform"
        rows, which train longer, are not used here.
      id: prov:gale2019-state-of-sparsity-resnet50-magnitude

  resnet50-woodfisher-one-shot:
    axis: sparsity
    measured_model: ResNet-50 pretrained on ImageNet, from torchvision (the paper's footnote 7)
    method: unstructured one-shot pruning with WoodFisher (empirical Fisher), no retraining
    metric: top-1 accuracy
    dataset: ImageNet (ILSVRC-2012), as evaluated by the authors
    retrained: false
    baseline_accuracy: 0.7613
    points:
      - [0.0, 0.7613]
      - [0.2, 0.7610]
      - [0.4, 0.7522]
      - [0.6, 0.6921]
      - [0.7, 0.4835]
      - [0.8, 0.0548]
    provenance:
      kind: literature
      ref: >-
        Singh and Alistarh (2020), WoodFisher: Efficient Second-Order Approximation
        for Neural Network Compression, Table 7, column empirical WoodFisher
      url: https://arxiv.org/abs/2004.14340
      verified: '2026-11-16'
      notes: >-
        Each pruned accuracy is the paper's mean over three seeds. The dense accuracy
        is the one pretrained model.
      id: prov:singh2020-woodfisher-table7-resnet50-one-shot
