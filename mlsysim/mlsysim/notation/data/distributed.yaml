- macro: \CommunicationIntensity
  latex: \text{CI}
  definition: Communication Intensity
  kind: scalar
- macro: \CommunicationTime
  latex: T_{\text{comm}}(N)
  definition: Communication Time
  kind: scalar
  unit: seconds
  notes: Wall-clock time to transmit a message of size $n$ across one link.
- macro: \CommunicationcomputationRatio
  latex: \rho
  definition: Communication-Computation Ratio
  kind: scalar
  unit: Dimensionless
  notes: $\rho = T_{\text{comm}}(N)/(T_{\text{compute}}/N)$. Values near or above 1 indicate communication-bound
    scaling.
- macro: \ComponentAvailability
  latex: A_{\text{component}}
  definition: Availability of One Component
  kind: scalar
  unit: dimensionless
  notes: Probability that one component is up at a given instant; a job that needs all N components at
    once has availability $(A_{\text{component}})^N$ under independent, identical components.
- macro: \CompressedCommunicationTime
  latex: T_{\text{compressed}}
  definition: Compressed Communication Time
  kind: scalar
  unit: seconds
  notes: Total time after encode, transfer of $M/r_{\text{comp}}$, and decode.
- macro: \Correlation
  latex: \rho
  definition: Correlation
  kind: scalar
- macro: \CrossoverPoint
  latex: n^*
  definition: Crossover Point
  kind: scalar
  unit: bytes
  notes: '$n^* = \alpha \cdot \beta$. Below $n^*$: latency-bound. Above: bandwidth-bound.'
- macro: \DataparallelDegreeDp
  latex: N_{\text{DP}}
  definition: Data-Parallel Degree
  kind: scalar
- macro: \DifferentialPrivacyBudget
  latex: (\epsilon, \delta)
  definition: Differential Privacy Budget
  kind: scalar
- macro: \DistributedStepTime
  latex: T_{\text{step}}(N)
  definition: Distributed Step Time
  kind: scalar
  unit: seconds
  notes: Wall-clock time for one training step at scale $N$.
- macro: \DollarCostInfer
  latex: C_{\text{infer}}
  definition: Dollar Cost
  kind: scalar
- macro: \DollarCostTrain
  latex: C_{\text{train}}
  definition: Dollar Cost
  kind: scalar
- macro: \EffectiveFleetThroughput
  latex: R_{\text{eff}}
  definition: Effective Fleet Throughput
  kind: scalar
  unit: FLOP/s
  notes: $R_{\text{eff}} = (N R_{\text{peak}}) \times \text{MFU} \times \eta_{\text{scaling}} \times \eta_{\text{goodput}}$,
    where $\text{MFU}$ is the single-device baseline, $\eta_{\text{scaling}}$ captures all in-step scaling
    loss, and $\eta_{\text{goodput}}$ captures only out-of-step operational loss excluded from $T_N$.
- macro: \Expectation
  latex: \mathbb{E}[\cdot]
  definition: Expectation
  kind: set
- macro: \FleetEnergyProductivity
  latex: \rho_{\text{energy}}
  definition: Fleet Energy Productivity
  kind: scalar
- macro: \GemmDimension
  latex: M
  definition: GEMM dimension; memory root ($M_{\text{total}}$)
  kind: scalar
- macro: \GoodputRatio
  latex: \eta_{\text{goodput}}
  definition: Goodput Ratio
  kind: scalar
  unit: Dimensionless
  notes: Fraction of allocated wall time remaining after the out-of-step losses in $f_{\text{overhead}}$;
    often $\eta_{\text{goodput}} = 1 - f_{\text{overhead}}$.
- macro: \Gradient
