# Notation registry: distributed
# Fleets of machines: collectives, communication cost models, reliability, scheduling.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AcceleratorHourlyPrice
  latex: R_{\text{GPU/hr}}
  definition: price of one accelerator-hour, excluding energy
  kind: scalar
  unit: USD/h
- macro: \AcceleratorsPerNode
  latex: G_{\text{node}}
  definition: number of accelerators in one node
  kind: count
  notes: 'Pairs with $\ClusterNodeCount$ in hierarchical collectives: a job of $\ClusterNodeCount$ nodes
    holds $\ClusterNodeCount \cdot \AcceleratorsPerNode$ accelerators.'
- macro: \ActivationPayloadSize
  latex: M_{\text{act}}
  definition: bytes of one activation tensor, batch by sequence by hidden width, that each tensor-parallel
    AllReduce carries
  kind: scalar
  unit: bytes
  notes: $M_{\text{act}} = \BatchSize \SequenceLength \HiddenDimension \ElementStorageSize$. A specific
    collective payload; the general one is \CollectivePayloadSize. Not \ActivationMemory, which is stored
    activations.
- macro: \AdversarialPerturbation
  latex: \boldsymbol{\delta}_{\text{adv}}
  definition: perturbation an adversary adds to an input to change a model's prediction
  kind: vector
  notes: Its norm is bounded by $\AdversarialPerturbationBudget$; measured in normalized input-feature
    units.
- macro: \AdversarialPerturbationBudget
  latex: \epsilon_{\text{adv}}
  definition: largest norm an adversary may give the perturbation it adds to an input
  kind: scalar
  unit: dimensionless
  notes: Measured in the units of the (usually normalized) input features. A perturbation radius, not
    the differential privacy budget $\epsilon$.
- macro: \AlertCheckCount
  latex: N_{\text{tests}}
  definition: number of independent monitoring checks evaluated, such as models times metrics
  kind: count
- macro: \AlertFalsePositiveRate
  latex: \alpha_{\text{fp}}
  definition: probability that one monitoring check fires when nothing is wrong
  kind: scalar
  unit: dimensionless
  notes: The per-check analogue of \HypothesisTestSignificanceLevel for alerting.
- macro: \AllGatherCompletionTime
  latex: T_{\text{allgather}}
  definition: time to complete an AllGather over a ring of devices, each starting with one shard and ending
    with the full tensor
  kind: scalar
  unit: s
  notes: 'Ring model: $\frac{\DeviceCount-1}{\DeviceCount}\frac{\CollectiveTensorSize}{\LinkBandwidth}
    + (\DeviceCount-1)\MessageStartupLatency$. For matching full-tensor sizes, this is one of the two
    ring phases of $\RingAllReduceCompletionTime$.'
- macro: \AllReduceCompletionTime
  latex: T_{\text{allreduce}}
  definition: time to complete one AllReduce collective over a group of devices, whatever algorithm implements
    it
  kind: scalar
  unit: s
  notes: Distinct from $\RingAllReduceCompletionTime$ and $\TreeAllReduceCompletionTime$, which fix the
    algorithm; the notation chapter's collective-time row already says $T_{\text{allreduce}}$ names an
    AllReduce whose algorithm the text leaves open.
- macro: \AllReduceMinimumBandwidthTime
  latex: T_{\text{bandwidth}}^{\text{min}}
  definition: smallest byte-transfer time any point-to-point AllReduce can achieve, with full-duplex per-rank
    bandwidth and no in-network reduction or compression
  kind: scalar
  unit: s
  notes: Equals $2(\DeviceCount-1)\CollectivePayloadSize/(\DeviceCount\LinkBandwidth)$; ring AllReduce
    matches it.
- macro: \AllToAllCompletionTime
  latex: T_{\text{alltoall}}
  definition: time to complete one AllToAll collective, in which every device exchanges a distinct share
    of its payload with every other device
  kind: scalar
  unit: s
  notes: Used for expert-parallel dispatch and gather; also backmatter/appendix_communication.
- macro: \AllToAllExchangeTime
  latex: T
  definition: elapsed time of one AllToAll exchange among the ranks of a communication group
  kind: scalar
  unit: s
  notes: Bounded below by injection, reception and bisection terms, e.g. $\CutCrossingDataVolume/\BisectionBandwidth$.
- macro: \AllocatedWallTime
  latex: T_{\text{wall}}
  definition: total wall-clock time for which a training job holds its allocated resources, productive
    or not
  kind: scalar
  unit: s
  notes: Denominator of runtime goodput, $\RuntimeGoodput \approx T_{\text{useful}}/T_{\text{wall}}$.
    Not $\Time$, the time of one unit of work.
  aliases:
  - \AllocationHoldTime
- macro: \AllowedViolationFraction
  latex: V^{\text{allow}}
  definition: fraction of eligible observations allowed to violate one reliability target over a window,
    its error budget
  kind: scalar
  unit: dimensionless
  notes: Written $\AllowedViolationFraction_i$.
- macro: \AssignedJobGpu
  latex: g
  definition: one GPU assigned to a job, indexed over the job's allocation
  kind: record
  notes: Pairs of assigned GPUs enter the locality cost through their topological distance.
- macro: \AttackStepsPgd
  latex: K_{\text{PGD}}
  definition: number of inner gradient steps a projected gradient descent attack takes to build one adversarial
    example
  kind: count
  notes: Adversarial training with this attack costs about $\AttackStepsPgd + 1$ forward-backward passes
    per batch.
- macro: \AutoscalingDecisionTime
  latex: T_{\text{decide}}
  definition: time an autoscaler takes to decide on a scaling action once a load change is detected
  kind: scalar
  unit: s
- macro: \AutoscalingDetectionTime
  latex: T_{\text{detect}}
  definition: time an autoscaler's metrics take to reveal a load change
  kind: scalar
  unit: s
  notes: Not the failure-detection time of the fault-tolerance chapter, which shares the glyph.
- macro: \AutoscalingResponseTime
  latex: T_{\text{response}}
  definition: time an autoscaler takes from a load change to new capacity serving, detection plus decision
    plus provisioning plus warmup
  kind: scalar
  unit: s
- macro: \AvailabilityObjective
  latex: S_{\text{availability}}
  definition: 'availability dimension of a service''s SLO vector: its indicator, target, window and owner'
  kind: record
- macro: \BaseTrainingComputeCost
  latex: C_{\text{compute}}
  definition: compute cost of a training run in the absence of failures
  kind: scalar
  unit: USD
  notes: The failure-free term of $\TotalTrainingRunCost$; held fixed in the fault-tolerance investment
    criterion.
- macro: \BaselineTrainingDuration
  latex: T_{\text{hours}}
  definition: wall-clock duration of a training run before failure and recovery overhead
  kind: scalar
  unit: h
- macro: \BatchFlushStartTime
  latex: t_{\text{start}}
  definition: time at which a group-commit batch starts its shared durable storage operation
  kind: scalar
  unit: s
- macro: \BatchedEventIndex
  latex: i
  definition: position of one event or record within a group-commit batch
  kind: index
- macro: \BilledAllocationTime
  latex: T_{\text{total}}
  definition: billed allocation time of a spot job, including checkpointing, recovery and work discarded
    after interruptions
  kind: scalar
  unit: s
  notes: Numerator of the spot effective-cost ratio.
- macro: \BisectionBandwidth
  latex: \text{BW}_{\text{bisect}}
  definition: total bandwidth across the narrowest cut that divides a network's nodes into two equal halves
  kind: scalar
  unit: bytes/s
  notes: 'A topology property, not one link: $\LinkBandwidth$ is a single link and $\NetworkBandwidth$
    a path. Oversubscription lowers it below the sum of host injection bandwidths.'
- macro: \BlockMaximum
  latex: M
  definition: largest of the observations of a monitored quantity in one block, indexed by the block size
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation.
- macro: \BlockMaximumLevel
  latex: z
  definition: level of the block maximum at which its limiting distribution is evaluated
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation; bounded above by $\mu - \sigma/\xi$ when the shape is negative.
- macro: \BlockMaximumLimitDistribution
  latex: G
  definition: limiting cumulative distribution function of the normalized block maximum, a member of the
    generalized extreme value family
  kind: function
  notes: Parameterized by \GevLocationParameter, \GevScaleParameter and \TailShapeParameter.
- macro: \BlockMaximumNormalizingScale
  latex: a
  definition: positive scale constant, indexed by block size, that divides the centered block maximum
    so it converges in distribution
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation.
- macro: \BlockMaximumNormalizingShift
  latex: b
  definition: shift constant, indexed by block size, subtracted from the block maximum before normalization
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation.
- macro: \BlockSampleCount
  latex: n
  definition: number of independent observations in one block whose maximum is taken
  kind: count
- macro: \BroadcastCompletionTime
  latex: T_{\text{broadcast}}
  definition: time for one root device to send a payload to every other device in a collective group
  kind: scalar
  unit: s
  notes: 'Unsegmented binary tree: $\log_2 \DeviceCount\,(\MessageStartupLatency + \CollectivePayloadSize/\LinkBandwidth)$.
    Not $\BroadcastTableSize$.'
- macro: \BufferDependencyEdgeSet
  latex: E
  definition: set of directed edges of a buffer dependency graph, each meaning a packet in one buffer
    needs the next buffer to progress
  kind: set
  notes: Not the computational-graph edge set \GraphEdgeSet.
  render_exception: Graph theory writes the vertex and edge sets of G = (V, E) as plain italic capitals.
- macro: \BufferDependencyGraph
  latex: G
  definition: directed graph whose vertices are switch packet buffers and whose edges say which buffer
    a packet needs next
  kind: record
  notes: Not the computational graph \ComputationalGraph.
- macro: \BufferDependencyVertexSet
  latex: V
  definition: set of vertices, the packet buffers or virtual-lane queues, of a buffer dependency graph
  kind: set
  notes: Not the computational-graph node set \GraphNodeSet.
  render_exception: Graph theory writes the vertex and edge sets of G = (V, E) as plain italic capitals.
- macro: \ButterflyAllReduceTime
  latex: T_{\text{butterfly}}
  definition: time to complete an AllReduce by recursive halving-doubling, the butterfly algorithm
  kind: scalar
  unit: s
  notes: Logarithmic startup rounds with the ring's optimal byte term; needs a power-of-two rank count.
- macro: \ByzantineClientCount
  latex: f
  definition: number of Byzantine, faulty or malicious, clients a robust aggregation rule tolerates
  kind: count
- macro: \ByzantineFaultCount
  latex: f
  definition: number of Byzantine faulty components, which may send arbitrary conflicting messages, that
    an agreement protocol tolerates
  kind: count
  notes: Agreement needs at least $3f+1$ components. Federated robust aggregation uses $\ByzantineClientCount$
    for its tolerated clients.
- macro: \CanaryStageDuration
  latex: T_{\text{stage}}
  definition: time a canary rollout stage needs to collect its planned observations at its traffic share
  kind: scalar
  unit: s
  notes: A collection-time lower bound, not a stopping rule. Not a pipeline-parallel stage time.
- macro: \CanaryTrafficFraction
  latex: p_{\text{stage}}
  definition: share of production traffic a canary stage routes to the candidate
  kind: scalar
  unit: dimensionless
  notes: Typical progression 0.01, 0.05, 0.25, 0.5, 1.
- macro: \CandidateClientCount
  latex: K_{\text{candidates}}
  definition: number of clients a federated server invites to a round, over-selected above the number
    of updates it needs
  kind: count
- macro: \CheckpointAttemptDuration
  latex: T_{\text{att}}
  definition: duration of one uninterrupted compute-plus-checkpoint attempt, the checkpoint interval plus
    the write time
  kind: scalar
  unit: s
- macro: \CheckpointExtraPauseTime
  latex: T_{\text{pause}}
  definition: time training pauses per checkpoint beyond the write itself, for memory allocation, coordination
    and serialization
  kind: scalar
  unit: s
  notes: Adds to $\CheckpointWriteTime$ in $\CheckpointOverheadFraction$.
- macro: \CheckpointInterval
  latex: T_{\text{ckpt}}
  definition: useful compute time between two completed checkpoints
  kind: scalar
  unit: s
  notes: The optimum under the Young-Daly model is $\OptimalCheckpointIntervalCkpt$.
  aliases:
  - \CheckpointIntervalCkpt
- macro: \CheckpointLoadTime
  latex: T_{\text{load}}
  definition: time to read the latest checkpoint state from storage back into accelerator memory during
    recovery
  kind: scalar
  unit: s
  notes: A term of $\FailureRecoveryTime$; set by checkpoint size and aggregate read bandwidth.
- macro: \CheckpointOverheadFraction
  latex: f_{\text{ckpt}}
  definition: fraction of training time lost to saving checkpoints, excluding replay of lost work
  kind: scalar
  unit: dimensionless
  notes: $(\CheckpointWriteTime + \CheckpointExtraPauseTime)/\CheckpointInterval$; the save-side term
    of $\CheckpointWasteFraction$.
- macro: \CheckpointWasteFraction
  latex: W
  definition: fraction of training time wasted on checkpoint writes and on replaying work lost to failures,
    as a function of the checkpoint interval
  kind: scalar
  unit: dimensionless
  notes: 'First order: $\CheckpointWriteTime/\CheckpointInterval + \CheckpointInterval/(2\,\SystemMtbf)$,
    minimized at $\OptimalCheckpointInterval$. Written with its argument, $\CheckpointWasteFraction(\CheckpointInterval)$.'
- macro: \CheckpointWriteTime
  latex: T_{\text{write}}
  definition: time execution pauses to write one checkpoint
  kind: scalar
  unit: s
  notes: Must be in the same time unit as $\SystemMtbf$ in the Young-Daly interval.
- macro: \ClientIndex
  latex: k
  definition: position of one client among the clients of a federated round or secure aggregation
  kind: index
  notes: Usually a subscript ($\ModelParameters_k$, $\LossFunction_k$); written bare when prose names
    the client.
- macro: \ClientObjectiveWeight
  latex: w
  definition: weight a client's local loss receives in the federated global objective, indexed by client
  kind: scalar
  unit: dimensionless
  notes: Example weighting sets it proportional to \ClientSampleCount.
- macro: \ClientSampleCount
  latex: n
  definition: number of training samples on one federated client, written with the client index
  kind: count
  notes: Always indexed, $n_k$; the bare n of the FedAvg weights is now written $\RoundSampleCount$.
- macro: \ClusterHeadroom
  latex: N
  definition: number of accelerators in a cluster free to run a deferrable job at a given time
  kind: count
  notes: Written as a function of \TimeInstant in carbon-aware scheduling. Not \DeviceCount, the devices
    one job runs on.
- macro: \ClusterNodeCount
  latex: N_{\text{nodes}}
  definition: number of nodes in a cluster or job
  kind: count
  notes: Counts nodes, not accelerators; the accelerator count is $\ClusterNodeCount \cdot \AcceleratorsPerNode$.
  aliases:
  - \AcceleratorsPerNodeNodes
- macro: \CodecDecodeTime
  latex: T_{\text{decode}}
  definition: time to decompress a compressed payload after it arrives
  kind: scalar
  unit: s
  notes: One of the three terms of $\CompressedCommunicationTime$.
- macro: \CodecEncodeTime
  latex: T_{\text{encode}}
  definition: time to compress a payload before it is sent
  kind: scalar
  unit: s
  notes: One of the three terms of $\CompressedCommunicationTime$.
- macro: \CodecOverheadTime
  latex: T_{\text{overhead}}
  definition: compute time a compression scheme spends encoding a payload before sending and decoding
    it after arrival
  kind: scalar
  unit: s
  notes: Sum of \CodecEncodeTime and \CodecDecodeTime; compression pays when it is below $\CommunicationTime(1
    - 1/\CompressionRatio)$.
- macro: \CollectiveCallStartupLatency
  latex: \alpha_{\text{eff}}
  definition: effective fixed startup time one collective call pays, including software and launch overhead,
    as measured by a matched collective benchmark
  kind: scalar
  unit: s
  notes: Larger than the wire-level $\MessageStartupLatency$; FSDP pays it about $2\LayerCount$ times
    per step.
- macro: \CollectivePayloadSize
  latex: M
  definition: size of the message each participant contributes to a collective operation
  kind: scalar
  unit: bytes
  notes: Message size each participant contributes to a collective operation (AllReduce, AllGather). KV-cache
    state is $\KvCacheMemory$, not $M$.
- macro: \CollectiveTensorSize
  latex: M_{\text{coll}}
  definition: byte size of the full tensor acted on by a collective operation
  kind: scalar
  unit: bytes
  notes: The full Broadcast, Reduce, or AllReduce tensor. Each rank contributes an equally sized shard
    of \CollectiveTensorSize/\DeviceCount to AllGather and receives the full tensor. ReduceScatter starts
    with that full-sized tensor on each rank and leaves one reduced shard. Distinct from
    \CollectivePayloadSize, including the aggregate input payload per rank in AllToAll.
- macro: \ColumnParallelWeightMatrix
  latex: \mathbf{A}
  definition: weight matrix of the first layer of a Megatron tensor-parallel pair, split by columns across
    devices
  kind: matrix
  notes: Shard $i$ is $\mathbf{A}_i$; its partner is \RowParallelWeightMatrix. Not \ActivationMatrix.
- macro: \CombinedBatch
  latex: B_{\text{total}}
  definition: set of training examples formed by the union of every data-parallel worker's minibatch for
    one update
  kind: record
  notes: Equals $\bigcup_k B_k$; its size $|B_{\text{total}}|$ normalizes the global gradient.
    Kind record because the chapter writes it plain, not calligraphic.
- macro: \CommitBatchRecordCount
  latex: N_{\text{batch}}
  definition: number of records one group-commit batch makes durable with a single storage operation
  kind: count
  notes: Not the training or serving batch size \BatchSize.
- macro: \CommunicationComputeRatio
  latex: \rho
  definition: ratio of per-step communication time to per-device compute time
  kind: scalar
  unit: dimensionless
  notes: $\rho = \CommunicationTime/(\IronlawTermTimesCompute/N)$. Values near or above 1 mean scaling
    is communication-bound. Shares the glyph $\rho$ with $\CorrelationCoefficient$.
  aliases:
  - \CommunicationcomputationRatio
- macro: \CommunicationIntensity
  latex: \text{CI}
  definition: network bytes a workload moves per floating-point operation it performs
  kind: scalar
  unit: bytes/FLOP
  notes: The fleet analogue of arithmetic intensity. Communication is exposed once it exceeds the ratio
    of network bandwidth to compute rate.
- macro: \CommunicationSlowdownFactor
  latex: r
  definition: factor by which the communication part of a step lengthens, such as on an oversubscribed
    fabric, while computation stays fixed
  kind: scalar
  unit: dimensionless
  notes: Equal to the oversubscription ratio when the cut is the bottleneck.
- macro: \CommunicationTime
  latex: T_{\text{comm}}
  definition: time per training step spent moving gradients, activations and parameter shards between
    devices at scale N
  kind: scalar
  unit: s
  notes: The communication term of the Fleet Law, $\DistributedStepTime = \IronlawTermTimesCompute/N +
    \CommunicationTime + \SynchronizationTime - \OverlappedTime$; only $\CommunicationTime - \OverlappedTime$
    is exposed.
- macro: \CommunicationTimeFraction
  latex: f
  definition: share of each training step a workload spends communicating
  kind: scalar
  unit: dimensionless
  notes: Enters the relative-throughput estimate $1/((1-f) + f\,r)$ when only the communication share
    slows by a factor $r$.
- macro: \CompletedRoundIndex
  latex: r
  definition: position of one completed round among those a federated run executes, as summed in the time
    to target and indexed in the per-round traffic budget
  kind: index
  notes: Same concept as \FederatedRoundIndex but lettered r here; see questions.
- macro: \ComponentAvailability
  latex: A_{\text{component}}
  definition: probability that one component is up at a given instant
  kind: scalar
  unit: dimensionless
  notes: A job that needs $\RequiredComponentCount$ components at once has availability $(\ComponentAvailability)^{\RequiredComponentCount}$
    under independent, identical components.
- macro: \ComponentFailureRate
  latex: \lambda
  definition: rate at which one component fails
  kind: scalar
  unit: failures/hour
  notes: The system-wide rate is $N\lambda$ under independent, identical components. FIT counts failures
    per $10^9$ device-hours, so $\lambda = \text{FIT} \times 10^{-9}$ per hour. Shares $\lambda$ with
    $\RegularizationWeight$.
  aliases:
  - \PercomponentFailureRate
- macro: \ComponentHazardRate
  latex: h
  definition: instantaneous failure rate of a component as a function of its age, the hazard function
  kind: function
  unit: failures/hour
  notes: Written with its age argument, $\ComponentHazardRate(\TimeInstant)$. Falls during infant mortality,
    is flat over the useful life, and rises at wear-out (the bathtub curve); in the flat region it equals
    the constant $\ComponentFailureRate$.
- macro: \ComponentMttf
  latex: \text{MTTF}_{\text{component}}
  definition: mean time to failure of one component, the reciprocal of its constant failure rate
  kind: scalar
  unit: hours
  notes: $1/\ComponentFailureRate$. Dividing it by $\RequiredComponentCount$ gives $\SystemMtbf$ under
    independent, identical components. Same quantity as $\MeanTimeToFailure$ with the component level
    written out.
- macro: \ComponentReliability
  latex: R_{\text{single}}
  definition: probability that one component of a system runs without failure up to a given time, its
    survival function
  kind: scalar
  unit: dimensionless
  notes: $e^{-\ComponentFailureRate t}$ under a constant failure rate. Indexed by component in the series
    product $\SystemReliability = \prod_i \ComponentReliability_i$. Not availability $\SteadyStateAvailability$,
    which counts repairs.
- macro: \CompressedCommunicationTime
  latex: T_{\text{compressed}}
  definition: total time to encode, transfer and decode a compressed payload
  kind: scalar
  unit: s
  notes: $\CodecEncodeTime + \TransferTimeForPayload$ at size $M/\CompressionRatio$ $+ \CodecDecodeTime$;
    compression pays only when this is below the uncompressed transfer time.
- macro: \CompressedGradientUpdate
  latex: \mathbf{v}
  definition: compressed update a worker transmits at one step, the compressor applied to its gradient
    plus error-feedback residual
  kind: vector
  notes: Not \UpstreamGradientVector, which also renders bold v.
- macro: \CompressedGradientUpdateElement
  latex: v
  definition: value the compressor transmits for one gradient element at one step
  kind: scalar
  unit: varies
  notes: One component of \CompressedGradientUpdate; unit is that of the gradient element.
- macro: \ContendingApplicationCount
  latex: N
  definition: number of applications contending for a shared cluster, which sets each application's fair
    share as one over it
  kind: count
  notes: Themis finish-time fairness compares completion time in the shared cluster with completion time
    on a 1/N share. Not $\DeviceCount$.
- macro: \ContextChunkTokenCount
  latex: n
  definition: number of tokens in one device's chunk of the sequence under context parallelism
  kind: count
  notes: Equals $\SequenceLength/\ContextParallelDegree$. Sets the ring-attention overlap condition.
- macro: \ContextParallelDegree
  latex: c
  definition: number of devices that each hold a slice of the sequence in context parallelism
  kind: count
  notes: Divides per-device attention memory and FLOPs by $c$; aggregate attention FLOPs still grow as
    $\SequenceLength^2$.
- macro: \ContextParallelRankIndex
  latex: i
  definition: position of one device in a context-parallel ring, which is also the index of the query
    chunk that device holds
  kind: index
  notes: Runs over the \ContextParallelDegree devices; neighbors are $(i \pm 1) \bmod c$.
- macro: \CorrelationCoefficient
  latex: \rho
  definition: Pearson correlation coefficient between two random quantities
  kind: scalar
  unit: dimensionless
  notes: Shares the glyph $\rho$ with $\CommunicationComputeRatio$.
  aliases:
  - \Correlation
- macro: \CostAnomalyScore
  latex: Z
  definition: number of historical standard deviations by which the current period's cost differs from
    its historical mean
  kind: scalar
  unit: dimensionless
  notes: Not \ProportionTestStatistic of an A/B test.
- macro: \CurrentPeriodCost
  latex: C_{\text{current}}
  definition: observed cost of the current accounting period, such as one day
  kind: scalar
  unit: USD
- macro: \CutCrossingDataVolume
  latex: V_{\text{cut}}
  definition: bytes an exchange must send across a fabric's minimum bisection cut
  kind: scalar
  unit: bytes
- macro: \DataEgressCost
  latex: C_{\text{egress}}
  definition: cost of transferring data out of a storage region or provider over the network
  kind: scalar
  unit: USD
- macro: \DataParallelDegree
  latex: N_{\text{DP}}
  definition: number of model replicas that each process a different slice of the batch in data parallelism
  kind: count
  notes: With tensor and pipeline parallelism, $N = \DataParallelDegree \cdot \PipelineParallelDegree
    \cdot \TensorParallelDegree$. A robust-aggregation analysis also counts the contributing replicas
    or clients with it.
  aliases:
  - \DataparallelDegreeDp
- macro: \DataPipelineProcessingCost
  latex: C_{\text{process}}
  definition: cost of running data and feature pipelines over a processed data volume
  kind: scalar
  unit: USD
  notes: Not \DataProcessingCost (training passes over a dataset).
- macro: \DegradedStepTime
  latex: T_{\text{slow}}
  definition: time of one training step on an allocation degraded by a straggler
  kind: scalar
  unit: s
  notes: Compared with $\HealthyStepTime$ in the straggler replacement break-even.
- macro: \DepartmentQuotaLimit
  latex: Q_{\text{department}}
  definition: total capacity limit of a department in a hierarchical quota tree
  kind: count
  notes: Counted in accelerators; shared by the department's teams.
- macro: \DeploymentDuration
  latex: T_{\text{deployment}}
  definition: length of time one model version stays in production serving traffic
  kind: scalar
  unit: s
  notes: Not $\DeploymentAge$, the time elapsed since deployment.
- macro: \DestinationRankIndex
  latex: j
  definition: position of the rank that receives a chunk in a collective exchange, such as AllToAll
  kind: index
  notes: Pairs with the sending rank $\RankIndex$. Exempt inside a subscript.
- macro: \DeviceCount
  latex: N
  definition: number of devices (accelerators) taking part in one distributed job, also the rank count
    of a collective
  kind: count
  notes: Devices (accelerators or nodes) participating in one distributed job. Accepted attempts in an
    agentic cohort are $N_{\text{acc}}$, not $N$.
  aliases:
  - \NumberOfDevices
- macro: \DeviceSilentCorruptionProbability
  latex: p
  definition: probability that one device suffers at least one residual silent data corruption, an error
    the hardware does not correct, over a stated observation interval
  kind: scalar
  unit: dimensionless
  notes: Fleet probability of at least one such error is $1-(1-p)^{\DeviceCount}$ under independence.
    Raw bit flips that hardware corrects do not count.
- macro: \DistributedStepTime
  latex: T_{\text{step}}
  definition: wall-clock time of one training step on N devices
  kind: scalar
  unit: s
  notes: 'Left-hand side of the Fleet Law: $\IronlawTermTimesCompute/N + \CommunicationTime + \SynchronizationTime
    - \OverlappedTime$.'
- macro: \DominantShare
  latex: d
  definition: a tenant's largest share of fleet capacity across resource types, the quantity dominant
    resource fairness equalizes
  kind: scalar
  unit: dimensionless
  notes: Maximum over resources of allocation divided by fleet capacity.
- macro: \DoubleTreeAllReduceTime
  latex: T_{\text{double-tree}}
  definition: time to complete an AllReduce over two complementary pipelined binary trees, each carrying
    half the payload
  kind: scalar
  unit: s
  notes: About $2\log_2 \DeviceCount\,\MessageStartupLatency + 2\CollectivePayloadSize/\LinkBandwidth$.
- macro: \DragonflyGlobalChannelCount
  latex: h
  definition: number of global channels, links to other groups, on each router of a dragonfly topology
  kind: count
  notes: Not the coordination overhead $h$.
- macro: \DragonflyGroupRouterCount
  latex: a
  definition: number of routers in one fully connected group of a dragonfly topology
  kind: count
  notes: 'Balanced dragonfly of Kim et al.: $a = 2p = 2h$.'
- macro: \DragonflyTerminalPortCount
  latex: p
  definition: number of terminal (endpoint-facing) ports on each router of a dragonfly topology
  kind: count
  notes: The ratio $h/p$ sets global bandwidth relative to injection bandwidth.
- macro: \DurableAcknowledgmentTime
  latex: t_{\text{ack}}
  definition: time at which a group-commit batch's durable acknowledgment becomes available
  kind: scalar
  unit: s
- macro: \EffectiveAdmissionCeiling
  latex: Q_{\text{effective}}
  definition: largest allocation a team can be admitted to before any reclamation, its cap or the department's
    unused capacity, whichever is smaller
  kind: count
  notes: Minimum of the team quota cap and the department limit less sibling allocations.
- macro: \EffectiveFleetThroughput
  latex: R_{\text{eff}}
  definition: useful floating-point rate a fleet sustains after per-device, scaling and operational losses
  kind: scalar
  unit: FLOP/s
  notes: '$\EffectiveFleetThroughput = N \PeakRate \times \ModelFlopsUtilization \times \ScalingEfficiency
    \times \RuntimeGoodput$: $\ModelFlopsUtilization$ is the single-device baseline, $\ScalingEfficiency$
    the in-step scaling loss, and $\RuntimeGoodput$ the out-of-step operational loss.'
- macro: \EffectiveSpotTrainingCost
  latex: C_{\text{effective}}
  definition: spot price scaled by billed time over productive time, the cost of each hour of retained
    training progress
  kind: scalar
  unit: USD/hour
  notes: Stays near the spot price when interruption losses are small.
- macro: \EgressArrivalRate
  latex: \lambda_{\text{arr}}
  definition: aggregate rate at which traffic arrives at one switch egress port
  kind: scalar
  unit: bytes/s
  notes: Pairs with $\EgressServiceRate$; while it exceeds the service rate the egress queue grows. Same glyph
    as the request arrival rate $\ArrivalRate$, which counts requests per second rather than bytes.
- macro: \EgressBufferCapacity
  latex: Q_{\text{max}}
  definition: largest amount of traffic one switch egress buffer can hold
  kind: scalar
  unit: bytes
  notes: Upper cap of the egress queue occupancy.
- macro: \EgressPortUtilization
  latex: \rho_{\text{egress}}
  definition: ratio of the traffic arrival rate at one switch egress port to the rate the port drains it
  kind: scalar
  unit: dimensionless
  notes: $\EgressPortUtilization = \EgressArrivalRate/\EgressServiceRate$. Below one, idle intervals drain
    the queue; above one, occupancy climbs to a control threshold or the buffer limit. A packet queue, not
    the request queue of a server, $\ServingUtilization$.
- macro: \EgressPrice
  latex: R_{\text{egress/GB}}
  definition: price of transferring one gigabyte out over the network
  kind: scalar
  unit: USD/GB
- macro: \EgressQueueOccupancy
  latex: Q
  definition: amount of traffic queued at one switch egress port at a given time
  kind: scalar
  unit: bytes
  notes: Written $Q(t)$; grows at the net rate of arrivals minus egress service, capped at the buffer
    capacity.
- macro: \EgressServiceRate
  latex: \mu
  definition: rate at which one switch egress port drains queued traffic
  kind: scalar
  unit: bytes/s
  notes: Overload when the arrival rate exceeds it; queued bytes $Q$ wait about $Q/\mu$. Not the request
    service rate of a server, \ServiceRate.
- macro: \ElasticMaximumWorkerCount
  latex: N_{\text{max}}
  definition: largest number of workers an elastic job declares it can use, the upper end of its elastic
    range
  kind: count
  notes: Upper end of the elastic range.
- macro: \ElasticMinimumWorkerCount
  latex: N_{\text{min}}
  definition: smallest number of workers an elastic job declares it can run on, the lower end of its elastic
    range
  kind: count
  notes: Graceful preemption shrinks a job toward it before checkpoint-and-preempt.
- macro: \ElectricityPrice
  latex: R_{\$/\text{kWh}}
  definition: price of electrical energy
  kind: scalar
  unit: USD/(W*h)
  notes: Quoted per kilowatt-hour.
- macro: \EmbeddingShardCount
  latex: N_{\text{shards}}
  definition: number of shards an embedding table is partitioned into
  kind: count
- macro: \EmpiricalExceedanceFraction
  latex: \hat{\zeta}_{u}
  definition: share of the recorded observations that exceed the threshold, an estimate of the exceedance
    probability
  kind: scalar
  unit: dimensionless
- macro: \EngineerHourlyCost
  latex: C_{\text{engineer}}
  definition: fully loaded cost of one hour of engineering time
  kind: scalar
  unit: USD/h
  notes: Includes salary, benefits and overhead.
- macro: \ErasureDataFragmentCount
  latex: d
  definition: number of data fragments an erasure code splits an object into, any that many of the stored
    fragments recovering the original
  kind: count
  notes: Pairs with $m$ parity fragments; the storage overhead is $(d+m)/d$.
- macro: \ErasureParityFragmentCount
  latex: m
  definition: number of parity fragments an erasure code adds to the data fragments of an object
  kind: count
  notes: Up to this many fragments may be lost without losing data. Not the pipeline microbatch count
    $\MicrobatchCount$.
- macro: \ErrorFeedbackResidual
  latex: \mathbf{e}
  definition: per-worker accumulator of compression error not yet transmitted, added to the next gradient
    before it is compressed
  kind: vector
  notes: Recursion $\ErrorFeedbackResidual_{t+1} = \LocalGradient_t + \ErrorFeedbackResidual_t - \CompressedGradientUpdate_t$.
- macro: \ErrorFeedbackResidualElement
  latex: e
  definition: error-feedback residual of one gradient element, the untransmitted remainder carried to
    the next step
  kind: scalar
  unit: varies
  notes: One component of \ErrorFeedbackResidual; unit is that of the gradient element.
- macro: \ExceedanceReturnLevel
  latex: z_\epsilon
  definition: level of the monitored quantity exceeded with the target probability per sampled cycle
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation. The subscript is the target exceedance probability.
- macro: \ExceedanceThreshold
  latex: u
  definition: high threshold on a performance metric above which peaks-over-threshold modeling fits exceedances
  kind: scalar
  unit: varies
  notes: Units of the monitored performance metric (m for a distance overshoot).
- macro: \ExcessDistributionFunction
  latex: F_{u}
  definition: cumulative distribution function of the excess over a threshold, conditional on exceeding
    it
  kind: function
  notes: Converges to \GeneralizedParetoDistribution as the threshold rises.
- macro: \ExcessSupportUpperEndpoint
  latex: y_{\max}
  definition: upper endpoint of the support of the threshold excess, infinite for a nonnegative shape
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation.
- macro: \ExperimentCount
  latex: N_{\text{exp}}
  definition: number of experiments a team conducts over an accounting period
  kind: count
- macro: \ExposedCommunicationTime
  latex: T_{\text{comm,exposed}}
  definition: communication and coordination time per step left on the critical path after overlap with
    computation
  kind: scalar
  unit: s
  notes: Equals $\CommunicationTime + \SynchronizationTime - \OverlappedTime$.
- macro: \ExposedUnitCount
  latex: E_{\text{exposure}}
  definition: number of exposure units, such as requests or users, a rollout exposes to a change during
    its period
  kind: count
  notes: Multiplies the regression probability and the conditional harm per unit in rollout risk.
- macro: \FailureDetectionTime
  latex: T_{\text{detect}}
  definition: time from a hardware or process fault until the system classifies it as a failure
  kind: scalar
  unit: s
  notes: Usually floored by the heartbeat timeout; the first term of $\FailureRecoveryTime$. Not $\DetectionInterval$
    of the physical domain.
- macro: \FailureEventCost
  latex: C_{\text{per-failure}}
  definition: 'cost of one failure during training: the compute it wastes plus recovery overhead'
  kind: scalar
  unit: USD
  notes: Multiplied by $\mathbb{E}[\TrainingFailureCount]$ in $\TotalTrainingRunCost$.
- macro: \FailureObservationInterval
  latex: T
  definition: length of the time interval over which failures are counted under the Poisson failure model
  kind: scalar
  unit: s
  notes: Failures in the interval are Poisson with mean $T/\MeanTimeBetweenFailures$. A generic window;
    a job's own length is $\JobDuration$. Not the queueing $\ObservationIntervalLength$, which counts
    requests.
- macro: \FailureOverheadFraction
  latex: F_{\text{fail}}
  definition: additional training time lost to failures and recovery, as a fraction of the baseline duration
  kind: scalar
  unit: dimensionless
- macro: \FailureRecoveryTime
  latex: T_{\text{recovery}}
  definition: 'time from a failure until useful training work resumes: detection, restart, checkpoint
    load and warmup'
  kind: scalar
  unit: s
  notes: $\FailureDetectionTime + \JobRestartTime + \CheckpointLoadTime + \RecoveryWarmupTime$. Excludes
    the rework since the last checkpoint, which the checkpoint waste counts. The operational MTTR of a
    training job.
- macro: \FairShareStabilizingConstant
  latex: \epsilon_{\text{stab}}
  definition: small positive constant added to recent usage in the fair-share priority so a user with
    no recent usage gets finite priority
  kind: scalar
  unit: dimensionless
  notes: The subscripted counterpart of $\NumericalStabilityConstant$ for vol2, where bare $\epsilon$
    is the privacy budget.
- macro: \FatTreeHostCount
  latex: N_{\text{hosts}}
  definition: number of hosts a non-blocking fat-tree built from switches of a given radix supports
  kind: count
  notes: $k^3/4$ at three tiers for radix $k$ ($\SwitchRadix$).
- macro: \FaultToleranceCost
  latex: C_{\text{ft}}
  definition: cost of the fault-tolerance mechanisms deployed for a training run
  kind: scalar
  unit: USD
  notes: Investment pays while its marginal cost is below the marginal reduction in expected failure cost.
- macro: \FaultToleranceInvestment
  latex: x
  definition: level of investment in a fault-tolerance mechanism, the decision variable against which
    marginal costs are compared
  kind: scalar
  unit: varies
  notes: Its unit is that of the mechanism being bought, such as spare nodes or checkpoint bandwidth.
- macro: \FeatureRetentionWindow
  latex: T_{\text{retention}}
  definition: length of feature history a feature store keeps so it can answer point-in-time queries
  kind: scalar
  unit: s
  notes: Expressed in the same unit as the update interval $\FeatureUpdateInterval$ it is divided by,
    so their ratio counts stored snapshots. Distinct from $\StorageRetentionTime$, which is in months
    and multiplies a monthly storage price, and from $\TelemetryRetentionDuration$, which retains telemetry
    samples.
- macro: \FederatedRoundCount
  latex: R
  definition: number of communication rounds a federated training run performs, or needs to reach a quality
    target
  kind: count
  notes: Federated averaging exposes rounds, participating clients and local epochs as its controls.
- macro: \FederatedRoundIndex
  latex: t
  definition: position of one communication round in a federated training run
  kind: index
  notes: Written as a superscript on \ModelParameters ($\ModelParameters_k^t$).
- macro: \FiberPropagationSpeed
  latex: c_{\text{fiber}}
  definition: speed at which light propagates through optical fiber, roughly two-thirds of its vacuum
    value
  kind: scalar
  unit: m/s
  notes: About 200,000 km/s; sets the light-barrier latency floor.
- macro: \FirstClientMaskedUpdate
  latex: \mathbf{y}_A
  definition: masked update the first client, labeled A, uploads in a two-client secure-aggregation illustration
  kind: vector
  notes: 'render_exception: kept non-bold as the chapter renders it today; a vector written in plain italic
    by the field convention of the surrounding derivation.'
- macro: \FirstClientModelParameters
  latex: \theta_A
  definition: model parameters of the first client, labeled A, in a two-client secure-aggregation illustration
  kind: vector
  notes: 'render_exception: plain theta as for \ModelParameters. Subscript A is a client label.'
  render_exception: Machine learning writes the parameter vector as a plain theta, never bold.
- macro: \FirstRankComputeTime
  latex: T_{\text{rank}_0}
  definition: local compute time of the first rank (rank 0) in one synchronous training step
  kind: scalar
  unit: s
  notes: One argument of the max in $\StragglerStepTime$.
- macro: \FirstRingTraceElement
  latex: a
  definition: first of the four elements of a rank's gradient vector in the four-GPU ring AllReduce trace,
    each element one chunk
  kind: scalar
  unit: varies
  notes: 'Indexed by rank, e.g. its value on GPU $i$. Unit: loss per parameter unit. Illustrative example
    only.'
- macro: \FleetCommunicationTaxonomyAxis
  latex: C_2
  definition: Communication axis of the C³ taxonomy, data movement across the network fabric, viewed as
    the set of techniques it covers so that axis intersections name zones of the taxonomy
  kind: set
  notes: Label of the Communication axis of the C$^3$ taxonomy; appears alone as an axis label and inside
    set intersections such as $C_1 \cap C_2$. Not the gradient clipping norm $C$ and not a cost. Counterpart
    of the D·A·M axes ($\DataTaxonomyAxis$ and its siblings).
  render_exception: The C-cubed axes are written C with the axis number as a subscript, a taxonomy label
    treated as a set of techniques.
- macro: \FleetComputeTaxonomyAxis
  latex: C_1
  definition: Compute axis of the C³ taxonomy, local arithmetic and memory within a node, viewed as the
    set of techniques it covers so that axis intersections name zones of the taxonomy
  kind: set
  notes: Label of the Compute axis of the C$^3$ taxonomy; appears alone as an axis label and inside set
    intersections such as $C_1 \cap C_2$. Not the gradient clipping norm $C$ and not a cost. Counterpart
    of the D·A·M axes ($\DataTaxonomyAxis$ and its siblings).
  render_exception: The C-cubed axes are written C with the axis number as a subscript, a taxonomy label
    treated as a set of techniques.
- macro: \FleetCoordinationTaxonomyAxis
  latex: C_3
  definition: Coordination axis of the C³ taxonomy, synchronization, failure recovery and scheduling across
    the fleet, viewed as the set of techniques it covers so that axis intersections name zones of the
    taxonomy
  kind: set
  notes: Label of the Coordination axis of the C$^3$ taxonomy; appears alone as an axis label and inside
    set intersections such as $C_1 \cap C_2$. Not the gradient clipping norm $C$ and not a cost. Counterpart
    of the D·A·M axes ($\DataTaxonomyAxis$ and its siblings).
  render_exception: The C-cubed axes are written C with the axis number as a subscript, a taxonomy label
    treated as a set of techniques.
- macro: \FleetEnergyProductivity
  latex: \rho_{\text{energy}}
  definition: useful floating-point operations a fleet delivers per joule of device, cooling and network
    energy
  kind: scalar
  unit: FLOP/J
  notes: $\UsefulModelFlops$ divided by the energy of devices, attributable cooling and the network fabric.
- macro: \FleetResourceCapacity
  latex: C_{r}
  definition: total fleet capacity of one resource type
  kind: scalar
  unit: varies
  notes: Unit is that of the resource type. Normalizes tenant allocations into shares.
- macro: \FourthRingTraceElement
  latex: d
  definition: fourth of the four elements of a rank's gradient vector in the four-GPU ring AllReduce trace,
    each element one chunk
  kind: scalar
  unit: varies
  notes: 'Indexed by rank, e.g. its value on GPU $i$. Unit: loss per parameter unit. Illustrative example
    only.'
- macro: \FreshnessObjective
  latex: S_{\text{freshness}}
  definition: 'freshness dimension of a service''s SLO vector: its indicator, target, window and owner'
  kind: record
- macro: \GeneralizedParetoDistribution
  latex: H
  definition: generalized Pareto cumulative distribution function of the excess over a high threshold
  kind: function
  notes: Parameterized by \GpdScaleParameter and \TailShapeParameter.
- macro: \GeneralizedParetoLikelihood
  latex: L
  definition: likelihood of the generalized Pareto scale and shape given the recorded threshold exceedances
  kind: function
  notes: Maximized to fit \GpdScaleParameter and \TailShapeParameter.
- macro: \GevLocationParameter
  latex: \mu
  definition: location parameter of the generalized extreme value distribution
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation.
- macro: \GevScaleParameter
  latex: \sigma
  definition: scale parameter of the generalized extreme value distribution
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation; positive.
- macro: \GlobalBatchGradient
  latex: \mathbf{g}_{\text{global}}
  definition: gradient over the global batch, the average of every data-parallel worker's minibatch gradient
    that one synchronous update applies
  kind: vector
  notes: Equals $(1/\DeviceCount)\sum_k \MinibatchGradient_k$ for equal local batches; AllReduce computes
    it.
- macro: \GpdScaleParameter
  latex: \tilde{\sigma}
  definition: scale parameter of the generalized Pareto distribution fitted to exceedances over a threshold
  kind: scalar
  unit: varies
  notes: Not \PixelStandardDeviation, which shares the glyph.
- macro: \GpuAvailability
  latex: A_{\text{GPU}}
  definition: probability that one GPU is up at a randomly chosen instant
  kind: scalar
  unit: dimensionless
  notes: A cluster needing all $\RequiredComponentCount$ GPUs is up with probability $(\GpuAvailability)^{\RequiredComponentCount}$
    under independent failures. The GPU case of $\ComponentAvailability$.
- macro: \GpuFailureRate
  latex: \lambda_{\text{GPU}}
  definition: rate at which one GPU fails, the reciprocal of its mean time to failure
  kind: scalar
  unit: failures/hour
  notes: $1/\GpuMttf$ under a constant failure rate. The GPU term of a per-GPU failure-domain sum; the
    generic per-component rate is $\ComponentFailureRate$.
- macro: \GpuMttf
  latex: \text{MTTF}_{\text{GPU}}
  definition: mean time to failure of one GPU, its average operating time before it fails
  kind: scalar
  unit: hours
  notes: Per-GPU case of $\MeanTimeToFailure$. A fleet of N GPUs sees about N times 24 over it failures
    per day. The reliability appendix writes the label lowercase (gpu); the entry fixes GPU.
- macro: \GpuTopologicalDistance
  latex: d
  definition: topological distance between two GPUs, 0 on the same node, 1 in the same rack and 2 across
    racks
  kind: function
  unit: dimensionless
  notes: Argument of the locality penalty function.
- macro: \GradientElementCount
  latex: d_{\text{grad}}
  definition: number of elements in the gradient vector a worker communicates
  kind: count
  notes: The gradient lives in $\mathbb{R}^{\GradientElementCount}$. Not the model hidden dimension \HiddenDimension.
- macro: \GradientPayload
  latex: M_{\text{grad}}
  definition: bytes of one full set of gradients that a data-parallel collective reduces each step, the
    parameter count times the gradient's communication width
  kind: scalar
  unit: bytes
  notes: Ring AllReduce moves about $2(\DeviceCount-1)/\DeviceCount \times M_{\text{grad}}$ per worker.
    Can differ from \GradientMemory when gradients are stored and sent at different precisions.
- macro: \GradientStaleness
  latex: \tau_{\text{stale}}
  definition: number of parameter updates between computing a gradient and applying it
  kind: count
  notes: Zero under bulk-synchronous training; bounded by the slack $s$ under stale-synchronous training.
- macro: \GroupCommitWaitTime
  latex: L_{\text{lat}, i}
  definition: time one event waits under group commit, from entering the batching queue until its batch's
    durable acknowledgment
  kind: scalar
  unit: s
  notes: The event index i is part of the rendered symbol. Not the fixed per-step overhead \Latency, which
    renders L_{\text{lat}}.
- macro: \HashRingServer
  latex: s
  definition: one server placed on a consistent-hashing ring
  kind: record
- macro: \HashRingServerCount
  latex: N
  definition: number of servers placed on a consistent-hashing ring
  kind: count
  notes: The size of $\HashRingServerSet$. Not $\DeviceCount$.
- macro: \HashRingServerSet
  latex: \mathcal{S}_{\text{srv}}
  definition: set of servers placed on a consistent-hashing ring
  kind: set
- macro: \HealthyStepTime
  latex: T_{\text{healthy}}
  definition: time of one training step after a straggler has been replaced
  kind: scalar
  unit: s
  notes: Compared with $\DegradedStepTime$ in the straggler replacement break-even.
- macro: \HeartbeatInterval
  latex: H
  definition: interval at which each rank sends a liveness heartbeat to the coordinator
  kind: scalar
  unit: s
  notes: The failure-detection timeout is $\HeartbeatInterval + k\sigma_d$ in the heuristic of the fault-tolerance
    chapter.
- macro: \HighOccupancyBinCount
  latex: m
  definition: number of bins whose occupancy is at or above a threshold, in the balls-into-bins argument
    for two-choice routing
  kind: count
- macro: \HourlyComponentFailureRate
  latex: \lambda_{\text{hour}}
  definition: per-component failure rate expressed in failures per hour, converted from a FIT rating
  kind: scalar
  unit: failures/hour
  notes: $\text{FIT} \times 10^{-9}$. The same quantity as $\ComponentFailureRate$ with its unit named
    in the subscript.
- macro: \HypothesisTestFalseNegativeRate
  latex: \beta_{\text{stat}}
  definition: probability that a hypothesis test misses a true effect
  kind: scalar
  unit: dimensionless
  notes: One minus it is the statistical power. Not $\LinkBandwidth$ ($\beta$).
  aliases:
  - \TypeIAndTypeIiErrorRatesStat
- macro: \HypothesisTestSignificanceLevel
  latex: \alpha_{\text{sig}}
  definition: probability that a hypothesis test rejects a true null hypothesis
  kind: scalar
  unit: dimensionless
  notes: One minus it is the confidence level. Also the target level of a multiple-testing procedure such
    as Benjamini-Hochberg. Same meaning as $\SignificanceLevel$ ($\alpha$); the two should merge.
  aliases:
  - \TypeIAndTypeIiErrorRatesSig
- macro: \IdealAcceleratorTime
  latex: T_{\text{ideal}}
  definition: accelerator-time a job's work needs when every device runs at the ideal rate with no scheduling,
    runtime or program loss
  kind: scalar
  unit: s
  notes: Dividing it by $\DeviceCount \times \RuntimeGoodput \times \ProgramGoodput$ gives the job's run time once it
    holds its devices.
- macro: \IndependentEventProbability
  latex: p
  definition: probability of one of several independent, identical events, such as one component failing
    or one worker straggling in a step
  kind: scalar
  unit: dimensionless
  notes: The chance that at least one of $\RequiredComponentCount$ occurs is $1-(1-p)^{\RequiredComponentCount}
    \approx \RequiredComponentCount p$ while that product is small.
- macro: \IndependentSampleRate
  latex: f
  definition: rate at which statistically independent samples of a monitored quantity occur
  kind: scalar
  unit: Hz
  notes: At most the control-loop \SamplingRate; correlated samples lower it.
- macro: \InferenceCost
  latex: C_{\text{infer}}
  definition: recurring cost of serving a model in production
  kind: scalar
  unit: USD
  notes: With $\TrainingCost$, a term of the ML total cost of ownership.
  aliases:
  - \DollarCostInfer
- macro: \InjectionBandwidth
  latex: \text{BW}_{\text{inject}}
  definition: rate at which one endpoint can inject bytes into the fabric
  kind: scalar
  unit: bytes/s
- macro: \InterNodeContextParallelDegree
  latex: c_{\text{inter}}
  definition: number of nodes a sequence is split across by ring attention in hierarchical context parallelism
  kind: count
  notes: The ring factor of a hierarchical layout; the Ulysses factor inside a node is \IntraNodeContextParallelDegree.
- macro: \InterleavedPipelineBubbleFraction
  latex: b_{\text{interleaved}}
  definition: fraction of pipeline device time spent idle when each device runs several interleaved virtual
    stages
  kind: scalar
  unit: dimensionless
  notes: $(\PipelineParallelDegree-1)/(\PipelineParallelDegree-1+\MicrobatchCount\,\VirtualPipelineStagesPerDevice)$;
    the interleaved counterpart of $\PipelineBubbleFraction$.
- macro: \IntervalCompletionTime
  latex: T_{\text{total}}
  definition: elapsed time, failed attempts included, until one compute-plus-checkpoint interval completes
  kind: scalar
  unit: s
  notes: A random variable in the renewal model; its expectation is $\SystemMtbf(e^{(\CheckpointInterval+\CheckpointWriteTime)/\SystemMtbf}-1)$.
- macro: \IntraNodeContextParallelDegree
  latex: c_{\text{intra}}
  definition: number of devices inside one node that split attention heads by an all-to-all transpose
    in hierarchical context parallelism
  kind: count
  notes: The Ulysses factor of a hierarchical layout; the ring factor across nodes is \InterNodeContextParallelDegree.
- macro: \IrreducibleLoss
  latex: C_{\mathcal{L}}
  definition: loss floor that adding parameters, data or compute does not remove within the fitted scaling
    regime
  kind: scalar
  unit: dimensionless
  notes: Constant term of the scaling law $\mathcal{L}(X) = \ScaleCoefficient X^{-\ScalingExponent} +
    \IrreducibleLoss$; in the same units as the loss.
- macro: \IsolatedJobRunTime
  latex: T
  definition: running time of one job on its own allocation with no contention from other jobs
  kind: scalar
  unit: s
  notes: Denominator of the job slowdown.
- macro: \IterationCost
  latex: C_{\text{iter}}
  definition: cost of experimentation and maintenance after a model's initial training
  kind: scalar
  unit: USD
  notes: One term of the ML total cost of ownership with \TrainingCost, \InferenceCost and \TotalDataCost.
- macro: \JobAvailability
  latex: A_{\text{all}}
  definition: probability that every component a job needs is up at the same instant
  kind: scalar
  unit: dimensionless
  notes: Equals $(\ComponentAvailability)^{\RequiredComponentCount}$ for independent, identical components,
    the reliability collapse. Not a replicated service's availability, which redundancy raises.
- macro: \JobDuration
  latex: T_{\text{job}}
  definition: wall-clock time one job or run spends executing, from start to finish
  kind: scalar
  unit: s
  notes: Run energy is $\AveragePower \times \JobDuration$; embodied-carbon allocation multiplies the
    per-hour share by it. Not \TrainingTime, which is specific to training runs.
- macro: \JobIndex
  latex: j
  definition: index of one job in a scheduler's workload
  kind: index
  notes: Subscripts per-job quantities such as slowdown, queue wait and isolated runtime.
- macro: \JobQueueWaitTime
  latex: W
  definition: time one job waits in the scheduler's queue before it starts running
  kind: scalar
  unit: s
  notes: Per-job wait, written with the job index. Not $\QueueWaitTime$, the mean wait of a queueing model.
- macro: \JobRestartTime
  latex: T_{\text{restart}}
  definition: time for the scheduler to allocate resources and launch replacement processes after a failure
  kind: scalar
  unit: s
  notes: Includes scheduler queueing, container launch, imports and communicator initialization; a term
    of $\FailureRecoveryTime$.
- macro: \JobSlowdown
  latex: S
  definition: ratio of a job's queueing-plus-running time to its isolated runtime
  kind: scalar
  unit: dimensionless
  notes: One means no delay from sharing. Themis finish-time fairness has the same form with a fair-share
    denominator.
- macro: \JobStartupTime
  latex: T_{\text{startup}}
  definition: time from a job's complete allocation to its first retained step, spent loading, initializing
    and compiling
  kind: scalar
  unit: s
  notes: A runtime goodput loss; dated from the scheduler's record of the complete allocation, not from the
    first step.
- macro: \KrumClientCount
  latex: n
  definition: total number of client updates a Krum-style robust aggregation rule selects among
  kind: count
  notes: Not defined in the chapter text; Krum's n is the number of workers.
- macro: \KvCacheBytesPerToken
  latex: m_{\text{token}}
  definition: bytes of key-value cache stored for each token held in context
  kind: scalar
  unit: bytes/token
  notes: $2 \cdot \NumberOfLayers \cdot \NumberOfKeyvalueHeadsKv \cdot \AttentionHeadDimension \cdot \ElementStorageSize$.
  aliases:
  - \KvcacheBytesPerToken
- macro: \KvCacheMemory
  latex: M_{\text{KV}}
  definition: memory the key-value cache occupies during autoregressive inference
  kind: scalar
  unit: bytes
  notes: For one sequence, sequence length times $\KvCacheBytesPerToken$; for a batch, times the batch
    size. Not $\CollectivePayloadSize$.
  aliases:
  - \KvcacheMemory
- macro: \LastRankComputeTime
  latex: T_{\text{rank}_{N-1}}
  definition: local compute time of the last rank (rank N-1) in one synchronous training step
  kind: scalar
  unit: s
  notes: One argument of the max in $\StragglerStepTime$.
- macro: \LatencyBandwidthCrossoverSize
  latex: n^*
  definition: message size at which per-message startup time equals transfer time in the alpha-beta model
  kind: scalar
  unit: bytes
  notes: $\MessageStartupLatency \cdot \LinkBandwidth$. Below it a transfer is latency-bound, above it
    bandwidth-bound. Distinct from the ring-tree algorithm crossover $\RingTreeCrossoverPayload$.
  aliases:
  - \CrossoverPoint
- macro: \LatencyObjective
  latex: S_{\text{latency}}
  definition: 'latency dimension of a service''s SLO vector: its indicator, target, window and owner'
  kind: record
  notes: A record; the latency target alone is \LatencySlo.
- macro: \LayerAllReduceTime
  latex: T_{\text{layer comm}}
  definition: time to AllReduce the gradients of one layer
  kind: scalar
  unit: s
- macro: \LayerExposedCommunicationTime
  latex: T_{\text{exposed}}
  definition: amount by which one layer's AllReduce overruns the backward computation it overlaps, left
    on the critical path
  kind: scalar
  unit: s
  notes: max(0, \LayerAllReduceTime minus the per-layer backward time).
- macro: \LayerParameterPayload
  latex: M_{\text{layer}}
  definition: bytes of one sharding unit's parameters, one layer, that a fully sharded schedule gathers
    or reduce-scatters
  kind: scalar
  unit: bytes
  notes: Three collectives of this size per layer per step under full sharding.
- macro: \LinkBandwidth
  latex: \beta
  definition: bandwidth of one network link in each direction, in the alpha-beta communication model
  kind: scalar
  unit: bytes/s
  notes: Effective throughput per link. Local to the alpha-beta model; elsewhere bandwidth is $\Bandwidth$.
- macro: \LocalBatchSize
  latex: B_{\text{local}}
  definition: number of examples one data-parallel worker processes for one optimizer update
  kind: count
  notes: The global batch is $\GlobalBatchSize = \DeviceCount \times \LocalBatchSize$ without gradient
    accumulation. Distinct from \MicrobatchSize, a pipeline slice.
- macro: \LocalEpochCount
  latex: E
  definition: number of passes each federated client makes over its local data in one round
  kind: count
  notes: Bare E; energy quantities in the same chapter always carry a subscript. E^* is its optimum.
- macro: \LocalGradient
  latex: \mathbf{g}
  definition: gradient vector one data-parallel worker computes from its local batch in one step, its
    contribution to the gradient collective
  kind: vector
  notes: Indexed by worker ($\LocalGradient_0$) or by step ($\LocalGradient_t$). Compression, error feedback
    and SHARP aggregation act on it. Distinct from \MicrobatchGradient.
- macro: \LocalRankIndex
  latex: i
  definition: position of an accelerator within its node, its local rank, which in a rail-optimized fabric
    also names the rail it attaches to
  kind: index
- macro: \LocalTokenCount
  latex: B_{\text{tok}}
  definition: number of tokens in one rank's local batch entering a mixture-of-experts layer
  kind: count
  notes: All ranks together route $\DeviceCount \cdot \LocalTokenCount$ tokens per layer.
- macro: \LocalUpdateCount
  latex: H_{\text{local}}
  definition: number of optimizer updates each worker takes on its own between synchronizations in local
    SGD
  kind: count
  notes: Cuts synchronization frequency per local update by this factor.
- macro: \LocalityPenaltyFunction
  latex: w
  definition: penalty a placement's locality cost assigns to a GPU pair as a function of their topological
    distance
  kind: function
  unit: dimensionless
  notes: Illustrative values w(0)=0 same node, w(1)=1 same rack, w(2)=10 different racks; policy weights,
    not measured ratios.
- macro: \LoggpLongMessageTime
  latex: T_{\text{long}}
  definition: time to send one long message of n bytes in the LogGP model
  kind: scalar
  unit: s
  notes: $\SenderOverhead + \LogpNetworkLatency + (n-1)G + \ReceiverOverhead$, where $G$ is the gap per
    byte; $n$ is the alpha-beta message size.
  aliases:
  - \LoggpLongmessageTime
- macro: \LogpNetworkLatency
  latex: L_{\text{LogGP}}
  definition: time a message spends in flight across the network in the LogP and LogGP models, excluding
    processor overhead
  kind: scalar
  unit: s
  notes: Can be overlapped with computation, unlike $\SenderOverhead$ and $\ReceiverOverhead$; the alpha-beta
    startup cost is roughly $\SenderOverhead + \LogpNetworkLatency + \ReceiverOverhead$.
  aliases:
  - \LogploggpNetworkLatency
- macro: \LongMessageGapPerByte
  latex: G
  definition: time per byte to send a long message in the LogGP communication model
  kind: scalar
  unit: s/byte
  aliases:
  - \LongmessageGapPerByte
- macro: \LostWorkReplayTime
  latex: T_{\text{replay}}
  definition: time to recompute the training steps lost since the last checkpoint after a restart
  kind: scalar
  unit: s
  notes: On average half the checkpoint interval; controlled by $\CheckpointInterval$.
- macro: \MaxReceivedTokenCount
  latex: B_{\text{max}}
  definition: largest number of tokens any one rank receives from other ranks in an expert-dispatch exchange
  kind: count
  notes: The maximum over ranks of the remote token assignments to experts on that rank.
- macro: \MeanTimeBetweenFailures
  latex: \text{MTBF}
  definition: average time between consecutive failures of a repairable component or system
  kind: scalar
  unit: hours
  notes: The whole-job value is $\SystemMtbf$, which falls as $1/\RequiredComponentCount$; chapters still
    write subscripted forms (system, cluster, node) that need their own entries.
  aliases:
  - \MeanTimeBetweenFailuresThree
- macro: \MeanTimeToFailure
  latex: \text{MTTF}
  definition: average operating time of a component before it fails, derived from its FIT rate
  kind: scalar
  unit: hours
  notes: $10^9/\text{FIT}$. Distinct from $\MeanTimeBetweenFailures$ when repair cycles are modeled.
- macro: \MeanTimeToRepair
  latex: \text{MTTR}
  definition: average time to restore service after a failure
  kind: scalar
  unit: hours
  notes: Steady-state availability is $\MeanTimeBetweenFailures/(\MeanTimeBetweenFailures + \MeanTimeToRepair)$.
- macro: \MessageInjectionGap
  latex: g
  definition: minimum interval between consecutive message injections at one node in the LogP and LogGP
    models
  kind: scalar
  unit: s
- macro: \MessageStartupLatency
  latex: \alpha
  definition: fixed startup time paid once per message in the alpha-beta communication model, independent
    of message size
  kind: scalar
  unit: s
  notes: The size-dependent cost is message size divided by $\LinkBandwidth$. Shares $\alpha$ with $\SignificanceLevel$.
  aliases:
  - \PermessageLatency
- macro: \MicrobatchCount
  latex: m
  definition: number of microbatches one pipeline-parallel step splits its batch into
  kind: count
  notes: The pipeline bubble fraction $\PipelineBubbleFraction$ falls as it grows.
- macro: \MlProductivityGoodput
  latex: \text{MPG}
  definition: fraction of a fleet's capacity-time that becomes useful work at the ideal rate, the product
    of scheduling, runtime and program goodput
  kind: scalar
  unit: dimensionless
  notes: $\MlProductivityGoodput = \SchedulingGoodput \times \RuntimeGoodput \times \ProgramGoodput$, each loss charged
    to exactly one factor. Written as a text acronym, like $\ModelFlopsUtilization$.
- macro: \ModelLifetimeCost
  latex: C_{\text{total}}
  definition: total cost of one model version over its deployment, the one-time training cost plus the
    serving cost of every query it answers
  kind: scalar
  unit: USD
  notes: Not $\TotalDataCost$, the lifecycle cost of a dataset, which shares the glyph.
- macro: \MonitoredMetric
  latex: X
  definition: metric a statistical process control chart monitors over time
  kind: scalar
  unit: varies
  notes: Unit is the metric's own; the cost series of cost anomaly detection is one instance.
- macro: \MonitoredMetricMean
  latex: \mu
  definition: established historical mean of a monitored metric, the center line of its control chart
  kind: scalar
  unit: varies
  notes: Unit is the metric's own (USD for a cost series).
- macro: \MonitoredMetricStandardDeviation
  latex: \sigma
  definition: established historical standard deviation of a monitored metric, which sets its control
    limits
  kind: scalar
  unit: varies
  notes: Unit is the metric's own.
- macro: \MonthlyOptimizationSavings
  latex: C_{\text{save,monthly}}
  definition: monthly savings an optimization yields, net of added operating and maintenance costs
  kind: scalar
  unit: USD/month
- macro: \MultiDeviceRunTime
  latex: T_N
  definition: wall-clock time for a fixed amount of productive work on N devices
  kind: scalar
  unit: s
  notes: Per step it equals $\DistributedStepTime$; excludes operational downtime counted by $\RuntimeGoodput$.
  aliases:
  - \NdeviceTime
- macro: \NetworkDelayStandardDeviation
  latex: \sigma_d
  definition: standard deviation of the network delay a heartbeat message experiences
  kind: scalar
  unit: s
  notes: Scaled by $\TimeoutSafetyMultiplier$ in the failure-detection timeout heuristic.
- macro: \NetworkTrafficVolume
  latex: M
  definition: bytes one worker moves across the network over a stated interval, such as one training step
  kind: scalar
  unit: bytes
  notes: Numerator of $\CommunicationIntensity = M/\Operations$. Not $\CollectivePayloadSize$, the message
    one participant contributes to a single collective, though both render $M$.
- macro: \NextFailureTime
  latex: F
  definition: random time from the start of an attempt until the next failure, exponentially distributed
    with mean the system MTBF
  kind: scalar
  unit: s
  notes: A random variable of the renewal model; $\Pr(F < \CheckpointAttemptDuration)$ is the chance an
    attempt fails.
- macro: \NicMttf
  latex: \text{MTTF}_{\text{nic}}
  definition: mean operating time of one network interface card before it fails
  kind: scalar
  unit: hours
  notes: Per-device $\MeanTimeToFailure$ for NICs, from their FIT rate.
- macro: \NicsPerNode
  latex: n_{\text{nic}}
  definition: number of network interface cards in one node
  kind: count
  notes: Each NIC adds one failure clock to the node's series sum.
- macro: \NodeMtbf
  latex: \text{MTBF}_{\text{node}}
  definition: mean time between failures that stop one compute node
  kind: scalar
  unit: hours
  notes: Reciprocal of the summed failure rates of the components whose single failure stops the node;
    the job value is $\SystemMtbf = \NodeMtbf/\ClusterNodeCount$.
- macro: \NodeStragglerProbability
  latex: p_{\text{straggle}}
  definition: probability that a single node or link is delayed enough to straggle in one collective step
  kind: scalar
  unit: dimensionless
  notes: With $N$ independent nodes, the chance at least one straggles is $1-(1-p_{\text{straggle}})^N$,
    which tends to 1 at fleet scale (straggler amplification).
- macro: \ObservedCycleCount
  latex: N
  definition: number of operating cycles, each one observation of the monitored quantity, over which exceedances
    are counted
  kind: count
- macro: \ObservedSignificanceLevel
  latex: p_{\text{val}}
  definition: p-value of a hypothesis test, the probability under the null hypothesis of a result at least
    as extreme as the one observed
  kind: scalar
  unit: dimensionless
  notes: Compared against the significance level $\SignificanceLevel$; a test rejects the null when $p
    < \SignificanceLevel$. Lives beside the other hypothesis-test entries.
- macro: \ObservedViolationFraction
  latex: V
  definition: fraction of eligible observations over a window that violate one reliability target
  kind: scalar
  unit: dimensionless
  notes: Written $V_i$.
- macro: \OccupancyThreshold
  latex: k
  definition: occupancy level at or above which a bin counts as heavily loaded in the balls-into-bins
    argument
  kind: count
- macro: \OperationalOverheadFraction
  latex: f_{\text{overhead}}
  definition: fraction of allocated wall time lost outside productive training steps
  kind: scalar
  unit: dimensionless
  notes: Checkpoint pauses, failure recovery, scheduler preemption and maintenance; in-step losses are
    in $\ScalingEfficiency$. Often $\RuntimeGoodput = 1 - \OperationalOverheadFraction$.
- macro: \OperationalTaxonomyDimension
  latex: C
  definition: one of the three operational dimensions of the C-cubed taxonomy, indexed 1 to 3 as compute,
    communication and coordination
  kind: record
  notes: Written $\OperationalTaxonomyDimension_1$ to $\OperationalTaxonomyDimension_3$. Viewed as the
    set of costs and techniques it covers when two dimensions intersect to name a co-design zone; the
    named axes are $\FleetComputeTaxonomyAxis$, $\FleetCommunicationTaxonomyAxis$ and $\FleetCoordinationTaxonomyAxis$.
- macro: \OptimizationBreakevenTime
  latex: T_{\text{breakeven}}
  definition: time for an optimization's monthly net savings to repay its one-time cost
  kind: scalar
  unit: months
- macro: \OptimizationImplementationCost
  latex: C_{\text{optimization}}
  definition: one-time cost of implementing and validating an optimization
  kind: scalar
  unit: USD
- macro: \OverlappedBackwardCommunicationTime
  latex: T_{\text{pipelined}}
  definition: time of the backward pass plus gradient communication when each layer's AllReduce overlaps
    the next layer's backward computation
  kind: scalar
  unit: s
  notes: Not \PipelinedExecutionTime, the max-form iron law.
- macro: \OverlappedTime
  latex: T_{\text{overlap}}
  definition: communication or coordination time per step hidden behind computation
  kind: scalar
  unit: s
  notes: Subtracted in the Fleet Law; the exposed communication is $\CommunicationTime - \OverlappedTime$.
- macro: \OversubscriptionRatio
  latex: R
  definition: ratio of endpoint-facing to upward bandwidth at a fabric tier, written R:1
  kind: scalar
  unit: dimensionless
  notes: 1 means non-blocking; usable bisection bandwidth falls by this factor.
- macro: \PacketBuffer
  latex: b
  definition: one packet buffer or virtual-lane queue at a switch port, a vertex of a buffer dependency
    graph
  kind: record
  notes: Indexed $b_i$, $b_j$, $b_k$; a cycle $b_1 \to \dots \to b_k \to b_1$ is necessary for a PFC deadlock.
- macro: \PairwiseMaskSecret
  latex: \mathbf{s}
  definition: shared random mask vector two clients derive from a common secret, which one adds and the
    other subtracts so that it cancels in the secure-aggregation sum
  kind: vector
  notes: Indexed by the ordered client pair, $\mathbf{s}_{ij} = -\mathbf{s}_{ji}$.
- macro: \ParameterPayload
  latex: M_{\text{param}}
  definition: bytes of the full parameter set at the communication precision, the payload a fully sharded
    schedule gathers
  kind: scalar
  unit: bytes
  notes: Equals \GradientPayload when parameters and gradients travel at the same width; per-worker fully
    sharded traffic approaches $3M_{\text{param}}$ versus $2M_{\text{param}}$ for DDP.
- macro: \ParameterServerCount
  latex: K_{\text{srv}}
  definition: number of parameter servers across which a parameter-server system shards the model state
  kind: count
- macro: \ParticipatingClientCount
  latex: N_{\text{clients}}
  definition: number of clients whose updates one federated round aggregates
  kind: count
  notes: Unrelated to the C^3 axes and to the DP clipping norm \GradientClippingNorm.
- macro: \PartnerBitIndex
  latex: k
  definition: bit position whose mask pairs each rank with its partner, rank index XOR two to this power,
    in one round of recursive halving-doubling
  kind: index
  notes: Runs from 0 to $\log_2\DeviceCount - 1$; ReduceScatter visits bits in increasing order and AllGather
    reverses it.
- macro: \PcieLinkFailureRate
  latex: \lambda_{\text{PCIe}}
  definition: rate at which the PCIe connection between one GPU and its host fails
  kind: scalar
  unit: failures/hour
  notes: Reciprocal of the PCIe switch mean time to failure. One term of a per-GPU failure-domain sum.
- macro: \PerDeviceComputeTime
  latex: T_{\text{compute,local}}
  definition: compute time each device spends per step after the work is divided evenly across the devices
    of a job
  kind: scalar
  unit: s
  notes: Equals $\IronLawComputeTime/\DeviceCount$, the Fleet Law's compute term.
- macro: \PerExperimentComputeCost
  latex: C_{\text{compute,per-exp}}
  definition: compute cost of one experiment
  kind: scalar
  unit: USD
- macro: \PerExperimentEngineeringCost
  latex: C_{\text{engineer,per-exp}}
  definition: engineering cost of one experiment
  kind: scalar
  unit: USD
- macro: \PerGpuNetworkFailureRate
  latex: \lambda_{\text{network/GPU}}
  definition: share of a node's network-path failure rate charged to each of its GPUs
  kind: scalar
  unit: failures/hour
  notes: The node's NIC and cable failure rate, $1/\NicMttf$, divided by the GPUs per node.
- macro: \PerGpuPowerFailureRate
  latex: \lambda_{\text{power/GPU}}
  definition: share of a node's power-supply failure rate charged to each of its GPUs, counting only supplies
    whose single failure stops the node
  kind: scalar
  unit: failures/hour
  notes: $\SeriesPsuCount/\PsuMttf$ divided by the GPUs per node; zero when every supply sits in a redundant
    set.
- macro: \PerGpuTotalFailureRate
  latex: \lambda_{\text{total/GPU}}
  definition: failure rate of one GPU's whole failure domain, the sum of the rates of the subsystems in series
    with it
  kind: scalar
  unit: failures/hour
  notes: $\GpuFailureRate + \PcieLinkFailureRate + \PerGpuPowerFailureRate + \PerGpuNetworkFailureRate$ for
    the series subsystems of one GPU.
- macro: \PerTestSignificanceLevel
  latex: \alpha_{\text{sig}}'
  definition: significance threshold applied to each test of a family after a multiple-testing correction
    such as Bonferroni or Sidak
  kind: scalar
  unit: dimensionless
  notes: Derived from \HypothesisTestSignificanceLevel and \TestFamilySize.
- macro: \PfcWatchdogTimeout
  latex: T_{\text{watchdog}}
  definition: pause duration after which a switch PFC watchdog declares a stalled queue and triggers recovery
  kind: scalar
  unit: s
  notes: Exceeding it indicates stalled progress, not proof of a cyclic deadlock. Not the hardware watchdog
    timeout.
- macro: \PipelineBubbleFraction
  latex: b_{\text{pipe}}
  definition: fraction of pipeline device time spent idle while the pipeline fills and drains
  kind: scalar
  unit: dimensionless
  notes: $(\PipelineParallelDegree - 1)/(\PipelineParallelDegree - 1 + \MicrobatchCount)$ for a noninterleaved
    schedule. Avoids bare $b$.
- macro: \PipelineParallelDegree
  latex: N_{\text{PP}}
  definition: number of pipeline stages a model's layers are split across
  kind: count
  aliases:
  - \PipelineparallelDegreePp
- macro: \PipelineTimeSlot
  latex: t
  definition: one equal-length time slot of a pipeline schedule grid, written with its slot number as
    a subscript
  kind: record
  notes: $t_j$ is the $j$-th slot of the step; not \TimeInstant or \OptimizerStepIndex.
- macro: \PlatformResourceCapacity
  latex: \text{Cap}
  definition: capacity of one resource pool of a shared platform, the weight of that pool in platform
    utilization
  kind: scalar
  unit: varies
  notes: Written $\text{Cap}_i$, indexed by \PlatformResourceIndex. Unit is that of the pool (devices, bytes,
    bytes/s); within one platform-utilization sum every pool must be expressed in a common unit. Not
    \FleetResourceCapacity, which is the fleet total of one resource type used to normalize tenant shares.
  aliases: []
- macro: \PlatformResourceIndex
  latex: i
  definition: index of one resource pool of a shared platform
  kind: index
- macro: \PlatformTotalCost
  latex: C_{\text{platform}}
  definition: total cost of building and running a shared ML platform, including development, infrastructure
    and maintenance
  kind: scalar
  unit: USD
  notes: Denominator of the platform benefit-cost ratio.
- macro: \PlatformUtilization
  latex: U_{\text{platform}}
  definition: capacity-weighted average utilization of a shared platform's resources over an interval
  kind: scalar
  unit: dimensionless
- macro: \PointToPointMessageSize
  latex: n
  definition: size of one point-to-point message in the alpha-beta model
  kind: scalar
  unit: bytes
  notes: The crossover $\LatencyBandwidthCrossoverSize$ separates latency-bound from bandwidth-bound sizes.
- macro: \PointToPointTransferTime
  latex: T
  definition: time to send one point-to-point message of n bytes in the alpha-beta model
  kind: scalar
  unit: s
  notes: $\MessageStartupLatency + n/\LinkBandwidth$.
- macro: \PreemptionFanoutCount
  latex: k
  definition: number of lower-priority jobs one admission displaces at each level of a preemption cascade
  kind: count
  notes: Two levels interrupt k plus k squared jobs; a no-repreemption rule caps it at k.
- macro: \PreemptionRate
  latex: \lambda_{\text{preempt}}
  definition: number of forced preemptions a job suffers per hour of held time
  kind: scalar
  unit: hours^-1
  notes: Multiplied by $\PreemptionTaxTime$ it gives the share of held time preemption costs.
- macro: \PreemptionTaxTime
  latex: T_{\text{preempt}}
  definition: held time one forced preemption costs a job, the work discarded since its last checkpoint
    plus reload and warmup
  kind: scalar
  unit: hours
  notes: Not $\FailureRecoveryTime$, which has a detection step a scheduled preemption does not.
- macro: \PreviousPeriodCost
  latex: C_{\text{previous}}
  definition: observed cost of the accounting period before the current one
  kind: scalar
  unit: USD
- macro: \ProcessedDataVolume
  latex: D_{\text{vol,processed}}
  definition: data volume data and feature pipelines process in an accounting period
  kind: scalar
  unit: bytes
- macro: \ProcessingPrice
  latex: R_{\text{process/GB}}
  definition: price of processing one gigabyte through data and feature pipelines
  kind: scalar
  unit: USD/GB
- macro: \ProductionModelCount
  latex: N_{\text{models}}
  definition: number of production models a fleet or shared platform operates
  kind: count
  notes: Drives the N-models complexity sketch and the platform benefit-cost ratio.
- macro: \ProgramGoodput
  latex: \eta_{\text{program}}
  definition: ratio of ideal to actual program execution time during productive work
  kind: scalar
  unit: dimensionless
  notes: One factor of ML Productivity Goodput, $\SchedulingGoodput \times \RuntimeGoodput \times \ProgramGoodput$.
  aliases:
  - \MlProductivityGoodputFactorsProgram
- macro: \PsuMttf
  latex: \text{MTTF}_{\text{psu}}
  definition: mean operating time of one power supply unit before it fails
  kind: scalar
  unit: hours
  notes: Per-device $\MeanTimeToFailure$ for power supply units, from their FIT rate.
- macro: \QualityObjective
  latex: S_{\text{quality}}
  definition: 'model-quality dimension of a service''s SLO vector: its indicator, target, window and owner'
  kind: record
- macro: \QuantizedGradient
  latex: \mathbf{g}_{\text{int8}}
  definition: gradient vector after symmetric INT8 quantization, one integer code per element
  kind: vector
  notes: Equals round($\LocalGradient/\QuantizationScale$); the receiver multiplies back by the scale.
- macro: \QueueArrivalTime
  latex: t_{\text{arr}, i}
  definition: time at which one event or record enters a group-commit batching queue
  kind: scalar
  unit: s
  notes: The event index i is part of the rendered symbol.
- macro: \RandomRetainedElementCount
  latex: K_{\text{rand}}
  definition: number of gradient elements that random-k sparsification selects uniformly at random and
    transmits
  kind: count
  notes: Kept values are scaled by $\GradientElementCount/\RandomRetainedElementCount$ so the estimate
    stays unbiased.
- macro: \RankContribution
  latex: x
  definition: data one rank contributes to a collective operation, its input buffer, indexed by rank
  kind: scalar
  unit: varies
  notes: 'Written $x_j$ for rank $j$ in the collective contracts; the reduced output is $\RankReductionResult$.
    Unit: units of the reduced tensor elements.'
- macro: \RankCountBinaryExponent
  latex: m
  definition: integer exponent for which the rank count equals two raised to it, the condition algorithms
    such as butterfly AllReduce require
  kind: scalar
  unit: dimensionless
  notes: Equals $\log_2 \DeviceCount$, the number of rounds in each butterfly phase.
- macro: \RankIndex
  latex: i
  definition: position of one rank, a device or worker, within a collective communication group, counted
    from zero
  kind: index
  notes: Exempt inside a subscript; this entry covers the standalone uses ("GPU $i$", $i \oplus 2^k$).
    The second rank of a pair is $\DestinationRankIndex$.
- macro: \RankReductionResult
  latex: y
  definition: result a reducing collective leaves on one rank, indexed by rank
  kind: scalar
  unit: varies
  notes: 'For AllReduce $y_i = \sum_j \RankContribution_j$ on every rank. Unit: units of the reduced tensor
    elements.'
- macro: \RealizedDeviceComputeRate
  latex: R
  definition: floating-point operation rate one device actually achieves on its local work during a training
    step
  kind: scalar
  unit: FLOP/s
  notes: Denominator of the compute time $\Operations/R$ in the communication-intensity form of $\CommunicationComputeRatio$;
    communication is exposed once $\CommunicationIntensity$ exceeds $\NetworkBandwidth/R$. Not $\ReplicaCount$,
    which shares the glyph.
- macro: \ReceiveBandwidth
  latex: \text{BW}_{\text{rx}}
  definition: rate at which one rank can receive bytes from the fabric
  kind: scalar
  unit: bytes/s
- macro: \ReceiverOverhead
  latex: o_{\text{recv}}
  definition: processor time spent completing the receipt of one message, during which it cannot compute
  kind: scalar
  unit: s
  notes: Symmetric LogP writes $o$ for both $\SenderOverhead$ and $\ReceiverOverhead$.
  aliases:
  - \ReceiverOverheadRecv
- macro: \RecentUsageShare
  latex: F_{\text{actual}}
  definition: share of cluster capacity a user or account has recently consumed, as fair-share scheduling
    measures it
  kind: scalar
  unit: dimensionless
  notes: Rising usage lowers fair-share priority.
- macro: \ReconstructedGradient
  latex: \hat{\mathbf{g}}
  definition: gradient vector a receiver reconstructs by multiplying the quantized codes by their scale
  kind: vector
  notes: $\QuantizedGradient \times \QuantizationScale$; differs from $\LocalGradient$ by the rounding
    error.
- macro: \RecoveryWarmupTime
  latex: T_{\text{warmup}}
  definition: time after a restart to refill data pipelines, compile kernels and return training to steady
    throughput
  kind: scalar
  unit: s
  notes: The last term of $\FailureRecoveryTime$.
- macro: \ReduceScatterCompletionTime
  latex: T_{\text{reducescatter}}
  definition: time to complete a ReduceScatter over a ring of devices, each ending with the reduced values
    of its own shard
  kind: scalar
  unit: s
  notes: Same ring cost as $\AllGatherCompletionTime$; the two add up to $\RingAllReduceCompletionTime$.
- macro: \RedundantComponentCount
  latex: N_{\text{red}}
  definition: number of interchangeable components in a parallel redundant system, any one of which can
    provide the service
  kind: count
  notes: 'The system fails only when all of them have failed: $1 - \prod_{i=1}^{\RedundantComponentCount}
    (1 - \ComponentReliability_i)$. Not $\RequiredComponentCount$, which counts components that must all
    be up.'
- macro: \RedundantReplicaCount
  latex: k
  definition: number of independent replicas of a service in a redundancy availability calculation, any
    one of which can serve the load
  kind: count
  notes: $\RedundantServiceAvailability = 1 - (1 - \ReplicaAvailability)^{\RedundantReplicaCount}$ under
    independent failures. Shares the replica idea with $\ReplicaCount$ ($R$), which counts replicas a
    router chooses among.
- macro: \RedundantServiceAvailability
  latex: A_{\text{system}}
  definition: probability that at least one of a service's independent replicas is up at a randomly chosen
    instant
  kind: scalar
  unit: dimensionless
  notes: $1 - (1 - \ReplicaAvailability)^{\RedundantReplicaCount}$ under independent failures and enough
    capacity on any survivor. Not $\JobAvailability$, which multiplies availabilities that must all hold.
- macro: \ReplicaAvailability
  latex: A_{\text{single}}
  definition: probability that one serving replica is up at a randomly chosen instant
  kind: scalar
  unit: dimensionless
  notes: Input to $\RedundantServiceAvailability$.
- macro: \ReplicaColdStartTime
  latex: T_{\text{cold-start}}
  definition: time from requesting a new serving replica until it can serve, provisioning plus loading
    plus warmup
  kind: scalar
  unit: s
- macro: \ReplicaCount
  latex: R
  definition: number of serving replicas among which a router chooses
  kind: count
  notes: Replicas of a serving model among which a router chooses; distinct from $\NumberOfDevices$ (devices
    in one job).
- macro: \ReplicaModelLoadTime
  latex: T_{\text{load}}
  definition: time to fetch a model's artifacts and load its weights onto a new serving replica's devices
  kind: scalar
  unit: s
  notes: Not the checkpoint load time of training recovery in the fault-tolerance chapter.
- macro: \ReplicaProvisioningTime
  latex: T_{\text{provision}}
  definition: time to allocate and start the hardware a new serving replica runs on
  kind: scalar
  unit: s
- macro: \ReplicaWarmupTime
  latex: T_{\text{warmup}}
  definition: time a newly loaded serving replica spends compiling and warming caches before it serves
    at full speed
  kind: scalar
  unit: s
- macro: \RequiredComponentCount
  latex: N
  definition: number of components a job needs available at the same time
  kind: count
  notes: Components include accelerators, hosts, NICs and switches, so this is not $\NumberOfDevices$.
    With independent, identical components the job availability is $(\ComponentAvailability)^{\RequiredComponentCount}$
    and the interruption interval shrinks as $1/\RequiredComponentCount$.
- macro: \ResourceTypeIndex
  latex: r
  definition: index of one resource type, such as GPUs, CPU cores or memory, in a multi-resource allocation
  kind: index
  notes: Ranges over the resources dominant resource fairness normalizes.
- macro: \ResourceUtilization
  latex: U
  definition: utilization of one platform resource over an interval
  kind: scalar
  unit: dimensionless
  notes: Written $U_i$.
- macro: \RetainedGradientElementCount
  latex: K_{\text{top}}
  definition: number of largest-magnitude gradient elements top-k sparsification keeps and transmits
  kind: count
  notes: Mostly appears in the method's name, top-k.
- macro: \RetainedProductiveTime
  latex: T_{\text{productive}}
  definition: equivalent training time represented by the progress a spot job retains
  kind: scalar
  unit: s
  notes: Denominator of the spot effective-cost ratio.
- macro: \RigidGangJob
  latex: J
  definition: a rigid distributed job whose devices must be granted together as one gang
  kind: record
  notes: Names the job in the gang-scheduling rule; its device count is $\DeviceCount$.
- macro: \RingAllReduceBandwidthTime
  latex: T_{\text{bandwidth}}
  definition: byte-transfer term of ring AllReduce time, the time spent moving data excluding startup
    costs
  kind: scalar
  unit: s
  notes: $2\frac{\DeviceCount-1}{\DeviceCount}\frac{\CollectivePayloadSize}{\LinkBandwidth}$; with $\RingAllReduceStartupTime$
    it sums to $\RingAllReduceCompletionTime$.
- macro: \RingAllReduceCompletionTime
  latex: T_{\text{ring}}
  definition: time to complete an AllReduce over a ring of devices
  kind: scalar
  unit: s
  aliases:
  - \CollectiveCompletionTimeRing
- macro: \RingAllReduceStartupTime
  latex: T_{\text{latency}}
  definition: startup term of ring AllReduce time, the per-step startup latency paid over all sequential
    steps
  kind: scalar
  unit: s
  notes: $2(\DeviceCount-1)\MessageStartupLatency$; with $\RingAllReduceBandwidthTime$ it sums to $\RingAllReduceCompletionTime$.
- macro: \RingStepIndex
  latex: s
  definition: position of one step within a phase of ring AllReduce, counted from one
  kind: index
  notes: Each phase has $\DeviceCount-1$ steps.
- macro: \RingTreeCrossoverPayload
  latex: M_{\text{crossover}}
  definition: collective payload size above which ring AllReduce finishes faster than tree AllReduce
  kind: scalar
  unit: bytes
  notes: Roughly $N \alpha \beta / \log_2 N$ for large $N$. Distinct from the per-message crossover $\LatencyBandwidthCrossoverSize$.
  aliases:
  - \RingtreeCrossoverPayload
- macro: \RoundCommunicationVolume
  latex: M_r
  definition: 'total bytes a federated client moves in one round: download, upload, protocol and retry
    traffic'
  kind: scalar
  unit: bytes
  notes: Round index r baked into the LaTeX as the chapter writes it; see questions.
- macro: \RoundDownloadVolume
  latex: M_{\text{download},r}
  definition: bytes of model state a federated client downloads in one round
  kind: scalar
  unit: bytes
  notes: Term of @eq-edge-federated-communication-volume.
- macro: \RoundDuration
  latex: t_r
  definition: elapsed wall-clock duration of one completed federated round, including selection, local
    work, transfer, aggregation and waiting
  kind: scalar
  unit: s
  notes: The round index r is part of the LaTeX (the chapter writes $t_r(E)$); see questions.
- macro: \RoundProtocolVolume
  latex: M_{\text{protocol},r}
  definition: bytes of authentication and cryptographic-setup traffic a federated client exchanges in
    one round
  kind: scalar
  unit: bytes
  notes: Term of @eq-edge-federated-communication-volume.
- macro: \RoundRetryVolume
  latex: M_{\text{retry},r}
  definition: bytes a federated client spends on failed or repeated transfers in one round
  kind: scalar
  unit: bytes
  notes: Term of @eq-edge-federated-communication-volume.
- macro: \RoundSampleCount
  latex: n_{\text{round}}
  definition: total number of training samples across the clients participating in one federated round
  kind: count
  notes: Normalizer of the FedAvg example weights $n_k/\RoundSampleCount$.
- macro: \RoundUploadVolume
  latex: M_{\text{upload},r}
  definition: bytes of client update a federated client uploads in one round
  kind: scalar
  unit: bytes
  notes: Term of @eq-edge-federated-communication-volume.
- macro: \RowParallelOutputMatrix
  latex: \mathbf{Z}
  definition: output of the row-parallel layer of a Megatron tensor-parallel pair, the sum of the per-device
    partial products
  kind: matrix
  notes: Partial product $i$ is $\mathbf{Z}_i$; one AllReduce forms $\mathbf{Z} = \sum_i \mathbf{Z}_i$.
    Not \PreactivationMatrix.
- macro: \RowParallelWeightMatrix
  latex: \mathbf{B}
  definition: weight matrix of the second layer of a Megatron tensor-parallel pair, split by rows across
    devices
  kind: matrix
  notes: Shard $i$ is $\mathbf{B}_i$; follows \ColumnParallelWeightMatrix without communication.
- macro: \RuntimeGoodput
  latex: \eta_{\text{runtime}}
  definition: fraction of allocated resource time that becomes checkpoint-preserved productive progress
  kind: scalar
  unit: dimensionless
  notes: One factor of ML Productivity Goodput, $\SchedulingGoodput \times \RuntimeGoodput \times \ProgramGoodput$;
    loses initialization, input stalls and work lost after the last checkpoint. It is also the out-of-step
    operational goodput of the fleet throughput factorization, often $1 - \OperationalOverheadFraction$
    (formerly \GoodputRatio).
  aliases:
  - \MlProductivityGoodputFactorsRuntime
  - \GoodputRatio
- macro: \SavedEngineeringTime
  latex: T_{\text{saved}}
  definition: engineering time a shared platform saves for one model in one accounting period
  kind: scalar
  unit: h
  notes: Per model and per period; multiplied by the model count and the engineer hourly cost in the platform
    benefit-cost ratio.
- macro: \ScaleCoefficient
  latex: A_{\mathcal{L}}
  definition: coefficient of the reducible power-law term of an empirical scaling law
  kind: scalar
  unit: dimensionless
  notes: In $\mathcal{L}(X) = \ScaleCoefficient X^{-\ScalingExponent} + \IrreducibleLoss$; strictly in
    loss units times the resource unit raised to $\ScalingExponent$.
- macro: \ScaledResource
  latex: X
  definition: resource quantity a scaling law varies, such as parameters, training tokens or compute
  kind: scalar
  unit: varies
  notes: 'The unit follows whichever resource the scaling law is fitted against. Unit: parameters, tokens
    or FLOP.'
- macro: \ScalingCurveWorkerCount
  latex: k
  definition: number of workers at which a job's scaling-efficiency curve is evaluated, compared with
    a reference allocation
  kind: count
  notes: Argument of $\ScalingEfficiency$ in elastic scheduling; plays the role of $\DeviceCount$ along
    a scaling curve.
- macro: \ScalingEfficiency
  latex: \eta_{\text{scaling}}
  definition: measured speedup on N devices divided by the ideal linear speedup N
  kind: scalar
  unit: dimensionless
  notes: $\SingleDeviceRunTime/(N \cdot \MultiDeviceRunTime)$. $1.0$ is the ideal linear baseline, not
    a hard upper bound.
- macro: \ScalingExponent
  latex: \alpha_{\text{scale}}
  definition: power-law exponent at which loss falls as a training resource grows
  kind: scalar
  unit: dimensionless
  aliases:
  - \ScalingExponentScale
- macro: \ScalingLawLoss
  latex: \mathcal{L}
  definition: loss a trained model reaches as a function of the resource scaled, such as parameters, training
    tokens or compute, in an empirical power-law scaling law
  kind: function
  notes: Written $\ScalingLawLoss(\ScaledResource) = \ScaleCoefficient \ScaledResource^{-\ScalingExponent}
    + \IrreducibleLoss$. Not $\LossFunction$, the per-example training objective, though both render $\mathcal{L}$;
    $\ReducibleLoss$ is this loss minus its floor.
- macro: \SchedulingGoodput
  latex: \eta_{\text{scheduling}}
  definition: fraction of fleet capacity-time during which a job holds all the resources it needs for
    synchronous progress
  kind: scalar
  unit: dimensionless
  notes: One factor of ML Productivity Goodput, $\SchedulingGoodput \times \RuntimeGoodput \times \ProgramGoodput$.
  aliases:
  - \MlProductivityGoodputFactorsScheduling
- macro: \SecondClientMaskedUpdate
  latex: \mathbf{y}_B
  definition: masked update the second client, labeled B, uploads in a two-client secure-aggregation illustration
  kind: vector
  notes: 'render_exception: kept non-bold as the chapter renders it today; a vector written in plain italic
    by the field convention of the surrounding derivation.'
- macro: \SecondClientModelParameters
  latex: \theta_B
  definition: model parameters of the second client, labeled B, in a two-client secure-aggregation illustration
  kind: vector
  notes: 'render_exception: plain theta as for \ModelParameters. Subscript B is a client label.'
  render_exception: Machine learning writes the parameter vector as a plain theta, never bold.
- macro: \SecondRankComputeTime
  latex: T_{\text{rank}_1}
  definition: local compute time of the second rank (rank 1) in one synchronous training step
  kind: scalar
  unit: s
  notes: One argument of the max in $\StragglerStepTime$.
- macro: \SecondRingTraceElement
  latex: b
  definition: second of the four elements of a rank's gradient vector in the four-GPU ring AllReduce trace,
    each element one chunk
  kind: scalar
  unit: varies
  notes: 'Indexed by rank, e.g. its value on GPU $i$. Unit: loss per parameter unit. Illustrative example
    only.'
- macro: \SenderOverhead
  latex: o_{\text{send}}
  definition: processor time spent initiating one message, during which it cannot compute
  kind: scalar
  unit: s
  notes: Cannot be overlapped with computation, unlike $\LogpNetworkLatency$.
- macro: \SequentialBackwardCommunicationTime
  latex: T_{\text{sequential}}
  definition: time of the backward pass plus gradient communication when communication starts only after
    the backward pass ends
  kind: scalar
  unit: s
  notes: Equals \BackwardPassTime + \CommunicationTime. Not \SequentialExecutionTime, the additive iron
    law.
- macro: \SeriesComponentCount
  latex: N_{\text{series}}
  definition: number of components in a series reliability model, every one of which must survive for
    the system to survive
  kind: count
  notes: Used where a series-system survival formula $R(t)=e^{-\SeriesComponentCount\lambda t}$ appears
    beside a fleet device count $\DeviceCount$ in the same section. Not $\DeviceCount$ (devices in one
    job) and not $\RequiredComponentCount$ (the availability-at-once count of the Fleet Law chapters,
    rendered bare $N$).
- macro: \SeriesPsuCount
  latex: n_{\text{psu}}
  definition: number of power supply units in one node whose failure alone stops the node
  kind: count
  notes: Zero for a redundant power set (the book's 4+2 node); not the number of supplies installed.
- macro: \ServerIndex
  latex: i
  definition: index of one server or replica a router can send a request to
  kind: index
- macro: \ServerRoutingWeight
  latex: w
  definition: routing weight of one server, proportional to its capacity
  kind: scalar
  unit: varies
  notes: Written $\ServerRoutingWeight_i$ for server $i$.
- macro: \ServingCostPerQuery
  latex: C_{\text{serving}}
  definition: average cost of serving one query, including idle or reserved capacity billed at the chosen
    serving boundary
  kind: scalar
  unit: USD/query
  notes: Per-query counterpart of $\InferenceCost$.
- macro: \ShardIndex
  latex: s
  definition: index of one shard of a partitioned table
  kind: index
- macro: \SiblingTeamAllocation
  latex: U_{\text{allocated}}
  definition: current allocation of one sibling team under the same department quota
  kind: count
  notes: Summed over the other teams and subtracted from the department limit.
- macro: \SignificanceLevel
  latex: \alpha
  definition: probability that a hypothesis test rejects a true null hypothesis
  kind: scalar
  unit: dimensionless
  notes: Same meaning as $\HypothesisTestSignificanceLevel$ ($\alpha_{\text{sig}}$); the two should merge.
    Shares $\alpha$ with $\MessageStartupLatency$.
- macro: \SingleDeviceContextLength
  latex: S_{\text{single}}
  definition: longest sequence one device can hold in memory without context parallelism
  kind: count
  notes: Context parallelism over $\ContextParallelDegree$ devices ideally reaches $\ContextParallelDegree
    \times S_{\text{single}}$.
- macro: \SingleDeviceRunTime
  latex: T_1
  definition: wall-clock time for a fixed amount of productive work on one device
  kind: scalar
  unit: s
  notes: Baseline of $\ScalingEfficiency$; per step it is the Fleet Law's $\IronlawTermTimesCompute$.
  aliases:
  - \SingledeviceTimeOne
- macro: \SingleLinkBandwidth
  latex: \text{BW}_{\text{link}}
  definition: bandwidth of one network link in one direction, written in the core bandwidth notation outside
    alpha-beta formulas
  kind: scalar
  unit: bytes/s
  notes: The same link quantity that $\LinkBandwidth$ ($\beta$) writes inside alpha-beta formulas (notation
    chapter line 117).
- macro: \SloVector
  latex: \mathbf{S}
  definition: service-level objective vector of one service, one objective per reliability dimension
  kind: vector
  notes: 'Components: availability, latency, freshness and quality objectives.'
- macro: \SlowdownPersistenceUpdateCount
  latex: K
  definition: number of upcoming useful training updates over which a straggler's slowdown is expected
    to persist
  kind: count
  notes: Replacement pays when $\SlowdownPersistenceUpdateCount(\DegradedStepTime - \HealthyStepTime)$
    exceeds $\JobRestartTime + \LostWorkReplayTime$.
- macro: \SplitMessageCount
  latex: N_{\text{msg}}
  definition: number of equal messages a payload is split into when sent one after another instead of
    fused into one message
  kind: count
  notes: Each piece is $\PointToPointMessageSize/\SplitMessageCount$ bytes and pays its own $\MessageStartupLatency$.
    Not $\DeviceCount$.
- macro: \SpotHourlyPrice
  latex: C_{\text{spot}}
  definition: price per billed hour of a fixed spot or preemptible allocation
  kind: scalar
  unit: USD/hour
  notes: Discounted against on-demand price in exchange for reclaimable capacity.
- macro: \StalenessBound
  latex: s
  definition: largest number of iterations a stale-synchronous worker may run ahead of the slowest worker
    before it blocks
  kind: count
  notes: Bounds \GradientStaleness under stale-synchronous parallel ($\GradientStaleness \leq s$); zero
    recovers bulk-synchronous training.
- macro: \StandardDeviationMultiple
  latex: k
  definition: number of standard deviations above the mean at which a one-sided Gaussian exceedance is
    evaluated
  kind: scalar
  unit: dimensionless
- macro: \SteadyStateAvailability
  latex: A
  definition: probability that a component, replica or repairable system is up at a randomly chosen instant,
    its long-run fraction of up time
  kind: scalar
  unit: dimensionless
  notes: $\MeanTimeBetweenFailures/(\MeanTimeBetweenFailures + \MeanTimeToRepair)$ for a stationary two-state
    repairable unit. Not survival $\ComponentReliability$, which ignores repair. Subscripted forms name
    what is available ($\ComponentAvailability$, $\GpuAvailability$).
- macro: \StragglerStepTime
  latex: T_{\text{step,straggler}}
  definition: time of one synchronous training step on N devices when the slowest rank sets the pace and
    communication does not overlap compute
  kind: scalar
  unit: s
  notes: $\max_r$ of the per-rank compute times plus $\CommunicationTime$; written with its device-count
    argument.
- macro: \SwitchRadix
  latex: k
  definition: number of ports on one network switch, its radix
  kind: count
  notes: A $k$-ary fat-tree supports $k^2/2$ hosts at two tiers and $k^3/4$ at three; a $k \times k$ crossbar
    needs $k^2$ crosspoints. Not the accumulation step count or a generic index $k$.
- macro: \SymmetricMessageOverhead
  latex: o
  definition: processor time spent initiating or completing one message in the symmetric LogP model, where
    sender and receiver overheads are equal, during which the processor cannot compute
  kind: scalar
  unit: s
  notes: Symmetric case of $\SenderOverhead$ and $\ReceiverOverhead$; one message exposes $2o$. Cannot
    be overlapped, unlike $\LogpNetworkLatency$.
- macro: \SynchronizationTime
  latex: T_{\text{sync}}
  definition: time per step lost to barriers, straggler waiting and other coordination at scale N
  kind: scalar
  unit: s
  notes: The coordination term of the Fleet Law; transfer time itself belongs to $\CommunicationTime$.
- macro: \SystemFailureRate
  latex: \lambda_{\text{system}}
  definition: rate at which failures interrupt the whole job or system, the sum of its components' failure
    rates
  kind: scalar
  unit: failures/hour
  notes: The reciprocal of $\SystemMtbf$. Equals the device count times $\PerGpuTotalFailureRate$ for
    independent, identical failure domains.
- macro: \SystemMtbf
  latex: \text{MTBF}_{\text{system}}
  definition: mean time between failures that interrupt the whole job or system
  kind: scalar
  unit: hours
  notes: Equals $\MeanTimeToFailure_{\text{component}}/\RequiredComponentCount$ under independent, identical
    components. Use it, not the per-component lifetime, in the Young-Daly interval; the per-component
    value overestimates the interval by $\sqrt{\RequiredComponentCount}$. The text also states it in seconds,
    so the unit is any time unit consistent with $\CheckpointWriteTime$.
- macro: \SystemReliability
  latex: R_{\text{system}}
  definition: probability that the whole system runs without failure up to time t
  kind: scalar
  unit: dimensionless
  notes: $e^{-\SeriesComponentCount\,\ComponentFailureRate\, t}$ for $\SeriesComponentCount$ independent
    components in series, each failing at rate $\ComponentFailureRate$.
  aliases:
  - \ReliabilityFunctionSystem
- macro: \TailMomentOrder
  latex: k
  definition: order of a raw moment of a random quantity, the power to which it is raised before taking
    the expectation
  kind: scalar
  unit: dimensionless
  notes: For a power-law tail the moment is finite only for orders below \ParetoTailExponent.
- macro: \TailRiskDistributionFunction
  latex: F
  definition: cumulative distribution function of the monitored quantity whose tail is modeled
  kind: function
  notes: Its power $F^n$ is the distribution of the maximum of n independent observations.
- macro: \TailRiskObservation
  latex: X
  definition: monitored physical quantity whose rare large values a tail model describes, such as a contact
    load or a control-loop latency, treated as a random variable
  kind: scalar
  unit: varies
  notes: Unit of the quantity monitored (N, s, ...). Indexed $X_i$ for one independent observation.
- macro: \TailRiskObservationLevel
  latex: x
  definition: level of the monitored quantity at which its distribution or density is evaluated, or one
    observed value of it
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation; $x_0$ is the lower cutoff of a power-law tail.
- macro: \TailShapeParameter
  latex: \xi
  definition: shape parameter of an extreme value tail model, positive for a power-law tail, zero for
    an exponential tail and negative for a bounded tail
  kind: scalar
  unit: dimensionless
  notes: Shared by the GEV and generalized Pareto models. Its reciprocal is \ParetoTailExponent. Not \ExecutionNondeterminism.
- macro: \TailSupportUpperEndpoint
  latex: x_F
  definition: right endpoint of the support of the monitored quantity's distribution, possibly infinite
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation.
- macro: \TargetExceedanceProbability
  latex: \epsilon
  definition: per-sample probability of a catastrophic exceedance that a design margin is sized against
  kind: scalar
  unit: dimensionless
  notes: A probability per sampled cycle, not a rate per operating hour.
- macro: \TargetFairShare
  latex: F_{\text{target}}
  definition: share of cluster capacity a user or account is entitled to under fair-share scheduling
  kind: scalar
  unit: dimensionless
  notes: Numerator of the illustrative fair-share priority factor.
- macro: \TargetUpdateCount
  latex: K_{\text{target}}
  definition: number of client updates a federated round waits for and aggregates
  kind: count
- macro: \TeamQuotaCap
  latex: Q_{\text{team}}
  definition: maximum allocation a team may hold under hierarchical quotas, as opposed to its guaranteed
    share
  kind: count
  notes: Counted in accelerators.
- macro: \TenantIndex
  latex: i
  definition: index of one tenant sharing a fleet
  kind: index
  notes: Subscripts per-tenant quantities in dominant resource fairness.
- macro: \TenantResourceAllocation
  latex: a_{i,r}
  definition: amount of one resource type allocated to one tenant
  kind: scalar
  unit: varies
  notes: Unit is that of the resource type (GPUs, cores, bytes). Divided by fleet capacity of the same
    resource it gives a share.
- macro: \TensorParallelDegree
  latex: N_{\text{TP}}
  definition: number of devices that shard each layer's tensors in tensor parallelism
  kind: count
  aliases:
  - \TensorparallelDegreeTp
- macro: \TensorParallelLayerTime
  latex: T_{\text{inference}}
  definition: time of one transformer layer under tensor parallelism, its compute divided across the tensor-parallel
    devices plus its two AllReduces
  kind: scalar
  unit: s
- macro: \ThirdRingTraceElement
  latex: c
  definition: third of the four elements of a rank's gradient vector in the four-GPU ring AllReduce trace,
    each element one chunk
  kind: scalar
  unit: varies
  notes: 'Indexed by rank, e.g. its value on GPU $i$. Unit: loss per parameter unit. Illustrative example
    only.'
- macro: \ThresholdExceedanceCount
  latex: N_u
  definition: number of trials whose performance metric exceeds the threshold
  kind: count
- macro: \ThresholdExcess
  latex: y
  definition: amount by which the monitored quantity exceeds the threshold, the argument of the excess
    distribution or one recorded exceedance
  kind: scalar
  unit: varies
  notes: Unit of \TailRiskObservation; indexed $y_i$ for one exceedance.
- macro: \TimeToResult
  latex: T_{\text{result}}
  definition: wall-clock time from a job's submission to its result, its queue wait plus its run time
  kind: scalar
  unit: s
  notes: One axis of the efficiency frontier, with goodput and cost per useful unit.
- macro: \TimeToTarget
  latex: T_{\text{target}}
  definition: wall-clock time a federated run takes to reach a held-out quality target, the sum of its
    completed round durations
  kind: scalar
  unit: s
  notes: Written $T_{\text{target}}(E)$ as a function of \LocalEpochCount.
- macro: \TimeoutSafetyMultiplier
  latex: k
  definition: number of delay standard deviations a failure-detection timeout allows beyond the heartbeat
    interval
  kind: scalar
  unit: dimensionless
  notes: Typically 3 to 5; lowering it shortens detection and raises false failure declarations.
- macro: \TokenBucketDepth
  latex: b
  definition: largest number of admission tokens a token-bucket limiter holds, the burst it lets one source
    send
  kind: count
  notes: Token-bucket burst size placed before the signature verifier.
- macro: \TokenBucketRefillRate
  latex: r
  definition: rate at which a token-bucket limiter adds admission tokens, the largest sustained packet
    rate it admits
  kind: scalar
  unit: 1/s
  notes: Tokens (admitted packets) per second.
- macro: \TokenDispatchTime
  latex: T_{\text{dispatch}}
  definition: time for the AllToAll that sends tokens from their source ranks to the ranks hosting their
    selected experts
  kind: scalar
  unit: s
  notes: Bounded below by the busiest receiver and by bisection capacity. Not \OperationDispatchOverhead
    (host op dispatch).
- macro: \ToleratedFailureProbability
  latex: \epsilon
  definition: largest probability with which a deployed model may miss its error tolerance, so a guarantee
    holds with confidence one minus it
  kind: scalar
  unit: dimensionless
  aliases:
  - \SmallConstant
- macro: \TopMagnitudeIndicator
  latex: \mathbf{1}_{|\mathbf{g}| \geq |\mathbf{g}|_{(K_{\text{top}})}}
  definition: indicator vector that is one at each gradient element whose magnitude is at least the largest-k
    threshold and zero elsewhere
  kind: vector
  notes: Multiplying it elementwise with $\LocalGradient$ gives the top-k sparsified gradient; ties at
    the threshold are all kept.
- macro: \TopologyEndpointCount
  latex: N
  definition: number of endpoints, accelerators or hosts, that one network topology connects, the size
    variable of its scaling laws
  kind: count
  notes: 'Switch count of a fat-tree grows as $\mathcal{O}(N \log N)$; torus diameter as $\mathcal{O}(N^{1/3})$;
    a full mesh needs $N(N-1)/2$ links. A property of the fabric, not of one job: compare \DeviceCount.'
- macro: \TorusFirstAxisChipCount
  latex: X
  definition: number of chips along the first axis of a torus pod
  kind: count
  notes: Product of the three axis counts is the rank count, $N = XYZ$. The letter also names the axis
    itself, which is not a quantity.
- macro: \TorusSecondAxisChipCount
  latex: Y
  definition: number of chips along the second axis of a torus pod
  kind: count
  notes: See \TorusFirstAxisChipCount.
- macro: \TorusThirdAxisChipCount
  latex: Z
  definition: number of chips along the third axis of a torus pod
  kind: count
  notes: See \TorusFirstAxisChipCount.
- macro: \TotalFailureRecoveryTime
  latex: T_{\text{recovery}}
  definition: 'wall-clock time from a failure until training is productive again, including replay of
    the work lost since the last checkpoint: detection, restart, checkpoint load and replay'
  kind: scalar
  unit: s
  notes: $\FailureDetectionTime + \JobRestartTime + \CheckpointLoadTime + \LostWorkReplayTime$. Differs
    from $\FailureRecoveryTime$, which shares the glyph but excludes rework since the last checkpoint
    and adds warmup.
- macro: \TotalTrainingRunCost
  latex: C_{\text{total}}
  definition: 'expected total cost of one training run: base compute, expected failure cost and the cost
    of fault-tolerance mechanisms'
  kind: scalar
  unit: USD
  notes: $\BaseTrainingComputeCost + \mathbb{E}[\TrainingFailureCount] \times \FailureEventCost + \FaultToleranceCost$.
    Not $\TotalDataCost$, which shares the glyph.
- macro: \TrainingCompute
  latex: O_{\text{train}}
  definition: total floating-point operations needed to train a model
  kind: scalar
  unit: FLOP
  notes: About 6 times parameters times training tokens for a dense transformer.
- macro: \TrainingCost
  latex: C_{\text{train}}
  definition: cost of training and evaluating a model, one-time or per period of retraining
  kind: scalar
  unit: USD
  notes: With $\InferenceCost$, a term of the ML total cost of ownership.
  aliases:
  - \DollarCostTrain
- macro: \TrainingFailureCount
  latex: N_{\text{failures}}
  definition: number of failures that occur during one training run
  kind: count
  notes: Random; the cost model uses its expectation $\mathbb{E}[\TrainingFailureCount]$.
- macro: \TransferTimeForPayload
  latex: T_{\text{transfer}}
  definition: time to communicate a payload of x bytes under the relevant link or collective model
  kind: scalar
  unit: s
- macro: \TransferredDataVolume
  latex: D_{\text{vol,transfer}}
  definition: data volume transferred out over the network in an accounting period
  kind: scalar
  unit: bytes
- macro: \TreeAllReduceCompletionTime
  latex: T_{\text{tree}}
  definition: time to complete an AllReduce over a binary tree of devices
  kind: scalar
  unit: s
  aliases:
  - \CollectiveCompletionTimeTree
- macro: \TreeLikeAllReduceTime
  latex: T_{\text{tree-like}}
  definition: modeled time of a tree-like AllReduce, such as a simple reduce-then-broadcast tree or recursive
    doubling, that forwards the full message in each of its logarithmic rounds
  kind: scalar
  unit: s
  notes: $2\log_2 \DeviceCount\,\MessageStartupLatency + 2\log_2 \DeviceCount\,\CollectivePayloadSize/\LinkBandwidth$.
    Not $\TreeAllReduceCompletionTime$, which is one binary tree.
- macro: \UnshardedLocalExecutionTime
  latex: T_{\text{compute}}
  definition: time one device needs to run a replica's whole unsharded local workload, its data movement,
    computation and host dispatch together, the reference the Fleet Law divides across devices
  kind: scalar
  unit: s
  notes: 'Renders like \IronLawComputeTime but is broader: it is the sum of the iron law''s data and compute
    terms plus host dispatch, not $\Operations/(\PeakRate \cdot \EfficiencyHw)$ alone. Partitioning a
    fixed workload across $\DeviceCount$ devices gives the local-execution term $T_{\text{compute}}/\DeviceCount$.'
- macro: \UsefulAcceleratorHourCost
  latex: C_{\text{useful}}
  definition: price of one accelerator-hour of useful work at the ideal rate, the capacity price divided
    by ML productivity goodput
  kind: scalar
  unit: USD/h
  notes: $\UsefulAcceleratorHourCost = \AcceleratorHourlyPrice/\MlProductivityGoodput$, with the price taken per in-service
    accelerator-hour.
- macro: \UsefulComputeFraction
  latex: f_{\text{compute}}
  definition: share of the distributed step time spent on useful local arithmetic
  kind: scalar
  unit: dimensionless
  notes: $(\IronlawTermTimesCompute/N)/\DistributedStepTime$; below 0.5 communication and coordination
    dominate the step.
  aliases:
  - \UsefulComputetimeFraction
- macro: \UsefulModelFlops
  latex: O_{\text{useful}}
  definition: floating-point operations the model's work actually requires, excluding recomputation and
    padding
  kind: scalar
  unit: FLOP
  notes: Numerator of $\ModelFlopsUtilization$ and of $\FleetEnergyProductivity$.
- macro: \UsefulTrainingTime
  latex: T_{\text{useful}}
  definition: wall-clock time a training job spends on committed, productive steps that contribute to
    the final model
  kind: scalar
  unit: s
  notes: Numerator of runtime goodput, $\RuntimeGoodput \approx T_{\text{useful}}/T_{\text{wall}}$; excludes
    checkpoint stalls, failure recovery, replayed work and scheduler preemptions.
- macro: \VersionSkewBound
  latex: k_{\text{skew}}
  definition: largest number of model versions by which deployment regions may differ under a bounded-staleness
    consistency policy
  kind: count
- macro: \VirtualPipelineStagesPerDevice
  latex: V
  definition: number of interleaved virtual pipeline stages assigned to each device
  kind: count
  notes: Interleaving divides the bubble fraction by roughly this factor.
- macro: \WorkerIndex
  latex: k
  definition: position of one data-parallel worker among the devices of a job, counted from one
  kind: index
  notes: Usually a subscript ($\MinibatchGradient_k$); written bare only when the
    worker itself is named.
