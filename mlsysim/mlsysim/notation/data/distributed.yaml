- macro: \LoggpLongmessageTime
  latex: T_{\text{long}}(n)
  definition: LogGP Long-Message Time
  kind: scalar
  unit: seconds
  notes: Transfer time for an $n$-byte long message. Reuses $n$ from the $\alpha$-$\beta$ model.
- macro: \LogploggpNetworkLatency
  latex: L_{\text{LogGP}}
  definition: LogP/LogGP Network Latency
  kind: scalar
- macro: \MeanTimeBetweenFailures
  latex: \text{MTBF}
  definition: Mean Time Between Failures
  kind: scalar
  unit: hours
  notes: Average time between consecutive failures. $\text{MTBF}_{\text{system}} = \text{MTBF}_{\text{component}}
    / N$.
  aliases:
  - \MeanTimeBetweenFailuresThree
- macro: \MeanTimeToFailure
  latex: \text{MTTF}
  definition: Mean Time To Failure
  kind: scalar
  unit: hours
  notes: Component lifetime metric derived from FIT rates. Distinct from system-level $\text{MTBF}$ when
    repair/replacement cycles are modeled.
- macro: \MeanTimeToRepair
  latex: \text{MTTR}
  definition: Mean Time To Repair
  kind: scalar
  unit: hours
  notes: Average recovery time after a failure.
- macro: \MessageInjectionGap
  latex: g
  definition: Message Injection Gap
  kind: scalar
  unit: seconds
  notes: Minimum interval between consecutive message injections at one node, the $g$ parameter of the
    LogP/LogGP models.
- macro: \MicrobatchCount
  latex: m
  definition: Microbatch Count
  kind: count
  unit: Integer
  notes: Number of microbatches one pipeline-parallel step splits its batch into; the pipeline bubble
    fraction falls as $m$ grows.
- macro: \MlProductivityGoodputFactorsProgram
  latex: \eta_{\text{program}}
  definition: ML Productivity Goodput Factors
  kind: scalar
- macro: \MlProductivityGoodputFactorsRuntime
  latex: \eta_{\text{runtime}}
  definition: ML Productivity Goodput Factors
  kind: scalar
- macro: \MlProductivityGoodputFactorsScheduling
  latex: \eta_{\text{scheduling}}
  definition: ML Productivity Goodput Factors
  kind: scalar
- macro: \NdeviceTime
  latex: T_N
  definition: N-Device Time
  kind: scalar
  unit: seconds
  notes: Wall-clock time for the same productive work on $N$ devices; excludes operational downtime counted
    by $\eta_{\text{goodput}}$.
- macro: \NumberOfDevices
  latex: N
  definition: Number of Devices
  kind: count
  unit: Count
  notes: Devices (accelerators or nodes) participating in one distributed job. Accepted attempts in an
    agentic cohort are $N_{\text{acc}}$, not $N$.
- macro: \OperationalOverheadFraction
  latex: f_{\text{overhead}}
  definition: Operational Overhead Fraction
  kind: scalar
  unit: Dimensionless
  notes: Fraction of allocated wall time lost outside the productive steps measured by $T_N$, such as
    checkpoint pauses, failure recovery, scheduler preemption, or maintenance.
- macro: \OverlappedTime
  latex: T_{\text{overlap}}
  definition: Overlapped Time
  kind: scalar
  unit: seconds
  notes: Communication hidden behind computation. Reduces effective overhead.
- macro: \PercomponentFailureRate
  latex: \lambda
  definition: Per-Component Failure Rate
  kind: scalar
  unit: failures/hour
  notes: 'Per-component failure rate; the system-wide rate is $N\lambda$ under independent, identical
    components. The industry-standard reporting unit is FIT (failures per $10^9$ device-hours): $\lambda_{\text{hour}}
    = \text{FIT} \times 10^{-9}$. *(Not sensitivity—context disambiguates.)*'
- macro: \PermessageLatency
  latex: \alpha
  definition: Per-Message Latency
  kind: scalar
  unit: CBF decay ($\gamma_{\text{cbf}}$), significance ($\alpha_{\text{sig}}$), angular acceleration
    ($\boldsymbol{\alpha}$), copper tempco ($\alpha_{\text{Cu}}$), or noise schedule ($\bar{\alpha}_k$)
  notes: Authority transfer uses scalar function $\alpha(t) \in [0, 1]$; barrier linear decay uses $\gamma_{\text{cbf}}
    > 0$; statistical confidence significance uses $\alpha_{\text{sig}} = 1 - \text{CL}$; angular acceleration
    is bold vector $\boldsymbol{\alpha} \in \mathbb{R}^3$ ($\text{rad/s}^2$); copper resistance tempco
    is $\alpha_{\text{Cu}}$; diffusion noise schedules use indexed $\bar{\alpha}_k$.
- macro: \PipelineBubbleFraction
  latex: b_{\text{pipe}}
  definition: Pipeline Bubble Fraction
  kind: scalar
  unit: Dimensionless
  notes: Fraction of pipeline GPU-time spent idle; avoids bare $b$.
