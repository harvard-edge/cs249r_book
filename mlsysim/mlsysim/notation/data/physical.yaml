- macro: \CheckedSignal
  latex: x
  definition: trajectory signal a pre-execution checker compares with its limit, such as one joint's position,
    velocity or torque
  kind: function
  unit: varies
  notes: 'Unit of whichever signal is checked: rad, rad/s or N*m.'
- macro: \CheckedSignalLimit
  latex: L_{\text{limit}}
  definition: limit a pre-execution checker holds one trajectory signal under, such as a joint position,
    contracted velocity or torque limit
  kind: scalar
  unit: varies
  notes: 'Unit of the signal it limits: rad, rad/s or N*m.'
- macro: \ChirpDuration
  latex: T_c
  definition: time over which one FMCW radar chirp sweeps its bandwidth
  kind: scalar
  unit: s
- macro: \ChirpSlope
  latex: S
  definition: rate at which an FMCW radar chirp's frequency rises, bandwidth over chirp duration
  kind: scalar
  unit: Hz/s
- macro: \ChopperClampVoltage
  latex: V_{\text{clamp}}
  definition: bus voltage at which a dynamic brake chopper switches its absorption resistor across the
    bus
  kind: scalar
  unit: V
  notes: Above the full-charge voltage and below the converter and switch ratings.
- macro: \ChopperTurnOffVoltage
  latex: V_{\text{clamp,off}}
  definition: lower hysteresis threshold at which the brake chopper disconnects its resistor
  kind: scalar
  unit: V
- macro: \ChopperTurnOnVoltage
  latex: V_{\text{clamp,on}}
  definition: upper hysteresis threshold at which the brake chopper switches its resistor onto the bus
  kind: scalar
  unit: V
- macro: \ChunkActionDimension
  latex: d_{\text{chunk}}
  definition: number of scalar components in one action chunk, the action dimension times the chunk horizon
  kind: count
- macro: \ChunkEnsemblingWeight
  latex: w
  definition: weight temporal ensembling gives the prediction of one overlapping action chunk, indexed
    by that chunk's position
  kind: scalar
  unit: dimensionless
  notes: Holds the bare symbol and takes the chunk index explicitly, $\ChunkEnsemblingWeight_k = \exp(-\EnsemblingDecayRate\,
    k)$ with $k$ the $\ActionChunkIndex$. Supersedes $\TemporalEnsemblingWeight$, whose baked-in subscript
    $i$ cannot carry the chunk index; that entry can become an alias of this one.
- macro: \ChunkExecutionHorizon
  latex: H_{\text{exec}}
  definition: number of actions of each predicted chunk the controller executes before the policy is queried
    again
  kind: count
  notes: At most \ActionChunkHorizon; divides the episode into $S/H_{\text{exec}}$ query boundaries.
- macro: \ChunkImitationLoss
  latex: \mathcal{L}_{\text{chunk}}
  definition: behavioral cloning objective that sums a per-step regression penalty over every step of
    a demonstrated action chunk
  kind: function
  unit: dimensionless
  notes: With a Huber per-step penalty it limits the pull of teleoperation outliers. Not \ActVariationalObjective,
    which adds the CVAE term.
- macro: \ChunkLease
  latex: T_{\text{lease}}
  definition: longest time an admitted action chunk may keep driving the actuators without renewal
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
- macro: \ChunkReactionLatency
  latex: T_{\text{reaction}}
  definition: worst-case delay from a new observation until a revised chunk proposal built from it is
    available, one renewal period plus one proposer inference
  kind: scalar
  unit: s
  notes: \ChunkRenewalPeriod plus \ProposerInferenceTime; excludes admission and physical response delay.
    Chunking does not shorten it.
- macro: \ChunkReconstructionLoss
  latex: \mathcal{L}_{\text{recon}}
  definition: reconstruction error between a demonstrated action chunk and the chunk the ACT decoder predicts
  kind: function
  notes: One of the two terms of \ActVariationalObjective.
- macro: \ChunkRenewalPeriod
  latex: T_{\text{chunk}}
  definition: nominal interval between successive admissions of the chunk policy's proposals
  kind: scalar
  unit: s
  notes: With \RenewalJitterAllowance it must stay below \ChunkLease.
- macro: \ChunkRenewalRate
  latex: f_{\text{replan}}
  definition: rate at which the chunk policy starts a new evaluation from fresh sensory frames
  kind: scalar
  unit: Hz
  notes: Reciprocal of \ChunkRenewalPeriod.
- macro: \ChunkStepIndex
  latex: i
  definition: position of one step within an action chunk, counted from zero
  kind: index
- macro: \ClampedControlCommand
  latex: \mathbf{u}_{\text{clip}}
  definition: control command after independent per-axis clamping, which ignores the coupled barrier constraint
  kind: vector
  notes: Contrasted with the projection \CertifiedControlAction.
- macro: \ClassKFunction
  latex: \kappa
  definition: extended class-K function that bounds how fast the barrier value may decrease
  kind: function
  notes: Written as a function head in $\dot{h} \ge -\kappa(h)$; its value has the units of $\dot{h}$.
    The linear choice is $\kappa(h) = \gamma_{\text{cbf}} h$. \ClassRateFunction is the standalone label
    $\kappa(\cdot)$.
- macro: \ClassKFunctionSet
  latex: \mathcal{K}
  definition: class of continuous strictly increasing functions that are zero at zero, the class-K functions
  kind: set
  notes: Named in "extended class-$\mathcal{K}$ function".
- macro: \ClearDistance
  latex: D_{\text{clear}}
  definition: distance between the machine and the boundary it must stop before
  kind: scalar
  unit: m
  notes: The subscript keeps it distinct from dataset size $D$.
- macro: \ClearanceAcceleration
  latex: \ddot{D}_{\text{clear}}
  definition: second time derivative of the clearance distance to the boundary
  kind: scalar
  unit: m/s^2
  notes: Second time derivative of \ClearDistance.
- macro: \ClearanceAllowance
  latex: C
  definition: one allowance of the stopping budget, such as the localization allowance or the side clearance,
    against which a depth error scale is compared
  kind: scalar
  unit: m
  notes: Setting \DepthStandardDeviation equal to it gives the crossover range. Not \ApparentContrast.
- macro: \ClearanceExhaustionTime
  latex: t_{\text{impact}}
  definition: time for a constant heading offset's lateral drift to consume the side clearance
  kind: scalar
  unit: s
- macro: \ClearanceInset
  latex: C_{\text{inset}}
  definition: separation a consumer holds between an estimated obstacle position and the machine's envelope
    so the true obstacle stays at least the required clearance away, except with a stated tail probability
  kind: scalar
  unit: m
  notes: Equals \RequiredClearance plus the empirical 99th-percentile norm of \SpatialErrorVector; a field
    of the observation contract.
- macro: \ClearanceQueryTime
  latex: t_{\text{query}}
  definition: time one clearance query takes at one evaluation sphere of the machine's body
  kind: function
  unit: s
- macro: \ClearanceRate
  latex: \dot{D}_{\text{clear}}
  definition: rate of change of the clearance distance to the boundary, negative while approaching
  kind: scalar
  unit: m/s
  notes: Time derivative of \ClearDistance.
- macro: \ClearanceSpeedClamp
  latex: v_{\text{clamp}}
  definition: largest speed at which the stopping distance still fits within the available clearance,
    solved from the clearance inequality
  kind: scalar
  unit: m/s
- macro: \ClearanceTimeBudget
  latex: T_{\text{total}}
  definition: time available at constant speed before the clearance remaining after the braking distance
    is used up, the budget the teleoperation delays must fit
  kind: scalar
  unit: s
  notes: Clear distance minus braking distance, divided by speed.
- macro: \ClfClassKFunction
  latex: \alpha_V
  definition: extended class-K function of the Lyapunov value that sets the minimum rate at which a control
    Lyapunov function must decrease
  kind: function
  notes: CLF counterpart of the barrier \ClassKFunction; applied as $\alpha_V(V(\mathbf{x}))$.
- macro: \ClfDescentControlSet
  latex: \mathcal{U}_{\text{CLF}}
  definition: set of admissible inputs that satisfy the control Lyapunov decrease condition at a state,
    a closed affine half-space
  kind: set
- macro: \ClockConversionBound
  latex: \epsilon_{\text{sync}}
  definition: bound on the error of converting a sensor's capture timestamp to the clock of the safety
    microcontroller that hosts the permission path
  kind: scalar
  unit: s
  notes: Measured from offset tails, path asymmetry and drift between corrections; added to the observation
    age at dispatch.
- macro: \ClockConversionIntercept
  latex: b_{\text{clk}}
  definition: intercept of the affine mapping that converts a capture-clock time to the safety microcontroller's
    clock
  kind: scalar
  unit: s
- macro: \ClockConversionSlope
  latex: a
  definition: slope of the affine mapping that converts a capture-clock time to the safety microcontroller's
    clock
  kind: scalar
  unit: dimensionless
- macro: \ClockOffset
  latex: \theta_{\text{offset}}
  definition: difference between a follower clock's reading and the leader clock's at the same instant
  kind: scalar
  unit: s
- macro: \ClockSynchronizationSkew
  latex: \delta_{\text{skew}}
  definition: rate at which two clocks drift apart, such as the application processor and the safety microcontroller
  kind: scalar
  unit: ppm
  notes: Hardware crystal drift between the application processor and safety microcontroller clocks.
- macro: \ClosedLoopTrajectoryDensity
  latex: p_{\text{cl}}
  definition: joint density of an executed closed-loop trajectory under a candidate policy, its permission
    path and the physical plant, given the trial's environment, plant and permission-path parameters
  kind: distribution
  notes: Its trajectory holds admitted commands, not raw policy proposals; marginalizing over the operational
    test distribution gives the deployment trajectory distribution. Not $\PolicyTrajectoryDistribution$
    ($p_\theta$), which has no permission path and is conditioned only on the policy weights.
- macro: \ClosingSpeedBound
  latex: v_{\text{close}}
  definition: largest speed at which two moving bodies approach each other
  kind: scalar
  unit: m/s
- macro: \CognitivePolicyAction
  latex: \mathbf{a}
  definition: action the learned policy emits at step t, before any safety check
  kind: vector
  notes: Normalized joint delta, target pose, or gripper command; unprivileged, unlike \CertifiedControlAction.
- macro: \ColdCopperLossPower
  latex: P_0
  definition: copper loss of a winding at its reference resistance, before copper's resistance rise
  kind: scalar
  unit: W
  notes: Torque-producing current squared times \ReferenceWindingResistance.
- macro: \CollaborativeContactForce
  latex: F_{\text{contact}}
  definition: peak force the robot applies to a human body region in a collaborative contact, as a function
    of approach speed, the robot effective mass and the body-region stiffness
  kind: scalar
  unit: N
  notes: Written with its arguments in the authorization criterion, $F(v, m_{\text{eff}}, k_H)$; bounded
    by the assessed contact-force limit. \UnbrakedImpactForce is its free, unbraked model.
- macro: \CollectedPhotocharge
  latex: Q
  definition: total electric charge a photodiode accumulates from incident light over one exposure
  kind: scalar
  unit: A*s
- macro: \CollectionStateVisitationDistribution
  latex: p^{\pi_{\text{col}}}
  definition: empirical distribution of states, or state-action pairs, the collecting policy visited while
    a dataset was logged
  kind: distribution
  notes: Its support is the only region where a cloned policy receives supervision. Not $\ExpertStateVisitationDistribution$,
    which assumes a single expert.
- macro: \CollisionHullCount
  latex: N_{\text{hulls}}
  definition: number of evaluation spheres whose union covers the machine's body
  kind: count
- macro: \CollocationDefect
  latex: \Delta
  definition: mismatch at one collocation point between the state derivative of the interpolating spline
    and the plant dynamics, driven to zero by direct collocation
  kind: vector
  unit: varies
  notes: Indexed by collocation point, $\CollocationDefect_k$; same units as \PlantStateRate.
  render_exception: Keeps the collocation literature's upright-capital Delta for the defect, not a bold
    letter.
- macro: \CombinedPlanValidationAllowance
  latex: t_{\text{validate}}
  definition: elapsed timing allowance for combined host geometry validation and local controller admission of a whole candidate plan
  kind: scalar
  unit: s
  notes: Includes scheduling delay; the host-versus-controller allocation requires qualification. Not isolated controller work or permission-tick execution time.
- macro: \CommandComponentCount
  latex: N_c
  definition: number of components of one command vector, in the order and units the static authority
    manifest fixes
  kind: count
- macro: \CommandRateCeiling
  latex: r
  definition: largest rate of change the enforcer allows a channel command, such as the jerk bound of
    an acceleration command or the torque rate of a torque command
  kind: scalar
  unit: varies
  notes: Unit is the command unit per second (m/s^3 for acceleration, N*m/s for torque). In the smoothstep
    window $\BlendingTransitionWindow \ge 1.875\lvert\Delta u\rvert/r$.
- macro: \CommandTransportTime
  latex: T_{\text{bus}}
  definition: time for a command to travel over the fieldbus from the permission path to the drive
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
  aliases:
  - \CommandTransportTimeBus
- macro: \CommandedActuatorEffort
  latex: u_{\text{cmd}}
  definition: force or torque a controller commands from one actuator, before clipping to its realizable
    envelope
  kind: scalar
  unit: varies
  notes: N for a linear actuator, N*m for a rotary one.
- macro: \CommandedApproachAcceleration
  latex: a_{\text{cmd}}
  definition: acceleration commanded along the approach direction toward an obstacle, positive when it
    increases the approach speed
  kind: scalar
  unit: m/s^2
  notes: The input of the one-dimensional relative-degree example. Not the mapped-command action tap that
    05_data writes with the same glyph.
- macro: \CommandedJointConfiguration
  latex: \mathbf{q}_{\text{cmd}}
  definition: joint configuration the controller commands, as opposed to the one the encoders measure
  kind: vector
  unit: varies
  notes: Evaluating a safety check on it instead of on measured state hides a stripped gear or sheared
    belt.
- macro: \CommandedJointCount
  latex: N_j
  definition: number of joints a proposal or trajectory record commands, fixed by the configured count
  kind: count
  notes: Sizes the per-joint arrays of the record layouts.
- macro: \CommandedJointTorque
  latex: \tau
  definition: torque commanded at a single joint in one-joint derivations
  kind: scalar
  unit: N*m
  notes: Scalar torque commanded at one joint in single-joint derivations such as the kinetic barrier
    ($J\dot{\omega} = \tau + \tau_{\text{bias}}$). Bounds and disturbances keep subscripts ($\tau_{\max}$,
    $\tau_{\text{bias}}$); unsubscripted scalar $\tau$ means this torque only where the derivation states
    it.
- macro: \CommandedJointTorqueSlew
  latex: \dot{\tau}
  definition: time derivative of the torque at a single joint, its torque slew
  kind: scalar
  unit: N*m/s
  notes: Scalar counterpart of \JointTorqueSlew. For constant effective inertia it equals \EffectiveJointInertia
    times \JointJerk.
- macro: \CommandedTrackedPosition
  latex: r_{\text{cmd}}
  definition: commanded reference position the tracked point should follow along one axis
  kind: scalar
  unit: m
  notes: Scalar per-axis counterpart of \ReferencePosition.
- macro: \CommandedTractiveForce
  latex: F_{\text{cmd}}
  definition: tractive force a commanded drive torque asks of a wheel at its contact patch, drive torque
    divided by wheel radius
  kind: scalar
  unit: N
  notes: Not the force at brake command in 10_intent and 16_release, which shares the glyph.
- macro: \CommitmentInstant
  latex: t_{\text{commit}}
  definition: instant after which a receding-horizon plan's prefix is committed and can no longer be replaced
  kind: scalar
  unit: s
  notes: The matched stop suffix begins here if no successor has been admitted.
- macro: \CommitmentPathPosition
  latex: q_{c}
  definition: position along the admitted path at the commitment instant, the entry position of the matched
    stop
  kind: scalar
  unit: m
  notes: $\StopAxisPosition(\CommitmentInstant)$.
- macro: \ComparisonTrajectory
  latex: z
  definition: solution of the scalar comparison differential equation that lower-bounds the barrier value
    in the comparison lemma
  kind: function
  notes: Exponential decay from the initial barrier value at the linear decay rate.
- macro: \ComparisonTrajectoryDerivative
  latex: \dot{z}
  definition: time derivative of the comparison trajectory in the comparison lemma
  kind: function
  notes: Units of the barrier per second.
- macro: \ComplementarityNormalForce
  latex: \lambda_n
  definition: normal force at a unilateral rigid contact in the complementarity model, nonnegative and
    nonzero only when the gap is closed
  kind: scalar
  unit: N
  notes: The Lagrange multiplier of the non-penetration constraint. Physically the force \NormalContactForce
    names; the lambda glyph marks its multiplier role in the KKT and LCP statements.
- macro: \CompletionOffset
  latex: c
  definition: time from the start of a tick to the completion of that tick's work, where the controller
    feeds the watchdog
  kind: scalar
  unit: s
  notes: Written with its tick index, $\CompletionOffset_n$; bounded by \MinimumCompletionOffset and \MaximumCompletionOffset.
- macro: \CompliantElementPreload
  latex: F_{\text{preload}}
  definition: force a compliant element already carries at rest, before it begins to deflect
  kind: scalar
  unit: N
- macro: \CompliantElementStiffness
  latex: k_{\text{spring}}
  definition: stiffness of a passive compliant element placed in series with a contact, force per unit
    deflection
  kind: scalar
  unit: N/m
- macro: \ComposedChainTransform
  latex: \mathbf{T}_{AC}
  definition: homogeneous transform from frame C to frame A obtained by composing a chain of transforms
  kind: matrix
- macro: \ComputeChipPower
  latex: P_{\text{chip}}
  definition: steady-state power the proposal-path compute silicon draws during a mission
  kind: scalar
  unit: W
- macro: \ConditionalFlowMap
  latex: \psi
  definition: map that carries a source noise sample to its point on the straight conditional path at
    a given flow time
  kind: function
  notes: Subscripted by flow time; linear interpolation between the noise sample and its paired data sample.
- macro: \ConditionalVelocityField
  latex: v
  definition: velocity along one conditional flow-matching path given its endpoint sample
  kind: function
  notes: For the straight path it is the data sample minus the noise sample, constant in flow time.
- macro: \ConeLimitStepSize
  latex: \tau
  definition: positive step length along a direction, taken to zero in the definition of the contingent
    cone
  kind: scalar
  unit: varies
  notes: Time in s when the direction is a state velocity.
- macro: \ConfidenceEllipsoidRadius
  latex: \chi
  definition: Mahalanobis radius of a Gaussian confidence ellipsoid, whose square is the chi-square quantile
    for the dimension and confidence level in its subscript
  kind: scalar
  unit: dimensionless
  notes: Written $\chi^2_{d,p}$; the square is a power on the radius.
- macro: \ConfidenceLevel
  latex: C
  definition: confidence level of a one-sided statistical bound, one minus its significance level
  kind: scalar
  unit: dimensionless
  notes: Equals $1 - \alpha_{\text{sig}}$ (\HypothesisTestSignificanceLevel). Not \AssuranceClaim.
- macro: \ConfigurationSpace
  latex: \mathcal{C}
  definition: set of all configurations of a mechanism, one point per assignment of its joint positions
  kind: set
  notes: Gains a dimension with every joint.
- macro: \ConfirmationHitCount
  latex: M
  definition: number of associated frames a tentative track needs within the confirmation window
  kind: count
- macro: \ConfirmationWindowCount
  latex: N_{\text{conf}}
  definition: number of most recent frames an M-of-N track-confirmation rule examines
  kind: count
- macro: \ConfluentVandermondeMatrix
  latex: \mathbf{M}
  definition: matrix of powers of the segment duration that maps polynomial coefficients to endpoint position,
    velocity and acceleration
  kind: matrix
  notes: Its lower-right block $\mathbf{M}_{33}$ (an index) is the reduced 3x3 system. Not the generalized
    inertia matrix \GeneralizedInertiaMatrix, which shares the glyph.
- macro: \ConformalMiscoverageRate
  latex: \epsilon
  definition: allowed probability that the conformal prediction set misses the true referent
  kind: scalar
  unit: dimensionless
  notes: Coverage is at least $1-\epsilon$.
- macro: \ConformalPredictionSet
  latex: \mathcal{C}
  definition: calibrated set of referent candidates that cannot be excluded at the miscoverage rate
  kind: set
  notes: A singleton admits the referent; a larger set refuses. Shares the glyph of the safe set \ForwardInvariantSafeSet;
    the two never appear in the same derivation.
- macro: \ConsoleCommunicationTime
  latex: T_{\text{comm}}
  definition: 'time the operator console and link add to a takeover: video transport to the operator plus
    the returning protocol exchange'
  kind: scalar
  unit: s
  notes: Shares its glyph with \CommunicationTime (gradient communication per training step), a different
    quantity.
- macro: \ConstantHazardRate
  latex: \lambda
  definition: constant rate of hazardous failures per operating hour of a machine, the rate a failure-free
    test exposure bounds from above
  kind: scalar
  unit: 1/h
  notes: Assumes the flat middle of the bathtub curve. The exposure wall $T \ge \ln(1/\alpha_{\text{sig}})/\lambda$
    bounds it; the tolerable value a risk assessment assigns is \TargetHazardRate, and a component's rate
    is \ComponentFailureRate.
- macro: \ConstrainedParameterVector
  latex: \mathbf{w}
  definition: parameter vector a projected gradient descent step updates and then projects back onto the
    constraint set
  kind: vector
  notes: Indexed by the iteration.
- macro: \ConstrainedTestEnvelope
  latex: \mathcal{S}
  definition: set of states a constrained physical test permits, enforced by tethers, clamps, geofences
    or the permission path
  kind: set
  notes: Not \ForwardInvariantSafeSet (the barrier-certified safe set).
- macro: \ContactApproachSpeed
  latex: v_{\text{approach}}
  definition: speed at which the robot approaches and strikes a contact surface
  kind: scalar
  unit: m/s
  notes: Contact force rises at stiffness times this speed.
- macro: \ContactCount
  latex: N_c
  definition: number of active contacts between a robot and its environment
  kind: count
  notes: Upper limit of sums over contacts. appendix_systems writes N_c for a command-component count,
    a different meaning.
- macro: \ContactDeformationDuration
  latex: \Delta t_{\text{def}}
  definition: duration over which a physical contact pad deforms during impact
  kind: scalar
  unit: s
  notes: A duration, not a discrepancy.
- macro: \ContactDirectionSpeed
  latex: v_c
  definition: speed of the end effector along the contact direction during a contact interval
  kind: scalar
  unit: m/s
- macro: \ContactDirectionVelocity
  latex: \dot{x}
  definition: velocity of the robot's contact point along the contact direction
  kind: scalar
  unit: m/s
- macro: \ContactDriftAcceleration
  latex: a_{\text{drift}}
  definition: part of the normal acceleration at a contact that does not depend on the contact force,
    from applied torques, Coriolis, gravity and Jacobian rate terms
  kind: scalar
  unit: m/s^2
- macro: \ContactForce
  latex: F_{\text{contact}}
  definition: force between the robot and the environment at a contact, along the contact direction
  kind: scalar
  unit: N
  notes: Scalar contact force; the per-point vector is \ContactPointForce.
- macro: \ContactForceBarrierFunction
  latex: h_{\text{force}}
  definition: barrier certificate on contact force, the hard force limit minus the contact force magnitude
  kind: function
  unit: N
- macro: \ContactForceCap
  latex: F_{\text{cap}}
  definition: smaller of the deliverable actuator force and the contact-force ceiling after sensing and
    delay allowances
  kind: scalar
  unit: N
- macro: \ContactForceCeiling
  latex: F_{\max}
  definition: largest contact force an intent lease admits, the force part of its wrench ceiling
  kind: scalar
  unit: N
- macro: \ContactForceLimit
  latex: F_{\text{limit}}
  definition: hard limit on the contact force magnitude during intentional contact
  kind: scalar
  unit: N
- macro: \ContactForceMagnitude
  latex: F
  definition: magnitude of a contact force at the gripper or tool
  kind: scalar
  unit: N
- macro: \ContactForceRegularizationWeight
  latex: w_f
  definition: weight on the squared deviation of contact forces from their nominal values in a whole-body
    control objective
  kind: scalar
  unit: varies
  notes: Converts squared force into the objective's units, so its unit depends on how the task terms
    are scaled.
- macro: \ContactForceRiseTime
  latex: t_{\text{rise}}
  definition: time contact force takes to rise from onset to its peak or target
  kind: scalar
  unit: s
  notes: Not \ActuatorResponseTime.
- macro: \ContactGapAcceleration
  latex: \ddot{\phi}
  definition: second time derivative of the contact gap function, the relative normal acceleration at
    a contact
  kind: function
  unit: m/s^2
  notes: Its complementarity with the normal force gives the acceleration-level LCP.
- macro: \ContactGapFunction
  latex: \phi
  definition: 'signed distance between two contact geometries as a function of the configuration: positive
    when separated, zero in contact, negative when penetrating'
  kind: function
  unit: m
  notes: Rigid non-penetration requires it to stay nonnegative.
- macro: \ContactGapVelocity
  latex: \dot{\phi}
  definition: first time derivative of the contact gap function, the rate at which the gap closes or opens
  kind: function
  unit: m/s
  notes: Equals the contact normal velocity \ContactNormalVelocity; written as a derivative where the
    gap function is being differentiated.
- macro: \ContactImpulse
  latex: I
  definition: impulse a contact transfers, the time integral of contact force over the contact event
  kind: scalar
  unit: N*s
  notes: The paired-trace error is $\FiniteChange I$.
- macro: \ContactJacobianBaseBlock
  latex: \mathbf{J}_{k,b}
  definition: block of the Jacobian of contact point k that multiplies the floating-base velocities
  kind: matrix
  notes: Base block of \ContactPointJacobian for contact k.
- macro: \ContactJacobianJointBlock
  latex: \mathbf{J}_{k,j}
  definition: block of the Jacobian of contact point k that multiplies the actuated-joint velocities
  kind: matrix
  notes: Joint block of \ContactPointJacobian for contact k. The site's raw text is the bare J; the entry's
    LaTeX includes _{k,j}.
- macro: \ContactLoopResponseTime
  latex: T_c
  definition: time the contact-control loop takes to respond after its tripwire fires
  kind: scalar
  unit: s
- macro: \ContactNaturalTimescale
  latex: T_{\text{contact}}
  definition: natural time scale of a mass-spring contact, the square root of effective mass over contact
    stiffness
  kind: scalar
  unit: s
  notes: Indicates how quickly contact dynamics evolve; not a maximum stable delay.
- macro: \ContactNormal
  latex: \hat{\mathbf{n}}
  definition: unit vector normal to the contact plane at one contact, pointing into the robot
  kind: vector
  unit: dimensionless
  notes: Indexed by contact. Same name as the notation-chapter glossary proposes.
- macro: \ContactNormalDeflection
  latex: x
  definition: position of the contacting body along the contact normal, whose change from first touch
    is the contact deflection
  kind: scalar
  unit: m
  notes: Written as a change, $\Delta x$ (\FiniteChange), in Hooke's law $f_n = k\,\Delta x$.
- macro: \ContactNormalJacobian
  latex: \mathbf{J}_n
  definition: Jacobian of a contact gap function, the row that maps generalized velocities to the normal
    velocity of the contact
  kind: matrix
  notes: One row per contact, the transposed gradient of the gap function. Not \ContactPointJacobian,
    which maps to the full linear velocity of the contact point.
- macro: \ContactNormalJacobianDerivative
  latex: \dot{\mathbf{J}}_n
  definition: time derivative of the contact normal Jacobian, a function of configuration and generalized
    velocity
  kind: matrix
- macro: \ContactNormalPosition
  latex: x
  definition: position of a tool or link along the contact normal, whose change from first contact is
    the contact penetration
  kind: scalar
  unit: m
  notes: Written as $\Delta x$ (\FiniteChange) for penetration in the spring contact model $f \approx
    k\,\Delta x$.
- macro: \ContactNormalVelocity
  latex: v_n
  definition: relative velocity of two bodies at a contact along the contact normal
  kind: scalar
  unit: m/s
  notes: Values just before and after an impact are \PreImpactNormalVelocity and \PostImpactNormalVelocity.
- macro: \ContactPatchRegion
  latex: \mathcal{A}
  definition: region of the ground plane covered by one active contact patch, projected onto the support
    plane
  kind: set
  notes: Indexed by contact, A_k.
- macro: \ContactPointForce
  latex: \mathbf{f}
  definition: force the environment exerts on the robot at one contact point
  kind: vector
  unit: N
  notes: Always indexed by the contact $k$; splits into \TangentialContactShear and \NormalContactForce.
  aliases:
  - \ContactForceVectorK
- macro: \ContactPointIndex
  latex: i
  definition: position of one contact point among the contacts of a grasp
  kind: index
  notes: appendix_control indexes the same contacts by i (line 999).
- macro: \ContactPointJacobian
  latex: \mathbf{J}_{\text{c}}
  definition: matrix mapping joint velocities to the linear velocity of one contact point
  kind: matrix
  notes: Indexed by the contact $k$; its transpose maps the contact force into joint torques.
  aliases:
  - \ContactPointJacobianK
- macro: \ContactPointJacobianDerivative
  latex: \dot{\mathbf{J}}_{\text{c}}
  definition: time derivative of the Jacobian of one contact point
  kind: matrix
  notes: Indexed by contact; derivative of \ContactPointJacobian.
- macro: \ContactPointOffset
  latex: \mathbf{r}
  definition: position of a grasp contact relative to the reference point of the grasped object, the moment
    arm of its force
  kind: vector
  unit: m
  notes: Indexed by contact. Not \ReferencePosition.
- macro: \ContactPointPosition
  latex: x
  definition: position of the robot's contact point along the contact direction
  kind: scalar
  unit: m
- macro: \ContactPointTorque
  latex: \boldsymbol{\tau}
  definition: moment the environment exerts on the robot at one contact patch, the torque part of the
    contact wrench
  kind: vector
  notes: Indexed by contact, tau_k. Not the joint torque vector \JointTorque, which shares the glyph.
    Same name as the notation-chapter glossary proposes.
- macro: \ContactPointVelocity
  latex: \dot{\mathbf{p}}
  definition: linear velocity of one contact point, indexed by contact
  kind: vector
  unit: m/s
  notes: The contact Jacobian maps joint velocities to it.
- macro: \ContactReactionForce
  latex: F
  definition: reaction force a stiff contact exerts when the robot's contact point deviates into it
  kind: scalar
  unit: N
  notes: Linear spring model $F = k_{\text{contact}} \Delta x$.
- macro: \ContactResponseLatency
  latex: t_{\text{resp}}
  definition: time from the contact tripwire firing until the arm begins to decelerate, during which it
    keeps moving at its approach speed
  kind: scalar
  unit: s
- macro: \ContactStiffness
  latex: k_{\text{contact}}
  definition: stiffness of a contact treated as a spring, force per unit penetration
  kind: scalar
  unit: N/m
  notes: Body-region stiffness in collaborative contact is \HertzianContactStiffness.
- macro: \ContactTorqueCeiling
  latex: \tau_{\max}
  definition: largest contact torque an intent lease admits, the torque part of its wrench ceiling
  kind: scalar
  unit: N*m
  notes: Other vol4 chapters write tau_max for a joint torque limit, a different quantity.
- macro: \ContactTripwireForce
  latex: F_{\text{trip}}
  definition: contact force at which the permission path ends an attempt on the machine, set below the
    structural damage limit
  kind: scalar
  unit: N
  notes: Below \LatchForceLimit; the latch reward penalizes force above it.
- macro: \ContactWrench
  latex: \mathbf{w}
  definition: 'contact wrench: the force and moment the environment applies at a contact, stacked into
    one vector'
  kind: vector
  unit: varies
  notes: Force rows in N, moment rows in N*m. Privileged in simulation. Not \ProcessNoiseVector or \WeightVector
    ($\mathbf{w}$).
- macro: \ContactWrenchCeiling
  latex: \mathbf{w}_{\max}
  definition: largest contact force and torque an intent lease permits at the tool, stacked as a wrench
  kind: vector
  unit: varies
  notes: Units mix N and N*m.
- macro: \ContactWrenchEnvelope
  latex: \mathbf{w}_{\text{contact}}
  definition: allowable contact wrench a grasp affordance may exert, three force and three torque components
  kind: vector
  unit: varies
  notes: Force components in N, torque components in N*m.
- macro: \ContactWrenchTransform
  latex: \mathbf{X}_k^*
  definition: six-by-six spatial force transform that carries the wrench at contact k into the center-of-mass
    frame
  kind: matrix
  notes: The star marks the force (dual) transform, not an optimum, so it belongs in the entry's LaTeX;
    the site's raw is bare X. Related to \AdjointRepresentation, which renders differently.
- macro: \ContactYieldDeadline
  latex: t_{\text{yield}}
  definition: time from first contact until a drive at constant velocity into a linear-elastic contact
    reaches the structural force limit
  kind: scalar
  unit: s
  notes: $t_{\text{yield}} = F_{\text{lim}}/(k\,v)$; a conservative lower bound uses the plate stiffness
    alone.
- macro: \ContainerInnerRadius
  latex: R
  definition: inner radius of a carried liquid container
  kind: scalar
  unit: m
  notes: Sets the liquid rise at the wall, $\ContainerInnerRadius\,\SteadyDeceleration/\Gravity$.
- macro: \ContainmentForceCeiling
  latex: F_{\max}
  definition: hard ceiling on commanded force that an operational containment of a residual claim imposes
  kind: scalar
  unit: N
- macro: \ContextHiddenRepresentation
  latex: \mathbf{h}_{\text{context}}
  definition: final hidden representation a vision-language-action backbone hands to its action decoder
  kind: vector
  notes: Width \HiddenDimension; summarizes the tokenized observation and instruction. Not \HiddenActivation
    of a generic layer.
- macro: \ContextSaveTime
  latex: t_{\text{context\_save}}
  definition: time to save the interrupted thread's register context on interrupt entry
  kind: scalar
  unit: s
- macro: \ContinuousActionComponent
  latex: a
  definition: continuous value of one dimension of an action, before it is discretized into a token bin
  kind: scalar
  unit: varies
  notes: Indexed by the action dimension, $a_k$; clipped to the declared range [a_min, a_max] before binning.
    Unit is that of the action dimension.
- macro: \ContinuousActionSpace
  latex: \mathcal{A}
  definition: set of continuous actions a robot policy may emit, a subset of real space of the action
    dimension
  kind: set
  notes: Contains \ContinuousActionVector and \CognitivePolicyAction.
- macro: \ContinuousActionVector
  latex: \mathbf{a}
  definition: 'continuous action vector of the robot''s decision process, written without a step index:
    the argument of a policy, value function, reward or action distribution, or an action recorded from
    a demonstrator or logging routine'
  kind: vector
  notes: The t-indexed action the learned policy emits is \CognitivePolicyAction ($\mathbf{a}_t$). A star
    marks the demonstrated (expert) action. Lives in \ContinuousActionSpace. Not \ActivationVector.
- macro: \ContinuousCurrent
  latex: I_{\text{cont}}
  definition: largest motor current the winding can carry indefinitely without exceeding its temperature
    limit
  kind: scalar
  unit: A
  aliases:
  - \ContinuousPeakCurrent
- macro: \ContinuousMeasurementNoiseIntensity
  latex: \mathbf{R}_{\text{cont}}
  definition: intensity matrix of continuous-time white measurement noise, the weight of the delta function in its covariance kernel
  kind: matrix
  unit: varies
  notes: Each entry has the product of its two measurement-component units times seconds. Distinct from per-sample MeasurementNoiseCovariance; the delta function has inverse-time units.
- macro: \ContinuousMotionModel
  latex: \mathbf{f}
  definition: motion model giving the state's rate of change for a given state and input
  kind: function
  notes: Not \ControlAffineDriftField, the unforced part of control-affine dynamics.
- macro: \ContinuousStateTransitionMatrix
  latex: \boldsymbol{\Phi}
  definition: state transition matrix of a continuous-time linear system, the matrix exponential of the
    system matrix times elapsed time
  kind: matrix
  notes: Function of elapsed time. Related to, but not, the sample-product IntervalTransitionMatrix proposed
    for 09_memory.
- macro: \ContinuousTorque
  latex: \tau_{\text{cont}}
  definition: largest motor torque a winding can sustain indefinitely at its temperature limit under the
    stated cooling
  kind: scalar
  unit: N*m
  notes: 'Set by heat rejection: $\MotorTorqueConstant$ times the square root of the allowed rise over
    hot resistance times thermal resistance. Evaluated at the engineering ceiling it gives the installed
    rating.'
- macro: \ContractedBarrierFunction
  latex: h_{\text{contracted}}
  definition: barrier certificate evaluated at the reference position and contracted by the tracking-error
    bound, so the actual body keeps nonnegative clearance
  kind: function
  unit: m
  notes: $h_{\text{contracted}}(\mathbf{r}) = h(\mathbf{r}) - \epsilon_{\text{track}}$.
- macro: \ControlAffineDriftField
  latex: \mathbf{f}
  definition: unforced part of control-affine dynamics, the state rate when the control input is zero
  kind: vector
  notes: In $\dot{\mathbf{x}} = \mathbf{f}(\mathbf{x}) + \mathbf{g}(\mathbf{x})\mathbf{u}$; captures inertia,
    Coriolis, gravity and passive friction.
- macro: \ControlAffineInputField
  latex: \mathbf{g}
  definition: input matrix field of control-affine dynamics, mapping control inputs to state rates
  kind: matrix
  notes: In $\dot{\mathbf{x}} = \mathbf{f}(\mathbf{x}) + \mathbf{g}(\mathbf{x})\mathbf{u}$; a vector only
    for a single input.
- macro: \ControlCommand
  latex: \mathbf{u}
  definition: control command vector sent toward the actuators, whatever its source or stage
  kind: vector
  notes: Indices name instances. Generic form; the stages are \NominalControlCommand ($\mathbf{u}_{\text{nom}}$)
    and \CertifiedControlAction ($\mathbf{u}^*$).
- macro: \ControlCommandDerivative
  latex: \dot{\mathbf{u}}
  definition: time derivative of the control command vector, the command rate
  kind: vector
  notes: A torque rate only when the command is a torque; its norm detects control chatter.
- macro: \ControlCommandSpace
  latex: \mathcal{U}
  definition: normed space of the control commands a policy outputs
  kind: set
  notes: Its elements are \NominalControlCommand.
- macro: \ControlCycleIndex
  latex: i
  definition: position of one control cycle, one re-solve of a receding-horizon controller, in the sequence
    of cycles
  kind: index
  notes: Recursive feasibility relates cycle $\ControlCycleIndex$ to cycle $\ControlCycleIndex+1$. Not
    \HorizonStepIndex, the step inside one horizon.
- macro: \ControlInput
  latex: \mathbf{u}
  definition: control input applied to the plant, the command a controller or safety filter sends to the
    actuators
  kind: vector
  notes: Units depend on the command interface (torques, setpoints). The proposed and certified commands
    are \NominalControlCommand and \CertifiedControlAction.
- macro: \ControlInputDimension
  latex: m
  definition: number of components of the control input vector
  kind: count
  notes: Not the mass \Mass.
- macro: \ControlInputLowerLimit
  latex: \mathbf{u}_{\min}
  definition: per-component lower limit of the control input the actuators can deliver
  kind: vector
  notes: Pairs with \ControlInputUpperLimit.
- macro: \ControlInputSet
  latex: \mathcal{U}
  definition: set of control inputs the controller may choose from, a subset of the input space
  kind: set
  notes: The actuator box is \AdmissibleControlSet and the barrier-feasible subset is \SafeControlSet.
- macro: \ControlInputUpperLimit
  latex: \mathbf{u}_{\max}
  definition: per-component upper limit of the control input the actuators can deliver
  kind: vector
  notes: Pairs with \ControlInputLowerLimit.
- macro: \ControlInputWindow
  latex: \mathbf{u}_{[t, t+\Delta t]}
  definition: control input signal over the short interval from t to t plus Delta t, the decision variable
    of one Bellman step
  kind: vector
  notes: Restriction of \ControlInput to one interval.
- macro: \ControlSampleIndex
  latex: k
  definition: index of one sampling period of a discrete-time controller, counted from zero
  kind: index
  notes: Outside a subscript k is not an index letter; inside one ($\mathbf{u}_k$) it needs no macro.
    Not \EstimatorStepIndex.
- macro: \ControlSetpointJerk
  latex: \mathbf{j}
  definition: time derivative of the commanded acceleration or torque during a mode transition
  kind: vector
  notes: In $\text{m/s}^3$ for Cartesian setpoints or $\text{N}\cdot\text{m/s}$ for torque setpoints.
- macro: \ControlSetpointPeriod
  latex: \Delta t_{\text{ctrl}}
  definition: time between successive setpoints the controller consumes, the deadline a synchronous setpoint
    producer must meet
  kind: scalar
  unit: s
  notes: One macro covers the whole \Delta t_{\text{ctrl}}. An executed prefix of H_exec actions spans
    H_exec times this period. Not \SamplingPeriod of the inner permission loop.
- macro: \ControlStepIndex
  latex: t
  definition: position of one discrete control step, or setpoint, in a robot's control timeline
  kind: index
  notes: Subscript of per-step quantities such as \CognitivePolicyAction and \MultimodalObservation; appears
    bare in expressions such as $\min(t+1, H)$.
- macro: \ControlTaskIndex
  latex: i
  definition: position of one task in a whole-body control task hierarchy, in priority order
  kind: index
  notes: Not the agentic \TaskIndex, which indexes evaluation tasks.
- macro: \ControllabilityMatrix
  latex: \mathbf{C}_{\text{ctrb}}
  definition: block matrix of the input matrix and its products with powers of the system matrix, whose
    rank decides controllability
  kind: matrix
  notes: Full row rank characterizes unconstrained LTI controllability; its column space is the controllable
    subspace.
- macro: \ControlledStopCommand
  latex: \mathbf{u}_{\text{stop}}
  definition: resident fallback command that executes the state-matched controlled stop
  kind: vector
  notes: STOP rung of the fallback ladder; the jerk-limited stop suffix on the base.
- macro: \ConverterLockoutVoltage
  latex: V_{\text{uvlo}}
  definition: input voltage at which a DC-DC converter shuts off, its undervoltage lockout threshold
  kind: scalar
  unit: V
  notes: Bus droop below it resets the computation the converter supplies.
- macro: \ConveyorSpeed
  latex: v_{\text{conv}}
  definition: speed of the conveyor belt that carries a workpiece past the pick station
  kind: scalar
  unit: m/s
- macro: \ConveyorSpeedBound
  latex: v_{\text{conv}}
  definition: largest speed at which the takeaway conveyor carries a target
  kind: scalar
  unit: m/s
- macro: \CoordinateFrameEmbedding
  latex: \mathbf{e}_{\text{frame}}
  definition: learned embedding of an observation's sensor-to-body transform
  kind: vector
- macro: \CopperIronThermalResistance
  latex: R_{\text{th,cu-iron}}
  definition: thermal resistance across the winding insulation from the copper node to the stator iron
    node
  kind: scalar
  unit: K/W
- macro: \CopperReferenceTemperature
  latex: T_0
  definition: reference temperature at which a winding has resistance R_0, the base of the copper temperature
    coefficient
  kind: scalar
  unit: degC
- macro: \CopperTemperatureCoefficient
  latex: \alpha_{\text{Cu}}
  definition: fractional rise in copper's electrical resistance per kelvin of temperature rise
  kind: scalar
  unit: 1/K
  notes: 0.00393 per kelvin for annealed copper at 20 degC.
- macro: \CopperThermalCapacitance
  latex: C_{\text{cu}}
  definition: heat capacity of the stator winding copper node in a multi-node motor thermal network
  kind: scalar
  unit: J/K
  notes: Single-node models lump stator and winding into \StatorThermalCapacitance.
- macro: \CopperThermalTimeConstant
  latex: \tau_{\text{th,cu}}
  definition: thermal time constant of the stator winding copper stage of a multi-node motor thermal model
  kind: scalar
  unit: s
- macro: \CoreAmbientThermalResistance
  latex: R_{\text{th,ca}}
  definition: convective thermal resistance from a motor's stator core to the ambient air
  kind: scalar
  unit: K/W
  notes: Rises when an enclosure removes airflow.
- macro: \CoreThermalCapacitance
  latex: C_{\text{core}}
  definition: heat capacity of a motor's laminated stator core and housing, the slow node of the two-node
    thermal model
  kind: scalar
  unit: J/K
  notes: The lumped first-order model folds both nodes into \StatorThermalCapacitance.
- macro: \CoriolisCentrifugalMatrix
  latex: \mathbf{C}
  definition: matrix of Coriolis and centrifugal effects in the manipulator equation, multiplying joint
    velocities
  kind: matrix
  notes: Same quantity as \CoriolisMatrix, with the arguments $(\mathbf{q}, \dot{\mathbf{q}})$ written
    in.
- macro: \CostToGo
  latex: C
  definition: expected cumulative stage cost from a state onward under a policy, the control-theory counterpart
    of the negated state value
  kind: function
  unit: dimensionless
  notes: Quadratic, $\MechanicalPlantState^\top \mathbf{P} \MechanicalPlantState$, for linear dynamics
    and quadratic cost. Control texts write it J; the training chapter reserves J for \ExpectedReturnObjective.
    Not \CostToGoFunction (Q, action-dependent).
- macro: \CoulombFrictionCoefficient
  latex: \mu
  definition: ratio of the largest tangential friction force to the normal force at a contact
  kind: scalar
  unit: dimensionless
  notes: Bounds the friction cone, $\lVert \mathbf{f}_{\parallel} \rVert \le \mu f_{\perp}$.
- macro: \CoulombFrictionForce
  latex: F_{\text{friction}}
  definition: tangential friction force at a contact, set-valued between minus and plus the friction coefficient
    times the normal force
  kind: scalar
  unit: N
  notes: Scalar counterpart of \TangentialContactShear.
- macro: \CovariateDriftBound
  latex: \mathcal{O}(S^2 \epsilon)
  definition: worst-case excess task cost of behavior cloning, growing with the square of the episode
    length
  kind: function
  notes: Big-O expression over an $S$-step horizon (\BehaviorCloningHorizon); replaces \CompoundingCovariateDrift.
  render_exception: The behavior-cloning compounding-error bound is one named result, the big-O expression
    \mathcal{O}(S^2 \epsilon) over the episode horizon, never evaluated at other arguments.
- macro: \CoverageFactor
  latex: k
  definition: number of standard deviations a calibrated confidence bound adds when a covariance is turned
    into a spatial safety margin
  kind: scalar
  unit: dimensionless
- macro: \CredibleBrakingDeceleration
  latex: a_{\text{brake}}
  definition: validated low-tail deceleration the machine achieves under its stated conditions, not the
    datasheet peak
  kind: scalar
  unit: m/s^2
  aliases:
  - \CredibleDecelerationBrake
- macro: \CriticalSectionIndex
  latex: s
  definition: index of one critical section of a lower-priority task in the priority ceiling protocol
    blocking bound
  kind: index
- macro: \CriticalSectionWcet
  latex: C^{\text{cs}}
  definition: worst-case execution time of one critical section of a lower-priority task, indexed by task
    and critical section
  kind: scalar
  unit: s
  notes: Written $\CriticalSectionWcet_{k,s}$; distinct from the whole-job \WorstCaseExecutionTime, which
    renders the same letter.
- macro: \CriticalTrackingErrorBound
  latex: \epsilon_{\text{crit}}
  definition: critical bound on the distance between commanded and measured position, larger than the
    tracking-error bound, above which the enforcer stops
  kind: scalar
  unit: m
- macro: \CriticalTransitDistance
  latex: d_{\text{crit}}
  definition: move distance at which a rest-to-rest profile first reaches its speed ceiling, separating
    triangular from trapezoidal profiles
  kind: scalar
  unit: m
- macro: \CrossEntropyLevelThreshold
  latex: \gamma
  definition: intermediate threshold on the performance metric at one cross-entropy iteration, the elite
    quantile of the current batch
  kind: scalar
  unit: varies
  notes: In the queue-delay example it is a delay, in seconds.
- macro: \CrossoverFrequency
  latex: \omega_c
  definition: angular frequency at which the open-loop gain of a feedback loop falls to one
  kind: scalar
  unit: rad/s
  notes: Frequency at which open-loop gain $\lvert L(j\omega_c) \rvert = 1$ ($0\text{ dB}$).
  aliases:
  - \OpenloopCrossoverFrequency
- macro: \CruiseSpeed
  latex: v_{c}
  definition: constant speed the machine holds, with zero acceleration, when a stop begins
  kind: scalar
  unit: m/s
  notes: The entry speed of a stop from cruise; \SpeedAtDetection plays the same role in the S-curve formula.
- macro: \CumulativeIncidentCount
  latex: N
  definition: random number of catastrophic incidents a fleet records over a cumulative operating duration,
    a Poisson counting process
  kind: count
  notes: Written $\CumulativeIncidentCount(\FailureObservationInterval)$.
- macro: \CumulativeScheduleStepIndex
  latex: s
  definition: running diffusion step in the product that forms the cumulative noise schedule
  kind: index
  notes: Ranges from one to \DiffusionStepIndex.
- macro: \CumulativeTransmittance
  latex: T
  definition: fraction of light along a viewing ray not yet absorbed by the Gaussians in front of a given
    one
  kind: scalar
  unit: dimensionless
  notes: Indexed by depth order; equals one for the first Gaussian.
- macro: \CurrentMonotonicTime
  latex: t_{\text{now,mono}}
  definition: current instant on the monotonic hardware clock when a consumer evaluates a stored record
  kind: scalar
  unit: s
  notes: Compared only with deadlines and evidence epochs converted to the same qualified clock domain.
- macro: \CurrentStateEstimate
  latex: \hat{\mathbf{x}}_{t_{\text{current}}}
  definition: estimate of the mechanical plant state propagated forward to the current instant
  kind: vector
  notes: Estimate of \MechanicalPlantState at \CurrentWallClockTime.
- macro: \CurrentTime
  latex: t_{\text{now}}
  definition: current wall-clock time at which a consumer evaluates a stored record
  kind: scalar
  unit: s
  notes: Evidence age is the current time minus \EvidenceEpoch.
- macro: \CvaeEncoderParameters
  latex: \phi
  definition: learned weights of the conditional VAE encoder that infers the latent style variable from
    a demonstration
  kind: vector
  notes: Subscript of the recognition encoder $q_\phi$; the decoder weights are $\ModelParameters$.
  render_exception: Non-bold $\phi$ for a parameter vector, the same ML convention as $\ModelParameters$
    ($\theta$).
- macro: \CvaeRecognitionEncoder
  latex: q_\phi
  definition: approximate posterior of the latent style variable given an observation, learned by a conditional
    VAE encoder
  kind: distribution
- macro: \CycleAveragePowerCeiling
  latex: \bar{P}_{\max}
  definition: largest cycle-average copper loss that keeps a winding's equilibrium at the engineering
    ceiling
  kind: scalar
  unit: W
  notes: Screens a burst schedule by average power; optimistic against the transient peak.
- macro: \CycleGuardTime
  latex: t_{\text{guard}}
  definition: guard time reserved in a fieldbus cycle budget against timing uncertainty
  kind: scalar
  unit: s
- macro: \CylinderForce
  latex: F_{\text{cyl}}
  definition: force a hydraulic cylinder delivers, supply pressure times piston area
  kind: scalar
  unit: N
- macro: \DamageEventCount
  latex: N_{\text{damage}}
  definition: number of trials in a campaign that ended in physical damage or collision
  kind: count
- macro: \DampedLeastSquaresJacobian
  latex: \mathbf{J}_{\lambda}
  definition: manipulator Jacobian regularized by damped least squares, whose pseudoinverse bounds joint
    rates near singularities
  kind: matrix
- macro: \DampedLeastSquaresPseudoinverse
  latex: \mathbf{J}_{\lambda}^\dagger
  definition: damped least-squares inverse of the manipulator Jacobian, the Jacobian transpose times the
    inverse of the Jacobian Gram matrix plus the squared damping times the identity
  kind: matrix
  notes: The dagger is not an allowed decoration on $\DampedLeastSquaresJacobian$, so the regularized
    inverse is its own symbol. Bounds each singular mode's inversion gain by one over twice the damping.
    The undamped inverse is $\JacobianPseudoinverse$.
- macro: \DampedStepConfiguration
  latex: \mathbf{q}_\lambda
  definition: joint configuration a damped-least-squares inverse-kinematics step moves to
  kind: vector
  notes: Its change from the current configuration is the damped joint step.
- macro: \DampingRatio
  latex: \zeta
  definition: damping ratio of a second-order system, damping over twice the square root of stiffness
    times mass
  kind: scalar
  unit: dimensionless
  notes: Below one underdamped, one critically damped, above one overdamped.
- macro: \DataFieldBitCount
  latex: B_{\text{data},i}
  definition: 'number of bits of frame i sent at the data-phase rate: payload and CRC'
  kind: count
  notes: The frame index i is part of the LaTeX.
- macro: \DataPhaseBitRate
  latex: R_{\text{data}}
  definition: bit rate of the CAN FD data phase after the bit rate switch
  kind: scalar
  unit: bits/s
- macro: \DcBusBulkCapacitance
  latex: C_{\text{bus}}
  definition: capacitance of the capacitor bank on the inverter DC bus that buffers transient load current
  kind: scalar
  unit: F
  notes: Inverter decoupling capacitor bank buffering transient inductive voltage collapse.
- macro: \DcBusDynamicRailDroop
  latex: \Delta V_{\text{droop}}
  definition: transient drop in DC bus voltage under a step in motor current
  kind: scalar
  unit: V
  notes: 'Resistive, inductive and capacitive parts: $\Delta I R_{\text{bus}} + L_{\text{bus}}\,dI/dt
    + \Delta I \Delta t / (2 C_{\text{bus}})$.'
- macro: \DcBusOvervoltageThreshold
  latex: V_{\text{max\_safe}}
  definition: largest DC bus voltage the enforcer tolerates before it stops, the overvoltage threshold
  kind: scalar
  unit: V
- macro: \DcBusVoltage
  latex: V_{\text{bus}}
  definition: voltage of the DC bus that feeds a motor inverter
  kind: scalar
  unit: V
- macro: \DcRailVoltage
  latex: V_{\text{rail}}
  definition: voltage of the shared DC power rail that feeds the compute and the motor inverters
  kind: scalar
  unit: V
  notes: See question on whether it is the same quantity as \DcBusVoltage.
- macro: \DeadTimeCycleCount
  latex: N_{\text{dtg}}
  definition: number of delay cycles a timer's dead-time generator inserts between complementary outputs
  kind: count
- macro: \DeadTimeDqVoltageError
  latex: \Delta V_{d,q}
  definition: voltage disturbance dead time introduces in the rotor dq frame, which compensation cancels
    with feedforward voltage
  kind: scalar
  unit: V
  notes: Taken per axis, d and q.
- macro: \DeadTimeSafetyMargin
  latex: t_{\text{margin}}
  definition: engineering buffer added to the switch delays when sizing an inverter's dead time
  kind: scalar
  unit: s
- macro: \DeadTimeTickPeriod
  latex: T_{\text{dtg}}
  definition: duration of one delay cycle of a timer's dead-time generator
  kind: scalar
  unit: s
- macro: \DeadTimeVoltageError
  latex: \Delta V_{\text{phase}}
  definition: average phase-voltage error dead time introduces, whose sign follows the phase current
  kind: scalar
  unit: V
- macro: \DeadlineInstant
  latex: t_{\text{deadline}}
  definition: clock instant by which an observation or action must be complete
  kind: scalar
  unit: s
- macro: \DebounceFrameCount
  latex: N
  definition: number of consecutive perception frames a newly observed class or mode must persist before
    the system commits to it
  kind: count
  notes: Suppresses perceptual chattering but delays every genuine change by this many frames.
- macro: \DecoderEvaluationCount
  latex: N_{\text{eval}}
  definition: number of dependent forward passes a generative action head makes per chunk, such as denoising
    or ODE-solver steps
  kind: count
- macro: \DecoderPassTime
  latex: t_{\text{pass}}
  definition: time of one dependent forward pass of a generative action head, one denoising or ODE-solver
    step
  kind: scalar
  unit: s
  notes: Summed \DecoderEvaluationCount times in \ProposerInferenceTime.
- macro: \DecouplingDriftVector
  latex: \mathbf{b}
  definition: state-dependent part of the stacked output derivatives that does not depend on the input,
    the repeated drift Lie derivatives of the outputs
  kind: vector
  notes: Cancelled by the linearizing feedback. Not \BarrierConstraintVector.
- macro: \DecouplingMatrix
  latex: \mathbf{E}
  definition: decoupling matrix of input-output feedback linearization, mapping the control input to the
    stacked highest output derivatives
  kind: matrix
  notes: Entries \DecouplingMatrixElement; must be square and non-singular for the linearizing law. Not
    \EssentialMatrix, which shares the glyph.
- macro: \DecouplingMatrixElement
  latex: E
  definition: one entry of the decoupling matrix, a Lie derivative of an output along one input column
  kind: scalar
  unit: varies
  notes: Indexed $E_{ij}$ by output $i$ and input $j$; the matrix is \DecouplingMatrix.
- macro: \DeflectionComplianceAllowance
  latex: \delta_{\text{deflect}}
  definition: clearance reserved for structural deflection, payload deflection and drivetrain compliance
    before any tracking error is observable
  kind: scalar
  unit: m
- macro: \DegradedFrictionCoefficient
  latex: \mu_{\text{fault}}
  definition: tire-floor friction coefficient on a degraded surface
  kind: scalar
  unit: dimensionless
- macro: \DelassusOperator
  latex: \mathbf{A}_{\text{Delassus}}
  definition: 'Delassus operator: contact Jacobian times inverse generalized inertia times Jacobian transpose,
    the apparent inverse inertia reflected at the contacts'
  kind: matrix
  unit: 1/kg
  notes: A scalar for a single normal contact, a matrix for several; the Schur complement of the constraint
    Jacobian in the KKT system.
- macro: \DelayPhaseLag
  latex: \Delta \phi
  definition: phase lag that loop delays add at the crossover frequency, eroding the phase margin
  kind: scalar
  unit: rad
  notes: Often quoted in degrees; for sample-and-hold, compute and bus delays, $\omega_c (T_s/2 + T_{\text{comp}}
    + T_{\text{bus}})$.
  aliases:
  - \PhaseLagDegradation
- macro: \DelayTravelDistance
  latex: d_{\text{delay}}
  definition: distance the machine travels during an uncorrected sensing-to-actuation delay, the motion
    a delayed observation cannot yet correct
  kind: scalar
  unit: m
  notes: Approximately speed times \ObservationResponseLatency; not necessarily blind travel, since a
    local controller may still stabilize the plant.
- macro: \DelayWindowIntegrationTime
  latex: \sigma
  definition: dummy time variable of integration over a past time window, distinct from the current time
    it ends at
  kind: scalar
  unit: s
  notes: Used when \TimeInstant already names the window's end.
- macro: \DelayedObservation
  latex: \mathbf{y}_{t_0}
  definition: measurement vector of a delayed observation, applied at the IMU sample nearest its capture
    epoch
  kind: vector
- macro: \DeliveredActuatorTorque
  latex: \tau_{\text{act}}
  definition: torque an actuator actually delivers at a given time, as measured in telemetry
  kind: scalar
  unit: N*m
  notes: Its headroom is $\tau_{\max} - \tau_{\text{act}}$.
- macro: \DemonstratedTargetA
  latex: \mathbf{y}_A
  definition: regression target a demonstration gives when it picks the first of two identical mugs
  kind: vector
  unit: m
- macro: \DemonstratedTargetB
  latex: \mathbf{y}_B
  definition: regression target a demonstration gives when it picks the second of two identical mugs
  kind: vector
  unit: m
- macro: \DemonstrationActionDistribution
  latex: p
  definition: conditional distribution of the actions demonstrators took given an observation, the target
    a behavioral cloning decoder models
  kind: distribution
  notes: Its mean is the squared-error minimizer; when it has several modes the mean can fall between
    them (mode averaging).
- macro: \DemonstrationActionLabel
  latex: \mathbf{a}
  definition: action recorded in a demonstration or log, the supervisory label paired with the state or
    observation at which it was taken
  kind: vector
  notes: Indexed by step, $\mathbf{a}_t$; $\mathbf{a}^*(s)$ is an expert's corrective label at state s.
    Not \CognitivePolicyAction, the learned policy's own output.
- macro: \DemonstrationArchiveActionDistribution
  latex: p_{\text{demo}}
  definition: conditional distribution of the actions recorded in a robot demonstration archive at one
    observation, whose separate modes a squared-error cloning loss averages
  kind: distribution
  notes: Labeled demo to keep it apart from the transition distribution p in the same section. Close to
    \DemonstrationActionDistribution; see questions.
- macro: \DemonstrationChunkDistribution
  latex: p_{\text{data}}
  definition: distribution of clean demonstrated action chunks that a generative action decoder learns
    to sample from
  kind: distribution
  notes: Diffusion draws its clean chunk from it; flow matching calls it the target distribution at flow
    time one. \DemonstrationDataset is its empirical sample.
- macro: \DemonstrationDataset
  latex: \mathcal{D}_{\text{demo}}
  definition: dataset of recorded observation-action demonstration pairs that an imitation loss averages
    over
  kind: set
- macro: \DemonstrationRetentionRate
  latex: R
  definition: fraction of collection attempts that survive task failure and quality filtering as usable
    demonstrations
  kind: scalar
  unit: dimensionless
- macro: \DemonstratorAction
  latex: \mathbf{a}^{*}
  definition: action vector the demonstrator recorded at one step, the reference a policy prediction is
    scored against
  kind: vector
  notes: Written with a star for the expert ($\mathbf{a}_t^*$, $\mathbf{a}^*$). Takes its step index explicitly,
    as does \CognitivePolicyAction.
- macro: \DemonstratorActionComponent
  latex: a
  definition: one component of the action a demonstrator recorded, indexed by component and written with
    a star
  kind: scalar
  unit: varies
  notes: Unit is that of the action component.
- macro: \DenseVoxelGridMemory
  latex: M_{\text{dense}}
  definition: memory a dense voxel grid over a workspace occupies, voxels times bytes per voxel
  kind: scalar
  unit: bytes
- macro: \DepletedBusVoltage
  latex: V_{\text{low}}
  definition: DC bus voltage at the depleted end of the battery's operating range
  kind: scalar
  unit: V
- macro: \DepthBinCount
  latex: D
  definition: number of discrete depth hypotheses a lift-splat network scores along each camera ray
  kind: count
  notes: Not \DatasetSize, which shares the glyph elsewhere in the volume.
- macro: \DepthBinDistribution
  latex: \boldsymbol{\alpha}_{u, v}
  definition: categorical distribution over the depth bins of one feature cell's ray, the softmax of its
    depth logits
  kind: distribution
- macro: \DepthBinIndex
  latex: k
  definition: index of one discrete depth hypothesis along a camera ray
  kind: index
- macro: \DepthBinLogits
  latex: \mathbf{d}_{u, v}
  definition: logits a lift-splat network predicts over the depth bins of one feature cell's ray
  kind: vector
- macro: \DepthBinProbability
  latex: \alpha_{u, v}
  definition: probability one feature cell's depth distribution assigns to one depth bin, as a function
    of the bin index
  kind: function
  unit: dimensionless
  notes: An entry of \DepthBinDistribution.
- macro: \DepthCalibrationScale
  latex: s
  definition: multiplicative scale of the affine calibration that converts a relative-depth network's
    output to metric depth
  kind: scalar
  unit: m
  notes: Pairs with \DepthCalibrationShift. Not \AffineScale, the tensor quantization step.
- macro: \DepthCalibrationShift
  latex: t
  definition: additive shift of the affine calibration that converts a relative-depth network's output
    to metric depth
  kind: scalar
  unit: m
  notes: Pairs with \DepthCalibrationScale. Not \TimeInstant.
- macro: \DepthFrameRate
  latex: f_{\text{cam}}
  definition: rate at which a depth camera streams range frames
  kind: scalar
  unit: Hz
  notes: Sets the ray-march update traffic of a volumetric map together with the rays per frame and steps
    per ray.
- macro: \DepthHypothesis
  latex: d
  definition: metric depth of one discrete depth hypothesis along a camera ray, indexed by bin
  kind: scalar
  unit: m
- macro: \DepthRayCount
  latex: N_{\text{rays}}
  definition: number of rays one depth frame casts into a volumetric map, one per depth pixel
  kind: count
- macro: \DepthStandardDeviation
  latex: \sigma_z
  definition: standard deviation of the depth a stereo or range sensor reports for one point
  kind: scalar
  unit: m
  notes: For stereo, $\approx z^2\sigma_d/(fb)$; grows with squared range.
- macro: \DerivativeControlEffort
  latex: \mathbf{u}_{d}
  definition: derivative-action component of a PID command, the derivative gain matrix times the error
    rate or the filtered measured velocity
  kind: vector
  notes: Differentiating only the measured state avoids derivative kick.
- macro: \DerivativeFilterTimeConstant
  latex: T_{f}
  definition: time constant of the first-order low-pass filter applied to a PID derivative term, the inverse
    of its roll-off frequency
  kind: scalar
  unit: s
  notes: Bounds the high-frequency gain of the differentiator.
- macro: \DerivativeGainMatrix
  latex: \mathbf{K}_{d}
  definition: matrix of derivative feedback gains acting on the tracking error rate in joint-space PD
    or PID control
  kind: matrix
  notes: Diagonal entries are \PidDerivativeGain values per joint; a step in velocity error times it gives
    a torque step.
- macro: \DerivativeSplineControlPoint
  latex: \mathbf{v}
  definition: control point of the derivative of a B-spline, a scaled difference of adjacent control points
  kind: vector
  unit: varies
  notes: Bounding these differences bounds the curve's velocity. Not \Velocity.
- macro: \DesignLatencyQuantile
  latex: Q_{1-\epsilon}
  definition: quantile of a latency distribution at one minus the per-handoff exceedance probability,
    the design tail a replacement deadline is budgeted against
  kind: function
  unit: s
  notes: Applied to \ReplacementLatency. The epsilon is \HandoffExceedanceProbability; the registry LaTeX
    should write that macro.
- macro: \DesiredContactPosition
  latex: x_{\text{des}}
  definition: setpoint position of the robot's contact point along the contact direction
  kind: scalar
  unit: m
- macro: \DesiredContactVelocity
  latex: \dot{x}_{\text{des}}
  definition: setpoint velocity of the robot's contact point along the contact direction
  kind: scalar
  unit: m/s
- macro: \DesiredTaskAcceleration
  latex: \ddot{\mathbf{x}}_d
  definition: desired task-space acceleration of the end effector in an impedance law
  kind: vector
  unit: varies
  notes: Units of the task coordinates (m for translation, rad for rotation, per unit time for rates).
- macro: \DesiredTaskPosition
  latex: \mathbf{x}_d
  definition: desired task-space position of the end effector in an impedance law
  kind: vector
  unit: varies
  notes: Units of the task coordinates (m for translation, rad for rotation, per unit time for rates).
- macro: \DesiredTaskSpaceAcceleration
  latex: \ddot{\mathbf{x}}^{\text{des}}
  definition: commanded acceleration of a whole-body control task's operational-space coordinates, the
    reference acceleration plus proportional-derivative correction of the task tracking error, which the
    whole-body QP tries to realize
  kind: vector
  notes: Indexed by task after the label, $\ddot{\mathbf{x}}_i^{\text{des}}$. Not $\DesiredTaskAcceleration$
    ($\ddot{\mathbf{x}}_d$), the end-effector acceleration of an impedance law; not $\TaskSpaceAcceleration$,
    the acceleration the joints actually produce.
- macro: \DesiredTaskVelocity
  latex: \dot{\mathbf{x}}_d
  definition: desired task-space velocity of the end effector in an impedance law
  kind: vector
  unit: varies
  notes: Units of the task coordinates (m for translation, rad for rotation, per unit time for rates).
- macro: \DetectionCount
  latex: n_{\text{det}}
  definition: number of candidate detections one perception frame yields
  kind: count
- macro: \DetectionInterval
  latex: t_{\text{detect}}
  definition: time a detector takes to recognize a hazard or an expiry, beyond what the observation age
    already charges
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
- macro: \DetectionMeasurementNoiseCovariance
  latex: \boldsymbol{\Sigma}_{\text{meas},j}
  definition: measurement noise covariance of candidate detection j in data association
  kind: matrix
  notes: The detection index is part of the label subscript, so it cannot ride on \MeasurementNoiseCovariance.
- macro: \DetectionRangeShortfall
  latex: \Delta d_{\text{detect}}
  definition: extra distance a machine travels before it reliably detects a person of one group, compared
    with the best-detected group, at the same speed
  kind: scalar
  unit: m
  notes: Speed times the camera frame period times the extra frames the group needs, spent from the clear
    distance before braking can begin. Not \RequiredDetectionRange, the range a detector must reach for
    the stop to fit.
- macro: \DetectionTimestamp
  latex: t_{\text{det}}
  definition: reference-clock timestamp at which a fault trial observes the NMI or diagnostic flag
  kind: scalar
  unit: s
- macro: \DetectorMissProbability
  latex: p_{\text{miss}}
  definition: probability that a hazard detector fails to report a hazard it encounters
  kind: scalar
  unit: dimensionless
  notes: Its target is chosen so that the encounter rate times it stays within the allocated hazard rate.
- macro: \DeterministicPolicy
  latex: \mu_{\theta}
  definition: deterministic policy, the actor network with parameters theta that maps a state to one action
  kind: function
  notes: Bare mu in superscripts (d^mu, Q^mu) names the same policy.
- macro: \DiagnosticCoverage
  latex: C_{\text{diag}}
  definition: rate-weighted fraction of hardware faults whose hazardous effect a diagnostic mitigates
  kind: scalar
  unit: dimensionless
  notes: $\lambda_{\text{unmitigated}} = \lambda_{\text{raw}}(1 - C_{\text{diag}})$.
- macro: \DifferentiabilityClass
  latex: C
  definition: class of functions whose derivatives up to the order written as its superscript exist and
    are continuous
  kind: set
  notes: Written with its order, $\DifferentiabilityClass^2$ for continuous position, velocity and acceleration
    of a blended trajectory.
  render_exception: Smoothness classes $C^k$ are set in italic C by universal convention, not calligraphic
    or blackboard.
- macro: \DiffusionCumulativeSchedule
  latex: \bar{\alpha}
  definition: fraction of the clean signal variance retained after k diffusion steps
  kind: scalar
  unit: dimensionless
  notes: $\bar{\alpha}_k = \prod_{s=1}^k \alpha_s$, between 0 and 1.
  aliases:
  - \DiffusionScheduleParameterK
- macro: \DiffusionGaussianNoise
  latex: \boldsymbol{\epsilon}
  definition: standard Gaussian noise added to clean action chunks in the diffusion forward process
  kind: vector
- macro: \DiffusionMatchingLoss
  latex: \mathcal{L}_{\text{diff}}
  definition: mean squared error between the injected noise and the noise the network predicts, averaged
    over diffusion steps
  kind: function
  notes: 'Mean-squared error objective: $\mathbb{E}[\lVert \boldsymbol{\epsilon} - \boldsymbol{\epsilon}_\theta(\mathbf{o}_t,
    \mathbf{A}_t^k, k) \rVert^2]$ optimized across denoising steps.'
- macro: \DiffusionNoiseVariance
  latex: \beta
  definition: variance of the Gaussian noise the forward diffusion process adds at one step, indexed by
    step
  kind: scalar
  unit: dimensionless
  notes: One minus it, multiplied over steps, gives \DiffusionCumulativeSchedule.
- macro: \DiffusionStepCount
  latex: N
  definition: number of discrete steps in the forward diffusion noise schedule
  kind: count
  notes: Training samples the step uniformly from 1 to N. Not \DecoderEvaluationCount, the number of evaluations
    inference runs.
- macro: \DiffusionStepIndex
  latex: k
  definition: position of one step in the diffusion noising or denoising sequence
  kind: index
  notes: Third argument of $\NoisePredictionNetwork$; the superscript of $\NoisedActionChunk$ names the
    same step.
- macro: \DiffusionStepRetention
  latex: \alpha
  definition: fraction of the signal variance one forward diffusion step retains, one minus that step's
    noise variance
  kind: scalar
  unit: dimensionless
  notes: Indexed by \DiffusionStepIndex; its running product is \DiffusionCumulativeSchedule.
- macro: \DiffusionTimeCoordinate
  latex: t_{\text{diff}}
  definition: normalized continuous position along the forward diffusion process, from clean data at zero
    to noise at one
  kind: scalar
  unit: dimensionless
  notes: The continuous counterpart of \DiffusionStepIndex; not physical execution time.
- macro: \DirectAxisCurrent
  latex: i_d
  definition: direct-axis current of a field-oriented drive, along the rotor field, which produces no
    torque
  kind: scalar
  unit: A
  notes: Normally regulated to zero; paired with \TorqueProducingCurrent.
- macro: \DirectAxisInductance
  latex: L_d
  definition: stator inductance along the direct axis of the rotor dq frame
  kind: scalar
  unit: H
- macro: \DirectAxisVoltage
  latex: v_d
  definition: direct-axis voltage the inverter applies in a field-oriented drive
  kind: scalar
  unit: V
- macro: \DirectionalCosineMatrix
  latex: \mathbf{R}
  definition: three-by-three rotation matrix giving the orientation of one frame relative to another
  kind: matrix
  unit: dimensionless
  notes: Orthonormal with determinant one, an element of \SpecialOrthogonalGroup.
- macro: \DiscountedReturnStepOffset
  latex: j
  definition: number of control steps after the current decision at which a robot task reward enters the
    discounted return a policy-search objective sums
  kind: index
  notes: Written j in the training chapter because k there is the diffusion step of \NoisedActionChunk;
    the general offset is \ReturnStepOffset.
- macro: \DiscountedStateVisitationDistribution
  latex: d
  definition: normalized discounted distribution of states a policy visits, one minus the discount times
    the discounted sum of its per-step state probabilities
  kind: distribution
  notes: 'Superscript names the policy: $d^{\Policy}$, $d^{\mu}$, $d^{\pi^*}$. Not \StateDistribution
    (finite-horizon average, policy baked into a subscript).'
- macro: \DiscreteLqrFeedbackGain
  latex: \mathbf{K}_{\text{lqr},d}
  definition: state-feedback gain matrix of discrete-time LQR, from the discrete Riccati solution
  kind: matrix
  notes: Discrete counterpart of \LqrFeedbackGain.
- macro: \DiscreteLqrQuadraticObjective
  latex: J_d
  definition: 'infinite-horizon quadratic cost of discrete-time LQR: the sum over control steps of the
    weighted squared state plus the weighted squared control effort'
  kind: scalar
  unit: varies
  notes: Discrete counterpart of \LqrQuadraticObjective.
- macro: \DiscretePlantDynamics
  latex: f
  definition: 'discrete-time dynamics of the physical plant: the map from the current state and applied
    command to the next state'
  kind: function
  notes: Deterministic counterpart of \PlantTransitionKernel. Not \ControlAffineDriftField (bold f).
- macro: \DiscreteSampleIndex
  latex: k
  definition: position of one sample in a fixed-period discrete-time update, written in brackets as x[k]
  kind: index
  notes: The interval between samples is $\FiniteChange \TimeInstant$.
- macro: \DiscreteStateSpaceInputMatrix
  latex: \mathbf{B}_{d}
  definition: discrete-time input matrix of a sampled linear model under zero-order hold, mapping a held
    input to the next state
  kind: matrix
  notes: Pairs with \DiscreteStateSpaceSystemMatrix; the continuous matrix is \StateSpaceInputMatrix.
- macro: \DiscreteStateSpaceSystemMatrix
  latex: \mathbf{A}_{d}
  definition: discrete-time system matrix of a sampled linear model under zero-order hold, the matrix
    exponential of the system matrix times the sampling period
  kind: matrix
  notes: Pairs with \DiscreteStateSpaceInputMatrix; the continuous matrix is \StateSpaceSystemMatrix.
- macro: \DiscretizationBinCount
  latex: n_{\text{bin}}
  definition: number of bins into which each state coordinate is partitioned when the state space is gridded
  kind: count
- macro: \DisengagedTakeoverResponseTime
  latex: T_{\Sigma,2}
  definition: time an out-of-loop human operator, not monitoring the machine, needs to take over control
    after a handover request, including console video transport and handshake
  kind: scalar
  unit: s
  notes: The in-loop counterpart is \TakeoverResponseTime ($T_{\Sigma,1}$).
- macro: \DisparityStandardDeviation
  latex: \sigma_d
  definition: standard deviation of the disparity a stereo matcher measures
  kind: scalar
  unit: pixels
  notes: vol4 intent uses it in the stereo depth term.
- macro: \DispatchAdmissionCeiling
  latex: \Delta_{\text{da,max}}
  definition: longest dispatch-to-admission interval the spare stopping clearance can pay for at the machine's
    speed
  kind: scalar
  unit: s
  notes: Spare clearance divided by speed; the ceiling for \DispatchAdmissionInterval.
- macro: \DispatchAdmissionInterval
  latex: \Delta_{\text{da}}
  definition: time from dispatching a proposal to its admission by the permission path
  kind: scalar
  unit: s
  notes: A design allocation covering proposer inference, board link, deserialization, validation, activation,
    and the wait for the next tick.
  aliases:
  - \DispatchtoadmissionIntervalDa
- macro: \DispatchObservationAge
  latex: t_{\text{age}}
  definition: elapsed physical time from sensor exposure midpoint to dispatch of the processed observation
  kind: scalar
  unit: s
  notes: Consumer evidence age additionally includes time elapsed after dispatch.
- macro: \DisplayPipelineLatency
  latex: t_{\text{disp}}
  definition: delay from a physical event to its appearance on the teleoperator's display
  kind: scalar
  unit: s
- macro: \DistanceEstimateStandardDeviation
  latex: \sigma
  definition: standard deviation of the scalar distance estimate
  kind: scalar
  unit: m
  notes: The prior before an update carries a minus subscript.
- macro: \DistanceMeasurement
  latex: z
  definition: one scalar range measurement of the remaining distance, from LiDAR or stereo
  kind: scalar
  unit: m
- macro: \DistanceQueryPoint
  latex: \mathbf{y}
  definition: point of state space whose distance to a set is measured
  kind: vector
  notes: Argument of the point-to-set distance; paired with \SetMemberPoint.
- macro: \DistortedImageAbscissa
  latex: x_d
  definition: first normalized image coordinate after radial lens distortion
  kind: scalar
  unit: dimensionless
- macro: \DistortedImageOrdinate
  latex: y_d
  definition: second normalized image coordinate after radial lens distortion
  kind: scalar
  unit: dimensionless
- macro: \DisturbanceAccelerationBound
  latex: a_{\text{dist}}
  definition: bound on the unmodeled acceleration that disturbance forces impart to an unobserved body
  kind: scalar
  unit: m/s^2
- macro: \DisturbanceBasisCoefficient
  latex: \psi
  definition: coefficient of one basis function in a parameterized disturbance trajectory, a component
    of the disturbance parameter vector
  kind: scalar
  unit: varies
  notes: Units of the disturbance channel it scales (force, voltage, delay).
- macro: \DisturbanceBasisCount
  latex: K
  definition: number of basis functions composing a parameterized disturbance trajectory
  kind: count
- macro: \DisturbanceBasisFunction
  latex: B
  definition: time-dependent basis function, such as a B-spline or Fourier mode, from which a disturbance
    trajectory is composed
  kind: function
  unit: dimensionless
- macro: \DisturbanceBudget
  latex: \Delta_{w}
  definition: largest peak magnitude a falsification disturbance trajectory may take, derived from the
    operating envelope
  kind: scalar
  unit: varies
  notes: $\|w(t;\boldsymbol{\psi})\|_\infty \le \Delta_w$.
- macro: \DisturbanceDimension
  latex: p
  definition: number of components of the disturbance input vector
  kind: count
- macro: \DisturbanceForceBound
  latex: d_{\max}
  definition: qualified upper bound on the magnitude of the external disturbance force acting on the plant
  kind: scalar
  unit: N
  notes: 'Bounds \ExternalDisturbanceForce: $|d(t)| \le d_{\max}$; part of the validity envelope of \TrackingErrorBound.'
- macro: \DisturbanceParameterSet
  latex: \Psi
  definition: compact set of disturbance parameter vectors a falsification search ranges over
  kind: set
  notes: capital Greek letter for a parameter space, the falsification literature's convention.
  render_exception: capital Greek Psi for a compact parameter space, the convention of the falsification
    literature
- macro: \DisturbanceParameterVector
  latex: \boldsymbol{\psi}
  definition: vector of basis-function coefficients that parameterizes a falsification disturbance trajectory
  kind: vector
  unit: varies
  notes: Units of the disturbance channel each basis coefficient scales (force, voltage, delay).
- macro: \DisturbanceTrajectory
  latex: w_{\text{dist}}
  definition: time-varying physical disturbance a falsification search injects, parameterized by smooth
    basis functions
  kind: function
  unit: varies
  notes: $\DisturbanceTrajectory(t; \boldsymbol{\psi}) = \sum_k \psi_k B_k(t)$, bounded by $\|\DisturbanceTrajectory\|_\infty
    \le \Delta_w$. Not \ProcessNoiseVector.
- macro: \DivergenceInstant
  latex: t_{\text{div}}
  definition: time at which an autonomous policy's rollout begins to leave its supported states
  kind: scalar
  unit: s
  notes: Estimated as $\hat{t}_{\text{div}}$ by searching backward from the takeover timestamp.
- macro: \DivergenceTolerance
  latex: \delta_{\text{tol}}
  definition: positive threshold on the trajectory-divergence residual that marks divergence
  kind: scalar
  unit: m
  notes: Expressed in the unit of the residual \TrajectoryDivergenceResidual (m for the latch example).
- macro: \DmaBurstPeriod
  latex: T_{\text{dma}}
  definition: shortest interval between the starts of successive DMA bursts that contend with a real-time
    task for its memory path
  kind: scalar
  unit: s
  notes: 'Acts as the period of an interfering source in response-time analysis: $\lceil R_i/\DmaBurstPeriod
    \rceil\,\DmaBurstStallTime$.'
- macro: \DmaBurstStallTime
  latex: C_{\text{dma}}
  definition: time one DMA burst stalls a real-time task that shares its memory path
  kind: scalar
  unit: s
  notes: The execution-time term of the DMA engine as an interfering source; pairs with \DmaBurstPeriod.
- macro: \DmaQueueTime
  latex: t_{\text{DMA}}
  definition: time a frame spends in direct memory access transfer and the driver queue
  kind: scalar
  unit: s
- macro: \DomainRandomizationDistribution
  latex: \mathcal{D}_{\text{DR}}
  definition: distribution from which domain randomization samples simulator parameter vectors
  kind: distribution
- macro: \DomainRandomizationObjective
  latex: J_{\text{DR}}
  definition: expected return of a policy averaged over the distribution of simulator parameters that
    domain randomization samples
  kind: function
  unit: dimensionless
  notes: Written $J_{\text{DR}}(\ModelParameters) = \mathbb{E}_{\boldsymbol{\xi}}[J(\ModelParameters;\boldsymbol{\xi})]$;
    covers only mechanisms the simulator models.
- macro: \DoorOpenReward
  latex: r_{\text{open}}
  definition: reward the latch-opening task pays on a step at which the door is open
  kind: scalar
  unit: dimensionless
  notes: Success term of the latch reward; the force term (\ExcessForcePenaltyWeight) and the time term
    (\StepTimePenalty) are subtracted from it.
- macro: \DoubleIntegratorPosition
  latex: p
  definition: position of a one-dimensional double-integrator model, as a function of time
  kind: scalar
  unit: m
- macro: \DoubleIntegratorPositionDerivative
  latex: \dot{p}
  definition: time derivative of the double-integrator position, equal to its velocity
  kind: scalar
  unit: m/s
- macro: \DoubleIntegratorVelocity
  latex: v
  definition: velocity of a one-dimensional double-integrator model, as a function of time
  kind: scalar
  unit: m/s
- macro: \DoubleIntegratorVelocityDerivative
  latex: \dot{v}
  definition: time derivative of the double-integrator velocity, its acceleration, equal to the acceleration
    noise
  kind: scalar
  unit: m/s^2
- macro: \DownstreamStageLatency
  latex: Y
  definition: latency of the next stage of a sense-to-actuation pipeline, as a random variable
  kind: scalar
  unit: s
  notes: Paired with \UpstreamStageLatency.
- macro: \DrainSourceVoltage
  latex: V_{\text{ds}}
  definition: voltage between the drain and source of a power switch
  kind: scalar
  unit: V
- macro: \DriftElapsedTime
  latex: t_{\text{drift}}
  definition: time elapsed since a mobile base with a heading error or yaw-rate bias left its reference
    line, over which its lateral drift accumulates
  kind: scalar
  unit: s
  notes: Upper limit of the drift integrals in the unicycle lateral-drift derivation; the integrand runs
    over \IntegrationDummyTime. Not \ControlStepIndex, the discrete step that subscripts per-step quantities
    in the same passage. Add to the chapter's notation-local list.
- macro: \DriftImpactTime
  latex: t_{\text{impact}}
  definition: time until a persistent heading bias carries a mobile base across its lateral clearance
    into an obstacle
  kind: scalar
  unit: s
- macro: \DriftLieDerivativeOperator
  latex: L_{\mathbf{f}}
  definition: Lie derivative operator along the drift field, mapping a scalar function of the state to
    its rate of change under the unforced dynamics
  kind: operator
  notes: Takes powers for repeated differentiation, $L_{\mathbf{f}}^{r}$. \LieDerivativeAlongDrift is
    the barrier-specific value $L_{\mathbf{f}} h$, whose LaTeX includes h.
- macro: \DriftSpeedBound
  latex: v_{\text{drift}}
  definition: bound on the unobserved speed at which a target drifts relative to its last measured position
  kind: scalar
  unit: m/s
- macro: \DriftVelocityBound
  latex: v_{\text{drift}}
  definition: bound on the unmodeled velocity at which an unobserved estimate drifts from the true state
  kind: scalar
  unit: m/s
- macro: \DriveBrakingForceCeiling
  latex: F
  definition: largest retarding force a machine's current-limited drives can put on the floor
  kind: scalar
  unit: N
  notes: Sum over driven wheels of torque constant times current limit over wheel radius.
- macro: \DriveBrakingTorqueCeiling
  latex: \tau
  definition: largest braking torque one current-limited drive applies at its wheel, the torque constant
    times the drive's current limit
  kind: scalar
  unit: N*m
  notes: Divided by $\WheelRadius$ it gives one wheel's share of $\DriveBrakingForceCeiling$. Shares the
    glyph of $\CommandedJointTorque$, a joint's commanded torque in one-joint derivations; this is a wheel
    drive's current-limited ceiling.
- macro: \DriveCurrentLimit
  latex: I_{\max}
  definition: largest current a motor drive's inverter allows, its configured current limit
  kind: scalar
  unit: A
  notes: Protects the power transistors and avoids core saturation; bounds \OutputTorqueCeiling.
- macro: \DrivenWheelLoadFraction
  latex: \phi_{\text{drive}}
  definition: fraction of a vehicle's total weight carried by its driven wheels
  kind: scalar
  unit: dimensionless
  notes: Scales the traction ceiling on braking deceleration.
- macro: \DriverInterruptLatency
  latex: t_{\text{driver\_irq}}
  definition: time the host driver takes to service the device interrupt before stamping a packet
  kind: scalar
  unit: s
- macro: \DrivetrainAntiresonanceFrequency
  latex: f_{\text{anti}}
  definition: antiresonance frequency of a two-inertia drivetrain, set by its torsional stiffness and
    the load inertia alone
  kind: scalar
  unit: Hz
- macro: \DrivetrainResonanceFrequency
  latex: f_{\text{res}}
  definition: resonance frequency of a two-inertia drivetrain, set by its torsional stiffness and both
    the load and reflected rotor inertia
  kind: scalar
  unit: Hz
  notes: A bridge that changes acceleration within about one period of it excites the resonance.
- macro: \DropletDiameter
  latex: d_{\text{droplet}}
  definition: diameter of one airborne water droplet or particle
  kind: scalar
  unit: m
- macro: \DynamicReachableSet
  latex: \mathcal{R}
  definition: set of states reachable from the measured state within a given remaining time under the
    stated limits
  kind: set
  notes: Not the backward reachable tube of Hamilton-Jacobi analysis (\BackwardReachableTube).
- macro: \DynamicsRealityGap
  latex: \Delta_{\text{dyn}}
  definition: 'dynamics component of the reality gap: discrepancy between simulated and physical actuator
    response and contact mechanics under identical commands'
  kind: scalar
  unit: varies
  notes: Measured from paired command-response traces in force or torque units. Component of \RealityGapVector.
- macro: \EarlierBaseFlangeTransform
  latex: \mathbf{T}_{\text{base}, k}^{\text{flange}}
  definition: base-to-flange forward-kinematics transform at the earlier of two hand-eye calibration poses
  kind: matrix
  notes: Index k is baked into the LaTeX because the chapter writes it inside the labeled subscript; see
    questions.
- macro: \EarlierCameraTargetTransform
  latex: \mathbf{T}_{\text{cam}, k}^{\text{target}}
  definition: camera-to-target transform at the earlier of two hand-eye calibration poses
  kind: matrix
  notes: Index k is baked into the LaTeX; see questions.
- macro: \EarlierControlStepIndex
  latex: t'
  definition: control step before the current step t, the running index over earlier steps in a union,
    sum or for-all condition
  kind: index
  notes: Ranges from one to the current $\ControlStepIndex$. Not $\IntegrationDummyTime$, a continuous
    time with the same glyph.
- macro: \EarliestConflictTime
  latex: t_{\text{conflict}}
  definition: earliest time at which a candidate corridor is predicted to intersect an actor forward occupancy
    set
  kind: scalar
  unit: s
  notes: Written as the offset $\Delta t_{\text{conflict}}$ from the admission epoch.
- macro: \EarthReferenceFrame
  latex: \mathcal{F}_{\text{earth}}
  definition: earth-fixed coordinate frame, the optional geodetic root of a robot's frame tree
  kind: set
- macro: \EchoRoundTripTime
  latex: t_{\text{rt}}
  definition: delay of a radar echo behind its transmitted chirp, the round trip to the reflector
  kind: scalar
  unit: s
  notes: The radar counterpart of \PulseRoundTripTime, written in its own glyph.
- macro: \EffectiveBrakingDelay
  latex: T_{\text{eff}}
  definition: pre-brake delay plus the equivalent delay the jerk ramp adds before full credible deceleration,
    the delay term of the speed ceiling
  kind: scalar
  unit: s
  notes: $T_{\text{eff}} = \tau_{\text{delay}} + a_{\text{brake}}/(2 j_{\max})$; valid above $a_{\text{brake}}^2/j_{\max}$.
- macro: \EffectiveImpactMass
  latex: m_{\text{eff}}
  definition: apparent mass the robot presents along the contact normal at a given contact point and configuration
  kind: scalar
  unit: kg
  notes: For a single frictionless impact it is the reciprocal of the Delassus coefficient formed from
    the contact normal Jacobian and the inertia matrix; for a base it includes reflected rotor inertia.
- macro: \EffectiveJointInertia
  latex: J_{\text{eff}}
  definition: total inertia seen at one joint, link and payload plus reflected rotor inertia
  kind: scalar
  unit: kg*m^2
- macro: \EffectiveLossResistance
  latex: R_{\text{eff}}
  definition: effective resistance that converts torque-producing current into winding loss
  kind: scalar
  unit: Ohm
  notes: Related to phase and line resistance by the drive's current convention.
- macro: \EffectiveSeriesStiffness
  latex: k_{\text{eff}}
  definition: effective stiffness of a contact whose two sides deflect in series, the reciprocal of the
    sum of their compliances
  kind: scalar
  unit: N/m
  notes: $1/k_{\text{eff}} = 1/k_{\text{plate}} + 1/k_{\text{robot}}$; a star marks the value at which
    the peak force reaches the latch limit.
- macro: \ElasticJointTorque
  latex: \mathbf{z}
  definition: vector of torques transmitted through the elastic joints, stiffness times the motor-link
    angle difference
  kind: vector
  unit: N*m
  notes: The fast variable of the flexible-joint singular perturbation; $\mathbf{z}_0$ (index) is its
    quasi-steady manifold. Not \LatentStyleVariable.
- macro: \ElasticModalFrequencyMatrix
  latex: \boldsymbol{\Omega}
  definition: matrix whose eigenvalues are the natural frequencies of the elastic joint modes in a frozen
    configuration, the square root of stiffness times inverse inertia
  kind: matrix
  unit: rad/s
- macro: \ElasticPotentialEnergy
  latex: E
  definition: elastic potential energy a deflected spring stores
  kind: scalar
  unit: J
  notes: One half stiffness times deflection squared.
- macro: \ElasticStrainEnergy
  latex: U_{\text{elastic}}
  definition: elastic strain energy stored in a compressed linear contact spring, one half stiffness times
    compression squared
  kind: scalar
  unit: J
- macro: \ElasticTorqueSecondDerivative
  latex: \ddot{\mathbf{z}}
  definition: second time derivative of the elastic joint torque vector
  kind: vector
  unit: N*m/s^2
- macro: \ElbowSwivelAngle
  latex: \psi
  definition: angle of the elbow on its orbit around the shoulder-to-wrist axis of a redundant arm
  kind: scalar
  unit: rad
- macro: \ElectricalAngularSpeed
  latex: \omega_e
  definition: electrical angular speed of a motor, the rotor speed times the pole-pair count
  kind: scalar
  unit: rad/s
- macro: \ElectricalResistance
  latex: R
  definition: electrical resistance of a circuit or winding
  kind: scalar
  unit: Ohm
  notes: Phase resistance is \PhaseResistance.
- macro: \ElectricalRotorAngle
  latex: \theta_e
  definition: electrical angle of a motor rotor, the mechanical angle times the pole-pair count
  kind: scalar
  unit: rad
- macro: \ElectricalTimeConstant
  latex: \tau_e
  definition: time constant of current rise in a motor winding, inductance over resistance
  kind: scalar
  unit: s
- macro: \ElementaryCharge
  latex: q
  definition: electric charge of one electron, the elementary charge
  kind: scalar
  unit: A*s
  notes: Physical constant.
- macro: \ElevationAngle
  latex: \phi
  definition: elevation angle of a direction above the horizontal plane
  kind: scalar
  unit: rad
  notes: Paired with \AzimuthAngle. Not the CVAE encoder parameters \CvaeEncoderParameters, which also
    render $\phi$.
- macro: \EliteSampleFraction
  latex: \beta
  definition: fraction of each cross-entropy batch kept as elite samples, which sets the intermediate
    threshold quantile
  kind: scalar
  unit: dimensionless
- macro: \EmergencyStopContact
  latex: S
  definition: positive-break contact of an emergency-stop switch, one per redundant channel of the safety
    circuit
  kind: record
  notes: Written with its channel index, $\EmergencyStopContact_1$, $\EmergencyStopContact_2$.
- macro: \EmergencyStopCount
  latex: n_{\text{estop}}
  definition: number of emergency protective stops recorded across a campaign's trials
  kind: count
- macro: \EmittedTokenCount
  latex: S_{\text{out}}
  definition: number of tokens a decoder emits one after another for one output
  kind: count
  aliases:
  - \EmittedTokenCountOut
- macro: \EmpiricalTransferDiscrepancy
  latex: \hat{\epsilon}_{\text{gap}}
  definition: largest weighted state error observed between paired simulated and physical runs, the empirical
    estimate of the transfer discrepancy
  kind: scalar
  unit: dimensionless
  notes: An observed maximum, not the envelope-wide bound \TransferDiscrepancyBound.
- macro: \EncoderAngle
  latex: \theta_{\text{enc}}
  definition: joint angle an encoder reports
  kind: scalar
  unit: rad
  notes: 'Sample index as a subscript: {\EncoderAngle}_{k}.'
- macro: \EncoderBitCount
  latex: n
  definition: number of bits an absolute encoder resolves per revolution
  kind: count
  notes: Angular resolution is 2 pi / 2^n.
- macro: \EncoderVelocityEstimate
  latex: \dot{\theta}_{\text{enc}}
  definition: joint velocity estimated by differencing successive encoder angle samples
  kind: scalar
  unit: rad/s
  notes: Carries quantization noise \EncoderVelocityNoise.
- macro: \EncoderVelocityNoise
  latex: \sigma_{\dot{\theta}_{\text{enc}}}
  definition: standard deviation of the velocity estimate's error caused by encoder quantization
  kind: scalar
  unit: rad/s
  notes: Quantization step over sqrt(6) times the sampling interval.
- macro: \EndEffectorCameraTransform
  latex: \mathbf{T}_{EC}
  definition: rigid transform mapping wrist-camera coordinates into the end-effector frame, the camera's
    mounting extrinsic
  kind: matrix
- macro: \EndEffectorFirstAxisPosition
  latex: x
  definition: end-effector position along the first axis of the declared Cartesian frame
  kind: scalar
  unit: m
- macro: \EndEffectorPitchAngle
  latex: \phi_{\text{pitch}}
  definition: pitch angle of the end effector under a declared rotation convention
  kind: scalar
  unit: rad
- macro: \EndEffectorPose
  latex: \mathbf{T}_{WE}
  definition: pose of the end-effector frame expressed in the world frame, a homogeneous transform
  kind: matrix
  notes: Instance of \HomogeneousTransform for frames W and E.
- macro: \EndEffectorReferenceFrame
  latex: \mathcal{F}_E
  definition: coordinate frame attached to the robot's end effector
  kind: set
  notes: 'Siblings: \WorldReferenceFrame and \BodyReferenceFrame.'
  aliases:
  - \CoordinateReferenceFrames
- macro: \EndEffectorRollAngle
  latex: \phi_{\text{roll}}
  definition: roll angle of the end effector under a declared rotation convention
  kind: scalar
  unit: rad
- macro: \EndEffectorSecondAxisPosition
  latex: y
  definition: end-effector position along the second axis of the declared Cartesian frame
  kind: scalar
  unit: m
- macro: \EndEffectorTaskAcceleration
  latex: \ddot{\mathbf{x}}
  definition: task-space acceleration of the end effector that an impedance law regulates
  kind: vector
  unit: varies
  notes: Units of the task coordinates (m for translation, rad for rotation, per unit time for rates).
- macro: \EndEffectorTaskPosition
  latex: \mathbf{x}
  definition: task-space position of the end effector that an impedance law regulates
  kind: vector
  unit: varies
  notes: Units of the task coordinates (m for translation, rad for rotation, per unit time for rates).
- macro: \EndEffectorTaskVelocity
  latex: \dot{\mathbf{x}}
  definition: task-space velocity of the end effector that an impedance law regulates
  kind: vector
  unit: varies
  notes: Units of the task coordinates (m for translation, rad for rotation, per unit time for rates).
- macro: \EndEffectorThirdAxisPosition
  latex: z
  definition: end-effector position along the third axis of the declared Cartesian frame
  kind: scalar
  unit: m
- macro: \EndEffectorTwist
  latex: \mathbf{V}_E
  definition: six-vector of end-effector angular and linear velocity in a declared spatial or body twist
    convention
  kind: vector
  unit: varies
  notes: Angular part in rad/s, linear part in m/s. The linear velocity alone is \Velocity.
- macro: \EndEffectorVelocity
  latex: \mathbf{v}_e
  definition: velocity of the end effector in operational space, the image of the joint rates under the
    manipulator Jacobian
  kind: vector
  notes: A special case of \Velocity for the end effector; units mix m/s and rad/s when it stacks linear
    and angular parts.
- macro: \EndEffectorYawAngle
  latex: \phi_{\text{yaw}}
  definition: yaw angle of the end effector under a declared rotation convention
  kind: scalar
  unit: rad
- macro: \EnergyLimitedContactForce
  latex: F_E
  definition: largest contact force the energy tank allowance permits over one control interval
  kind: scalar
  unit: N
- macro: \EnergyTankBarrierFunction
  latex: h_{\text{energy}}
  definition: barrier certificate on a passivity energy tank, its level minus the reserve floor
  kind: function
  unit: J
- macro: \EnergyTankLevel
  latex: E_{\text{tank}}
  definition: energy held in a passivity filter energy tank, credits from realized damping plus the initial
    reserve less active work
  kind: scalar
  unit: J
  notes: A software account, not physically stored energy.
- macro: \EnergyTankPower
  latex: \dot{E}_{\text{tank}}
  definition: rate of change of the energy tank, realized damping power credited minus active power debited
  kind: scalar
  unit: W
- macro: \EnergyTankReserve
  latex: E_{\text{min}}
  definition: reserve floor of a passivity energy tank, below which no active work is admitted
  kind: scalar
  unit: J
- macro: \EnforcedCommandLabel
  latex: \mathbf{a}_{\text{enf}, t}
  definition: admitted command vector at a control step, used as the imitation label
  kind: vector
  notes: The step index t is part of the rendered symbol.
- macro: \EnforcedCommandTap
  latex: a_{\text{enf}}
  definition: third stream of the four-stream action tap, the command the permission check admitted
  kind: record
- macro: \EnforcerComputeTime
  latex: T_{\text{comp}}
  definition: time the enforcer takes to evaluate its constraints within one control period
  kind: scalar
  unit: s
- macro: \EnforcerDeadline
  latex: T_{\text{deadline,enf}}
  definition: deadline, measured from the start of the permission tick, by which the enforcer must finish
    its evaluation, nested inside the permission-loop period
  kind: scalar
  unit: s
  notes: A qualified instance of the series deadline; drive frames are dispatched at a fixed phase no
    earlier than it, so execution jitter never reaches the actuators.
- macro: \EngineeringTemperatureCeiling
  latex: T_{\text{ceil}}
  definition: working winding-temperature limit chosen below the insulation rating to leave room for thermal-model
    error
  kind: scalar
  unit: degC
  notes: Burst schedules and the installed continuous rating are held to it; burst horizons are checked
    against \WindingTemperatureLimit.
- macro: \EnsembleSpreadThreshold
  latex: \sigma_{\text{thresh}}
  definition: threshold on the spread of a policy ensemble's normalized actions, squared to bound the
    covariance trace
  kind: scalar
  unit: dimensionless
- macro: \EnsemblingDecayRate
  latex: m
  definition: decay factor per chunk index of exponential temporal-ensembling weights
  kind: scalar
  unit: dimensionless
  notes: \TemporalEnsemblingWeight $= \exp(-m k)$; a smaller value lets newer chunks enter the blend faster
    or slower depending on the ordering convention.
- macro: \EnsemblingWindowLength
  latex: K
  definition: number of overlapping past chunks blended together in temporal ensembling
  kind: count
  notes: At most the chunk horizon.
- macro: \EnvironmentLatentDimension
  latex: d_z
  definition: number of components of the environment latent vector
  kind: count
- macro: \EnvironmentLatentVector
  latex: \mathbf{z}
  definition: low-dimensional latent vector an encoder computes from the privileged simulator state, summarizing
    the environment's hidden physical parameters for the actor
  kind: vector
  notes: Has \EnvironmentLatentDimension components; estimated onboard as \PredictedEnvironmentLatent.
    Not \LatentStyleVariable (the CVAE style latent), whose notes ask for a separate entry for a state
    embedding.
- macro: \EnvironmentParameters
  latex: e
  definition: external physical variables of one trial or rollout, such as floor friction, illuminance,
    obstacle geometry and air temperature
  kind: record
  notes: Not \RestitutionCoefficient (also e). Written non-bold, so a record rather than a vector.
- macro: \EpipolarLine
  latex: \mathbf{l}
  definition: homogeneous coefficients of the epipolar line in one image, on which the correspondence
    of a point in the other image must lie
  kind: vector
  notes: 'Indexed by view: $\mathbf{l}_2 = \FundamentalMatrix \HomogeneousPixelCoordinates_1$.'
- macro: \EquilibriumWindingTemperature
  latex: T_\infty
  definition: temperature a winding approaches asymptotically under a constant loss power
  kind: scalar
  unit: degC
  notes: Ambient plus loss power times \ThermalResistance in the first-order model.
- macro: \EquivalentSeriesStiffness
  latex: k_{\text{eq}}
  definition: equivalent stiffness of a compliant element and a strike plate acting in series, the reciprocal
    of the sum of their compliances
  kind: scalar
  unit: N/m
  notes: Same construction as the effective series stiffness k_eff proposed for 06_training, with a compliant
    element in place of the robot side.
- macro: \ErrorCovarianceDerivative
  latex: \dot{\mathbf{P}}
  definition: time derivative of the estimation error covariance, given by the Riccati or Lyapunov differential
    equation
  kind: matrix
- macro: \ErrorGrowthRate
  latex: r
  definition: maximum rate at which the true state can diverge from a stored estimate, the slope of a
    linear error-growth law
  kind: scalar
  unit: m/s
  notes: Unit given for a position belief; line 602 notes other beliefs grow in radians or newtons per
    second.
- macro: \EssentialMatrix
  latex: \mathbf{E}
  definition: three-by-three matrix relating corresponding normalized image points in two calibrated views
  kind: matrix
  aliases:
  - \FundamentalAndEssentialMatricesTwo
- macro: \EstimateEpoch
  latex: t_{\text{est}}
  definition: instant a published state estimate describes, which prediction may advance past the evidence
    epoch
  kind: scalar
  unit: s
  notes: Distinct from \EvidenceEpoch and \PublicationEpoch.
- macro: \EstimatedCleanActionChunk
  latex: \hat{\mathbf{A}}
  definition: estimate of the clean action chunk that the reverse process recovers from a noisy chunk
    and the predicted noise
  kind: matrix
  notes: Written with superscript 0, the clean step.
- macro: \EstimatedCoriolisMatrix
  latex: \hat{\mathbf{C}}
  definition: model estimate of the Coriolis and centrifugal matrix that computed torque control uses
  kind: matrix
  notes: Decorated form of \CoriolisCentrifugalMatrix.
- macro: \EstimatedDivergenceInstant
  latex: \hat{t}_{\text{div}}
  definition: 'estimate of the divergence instant: the first threshold crossing found by searching back
    from the takeover'
  kind: scalar
  unit: s
- macro: \EstimatedForceSensorBias
  latex: \hat{b}
  definition: estimator's estimate of the force-sensor bias
  kind: function
  unit: N
- macro: \EstimatedGravitationalTorque
  latex: \hat{\mathbf{g}}
  definition: model estimate of the gravitational joint torques that computed torque control uses
  kind: vector
  notes: Entries in N*m. Decorated form of \GravitationalTorqueVector.
- macro: \EstimatedGripContactForce
  latex: \hat{x}
  definition: estimator's estimate of the true normal contact force
  kind: function
  unit: N
- macro: \EstimatedInertiaMatrix
  latex: \hat{\mathbf{M}}
  definition: model estimate of the joint-space inertia matrix that computed torque control uses
  kind: matrix
  unit: kg*m^2
  notes: Decorated form of \GeneralizedInertiaMatrix.
- macro: \EstimatedPlantState
  latex: \hat{\mathbf{x}}
  definition: estimate of the mechanical plant state reconstructed from sensor observations
  kind: vector
  notes: Estimate of \MechanicalPlantState; its error covariance is \EstimationErrorCovariance.
- macro: \EstimatedPosition
  latex: \hat{\mathbf{p}}
  definition: estimate of a point's position that a filter propagates under its nominal model
  kind: vector
  unit: m
- macro: \EstimatedVelocity
  latex: \hat{\mathbf{v}}
  definition: estimate of a body's velocity that a filter propagates under its nominal model
  kind: vector
  unit: m/s
- macro: \EstimatedWindingTemperature
  latex: \hat{T}_{\text{wind}}
  definition: estimate of the motor winding temperature from the thermal model
  kind: scalar
  unit: degC
  notes: Estimate of \WindingTemperature.
- macro: \EstimationErrorCovariance
  latex: \mathbf{P}
  definition: covariance of the error between the true state and its estimate
  kind: matrix
  notes: Symmetric positive definite; evolves by the matrix Riccati equation.
- macro: \EstimatorDrawCount
  latex: N
  definition: number of independent draws or simulation runs a Monte Carlo or importance-sampling estimator
    averages
  kind: count
- macro: \EstimatorDrawStandardDeviation
  latex: \sigma
  definition: standard deviation of one draw of a Monte Carlo or importance-sampling estimator
  kind: scalar
  unit: dimensionless
- macro: \EstimatorState
  latex: \mathbf{x}
  definition: true value of the state vector a recursive estimator tracks, such as a track's position
    and velocity
  kind: vector
  notes: 'Not necessarily \MechanicalPlantState: a tracker''s state belongs to an obstacle.'
- macro: \EstimatorStateVector
  latex: \mathbf{x}
  definition: state vector an estimator reconstructs from measurements, such as a tracked object's position
    and velocity
  kind: vector
  notes: Shares its glyph with \MechanicalPlantState, the machine's own plant state.
- macro: \EstimatorStepIndex
  latex: k
  definition: index of one discrete step of a recursive estimator
  kind: index
  notes: In an out-of-sequence buffer, one IMU sample.
- macro: \EvaluatedExceedance
  latex: y
  definition: exceedance level at which a generalized Pareto distribution function is evaluated
  kind: scalar
  unit: varies
  notes: Units of the monitored performance metric (m for a distance overshoot).
- macro: \EvaluationPredicate
  latex: \phi
  definition: binary predicate that maps a realized trial trajectory to its task outcome, zero or one
  kind: function
- macro: \EvaluationTrialIndex
  latex: i
  definition: position of one trial within an evaluation campaign, counted from one, the index of per-trial
    outcomes and of sums over the campaign's trials
  kind: index
  notes: Matches the trial index already built into $\TrialControlStepCount$ ($N_{\text{steps}, i}$),
    so per-trial sums such as $\sum_{i=1}^{\TrialCount}$ read with one index. Not $\TrialIndex$ ($n$),
    which counts trials within a learning campaign.
- macro: \EventContrastThreshold
  latex: C_{\text{th}}
  definition: threshold on the change in logarithmic intensity at which an event-camera pixel emits an
    event
  kind: scalar
  unit: dimensionless
  notes: Shares its glyph with \StatorThermalCapacitance; the two never appear in one chapter section.
- macro: \EventPacket
  latex: e
  definition: 'packet an event-camera pixel emits when its log-intensity change crosses the contrast threshold:
    address, timestamp and polarity'
  kind: record
  notes: Indexed by event, $e_k$.
- macro: \EventPolarity
  latex: p
  definition: sign of an event camera event, plus one when radiance increased and minus one when it decreased
  kind: scalar
  unit: dimensionless
  notes: Indexed by event, $p_k$.
- macro: \EvidenceCaptureInstant
  latex: t_{\text{capture}}
  definition: instant at which the sensor evidence behind an observation or proposal was captured, on
    a monotonic clock
  kind: scalar
  unit: s
  notes: Observation age and proposal validity are measured from it.
- macro: \EvidenceEpoch
  latex: t_0
  definition: capture instant of the most recent sensor measurement that constrained a stored belief
  kind: scalar
  unit: s
  notes: Republishing or predicting never advances it. For a belief built from one observation it equals
    \AcquisitionEpoch.
- macro: \EvidenceHorizon
  latex: \tau_{\text{ev}}
  definition: time for which a target estimate stays within its task tolerance without fresh evidence
  kind: scalar
  unit: s
  notes: $\sqrt{2(r_{\text{tol}} - e_0)/a_{\text{slip}}}$ for a target that may accelerate; a chunk must
    be replaced inside it.
- macro: \ExactFailureLowerLimit
  latex: p_{L}
  definition: Clopper-Pearson exact lower confidence limit on the per-trial failure probability, from
    inverting the binomial distribution of the observed failure count
  kind: scalar
  unit: dimensionless
  notes: Zero when no failure is observed. Pairs with \ExactFailureUpperLimit.
- macro: \ExactFailureUpperLimit
  latex: p_{U}
  definition: Clopper-Pearson exact upper confidence limit on the per-trial failure probability, from
    inverting the binomial distribution of the observed failure count
  kind: scalar
  unit: dimensionless
  notes: At zero failures in n trials the one-sided bound is $1-\alpha^{1/n}\approx -\ln\alpha/n$, the
    rule of three. Not \DamageProbabilityUpperBound, which shares the glyph.
- macro: \ExceedanceSampleSet
  latex: \mathcal{Y}_u
  definition: set of observed exceedances over a threshold, the sample a generalized Pareto fit uses
  kind: set
- macro: \ExcessForcePenaltyWeight
  latex: \lambda_f
  definition: weight that converts contact force above the tripwire into a reward penalty, in reward per
    newton
  kind: scalar
  unit: 1/N
- macro: \ExecutedActionStepCount
  latex: T_a
  definition: number of steps of a predicted action chunk executed before the policy replans, the executed
    prefix
  kind: count
  notes: At most \ActionChunkHorizon. Diffusion Policy writes it $T_a$.
- macro: \ExecutionHorizon
  latex: H_{\text{exec}}
  definition: number of leading steps of each predicted action chunk the controller executes before the
    next chunk replaces it, the execution prefix
  kind: count
  notes: At most \ActionChunkHorizon. Not the chunk lease, which is a time.
- macro: \ExpertDiscountedStateVisitationDistribution
  latex: d^{\pi^*}
  definition: normalized discounted distribution of states the expert demonstrator policy visits
  kind: distribution
  notes: The expert's instance of $\DiscountedStateVisitationDistribution$, the distribution under which
    logged demonstrations are scored.
- macro: \ExpertStateVisitationDistribution
  latex: p^{\pi^*}
  definition: distribution of states the expert demonstrator visits, the expected fraction of time steps
    its demonstrations spend in each
  kind: distribution
  notes: The occupancy behavior cloning weights its loss by. Not $\ReferenceStateDistribution$ ($d_{\pi^*}$,
    agentic) and not $\LearnerStateVisitationDistribution$.
- macro: \ExploratoryStateVisitationDistribution
  latex: p^{\pi_{\text{expl}}}
  definition: distribution of states visited by an exploratory collection policy that deliberately seeks
    out uncovered regions
  kind: distribution
  notes: Contrasted with $\TeleoperationStateVisitationDistribution$ in a coverage comparison.
- macro: \ExponentialStabilityConstant
  latex: k
  definition: positive constant in the quadratic bounds that certify exponential stability, written with
    an index 1 to 3
  kind: scalar
  unit: varies
  notes: $\ExponentialStabilityConstant_1$ and $\ExponentialStabilityConstant_2$ bound the Lyapunov function,
    $\ExponentialStabilityConstant_3$ its decrease; units those of the Lyapunov function per squared state
    norm.
- macro: \ExposureDuration
  latex: t_{\text{exp}}
  definition: integration time of one camera frame
  kind: scalar
  unit: s
  notes: The frame timestamp refers to the exposure midpoint, half this duration after the trigger.
- macro: \ExposureMidpointTime
  latex: t_{\text{mid}}
  definition: time at the midpoint of a camera frame's optical exposure, the instant its image represents
  kind: scalar
  unit: s
- macro: \ExposureMotionDisplacement
  latex: \Delta x_{\text{motion}}
  definition: bound on how far a camera's optical center moves during one exposure, from linear and rotational
    motion
  kind: scalar
  unit: m
  notes: 'One symbol: the Delta site and the x label site both take this macro.'
- macro: \ExposureStartTime
  latex: t_{\text{start}}
  definition: time at which a camera latches its trigger and begins exposing a frame
  kind: scalar
  unit: s
- macro: \ExposureTravelDistance
  latex: \Delta x
  definition: distance the machine travels during one camera exposure, its speed times the exposure duration
  kind: scalar
  unit: m
  notes: Sets the motion blur of a frame; $\Delta x = \SpeedAtDetection\,\ExposureDuration$. Not the vector
    image-row displacement \RollingShutterDistortion. The LaTeX spans the Delta and the x.
- macro: \ExtendedClassKInfinityFamily
  latex: \mathcal{K}_\infty
  definition: class of extended class-K functions that are unbounded, from which the barrier decay function
    is chosen
  kind: set
  notes: Names the family; its member here is \ClassKFunction.
- macro: \ExternalContactTorque
  latex: \boldsymbol{\tau}_{\text{ext}}
  definition: joint torques produced by external contact forces acting on the manipulator
  kind: vector
  unit: N*m
- macro: \ExternalDisturbanceForce
  latex: d
  definition: external disturbance force and unmodeled friction acting on the plant, as a function of
    time
  kind: function
  unit: N
  notes: Bounded by \DisturbanceForceBound. Not the differential d of $dt$, which is exempt.
- macro: \ExternalDisturbanceLoad
  latex: \mathbf{d}_{\text{ext}}
  definition: constant external load acting on the controlled joints, such as gravity sag, cable friction
    or a payload offset
  kind: vector
  notes: Under PD control it leaves the steady-state error \SteadyStateTrackingError; integral action
    cancels it.
- macro: \ExternalJointTorque
  latex: \tau_{\text{ext}}
  definition: external torque applied at a joint's output by the environment
  kind: scalar
  unit: N*m
- macro: \ExternalObjectWrench
  latex: \mathbf{w}_{\text{ext}}
  definition: external wrench acting on a grasped object, such as its weight and inertial loads, that
    the contact forces must balance
  kind: vector
  unit: varies
  notes: Force components in N, moment components in N*m.
- macro: \ExternalWrench
  latex: \mathbf{F}_{\text{ext}}
  definition: external force and moment (wrench) the environment applies at the end effector
  kind: vector
  unit: varies
  notes: Newtons for the force components and newton-meters for the moments. Maps into joint torques through
    the transposed manipulator Jacobian. Not \ContactPointForce.
- macro: \ExtrinsicCalibrationCovariance
  latex: \boldsymbol{\Sigma}_{\text{ext}}
  definition: covariance of a sensor's calibrated mounting extrinsic
  kind: matrix
  unit: m^2
- macro: \ExtrinsicCovarianceJacobian
  latex: \mathbf{J}_{\text{ext}}
  definition: Jacobian that projects the extrinsic covariance into world coordinates
  kind: matrix
- macro: \ExtrinsicLateralError
  latex: \Delta y
  definition: transverse position error an extrinsic orientation error induces at a given range
  kind: scalar
  unit: m
  notes: 'One symbol: the Delta site and the y site both take this macro.'
- macro: \ExtrinsicMisalignmentAngle
  latex: \theta_{\text{ext}}
  definition: angular misalignment of a sensor's extrinsic calibration relative to its true mounting
  kind: scalar
  unit: rad
- macro: \EyeInHandCameraMotion
  latex: \mathbf{B}
  definition: relative camera motion between two eye-in-hand calibration poses, from target unprojection
  kind: matrix
- macro: \EyeInHandFlangeMotion
  latex: \mathbf{A}
  definition: relative flange motion between two eye-in-hand calibration poses, from forward kinematics
  kind: matrix
- macro: \EyeInHandUnknownTransform
  latex: \mathbf{X}
  definition: unknown camera-to-flange transform that eye-in-hand calibration solves for in the hand-eye
    equation
  kind: matrix
- macro: \EyeToHandCameraPose
  latex: \mathbf{B}'
  definition: absolute transform mapping camera coordinates into the target frame at one eye-to-hand calibration
    pose
  kind: matrix
- macro: \EyeToHandFlangePose
  latex: \mathbf{A}'
  definition: absolute transform mapping base coordinates into the flange frame at one eye-to-hand calibration
    pose
  kind: matrix
- macro: \EyeToHandTargetTransform
  latex: \mathbf{Z}
  definition: unknown transform of the calibration target in the flange frame that eye-to-hand calibration
    solves for alongside the camera
  kind: matrix
- macro: \EyeToHandUnknownTransform
  latex: \mathbf{X}'
  definition: unknown camera-to-base transform that eye-to-hand calibration solves for
  kind: matrix
- macro: \FailureFlagLatency
  latex: \delta_{\text{flag}}
  definition: time from a physical failure to a fault flag the enforcer can read, the hardware detection
    latency
  kind: scalar
  unit: s
  notes: Must be bounded by the detector qualification; adds to the local monitor response in the blind-travel
    budget.
- macro: \FailureMarginFunction
  latex: l
  definition: Lipschitz function of the state that is negative inside the failure or collision region
    and nonnegative in the safe set
  kind: function
- macro: \FailureRegion
  latex: F
  definition: subset of scenario parameters whose outcome violates the safety requirement
  kind: set
  notes: italic capital for the failure set, as the rare-event literature writes it.
  render_exception: italic capital F for the failure set, as the rare-event and importance-sampling literature
    writes it
- macro: \FailureSet
  latex: \mathcal{F}_{\text{fail}}
  definition: set of states in failure or collision, the zero-sublevel set of the failure margin function
  kind: set
- macro: \FailureUpperConfidenceLimit
  latex: p_{\text{fail, upper}}
  definition: one-sided upper confidence limit on the per-trial failure probability from a finite campaign
  kind: scalar
  unit: dimensionless
- macro: \FallbackDeadline
  latex: T_{\text{deadline,fallback}}
  definition: latest permissible wait after a handover request before the fallback must begin, from the
    stopping inequality at the current speed and clearance
  kind: scalar
  unit: s
  notes: 'Clips the handover timeout: $\HandoverTimeout = \max(0, \min(T_{\text{config}}, T_{\text{deadline,fallback}}))$.
    Not \CompletionDeadline.'
- macro: \FallbackHold
  latex: T_{\text{hold}}
  definition: optional hold or fault-confirmation interval before the stop command reaches the drive
  kind: scalar
  unit: s
  notes: Zero when the selected stop path has no such interval; one term of \PrebrakeDelay.
- macro: \FalsificationInitialStateSet
  latex: \mathcal{X}_0
  definition: set of initial plant states a falsification search may choose from
  kind: set
- macro: \FatigueLifeCycleCount
  latex: N
  definition: number of load cycles a component survives at one load level before fatigue failure, from
    its fatigue data
  kind: count
  notes: Indexed by load level $i$.
- macro: \FaultContainmentLatency
  latex: \Delta t_{\text{bounded}}
  definition: measured time from fault injection to the plant's entry into its safe bounded regime
  kind: scalar
  unit: s
- macro: \FaultDetectionLatency
  latex: \Delta t_{\text{det}}
  definition: measured time from fault injection to the detection flag in a fault-injection trial
  kind: scalar
  unit: s
- macro: \FaultDomainIsolation
  latex: \mathcal{F}
  definition: 'fault-domain isolation of a signal handoff: whether a fault on one side can propagate across
    it, one of the five handoff limits'
  kind: record
  notes: A qualitative limit recorded per handoff (for example a private bus, separate oscillator and
    isolated rail). Not a reference frame such as \WorldReferenceFrame.
- macro: \FaultInjectionDuration
  latex: \Delta t_{\text{duration}}
  definition: length of time an injected fault is held, such as a drive-bus droop
  kind: scalar
  unit: s
- macro: \FaultStartTimestamp
  latex: t_{\text{fault\_start}}
  definition: reference-clock timestamp recorded when a fault is injected, the origin of a trial's detection
    and takeover times
  kind: scalar
  unit: s
- macro: \FaultTakeoverLatency
  latex: \Delta t_{\text{takeover}}
  definition: measured time from fault injection to hardware preemption of the motor driver in a fault-injection
    trial
  kind: scalar
  unit: s
- macro: \FaultTakeoverTimestamp
  latex: t_{\text{takeover}}
  definition: reference-clock timestamp at which the hardware multiplexer preempts the motor driver in
    a fault trial
  kind: scalar
  unit: s
- macro: \FeasibleTrajectoryProjection
  latex: \Pi_{\mathcal{K}}
  definition: operator that maps a learned trajectory proposal to the nearest trajectory in the feasible
    set, under a weighted tracking and jerk cost
  kind: operator
  notes: Its target set is \FeasibleTrajectorySet; it runs on the proposal side, upstream of admission.
- macro: \FeasibleTrajectorySet
  latex: \mathcal{K}
  definition: set of joint trajectories that satisfy the boundary conditions, collision, speed, torque
    and stopping constraints of a projection
  kind: set
  notes: Target set of \FeasibleTrajectoryProjection.
- macro: \FeatureCellVector
  latex: \mathbf{f}_{u, v}
  definition: feature vector a vision backbone computes at one cell of its feature map, indexed by the
    cell's pixel coordinates
  kind: vector
  notes: Stands for a whole camera ray whose metric depth is unknown.
- macro: \FeatureChannelCount
  latex: C
  definition: number of channels of each feature vector in a vision backbone's output feature map
  kind: count
- macro: \FeatureViewingDistance
  latex: r
  definition: distance from a rotating sensor head's axis to an observed feature
  kind: scalar
  unit: m
- macro: \FeedforwardJointTorque
  latex: \boldsymbol{\tau}_{\text{ff}}
  definition: vector of joint torques the dynamics model predicts a reference trajectory needs, sent ahead
    of feedback
  kind: vector
  unit: N*m
- macro: \FeedthroughMatrix
  latex: \mathbf{D}
  definition: feedthrough matrix of a linear state-space model, mapping the control input directly to
    the output
  kind: matrix
  notes: Zero for strictly proper plants. Companion of \StateSpaceSystemMatrix, \StateSpaceInputMatrix
    and \MeasurementMatrix. Not \VirtualDampingMatrix.
- macro: \FieldbusCycleTime
  latex: T_{\text{cycle}}
  definition: period of one fieldbus communication cycle
  kind: scalar
  unit: s
  notes: Not the teleoperation motion-cycle period of 05_data.
- macro: \FilmEncounterRate
  latex: \lambda_{\text{film}}
  definition: rate at which a machine encounters fluid films along its transit routes
  kind: scalar
  unit: 1/h
  notes: Plays the role of the hazardous proposal rate when the film detector is the shield; estimated
    from maintenance logs.
- macro: \FilterSolveBudget
  latex: T_{\text{budget}}
  definition: execution time allocated to the safety filter solver within one loop period
  kind: scalar
  unit: s
  notes: Must be shorter than the loop period.
- macro: \FilterSolveTime
  latex: T_{\text{solve}}
  definition: execution time of the safety filter solver or projection in one control tick
  kind: scalar
  unit: s
  notes: Part of \EnforcerComputeTime; bounded by \FilterSolveBudget.
- macro: \FilterTapCount
  latex: N
  definition: number of taps (coefficients) of a finite impulse response filter
  kind: count
  notes: A moving average of this many taps delays its signal by $(\FilterTapCount-1)/2$ samples.
- macro: \FilteredScreenSpaceCovariance
  latex: \boldsymbol{\Sigma}_{2D}'
  definition: screen-space covariance of a projected Gaussian after an isotropic low-pass variance is
    added to prevent aliasing
  kind: matrix
  unit: pixels^2
  notes: \ScreenSpaceCovariance plus \AntialiasingFilterVariance times the identity.
- macro: \FinalBusVoltage
  latex: V_{\text{final}}
  definition: DC bus voltage at the end of a regenerative stop when bus capacitance alone absorbs the
    returned energy
  kind: scalar
  unit: V
  notes: 'A screening endpoint: if it exceeds a component rating the stop needs another energy path.'
- macro: \FinalWatchdogToken
  latex: T_{\text{final}}
  definition: watchdog token after the last checkpoint stage of a tick, which must match its expected
    value before the watchdog is serviced
  kind: record
- macro: \FingerNormalForce
  latex: f_n
  definition: normal force one finger of a grasp presses against the object at its contact
  kind: scalar
  unit: N
  notes: Not \NormalContactForce in LaTeX only; a grasp-specific use whose glyph keeps the chapter rendering.
- macro: \FingerTangentialForce
  latex: \mathbf{f}_t
  definition: tangential friction force one finger of a grasp carries at its contact, bounded by the friction
    coefficient times the normal force
  kind: vector
  unit: N
- macro: \FiniteSampleGeneralizationBound
  latex: \delta_N
  definition: error term of the dataset-aggregation guarantee that covers finite-sample generalization
    and the selection of one policy from the sequence
  kind: scalar
  unit: dimensionless
  notes: Subscript N is the number of aggregation rounds, part of the symbol.
- macro: \FiniteTimeHorizon
  latex: T
  definition: length of the finite time window over which an optimization, rollout, test or temporal-logic
