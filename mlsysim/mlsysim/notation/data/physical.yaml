  kind: scalar
  unit: dimensionless
  notes: The failure-probability counterpart of \HypothesizedAcceptanceProbability; sets the increments
    of \SequentialLogLikelihoodRatio.
- macro: \ImageChannelCount
  latex: C
  definition: number of color channels of a camera image, three for RGB
  kind: count
- macro: \ImageEpipole
  latex: \mathbf{e}
  definition: 'epipole of one view: the image of the other camera''s optical center, where the baseline
    meets that image plane'
  kind: vector
  unit: pixels
  notes: Homogeneous pixel coordinates, indexed by view. Not \EntityEmbedding, which shares the glyph
    in another volume.
- macro: \ImagePlanePixelCoordinates
  latex: \mathbf{u}_{\text{px}}
  definition: pixel coordinates of a point in the image plane
  kind: vector
  unit: pixels
- macro: \ImaginaryUnit
  latex: j
  definition: imaginary unit, the square root of minus one
  kind: scalar
  unit: dimensionless
  notes: Engineering convention j rather than i.
- macro: \ImitationLearnedPolicy
  latex: \hat{\pi}
  definition: policy learned by imitation from expert demonstrations or expert-labeled states, compared
