  kind: scalar
  unit: s
  aliases:
  - \IntentleaseExpiryIntentexp
- macro: \IntentProposalPeriod
  latex: T_{\text{period}}
  definition: time between successive target proposals of the intent model
  kind: scalar
  unit: s
  notes: Not \ActuatorCyclePeriod, which shares the glyph.
- macro: \InterFeedInterval
