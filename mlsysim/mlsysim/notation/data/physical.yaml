  kind: distribution
- macro: \FleetRobotCount
  latex: N_{\text{fleet}}
  definition: number of robots in a deployed fleet
  kind: count
  notes: Not \FleetAcceleratorCount (accelerators in a datacenter fleet), which renders the same.
- macro: \FloatingBaseAccelerations
  latex: \ddot{\mathbf{q}}_b
  definition: accelerations of the unactuated floating base, the base block of the generalized accelerations
  kind: vector
- macro: \FloatingBaseBiasForces
  latex: \mathbf{h}_b
