  kind: scalar
  unit: s
  notes: The window is $[0, T]$. Not \Time, the wall-clock time to complete a unit of work.
- macro: \FirstErrorStepIndex
  latex: k
  definition: control step at which an imitating policy first takes an action different from the expert's,
