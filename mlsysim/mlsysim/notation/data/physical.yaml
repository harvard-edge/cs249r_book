    and \Reward.
  aliases:
  - \Radius
- macro: \WindingTemperature
  latex: T_{\text{winding}}
  definition: temperature of the motor winding copper
  kind: scalar
  unit: degC
  aliases:
  - \WindingAndAmbientTemperature
- macro: \WorldReferenceFrame
  latex: \mathcal{F}_W
  definition: fixed coordinate frame attached to the world
  kind: set
  aliases:
  - \CoordinateReferenceFramesW
- macro: \YoshikawaManipulability
  latex: w
  definition: measure of distance from kinematic singularity, the square root of the determinant of J
    times J transpose
  kind: function
  unit: dimensionless
  notes: Product of the Jacobian singular values; vanishes at singular configurations. Its unit depends
    on the task coordinates.
- macro: \ZeroFailureTrialCount
  latex: n
  definition: number of consecutive failure-free trials needed to demonstrate a target success probability
  kind: count
  aliases:
  - \ZerofailureTrialCount
- macro: \ZeroMomentPoint
  latex: \mathbf{p}_{\text{ZMP}}
  definition: point on the ground where the net horizontal tipping moment of the contact forces vanishes
  kind: vector
