# Notation registry: physical
# Physical AI: plant state, kinematics, contact, control, perception, embodied learning, real-time silicon.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \ActVariationalObjective
  latex: \mathcal{L}_{\text{ACT}}(\theta, \phi)
  definition: ACT Variational Objective
  kind: function
- macro: \ActionChunk
  latex: \mathbf{A}
  definition: Action chunk $\mathbf{A}_t$, $\mathbf{A}_{t:t+H}$, and its denoising iterate $\mathbf{A}_t^k$
  kind: matrix
- macro: \ActionChunkHorizon
  latex: H
  definition: Action Chunk Horizon
  kind: scalar
  unit: Time steps
  notes: Number of contiguous future action steps generated in a single policy forward pass ($H=16$ on
    the mobile manipulator; 16 to 64 steps in the literature).
- macro: \ActionChunkTrajectory
  latex: \mathbf{A}_{t:t+H}
  definition: Action Chunk Trajectory
  kind: matrix
  unit: Tensor
  notes: Contiguous horizon sequence $[\mathbf{a}_t, \mathbf{a}_{t+1}, \dots, \mathbf{a}_{t+H-1}] \in
    \mathbb{R}^{H \times d_a}$ predicted in a single forward pass.
- macro: \ActionDimension
  latex: d_a
  definition: Action Dimension
  kind: scalar
- macro: \ActionExecutionRate
  latex: f_{\text{exec}}
  definition: Action Execution Rate
  kind: scalar
  unit: $\text{Hz}$
  notes: Temporal consumption rate of chunked waypoints along the planned trajectory ($100\text{ Hz}$
    to $1\text{ kHz}$).
- macro: \ActuationSelectionMatrix
  latex: \mathbf{S}
  definition: Actuation Selection Matrix
  kind: matrix
  unit: Matrix
  notes: Matrix $[\mathbf{0}_{n \times 6}, \mathbf{I}_{n \times n}]$ projecting generalized forces onto
    actuated joints in floating-base systems.
- macro: \ActuatorDutyCycle
  latex: D_{\text{cycle}}
  definition: Actuator Duty Cycle
  kind: scalar
  unit: $[0, 1]$
  notes: Ratio of active pulse duration to cycle period ($t_{\text{on}} / (t_{\text{on}} + t_{\text{off}})$)
    preventing thermal runaway.
- macro: \ActuatorResponseTime
  latex: T_{\text{act}}
  definition: Actuator Response Time
  kind: scalar
  unit: $\text{ms}$
  notes: Time from a delivered stop command to retarding force, including gate-drive and current rise,
    which enters $\tau_{\text{delay}}$.
- macro: \ActuatorTorqueVector
  latex: \boldsymbol{\tau} \in \mathbb{R}^n
  definition: Actuator Torque Vector
  kind: vector
  unit: \text{N}\cdot\text{m} or \text{N}
  notes: Generalized forces and torques delivered by actuators at mechanical joints.
- macro: \AdjointRepresentation
  latex: \mathbf{Ad}_T
  definition: Adjoint Representation
  kind: matrix
  unit: Matrix
  notes: $6 \times 6$ transformation matrix mapping spatial twists and wrenches between coordinate frames.
- macro: \AllowableCollisionEnergy
  latex: E_{k, \text{allow}}
  definition: Allowable Collision Energy
  kind: scalar
  unit: $\text{Joules (J)}$
  notes: Statutory kinetic energy limit ($\frac{1}{2} m_{\text{eff}} v^2 \le E_{k, \text{allow}}$) for
    transient collaborative contact.
- macro: \AmbientTemperature
  latex: T_{\text{amb}}
  definition: Ambient Temperature
  kind: scalar
  unit: degC
  aliases:
  - \WindingAndAmbientTemperatureTwo
- macro: \AngularVelocityAcceleration
  latex: \boldsymbol{\omega}
  definition: Angular Velocity & Acceleration
  kind: vector
- macro: \ArticulatedInertiaMatrix
  latex: \mathbf{M}
  definition: Articulated inertia matrix $\mathbf{M}(\mathbf{q}) \in \mathbb{R}^{n \times n}$
  kind: matrix
  unit: Mass ($m, m_{\text{eff}}$), memory footprint ($M_{\text{weights}}, M_{\text{KV}}$), or fleet size
    ($N_{\text{fleet}}$)
  notes: Articulated generalized mass/inertia uses bold matrix $\mathbf{M}(\mathbf{q})$; physical body
    mass is lowercase italic $m$ ($\text{kg}$); effective impact mass is $m_{\text{eff}}$; hardware memory
    storage uses capital $M$ with descriptive subscript (in bytes); robot fleet size uses $N_{\text{fleet}}$
    or $M_{\text{fleet}}$.
- macro: \AssuranceClaim
  latex: C
  definition: Assurance Claim
  kind: scalar
  unit: Proposition
  notes: Top-level safety claim of an assurance argument, whose confidence $\Pr(C)$ is the product over
    conjunctive premises or one minus the product of leg failures for multi-legged arguments.
- macro: \BackemfVoltageBemf
  latex: e_{\text{bemf}}
  definition: Back-EMF Voltage
  kind: scalar
  unit: $\text{V}$
  notes: Opposing voltage $e_{\text{bemf}} = K_e \omega_m$ developed across stator coils by rotor rotation.
- macro: \BarrierConstraintMatrix
  latex: \mathbf{A}_{\text{cbf}}
  definition: Barrier Constraint Rows
  kind: matrix
  aliases:
  - \BarrierConstraintRowsCbf
- macro: \BarrierConstraintVector
  latex: \mathbf{b}_{\text{cbf}}
  definition: Barrier Constraint Rows
  kind: vector
  aliases:
  - \BarrierConstraintRowsCbfTwo
- macro: \BarrierFunction
  latex: h
  definition: Barrier Function
  kind: scalar
  unit: m or rad (margin units)
  notes: Scalar control-barrier certificate $h$ written as a function head, e.g. $h(\mathbf{x})$, $\dot{h}$,
    $L_{\mathbf{f}} h$, $h(\theta_{\text{clear}}, \omega)$. The safe set is its 0-superlevel set. Use
    this macro where $h$ takes arguments or derivatives; \ControlBarrierFunction is the fixed form $h(\mathbf{x})$.
- macro: \BarrierRelativeDegree
  latex: r
  definition: Barrier Relative Degree
  kind: scalar
  unit: Integer
  notes: Number of differentiations required before control input $\mathbf{u}$ appears ($L_{\mathbf{g}}
    L_{\mathbf{f}}^{r-1} h \neq 0$).
- macro: \BehaviorCloningHorizon
  latex: S
  definition: Behavioral-Cloning Horizon
  kind: scalar
  unit: Control steps
  notes: Episode length in control steps over which imitation error compounds, as in the $\mathcal{O}(S^2\epsilon)$
    bound. Not the action-chunk horizon $H$ (\Horizon) and not a duration $T$; written $S$ throughout
    the book.
- macro: \BeliefInvalidationHorizon
  latex: T_{\text{inv}}
  definition: Belief Invalidation Horizon
  kind: scalar
- macro: \BlendingTransitionWindow
  latex: \tau_{\text{blend}}
  definition: Blending Transition Window
  kind: scalar
  unit: $\text{s}$
  notes: Duration of bumpless transfer; bounded by $\tau_{\text{blend}, \min} = 1.875 \lVert \Delta \mathbf{u}
    \rVert / j_{\text{allowable}}$.
- macro: \BodyReferenceFrame
  latex: \mathcal{F}_B
  definition: Body Reference Frame
  kind: set
  aliases:
  - \CoordinateReferenceFramesB
- macro: \BumplessTransferBlend
  latex: \alpha(\hat{t})
  definition: Bumpless Transfer Blend
  kind: scalar
  unit: $[0, 1]$
  notes: $C^2$ quintic polynomial $6\hat{t}^5 - 15\hat{t}^4 + 10\hat{t}^3$ ramping between prior and candidate
    controllers.
- macro: \BumplessTransferBlendingFunctionAlphaInZero
  latex: \alpha
  definition: Bumpless transfer blending function $\alpha(\hat{t}) \in [0, 1]$
  kind: scalar
- macro: \CameraIntrinsicCalibrationMatrix
  latex: \mathbf{K}
  definition: Camera intrinsic calibration matrix $\mathbf{K} \in \mathbb{R}^{3 \times 3}$
  kind: matrix
  unit: Contact stiffness ($k_{\text{contact}}$), control gains ($K_p, K_d$), motor constants ($K_t, K_e$),
    ensembling window $K$, or diffusion step $k$
  notes: Camera intrinsics use bold matrix $\mathbf{K}$; contact stiffness is lowercase scalar $k$ or
    $k_{\text{contact}}$ ($\text{N/m}$); feedback control gains use capitalized scalars $K_p, K_d$; motor
    torque/back-EMF constants use $K_t, K_e$; temporal ensembling window length uses integer $K$; diffusion
    noise steps use lowercase index $k$.
- macro: \CameraframeThreedCoordinate
  latex: \mathbf{p}_c
  definition: Camera-Frame 3D Coordinate
  kind: vector
- macro: \CartesianPixelCoordinates
  latex: '[u, v]^\top'
  definition: Cartesian Pixel Coordinates
  kind: scalar
  unit: Pixels
  notes: Discrete sensor pixel coordinates.
- macro: \CartesianThreedPosition
  latex: \mathbf{p}
  definition: Cartesian 3D Position
  kind: vector
- macro: \CenterOfMass
  latex: \mathbf{c}
  definition: Center of Mass (CoM)
  kind: vector
  unit: $\text{m}$
  notes: Spatial coordinates of the total articulated body mass centroid ($\mathbf{c} = \frac{1}{m} \sum
    m_i \mathbf{p}_i$).
- macro: \CentroidalAngularMomentum
  latex: \mathbf{h}_{\text{ang}} \in \mathbb{R}^3
  definition: Centroidal Angular Momentum
  kind: vector
  unit: $\text{kg}\cdot\text{m}^2/\text{s}$
  notes: 'Angular momentum about CoM: $\dot{\mathbf{h}}_{\text{ang}} = \sum (\mathbf{p}_k - \mathbf{c})
    \times \mathbf{f}_k + \boldsymbol{\tau}_k$.'
- macro: \CentroidalLinearMomentum
  latex: \mathbf{h}_{\text{lin}} \in \mathbb{R}^3
  definition: Centroidal Linear Momentum
  kind: vector
  unit: $\text{kg}\cdot\text{m/s}$
  notes: Total plant linear momentum ($\mathbf{h}_{\text{lin}} = m \dot{\mathbf{c}}$), governed by $\dot{\mathbf{h}}_{\text{lin}}
    = \sum \mathbf{f}_k + m \mathbf{g}$.
- macro: \CertifiedControlAction
  latex: \mathbf{u}^*
  definition: Certified Control Action
  kind: vector
  unit: $\text{N}\cdot\text{m}$ / $\text{rad}$
  notes: Privileged, safety-filtered control command resolved by the real-time active-set CBF-QP.
- macro: \ChunkLease
  latex: T_{\text{lease}}
  definition: Chunk Lease
  kind: scalar
- macro: \ChunkRenewalPeriod
  latex: T_{\text{chunk}}
  definition: Chunk Renewal Period
  kind: scalar
- macro: \ClassKFunction
  latex: \kappa
  definition: Class-K Function
  kind: scalar
  unit: Same as $\dot{h}$
  notes: Extended class-$\mathcal{K}$ function written as a function head in the barrier condition $\dot{h}
    \ge -\kappa(h)$; the linear choice is $\kappa(h) = \gamma_{\text{cbf}} h$. \ClassRateFunction is the
    standalone label $\kappa(\cdot)$.
- macro: \ClassRateFunction
  latex: \kappa(\cdot)
  definition: Class-$\mathcal{K}$ Rate Function
  kind: scalar
- macro: \ClearDistance
  latex: D_{\text{clear}}
  definition: Clear Distance
  kind: scalar
  unit: $\text{m}$
  notes: Clear distance from the machine to the boundary it must not cross; the subscript keeps it distinct
    from dataset size $D$.
- macro: \ClockOffset
  latex: \theta_{\text{offset}}
  definition: Clock Offset
  kind: scalar
- macro: \ClockSynchronizationSkew
  latex: \delta_{\text{skew}}
  definition: Clock Synchronization Skew
  kind: scalar
  unit: $\text{ppm}, \mu\text{s/s}$
  notes: Hardware crystal drift between the application processor and safety microcontroller clocks.
- macro: \CoefficientOfRestitution
  latex: e
  definition: Coefficient of Restitution
  kind: scalar
- macro: \CognitivePolicyAction
  latex: \mathbf{a}_t
  definition: Cognitive Policy Action
  kind: vector
  unit: Normalized
  notes: Unprivileged action emitted by neural policy $\pi_\theta$ (normalized joint delta, target pose,
    or gripper command).
- macro: \CommandTransportTimeBus
  latex: T_{\text{bus}}
  definition: Command Transport Time
  kind: scalar
  unit: $\text{ms}$
  notes: Fieldbus delivery time from the permission path to the drive, which enters $\tau_{\text{delay}}$.
- macro: \CommandedJointTorque
  latex: \tau
  definition: Commanded Joint Torque (Single Joint)
  kind: scalar
  unit: $\text{N}\cdot\text{m}$
  notes: Scalar torque commanded at one joint in single-joint derivations such as the kinetic barrier
    ($J\dot{\omega} = \tau + \tau_{\text{bias}}$). Bounds and disturbances keep subscripts ($\tau_{\max}$,
    $\tau_{\text{bias}}$); unsubscripted scalar $\tau$ means this torque only where the derivation states
    it.
- macro: \CommitmentInstant
  latex: t_{\text{commit}}
  definition: Commitment Instant
  kind: scalar
- macro: \CompoundingCovariateDrift
  latex: \mathcal{O}(T^2 \epsilon)
  definition: Compounding Covariate Drift
  kind: set
  unit: Error bound
  notes: Quadratic compounding trajectory drift under open-loop behavioral cloning rollouts of horizon
    $T$.
- macro: \ConformalMiscoverageRate
  latex: \epsilon
  definition: Conformal Miscoverage Rate
  kind: scalar
  unit: Probability
  notes: Allowed probability that the conformal prediction set misses the true referent; coverage is at
    least $1-\epsilon$.
- macro: \ConformalPredictionSet
  latex: \mathcal{C}
  definition: Conformal Prediction Set
  kind: set
  unit: Set of candidates
  notes: Calibrated set of referent candidates whose score cannot be excluded at miscoverage rate $\epsilon$;
    a singleton admits the referent, a larger set refuses. Shares the glyph of the safe set \ForwardinvariantSafeSet;
    the two never appear in the same derivation.
- macro: \ContactForceVectorK
  latex: \mathbf{f}_k
  definition: Contact Force Vector
  kind: vector
  unit: $\text{N}$
  notes: Physical contact force exerted by environment on contact patch $k$ ($\mathbf{f}_k = [\mathbf{f}_{k,
    \parallel}^\top, f_{k, \perp}]^\top$).
- macro: \ContactPointJacobianK
  latex: \mathbf{J}_k(\mathbf{q})
  definition: Contact Point Jacobian
  kind: matrix
  unit: Mixed
  notes: 'Mapping joint velocities to contact patch Cartesian linear velocity: $\dot{\mathbf{p}}_k = \mathbf{J}_k(\mathbf{q})
    \dot{\mathbf{q}}$.'
- macro: \ContactStiffness
  latex: k_{\text{contact}}
  definition: Contact Stiffness
  kind: scalar
- macro: \ContinuousCurrent
  latex: I_{\text{cont}}
  definition: Continuous Motor Current
  kind: scalar
  unit: A
  aliases:
  - \ContinuousPeakCurrent
- macro: \ContinuousPeakTorque
  latex: \tau_{\text{peak}}
  definition: Continuous / Peak Torque
  kind: scalar
  unit: $\text{N}\cdot\text{m}$
  notes: Thermally continuous holding torque and transient peak acceleration torque.
- macro: \ControlAffineDriftField
  latex: \mathbf{f}(\mathbf{x})
  definition: Control-Affine Drift and Input Fields
  kind: vector
- macro: \ControlAffineInputField
  latex: \mathbf{g}(\mathbf{x})
  definition: Control-Affine Drift and Input Fields
  kind: vector
- macro: \ControlBarrierFunction
  latex: h(\mathbf{x})
  definition: Control Barrier Function (CBF)
  kind: scalar
  unit: Scalar
  notes: Continuously differentiable function whose superlevel set defines forward-invariant set $\mathcal{C}$.
- macro: \ControlSetpointJerk
  latex: \mathbf{j}(t)
  definition: Control Setpoint Jerk
  kind: vector
  unit: $\text{m/s}^3, \text{N}\cdot\text{m/s}$
  notes: Time derivative of commanded plant acceleration or actuator torque during mode transitions.
- macro: \ControllabilityMatrix
  latex: \mathbf{C}_{\text{ctrb}}
  definition: Controllability Matrix
  kind: matrix
  unit: Mixed
  notes: Kalman block matrix formed from the input matrix and its products with powers of the system matrix;
    full row rank characterizes unconstrained LTI controllability.
- macro: \CoordinateReferenceFrames
  latex: \mathcal{F}_E
  definition: Coordinate Reference Frames
  kind: set
  unit: Reference
  notes: Fixed World frame ($\mathcal{F}_W$), mobile robot Base/body frame ($\mathcal{F}_B$), and End-effector
    frame ($\mathcal{F}_E$).
- macro: \CoriolisCentrifugalMatrix
  latex: \mathbf{C}(\mathbf{q}, \dot{\mathbf{q}})
  definition: Coriolis / Centrifugal Matrix
  kind: matrix
- macro: \CoriolisMatrix
  latex: \mathbf{C}
  definition: Coriolis matrix $\mathbf{C}(\mathbf{q}, \dot{\mathbf{q}}) \in \mathbb{R}^{n \times n}$
  kind: matrix
  unit: Safe set $\mathcal{C}$, state-space output matrix $\mathbf{C}$, capacitance ($C_{\text{th}}, C_{\text{bus}}$),
    CoM $\mathbf{c}$, or shield coverage $c_{\text{shield}}$
  notes: Coriolis/centrifugal forces use matrix function $\mathbf{C}(\mathbf{q}, \dot{\mathbf{q}})$; forward-invariant
    safe sets use calligraphic $\mathcal{C} \subset \mathcal{S}$; state-space output mappings use bold
    $\mathbf{C} \in \mathbb{R}^{p \times n}$; electrical/thermal capacitance uses italic $C$; center of
    mass is bold vector $\mathbf{c} \in \mathbb{R}^3$; safety shield diagnostic coverage uses $c_{\text{shield}}
    \in [0, 1)$.
- macro: \CoulombFrictionCoefficient
  latex: \mu
  definition: Coulomb Friction Coefficient
  kind: scalar
  unit: Dimensionless
  notes: 'Static/kinetic coefficient bounding friction cone: $\lVert \mathbf{f}_{k, \parallel} \rVert
    \le \mu f_{k, \perp}$.'
- macro: \CovariateDriftBound
  latex: \mathcal{O}(S^2 \epsilon)
  definition: Compounding Covariate-Drift Bound
  kind: set
  unit: Task cost
  notes: Worst-case excess task cost of fixed-archive behavioral cloning over an $S$-step horizon (\BehaviorCloningHorizon).
    Replaces \CompoundingCovariateDrift, which renders the horizon as $T$.
- macro: \CredibleBrakingDeceleration
  latex: a_{\text{brake}}
  definition: Credible Deceleration
  kind: scalar
  unit: $\text{m/s}^2$
  notes: Validated low tail of the deceleration the machine achieves under its stated conditions, not
    the datasheet peak.
  aliases:
  - \CredibleDecelerationBrake
- macro: \CvaeRecognitionEncoder
  latex: q_\phi(\mathbf{z} \mid \mathbf{o})
  definition: CVAE Recognition Encoder
  kind: scalar
- macro: \DatasetSize
  latex: D
  definition: Dataset Size
  kind: scalar
  unit: $\text{ms}$
  notes: 'Maximum allowable age of sensor telemetry before an interlock trips: $\Delta t_{\text{fresh}}
    \le e_{\max} / v_{\max}$.'
- macro: \DcBusBulkCapacitance
  latex: C_{\text{bus}}
  definition: DC Bus Bulk Capacitance
  kind: scalar
  unit: $\mu\text{F}$
  notes: Inverter decoupling capacitor bank buffering transient inductive voltage collapse.
- macro: \DcBusDynamicRailDroop
  latex: \Delta V_{\text{droop}}
  definition: DC Bus Dynamic Rail Droop
  kind: scalar
  unit: $\text{V}$
  notes: Transient voltage collapse ($\Delta I R_{\text{bus}} + L_{\text{bus}}\frac{dI}{dt} + \frac{\Delta
    I \Delta t}{2 C_{\text{bus}}}$) under step motor current loads.
- macro: \DecoderEvaluationCount
  latex: N_{\text{eval}}
  definition: Decoder Evaluation Count
  kind: count
- macro: \DetectionInterval
  latex: t_{\text{detect}}
  definition: Detection Interval
  kind: scalar
- macro: \DiagnosticCoverage
  latex: C_{\text{diag}}
  definition: Diagnostic Coverage
  kind: scalar
- macro: \DiffusionGaussianNoise
  latex: \boldsymbol{\epsilon}
  definition: Diffusion Gaussian Noise
  kind: vector
- macro: \DiffusionMatchingLoss
  latex: \mathcal{L}_{\text{diff}}(\theta)
  definition: Diffusion Matching Loss
  kind: function
  unit: Scalar
  notes: 'Mean-squared error objective: $\mathbb{E}[\lVert \boldsymbol{\epsilon} - \boldsymbol{\epsilon}_\theta(\mathbf{o}_t,
    \mathbf{A}_t^k, k) \rVert^2]$ optimized across denoising steps.'
- macro: \DiffusionScheduleParameterK
  latex: \bar{\alpha}_k
  definition: Diffusion Schedule Parameter
  kind: scalar
  unit: $[0, 1]$
