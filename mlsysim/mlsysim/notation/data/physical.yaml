- macro: \FlangeCameraTransform
  latex: \mathbf{T}_{\text{flange}}^{\text{cam}}
  definition: rigid transform mapping camera coordinates into the tool-flange frame, the extrinsic of
    a wrist-mounted camera
  kind: matrix
- macro: \FlangePose
  latex: \mathbf{T}_{\text{flange}}
