  kind: count
- macro: \EnforcerComputeTime
  latex: T_{\text{comp}}
  definition: Enforcer Compute Time
  kind: scalar
- macro: \EnsemblingWindowLength
  latex: K
  definition: Ensembling Window Length
  kind: scalar
  unit: Time steps
  notes: Number of overlapping past chunks blended in receding horizon execution ($K \le H$).
- macro: \EssentialMatrix
  latex: \mathbf{E}
  definition: Essential Matrix
