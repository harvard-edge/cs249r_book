# Notation registry: physical
# Physical AI: plant state, kinematics, contact, control, perception, embodied learning, real-time silicon.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \ActVariationalObjective
  latex: \mathcal{L}_{\text{ACT}}
  definition: 'training objective of Action Chunking with Transformers: chunk reconstruction error plus
    a weighted KL penalty on the latent style variable'
  kind: function
  notes: Conditional VAE objective over encoder parameters $\phi$ and decoder parameters $\theta$; the
    reconstruction term is the $\ell_1$ norm of the action-chunk residual.
- macro: \ActionChunk
  latex: \mathbf{A}
  definition: sequence of future actions a policy predicts in one pass, one row per control step
  kind: matrix
  notes: Shape horizon by action dimension. A subscript $t:t+H-1$ names the window; a superscript $k$
    names the iterate at diffusion step $k$. Not the LTI state matrix, which is \StateSpaceSystemMatrix.
- macro: \ActionChunkHorizon
  latex: H
  definition: number of future action steps a policy emits in one forward pass
  kind: count
  notes: $H=16$ on the mobile manipulator; 16 to 64 steps in the literature. The vol4 uses of the old
    name \Horizon carry this meaning and belong here.
- macro: \ActionChunkTrajectory
  latex: \mathbf{A}_{t:t+H}
  definition: action chunk written with its time window, the actions from step t up to the horizon
  kind: matrix
  notes: Same quantity as \ActionChunk with the window subscript baked in; the book writes the window
    form as $\ActionChunk_{t:t+H-1}$.
- macro: \ActionDimension
  latex: d_a
  definition: number of components in one action vector
  kind: count
  notes: A chunk holds horizon times this many entries.
- macro: \ActionExecutionRate
  latex: f_{\text{exec}}
  definition: rate at which the controller consumes the waypoints of an admitted action chunk
  kind: scalar
  unit: Hz
  notes: Typically $100\text{ Hz}$ to $1\text{ kHz}$, faster than the policy rate that produces the chunks.
- macro: \ActuationSelectionMatrix
  latex: \mathbf{S}
  definition: matrix that maps actuator torques onto the actuated joints of a floating-base robot, leaving
    the six base coordinates unactuated
  kind: matrix
  unit: dimensionless
  notes: $[\mathbf{0}_{n \times 6}, \mathbf{I}_{n \times n}]$; enters the floating-base dynamics as $\mathbf{S}^\top
    \boldsymbol{\tau}$.
- macro: \ActuatorDutyCycle
  latex: D_{\text{cycle}}
  definition: fraction of each burst cycle an actuator spends at peak power, on-time divided by cycle
    period
  kind: scalar
  unit: dimensionless
  notes: $D = t_{\text{on}} / t_{\text{cycle}}$; bounded by the average-power thermal screen.
- macro: \ActuatorResponseTime
  latex: T_{\text{act}}
  definition: time from a delivered stop command until the actuator produces retarding force, including
    gate drive and current rise
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
- macro: \AdjointRepresentation
  latex: \mathbf{Ad}_T
  definition: six-by-six matrix that carries twists and wrenches from one coordinate frame to another
    under a rigid transform
  kind: matrix
  notes: Built from the rotation and translation of the transform $T$.
- macro: \AllowableCollisionEnergy
  latex: E_{k, \text{allow}}
  definition: largest kinetic energy a robot may transfer to a person in transient collaborative contact,
    as set by the safety standard
  kind: scalar
  unit: J
  notes: Checked as $\frac{1}{2} \ReducedImpactMass v^2 \le E_{k,\text{allow}}$.
- macro: \AmbientTemperature
  latex: T_{\text{amb}}
  definition: temperature of the air around a motor, the reference for its winding temperature rise
  kind: scalar
  unit: degC
  aliases:
  - \WindingAndAmbientTemperatureTwo
- macro: \AssuranceClaim
  latex: C
  definition: top-level safety claim of an assurance argument, whose probability of holding is assessed
    from its premises
  kind: scalar
  unit: dimensionless
  notes: A proposition, not a number; the book takes $\Pr(C)$, the product of independent premise confidences
    for a conjunctive argument, or one minus the product of leg failure probabilities for a multi-legged
    one.
- macro: \BackEmfVoltage
  latex: e_{\text{bemf}}
  definition: voltage the turning rotor induces in the stator windings, opposing the supply
  kind: scalar
  unit: V
  notes: Equals the back-EMF constant times rotor speed, $e = \MotorBackEmfConstant \omega$.
  aliases:
  - \BackemfVoltageBemf
- macro: \BarrierConstraintMatrix
  latex: \mathbf{A}_{\text{cbf}}
  definition: matrix of stacked affine control-barrier constraints on the control input
  kind: matrix
  notes: Constraints read $\mathbf{A}_{\text{cbf}}(\mathbf{x})\mathbf{u} \le \mathbf{b}_{\text{cbf}}(\mathbf{x})$;
    a matrix rather than the vector \BarrierConstraintVector.
  aliases:
  - \BarrierConstraintRowsCbf
- macro: \BarrierConstraintVector
  latex: \mathbf{b}_{\text{cbf}}
  definition: vector of bounds on the right side of the stacked control-barrier constraints
  kind: vector
  notes: Pairs with \BarrierConstraintMatrix.
  aliases:
  - \BarrierConstraintRowsCbfTwo
- macro: \BarrierFunction
  latex: h
  definition: 'control-barrier certificate: a margin function of the state that is nonnegative exactly
    on the safe set'
  kind: function
  unit: m
  notes: Written as a function head ($h(\mathbf{x})$, $\dot{h}$, $L_{\mathbf{f}} h$). Clearance barriers
    are in m; angular barriers are in rad. \ControlBarrierFunction is the fixed form $h(\mathbf{x})$.
- macro: \BarrierRelativeDegree
  latex: r
  definition: number of times the barrier function must be differentiated along the dynamics before the
    control input appears
  kind: count
  notes: Renders $r$, like \Reward and \WheelRadius; the three never share a derivation.
- macro: \BehaviorCloningHorizon
  latex: S
  definition: number of control steps in an episode over which imitation errors compound
  kind: count
  notes: The horizon of the $\mathcal{O}(S^2\epsilon)$ behavior-cloning bound. Not the action-chunk horizon
    \ActionChunkHorizon and not a duration.
- macro: \BeliefInvalidationHorizon
  latex: T_{\text{inv}}
  definition: time since the last supporting evidence after which a stored belief may no longer be used
  kind: scalar
  unit: s
  notes: Set by the belief record\'s error growth law; an observation older than this degrades the belief\'s
    status.
- macro: \BlendingTransitionWindow
  latex: \tau_{\text{blend}}
  definition: duration of the smooth blend from one latched command to the next during a bumpless transfer
  kind: scalar
  unit: s
  notes: Bounded below by $1.875 \lVert \Delta \mathbf{u} \rVert / \JerkLimit$ for the quintic smoothstep.
- macro: \BodyReferenceFrame
  latex: \mathcal{F}_B
  definition: coordinate frame attached to the mobile robot base
  kind: set
  aliases:
  - \CoordinateReferenceFramesB
- macro: \BumplessTransferBlend
  latex: \alpha
  definition: blend weight that ramps from zero to one across a bumpless transfer, as a function of normalized
    time
  kind: scalar
  unit: dimensionless
  notes: The $C^2$ quintic smoothstep $10\hat{t}^3 - 15\hat{t}^4 + 6\hat{t}^5$.
- macro: \BumplessTransferProgress
  latex: \hat{t}
  definition: elapsed time since a bumpless transfer began, divided by the blending window, from zero
    to one
  kind: scalar
  unit: dimensionless
  notes: $(t - t_{\text{start}})/\BlendingTransitionWindow$, clamped to $[0, 1]$; the argument of $\BumplessTransferBlend$.
- macro: \CameraFramePoint
  latex: \mathbf{p}_c
  definition: position of a point expressed in the camera coordinate frame
  kind: vector
  unit: m
  aliases:
  - \CameraframeThreedCoordinate
- macro: \CameraIntrinsicCalibrationMatrix
  latex: \mathbf{K}
  definition: three-by-three matrix of camera intrinsics, focal lengths and principal point, that maps
    camera-frame points to pixels
  kind: matrix
  unit: pixels
  notes: Bold $\mathbf{K}$. Contact stiffness is \ContactStiffness, feedback gains are $K_p, K_d$, motor
    constants are $K_t, K_e$.
- macro: \CartesianPosition
  latex: \mathbf{p}
  definition: position of a point in three-dimensional space
  kind: vector
  unit: m
  notes: Subscripts name the point ($\mathbf{p}_{\text{TCP}}$, $\mathbf{p}_{\text{target}}$).
  aliases:
  - \CartesianThreedPosition
- macro: \CentroidalAngularMomentum
  latex: \mathbf{h}_{\text{ang}} \in \mathbb{R}^3
  definition: angular momentum of the whole robot about its center of mass
  kind: vector
  unit: kg*m^2/s
  notes: Its rate equals the sum of contact moments about the center of mass.
- macro: \CentroidalLinearMomentum
  latex: \mathbf{h}_{\text{lin}} \in \mathbb{R}^3
  definition: total linear momentum of the robot, its mass times its center-of-mass velocity
  kind: vector
  unit: kg*m/s
  notes: Its rate equals the sum of contact forces plus gravity.
- macro: \CertifiedControlAction
  latex: \mathbf{u}^*
  definition: control command after the safety filter has projected it onto the admissible set
  kind: vector
  notes: Output of the active-set CBF quadratic program; compare the unverified \NominalControlCommand.
- macro: \ChunkLease
  latex: T_{\text{lease}}
  definition: longest time an admitted action chunk may keep driving the actuators without renewal
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
- macro: \ChunkRenewalPeriod
  latex: T_{\text{chunk}}
  definition: nominal interval between successive admissions of the chunk policy's proposals
  kind: scalar
  unit: s
  notes: With \RenewalJitterAllowance it must stay below \ChunkLease.
- macro: \ClassKFunction
  latex: \kappa
  definition: extended class-K function that bounds how fast the barrier value may decrease
  kind: function
  notes: Written as a function head in $\dot{h} \ge -\kappa(h)$; its value has the units of $\dot{h}$.
    The linear choice is $\kappa(h) = \gamma_{\text{cbf}} h$. \ClassRateFunction is the standalone label
    $\kappa(\cdot)$.
- macro: \ClearDistance
  latex: D_{\text{clear}}
  definition: distance between the machine and the boundary it must stop before
  kind: scalar
  unit: m
  notes: The subscript keeps it distinct from dataset size $D$.
- macro: \ClockOffset
  latex: \theta_{\text{offset}}
  definition: difference between a follower clock's reading and the leader clock's at the same instant
  kind: scalar
  unit: s
- macro: \ClockSynchronizationSkew
  latex: \delta_{\text{skew}}
  definition: rate at which two clocks drift apart, such as the application processor and the safety microcontroller
  kind: scalar
  unit: ppm
  notes: Hardware crystal drift between the application processor and safety microcontroller clocks.
- macro: \CognitivePolicyAction
  latex: \mathbf{a}_t
  definition: action the learned policy emits at step t, before any safety check
  kind: vector
  notes: Normalized joint delta, target pose, or gripper command; unprivileged, unlike \CertifiedControlAction.
- macro: \CommandTransportTime
  latex: T_{\text{bus}}
  definition: time for a command to travel over the fieldbus from the permission path to the drive
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
  aliases:
  - \CommandTransportTimeBus
- macro: \CommandedJointTorque
  latex: \tau
  definition: torque commanded at a single joint in one-joint derivations
  kind: scalar
  unit: N*m
  notes: Scalar torque commanded at one joint in single-joint derivations such as the kinetic barrier
    ($J\dot{\omega} = \tau + \tau_{\text{bias}}$). Bounds and disturbances keep subscripts ($\tau_{\max}$,
    $\tau_{\text{bias}}$); unsubscripted scalar $\tau$ means this torque only where the derivation states
    it.
- macro: \CommitmentInstant
  latex: t_{\text{commit}}
  definition: instant after which a receding-horizon plan's prefix is committed and can no longer be replaced
  kind: scalar
  unit: s
  notes: The matched stop suffix begins here if no successor has been admitted.
- macro: \ConformalMiscoverageRate
  latex: \epsilon
  definition: allowed probability that the conformal prediction set misses the true referent
  kind: scalar
  unit: dimensionless
  notes: Coverage is at least $1-\epsilon$.
- macro: \ConformalPredictionSet
  latex: \mathcal{C}
  definition: calibrated set of referent candidates that cannot be excluded at the miscoverage rate
  kind: set
  notes: A singleton admits the referent; a larger set refuses. Shares the glyph of the safe set \ForwardInvariantSafeSet;
    the two never appear in the same derivation.
- macro: \ContactPointForce
  latex: \mathbf{f}_k
  definition: force the environment exerts on the robot at one contact point
  kind: vector
  unit: N
  notes: Always indexed by the contact $k$; splits into \TangentialContactShear and \NormalContactForce.
  aliases:
  - \ContactForceVectorK
- macro: \ContactPointJacobian
  latex: \mathbf{J}
  definition: matrix mapping joint velocities to the linear velocity of one contact point
  kind: matrix
  notes: Indexed by the contact $k$; its transpose maps the contact force into joint torques.
  aliases:
  - \ContactPointJacobianK
- macro: \ContactStiffness
  latex: k_{\text{contact}}
  definition: stiffness of a contact treated as a spring, force per unit penetration
  kind: scalar
  unit: N/m
  notes: Body-region stiffness in collaborative contact is \HertzianContactStiffness.
- macro: \ContinuousCurrent
  latex: I_{\text{cont}}
  definition: largest motor current the winding can carry indefinitely without exceeding its temperature
    limit
  kind: scalar
  unit: A
  aliases:
  - \ContinuousPeakCurrent
- macro: \ControlAffineDriftField
  latex: \mathbf{f}
  definition: unforced part of control-affine dynamics, the state rate when the control input is zero
  kind: vector
  notes: In $\dot{\mathbf{x}} = \mathbf{f}(\mathbf{x}) + \mathbf{g}(\mathbf{x})\mathbf{u}$; captures inertia,
    Coriolis, gravity and passive friction.
- macro: \ControlAffineInputField
  latex: \mathbf{g}
  definition: input matrix field of control-affine dynamics, mapping control inputs to state rates
  kind: matrix
  notes: In $\dot{\mathbf{x}} = \mathbf{f}(\mathbf{x}) + \mathbf{g}(\mathbf{x})\mathbf{u}$; a vector only
    for a single input.
- macro: \ControlSetpointJerk
  latex: \mathbf{j}
  definition: time derivative of the commanded acceleration or torque during a mode transition
  kind: vector
  notes: In $\text{m/s}^3$ for Cartesian setpoints or $\text{N}\cdot\text{m/s}$ for torque setpoints.
- macro: \ControllabilityMatrix
  latex: \mathbf{C}_{\text{ctrb}}
  definition: block matrix of the input matrix and its products with powers of the system matrix, whose
    rank decides controllability
  kind: matrix
  notes: Full row rank characterizes unconstrained LTI controllability; its column space is the controllable
    subspace.
- macro: \CoriolisCentrifugalMatrix
  latex: \mathbf{C}
  definition: matrix of Coriolis and centrifugal effects in the manipulator equation, multiplying joint
    velocities
  kind: matrix
  notes: Same quantity as \CoriolisMatrix, with the arguments $(\mathbf{q}, \dot{\mathbf{q}})$ written
    in.
- macro: \CoulombFrictionCoefficient
  latex: \mu
  definition: ratio of the largest tangential friction force to the normal force at a contact
  kind: scalar
  unit: dimensionless
  notes: Bounds the friction cone, $\lVert \mathbf{f}_{\parallel} \rVert \le \mu f_{\perp}$.
- macro: \CovariateDriftBound
  latex: \mathcal{O}(S^2 \epsilon)
  definition: worst-case excess task cost of behavior cloning, growing with the square of the episode
    length
  kind: function
  notes: Big-O expression over an $S$-step horizon (\BehaviorCloningHorizon); replaces \CompoundingCovariateDrift.
  render_exception: The behavior-cloning compounding-error bound is one named result, the big-O expression
    \mathcal{O}(S^2 \epsilon) over the episode horizon, never evaluated at other arguments.
- macro: \CredibleBrakingDeceleration
  latex: a_{\text{brake}}
  definition: validated low-tail deceleration the machine achieves under its stated conditions, not the
    datasheet peak
  kind: scalar
  unit: m/s^2
  aliases:
  - \CredibleDecelerationBrake
- macro: \CrossoverFrequency
  latex: \omega_c
  definition: angular frequency at which the open-loop gain of a feedback loop falls to one
  kind: scalar
  unit: rad/s
  notes: Frequency at which open-loop gain $\lvert L(j\omega_c) \rvert = 1$ ($0\text{ dB}$).
  aliases:
  - \OpenloopCrossoverFrequency
- macro: \CvaeEncoderParameters
  latex: \phi
  definition: learned weights of the conditional VAE encoder that infers the latent style variable from
    a demonstration
  kind: vector
  notes: Subscript of the recognition encoder $q_\phi$; the decoder weights are $\ModelParameters$.
  render_exception: Non-bold $\phi$ for a parameter vector, the same ML convention as $\ModelParameters$
    ($\theta$).
- macro: \CvaeRecognitionEncoder
  latex: q_\phi
  definition: approximate posterior of the latent style variable given an observation, learned by a conditional
    VAE encoder
  kind: distribution
- macro: \DcBusBulkCapacitance
  latex: C_{\text{bus}}
  definition: capacitance of the capacitor bank on the inverter DC bus that buffers transient load current
  kind: scalar
  unit: F
  notes: Inverter decoupling capacitor bank buffering transient inductive voltage collapse.
- macro: \DcBusDynamicRailDroop
  latex: \Delta V_{\text{droop}}
  definition: transient drop in DC bus voltage under a step in motor current
  kind: scalar
  unit: V
  notes: 'Resistive, inductive and capacitive parts: $\Delta I R_{\text{bus}} + L_{\text{bus}}\,dI/dt
    + \Delta I \Delta t / (2 C_{\text{bus}})$.'
- macro: \DecoderEvaluationCount
  latex: N_{\text{eval}}
  definition: number of dependent forward passes a generative action head makes per chunk, such as denoising
    or ODE-solver steps
  kind: count
- macro: \DelayPhaseLag
  latex: \Delta \phi
  definition: phase lag that loop delays add at the crossover frequency, eroding the phase margin
  kind: scalar
  unit: rad
  notes: Often quoted in degrees; for sample-and-hold, compute and bus delays, $\omega_c (T_s/2 + T_{\text{comp}}
    + T_{\text{bus}})$.
  aliases:
  - \PhaseLagDegradation
- macro: \DetectionInterval
  latex: t_{\text{detect}}
  definition: time a detector takes to recognize a hazard or an expiry, beyond what the observation age
    already charges
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
- macro: \DiagnosticCoverage
  latex: C_{\text{diag}}
  definition: rate-weighted fraction of hardware faults whose hazardous effect a diagnostic mitigates
  kind: scalar
  unit: dimensionless
  notes: $\lambda_{\text{unmitigated}} = \lambda_{\text{raw}}(1 - C_{\text{diag}})$.
- macro: \DiffusionCumulativeSchedule
  latex: \bar{\alpha}_k
  definition: fraction of the clean signal variance retained after k diffusion steps
  kind: scalar
  unit: dimensionless
  notes: $\bar{\alpha}_k = \prod_{s=1}^k \alpha_s$, between 0 and 1.
  aliases:
  - \DiffusionScheduleParameterK
- macro: \DiffusionGaussianNoise
  latex: \boldsymbol{\epsilon}
  definition: standard Gaussian noise added to clean action chunks in the diffusion forward process
  kind: vector
- macro: \DiffusionMatchingLoss
  latex: \mathcal{L}_{\text{diff}}
  definition: mean squared error between the injected noise and the noise the network predicts, averaged
    over diffusion steps
  kind: function
  notes: 'Mean-squared error objective: $\mathbb{E}[\lVert \boldsymbol{\epsilon} - \boldsymbol{\epsilon}_\theta(\mathbf{o}_t,
    \mathbf{A}_t^k, k) \rVert^2]$ optimized across denoising steps.'
- macro: \DiffusionStepIndex
  latex: k
  definition: position of one step in the diffusion noising or denoising sequence
  kind: index
  notes: Third argument of $\NoisePredictionNetwork$; the superscript of $\NoisedActionChunk$ names the
    same step.
- macro: \DirectionalCosineMatrix
  latex: \mathbf{R}
  definition: three-by-three rotation matrix giving the orientation of one frame relative to another
  kind: matrix
  unit: dimensionless
  notes: Orthonormal with determinant one, an element of \SpecialOrthogonalGroup.
- macro: \DispatchAdmissionInterval
  latex: \Delta_{\text{da}}
  definition: time from dispatching a proposal to its admission by the permission path
  kind: scalar
  unit: s
  notes: A design allocation covering proposer inference, board link, deserialization, validation, activation,
    and the wait for the next tick.
  aliases:
  - \DispatchtoadmissionIntervalDa
- macro: \DivergenceInstant
  latex: t_{\text{div}}
  definition: time at which an autonomous policy's rollout begins to leave its supported states
  kind: scalar
  unit: s
  notes: Estimated as $\hat{t}_{\text{div}}$ by searching backward from the takeover timestamp.
- macro: \DivergenceTolerance
  latex: \delta_{\text{tol}}
  definition: positive threshold on the trajectory-divergence residual that marks divergence
  kind: scalar
  unit: m
  notes: Expressed in the unit of the residual \TrajectoryDivergenceResidual (m for the latch example).
- macro: \EffectiveImpactMass
  latex: m_{\text{eff}}
  definition: apparent mass the robot presents along the contact normal at a given contact point and configuration
  kind: scalar
  unit: kg
  notes: For a single frictionless impact it is the reciprocal of the Delassus coefficient formed from
    the contact normal Jacobian and the inertia matrix; for a base it includes reflected rotor inertia.
- macro: \EffectiveJointInertia
  latex: J_{\text{eff}}
  definition: total inertia seen at one joint, link and payload plus reflected rotor inertia
  kind: scalar
  unit: kg*m^2
- macro: \ElectricalResistance
  latex: R
  definition: electrical resistance of a circuit or winding
  kind: scalar
  unit: Ohm
  notes: Phase resistance is \PhaseResistance.
- macro: \ElectricalTimeConstant
  latex: \tau_e
  definition: time constant of current rise in a motor winding, inductance over resistance
  kind: scalar
  unit: s
- macro: \EmittedTokenCount
  latex: S_{\text{out}}
  definition: number of tokens a decoder emits one after another for one output
  kind: count
  aliases:
  - \EmittedTokenCountOut
- macro: \EndEffectorReferenceFrame
  latex: \mathcal{F}_E
  definition: coordinate frame attached to the robot's end effector
  kind: set
  notes: 'Siblings: \WorldReferenceFrame and \BodyReferenceFrame.'
  aliases:
  - \CoordinateReferenceFrames
- macro: \EnforcerComputeTime
  latex: T_{\text{comp}}
  definition: time the enforcer takes to evaluate its constraints within one control period
  kind: scalar
  unit: s
- macro: \EnsemblingWindowLength
  latex: K
  definition: number of overlapping past chunks blended together in temporal ensembling
  kind: count
  notes: At most the chunk horizon.
- macro: \EssentialMatrix
  latex: \mathbf{E}
  definition: three-by-three matrix relating corresponding normalized image points in two calibrated views
  kind: matrix
  aliases:
  - \FundamentalAndEssentialMatricesTwo
- macro: \EstimationErrorCovariance
  latex: \mathbf{P}
  definition: covariance of the error between the true state and its estimate
  kind: matrix
  notes: Symmetric positive definite; evolves by the matrix Riccati equation.
- macro: \EvidenceHorizon
  latex: \tau_{\text{ev}}
  definition: time for which a target estimate stays within its task tolerance without fresh evidence
  kind: scalar
  unit: s
  notes: $\sqrt{2(r_{\text{tol}} - e_0)/a_{\text{slip}}}$ for a target that may accelerate; a chunk must
    be replaced inside it.
- macro: \ExposureDuration
  latex: t_{\text{exp}}
  definition: integration time of one camera frame
  kind: scalar
  unit: s
  notes: The frame timestamp refers to the exposure midpoint, half this duration after the trigger.
- macro: \FallbackHold
  latex: T_{\text{hold}}
  definition: optional hold or fault-confirmation interval before the stop command reaches the drive
  kind: scalar
  unit: s
  notes: Zero when the selected stop path has no such interval; one term of \PrebrakeDelay.
- macro: \ForwardInvariantSafeSet
  latex: \mathcal{C}
  definition: set of states on which the barrier certificate is nonnegative, kept invariant by the safety
    filter
  kind: set
  notes: $\mathcal{C} = \{\mathbf{x} \mid h(\mathbf{x}) \ge 0\}$; its boundary is \SafetyBoundaryManifold.
  aliases:
  - \ForwardinvariantSafeSet
- macro: \FrameTimelineTime
  latex: t_{\text{frame}}
  definition: time on a multi-camera frame timeline, measured from the start of frame capture
  kind: scalar
  unit: s
  notes: A timestamp, not a duration of work; distinct from \Time.
- macro: \FreeSpaceDepth
  latex: d_{\text{free}}
  definition: distance from a hull's surface to the nearest occupied or unknown cell
  kind: scalar
  unit: m
  aliases:
  - \FreespaceDepth
- macro: \FundamentalMatrix
  latex: \mathbf{F}
  definition: three-by-three matrix relating corresponding pixel points in two uncalibrated views
  kind: matrix
  notes: Shares bold $\mathbf{F}$ with \StateTransitionMatrix; the two never appear together.
  aliases:
  - \FundamentalAndEssentialMatrices
- macro: \GearReductionRatio
  latex: N_{\text{gear}}
  definition: ratio of motor speed to joint output speed across a transmission
  kind: scalar
  unit: dimensionless
  notes: Multiplies output torque by the ratio and reflected rotor inertia by its square.
- macro: \GearboxTransmissionEfficiency
  latex: \eta_{\text{gear}}
  definition: fraction of input mechanical power a transmission delivers at its output
  kind: scalar
  unit: dimensionless
  notes: Between 0 and 1.
  aliases:
  - \TransmissionEfficiencyGear
- macro: \GeneralizedAccelerations
  latex: \ddot{\mathbf{q}}
  definition: second time derivative of the generalized coordinates
  kind: vector
  notes: Entries in $\text{rad/s}^2$ for revolute joints and $\text{m/s}^2$ for prismatic ones.
- macro: \GeneralizedCoordinates
  latex: \mathbf{q}
  definition: joint angles and prismatic extensions that fix the configuration of a mechanism
  kind: vector
  notes: Entries in rad for revolute joints and m for prismatic ones.
- macro: \GeneralizedInertiaMatrix
  latex: \mathbf{M}
  definition: joint-space mass matrix of an articulated robot, mapping joint accelerations to the joint
    torques they require
  kind: matrix
  unit: kg*m^2
  notes: Symmetric positive definite; same quantity as \ArticulatedInertiaMatrix, written with its argument
    $(\mathbf{q})$.
- macro: \GeneralizedVelocities
  latex: \dot{\mathbf{q}}
  definition: first time derivative of the generalized coordinates
  kind: vector
  notes: Entries in rad/s for revolute joints and m/s for prismatic ones.
- macro: \GoalSet
  latex: \mathcal{G}_{\text{goal}}
  definition: set of terminal poses within the positional and angular tolerances of a task
  kind: set
  notes: A subset of \SpecialEuclideanGroup; the spatial part of an intent lease \IntentLease.
- macro: \GravitationalTorqueVector
