  kind: scalar
  unit: m
- macro: \PreTriggerWindowDuration
  latex: T_{\text{pre}}
  definition: length of the ring-buffer window before an intervention trigger that the logger freezes
    and keeps
  kind: scalar
  unit: s
  notes: Sized from the out-of-loop takeover latency, rounded up to whole seconds.
- macro: \PrebrakeDelay
  latex: \tau_{\text{delay}}
  definition: time from the capture of the frame that first shows a hazard to the onset of retarding force
  kind: scalar
  unit: s
  notes: Sums observation age, chunk lease, detection, hold, tick, bus and actuator terms; the machine
    covers $v$ times this before braking begins.
- macro: \PrebrakeDelayCeiling
  latex: \tau_{\text{delay},\max}
  definition: largest pre-brake delay that still lets the machine stop within its clearance, clearance
    minus margins and braking distance divided by speed
  kind: scalar
  unit: s
  notes: 'The ceiling of \PrebrakeDelay in the lease rule: $\ChunkLease \le \PrebrakeDelayCeiling - \PermissionLoopPeriod
    - \CommandTransportTime - \ActuatorResponseTime - \ObservationAge$.'
- macro: \PredicateLipschitzConstant
  latex: L_{\phi}
  definition: Lipschitz constant of a signal temporal logic predicate's margin with respect to the weighted
    state norm, the largest margin change per unit of normalized state discrepancy
  kind: scalar
  unit: varies
  notes: Carries the predicate margin's units; times \TransferDiscrepancyBound it is the sim-to-real robustness
    discount.
- macro: \PredicateNormalizationScale
  latex: c
  definition: positive scale, in the unit of one atomic predicate, by which its margin is divided to make
    it dimensionless
  kind: scalar
  unit: varies
  notes: Indexed $c_i$; unit equals that of \StlPredicateFunction_i.
- macro: \PredictedActionComponent
  latex: \hat{a}
  definition: one component of an action a policy predicts in open-loop scoring, indexed by component
  kind: scalar
  unit: varies
  notes: Unit is that of the action component (rad, m, N*m).
- macro: \PredictedEnvironmentLatent
  latex: \hat{\mathbf{z}}
  definition: estimate of the environment latent vector that the adaptation module predicts from onboard
    observation history
  kind: vector
- macro: \PredictedErrorCovariance
  latex: \mathbf{P}_{k|k-1}
  definition: error covariance at step k predicted from measurements through step k minus one, before
    the update
  kind: matrix
  notes: Conditioned form of \EstimationErrorCovariance.
- macro: \PredictedForceReading
  latex: \hat{y}
  definition: force-sensor reading the estimator predicts from its force and bias estimates
  kind: function
  unit: N
- macro: \PredictedPolicyAction
  latex: \hat{\mathbf{a}}
  definition: action a policy predicts on a recorded demonstrator state in open-loop scoring, never executed
  kind: vector
- macro: \PredictedRelativeDepth
  latex: z_{\text{pred}}
  definition: depth a monocular network predicts up to an unknown scale and shift
  kind: scalar
  unit: dimensionless
- macro: \PredictedStateEmbedding
  latex: \mathbf{e}_{\text{state}}
  definition: learned embedding of the state estimate propagated forward to the instant of actuation
  kind: vector
- macro: \PredictedStateEstimate
  latex: \hat{\mathbf{x}}_{k|k-1}
  definition: state estimate at step k predicted from measurements through step k minus one, before the
    update
  kind: vector
  notes: The conditional subscript is not an accepted index decoration (README, What math may contain),
    so the step index is baked in.
- macro: \PredictionStepIndex
  latex: i
  definition: position of one predicted step within a model predictive control horizon
  kind: index
  notes: Runs from 0 to \MpcPredictionHorizon.
- macro: \PregraspPosition
  latex: \mathbf{p}_{\text{pre}}
  definition: position the tool center point must reach before contact, on the approach axis short of
    the grasp
  kind: vector
  unit: m
- macro: \PresaturationTorqueCommand
  latex: \boldsymbol{\tau}_{\text{cmd}}
  definition: joint torque vector a controller commands before actuator saturation
  kind: vector
  notes: Entries in N*m. Not \CommandedJointTorque, the single-joint scalar.
- macro: \PreviousRangeObservationHistory
  latex: z_{1:t-1}
  definition: sequence of range observations from the first step through the step before the current one
  kind: record
  notes: The past observations \RangeObservationHistory extends by one step.
- macro: \PreviousUpdatedErrorCovariance
  latex: \mathbf{P}_{k-1|k-1}
  definition: error covariance at step k minus one after that step's update
  kind: matrix
- macro: \PreviousUpdatedStateEstimate
  latex: \hat{\mathbf{x}}_{k-1|k-1}
  definition: state estimate at step k minus one after that step's update, the input to the next prediction
  kind: vector
- macro: \PrincipalPointColumn
  latex: c_x
  definition: horizontal pixel coordinate of the principal point, where the optical axis meets the image
  kind: scalar
  unit: pixels
- macro: \PrincipalPointRow
  latex: c_y
  definition: vertical pixel coordinate of the principal point, where the optical axis meets the image
  kind: scalar
  unit: pixels
- macro: \PrivilegedSimulatorState
  latex: s_{\text{priv}}
  definition: privileged simulator state at step t, the ground-truth quantities such as friction and contact
    wrenches that a deployed policy cannot measure
  kind: record
  notes: The site s absorbs _t and ^{\text{priv}}. Subset of \PhysicalWorldState exposed by the simulator.
- macro: \PrivilegedStateDimension
  latex: d_{\text{priv}}
  definition: number of real components in the privileged simulator state
  kind: count
- macro: \PrivilegedStateEncoder
  latex: E
  definition: learned encoder that compresses the privileged simulator state into the environment latent
    vector
  kind: function
- macro: \ProcessNoiseCovariance
  latex: \mathbf{Q}
  definition: covariance of the process noise that the predict step adds to the error covariance
  kind: matrix
  notes: Covariance of \ProcessNoiseVector.
- macro: \ProcessNoiseIntensity
  latex: \mathbf{Q}
  definition: intensity (power spectral density) matrix of continuous-time white process noise, the weight
    of the delta function in its covariance kernel
  kind: matrix
  notes: 'Not a per-sample covariance: integrating it over time gives covariance. Distinct from the discrete
    \ProcessNoiseCovariance proposed for 09_memory.'
- macro: \ProcessNoiseVector
  latex: \mathbf{w}
  definition: random disturbance acting on the state in the process model
  kind: vector
  notes: Disturbance applied to the system state in the process model.
- macro: \ProfileAccelerationBound
  latex: a_{\max}
  definition: largest acceleration or deceleration a planned or interpolated profile may command
  kind: scalar
  unit: m/s^2
- macro: \ProfileJerk
  latex: \dot{a}
  definition: time derivative of the acceleration of a one-dimensional motion profile
  kind: scalar
  unit: m/s^3
  notes: Bounded by \JerkLimit.
- macro: \ProgramInvariantPredicate
  latex: P
  definition: predicate on program states that holds initially and is preserved by every transition, the
    inductive invariant of software verification
  kind: function
  notes: Software analogue of the barrier condition.
- macro: \ProgramState
  latex: s
  definition: state of a program in formal software verification, the valuation of its variables
  kind: record
  notes: Discrete analogue of \MechanicalPlantState in the invariant comparison.
- macro: \ProgramStateSpace
  latex: \Sigma
  definition: set of all states a program can reach or represent in formal software verification
  kind: set
  render_exception: Formal methods write the program state space with an upright capital Sigma.
- macro: \ProjectedSeamState
  latex: \hat{\mathbf{x}}_{\text{seam}}
  definition: reference state the active trajectory is projected to reach at the replanning seam, on which
    the replacement is conditioned
  kind: vector
  notes: Exists in reference space only; tracking error and contact displace the physical plant from it.
- macro: \ProjectionBallRadius
  latex: \epsilon
  definition: radius of the norm ball onto which projected gradient descent projects its iterate
  kind: scalar
  unit: varies
  notes: The adversarial case is \AdversarialPerturbationBudget.
- macro: \ProjectionConstraintSet
  latex: \mathcal{C}
  definition: convex constraint set onto which projected gradient descent projects each updated iterate
  kind: set
  notes: Not \ForwardInvariantSafeSet or \ConformalPredictionSet.
- macro: \ProjectiveDistanceSample
  latex: s
  definition: signed distance from a voxel to the measured return along the sensing ray, positive in front
    of the return, before truncation
  kind: scalar
  unit: m
- macro: \ProjectiveRayScale
  latex: \lambda
  definition: 'free positive scale along a camera ray: every multiple of a homogeneous pixel direction
    projects to the same pixel'
  kind: scalar
  unit: varies
  notes: The projective depth ambiguity that metric depth resolves.
- macro: \ProjectiveScaleFactor
  latex: s
  definition: arbitrary nonzero scale of a homogeneous image point in the projection equation
  kind: scalar
  unit: dimensionless
- macro: \PropagatedPositionStandardDeviation
  latex: \sigma_p
  definition: standard deviation of the position estimate as a function of time since measurements stopped
  kind: function
  unit: m
  notes: Its square is the position entry of the propagated covariance.
- macro: \ProportionalGainMatrix
  latex: \mathbf{K}_{p}
  definition: matrix of proportional feedback gains acting on the tracking error vector in joint-space
    PD or PID control
  kind: matrix
  notes: Diagonal entries are \PidProportionalGain values per joint. Not \CameraIntrinsicCalibrationMatrix.
- macro: \ProportionalPotentialEnergy
  latex: \mathcal{L}_{\text{pos}}
  definition: artificial quadratic potential of the tracking error that proportional feedback descends,
    one half the error weighted by the proportional gain matrix
  kind: function
  notes: Its negative gradient with respect to position is the proportional term; the potential part of
    \MechanicalEnergy.
- macro: \ProposalDeserializationTime
  latex: t_{\text{deser}}
  definition: time for the safety microcontroller to deserialize a received candidate proposal
  kind: scalar
  unit: s
- macro: \ProposalExpiryInstant
  latex: t_{\text{valid}}
  definition: monotonic instant after which a proposal lapses and may no longer be executed
  kind: scalar
  unit: s
  notes: No later than \EvidenceCaptureInstant plus \EvidenceHorizon.
- macro: \ProposalFirstWaypoint
  latex: \mathbf{a}_0
  definition: first waypoint of an incoming action proposal, which must match the robot's rest configuration
    before authority is restored
  kind: vector
  unit: varies
  notes: The 0 is part of the glyph. Checked as $\lVert\ProposalFirstWaypoint - \RestConfiguration\rVert
    \le \RecoveryPoseTolerance$.
- macro: \ProposalLinkTransportTime
  latex: t_{\text{link}}
  definition: time for a candidate proposal to cross the link from the host to the safety microcontroller
  kind: scalar
  unit: s
  notes: Not \InterconnectTransferTime, which moves sensor data.
- macro: \ProposalParameterVector
  latex: \boldsymbol{\psi}
  definition: parameter vector of a parametric proposal distribution, updated by the cross-entropy method
  kind: vector
  unit: varies
  notes: Units of the proposal family's parameters, such as the mean delay in seconds for an exponential
    proposal.
- macro: \ProposalPayload
  latex: \mathcal{P}
  definition: typed candidate-motion record a learned proposer sends to the real-time permission path,
    with its evidence capture time, expiry and provenance
  kind: record
  notes: Requests motion; it is neither execution permission nor the handoff evidence record. Fields include
    \EvidenceCaptureInstant and \ProposalExpiryInstant.
- macro: \ProposedContactForce
  latex: F_{\text{nom}}
  definition: constant contact force a proposal asks for over one control interval
  kind: scalar
  unit: N
- macro: \ProposedEndEffectorPoseSequence
  latex: \mathbf{X}_{1:H}
  definition: end-effector target poses, position and orientation, at every setpoint of a proposed chunk
  kind: matrix
  notes: Verified against workspace keep-out boundaries.
- macro: \ProposedGripperCommandSequence
  latex: \mathbf{g}_{1:H}
  definition: gripper closure targets between zero and one at every setpoint of a proposed chunk
  kind: vector
  notes: Not \GravitationalTorqueVector, which shares the bold g.
- macro: \ProposedJointPositionSequence
  latex: \mathbf{Q}_{1:H}
  definition: candidate joint positions at every setpoint of a proposed chunk, one row per setpoint
  kind: matrix
  notes: Shape \ActionChunkHorizon by \GeneralizedCoordinateCount, in radians or meters.
- macro: \ProposedJointVelocitySequence
  latex: \dot{\mathbf{Q}}_{1:H}
  definition: candidate joint velocity setpoints of a proposed chunk, one row per setpoint
  kind: matrix
  notes: Checked for continuity where adjoining chunks meet.
- macro: \ProposerConfidenceScore
  latex: \hat{p}
  definition: confidence score a learned proposer attaches to a proposal, from the method its calibration
    profile names
  kind: scalar
  unit: dimensionless
  notes: Between zero and one; softmax margin, sample dispersion, ensemble disagreement or a conformal
    set. Not a probability of task success unless calibrated; omitted when no method is qualified.
- macro: \ProposerInferenceTime
  latex: t_{\text{infer}}
  definition: time for one forward evaluation of the learned proposer
  kind: scalar
  unit: s
  notes: Spent above the proposal boundary and outside the permission loop period.
- macro: \ProprioceptiveTokenEmbeddings
  latex: \mathbf{z}_{\text{proprio}}
  definition: token embeddings of the robot's joint and force state fed to an embodied transformer
  kind: vector
  notes: One block of \MultimodalFusedTokenStream.
- macro: \ProtectionSwitchResistance
  latex: R_{\text{switch}}
  definition: on-state resistance of the protection switches in a battery's supply path
  kind: scalar
  unit: Ohm
  notes: One term of \PowerRailResistance.
- macro: \ProtectiveClearanceMargin
  latex: \delta_{\text{margin}}
  definition: fixed nonzero clearance kept between the machine envelope and the boundary after it stops
  kind: scalar
  unit: m
- macro: \ProtectiveSeparationDistance
  latex: S_p
  definition: minimum distance a speed-and-separation monitor must keep between a person and a robot
  kind: scalar
  unit: m
  notes: Term of the ISO/TS 15066 protective separation distance S_p = S_h + S_r + S_s + C + Z_d + Z_r.
- macro: \ProtectiveSpringStiffness
  latex: k_{\text{spring}}
  definition: stiffness of a protective linear spring sized to absorb a design force
  kind: scalar
  unit: N/m
- macro: \ProtectiveSpringTravel
  latex: \delta
  definition: compression of a protective linear spring under a given force, its travel
  kind: scalar
  unit: m
- macro: \PtpExchangeTimestamp
  latex: t
  definition: local-clock timestamp of one event of a Precision Time Protocol delay exchange, numbered
    1 to 4 in exchange order
  kind: scalar
  unit: s
  notes: t_1 and t_4 are read on the leader's clock, t_2 and t_3 on the follower's.
- macro: \PtpForwardPathDelay
  latex: T_{\text{prop}, M \to S}
  definition: one-way propagation delay of the path from the leader clock to the follower clock
  kind: scalar
  unit: s
- macro: \PtpHardwareTimestamp
  latex: t_{\text{PTP}}
  definition: time stamped in hardware in the Precision Time Protocol timebase shared by the application
    processor and the safety microcontroller
  kind: scalar
  unit: s
- macro: \PtpPropagationDelay
  latex: T_{\text{prop}}
  definition: one-way network path delay between two clocks estimated from a symmetric two-way Precision
    Time Protocol exchange
  kind: scalar
  unit: s
- macro: \PtpReversePathDelay
  latex: T_{\text{prop}, S \to M}
  definition: one-way propagation delay of the path from the follower clock to the leader clock
  kind: scalar
  unit: s
- macro: \PublicationEpoch
  latex: t_{\text{pub}}
  definition: instant a serialized state record is committed to a transport bus or shared-memory buffer
  kind: scalar
  unit: s
  notes: Useful for diagnosing pipeline latency, never for judging evidence age.
- macro: \PulseRoundTripTime
  latex: \Delta t
  definition: time from emitting a lidar pulse to receiving its reflection
  kind: scalar
  unit: s
  notes: 'One symbol: the Delta site and the t site both take this macro.'
- macro: \PureNoiseActionChunk
  latex: \mathbf{A}^N
  definition: action chunk at the final forward diffusion step, pure Gaussian noise from which reverse
    denoising starts
  kind: matrix
  notes: \NoisedActionChunk at step \DiffusionStepCount.
- macro: \PureTransportDelay
  latex: T_d
  definition: fixed delay in a feedback or communication channel
  kind: scalar
  unit: s
  notes: Adds phase lag $\omega T_d$ at angular frequency $\omega$.
- macro: \PwmPeriod
  latex: T_{\text{pwm}}
  definition: period of one pulse-width-modulation cycle of an inverter timer
  kind: scalar
  unit: s
- macro: \QuadratureAxisInductance
  latex: L_q
  definition: stator inductance along the quadrature axis of the rotor dq frame, which sets the torque-current
    time constant
  kind: scalar
  unit: H
- macro: \QuadratureAxisVoltage
  latex: v_q
  definition: quadrature-axis voltage the inverter applies in a field-oriented drive
  kind: scalar
  unit: V
- macro: \QuantizationStep
  latex: \delta
  definition: one quantization step of the quantity it prefixes, the smallest change a sensor resolves
  kind: operator
  notes: Prefix, as in the encoder resolution delta theta_enc.
- macro: \QuarterCycleCompressionTime
  latex: t_{\text{peak}}
  definition: time from first contact to maximum compression in an unbraked linear-spring impact, a quarter
    of the oscillation period
  kind: scalar
  unit: s
- macro: \QuaternionSet
  latex: \mathbb{H}
  definition: set of quaternions, the four-dimensional number system whose unit elements represent orientations
  kind: set
  notes: Blackboard bold, as for number sets.
- macro: \QueryBoundaryCount
  latex: S_{\text{eff}}
  definition: number of policy query boundaries in an episode when each chunk executes several control
    steps before the next query
  kind: count
  notes: $S_{\text{eff}} = S/H_{\text{exec}}$ with \BehaviorCloningHorizon and \ChunkExecutionHorizon.
- macro: \QueuedTransactionBytes
  latex: D_{\text{vol}}
  definition: bytes one memory transaction queued ahead of a safety read carries, the per-transaction
    term of the DRAM queueing delay
  kind: scalar
  unit: bytes
  notes: Takes the transaction index grouped, ${\QueuedTransactionBytes}_{k}$ for $k \in \QueuedTransactionSet$,
    inside $\MemoryBusQueueDelay$. Shares the glyph of $\DataVolume$, the total bytes a workload moves,
    but means one queued transaction's bytes.
- macro: \QuinticBlendCoefficient
  latex: \mathbf{a}
  definition: coefficient vector of one power of normalized time in a quintic blend polynomial, indexed
    by that power
  kind: vector
  unit: varies
  notes: Indexed 0 to 5; units of the blended coordinates. Not \CognitivePolicyAction, which shares the
    glyph.
- macro: \RadarRangeResolution
  latex: \Delta R
  definition: smallest separation in range at which an FMCW radar distinguishes two reflectors, set by
    its sweep bandwidth
  kind: scalar
  unit: m
  notes: 'One symbol: the Delta site and the R site both take this macro.'
- macro: \RadialDistortionCoefficient
  latex: k
  definition: coefficient of one power of radius in a radial lens distortion polynomial, numbered k_1,
    k_2
  kind: scalar
  unit: dimensionless
- macro: \RadialRange
  latex: R
  definition: radial distance from an active ranging sensor, lidar or radar, to the surface that reflects
    its signal
  kind: scalar
  unit: m
  notes: Shares its glyph with \ElectricalResistance, which never appears in perception.
- macro: \RadialRangeStandardDeviation
  latex: \sigma_R
  definition: standard deviation of a lidar's measured radial range, set by receiver timing jitter
  kind: scalar
  unit: m
- macro: \RadiationWavelength
  latex: \lambda
  definition: wavelength of the electromagnetic radiation a sensor emits or receives
  kind: scalar
  unit: m
  notes: Rayleigh scattering falls with its fourth power. Not a failure rate.
- macro: \RangeObservation
  latex: z
  definition: one range observation a sensor returns at a time step
  kind: record
  notes: Indexed by step; the history is \RangeObservationHistory.
- macro: \RangeObservationHistory
  latex: z_{1:t}
  definition: sequence of range observations from the first step through the current step
  kind: record
- macro: \RatedActuatorTorque
  latex: \tau_{\text{rated}}
  definition: rated torque of the actuator under test, the reference the stall counter-torque is scaled
    from
  kind: scalar
  unit: N*m
- macro: \RatedCurrentEquilibriumTemperature
  latex: T_{\text{eq}}
  definition: winding temperature at thermal equilibrium under continuous rated current, the heat-soaked
    starting point of a burst
  kind: scalar
  unit: degC
  notes: Distinct from \EquilibriumWindingTemperature of a burst, which lies above the limit.
- macro: \RatedFatigueLife
  latex: L_{10}
  definition: cumulative load-cycle count at which ten percent of a population of identical components
    is expected to have failed
  kind: count
  notes: The subscript 10 is part of the symbol.
- macro: \RatedJointTorque
  latex: \boldsymbol{\tau}_{\text{rated}}
  definition: vector of the torque each joint drive is rated to deliver repeatedly, against which a checker
    tests a candidate's inverse-dynamics torques
  kind: vector
  unit: N*m
  notes: A repeated-peak or continuous rating per joint; tighter than \JointTorqueUpperLimit when thermal
    margin is reserved.
- macro: \RawClearanceBarrierFunction
  latex: h_{\text{raw}}
  definition: barrier function taken directly as the measured clearance to an obstacle, whose relative
    degree to acceleration inputs is two
  kind: function
  unit: m
  notes: Contrast \KineticInsetBarrierFunction, which subtracts the stopping distance to reach relative
    degree one.
- macro: \RawHardwareFaultRate
  latex: \lambda_{\text{raw}}
  definition: rate of hazardous hardware faults before any diagnostic mitigates them, the sum of the component
    fault rates
  kind: scalar
  unit: 1/h
  notes: Usually quoted in FIT; $\lambda_{\text{unmitigated}} = \lambda_{\text{raw}}(1 - C_{\text{diag}})$.
- macro: \RawSensoryData
  latex: \mathbf{S}
  definition: raw sensory data a representation is computed from, treated as a random variable when bounding
    the task information it carries
  kind: vector
  notes: Not \ActuationSelectionMatrix, which shares the glyph.
- macro: \RayReturnRange
  latex: r_{\text{hit}}
  definition: distance from the sensor to the measured return along one range ray
  kind: scalar
  unit: m
- macro: \RayStepCount
  latex: N_{\text{steps}}
  definition: number of voxel cells one ray steps through, its length divided by the voxel pitch
  kind: count
- macro: \RayTraversalLength
  latex: d_{\text{ray}}
  definition: line-of-sight distance one range ray traverses from the sensor origin to the observed surface
    point
  kind: scalar
  unit: m
- macro: \RayVoxelRange
  latex: r_{\text{voxel}}
  definition: distance from the sensor to a voxel center along the range ray that passes through it
  kind: scalar
  unit: m
- macro: \RayleighDissipationFunction
  latex: \mathcal{D}
  definition: Rayleigh dissipation function, one half the velocity error weighted by the damping matrix,
    whose gradient is the viscous damping force
  kind: function
  notes: Twice its value is the power the damping term removes.
- macro: \ReachabilityCostate
  latex: \mathbf{p}
  definition: costate of the Hamilton-Jacobi-Isaacs equation, the gradient of the reachability value function
    with respect to the state
  kind: vector
  notes: Not \CartesianPosition.
- macro: \ReachabilityHamiltonian
  latex: \mathcal{H}
  definition: 'Hamiltonian of the Hamilton-Jacobi-Isaacs equation: the max-min over control and disturbance
    of the costate dotted with the dynamics'
  kind: function
  notes: Not \SignalHandoff.
- macro: \ReachabilityHorizonInstant
  latex: t'
  definition: time instant inside a reachability horizon, between the current time and the terminal time,
    at which a trajectory is tested for entering the failure set
  kind: scalar
  unit: s
  notes: Bound by the quantifier or minimum over $[t, T]$ in a backward reachable tube or its value function.
    Not $\IntegrationDummyTime$, the bound variable of a time integral, nor $\ConvolutionTimeInstant$,
    an earlier instant inside a convolution.
- macro: \ReachabilityLevelFunction
  latex: V
  definition: worst-case minimum of the failure margin function along trajectories from a state and time,
    under the best control against the worst disturbance
  kind: function
  notes: Not the reinforcement-learning value \ExpectedRemainingReturn.
- macro: \ReachabilityTerminalTime
  latex: T
  definition: final instant of the finite horizon over which a reachability or safety guarantee is computed
  kind: scalar
  unit: s
  notes: Not \Time (duration of a unit of work).
- macro: \ReachableDistance
  latex: d_{\text{reach}}
  definition: distance a rest-to-rest profile can cover within a given remaining time under acceleration
    and speed bounds
  kind: scalar
  unit: m
- macro: \ReachableWorkspace
  latex: \mathcal{W}
  definition: set of end-effector poses the manipulator can reach given its link dimensions, joint travel
    limits and mounting
  kind: set
  notes: Not a disturbance set, which other chapters also write with W.
- macro: \ReadEndSequenceCount
  latex: c_{\text{end}}
  definition: value of a sequence-lock counter a reader loads after copying the shared slot
  kind: count
  notes: A change from \ReadStartSequenceCount means a writer preempted the copy and the snapshot is torn.
- macro: \ReadStartSequenceCount
  latex: c_{\text{start}}
  definition: value of a sequence-lock counter a reader loads before copying the shared slot
  kind: count
  notes: The read is valid only if it is even and equals \ReadEndSequenceCount; an odd value means a write
    is in progress.
- macro: \RealTimeTaskIndex
  latex: i
  definition: position of one periodic task in a real-time task set, the index of its period, deadline
    and execution time
  kind: index
  notes: Written bare when the text names the task ('task $\RealTimeTaskIndex$'); as a subscript it is
    an ordinary index letter. Not \TaskIndex, the evaluation-task index of agentic chapters.
- macro: \RealityGapVector
  latex: \boldsymbol{\Delta}_{\text{sim2real}}
  definition: 'vector of the discrepancies between a simulator and the physical machine, one component
    per channel: dynamics, sensing, appearance and timing'
  kind: vector
  unit: varies
  notes: Components \DynamicsRealityGap, \SensingRealityGap, \AppearanceRealityGap, \TimingRealityGap,
    each in its own units, so the vector has no single unit. Not \FiniteChange.
- macro: \RealizedActuatorEffort
  latex: u_{\text{act}}
  definition: force or torque an actuator actually realizes, the commanded effort clipped to its envelope
  kind: scalar
  unit: varies
  notes: A nonzero $u_{\text{cmd}} - u_{\text{act}}$ flags saturation.
- macro: \RealizedDampingPower
  latex: P_d
  definition: conservative lower bound on the damping power the actuators actually realize, credited to
    the energy tank
  kind: scalar
  unit: W
- macro: \ReceiptSampleIndex
  latex: t_{\text{recv}}
  definition: index of the IMU sample whose capture time is nearest a delayed observation's receipt
  kind: index
  notes: 08_perception uses $t_{\text{recv}}$ for the arrival timestamp itself, a time.
- macro: \ReceiverTimingJitter
  latex: \sigma_{\Delta t}
  definition: standard deviation of the time at which a lidar receiver's discriminator registers a returning
    pulse
  kind: scalar
  unit: s
- macro: \RecordedAuthorityState
  latex: S_{\text{auth}}
  definition: active discrete authority state recorded in the per-tick evidence tuple
  kind: record
  notes: Logged value of \ChannelAuthorityState.
- macro: \RecoveryCompletionInstant
  latex: t_{\text{rec}}
  definition: time at which a post-takeover recovery completes and the episode returns to the nominal
    corridor
  kind: scalar
  unit: s
- macro: \RecoveryPoseTolerance
  latex: \epsilon_{\text{sync}}
  definition: largest distance allowed between a new proposal's first waypoint and the robot's measured
    rest configuration when proposal authority is restored
  kind: scalar
  unit: varies
  notes: In the units of the joint coordinates (rad or m). Not the clock-conversion error bound written
    with the same glyph in the appendices.
- macro: \ReducedBoundaryConditionVector
  latex: \mathbf{b}_{\text{red}}
  definition: boundary-condition vector of the reduced system for the three highest polynomial coefficients,
    after the initial-condition terms are substituted
  kind: vector
- macro: \ReducedImpactMass
  latex: m_{\text{red}}
  definition: two-body reduced mass of a collision between the robot and a body part
  kind: scalar
  unit: kg
  notes: $(1/m_{\text{eff}} + 1/m_H)^{-1}$.
- macro: \ReferenceJointAccelerations
  latex: \ddot{\mathbf{q}}^{\text{ref}}
  definition: second time derivative of the reference joint trajectory, the feedforward acceleration of
    computed torque control
  kind: vector
- macro: \ReferenceJointPosition
  latex: q_{\text{reference}}
  definition: position of one joint along the active reference trajectory
  kind: scalar
  unit: rad
  notes: Its change over the planning delay is the gap a stale anchor leaves. Not \ReferencePosition (Cartesian).
- macro: \ReferenceJointPositions
  latex: \mathbf{q}^{\text{ref}}
  definition: time-varying reference trajectory of joint positions that a tracking controller follows
  kind: vector
  notes: Its derivatives are \ReferenceJointVelocities and \ReferenceJointAccelerations. A stepped setpoint
    is \JointPositionSetpoint.
- macro: \ReferenceJointVelocities
  latex: \dot{\mathbf{q}}^{\text{ref}}
  definition: time derivative of the reference joint trajectory
  kind: vector
- macro: \ReferencePosition
  latex: \mathbf{r}
  definition: commanded Cartesian position the tracked point should follow
  kind: vector
  unit: m
  notes: Used in the tracking-error norm against \CartesianPosition, in the same frame.
- macro: \ReferenceWindingResistance
  latex: R_0
  definition: winding resistance at the reference temperature, the base of copper's linear resistance
    law
  kind: scalar
  unit: Ohm
  notes: With \CopperTemperatureCoefficient and \CopperReferenceTemperature, $\ElectricalResistance(\WindingTemperature)
    = R_0 [1 + \alpha_{\text{Cu}}(T - T_0)]$.
- macro: \ReflectedContactForce
  latex: F_{\text{contact}}
  definition: contact force measured at the follower arm and reflected back to the leader device
  kind: scalar
  unit: N
- macro: \ReflectedRotorInertia
  latex: J_{\text{ref}}
  definition: apparent inertia of a motor rotor seen at the joint output, scaled by the square of the
    gear ratio
  kind: scalar
  unit: kg*m^2
- macro: \ReflectedRotorInertiaMatrix
  latex: \mathbf{J}_m
  definition: diagonal matrix of motor rotor inertias reflected through each gear reduction to the link
    side
  kind: matrix
  unit: kg*m^2
  notes: Diagonal entries are \JointReflectedRotorInertia. Not the manipulator Jacobian \ManipulatorJacobian.
- macro: \ReflectedTransmissionInputInertia
  latex: J_{\text{ref,in}}
  definition: apparent inertia of the motor rotor and transmission input stage seen at the joint output
  kind: scalar
  unit: kg*m^2
  notes: Gear ratio squared times TransmissionInputInertia; distinct from rotor-only ReflectedRotorInertia.
- macro: \ReflectionAngle
  latex: \theta_{\text{refl}}
  definition: angle between a specularly reflected ray and the surface normal
  kind: scalar
  unit: rad
- macro: \ReflexCollisionBudget
  latex: T_{\text{reflex\_budget}}
  definition: time the permission tick reserves for the every-tick local collision check over all hulls
  kind: scalar
  unit: s
- macro: \RegeneratedBrakingEnergy
  latex: E_{\text{regen}}
  definition: share of a machine's kinetic energy that regenerative braking returns to the DC bus
  kind: scalar
  unit: J
  notes: Without a battery path it must be absorbed by bus capacitance or dissipated by a brake chopper.
- macro: \RegenerativeBrakingTorque
  latex: \tau_{\text{brake}}
  definition: torque the motor applies to decelerate its load during a regenerative stop
  kind: scalar
  unit: N*m
- macro: \RegenerativeRecoveryEfficiency
  latex: \eta_{\text{regen}}
  definition: fraction of mechanical kinetic energy a decelerating motor returns to the DC bus as electrical
    energy
  kind: scalar
  unit: dimensionless
- macro: \RelativeStandardError
  latex: r
  definition: standard deviation of an estimate divided by the quantity it estimates
  kind: scalar
  unit: dimensionless
- macro: \ReliableDetectionFrameCount
  latex: N_{\text{frames}}
  definition: number of consecutive camera frames a person must stay in view before the probability that
    the detector has missed them in every frame falls to the allowed miss probability
  kind: count
  notes: The smallest count whose all-miss probability, (1 - \PerFrameDetectionProbability) raised to it,
    is at most \DetectorMissProbability.
- macro: \RemainingDistanceEstimate
  latex: \hat{s}
  definition: estimate of the remaining distance to the rack-end upright
  kind: scalar
  unit: m
  notes: The prior before an update carries a minus superscript.
- macro: \RemainingExecutionLease
  latex: T_{\text{lease,rem}}
  definition: 'time left on the active execution lease: the lease length minus the time elapsed since
    its last accepted renewal'
  kind: scalar
  unit: s
  notes: Field of the per-tick evidence tuple.
- macro: \RemainingHarmDistance
  latex: d_{\text{rem}}
  definition: distance remaining to the point of harm when the observation that distinguishes a hazardous
    state from a safe one arrives
  kind: scalar
  unit: m
  notes: An emergency stop fits only if it covers the travel during enforcer compute and actuator response
    plus the braking distance.
- macro: \RemainingIntentTime
  latex: T_{\text{rem}}
  definition: time remaining until the intent lease expires, measured from now
  kind: scalar
  unit: s
  notes: Equals \IntentLeaseExpiry minus \CurrentTime. Not the execution-lease remainder $T_{\text{lease,rem}}$.
- macro: \RemainingUprightDistance
  latex: s
  definition: remaining distance from the mobile base to the rack-end upright, the scalar state of the
    worked Kalman filter
  kind: scalar
  unit: m
- macro: \RenderedPixelColor
  latex: C
  definition: color rendered at one pixel by front-to-back alpha blending of the Gaussians that overlap
    it
  kind: function
  unit: dimensionless
  notes: Argument is the pixel.
- macro: \RenewalJitterAllowance
  latex: T_{\text{jitter}}
  definition: allowance for variation in the interval between successive chunk admissions
  kind: scalar
  unit: s
  aliases:
  - \RenewaljitterAllowance
- macro: \ReplacementLatency
  latex: L
  definition: time from the capture of the observation a candidate trajectory rests on to that candidate's
    admission into the execution queue
  kind: scalar
  unit: s
  notes: Equals \ObservationAge plus \DispatchAdmissionInterval. A latency, not a period; bare $L$ elsewhere
    is \Loss.
- macro: \ReplacementTimingReserve
  latex: T_{\text{reserve}}
  definition: time reserved for scheduling slack before preferred replacement admission and the physical decision-to-stop-onset allowance
  kind: scalar
  unit: s
  notes: This complete replacement reserve includes both pre-admission scheduling slack and decision-to-onset response; it is not solely the latter interval.
- macro: \ReplanRequestOffset
  latex: T_{\text{request}}
  definition: time after the active chunk begins executing at which the planner dispatches the request
    for its successor
  kind: scalar
  unit: s
- macro: \ReplayedErrorCovariance
  latex: \mathbf{P}_{t_{\text{recv}}}
  definition: error covariance at the receipt sample after propagating the corrected covariance across
    the replay interval
  kind: matrix
- macro: \ReplayedStateEstimate
  latex: \hat{\mathbf{x}}_{t_{\text{recv}}}
  definition: state estimate at the receipt sample after replaying the buffered inputs from the capture
    sample
  kind: vector
- macro: \ReprojectionResidual
  latex: \epsilon_{\text{reproj}}
  definition: pixel distance between where calibration and joint encoders place a robot-link point and
    where the camera observes it
  kind: scalar
  unit: pixels
- macro: \RepublicationIndex
  latex: k
  definition: position of one republication in the sequence a transport node emits from a cached message
  kind: index
- macro: \RepublicationPeriod
  latex: T_{\text{rep}}
  definition: period at which a transport node republishes a cached message under fresh timestamps
  kind: scalar
  unit: s
- macro: \RequestedActionTap
  latex: a_{\text{req}}
  definition: first stream of the four-stream action tap, the raw policy or operator request before kinematic
    mapping
  kind: record
- macro: \RequiredClearance
  latex: C_{\text{safe}}
  definition: physical clearance the true obstacle must keep from the machine's envelope, such as the
    base's side clearance
  kind: scalar
  unit: m
  notes: \ClearanceInset adds the qualified error quantile to it. Compare \ProtectiveClearanceMargin (see
    questions).
- macro: \RequiredDetectionRange
  latex: d_{\text{detect}}
  definition: smallest range at which a forward detector must report a hazard ahead of the machine for
    the stop to fit
  kind: scalar
  unit: m
  notes: Travel during the detection interval plus the known-component stop distance at that speed.
- macro: \RequiredPremiseClaim
  latex: P
  definition: one required premise of a conjunctive assurance argument, a child claim that must hold for
    its parent claim to hold
  kind: record
  notes: Indexed $\RequiredPremiseClaim_i$; the parent is \AssuranceClaim. Its confidence is \RequiredPremiseConfidence.
- macro: \RequiredPremiseConfidence
  latex: p
  definition: probability, as assessed confidence, that one required premise of a conjunctive assurance
    argument holds
  kind: scalar
  unit: dimensionless
  notes: Indexed $p_i$; under independence the claim confidence is their product.
- macro: \RequiredPremiseCount
  latex: n
  definition: number of independent required premises that jointly support a claim in a conjunctive assurance
    argument
  kind: count
- macro: \RequiredScenarioCellCount
  latex: N_{\text{req}}
  definition: number of cells in the scenario table that deployment requires
  kind: count
- macro: \RequiredScenarioSet
  latex: \mathcal{S}_{\text{req}}
  definition: set of scenario-table cells, the operating conditions deployment requires the dataset to
    support
  kind: set
- macro: \ResetCalibrationTime
  latex: t_{\text{calibration}}
  definition: time to recalibrate sensors and joint encoders between trials, part of the reset latency
  kind: scalar
  unit: s
- macro: \ResetDuration
  latex: t_{\text{rst}}
  definition: duration of the scene reset between demonstration attempts
  kind: scalar
  unit: s
- macro: \ResetLatency
  latex: T_{\text{reset}}
  definition: 'time to restore a physical test cell between trials: physical restoration, recalibration
    and telemetry flush'
  kind: scalar
  unit: s
  notes: Defined as $t_{\text{physical\_restore}} + t_{\text{calibration}} + t_{\text{telemetry\_flush}}$;
    a per-trial overhead that, with the rollout time, sets a campaign's wall-clock cost.
- macro: \ResidentStopDistance
  latex: d_{\text{suffix}}
  definition: distance the resident stop travels from speed v to rest once braking begins
  kind: scalar
  unit: m
  notes: $v^2/(2a_{\text{brake}})$ for constant deceleration; the jerk-limited profile adds a term.
  aliases:
  - \ResidentStopDistanceSuffix
- macro: \ResidualCorrectionCeiling
  latex: \Delta_{\max}
  definition: largest norm the gated residual correction may add to the base policy's action
  kind: scalar
  unit: varies
  notes: In the units of the action. Bounds one dimension of authority only.
- macro: \ResidualDynamicsPerturbation
  latex: \Delta \mathbf{f}
  definition: generalized force left uncancelled when computed torque control uses estimated rather than
    true inertia, Coriolis and gravity terms
  kind: vector
  notes: Entries in N*m; robust or adaptive inner loops must reject it. The macro spans both the Delta
    and the bold f.
- macro: \ResidualFrequencyError
  latex: \Delta f_{\text{res}}
  definition: bound on the follower clock's frequency error left after servo correction
  kind: scalar
  unit: Hz
- macro: \ResidualGate
  latex: g
  definition: deterministic switch that admits a learned residual correction only inside the certified
    contact region
  kind: scalar
  unit: dimensionless
  notes: Takes values 0 or 1; identically zero in free space.
- macro: \ResidualPolicyTorque
  latex: \boldsymbol{\tau}_{\text{res},\theta}
  definition: joint torque a learned residual policy with parameters theta adds to the analytical computed-torque
    command
  kind: vector
  notes: Entries in N*m. Needs an amplitude or energy bound to keep the nominal controller's stability.
- macro: \ResponseTimeIterationIndex
  latex: \ell
  definition: iteration number of the fixed-point recurrence that computes a task's worst-case response
    time
  kind: index
  notes: Written as a parenthesized superscript, $R_i^{(\ResponseTimeIterationIndex)}$.
- macro: \RestConfiguration
  latex: \mathbf{q}_{\text{rest}}
  definition: joint configuration the robot is confirmed to hold at rest after a fault stop
  kind: vector
  unit: varies
  notes: Published by the safety microcontroller during the recovery handshake; a new proposal must start
    within \RecoveryPoseTolerance of it.
- macro: \RestitutionCoefficient
  latex: e
  definition: ratio of separation speed to approach speed in an impact
  kind: scalar
  unit: dimensionless
  notes: Renders $e$, which the book also uses as the exponential base; avoid it next to exponentials.
  aliases:
  - \CoefficientOfRestitution
- macro: \RestrictedAccelerationBound
  latex: a_{\text{restricted}}
  definition: largest acceleration a signed restricted release case admits, validated with the rest of
    its configuration before release
  kind: scalar
  unit: m/s^2
- macro: \RestrictedSpeedBound
  latex: v_{\text{restricted}}
  definition: largest speed a signed restricted release case admits, validated with the rest of its configuration
    before release
  kind: scalar
  unit: m/s
- macro: \RetiringChunkJointVelocity
  latex: \dot{q}_A
  definition: reference velocity of one joint along the retiring trajectory chunk at a seam
  kind: scalar
  unit: rad/s
- macro: \RetiringChunkReferenceState
  latex: \mathbf{x}_A
  definition: reference plant state along the retiring trajectory chunk at a seam, as a function of time
  kind: vector
- macro: \ReturnLevel
  latex: z
  definition: level of a performance metric exceeded on average once per return period, written with the
    return period as subscript
  kind: scalar
  unit: varies
  notes: Units of the monitored performance metric (m for a distance overshoot).
- macro: \ReturnPeriodTrialCount
  latex: T
  definition: return period of an extreme value, the number of trials over which its level is exceeded
    once on average
  kind: count
- macro: \ReverseTransitionCovariance
  latex: \boldsymbol{\Sigma}
  definition: covariance of the Gaussian reverse transition at one diffusion step
  kind: matrix
  notes: Indexed by \DiffusionStepIndex; commonly fixed to a multiple of the identity.
- macro: \ReverseTransitionMean
  latex: \boldsymbol{\mu}_\theta
  definition: mean of the learned Gaussian reverse transition from one diffusion step to the previous,
    given the noisy chunk, observation history and step
  kind: vector
  notes: Computed from \NoisePredictionNetwork. Written as a vector though it has the shape of an action
    chunk.
- macro: \Reward
  latex: r
  definition: per-step reward an engineer writes for policy search
  kind: scalar
  unit: dimensionless
  notes: The stage cost of control is its negative. Distinct from \BarrierRelativeDegree, which also renders
    $r$.
- macro: \RewardFunction
  latex: r
  definition: function that assigns a scalar reward to taking an action in a state of a decision process
  kind: function
  unit: dimensionless
  notes: Its value at step t is \Reward. Not \TrajectoryReturn, which this appendix also writes R with
    a trajectory argument; not \PomdpRewardFunction (sans-serif R).
- macro: \RightEvasionAction
  latex: \mathbf{a}_{\text{right}}
  definition: demonstrated action that steers a mobile manipulator around an obstacle on the right
  kind: vector
  notes: The other mode of the bimodal demonstration paired with \LeftEvasionAction.
- macro: \RigidImpactInstant
  latex: t_{\text{impact}}
  definition: time at which an idealized rigid impact occurs, across which velocity jumps
  kind: scalar
  unit: s
  notes: Not the drift time to a lateral impact in 07_evaluation, which shares the glyph.
- macro: \RigidTransformTranslation
  latex: \mathbf{t}
  definition: translation part of a rigid transform between two frames
  kind: vector
  unit: m
  aliases:
  - \RigidtransformTranslation
- macro: \RingBufferHorizon
  latex: T_{\text{buffer}}
  definition: oldest observation age an out-of-sequence ring buffer can still roll back to
  kind: scalar
  unit: s
- macro: \RingBufferSlotCount
  latex: N_{\text{buffer}}
  definition: number of IMU-sample slots an out-of-sequence ring buffer holds
  kind: count
- macro: \RmsMotorTorque
  latex: \tau_{\text{rms}}
  definition: root-mean-square motor torque over one duty cycle, the torque whose square sets the cycle's
    copper heating
  kind: scalar
  unit: N*m
  notes: Must stay under the continuous rating; the peak need not.
- macro: \RobotAction
  latex: \mathbf{a}
  definition: action vector a learned robot policy emits, written without a step index, as the argument
    of a policy, value function or action distribution
  kind: vector
  notes: Same quantity as \CognitivePolicyAction, which takes its step index explicitly ($\mathbf{a}_t$).
    Not \ActivationVector or \AttentionWeightVector, which also render $\mathbf{a}$.
- macro: \RobotApproachSpeed
  latex: v_r
  definition: speed of the robot toward the person, the robot term of the speed-and-separation distance
  kind: scalar
  unit: m/s
  notes: ISO/TS 15066 robot speed; for the arm, its tool-center-point speed.
- macro: \RobotApproachVelocity
  latex: v_{\text{robot}}
  definition: rate at which the robot position advances toward an obstacle along the line of approach,
    the velocity integrated from actuation in a clearance barrier
  kind: scalar
  unit: m/s
  notes: Time derivative of \RobotPosition; with a stationary \ObstaclePosition the clearance rate is
    its negative. Not \SpeedAtDetection, the speed at the instant a hazard is detected, nor \RobotApproachSpeed,
    the speed-and-separation term toward a person.
- macro: \RobotObservation
  latex: \mathbf{o}
  definition: observation vector a robot policy receives from its sensors, written without a step index
  kind: vector
  notes: Same quantity as \MultimodalObservation, which takes its step index explicitly ($\mathbf{o}_t$).
- macro: \RobotPosition
  latex: x_{\text{robot}}
  definition: position of the robot along the line of approach to an obstacle
  kind: scalar
  unit: m
- macro: \RobotPositionUncertainty
  latex: Z_r
  definition: position uncertainty of the robot
  kind: scalar
  unit: m
  notes: Term of the ISO/TS 15066 protective separation distance S_p = S_h + S_r + S_s + C + Z_d + Z_r.
- macro: \RobotReactionTime
  latex: T_r
  definition: time from the separation sensor detecting a person to the onset of robot braking, in the
    speed-and-separation distance
  kind: scalar
  unit: s
  notes: ISO/TS 15066 reaction time. Valued here by the vision-path pre-brake delay; a certified implementation
    must bound it with safety-rated sensing.
- macro: \RobotReactionTravel
  latex: S_r
  definition: distance a robot travels during its reaction time before stopping begins
  kind: scalar
  unit: m
  notes: Term of the ISO/TS 15066 protective separation distance S_p = S_h + S_r + S_s + C + Z_d + Z_r.
- macro: \RobotSensorObservation
  latex: \mathbf{o}
  definition: robot's synchronized sensor observation, written with the step it belongs to as a subscript
  kind: vector
- macro: \RobotStoppingTravel
  latex: S_s
  definition: distance a robot travels while stopping
  kind: scalar
  unit: m
  notes: Term of the ISO/TS 15066 protective separation distance S_p = S_h + S_r + S_s + C + Z_d + Z_r.
- macro: \RobotStructuralStiffness
  latex: k_{\text{robot}}
  definition: stiffness of the manipulator side of a contact, its pads, linkages and joint elasticity
    acting as one series spring
  kind: scalar
  unit: N/m
  notes: Combines in series with the struck body's stiffness to give \EffectiveSeriesStiffness; a star
    marks the break-even value.
- macro: \RobotTransitVolume
  latex: \mathcal{T}_{\text{robot}}
  definition: region the robot sweeps along a candidate corridor up to a given elapsed time
  kind: set
- macro: \RollingShutterDistortion
  latex: \Delta \mathbf{x}
  definition: apparent displacement of an image row caused by platform motion during rolling-shutter readout
  kind: vector
  unit: m
  notes: Velocity times row index times row readout time. Kind is vector but the LaTeX $\Delta \mathbf{x}$
    does not start bold.
- macro: \RollingShutterFrameSkew
  latex: \Delta t_{\text{skew}}
  definition: time between the exposures of the first and last rows of one rolling-shutter frame
  kind: scalar
  unit: s
  notes: The Delta is part of the symbol.
- macro: \RollingShutterRowReadout
  latex: t_{\text{row}}
  definition: time between the exposure of adjacent rows of a rolling-shutter sensor
  kind: scalar
  unit: s
- macro: \RolloutActionSequence
  latex: \mathbf{a}_{0:T}
  definition: sequence of actions a policy takes in a rollout from its first step to its horizon
  kind: matrix
  notes: One row per step; elements are \CognitivePolicyAction. $T$ is the rollout horizon, not \Time.
- macro: \RolloutHorizon
  latex: T
  definition: number of control steps in one executed rollout, the index of its final state
  kind: count
  notes: Not a duration. Distinct from \BehaviorCloningHorizon (episode length over which imitation error
    compounds) and \ActionChunkHorizon.
- macro: \RolloutStateSequence
  latex: s_{0:T}
  definition: sequence of world states a rollout visits from its first step to its horizon
  kind: record
  notes: Renders as the chapter does today; $T$ is the rollout horizon, written as a glyph so the entry
    does not borrow \Time. Elements are \PhysicalWorldState.
- macro: \RolloutStepCount
  latex: N
  definition: last step index of a simulated rollout, the number of steps after the initial state over
    which its loss is summed
  kind: count
- macro: \RolloutStepIndex
  latex: k
  definition: position of one control step in a rollout, counted from zero to the horizon
  kind: index
  notes: Used as the exponent of \DiscountFactor, $\DiscountFactor^{\RolloutStepIndex}$. Not \TimeInstant.
- macro: \RotatingBodyAngularSpeed
  latex: \omega
  definition: angular speed of a spinning component about its axis
  kind: scalar
  unit: rad/s
  notes: Generic; a motor rotor's speed is \RotorAngularSpeed.
- macro: \RotatingBodyInertia
  latex: J
  definition: moment of inertia of a rotating component about its axis
  kind: scalar
  unit: kg*m^2
  notes: Generic; a motor rotor is \RotorInertia and a driven load \LoadInertia.
- macro: \RotationOriginAcceleration
  latex: \mathbf{a}_O
  definition: linear acceleration of the rotation origin of a rigid body
  kind: vector
  unit: m/s^2
- macro: \RotationOriginVelocity
  latex: \mathbf{v}_O
  definition: linear velocity of the rotation origin of a rigid body
  kind: vector
  unit: m/s
  notes: Specialization of \Velocity.
- macro: \RotationalKineticEnergy
  latex: E_{k,\text{rot}}
  definition: kinetic energy stored in a machine's spinning wheels, gearboxes and motor rotors
  kind: scalar
  unit: J
  notes: Sum over drives of one half rotor inertia times rotor angular speed squared.
- macro: \RotationalSpringStiffness
  latex: K
  definition: stiffness of a spring element in a mechanical impedance
  kind: scalar
  unit: N*m/rad
  notes: Generic; a transmission's own stiffness is \TransmissionTorsionalStiffness.
- macro: \RotorAngularSpeed
  latex: \omega_m
  definition: angular speed of a motor rotor about its axis
  kind: scalar
  unit: rad/s
  notes: Sets the back-EMF through \MotorBackEmfConstant; on a direct-drive hub motor it equals the wheel's
    angular speed.
- macro: \RotorInertia
  latex: J_{\text{rotor}}
  definition: moment of inertia of a motor rotor about its axis
  kind: scalar
  unit: kg*m^2
  aliases:
  - \RotorAndLoadInertia
- macro: \RotorPolePairCount
  latex: N_{\text{poles}}
  definition: number of magnetic pole pairs on a motor rotor
  kind: count
- macro: \RowAttitudeIncrement
  latex: \Delta \boldsymbol{\theta}_{\text{att}}
  definition: rotation a rolling-shutter camera accumulates between the first row's exposure and a given
    row's
  kind: vector
  unit: rad
  notes: 'One symbol: the Delta site and the bold theta site both take this macro.'
- macro: \RowConflictCount
  latex: N_{\text{conflict}}
  definition: number of DRAM row conflicts among the transactions queued ahead of a read, each a request
    to a different row of a bank whose row is already open, paying a precharge plus an activation
  kind: count
  notes: Multiplies $\RowPrechargeTime + \RowActivationDelay$ (about $\BankConflictPenalty$) in $\MemoryBusQueueDelay$.
    Shares the glyph of $\InterconnectPortConflicts$, which counts port arbitration collisions among bus
    masters, not row conflicts.
- macro: \RowExposureMidpointTime
  latex: t_{\text{row}}
  definition: time at which one row of a rolling-shutter frame is at the midpoint of its exposure
  kind: function
  unit: s
  notes: Written with the row index as its argument, $\RowExposureMidpointTime(\SensorRowIndex)$.
- macro: \RowExposureStartTime
  latex: t_{\text{scan}}
  definition: instant at which a given row of a rolling-shutter frame begins its exposure, as a function
    of the row index
  kind: function
  unit: s
  notes: Written $\RowExposureStartTime(\SensorRowIndex)$ with the row index as its argument.
- macro: \SCurveAccelerationPhaseTime
  latex: T_{\text{acc}}
  definition: duration of the constant-acceleration hold plus one jerk ramp of a rest-to-rest double-S
    profile without cruise, half its duration less one ramp
  kind: scalar
  unit: s
  notes: The distance covered is $\ProfileAccelerationBound\,\SCurveAccelerationPhaseTime\,(\SCurveAccelerationPhaseTime
    + \ProfileAccelerationBound/\JerkLimit)$ and the peak speed $\ProfileAccelerationBound\,\SCurveAccelerationPhaseTime$.
- macro: \SafeApproachSpeedEnvelope
  latex: v_{\text{safe}}
  definition: largest speed from which a machine can still brake to rest before a stopping boundary, as
    a function of its clearance to that boundary
  kind: function
  unit: m/s
  notes: Kinematic stopping envelope $v_{\text{safe}}(z) \le \sqrt{2 a_{\text{brake}} z}$; falls to zero
    at the boundary.
- macro: \SafeControlSet
  latex: \mathcal{U}_{\text{safe}}
  definition: set of control inputs that satisfy every active barrier constraint and the actuator limits
    at the current state
  kind: set
  notes: Subset of the admissible control set; empty when actuator saturation leaves no command that keeps
    the barrier condition, which selects a fallback.
