  aliases:
  - \SinglestepImitationError
- macro: \SpecialEuclideanGroup
  latex: SE(3)
  definition: group of rigid-body transformations in three dimensions, rotations combined with translations
  kind: set
  notes: Upright $SE(3)$ by convention, not calligraphic.
  render_exception: Lie groups are written upright by convention, SE(3) and SO(3).
- macro: \SpecialOrthogonalGroup
  latex: SO(3)
  definition: group of three-by-three rotation matrices, orthogonal with determinant one
  kind: set
  notes: Upright $SO(3)$ by convention, not calligraphic.
  render_exception: Lie groups are written upright by convention, SE(3) and SO(3).
- macro: \SpeedAtDetection
  latex: v
  definition: speed of the machine at the moment the hazard is detected
  kind: scalar
  unit: m/s
  notes: Speed of the machine at the moment the hazard is detected.
- macro: \SpeedBound
  latex: v_{\max}
  definition: largest speed the machine, a tracked object or an approaching body is credited with in a
    budget
  kind: scalar
  unit: m/s
- macro: \SprtLowerBoundary
  latex: \Lambda_{\text{lo}}
  definition: lower stopping threshold of a sequential probability ratio test, below which the test accepts
    the null hypothesis
  kind: scalar
  unit: dimensionless
  notes: Approximately $\ln(\beta/(1-\alpha))$ on the log-likelihood scale.
  aliases:
  - \SprtBoundariesLo
- macro: \SprtUpperBoundary
  latex: \Lambda_{\text{up}}
  definition: upper stopping threshold of a sequential probability ratio test, above which the test accepts
    the alternative
  kind: scalar
  unit: dimensionless
  notes: Approximately $\ln((1-\beta)/\alpha)$ on the log-likelihood scale.
  aliases:
  - \SprtBoundariesUp
- macro: \StateSpaceInputMatrix
  latex: \mathbf{B}
  definition: input matrix of a linear state-space model, mapping control inputs to state rates
  kind: matrix
  notes: In $\dot{\mathbf{x}} = \mathbf{A}\mathbf{x} + \mathbf{B}\mathbf{u}$; the system matrix is \StateSpaceSystemMatrix
    and the output matrix is \MeasurementMatrix.
  aliases:
  - \LinearStatespaceMatrices
- macro: \StateSpaceSystemMatrix
  latex: \mathbf{A}_{\text{sys}}
  definition: system matrix of a linear state-space model, governing the unforced state dynamics
  kind: matrix
  aliases:
  - \LinearStatespaceMatricesSys
- macro: \StateTransitionMatrix
  latex: \mathbf{F}
  definition: discrete-time matrix that propagates the state one step forward in a Kalman filter
  kind: matrix
- macro: \StatorThermalCapacitance
  latex: C_{\text{th}}
  definition: heat capacity of the motor stator and winding, energy per degree of temperature rise
  kind: scalar
  unit: J/K
  notes: With thermal resistance it sets \ThermalTimeConstant.
- macro: \StoppingDistance
  latex: d_{\text{stop}}
  definition: distance the machine travels from hazard detection to rest, including travel during the
    pre-brake delay
  kind: scalar
  unit: m
  notes: $v\tau_{\text{delay}} + v^2/(2a_{\text{brake}})$ in the elementary budget, plus localization
    and clearance terms in the full one.
- macro: \StoppingDuration
  latex: T_{\text{stop}}
  definition: time from braking onset to standstill
  kind: scalar
  unit: s
  notes: Used in the protective-separation distance; distinct from the controller sampling period.
- macro: \SustainedMemoryBandwidth
  latex: \text{BW}_{\text{mem}}
  definition: memory bandwidth achievable in practice under the target access pattern
  kind: scalar
  unit: bytes/s
  notes: LPDDR or HBM on the SoC or accelerator; below the datasheet peak.
- macro: \SynchronizationBlackout
  latex: T_{\text{blackout}}
  definition: interval during which a node receives no synchronization message and runs on its own clock
  kind: scalar
  unit: s
- macro: \SystemHazardRate
  latex: \lambda_{\text{system}, h}
  definition: rate of hazardous events of class h for the whole system, after the shield
  kind: scalar
  unit: 1/h
- macro: \TakeoverResponseTime
  latex: T_{\Sigma, 1}
  definition: time a human operator needs to take over control after a handover request
  kind: scalar
  unit: s
  notes: Meaning inferred from the name; the subscript in the LaTeX is unexplained.
- macro: \TangentialContactShear
  latex: \mathbf{f}_{k, \parallel}
  definition: friction component of a contact force, tangential to the contact plane
  kind: vector
  unit: N
- macro: \TargetHazardRate
  latex: \lambda_{\text{target}}
  definition: tolerable dangerous failure rate assigned to a safety function by risk assessment
  kind: scalar
  unit: 1/h
- macro: \TargetTravelDistance
  latex: d
  definition: straight-line distance from the measured end-effector position to the admitted target
  kind: scalar
  unit: m
  notes: Used in the intent-lease reachability test, distance over speed bound within the remaining lease.
- macro: \TargetTrialSuccessProbability
  latex: p_{\text{target}}
  definition: per-trial success probability a test campaign must demonstrate
  kind: scalar
  unit: dimensionless
  notes: Sets the zero-failure trial count through $n \ge \ln\alpha/\ln p_{\text{target}}$.
  aliases:
  - \PertrialProbabilitiesTarget
- macro: \TelemetryFreshnessBound
  latex: \Delta t_{\text{fresh}}
  definition: largest age a measurement may reach before acting on it introduces intolerable error
  kind: scalar
  unit: s
  notes: Error ceiling over speed bound.
- macro: \TemporalEnsemblingWeight
  latex: w_i
  definition: weight given to the prediction of a past chunk at offset i when blending overlapping chunks
  kind: scalar
  unit: dimensionless
  notes: Exponential decay, $w_i = \exp(-m i)$.
- macro: \ThermalResistance
  latex: R_{\text{th}}
  definition: lumped thermal resistance from the stator windings to ambient, temperature rise per watt
  kind: scalar
  unit: K/W
- macro: \ThermalTimeConstant
  latex: \tau_{\text{th}}
  definition: characteristic time for a motor winding to heat or cool, thermal resistance times thermal
    capacitance
  kind: scalar
  unit: s
  notes: Typically 60 to 300 s.
- macro: \TimingJitter
  latex: \sigma_{\text{jitter}}
  definition: standard deviation of a nominally periodic event's timing about its schedule
  kind: scalar
  unit: s
- macro: \TorqueProducingCurrent
  latex: i_q
  definition: quadrature-axis current of a field-oriented drive, the current component that produces torque
  kind: scalar
  unit: A
  aliases:
  - \TorqueproducingCurrent
- macro: \TrackingErrorBound
  latex: \epsilon_{\text{track}}
  definition: bound on the distance between the commanded and the executed position of the tracked point
  kind: scalar
  unit: m
  notes: Stated by the enforcement record with its validity envelope.
  aliases:
  - \TrackingerrorBound
- macro: \TrajectoryDivergenceResidual
  latex: e_{\text{div}}
  definition: signed error between measured and planned kinematics used to detect a diverging rollout
  kind: scalar
  unit: m
  notes: For the latch example, the lateral gripper-position error in the fixture frame.
- macro: \TrialCount
  latex: N
  definition: number of physical trials in a learning or evaluation campaign
  kind: count
  notes: As in the wall-clock law $T_{\text{wall}} = N(t_{\text{rollout}} + t_{\text{reset}})/N_{\text{rig}}$.
    Not the zero-failure demonstration count \ZeroFailureTrialCount.
- macro: \TrialFailureProbability
  latex: p_{\text{fail}}
  definition: probability that one physical trial fails
  kind: scalar
  unit: dimensionless
  aliases:
  - \PertrialProbabilitiesFail
- macro: \TrichotomyMonitorState
  latex: \mathcal{T}_{\text{trichotomy}}
  definition: 'set of three verdicts a runtime monitor can return: known true, known false, or unknown'
  kind: set
- macro: \TruncatedSignedDistance
  latex: \text{tsdf}
  definition: signed distance from a voxel to the nearest surface, divided by the truncation band and
    clamped to plus or minus one
  kind: function
  unit: dimensionless
  notes: Truncation band is \TsdfTruncationBand.
  aliases:
  - \TruncatedSignedDistanceVox
- macro: \TsdfAccumulatedDistance
  latex: D
  definition: running weighted average of the truncated signed distance at a voxel after t frames
  kind: function
  unit: dimensionless
- macro: \TsdfAccumulatedWeight
  latex: W
  definition: accumulated observation weight at a voxel after t frames
  kind: function
  unit: dimensionless
  aliases:
  - \TsdfAccumulatedVolumeVox
- macro: \TsdfTruncationBand
  latex: \mu_{\text{tsdf}}
  definition: distance from a surface within which signed distances are stored rather than clamped
  kind: scalar
  unit: m
  notes: Metric thickness of the spatial surface interface band stored in voxel memory.
- macro: \UnbrakedImpactForce
  latex: F_{\text{unbraked}}
  definition: peak transient contact force when the robot strikes a body at speed without braking
  kind: scalar
  unit: N
  notes: $v\sqrt{k_H m_{\text{red}}}$, the ISO/TS 15066 transient model.
- macro: \UnitQuaternion
  latex: \mathbf{q}_{\text{quat}}
  definition: four-component unit-norm vector representing an orientation
  kind: vector
  unit: dimensionless
- macro: \Velocity
  latex: \mathbf{v}
  definition: linear velocity of a point or body
  kind: vector
  unit: m/s
  notes: Subscripts name the point, e.g. end-effector velocity $\mathbf{v}_e$.
- macro: \VirtualDampingMatrix
  latex: \mathbf{D}_{\text{virt}}
  definition: damping matrix an impedance controller emulates, mapping joint velocity to opposing torque
  kind: matrix
  aliases:
  - \VirtualDampingAndStiffness
- macro: \VirtualStiffnessMatrix
  latex: \mathbf{K}_{\text{virt}}
  definition: stiffness matrix an impedance controller emulates, mapping displacement to restoring torque
  kind: matrix
  aliases:
  - \VirtualDampingAndStiffnessTwo
- macro: \VitPatchProjectionWeights
  latex: \mathbf{W}_{\text{patch}}
  definition: learned linear map from a flattened image patch to a token embedding in a vision transformer
  kind: matrix
  notes: Linear projection that maps image patches into the model's token representation.
- macro: \VitPositionEmbedding
  latex: \mathbf{E}_{\text{pos}}
  definition: embedding added to each patch token that encodes its row and column in the image
  kind: matrix
  aliases:
  - \VitProjectionPositionalBias
- macro: \VoxelCenterPosition
  latex: \mathbf{p}_{\text{vox}}
  definition: position of the center of one voxel of a volumetric map, the point at which a signed-distance
    field is evaluated
  kind: vector
  notes: Argument of $\TruncatedSignedDistance$, $\TsdfAccumulatedDistance$ and $\TsdfAccumulatedWeight$.
- macro: \WheelRadius
  latex: r
  definition: rolling radius of a driven wheel
  kind: scalar
  unit: m
