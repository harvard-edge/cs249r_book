  kind: function
  notes: Indexed by aggregation round, $\hat{\pi}_i$, in DAgger. The data chapter proposes \AggregationLearnedPolicy
    for the DAgger-only sense with the same LaTeX.
- macro: \ImitationTargetCommand
  latex: \mathbf{u}_{\text{target}}
  definition: supervised imitation target command for one recorded step, chosen per interval from the
    logged fields or supplied by an expert
  kind: vector
  notes: Not \CertifiedControlAction; in the stabilized interval it equals the human command.
- macro: \ImpactInstant
  latex: T
  definition: instant at which a collision occurs, the reference from which an incident timeline counts
