  definition: time at which the host operating system stamps a sensor packet on arrival
  kind: scalar
  unit: s
- macro: \HostHeartbeatRate
  latex: f_{\text{heartbeat}}
  definition: rate at which the application processor sends liveness pulses to the safety microcontroller
  kind: scalar
  unit: Hz
  notes: Missing pulses past the heartbeat timeout revoke the active proposal; a pulse never renews a
    chunk lease.
- macro: \HullQueryTime
  latex: t_{\text{query}}
  definition: time of one clearance query at the center of one collision hull
  kind: function
  unit: s
  notes: Written with the hull center as argument, $t_{\text{query}}(\mathbf{p}_k)$, or bare as the per-hull
    allocation.
- macro: \HullSphereRadius
  latex: r_{\text{hull}}
  definition: radius of one spherical collision hull
  kind: scalar
  unit: m
- macro: \HumanCommandRate
  latex: \dot{\mathbf{u}}_{\text{human}}
  definition: time derivative of the operator's command vector, the slew the stabilization test bounds
  kind: vector
  unit: varies
  notes: Jerk when the command is an acceleration.
- macro: \HumanControlCommand
  latex: \mathbf{u}_{\text{human}}
  definition: control command vector the human operator issues during manual control
  kind: vector
- macro: \HumanReactionTime
  latex: T_{\text{human}}
  definition: neuromuscular reaction time of a human teleoperator, from perceiving an obstacle to issuing
    a corrective command
  kind: scalar
  unit: s
  notes: Typically 150 to 250 ms. Not \TakeoverResponseTime, which also includes video and handshake.
- macro: \HumanWalkingSpeedBound
  latex: v_h
  definition: speed bound for a person approaching the machine, as the safety standard states it
  kind: scalar
  unit: m/s
- macro: \HydraulicSupplyPressure
  latex: p
  definition: pressure of the hydraulic fluid supplied to a cylinder
  kind: scalar
  unit: N/m^2
  notes: Not \LinearMomentum, which also renders p.
- macro: \HypothesizedTrialFailureProbability
  latex: p
  definition: per-trial failure probability a sequential probability ratio test specifies under one of
