# Notation registry: physical
# Physical AI: plant state, kinematics, contact, control, perception, embodied learning, real-time silicon.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AbsoluteConicImageEntry
  latex: B
  definition: one entry of the image-of-the-absolute-conic matrix, indexed B_{ij}
  kind: scalar
  unit: varies
  notes: Unit follows the intrinsic entries it combines.
- macro: \AbsoluteConicImageMatrix
  latex: \mathbf{B}
  definition: symmetric matrix K^{-T} K^{-1}, the image of the absolute conic, from which camera calibration
    recovers the intrinsics
  kind: matrix
  notes: Not \StateSpaceInputMatrix.
- macro: \AbsoluteConicVector
  latex: \mathbf{b}
  definition: six-vector of the distinct entries of the symmetric image-of-the-absolute-conic matrix
  kind: vector
- macro: \AccelerationNoiseDensityMatrix
  latex: \mathbf{Q}_c
  definition: continuous power spectral density matrix of a white acceleration noise process
  kind: matrix
  notes: Units m^2/s^3 per entry; isotropic form $q_c \mathbf{I}$.
- macro: \AccelerationNoiseSpectralDensity
  latex: q_c
  definition: continuous power spectral density of a zero-mean white acceleration noise, per axis
  kind: scalar
  unit: m^2/s^3
- macro: \AccelerationWhiteNoise
  latex: w
  definition: zero-mean continuous white acceleration noise driving a one-dimensional double-integrator
    model
  kind: scalar
  unit: m/s^2
- macro: \AccelerometerBias
  latex: b_a
  definition: constant offset of an accelerometer's output, which double integration turns into quadratically
    growing position error
  kind: scalar
  unit: m/s^2
- macro: \AccumulatedProcessNoiseCovariance
  latex: \mathbf{Q}_d
  definition: covariance that continuous process noise adds over an elapsed interval, the integral of
    the transition-propagated noise intensity
  kind: matrix
  notes: Function of elapsed time; the discrete-equivalent process noise covariance of the interval.
- macro: \AchievedBrakingDeceleration
  latex: a
  definition: deceleration the machine actually achieves while braking, bounded above by tire-floor friction
  kind: scalar
  unit: m/s^2
  notes: Its validated lower bound is \CredibleBrakingDeceleration.
- macro: \AcquisitionEpoch
  latex: t_{\text{acq}}
  definition: instant a sensor transduced one observation, such as a camera frame's exposure midpoint
    or an encoder latch
  kind: scalar
  unit: s
  notes: The evidence epoch \EvidenceEpoch of a belief is the latest acquisition epoch among the measurements
    that constrained it.
- macro: \ActVariationalObjective
  latex: \mathcal{L}_{\text{ACT}}
  definition: 'training objective of Action Chunking with Transformers: chunk reconstruction error plus
    a weighted KL penalty on the latent style variable'
  kind: function
  notes: Conditional VAE objective over encoder parameters $\phi$ and decoder parameters $\theta$; the
    reconstruction term is the $\ell_1$ norm of the action-chunk residual.
- macro: \ActionBinCount
  latex: B
  definition: number of equal-width bins into which each continuous action dimension is discretized for
    action tokens
  kind: count
  notes: Commonly 256 in RT-1, RT-2 and OpenVLA; sets the quantization error (range)/(2B). Not \DiscretizationBinCount,
    the state-grid bin count.
- macro: \ActionChunk
  latex: \mathbf{A}
  definition: sequence of future actions a policy predicts in one pass, one row per control step
  kind: matrix
  notes: Shape horizon by action dimension. A subscript $t:t+H-1$ names the window; a superscript $k$
    names the iterate at diffusion step $k$. Not the LTI state matrix, which is \StateSpaceSystemMatrix.
- macro: \ActionChunkHorizon
  latex: H
  definition: number of future action steps a policy emits in one forward pass
  kind: count
  notes: $H=16$ on the mobile manipulator; 16 to 64 steps in the literature. The vol4 uses of the old
    name \Horizon carry this meaning and belong here.
- macro: \ActionChunkIndex
  latex: k
  definition: position of one action chunk in the sequence of chunks a policy generates, counted from
    the oldest one still in use
  kind: index
  notes: In temporal ensembling $k=0$ is the oldest overlapping chunk and the prediction $\CognitivePolicyAction_t^{(k)}$
    comes from chunk $k$. Not \DiffusionStepIndex.
- macro: \ActionChunkTrajectory
  latex: \mathbf{A}_{t:t+H}
  definition: action chunk written with its time window, the actions from step t up to the horizon
  kind: matrix
  notes: Same quantity as \ActionChunk with the window subscript baked in; the book writes the window
    form as $\ActionChunk_{t:t+H-1}$.
- macro: \ActionDimension
  latex: d_a
  definition: number of components in one action vector
  kind: count
  notes: A chunk holds horizon times this many entries.
- macro: \ActionExecutionRate
  latex: f_{\text{exec}}
  definition: rate at which the controller consumes the waypoints of an admitted action chunk
  kind: scalar
  unit: Hz
  notes: Typically $100\text{ Hz}$ to $1\text{ kHz}$, faster than the policy rate that produces the chunks.
- macro: \ActionFilterCutoffFrequency
  latex: f_{\text{cutoff}}
  definition: cutoff frequency of the low-pass filter applied to policy actions before they reach the
    drives
  kind: scalar
  unit: Hz
  notes: Not \CrossoverFrequency.
- macro: \ActionLowerBound
  latex: \mathbf{a}_{\min}
  definition: componentwise lower limit of the valid action range a policy's actions are clipped to
  kind: vector
  notes: Pairs with \ActionUpperBound.
- macro: \ActionMagnitudeBound
  latex: a_{\max}
  definition: largest magnitude any component of a physical action may take, the symmetric actuator limit
  kind: scalar
  unit: varies
  notes: In the units of the action component it bounds (rad/s, N*m, m). The bold vector form in the TD3
    clip is a different, per-component bound.
- macro: \ActionRangeMaximum
  latex: a_{\max}
  definition: upper end of the declared range of one continuous action dimension, above which actions
    are clipped before binning
  kind: scalar
  unit: varies
  notes: Unit of the action dimension. Not \ProfileAccelerationBound, which also renders a_max.
- macro: \ActionRangeMinimum
  latex: a_{\min}
  definition: lower end of the declared range of one continuous action dimension, below which actions
    are clipped before binning
  kind: scalar
  unit: varies
  notes: Unit of the action dimension. Not \ProfileAccelerationBound.
- macro: \ActionResidualVector
  latex: \mathbf{r}
  definition: vector of differences between a predicted and a demonstrated action in normalized action
    coordinates
  kind: vector
  notes: Its components are \NormalizedActionResidual. Not \ReferencePosition.
- macro: \ActionSpace
  latex: \mathcal{A}
  definition: set of actions a policy may emit, the domain its action distribution is defined over
  kind: set
  notes: Elements are \PolicyAction. The POMDP action set of agentic chapters is \PomdpActionSet.
- macro: \ActionUpperBound
  latex: \mathbf{a}_{\max}
  definition: componentwise upper limit of the valid action range a policy's actions are clipped to
  kind: vector
  notes: Pairs with \ActionLowerBound.
- macro: \ActivationStagingTime
  latex: t_{\text{activate}}
  definition: time to stage a validated plan for activation in the execution queue
  kind: scalar
  unit: s
- macro: \ActiveContactIndex
  latex: k
  definition: position of one active contact among the robot's contacts
  kind: index
  notes: The 10_intent glossary proposes \ContactPointIndex written i for grasp contacts; the registry
    step should reconcile.
- macro: \ActiveControlTorque
  latex: \mathbf{u}_{\text{active}}
  definition: active joint torque a contact controller applies, excluding its virtual damping term
  kind: vector
  unit: N*m
  notes: Total controller torque is $\ControlInput = \ActiveControlTorque - \mathbf{D}_{\text{virt}}\dot{\mathbf{q}}$;
    its active power $\ActiveControlTorque^\top\dot{\mathbf{q}}$ debits the energy tank.
- macro: \ActiveMotionDuration
  latex: T_{\text{motion}}
  definition: part of a scheduled collection session left for attempts after startup, calibration and
    operator rest
  kind: scalar
  unit: s
- macro: \ActorAccelerationBound
  latex: a_{k,\max}
  definition: validated bound on the acceleration of one tracked actor
  kind: scalar
  unit: m/s^2
  notes: The chapter writes the track index k inside the subscript; the registry step may prefer $a_{\max}$-style
    LaTeX with the index added by the chapter.
- macro: \ActorBodyRadius
  latex: r
  definition: declared radius of the envelope covering a tracked person, limbs and carried objects included
  kind: scalar
  unit: m
- macro: \ActuatedJointAccelerations
  latex: \ddot{\mathbf{q}}_j
  definition: accelerations of the actuated joints of a floating-base robot, the joint block of its generalized
    accelerations
  kind: vector
  notes: The j is a partition label. The site's raw text is the bare double-dotted q; the entry's LaTeX
    includes the _j.
- macro: \ActuatedJointBiasForces
  latex: \mathbf{h}_j
  definition: actuated-joint block of the generalized bias forces of a floating-base robot
  kind: vector
  notes: The j is a partition label; the entry's LaTeX includes it so the replacement covers it.
- macro: \ActuatedJointCoordinates
  latex: \mathbf{q}_j
  definition: actuated joint angles of a floating-base robot, the joint block of its generalized coordinates
  kind: vector
  notes: The j is a partition label, not an index. The site's raw text is the bare q; the entry's LaTeX
    includes the _j so the replacement covers it. Pairs with \FloatingBasePose.
- macro: \ActuationEnergy
  latex: E_{\text{act}}
  definition: energy a mobile robot spends on actuation over one mission
  kind: scalar
  unit: J
- macro: \ActuationSelectionBaseBlock
  latex: \mathbf{S}_b
  definition: block of the actuation selection matrix belonging to the six floating-base coordinates,
    identically zero because the base is unactuated
  kind: matrix
  unit: dimensionless
- macro: \ActuationSelectionMatrix
  latex: \mathbf{S}
  definition: matrix that maps actuator torques onto the actuated joints of a floating-base robot, leaving
    the six base coordinates unactuated
  kind: matrix
  unit: dimensionless
  notes: $[\mathbf{0}_{n \times 6}, \mathbf{I}_{n \times n}]$; enters the floating-base dynamics as $\mathbf{S}^\top
    \boldsymbol{\tau}$.
- macro: \ActuatorAxisCount
  latex: N_{\text{axes}}
  definition: number of actuator axes, each with its own drive, sharing one power bus or fieldbus
  kind: count
- macro: \ActuatorBiasEffort
  latex: u_{\text{bias}}
  definition: steady force or torque from gravity, friction or payload that an actuator must overcome
    before it can brake
  kind: scalar
  unit: varies
  notes: N for a translational axis, N*m for a revolute one; $a_{\text{net}} = (u_{\max} - |u_{\text{bias}}|)/m$.
- macro: \ActuatorCyclePeriod
  latex: t_{\text{cycle}}
  definition: period of one burst-and-recovery cycle, on-time plus off-time
  kind: scalar
  unit: s
  notes: As it shrinks toward zero the periodic peak converges to the average-power screen.
- macro: \ActuatorDutyCycle
  latex: D_{\text{cycle}}
  definition: fraction of each burst cycle an actuator spends at peak power, on-time divided by cycle
    period
  kind: scalar
  unit: dimensionless
  notes: $D = t_{\text{on}} / t_{\text{cycle}}$; bounded by the average-power thermal screen.
- macro: \ActuatorEffort
  latex: u
  definition: force or torque one actuator applies, the scalar control input of a single axis
  kind: scalar
  unit: varies
  notes: Starred, $u^*$, the effort after the safety filter. The vector form is \ControlInput.
- macro: \ActuatorOffTime
  latex: t_{\text{off}}
  definition: recovery duration between actuator bursts in one duty cycle
  kind: scalar
  unit: s
- macro: \ActuatorOnTime
  latex: t_{\text{on}}
  definition: duration an actuator runs at burst power in one duty cycle
  kind: scalar
  unit: s
- macro: \ActuatorResponseTime
  latex: T_{\text{act}}
  definition: time from a delivered stop command until the actuator produces retarding force, including
    gate drive and current rise
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
- macro: \ActuatorTorqueLowerBound
  latex: \mathbf{u}_{\min}
  definition: per-joint lower bounds of the verified actuator torque envelope
  kind: vector
  unit: N*m
  notes: Box constraint of the CBF-QP.
- macro: \ActuatorTorqueUpperBound
  latex: \mathbf{u}_{\max}
  definition: per-joint upper bounds of the verified actuator torque envelope
  kind: vector
  unit: N*m
  notes: Box constraint of the CBF-QP.
- macro: \AdaptationModule
  latex: g_{\psi}
  definition: learned adaptation module with parameters psi that predicts the environment latent vector
    from a window of recent onboard observations
  kind: function
- macro: \AdjointRepresentation
  latex: \mathbf{Ad}_T
  definition: six-by-six matrix that carries twists and wrenches from one coordinate frame to another
    under a rigid transform
  kind: matrix
  notes: Built from the rotation and translation of the transform $T$.
- macro: \AdmissibleControlSet
  latex: \mathcal{U}_{\text{adm}}
  definition: set of control inputs the actuators can physically deliver, bounded by torque, voltage,
    traction and deceleration limits
  kind: set
  notes: Rendered with its label so it is not confused with \TrajectoryOptimizationObjective, written
    $\mathcal{U}$ in the same section; the inevitable-collision definition writes it bare today. Not \SafeControlSet,
    which also enforces barrier constraints.
- macro: \AdmissibleDisturbanceSet
  latex: \mathcal{W}
  definition: set of disturbance values a falsification search may inject
  kind: set
- macro: \AdmissionInclusivePrebrakeDelay
  latex: T_{\text{true}}
  definition: pre-brake delay plus the dispatch-to-admission interval, the complete delay from capture
    to brake onset
  kind: scalar
  unit: s
  notes: $T_{\text{true}} = \tau_{\text{delay}} + \Delta_{\text{da}}$; its extra travel is $v\,\Delta_{\text{da}}$.
- macro: \AdmissionTimingReserve
  latex: T_{\text{reserve}}
  definition: time reserved between the latest replacement admission and physical stop onset, covering
    decision-to-onset delay and scheduling jitter
  kind: scalar
  unit: s
- macro: \AdmittedCommand
  latex: u
  definition: command the permission path has admitted for one step and alone may write to the drives
  kind: record
  notes: Written with its step index, $\AdmittedCommand_t$; produced from \CandidateProposal by the permission
    path. The CBF-filtered control vector of the safety-filter chapters is \CertifiedControlAction.
- macro: \AdmittedContactForce
  latex: F^*
  definition: contact force admitted for one control interval, the smallest of the proposed force, the
    energy-limited force and the force cap
  kind: scalar
  unit: N
  notes: The LaTeX includes the star, so the site absorbs the ^*.
- macro: \AdmittedControlCommand
  latex: \mathbf{u}
  definition: control command the permission path applies to the actuators after admitting, clipping or
    replacing a policy proposal
  kind: vector
  notes: Indexed by step. Not \NominalControlCommand (before the filter) or \CertifiedControlAction (the
    filter's projection).
- macro: \AdmittedSpeedCommand
  latex: v^*
  definition: speed command the speed governor admits, the candidate speed clamped to the stopping-envelope
    ceiling
  kind: scalar
  unit: m/s
  notes: $v^* = \min(v_{\text{cand}}, \max(0, v_{\max}))$. The LaTeX includes the star, so the site absorbs
    the ^*.
- macro: \AdmittedTargetPosition
  latex: \hat{\mathbf{p}}_{\text{target}}
  definition: target position an intent lease admitted, against which later target evidence is compared
  kind: vector
  unit: m
- macro: \AdvantageEstimate
  latex: \hat{A}
  definition: estimate, from sampled returns, of how much better an action does than the policy's average
    from the same state
  kind: scalar
  unit: dimensionless
  notes: The estimate of \Advantage; indexed by step.
- macro: \AdversarialDisturbance
  latex: \mathbf{d}
  definition: disturbance input chosen adversarially in a differential game, standing for unmodeled friction,
    gusts, obstacles or model error
  kind: vector
- macro: \AffordanceFrame
  latex: \mathcal{F}_{\text{affordance}}
  definition: coordinate frame rigidly attached to one interaction site of an object, such as a mug handle
  kind: set
  notes: Frames are calligraphic F like \BodyReferenceFrame.
- macro: \AffordanceSuccessEstimate
  latex: V_{\text{policy}}
  definition: learned estimate of the probability that a skill succeeds if executed from the current state,
    its affordance score
  kind: function
  unit: dimensionless
  notes: Takes values in [0, 1]; estimates success but bounds no path, force or clearance.
- macro: \AgeBlindTravel
  latex: \Delta x_{\text{blind}}
  definition: distance the base travels during the observation age, before the observation is dispatched
  kind: scalar
  unit: m
  notes: 'One symbol: the Delta site and the x label site both take this macro. The whole pre-brake travel
    is \BlindTravelDistance.'
- macro: \AgeCheckInstant
  latex: t_{\text{curr}}
  definition: current instant on the permission path's clock at which the age of evidence is checked
  kind: scalar
  unit: s
  notes: Minus \CaptureTimestamp or \EvidenceEpoch, plus \ClockConversionBound, gives \ObservationAge.
- macro: \AggregatedRecoveryDataset
  latex: \mathcal{D}
  definition: dataset that dataset aggregation grows each round with states the learner visited, each
    labeled with the expert's recovery action
  kind: set
  notes: Retrained on after every round. Not \DemonstrationDataset (expert-visited states only).
- macro: \AggregatedSurrogateLoss
  latex: \epsilon_N
  definition: best-in-class surrogate imitation loss on the states the learner visited, aggregated over
    the rounds so far
  kind: scalar
  unit: dimensionless
  notes: Differs from \SingleStepImitationError, which is measured on expert-visited states.
- macro: \AggregationLearnedPolicy
  latex: \hat{\pi}
  definition: policy trained in a round of corrective dataset aggregation, one of the sequence the bound
    selects from
  kind: function
  notes: Indexed by round in the appendix, $\hat{\pi}_i$.
- macro: \AggregationLearnerStateDistribution
  latex: d_{\hat{\pi}_i}
  definition: distribution of states the policy learned in one round of dataset aggregation visits when
    it executes
  kind: distribution
  notes: The learner-side counterpart of \ReferenceStateDistribution; same construction as \StateDistribution
    with the round's learned policy.
- macro: \AggregationRoundCount
  latex: N
  definition: number of rounds of corrective dataset aggregation (DAgger iterations) run so far
  kind: count
- macro: \AggregationRoundIndex
  latex: i
  definition: position of one round of dataset aggregation, counted from one
  kind: index
  notes: Subscript of the round's policy and trajectories, $\hat{\pi}_i$, $\mathcal{T}_i$.
- macro: \AggregationRoundTrajectorySet
  latex: \mathcal{T}
  definition: set of states the learner's policy visits in the trajectories collected during one round
    of dataset aggregation
  kind: set
  notes: Indexed by round, $\mathcal{T}_i$. Not \PlantTransitionKernel, which the evaluation chapter also
    writes calligraphic T.
- macro: \AisleTravelSpeed
  latex: v_{\text{aisle}}
  definition: speed the mobile base is set to travel in a warehouse aisle, chosen below the derived dry-floor
    speed ceiling
  kind: scalar
  unit: m/s
  notes: A set operating speed, below \SpeedBound and the drive limit; it is the \SpeedAtDetection used
    in the aisle stopping budget.
- macro: \AisleWidth
  latex: w
  definition: clear width of the warehouse aisle the machine travels
  kind: scalar
  unit: m
- macro: \AliasedVibrationFrequency
  latex: f_{\text{alias}}
  definition: apparent frequency at which vibration above a sensor's sampled bandwidth appears after sampling
  kind: scalar
  unit: Hz
  notes: The distance from the vibration frequency to the nearest multiple of \SamplingRate.
- macro: \AliasingHarmonicIndex
  latex: k
  definition: integer multiple of the sampling rate nearest a vibration frequency, which folds it into
    the observed band
  kind: index
  notes: Chosen to minimize the aliased frequency.
- macro: \AllocatedBlockCount
  latex: N_{\text{blocks}}
  definition: number of voxel blocks a sparse map allocates, those that hold data
  kind: count
- macro: \AllocatedHazardRate
  latex: \lambda_{\text{alloc}}
  definition: share of the tolerable hazard rate that risk allocation assigns to one failure mode
  kind: scalar
  unit: 1/h
  notes: An accountable engineering judgment, not a measurement.
- macro: \AllowableCollisionEnergy
  latex: E_{k, \text{allow}}
  definition: largest kinetic energy a robot may transfer to a person in transient collaborative contact,
    as set by the safety standard
  kind: scalar
  unit: J
  notes: Checked as $\frac{1}{2} \ReducedImpactMass v^2 \le E_{k,\text{allow}}$.
- macro: \AllowableRailDroop
  latex: \Delta V_{\text{droop, max}}
  definition: largest transient drop in DC bus voltage that the bus capacitance is sized to keep the bus
    within
  kind: scalar
  unit: V
  notes: Delta fused into the symbol; the droop itself is \DcBusDynamicRailDroop.
- macro: \AllowableWindingTemperatureRise
  latex: \Delta T_{\max}
  definition: largest winding temperature rise above ambient that the continuous torque rating allows
  kind: scalar
  unit: K
  notes: Delta fused into the symbol; the instantaneous rise is \JouleanTemperatureRise.
- macro: \AmbientTemperature
  latex: T_{\text{amb}}
  definition: temperature of the air around a motor, the reference for its winding temperature rise
  kind: scalar
  unit: degC
  aliases:
  - \WindingAndAmbientTemperatureTwo
- macro: \AngularAcceleration
  latex: \boldsymbol{\alpha}
  definition: angular acceleration vector of a rigid body
  kind: vector
  unit: rad/s^2
- macro: \AngularClearance
  latex: \theta_{\text{clear}}
  definition: angle an approaching joint can still rotate before its tool point reaches the obstacle
  kind: scalar
  unit: rad
  notes: $\theta_{\text{clear}} = d_{\text{tool}}/r_{\text{arm}}$.
- macro: \AngularClearanceRate
  latex: \dot{\theta}_{\text{clear}}
  definition: time derivative of the angular clearance of an approaching joint
  kind: scalar
  unit: rad/s
  notes: Equals minus the joint angular speed.
- macro: \AngularFrequency
  latex: \omega
  definition: angular frequency of a sinusoidal signal, the free variable of a frequency response
  kind: scalar
  unit: rad/s
  notes: Evaluated at $\CrossoverFrequency$ when a delay's phase lag is charged to the phase margin. Not
    the pendulum's \PendulumNaturalFrequency ($\omega_0$).
- macro: \AngularSpeed
  latex: \omega
  definition: magnitude of a rigid body's angular velocity
  kind: scalar
  unit: rad/s
  notes: Not \CrossoverFrequency ($\omega_c$).
- macro: \AngularVelocity
  latex: \boldsymbol{\omega}
  definition: angular velocity of a rigid body, the axis and rate of its rotation
  kind: vector
  unit: rad/s
  notes: The notation chapter's angular velocity row lists it; scalar rates about one axis are italic.
- macro: \AngularVelocityDerivative
  latex: \dot{\boldsymbol{\omega}}
  definition: time derivative of the angular velocity vector, written to define the angular acceleration
  kind: vector
  unit: rad/s^2
  notes: Equal to \AngularAcceleration; kept because the text states that identity.
- macro: \AntiWindupTrackingTimeConstant
  latex: T_t
  definition: tracking time constant of back-calculation anti-windup, setting how fast the actuator mismatch
    discharges the integrator
  kind: scalar
  unit: s
  notes: The subscript t is a label (tracking), so the macro spans it.
- macro: \AntialiasingFilterVariance
  latex: s
  definition: isotropic variance added to a projected Gaussian covariance as a low-pass filter against
    aliasing
  kind: scalar
  unit: pixels^2
- macro: \ApparentContrast
  latex: C
  definition: contrast of an object as seen through the atmosphere at a given range
  kind: scalar
  unit: dimensionless
  notes: 'At zero range, the object''s intrinsic contrast. Koschmieder: $C(d) = C_0 e^{-\beta d}$; $C_0$
    is the zero-range value. Not \ClearanceAllowance.'
- macro: \AppearanceRealityGap
  latex: \Delta_{\text{vis}}
  definition: 'appearance component of the reality gap: discrepancy between rendered and real images,
    weighted by what the policy is sensitive to'
  kind: scalar
  unit: varies
  notes: Component of \RealityGapVector; measured on policy-relevant features, not pixel error.
- macro: \AppliedForce
  latex: F
  definition: force acting on a body along the path over which it moves
  kind: scalar
  unit: N
  notes: Integrand of mechanical work.
- macro: \AppliedLoadCycleCount
  latex: n
  definition: number of load cycles a component has experienced at one load level, in a cumulative fatigue-damage
    sum
  kind: count
  notes: Indexed by load level $i$; divided by \FatigueLifeCycleCount in Miner's rule.
- macro: \ApproachChannelCount
  latex: K_a
  definition: number of approach channels, each a zone and activation condition with its own approach-speed
    ceiling
  kind: count
- macro: \ApproachDirection
  latex: \hat{\mathbf{a}}_{\text{approach}}
  definition: unit vector along which the gripper approaches a grasp affordance
  kind: vector
  unit: dimensionless
  notes: The hat marks unit length, not an estimate. Distinct from a predicted action $\hat{\mathbf{a}}$.
- macro: \ApproachPosition
  latex: x
  definition: position of the end effector along its approach direction into a contact
  kind: scalar
  unit: m
  notes: Its finite change $\Delta x$ is travel past first contact.
- macro: \ApproachPredicate
  latex: P_{\text{approach}}
  definition: motion predicate that holds when the tool center point lies within the positional and angular
    tolerances of the pregrasp pose
  kind: function
  notes: Boolean-valued. P alone is the parameter count.
- macro: \ApproachSpeed
  latex: v_{\text{app}}
  definition: speed at which the gripper approaches the latch during a demonstration
  kind: scalar
  unit: m/s
- macro: \ArbitrationFieldBitCount
  latex: B_{\text{arb},i}
  definition: 'number of bits of frame i sent at the nominal rate: identifier and control bits'
  kind: count
  notes: The frame index i is part of the LaTeX.
- macro: \ArcObstacleDistance
  latex: d_{\text{arc}}
  definition: distance along the circular arc a velocity pair commands to the nearest obstacle on it
  kind: function
  unit: m
  notes: Written with the pair, $\ArcObstacleDistance(\SpeedAtDetection, \YawRate)$; the dynamic window
    approach admits a pair only if braking fits inside it.
- macro: \ArcsineEffectSize
  latex: h
  definition: Cohen's effect size between two success probabilities, the difference of their arcsine-square-root
    transforms
  kind: scalar
  unit: dimensionless
  notes: Not \BarrierFunction (also h).
- macro: \ArgumentLegConfidence
  latex: r
  definition: probability, as assessed confidence, that one independent leg of a multi-legged assurance
    argument holds
  kind: scalar
  unit: dimensionless
  notes: Indexed $\ArgumentLegConfidence_j$; the claim fails only if every leg fails, so its confidence
    is one minus the product of the leg failure probabilities.
- macro: \ArgumentLegCount
  latex: m
  definition: number of independent legs of a multi-legged assurance argument, any one of which suffices
    for the claim
  kind: count
- macro: \ArmStoppingDeceleration
  latex: a_{\text{arm}}
  definition: deceleration the arm must achieve after braking onset to stop within the latch force limit
  kind: scalar
  unit: m/s^2
- macro: \ArmingSettleDuration
  latex: t_{\text{settle}}
  definition: time a fault-injection trial lets the plant settle in its nominal envelope before the fault
    is injected
  kind: scalar
  unit: s
- macro: \ArrivalOffsetTravel
  latex: \Delta x
  definition: distance the base travels between a sample's capture and its arrival timestamp
  kind: scalar
  unit: m
  notes: 'One symbol: the Delta site and the x site both take this macro.'
- macro: \ArrivalStampOffset
  latex: \Delta t_{\text{recv}}
  definition: time by which a sample's arrival timestamp trails its capture timestamp
  kind: scalar
  unit: s
  notes: 'One symbol: the Delta site and the arrival-time site both take this macro.'
- macro: \ArrivalTimestamp
  latex: t_{\text{recv}}
  definition: instant a sensor sample arrives in host memory, when its direct memory access transfer completes
  kind: scalar
  unit: s
  notes: Later than the capture timestamp by exposure, readout, transport and transfer; vol4 memory uses
    it for the arrival sample.
- macro: \AssessedContactForceLimit
  latex: F_{\text{limit}}
  definition: largest contact force a site assessment admits for one human body region, contact type and
    geometry in a collaborative contact
  kind: scalar
  unit: N
  notes: A case criterion chosen by the assessment, not an ISO/TS 15066 tabulated value or an injury boundary;
    distinct from the structural latch limit.
- macro: \AssociationCostEntry
  latex: c
  definition: entry of the data-association cost matrix for pairing track i with detection j
  kind: scalar
  unit: dimensionless
- macro: \AssuranceClaim
  latex: C
  definition: top-level safety claim of an assurance argument, whose probability of holding is assessed
    from its premises
  kind: scalar
  unit: dimensionless
  notes: A proposition, not a number; the book takes $\Pr(C)$, the product of independent premise confidences
    for a conjunctive argument, or one minus the product of leg failure probabilities for a multi-legged
    one.
- macro: \AtmosphericExtinctionCoefficient
  latex: \beta_{\text{atm}}
  definition: rate per unit path length at which the atmosphere attenuates light by scattering and absorption
  kind: scalar
  unit: 1/m
  notes: 'Koschmieder exponent: contrast falls as $e^{-\beta d}$.'
- macro: \AttemptCycleDuration
  latex: t_{\text{cyc}}
  definition: duration of one attempt plus its reset in a collection session
  kind: scalar
  unit: s
- macro: \AttemptDuration
  latex: t_{\text{att}}
  definition: duration of one teleoperated demonstration attempt
  kind: scalar
  unit: s
- macro: \AttitudeError
  latex: \theta_{\text{att}}
  definition: angular error in an estimated attitude, which leaks gravity into the horizontal acceleration
  kind: scalar
  unit: rad
- macro: \AutomatedResetTime
  latex: t_{\text{reset,auto}}
  definition: time an automated fixture takes to restore a physical rig to its initial configuration between
    trials
  kind: scalar
  unit: s
  notes: Automated case of \EnvironmentResetTime.
- macro: \AuxiliaryEnergy
  latex: E_{\text{aux}}
  definition: energy auxiliary sensors and payloads draw over one mission
  kind: scalar
  unit: J
- macro: \AvailableBrakingDistance
  latex: D_{\text{avail}}
  definition: clear distance minus the localization bound and the protective clearance margin, the distance
    braking and blind travel may use
  kind: scalar
  unit: m
- macro: \AvailableDeceleration
  latex: a
  definition: deceleration a machine actually has available, the smaller of its credible braking deceleration
    and the traction limit friction coefficient times gravity
  kind: scalar
  unit: m/s^2
  notes: $a = \min(\CredibleBrakingDeceleration, \CoulombFrictionCoefficient \Gravity)$.
- macro: \AverageCopperLossPower
  latex: \bar{P}_{\text{loss}}
  definition: copper loss averaged over a duty cycle or sustained operation
  kind: scalar
  unit: W
  notes: Sets the equilibrium winding temperature; it does not bound the transient peak.
- macro: \AverageOnlineRegret
  latex: \gamma_N
  definition: average regret of the online learner over the rounds of dataset aggregation, relative to
    the best fixed policy in hindsight
  kind: scalar
  unit: dimensionless
  notes: Vanishes as the number of rounds N grows for a no-regret learner. Not \DiscountFactor.
- macro: \AverageStateVisitationDistribution
  latex: \bar{d}
  definition: average over the steps of a finite horizon of the distribution of states a policy visits,
    the policy written as superscript
  kind: distribution
  notes: Same construction as \StateDistribution, which bakes the policy into a subscript; here the policy
    is a superscript.
- macro: \AxisGridPointCount
  latex: N
  definition: number of grid points along each state coordinate of a regular grid
  kind: count
- macro: \AzimuthAngle
  latex: \theta_{\text{az}}
  definition: azimuth angle of a direction, measured in the horizontal plane about the vertical axis
  kind: scalar
  unit: rad
  notes: Paired with \ElevationAngle. The book may state values in degrees.
- macro: \BackEmfVoltage
  latex: e_{\text{bemf}}
  definition: voltage the turning rotor induces in the stator windings, opposing the supply
  kind: scalar
  unit: V
  notes: Equals the back-EMF constant times rotor speed, $e = \MotorBackEmfConstant \omega$.
  aliases:
  - \BackemfVoltageBemf
- macro: \BacklashAngle
  latex: \theta_{\text{backlash}}
  definition: angular lost motion of a gear train when the drive reverses, its backlash
  kind: scalar
  unit: deg
  notes: Not \ModelParameters ($\theta$).
- macro: \BackwardEulerEigenvalue
  latex: \lambda_{\text{BE}}
  definition: eigenvalue of the backward (implicit) Euler transition matrix
  kind: scalar
  unit: dimensionless
  notes: Modulus below one for an undamped oscillator, so the simulation loses energy.
- macro: \BackwardEulerTransitionMatrix
  latex: \mathbf{A}_{\text{BE}}
  definition: discrete-time transition matrix that backward (implicit) Euler integration produces, the
    inverse of identity minus the system matrix times the step
  kind: matrix
  notes: Unconditionally stable but numerically dissipative.
- macro: \BackwardReachableTube
  latex: \mathcal{R}
  definition: set of states from which a worst-case disturbance can force the plant into failure before
    the horizon despite the best control
  kind: set
  notes: Not \DynamicReachableSet.
- macro: \BalanceDivergenceTime
  latex: \tau_{\text{fall}}
  definition: time constant over which an unrecovered lean of a balancing biped grows by a factor of e,
    the reciprocal of the pendulum natural frequency
  kind: scalar
  unit: s
  notes: $\BalanceDivergenceTime = 1/\PendulumNaturalFrequency = \sqrt{\MassCenterHeight/\Gravity}$; a
    characteristic rate, not a recovery deadline.
- macro: \BalanceFallTimeConstant
  latex: \tau_{\text{fall}}
  definition: characteristic time on which an upright legged body diverges from balance
  kind: scalar
  unit: s
- macro: \BarrierConstraintBound
  latex: b_{\text{cbf}}
  definition: bound on the right side of one affine control-barrier constraint, one entry of the stacked
    bound vector
  kind: scalar
  unit: varies
  notes: One entry of \BarrierConstraintVector; its unit follows the barrier function rate.
- macro: \BarrierConstraintCount
  latex: K_b
  definition: number of control-barrier constraints an enforcement record parameterizes
  kind: count
- macro: \BarrierConstraintMatrix
  latex: \mathbf{A}_{\text{cbf}}
  definition: matrix of stacked affine control-barrier constraints on the control input
  kind: matrix
  notes: Constraints read $\mathbf{A}_{\text{cbf}}(\mathbf{x})\mathbf{u} \le \mathbf{b}_{\text{cbf}}(\mathbf{x})$;
    a matrix rather than the vector \BarrierConstraintVector.
  aliases:
  - \BarrierConstraintRowsCbf
- macro: \BarrierConstraintNormal
  latex: \mathbf{a}_{\text{cbf}}
  definition: normal vector of a single affine control-barrier constraint on the control input
  kind: vector
  unit: varies
  notes: $\mathbf{a}_{\text{cbf}}^\top = -L_{\mathbf{g}} h$; one row of \BarrierConstraintMatrix.
- macro: \BarrierConstraintVector
  latex: \mathbf{b}_{\text{cbf}}
  definition: vector of bounds on the right side of the stacked control-barrier constraints
  kind: vector
  notes: Pairs with \BarrierConstraintMatrix.
  aliases:
  - \BarrierConstraintRowsCbfTwo
- macro: \BarrierFunction
  latex: h
  definition: 'control-barrier certificate: a margin function of the state that is nonnegative exactly
    on the safe set'
  kind: function
  unit: m
  notes: Written as a function head ($h(\mathbf{x})$, $\dot{h}$, $L_{\mathbf{f}} h$). Clearance barriers
    are in m; angular barriers are in rad. \ControlBarrierFunction is the fixed form $h(\mathbf{x})$.
- macro: \BarrierFunctionRate
  latex: \dot{h}
  definition: time derivative of the control barrier function along the closed-loop dynamics
  kind: function
  unit: m/s
  notes: The rate in the barrier condition $\dot{h} \ge -\gamma h$; a dot is not an allowed decoration
    on \BarrierFunction, so it has its own entry.
- macro: \BarrierHalfSpaceControlSet
  latex: \mathcal{U}_{\text{safe}}
  definition: set of control inputs that satisfy the control barrier function inequality at the current
    state, before actuator limits are imposed
  kind: set
  notes: The closed half-space a CBF-QP projects a nominal command onto. Not $\SafeControlSet$, which
    also enforces the actuator limits; intersecting this set with $\AdmissibleControlSet$ gives that set,
    which is empty when no command meets both.
- macro: \BarrierMargin
  latex: \delta
  definition: margin a barrier value must keep above zero, in normalized distance
  kind: scalar
  unit: dimensionless
  notes: The subscript indexes the barrier. Written $\delta_k$ for barrier k.
- macro: \BarrierNormalizationScale
  latex: h_{\text{scale}}
  definition: positive scale fixed in the enforcement contract that divides the barrier value to log a
    dimensionless margin
  kind: scalar
  unit: m
  notes: Same unit as \BarrierFunction.
- macro: \BarrierProjectionLagrangian
  latex: L_{\text{Lag}}
  definition: 'Lagrangian of the single-constraint CBF-QP projection: the squared deviation from the nominal
    command plus the multiplier times the constraint residual'
  kind: function
  notes: Arguments are \ControlInput and \BarrierProjectionMultiplier.
- macro: \BarrierProjectionMultiplier
  latex: \lambda
  definition: Lagrange multiplier of the barrier half-space constraint in the CBF-QP projection
  kind: scalar
  unit: varies
  notes: Starred at the optimum; $\lambda^* = \max(0, (\mathbf{a}^\top\mathbf{u}_{\text{nom}} - b)/\|\mathbf{a}\|^2)$.
- macro: \BarrierRelativeDegree
  latex: r
  definition: number of times the barrier function must be differentiated along the dynamics before the
    control input appears
  kind: count
  notes: Renders $r$, like \Reward and \WheelRadius; the three never share a derivation.
- macro: \BaseAbscissaVelocity
  latex: \dot{x}
  definition: velocity of a mobile base along the first axis of the fixed planar frame, the time derivative
    of its abscissa
  kind: scalar
  unit: m/s
  notes: In the unicycle model it equals $\BaseForwardSpeed\cos\HeadingAngle$. Not $\BaseLongitudinalVelocity$,
    the forward velocity in the base's own frame.
- macro: \BaseAccelerationCommand
  latex: a
  definition: acceleration the mobile base channel is commanded to follow
  kind: scalar
  unit: m/s^2
  notes: Its step $\Delta a$ sizes the base blend window.
- macro: \BaseCameraRotation
  latex: \mathbf{R}_{\text{base}}^{\text{cam}}
  definition: rotation part of the camera-to-base extrinsic transform
  kind: matrix
  unit: dimensionless
- macro: \BaseCameraTransform
  latex: \mathbf{T}_{\text{base}}^{\text{cam}}
  definition: rigid transform mapping camera coordinates into the robot base frame
  kind: matrix
- macro: \BaseCameraTranslation
  latex: \mathbf{t}_{\text{base}}^{\text{cam}}
  definition: translation part of the camera-to-base extrinsic transform, the camera center in the base
    frame
  kind: vector
  unit: m
- macro: \BaseFlangeTransform
  latex: \mathbf{T}_{\text{base}}^{\text{flange}}
  definition: rigid transform mapping tool-flange coordinates into the robot base frame, from forward
    kinematics
  kind: matrix
- macro: \BaseForwardSpeed
  latex: v
  definition: forward linear speed of the mobile base along its heading, the speed input of the unicycle
    model
  kind: scalar
  unit: m/s
  notes: Not \SpeedAtDetection, the speed at the instant a hazard is detected.
- macro: \BaseFramePoint
  latex: \mathbf{p}_{\text{base}}
  definition: position of a point expressed in the robot's base coordinate frame
  kind: vector
  unit: m
  notes: Companion of \CameraFramePoint.
- macro: \BaseHeadingRate
  latex: \dot{\theta}_{\text{head}}
  definition: rate of change of a mobile base's heading angle
  kind: scalar
  unit: rad/s
- macro: \BaseJointInertiaCoupling
  latex: \mathbf{M}_{bj}
  definition: block of the generalized inertia matrix through which actuated-joint accelerations load
    the floating-base equations
  kind: matrix
  unit: varies
  notes: Transpose of the joint-base block for a symmetric inertia matrix.
- macro: \BaseLateralPosition
  latex: y_{\text{base}}
  definition: lateral position of the mobile base, its offset from the reference line such as an aisle
    centerline
  kind: scalar
  unit: m
  notes: Planar pose ($\BaseLongitudinalPosition$, $\BaseLateralPosition$, $\HeadingAngle$).
- macro: \BaseLateralVelocity
  latex: \dot{y}
  definition: lateral velocity of a mobile base in the plane
  kind: scalar
  unit: m/s
- macro: \BaseLongitudinalPosition
  latex: x_{\text{base}}
  definition: longitudinal position of the mobile base along the reference direction, such as distance
    along an aisle
  kind: scalar
  unit: m
  notes: Planar pose ($\BaseLongitudinalPosition$, $\BaseLateralPosition$, $\HeadingAngle$).
- macro: \BaseLongitudinalVelocity
  latex: \dot{x}
  definition: forward velocity of a mobile base in the plane
  kind: scalar
  unit: m/s
- macro: \BaseOdometrySpeed
  latex: v
  definition: speed at which the mobile base closes on the target, as wheel odometry reports it
  kind: scalar
  unit: m/s
  notes: Enters the scalar predict step as a known control input.
- macro: \BaseOrdinateVelocity
  latex: \dot{y}
  definition: velocity of a mobile base along the second axis of the fixed planar frame, the time derivative
    of its ordinate
  kind: scalar
  unit: m/s
  notes: In the unicycle model it equals $\BaseForwardSpeed\sin\HeadingAngle$. Not $\BaseLateralVelocity$,
    the sideways velocity in the base's own frame, which the no-slip constraint holds at zero.
- macro: \BasePosition
  latex: \mathbf{p}_{\text{base}}
  definition: position of the mobile base in the estimation frame
  kind: vector
  unit: m
  notes: 05_data's $\mathbf{p}_{\text{base}}$ is a point expressed in the base frame, a different meaning.
- macro: \BaseStoppingDistance
  latex: d_{\text{base}}
  definition: 'stopping distance from the body''s budget rows alone: braking distance, localization and
    clearance overhead, and brake-onset travel'
  kind: scalar
  unit: m
- macro: \BaseToCameraTransform
  latex: \mathbf{T}_{\text{cam} \leftarrow \text{base}}
  definition: rigid transform carrying robot-base coordinates into the camera's optical frame, the camera
    extrinsics
  kind: matrix
- macro: \BaseTravelDistance
  latex: d
  definition: distance the machine has traveled toward the boundary it must stop before, as a function
    of time during a stop
  kind: function
  unit: m
  notes: Remaining clearance is $\ClearDistance - d(t)$; at rest it is the measured stopping travel.
- macro: \BaseTravelSpeed
  latex: v_{\text{base}}
  definition: speed at which the mobile base travels while a sensor captures a measurement
  kind: scalar
  unit: m/s
  notes: Kinematic speed in capture-timing errors; in stopping and pre-brake algebra the speed is \SpeedAtDetection.
- macro: \BaseWristTransform
  latex: \mathbf{T}_{\text{base} \leftarrow \text{wrist}}
  definition: homogeneous transform mapping wrist-frame points into the base frame
  kind: matrix
- macro: \BaseYawRateBias
  latex: \omega_{\text{bias}}
  definition: persistent bias in the commanded yaw rate of the mobile base, a steering drift
  kind: scalar
  unit: rad/s
- macro: \BaselineControllerAction
  latex: \mathbf{a}_t^{\text{base}}
  definition: action the validated baseline controller applies at step t while a candidate runs in shadow
    mode
  kind: vector
- macro: \BaselineStateDistribution
  latex: d^{\pi_{\text{base}}}
  definition: distribution of states the baseline controller visits while a candidate runs in shadow mode
  kind: distribution
  notes: Same construction as agentic \StateDistribution ($d_\pi$) but superscripted; the chapter's glyph
    is kept.
- macro: \BaselineTrackingError
  latex: e_{\text{track}}
  definition: tracking error between commanded and measured plant motion during the steady-state arming
    of a fault-injection trial
  kind: scalar
  unit: m
- macro: \BatteryCellResistance
  latex: R_{\text{cell}}
  definition: internal resistance of a battery pack's cells, one term of the lumped source resistance
  kind: scalar
  unit: Ohm
  notes: Rises as the pack ages and cools.
- macro: \BeamDivergenceAngle
  latex: \delta\theta_{\text{div}}
  definition: full angle by which a lidar beam spreads as it propagates
  kind: scalar
  unit: rad
  notes: 'One symbol: the delta site and the theta site both take this macro.'
- macro: \BearingRay
  latex: \mathbf{r}
  definition: viewing ray through an image pixel, the back-projection of its homogeneous coordinates through
    the inverse intrinsics, along which every depth fits the pixel
  kind: vector
  unit: dimensionless
  notes: Normalized so its third component is one; written with its pixel argument in the chapter.
- macro: \BeatFrequency
  latex: f_b
  definition: frequency of the beat tone from mixing an FMCW echo with the transmitted chirp, proportional
    to range
  kind: scalar
  unit: Hz
- macro: \BehaviorCloningHorizon
  latex: S
  definition: number of control steps in an episode over which imitation errors compound
  kind: count
  notes: The horizon of the $\mathcal{O}(S^2\epsilon)$ behavior-cloning bound. Not the action-chunk horizon
    \ActionChunkHorizon and not a duration.
- macro: \BeliefErrorBound
  latex: E
  definition: upper bound on the discrepancy between a stored belief and the true state after a given
    elapsed time without new evidence
  kind: function
  unit: varies
  notes: Written $E(\Delta t)$; linear form $E = e_0 + r\,\Delta t$. Unit is that of the stored quantity
    (m for a position, rad for an angle).
- macro: \BeliefInvalidationHorizon
  latex: T_{\text{inv}}
  definition: time since the last supporting evidence after which a stored belief may no longer be used
  kind: scalar
  unit: s
  notes: Set by the belief record\'s error growth law; an observation older than this degrades the belief\'s
    status.
- macro: \BestEffortWireBitCount
  latex: B_{\text{BE,wire}}
  definition: largest non-preemptible wire occupancy of a best-effort frame, in bits, including framing
    overhead
  kind: count
- macro: \BetterArmSuccessProbability
  latex: p_{\text{high}}
  definition: per-trial success probability of the better policy in a two-policy power calculation
  kind: scalar
  unit: dimensionless
- macro: \BevPillarFeature
  latex: \mathbf{V}_{\text{BEV}}
  definition: feature of one bird's-eye-view pillar, the sum of the frustum features that fall inside
    it, as a function of the pillar
  kind: function
- macro: \BevPillarXIndex
  latex: X
  definition: first ground-plane grid coordinate of one pillar of a bird's-eye-view grid
  kind: index
- macro: \BevPillarYIndex
  latex: Y
  definition: second ground-plane grid coordinate of one pillar of a bird's-eye-view grid
  kind: index
- macro: \BiasTorque
  latex: \tau_{\text{bias}}
  definition: steady gravity or load torque that opposes the actuator while braking
  kind: scalar
  unit: N*m
- macro: \BinomialSuccessCount
  latex: X
  definition: random number of successful trials among the independent trials of an evaluation record,
    binomially distributed
  kind: count
- macro: \BipedTiltAcceleration
  latex: \ddot{\theta}_{\text{tilt}}
  definition: second time derivative of a balancing body's lean from vertical
  kind: scalar
  unit: rad/s^2
  notes: Equals $(\Gravity/\MassCenterHeight)\,\TiltAngle$ for small leans of the linear inverted pendulum.
- macro: \BitTime
  latex: T_{\text{bit}}
  definition: duration of one bit on the bus, charged once for arbitration at the boundary of a response-time
    window
  kind: scalar
  unit: s
- macro: \BlackoutClockConversionError
  latex: \Delta t_{\text{one-sigma scenario}}
  definition: clock-conversion error accumulated over a synchronization blackout with a one-sigma jitter
    excursion, drift rate times blackout plus jitter
  kind: scalar
  unit: s
  notes: An illustrative operating point, not a bound; the general follower-leader difference is \ClockOffset.
- macro: \BlendDeadline
  latex: t_{\text{blend}}
  definition: internal scheduling instant by which a preferred successor trajectory should clear validation,
    earlier than the commitment instant
  kind: scalar
  unit: s
  notes: Not a record field. Distinct from \SeamBridgeDuration.
- macro: \BlendedCommandJerk
  latex: j_{\text{cmd}}
  definition: time derivative of a blended commanded acceleration during a bumpless transfer
  kind: scalar
  unit: varies
  notes: m/s^3 or rad/s^3 by channel. Bounded against \JerkLimit; the vector setpoint jerk is \ControlSetpointJerk.
- macro: \BlendedControlCommand
  latex: \mathbf{u}_{\text{blend}}
  definition: command the enforcer proposes during a bumpless transfer, the blend of the two latched endpoints,
    checked before dispatch
  kind: vector
- macro: \BlendingTransitionWindow
  latex: \tau_{\text{blend}}
  definition: duration of the smooth blend from one latched command to the next during a bumpless transfer
  kind: scalar
  unit: s
  notes: Bounded below by $1.875 \lVert \Delta \mathbf{u} \rVert / \JerkLimit$ for the quintic smoothstep.
- macro: \BlindTravelDistance
  latex: d_{\text{blind}}
  definition: distance a machine travels during the pre-brake delay, before retarding force begins
  kind: scalar
  unit: m
  notes: Speed at detection times the pre-brake delay.
- macro: \BlockCoordinateX
  latex: b_x
  definition: integer x component of a voxel block coordinate
  kind: index
  notes: Component of \VoxelBlockCoordinate.
- macro: \BlockCoordinateY
  latex: b_y
  definition: integer y component of a voxel block coordinate
  kind: index
  notes: Component of \VoxelBlockCoordinate.
- macro: \BlockCoordinateZ
  latex: b_z
  definition: integer z component of a voxel block coordinate
  kind: index
  notes: Component of \VoxelBlockCoordinate.
- macro: \BlockEdgeVoxelCount
  latex: n_{\text{blk}}
  definition: number of voxels along one edge of a cubic voxel block
  kind: count
- macro: \BlockMetadataSize
  latex: s_{\text{meta}}
  definition: bytes of metadata stored per allocated voxel block
  kind: scalar
  unit: bytes
- macro: \BlockingTaskIndex
  latex: k
  definition: index of a lower-priority task whose critical sections can block the task under analysis
  kind: index
  notes: Inside a subscript $k$ needs no macro; this entry covers a bare $k$ such as the argument of $cs(k)$.
- macro: \BodyAcceleration
  latex: \dot{v}
  definition: time derivative of the speed of a moving body
  kind: scalar
  unit: m/s^2
  notes: Time derivative of \BodySpeed.
- macro: \BodyDisplacement
  latex: x
  definition: displacement of a body along the line of an applied force
  kind: scalar
  unit: m
  notes: Variable of integration in the work integral $\int F\,dx$. Not the bold plant state \MechanicalPlantState.
- macro: \BodyEndEffectorTransform
  latex: \mathbf{T}_{BE}
  definition: rigid transform mapping end-effector coordinates into the robot base frame, the arm's forward
    kinematics
  kind: matrix
- macro: \BodyFramePoint
  latex: \mathbf{p}_{\text{body}}
  definition: position of a perceived point expressed in the robot body frame
  kind: vector
  unit: m
  notes: The point of an error-qualified claim; \CameraFramePoint carried through the extrinsics.
- macro: \BodyFramePointCovariance
  latex: \boldsymbol{\Sigma}_{\text{body}}
  definition: covariance of a perceived point's position error expressed in the robot body frame, the
    spatial covariance an observation contract carries
  kind: matrix
  unit: m^2
  notes: Rotated camera-frame covariance plus the extrinsic term. Not \EstimationErrorCovariance of a
    state estimator.
- macro: \BodyLidarTransform
  latex: \mathbf{T}_{bl}
  definition: calibrated mounting extrinsic of a lidar, mapping lidar coordinates into the body frame
  kind: matrix
- macro: \BodyReferenceFrame
  latex: \mathcal{F}_B
  definition: coordinate frame attached to the mobile robot base
  kind: set
  aliases:
  - \CoordinateReferenceFramesB
- macro: \BodyRegionMass
  latex: m_H
  definition: effective mass of a human body region, here the hand, in the ISO/TS 15066 body model
  kind: scalar
  unit: kg
- macro: \BodySpeed
  latex: v
  definition: magnitude of the linear velocity of a moving body or machine
  kind: scalar
  unit: m/s
  notes: Scalar speed; the vector is \Velocity. \SpeedAtDetection is its value at the moment a hazard
    is detected.
- macro: \BoltzmannConstant
  latex: k_B
  definition: Boltzmann constant, relating a temperature to the thermal energy scale
  kind: scalar
  unit: J/K
  notes: About 1.380649e-23 J/K.
- macro: \BoltzmannStateEnergy
  latex: E
  definition: energy of one microstate whose weight the Boltzmann distribution gives as the exponential
    of minus energy over Boltzmann constant times temperature
  kind: scalar
  unit: J
  notes: Statistical-mechanics origin of the softmax temperature; reading a negative logit as $E$ makes
    the two identical.
- macro: \BoltzmannTemperature
  latex: T
  definition: absolute temperature of a system whose states follow the Boltzmann distribution
  kind: scalar
  unit: K
  notes: The physical quantity the sampling temperature $\SamplingTemperature$ is named after.
- macro: \BottomedOutContactStiffness
  latex: k_{\infty}
  definition: contact stiffness after a compliant cover bottoms out against the rigid structure behind
    it, effectively unbounded
  kind: scalar
  unit: varies
  notes: Written as the limit of \HertzianContactCoefficient; same unit as that coefficient.
- macro: \BouligandContingentCone
  latex: T_{\mathcal{C}}
  definition: 'set-valued map giving, at each point of a closed set, the Bouligand contingent cone: the
    directions along which the set can be entered or followed to first order'
  kind: function
  notes: Equals the whole space in the interior and the half-space $\nabla h^\top \mathbf{v} \ge 0$ on
    a smooth boundary.
