  kind: matrix
- macro: \FlangeReferenceFrame
  latex: \mathcal{F}_{\text{flange}}
  definition: coordinate frame attached to a manipulator's mounting flange, before any tool
  kind: set
  notes: Not the end-effector frame, which sits at the tool tip.
- macro: \FlangeTargetTransform
  latex: \mathbf{T}_{\text{flange}}^{\text{target}}
  definition: rigid transform mapping calibration-target coordinates into the tool-flange frame
  kind: matrix
- macro: \FleetManufacturingDistribution
  latex: \mathcal{M}
  definition: distribution of unit-to-unit physical variation across the manufactured robots of a fleet,
