    uses for $\PlantDynamicsParameters(\TimeInstant)$ and $d\WindingTemperature/d\TimeInstant$. Not \ControlStepIndex,
    the general position of a control step.
- macro: \FirstIncidentTime
  latex: t_1
  definition: operating time from the start of observation until the first catastrophic incident, exponentially
    distributed under a constant rate
  kind: scalar
  unit: s
- macro: \FirstMistakeEvent
  latex: \mathcal{E}
  definition: event that a learned policy first disagrees with the expert at a given step, having agreed
    at every earlier step
  kind: set
  notes: Indexed by the step, $\mathcal{E}_t$; the events for different steps are disjoint.
- macro: \FixedClearanceAllowance
  latex: \delta
