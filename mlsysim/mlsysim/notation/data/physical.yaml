  unit: dimensionless
  notes: Discrete-time counterpart of \LaplaceVariable; stable discrete poles lie inside the unit circle
    |z| < 1.
- macro: \ZeroFailureTrialCount
  latex: n
  definition: number of consecutive failure-free trials needed to demonstrate a target success probability
  kind: count
  aliases:
  - \ZerofailureTrialCount
- macro: \ZeroFailureUpperConfidenceLimit
  latex: p_{\text{fail, upper}}^{95\%}
  definition: one-sided upper confidence limit at the 95 percent level on the per-trial failure probability
    after a campaign in which every trial passed, the quantity the rule of three approximates
  kind: scalar
  unit: dimensionless
  notes: Approximately $3/\ZeroFailureTrialCount$. The confidence level is fixed at 95 percent; $\FailureUpperConfidenceLimit$
    is the same kind of limit at an unstated level and for any failure count.
- macro: \ZeroMomentPoint
  latex: \mathbf{p}_{\text{ZMP}}
  definition: point on the ground where the net horizontal tipping moment of the contact forces vanishes
  kind: vector
  unit: m
  notes: Must lie inside the convex hull of the contact points.
  aliases:
  - \ZeroMomentPointZmp
- macro: \ZohHoldTravel
  latex: d_{\text{ZOH}}
  definition: distance the plant drifts during one zero-order-hold interval before the next check can
    act
  kind: scalar
  unit: m
  notes: Written after the finite-change prefix, $\Delta d_{\text{ZOH}} = vT + \tfrac{1}{2}aT^2$.
- macro: \ZohPhaseShift
  latex: \phi_{\text{ZOH}}
  definition: phase a zero-order hold contributes at the crossover frequency, equivalent to half a sample
    period of delay
  kind: scalar
  unit: rad
  notes: Written with \FiniteChange as the lag $\Delta\phi_{\text{ZOH}}$; a component of \DelayPhaseLag.
- macro: \ZohTransportDelay
  latex: \tau_{\text{ZOH}}
  definition: effective continuous-time delay a zero-order hold adds, half the sampling period
  kind: scalar
  unit: s
