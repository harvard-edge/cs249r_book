  definition: velocity at a physical interaction port, signed so that the port force times this velocity
    is the power entering the system
  kind: scalar
  unit: m/s
  notes: Conjugate to \InteractionPortForce; written v(t) inside the passivity integral.
- macro: \InterconnectPortConflicts
  latex: N_{\text{conflict}}
