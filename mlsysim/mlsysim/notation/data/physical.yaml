- macro: \SyncMessageInterval
  latex: \Delta t_{\text{interval}}
  definition: interval between successive clock-synchronization messages, over which residual frequency
    error accumulates as offset
  kind: scalar
  unit: s
- macro: \SyncPairingDisplacement
  latex: \Delta \mathbf{x}_{\text{sync}}
  definition: displacement the arm travels during an uncompensated lag between an observation and the
    action it is paired with
  kind: vector
  unit: m
  notes: The Delta is part of the symbol. Not \RollingShutterDistortion.
- macro: \SynchronizationBlackout
  latex: T_{\text{blackout}}
  definition: interval during which a node receives no synchronization message and runs on its own clock
  kind: scalar
  unit: s
- macro: \SynchronizationClearanceMargin
  latex: d_{\text{sync}}
  definition: extra clearance that covers the travel of an observed entity during the clock-synchronization
    error bound
  kind: scalar
  unit: m
  notes: Relative speed times \SynchronizationErrorBound.
- macro: \SynchronizationErrorBound
  latex: \epsilon_{\text{sync}}
  definition: bound on the error of converting a timestamp from one node's clock to another's
  kind: scalar
  unit: s
  notes: The clock-conversion error of the observation contract; distinct from \ClockOffset (an estimated
    offset, not a bound).
- macro: \SynchronizationStepIndex
  latex: k
  definition: index of one synchronization step of a clock servo
  kind: index
- macro: \SystemHazardRate
  latex: \lambda_{\text{system}, h}
  definition: rate of hazardous events of class h for the whole system, after the shield
  kind: scalar
  unit: 1/h
- macro: \SystemMatrixPowerIndex
  latex: k
  definition: exponent of a power of the system matrix, the number of propagation steps a controllability
    column block represents
  kind: index
  notes: Runs from 0 to $n-1$ in the controllability matrix; higher powers add no rank by the Cayley-Hamilton
    theorem.
- macro: \TailPerformanceMetric
  latex: X
  definition: continuous performance metric of a trial whose upper tail extreme value theory models, such
    as braking-distance overshoot
  kind: scalar
  unit: varies
  notes: Indexed $X_i$ for trial i.
- macro: \TakeoverInstant
  latex: t_{\text{takeover}}
  definition: time at which a human or the safety enforcer takes control from the learned policy, latched
    at a permission tick
  kind: scalar
  unit: s
- macro: \TakeoverResponseTime
  latex: T_{\Sigma, 1}
  definition: time a human operator needs to take over control after a handover request
  kind: scalar
  unit: s
  notes: Meaning inferred from the name; the subscript in the LaTeX is unexplained.
- macro: \TakeoverStateVisitationDistribution
  latex: p^{\text{takeover}}
  definition: distribution of states visited while an expert recovers the machine after a takeover, conditioned
    on the prior policy having failed
  kind: distribution
  notes: Not the nominal expert occupancy $\ExpertStateVisitationDistribution$; intervention logs drawn
    from it are biased toward failure states.
- macro: \TakeoverTrackingError
  latex: \mathbf{e}_{\text{track}}
  definition: tracking error vector of the plant against the operator's command after a takeover, whose
    norm the stabilization test bounds
  kind: vector
  notes: Not \TrackingErrorBound ($\epsilon_{\text{track}}$), the stopping-budget allowance.
- macro: \TangentDirection
  latex: \mathbf{v}
  definition: direction in state space tested for membership in a contingent cone
  kind: vector
  notes: Not the linear velocity \Velocity.
- macro: \TangentialContactShear
  latex: \mathbf{f}_{k, \parallel}
  definition: friction component of a contact force, tangential to the contact plane
  kind: vector
  unit: N
- macro: \TangentialSpeed
  latex: v_{\text{tangential}}
  definition: speed at which a feature at a given range sweeps across a rotating sensor's view, angular
    rate times range
  kind: scalar
  unit: m/s
- macro: \TargetCriticReturnEstimate
  latex: Q_{\phi'}
  definition: action-value estimate of the target critic network, the slowly Polyak-averaged copy of the
    critic that evaluates the Bellman target
  kind: function
  unit: dimensionless
  notes: Its parameters are $\TargetCriticParameters$; the active critic is $\CriticActionReturnEstimate$.
- macro: \TargetDeterministicPolicy
  latex: \mu_{\theta'}
  definition: slowly updated copy of the deterministic actor, used to choose the next action in the critic's
    Bellman target
  kind: function
  notes: Its parameters are \TargetActorParameters.
- macro: \TargetFramePoint
  latex: \mathbf{p}_A
  definition: coordinates of a point expressed in the destination frame of a transform
  kind: vector
  unit: m
- macro: \TargetHazardRate
  latex: \lambda_{\text{target}}
  definition: tolerable dangerous failure rate assigned to a safety function by risk assessment
  kind: scalar
  unit: 1/h
- macro: \TargetImpedanceDampingMatrix
  latex: \mathbf{D}_d
  definition: damping an impedance or admittance controller makes the end effector present, mapping velocity
    error to force
  kind: matrix
  unit: varies
  notes: Task-space counterpart of \VirtualDampingMatrix.
- macro: \TargetImpedanceInertiaMatrix
  latex: \mathbf{M}_d
  definition: inertia an impedance or admittance controller makes the end effector present to external
    force
  kind: matrix
  unit: varies
  notes: Task-space inertia (kg for translation, kg*m^2 for rotation). Not \GeneralizedInertiaMatrix,
    the physical joint-space inertia.
- macro: \TargetImpedanceStiffnessMatrix
  latex: \mathbf{K}_d
  definition: stiffness an impedance or admittance controller makes the end effector present, mapping
    position error to restoring force
  kind: matrix
  unit: varies
  notes: Task-space counterpart of \VirtualStiffnessMatrix. Not \DerivativeGainMatrix, which shares the
    glyph.
- macro: \TargetOrientation
  latex: \mathbf{R}_{\text{target}}
  definition: rotation matrix of the target orientation a goal set is centered on
  kind: matrix
  unit: dimensionless
- macro: \TargetPlantState
  latex: \mathbf{x}_{f}
  definition: target plant state an input must reach in finite time in the definition of controllability
  kind: vector
  notes: Decorated form of \MechanicalPlantState; the initial state is written $\mathbf{x}_0$ with an
    index.
- macro: \TargetPose
  latex: \mathbf{T}_{\text{target}}
  definition: pose an intent proposal asks the end effector to reach, in the robot base frame
  kind: matrix
  notes: Decorated form of \Pose.
- macro: \TargetPosition
  latex: \mathbf{p}_{\text{target}}
  definition: position of the target an end effector is commanded toward, in the robot base frame
  kind: vector
  unit: m
  notes: Decorated form of \CartesianPosition.
- macro: \TargetPositionComponent
  latex: p_{\text{target},i}
  definition: component of the target position along one coordinate axis
  kind: scalar
  unit: m
  notes: The chapter writes the axis index i inside the label subscript; the registry step may prefer
    $p_{\text{target}}$ with ${\TargetPositionComponent}_i$.
- macro: \TargetRange
  latex: z
  definition: distance from a camera to the target it observes, measured along the viewing direction
  kind: scalar
  unit: m
  notes: Used for stereo depth error growth ($z^2$), rack-end range, and the lever-arm error of a misaligned
    extrinsic; vol4 intent writes the same range in the stereo depth term.
- macro: \TargetTravelDistance
  latex: d
  definition: straight-line distance from the measured end-effector position to the admitted target
  kind: scalar
  unit: m
  notes: Used in the intent-lease reachability test, distance over speed bound within the remaining lease.
- macro: \TargetTrialFailureProbability
  latex: p_{*}
  definition: per-trial failure probability that a zero-failure campaign is sized to bound
  kind: scalar
  unit: dimensionless
  notes: Failure-side counterpart of \TargetTrialSuccessProbability.
- macro: \TargetTrialSuccessProbability
  latex: p_{\text{target}}
  definition: per-trial success probability a test campaign must demonstrate
  kind: scalar
  unit: dimensionless
  notes: Sets the zero-failure trial count through $n \ge \ln\alpha/\ln p_{\text{target}}$.
  aliases:
  - \PertrialProbabilitiesTarget
- macro: \TargetUnitQuaternion
  latex: \mathbf{q}_{\text{quat,target}}
  definition: unit quaternion of the target orientation a goal set is centered on
  kind: vector
  unit: dimensionless
- macro: \TargetXPosition
  latex: x
  definition: x coordinate of a proposed or admitted target position in the robot base frame
  kind: scalar
  unit: m
- macro: \TargetYPosition
  latex: p_y
  definition: y coordinate of a proposed or admitted target position in the robot base frame
  kind: scalar
  unit: m
- macro: \TargetZPosition
  latex: z
  definition: z coordinate of a proposed or admitted target position in the robot base frame
  kind: scalar
  unit: m
- macro: \TaskBlockingTime
  latex: B
  definition: longest time a real-time task can wait for a lower-priority task to release a shared resource
  kind: scalar
  unit: s
  notes: Written with its task index, $\TaskBlockingTime_i$. Under the priority ceiling protocol it is
    at most one lower-priority critical section.
- macro: \TaskCount
  latex: K
  definition: number of tasks in a whole-body control hierarchy or a multi-task learning problem
  kind: count
  notes: Also the index of the last task (L_K, f_K, x_K, w_K).
- macro: \TaskCriticalSections
  latex: cs
  definition: function giving the set of critical sections a task executes whose priority ceiling is at
    or above the priority of the task under analysis
  kind: function
  notes: Written $cs(k)$ in the priority ceiling protocol blocking bound.
- macro: \TaskDerivativeGain
  latex: \mathbf{K}_{d,i}
  definition: derivative feedback gain matrix on the task-space velocity error of task i
  kind: matrix
  notes: Task index i is part of the rendered symbol. Matrix counterpart of \PidDerivativeGain.
- macro: \TaskInterferenceTime
  latex: I
  definition: processor time that higher-priority tasks and interrupt handlers take from a real-time task
    within its response window
  kind: scalar
  unit: s
  notes: Written with its task index, $\TaskInterferenceTime_i$. Depends on the response time itself,
    so it is found by a fixed-point recurrence. Not the arithmetic intensity \ArithmeticIntensity.
- macro: \TaskJacobian
  latex: \mathbf{J}
  definition: Jacobian of a whole-body control task's coordinates with respect to the generalized coordinates
  kind: matrix
  notes: 'Indexed by task, J_i; its pseudo-inverse J_i^dagger appears in null-space projection. Broader
    than \ManipulatorJacobian (end-effector only): tasks include CoM and torso orientation.'
- macro: \TaskJacobianDerivative
  latex: \dot{\mathbf{J}}
  definition: time derivative of a whole-body control task's Jacobian
  kind: matrix
  notes: Indexed by task.
- macro: \TaskJacobianPseudoinverse
  latex: \mathbf{J}^\dagger
  definition: Moore-Penrose pseudoinverse of a whole-body control task's Jacobian, mapping a task acceleration
    to the minimum-norm generalized acceleration that produces it
  kind: matrix
  notes: Indexed by task, $\mathbf{J}_i^\dagger$; with full row rank it equals $\mathbf{J}_i^\top(\mathbf{J}_i\mathbf{J}_i^\top)^{-1}$
    and builds the null-space projector $\NullSpaceProjector$. The dagger is not an allowed decoration
    on $\TaskJacobian$. Not $\JacobianPseudoinverse$, the manipulator (end-effector) case.
- macro: \TaskKinematicMap
  latex: f
  definition: kinematic map of one whole-body control task, from generalized coordinates to that task's
    operational-space coordinates
  kind: function
  notes: Indexed by task, f_i.
- macro: \TaskLossGradient
  latex: \nabla \mathcal{L}
  definition: gradient of one task's loss with respect to the shared parameters in multi-task learning,
    indexed by task
  kind: function
  notes: Conflicting pairs are projected against each other in PCGrad.
- macro: \TaskPeriod
  latex: T
  definition: interval between successive releases of a periodic real-time task, indexed by task
  kind: scalar
  unit: s
- macro: \TaskProportionalGain
  latex: \mathbf{K}_{p,i}
  definition: proportional feedback gain matrix on the task-space position error of task i
  kind: matrix
  notes: Task index i is part of the rendered symbol. Matrix counterpart of \PidProportionalGain.
- macro: \TaskRelativeDeadline
  latex: D
  definition: longest time after its release by which a job of a real-time task must complete
  kind: scalar
  unit: s
  notes: Written with its task index, $\TaskRelativeDeadline_i$. The response-time test is $R_i = C_i
    + B_i + I_i \le D_i$. The series' general deadline is \CompletionDeadline.
- macro: \TaskReleaseJitter
  latex: J
  definition: largest delay between a real-time task's nominal and actual release, indexed by task
  kind: scalar
  unit: s
  notes: Liu-Layland letter, only with a task index.
- macro: \TaskRelevantOutcome
  latex: \mathbf{Y}_{\text{task}}
  definition: task-relevant random variable, such as a latch state or material compliance, whose information
    a representation may retain or lose
  kind: vector
  notes: Second argument of \MutualInformation in the data processing inequality.
- macro: \TaskReward
  latex: r_{\text{task}}
  definition: task-progress term of a shaped reward, before effort and hardware penalties are subtracted
  kind: function
  unit: dimensionless
- macro: \TaskSetUtilization
  latex: U
  definition: share of processor time a set of periodic real-time tasks demands, the sum of each task's
    execution time over its period
  kind: scalar
  unit: dimensionless
  notes: $\TaskSetUtilization = \sum_i \WorstCaseExecutionTime_i/\TaskPeriod_i$; the Liu and Layland rate-monotonic
    bound is $\TaskSetUtilization \le \PeriodicTaskCount(2^{1/\PeriodicTaskCount} - 1)$.
- macro: \TaskSpaceAcceleration
  latex: \ddot{\mathbf{x}}
  definition: acceleration of the operational-space coordinates of a whole-body control task
  kind: vector
  notes: 'Second derivative of \TaskSpaceCoordinates. Not the plant state''s second derivative: the appendix
    reuses the plant-state glyph x for task coordinates.'
- macro: \TaskSpaceCoordinates
  latex: \mathbf{x}
  definition: operational-space coordinates of a whole-body control task, such as an end-effector pose,
    the center-of-mass position or the torso orientation
  kind: vector
  notes: Indexed by task, x_i. The appendix writes these with the plant-state macro \MechanicalPlantState;
    they are task coordinates, not the plant state.
- macro: \TaskSpaceDimension
  latex: m
  definition: number of operational-space coordinates of one whole-body control task
  kind: count
  notes: Indexed by task, m_i. Not \Mass.
- macro: \TaskSpaceReference
  latex: \mathbf{x}_i^{\text{ref}}
  definition: reference operational-space coordinates a high-level policy proposes for whole-body control
    task i
  kind: vector
  notes: The site's raw spans x_i^{ref}; the task index i is part of the rendered symbol.
- macro: \TaskSpaceReferenceAcceleration
  latex: \ddot{\mathbf{x}}^{\text{ref}}
  definition: feedforward reference acceleration of a whole-body control task's operational-space coordinates,
    the second derivative of the proposed task reference
  kind: vector
  notes: Indexed by task after the label, $\ddot{\mathbf{x}}_i^{\text{ref}}$. Second derivative of $\TaskSpaceReference$;
    feeds $\DesiredTaskSpaceAcceleration$.
- macro: \TaskSpaceReferenceVelocity
  latex: \dot{\mathbf{x}}^{\text{ref}}
  definition: reference velocity of a whole-body control task's operational-space coordinates, the first
    derivative of the proposed task reference
  kind: vector
  notes: Indexed by task after the label, $\dot{\mathbf{x}}_i^{\text{ref}}$. First derivative of $\TaskSpaceReference$;
    the derivative gain acts on its difference from $\TaskSpaceVelocity$.
- macro: \TaskSpaceVelocity
  latex: \dot{\mathbf{x}}
  definition: velocity of the operational-space coordinates of a whole-body control task
  kind: vector
  notes: First derivative of \TaskSpaceCoordinates.
- macro: \TaskToleranceSemiAxes
  latex: \mathbf{r}
  definition: principal semi-axes of the ellipsoid within which terminal position error must lie
  kind: vector
  unit: m
- macro: \TaskToleranceSemiAxis
  latex: r
  definition: semi-axis of the task-tolerance ellipsoid along one coordinate axis
  kind: scalar
  unit: m
  notes: Written with the axis index ($r_i$); the vector is \TaskToleranceSemiAxes.
- macro: \TaskWeight
  latex: w
  definition: finite weight on one task's error in a weighted whole-body control objective
  kind: scalar
  unit: dimensionless
  notes: Indexed by task, w_i; a large ratio approximates priority but does not enforce a strict hierarchy.
- macro: \TelemetryFlushTime
  latex: t_{\text{telemetry\_flush}}
  definition: time to flush onboard telemetry buffers between trials, part of the reset latency
  kind: scalar
  unit: s
- macro: \TelemetryFreshnessBound
  latex: \Delta t_{\text{fresh}}
  definition: largest age a measurement may reach before acting on it introduces intolerable error
  kind: scalar
  unit: s
  notes: Error ceiling over speed bound.
- macro: \TelemetryTickInterval
  latex: \Delta t_s
  definition: time between two consecutive joint-telemetry ticks of the safety microcontroller
  kind: scalar
  unit: s
  notes: The Delta is part of the symbol. Close to \SamplingPeriod, which is the controller's execution
    period.
- macro: \TeleoperationCommandLatency
  latex: t_{\text{cmd}}
  definition: time for a teleoperation command to cross from the leader to the follower controller
  kind: scalar
  unit: s
  notes: Not \CommandTransportTime, the permission-path-to-drive fieldbus time.
- macro: \TeleoperationDownlinkTime
  latex: T_{\text{downlink}}
  definition: network transport time of a teleoperation link from the robot to the operator station
  kind: scalar
  unit: s
- macro: \TeleoperationRoundTripLatency
  latex: t_{\text{loop}}
  definition: time from a physical contact disturbance to the follower's corrective actuator response
    in a teleoperation loop
  kind: scalar
  unit: s
- macro: \TeleoperationRoundTripTime
  latex: T_{\text{RTT}}
  definition: network round-trip transport time of a teleoperation link, the downlink transport time plus
    the uplink transport time
  kind: scalar
  unit: s
  notes: Excludes video processing and human reaction.
- macro: \TeleoperationStateVisitationDistribution
  latex: p^{\pi_{\text{teleop}}}
  definition: distribution of states visited during cautious human teleoperation, the occupancy a conservative
    demonstration archive covers
  kind: distribution
  notes: Contrasted with $\ExploratoryStateVisitationDistribution$ in a coverage comparison.
- macro: \TeleoperationUplinkTime
  latex: T_{\text{uplink}}
  definition: network transport time of a teleoperation link from the operator station to the robot
  kind: scalar
  unit: s
- macro: \TeleoperationVideoLatency
  latex: T_{\text{video}}
  definition: time a teleoperation video path spends on camera exposure, encoding and operator display
    processing, excluding network transport
  kind: scalar
  unit: s
  notes: Network transport is charged separately in \TeleoperationRoundTripTime.
- macro: \TemporalEnsemblingWeight
  latex: w_i
  definition: weight given to the prediction of a past chunk at offset i when blending overlapping chunks
  kind: scalar
  unit: dimensionless
  notes: Exponential decay, $w_i = \exp(-m i)$.
- macro: \TerminalFeedbackGain
  latex: \mathbf{K}_f
  definition: gain matrix of the local linear feedback law that keeps the terminal set invariant in model
    predictive control
  kind: matrix
  notes: Not the LQR gain \LqrFeedbackGain.
- macro: \TerminalInvariantSet
  latex: \mathcal{X}_{f}
  definition: set of plant states from which an invariant fallback control law keeps the system safe indefinitely,
    the required endpoint of a receding horizon
  kind: set
  notes: On an embodied system realized by a validated stop that reaches rest within verified clearance.
- macro: \TerminalPlantState
  latex: \mathbf{x}_N
  definition: predicted plant state at the final step of a model-predictive-control horizon
  kind: vector
  notes: Must lie in \TerminalInvariantSet. The subscript is the horizon length, \MpcPredictionHorizon.
- macro: \TerminalTransitTime
  latex: t_{\text{transit}}
  definition: time a terminal move needs under the actuator velocity and acceleration limits
  kind: scalar
  unit: s
- macro: \TerminalVoltageLimit
  latex: V_{\max}
  definition: largest magnitude of winding terminal voltage the inverter can apply
  kind: scalar
  unit: V
- macro: \TerminationProtocol
  latex: \kappa
  definition: 'termination protocol of a trial: its execution deadline, goal region and outcome predicate'
  kind: record
  notes: Not \ClassKFunction (also kappa). backmatter/appendix_ml.qmd uses kappa for permission-path parameters,
    a different meaning.
- macro: \TextTokenCount
  latex: S_{\text{text}}
  definition: number of language tokens a natural-language instruction contributes to an embodied transformer's
    input
  kind: count
- macro: \TextTokenEmbeddings
  latex: \mathbf{z}_{\text{text}}
  definition: token embeddings of the language instruction fed to an embodied transformer
  kind: vector
  notes: One block of \MultimodalFusedTokenStream.
- macro: \ThermalExpansionCoefficient
  latex: \alpha
  definition: fractional change in a material's length per kelvin of temperature change
  kind: scalar
  unit: 1/K
- macro: \ThermalPenaltyWeight
  latex: \lambda_T
  definition: weight of the winding-temperature excess over its limit in a shaped reward, the thermal
    penalty
  kind: scalar
  unit: 1/degC
- macro: \ThermalResistance
  latex: R_{\text{th}}
  definition: lumped thermal resistance from the stator windings to ambient, temperature rise per watt
  kind: scalar
  unit: K/W
- macro: \ThermalTimeConstant
  latex: \tau_{\text{th}}
  definition: characteristic time for a motor winding to heat or cool, thermal resistance times thermal
    capacitance
  kind: scalar
  unit: s
  notes: Typically 60 to 300 s.
- macro: \ThresholdExceedanceRate
  latex: \zeta_u
  definition: probability per trial that a performance metric exceeds the threshold, estimated as exceedances
    over trials
  kind: scalar
  unit: dimensionless
- macro: \ThresholdExcessVariable
  latex: Y
  definition: excess of the monitored quantity over the threshold, conditional on exceeding it, treated
    as a random variable
  kind: scalar
  unit: varies
  notes: Lowercase \ThresholdExcess is one of its values.
- macro: \TickIndex
  latex: n
  definition: position of one tick in the sequence of consecutive permission ticks
  kind: index
- macro: \TickPeriodJitterBound
  latex: J_{\text{phase}}
  definition: bound on how far the interval between consecutive tick starts deviates from the nominal
    tick period
  kind: scalar
  unit: s
  notes: Supported by measured cycle-to-cycle period jitter under maximum bus contention, with allowances
    for unobserved conditions.
- macro: \TightenedDiscreteSafeSet
  latex: \mathcal{C}_{\text{discrete}}
  definition: safe set shrunk by the worst-case inter-sample drift, so that checking the barrier at sample
    instants keeps the state safe between them
  kind: set
  notes: Decorated form of \ForwardInvariantSafeSet.
- macro: \TiltAngle
  latex: \theta_{\text{tilt}}
  definition: angular deflection of a body from vertical
  kind: scalar
  unit: rad
- macro: \TimeScaleSeparationRatio
  latex: \epsilon
  definition: small ratio of the fast elastic time scale to the slow rigid-body time scale in a singular
    perturbation model
  kind: scalar
  unit: dimensionless
  notes: Not \SingleStepImitationError or \ConformalMiscoverageRate, which share the glyph.
- macro: \TimeoutTrialCount
  latex: n_{\text{timeout}}
  definition: number of trials in a campaign that end by reaching their execution deadline
  kind: count
- macro: \TimerClockPeriod
  latex: T_{\text{timer\_clk}}
  definition: period of the clock that increments a microcontroller timer's counter
  kind: scalar
  unit: s
- macro: \TimestampJitterDelay
  latex: \delta_{\text{jitter}}
  definition: random variation in the delay between a physical event and its timestamp, from scheduling
    or transport
  kind: scalar
  unit: s
  notes: A signed delay term, not \TimingJitter (the standard deviation of a periodic event's timing).
- macro: \TimestampQuantizationBound
  latex: T_{\text{quant}}
  definition: bound on the quantization error of one hardware timestamp
  kind: scalar
  unit: s
- macro: \TimestampSkew
  latex: t_{\text{skew}}
  definition: skew between the time stamps of two records or clocks
  kind: scalar
  unit: s
  notes: The book writes it with the finite-change prefix, $\Delta t_{\text{skew}}$.
- macro: \TimingJitter
  latex: \sigma_{\text{jitter}}
  definition: standard deviation of a nominally periodic event's timing about its schedule
  kind: scalar
  unit: s
- macro: \TimingRealityGap
  latex: \Delta_{\text{lat}}
  definition: 'timing component of the reality gap: discrepancy between the simulated and physical observation-to-actuation
    latency and its jitter'
  kind: scalar
  unit: s
  notes: Component of \RealityGapVector. Not \Latency.
- macro: \ToleranceEllipsoidMatrix
  latex: \mathbf{E}
  definition: positive-definite weighting matrix of the ellipsoidal norm that bounds terminal position
    error, diagonal in the inverse squared tolerance semi-axes
  kind: matrix
  notes: Not \EssentialMatrix, which shares the glyph.
- macro: \ToleratedPositionError
  latex: \epsilon_{\text{pos}}
  definition: largest position error a fusion pipeline tolerates, which with the speed bound sets the
    allowable clock skew
  kind: scalar
  unit: m
- macro: \ToolCartesianPose
  latex: \mathbf{x}
  definition: Cartesian pose of the tool or end effector written as a task-space vector of position and
    orientation
  kind: vector
  notes: Not \MechanicalPlantState, which shares the glyph. Its finite change is the end-effector displacement
    of cross-embodiment action spaces.
- macro: \ToolCartesianVelocity
  latex: \dot{\mathbf{x}}
  definition: spatial velocity of the tool or end effector in Cartesian task space
  kind: vector
  notes: Not \PlantStateRate, which shares the glyph.
- macro: \ToolCenterPointAxis
  latex: \hat{\mathbf{z}}_{\text{TCP}}
  definition: unit vector along the z axis of the tool center point frame, the direction the gripper points
  kind: vector
  unit: dimensionless
  notes: The hat marks unit length, not an estimate.
- macro: \ToolCenterPointFrame
  latex: \mathcal{F}_{\text{TCP}}
  definition: coordinate frame of the tool center point, its origin between the gripper fingertips
  kind: set
  notes: A specific end-effector frame; the generic one is \EndEffectorReferenceFrame.
- macro: \ToolCenterPointPose
  latex: \mathbf{T}_{\text{TCP}}
  definition: pose of the tool center point frame, its rotation and position in the robot base frame
  kind: matrix
  notes: Decorated form of \Pose.
- macro: \ToolCenterPointPosition
  latex: \mathbf{p}_{\text{TCP}}
  definition: position of the tool center point, midway between the gripper fingertips
  kind: vector
  unit: m
  notes: Decorated form of \CartesianPosition.
- macro: \ToolClearanceDistance
  latex: d_{\text{tool}}
  definition: distance from the tool point to the obstacle surface it approaches
  kind: scalar
  unit: m
- macro: \ToolPlanarAbscissa
  latex: x
  definition: first coordinate of the tool position in the plane of a planar arm, along the axis from
    which the shoulder angle is measured
  kind: scalar
  unit: m
- macro: \ToolPlanarOrdinate
  latex: y
  definition: second coordinate of the tool position in the plane of a planar arm
  kind: scalar
  unit: m
- macro: \ToolPositionError
  latex: e_{\text{tool}}
  definition: error in the computed tool or fingertip position
  kind: scalar
  unit: m
  notes: Line 929 sums it as $e_0 + e_{\text{trans}} + e_{\text{rot}}$.
- macro: \ToolSpeedLimit
  latex: v_{\text{TCP}}
  definition: largest speed the tool center point of an arm may move at, its TCP speed limit
  kind: scalar
  unit: m/s
  notes: Mapped to a joint-rate demand through the Jacobian, $\|\GeneralizedVelocities\| = \ToolSpeedLimit/\SmallestJacobianSingularNumber$
    in the weakest direction. Not $\SpeedAtDetection$, the speed at the instant a hazard is detected,
    nor $\SpeedBound$, the speed a budget credits.
- macro: \ToolTipPose
  latex: \mathbf{T}_{\text{tool}}
  definition: pose of the tool tip, the flange pose composed with the tool offset
  kind: matrix
- macro: \TopologicalPlaceNode
  latex: p^{\text{place}}
  definition: one topological place node of a 3D scene graph, a free-space clearance sphere linked to
    its neighbors
  kind: record
- macro: \TorqueCutoffCommand
  latex: \mathbf{u}_{\text{cutoff}}
  definition: fallback command that removes actuator torque and drops the spring brakes
  kind: vector
  notes: INHIBIT rung of the fallback ladder, realized on a hardware path (safe torque off).
- macro: \TorqueEffortPenaltyWeight
  latex: \lambda_{\tau}
  definition: weight of the squared joint-torque norm in a shaped reward, the effort penalty
  kind: scalar
  unit: 1/(N*m)^2
- macro: \TorqueProducingCurrent
  latex: i_q
  definition: quadrature-axis current of a field-oriented drive, the current component that produces torque
  kind: scalar
  unit: A
  aliases:
  - \TorqueproducingCurrent
- macro: \TorqueRateLimit
  latex: \dot{\tau}_{\max}
  definition: largest rate of change of joint output torque a drive accepts
  kind: scalar
  unit: N*m/s
  notes: Divided by \EffectiveJointInertia it bounds joint jerk; a torque step of size $\Delta\tau$ needs
    at least $\Delta\tau/\TorqueRateLimit$.
- macro: \TorqueRegularizationWeight
  latex: w_\tau
  definition: weight on the squared joint-torque regularization term of a whole-body control objective
  kind: scalar
  unit: varies
  notes: Converts squared torque into the objective's units (squared task acceleration), so its unit depends
    on how the task terms are scaled.
- macro: \TorqueSlewPenaltyWeight
  latex: \lambda_{\dot{\tau}}
  definition: weight of the squared rate of change of joint torque in a shaped reward, the slew penalty
  kind: scalar
  unit: s^2/(N*m)^2
- macro: \TotalCollisionQueryTime
  latex: T_{\text{query\_total}}
  definition: total time of the clearance queries for every collision hull in one permission tick
  kind: scalar
  unit: s
- macro: \TotalDelayPhaseShift
  latex: \phi_{\text{total}}
  definition: phase that the combined compute, bus and zero-order-hold delays contribute near crossover
  kind: scalar
  unit: rad
  notes: Written with \FiniteChange as the lag $\Delta\phi_{\text{total}}$.
- macro: \TotalExecutedTrialCount
  latex: N_{\text{total}}
  definition: total number of trials a test campaign executed
  kind: count
- macro: \TotalGateCharge
  latex: Q_g
  definition: total charge the gate driver moves into or out of a power switch's gate during one transition
  kind: scalar
  unit: A*s
- macro: \TotalInterventionCount
  latex: N_{\text{int}}
  definition: total number of interventions recorded across an evaluation campaign, human takeovers, permission-path
    clips and stops, and tripwires
  kind: count
  notes: The sum of the per-trial counts \TrialInterventionCount.
- macro: \TotalKineticEnergy
  latex: E_{k,\text{total}}
  definition: total kinetic energy of a machine, its translational energy plus the rotational energy of
    its powertrain
  kind: scalar
  unit: J
  notes: Equals one half effective impact mass times speed squared.
- macro: \TotalPipelineLatency
  latex: L_{\text{lat,total}}
  definition: end-to-end latency of the physical sensing-to-actuation pipeline, from observation capture
    to actuation
  kind: scalar
  unit: s
  notes: Quoted at a percentile. Not \Latency, the fixed per-step overhead.
- macro: \TrackIndex
  latex: i
  definition: index of one active track in a multi-object tracker
  kind: index
- macro: \TrackLastUpdateTime
  latex: t_{\text{last}}
  definition: time of the most recent observation associated with a track
  kind: scalar
  unit: s
- macro: \TrackLossTimeout
  latex: T_{\text{lost}}
  definition: time a coasting track may go without an associated observation before it is terminated
  kind: scalar
  unit: s
- macro: \TrackPositionDeviation
  latex: \sigma_{\text{track}}
  definition: root-mean-square position deviation of a track covariance propagated forward over an elapsed
    time
  kind: function
  unit: m
  notes: 16_release writes sigma_track for tracking-error variance of a controller, a different quantity.
- macro: \TrackPredictedErrorCovariance
  latex: \mathbf{P}_{t|t-1}
  definition: error covariance of a track predicted to frame t from observations through frame t minus
    one
  kind: matrix
- macro: \TrackPredictedStateEstimate
  latex: \hat{\mathbf{x}}_{t|t-1}
  definition: state of a track predicted to frame t from observations through frame t minus one
  kind: vector
  notes: Same role as \PredictedStateEstimate with the frame index in place of the step index.
- macro: \TrackedEvidenceHorizon
  latex: \tau_{\text{ev,tracked}}
  definition: evidence horizon of a target whose steady drift a tracker cancels, leaving only slip acceleration
  kind: scalar
  unit: s
  notes: Special case of \EvidenceHorizon with zero drift velocity.
- macro: \TrackerFrameIndex
  latex: t
  definition: index of one perception frame in a multi-object tracker
  kind: index
  notes: Plays the role of \EstimatorStepIndex.
- macro: \TrackingErrorAcceleration
  latex: \ddot{\mathbf{e}}
  definition: second time derivative of the tracking error vector, the acceleration error
  kind: vector
  notes: Appears in the closed-loop error equation $\ddot{\mathbf{e}} + \mathbf{K}_d \dot{\mathbf{e}}
    + \mathbf{K}_p \mathbf{e} = \mathbf{0}$.
- macro: \TrackingErrorAllowance
  latex: \epsilon_{\text{pos}}
  definition: part of the swept-volume clearance left for tracking error after the structural deflection
    and compliance allowance is deducted, a ceiling on the tracking threshold
  kind: scalar
  unit: m
  notes: The validated \TrackingErrorBound must fit within it. Not \PositionalTaskTolerance.
- macro: \TrackingErrorBound
  latex: \epsilon_{\text{track}}
  definition: bound on the distance between the commanded and the executed position of the tracked point
  kind: scalar
  unit: m
  notes: Stated by the enforcement record with its validity envelope.
  aliases:
  - \TrackingerrorBound
- macro: \TrackingErrorDistance
  latex: e
  definition: instantaneous tracking error, the distance between the measured and the commanded position
    of the tracked point
  kind: scalar
  unit: m
  notes: Bounded by \TrackingErrorBound; not the initial estimate error \InitialTrackingError ($e_0$)
    or the divergence residual \TrajectoryDivergenceResidual.
- macro: \TrackingErrorRate
  latex: \dot{\mathbf{e}}
  definition: time derivative of the tracking error vector, the velocity error of a feedback controller
  kind: vector
  notes: Multiplied by \DerivativeGainMatrix in PD control; a step in it produces a torque step.
- macro: \TrackingErrorVector
  latex: \mathbf{e}
  definition: tracking error vector of a feedback controller, the commanded reference state minus the
    measured state
  kind: vector
  notes: Acted on by \ProportionalGainMatrix; its time derivative is \TrackingErrorRate. Not \ErrorFeedbackResidual
    or \EntityEmbedding, which share the glyph.
- macro: \TrackingRelaxationSlack
  latex: \delta
  definition: nonnegative slack variable that relaxes the control Lyapunov (tracking) constraint in a
    CLF-CBF quadratic program while the barrier constraint stays hard
  kind: scalar
  unit: varies
  notes: Has the units of the Lyapunov rate (units of V per second).
- macro: \TrackingSlackPenaltyWeight
  latex: p
  definition: weight on the squared tracking-relaxation slack in the objective of a CLF-CBF quadratic
    program
  kind: scalar
  unit: varies
  notes: Large values ($p \gg 1$) make the tracking constraint nearly hard; units make $p\delta^2$ commensurate
    with the squared input deviation.
- macro: \TrackingStartInstant
  latex: t_{\text{start}}
  definition: instant, on the permission clock, at which nominal tracking of an admitted trajectory record
    begins
  kind: scalar
  unit: s
  notes: 'First of the record''s four deadlines: start, nominal expiry, commitment, stop completion.'
- macro: \TractionLimitedDeceleration
  latex: a
  definition: deceleration the machine can achieve once floor traction is taken into account, the smaller
    of the credible deceleration and friction coefficient times gravity
  kind: scalar
  unit: m/s^2
  notes: $a = \min(a_{\text{brake}}, \mu g)$.
- macro: \TractiveForce
  latex: F_x
  definition: longitudinal tractive force the ground transmits to a wheel at its contact patch, a function
    of slip ratio
  kind: scalar
  unit: N
- macro: \TrainingLabelMask
  latex: \mathcal{M}_{\text{train}}
  definition: indicator that admits a logged command as an imitation training target (one) or masks it
    out (zero)
  kind: scalar
  unit: dimensionless
- macro: \TrajectoryDivergenceResidual
  latex: e_{\text{div}}
  definition: signed error between measured and planned kinematics used to detect a diverging rollout
  kind: scalar
  unit: m
  notes: For the latch example, the lateral gripper-position error in the fixture frame.
- macro: \TrajectoryOptimizationObjective
  latex: \mathcal{U}
  definition: objective functional continuous trajectory optimization minimizes over a joint trajectory,
    balancing smoothness against obstacle proximity
  kind: function
  unit: varies
  notes: Takes the whole trajectory as its argument, $\TrajectoryOptimizationObjective[\GeneralizedCoordinates]$.
    Not \AdmissibleControlSet.
- macro: \TrajectoryRecordDuration
  latex: T_{\text{record}}
  definition: 'time span an admitted trajectory record must cover: request offset, design-tail replacement
    latency, admission reserve and stop'
  kind: scalar
  unit: s
- macro: \TrajectoryRecordFrame
  latex: \mathcal{F}
  definition: coordinate frame in which a trajectory record expresses its references
  kind: set
  notes: One of \WorldReferenceFrame, \BodyReferenceFrame or \EndEffectorReferenceFrame in practice.
- macro: \TrajectoryReturn
  latex: R
  definition: discounted sum of the rewards a trajectory collects, a function of the whole trajectory
  kind: function
  unit: dimensionless
  notes: Written with its trajectory argument, R(tau). Not \TrajectoryReward (a verifier's reward for
    a whole trajectory) or \RewardFunction.
- macro: \TrajectorySampleCount
  latex: N
  definition: number of time samples in a candidate trajectory that a checker evaluates
  kind: count
  notes: Not \TrialCount.
- macro: \TrajectoryStateSpace
  latex: \mathcal{S}
  definition: set of system states that simulated and physical trajectories take values in
  kind: set
- macro: \TransceiverDelay
  latex: t_{\text{transceiver}}
  definition: signal delay through a fieldbus node transceiver
  kind: scalar
  unit: s
- macro: \TransductionInstant
  latex: t_{\text{transduction}}
  definition: instant at which a sensor converted the physical quantity it measures into a signal
  kind: scalar
  unit: s
  notes: Origin of the observation age.
- macro: \TransferDiscrepancyBound
  latex: \epsilon_{\text{gap}}
  definition: bound on the sim-to-real transfer discrepancy, the largest weighted state error between
    real and simulated trajectories over the horizon
  kind: scalar
  unit: dimensionless
  notes: Dimensionless under the declared weighting; its empirical estimate is \EmpiricalTransferDiscrepancy.
- macro: \TransformGraph
  latex: \mathcal{G}
  definition: directed graph whose vertices are a robot's coordinate frames and whose edges are the rigid
    transforms between them
  kind: set
- macro: \TransformGraphEdgeSet
  latex: \mathcal{E}
  definition: set of directed edges of a robot's transform graph, each a time-varying rigid transform
    between two frames
  kind: set
- macro: \TransformGraphFrame
  latex: \mathcal{F}
  definition: one coordinate frame, a vertex of a robot's transform graph
  kind: set
  notes: Indexed by frame, $\mathcal{F}_i$.
- macro: \TransformGraphVertexSet
  latex: \mathcal{V}
  definition: set of coordinate frames that are the vertices of a robot's transform graph
  kind: set
- macro: \TransformRotationBlock
  latex: \mathbf{R}_{AB}
  definition: rotation block of the homogeneous transform from frame B to frame A
  kind: matrix
- macro: \TransformTranslationBlock
  latex: \mathbf{t}_{AB}
  definition: translation block of the homogeneous transform from frame B to frame A
  kind: vector
  unit: m
- macro: \TransformedCartesianPosition
  latex: \mathbf{p}'
  definition: position of a 3D point after a rigid transform carries it into another coordinate frame
  kind: vector
  unit: m
  notes: Image of $\CartesianPosition$ under the rotation and translation of a rigid transform.
- macro: \TransformedHomogeneousPointCoordinates
  latex: \tilde{\mathbf{p}}'
  definition: homogeneous coordinates of a 3D point after a rigid transform carries it into another coordinate
    frame
  kind: vector
  unit: m
  notes: Image of $\HomogeneousPointCoordinates$ under a pose $\Pose$.
- macro: \TranslationalDriftError
  latex: e_{\text{trans}}
  definition: displacement from unobserved translational motion during a stale interval
  kind: scalar
  unit: m
- macro: \TranslationalJerk
  latex: j
  definition: rate of change of acceleration of a moving body along its path, the third time derivative
    of its position
  kind: scalar
  unit: m/s^3
  notes: Linear counterpart of \JointJerk (rad/s^3); its bound is \JerkLimit.
- macro: \TranslationalKineticEnergy
  latex: E_{k,\text{trans}}
  definition: kinetic energy of a machine's translating chassis and payload, one half its mass times its
    speed squared
  kind: scalar
  unit: J
  notes: Summed with \RotationalKineticEnergy to give \TotalKineticEnergy.
- macro: \TransmissionInputInertia
  latex: J_{\text{in}}
  definition: inertia on the input side of a transmission, the rotor plus the gear input stage
  kind: scalar
  unit: kg*m^2
  notes: Reflected inertia is gear ratio squared times it.
- macro: \TransmissionTorsionalStiffness
  latex: K_{\text{joint}}
  definition: torsional stiffness of a joint's transmission between rotor and output link
  kind: scalar
  unit: N*m/rad
- macro: \TransverseStandardDeviation
  latex: \sigma_\perp
  definition: standard deviation of an unprojected point's position perpendicular to the viewing ray
  kind: scalar
  unit: m
  notes: About range over focal length times the pixel standard deviation.
- macro: \TravelPosition
  latex: x
  definition: position of a body along the path over which a force acts
  kind: scalar
  unit: m
  notes: Integration variable of mechanical work.
- macro: \TraverseDistance
  latex: d
  definition: distance driven along a straight traverse
  kind: scalar
  unit: m
  notes: Not the differential d.
- macro: \TrialCampaignWallTime
  latex: T_{\text{wall}}
  definition: wall-clock duration of a physical learning campaign, trials times rollout plus reset time,
    divided by the rig count
  kind: scalar
  unit: s
- macro: \TrialCompletionIndicator
  latex: Y
  definition: binary outcome of one trial, one when the goal is reached within the execution deadline,
    interventions allowed
  kind: scalar
  unit: dimensionless
  notes: Indexed by trial, $Y_i$; the unassisted version is \UnassistedSuccessIndicator.
- macro: \TrialCondition
  latex: c
  definition: 'condition of one physical trial: initial plant state, environment parameters, plant parameters,
    computational configuration and termination protocol'
  kind: record
  notes: Drawn from the operational test distribution; the argument of the trajectory Traj(c).
- macro: \TrialControlStepCount
  latex: N_{\text{steps}, i}
  definition: number of control cycles executed in one trial, indexed by trial
  kind: count
  notes: The trial index sits inside the label subscript as the chapter writes it.
- macro: \TrialCount
  latex: N
  definition: number of physical trials in a learning or evaluation campaign
  kind: count
  notes: As in the wall-clock law $T_{\text{wall}} = N(t_{\text{rollout}} + t_{\text{reset}})/N_{\text{rig}}$.
    Not the zero-failure demonstration count \ZeroFailureTrialCount.
- macro: \TrialFailureIndicator
  latex: x
  definition: outcome of one trial, one if it fails and zero if it succeeds
  kind: scalar
  unit: dimensionless
  notes: Indexed by trial, $x_i$; their sum over m trials is \ObservedTrialFailureCount.
- macro: \TrialFailureProbability
  latex: p_{\text{fail}}
  definition: probability that one physical trial fails
  kind: scalar
  unit: dimensionless
  aliases:
  - \PertrialProbabilitiesFail
- macro: \TrialIndex
  latex: n
  definition: position of one physical trial within a learning campaign, counted from one
  kind: index
- macro: \TrialInterventionCount
  latex: n_{\text{int}}
  definition: number of supervisory interventions, human or automatic, during one trial, indexed by trial
  kind: count
- macro: \TrialLoadReversalCount
  latex: n_{\text{rev}}
  definition: number of drivetrain load reversals one physical trial causes
  kind: count
- macro: \TrialPathDistance
  latex: d
  definition: path distance the machine traverses during one trial, indexed by trial
  kind: scalar
  unit: m
  notes: Not \TargetTravelDistance.
- macro: \TrialResetLatency
  latex: T_{\text{reset}}
  definition: 'time to restore the robot and workspace for the next trial after one completes or aborts:
    physical restore, recalibration and telemetry flush'
  kind: scalar
  unit: s
  notes: agentic \EnvironmentResetTime is the software-environment analog.
- macro: \TrialResetTime
  latex: t_{\text{reset}}
  definition: time to return a physical rig and its fixture to the initial configuration between trials
  kind: scalar
  unit: s
  notes: Physical counterpart of \EnvironmentResetTime.
- macro: \TrialRolloutTime
  latex: t_{\text{rollout}}
  definition: duration of one physical trial's autonomous execution on the machine, excluding the reset
  kind: scalar
  unit: s
- macro: \TrialRunTime
  latex: t_{\text{run}}
  definition: active execution time of one trial, before its reset
  kind: scalar
  unit: s
- macro: \TrialSuccessProbability
  latex: p
  definition: true probability that one trial succeeds under the declared evaluation protocol and test
    distribution
  kind: scalar
  unit: dimensionless
  notes: Written p(D) when its test distribution is shown. Complement of \TrialFailureProbability.
- macro: \TrichotomyMonitorState
  latex: \mathcal{T}_{\text{trichotomy}}
  definition: 'set of three verdicts a runtime monitor can return: known true, known false, or unknown'
  kind: set
- macro: \TrueClearance
  latex: C_{\text{true}}
  definition: actual separation between an obstacle and the machine's envelope
  kind: scalar
  unit: m
  notes: At least the nominal clearance minus the spatial error norm.
- macro: \TrueReferentScore
  latex: c_{y_j}
  definition: normalized score a detector assigns to the ground-truth referent of one calibration scene
  kind: scalar
  unit: dimensionless
  notes: The candidate score \NormalizedCandidateScore evaluated at the true referent of scene j.
- macro: \TruncatedDistanceSample
  latex: d_{\mu}
  definition: projective distance sample at a voxel clamped to plus or minus the truncation band, in meters
  kind: function
  unit: m
  notes: Metric, unlike the normalized \TruncatedSignedDistance.
- macro: \TruncatedSignedDistance
  latex: \text{tsdf}
  definition: signed distance from a voxel to the nearest surface, divided by the truncation band and
    clamped to plus or minus one
  kind: function
  unit: dimensionless
  notes: Truncation band is \TsdfTruncationBand.
  aliases:
  - \TruncatedSignedDistanceVox
- macro: \TruncationBandVolume
  latex: V_{\text{band}}
  definition: volume of the shell around observed surfaces within the truncation band
  kind: scalar
  unit: m^3
- macro: \TruthInstrumentSet
  latex: \mathcal{I}_{\text{truth}}
  definition: set of independent truth instruments (sensors and digitizers) that observe the plant separately
    from the system under test
  kind: set
- macro: \TsdfAccumulatedDistance
  latex: D
  definition: running weighted average of the truncated signed distance at a voxel after t frames
  kind: function
  unit: dimensionless
- macro: \TsdfAccumulatedWeight
  latex: W
  definition: accumulated observation weight at a voxel after t frames
  kind: function
  unit: dimensionless
  aliases:
  - \TsdfAccumulatedVolumeVox
- macro: \TsdfObservationWeight
  latex: w
  definition: weight one new depth observation receives when it is fused into a voxel's running distance
    average
  kind: scalar
  unit: dimensionless
  notes: Indexed by frame; adds to \TsdfAccumulatedWeight.
- macro: \TsdfTruncationBand
  latex: \mu_{\text{tsdf}}
  definition: distance from a surface within which signed distances are stored rather than clamped
  kind: scalar
  unit: m
  notes: Metric thickness of the spatial surface interface band stored in voxel memory.
- macro: \TsdfWeightCap
  latex: W_{\max}
  definition: largest value the accumulated fusion weight of a voxel may reach, which keeps old evidence
    from dominating
  kind: scalar
  unit: dimensionless
  notes: Cap on \TsdfAccumulatedWeight.
- macro: \TurnOffGateCurrent
  latex: I_{g,\text{off}}
  definition: current the gate driver sinks from a power switch's gate during turn-off
  kind: scalar
  unit: A
- macro: \TurnOffGateResistance
  latex: R_{g,\text{off}}
  definition: gate resistance in the turn-off path of a power switch's gate driver
  kind: scalar
  unit: Ohm
- macro: \TurnOnGateResistance
  latex: R_{g,\text{on}}
  definition: gate resistance in the turn-on path of a power switch's gate driver
  kind: scalar
  unit: Ohm
- macro: \TustinEigenvalue
  latex: \lambda_{\text{Tustin}}
  definition: eigenvalue of the bilinear (Tustin) transition matrix
  kind: scalar
  unit: dimensionless
  notes: Modulus exactly one for purely imaginary continuous poles.
- macro: \TustinTransitionMatrix
  latex: \mathbf{A}_{\text{Tustin}}
  definition: discrete-time transition matrix that the bilinear (Tustin, trapezoidal) transform produces
  kind: matrix
  notes: Maps the continuous imaginary axis onto the discrete unit circle.
- macro: \TwinCriticReturnEstimate
  latex: Q_{\phi_i}
  definition: action-value estimate of the i-th of two independently parameterized critics, each a noisy
    estimate of the true action value
  kind: function
  unit: dimensionless
  notes: The index i runs over the two critics, $\FirstTwinCriticReturnEstimate$ and $\SecondTwinCriticReturnEstimate$;
    the target copy is $\TargetTwinCriticReturnEstimate$.
- macro: \TwistCoordinates
  latex: \boldsymbol{\xi}
  definition: 'twist coordinates of a rigid-body pose increment: three translation coordinates stacked
    with three rotation coordinates'
  kind: vector
  notes: Not \SimulationParameterVector, which shares the glyph in the training chapter.
- macro: \TwistCovarianceMatrix
  latex: \boldsymbol{\Sigma}_{\boldsymbol{\xi}}
  definition: six-by-six covariance of a pose perturbation in local tangent (twist) coordinates
  kind: matrix
  unit: varies
  notes: rad^2 in the rotation block, m^2 in the translation block, m*rad off the diagonal.
- macro: \TwistMatrix
  latex: \hat{\boldsymbol{\xi}}
  definition: four-by-four matrix form of a twist, an element of the Lie algebra that the exponential
    map turns into a rigid transform
  kind: matrix
- macro: \TwistRotationAngle
  latex: \theta_{\text{rot}}
  definition: rotation angle of a twist, the magnitude of its rotation coordinates
  kind: scalar
  unit: rad
- macro: \TwistRotationCoordinates
  latex: \boldsymbol{\omega}
  definition: 'rotation part of a twist coordinate vector: rotation axis times rotation angle of a finite
    pose increment'
  kind: vector
  unit: rad
  notes: Not \AngularVelocity; a velocity twist times elapsed time gives these coordinates.
- macro: \TwistTranslationMatrix
  latex: \mathbf{V}
  definition: three-by-three matrix that maps the translation coordinates of a twist to the translation
    of its exponential, the left Jacobian of SO(3)
  kind: matrix
- macro: \TwistWedgeOperator
  latex: \wedge
  definition: wedge operator of rigid-body motion, which maps six twist coordinates to their four-by-four
    matrix in the Lie algebra of the special Euclidean group
  kind: operator
  notes: Written as a superscript on the twist, $\TwistCoordinates^{\TwistWedgeOperator} = \TwistMatrix$.
- macro: \UnassistedCompletionCount
  latex: N_{\text{unassisted}}
  definition: number of trials in a campaign that reach the goal with no supervisory intervention
  kind: count
- macro: \UnassistedSuccessIndicator
  latex: A
  definition: binary indicator that one trial reached its goal within the deadline with no intervention,
    the per-trial term of the autonomous completion rate
  kind: scalar
  unit: dimensionless
  notes: Indexed by trial, $A_i$.
- macro: \UnbiasedAngularBrakingDeceleration
  latex: \alpha_{\text{nom}}
  definition: angular deceleration a joint produces from its peak torque with no bias torque acting
  kind: scalar
  unit: rad/s^2
  notes: $\tau_{\max}/J$; compare \NetAngularBrakingDeceleration.
- macro: \UnbrakedImpactForce
  latex: F_{\text{unbraked}}
  definition: peak transient contact force when the robot strikes a body at speed without braking
  kind: scalar
  unit: N
  notes: $v\sqrt{k_H m_{\text{red}}}$, the ISO/TS 15066 transient model.
- macro: \UncertainScenarioParameters
  latex: x
  definition: uncertain input parameters of one simulated scenario, drawn from an operational or proposal
    distribution
  kind: record
  notes: Indexed $x_i$ for the i-th draw.
- macro: \UndampedNaturalFrequency
  latex: \omega_n
  definition: undamped natural angular frequency of a second-order closed-loop error equation, the square
    root of stiffness over mass
  kind: scalar
  unit: rad/s
  notes: With \DampingRatio it fixes the PD step response. The subscript n is a label (natural), so the
    macro spans it.
- macro: \UnitImpulseFunction
  latex: \delta
  definition: Dirac delta, the idealized unit impulse of zero width and unit area
  kind: function
  unit: 1/s
  notes: With time as its argument it carries inverse seconds.
- macro: \UnitQuaternion
  latex: \mathbf{q}_{\text{quat}}
  definition: four-component unit-norm vector representing an orientation
  kind: vector
  unit: dimensionless
- macro: \UnitQuaternionScalarComponent
  latex: q_w
  definition: scalar part of a unit orientation quaternion
  kind: scalar
  unit: dimensionless
- macro: \UnitQuaternionSphere
  latex: S^3
  definition: unit three-sphere, the set of four-component vectors of unit length in which unit quaternions
    live
  kind: set
  notes: Each rotation corresponds to two antipodal points of it (the double cover of SO(3)).
  render_exception: Mathematics writes the unit three-sphere as an upright S with superscript 3.
- macro: \UnitQuaternionXComponent
