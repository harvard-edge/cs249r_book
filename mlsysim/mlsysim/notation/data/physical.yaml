  kind: vector
  unit: varies
  notes: Units follow the command channel. Compared against $\CandidateControlCommand$ for the shadow-mode
    action discrepancy; distinct from $\BaselineControllerAction$ ($\mathbf{a}_t^{\text{base}}$).
- macro: \IncumbentInterventionRate
  latex: \lambda_{\text{incumbent}}
  definition: rate of enforcer or operator interventions per operating hour of the incumbent controller
  kind: scalar
  unit: 1/h
- macro: \IncumbentTrackingErrorStandardDeviation
  latex: \sigma_{\text{incumbent}}
