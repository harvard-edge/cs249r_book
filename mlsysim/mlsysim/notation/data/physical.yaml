    gate resistance
  kind: scalar
  unit: V
- macro: \InductiveVoltage
  latex: v
  definition: voltage across a coil, inductance times the rate of change of its current
  kind: scalar
  unit: V
- macro: \InertiaMatchingRatio
  latex: N^*
