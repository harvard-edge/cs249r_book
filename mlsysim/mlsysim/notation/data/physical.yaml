  kind: scalar
  unit: dimensionless
  notes: $\sqrt{J_{\text{load}} / J_{\text{rotor}}}$.
  aliases:
  - \OptimalInertiamatchingRatio
- macro: \InertiaMatrixDerivative
  latex: \dot{\mathbf{M}}
  definition: time derivative of the joint-space inertia matrix along a motion
  kind: matrix
  unit: kg*m^2/s
  notes: Appears in the skew-symmetry (passivity) property of $\dot{\mathbf{M}} - 2\mathbf{C}$.
- macro: \InertialIntegrationTime
