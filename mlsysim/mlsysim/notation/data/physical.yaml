  kind: scalar
  unit: V
  notes: Worst case is a full pack, when the battery refuses charge.
- macro: \InitialPositionStandardDeviation
  latex: \sigma_{p,0}
  definition: standard deviation of the position estimate at the instant measurements stop
  kind: scalar
  unit: m
  notes: Its square is the position entry of the initial covariance.
- macro: \InitialPositionVelocityCovariance
  latex: \sigma_{pv,0}
