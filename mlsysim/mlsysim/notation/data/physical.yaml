  latex: t_{\text{rise}}
  definition: time from first contact to the first impact force peak, a quarter of the natural period
    of the contact spring-mass system
  kind: scalar
  unit: s
  notes: Written with \FiniteChange as $\Delta t_{\text{rise}}$; a reactive monitor slower than it cannot
    attenuate the first peak.
- macro: \ImpactSpeed
  latex: v_{\text{impact}}
  definition: speed of a moving mass along the contact normal at the instant it strikes an obstacle
  kind: scalar
  unit: m/s
- macro: \ImpedanceControlTorque
  latex: \boldsymbol{\tau}_{\text{safe}}
  definition: 'joint torque an impedance controller commands: virtual damping and stiffness terms plus
    gravity compensation'
  kind: vector
  unit: N*m
  notes: A commanded \JointTorque.
- macro: \ImpedanceControlledPosition
  latex: x
  definition: measured position of the point an impedance controller regulates
  kind: scalar
  unit: m
  notes: Its deviation from \ImpedanceEquilibriumPosition, times the stiffness, is the spring term of
    the impedance law.
- macro: \ImpedanceControlledVelocity
  latex: \dot{x}
  definition: measured velocity of the point an impedance controller regulates
  kind: scalar
  unit: m/s
  notes: Time derivative of \ImpedanceControlledPosition.
- macro: \ImpedanceEquilibriumPosition
  latex: x_{\text{des}}
  definition: virtual equilibrium position an impedance controller pulls the controlled point toward
  kind: scalar
  unit: m
  notes: The rest point of the emulated spring; part of an impedance target.
- macro: \ImpedanceEquilibriumVelocity
  latex: \dot{x}_{\text{des}}
  definition: velocity of the virtual equilibrium an impedance controller tracks
  kind: scalar
  unit: m/s
  notes: Its difference from \ImpedanceControlledVelocity, times the damping, is the damper term of the
    impedance law.
- macro: \ImpedanceRestoringForce
  latex: F
  definition: force an impedance-controlled actuator exerts, stiffness times position error plus damping
    times velocity error
  kind: scalar
  unit: N
  notes: $\ImpedanceRestoringForce = \PidProportionalGain(\ImpedanceEquilibriumPosition - \ImpedanceControlledPosition)
    + \PidDerivativeGain(\ImpedanceEquilibriumVelocity - \ImpedanceControlledVelocity)$.
- macro: \ImportanceProposalDistribution
  latex: q
  definition: proposal distribution an importance sampler draws scenarios from, reweighted by the likelihood
    ratio
  kind: distribution
  notes: $q^*$ is the zero-variance proposal $p(x)\mathbb{1}[x \in F]/p_F$.
- macro: \ImportanceSampledFailureProbability
  latex: \hat{p}_F
  definition: importance-sampling estimate of the operational failure probability, the weighted fraction
    of draws that fail
  kind: scalar
  unit: dimensionless
- macro: \ImuSampleTime
  latex: t_{\text{IMU}}
  definition: capture time of one IMU sample
  kind: scalar
  unit: s
  notes: The difference between successive ones is the IMU sample period. The chapter only writes it differenced,
    $\Delta t_{\text{IMU}}$.
- macro: \InContactViableSet
  latex: \mathcal{C}_{\text{contact}}
  definition: set of contact states in which both the energy-tank and the contact-force barriers are nonnegative
  kind: set
  notes: Contact counterpart of \ForwardInvariantSafeSet.
- macro: \IncidenceAngle
  latex: \theta_{\text{inc}}
  definition: angle between an incoming ray and the surface normal
  kind: scalar
  unit: rad
- macro: \IncidentOpticalPower
  latex: P_{\text{opt}}
  definition: optical power of the light falling on a photodiode
  kind: function
  unit: W
  notes: Written with its time argument in the chapter.
- macro: \IncomingChannelCommand
  latex: u_{\text{new}}
  definition: channel command of the source taking over at a bumpless transfer
  kind: scalar
  unit: varies
  notes: Same unit as \ChannelCommand.
- macro: \IncomingCommandDerivative
  latex: \dot{u}_{\text{new}}
  definition: time derivative of the incoming source command during a bumpless transfer
  kind: scalar
  unit: varies
  notes: Channel unit per second; zero for a latched endpoint.
- macro: \IncumbentControlCommand
  latex: \mathbf{u}^{\text{incumbent}}
