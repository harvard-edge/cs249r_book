  kind: scalar
  unit: m^2/s
- macro: \InitialProposalDistribution
  latex: q_{\boldsymbol{\psi}_0}
  definition: first proposal of a cross-entropy search, set to the operational distribution
  kind: distribution
- macro: \InitialStateDistribution
  latex: \rho_0
  definition: distribution from which a decision process draws its starting state
  kind: distribution
  notes: Not \InverseDepth (also rho).
- macro: \InitialTrackingError
