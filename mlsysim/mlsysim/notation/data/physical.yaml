- macro: \DirectionalCosineMatrix
  latex: \mathbf{R}
  definition: Directional Cosine Matrix
  kind: matrix
  unit: Matrix
  notes: $3 \times 3$ orthonormal matrix parameterizing spatial attitude and orientation.
- macro: \DispatchtoadmissionIntervalDa
  latex: \Delta_{\text{da}}
  definition: Dispatch-to-Admission Interval
  kind: scalar
- macro: \DivergenceInstant
  latex: t_{\text{div}}
