  kind: vector
  notes: HOLD rung of the fallback ladder; valid only while powered support remains.
- macro: \PoweredHoldState
  latex: \mathbf{x}_{\text{hold}}
  definition: plant state the drives maintain under closed-loop position control during a powered hold
    at standstill
  kind: vector
  notes: Decorated form of \MechanicalPlantState.
- macro: \PreImpactNormalVelocity
  latex: v_n^-
  definition: normal contact velocity just before an impact, negative while the bodies approach
  kind: scalar
  unit: m/s
  notes: Related to \PostImpactNormalVelocity by the restitution law.
- macro: \PreImpactSeparationDistance
  latex: d_{\text{sep}}
  definition: separation distance kept between the machine and a body before any contact, which must cover
