- macro: \LearnedVelocityField
  latex: v_\theta
  definition: neural velocity field that flow matching trains and integrates, given a point, flow time
    and the observation history
  kind: function
  notes: Each evaluation is one ODE-solver step counted by \DecoderEvaluationCount.
- macro: \LearnerStateVisitationDistribution
  latex: p^{\pi}
  definition: distribution of states the learned policy visits under its own closed-loop actions, the
    expected fraction of time steps its rollouts spend in each
  kind: distribution
  notes: The learner's own induced occupancy, against which deployment cost accrues. Same construction
    as $\StateVisitationDistribution$ with the policy fixed to the learner. Not $\StateDistribution$ or
    $\DiscountedStateVisitationDistribution$ (d).
- macro: \LeaseAdmissionInstant
  latex: t_{\text{adm}}
  definition: instant at which the permission path admits an intent lease
  kind: scalar
  unit: s
  notes: Start of the lease validity interval that ends at \IntentLeaseExpiry.
- macro: \LeaseExpiryDelaySubtotal
  latex: \tau_{\text{delay,sub}}
  definition: subtotal of capture-to-brake-onset delay for a lease-expiry stop, excluding dispatch-to-admission time
  kind: scalar
  unit: s
  notes: Sum of capture-to-dispatch age, admitted chunk lease, post-expiry detection and command transport, optional fallback hold, and actuator response. Add DispatchAdmissionInterval once for the complete capture-to-brake-onset delay.
- macro: \LeasePathTravel
  latex: d_{\text{lease}}
  definition: distance the machine travels during the chunk lease, control tick and fieldbus transport
  kind: scalar
  unit: m
- macro: \LeaseRefreshInstant
  latex: t_{\text{refresh}}
  definition: local hardware time of the most recent execution-lease renewal accepted after authentication,
    freshness, state and evidence checks
  kind: scalar
  unit: s
  notes: Lease age is $t - t_{\text{refresh}}$.
- macro: \LeftEvasionAction
  latex: \mathbf{a}_{\text{left}}
  definition: demonstrated action that steers a mobile manipulator around an obstacle on the left
  kind: vector
  notes: One mode of a bimodal demonstration; averaging it with \RightEvasionAction gives a straight-ahead
    action.
- macro: \LeverArmLength
  latex: r_{\text{arm}}
  definition: distance from a rotating joint to the point it carries, which converts a joint rotation
    into tool travel
  kind: scalar
  unit: m
  notes: Scalar length; the vector is \SensorLeverArm.
- macro: \LeverArmSweepError
  latex: e_{\text{rot}}
  definition: tool displacement caused by joint rotation acting through a lever arm over a stale interval
  kind: scalar
  unit: m
- macro: \LewisFormFactor
  latex: Y
  definition: Lewis form factor of a gear tooth, set by its profile and tooth count
  kind: scalar
  unit: dimensionless
- macro: \LidarAzimuthAngle
  latex: \theta_{\text{az}}
  definition: azimuth angle along which a scanning lidar fires a pulse, measured in the sensor frame
  kind: scalar
  unit: rad
  notes: Shares its glyph with a feature's bearing azimuth in the vol4 machine-learning appendix, a different
    quantity.
- macro: \LidarBeamDirection
  latex: \mathbf{d}
  definition: unit vector along which a lidar emits one pulse, a function of its azimuth and elevation
  kind: vector
  unit: dimensionless
- macro: \LidarElevationAngle
  latex: \phi
  definition: elevation angle along which a scanning lidar fires a pulse, measured in the sensor frame
  kind: scalar
  unit: rad
- macro: \LidarFramePoint
  latex: \mathbf{p}_{\text{lidar}}
  definition: position of a lidar return expressed in the lidar's own frame
  kind: vector
  unit: m
- macro: \LidarReferenceFrame
  latex: \mathcal{F}_{\text{lidar}}
  definition: coordinate frame attached to a lidar sensor, in which its returns are first expressed
  kind: set
- macro: \LidarScanRate
  latex: f_{\text{scan}}
  definition: number of full azimuth sweeps a spinning lidar completes per second
  kind: scalar
  unit: Hz
- macro: \LidarSweepPeriod
  latex: T_{\text{sweep}}
  definition: time a spinning lidar takes to complete one full azimuth sweep
  kind: scalar
  unit: s
  notes: The reciprocal of the scan rate.
- macro: \LidarSweepStartTime
  latex: t_{\text{sweep}}
  definition: instant at which a lidar sweep begins, the reference epoch its returns are de-skewed to
  kind: scalar
  unit: s
  notes: Shares its glyph with \FrameExposureStartTime.
- macro: \LieDerivativeAlongControl
  latex: L_{\mathbf{g}} h
  definition: sensitivity of the barrier rate to the control input, the barrier gradient applied to the
    input field
  kind: function
  notes: $\nabla h(\mathbf{x})^\top \mathbf{g}(\mathbf{x})$; a row vector over inputs, a scalar for one
    input. Zero means the input cannot act on the barrier at first order.
- macro: \LieDerivativeAlongDrift
  latex: L_{\mathbf{f}} h
  definition: rate at which the barrier value changes under the unforced dynamics alone
  kind: function
  unit: m/s
  notes: $\nabla h(\mathbf{x})^\top \mathbf{f}(\mathbf{x})$; units of $h$ per second.
- macro: \LieDerivativeOrder
  latex: k
  definition: number of times the drift Lie derivative is applied in a repeated Lie derivative, below
    the relative degree
  kind: index
  notes: Exponent of $L_{\mathbf{f}}^{k}$.
- macro: \LikelihoodRatioWeight
  latex: w
  definition: importance weight of one draw, the operational density over the proposal density at that
    draw
  kind: function
  unit: dimensionless
  notes: $w(x) = p(x)/q(x)$; indexed $w_i$ for draw i.
- macro: \LimitMarginFunction
  latex: M
  definition: margin by which a checked trajectory signal stays below its limit at each instant
  kind: function
  unit: varies
  notes: Negative means a violation. $\LimitMarginFunction(t) = \CheckedSignalLimit - |\CheckedSignal(t)|$,
    in the unit of the signal checked.
- macro: \LinearAcceleration
  latex: \mathbf{a}
  definition: linear acceleration of a body or sensor in an inertial frame
  kind: vector
  unit: m/s^2
  notes: Never the policy action, which is \CognitivePolicyAction.
- macro: \LinearBarrierDecayRate
  latex: \gamma_{\text{cbf}}
  definition: rate constant of the linear class-K function in the barrier condition
  kind: scalar
  unit: 1/s
  notes: In $\dot{h} + \gamma_{\text{cbf}} h \ge 0$.
  aliases:
  - \LinearBarrierDecayRateCbf
- macro: \LinearMomentum
  latex: p
  definition: mass times speed of a moving body
  kind: scalar
  unit: kg*m/s
  notes: Scalar; distinct from bold position $\mathbf{p}$ and from \CentroidalLinearMomentum.
  aliases:
  - \Momentum
- macro: \LinearizedVirtualInput
  latex: \mathbf{v}
  definition: new input of a feedback-linearized system, which the linearizing law makes equal to the
    stacked highest output derivatives
  kind: vector
  notes: Chosen by an outer linear controller. Not \Velocity, which shares the glyph.
- macro: \LinkAngularAcceleration
  latex: \ddot{\theta}_{\text{link}}
  definition: angular acceleration of a driven link on the output side of its transmission
  kind: scalar
  unit: rad/s^2
  notes: Times \GearReductionRatio squared and \RotorInertia gives the reflected rotor inertia torque
    at the link.
- macro: \LinkBitRate
  latex: R_{\text{link}}
  definition: line bit rate of one Ethernet-based fieldbus link
  kind: scalar
  unit: bits/s
  notes: Not \LinkBandwidth, the bytes-per-second beta of the alpha-beta model.
- macro: \LinkLength
  latex: l
  definition: length of one link of a serial arm, indexed by its position in the chain
  kind: scalar
  unit: m
- macro: \LinkOutputPosition
  latex: q_{\text{out}}
  definition: angular position of the driven link at the transmission output
  kind: scalar
  unit: rad
- macro: \LoadCurrent
  latex: I_{\text{load}}
  definition: current the loads draw from a bus node
  kind: scalar
  unit: A
  notes: Equals \SourceCurrent once currents settle.
- macro: \LoadInertia
  latex: J_{\text{load}}
  definition: moment of inertia of the mechanical load a joint drives, on the output side of the transmission
  kind: scalar
  unit: kg*m^2
  aliases:
  - \RotorAndLoadInertiaTwo
- macro: \LoadStepCurrentDeficit
  latex: \Delta I_{\text{step}}
  definition: initial current deficit between load demand and battery source current when a load step
    begins, which the bus capacitance must supply
  kind: scalar
  unit: A
  notes: Delta fused into the symbol.
- macro: \LoadStepDeficitDuration
  latex: \Delta t_{\text{step}}
  definition: time over which the current deficit of a load step decreases linearly to zero
  kind: scalar
  unit: s
  notes: Delta fused into the symbol. Not the setpoint interval of a chunk policy.
- macro: \LoadedEnforcerExecutionTime
  latex: t_{\text{enf}}
  definition: execution time of one permission evaluation measured under operational proposal-side load,
    the isolated execution time plus shared-hardware interference
  kind: scalar
  unit: s
  notes: Takes the place of the execution term \WorstCaseExecutionTime in the response-time bound when
    the enforcer shares hardware.
- macro: \LocalizationBound
  latex: \delta_{\text{loc}}
  definition: bound on the error of localization and state estimation
  kind: scalar
  unit: m
- macro: \LogOddsLowerClamp
  latex: L_{\min}
  definition: lower bound at which a voxel's stored log-odds is clamped to prevent saturation lockup
  kind: scalar
  unit: dimensionless
- macro: \LogOddsUpperClamp
  latex: L_{\max}
  definition: upper bound at which a voxel's stored log-odds is clamped to prevent saturation lockup
  kind: scalar
  unit: dimensionless
- macro: \LongestInterruptMaskTime
  latex: t_{\text{irq\_disabled,max}}
  definition: longest interval during which a kernel runs with CPU interrupts disabled
  kind: scalar
  unit: s
- macro: \LongitudinalFrictionCoefficient
  latex: \mu_x
  definition: longitudinal tire-road friction coefficient as a function of slip ratio, tractive force
    over normal load
  kind: function
  unit: dimensionless
- macro: \LongitudinalSlipRatio
  latex: \lambda
  definition: longitudinal slip ratio of a wheel, the normalized difference between its circumferential
    speed and the vehicle forward speed
  kind: scalar
  unit: dimensionless
  notes: Zero for pure rolling, one for full spin-out, minus one for lock-up.
- macro: \LongitudinalTractionStiffness
  latex: C_x
  definition: longitudinal traction stiffness of a tire, the slope of tractive force against slip ratio
    in the linear low-slip range
  kind: scalar
  unit: N
- macro: \LongitudinalVehicleSpeed
  latex: v_x
  definition: forward longitudinal speed of a wheeled vehicle over the ground
  kind: scalar
  unit: m/s
- macro: \LoopGainScalingFactor
  latex: \kappa
  definition: scalar multiplier inserted at the loop break to test how much gain change the closed loop
    tolerates
  kind: scalar
  unit: dimensionless
  notes: LQR keeps stability for any value in (1/2, infinity). Not \ClassKFunction, which shares the glyph.
- macro: \LostMotionDeflection
  latex: \delta_{\text{lost}}
  definition: load-dependent angle by which the link lags the motor-predicted position through backlash
    and compliance
  kind: scalar
  unit: rad
- macro: \LowerPriorityFrames
  latex: lp
  definition: function giving the set of frames whose priority is lower than that of a given frame
  kind: function
  notes: Written lp(i). Multi-letter name; both letters render from this one macro.
- macro: \LowerPriorityTasks
  latex: lp
  definition: function giving the set of tasks whose priority is lower than that of the given task
  kind: function
  notes: Written $lp(i)$.
- macro: \LqrControlWeightMatrix
  latex: \mathbf{R}_u
  definition: penalty matrix on control effort in the linear-quadratic regulator cost
  kind: matrix
  notes: Symmetric positive definite.
- macro: \LqrCostToGoMatrix
  latex: \mathbf{P}
  definition: symmetric solution of the regulator algebraic Riccati equation, whose quadratic form is
    the optimal LQR cost-to-go
  kind: matrix
  notes: Also the solution of the discrete Riccati equation in discrete-time LQR. Not \EstimationErrorCovariance,
    which shares the glyph.
- macro: \LqrFeedbackGain
  latex: \mathbf{K}_{\text{lqr}}
  definition: state-feedback gain matrix of the linear-quadratic regulator
  kind: matrix
  notes: $\mathbf{u}^* = -\mathbf{K}_{\text{lqr}}\mathbf{x}$; the cost weights are \LqrStateWeightMatrix
    and \LqrControlWeightMatrix.
  aliases:
  - \LqrGainAndWeights
- macro: \LqrQuadraticObjective
  latex: J
  definition: 'infinite-horizon quadratic cost the linear-quadratic regulator minimizes: the integral
    of the weighted squared state plus the weighted squared control effort'
  kind: scalar
  unit: varies
  notes: Units are those of the weighted quadratic integrand times time, set by \LqrStateWeightMatrix
    and \LqrControlWeightMatrix.
- macro: \LqrStateWeightMatrix
  latex: \mathbf{Q}_x
  definition: penalty matrix on state deviation in the linear-quadratic regulator cost
  kind: matrix
  notes: Symmetric positive semi-definite.
- macro: \LyapunovAnalysisDomain
  latex: \mathcal{D}
  definition: open region of state space containing the equilibrium, on which the dynamics and a Lyapunov
    candidate are analyzed
  kind: set
  notes: Stability claims hold only inside it.
- macro: \LyapunovFunction
  latex: V
  definition: scalar function of the state, positive away from the equilibrium, whose decrease along trajectories
    certifies stability
  kind: function
  notes: A control Lyapunov function when some admissible input makes it decrease. Not \OptimalCostToGoFunction,
    which shares the glyph and is a Lyapunov function for LQR.
- macro: \LyapunovFunctionDerivative
  latex: \dot{V}
  definition: time derivative of a Lyapunov function along the system trajectories, its Lie derivative
    along the dynamics
  kind: function
  notes: Negative definite for asymptotic stability.
- macro: \LyapunovPositivityMargin
  latex: \epsilon_{\text{pos}}
  definition: positive weight on the squared state norm added to a learned Lyapunov candidate so it is
    positive away from the origin
  kind: scalar
  unit: varies
  notes: Units of the Lyapunov function per squared state norm.
- macro: \LyapunovSublevelSet
  latex: \Omega_c
  definition: set of states in the analysis domain where the Lyapunov function is at most a level c, an
    inner estimate of the domain of attraction when trajectories in it converge
  kind: set
  notes: 'render_exception: uppercase Greek Omega for a region of state space. The level is \SublevelSetThreshold.'
  render_exception: Control theory writes regions of state space as a plain capital Omega.
- macro: \MahalanobisDistance
  latex: d_M
  definition: Mahalanobis distance between candidate detection j and the predicted measurement of track
    i
  kind: scalar
  unit: dimensionless
  notes: Written squared; the pair index is part of the subscript.
- macro: \ManifestTrackIndex
  latex: k
  definition: position of one confirmed or coasting track in a tracker manifest
  kind: index
- macro: \ManipulatorBaseFrame
  latex: \mathcal{F}_{\text{base}}
  definition: coordinate frame at the manipulator base in which targets, tolerances and error envelopes
    are expressed
  kind: set
  notes: Possibly the same frame as \BodyReferenceFrame on the mobile manipulator; see question.
- macro: \ManipulatorJacobian
  latex: \mathbf{J}
  definition: matrix mapping joint velocities to the spatial velocity of the end effector
  kind: matrix
  notes: Loses row rank at a kinematic singularity.
- macro: \ManualLease
  latex: T_{\text{lease,man}}
  definition: 'execution lease of a human operator in manual mode: the longest silence between authenticated
    heartbeats before manual authority lapses'
  kind: scalar
  unit: s
  notes: Replaces \ChunkLease inside \PrebrakeDelay while the operator holds manual authority.
- macro: \ManualResetTime
  latex: t_{\text{reset,manual}}
  definition: time a human technician takes to restore a physical rig to its initial configuration between
    trials
  kind: scalar
  unit: s
  notes: Manual case of \EnvironmentResetTime.
- macro: \MapCovarianceJacobian
  latex: \mathbf{J}_{\text{map}}
  definition: Jacobian that projects the map-frame pose covariance into world coordinates
  kind: matrix
- macro: \MapOdometryTransform
  latex: \mathbf{T}_{\text{map}}^{\text{odom}}
  definition: rigid transform mapping odometry-frame coordinates into the map frame, corrected at relocalization
  kind: matrix
- macro: \MapPoseCovariance
  latex: \boldsymbol{\Sigma}_{\text{map}}
  definition: covariance of the map-frame pose correction, which jumps at relocalization
  kind: matrix
- macro: \MapReferenceFrame
  latex: \mathcal{F}_{\text{map}}
  definition: globally corrected map coordinate frame, which may jump at relocalization
  kind: set
- macro: \MappedCommandTap
  latex: a_{\text{cmd}}
  definition: second stream of the four-stream action tap, the kinematically mapped command before it
    crosses to the safety microcontroller
  kind: record
- macro: \MarginalVelocityField
  latex: u
  definition: marginal velocity field of a flow-matching probability path, the average of conditional
    velocities through a point
  kind: function
  notes: Intractable; the conditional flow matching theorem replaces it by the conditional field with
    identical gradients.
- macro: \MarginalizedModelParameters
  latex: \theta'
  definition: value of the model parameters that the marginal likelihood integrates over, a dummy variable
    ranging over the parameter space
  kind: vector
  notes: The integration variable in the evidence integral, distinct from the parameters $\ModelParameters$
    whose posterior is sought. Not $\TargetActorParameters$, which shares the glyph in the reinforcement
    learning sections.
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \MarkovDecisionProcess
  latex: \mathcal{M}
  definition: Markov decision process of continuous control, the tuple of state space, action space, transition
    dynamics, reward function, discount factor and initial state distribution
  kind: record
  notes: Not \ReplayBuffer, which the learning file also writes calligraphic M.
- macro: \Mass
  latex: m
  definition: mass of a physical body
  kind: scalar
  unit: kg
- macro: \MassCenterAcceleration
  latex: \ddot{\mathbf{c}}
  definition: acceleration of the robot's total center of mass
  kind: vector
  unit: m/s^2
- macro: \MassCenterHeight
  latex: z_c
  definition: height of a body's center of mass above its support or contact point
  kind: scalar
  unit: m
  notes: Sets the linear inverted pendulum's natural frequency $\sqrt{\Gravity/\MassCenterHeight}$. Not
    the camera-frame coordinate of a point.
- macro: \MassCenterPosition
  latex: \mathbf{c}
  definition: position of the robot's total center of mass
  kind: vector
  unit: m
  notes: $\mathbf{c} = \frac{1}{m} \sum m_i \mathbf{p}_i$.
  aliases:
  - \CenterOfMass
- macro: \MassCenterVelocity
  latex: \dot{\mathbf{c}}
  definition: velocity of the robot's total center of mass
  kind: vector
  unit: m/s
  notes: Mass times it is \CentroidalLinearMomentum.
- macro: \MasterProcessingTime
  latex: t_{\text{master}}
  definition: time the EtherCAT master spends processing one cycle frame
  kind: scalar
  unit: s
- macro: \MatrixEigenvalue
  latex: \lambda
  definition: eigenvalue of a square matrix, a root of its characteristic polynomial
  kind: scalar
  unit: varies
  notes: Written $\lambda(\mathbf{A})$ for an eigenvalue of $\mathbf{A}$; in 1/s for a continuous system
    matrix, dimensionless for a discrete transition matrix. The largest is LargestEigenvalue.
- macro: \MaximumActuatorEffort
  latex: u_{\max}
  definition: upper limit of the force or torque an actuator can realize
  kind: scalar
  unit: varies
  notes: N or N*m by axis type; with \MinimumActuatorEffort bounds the realizable envelope.
- macro: \MaximumCompletionOffset
  latex: c_{\max}
  definition: longest justified time from a tick's start to its completion, including declared execution,
    blocking and interference
  kind: scalar
  unit: s
- macro: \MaximumDepthHypothesis
  latex: d_{\max}
  definition: farthest depth of the discrete depth bins a lift-splat network scores
  kind: scalar
  unit: m
- macro: \MaximumObservationAge
  latex: t_{\text{age},\max}
  definition: largest observation age a consumer tolerates before acting on the observation is no longer
    safe or stable
  kind: scalar
  unit: s
  notes: Here the phase-margin ceiling; vol4 memory and the machine-learning appendix use it as the freshness
    threshold.
- macro: \MaximumPlateIndentation
  latex: x_{\max}
  definition: largest compression of the latch strike plate, reached when the braking arm comes to rest
  kind: scalar
  unit: m
  notes: Must stay below $F_{\text{lim}}/k_{\text{latch}}$.
- macro: \MaximumTurnOffDelay
  latex: t_{\text{off, max}}
  definition: longest turn-off delay of an inverter power switch over temperature and load
  kind: scalar
  unit: s
- macro: \McuCaptureTime
  latex: t_{\text{MCU,capture}}
  definition: capture instant of an observation expressed on the safety microcontroller's clock
  kind: scalar
  unit: s
- macro: \McuDispatchTime
  latex: t_{\text{MCU,dispatch}}
  definition: instant an observation is dispatched, expressed on the safety microcontroller's clock
  kind: scalar
  unit: s
- macro: \MeanContactForce
  latex: \bar{F}
  definition: average peak contact force across the trials of a campaign
  kind: scalar
  unit: N
  notes: Masks the tail of the peak-force distribution.
- macro: \MeanLatchContactForce
  latex: \bar{F}
  definition: average recorded latch contact force under the declared averaging procedure
  kind: scalar
  unit: N
  notes: Not the average of trial peak forces; the peak-force distribution and its tail quantile are separate observables.
- macro: \MeanMessageQueueDelay
  latex: \bar{T}_q
  definition: mean time a safety message waits in a queue
  kind: scalar
  unit: s
- macro: \MeanNeesStatistic
  latex: \bar{\epsilon}
  definition: sample mean of the normalized estimation error squared over independent trials
  kind: scalar
  unit: dimensionless
- macro: \MeanSquaredErrorCloningLoss
  latex: \mathcal{L}_{\text{MSE}}
  definition: behavioral cloning objective that averages the squared distance between the policy's action
    and the demonstrated action over the dataset
  kind: function
  unit: dimensionless
  notes: Minimized by the conditional mean of the demonstrated actions, which causes mode averaging.
- macro: \MeasuredAxisPosition
  latex: x_{\text{meas}}
  definition: measured position of the tracked point along one axis, compared against its commanded reference
  kind: scalar
  unit: m
- macro: \MeasuredContactForce
  latex: \mathbf{F}_{\text{contact}}
  definition: force vector the environment exerts on the end effector during intentional contact, as sensed
  kind: vector
  unit: N
  notes: Compare \ContactPointForce ($\mathbf{f}_k$), indexed by contact point.
- macro: \MeasuredJointVelocities
  latex: \dot{\mathbf{q}}_{\text{meas}}
  definition: joint velocities measured by the encoders, part of the measured response
  kind: vector
- macro: \MeasuredPixelDepth
  latex: Z_{\text{meas}}
  definition: depth a calibrated depth image reports at a pixel
  kind: scalar
  unit: m
  notes: Argument is the pixel.
- macro: \MeasuredResponseTap
  latex: a_{\text{meas}}
  definition: fourth stream of the four-stream action tap, the plant response measured by joint encoders
    and current shunts
  kind: record
- macro: \MeasuredSeamAccelerations
  latex: \ddot{\mathbf{q}}_{\text{meas}}
  definition: encoder-derived estimate of the joint accelerations at activation, with its own error bound
  kind: vector
  unit: rad/s^2
- macro: \MeasuredSeamConfiguration
  latex: \mathbf{q}_{\text{meas}}
  definition: encoder estimate of the joint configuration at activation, carried with its error bound
    into the seam check
  kind: vector
  notes: Not \SeamActualConfiguration, the true configuration a projection anchors to.
- macro: \MeasuredSeamVelocities
  latex: \dot{\mathbf{q}}_{\text{meas}}
  definition: encoder-derived estimate of the joint rates at activation, with its own error bound
  kind: vector
  unit: rad/s
- macro: \MeasuredTrackedPosition
  latex: \mathbf{p}_{\text{meas}}
  definition: measured Cartesian position of the tracked point, which the tracking error compares against
    the reference
  kind: vector
  unit: m
  notes: Decorated form of \CartesianPosition.
- macro: \MeasurementCovariance
  latex: \boldsymbol{\Sigma}_z
  definition: covariance of the error a perception output reports for its measurement
  kind: matrix
  notes: Second moments only; it is not a conservative bound. The notation chapter writes the noise covariance
    of a state-space measurement as Sigma with a meas label.
- macro: \MeasurementDimension
  latex: m
  definition: number of components in a measurement vector
  kind: count
- macro: \MeasurementErrorStandardDeviation
  latex: \sigma
  definition: standard deviation of a measurement error under an assumed Gaussian model, the unit of a
    sigma gate
  kind: scalar
  unit: varies
  notes: Carries the unit of the measured quantity. Disparity and depth have their own entries.
- macro: \MeasurementFunction
  latex: h
  definition: nonlinear function mapping a state to the measurement a sensor would report
  kind: function
  notes: Its Jacobian replaces \MeasurementMatrix in the extended Kalman filter. Not \BarrierFunction.
- macro: \MeasurementHistory
  latex: \mathbf{y}_{1:k}
  definition: sequence of measurements an estimator has received from the first through the k-th sample
  kind: record
- macro: \MeasurementInnovation
  latex: \boldsymbol{\nu}
  definition: difference between a measurement and the measurement the predicted state implies
  kind: vector
  notes: Its normalized square is the NIS.
- macro: \MeasurementMatrix
  latex: \mathbf{H}
  definition: output matrix of a linear state-space model, mapping the state to sensor measurements
  kind: matrix
- macro: \MeasurementNoiseCovariance
  latex: \boldsymbol{\Sigma}_{\text{meas}}
  definition: covariance of the noise on a sensor measurement vector, such as a pixel position with depth
    or a Kalman filter measurement
  kind: matrix
  unit: varies
  notes: Units are those of the measurement squared. The covariance of \MeasurementNoiseVector.
- macro: \MeasurementNoiseVector
  latex: \mathbf{v}_{\text{meas}}
  definition: random disturbance added to the sensor output
  kind: vector
  notes: Covariance intensity $\boldsymbol{\Sigma}_{\text{meas}} \succ 0$.
- macro: \MeasurementVector
  latex: \mathbf{y}
  definition: measurement vector a sensor or detector reports at one step
  kind: vector
- macro: \MeasurementVectorDerivative
  latex: \dot{\mathbf{y}}
  definition: time derivative of the measurement vector of a state-space model
  kind: vector
- macro: \MechanicalEnergy
  latex: E
  definition: total mechanical energy of a second-order system, its kinetic energy plus the potential
    energy stored in its spring or proportional feedback
  kind: scalar
  unit: J
  notes: Conserved by an undamped oscillator; its time derivative \MechanicalEnergyDerivative is the dissipation.
    For the unit-mass test oscillator it is energy per unit mass. Not \KineticEnergy ($E_k$).
- macro: \MechanicalEnergyDerivative
  latex: \dot{E}
  definition: time derivative of the total mechanical energy along system trajectories, the net power
    into the system
  kind: scalar
  unit: W
  notes: Nonpositive under PD feedback with positive-definite derivative gain.
- macro: \MechanicalImpedanceMap
  latex: Z
  definition: mechanical impedance, the map from an imposed motion to the force that answers it
  kind: function
  unit: varies
  notes: Units depend on whether the motion is a velocity or a displacement.
- macro: \MechanicalPlantState
  latex: \mathbf{x}
  definition: 'state of the mechanical plant: generalized positions stacked with generalized velocities'
  kind: vector
  notes: $\mathbf{x} = [\mathbf{q}^\top, \dot{\mathbf{q}}^\top]^\top$; position entries in rad or m, velocity
    entries in rad/s or m/s.
- macro: \MechanicalWork
  latex: W
  definition: mechanical work a force does on a body over the distance it acts
  kind: scalar
  unit: J
  notes: Integral of force over displacement; by the work-energy theorem equals the change in kinetic
    energy.
- macro: \MemoryBusQueueDelay
  latex: t_{\text{queue}}
  definition: time a sensor transfer waits for contended shared memory channels on the SoC
  kind: scalar
  unit: s
  notes: Transfer bytes over peak bandwidth plus a penalty per port conflict (\InterconnectPortConflicts).
- macro: \MessageQueueDelay
  latex: T_q
  definition: time one safety message waits in a queue before it is served, a random variable
  kind: scalar
  unit: s
- macro: \MessageTimestamp
  latex: t_{\text{msg}}
  definition: transport timestamp a publisher stamps on a message, which a republisher can refresh without
    new evidence
  kind: scalar
  unit: s
- macro: \MetricDepth
  latex: z_{\text{metric}}
  definition: depth in meters recovered from a relative-depth prediction by its affine calibration
  kind: scalar
  unit: m
- macro: \MicrocontrollerClockTime
  latex: t_{\text{MCU}}
  definition: time read on the safety microcontroller's monotonic clock
  kind: scalar
  unit: s
- macro: \MillerCapacitance
  latex: C_{\text{gd}}
  definition: non-linear gate-drain (reverse transfer, Miller) capacitance of a power switch
  kind: scalar
  unit: F
- macro: \MillerCharge
  latex: Q_{\text{gd}}
  definition: gate-drain (Miller) charge a power switch's gate must exchange while its drain voltage traverses
    the rail
  kind: scalar
  unit: A*s
- macro: \MillerDisplacementCurrent
  latex: I_{\text{miller}}
  definition: displacement current a drain-voltage slew forces through a power switch's Miller capacitance
  kind: scalar
  unit: A
- macro: \MillerPlateauDuration
  latex: t_{\text{plateau}}
  definition: time a power switch's gate spends on the Miller plateau, the Miller charge over the gate
    current
  kind: scalar
  unit: s
- macro: \MillerPlateauVoltage
  latex: V_{\text{plateau}}
  definition: gate-source voltage at which a power switch's gate dwells while its drain voltage traverses
    the rail
  kind: scalar
  unit: V
- macro: \MinimumActuatorEffort
  latex: u_{\min}
  definition: lower limit of the force or torque an actuator can realize
  kind: scalar
  unit: varies
  notes: N or N*m by axis type.
- macro: \MinimumBlendingWindow
  latex: \tau_{\text{blend}, \min}
  definition: shortest bumpless-transfer window that keeps the jerk of a blend between two latched acceleration
    commands within the jerk limit
  kind: scalar
  unit: s
  notes: Lower bound on \BlendingTransitionWindow.
- macro: \MinimumCellSupportCount
  latex: N_{\min}
  definition: declared minimum number of retained records or demonstrations a scenario-table cell needs
    to count as supported
  kind: count
- macro: \MinimumChunkSetpointCount
  latex: h_{\min}
  definition: smallest number of setpoints an action chunk must carry to keep the actuators supplied until
    its replacement arrives
  kind: count
  notes: Ceiling of (\ChunkRenewalPeriod plus \ProposerInferenceTime) over \SetpointStepInterval; at most
    \ActionChunkHorizon.
- macro: \MinimumCompletionOffset
  latex: c_{\min}
  definition: shortest justified time from a tick's start to its completion, including healthy paths a
    campaign did not exercise
  kind: scalar
  unit: s
  notes: Cannot be taken from the nominal unloaded measurement.
- macro: \MinimumDepthHypothesis
  latex: d_{\min}
  definition: nearest depth of the discrete depth bins a lift-splat network scores
  kind: scalar
  unit: m
- macro: \MinimumRailVoltage
  latex: V_{\text{rail,min}}
  definition: lowest voltage the DC rail reaches under load transients
  kind: scalar
  unit: V
- macro: \MinimumTransitTime
  latex: t_{\min}
  definition: shortest nominal time for a rest-to-rest move of a given distance under acceleration and
    speed bounds
  kind: scalar
  unit: s
- macro: \MinimumTurnOnDelay
  latex: t_{\text{on, min}}
  definition: shortest turn-on delay of an inverter power switch over temperature and load
  kind: scalar
  unit: s
- macro: \MissionDuration
  latex: T_{\text{mission}}
  definition: duration of one mission of a mobile robot, the unit of operation over which a per-mission
    failure probability is allocated
  kind: scalar
  unit: s
- macro: \MissionEnergy
  latex: E_{\text{mission}}
  definition: total energy a machine draws to complete one physical mission
  kind: scalar
  unit: J
  notes: Distinct from the ML workload\'s total energy.
- macro: \MissionExceedanceBudget
  latex: \epsilon_{\text{mission}}
  definition: allowed probability that at least one handoff of a mission misses its admission deadline
  kind: scalar
  unit: dimensionless
  notes: Split over the handoffs by the union bound.
- macro: \MissionHandoffCount
  latex: K
  definition: number of successive plan handoffs a mission makes, each of which must meet its admission
    deadline
  kind: count
  notes: Divides the mission exceedance budget in the union bound. Not \EnsemblingWindowLength.
- macro: \MobileBaseBarrierFunction
  latex: h_{\text{base}}
  definition: barrier certificate of the mobile base, clear distance minus delay travel, braking travel
    and the fixed allowances
  kind: function
  unit: m
  notes: Nonnegative exactly when the stopping envelope holds. Compare \KineticInsetBarrierFunction, which
    omits delay and margins.
- macro: \ModelPointAbscissa
  latex: X
  definition: first world coordinate of a point on a planar calibration model
  kind: scalar
  unit: m
- macro: \ModelPointHeight
  latex: Z
  definition: world coordinate of a calibration model point normal to the model plane, zero on the plane
  kind: scalar
  unit: m
- macro: \ModelPointOrdinate
  latex: Y
  definition: second world coordinate of a point on a planar calibration model
  kind: scalar
  unit: m
- macro: \MonotonicClockInstant
  latex: t
  definition: instant on a qualified monotonic hardware clock
  kind: scalar
  unit: s
  notes: Used for physical evidence epochs and deadline evaluation after bounded conversion from external clocks; not adjustable civil wall time.
- macro: \MotionBlurLength
  latex: L
  definition: length in the image of a uniform motion blur
  kind: scalar
  unit: pixels
- macro: \MotionCyclePeriod
  latex: T_{\text{cycle}}
  definition: duration of one closed motion cycle of the operator at the teleoperation port
  kind: scalar
  unit: s
- macro: \MotionModelInput
  latex: \mathbf{u}
  definition: input vector that drives an estimator's motion model, such as one IMU sample
  kind: vector
  notes: Not the control command chain (\NominalControlCommand, \CertifiedControlAction).
- macro: \MotorBackEmfConstant
  latex: K_e
  definition: back-EMF voltage a motor generates per unit rotor speed
  kind: scalar
  unit: V/(rad/s)
  notes: Equal to \MotorTorqueConstant in SI units.
- macro: \MotorConstant
  latex: K_m
  definition: torque a motor produces per square root of the resistive power it dissipates
  kind: scalar
  unit: varies
  notes: Unit N*m per square root of W, which the integer unit grammar cannot write; hence varies. Torque
    constant over the square root of effective loss resistance; unit may need N*m/(W^0.5) in vocabulary
    terms.
- macro: \MotorPhaseRmsCurrent
  latex: I_{\text{phase}}
  definition: root-mean-square current in one stator phase of a brushless motor
  kind: scalar
  unit: A
  notes: Approximately $\tau / (\eta N K_t)$ at the joint.
- macro: \MotorRotorAccelerations
  latex: \ddot{\boldsymbol{\theta}}_{\text{motor}}
  definition: second time derivative of the reflected motor rotor coordinates
  kind: vector
  unit: rad/s^2
- macro: \MotorRotorCoordinates
  latex: \boldsymbol{\theta}_{\text{motor}}
  definition: vector of motor rotor angles reflected through the gear reduction to the link side, one
    per elastic joint
  kind: vector
  unit: rad
- macro: \MotorRotorVelocities
  latex: \dot{\boldsymbol{\theta}}_{\text{motor}}
  definition: time derivative of the reflected motor rotor coordinates
  kind: vector
  unit: rad/s
- macro: \MotorShaftDamping
  latex: D_{\text{motor}}
  definition: viscous damping coefficient on a motor shaft
  kind: scalar
  unit: N*m*s/rad
  notes: Reflected to the output by the gear ratio squared.
- macro: \MotorShaftPosition
  latex: q_{\text{motor}}
  definition: angular position of the motor shaft at the transmission input
  kind: scalar
  unit: rad
  notes: Divided by the gear ratio it predicts the link position.
- macro: \MotorTorque
  latex: \tau_{\text{motor}}
  definition: torque a motor produces at its shaft, before the transmission
  kind: scalar
  unit: N*m
  notes: Torque constant times torque-producing current; joint output torque is \JointOutputTorque.
- macro: \MotorTorqueConstant
  latex: K_t
  definition: torque a motor produces per ampere of torque-producing current
  kind: scalar
  unit: N*m/A
  aliases:
  - \TorqueAndBackemfConstants
- macro: \MotorViscousDamping
  latex: B_{m}
  definition: viscous damping coefficient on one reflected motor rotor, a diagonal entry of the motor
    damping matrix
  kind: scalar
  unit: N*m*s/rad
  notes: Indexed by joint after a comma ($B_{m,i}$).
- macro: \MotorViscousDampingMatrix
  latex: \mathbf{B}_m
  definition: diagonal matrix of viscous damping coefficients acting on the reflected motor rotor velocities
  kind: matrix
  unit: N*m*s/rad
  notes: Not the state-space input matrix \StateSpaceInputMatrix.
- macro: \MpcControlSequence
  latex: \mathbf{u}_{0:N_{\text{mpc}}-1}
  definition: sequence of control inputs over a model-predictive-control horizon, one per step, that the
    optimizer chooses
  kind: vector
  notes: Its columns are \ControlInput at each \HorizonStepIndex; only the first is applied before the
    next re-solve.
- macro: \MpcControlSequenceTail
  latex: \mathbf{u}_{1:N_{\text{mpc}}-1}
  definition: control inputs of a model predictive control sequence after its first, which receding-horizon
    execution discards
  kind: vector
  notes: Tail of \MpcControlSequence.
- macro: \MpcHorizonObjective
  latex: J
  definition: finite-horizon objective of model predictive control from a given state, the terminal cost
    plus the summed stage costs
  kind: function
  notes: Starred for its optimal value. Its optimum $J^*$ decreases along the closed loop under the terminal
    conditions. Not the effective joint inertia.
- macro: \MpcPredictionHorizon
  latex: N_{\text{mpc}}
  definition: number of discrete control steps over which model predictive control optimizes
  kind: count
  notes: Distinct from the trial count \TrialCount and the action-chunk horizon \ActionChunkHorizon.
- macro: \MpcTerminalCost
  latex: \ell_f
  definition: cost a model predictive control objective charges the final predicted state of its horizon,
    the terminal cost
  kind: function
  notes: Added to the summed stage costs to form $\MpcHorizonObjective$; in the quadratic case it is weighted
    by $\MpcTerminalCostMatrix$. The subscript f stands for final, not the plant dynamics $\DiscretePlantDynamics$.
- macro: \MpcTerminalCostMatrix
  latex: \mathbf{P}_{N_{\text{mpc}}}
  definition: matrix weighting the quadratic cost of the final predicted state in a model predictive control
    objective
  kind: matrix
  notes: Subscript is the horizon \MpcPredictionHorizon. Chosen to satisfy the discrete Lyapunov inequality
    with \TerminalFeedbackGain. Not the LQR Riccati matrix or the estimation covariance.
- macro: \MultimodalFusedTokenStream
  latex: \mathbf{Z}
  definition: concatenated sequence of vision, language and state tokens fed to an embodied transformer
  kind: matrix
  notes: One row per token, $N_{\text{total}} \times d_{\text{model}}$.
- macro: \MultimodalObservation
  latex: \mathbf{o}
  definition: 'robot''s synchronized sensor observation at step t: images, depth, joint encoders and touch'
  kind: vector
  notes: Synchronized tokenized sensor packet (RGB images, depth latents, joint encoders, tactile arrays).
- macro: \NeesStatistic
  latex: \epsilon
  definition: 'normalized estimation error squared: the state error weighted by the inverse reported covariance'
  kind: scalar
  unit: dimensionless
  notes: Chi-squared with n degrees of freedom for a consistent filter.
- macro: \NegativeGateSupplyVoltage
  latex: V_{\text{ee}}
  definition: negative supply rail of a gate driver, toward which it pulls the gate at turn-off
  kind: scalar
  unit: V
- macro: \NetAngularBrakingDeceleration
  latex: \alpha_{\text{net}}
  definition: angular deceleration a joint can produce after a gravity or load bias torque is subtracted
    from its peak torque
  kind: scalar
  unit: rad/s^2
  notes: Angular counterpart of \NetBrakingDeceleration ($a_{\text{net}}$).
- macro: \NetBrakingDeceleration
  latex: a_{\text{net}}
  definition: deceleration left after a gravity or load bias is subtracted from the available braking
    effort
  kind: scalar
  unit: m/s^2
  notes: Angular form in $\text{rad/s}^2$.
- macro: \NetPhaseMargin
  latex: \text{PM}_{\text{net}}
  definition: phase margin left after subtracting the loop's delay-induced phase lag
  kind: scalar
  unit: deg
  notes: Must stay positive to avoid contact chatter.
- macro: \NeuralLyapunovFactor
  latex: \mathbf{L}_{\phi}
  definition: state-dependent matrix a neural network with parameters phi outputs, whose outer product
    shapes a learned Lyapunov candidate
  kind: matrix
  notes: Used as $V = \mathbf{x}^\top\mathbf{L}_\phi\mathbf{L}_\phi^\top\mathbf{x} + \epsilon\lVert\mathbf{x}\rVert^2$.
- macro: \NextPhysicalWorldState
  latex: s
  definition: physical world state of the machine, its environment and their contacts that one transition
    leads to after an action is taken in the current state
  kind: record
  notes: The successor of $\PhysicalWorldState$ in $p(s \mid \PhysicalWorldState, \CognitivePolicyAction)$;
    indexed ${\NextPhysicalWorldState}_{t+1}$ for the sampled next state. Physical counterpart of \NextDecisionProcessState.
    Italic because it mixes types.
- macro: \NextProprioceptiveObservation
  latex: \mathbf{o}_{\text{proprio}, t+1}
  definition: proprioceptive part of the next step's observation, formed from the measured plant response
  kind: vector
  notes: The step index t+1 is part of the rendered symbol.
- macro: \NextRobotAction
  latex: \mathbf{a}'
  definition: action the policy takes at the next state of a transition, inside the Bellman relation
  kind: vector
  notes: Prime marks the successor, not a derivative. Pairs with \NextDecisionProcessState ($s'$). The
    entry carries the prime so the apply step absorbs it.
- macro: \NmiResponseTime
  latex: t_{\text{NMI}}
  definition: worst-case response time of the non-maskable interrupt that handles motor overcurrent or
    gate-drive faults
  kind: scalar
  unit: s
  notes: Deterministic hardware interrupt response time for motor overcurrent or gate-drive faults.
  aliases:
  - \NonmaskableInterruptTimeNmi
- macro: \NoisePredictionNetwork
  latex: \boldsymbol{\epsilon}_\theta
  definition: network that predicts the noise added to an action chunk at a diffusion step, given the
    observation
  kind: function
- macro: \NoisedActionChunk
  latex: \mathbf{A}^k
  definition: action chunk after k steps of diffusion noising, the iterate a denoising pass refines
  kind: matrix
  aliases:
  - \NoisePredictionNetworkTwo
- macro: \NominalBitRate
  latex: R_{\text{nom}}
  definition: bit rate of the CAN FD arbitration phase
  kind: scalar
  unit: bits/s
- macro: \NominalBitTime
  latex: T_{\text{bit,nom}}
  definition: duration of one bit in the CAN FD arbitration phase, the reciprocal of the nominal bit rate
  kind: scalar
  unit: s
- macro: \NominalBrakingDeceleration
  latex: a_{\text{nominal}}
  definition: braking deceleration computed from bare chassis mass, ignoring the reflected rotor inertia
  kind: scalar
  unit: m/s^2
  notes: Overestimates deceleration by the factor m_eff / m.
- macro: \NominalClearance
  latex: C_{\text{nominal}}
  definition: separation between an obstacle's estimated position and the machine's envelope
  kind: scalar
  unit: m
- macro: \NominalCommandWindow
  latex: \mathbf{u}_{\text{nom}, t:t+H-1}
  definition: sequence of nominal control commands from one step through the end of an action-chunk horizon
  kind: matrix
  notes: Windowed form of \NominalControlCommand, as \ActionChunkTrajectory is of \ActionChunk.
- macro: \NominalContactForces
  latex: \mathbf{f}_{\text{nom}}
  definition: nominal stacked contact forces a whole-body control objective regularizes toward
  kind: vector
  unit: N
- macro: \NominalControlCommand
  latex: \mathbf{u}_{\text{nom}}
  definition: control command the learned policy proposes, before the safety filter checks it
  kind: vector
  notes: Becomes \CertifiedControlAction after filtering.
- macro: \NominalFrameInterval
  latex: T_{\text{nominal}}
  definition: nominal interval between successive frames of a sensor stream
  kind: scalar
  unit: s
  notes: The reciprocal of the frame rate; jitter is measured about it.
- macro: \NominalFrictionCoefficient
  latex: \mu_{\text{nom}}
  definition: tire-floor friction coefficient on the nominal, undegraded surface
  kind: scalar
  unit: dimensionless
- macro: \NominalOscillatorFrequency
  latex: f_{\text{nom}}
  definition: nominal frequency of a clock's oscillator, the reference for its fractional frequency error
  kind: scalar
  unit: Hz
- macro: \NominalPlanExpiry
  latex: t_{\text{plan\_exp}}
  definition: instant, on the permission clock, at which the nominal setpoints of an admitted trajectory
    record end
  kind: scalar
  unit: s
  notes: Later than \CommitmentInstant; never executed when the matched stop begins at commitment.
- macro: \NominalRatedSpeed
  latex: v_{\text{nominal}}
  definition: speed rating of the machine in normal, non-derated operation
  kind: scalar
  unit: m/s
- macro: \NominalReferenceClearance
  latex: c
  definition: clearance a reference trajectory keeps from an obstacle, before the tracking-error inset
    is subtracted
  kind: scalar
  unit: m
  notes: The actual body is guaranteed only $c - \epsilon_{\text{track}}$.
- macro: \NominalTickPeriod
  latex: T_{\text{period}}
  definition: nominal interval between consecutive tick starts of the task that feeds a watchdog
  kind: scalar
  unit: s
  notes: On the running machine it equals \PermissionLoopPeriod.
- macro: \NominalTrackingTolerance
  latex: \epsilon_{\text{nom}}
  definition: largest baseline tracking error a fault-injection bench may show before the trial is declared
    invalid
  kind: scalar
  unit: m
- macro: \NoninferiorityRatioMargin
  latex: \delta
  definition: largest relative excess of a candidate intervention rate over the incumbent rate that a
    non-inferiority test still accepts, fixed before the trial
  kind: scalar
  unit: dimensionless
  notes: The upper confidence bound on the rate ratio must fall below $1+\delta$.
- macro: \NonlinearBiasTorque
  latex: \mathbf{h}
  definition: vector of velocity-dependent and gravitational generalized forces in the manipulator equation,
    the Coriolis and centrifugal terms plus gravity
  kind: vector
  unit: N*m
  notes: Equals $\mathbf{C}(\mathbf{q},\dot{\mathbf{q}})\dot{\mathbf{q}} + \mathbf{g}(\mathbf{q})$. Not
    \BarrierFunction.
- macro: \NonlinearObservationSpace
  latex: \mathbf{O}_{\text{NL}}
  definition: space spanned by the output functions and all their repeated Lie derivatives along the dynamics
  kind: matrix
  notes: The Hermann-Krener observation space; full rank of its differential at a state gives local observability.
  aliases:
  - \ObservabilityMatricesNl
- macro: \NonlinearOutputFunction
  latex: \mathbf{h}
  definition: output function of a nonlinear state-space model, mapping the state to the measurement vector
  kind: function
  notes: Not \BarrierFunction (scalar h) nor \GeneralizedBiasForces (bold h of the floating-base equations).
    Same name as the notation-chapter glossary proposes.
- macro: \NormWeightMatrix
  latex: \mathbf{W}
  definition: positive semidefinite matrix that weights a quadratic norm
  kind: matrix
  unit: varies
  notes: $\|\WeightedNormArgument\|_{\NormWeightMatrix}^2 = \WeightedNormArgument^\top\NormWeightMatrix\WeightedNormArgument$;
    \StateTrackingWeightMatrix and \JerkWeightMatrix are instances.
- macro: \NormalContactForce
  latex: f_{k, \perp}
  definition: compressive component of a contact force along the contact normal
  kind: scalar
  unit: N
  notes: Unilateral, never negative.
- macro: \NormalContactImpulse
  latex: P_n
  definition: normal impulse an idealized rigid impact transfers across a contact, the effective normal
    mass times the jump in normal velocity
  kind: scalar
  unit: N*s
- macro: \NormalizedActionCommand
  latex: \tilde{a}
  definition: action command rescaled to a fixed range relative to the actuator's maximum travel
  kind: scalar
  unit: dimensionless
- macro: \NormalizedActionResidual
  latex: e
  definition: one component of the difference between a predicted and a demonstrated action, in normalized
    action coordinates
  kind: scalar
  unit: dimensionless
  notes: Argument of the Huber penalty; not \Reward.
- macro: \NormalizedCandidateScore
  latex: c
  definition: normalized detector score of one candidate referent
  kind: scalar
  unit: dimensionless
  notes: Written with the candidate index ($c_i$).
- macro: \NormalizedGearRatio
  latex: \tilde{N}
  definition: gear ratio divided by the inertia-matching ratio
  kind: scalar
  unit: dimensionless
  notes: Acceleration relative to the matched ratio is $2\NormalizedGearRatio/(1+\NormalizedGearRatio^2)$.
- macro: \NormalizedImageAbscissa
  latex: x_n
  definition: first normalized image coordinate of a point, its camera-frame first coordinate divided
    by its depth
  kind: scalar
  unit: dimensionless
- macro: \NormalizedImageOrdinate
  latex: y_n
  definition: second normalized image coordinate of a point, its camera-frame second coordinate divided
    by its depth
  kind: scalar
  unit: dimensionless
- macro: \NormalizedPredicateMargin
  latex: \bar{f}
  definition: atomic predicate margin divided by its declared positive scale, so margins of different
    units can be compared
  kind: function
  unit: dimensionless
- macro: \NormalizedRadialDistance
  latex: r
  definition: distance of a normalized image point from the principal axis, the radius the distortion
    polynomial is written in
  kind: scalar
  unit: dimensionless
- macro: \NullSpaceProjector
  latex: \mathbf{N}
  definition: projection matrix onto the null space of a task Jacobian, N = I - J^dagger J
  kind: matrix
  unit: dimensionless
  notes: Indexed by task. Accelerations projected through it produce no acceleration in that task.
- macro: \NullSpaceVelocityBias
  latex: \dot{\mathbf{q}}_0
  definition: arbitrary joint-velocity vector that the null-space projector of a redundant arm filters
    into self-motion
  kind: vector
  notes: Entries in rad/s; the subscript 0 is part of the symbol.
- macro: \ObjectWrench
  latex: \mathbf{w}_{\text{obj}}
  definition: net wrench, force and moment together, that the contact forces of a grasp exert on the object
  kind: vector
  unit: varies
  notes: Force components in N, moment components in N*m.
- macro: \ObservabilityMatrix
  latex: \mathbf{O}_{\text{obs}}
  definition: stack of the output matrix times powers of the system matrix, whose rank decides observability
  kind: matrix
  aliases:
  - \ObservabilityMatrices
- macro: \ObservationAge
  latex: t_{\text{age}}
  definition: age of the state the permission path acts on, from the exposure midpoint at the sensor to
    the decision
  kind: scalar
  unit: s
  notes: Sums half the exposure, readout, transfer and perception processing; one term of \PrebrakeDelay.
- macro: \ObservationAgeBound
  latex: t_{\text{age},\max}
  definition: largest observation age the permission path accepts
  kind: scalar
  unit: s
- macro: \ObservationAgeBudget
  latex: t_{\text{age},\max}
  definition: configured upper bound on observation age above which a consumer refuses a state
  kind: scalar
  unit: s
- macro: \ObservationAgeDisplacement
  latex: \Delta \mathbf{p}
  definition: displacement the robot accumulates between an observation's capture and the end of its observation
    age
  kind: vector
  unit: m
  notes: 'One symbol: the Delta site and the bold p site both take this macro.'
- macro: \ObservationEncodingTime
  latex: t_{\text{enc}}
  definition: time to encode one observation, visual backbone and proprioception, once per policy proposal
  kind: scalar
  unit: s
  notes: First term of the proposal latency, $\ProposerInferenceTime = t_{\text{enc}} + \sum_k t_{\text{pass}}$.
- macro: \ObservationFunction
  latex: h
  definition: observation model of an estimator, mapping a state to the measurement the sensors would
    report
  kind: function
- macro: \ObservationHistory
  latex: \mathbf{O}
  definition: stacked history of recent visual and proprioceptive observations that a generative action
    decoder is conditioned on
  kind: record
  notes: A window of \MultimodalObservation over the last few steps. Not \AttentionOutputMatrix.
- macro: \ObservationHistoryLength
  latex: H_{\text{hist}}
  definition: number of past observation steps a policy's temporal encoder conditions on
  kind: count
  notes: Distinct from \ActionChunkHorizon ($H$) and \ExecutionHorizon.
- macro: \ObservationHistorySequence
  latex: \mathbf{o}_{0:t}
  definition: sequence of the robot's observations from the first step through step t, the history a policy
    may condition on
  kind: matrix
  notes: Stacks \MultimodalObservation over steps 0 to t.
- macro: \ObservationHistoryWindow
  latex: \mathbf{o}_{t-H_{\text{hist}}:t}
  definition: sliding window of the robot's most recent onboard observations, from the history length
    before the current step up to the current step
  kind: matrix
  notes: One row per observation step; its length is \ObservationHistoryLength. The window form of \MultimodalObservation,
    as \ActionChunkTrajectory is of \ActionChunk.
- macro: \ObservationPairingLag
  latex: \Delta t_{\text{lag}}
  definition: uncompensated delay between when an observation was physically true and the action a logger
    pairs it with
  kind: scalar
  unit: s
  notes: The Delta is part of the symbol.
- macro: \ObservationPayload
  latex: \mathbf{T}_{\text{payload}}
  definition: 'payload an observation contract carries: the raw sensor tensor or a derived geometric bounding
    envelope'
  kind: record
  notes: A record, not a transform; not \Pose ($\mathbf{T}$).
- macro: \ObservationResponseLatency
  latex: T_{\text{total}}
  definition: latency from an observation to the actuator's response along a blocking sensor-to-actuation
    path, the sum of sensing, planning and actuator response times
  kind: scalar
  unit: s
  notes: Each term includes its queueing, transport and execution delay; pipelining does not shorten it.
    Multiplied by speed it gives \DelayTravelDistance.
- macro: \ObservationTokenSequence
  latex: \mathbf{z}_{\text{token}}
  definition: 'token sequence an observation tokenizer emits: sensory feature tokens concatenated with
    time, frame and covariance embeddings'
  kind: matrix
- macro: \ObservedFailureCount
  latex: k
  definition: number of failures, catastrophic incidents, a test campaign observes over its trials or
    its operating time
  kind: count
  notes: Zero in a zero-failure campaign. Not \SuccessfulTrialCount, which counts successes.
- macro: \ObservedFailureFraction
  latex: \hat{p}
  definition: observed fraction of a campaign's trials that fail, the sample estimate of the per-trial
    failure probability
  kind: scalar
  unit: dimensionless
  notes: Failure-side counterpart of \ObservedSuccessFraction.
- macro: \ObservedFreeSpace
  latex: \mathcal{M}_{\text{free}}
  definition: part of the spatial memory map whose cells are observed free and still supported by current
    evidence
  kind: set
  notes: Degrades to \UnobservedUnknownSpace when its evidence ages past \BeliefInvalidationHorizon.
- macro: \ObservedOccupiedSpace
  latex: \mathcal{M}_{\text{occ}}
  definition: part of the spatial memory map whose cells are observed occupied
  kind: set
  notes: One of the three classes of the tri-state map.
- macro: \ObservedPixelCoordinates
  latex: \tilde{\mathbf{m}}_{\text{observed}}
  definition: homogeneous pixel coordinates of a robot-link point as observed in the camera image
  kind: vector
  unit: pixels
- macro: \ObservedPlantState
  latex: \mathbf{x}_{\text{obs}}
  definition: plant state as independent truth instrumentation records it over a trial window
  kind: vector
  notes: Decorated form of \MechanicalPlantState.
- macro: \ObservedPointRange
  latex: r
  definition: distance from a sensor to an observed point along the viewing ray
  kind: scalar
  unit: m
  notes: Times a small pitch error it gives the apparent height error of that point.
- macro: \ObservedRelativeSpeed
  latex: v_{\text{rel}}
  definition: speed of an observed entity relative to the machine
  kind: scalar
  unit: m/s
- macro: \ObservedSuccessFraction
  latex: \hat{p}
  definition: fraction of a campaign's trials that succeed, the sample estimate of the per-trial success
    probability
  kind: scalar
  unit: dimensionless
  notes: Not agentic \EstimatedAcceptanceProbability (task acceptance) or learning \EstimatedAccuracy
    (classification accuracy).
- macro: \ObservedTrialFailureCount
  latex: k
  definition: number of failures observed among the trials of a test campaign, fixed-sample or sequential
  kind: count
  notes: In a sequential test it grows with the trial count \SequentialTrialCount.
- macro: \ObservedVolume
  latex: V_{\text{obs}}
  definition: volume of the observed, navigable space a Euclidean distance field stores
  kind: scalar
  unit: m^3
- macro: \ObstacleConfigurationSet
  latex: \mathcal{C}_{\text{obs}}
  definition: set of configurations at which the robot intersects an obstacle
  kind: set
  notes: A collision query is a membership test on this set.
- macro: \ObstacleCostWeight
  latex: \lambda_{\text{obs}}
  definition: weight that sets how strongly trajectory optimization trades obstacle proximity against
    smoothness
  kind: scalar
  unit: varies
  notes: Its unit converts \ObstacleProximityCost into the units of the jerk term.
- macro: \ObstaclePoint
  latex: \mathbf{o}
  definition: position of one obstacle point stored in the spatial memory map
  kind: vector
  unit: m
  notes: Not an observation; observations are \MultimodalObservation.
- macro: \ObstaclePosition
  latex: x_{\text{obstacle}}
  definition: position of an obstacle along the line of approach
  kind: scalar
  unit: m
  notes: Clearance is $x_{\text{obstacle}} - x_{\text{robot}}$.
- macro: \ObstacleProximityCost
  latex: c_{\text{obs}}
  definition: cost a configuration incurs for its proximity to obstacles, large near or inside them
  kind: function
  unit: varies
  notes: Usually built from signed distances to the obstacle geometry.
- macro: \ObstacleRiskRadius
  latex: r_{\text{risk}}
  definition: radius that conservatively contains a previously localized obstacle after its evidence has
    aged, initial uncertainty plus speed bound times age
  kind: scalar
  unit: m
  notes: Written as a function of \ObservationAge; assumes the speed bound holds and says nothing about
    never-observed obstacles.
- macro: \ObstacleSeparationDistance
  latex: d
  definition: distance between the machine and the nearest obstacle or boundary at a given time, the signal
    a clearance predicate scores
  kind: function
  unit: m
  notes: Written $d(t)$; the predicate is $d(t) - d_{\text{safe}} \ge 0$ with \SafeSeparationDistance.
- macro: \ObstacleStateSet
  latex: \mathcal{X}_{\text{obs}}
  definition: set of plant states at which the robot overlaps an obstacle or crosses a constraint boundary
  kind: set
  notes: A static geometric check tests membership; the inevitable collision states are those from which
    every admissible control reaches it.
- macro: \ObstacleSurfaceArea
  latex: A_{\text{surface}}
  definition: total surface area of the obstacles in a mapped workspace
  kind: scalar
  unit: m^2
- macro: \OccupancyCoverageMultiplier
  latex: k_\sigma
  definition: multiplier on the propagated track deviation that sets the spatial coverage of a forward
    occupancy set
  kind: scalar
  unit: dimensionless
- macro: \OccupancyLogOdds
  latex: L
  definition: natural logarithm of the odds of a voxel's occupancy probability, the quantity an occupancy
    map stores per cell
  kind: function
  unit: dimensionless
  notes: Indexed by step ($L_t$), with $L_0$ the prior. 09_memory writes the same quantity as $\ell$.
- macro: \OccupiedLogOddsIncrement
  latex: L_{\text{occ}}
  definition: positive log-odds increment applied to the voxel that contains a range return
  kind: scalar
  unit: dimensionless
- macro: \OccupiedScenarioCellCount
  latex: N_{\text{supported}}
  definition: number of scenario-table cells containing recorded data, without asserting a declared support minimum
  kind: count
  notes: The historical glyph says supported; occupancy alone does not establish support-qualified coverage.
- macro: \OdometryBaseTransform
  latex: \mathbf{T}_{\text{odom}}^{\text{base}}
  definition: rigid transform mapping base-frame coordinates into the odometry frame
  kind: matrix
- macro: \OdometryCovarianceJacobian
  latex: \mathbf{J}_{\text{odom}}
  definition: Jacobian that projects the odometry pose covariance into world coordinates
  kind: matrix
- macro: \OdometryNoiseStandardDeviation
  latex: \sigma_{w}
  definition: standard deviation an odometry speed disturbance adds to the distance estimate over one
    predict interval
  kind: scalar
  unit: m
  notes: Its square is the scalar process noise; line 286 calls $\mathbf{Q}$ its matrix generalization.
- macro: \OdometryPoseCovariance
  latex: \boldsymbol{\Sigma}_{\text{odom}}
  definition: covariance of the odometry-frame pose estimate, which grows with drift
  kind: matrix
- macro: \OdometryReferenceFrame
  latex: \mathcal{F}_{\text{odom}}
  definition: odometric coordinate frame, locally continuous but drifting
  kind: set
- macro: \OfflineTransitionDataset
  latex: \mathcal{D}_{\text{offline}}
  definition: fixed dataset of logged transitions, each a state, action, reward and next state, that an
    offline reinforcement learner trains on without further interaction
  kind: set
  notes: Not $\DemonstrationDataset$, which holds observation-action pairs for an imitation loss, nor
    $\ExperienceReplayBuffer$, which an online learner keeps refilling.
- macro: \OffloadAdmissionWindow
  latex: W
  definition: 'time an off-board result has to arrive before it can be admitted: the lease less its renewal-jitter
    margin for a renewal, or the dispatch-to-admission ceiling for a new chunk'
  kind: scalar
  unit: s
- macro: \OffloadTailNetworkTime
  latex: t_{\text{net}}^{\text{tail}}
  definition: tail network round-trip time of an off-board computation at the required reliability level
  kind: scalar
  unit: s
- macro: \OffloadTailProcessingTime
  latex: t_{\text{proc}}^{\text{tail}}
  definition: tail remote processing time of an off-board computation at the required reliability level
  kind: scalar
  unit: s
- macro: \OffloadTransactionWindow
  latex: W
  definition: allocated time for network transfer and remote processing within one offloaded transaction
  kind: scalar
  unit: s
  notes: Local validation, deserialization, admission, activation, and tick waiting must separately fit the complete admission budget. Lease-minus-jitter limits transaction latency only under a serial non-overlapping convention; overlapping requests require inter-admission-gap checks.
- macro: \OilBulkModulus
  latex: \beta
  definition: bulk modulus of a hydraulic fluid, its resistance to compression
  kind: scalar
  unit: N/m^2
- macro: \OpenLoopTransferFunction
  latex: L
  definition: open-loop transfer function of a feedback loop, evaluated along the imaginary axis for frequency
    response
  kind: function
  unit: dimensionless
  notes: Never the loss, which is \LossFunction.
- macro: \OpenLoopTransferMatrix
  latex: \mathbf{L}
  definition: open-loop transfer function matrix of a multi-input feedback loop, broken at the plant input
  kind: matrix
  notes: Function of the complex frequency, $\mathbf{L}(s)$; the single-input case is \OpenLoopTransferFunction.
    Not \KalmanBucyObserverGain, which shares the glyph.
- macro: \OperationalFailureProbability
  latex: p_F
  definition: probability under the operational distribution that a scenario falls in the failure region
  kind: scalar
  unit: dimensionless
- macro: \OperationalScenarioDistribution
  latex: p
  definition: declared operational distribution of a scenario's uncertain input parameters, the population
    a failure probability refers to
  kind: distribution
  notes: Also the subscript of $\Pr_p$. Not \InputDistribution.
- macro: \OperationalTestDistribution
  latex: \mathcal{D}
  definition: declared joint distribution of trial conditions an evaluation campaign samples, the population
    its success probability describes
  kind: distribution
  notes: Each stratum of a stratified test matrix is its own distribution. Not a dataset.
- macro: \OperatorCognitiveTime
  latex: T_{\text{cognitive}}
  definition: time an operator needs to decide on a response to a takeover stimulus, the cognitive stage
    of a simple reaction
  kind: scalar
  unit: s
  notes: Model Human Processor cognitive cycle; a term of \SupervisoryTakeoverLatency.
- macro: \OperatorMotorTime
  latex: T_{\text{motor}}
  definition: time an operator needs to move the controls once a response is chosen, the motor stage of
    a simple reaction
  kind: scalar
  unit: s
  notes: Model Human Processor motor cycle; a term of \SupervisoryTakeoverLatency. Not motor (actuator)
    electrical time.
- macro: \OperatorResponseLatency
  latex: t_{\text{hum}}
  definition: time a human operator takes to perceive, decide and move the leader device
  kind: scalar
  unit: s
- macro: \OperatorSensoryTime
  latex: T_{\text{sensory}}
  definition: time an operator needs to perceive a takeover stimulus, the perceptual stage of a simple
    reaction
  kind: scalar
  unit: s
  notes: Model Human Processor perceptual cycle; a term of \SupervisoryTakeoverLatency.
- macro: \OperatorStabilizationInstant
  latex: t_{\text{stabilize}}
  definition: time after a takeover at which the operator's corrections settle into a steady return toward
    the nominal corridor
  kind: scalar
  unit: s
- macro: \OperatorWindowTime
  latex: t'
  definition: time inside the window of a timed temporal operator, the variable over which robustness
    is minimized, maximized or bounded
  kind: scalar
  unit: s
- macro: \OpticalFrequency
  latex: \nu
  definition: frequency of the light striking a photodiode
  kind: scalar
  unit: Hz
- macro: \OpticalWavelength
  latex: \lambda_{\text{wl}}
  definition: wavelength of the light striking an image sensor's photodiodes
  kind: scalar
  unit: m
- macro: \OptimalCostToGoDerivative
  latex: \dot{V}
  definition: time derivative of the optimal cost-to-go along closed-loop trajectories
  kind: function
  notes: Equals minus the running cost for LQR, which is why the Riccati solution is also a Lyapunov function.
- macro: \OptimalCostToGoFunction
  latex: V
  definition: 'optimal cost-to-go of an optimal-control problem: the least remaining cost from a state,
    the value function of the Hamilton-Jacobi-Bellman equation'
  kind: function
  notes: Written with the optimum mark, $V^*(\mathbf{x})$; for LQR it is $\mathbf{x}^\top\mathbf{P}\mathbf{x}$.
    Not \LyapunovFunction, which shares the glyph.
- macro: \OrientationTolerance
  latex: \theta_{\text{tol}}
  definition: largest angular orientation error a task accepts
  kind: scalar
  unit: rad
- macro: \OscillatorAcceleration
  latex: \ddot{q}
  definition: acceleration of the undamped harmonic oscillator used to compare discretization schemes
  kind: scalar
  unit: varies
  notes: Unit of \OscillatorPosition per second squared. Not \JointAcceleration.
- macro: \OscillatorNaturalFrequency
  latex: \omega
  definition: natural angular frequency of the undamped harmonic oscillator used to compare discretization
    schemes
  kind: scalar
  unit: rad/s
  notes: Its continuous poles are $\pm j\omega$. Not \AngularFrequency, the free frequency variable, nor
    \UndampedNaturalFrequency of the PD error loop.
- macro: \OscillatorPosition
  latex: q
  definition: position coordinate of the undamped harmonic oscillator used to compare discretization schemes
  kind: scalar
  unit: varies
  notes: Generic test oscillator; the unit is that of the modeled coordinate (m or rad). Not \JointPosition.
- macro: \OscillatorStepVelocity
  latex: v
  definition: velocity of the undamped test oscillator at one step of the semi-implicit (symplectic) Euler
    update
  kind: scalar
  unit: varies
  notes: The sampled counterpart of \OscillatorVelocity; indexed by the step, $v_k$.
- macro: \OscillatorVelocity
  latex: \dot{q}
  definition: velocity of the undamped harmonic oscillator used to compare discretization schemes, the
    time derivative of its position
  kind: scalar
  unit: varies
  notes: Unit of \OscillatorPosition per second. Written $v$ in the symplectic Euler update (\OscillatorStepVelocity).
- macro: \OutgoingChannelCommand
  latex: u_{\text{prior}}
  definition: channel command of the source being retired at a bumpless transfer
  kind: scalar
  unit: varies
  notes: Same unit as \ChannelCommand.
- macro: \OutgoingCommandDerivative
  latex: \dot{u}_{\text{prior}}
  definition: time derivative of the outgoing source command during a bumpless transfer
  kind: scalar
  unit: varies
  notes: Channel unit per second; zero for a latched endpoint.
- macro: \OutputBearingDamping
  latex: D_{\text{joint}}
  definition: viscous damping coefficient of a joint's output bearings
  kind: scalar
  unit: N*m*s/rad
- macro: \OutputChannel
  latex: y
  definition: one measured output of a multi-output system, a component of the measurement vector
  kind: scalar
  unit: varies
  notes: Indexed by output, $y_i$; its $r_i$-th derivative is the first to show the input.
- macro: \OutputComponentFunction
  latex: h
  definition: one scalar component of the output map of a nonlinear system, a function of the state
  kind: function
  notes: Indexed by output, $h_i$. Not \BarrierFunction, which shares the glyph.
- macro: \OutputDimension
  latex: p
  definition: number of measured outputs of a state-space model, the length of the output vector
  kind: count
  notes: Rows of \MeasurementMatrix and of the decoupling matrix. Not \CharacteristicPolynomial.
- macro: \OutputIndex
  latex: \ell
  definition: position of one measured output channel of a multi-output system, from one to the output
    dimension
  kind: index
- macro: \OutputRelativeDegree
  latex: r
  definition: relative degree of an output of a control-affine system, the number of differentiations
    before the input appears
  kind: count
  notes: Indexed by output, $r_i$; unindexed in $\mathbf{y}^{(r)}$ it is the list of them. Not \BarrierRelativeDegree,
    the barrier function's relative degree.
- macro: \OutputTorqueCeiling
  latex: \tau_{\text{out,max}}
  definition: largest joint output torque a drive can deliver under its present current limit and thermal
    state
  kind: scalar
  unit: N*m
  notes: Efficiency times gear ratio times torque constant times current limit.
- macro: \OverheadCameraEmbedding
  latex: \mathbf{e}_{\text{overhead}}
  definition: camera-identifier embedding of the overhead scene camera
  kind: vector
- macro: \OverlappingGaussianSet
  latex: \mathcal{N}
  definition: set of Gaussian primitives that overlap one pixel, ordered front to back by depth
  kind: set
  notes: Not the Gaussian distribution \GaussianDistribution, which also renders $\mathcal{N}$.
- macro: \PairedTaskIndex
  latex: j
  definition: index of a second periodic task compared with task i, such as the task whose period is longer
  kind: index
  notes: Inside a subscript $j$ needs no macro; this entry covers a bare $j$ argument such as $\text{priority}(j)$.
- macro: \PairingLagCeiling
  latex: \Delta t_{\text{lag,max}}
  definition: largest observation-to-action pairing lag that keeps the resulting displacement within the
    task clearance
  kind: scalar
  unit: s
  notes: The Delta is part of the symbol.
- macro: \ParallelRigCount
  latex: N_{\text{rig}}
  definition: number of physical rigs that run trials of one learning campaign in parallel
  kind: count
- macro: \ParameterRandomizationRanges
  latex: \mathcal{P}
  definition: ranges over which domain randomization samples each simulator parameter, recorded in the
    simulation provenance with their source
  kind: set
  notes: Written over the parameter set, $\mathcal{P}(\SimulationParameterSet)$. Not the big-O operator
    or a probability.
- macro: \ParameterStreamingTime
  latex: t_{\text{stream}}
  definition: time to stream model weights that do not stay resident into the compute units for one evaluation
  kind: scalar
  unit: s
  notes: Weight bytes over sustained memory bandwidth.
- macro: \ParametricProposalDistribution
  latex: q_{\boldsymbol{\psi}}
  definition: proposal distribution from a parametric family, selected by its parameter vector in the
    cross-entropy method
  kind: distribution
- macro: \PassedTrialCount
  latex: N_{\text{pass}}
  definition: number of executed trials scored as passing
  kind: count
- macro: \PastSynchronizationStepIndex
  latex: j
  definition: summation index over past synchronization steps in a clock servo's integral term
  kind: index
- macro: \PatchColumnIndex
  latex: w
  definition: column of one patch in the grid of patches a vision transformer cuts an image into
  kind: index
- macro: \PatchRowIndex
  latex: h
  definition: row of one patch in the grid of patches a vision transformer cuts an image into
  kind: index
- macro: \PatchTokenCount
  latex: N
  definition: number of patch tokens a vision transformer cuts one image into, the image area divided
    by the squared patch size
  kind: count
- macro: \PathAcceleration
  latex: \ddot{s}
  definition: second time derivative of the path coordinate, the acceleration along a geometric path
  kind: scalar
  unit: 1/s^2
  notes: Torque limits bound it at each phase-plane point between \PathAccelerationLowerBound and \PathAccelerationUpperBound.
- macro: \PathAccelerationInput
  latex: u
  definition: path acceleration held constant over one grid interval, the control input of the discretized
    path-parameterization problem
  kind: scalar
  unit: 1/s^2
  notes: Equal to \PathAcceleration on its interval; the forward pass picks the largest admissible value
    at each step.
- macro: \PathAccelerationLowerBound
  latex: \ddot{s}_{\min}
  definition: smallest path acceleration the joint torque and acceleration limits admit at a given path
    position and path velocity
  kind: function
  unit: 1/s^2
  notes: Written with its phase-plane arguments, $\PathAccelerationLowerBound(\PathCoordinate, \PathVelocity)$;
    the braking curve of a time-optimal profile follows it.
- macro: \PathAccelerationTorqueCoefficient
  latex: \mathbf{a}_{\tau}
  definition: vector multiplying path acceleration in the path-parameterized manipulator torque equation
  kind: vector
  unit: N*m*s^2
  notes: Vector multiplying path acceleration $\ddot{s}$ in the path-parameterized manipulator torque
    equation.
- macro: \PathAccelerationUpperBound
  latex: \ddot{s}_{\max}
  definition: largest path acceleration the joint torque and acceleration limits admit at a given path
    position and path velocity
  kind: function
  unit: 1/s^2
  notes: Where it meets \PathAccelerationLowerBound the admissible interval closes, which traces the maximum
    velocity curve.
- macro: \PathCoordinate
  latex: s
  definition: scalar coordinate along a geometric path, from zero at its start to one at its end, that
    time parameterization maps to time
  kind: scalar
  unit: dimensionless
  notes: The path is $\GeneralizedCoordinates(\PathCoordinate)$; the timing law is $s(t)$. Primes denote
    $d/ds$.
- macro: \PathDelayAsymmetry
  latex: \Delta t_{\text{asym}}
  definition: difference between the forward and reverse one-way delays of a clock-synchronization exchange,
    which biases the estimated clock offset by half its value
  kind: scalar
  unit: s
  notes: Two-way time transfer assumes it is zero. Not \FiniteChange.
- macro: \PathGridPointCount
  latex: N_{\text{grid}}
  definition: number of grid points along a geometric path at which a time-parameterization algorithm
    checks its constraints
  kind: count
  notes: TOPP-RA solves one small linear program per point, $\mathcal{O}(\PathGridPointCount)$ in all.
    Not \TrajectorySampleCount.
- macro: \PathVelocity
  latex: \dot{s}
  definition: rate at which the path coordinate advances in time, the speed along a geometric path that
    time parameterization chooses
  kind: scalar
  unit: 1/s
  notes: Time derivative of \PathCoordinate; the phase plane is $(s, \dot s)$ and total duration is $\int_0^1
    ds/\dot s$. In radians per second when the joint angle is the path coordinate.
- macro: \PathVelocityField
  latex: v
  definition: velocity field that transports a flow-matching probability path, the field in its continuity
    equation
  kind: function
  notes: Subscripted by flow time. The text later names the marginal field \MarginalVelocityField; see
    the glossary question.
- macro: \PathVelocitySquaredTorqueCoefficient
  latex: \mathbf{b}_{\tau}
  definition: vector multiplying squared path velocity in the path-parameterized manipulator torque equation
  kind: vector
  unit: N*m*s^2
  notes: Combines path curvature with Coriolis and centrifugal effects.
- macro: \PayloadGravityTorque
  latex: \tau_{g}
  definition: torque the weight of a carried payload exerts about one joint axis
  kind: scalar
  unit: N*m
  notes: 'It makes torque-limited acceleration asymmetric: $(\JointTorqueLimit \mp \PayloadGravityTorque)/\EffectiveJointInertia$.
    Not \HoldingTorque, which is the motor-side requirement at standstill.'
- macro: \PayloadLeverArm
  latex: r
  definition: distance from a joint axis to the center of gravity of the mass it carries, the arm of the
    gravity moment
  kind: scalar
  unit: m
- macro: \PeakBridgeJerk
  latex: j_{\text{peak}}
  definition: largest jerk of one joint over a seam bridge, found at its endpoints or its interior stationary
    point
  kind: scalar
  unit: rad/s^3
- macro: \PeakContactForce
  latex: F_{\text{peak}}
  definition: largest contact force reached during one contact event
  kind: scalar
  unit: N
  notes: For an unbraked coasting impact the book uses \UnbrakedImpactForce.
- macro: \PeakCopperLossPower
  latex: P_{\text{peak}}
  definition: copper loss a winding dissipates during a burst at peak current
  kind: scalar
  unit: W
  notes: Dissipated during the on-time of each duty cycle and absent during recovery.
- macro: \PeakCurrent
  latex: I_{\text{peak}}
  definition: largest motor current permitted during a short burst
  kind: scalar
  unit: A
  notes: Bounded by winding insulation class and inverter MOSFET dissipation; continuous rating is \ContinuousCurrent.
  aliases:
  - \ContinuousPeakCurrentTwo
- macro: \PeakDissipationPower
  latex: P_{\text{peak}}
  definition: winding loss power dissipated while the motor carries its peak current
  kind: scalar
  unit: W
- macro: \PeakInternodeTimingError
  latex: \Delta t_{\text{peak}}
  definition: largest timing disagreement between bus nodes during a synchronization blackout
  kind: scalar
  unit: s
  notes: Drift over the blackout plus timing jitter.
  aliases:
  - \PeakInternodePhaseJitter
- macro: \PeakPenetrationDepth
  latex: \delta_{\max}
  definition: largest penetration depth reached during an impact, where the approach velocity has fallen
    to zero
  kind: scalar
  unit: m
- macro: \PeakRegenerativePower
  latex: P_{\text{regen, peak}}
  definition: largest electrical power a regenerative stop returns to the DC bus
  kind: scalar
  unit: W
- macro: \PeakRotorAngularSpeed
  latex: \omega_{\max}
  definition: largest motor rotor angular speed from which a regenerative stop begins
  kind: scalar
  unit: rad/s
- macro: \PeakSlipRatio
  latex: \lambda_{\text{peak}}
  definition: slip ratio at which the longitudinal friction coefficient reaches its maximum
  kind: scalar
  unit: dimensionless
- macro: \PeakStopDeceleration
  latex: a_{\text{peak}}
  definition: largest deceleration a stopping profile reaches, at the midpoint for the quintic polynomial
    stop
  kind: scalar
  unit: m/s^2
  notes: Held at \ProfileAccelerationBound it fixes the polynomial stop's duration.
- macro: \PeakTorque
  latex: \tau_{\text{peak}}
  definition: largest transient joint torque permitted during short bursts
  kind: scalar
  unit: N*m
  notes: Typically two to four times the continuous torque, allowed only under an $I^2 t$ thermal observer.
    Holding torque is \HoldingTorque.
  aliases:
  - \ContinuousPeakTorque
- macro: \PeakTractionCoefficient
  latex: \mu_{\text{peak}}
  definition: largest longitudinal friction coefficient a tire reaches over slip ratio, setting the peak
    traction
  kind: scalar
  unit: dimensionless
- macro: \PenaltyContactDamping
  latex: c
  definition: damping coefficient of a penalty (Kelvin-Voigt) contact model, the force per unit penetration
    rate added to the spring force
  kind: scalar
  unit: N*s/m
  notes: Pairs with \PenaltyContactStiffness in $f_n = k_{\text{pen}}\delta + c\dot{\delta}$.
- macro: \PenaltyContactStiffness
  latex: k_{\text{pen}}
  definition: stiffness of the compliant penalty spring a physics simulator uses to compute contact force
    from penetration depth
  kind: scalar
  unit: N/m
  notes: Simulated counterpart of \ContactStiffness; the penalty contact model is $f_n = k_{\text{pen}}\delta
    + c\dot{\delta}$. Usually far softer than a steel strike plate, which is the sim-to-real contact exploit.
- macro: \PenaltyPenetrationDepth
  latex: \delta_{\text{pen}}
  definition: largest penetration depth a penalty-contact simulator allows at a given approach speed,
    which fixes its effective spring stiffness
  kind: scalar
  unit: m
  notes: A particular value of \PenetrationDepth; with \Mass and the approach speed it fixes \PenaltyContactStiffness.
- macro: \PenaltyRestitutionDuration
  latex: \Delta t_{\text{res}}
  definition: duration of the restitution phase of a simulated penalty contact, from peak penetration
    to separation
  kind: scalar
  unit: s
  notes: A duration, not a discrepancy.
- macro: \PendulumNaturalFrequency
  latex: \omega_0
  definition: natural frequency of the linear inverted pendulum, the square root of gravitational acceleration
    over center-of-mass height, at which an unrecovered lean grows exponentially
  kind: scalar
  unit: rad/s
  notes: $\PendulumNaturalFrequency = \sqrt{\Gravity/\MassCenterHeight}$; its reciprocal is \BalanceDivergenceTime.
    The subscript 0 is part of the glyph, not an index.
- macro: \PenetrationDepth
  latex: \delta
  definition: depth by which one body penetrates or compresses another at a contact, measured along the
    contact normal
  kind: scalar
  unit: m
  notes: Penalty and compliant contact models compute normal force from it, $f_n = k\delta + c\dot{\delta}$.
    Not the Huber threshold \HuberLossThreshold, which shares the glyph in the training chapter.
- macro: \PenetrationRate
  latex: \dot{\delta}
  definition: time rate of change of the penetration depth at a contact
  kind: scalar
  unit: m/s
  notes: Time derivative of \PenetrationDepth; zero at the instant of maximum compression.
- macro: \PerFrameDetectionProbability
  latex: p_{\text{frame}}
  definition: probability that a person detector reports a person who is in view in one camera frame
  kind: scalar
  unit: dimensionless
  notes: Measured separately for each group of people. Treating misses in consecutive frames as independent
    flatters the detector when its misses are correlated, as they are for a person it systematically
    fails to see.
- macro: \PerStepCostBound
  latex: C_{\max}
  definition: largest incremental task cost a policy can incur in one step after it has drifted into states
    the expert never visited
  kind: scalar
  unit: dimensionless
  notes: Multiplies the error probability in the behavior-cloning cost bound; in units of the task cost.
- macro: \PerceptionDepthCovariance
  latex: \boldsymbol{\Sigma}_{\text{depth}}
  definition: covariance of the three-dimensional position error of a point lifted from stereo, lidar
    or depth data
  kind: matrix
  unit: m^2
- macro: \PerceptionDispatchTime
  latex: t_{\text{IPC}}
  definition: time to package a perception output with its covariance and dispatch it to consumers between
    processes
  kind: scalar
  unit: s
- macro: \PerceptionErrorScale
  latex: \epsilon_{\text{scale}}
  definition: 'order-of-magnitude scale of perception position error: travel during the observation age
    plus stereo depth noise plus extrinsic error'
  kind: scalar
  unit: m
  notes: A scale, not a safety envelope.
- macro: \PeriodicPeakWindingTemperature
  latex: T_{\text{peak}}
  definition: highest winding temperature reached in the periodic steady state of a burst schedule
  kind: scalar
  unit: degC
  notes: Exceeds the average-power equilibrium for any finite burst; its rise above ambient is written
    with \FiniteChange.
- macro: \PeriodicTaskCount
  latex: n
  definition: number of periodic tasks in a real-time task set
  kind: count
  notes: Sets the Liu and Layland utilization bound, which falls toward ln 2 as the count grows.
- macro: \PermanentMagnetFluxLinkage
  latex: \lambda_{\text{pm}}
  definition: magnetic flux from the rotor magnets that links each stator winding
  kind: scalar
  unit: V*s
  notes: Sets the torque constant with the pole-pair count.
- macro: \PermissionLoopPeriod
  latex: T_{\text{tick}}
  definition: period of the permission loop, the longest a hazard may wait before it is checked
  kind: scalar
  unit: s
  notes: One term of the pre-brake delay \PrebrakeDelay.
  aliases:
  - \PermissionloopPeriodTick
- macro: \PermissionPathKernel
  latex: G_\kappa
  definition: conditional distribution of the admitted command given the state and the policy's proposal,
    set by the permission-path parameters
  kind: distribution
  notes: A deterministic permission map is a point-mass kernel.
- macro: \PermissionPathParameters
  latex: \kappa
  definition: configuration of the permission path in one rollout, such as lease durations and barrier
    thresholds
  kind: record
  notes: Indexes the permission kernel G_kappa. Not the evaluation chapter's termination protocol, which
    it also writes kappa, nor \ClassKFunction.
- macro: \PermissionTickWaitTime
  latex: t_{\text{wait}}
  definition: time a staged plan waits for the next discrete tick of the permission loop
  kind: scalar
  unit: s
  notes: At most one \PermissionLoopPeriod.
- macro: \PermissionTickWcet
  latex: T_{\text{wcet}}
  definition: declared worst-case execution time of the permission tick running in isolation, the falsification
    threshold a loaded cycle must not exceed
  kind: scalar
  unit: s
  notes: Placement-specific instance of \WorstCaseExecutionTime for the permission path. A loaded cycle
    above it refutes the placement even when the tick meets $T_{\text{deadline,enf}}$.
- macro: \PersonApproachTravel
  latex: S_h
  definition: distance a person travels toward the robot during the robot's reaction and stopping time
  kind: scalar
  unit: m
  notes: Term of the ISO/TS 15066 protective separation distance S_p = S_h + S_r + S_s + C + Z_d + Z_r.
- macro: \PersonPositionUncertainty
  latex: Z_d
  definition: position uncertainty of the person from the sensing system
  kind: scalar
  unit: m
  notes: Term of the ISO/TS 15066 protective separation distance S_p = S_h + S_r + S_s + C + Z_d + Z_r.
- macro: \PerturbedPose
  latex: \mathbf{T}'
  definition: rigid-body pose after a small random twist perturbation is composed with the mean pose in
    its local frame
  kind: matrix
  notes: The mean pose is $\Pose$; the perturbation is $\PoseTwistPerturbation$.
- macro: \PhaseInductance
  latex: L_{\text{phase}}
  definition: inductance of one motor phase winding
  kind: scalar
  unit: H
  aliases:
  - \PhaseInductanceAndResistance
- macro: \PhaseJoulePower
  latex: P_{\text{phase}}
  definition: resistive heating power dissipated in one motor phase winding, the RMS phase current squared
    times the phase resistance
  kind: scalar
  unit: W
  notes: $P_{\text{phase}} = \MotorPhaseRmsCurrent^2 \PhaseResistance$. Summed over phases it is the copper
    loss that drives \JouleanTemperatureRise.
- macro: \PhaseMargin
  latex: \Phi_m
  definition: 'phase margin of a feedback loop: the additional phase lag at gain crossover that would
    bring the loop to instability'
  kind: scalar
  unit: deg
  notes: Before delay erosion; the margin left after delay is \NetPhaseMargin.
- macro: \PhaseResistance
  latex: R_{\text{phase}}
  definition: resistance of one motor phase winding
  kind: scalar
  unit: Ohm
  aliases:
  - \PhaseInductanceAndResistanceTwo
- macro: \PhotodiodeQuantumEfficiency
  latex: \eta_{\text{QE}}
  definition: fraction of incident photons a photodiode converts into collected electrons, as a function
    of wavelength
  kind: function
  unit: dimensionless
  notes: Written with its wavelength argument in the chapter; never bare eta, which is the learning rate.
- macro: \PhysicalPlantDynamics
  latex: f_{\text{real}}
  definition: dynamics of the real machine and environment, the operator a physical trial evaluates a
    policy against
  kind: function
- macro: \PhysicalRestoreTime
  latex: t_{\text{physical\_restore}}
  definition: time to return the machine and fixture to the trial's starting configuration, part of the
    reset latency
  kind: scalar
  unit: s
- macro: \PhysicalReturnLevel
  latex: z_{T, \text{real}}
  definition: return level of the physical machine, bounded by the simulated return level plus the transfer
    discount
  kind: scalar
  unit: varies
  notes: Units of the monitored performance metric (m for a distance overshoot).
- macro: \PhysicalStateTrajectory
  latex: s_{\text{real}}
  definition: state trajectory the physical machine produces under declared conditions and a control input
    history
  kind: function
  unit: varies
  notes: Units follow the state components (positions in m, velocities in m/s, torques in N*m).
- macro: \PhysicalStlRobustness
  latex: \rho_{\text{real}}
  definition: quantitative robustness of a signal temporal logic formula on the physical machine's trajectory
  kind: scalar
  unit: varies
  notes: Bounded below by $\rho_{\text{sim}} - L_\phi\epsilon_{\text{gap}}$.
- macro: \PhysicalTrajectorySet
  latex: \mathcal{S}_{\text{real}}
  definition: set of trajectories the physical machine can produce under given declared conditions
  kind: set
- macro: \PhysicalWorldState
  latex: s
  definition: ground-truth state of the machine, its environment and their contacts at step t
  kind: record
  notes: 'Kind is not settled: the book treats it as a state of any type, written non-bold $s_t$.'
- macro: \PidDerivativeGain
  latex: K_d
  definition: feedback gain on the velocity error, the damping of a PD or impedance controller
  kind: scalar
  unit: N*s/m
  notes: Joint-space form in $\text{N}\cdot\text{m}\cdot\text{s/rad}$.
- macro: \PidIntegralGain
  latex: K_i
  definition: feedback gain on the accumulated error in a PI or PID controller
  kind: scalar
  unit: varies
  notes: 'Units depend on the loop; in the PTP servo the sampling interval is absorbed into it. Unit:
    controller output per error-second.'
- macro: \PidProportionalGain
  latex: K_p
  definition: feedback gain on the position error, the stiffness of a PD or impedance controller
  kind: scalar
  unit: N/m
  notes: Joint-space form in $\text{N}\cdot\text{m/rad}$; in the PTP clock servo it is dimensionless.
- macro: \PidProportionalGainMatrix
  latex: \mathbf{K}_p
  definition: proportional gain matrix of multi-joint PD or PID feedback, the stiffness acting on the
    position error
  kind: matrix
  notes: Matrix form of \PidProportionalGain.
- macro: \PipelineFlushDelay
  latex: t_{\text{hw\_pipe}}
  definition: time a processor takes to flush its pipeline when it takes an interrupt
  kind: scalar
  unit: s
- macro: \PistonArea
  latex: A
  definition: area of a hydraulic cylinder's piston face
  kind: scalar
  unit: m^2
- macro: \PixelColumnCoordinate
  latex: u
  definition: horizontal pixel coordinate, the column, of a point in the image
  kind: scalar
  unit: pixels
  notes: Pairs with \PixelRowCoordinate.
- macro: \PixelLastEventTime
  latex: t_{\text{last}}
  definition: time at which an event-camera pixel last emitted an event, the reference for its next contrast
    comparison
  kind: scalar
  unit: s
  notes: Shares its glyph with the last-observation time of a map cell in vol4 memory, a different quantity.
- macro: \PixelOpacityContribution
  latex: \alpha'
  definition: opacity a Gaussian contributes at one pixel during alpha blending, its stored opacity weighted
    by its projected footprint at that pixel
  kind: scalar
  unit: dimensionless
  notes: Distinct from \GaussianPrimitiveOpacity, the stored value.
- macro: \PixelRowCoordinate
  latex: v
  definition: vertical pixel coordinate, the row, of a point in the image
  kind: scalar
  unit: pixels
  notes: Pairs with \PixelColumnCoordinate. Not \SensorRowIndex, the readout row of a rolling-shutter
    sensor.
- macro: \PixelRowStandardDeviation
  latex: \sigma_v
  definition: standard deviation of the measured pixel row coordinate
  kind: scalar
  unit: pixels
- macro: \PixelStandardDeviation
  latex: \sigma_u
  definition: standard deviation of a measured image position, in pixels
  kind: scalar
  unit: pixels
- macro: \PlanValidationTime
  latex: t_{\text{validate}}
  definition: time the permission path spends validating a whole candidate plan before admitting it
  kind: scalar
  unit: s
- macro: \PlanarHomographyMatrix
  latex: \mathbf{H}
  definition: three-by-three homography mapping points of a planar calibration model to image points
  kind: matrix
  notes: Not \MeasurementMatrix.
- macro: \PlanarPositionEmbedding
  latex: \mathbf{E}_{\text{pos}}^{2D}
  definition: position embedding of an image patch built from a row component and a column component,
    a function of the patch's row and column
  kind: function
  notes: The factorized two-dimensional form of $\VitPositionEmbedding$, written with the patch row and
    column as arguments.
- macro: \PlanarSpecialEuclideanGroup
  latex: SE(2)
  definition: group of rigid-body transformations in the plane, rotations combined with translations,
    the configuration space of a planar mobile base
  kind: set
  notes: Planar counterpart of \SpecialEuclideanGroup.
  render_exception: Lie groups are written upright by convention, SE(2) and SE(3).
- macro: \PlanckConstant
  latex: h
  definition: Planck constant, relating a photon's energy to its frequency
  kind: scalar
  unit: J*s
  notes: Physical constant; shares its glyph with \BarrierFunction, which never appears in perception.
- macro: \PlanningOperator
  latex: o
  definition: action of a symbolic planner defined by its preconditions, add list and delete list, as
    in STRIPS
  kind: record
- macro: \PlanningStageLatency
  latex: T_{\text{plan}}
  definition: time the planning stage of a blocking sensor-to-actuation path takes, including its queueing
    and execution delay
  kind: scalar
  unit: s
  notes: One term of \ObservationResponseLatency.
- macro: \PlanningStartInstant
  latex: t_{\text{plan}}
  definition: instant at which the planner samples state and begins a replacement
  kind: scalar
  unit: s
  notes: Its change to the seam is the latency future-state conditioning offsets.
- macro: \PlantDynamicsFunction
  latex: \mathbf{f}
  definition: vector field of a plant's equations of motion, giving the state rate from the state, control
    input and plant parameters
  kind: function
  notes: Not \ControlAffineDriftField, the unforced part of control-affine dynamics, which shares the
    glyph.
- macro: \PlantDynamicsParameters
  latex: \theta_{\text{plant}}
  definition: physical parameters of a plant's dynamics, such as resistances, stiffness and friction,
    that drift over operating time
  kind: vector
  notes: Written non-bold, with time as its argument.
  render_exception: Non-bold theta for a parameter vector, the convention \ModelParameters also keeps.
- macro: \PlantOutcomeFunction
  latex: g
  definition: nonlinear map from an action applied to the plant to the physical outcome it produces
  kind: function
  notes: Used to state Jensen's inequality for mode averaging. Not \ActivationFunction.
- macro: \PlantParameters
  latex: m
  definition: physical and hardware properties of the machine in one trial or rollout, such as tolerances,
    wear, payload mass, state of charge and calibration
  kind: record
  notes: Not \Mass (also m).
- macro: \PlantStateAcceleration
  latex: \ddot{\mathbf{x}}
  definition: second time derivative of the mechanical plant state, the acceleration a force produces
    in a double-integrator plant
  kind: vector
  notes: Decorated form of \MechanicalPlantState, used where the state is restricted to positions.
- macro: \PlantStateComponentCount
  latex: N_s
  definition: number of sampled plant-state components an authority log entry records, fixed by the static
    manifest
  kind: count
- macro: \PlantStateDimension
  latex: n
  definition: number of components of the plant state vector
  kind: count
  notes: For a manipulator it is twice \GeneralizedCoordinateCount.
- macro: \PlantStateRate
  latex: \dot{\mathbf{x}}
  definition: time derivative of the mechanical plant state
  kind: vector
  notes: Decorated form of \MechanicalPlantState. Not \ToolCartesianVelocity, which shares the glyph.
- macro: \PlantStateSpace
  latex: \mathcal{X}
  definition: set of all states the mechanical plant can occupy, positions with velocities
  kind: set
  notes: Contains \ObstacleStateSet and the inevitable collision states.
- macro: \PlantTransitionDensity
  latex: p_m
  definition: distribution of the next state given the state and the admitted command, for a plant with
    the given parameters
  kind: distribution
  notes: Same quantity as the evaluation chapter's proposed \PlantTransitionKernel (calligraphic T) with
    the plant parameters written as a subscript.
- macro: \PlantTransitionKernel
  latex: \mathcal{T}
  definition: 'stochastic transition kernel of the physical plant: the distribution of the next state
    given the state, the applied command and the trial''s plant and environment parameters'
  kind: distribution
- macro: \PointClearanceMargin
  latex: d_{\text{margin}}
  definition: smallest distance a candidate point must keep from every stored obstacle point to pass the
    clearance predicate
  kind: scalar
  unit: m
  notes: Distinct from \ProtectiveClearanceMargin, the clearance kept after the machine stops.
- macro: \PoissonSubintervalCount
  latex: n
  definition: number of equal subintervals operating time is divided into when the Poisson model is derived
    as a limit of Bernoulli trials
  kind: count
  notes: Not \ZeroFailureTrialCount, which also renders n.
- macro: \PolicyActionStandardDeviation
  latex: \sigma^{\pi}
  definition: standard deviation, given the state, of one action component of a diagonal Gaussian policy,
    indexed by action dimension
  kind: function
  unit: varies
  notes: Carries the unit of the action component.
- macro: \PolicyActionWindow
  latex: \mathbf{A}_{t:t+H-1}
  definition: action chunk written with its time window, the actions a policy predicts from one control
    step through the last step of its horizon
  kind: matrix
  notes: The window holds $\ActionChunkHorizon$ actions, $\CognitivePolicyAction_{t}$ through $\CognitivePolicyAction_{t+\ActionChunkHorizon-1}$,
    and has shape $\ActionChunkHorizon$ by $\ActionDimension$. Supersedes $\ActionChunkTrajectory$, whose
    LaTeX $\mathbf{A}_{t:t+H}$ ends one step late; that entry can become an alias of this one. The bare
    chunk is $\ActionChunk$.
- macro: \PolicyEnsembleCovariance
  latex: \boldsymbol{\Sigma}_{\pi}
  definition: covariance of the actions a policy ensemble proposes, each component normalized by its declared
    scale
  kind: matrix
  notes: Its trace is compared with $\sigma_{\text{thresh}}^2$.
- macro: \PolicyEntropy
  latex: \mathcal{H}
  definition: entropy of a stochastic policy's action distribution at a given state, the quantity maximum-entropy
    reinforcement learning rewards
  kind: function
  unit: nats
  notes: Not \ShannonEntropy H of a discrete variable in bits; \NextTokenEntropy is the language-model
    analogue.
- macro: \PolicyInferenceFrequency
  latex: f_{\text{policy}}
  definition: rate at which the learned policy predicts a new action chunk
  kind: scalar
  unit: Hz
- macro: \PolicyPassRate
  latex: f
  definition: number of forward passes per second a learned policy can run, at most sustained memory bandwidth
    over weight memory when weight streaming dominates
  kind: scalar
  unit: Hz
  notes: One pass yields a whole action chunk, so the setpoint rate is this rate times the chunk horizon.
- macro: \PolicyTti
  latex: T_{\text{TTI}}
  definition: 'time to intervention (TTI): elapsed time from granting a policy authority to the first
    permission-path override or operator takeover'
  kind: scalar
  unit: s
- macro: \PolynomialCoefficientVector
  latex: \mathbf{a}
  definition: vector stacking the coefficients of a trajectory polynomial, lowest power first
  kind: vector
  notes: Solved from the confluent Vandermonde system $\mathbf{M}\mathbf{a}=\mathbf{b}$; a slice such
    as $\mathbf{a}_{3:5}$ is an index range on this entry. Not the policy action $\mathbf{a}_t$ (\CognitivePolicyAction).
- macro: \PolynomialPowerIndex
  latex: k
  definition: index of one power-of-time term in a polynomial trajectory
  kind: index
- macro: \PolynomialTrajectoryCoefficient
  latex: a
  definition: coefficient of one power of time in a polynomial joint trajectory segment
  kind: scalar
  unit: varies
  notes: Indexed by the power it multiplies ($a_0$ to $a_5$ for a quintic). Unit is the joint unit divided
    by seconds to that power. Not acceleration ($a_{\max}$, \ProfileAccelerationBound).
- macro: \PortCycleNetEnergy
  latex: \Delta E
  definition: net mechanical energy a delayed teleoperation port delivers over one closed motion cycle
  kind: scalar
  unit: J
  notes: The Delta is part of the symbol. Positive means the port generates energy and passivity is lost.
- macro: \PortEffort
  latex: \mathbf{F}
  definition: effort variable at a mechanical port, the force or torque that multiplies the port flow
    to give power
  kind: vector
- macro: \PortFlow
  latex: \dot{\mathbf{x}}
  definition: flow variable at a mechanical port, the velocity that multiplies the port effort to give
    power
  kind: vector
  notes: Not \PlantStateRate (time derivative of the full plant state).
- macro: \PortInput
  latex: \mathbf{u}
  definition: input of a system at its power port, an effort variable whose inner product with the port
    output is the power supplied
  kind: vector
  notes: Here u^T y is power. Not the generic plant control input \ControlInput nor the wave variable
    \LeaderForwardWave.
- macro: \PortOutput
  latex: \mathbf{y}
  definition: output of a system at its power port, a flow variable whose inner product with the port
    input is the power supplied
  kind: vector
  notes: Not the sensor measurement vector \MeasurementVector, which shares the glyph in the same appendix.
- macro: \PortStoredEnergy
  latex: E
  definition: energy stored in a physical system behind an interaction port, as a function of time
  kind: scalar
  unit: J
  notes: Written E(0) for the initially stored energy in the passivity inequality; the bound it sets is
    not a force limit.
- macro: \PortVelocity
  latex: v
  definition: velocity of the leader-follower port through which reflected contact force does work
  kind: scalar
  unit: m/s
- macro: \Pose
  latex: \mathbf{T}
  definition: rigid-body pose of a named frame, its rotation and position together
  kind: matrix
  notes: An element of \SpecialEuclideanGroup, subscripted by the frame ($\mathbf{T}_{\text{grasp}}$).
    The frame-to-frame form is \HomogeneousTransform. Bold, so never confused with time $T$.
- macro: \PoseTwistPerturbation
  latex: \boldsymbol{\epsilon}
  definition: zero-mean Gaussian twist vector that perturbs a mean pose in its local frame to model pose
    uncertainty
  kind: vector
  notes: Not \DiffusionGaussianNoise, which shares the glyph.
- macro: \PoseTwistPerturbationMatrix
  latex: \hat{\boldsymbol{\epsilon}}
  definition: four-by-four matrix form of a pose twist perturbation, exponentiated to perturb a mean pose
  kind: matrix
- macro: \PositionComponent
  latex: p
  definition: component of a Cartesian position along one coordinate axis
  kind: scalar
  unit: m
  notes: Written with the axis index ($p_i$); the vector is \CartesianPosition.
- macro: \PositionConfidenceEllipsoidRadius
  latex: \chi_{3,0.95}
  definition: Mahalanobis radius of the 95 percent confidence ellipsoid of a three-dimensional Gaussian
    position estimate, whose square is the chi-square quantile for three degrees of freedom at confidence
    0.95
  kind: scalar
  unit: dimensionless
  notes: Written squared, $\PositionConfidenceEllipsoidRadius^2$. The fixed dimension and confidence level
    are part of the glyph because the check reads the decimal subscript of $\ConfidenceEllipsoidRadius$
    as a decoration; that general entry can become an alias of this one if no other chapter needs a different
    level.
- macro: \PositionErrorBound
  latex: E
  definition: worst-case position error of a target estimate as a function of the time elapsed since its
    evidence was captured
  kind: function
  unit: m
  notes: 09_memory writes the same growth law (eq-mem-occlusion-expansion).
- macro: \PositionErrorCeiling
  latex: e_{\max}
  definition: largest position error a target's own motion may add before a measurement of it is too stale
    to act on
  kind: scalar
  unit: m
  notes: Task tolerance minus the initial estimation error, $e_{\max} = r_{\text{tol}} - e_0$.
  aliases:
  - \InitialAndCeilingError
- macro: \PositionErrorCovariance
  latex: \mathbf{P}_{pp}
  definition: position block of an estimator's error covariance, the spread of its position estimate
  kind: matrix
  notes: Entries in m^2; its principal eigenvalue sizes a hull inflation.
- macro: \PositionErrorEnvelope
  latex: e
  definition: conservative bound on the position error of a target estimate along one coordinate axis
    of the base frame
  kind: scalar
  unit: m
  notes: Written with the axis index ($e_i$).
- macro: \PositionUncertaintyRadius
  latex: r
  definition: radius of the region that may contain a previously localized obstacle, given its position
    uncertainty
  kind: scalar
  unit: m
  notes: Subscript 0 marks its value at the evidence epoch; grown by speed bound times age it gives \ObstacleRiskRadius.
- macro: \PositionalTaskTolerance
  latex: r_{\text{tol}}
  definition: radius within which a target estimate must lie for the task to succeed
  kind: scalar
  unit: m
- macro: \PostContactDrivenStroke
  latex: \Delta x_{\text{driven}}
  definition: displacement the arm drives into a compliant load path after the contact tripwire fires,
    travel during the response latency plus the braking stroke
  kind: scalar
  unit: m
  notes: Equals v t_resp + v^2/(2 a_arm); not the total uncompressed spring length.
- macro: \PostImpactNormalVelocity
  latex: v_n^+
  definition: normal contact velocity just after an impact, minus the restitution coefficient times the
    pre-impact normal velocity
  kind: scalar
  unit: m/s
- macro: \PostRevocationDelay
  latex: \tau_{\text{rev}}
  definition: 'delay from revoking authority to the onset of braking: the permission tick, bus transport
    and brake onset'
  kind: scalar
  unit: s
  notes: The tail of \PrebrakeDelay.
- macro: \PowerRailInductance
  latex: L_{\text{bus}}
  definition: lumped inductance of the supply loop feeding the inverter
  kind: scalar
  unit: H
  notes: Parasitic inductance of the power wiring harness feeding the inverter.
- macro: \PowerRailResistance
  latex: R_{\text{bus}}
  definition: 'lumped resistance of the supply path feeding the inverter: battery cells, harness and switch'
  kind: scalar
  unit: Ohm
- macro: \PoweredHoldCommand
  latex: \mathbf{u}_{\text{hold}}
  definition: resident fallback command that holds the machine at standstill under energized position
