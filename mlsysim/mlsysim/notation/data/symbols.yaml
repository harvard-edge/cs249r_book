    t_{\text{age}}, t_{\text{ZOH}}, T_{\text{blend}}$). Thermal time constants use
    explicitly subscripted $\tau_{\text{th}} = R_{\text{th}} C_{\text{th}}$. Operational
    thresholds use $\tau_{\text{resp}}$. The total pre-brake delay $\tau_{\text{delay}}$
    keeps its Greek letter, the control-theory convention for a transport delay, and
    its subscript keeps it distinct from torque.'
