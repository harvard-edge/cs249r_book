symbols:
- macro: \Time
  latex: T
  definition: Time
  unit: s
  notes: Execution or wall-clock time (e.g. training time, serving latency term in
    the Iron Law).
  category: The Iron Law of ML Systems
  volume: core
- macro: \DataVolume
  latex: D_{\text{vol}}
  definition: Data Volume
  unit: bytes
  notes: '**Avoids collision with $D$ (Dataset Size)**. In scaling laws, $D$ means
    training tokens. Here we need bytes moved through memory. The subscript disambiguates.'
  category: The Iron Law of ML Systems
  volume: core
- macro: \Bandwidth
  latex: \text{BW}
  definition: Bandwidth
  unit: bytes/s
  notes: '**Avoids collision with $B$ (Batch Size)**. Systems literature often uses
    $B$ for bandwidth, while ML literature often uses $B$ for batch size. The notation
    preserves the ML convention.'
  category: The Iron Law of ML Systems
  volume: core
- macro: \Operations
  latex: O
  definition: Operations
  unit: FLOPs
  notes: Total floating-point operations. Clean in equations (vs. "$\text{Ops}$").
  category: The Iron Law of ML Systems
  volume: core
- macro: \PeakRate
  latex: R_{\text{peak}}
  definition: Peak Rate
  unit: FLOP/s
  notes: '**Avoids collision with $P$ (Parameters)**. Roofline presentations often
    use $P$ for performance, while ML literature commonly uses $P$ for parameter count.
    The notation preserves the ML convention.'
  category: The Iron Law of ML Systems
  volume: core
- macro: \EfficiencyHw
  latex: \eta_{\text{hw}}
  definition: Efficiency
  unit: —
  notes: Hardware utilization $(0 \le \EfficiencyHw \le 1)$. Avoids collision with
    learning rate $(\eta)$.
  category: The Iron Law of ML Systems
  volume: core
- macro: \Latency
  latex: L_{\text{lat}}
  definition: Latency
  unit: seconds
  notes: '**Avoids collision with $\mathcal{L}$ (Loss)**. Fixed overhead time (kernel
    launch, network RTT). The subscript distinguishes from the loss function.'
  category: The Iron Law of ML Systems
  volume: core
- macro: \TotalEnergy
  latex: E_{\text{total}}
  definition: Total Energy
  unit: joules
  notes: Total energy consumed by an ML workload, decomposed into data-movement and
    compute terms.
  category: The Energy Corollary
  volume: core
- macro: \EnergyPerByteMoved
  latex: E_{\text{move}}
  definition: Energy per Byte Moved
  unit: joules/byte
  notes: Effective movement cost; total energy also depends on bytes moved and operations
    executed.
  category: The Energy Corollary
  volume: core
- macro: \EnergyPerOperationCompute
  latex: E_{\text{compute}}
  definition: Energy per Operation
  unit: joules/FLOP
  notes: Energy cost of a single arithmetic operation.
  category: The Energy Corollary
  volume: core
- macro: \BatchSize
  latex: B
  definition: Batch Size
  unit: Bandwidth ($\text{BW}$), Body frame ($\mathcal{F}_B$), bus burst size ($B_k$),
    or input matrix $\mathbf{B}$
  notes: Batch size is $B$; sustained bandwidth is $\text{BW}$ (per Iron Law); coordinate
    reference frames use calligraphic script ($\mathcal{F}_W, \mathcal{F}_B, \mathcal{F}_E$);
    bus transaction sizes use $D_{\text{trans}, k}$ or $B_k$; state-space control
    input matrix is bold capital $\mathbf{B} \in \mathbb{R}^{n \times m}$.
  category: Cross-Discipline Disambiguation and Traditional Warts
  volume: core
- macro: \Parameters
  latex: P
  definition: Parameters
  unit: Power ($P_{\text{elec}}, P_{\text{cont}}$), Riccati error covariance $\mathbf{P}(t)$,
    failure rate $p_{\text{fail}}$, or 3D point $\mathbf{p}$
  notes: Use $P$ for parameter count. Electrical/mechanical power is $P_{\text{elec}},
    P_{\text{cont}}, P_{\text{peak}}$ (in Watts); continuous Riccati/Kalman error
    covariance is bold matrix $\mathbf{P}(t)$; statistical failure probability or
    rate is lowercase italic $p$ ($p_{\text{target}}, p_{\text{emp}}, p_{\text{fail}}$);
    3D Cartesian position is bold lowercase $\mathbf{p} = [x, y, z]^\top$.
  category: Cross-Discipline Disambiguation and Traditional Warts
  volume: core
- macro: \DatasetSize
  latex: D
  definition: Dataset Size
  unit: $\text{ms}$
  notes: 'Maximum allowable age of sensor telemetry before an interlock trips: $\Delta
    t_{\text{fresh}} \le e_{\max} / v_{\max}$.'
  category: 6. Embedded Systems, Silicon Real-Time, Thermal, and Hardware Safety
  volume: core
- macro: \SequenceLength
  latex: S
  definition: Sequence Length
  unit: ''
  notes: ''
  category: General Notation
  volume: core
- macro: \HiddenDimension
  latex: d
  definition: Hidden Dimension
  unit: Permit
  notes: Cryptographically signed, bounded time-to-live operational lease granted
    to learned policies.
  category: 5. Deep Learning for Robotics (Diffusion Policies, ACT, VLAs)
  volume: core
- macro: \LayerInputWidth
  latex: d_{\text{in}}
  definition: Layer Input Width
  unit: ''
  notes: ''
  category: General Notation
  volume: core
- macro: \LayerOutputWidth
  latex: d_{\text{out}}
  definition: Layer Output Width
  unit: Integer. Input and output feature counts of a single layer.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \AttentionHeadDimension
  latex: d_{\text{head}}
  definition: Attention Head Dimension
  unit: Integer. Per-head hidden dimension in attention layers.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \NumberOfLayers
  latex: N_L
  definition: Number of Layers
  unit: Integer. Total number of layers in a network.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \NumberOfAttentionHeads
  latex: N_{\text{heads}}
  definition: Number of Attention Heads
  unit: Integer. Number of attention heads in a multi-head attention layer.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \NumberOfKeyValueHeads
  latex: H_{\text{KV}}
  definition: Number of Key-Value Heads
  unit: Integer. Number of key-value heads in grouped-query or multi-query attention.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \LayerIndex
  latex: \ell
  definition: Layer Index
  unit: Integer. Index for a layer. Use instead of bare $L$ when indexing layers,
    since $L$ collides with loss and latency. A numeric subscript marks a norm instead
    ($\ell_1$, $\ell_2$).
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \LossFunction
  latex: \mathcal{L}
  definition: Loss Function
  unit: Scalar. The objective function minimized during training.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \LearningRate
  latex: \eta
  definition: Learning Rate
  unit: ''
  notes: ''
  category: General Notation
  volume: core
- macro: \ModelParameters
  latex: \theta
  definition: Model Parameters
  unit: $\text{K/W}$
  notes: Thermal impedance between internal hot spots and heatsink/ambient casing.
  category: 6. Embedded Systems, Silicon Real-Time, Thermal, and Hardware Safety
  volume: core
- macro: \Distribution
  latex: p(x)
  definition: Distribution
  unit: Probability mass/density for a random variable. Use lowercase $p(\cdot)$ for
    generic distributions to avoid collision with $P$ (parameter count).
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \ConditionalDistribution
  latex: p(y \mid x)
  definition: Conditional Distribution
  unit: Conditional probability/density. Use this form for generic label relationships;
    reserve $P_0$ and $P_t$ for the training/current distributions of drift analysis.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \PredictedOutput
  latex: \hat{\mathbf{y}}
  definition: Predicted Output
  unit: Vector. A model's output for one example, such as class probabilities; $\mathbf{y}$
    is the label vector.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \DistillationTemperature
  latex: T_{\text{distill}}
  definition: Distillation Temperature
  unit: Dimensionless. Softmax temperature in knowledge distillation; the one use
    of the $T$ root that is not a time.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \EventProbability
  latex: \Pr(E)
  definition: Event Probability
  unit: Probability of an event $E$. Use for event statements such as $\Pr(\text{batch}=0)$;
    use $p(x)$ and $p(y \mid x)$ for distributions.
  notes: ''
  category: Deep Learning Notation
  volume: core
- macro: \ArithmeticIntensity
  latex: I
  definition: Arithmetic Intensity
  unit: FLOP/byte
  notes: Workload FLOPs per byte moved. The Roofline Model uses $I$ as the independent
    variable.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \RooflineRidgePoint
  latex: I_{\text{ridge}}
  definition: Roofline Ridge Point
  unit: FLOP/byte
  notes: $\RooflineRidgePoint = \PeakRate/\Bandwidth$. Prefer this explicit form over
    starred shorthand so the meaning remains clear in prose.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \AttainableComputeRate
  latex: R_{\text{attain}}
  definition: Attainable Compute Rate
  unit: FLOP/s
  notes: 'Roofline bound: $\AttainableComputeRate \leq \min(\PeakRate, I \times \Bandwidth)$.
    Uses $R$, not $T$, because this quantity is a rate.'
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \ModelFlopsUtilization
  latex: \text{MFU}
  definition: Model FLOPs Utilization
  unit: Dimensionless
  notes: Useful model FLOP/s divided by available peak FLOP/s. Text acronym avoids
    overloading $\eta$.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \CompressionRatio
  latex: r_{\text{comp}}
  definition: Compression Ratio
  unit: Dimensionless
  notes: Uncompressed size divided by compressed size. A compressed payload has $1/\CompressionRatio$
    of the uncompressed size; the subscript avoids bare $C$ collisions.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \RequestConcurrency
  latex: Q_{\text{req}}
  definition: Request Concurrency
  unit: requests
  notes: Average in-flight requests in a stable serving system ($\RequestConcurrency
    = \ArrivalRate \cdot \RequestTimeInSystemLat$ via Little's Law). Avoids overloading
    $N$, which counts devices, elements, or samples elsewhere.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \ArrivalRate
  latex: \lambda_{\text{arr}}
  definition: Arrival Rate
  unit: requests/s
  notes: Request arrival rate. The subscript keeps bare $\lambda$ free for fitted
    sensitivities.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \IronLawMemoryTime
  latex: T_{\text{memory}}
  definition: Iron-Law Term Times
  unit: ''
  notes: ''
  category: General Notation
  volume: core
- macro: \IronLawComputeTime
  latex: T_{\text{compute}}
  definition: Iron-Law Term Times
  unit: seconds
  notes: The memory and compute terms of the iron law, $\DataVolume/\Bandwidth$ and
    $O/(\PeakRate \cdot \EfficiencyHw)$.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \AcceleratorCount
  latex: N_{\text{GPU}}
  definition: Accelerator Count
  unit: Integer
  notes: Number of accelerators in one job.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \RequestTimeInSystem
  latex: T_{\text{lat}}
  definition: Request Time in System
  unit: seconds
  notes: End-to-end queueing/serving latency for Little's Law. Distinct from $\Latency$,
    the fixed-latency term in the iron law.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \EndToEndRequestLatency
  latex: L_{\text{lat, total}}
  definition: End-to-End Request Latency
  unit: seconds
  notes: Request-path latency budget, $L_{\text{lat,network}} + L_{\text{lat,pre}}
    + L_{\text{lat,infer}} + L_{\text{lat,post}} + L_{\text{lat,queue}}$. $\RequestTimeInSystemLat$
    covers only the time inside the serving system.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \BatchServiceTime
  latex: T_{\text{svc}}(B)
  definition: Batch Service Time
  unit: seconds
  notes: Time to serve a batch of size $B$.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \EffectiveServiceRate
  latex: \mu_{\text{eff}}(B)
  definition: Effective Service Rate
  unit: requests/s
  notes: Batched service rate, typically $\EffectiveServiceRate = B/\BatchServiceTimeSvc$.
    The unbatched service rate is $\mu = \mu_{\text{eff}}(1)$.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \ServingUtilization
  latex: \rho_{\text{serv}}
  definition: Serving Utilization
  unit: Dimensionless
  notes: Queue/server utilization. The subscript keeps bare $\rho$ free for other
    ratio models.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \TotalMemoryFootprint
  latex: M_{\text{total}}
  definition: Total Memory Footprint
  unit: bytes
  notes: Sum of explicit memory components; avoids bare $M$ ambiguity.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \WeightMemory
  latex: M_{\text{weights}}
  definition: Weight Memory
  unit: bytes
  notes: Total memory required to store policy weights ($P \times \text{bytes-per-parameter}$).
  category: Governing Relationships
  volume: core
- macro: \GradientMemory
  latex: M_{\text{gradients}}
  definition: Gradient Memory
  unit: bytes
  notes: Memory occupied by stored gradients.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \OptimizerstateMemory
  latex: M_{\text{optimizer}}
  definition: Optimizer-State Memory
  unit: bytes
  notes: Momentum, variance, master weights, and related optimizer buffers.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \ActivationMemory
  latex: M_{\text{activations}}
  definition: Activation Memory
  unit: bytes
  notes: Retained activations for the backward pass or serving intermediates.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \ElementStorageSize
  latex: s_{\text{elem}}
  definition: Element Storage Size
  unit: bytes/element
  notes: Bytes per stored tensor element.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \SampleStorageSize
  latex: s_{\text{sample}}
  definition: Sample Storage Size
  unit: bytes/sample
  notes: Bytes per stored training or serving sample.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \LossscaleFactor
  latex: s_{\text{loss}}
  definition: Loss-Scale Factor
  unit: Dimensionless
  notes: Multiplier applied to the loss in reduced-precision training so small gradients
    stay representable.
  category: Performance, Serving, and Memory Notation
  volume: core
- macro: \Loss
  latex: L
  definition: Loss
  unit: Latency
  notes: '**Loss** $(\mathcal{L})$. Use $\Latency$ for latency.'
  category: 'Quick Reference: Resolving Collisions'
  volume: core
- macro: \AccuracyAtTime
  latex: \text{Accuracy}(t)
  definition: Accuracy at Time $t$
  unit: Scalar
  notes: Model accuracy after the model has been deployed for time $t$.
  category: The Degradation Equation
  volume: vol1
- macro: \InitialAccuracy
  latex: \text{Accuracy}_0
  definition: Initial Accuracy
  unit: Scalar
  notes: Model accuracy at deployment time.
  category: The Degradation Equation
  volume: vol1
- macro: \FittedSensitivity
  latex: \lambda
  definition: Fitted Sensitivity
  unit: Scalar
  notes: Local coefficient estimated from outcomes over a stated range; not a universal
    constant. *(Not wavelength.)*
  category: The Degradation Equation
  volume: vol1
- macro: \CurrentDistribution
  latex: P_t
  definition: Current Distribution
  unit: Distribution
  notes: The data distribution at time $t$. *(Not parameters—use $P$ for parameter
    count.)*
  category: The Degradation Equation
  volume: vol1
- macro: \TrainingDistribution
  latex: P_0
  definition: Training Distribution
  unit: Distribution
  notes: The data distribution at training time.
  category: The Degradation Equation
  volume: vol1
- macro: \StatisticalDivergence
  latex: \mathcal{D}(P_t \| P_0)
  definition: Statistical Divergence
  unit: Scalar $\ge 0$
  notes: 'Measures how far $P_t$ has drifted from $P_0$. Common choices: KL divergence,
    total variation, Wasserstein. *(Calligraphic to avoid collision with $D$ = dataset
    size.)*'
  category: The Degradation Equation
  volume: vol1
- macro: \ResponseThreshold
  latex: \tau
  definition: Response Threshold
  unit: Bare $\tau$ is a trajectory. Sampling temperature is named in words or written
    $\tau_{\text{temp}}$.
  notes: ''
  category: Agentic Systems Notation
  volume: vol1
- macro: \NumberOfDevices
  latex: N
  definition: Number of Devices
  unit: Count
  notes: Attempts whose results passed the acceptance checks.
  category: Agentic Systems Notation
  volume: vol2
- macro: \AcceleratorsPerNode
  latex: G_{\text{node}}
  definition: Accelerators per Node, Node Count
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \AcceleratorsPerNodeNodes
  latex: N_{\text{nodes}}
  definition: Accelerators per Node, Node Count
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \DistributedStepTime
  latex: T_{\text{step}}(N)
  definition: Distributed Step Time
  unit: seconds
  notes: Wall-clock time for one training step at scale $N$.
  category: Distributed Systems Notation
  volume: vol2
- macro: \SingleDeviceComputeTime
  latex: T_{\text{compute}}
  definition: Single-Device Compute Time
  unit: seconds
  notes: Forward + backward pass on one device.
  category: Distributed Systems Notation
  volume: vol2
- macro: \CommunicationTime
  latex: T_{\text{comm}}(N)
  definition: Communication Time
  unit: seconds
  notes: Wall-clock time to transmit a message of size $n$ across one link.
  category: Distributed Systems Notation
  volume: vol2
- macro: \OverlappedTime
  latex: T_{\text{overlap}}
  definition: Overlapped Time
  unit: seconds
  notes: Communication hidden behind computation. Reduces effective overhead.
  category: Distributed Systems Notation
  volume: vol2
- macro: \SynchronizationTime
  latex: T_{\text{sync}}(N)
  definition: Synchronization Time
  unit: seconds
  notes: Total nonoverlapped synchronization or coordination cost per step at scale
    $N$.
  category: Distributed Systems Notation
  volume: vol2
- macro: \CommunicationcomputationRatio
  latex: \rho
  definition: Communication-Computation Ratio
  unit: Dimensionless
  notes: $\rho = T_{\text{comm}}(N)/(T_{\text{compute}}/N)$. Values near or above
    1 indicate communication-bound scaling.
  category: Distributed Systems Notation
  volume: vol2
- macro: \CommunicationIntensity
  latex: \text{CI}
  definition: Communication Intensity
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \ScaledResource
  latex: X
  definition: Scaled Resource
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \ScalingExponent
  latex: \alpha_{\text{scale}}
  definition: Scaling Exponent
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \ScaleCoefficient
  latex: A_{\mathcal{L}}
  definition: Scale Coefficient
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \IrreducibleLoss
  latex: C_{\mathcal{L}}
  definition: Irreducible Loss
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \TrainingCompute
  latex: O_{\text{train}}
  definition: Training Compute
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \PointToPointTransferTime
  latex: T(n)
  definition: Point-to-Point Transfer Time
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \PermessageLatency
  latex: \alpha
  definition: Per-Message Latency
  unit: CBF decay ($\gamma_{\text{cbf}}$), significance ($\alpha_{\text{sig}}$), angular
    acceleration ($\boldsymbol{\alpha}$), copper tempco ($\alpha_{\text{Cu}}$), or
    noise schedule ($\bar{\alpha}_k$)
  notes: Authority transfer uses scalar function $\alpha(t) \in [0, 1]$; barrier linear
    decay uses $\gamma_{\text{cbf}} > 0$; statistical confidence significance uses
    $\alpha_{\text{sig}} = 1 - \text{CL}$; angular acceleration is bold vector $\boldsymbol{\alpha}
    \in \mathbb{R}^3$ ($\text{rad/s}^2$); copper resistance tempco is $\alpha_{\text{Cu}}$;
    diffusion noise schedules use indexed $\bar{\alpha}_k$.
  category: Cross-Discipline Disambiguation and Traditional Warts
  volume: vol2
- macro: \LinkBandwidth
  latex: \beta
  definition: Link Bandwidth
  unit: bytes/s
  notes: Effective throughput per link.
  category: Distributed Systems Notation
  volume: vol2
- macro: \PointToPointMessageSize
  latex: n
  definition: Point-to-Point Message Size
  unit: $\text{m}$
  notes: Translation vector $[x, y, z]^\top$ expressing relative point coordinates.
  category: 3. Geometry, Spatial Transformations, and Perception Projections
  volume: vol2
- macro: \CrossoverPoint
  latex: n^*
  definition: Crossover Point
  unit: bytes
  notes: '$n^* = \alpha \cdot \beta$. Below $n^*$: latency-bound. Above: bandwidth-bound.'
  category: Distributed Systems Notation
  volume: vol2
- macro: \CollectivePayloadSize
  latex: M
  definition: Collective Payload Size
  unit: Bytes
  notes: Attention state a trajectory holds in accelerator memory, $M_{\text{KV}}
    = S \cdot m_{\text{token}}$.
  category: Agentic Systems Notation
  volume: vol2
- macro: \RingAllReduceCompletionTime
  latex: T_{\text{ring}}
  definition: Collective Completion Time
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \TreeAllReduceCompletionTime
  latex: T_{\text{tree}}
  definition: Collective Completion Time
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \RingtreeCrossoverPayload
  latex: M_{\text{crossover}}
  definition: Ring-Tree Crossover Payload
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \LoggpLongmessageTime
  latex: T_{\text{long}}(n)
  definition: LogGP Long-Message Time
  unit: seconds
  notes: Transfer time for an $n$-byte long message. Reuses $n$ from the $\alpha$-$\beta$
    model.
  category: Distributed Systems Notation
  volume: vol2
- macro: \LogploggpNetworkLatency
  latex: L_{\text{LogGP}}
  definition: LogP/LogGP Network Latency
  unit: ''
  notes: ''
  category: General Notation
  volume: vol2
- macro: \SenderOverhead
  latex: o_{\text{send}}
  definition: Sender Overhead
  unit: seconds
  notes: Processor/NIC overhead to initiate a message.
  category: Distributed Systems Notation
  volume: vol2
- macro: \ReceiverOverheadRecv
  latex: o_{\text{recv}}
  definition: Receiver Overhead
  unit: seconds
  notes: Processor/NIC overhead to complete a message.
  category: Distributed Systems Notation
  volume: vol2
- macro: \MessageInjectionGap
  latex: g
  definition: Message Injection Gap
  unit: $\text{failures/hour}$
  notes: Statutory regulatory safety requirement (e.g., $10^{-9}\text{ failures/h}$
    for SIL 4 / DAL A).
  category: Governing Relationships
  volume: vol2
- macro: \LongmessageGapPerByte
  latex: G
  definition: Long-Message Gap per Byte
  unit: $\mathcal{G}$ is trajectory goodput. The goal is $g$ in the loop and $G$ in
    the task contract.
  notes: ''
  category: Agentic Systems Notation
  volume: vol2
- macro: \ScalingEfficiency
  latex: \eta_{\text{scaling}}
  definition: Scaling Efficiency
  unit: Dimensionless
  notes: Ratio of measured speedup to ideal linear speedup. $1.0$ is the ideal linear
    baseline, not a hard upper bound.
  category: Distributed Systems Notation
  volume: vol2
- macro: \SingledeviceTimeOne
  latex: T_1
  definition: Single-Device Time
  unit: seconds
  notes: Baseline wall-clock time for the same productive work on one device.
  category: Distributed Systems Notation
  volume: vol2
- macro: \NdeviceTime
  latex: T_N
  definition: N-Device Time
  unit: seconds
  notes: Wall-clock time for the same productive work on $N$ devices; excludes operational
    downtime counted by $\eta_{\text{goodput}}$.
  category: Distributed Systems Notation
  volume: vol2
- macro: \ReliabilityFunctionSystem
  latex: R_{\text{system}}(t)
  definition: Reliability Function
  unit: Probability
  notes: Probability of no failure across the whole system before time $t$.
  category: Distributed Systems Notation
  volume: vol2
- macro: \PercomponentFailureRate
  latex: \lambda
  definition: Per-Component Failure Rate
  unit: failures/hour
  notes: 'Per-component failure rate; the system-wide rate is $N\lambda$ under independent,
    identical components. The industry-standard reporting unit is FIT (failures per
    $10^9$ device-hours): $\lambda_{\text{hour}} = \text{FIT} \times 10^{-9}$. *(Not
    sensitivity—context disambiguates.)*'
  category: Distributed Systems Notation
  volume: vol2
- macro: \MeanTimeBetweenFailures
  latex: \text{MTBF}
  definition: Mean Time Between Failures
  unit: hours
  notes: Average time between consecutive failures. $\text{MTBF}_{\text{system}} =
    \text{MTBF}_{\text{component}} / N$.
  category: Distributed Systems Notation
  volume: vol2
- macro: \MeanTimeToFailure
