# What math may contain that is not a registered symbol.
# Read by binder's strict notation check; explained in README.md
# ("What math may contain besides macros"). Changing this list changes the
# book's notation contract: discuss it before editing.

letters_by_role:
  # summation, array and time-step indices: only inside a subscript
  # (x_i, \sum_{i=1}, \MechanicalPlantState_{t}, \ActionChunk_{k+1})
  index: [i, j, k, n, t]
  # the differential: only immediately before a variable (dx, d\Time)
  differential: [d]
  # Euler's number: only as a base (e^{x})
  euler: [e]
  # the transpose: only as a superscript (A^T, A^{T})
  transpose: [T]

# LaTeX commands that are constants, not symbols
commands: [pi, infty, ell]

# Number sets, expectation, probability, indicator, big-O
forms:
  - \mathbb{R}
  - \mathbb{N}
  - \mathbb{Z}
  - \mathbb{Q}
  - \mathbb{C}
  - \mathbb{E}
  - \mathbb{P}
  - \mathbb{1}
  - \mathcal{O}
