# Notation registry: agentic
# Agentic systems: trajectories, task contracts, tools, budgets, evaluation, cost per accepted task.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AcceptanceFraction
  latex: \alpha
  definition: share of a settled cohort of initiated tasks that ends accepted
  kind: scalar
  unit: dimensionless
  notes: $\AcceptanceFraction = \AcceptedTasks/\InitiatedTasks$. It counts tasks, whereas $\AcceptanceProbability$
    counts attempts; the two coincide only when every task gets exactly one attempt. Bare $\alpha$ always
    means this fraction; the significance level is $\StatisticalSignificanceLevel$.
- macro: \AcceptanceProbability
  latex: p_{\text{acc}}
  definition: probability that one attempt at a task is accepted, across a workload
  kind: scalar
  unit: dimensionless
  notes: Workload-level, per attempt. With independent retries, $\CostPerAcceptedTask = \mathbb{E}[\AttemptCost]/\AcceptanceProbability$.
    Distinct from the per-task $\AttemptPassProbability$ and the cohort fraction $\AcceptanceFraction$.
- macro: \AcceptedInfluences
  latex: \text{Inf}(o)
  definition: set of sources a task policy accepts as influences on one operation
  kind: function
  notes: Written with its operation, $\text{Inf}(o)$. The evidence check is $\IntegrityProvenance \subseteq
    \AcceptedInfluences$. Upright, to stay distinct from the environment $\mathcal{E}$.
- macro: \AcceptedTasks
  latex: N_{\text{acc}}
  definition: number of distinct tasks in a cohort accepted under the declared contract
  kind: count
  notes: 'Retries never inflate it: a task accepted after three attempts counts once. Numerator of $\AcceptanceFraction$
    and denominator of $\CostPerAcceptedTask$.'
- macro: \ActionObservation
  latex: o_t
  definition: result an action returned, such as an exit code, captured output, a response body, or a
    status
  kind: record
  notes: A typed record, not a number.
  aliases:
  - \Observation
- macro: \ActionProposal
  latex: a_t
  definition: action the model proposes on one turn, as text or a tool call
  kind: record
  notes: Nothing happens until the runtime admits it. A text or tool-call record, not a number.
- macro: \AdmittedAction
  latex: a_{\text{perm}}
  definition: action the runtime permits after checking a proposal
  kind: record
  notes: Element of $\mathcal{A}_{\text{perm}}$. A tool call, not a number.
  aliases:
  - \ProposedPerm
- macro: \Advantage
  latex: A
  definition: estimate of how much better an action does than the policy's average from the same state
  kind: scalar
  unit: dimensionless
  notes: Always written with a hat, $\hat{\Advantage}_t$ or the group-relative $\hat{\Advantage}_i$. Authority
    is written only with a level, $A_0$ to $A_3$; action sets are $\mathcal{A}_{\text{prop}}$ and $\PermittedActions$.
- macro: \AgenticSystem
  latex: \mathcal{S}
  definition: policy together with its runtime harness, environment, memory, and verifiers
  kind: set
  notes: A tuple, $\mathcal{S} = \langle \pi_\theta, \mathcal{H}, \mathcal{E}, \mathcal{M}, \mathcal{V}
    \rangle$; the components other than the policy are named in words.
- macro: \AllRunsPassProbability
  latex: \text{pass}^k
  definition: probability that all k runs of a task pass, averaged over tasks
  kind: scalar
  unit: dimensionless
  notes: Under conditional independence this is $\mathbb{E}_i[p_i^k]$, not $(\mathbb{E}_i[p_i])^k$.
  aliases:
  - \PassToTheK
- macro: \AttemptCost
  latex: C_{\text{attempt}}
  definition: full monetary cost of one attempt at a task
  kind: scalar
  unit: USD
  notes: Includes input and output tokens, tool fees, sandbox time, verification, and human review.
- macro: \AttemptPassProbability
  latex: p
  definition: probability that one independent attempt on a given task passes its check
  kind: scalar
  unit: dimensionless
  notes: 'A per-task quantity: pass@$k = 1-(1-\AttemptPassProbability)^k$, and sequential retry costs
    $c/\AttemptPassProbability$ per acceptance. The workload-level rate is $\AcceptanceProbability$ and
    the cohort fraction is $\AcceptanceFraction$. Same letter as $\ValidCandidateRate$ but a different
    event.'
- macro: \AuthorityExposureLevel
  latex: A_0\text{ to }A_3
  definition: authority exposure level, what a task may do through its tools, from read access to irreversible
    external action
  kind: scalar
  unit: dimensionless
  notes: Levels $A_0$ (read access), $A_1$ (mutation confined to a discardable sandbox), $A_2$ (retry-safe
    or compensable external action), $A_3$ (irreversible external action). An ordinal label, not a number.
  aliases:
  - \AuthorityLevels
- macro: \AvailableObservations
  latex: \mathcal{O}_{\text{avail}}
  definition: specification of what the agent may see and how much, including truncation and redaction
    rules
  kind: set
  notes: Fourth element of the task contract $\TaskContract$.
- macro: \BasePromptLength
  latex: S_{\text{base}}
  definition: number of prompt tokens in the first call of a trajectory, before any turn appends to it
  kind: count
  notes: With a fixed per-turn append and no compaction, $\PromptTokensSent = \Horizon\,\BasePromptLength
    + \TurnAppendLength\,\Horizon(\Horizon-1)/2$.
- macro: \BreakEvenTaskCount
  latex: N^*
  definition: number of tasks an adaptation must serve before its per-task saving recovers its one-time
    cost
  kind: count
  notes: $\BreakEvenTaskCount = C_{\text{invest}}/\Delta \TaskCost$ for $\Delta \TaskCost > 0$; payback
    time is $\BreakEvenTaskCount$ divided by task volume per unit time.
  aliases:
  - \BreakEvenTaskVolume
- macro: \CachedInputTokenPrice
  latex: c_{\text{cache}}
  definition: price of one cached input token
  kind: scalar
  unit: USD/token
  notes: Lowercase $c$ is a unit price that an uppercase $C$ totals.
  aliases:
  - \PertokenPricesCache
- macro: \CallLatency
  latex: T_{\text{call}}
  definition: elapsed time of one model call, from request preparation to normalized response
  kind: scalar
  unit: s
  notes: Sum of nonoverlapping intervals, $\CallLatency = T_{\text{prep}} + T_{\text{queue}} + T_{\text{prefill}}
    + \DecodeInterval + T_{\text{post}}$; the terms through prefill make the time to first token.
- macro: \CandidatePoolSize
  latex: N
  definition: number of candidates generated for one decision in best-of-N sampling, or the breadth of
    concurrent candidate streams
  kind: count
  notes: Sample counts in pass@$k$ use lowercase $k$. A search tree visit count $N(s,a)$ is local to its
    derivation.
- macro: \CapabilityGrant
  latex: \Gamma
  definition: capability grant, the rights, objects, condition, and expiry that together describe one
    delegated authority
  kind: record
  notes: A tuple, $\CapabilityGrant = (\mathcal{R}_\Gamma, \mathcal{O}_\Gamma, \phi_\Gamma, \GrantExpiryTime)$.
    Derived grants carry a subscript, as in $\CapabilityGrant_{\text{child}} \sqsubseteq \CapabilityGrant_{\text{parent}}$.
    Not $C$, which is always a cost.
- macro: \ClosureOperator
  latex: \mathcal{I}
  definition: runtime's check that maps each proposed action and the current system state to a permitted
    action or a rejection
  kind: function
  notes: '$\mathcal{I}: \mathcal{A}_{\text{prop}} \times \mathcal{X}_{\text{sys}} \to \mathcal{A}_{\text{perm}}
    \cup \{\ProposalRejection\}$.'
- macro: \CoherencyCoefficient
  latex: \kappa_{\text{coh}}
  definition: universal scalability law's cost of pairwise reconciliation between workers
  kind: scalar
  unit: dimensionless
  notes: Multiplies $\WorkerCount(\WorkerCount-1)$ in $\text{Speedup}(\WorkerCount) = \WorkerCount/\big(1
    + \ContentionCoefficient(\WorkerCount-1) + \CoherencyCoefficient\,\WorkerCount(\WorkerCount-1)\big)$.
  aliases:
  - \ContentionAndCoherencyCoefficientsTwo
  - \CoherencyContentionCoefficient
- macro: \CompletionCriteria
  latex: \mathcal{K}_{\text{comp}}
  definition: set of checks that decide when a task is done, at a stated closure evidence level
  kind: set
  notes: Fifth element of the task contract $\TaskContract$. The model's claim of completion is never
    one of them.
- macro: \CompletionDeadline
  latex: T_{\text{deadline}}
  definition: time by which a call, cycle, or task must complete
  kind: scalar
  unit: s
  notes: Inside the trajectory budget $\TrajectoryBudget$ the deadline is written $T_{\max}$. In real-time
    scheduling, the relative deadline $D_i$ of task $i$ is this quantity for that task.
  aliases:
  - \TaskDeadline
  - \Deadline
- macro: \ConcurrentTrajectories
  latex: N_{\text{traj}}
  definition: mean number of admitted trajectories present at once
  kind: count
  notes: Little's law for trajectories, $\ConcurrentTrajectories = \TrajectoryAdmissionRate\,\mathbb{E}[\TrajectoryDuration]$.
- macro: \ConfidentialityLabel
  latex: \kappa(x)
  definition: set of recipients permitted to receive a record
  kind: function
  notes: Written with its record, $\kappa(x)$. The release check is $r \in \ConfidentialityLabel$; combining
    records intersects their labels. Not $\InterAnnotatorAgreement$.
  aliases:
  - \Confidentiality
- macro: \ContentionCoefficient
  latex: \sigma_{\text{cont}}
  definition: universal scalability law's share of work that serializes across workers
  kind: scalar
  unit: dimensionless
  notes: Multiplies $(\WorkerCount-1)$ in the universal scalability law; the pairwise term is $\CoherencyCoefficient$.
  aliases:
  - \ContentionAndCoherencyCoefficients
- macro: \ContextWindow
  latex: S_{\max}
  definition: hard per-call limit on prompt and output tokens together
  kind: count
  notes: Admission requires $\SequenceLength \le \ContextWindow - \OutputLimit$.
- macro: \ContinuationCount
  latex: K
  definition: number of independent continuations sampled from one fork condition in reinforcement learning
  kind: count
  notes: Elsewhere $K$ is output length $\OutputLength$.
- macro: \CoordinationOverhead
  latex: h
  definition: added elapsed time of splitting work across workers, as a fraction of serial time
  kind: function
  unit: dimensionless
  notes: Always written with its argument, $\CoordinationOverhead(\WorkerCount)$, in $\text{Speedup} =
    1/[(1-\ParallelFraction) + \ParallelFraction/\WorkerCount + \CoordinationOverhead(\WorkerCount)]$.
    Distinct from the interaction history $h_k$.
- macro: \CostCeiling
  latex: C_{\max}
  definition: dollar ceiling on a trajectory that the runtime enforces before dispatching the next call
  kind: scalar
  unit: USD
  notes: Last element of the trajectory budget $\TrajectoryBudget$.
- macro: \CostPerAcceptedTask
  latex: C_{\text{eff}}
  definition: total spend on all attempts in a cohort divided by the number of accepted tasks
  kind: scalar
  unit: USD/task
  notes: $\CostPerAcceptedTask = \sum_{i=1}^{\InitiatedTasks} \TaskCost_i/\AcceptedTasks$; failed attempts
    are paid for in full. Undefined when no task is accepted. With independent retries it equals $\mathbb{E}[\AttemptCost]/\AcceptanceProbability$.
  aliases:
  - \CostPerAcceptedTaskEff
- macro: \DecodeInterval
  latex: T_{\text{decode}}
  definition: time a call spends generating its whole output
  kind: scalar
  unit: s
  notes: $\DecodeInterval(\OutputLength) \approx \OutputLength\,\PerTokenDecodeTime$ at a stable per-token
    step time; one term of $\CallLatency$.
- macro: \DelegatedTaskGoal
  latex: g
  definition: delegated task and its completion rule, fixed for the trajectory
  kind: record
  notes: Written $g$ in the agent loop; the task contract writes the same goal $\TaskContractGoal$. Text,
    not a number.
  aliases:
  - \Goal
- macro: \DispatchedTrajectorySet
  latex: \mathcal{T}_{\text{all}}
  definition: set of every trajectory dispatched
  kind: set
  notes: Calligraphic $\mathcal{T}$ with a subscript always names a set of trajectories; the verified
    subset is $\VerifiedTrajectorySet$.
  aliases:
  - \TrajectorySetsAll
- macro: \DuplicateEffectProbability
  latex: p_{\text{dup}}
  definition: probability that one blind retry of a non-idempotent call applies its effect twice
  kind: scalar
  unit: dimensionless
  notes: Without deduplication, $(1-\RequestLossProbability)\,\ReplyLossProbability\,(1-\RequestLossProbability)$.
  aliases:
  - \DuplicateeffectProbability
- macro: \EnvironmentState
  latex: s_t
  definition: full environment state of the decision process at a turn, including what the model never
    saw
  kind: record
  notes: Same glyph as the context state $\StateAtTurn$, which is only what the model saw. A record, not
    a number.
- macro: \EstimatedHistoryAdvantage
  latex: \hat{A}(h_k, a_k)
  definition: estimate of how much an action taken after a given interaction history beats the policy
    value at that history
  kind: scalar
  unit: dimensionless
  notes: Estimates $Q^\pi(h_k,a_k)-V^\pi(h_k)$. The group-relative per-rollout estimate is $\hat{\Advantage}_i$.
  aliases:
  - \EstimatedAdvantageK
- macro: \EstimatedRemainingReturn
  latex: \hat{V}(h_k)
  definition: estimated expected remaining return under a continuation policy, given the interaction history
    at a turn
  kind: scalar
  unit: dimensionless
  notes: It is a success probability only for a binary terminal reward without discounting.
  aliases:
  - \EstimatedValueK
- macro: \ExpectedActionReturn
  latex: Q_t^{\pi}(s_t, a_t)
  definition: expected return, or expected cost in the imitation bounds, from a step after taking an action
    in a state and then following the policy
  kind: scalar
  unit: dimensionless
  notes: Reward units are dimensionless in this book. The superscript names the policy that continues,
    $Q_t^{\pi}$.
  aliases:
  - \ActionValueOrCosttogo
- macro: \ExpectedCheckingTime
  latex: T_{\text{check}}
  definition: expected verifier slot time spent per attempted record under a short-circuit check cascade
  kind: scalar
  unit: s
  notes: $\ExpectedCheckingTime = \sum_i T_i \prod_{j<i} p_j$. A time, distinct from the attempt cost
    $\AttemptCost$ in dollars.
- macro: \ExpectedIrreversibleLoss
  latex: L_A
  definition: expected consequence of the bad actions in an execution plan that cannot be recovered
  kind: scalar
  unit: varies
  notes: '$\sum_a \Pr(\text{bad}\ a)\cdot \text{consequence}(a)\cdot(1-\rho_a)$, with $\rho_a$ the recoverable
    fraction of action $a$. The subscript $A$ is part of the glyph, not an authority level. Unit: consequence
    units.'
  aliases:
  - \ExpectedIrreversibleLossA
- macro: \ExternalWait
  latex: T_{\text{wait}}
  definition: time spent waiting on a remote service or on a person's response
  kind: scalar
  unit: s
  notes: One interval of a turn, beside $\ModelTime$ and $\ToolTime$. With approval requests at $\ArrivalRate$,
    $\ArrivalRate\,\ExternalWait$ trajectories are held at once.
- macro: \GrantExpiryTime
  latex: t_{\text{exp}}
  definition: time after which a capability grant admits nothing
  kind: scalar
  unit: s
  notes: A timestamp. An access at time $t$ is admissible only if $t < \GrantExpiryTime$; a derived grant
    expires no later than its parent.
- macro: \GroupSize
  latex: G
  definition: number of rollouts sampled per task for group-relative scoring
  kind: count
  notes: Elsewhere $G$ is the task-contract goal $\TaskContractGoal$.
- macro: \IdempotencyKey
  latex: k_{\text{idem}}
  definition: identifier for one intended operation, kept across retries so its effect applies once
  kind: record
  notes: Derived from the trajectory, turn, call, tool, and canonical arguments. A string, not a number.
- macro: \InitiatedTasks
  latex: N
  definition: number of tasks in a settled cohort, whatever their outcome
  kind: count
  notes: Denominator of $\AcceptanceFraction = \AcceptedTasks/\InitiatedTasks$ and the range of the cost
    sum in $\CostPerAcceptedTask$.
- macro: \InputTokenPrice
  latex: c_{\text{in}}
  definition: price of one uncached input token
  kind: scalar
  unit: USD/token
  notes: Lowercase $c$ is a unit price that an uppercase $C$ totals.
  aliases:
  - \PertokenPricesIn
- macro: \IntegrityProvenance
  latex: \iota(x)
  definition: set of sources whose content may have influenced a record
  kind: function
  notes: Written with its record, $\iota(x)$. The evidence check is $\IntegrityProvenance \subseteq \AcceptedInfluences$;
    endorsement never rewrites it.
- macro: \InterAnnotatorAgreement
  latex: \kappa
  definition: Cohen's kappa, agreement between two annotators corrected for the agreement expected by
    chance
  kind: scalar
  unit: dimensionless
  notes: $(p_o - p_e)/(1 - p_e)$ for observed agreement $p_o$ and chance agreement $p_e$. Not the confidentiality
    label $\ConfidentialityLabel$ or the coherency coefficient $\CoherencyCoefficient$, which share the
    letter.
  aliases:
  - \CohensKappa
- macro: \KvBlockSize
  latex: S_{\text{blk}}
  definition: number of token positions in one fixed block of a paged KV cache
  kind: count
  notes: Tail waste per sequence is between $0$ and $\KvBlockSize-1$ tokens.
  aliases:
  - \KvBlockSizeBlk
- macro: \KvBytesPerToken
  latex: m_{\text{token}}
  definition: bytes of KV cache one token occupies across all layers
  kind: scalar
  unit: bytes/token
  notes: $2 \cdot N_L \cdot H_{\text{KV}} \cdot d_{\text{head}} \cdot s_{\text{elem}}$, in the shared
    symbols for layers, KV heads, head dimension, and element size.
- macro: \LeaseHoldTime
  latex: T_{\text{hold}}
  definition: mean time a trajectory holds a sandbox or other leased resource
  kind: scalar
  unit: s
  notes: Residence term of Little's law, $N_{\text{active}} = \ArrivalRate\,\LeaseHoldTime$.
- macro: \MaskedFinetuningLoss
  latex: \mathcal{L}_{\text{SFT}}
  definition: mean cross-entropy over the token positions the loss mask selects, for one example
  kind: function
  unit: nats
  notes: $-\frac{1}{N_{\text{active}}}\sum_t \TokenLossMask \log \Policy(x_t \mid x_{<t})$ with $N_{\text{active}}
    = \sum_t \TokenLossMask > 0$.
  aliases:
  - \MaskedFinetuningLossSft
- macro: \MemoryEntryBirthGeneration
  latex: g_{\text{birth}}(c)
  definition: source generation from which a derived memory entry is supported
  kind: index
  notes: An entry $c$ is valid for a query at generation $\QueryWorkspaceGeneration$ when $\MemoryEntryBirthGeneration
    \le \QueryWorkspaceGeneration < \MemoryEntryDeathGeneration$.
  aliases:
  - \ValidityIntervalOfAMemoryEntryBirth
- macro: \MemoryEntryDeathGeneration
  latex: g_{\text{death}}(c)
  definition: source generation at which a later edit stops supporting a derived memory entry
  kind: index
  notes: Open until a subsequent edit to the source scope closes the interval.
  aliases:
  - \ValidityIntervalOfAMemoryEntryDeath
- macro: \MemoryHoldDuringWait
  latex: O_{\text{mem}}
  definition: accelerator memory a paused trajectory withholds, multiplied by how long it waits
  kind: scalar
  unit: bytes*s
  notes: $\KvcacheMemory \cdot \ExternalWait$ when the payload is fully resident and unshared.
  aliases:
  - \MemoryHeldDuringAWait
- macro: \ModelTime
  latex: T_{\text{model}}
  definition: time a turn spends in model calls
  kind: scalar
  unit: s
  notes: Time spent in model calls during a turn.
- macro: \OptimalCheckpointInterval
  latex: T^\ast_{\text{ckpt}}
  definition: checkpoint interval that minimizes expected overhead from checkpoint writes and lost work
  kind: scalar
  unit: s
  notes: Young's approximation, $\sqrt{2\,\CheckpointWriteTime\,\SystemMtbf}$, with the system (not per-component)
    MTBF.
  aliases:
  - \OptimalCheckpointIntervalCkpt
- macro: \OutputLength
  latex: K
  definition: number of tokens a call generates
  kind: count
  notes: Lowercase $k$ is reserved for sample counts, as in pass@$k$.
- macro: \OutputLimit
  latex: K_{\max}
  definition: maximum number of tokens the runtime lets a call generate
  kind: count
  notes: Reserved output headroom inside $\ContextWindow$.
- macro: \OutputTokenPrice
  latex: c_{\text{out}}
  definition: price of one generated output token
  kind: scalar
  unit: USD/token
  notes: Lowercase $c$ is a unit price that an uppercase $C$ totals.
  aliases:
  - \PertokenPricesOut
- macro: \ParallelFraction
  latex: f_{\text{parallel}}
  definition: share of the work that divides among workers
  kind: scalar
  unit: dimensionless
  notes: 'Amdahl''s law: $\text{Speedup} \le 1/((1-\ParallelFraction) + \ParallelFraction/\WorkerCount)$,
    plus $\CoordinationOverhead(\WorkerCount)$ in the coordination bound.'
- macro: \PassAtK
  latex: \text{pass}@k
  definition: probability that at least one of k runs of a task passes, averaged over tasks
  kind: scalar
  unit: dimensionless
  notes: With independent attempts, $1-(1-\AttemptPassProbability)^k$. Candidate availability, not selected
    acceptance.
- macro: \PerStepErrorRate
  latex: \epsilon
  definition: probability that one unchecked turn of a trajectory is wrong
  kind: scalar
  unit: dimensionless
  notes: Assumed independent across turns, so an unchecked horizon succeeds with $(1-\PerStepErrorRate)^{\Horizon}$.
    Verifier error rates and $\StaleSupportRate$ carry subscripts.
- macro: \PerTokenDecodeTime
  latex: t_{\text{decode}}
  definition: time to generate one output token on a single stream
  kind: scalar
  unit: s
  notes: At least $\Parameters\,\ElementStorageSize/\Bandwidth$ when decoding is memory-bandwidth bound.
    A whole call output takes $\DecodeInterval$.
  aliases:
  - \PertokenDecodeTime
- macro: \PermittedActions
  latex: \mathcal{A}_{\text{perm}}
  definition: set of tools the task may call, with the limits on each
  kind: set
  notes: Third element of the task contract $\TaskContract$; least privilege stated per task.
- macro: \Policy
  latex: \pi_\theta
  definition: learned model viewed as a mapping from context or observation to actions, with parameters
    theta
  kind: function
  notes: A stochastic policy gives a distribution over actions, $\Policy(a \mid s)$. A local derivation
    that writes a fixed policy as bare $\pi$ says so.
- macro: \PreAdmissionAction
  latex: a_{\text{prop}}
  definition: action as proposed, before the runtime checks it
  kind: record
  notes: Element of $\mathcal{A}_{\text{prop}}$; the closure operator maps it to $\AdmittedAction$ or
    $\ProposalRejection$. A tool call, not a number.
  aliases:
  - \Proposed
- macro: \PromptTokensSent
  latex: S_{\text{sent}}
  definition: cumulative number of prompt tokens a trajectory sends across all its calls
  kind: count
  notes: With a fixed append and no compaction, $\Horizon\,\BasePromptLength + \TurnAppendLength\,\Horizon(\Horizon-1)/2$.
- macro: \ProposalRejection
  latex: \bot
  definition: outcome of withholding a proposal at the admission gate, recorded with its reason
  kind: record
  notes: Does not undo earlier attempts or establish that outstanding external work has stopped. A marker,
    not a number.
  aliases:
  - \RejectionSymbol
- macro: \QueryWorkspaceGeneration
  latex: g_q
  definition: workspace generation a memory query requires
  kind: index
  notes: The active workspace generation for current-state execution, or an earlier one for historical
    diagnostics.
  aliases:
  - \ValidityIntervalOfAMemoryEntryQ
- macro: \ReasoningBudget
  latex: B_{\text{reason}}
  definition: maximum number of reasoning tokens a call may spend before it answers
  kind: count
- macro: \RepairCap
  latex: K_{\text{repair}}
  definition: maximum number of forward repair attempts on one failed step before the harness compensates
    or escalates
  kind: count
  notes: Exhaustion selects recovery or handoff; it does not prove repair impossible.
- macro: \ReplyLossProbability
  latex: q_{\text{rep}}
  definition: probability that a call's reply is lost in transit
  kind: scalar
  unit: dimensionless
  notes: Independent of the request-loss probability $\RequestLossProbability$.
  aliases:
  - \RequestAndReplylossProbabilitiesTwo
- macro: \RequestLossProbability
  latex: q_{\text{req}}
  definition: probability that a call's request is lost in transit
  kind: scalar
  unit: dimensionless
  notes: Independent of the reply-loss probability $\ReplyLossProbability$.
  aliases:
  - \RequestAndReplylossProbabilities
- macro: \ResponseThreshold
  latex: \tau
  definition: score threshold at which a monitoring or selective-prediction rule acts, such as alerting,
    abstaining, or routing to manual review
  kind: scalar
  unit: dimensionless
  notes: In the units of the score it thresholds. Volume III reserves bare $\tau$ for a trajectory; there
    a threshold or a sampling temperature ($\tau_{\text{temp}}$) carries a subscript.
- macro: \RolloutEnvironmentState
  latex: s_k
  definition: full environment state at a turn of a reinforcement-learning rollout, where turns are indexed
    by k
  kind: record
  notes: Same meaning as $\EnvironmentState$ with turn index $k$, because the reinforcement-learning chapter
    uses $t$ for token positions. A record, not a number.
  aliases:
  - \EnvironmentStateK
- macro: \RuntimeTime
  latex: T_{\text{runtime}}
  definition: time a turn spends in the runtime's own work, such as assembling context, validating proposals,
    and running checks
  kind: scalar
  unit: s
  notes: 'The runtime''s own work: assembling context, validating proposals, running checks.'
- macro: \SearchDepth
  latex: d_{\max}
  definition: maximum depth a tree search expands
  kind: count
  notes: The depth index is $d$. Written $d_{\max}$ because bare $D$ is dataset size.
- macro: \ServiceRate
  latex: \mu
  definition: rate at which one server, such as a worker, consumer, or model endpoint, completes items
    or calls
  kind: scalar
  unit: items/s
  notes: A pool of $\WorkerCount$ servers has capacity $\WorkerCount\,\ServiceRate$. Subscripted rates
    such as $\mu_{\text{out}}$ and a mean reward $\mu_R$ are distinct.
- macro: \StaleSupportRate
  latex: \epsilon_{\text{stale}}
  definition: share of decisions requiring current evidence that relied on superseded support
  kind: scalar
  unit: dimensionless
  notes: Source-version checks identify superseded support; the runtime must label or exclude it first.
  aliases:
  - \StalesupportRate
- macro: \StateAtTurn
  latex: s_t
  definition: context state the model saw on one turn
  kind: record
  notes: In the policy-learning chapters, the state a policy conditions on. The full environment state
    is $\EnvironmentState$. A record, not a number.
- macro: \StateDistribution
  latex: d_\pi
  definition: average distribution of states a policy visits over the horizon
  kind: distribution
  notes: $d_\pi^t$ is the distribution before step $t$, and $d_\pi = \Horizon^{-1}\sum_t d_\pi^t$.
- macro: \StateExposureLevel
  latex: S_0\text{ to }S_3
  definition: state exposure level, what a task carries between turns, from nothing to durable shared
    state
  kind: scalar
  unit: dimensionless
  notes: Levels $S_0$ (nothing), $S_1$ (context window and KV cache), $S_2$ (sandboxed working files),
    $S_3$ (durable state that outlives the session or is shared). An ordinal label; bare $S$ is sequence
    length.
  aliases:
  - \StateLevels
- macro: \StatisticalSignificanceLevel
  latex: \alpha_{\text{sig}}
  definition: allowed probability of a type I error, rejecting a true null hypothesis
  kind: scalar
  unit: dimensionless
  notes: One minus the confidence level, e.g. 0.05 for 95 percent. Used only in vol3; same glyph and meaning
    as \TypeIAndTypeIiErrorRatesSig in the distributed registry.
- macro: \TaskContract
  latex: \mathcal{C}
  definition: 'five-part specification of a delegated task: goal, environment, permitted actions, available
    observations, and completion criteria'
  kind: set
  notes: $\TaskContract = \langle \TaskContractGoal, \TaskEnvironment, \PermittedActions, \AvailableObservations,
    \CompletionCriteria \rangle$.
- macro: \TaskContractGoal
  latex: G
  definition: desired end state of a task, with explicit negative scope, as the first element of the task
    contract
  kind: record
  notes: Text, not a number. Elsewhere $G$ is the group size $\GroupSize$.
  aliases:
  - \GoalContract
- macro: \TaskCost
  latex: C_{\text{task}}
  definition: total monetary cost of all attempts and branches for one initiated task
  kind: scalar
  unit: USD
  notes: Summed over a cohort in $\CostPerAcceptedTask$; the per-task saving of an adaptation is $\Delta
    \TaskCost$.
- macro: \TaskEnvironment
  latex: \mathcal{E}_{\text{env}}
  definition: specification of the reproducible place the work happens, such as base commit, image, configuration,
    and network rules
  kind: set
  notes: Second element of the task contract $\TaskContract$. The environment itself, as a component of
    the agentic system, is $\mathcal{E}$.
  aliases:
  - \Environment
- macro: \TasksPerComparisonArm
  latex: N_{\text{arm}}
  definition: number of tasks per arm needed for a two-proportion release comparison
  kind: count
  notes: $\approx 2(z_{1-\StatisticalSignificanceLevel/2}+z_{1-\beta})^2\,\bar p(1-\bar p)/\Delta^2$.
- macro: \TokenIndex
  latex: t
  definition: position of a sampled policy token within a rollout
  kind: index
  notes: In the reinforcement-learning chapter, where turns are indexed by $k$. Elsewhere $t$ is the turn
    index $\TurnIndex$.
- macro: \TokenLossMask
  latex: m_t
  definition: indicator that a token position is a training target in masked fine-tuning
  kind: scalar
  unit: dimensionless
  notes: $m_t = 1$ on eligible policy-response tokens and $m_t = 0$ on prompts, observations, and unselected
    responses; $t$ is a token position.
  aliases:
  - \LossMaskT
- macro: \TokenVocabulary
  latex: \mathcal{V}
  definition: set of tokens a model call samples from
  kind: set
  notes: Logits live in $\mathbb{R}^{|\TokenVocabulary|}$.
  aliases:
  - \Vocabulary
- macro: \ToolTime
  latex: T_{\text{tool}}
  definition: time a tool takes to execute, such as a build or a test run
  kind: scalar
  unit: s
  notes: Time a tool takes to execute, such as a build or a test run.
- macro: \TraceDecay
  latex: \lambda
  definition: generalized advantage estimator's decay factor between zero and one
  kind: scalar
  unit: dimensionless
  notes: Elsewhere a rate carries a subscript, as $\ArrivalRate$ does.
- macro: \Trajectory
  latex: \tau
  definition: ordered record of the states, actions, and observations of one delegated task
  kind: record
  notes: $\tau = (s_0, a_0, o_1, \dots, s_H)$. Bare $\tau$ always means a trajectory in Volume III. A
    record, not a number.
- macro: \TrajectoryAdmissionRate
  latex: \lambda_{\text{traj}}
  definition: rate at which trajectories are admitted, or arrive at a stage, per second
  kind: scalar
  unit: trajectories/s
  notes: The shared arrival rate $\ArrivalRate$ counted in trajectories. Sustaining goodput $\TrajectoryGoodput$
    at acceptance fraction $\AcceptanceFraction$ needs $\TrajectoryAdmissionRate = \TrajectoryGoodput/\AcceptanceFraction$.
  aliases:
  - \ConcurrentTrajectoriesTwo
- macro: \TrajectoryBudget
  latex: \mathbf{B}
  definition: ceilings on turns, tokens, wall-clock time, and dollars that the harness checks before every
    call
  kind: vector
  notes: $\TrajectoryBudget = \langle H_{\max}, N_{\max}, T_{\max}, \CostCeiling \rangle$; entries have
    mixed units. Bold, to stay distinct from batch size $B$.
- macro: \TrajectoryDuration
  latex: T_{\text{traj}}
  definition: elapsed time of one trajectory between its declared endpoints
  kind: scalar
  unit: s
  notes: Sum over turns of $\ModelTime$, $\ToolTime$, $\ExternalWait$, and $\RuntimeTime$ when those intervals
    are disjoint.
- macro: \TrajectoryGoodput
  latex: \mathcal{G}
  definition: distinct accepted task completions per unit of elapsed time under the declared contract
  kind: scalar
  unit: tasks/s
  notes: $\TrajectoryGoodput = \AcceptedTasks/T_{\text{obs}}$. Sustaining it needs admission rate $\TrajectoryAdmissionRate
    = \TrajectoryGoodput/\AcceptanceFraction$.
- macro: \TrajectoryReward
  latex: R(\tau)
  definition: reward a verifier assigns to a whole trajectory
  kind: scalar
  unit: dimensionless
  notes: Reward a verifier assigns to a whole trajectory.
- macro: \TurnAppendLength
  latex: \Delta S_{\text{turn}}
  definition: number of tokens one turn adds to the next prompt
  kind: count
  notes: Model output plus tool observations.
  aliases:
  - \PerturnAppend
- macro: \TurnContext
  latex: c_t
  definition: tokens the runtime assembles and sends to the model on one turn
  kind: record
  notes: Instructions, goal, tool definitions, and the history of actions, observations, and evidence.
    Can summarize or omit parts of the interaction history $h_t$. A token sequence, not a number.
  aliases:
  - \Context
- macro: \TurnHorizon
  latex: H
  definition: number of sequential turns an agent trajectory runs
  kind: count
  notes: The H axis of the H-S-A framework. Vol4 uses of the old name mean the action-chunk horizon, which
    is \ActionChunkHorizon.
  aliases:
  - \Horizon
- macro: \TurnIndex
  latex: t
  definition: position of a turn within a trajectory, counted from zero
  kind: index
  notes: $s_H$ is the state after the final turn. Inside a per-token loss $t$ indexes token positions
    instead, and positions in a durable log use $j$.
- macro: \ValidCandidateRate
  latex: p
  definition: share of generated candidates that meet the specification, before any check
  kind: scalar
  unit: dimensionless
  notes: $\ValidCandidateRate = \Pr(\text{Valid})$; with $\VerifierFalseAcceptanceRate$ and $\VerifierFalseRejectionRate$
    it sets verifier precision $\Pi_V$. Same letter as $\AttemptPassProbability$ but a different event.
- macro: \VerificationEvidence
  latex: v_t
  definition: result of a check the runtime runs on the resulting state, as pass or fail or a score
  kind: scalar
  unit: dimensionless
  notes: Independent of the action and of the model's report.
- macro: \VerifiedTrajectorySet
  latex: \mathcal{T}_{\text{success}}
  definition: set of dispatched trajectories whose results passed verification
  kind: set
  notes: Subset of $\DispatchedTrajectorySet$.
  aliases:
  - \TrajectorySetsSuccess
- macro: \VerifierFalseAcceptanceRate
  latex: \epsilon_{\text{FA}}
  definition: probability that a verifier passes a candidate that does not meet the specification
  kind: scalar
  unit: dimensionless
  notes: $\Pr(\text{PASS} \mid \neg\text{Valid})$. Subscripted to stay distinct from $\PerStepErrorRate$.
  aliases:
  - \VerifierFalseacceptance
- macro: \VerifierFalseRejectionRate
  latex: \epsilon_{\text{FR}}
  definition: probability that a verifier fails a candidate that meets the specification
  kind: scalar
  unit: dimensionless
  notes: $\Pr(\neg\text{PASS} \mid \text{Valid})$.
  aliases:
  - \VerifierFalseacceptanceFr
- macro: \WorkerCount
  latex: N_{\text{workers}}
  definition: number of equally capable workers, agents, threads, or verifier slots in one pool
  kind: count
  notes: Never bare $M$ or $P$, which are memory and parameter count.
  aliases:
  - \WorkerCountWorkers
