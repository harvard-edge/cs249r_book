# Notation registry: agentic
# Agentic systems: trajectories, task contracts, tools, budgets, evaluation, cost per accepted task.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \ABudget
  latex: B
  definition: A budget
  kind: scalar
  notes: $B$ is batch size. The trajectory budget is bold $\mathbf{B}$, and the reasoning budget is $B_{\text{reason}}$.
- macro: \ACommitHash
  latex: h
  definition: A commit hash
  kind: scalar
- macro: \AFourthTaxonomyAxis
  latex: C
  definition: A fourth taxonomy axis; a grant or commit
  kind: scalar
  notes: There is no $C$ axis; closure evidence levels are named in words. Costs carry subscripts ($C_{\text{task}}$,
    $C_{\text{eff}}$, $C_{\max}$), and the task contract is $\mathcal{C}$.
- macro: \ASequenceOfSteps
  latex: \mathcal{T}
  definition: A sequence of steps
  kind: set
  notes: Calligraphic $\mathcal{T}$ with a subscript is a set of trajectories. Time is $T$.
- macro: \AWorkerOrAgentCount
  latex: M
  definition: A worker or agent count
  kind: count
- macro: \AcceptanceFraction
  latex: \alpha
  definition: Acceptance fraction
  kind: scalar
  unit: Fraction $[0, 1]$
  notes: Share of a settled cohort of initiated tasks that ends accepted, $\alpha = N_{\text{acc}}/N$.
    It counts tasks, whereas $p_{\text{acc}}$ counts attempts; the two coincide only when every task gets
    exactly one attempt.
- macro: \AcceptanceProbability
  latex: p_{\text{acc}}
  definition: Acceptance probability
  kind: scalar
- macro: \AcceptedInfluences
  latex: \text{Inf}(o)
  definition: Accepted influences
  kind: scalar
- macro: \AcceptedTasks
  latex: N_{\text{acc}}
  definition: Accepted tasks
  kind: scalar
- macro: \ActionProposal
  latex: a_t
  definition: Action proposal
  kind: scalar
  unit: Text or tool call
  notes: What the model proposed on turn $t$. Nothing happens until the runtime admits it.
- macro: \ActionValueOrCosttogo
  latex: Q_t^{\pi}(s_t, a_t)
  definition: Action value or cost-to-go
  kind: scalar
- macro: \Advantage
  latex: A
  definition: Advantage; action sets
  kind: scalar
  notes: Authority is written only with a level, $A_0$ to $A_3$. Advantage is $\hat{A}$; action sets are
    $\mathcal{A}_{\text{prop}}$ and $\mathcal{A}_{\text{perm}}$.
- macro: \AgenticSystem
  latex: \mathcal{S}
  definition: Agentic system
  kind: set
  unit: Tuple
  notes: '$\mathcal{S} = \langle \pi_\theta, \mathcal{H}, \mathcal{E}, \mathcal{M}, \mathcal{V} \rangle$:
    policy, runtime harness, environment, memory, and verifiers.'
- macro: \AttemptCost
  latex: C_{\text{attempt}}
  definition: Attempt cost
  kind: scalar
  unit: Dollars
  notes: 'Full cost of one attempt: input and output tokens, tool fees, sandbox time, verification, and
    human review.'
- macro: \AttemptPassProbability
  latex: p
  definition: Per-attempt pass probability
  kind: scalar
  unit: Probability
  notes: Probability that one independent attempt (sample, rerun) on a given task passes its check, so
    pass@$k = 1-(1-p)^k$ and sequential retry costs $c/p$ per acceptance. A per-task quantity; the workload-level
    per-attempt acceptance rate is $p_{\text{acc}}$ and the cohort acceptance fraction is $\alpha$.
- macro: \AttentionHeads
  latex: H
  definition: Attention heads; hidden size
  kind: scalar
  notes: $H$ is the horizon in turns. Heads use $N_{\text{heads}}$ and $H_{\text{KV}}$; hidden size uses
    $d$.
- macro: \AuthorityLevels
  latex: A_0\text{ to }A_3
  definition: Authority Exposure Levels
  kind: scalar
  unit: Level
  notes: What the task may do through its tools.
- macro: \AvailableObservations
  latex: \mathcal{O}_{\text{avail}}
  definition: Available observations
  kind: set
  unit: Specification
  notes: What the agent may see, and how much, including truncation and redaction rules.
- macro: \BasePromptLength
  latex: S_{\text{base}}
  definition: Base prompt length
  kind: scalar
- macro: \BreakEvenTaskVolume
  latex: N^*
  definition: Break-even task volume
  kind: scalar
  unit: Tasks
  notes: Tasks an adaptation must serve before its per-task saving recovers its one-time cost, $N^* =
    C_{\text{invest}}/\Delta C_{\text{task}}$ for $\Delta C_{\text{task}} > 0$; payback time is $N^*$
    divided by task volume per unit time.
- macro: \CallLatency
  latex: T_{\text{call}}
  definition: Call latency
  kind: scalar
  unit: Seconds
  notes: $T_{\text{call}} \approx T_{\text{queue}} + T_{\text{prefill}}(S) + K \cdot t_{\text{tok}}$.
    The first two terms are the time to first token.
- macro: \CandidatePoolSize
  latex: N
  definition: Candidate pool size
  kind: scalar
  unit: Count
  notes: Number of candidates generated for one decision in best-of-$N$ sampling, or the breadth of concurrent
    candidate streams. Sample counts in pass@$k$ use lowercase $k$.
- macro: \CapabilityGrant
  latex: \Gamma
  definition: Capability grant
  kind: scalar
- macro: \ClosureOperator
  latex: \mathcal{I}
  definition: Closure operator
  kind: set
  unit: Function
  notes: '$\mathcal{I}: \mathcal{A}_{\text{prop}} \times \mathcal{S}_{\text{sys}} \to \mathcal{A}_{\text{perm}}
    \cup \{\bot\}$. The runtime''s check of each proposal against the current system state $\mathcal{S}_{\text{sys}}$.'
- macro: \CohensKappa
  latex: \kappa
  definition: Cohen's kappa; a coherency coefficient
  kind: scalar
- macro: \CoherencyContentionCoefficient
  latex: \kappa_{\text{coh}}
  definition: Contention and coherency coefficients
  kind: scalar
  aliases:
  - \ContentionAndCoherencyCoefficientsTwo
- macro: \CompletionCriteria
  latex: \mathcal{K}_{\text{comp}}
  definition: Completion criteria
  kind: set
  unit: Set of checks
  notes: Checks that decide when the task is done, at a stated closure evidence level. The model's claim
    of completion is never one of them.
- macro: \ConcurrentTrajectories
  latex: N_{\text{traj}}
  definition: Concurrent trajectories, admission rate
  kind: scalar
- macro: \ConcurrentTrajectoriesTwo
  latex: \lambda_{\text{traj}}
  definition: Concurrent trajectories, admission rate
  kind: scalar
- macro: \Confidentiality
  latex: \kappa(x)
  definition: Confidentiality
  kind: scalar
- macro: \ContentionAndCoherencyCoefficients
  latex: \sigma_{\text{cont}}
  definition: Contention and coherency coefficients
  kind: scalar
- macro: \Context
  latex: c_t
  definition: Context
  kind: scalar
  unit: Tokens
  notes: 'What the runtime assembles and sends on turn $t$: instructions, goal, tool definitions, and
    the history of actions, observations, and evidence.'
- macro: \ContextWindow
  latex: S_{\max}
  definition: Context window
  kind: scalar
  unit: Tokens
  notes: 'Hard per-call limit on prompt and output together: $S + K_{\max} \le S_{\max}$.'
- macro: \ContinuationCount
  latex: K
  definition: Continuation count
  kind: count
- macro: \CoordinationOverhead
  latex: h
  definition: Coordination overhead
  kind: scalar
  unit: Dimensionless (fraction of serial time)
  notes: Added elapsed overhead $h(N_{\text{workers}})$ of splitting work across workers, normalized by
    serial time, in $\text{Speedup} = 1/[(1-f_{\text{parallel}}) + f_{\text{parallel}}/N_{\text{workers}}
    + h(N_{\text{workers}})]$. Always written with its argument; $h_k$ is interaction history and commit
    hashes carry text subscripts.
- macro: \CostCeiling
  latex: C_{\max}
  definition: Cost ceiling
  kind: scalar
  unit: Dollars
  notes: Spend ceiling the runtime enforces before dispatching the next call.
- macro: \CostPerAcceptedTaskEff
  latex: C_{\text{eff}}
  definition: Cost per accepted task
  kind: scalar
  unit: Dollars/task
  notes: Total spend on all attempts divided by $N_{\text{acc}}$. Failed attempts are paid for in full.
- macro: \Deadline
  latex: T_{\text{deadline}}
  definition: Deadline
  kind: scalar
  aliases:
  - \TaskDeadline
- macro: \DecodeInterval
  latex: T_{\text{decode}}
  definition: Decode interval
  kind: scalar
  unit: seconds
  notes: A call's whole output-generation interval, $T_{\text{decode}}(K) \approx K\,t_{\text{decode}}$
    at a stable per-token step time; one term of call latency.
- macro: \DuplicateeffectProbability
  latex: p_{\text{dup}}
  definition: Duplicate-effect probability
  kind: scalar
- macro: \Environment
  latex: \mathcal{E}_{\text{env}}
  definition: Environment
  kind: set
  unit: Specification
  notes: 'Reproducible place the work happens: base commit, image, configuration, network rules.'
- macro: \EnvironmentState
  latex: s_t
  definition: Environment state
  kind: scalar
- macro: \EnvironmentStateK
  latex: s_k
  definition: Environment state
  kind: scalar
- macro: \EstimatedAdvantageK
  latex: \hat{A}(h_k, a_k)
  definition: Estimated advantage
  kind: scalar
- macro: \EstimatedValueK
  latex: \hat{V}(h_k)
  definition: Estimated value
  kind: scalar
  unit: Scalar
  notes: Estimated probability of success from state $s_t$.
- macro: \EvidenceOrEventSets
  latex: \mathcal{E}
  definition: Evidence or event sets
  kind: set
- macro: \ExpectedCheckingTime
  latex: T_{\text{check}}
  definition: Expected checking time
  kind: scalar
- macro: \ExpectedIrreversibleLossA
  latex: L_A
  definition: Expected irreversible loss
  kind: scalar
- macro: \ExternalWait
  latex: T_{\text{wait}}
  definition: External wait
  kind: scalar
  unit: Seconds
  notes: Time spent waiting on a remote service or a person's approval.
- macro: \Goal
  latex: g
  definition: Goal (Loop)
  kind: scalar
  unit: Text
  notes: The delegated task and its completion rule, fixed for the trajectory. The task contract writes
    it $G$.
- macro: \GoalContract
  latex: G
  definition: Goal (Task Contract)
  kind: scalar
  unit: Text
  notes: Desired end state, with explicit negative scope.
- macro: \GrantExpiryTime
  latex: t_{\text{exp}}
  definition: Grant expiry time
  kind: scalar
  unit: seconds (timestamp)
  notes: Expiry time of a capability grant $\Gamma = (\mathcal{R}_\Gamma, \mathcal{O}_\Gamma, \phi_\Gamma,
    t_{\text{exp}})$; an access at time $t$ is admissible only if $t < t_{\text{exp}}$.
- macro: \GroupSize
  latex: G
  definition: Group size
  kind: scalar
- macro: \IdempotencyKey
  latex: k_{\text{idem}}
  definition: Idempotency key
  kind: scalar
  unit: String
  notes: Deterministic key derived from the trajectory, turn, call, tool, and canonical arguments, so
    a retried call cannot apply its effect twice.
- macro: \InitiatedTasks
  latex: N
  definition: Initiated tasks
  kind: scalar
  unit: Count
  notes: Size of a settled cohort of initiated tasks, whatever their outcome; the denominator of the acceptance
    fraction $\alpha = N_{\text{acc}}/N$ and the range of the cost sum in $C_{\text{eff}}$.
- macro: \IntegrityProvenance
  latex: \iota(x)
  definition: Integrity provenance
  kind: scalar
- macro: \KvBlockSizeBlk
  latex: S_{\text{blk}}
  definition: KV block size
  kind: scalar
- macro: \KvBytesPerToken
  latex: m_{\text{token}}
  definition: KV bytes per token
  kind: scalar
  unit: Bytes/token
  notes: $m_{\text{token}} = 2 \cdot N_L \cdot H_{\text{KV}} \cdot d_{\text{head}} \cdot s_{\text{elem}}$,
    in the shared symbols for layers, KV heads, head dimension, and element size.
- macro: \KvPayload
  latex: M_{\text{KV}}
  definition: KV payload
  kind: scalar
- macro: \LeaseHoldTime
  latex: T_{\text{hold}}
  definition: Lease holding time
  kind: scalar
  unit: seconds
  notes: Mean time a trajectory holds a sandbox (or other leased resource), the residence term in Little's
    law, $N_{\text{active}} = \lambda_{\text{arr}} T_{\text{hold}}$.
- macro: \LittlesLawOccupancy
  latex: L
  definition: Little's law occupancy; loss; latency
  kind: scalar
- macro: \LongmessageGapPerByte
  latex: G
  definition: Long-Message Gap per Byte
  kind: scalar
  unit: $\mathcal{G}$ is trajectory goodput. The goal is $g$ in the loop and $G$ in the task contract.
- macro: \LossMaskT
  latex: m_t
  definition: Loss mask
  kind: scalar
  unit: Binary $\{0, 1\}$
  notes: $m_t = 1$ on tokens the policy wrote (reasoning, tool calls, answers) and $m_t = 0$ on prompts
    and observations.
- macro: \MaskedFinetuningLossSft
  latex: \mathcal{L}_{\text{SFT}}
  definition: Masked fine-tuning loss
  kind: function
  unit: Cross-entropy
  notes: $\mathcal{L}_{\text{SFT}}(\theta) = -\sum_t m_t \log \pi_\theta(x_t \mid x_{<t})$.
- macro: \MemoryHeldDuringAWait
  latex: O_{\text{mem}}
  definition: Memory held during a wait
  kind: scalar
  unit: Byte-seconds
  notes: $O_{\text{mem}} = M_{\text{KV}} \cdot T_{\text{wait}}$, the accelerator memory a paused trajectory
    withholds while it waits on a tool.
- macro: \ModelTime
  latex: T_{\text{model}}
  definition: Model time
  kind: scalar
  unit: Seconds
  notes: Time spent in model calls during a turn.
- macro: \Observation
  latex: o_t
  definition: Observation
  kind: scalar
  unit: Typed result
  notes: What an action returned, such as an exit code, captured output, a response body, or a status.
- macro: \OptimalCheckpointInterval
  latex: T^\ast_{\text{ckpt}}
  definition: Optimal Checkpoint Interval
  kind: scalar
  unit: seconds
  aliases:
  - \OptimalCheckpointIntervalCkpt
- macro: \OutputLength
  latex: K
  definition: Output length
  kind: scalar
  unit: Tokens
  notes: Tokens a call generates. Lowercase $k$ is reserved for sample counts, as in pass@$k$.
- macro: \OutputLimit
  latex: K_{\max}
  definition: Output limit
  kind: scalar
  unit: Tokens
  notes: Maximum tokens the runtime lets a call generate.
- macro: \ParallelFraction
  latex: f_{\text{parallel}}
  definition: Parallel fraction
  kind: scalar
- macro: \PassAtK
  latex: \text{pass}@k
  definition: Pass at k
  kind: scalar
  unit: Probability
  notes: Probability that at least one of k runs of a task succeeds.
- macro: \PassToTheK
  latex: \text{pass}^k
  definition: Pass to the k
  kind: scalar
  unit: Probability
  notes: Probability that all k runs of a task succeed.
- macro: \PerStepErrorRate
  latex: \epsilon
  definition: Per-step error rate
  kind: scalar
  unit: Probability
  notes: Probability that one unchecked step (turn) of a trajectory is wrong, assumed independent across
    steps, so an unchecked horizon succeeds with $(1-\epsilon)^H \approx e^{-\epsilon H}$. Verifier error
    rates carry subscripts ($\epsilon_{\text{FA}}$, $\epsilon_{\text{FR}}$), as does $\epsilon_{\text{stale}}$.
- macro: \PermittedActions
  latex: \mathcal{A}_{\text{perm}}
  definition: Permitted actions
  kind: set
  unit: Set
  notes: Tools the task may call and the limits on each. Least privilege stated per task.
- macro: \PertokenDecodeTime
  latex: t_{\text{decode}}
  definition: Per-token decode time
  kind: scalar
  unit: Seconds
  notes: Time to generate one output token on a single stream.
- macro: \PertokenPricesCache
  latex: c_{\text{cache}}
  definition: Per-token prices
  kind: scalar
- macro: \PertokenPricesIn
  latex: c_{\text{in}}
  definition: Per-token prices
  kind: scalar
- macro: \PertokenPricesOut
  latex: c_{\text{out}}
  definition: Per-token prices
  kind: scalar
- macro: \PerturnAppend
  latex: \Delta S_{\text{turn}}
  definition: Per-turn append
  kind: scalar
- macro: \Policy
  latex: \pi_\theta
  definition: Policy
  kind: scalar
  unit: Distribution
  notes: The model viewed as a distribution over proposals given a context, with parameters $\theta$.
- macro: \PromptLength
  latex: P
  definition: Prompt length; precision; a predicate; a count
  kind: count
- macro: \PromptTokensSent
  latex: S_{\text{sent}}
  definition: Prompt tokens sent
  kind: scalar
- macro: \Proposed
  latex: a_{\text{prop}}
  definition: Proposed, permitted action
  kind: scalar
- macro: \ProposedPerm
  latex: a_{\text{perm}}
  definition: Proposed, permitted action
  kind: scalar
  unit: Tool call
  notes: A proposal before the runtime checks it, and the action it permits after the check.
- macro: \QueryGeneration
  latex: g_q
  definition: Query Generation
  kind: scalar
  unit: Generation index
  notes: Generation index that a query requires.
- macro: \ReasoningBudget
  latex: B_{\text{reason}}
  definition: Reasoning budget
  kind: scalar
  unit: Tokens
  notes: Limit on reasoning tokens a call may spend before it answers.
- macro: \RejectionSymbol
  latex: \bot
  definition: Rejection
  kind: scalar
  unit: Symbol
  notes: A proposal withheld through the admission gate, recorded with its reason.
- macro: \RepairCap
  latex: K_{\text{repair}}
  definition: Repair cap
  kind: scalar
  unit: Count
  notes: Maximum forward repair attempts on one failed step before the harness compensates or escalates.
- macro: \RequestAndReplylossProbabilities
  latex: q_{\text{req}}
  definition: Request- and reply-loss probabilities
  kind: scalar
- macro: \RequestAndReplylossProbabilitiesTwo
  latex: q_{\text{rep}}
  definition: Request- and reply-loss probabilities
  kind: scalar
- macro: \ResponseThreshold
  latex: \tau
  definition: Response Threshold
  kind: scalar
  unit: Bare $\tau$ is a trajectory. Sampling temperature is named in words or written $\tau_{\text{temp}}$.
- macro: \RuntimeTime
  latex: T_{\text{runtime}}
  definition: Runtime time
  kind: scalar
  unit: Seconds
  notes: 'The runtime''s own work: assembling context, validating proposals, running checks.'
- macro: \SearchDepth
  latex: d_{\max}
  definition: Search depth limit
  kind: scalar
  unit: Steps
  notes: Maximum depth a tree search expands; the depth index is $d$. Written as $d_{\max}$ because bare
    $D$ is reserved for dataset size.
- macro: \ServiceRate
  latex: \mu
  definition: Service rate
  kind: scalar
  unit: items/s
  notes: Rate at which one server (worker, consumer, model endpoint) completes items or calls; a pool
    of $N_{\text{workers}}$ such servers has capacity $N_{\text{workers}}\mu$. Mean reward $\mu_R$ and
    other subscripted $\mu$ are distinct.
- macro: \StalesupportRate
  latex: \epsilon_{\text{stale}}
  definition: Stale-support rate
  kind: scalar
- macro: \StateAtTurn
  latex: s_t
  definition: State at turn $t$
  kind: scalar
  unit: Record
  notes: The context state the model saw on turn $t$. In Part V, the state a policy conditions on.
- macro: \StateDistribution
  latex: d_\pi
  definition: State distribution
  kind: distribution
- macro: \StateLevels
  latex: S_0\text{ to }S_3
  definition: State Exposure Levels
  kind: scalar
  unit: Level
  notes: What the task carries between turns.
- macro: \TaskContract
  latex: \mathcal{C}
  definition: Task contract
  kind: set
  unit: Tuple
  notes: $\mathcal{C} = \langle G, \mathcal{E}_{\text{env}}, \mathcal{A}_{\text{perm}}, \mathcal{O}_{\text{avail}},
    \mathcal{K}_{\text{comp}} \rangle$.
- macro: \TaskCost
  latex: C_{\text{task}}
  definition: Task cost
  kind: scalar
- macro: \TasksPerComparisonArm
  latex: N_{\text{arm}}
  definition: Tasks per comparison arm
  kind: scalar
- macro: \Temperature
  latex: \tau
  definition: Temperature; a threshold; an interval
  kind: scalar
- macro: \TestErrorRates
  latex: \alpha
  definition: Test error rates; bandwidth; regularization weights
  kind: scalar
- macro: \TheGoal
  latex: \mathcal{G}
  definition: The goal; a graph
  kind: set
- macro: \TheStateExposure
  latex: S
  definition: The State exposure
  kind: scalar
  notes: Bare $S$ is sequence length. State is written only with a level, $S_0$ to $S_3$.
- macro: \TokenIndex
  latex: t
  definition: Token index
  kind: scalar
- macro: \ToolTime
  latex: T_{\text{tool}}
  definition: Tool time
  kind: scalar
  unit: Seconds
  notes: Time a tool takes to execute, such as a build or a test run.
- macro: \TraceDecay
  latex: \lambda
  definition: Trace decay
  kind: scalar
- macro: \Trajectory
  latex: \tau
  definition: Trajectory
  kind: scalar
  unit: Tuple
  notes: Ordered record of one delegated task, $\tau = (s_0, a_0, o_1, \dots, s_T)$. Bare $\tau$ always
    means a trajectory in this book.
- macro: \TrajectoryBudget
  latex: \mathbf{B}
  definition: Trajectory budget
  kind: matrix
  unit: Vector
  notes: $\mathbf{B} = \langle H_{\max}, N_{\max}, T_{\max}, C_{\max} \rangle$, ceilings on turns, tokens,
    wall-clock time, and dollars, checked by the harness before every call. Bold, to stay distinct from
    batch size $B$.
- macro: \TrajectoryDuration
  latex: T_{\text{traj}}
  definition: Trajectory duration
  kind: scalar
  unit: Seconds
  notes: Sum over turns of model, tool, wait, and runtime time.
- macro: \TrajectoryGoodput
  latex: \mathcal{G}
  definition: Trajectory goodput
  kind: set
  unit: Fraction $[0, 1]$
  notes: Share of a resource spent on trajectories that passed verification. Badput is $1 - \mathcal{G}$.
- macro: \TrajectoryReward
  latex: R(\tau)
  definition: Trajectory reward
  kind: scalar
  unit: Scalar
  notes: Reward a verifier assigns to a whole trajectory.
- macro: \TrajectorySetsAll
  latex: \mathcal{T}_{\text{all}}
  definition: Trajectory sets
  kind: set
- macro: \TrajectorySetsSuccess
  latex: \mathcal{T}_{\text{success}}
  definition: Trajectory sets
  kind: set
  unit: Set
  notes: Every trajectory dispatched, and the subset whose results passed verification. Calligraphic $\mathcal{T}$
    with a subscript always names a set of trajectories.
- macro: \TurnIndex
  latex: t
  definition: Turn index
  kind: scalar
  unit: Integer
  notes: Counts turns within a trajectory. $s_T$ is the state after the final turn.
- macro: \Utilization
  latex: \rho
  definition: Utilization; a recoverable fraction
  kind: scalar
- macro: \ValidCandidateRate
  latex: p
  definition: Valid-candidate rate
  kind: scalar
  unit: Probability
  notes: Base rate $p = \Pr(\text{Valid})$ of candidates that meet the specification, before any check;
    with $\epsilon_{\text{FA}}$ and $\epsilon_{\text{FR}}$ it sets verifier precision $\Pi_V$. Same letter
    as the per-attempt pass probability but a different event, stated where it is introduced.
- macro: \ValidityIntervalOfAMemoryEntryBirth
  latex: g_{\text{birth}}(c)
  definition: Validity interval of a memory entry
  kind: scalar
- macro: \ValidityIntervalOfAMemoryEntryDeath
  latex: g_{\text{death}}(c)
  definition: Validity interval of a memory entry
  kind: scalar
- macro: \ValidityIntervalOfAMemoryEntryQ
  latex: g_q
  definition: Validity interval of a memory entry
  kind: scalar
- macro: \VerificationEvidence
  latex: v_t
  definition: Verification evidence
  kind: scalar
  unit: Pass/fail or score
  notes: Result of a check the runtime runs on the resulting state, independent of the action and of the
    model's report.
- macro: \VerifierFalseacceptance
  latex: \epsilon_{\text{FA}}
  definition: Verifier false-acceptance, false-rejection rates
  kind: scalar
- macro: \VerifierFalseacceptanceFr
  latex: \epsilon_{\text{FR}}
  definition: Verifier false-acceptance, false-rejection rates
  kind: scalar
- macro: \Vocabulary
  latex: \mathcal{V}
  definition: Vocabulary
  kind: set
- macro: \WorkerCountWorkers
  latex: N_{\text{workers}}
  definition: Worker count
  kind: count
