# Notation registry: agentic
# Agentic systems: trajectories, task contracts, tools, budgets, evaluation, cost per accepted task.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AcceleratedEpisodeTime
  latex: T'
  definition: elapsed time of a fixed trajectory or episode after only its model-execution share is accelerated
  kind: scalar
  unit: s
  notes: A prime on \Time, which names a new quantity, not a derivative.
- macro: \AcceptanceFraction
  latex: \alpha
  definition: share of a settled cohort of initiated tasks that ends accepted
  kind: scalar
  unit: dimensionless
  notes: $\AcceptanceFraction = \AcceptedTasks/\InitiatedTasks$. It counts tasks, whereas $\AcceptanceProbability$
    counts attempts; the two coincide only when every task gets exactly one attempt. Bare $\alpha$ always
    means this fraction; the significance level is $\StatisticalSignificanceLevel$.
- macro: \AcceptanceIntervalLowerLimit
  latex: L
  definition: lower limit of a confidence interval for an acceptance probability, such as the Wilson score
    interval
  kind: scalar
  unit: dimensionless
  notes: Pairs with \AcceptanceIntervalUpperLimit. Not \PairedDifferenceLowerLimit ($L_\Delta$), which
    bounds a paired difference.
- macro: \AcceptanceIntervalUpperLimit
  latex: U
  definition: upper limit of a confidence interval for an acceptance probability, such as the Wilson score
    interval
  kind: scalar
  unit: dimensionless
  notes: At zero acceptances the Wilson upper limit is $z^2/(N+z^2)$. Pairs with \AcceptanceIntervalLowerLimit.
- macro: \AcceptanceProbability
  latex: p_{\text{acc}}
  definition: probability that one attempt at a task is accepted, across a workload
  kind: scalar
  unit: dimensionless
  notes: Workload-level, per attempt. With independent retries, $\CostPerAcceptedTask = \mathbb{E}[\AttemptCost]/\AcceptanceProbability$.
    Distinct from the per-task $\AttemptPassProbability$ and the cohort fraction $\AcceptanceFraction$.
- macro: \AcceptedInfluences
  latex: \text{Inf}
  definition: set of sources a task policy accepts as influences on one operation
  kind: function
  notes: Written with its operation, $\text{Inf}(o)$. The evidence check is $\IntegrityProvenance \subseteq
    \AcceptedInfluences$. Upright, to stay distinct from the environment $\mathcal{E}$.
- macro: \AcceptedLabelCount
  latex: d
  definition: number of accepted labels among the observations a sequential test has collected so far,
    indexed by that observation count
  kind: count
  notes: Written $d_n=\sum_{i=1}^n x_i$; enters the log-likelihood ratio $\Lambda_n$.
- macro: \AcceptedOutcomePayoff
  latex: V
  definition: monetary value of one accepted outcome, rejected outcomes valued at zero
  kind: scalar
  unit: USD
- macro: \AcceptedSampleCount
  latex: X
  definition: number of accepted tasks among the independently sampled tasks of a single-run evaluation,
    the binomial count a confidence interval for acceptance is built from
  kind: count
  notes: With \EvaluationSampleCount it gives the observed share $\hat p = X/N$ and the Wilson interval.
    Not \AcceptedTasks, the accepted count of a settled production cohort.
- macro: \AcceptedTaskMeanCost
  latex: C_{\text{succ}}
  definition: mean task-account cost of the accepted tasks in a settled cohort
  kind: scalar
  unit: USD
  notes: With \UnacceptedTaskMeanCost, partitions cost per accepted task.
- macro: \AcceptedTasks
  latex: N_{\text{acc}}
  definition: number of distinct tasks in a cohort accepted under the declared contract
  kind: count
  notes: 'Retries never inflate it: a task accepted after three attempts counts once. Numerator of $\AcceptanceFraction$
    and denominator of $\CostPerAcceptedTask$.'
- macro: \AcceptingStateSet
  latex: F
  definition: set of accepting states of an output-constraint automaton, those at which a complete permitted
    string ends
  kind: set
  notes: End-of-sequence is permitted only when $q_t\in F$.
  render_exception: Finite-automaton convention writes the state set, alphabet and accepting set as italic
    or Greek capitals; the kind rule would ask for calligraphic.
- macro: \AccessAttemptTime
  latex: t
  definition: time at which a proposed access is checked against a capability grant
  kind: scalar
  unit: s
  notes: A timestamp; the access is admissible only if $\AccessAttemptTime < \GrantExpiryTime$. Not the
    turn index.
- macro: \ActionRecoverableFraction
  latex: \rho_{a}
  definition: fraction of an action's consequence that compensation can restore if the action proves bad
  kind: scalar
  unit: dimensionless
  notes: Zero for an action past a pivot; a pre-pivot check gives $\ActionRecoverableFraction = \PrePivotCatchRate\,\RevertFidelity$.
    Not server utilization $\ServingUtilization$.
- macro: \ActionTokenPrefix
  latex: a_{<j}
  definition: action tokens of one response that precede the current action-token position
  kind: record
  notes: The prefix $a_1,\ldots,a_{j-1}$ of \ResponseActionTokens; the subscript is a range, so the prefix
    is its own entry.
- macro: \ActiveLeaseCount
  latex: N_{\text{active}}
  definition: mean number of sandbox leases held at once, by Little's law
  kind: count
  notes: $\ActiveLeaseCount = \ArrivalRate\,\LeaseHoldTime$. Same glyph as the fine-tuning count of loss-selected
    tokens, a different meaning.
- macro: \ActiveSchemaSet
  latex: \mathcal{S}
  definition: set of tool schemas declared to the model when one scored call was proposed
  kind: set
  notes: Indexed by call, $\mathcal{S}_i$. Not \AgenticSystem, which the notation chapter writes with
    the same glyph.
- macro: \ActiveTargetTokenCount
  latex: N_{\text{active}}
  definition: number of token positions in one example that the loss mask selects as training targets
  kind: count
  notes: $N_{\text{active}} = \sum_t \PositionLossMask$, required positive; the normalizer of $\MaskedFinetuningLoss$.
    Not the Little's-law count of leases held at once, $N_{\text{active}} = \ArrivalRate\,\LeaseHoldTime$,
    which shares the glyph.
- macro: \AdaptationInvestmentCost
  latex: C_{\text{invest}}
  definition: incremental one-time cost of an intervention such as an adaptation, covering data curation,
    training compute and offline evaluation
  kind: scalar
  unit: USD
  notes: Numerator of the break-even task count $\BreakEvenTaskCount$.
- macro: \AdaptedTaskCost
  latex: C_{\text{task, adapt}}
  definition: expected operating cost per assigned task under the adapted configuration, including failed
    attempts, retries and review
  kind: scalar
  unit: USD/task
  notes: Subtracted from the baseline task cost to give $\Delta \TaskCost$.
- macro: \AdmissionCheckCount
  latex: n_{\text{chk}}
  definition: number of admission predicates an admission route evaluates in sequence
  kind: count
  notes: Bounds the sums and products of the short-circuit cascade, $\ExpectedCheckingTime=\sum_{i=1}^{\AdmissionCheckCount}
    T_i\prod_{j<i}p_j$.
- macro: \AdmissionCheckIndex
  latex: i
  definition: position of one admission predicate in the execution order of an admission route
  kind: index
  notes: Runs from 1 to $\AdmissionCheckCount$. As a subscript the bare letter is exempt; a superscript
    use such as $\prod_{j=1}^{i-1}$ needs this macro.
- macro: \AdmissionDecisionEvent
  latex: e_{\text{auth}}
  definition: event at which the runtime admits a proposed external effect, recording its authorization
    and budget reservation decision
  kind: record
  notes: Second event of the write-ahead dispatch ordering, after $e_{\text{prop}}$ and before $e_{\text{flush}}$.
- macro: \AdmissionRouteYield
  latex: Y
  definition: probability that a candidate record passes every admission predicate of its route, the product
    of the conditional pass probabilities
  kind: scalar
  unit: dimensionless
  notes: $\AdmissionRouteYield=\prod_i p_i$. $\ExpectedCheckingTime/\AdmissionRouteYield$ is checking
    time per admitted record, and admitted data arrives at $R_{\text{attempt}}\,\AdmissionRouteYield$.
    Plays the role of $\AcceptanceProbability$ in the cost-per-accepted-task formula but counts admitted
    records, not accepted task attempts.
- macro: \AdmittedAction
  latex: a_{\text{perm}}
  definition: action the runtime permits after checking a proposal
  kind: record
  notes: Element of $\mathcal{A}_{\text{perm}}$. A tool call, not a number.
  aliases:
  - \ProposedPerm
- macro: \AdmittedAttemptCap
  latex: N
  definition: largest number of admitted attempts a gate allows, a safety property that a finite history
    can violate
  kind: count
  notes: Illustrates turning an unprovable liveness property into an enforceable safety bound. Distinct
    from $\RepairCap$, which bounds repair attempts on one failed step.
- macro: \AdmittedWorkUnitCount
  latex: m
  definition: number of units of work, such as generation rounds, a search has admitted so far
  kind: count
  notes: Indexes the calibrated estimate and the cumulative cost of the marginal stopping rule.
- macro: \Advantage
  latex: A
  definition: estimate of how much better an action does than the policy's average from the same state
  kind: scalar
  unit: dimensionless
  notes: Always written with a hat, $\hat{\Advantage}_t$ or the group-relative $\hat{\Advantage}_i$. Authority
    is written only with a level, $A_0$ to $A_3$; action sets are $\mathcal{A}_{\text{prop}}$ and $\PermittedActions$.
- macro: \AdvantageStabilizer
  latex: \epsilon_{\text{stab}}
  definition: small positive constant added to the group reward standard deviation in the group-relative
    advantage so the coefficient stays defined when every reward in a group ties
  kind: scalar
  unit: dimensionless
  notes: Shares its glyph with the scheduler constant $\FairShareStabilizingConstant$; distinct from the
    clipping parameter $\epsilon_{\text{clip}}$.
- macro: \AdversarialInputLength
  latex: n
  definition: number of characters in an adversarial input to a pattern matcher
  kind: count
  notes: A backtracking matcher may take $2^{\AdversarialInputLength}$ steps on it.
- macro: \AgentEnvironment
  latex: \mathcal{E}
  definition: environment an agentic system acts in, the tools, services, files and people its actions
    reach and its observations come from
  kind: record
  notes: Its reproducible specification in the task contract is $\TaskEnvironment$. Not an evidence or
    event set.
- macro: \AgenticSystem
  latex: \mathcal{S}
  definition: policy together with its runtime harness, environment, memory, and verifiers
  kind: set
  notes: A tuple, $\mathcal{S} = \langle \pi_\theta, \mathcal{H}, \mathcal{E}, \mathcal{M}, \mathcal{V}
    \rangle$; the components other than the policy are named in words.
- macro: \AggregateSlotWork
  latex: W
  definition: total slot time a task-precedence graph needs, the sum of its vertex durations
  kind: scalar
  unit: s
  notes: $W/\WorkerCount$ is the capacity bound on makespan. Not a weight or a window.
- macro: \AllRunsPassEstimate
  latex: \widehat{r}
  definition: unbiased estimate, for one task, of the probability that all k runs pass, the share of k-subsets
    of the graded runs in which every run passed
  kind: scalar
  unit: dimensionless
  notes: Written $\widehat r_{i,k}=\binom{c_i}{k}/\binom{n_i}{k}$, with task and claim-size indices; its
    expectation is $p_i^k$. Averaged over tasks it estimates \AllRunsPassProbability.
- macro: \AllRunsPassProbability
  latex: \text{pass}^k
  definition: probability that all k runs of a task pass, averaged over tasks
  kind: scalar
  unit: dimensionless
  notes: Under conditional independence this is $\mathbb{E}_i[p_i^k]$, not $(\mathbb{E}_i[p_i])^k$.
  aliases:
  - \PassToTheK
- macro: \AllowedTokenSet
  latex: \mathcal{V}_{\text{allow}}
  definition: set of tokens a decoding mask leaves unmasked at a constraint state, the viable ordinary
    tokens plus an end-of-sequence token when the state accepts
  kind: set
  notes: Written with its argument, $\mathcal{V}_{\text{allow}}(q_t)$; a superset of \ValidTokenSet.
- macro: \AlphabetByte
  latex: b
  definition: one byte of the alphabet a byte-level constraint automaton reads
  kind: record
  notes: In $\delta^*(q,bs)$, $b$ is the first byte and \ByteString the rest. Not \BeliefState.
- macro: \AmortizedTurnCost
  latex: \bar{C}_{\text{turn}}
  definition: mean monetary cost per task turn over one compaction cycle, including that cycle's compaction
    pass
  kind: scalar
  unit: USD
  notes: $\AmortizedTurnCost = (\sum_{i=1}^{\CompactionCycleTurnCount} {\TaskTurnCost}_{i} + \CompactionPassCost)/\CompactionCycleTurnCount$.
- macro: \ApprovalCatchFraction
  latex: q
  definition: share of the defective changes missed by the canary that a human approval gate before the
    pivot catches
  kind: scalar
  unit: dimensionless
  notes: Local to the approval-gate exercise; its break-even value $\ApprovalCatchFraction^*$ balances
    reviewer cost against avoided loss.
- macro: \ApprovalHeldTrajectories
  latex: N_{\text{held}}
  definition: mean number of trajectories held awaiting a human approval decision at once
  kind: count
  notes: 'Little''s law for the approval escrow, $\ApprovalHeldTrajectories = \ArrivalRate\,\ExternalWait$
    with $\ArrivalRate$ the rate of approval requests. A mean, not a peak: bursts hold more. A subset
    of $\ConcurrentTrajectories$.'
- macro: \ArmSuccessProbability
  latex: p
  definition: hypothesized per-trial success probability of one arm of a two-arm comparison, indexed by
    arm
  kind: scalar
  unit: dimensionless
  notes: Indexed $p_1$, $p_2$ with $0<p_1<p_2<1$; their average is \PooledAcceptanceProbability.
- macro: \AttackedTrialCount
  latex: n
  definition: number of independent attacked trials or episodes run against a defense, in the zero-success
    rule-of-three bound
  kind: count
  notes: With zero observed successes, the 95 percent upper bound on attack-success rate is $1-0.05^{1/\AttackedTrialCount}
    \approx 3/\AttackedTrialCount$.
- macro: \AttemptCleanupCost
  latex: C_{\text{cleanup}}
  definition: charge for state reset, storage teardown and compensating transactions after one attempt
  kind: scalar
  unit: USD
- macro: \AttemptCost
  latex: C_{\text{attempt}}
  definition: full monetary cost of one attempt at a task
  kind: scalar
  unit: USD
  notes: Includes input and output tokens, tool fees, sandbox time, verification, and human review.
- macro: \AttemptGenerationTime
  latex: T_{\text{gen}}
  definition: accelerator time one rollout attempt spends in generation, in accelerator-seconds
  kind: scalar
  unit: s
  notes: The generation fleet sustains at most $\AcceleratorCount/\AttemptGenerationTime$ attempts per
    second.
- macro: \AttemptPassProbability
  latex: p
  definition: probability that one independent attempt on a given task passes its check
  kind: scalar
  unit: dimensionless
  notes: 'A per-task quantity: pass@$k = 1-(1-\AttemptPassProbability)^k$, and sequential retry costs
    $c/\AttemptPassProbability$ per acceptance. The workload-level rate is $\AcceptanceProbability$ and
    the cohort fraction is $\AcceptanceFraction$.'
- macro: \AttemptRuntimeOverheadCost
  latex: C_{\text{runtime}}
  definition: share of orchestrator, scheduler and shared telemetry overhead apportioned to one attempt
  kind: scalar
  unit: USD
- macro: \AttemptVerificationCost
  latex: C_{\text{verify}}
  definition: charge for post-execution checks and test suites of one attempt not already billed as sandbox
    time
  kind: scalar
  unit: USD
- macro: \AuthorityExposureLevel
  latex: A
  definition: authority exposure level, what a task may do through its tools, from read access to irreversible
    external action
  kind: scalar
  unit: dimensionless
  notes: Written with its level as an index, $\AuthorityExposureLevel_{0}$ (read access), $\AuthorityExposureLevel_{1}$
    (mutation confined to a discardable sandbox), $\AuthorityExposureLevel_{2}$ (retry-safe or compensable
    external action), $\AuthorityExposureLevel_{3}$ (irreversible external action). An ordinal label,
    not a number. Shares the letter A with $\Advantage$, which is always written with a hat.
  aliases:
  - \AuthorityLevels
- macro: \AutomatonStateSet
  latex: Q
  definition: finite set of states of an output-constraint automaton
  kind: set
  notes: appendix_inference sizes a dense mask table as $|Q|\lceil |\mathcal{V}|/8 \rceil$ bytes. Its
    elements are \DecodingConstraintState.
  render_exception: Finite-automaton convention writes the state set, alphabet and accepting set as italic
    or Greek capitals; the kind rule would ask for calligraphic.
- macro: \AutomatonTransitionFunction
  latex: \delta
  definition: transition function of an output-constraint automaton, mapping a state and a byte to the
    next state
  kind: function
  notes: Its extension to byte strings is written $\delta^*$, with $\delta^*(q,\epsilon)=q$; invalid transitions
    enter a rejecting sink. Not \PrivacyAdditiveSlack.
- macro: \AutonomousExecutionComputeCost
  latex: C_{\text{compute}}
  definition: direct token and compute cost of running a proposed action autonomously, paid under either
    escalation decision
  kind: scalar
  unit: USD
  notes: Not the training compute costs written $C_{\text{compute}}$ in other volumes.
- macro: \AvailableObservations
  latex: \mathcal{O}_{\text{avail}}
  definition: specification of what the agent may see and how much, including truncation and redaction
    rules
  kind: set
  notes: Fourth element of the task contract $\TaskContract$.
- macro: \BasePromptLength
  latex: S_{\text{base}}
  definition: number of prompt tokens in the first call of a trajectory, before any turn appends to it
  kind: count
  notes: With a fixed per-turn append and no compaction, $\PromptTokensSent = \Horizon\,\BasePromptLength
    + \TurnAppendLength\,\Horizon(\Horizon-1)/2$.
- macro: \BaseTrajectoryTokenCount
  latex: N_{\text{base}}
  definition: number of output tokens the base trajectory generates, without any continuation branches
  kind: count
  notes: Equals $\TurnHorizon\,\TurnGeneratedTokenCount$.
- macro: \BaselineAcceptanceEstimate
  latex: \hat{p}_{\text{base}}
  definition: observed acceptance share of the baseline configuration over the tasks of a paired comparison,
    its accepted count divided by the task count
  kind: scalar
  unit: dimensionless
  notes: Equals $(n_{11}+b)/N$. Pairs with \CandidateAcceptanceEstimate.
- macro: \BaselineIntervalLowerLimit
  latex: l_{\text{base}}
  definition: lower limit of the single-proportion Wilson interval for the baseline configuration's acceptance
    proportion
  kind: scalar
  unit: dimensionless
  notes: Input to Newcombe's paired-difference interval.
- macro: \BaselineIntervalUpperLimit
  latex: u_{\text{base}}
  definition: upper limit of the single-proportion Wilson interval for the baseline configuration's acceptance
    proportion
  kind: scalar
  unit: dimensionless
  notes: Input to Newcombe's paired-difference interval.
- macro: \BaselineLowerLimitDistance
  latex: \delta^-_{\text{base}}
  definition: downward distance from the baseline configuration's observed acceptance share to the lower
    limit of its Wilson interval
  kind: scalar
  unit: dimensionless
  notes: Equals $\hat p_{\text{base}}-l_{\text{base}}$. One of the four marginal half-widths ($\MarginalLimitDistance$)
    that Newcombe's paired interval combines.
- macro: \BaselineOnlyAcceptedTaskCount
  latex: b
  definition: number of tasks in a paired comparison that the baseline accepts and the candidate does
    not, one of the two discordant counts
  kind: count
  notes: With its counterpart $c$ it forms the discordant pairs of McNemar's test, $n_{\text{disc}}=b+c$,
    and the paired difference $\hat\Delta=(c-b)/N$.
- macro: \BaselinePolicyAcceptanceProbability
  latex: p_{X}
  definition: acceptance probability of the baseline routing policy against which an alternative is compared
  kind: scalar
  unit: dimensionless
- macro: \BaselinePolicyCost
  latex: C_{X}
  definition: expected additional monetary cost of the baseline routing policy
  kind: scalar
  unit: USD
- macro: \BaselineTaskCost
  latex: C_{\text{task, base}}
  definition: expected operating cost per assigned task under the baseline configuration, including failed
    attempts, retries and review
  kind: scalar
  unit: USD/task
  notes: Minus the adapted task cost gives $\Delta \TaskCost$.
- macro: \BaselineToolCallDistribution
  latex: p_{b}
  definition: distribution of the baseline configuration's tool calls over the kinds of tool call, under
    one declared action-counting policy
  kind: distribution
  notes: Compared with \CandidateToolCallDistribution by the Jensen-Shannon divergence to flag a changed
    operating pattern.
- macro: \BaselineTrajectoryGoodput
  latex: \mathcal{G}_{b}
  definition: trajectory goodput of the baseline configuration over a matched observation interval and
    workload
  kind: scalar
  unit: tasks/s
  notes: Pairs with \CandidateTrajectoryGoodput.
- macro: \BaselineUpperLimitDistance
  latex: \delta^+_{\text{base}}
  definition: upward distance from the baseline configuration's observed acceptance share to the upper
    limit of its Wilson interval
  kind: scalar
  unit: dimensionless
  notes: Equals $u_{\text{base}}-\hat p_{\text{base}}$. One of the four marginal half-widths ($\MarginalLimitDistance$)
    that Newcombe's paired interval combines.
- macro: \BatchCostPerAcceptedTask
  latex: C_{\text{eff,batch}}
  definition: expected cost per accepted task when a full pool of candidates is generated and checked
    in parallel
  kind: scalar
  unit: USD/task
  notes: Equals $k(g+v)/q_k$ for independent candidates and an exact checker. A case of \CostPerAcceptedTask
    under a stated selection policy.
- macro: \BatchRolloutCount
  latex: N_{\text{batch}}
  definition: number of rollouts in one training batch, across all of its tasks and groups
  kind: count
  notes: Group size times task count when every task gets a full group. Not \GroupSize, the rollouts per
    task.
- macro: \BeamWidth
  latex: W
  definition: largest number of partial candidates a beam search retains for the next step
  kind: count
  notes: During expansion the runtime briefly holds $W$ times the branching factor in extensions.
- macro: \BehaviorPolicyVersion
  latex: \text{ver}_b
  definition: version number of the policy checkpoint that generated a rollout, counted in trainer updates
  kind: index
  notes: The trainer's active version is $\text{ver}_t$; their difference $\FiniteChange\text{ver}$ is
    the update-count lag. Only the subscript b is italic in the source, so the macro carries the whole
    symbol.
- macro: \BeliefState
  latex: b
  definition: probability distribution over environment states conditional on the interaction history,
    the belief state of a partially observable decision process
  kind: distribution
  notes: Indexed by turn, $b_t(s)=\Pr(S_t=s\mid h_t)$; updated by Bayes' rule. Not the history's token
    representation, and not \TurnContext.
- macro: \BetweenTaskStandardDeviation
  latex: \sigma_{\text{task}}
  definition: standard deviation across the task population of a fixed system's per-task acceptance probability,
    whose square is the between-task variance of an acceptance estimate
  kind: scalar
  unit: dimensionless
  notes: Written squared, $\sigma^2_{\text{task}}=\operatorname{Var}(p_i)$, in the variance decomposition
    of the task-averaged acceptance estimate, where it divides by the task count only.
- macro: \BlendedInputTokenPrice
  latex: c_{\text{in}}
  definition: average price per input token when a share of input tokens is billed at the cached rate
    and the rest at the uncached rate
  kind: scalar
  unit: USD/token
  notes: Renders like the uncached $\InputTokenPrice$; equals the cached share times $\CachedInputTokenPrice$
    plus the uncached share times $\InputTokenPrice$. Used where a cost formula applies one input price
    to all input tokens.
- macro: \BlockCheckTime
  latex: T_{\text{ver}}
  definition: time to run the check on one generated block
  kind: scalar
  unit: s
  notes: Charged once per attempt of a block. Not \ExpectedCheckingTime.
- macro: \BlockedWorkerCount
  latex: N_{\text{blocked}}
  definition: mean number of worker slots held by calls blocked on a stalled dependency
  kind: count
  notes: $\min(\SharedPoolWorkerCount, \ArrivalRate\,\BlockingCallTimeout)$ in steady state.
- macro: \BlockingCallTimeout
  latex: T_{\text{out}}
  definition: hard timeout after which a call blocked on an unresponsive dependency gives up the worker
    slot it occupies
  kind: scalar
  unit: s
  notes: With arrivals at $\ArrivalRate$, $\ArrivalRate\,\BlockingCallTimeout$ slots are held in steady
    state (Little's law).
- macro: \BootstrapQuantileFunction
  latex: Q
  definition: empirical quantile function of the bootstrap replicate statistics, returning the smallest
    replicate value whose empirical distribution reaches a level
  kind: function
  notes: Written $\BootstrapQuantileFunction^*(\QuantileLevel)$; the star marks a bootstrap quantity,
    not an optimum. Not an action value.
- macro: \BootstrapReplicateCount
  latex: B_{\text{boot}}
  definition: number of bootstrap resamples drawn to approximate a statistic's sampling distribution
  kind: count
  notes: Not the batch size.
- macro: \BootstrapReplicateIndex
  latex: r
  definition: position of one bootstrap resample among the replicates
  kind: index
  notes: Runs from 1 to $\BootstrapReplicateCount$.
- macro: \BreadthCriticalPathLatency
  latex: T^{\text{breadth}}
  definition: critical-path latency of one decision when test-time compute samples a pool of candidates
    concurrently along the breadth axis
  kind: scalar
  unit: s
  notes: Prefill plus the longest candidate's decode, given capacity for all streams.
- macro: \BreadthPeakKvCacheMemory
  latex: M_{\text{KV}}^{\text{breadth}}
  definition: peak memory the key-value caches of a breadth allocation occupy when its concurrent candidate
    streams share one prompt prefix
  kind: scalar
  unit: bytes
  notes: Proportional to the prompt length plus the sum of candidate output lengths; without prefix sharing
    the prompt is stored once per stream.
- macro: \BreakEvenAcceptanceProbability
  latex: p'
  definition: per-attempt acceptance probability at which an attempt at the original cost matches the
    cost per accepted task of a price cut
  kind: scalar
  unit: dimensionless
  notes: Break-even acceptance $\AcceptanceProbability/(1-\text{cut}\times\text{share})$ against a token
    price cut. Not $\AttemptPassProbability$.
- macro: \BreakEvenParseFailureRate
  latex: p_{\text{break}}
  definition: parse failure rate at which constrained decoding and free sampling with one repair have
    equal expected latency
  kind: scalar
  unit: dimensionless
  notes: Equals $\OutputLength\,\PerTokenMaskingTime / \RepairTurnLatency$. Above one, eliminating every
    parse failure would not repay the mask overhead.
- macro: \BreakEvenTaskCount
  latex: N^*
  definition: number of tasks an adaptation must serve before its per-task saving recovers its one-time
    cost
  kind: count
  notes: $\BreakEvenTaskCount = C_{\text{invest}}/\Delta \TaskCost$ for $\Delta \TaskCost > 0$; payback
    time is $\BreakEvenTaskCount$ divided by task volume per unit time.
  aliases:
  - \BreakEvenTaskVolume
- macro: \BreakerCooldownInterval
  latex: T_{\text{cool}}
  definition: time an open circuit breaker waits before it admits a half-open probe
  kind: scalar
  unit: s
  notes: Doubles after each failed probe up to $\MaximumBreakerCooldownInterval$.
- macro: \BreakerFailureFraction
  latex: r
  definition: share of the classified outcomes in a circuit breaker's window that count as infrastructure
    failures
  kind: scalar
  unit: dimensionless
  notes: $\BreakerFailureFraction = \sum_{i} \CountedFailureIndicator_i / \lvert\BreakerOutcomeWindow\rvert$;
    the breaker trips when it reaches $\BreakerTripThreshold$.
- macro: \BreakerMinimumSampleCount
  latex: n_{\min}
  definition: smallest number of classified outcomes a circuit breaker's window must hold before it may
    trip
  kind: count
  notes: Prevents spurious trips at low traffic; paired with the trip threshold $\BreakerTripThreshold$.
- macro: \BreakerOutcomeIndex
  latex: i
  definition: position of one classified call outcome within a circuit breaker's rolling window
  kind: index
  notes: Subscripts $\CountedFailureIndicator_i$ and ranges over $\BreakerOutcomeWindow$.
- macro: \BreakerOutcomeWindow
  latex: W
  definition: rolling window of recent classified call outcomes in one circuit breaker's scope
  kind: set
  notes: $\lvert\BreakerOutcomeWindow\rvert$ is its size; the breaker trips only when it holds at least
    $\BreakerMinimumSampleCount$ outcomes.
  render_exception: The chapter writes the window as an italic capital, a set whose size is taken with
    bars.
- macro: \BreakerTripThreshold
  latex: r_{\text{trip}}
  definition: failure fraction at or above which a circuit breaker trips to open
  kind: scalar
  unit: dimensionless
  notes: A policy parameter, compared with $\BreakerFailureFraction$ once the window holds $\BreakerMinimumSampleCount$
    outcomes.
- macro: \BudgetedAcceptanceProbability
  latex: q_{\pi}
  definition: 'budgeted acceptance of a fixed complete policy: the probability that one trial is accepted
    and its total monetary charge stays within a stated ceiling'
  kind: function
  unit: dimensionless
  notes: Written with its ceiling as argument, $q_\pi(C_{\max})$; token and elapsed-time ceilings add
    their own conditions.
- macro: \BurstArrivalCount
  latex: N_{\text{burst}}
  definition: number of tasks that arrive together in one burst
  kind: count
- macro: \ByteAlphabet
  latex: \Sigma
  definition: alphabet of byte values, zero to 255, that a byte-level constraint automaton reads
  kind: set
  notes: Elements are \AlphabetByte.
  render_exception: Finite-automaton convention writes the state set, alphabet and accepting set as italic
    or Greek capitals; the kind rule would ask for calligraphic.
- macro: \ByteString
  latex: u
  definition: finite string of bytes over the alphabet of a byte-level constraint automaton
  kind: record
  notes: Concatenated after one byte as $b\ByteString$ in $\delta^*(q,b\ByteString)$. The byte string
    of one token is \TokenByteDecoding.
- macro: \CachedInputTokenCount
  latex: n_{\text{cache}}
  definition: number of input tokens in a call that the provider bills at the cached input rate
  kind: count
  notes: Settled-ledger category priced at $\CachedInputTokenPrice$; disjoint from $\UncachedInputTokenCount$.
    Written $n_{\text{cache}}^{(t)}$ for turn $t$.
- macro: \CachedInputTokenPrice
  latex: c_{\text{cache}}
  definition: price of one cached input token
  kind: scalar
  unit: USD/token
  notes: Lowercase $c$ is a unit price that an uppercase $C$ totals.
  aliases:
  - \PertokenPricesCache
- macro: \CalibratedAcceptanceEstimate
  latex: \hat{p}
  definition: calibrated estimate of the probability that a search has found an acceptable result, after
    a given number of admitted units of work
  kind: scalar
  unit: dimensionless
  notes: Indexed by the admitted work, ${\hat{p}}_{\AdmittedWorkUnitCount}$, with $\hat{p}_0 = 0$. Not
    $\EstimatedAcceptanceProbability$, a cohort estimate of the per-attempt rate.
- macro: \CallLatency
  latex: T_{\text{call}}
  definition: elapsed time of one model call, from request preparation to normalized response
  kind: scalar
  unit: s
  notes: Sum of nonoverlapping intervals, $\CallLatency = T_{\text{prep}} + T_{\text{queue}} + T_{\text{prefill}}
    + \DecodeInterval + T_{\text{post}}$; the terms through prefill make the time to first token.
- macro: \CallPostprocessingTime
  latex: T_{\text{post}}
  definition: 'time after generation until a model call''s normalized response is ready: response transfer,
    deserialization and schema validation'
  kind: scalar
  unit: s
  notes: Last term of $\CallLatency$.
- macro: \CallPreparationTime
  latex: T_{\text{prep}}
  definition: 'time a runtime spends preparing a model call: assembling context, serializing the payload
    and dispatching it'
  kind: scalar
  unit: s
  notes: First term of $\CallLatency$. Not $\HostPreparationTime$, which shares the glyph.
- macro: \CallUsefulWorkTime
  latex: W
  definition: useful execution time one call performs inside its envelope, excluding setup
  kind: scalar
  unit: s
- macro: \CanaryAllocationFraction
  latex: \rho
  definition: share of eligible tasks that a canary's allocation rule assigns to the candidate configuration
  kind: scalar
  unit: dimensionless
  notes: Calendar time to a sequential decision scales as $1/\rho$, and unmeasured harms accrue in proportion
    to it. Not \ServingUtilization nor \CorrelationCoefficient.
- macro: \CanaryLabelDelay
  latex: t_{\text{label}}
  definition: time from a canary task's admission until its acceptance label is available to the sequential
    monitor
  kind: scalar
  unit: s
  notes: Tasks admitted during it, about $\rho\lambda_{\text{arr}}t_{\text{label}}$, are still unlabeled
    when the monitor stops.
- macro: \CandidateAcceptanceEstimate
  latex: \hat{p}_{\text{cand}}
  definition: observed acceptance share of the candidate configuration over the tasks of a paired comparison,
    its accepted count divided by the task count
  kind: scalar
  unit: dimensionless
  notes: Equals $(n_{11}+c)/N$; with \BaselineAcceptanceEstimate it gives the paired difference \EstimatedPairedAcceptanceDifference.
- macro: \CandidateAvailabilityEstimate
  latex: \widehat{q}
  definition: unbiased estimate of pass@k for one task, the share of claim-size subsets of its graded
    runs that contain at least one pass
  kind: scalar
  unit: dimensionless
  notes: Written with the claim size as index, $\CandidateAvailabilityEstimate_k$. Its expectation is
    $1-(1-\AttemptPassProbability)^k$.
- macro: \CandidateAvailabilityProbability
  latex: q
  definition: probability that at least one of a pool of independent candidates passes its check, indexed
    by the pool size or cap
  kind: scalar
  unit: dimensionless
  notes: $q_k=1-(1-p)^k$ for a fixed task; sequential selection reaches the same $q_k$ within a cap of
    $k$. For one task equals pass at k (\PassAtK).
- macro: \CandidateCheckingCost
  latex: v
  definition: cost in dollars of checking one generated candidate against the acceptance criterion
  kind: scalar
  unit: USD
  notes: Enters $C_{\text{eff,batch}}=k(g+v)/q_k$ and $C_{\text{eff,seq}}=(g+v)/p$. Not the verification
    evidence $v_t$ of the agent loop.
- macro: \CandidateDefectRate
  latex: \epsilon
  definition: share of generated candidates that violate the specified property, before any check
  kind: scalar
  unit: dimensionless
  notes: Equals one minus $\ValidCandidateRate$. Not $\PerStepErrorRate$, which shares the glyph.
- macro: \CandidateGenerationCost
  latex: g
  definition: cost in dollars of generating one candidate, before it is checked
  kind: scalar
  unit: USD
  notes: Enters $C_{\text{eff,batch}}=k(g+v)/q_k$ and $C_{\text{eff,seq}}=(g+v)/p$. Not the goal $g$ of
    the agent loop (\DelegatedTaskGoal).
- macro: \CandidateIndex
  latex: i
  definition: position of one candidate within a pool of candidates
  kind: index
  notes: Runs from 1 to $\CandidatePoolSize$.
- macro: \CandidateIntervalLowerLimit
  latex: l_{\text{cand}}
  definition: lower limit of the single-proportion Wilson interval for the candidate configuration's acceptance
    proportion
  kind: scalar
  unit: dimensionless
  notes: Input to Newcombe's paired-difference interval.
- macro: \CandidateIntervalUpperLimit
  latex: u_{\text{cand}}
  definition: upper limit of the single-proportion Wilson interval for the candidate configuration's acceptance
    proportion
  kind: scalar
  unit: dimensionless
  notes: Input to Newcombe's paired-difference interval.
- macro: \CandidateLowerLimitDistance
  latex: \delta^-_{\text{cand}}
  definition: downward distance from the candidate configuration's observed acceptance share to the lower
    limit of its Wilson interval
  kind: scalar
  unit: dimensionless
  notes: Equals $\hat p_{\text{cand}}-l_{\text{cand}}$. One of the four marginal half-widths ($\MarginalLimitDistance$)
    that Newcombe's paired interval combines.
- macro: \CandidateOnlyAcceptedTaskCount
  latex: c
  definition: number of tasks in a paired comparison that the candidate accepts and the baseline does
    not, one of the two discordant counts
  kind: count
  notes: With its counterpart $b$ it forms the discordant pairs of McNemar's test and the paired difference
    $\hat\Delta=(c-b)/N$. Not \QueueServerCount or \VacuumLightSpeed.
- macro: \CandidatePolicyAcceptanceProbability
  latex: p_{Y}
  definition: acceptance probability of the alternative routing policy under consideration
  kind: scalar
  unit: dimensionless
- macro: \CandidatePolicyCost
  latex: C_{Y}
  definition: expected additional monetary cost of the alternative routing policy
  kind: scalar
  unit: USD
- macro: \CandidatePoolSize
  latex: N
  definition: number of candidates generated for one decision in best-of-N sampling, or the breadth of
    concurrent candidate streams
  kind: count
  notes: Sample counts in pass@$k$ use lowercase $k$. A search tree visit count $N(s,a)$ is local to its
    derivation.
- macro: \CandidateRoutingPolicy
  latex: Y
  definition: alternative routing policy compared with a baseline policy by a router
  kind: record
  notes: Names the policy whose quantities carry the subscript Y.
- macro: \CandidateScoringError
  latex: \epsilon
  definition: error a learned scorer adds to one candidate's true utility, independent across candidates
    with zero mean
  kind: scalar
  unit: dimensionless
  notes: Indexed by candidate. Not the per-step error rate $\PerStepErrorRate$, which is a probability.
- macro: \CandidateTailCompletionTime
  latex: \widehat{T}_{c,0.99}
  definition: empirical 99th-percentile task completion time of the candidate configuration across an
    evaluation cohort
  kind: scalar
  unit: s
  notes: A cohort-level estimate compared with a deadline in the release gate, not a per-task timeout.
    Not \TailRequestLatency (serving requests).
- macro: \CandidateToolCallDistribution
  latex: p_{c}
  definition: distribution of the candidate configuration's tool calls over the kinds of tool call, under
    one declared action-counting policy
  kind: distribution
  notes: Compared with \BaselineToolCallDistribution by the Jensen-Shannon divergence.
- macro: \CandidateTrajectoryGoodput
  latex: \mathcal{G}_{c}
  definition: trajectory goodput of the candidate configuration over a declared observation interval
  kind: scalar
  unit: tasks/s
  notes: Compared with \BaselineTrajectoryGoodput within \GoodputRelativeTolerance in the release gate.
    A case of \TrajectoryGoodput.
- macro: \CandidateUpperLimitDistance
  latex: \delta^+_{\text{cand}}
  definition: upward distance from the candidate configuration's observed acceptance share to the upper
    limit of its Wilson interval
  kind: scalar
  unit: dimensionless
  notes: Equals $u_{\text{cand}}-\hat p_{\text{cand}}$. One of the four marginal half-widths ($\MarginalLimitDistance$)
    that Newcombe's paired interval combines.
- macro: \CandidateUtility
  latex: U
  definition: genuine task utility, the true quality, of one candidate, which a scorer estimates with
    error
  kind: scalar
  unit: dimensionless
  notes: Indexed by candidate. Not the unlabeled pool or resource utilization that share the letter elsewhere.
- macro: \CandidateUtilityMean
  latex: \mu
  definition: mean true utility of the candidates in a pool
  kind: scalar
  unit: dimensionless
  notes: Not the service rate $\ServiceRate$, which shares the letter.
- macro: \CandidateUtilityStandardDeviation
  latex: \sigma_{U}
  definition: standard deviation of the true utility of the candidates in a pool
  kind: scalar
  unit: dimensionless
  notes: Exercise 8 models true utility as Gaussian with this spread.
- macro: \CandidateViolationCount
  latex: V_{c}
  definition: number of verified safety or contract violations, such as unauthorized modifications or
    privilege escalations, the candidate configuration incurs in an evaluation cohort
  kind: count
  notes: The release gate requires $V_c=0$; zero observed violations does not establish zero risk. Not
    \ObservedViolationFraction ($V$).
- macro: \CandidateWinCount
  latex: j
  definition: number of discordant pairs won by one configuration, the variable over which the exact McNemar
    tail probability sums
  kind: count
  notes: Runs from zero to the smaller discordant count in the exact two-sided McNemar p-value.
- macro: \CapabilityGrant
  latex: \Gamma
  definition: capability grant, the rights, objects, condition, and expiry that together describe one
    delegated authority
  kind: record
  notes: A tuple, $\CapabilityGrant = (\mathcal{R}_\Gamma, \mathcal{O}_\Gamma, \phi_\Gamma, \GrantExpiryTime)$.
    Derived grants carry a subscript, as in $\CapabilityGrant_{\text{child}} \sqsubseteq \CapabilityGrant_{\text{parent}}$.
    Not $C$, which is always a cost.
- macro: \CascadeGateCost
  latex: g
  definition: mean monetary cost of the acceptance gate at one tier of a model cascade
  kind: scalar
  unit: USD
  notes: Indexed by tier, $g_j$.
- macro: \CascadeGateDuration
  latex: v
  definition: mean duration of the acceptance gate at one tier of a model cascade
  kind: scalar
  unit: s
  notes: Indexed by tier, $v_j$.
- macro: \CascadeTaskCost
  latex: C_{\text{cascade}}
  definition: monetary cost of one task through a gated model cascade, every reached tier's generation
    and gate
  kind: scalar
  unit: USD
- macro: \CascadeTaskDuration
  latex: T_{\text{cascade}}
  definition: elapsed time of one task through a serial gated model cascade
  kind: scalar
  unit: s
- macro: \CascadeTierCost
  latex: c^{\text{tier}}
  definition: mean monetary cost of generation and associated execution at one tier of a model cascade,
    conditional on the task reaching that tier, excluding its acceptance gate
  kind: scalar
  unit: USD
  notes: Indexed by tier, $\CascadeTierCost_j$. The gate cost is \CascadeGateCost.
- macro: \CascadeTierDuration
  latex: t
  definition: mean duration of the generation step at one tier of a model cascade, conditional on the
    task reaching that tier, excluding its acceptance gate
  kind: scalar
  unit: s
  notes: Indexed by tier, $t_j$. The gate duration is \CascadeGateDuration.
- macro: \CascadeTierIndex
  latex: j
  definition: position of one tier in a model cascade, counted from one for the cheapest tier
  kind: index
- macro: \CatalogDefinitionTokens
  latex: S_{\text{catalog}}
  definition: total tokens of tool definitions a staging policy sends across all its model calls, excluding
    other request content
  kind: scalar
  unit: tokens
  notes: 'Fixed catalog: $\CatalogStagingCallCount \cdot \StagedDefinitionCount \cdot \DefinitionSerializedSize$;
    on-demand staging sums the per-call products.'
- macro: \CatalogStagingCallCount
  latex: N
  definition: number of model calls whose requests stage tool definitions, over which a catalog's token
    cost is counted
  kind: count
  notes: Multiplies the per-call catalog cost in $\CatalogDefinitionTokens = \CatalogStagingCallCount
    \cdot \StagedDefinitionCount \cdot \DefinitionSerializedSize$.
- macro: \CategoryRecordCount
  latex: n
  definition: number of retained records in one trajectory category of a curated corpus
  kind: count
  notes: Indexed by category, $n_j$; multiplies the per-record means into $V_j$ and $W_j$.
- macro: \CheapConfigurationAttemptCost
  latex: c_{\text{small}}
  definition: all-in monetary cost of one attempt by the cheaper, lightweight agent configuration
  kind: scalar
  unit: USD
- macro: \CheapConfigurationPassProbability
  latex: p_{\text{small}}
  definition: probability that one attempt by the cheaper, lightweight agent configuration is accepted
  kind: scalar
  unit: dimensionless
- macro: \CheckIntervalStepCount
  latex: m
  definition: number of generation steps between consecutive verification checks, the size of one checked
    block
  kind: count
  notes: Its optimum is $m^*$; both cadence models pick it, under different loss assumptions. Not \PositionLossMask
    ($m_t$).
- macro: \CheckPassProbability
  latex: p^{\text{chk}}
  definition: probability that one admission predicate passes a candidate record, conditional on every
    earlier predicate in the route having passed
  kind: scalar
  unit: dimensionless
  notes: Indexed by position, $\CheckPassProbability_i$; $1-\CheckPassProbability_i$ is the predicate's
    rejection probability, and ordering by $T_i/(1-\CheckPassProbability_i)$ minimizes expected checking
    time. Not $\AttemptPassProbability$, which is per task attempt.
- macro: \CheckSlotTime
  latex: T
  definition: expected verifier slot time one admission predicate consumes for a record that reaches it
  kind: scalar
  unit: s
  notes: Indexed by position, $T_i$. Summed with reach probabilities into $\ExpectedCheckingTime$; $T_i/(1-p_i)$
    is the cost per rejection.
- macro: \CheckWindowTurnCount
  latex: w
  definition: number of turns in one check window, the spacing between consecutive checks on a trajectory
  kind: count
  notes: Exercise variable; the trajectory needs about $\TurnHorizon/w$ checks.
- macro: \CheckpointLogPosition
  latex: j_{\text{ckpt}}
  definition: authoritative log position to which a published checkpoint binds its record and workspace
    snapshots
  kind: index
  notes: A log position like j, not a turn index.
- macro: \CheckpointOrdinalIndex
  latex: m
  definition: position of one checkpoint among those a trajectory publishes, counted from one
  kind: index
- macro: \CheckpointOverheadRatio
  latex: w
  definition: approximate overhead per unit of useful execution time from checkpoint writes, lost work
    and restarts, as a function of the checkpoint interval
  kind: function
  unit: dimensionless
  notes: Written $w(\CheckpointInterval)$; $w'$ and $w''$ are its derivatives. Compare \CheckpointWasteFraction
    ($W$), a fraction of total training time.
- macro: \CheckpointRecoveryOverheadTime
  latex: T_{\text{overhead}}
  definition: total time a trajectory loses over a failure trace to checkpoint pauses, checkpoint restores
    and suffix reconstruction, as a function of the checkpoint stride
  kind: scalar
  unit: s
  notes: Not the codec overhead \CodecOverheadTime, nor the per-checkpoint consolidation overhead \ConsolidationOverheadTime.
- macro: \CheckpointRestoreTime
  latex: T_{\text{restore}}
  definition: fixed time to restore the latest checkpoint after one crash, before any suffix reconstruction
  kind: scalar
  unit: s
  notes: Not the training checkpoint load time \CheckpointLoadTime.
- macro: \CheckpointStride
  latex: k
  definition: number of turns between consecutive checkpoints of a trajectory, the checkpoint stride
  kind: count
  notes: Counted in turns; the seconds-based checkpoint interval is \CheckpointInterval. k^\ast is the
    stride that minimizes overhead.
- macro: \CheckpointSuffixReadTime
  latex: T_{\text{read}}
  definition: time to fetch and verify a trajectory's checkpoint and its log suffix during resume
  kind: scalar
  unit: s
  notes: Not the storage or weight read times \StorageReadTime and \PerDeviceWeightReadTime.
- macro: \ChildBatchSize
  latex: n_{\text{batch}}
  definition: number of children a search step proposes in parallel in one round when it needs only one
    surviving child
  kind: count
  notes: Fewer rounds than one-at-a-time proposal at the price of more generated children.
- macro: \ChildBudgetAllocation
  latex: C_{\max,C}
  definition: monetary allocation one delegated child node's ledger holds as its ceiling, set to the amount
    its parent delegated
  kind: scalar
  unit: USD
  notes: Child case of the node allocation $C_{\max,k}$ (\CostCeiling indexed by node).
- macro: \ChildCapabilityGrant
  latex: \Gamma_{\text{child}}
  definition: capability grant derived from a parent grant, which may permit no more than its parent
  kind: record
  notes: 'Attenuation: $\ChildCapabilityGrant \sqsubseteq \ParentCapabilityGrant$.'
- macro: \ChildFreeBalance
  latex: F_{C}
  definition: unreserved monetary balance of one delegated child node's ledger
  kind: scalar
  unit: USD
  notes: Child case of \LedgerFreeBalance.
- macro: \ChildPruningProbability
  latex: p_{\text{prune}}
  definition: probability that an intermediate check prunes one proposed child of a search node, independently
    of its siblings
  kind: scalar
  unit: dimensionless
  notes: Not the weight-pruning threshold $\PruningThreshold$.
- macro: \ChildReservedFunds
  latex: R_{C}
  definition: monetary funds one delegated child node's ledger withholds for its outstanding operations
    and descendants
  kind: scalar
  unit: USD
  notes: Child case of \LedgerReservedFunds.
- macro: \ChildSettledCharges
  latex: E_{C}
  definition: gross monetary charges settled into one delegated child node's budget ledger
  kind: scalar
  unit: USD
  notes: Child case of \LedgerSettledCharges.
- macro: \CleanupGraphEdgeSet
  latex: E
  definition: set of directed edges of a cleanup graph, each requiring one cleanup operation to settle
    before another dispatches
  kind: set
  notes: Must be acyclic; a cycle is a contradictory recovery requirement for an operator.
  render_exception: Graph theory writes an edge set as italic $E$, as $\BufferDependencyEdgeSet$ does.
- macro: \CleanupGraphVertexSet
  latex: V
  definition: set of vertices of a cleanup graph, one per admitted cleanup operation
  kind: set
  notes: With $\CleanupGraphEdgeSet$ forms the directed acyclic cleanup graph $(\CleanupGraphVertexSet,
    \CleanupGraphEdgeSet)$.
  render_exception: Graph theory writes a vertex set as italic $V$, as $\BufferDependencyVertexSet$ does.
- macro: \ClippedSurrogateObjective
  latex: \mathcal{M}
  definition: 'per-token clipped surrogate: the smaller of the ratio-weighted coefficient and its clipped
    counterpart'
  kind: scalar
  unit: dimensionless
  notes: Indexed by rollout and token, $\mathcal{M}_{i,t}(\ModelParameters)$. Zero for every token of
    a zero-contrast group.
- macro: \ClosureOperator
  latex: \mathcal{I}
  definition: runtime's check that maps each proposed action and the current system state to a permitted
    action or a rejection
  kind: function
  notes: '$\mathcal{I}: \mathcal{A}_{\text{prop}} \times \mathcal{X}_{\text{sys}} \to \mathcal{A}_{\text{perm}}
    \cup \{\ProposalRejection\}$.'
- macro: \CoarseCellCount
  latex: C
  definition: number of coarse cells, each with its centroid and inverted list, into which an inverted-file
    vector index partitions its vectors
  kind: count
  notes: A query compares against all $C$ centroids, then scans \ProbedCellCount cells.
- macro: \CoherencyCoefficient
  latex: \kappa_{\text{coh}}
  definition: universal scalability law's cost of pairwise reconciliation between workers
  kind: scalar
  unit: dimensionless
  notes: Multiplies $\WorkerCount(\WorkerCount-1)$ in $\text{Speedup}(\WorkerCount) = \WorkerCount/\big(1
    + \ContentionCoefficient(\WorkerCount-1) + \CoherencyCoefficient\,\WorkerCount(\WorkerCount-1)\big)$.
  aliases:
  - \ContentionAndCoherencyCoefficientsTwo
  - \CoherencyContentionCoefficient
- macro: \ColdResetCycleTime
  latex: T_{\text{cycle,cold}}
  definition: environment-slot cycle time when each episode ends with a cold reset
  kind: scalar
  unit: s
  notes: Compared with $T_{\text{cycle,snap}}$ in the reset-cost notebook.
- macro: \CollectionCohortCost
  latex: C_{\text{cohort}}
  definition: 'total monetary spend of one collection cohort up to an accounting cutoff: environments,
    generation, sandboxes, verification, review, redaction and storage'
  kind: scalar
  unit: USD
  notes: Includes unproductive runs and rejected proposals; divided by $\EmittedArtifactCount$ it gives
    $\CostPerEmittedArtifact$.
- macro: \CompactedContextLength
  latex: S_{\text{comp}}
  definition: number of input tokens in a context after compaction replaces earlier turns with a summary
  kind: count
- macro: \CompactionBoundaryCount
  latex: k
  definition: number of successive compaction boundaries over which retention is measured
  kind: count
  notes: Argument of $\ConstraintRetentionFraction$; with independent per-round loss, survival is $(1-\CompactionLossProbability)^{\CompactionBoundaryCount}$.
- macro: \CompactionBoundaryIndex
  latex: i
  definition: position of one compaction boundary in a trajectory, counted from one
  kind: index
  notes: Runs from 1 to $\CompactionBoundaryCount$ in the constraint-retention product.
- macro: \CompactionCycleTurnCount
  latex: n_{\text{cycle}}
  definition: number of task turns between successive compaction passes
  kind: count
  notes: Under a fixed per-turn append, $\CompactionCycleTurnCount = \lceil (\CompactionTriggerLength
    - \CompactionTargetLength)/\TurnAppendLength \rceil$.
- macro: \CompactionCycleTurnIndex
  latex: i
  definition: position of one task turn within a compaction cycle, counted from one
  kind: index
  notes: Runs from 1 to $\CompactionCycleTurnCount$; indexes $\TaskTurnCost$.
- macro: \CompactionLossProbability
  latex: \rho
  definition: probability that one compaction round independently loses a given required constraint or
    fact
  kind: scalar
  unit: dimensionless
  notes: Survival across $\CompactionBoundaryCount$ rounds is $(1-\CompactionLossProbability)^{\CompactionBoundaryCount}$.
    Not utilization.
- macro: \CompactionPassCost
  latex: C_{\text{comp}}
  definition: total monetary cost of one compaction pass, billed on the same boundary as a task turn
  kind: scalar
  unit: USD
  notes: Amortized over $\CompactionCycleTurnCount$ turns in $\AmortizedTurnCost$.
- macro: \CompactionPathCost
  latex: C_{\text{compact}}
  definition: remaining token cost of a trajectory that compacts its context, as a function of the remaining
    call count
  kind: function
  unit: USD
- macro: \CompactionPaybackCallCount
  latex: N_{\min}
  definition: fewest remaining calls, including the first compacted one, for which compaction costs no
    more than keeping the full context
  kind: count
- macro: \CompactionPerCallSaving
  latex: s
  definition: monetary saving on each call after the first compacted one, the cached-input price of the
    tokens compaction removed
  kind: scalar
  unit: USD
- macro: \CompactionTargetLength
  latex: S_{\text{low}}
  definition: serialized input length, in tokens, that a compaction pass reduces the request to, the low
    watermark
  kind: count
  notes: The gap $\CompactionTriggerLength - \CompactionTargetLength$ sets the compaction cadence.
- macro: \CompactionTriggerLength
  latex: S_{\text{high}}
  definition: serialized input length, in tokens, at which the runtime triggers a compaction pass, the
    high watermark
  kind: count
  notes: 'Satisfies $\CompactionTargetLength < \CompactionTriggerLength \le \ContextWindow - \OutputLimit$.
    A soft threshold: the request can overshoot it by up to $\TurnAppendLength - 1$ tokens.'
- macro: \CompactionUpfrontCost
  latex: U
  definition: 'one-time extra cost of compacting a context relative to keeping it: the summary''s output
    tokens plus re-sending the compacted context as fresh input'
  kind: scalar
  unit: USD
- macro: \ComparisonArmTrialCount
  latex: n_{\text{arm}}
  definition: number of independent trials in each arm of a two-arm comparison
  kind: count
  notes: The planned value that solves the power relation is \TasksPerComparisonArm. Used outside a subscript,
    so it is a symbol here.
- macro: \ComparisonContext
  latex: c
  definition: shared context and evaluation criterion under which two trajectory records are compared
  kind: record
  notes: Conditions both reference-relative scores, $\Delta_\theta(\tau;c)$. Not \TurnContext.
- macro: \CompensatedEnvironmentState
  latex: \sigma_0'
  definition: state of the environment after a saga forward step and its compensating step have both executed
  kind: record
  notes: Differs from $\PreForwardEnvironmentState$ in time, audit trails and billing; compensation succeeds
    when the two agree on every predicate in $\CompensationPostconditionSet$.
- macro: \CompensationPostcondition
  latex: \phi
  definition: one declared postcondition predicate of a compensation contract, true or false of an environment
    state
  kind: function
  notes: An element of $\CompensationPostconditionSet$, applied to $\PreForwardEnvironmentState$ and $\CompensatedEnvironmentState$.
- macro: \CompensationPostconditionSet
  latex: \Phi
  definition: declared set of postcondition predicates on which a compensation claims to restore the environment
  kind: set
  notes: A compensation contract claims only these predicates; billing ledgers and audit histories lie
    outside it. Not the standard normal CDF.
  render_exception: Upright capital Greek is the chapter's established glyph for the predicate set, as
    $\Phi$ is conventional for a family of predicates.
- macro: \CompletionCriteria
  latex: \mathcal{K}_{\text{comp}}
  definition: set of checks that decide when a task is done, at a stated closure evidence level
  kind: set
  notes: Fifth element of the task contract $\TaskContract$. The model's claim of completion is never
    one of them.
- macro: \CompletionDeadline
  latex: T_{\text{deadline}}
  definition: time by which a call, cycle, or task must complete
  kind: scalar
  unit: s
  notes: Inside the trajectory budget $\TrajectoryBudget$ the elapsed-time allowance is its own symbol,
    $\TrajectoryTimeLimit$. In real-time scheduling, the relative deadline $D_i$ of task $i$ is this quantity
    for that task.
  aliases:
  - \TaskDeadline
  - \Deadline
- macro: \ConcordantTaskCount
  latex: n
  definition: number of sampled tasks on which the baseline and candidate configurations receive the same
    verdict in a paired comparison
  kind: count
  notes: 'Always written with a two-digit index giving the baseline then candidate outcome: $\ConcordantTaskCount_{11}$
    accepted by both, $\ConcordantTaskCount_{00}$ by neither. The discordant cells are $\BaselineOnlyAcceptedTaskCount$
    and $\CandidateOnlyAcceptedTaskCount$.'
- macro: \ConcurrentTrajectories
  latex: N_{\text{traj}}
  definition: mean number of admitted trajectories present at once
  kind: count
  notes: Little's law for trajectories, $\ConcurrentTrajectories = \TrajectoryAdmissionRate\,\mathbb{E}[\TrajectoryDuration]$.
- macro: \ConditionalDamageProbability
  latex: p
  definition: true conditional probability that a proposed action produces the modeled damaging outcome,
    given observable features
  kind: function
  unit: dimensionless
  notes: Written with its arguments, $\ConditionalDamageProbability(\InputFeatureVector,\PolicyAction)$;
    $\EstimatedDamageProbability$ estimates it.
- macro: \ConfidentialityLabel
  latex: \kappa
  definition: set of recipients permitted to receive a record
  kind: function
  notes: Written with its record, $\kappa(x)$. The release check is $r \in \ConfidentialityLabel$; combining
    records intersects their labels. Not $\InterAnnotatorAgreement$.
  aliases:
  - \Confidentiality
- macro: \ConsolidationOverheadTime
  latex: T_{\text{overhead}}
  definition: expected time lost per checkpoint to consolidating an incremental delta chain into a new
    base plus the expected restore of the chain, as a function of the consolidation period
  kind: scalar
  unit: s
  notes: Not the trace total \CheckpointRecoveryOverheadTime.
- macro: \ConsolidationStride
  latex: c
  definition: number of incremental checkpoints between consolidations of a delta chain into a new full
    base
  kind: count
  notes: The chain holds between 1 and c deltas; c^\ast minimizes overhead.
- macro: \ConstantDivisorGrpoObjective
  latex: \widehat{\mathcal{J}}_{\text{const}}
  definition: sampled GRPO objective that divides by one constant length shared across the group instead
    of each rollout's own token count
  kind: function
  unit: dimensionless
  notes: 'Removes the length bias of $\GrpoSampledObjective$: every token''s weight is proportional to
    its rollout''s coefficient alone.'
- macro: \ConstrainedCallLatency
  latex: T_{\text{constrained}}
  definition: latency of generating a tool call under constrained decoding, per-token decode time plus
    per-token masking time over every output token
  kind: scalar
  unit: s
  notes: Equals $\OutputLength\,(\PerTokenDecodeTime + \PerTokenMaskingTime)$; omits schema compilation
    and setup costs.
- macro: \ConstrainedDecodingAutomaton
  latex: \mathcal{D}
  definition: deterministic finite automaton over bytes that tracks whether a generated prefix can still
    complete to a string of the permitted output language
  kind: record
  notes: $\mathcal{D}=\langle Q,\Sigma,\delta,q_0,F\rangle$. Applies to regular subsets or explicitly
    bounded structures; unbounded nesting needs parser state. Not \DecodeRequestSet.
- macro: \ConstraintRetentionFraction
  latex: \eta_{\mathcal{C}}
  definition: fraction of a set of critical constraints retained without interruption across a number
    of compaction boundaries
  kind: function
  unit: dimensionless
  notes: Written $\ConstraintRetentionFraction(\CompactionBoundaryCount)$. The chapter's subscript is
    the macro \TaskContract, which renders \mathcal{C}; the whole decorated form becomes this entry.
- macro: \ContentionCoefficient
  latex: \sigma_{\text{cont}}
  definition: universal scalability law's share of work that serializes across workers
  kind: scalar
  unit: dimensionless
  notes: Multiplies $(\WorkerCount-1)$ in the universal scalability law; the pairwise term is $\CoherencyCoefficient$.
  aliases:
  - \ContentionAndCoherencyCoefficients
- macro: \ContextWindow
  latex: S_{\max}
  definition: hard per-call limit on prompt and output tokens together
  kind: count
  notes: Admission requires $\SequenceLength \le \ContextWindow - \OutputLimit$.
- macro: \ContinuationCount
  latex: K
  definition: number of independent continuations sampled from one fork condition in reinforcement learning
  kind: count
  notes: Elsewhere $K$ is output length $\OutputLength$.
- macro: \ContinuationIndex
  latex: i
  definition: position of one sampled continuation among those launched from a fork condition
  kind: index
  notes: Runs from 1 to $\ContinuationCount$; written as a parenthesized superscript, $\TrajectoryReward^{(i)}$.
- macro: \ContinuationReturnStandardDeviation
  latex: \sigma
  definition: standard deviation of the bounded return of one sampled continuation
  kind: scalar
  unit: dimensionless
  notes: At most one half for a binary return, so the mean of $\ContinuationCount$ continuations has standard
    error at most $1/(2\sqrt{\ContinuationCount})$.
- macro: \ContinuityCorrectedCrossProduct
  latex: A
  definition: numerator of the paired-verdict correlation, the concordant-minus-discordant cross product
    with a continuity correction when it is positive
  kind: scalar
  unit: dimensionless
  notes: A product of counts, so dimensionless. Not the advantage.
- macro: \ControllerReactionDelay
  latex: T_{\text{react}}
  definition: time the staging admission controller needs to stop dispatch after the high watermark is
    crossed
  kind: scalar
  unit: s
  notes: Staging keeps growing at the net arrival rate for this long after the watermark.
- macro: \CoordinationOverhead
  latex: h
  definition: added elapsed time of splitting work across workers, as a fraction of serial time
  kind: function
  unit: dimensionless
  notes: Always written with its argument, $\CoordinationOverhead(\WorkerCount)$, in $\text{Speedup} =
    1/[(1-\ParallelFraction) + \ParallelFraction/\WorkerCount + \CoordinationOverhead(\WorkerCount)]$.
    Distinct from the interaction history $h_k$.
- macro: \CorrectCandidateTrialPassProbability
  latex: p_{g}
  definition: probability that a fixed correct candidate passes one verification trial
  kind: scalar
  unit: dimensionless
  notes: The all-pass rule rejects it with probability $1-p_g^{n_{\text{trial}}}$.
- macro: \CorrectnessReward
  latex: R_{\text{corr}}
  definition: binary outcome of the correctness check on a fully assessed trajectory, one for pass and
    zero for fail
  kind: scalar
  unit: dimensionless
  notes: The core term of a shaped reward $\TrajectoryReward = R_{\text{corr}} + \FormatRewardWeight\Phi
    - \LengthPenaltyWeight\,\text{len}$. Unresolved when a required check did not run.
- macro: \CostBudgetUsedFraction
  latex: \rho_C
  definition: fraction of a trajectory's dollar allowance already spent or reserved
  kind: scalar
  unit: dimensionless
  notes: Settled spend plus outstanding reservations over $\CostCeiling$. One of the four budget fractions
    whose maximum steers staged intervention.
- macro: \CostCeiling
  latex: C_{\max}
  definition: dollar ceiling on a trajectory that the runtime enforces before dispatching the next call
  kind: scalar
  unit: USD
  notes: Last element of the trajectory budget $\TrajectoryBudget$.
- macro: \CostPerAcceptedTask
  latex: C_{\text{eff}}
  definition: total spend on all attempts in a cohort divided by the number of accepted tasks
  kind: scalar
  unit: USD/task
  notes: $\CostPerAcceptedTask = \sum_{i=1}^{\InitiatedTasks} \TaskCost_i/\AcceptedTasks$; failed attempts
    are paid for in full. Undefined when no task is accepted. With independent retries it equals $\mathbb{E}[\AttemptCost]/\AcceptanceProbability$.
  aliases:
  - \CostPerAcceptedTaskEff
- macro: \CostPerEmittedArtifact
  latex: C_{\text{emit}}
  definition: total cohort spend divided by the number of valid artifacts emitted for one consumer
  kind: scalar
  unit: USD/item
  notes: 'Mirrors $\CostPerAcceptedTask$: attempt cost divided by end-to-end emission yield. Defined only
    when $\EmittedArtifactCount > 0$.'
- macro: \CostToGoFunction
  latex: Q
  definition: expected cost from a step through the horizon after taking an action in a state and then
    following a given policy
  kind: function
  unit: dimensionless
  notes: Written with the step as subscript and the continuing policy as superscript, $Q_t^{\pi^*}(s,a)$.
    Cost form of \ExpectedActionReturn.
- macro: \CountedFailureIndicator
  latex: e
  definition: indicator that one classified call outcome counts as an infrastructure failure against a
    breaker's scope
  kind: scalar
  unit: dimensionless
  notes: One or zero, indexed by call; client-side errors such as validation or permission failures count
    as zero. Not Euler's number.
- macro: \CreditWindowCapacity
  latex: N_{\text{win}}
  definition: fixed number of credits a credit-based flow-control channel holds, its bound on admitted
    in-flight items
  kind: count
  notes: 'Conserved: $\FreeCreditCount+\OutstandingItemCount=\CreditWindowCapacity$. A saturated window
    gives mean residence $\CreditWindowCapacity/\ServiceRate$.'
- macro: \CriticReturnEstimate
  latex: V_{\phi}
  definition: remaining-return estimate a learned critic network with parameters phi predicts for an interaction
    history
  kind: scalar
  unit: dimensionless
  notes: The baseline of PPO; GRPO replaces it with the group mean reward. A learned counterpart of the
    sampled estimate $\EstimatedRemainingReturn$.
- macro: \CriticalConstraint
  latex: c
  definition: one critical constraint drawn from the task contract, such as a negative scope of the goal
    or a limit on a permitted action
  kind: record
  notes: Element of the constraint set summed over in $\ConstraintRetentionFraction$.
- macro: \CriticalPathDuration
  latex: T_{\text{crit}}
  definition: duration of the longest source-to-sink path through a dependency graph, summing the durations
    of the vertices on it
  kind: scalar
  unit: s
  notes: A lower bound on makespan however many workers run, since sequential dependencies cannot overlap.
- macro: \CumulativeLogLikelihoodRatio
  latex: \Lambda
  definition: cumulative log-likelihood ratio of the specified degradation against the baseline after
    the labels observed so far in a sequential test
  kind: scalar
  unit: dimensionless
  notes: Indexed by label count, $\CumulativeLogLikelihoodRatio_n$, or by the stopping count.
- macro: \CumulativeWorkCost
  latex: C
  definition: cumulative cost of the work a search has admitted so far, indexed by the number of admitted
    units
  kind: scalar
  unit: USD
  notes: Indexed as ${C}_{\AdmittedWorkUnitCount}$. The exercise prices it in dollars; tokens or time
    work if the stopping threshold uses the same unit.
- macro: \CurrentStateDigest
  latex: h_{\text{state},t}
  definition: digest of the canonicalized workspace projection captured at the current observation step
  kind: record
  notes: A cryptographic or stable non-cryptographic hash; equality with an earlier digest is evidence
    of state recurrence, not proof of a loop.
- macro: \DamageProbabilityTolerance
  latex: \epsilon
  definition: largest true conditional damage probability at which a policy allows automatic execution
  kind: scalar
  unit: dimensionless
  notes: Not the per-step error rate.
- macro: \DamageProbabilityUpperBound
  latex: p_U
  definition: upper confidence bound on the conditional probability that an action produces the modeled
    damage
  kind: scalar
  unit: dimensionless
  notes: Replacing the estimate by it gives a conservative cost comparison only on the event that the
    bound covers.
- macro: \DamagingOutcomeIndicator
  latex: Y
  definition: binary indicator that a proposed action would produce the modeled damaging outcome if executed
    automatically
  kind: scalar
  unit: dimensionless
  notes: Zero means that particular damage does not occur, not that the task succeeds. Not the fairness
    chapter's true outcome.
- macro: \DecisionProcessState
  latex: s
  definition: complete environment state of a decision process, including interaction history and variables
    the agent cannot observe
  kind: record
  notes: The unindexed form of \EnvironmentState. A policy is viewed as a map from these states to actions.
    A record, not a number.
- macro: \DecisionStepIndex
  latex: k
  definition: position of one decision step in a finite-horizon episode, counted from zero to one less
    than the horizon
  kind: index
  notes: Indexes the interaction history, action and reward of the learning chapters ($h_k$, $a_k$, $r_k$).
    The trajectory chapters count turns with \TurnIndex.
- macro: \DecodeInterval
  latex: T_{\text{decode}}
  definition: time a call spends generating its whole output
  kind: scalar
  unit: s
  notes: $\DecodeInterval(\OutputLength) \approx \OutputLength\,\PerTokenDecodeTime$ at a stable per-token
    step time; one term of $\CallLatency$.
- macro: \DecodingConstraintState
  latex: q
  definition: state of the parser or output-constraint automaton that constrains decoding, indexed by
    decoding step
  kind: record
  notes: $q_0$ is the initial state and $q_t$ the state at step $t$. 02_foundation_model writes the parser
    state $q_t$ with the same meaning, including nested scope for recursive grammars.
- macro: \DedicatedHourlyFixedCost
  latex: C_{\text{fixed}}
  definition: 'complete hourly fixed cost of a dedicated deployment: amortized hardware leases, failover
    headroom and operations'
  kind: scalar
  unit: USD/h
- macro: \DedicatedVariableTokenCost
  latex: c_{\text{ded}}
  definition: variable operating cost per output token on a dedicated deployment
  kind: scalar
  unit: USD/token
- macro: \DefectiveActionProbability
  latex: p_{\text{bad}}
  definition: probability that one proposed action, such as a fleet configuration change, is wrong
  kind: scalar
  unit: dimensionless
  notes: For one action, $\ExpectedIrreversibleLoss = \DefectiveActionProbability\,\text{consequence}(a)\,(1-\PrePivotCatchRate\,\RevertFidelity)$.
- macro: \DefinitionSerializedSize
  latex: S
  definition: mean number of tokens one staged tool definition contributes to the final serialized request
  kind: scalar
  unit: tokens
  notes: Depends on the tokenizer and serialization convention, including shared framing. Written with
    a call index for on-demand staging. Not the prompt length or request output length.
- macro: \DelegatedAllocationAmount
  latex: b
  definition: monetary amount a parent node delegates to one child, moved from the parent's free balance
    into its reservations
  kind: scalar
  unit: USD
- macro: \DelegatedTaskGoal
  latex: g
  definition: delegated task and its completion rule, fixed for the trajectory
  kind: record
  notes: Written $g$ in the agent loop; the task contract writes the same goal $\TaskContractGoal$. Text,
    not a number.
  aliases:
  - \Goal
- macro: \DelegationTokenMultiple
  latex: r
  definition: ratio of the tokens a delegated multi-agent design spends per attempt to the tokens a single
    agent spends per attempt
  kind: scalar
  unit: dimensionless
  notes: With cost proportional to tokens, delegation lowers $\CostPerAcceptedTask$ only if acceptance
    rises by more than this factor.
- macro: \DemandCap
  latex: x_{\max}
  definition: finite cap on a modeled demand, such as an enforced turn limit, above which demand is not
    admitted
  kind: scalar
  unit: varies
  notes: Same unit as \ParetoTaskDemand; the capped variable has finite moments.
- macro: \DemandThreshold
  latex: x
  definition: demand level at which a tail probability is evaluated
  kind: scalar
  unit: varies
  notes: Same unit as \ParetoTaskDemand; $x\ge x_{\min}$.
- macro: \DependencyGraphEdgeSet
  latex: E
  definition: set of directed edges of a task-precedence graph, each meaning the head vertex needs a precondition
    the tail vertex supplies
  kind: set
  notes: Not energy.
  render_exception: Graph theory writes the vertex and edge sets of G = (V, E) as plain italic capitals.
- macro: \DependencyGraphVertex
  latex: v
  definition: one vertex of a task-precedence graph, a bounded unit of execution that occupies one worker
    slot
  kind: record
  notes: Numbered vertices $v_1, v_2, \dots$ name the nodes of a specific plan. Not a version or a velocity.
- macro: \DependencyGraphVertexSet
  latex: V
  definition: set of vertices of a task-precedence graph, each a bounded unit of execution such as an
    agent trajectory or a runtime check
  kind: set
  notes: With $\DependencyGraphEdgeSet$ it forms the DAG $(V,E)$ of a delegated plan.
  render_exception: Graph theory writes the vertex and edge sets of G = (V, E) as plain italic capitals.
- macro: \DepthCriticalPathLatency
  latex: T^{\text{depth}}
  definition: critical-path latency of one decision when test-time compute extends a single candidate
    along the depth axis
  kind: scalar
  unit: s
  notes: Prefill plus the extended decode, $\PrefillTime + K_{\text{ext}}\PerTokenDecodeTime$.
- macro: \DerivedMemoryEntry
  latex: c
  definition: derived memory entry, such as a summary, embedding or consolidated lesson, whose validity
    is tracked by source generation
  kind: record
  notes: Argument of $\MemoryEntryBirthGeneration$ and $\MemoryEntryDeathGeneration$. A record, not a
    number.
- macro: \DerivedRecord
  latex: y
  definition: record a transformation derives from labeled input records, carrying the union of their
    provenance and the intersection of their confidentiality labels
  kind: record
  notes: Inputs are $\LabeledRecord_i$, $i = 1, \dots, \TransformationInputCount$. $\IntegrityProvenance(\DerivedRecord)
    = \bigcup_i \IntegrityProvenance(\LabeledRecord_i)$.
- macro: \DeviationDisadvantage
  latex: u
  definition: largest extra expected cost of one deviation from the reference action followed by reference
    recovery, at any learner-reachable state
  kind: scalar
  unit: dimensionless
  notes: An assumption about the task, in normalized cost units; the learner-state bound is linear in
    the horizon only while it stays independent of the horizon. Not \ApiAccount or \ChainRuleIntermediate.
- macro: \DiscordantPairCount
  latex: n_{\text{disc}}
  definition: number of paired tasks on which exactly one of the two compared configurations is accepted,
    the sum of the two discordant counts
  kind: count
  notes: Under the McNemar null the candidate's wins among them are Binomial($n_{\text{disc}}$, 1/2).
- macro: \DiscordantPairFraction
  latex: \psi
  definition: share of paired tasks on which exactly one of the two compared configurations is accepted
  kind: scalar
  unit: dimensionless
  notes: Sets the paired variance $(\psi-\Delta^2)/N$; estimated by $(b+c)/N$.
- macro: \DiscountFactor
  latex: \gamma
  definition: factor by which a reward arriving one turn later is weighted in the return, between zero
    and one
  kind: scalar
  unit: dimensionless
  notes: One means undiscounted, the setting of the reinforcement-learning chapter. Not \AdapterScalingFactor
    or \AccuracyDecayRate, which share the glyph.
- macro: \DispatchedTrajectorySet
  latex: \mathcal{T}_{\text{all}}
  definition: set of every trajectory dispatched
  kind: set
  notes: Calligraphic $\mathcal{T}$ with a subscript always names a set of trajectories; the verified
    subset is $\VerifiedTrajectorySet$.
  aliases:
  - \TrajectorySetsAll
- macro: \DispreferredReferenceRelativeScore
  latex: \Delta_l
  definition: reference-relative score of the dispreferred trajectory record of one comparison pair
  kind: scalar
  unit: dimensionless
  notes: Shorthand for $\Delta_\theta(\tau_l;c)$.
- macro: \DispreferredTrajectory
  latex: \tau_l
  definition: trajectory record ranked lower in one preference comparison
  kind: record
  notes: Scored only to form a negative contrast, never an imitation target. Pairs with \PreferredTrajectory.
- macro: \DocumentPayloadFraction
  latex: q
  definition: fraction of retrievable untrusted documents that carry an injected payload, each read treated
    as an independent draw
  kind: scalar
  unit: dimensionless
  notes: Per document. The per-turn rate is $\TurnPayloadProbability$, with $\TurnPayloadProbability =
    1-(1-\DocumentPayloadFraction)^{\TurnReadCount}$; screening multiplies it by $\ScreeningMissRate$.
- macro: \DpoLoss
  latex: \mathcal{L}_{\text{DPO}}
  definition: direct preference optimization loss, the expected negative log-sigmoid of the scaled difference
    of reference-relative scores over comparison pairs
  kind: function
  unit: dimensionless
  notes: $-\mathbb{E}\log\sigma(\beta[\Delta_\theta(\tau_w;c)-\Delta_\theta(\tau_l;c)])$ over \PreferencePairDataset.
- macro: \DuplicateEffectProbability
  latex: p_{\text{dup}}
  definition: probability that one blind retry of a non-idempotent call applies its effect twice
  kind: scalar
  unit: dimensionless
  notes: Without deduplication, $(1-\RequestLossProbability)\,\ReplyLossProbability\,(1-\RequestLossProbability)$.
  aliases:
  - \DuplicateeffectProbability
- macro: \EarlierWorkerCount
  latex: k
  definition: number of workers that have already chosen their write sets when the next worker chooses,
    the running index of the write-collision product
  kind: count
  notes: Worker $k+1$ must avoid the $kw$ files the earlier workers wrote.
- macro: \EditGrantRights
  latex: \mathcal{R}_{\Gamma_{\text{edit}}}
  definition: set of operations the edit-phase capability grant permits
  kind: set
- macro: \EditPhaseCapabilityGrant
  latex: \Gamma_{\text{edit}}
  definition: capability grant for the edit phase of a repair, read and write over the repository
  kind: record
  notes: Parent of the test and scan grants in the attenuation example.
- macro: \EffectiveApiOutputTokenPrice
  latex: c_{\text{API}}
  definition: effective per-token API charge per output token, including the input tokens associated with
    it at the workload's fixed mix and cache hit rate
  kind: scalar
  unit: USD/token
- macro: \EffectiveBranchingFactor
  latex: b_{\text{eff}}
  definition: expected number of children of an expanded search node that survive pruning
  kind: scalar
  unit: dimensionless
  notes: $b_{\text{eff}} = \SearchBranchingFactor(1-\ChildPruningProbability)$; below one the frontier
    dies out, above one it grows geometrically (a Galton-Watson process).
- macro: \EffectiveConfidentialityLabel
  latex: \kappa_{\text{eff}}
  definition: set of recipients permitted to receive a handle argument, the intersection of the handle's
    own confidentiality label and that of the object it designates
  kind: function
  notes: Written with its handle, $\EffectiveConfidentialityLabel(\ObjectHandle) = \ConfidentialityLabel(\ObjectHandle)
    \cap \ConfidentialityLabel(\text{obj}(\ObjectHandle))$. A fixture handle fails the release check exactly
    as the fixture's bytes would.
- macro: \EffectiveIntegrityProvenance
  latex: \iota_{\text{eff}}
  definition: integrity provenance a handle argument is checked with, the union of the handle's own provenance
    and that of the object it designates
  kind: function
  notes: Written with its handle, $\EffectiveIntegrityProvenance(\ObjectHandle) = \IntegrityProvenance(\ObjectHandle)
    \cup \IntegrityProvenance(\text{obj}(\ObjectHandle))$.
- macro: \EligibleCachedPrefixLength
  latex: S_{\text{hit}}
  definition: number of a call's input tokens in a resident prefix eligible for the cached-input rate
  kind: count
  notes: Written per call, $S_{\text{hit}}^{(t)}$.
- macro: \EligibleTargetPositionSet
  latex: \mathcal{P}_{\text{elig}}
  definition: set of token positions in one serialized example that the declared objective selects as
    imitation targets
  kind: set
  notes: $\PositionLossMask = \IndicatorFunction\{t \in \mathcal{P}_{\text{elig}}\}$, a subset of positions
    $2$ to $\SequenceLength$. Not \ActivePrefillRequestSet.
- macro: \EligibleVectorCount
  latex: N
  definition: number of stored vectors eligible for one vector search after scope filtering, the vectors
    an exact scan streams
  kind: count
  notes: Exact-scan bytes are $N\,d\,w$ and FLOPs $2Nd$. Not \DeviceCount or \CandidatePoolSize.
- macro: \EmbeddingDimension
  latex: d
  definition: number of components in each embedding vector stored in a vector index
  kind: count
  notes: Product quantization splits it into \PqSubvectorCount subvectors of $d/m$ components. Not \HiddenDimension.
- macro: \EmittedArtifactCount
  latex: N_{\text{emit}}
  definition: number of valid training artifacts a collection cohort emits for one designated consumer
    by an accounting cutoff
  kind: count
  notes: Denominator of $\CostPerEmittedArtifact$; a cohort with none reports its spend without a ratio.
- macro: \EmptyByteString
  latex: \epsilon
  definition: empty byte string, the string of length zero
  kind: record
  notes: Base case of the extended transition, $\delta^*(q,\epsilon)=q$. Not \PerStepErrorRate or \PrivacyBudget.
- macro: \EnvelopeCallCount
  latex: N
  definition: number of sequential calls a trajectory makes that each need an execution envelope
  kind: count
- macro: \EnvelopeSetupTime
  latex: T_{\text{setup}}
  definition: time to prepare a sandbox envelope until it is ready for useful work
  kind: scalar
  unit: s
- macro: \EnvironmentCycleTime
  latex: T_{\text{cycle}}
  definition: 'time one environment slot takes per episode when it runs trajectories serially: turns of
    model and tool time, then assessment, then reset'
  kind: scalar
  unit: s
  notes: Equals $\TurnHorizon(\ModelTime+\ToolTime)+T_v+T_r$; slots divided by it gives the idealized
    pool capacity.
- macro: \EnvironmentFixture
  latex: f
  definition: one environment fixture, the reproducible task setup a rollout runs against, as assigned
    to a task group and split
  kind: record
  notes: Indexed $f_i$, $f_j$ when two fixtures are compared. Every record derived from a fixture inherits
    its split.
- macro: \EnvironmentResetTime
  latex: T_{r}
  definition: time to restore an environment slot to its fixture state between episodes
  kind: scalar
  unit: s
  notes: Cold reset and snapshot reset give the two cycle times $T_{\text{cycle,cold}}$ and $T_{\text{cycle,snap}}$.
- macro: \EnvironmentState
  latex: s
  definition: full environment state of the decision process at a turn, including what the model never
    saw
  kind: record
  notes: Same glyph as the context state $\TrajectoryState$, which is only what the model saw. A record,
    not a number.
- macro: \EnvironmentTransitionDistribution
  latex: p
  definition: distribution the environment induces over the next state given the current state and the
    action taken
  kind: distribution
  notes: Written $p(s_{t+1}\mid \TrajectoryState, \TrajectoryAction)$. Unmasked observations would ask
    the policy's weights to fit it. Not \NextTokenDistribution, which shares the glyph.
- macro: \ErrorRecoveryCost
  latex: C_{\text{recovery}}
  definition: cost of recovering from one detected error, independent of the check interval
  kind: scalar
  unit: varies
  notes: Same unit as \StepGenerationCost. Not \FailureRecoveryTime.
- macro: \EscalationDecision
  latex: d
  definition: choice between automatic execution and human review for one proposed action
  kind: record
  notes: Takes the values Auto and Escalate.
- macro: \EscalationLossMatrix
  latex: \mathbf{L}
  definition: loss of each escalation decision under each damaging-outcome value, one row per decision
    and one column per outcome
  kind: matrix
  notes: Entries in USD or another common cost unit. Not the loss function.
- macro: \EscalationThresholdProbability
  latex: p_{\text{threshold}}
  definition: estimated damage probability above which human review has lower modeled expected cost than
    automatic execution, the review-to-damage cost ratio
  kind: scalar
  unit: dimensionless
- macro: \EstimatedAcceptanceProbability
  latex: \hat{p}
  definition: sample estimate of a configuration's acceptance probability from an evaluation, such as
    accepted trials over assigned trials or the task-averaged share of accepted runs
  kind: scalar
  unit: dimensionless
  notes: With one run per task it is the observed acceptance share $X/N$ around which Wald and Wilson
    intervals are built. Not \EstimatedAccuracy (learning) nor the pooled A/B rates written $\hat{p}$.
- macro: \EstimatedCandidateUtility
  latex: \hat{U}
  definition: utility a learned scorer reports for one candidate, its true utility plus an independent
    scoring error
  kind: scalar
  unit: dimensionless
  notes: Indexed by candidate; argmax selection on it favors candidates with large positive error.
- macro: \EstimatedDamageProbability
  latex: \hat{p}
  definition: runtime estimate of the probability that a proposed action produces the modeled damaging
    outcome, given observable features
  kind: scalar
  unit: dimensionless
  notes: Need not equal the true probability $\ConditionalDamageProbability$.
- macro: \EstimatedHistoryAdvantage
  latex: \hat{A}
  definition: estimate of how much an action taken after a given interaction history beats the policy
    value at that history
  kind: scalar
  unit: dimensionless
  notes: Estimates $Q^\pi(h_k,a_k)-V^\pi(h_k)$. The group-relative per-rollout estimate is $\hat{\Advantage}_i$.
  aliases:
  - \EstimatedAdvantageK
- macro: \EstimatedPairedAcceptanceDifference
  latex: \hat{\Delta}
  definition: observed difference between the candidate's and the baseline's acceptance shares on the
    same sampled tasks, the discordant count difference divided by the task count
  kind: scalar
  unit: dimensionless
  notes: Point estimate of \PairedAcceptanceDifference; the paired interval $[L_\Delta,U_\Delta]$ is built
    around it.
- macro: \EstimatedRemainingReturn
  latex: \hat{V}
  definition: estimated expected remaining return under a continuation policy, given the interaction history
    at a turn
  kind: scalar
  unit: dimensionless
  notes: It is a success probability only for a binary terminal reward without discounting.
  aliases:
  - \EstimatedValueK
- macro: \EstimatedUtilityStandardDeviation
  latex: s
  definition: standard deviation of the utility a scorer reports, combining the spread of true utility
    and of scoring error
  kind: scalar
  unit: dimensionless
  notes: $s=\sqrt{\CandidateUtilityStandardDeviation^2+\ScoringErrorStandardDeviation^2}$. Not a state.
- macro: \EvaluationTrialCount
  latex: N
  definition: number of trials assigned to an evaluation cohort, including incomplete, timed-out, crashed
    and budget-exhausted runs
  kind: count
  notes: Denominator of $\EstimatedAcceptanceProbability$.
- macro: \EvidenceRecordEvent
  latex: e_{\text{obs}}
  definition: logged event that durably records evidence received about a dispatched operation, whose
    status may still be pending, partial or unknown
  kind: record
  notes: Last event of the intent-before-effect ordering. Not the observation o_t a model sees.
- macro: \ExecutedToolCall
  latex: a
  definition: one tool call the harness executed on a turn, indexed by turn and by call within the turn
  kind: record
  notes: Written $\ExecutedToolCall_{t,j}$ for call $j$ of turn $t$, the argument of $\ToolCallCost$.
    A tool-call record, not a number. Same idea as $\TrajectoryAction$ ($a_t$), which bakes the turn index
    into its LaTeX.
- macro: \ExecutedTrialCount
  latex: N_{\text{trial}}
  definition: number of verification trials actually run on one candidate when verification stops at the
    first rejection
  kind: count
  notes: A random count up to $n_{\text{trial}}$; its expectation sizes the verifier pool.
- macro: \ExecutionSwitchTime
  latex: T_{\text{switch}}
  definition: time one system call spends transferring execution to another thread or process
  kind: scalar
  unit: s
- macro: \ExpectedActionReturn
  latex: Q_t^{\pi}
  definition: expected return, or expected cost in the imitation bounds, from a step after taking an action
    in a state and then following the policy
  kind: scalar
  unit: dimensionless
  notes: Reward units are dimensionless in this book. The superscript names the policy that continues,
    $Q_t^{\pi}$.
  aliases:
  - \ActionValueOrCosttogo
- macro: \ExpectedCheckingTime
  latex: T_{\text{check}}
  definition: expected verifier slot time spent per attempted record under a short-circuit check cascade
  kind: scalar
  unit: s
  notes: $\ExpectedCheckingTime = \sum_i T_i \prod_{j<i} p_j$. A time, distinct from the attempt cost
    $\AttemptCost$ in dollars.
- macro: \ExpectedDecisionRisk
  latex: \mathcal{R}
  definition: expected loss of an escalation decision under the estimated damage probability
  kind: function
  unit: USD
  notes: Risk-neutral Bayesian expected cost.
- macro: \ExpectedHistoryActionReturn
  latex: Q
  definition: expected remaining return under a policy after taking a given action at a given interaction
    history and then following the policy
  kind: function
  unit: dimensionless
  notes: Written $\ExpectedHistoryActionReturn^\pi(h_k,a_k)$. Same meaning as \ExpectedActionReturn, whose
    LaTeX bakes in the index t.
- macro: \ExpectedIrreversibleLoss
  latex: L_A
  definition: expected consequence of the bad actions in an execution plan that cannot be recovered
  kind: scalar
  unit: varies
  notes: '$\sum_a \Pr(\text{bad}\ a)\cdot \text{consequence}(a)\cdot(1-\rho_a)$, with $\rho_a$ the recoverable
    fraction of action $a$. The subscript $A$ is part of the glyph, not an authority level. Unit: consequence
    units.'
  aliases:
  - \ExpectedIrreversibleLossA
- macro: \ExpectedNormalMaximum
  latex: m_{N}
  definition: expected maximum of as many independent standard normal draws as there are candidates in
    the pool
  kind: scalar
  unit: dimensionless
  notes: Grows like $\sqrt{2\ln\CandidatePoolSize}$. The subscript is the pool size; if the chapter writes
    it as $m_{\CandidatePoolSize}$, the entry's LaTeX becomes $m$.
- macro: \ExpectedRemainingReturn
  latex: V
  definition: expected remaining return under a policy from a given interaction history at a decision
    step
  kind: function
  unit: dimensionless
  notes: Written with the policy superscript, $\ExpectedRemainingReturn^\pi(h_k)$. Its estimate is \EstimatedRemainingReturn.
- macro: \ExpectedReturnObjective
  latex: J
  definition: expected return of a policy as a function of its parameters, the objective reinforcement
    learning maximizes
  kind: function
  unit: dimensionless
  notes: Written with its argument, $J(\ModelParameters)$. Not the imitation-cost objective $J(\pi)$ of
    the fine-tuning chapter and appendix, which sums expected task cost.
- macro: \ExpectedRunCompletionTime
  latex: T
  definition: expected elapsed time to complete all useful steps when every failed block is regenerated
    from its start, as a function of block size
  kind: function
  unit: s
  notes: Written $T(m)$. Not \Time.
- macro: \ExpectedTaskCostSum
  latex: J
  definition: expected sum over the horizon of the normalized immediate task costs a policy incurs
  kind: function
  unit: dimensionless
  notes: Written with its policy, $J(\pi)$; the imitation bounds compare $J(\pi)-J(\pi^*)$. Not monetary.
- macro: \ExploitCandidateFraction
  latex: p_{\text{exp}}
  definition: fraction of generated candidates that contain an unmodeled edge case or exploit through
    which an invalid candidate passes the verifier
  kind: scalar
  unit: dimensionless
  notes: A pool of $\CandidatePoolSize$ holds at least one with probability $1-(1-p_{\text{exp}})^{\CandidatePoolSize}$.
- macro: \ExploitTrajectory
  latex: \tau_{\text{hack}}
  definition: unintended trajectory that earns at least the reward of the intended solution while serving
    the intended objective far worse
  kind: record
  notes: A reward-hacking trajectory. Compared against the intended solution $\Trajectory^*$. A record,
    not a number.
- macro: \ExtendedDepthLength
  latex: K_{\text{ext}}
  definition: number of additional output tokens a call generates when test-time compute extends one candidate
    along the depth axis
  kind: count
  notes: A depth allocation of $\OutputLength$-type tokens; its decode time is $K_{\text{ext}}\,\PerTokenDecodeTime$.
    Not the reasoning budget $\ReasoningBudget$, which is a cap rather than the tokens spent.
- macro: \ExternalDispatchAction
  latex: a_{\text{ext}}
  definition: dispatch of an admitted operation to an external endpoint, which is not its completion
  kind: record
  notes: Follows e_{\text{flush}} in the intent-before-effect ordering. Not the proposed a_{\text{prop}}
    or permitted a_{\text{perm}} action.
- macro: \ExternalWait
  latex: T_{\text{wait}}
  definition: time spent waiting on a remote service or on a person's response
  kind: scalar
  unit: s
  notes: One interval of a turn, beside $\ModelTime$ and $\ToolTime$. With approval requests at $\ArrivalRate$,
    $\ArrivalRate\,\ExternalWait$ trajectories are held at once.
- macro: \FailureModeOccurrenceCount
  latex: n_{f}
  definition: number of executions in which one failure mode occurs over the period a trace-sampling policy
    covers
  kind: count
  notes: Under head sampling at retention probability $\theta$, the mode leaves no retained trace with
    probability $(1-\theta)^{n_f}$.
- macro: \FallbackCost
  latex: C_{\text{fallback}}
  definition: forward-looking cost of compensating existing side effects and rebuilding to a declared
    readiness endpoint
  kind: scalar
  unit: varies
  notes: 'Evaluated separately on each resource axis: seconds of elapsed time or dollars of model charges.
    Sunk costs are excluded.'
- macro: \FalseAcceptHarmCost
  latex: C_{\text{harm}}
  definition: additional harm or remediation cost of a gate false accept not already captured in the execution
    ledger
  kind: scalar
  unit: USD
- macro: \FalseApprovalCount
  latex: N_{\text{fa}}
  definition: number of reviewers in an ensemble that approve a candidate known to be invalid
  kind: count
  notes: Binomial under independent errors, beta-binomial under the shared-difficulty mixture.
- macro: \FalseApprovalOutcomeCount
  latex: k
  definition: a particular number of falsely approving reviewers, the value at which the false-approval
    count's distribution is evaluated or summed
  kind: count
  notes: Ranges from 0 to $\WorkerCount$; a majority is $k>\WorkerCount/2$.
- macro: \FalseApprovalPropensity
  latex: Q
  definition: probability, intrinsic to one candidate, that a randomly chosen reviewer falsely approves
    it, treated as a random variable over the candidate population
  kind: scalar
  unit: dimensionless
  notes: 'Shared difficulty: reviewers are independent given $Q$, correlated across candidates. Majority
    false approval tends to $\Pr(Q>1/2)$ as reviewers are added.'
- macro: \FalseApprovalPropensityLevel
  latex: q
  definition: a particular level of a candidate's false-approval propensity, the variable integrated over
    in its beta density
  kind: scalar
  unit: dimensionless
  notes: A realization of $\FalseApprovalPropensity$; ranges over $[0,1]$.
- macro: \FeedbackCheckDuration
  latex: t_{\text{check}}
  definition: time the external check of one feedback round takes to run and return its observation
  kind: scalar
  unit: s
  notes: Written with the turn index, ${t_{\text{check}}}_t$; it sits on the feedback axis's critical
    path.
- macro: \FeedbackCriticalPathLatency
  latex: T^{\text{feedback}}
  definition: critical-path latency of one decision when test-time compute revises a candidate over sequential
    feedback turns, each ending in an external check
  kind: scalar
  unit: s
  notes: Sum over turns of prefill, decode and check duration.
- macro: \FinishedWorkerCount
  latex: j
  definition: number of parallel workers that have returned an admissible result by a given time
  kind: count
  notes: Summed from the required count to $\WorkerCount$ in the k-of-N deadline probability.
- macro: \FirstAdjacentCheckIndex
  latex: a
  definition: label of the first of two adjacent independent admission predicates whose order is compared
  kind: index
  notes: Paired with $\SecondAdjacentCheckIndex$ in the exchange argument for cascade order.
- macro: \FirstAdjacentCheckPassProbability
  latex: p_{a}
  definition: pass probability of the first of two adjacent independent admission predicates
  kind: scalar
  unit: dimensionless
  notes: The pass probability $p_i$ of predicate $\text{chk}_a$; $1-p_a$ is its rejection probability.
- macro: \FirstAdjacentCheckSlotTime
  latex: T_{a}
  definition: expected verifier slot time of the first of two adjacent independent admission predicates
  kind: scalar
  unit: s
  notes: The slot time $T_i$ of predicate $\text{chk}_a$; with $p_a$ it decides the order rule $T_a/(1-p_a)
    < T_b/(1-p_b)$.
- macro: \FirstCatalogDefinitionCount
  latex: n_{\text{def},A}
  definition: number of tool definitions each call stages under the first of two compared fixed catalogs
  kind: count
  notes: Catalog A in the token ratio against catalog B.
- macro: \FirstCatalogDefinitionSize
  latex: S_{A}
  definition: mean number of tokens one tool definition of the first of two compared catalogs contributes
    to the serialized request
  kind: scalar
  unit: tokens
  notes: Catalog A in the token ratio against catalog B.
- macro: \FirstRaterCategoryFraction
  latex: p_{y,1}
  definition: fraction of the cases the first of two raters assigns to one rating category
  kind: scalar
  unit: dimensionless
  notes: Multiplies \SecondRaterCategoryFraction in the chance agreement $p_e=\sum_y p_{y,1}p_{y,2}$ of
    Cohen's kappa. The $y$ in the subscript is \RatingCategory.
- macro: \ForkBoundarySet
  latex: \mathcal{B}_{\text{fork}}
  definition: set of completed-turn boundaries of a trajectory at which continuations are forked
  kind: set
  notes: A subset of $\{1,\ldots,\TurnHorizon-1\}$; the fork schedule.
- macro: \ForkedTrajectoryTokenCount
  latex: N_{\text{total}}
  definition: total output tokens of a trajectory and all continuation branches forked under a given fork
    schedule
  kind: count
  notes: Written with its fork set, $N_{\text{total}}(\ForkBoundarySet)$. Grows quadratically in the horizon
    when every boundary forks.
- macro: \FormatComplianceScore
  latex: \Phi
  definition: score between zero and one measuring how well a trajectory's tool calls and output follow
    the required format
  kind: scalar
  unit: dimensionless
  notes: Written with its trajectory, $\Phi(\Trajectory)$; weighted by $\FormatRewardWeight$ in a shaped
    reward.
- macro: \FormatRewardWeight
  latex: \lambda_{\text{fmt}}
  definition: non-negative weight on the format-compliance term of a shaped trajectory reward
  kind: scalar
  unit: dimensionless
  notes: Pass-over-failure order holds when $\FormatRewardWeight+\LengthPenaltyWeight<1$.
- macro: \FreeCreditCount
  latex: N_{\text{free}}
  definition: number of credits a producer holds that are not attached to any admitted item
  kind: count
  notes: The producer may admit an item only while this count is positive.
- macro: \FreshInputTokenCount
  latex: S_{\text{fresh}}
  definition: number of a trajectory's input tokens billed at the fresh-input rate under ideal prefix
    reuse, the initial prompt plus every appended increment once
  kind: count
- macro: \FullSnapshotWriteVolume
  latex: D_{\text{vol,full}}
  definition: cumulative bytes a trajectory writes when every checkpoint is a full snapshot
  kind: scalar
  unit: bytes
- macro: \FusionCandidate
  latex: x_{\text{cand}}
  definition: candidate record that one or more retrieval methods return, scored by reciprocal rank fusion
    from its ranks in their lists
  kind: record
  notes: Argument of the fused score $\operatorname{RRF}(\FusionCandidate)$ and of \FusionInputRank.
- macro: \FusionInputList
  latex: \mathcal{L}
  definition: ranked list of candidates one retrieval method returns, one input to reciprocal rank fusion
  kind: set
  notes: Indexed by method, $\FusionInputList_i$. Not \RetrievedRecordSet.
- macro: \FusionInputRank
  latex: r
  definition: 1-based rank of a candidate within one retrieval method's ranked list, as reciprocal rank
    fusion reads it
  kind: index
  notes: Indexed by method, $r_i(x)$. Not \AdapterRank or \OrderedTestRank.
- macro: \GaeAdvantageEstimate
  latex: \widehat{A}^{\text{GAE}}
  definition: generalized advantage estimate at a decision step, the discounted and trace-decayed sum
    of the temporal-difference residuals from that step to the end of the episode
  kind: scalar
  unit: dimensionless
  notes: Indexed by decision step, $\widehat A_k^{\text{GAE}}$, with $\widehat A_H^{\text{GAE}}=0$. Built
    from $\TemporalDifferenceResidual$ with $\DiscountFactor$ and $\TraceDecay$; one estimator of $\EstimatedHistoryAdvantage$.
- macro: \GeneratedSampleCount
  latex: n
  definition: number of candidates generated for one task when estimating pass@k, from which subsets of
    k runs are drawn
  kind: count
  notes: Requires $n \ge \IndependentAttemptCount$; the plug-in fraction is $c/n$.
- macro: \GeneratedTokenCap
  latex: N_{\text{cap}}
  definition: largest number of generated tokens the runtime lets one rollout produce, enforced by hard
    termination, that normalizes a length penalty
  kind: count
  notes: The normalized length $\RolloutPolicyTokenCount/\GeneratedTokenCap$ stays in [0,1] only while
    the runtime enforces it. Distinct from the per-call $\ContextWindow$.
- macro: \GenerationStepErrorRate
  latex: \lambda_{\text{error}}
  definition: rate of rare errors per useful generation step in a verification cadence model, assumed
    constant
  kind: scalar
  unit: dimensionless
  notes: Errors per step; small so that an interval rarely holds two. Compare \PerStepErrorRate ($\epsilon$),
    the per-turn error probability of horizon compounding.
- macro: \GoodputRelativeTolerance
  latex: \epsilon_{\mathcal{G}}
  definition: declared largest relative shortfall of the candidate's trajectory goodput below the baseline's
    that a release gate allows
  kind: scalar
  unit: dimensionless
  notes: The gate predicate is $\mathcal{G}_c\ge(1-\epsilon_{\mathcal{G}})\mathcal{G}_b$.
- macro: \GrantAllowedAccesses
  latex: \mathcal{A}
  definition: set of accesses a capability grant allows, written as a function of the grant
  kind: function
  notes: Attenuation requires $\GrantAllowedAccesses(\ChildCapabilityGrant) \subseteq \GrantAllowedAccesses(\ParentCapabilityGrant)$.
    Not the advantage or an action set.
- macro: \GrantCondition
  latex: \phi_{\Gamma}
  definition: condition predicate of a capability grant, which an access must satisfy, such as binding
    use to one task or recipient
  kind: function
  notes: Third component of $\CapabilityGrant$, applied to an access as $\GrantCondition(a)$. May carry
    an aggregate resource budget.
- macro: \GrantExpiryTime
  latex: t_{\text{exp}}
  definition: time after which a capability grant admits nothing
  kind: scalar
  unit: s
  notes: A timestamp. An access at time $t$ is admissible only if $t < \GrantExpiryTime$; a derived grant
    expires no later than its parent.
- macro: \GrantIssueTime
  latex: T
  definition: time at which a capability grant is issued, the reference for its expiry
  kind: scalar
  unit: s
  notes: Written with index 0, $\GrantIssueTime_0$; expiries are stated as offsets from it.
- macro: \GrantRights
  latex: \mathcal{R}_{\Gamma}
  definition: set of operations a capability grant permits its holder to perform
  kind: set
  notes: First component of $\CapabilityGrant$; an access is admissible only if its operation lies in
    $\GrantRights$.
- macro: \GroupContrastProbability
  latex: p_{\text{contrast}}
  definition: probability that a group of independent rollouts on one task contains at least one pass
    and at least one failure, so its reward contrast is nonzero
  kind: scalar
  unit: dimensionless
  notes: Written with its arguments, $p_{\text{contrast}}(\GroupSize,\AttemptPassProbability)$; rollouts
    per informative group are $\GroupSize/p_{\text{contrast}}$.
- macro: \GroupMeanReward
  latex: \mu_{R}
  definition: mean terminal reward over the rollouts of one task group, the GRPO baseline
  kind: scalar
  unit: dimensionless
  notes: Not \ServiceRate ($\mu$).
- macro: \GroupRelativeAdvantage
  latex: \hat{A}
  definition: 'standardized coefficient GRPO attaches to every sampled token of one rollout: its reward
    minus the group mean, divided by the group reward dispersion'
  kind: scalar
  unit: dimensionless
  notes: Indexed by rollout, $\GroupRelativeAdvantage_i$. An empirical weight, not the expected advantage
    $\Advantage$; a false pass receives the same coefficient as a genuine one. Shares its glyph with \EstimatedHistoryAdvantage.
- macro: \GroupRewardStandardDeviation
  latex: \sigma_{R}
  definition: population standard deviation, with divisor equal to the group size, of the terminal rewards
    in one task group
  kind: scalar
  unit: dimensionless
  notes: Divides the centered rewards in the group-relative coefficient $\GroupRelativeAdvantage$.
- macro: \GroupRolloutIndex
  latex: i
  definition: position of one rollout within the group sampled for a task
  kind: index
  notes: Runs from 1 to $\GroupSize$; indexes $\TrajectoryReward_i$, $\GroupRelativeAdvantage_i$ and $\RolloutPolicyTokenCount_i$.
- macro: \GroupSize
  latex: G
  definition: number of rollouts sampled per task for group-relative scoring
  kind: count
  notes: Elsewhere $G$ is the task-contract goal $\TaskContractGoal$.
- macro: \GrpoSampledObjective
  latex: \widehat{\mathcal{J}}_{\text{GRPO}}
  definition: 'sampled GRPO objective: the group average of per-rollout token means of the clipped surrogate
    minus the weighted reference penalty'
  kind: function
  unit: dimensionless
  notes: Written with its argument $(\ModelParameters)$; frameworks minimize its negative. Departs from
    the expected return $J$ through standardization, clipping and length normalization.
- macro: \GuestImageMemory
  latex: M_{\text{guest}}
  definition: memory of the full image of one sandbox guest
  kind: scalar
  unit: bytes
- macro: \GuestKernelBootTime
  latex: T_{\text{kernel}}
  definition: time to initialize the guest kernel of one sandbox instance
  kind: scalar
  unit: s
- macro: \HarmInclusiveTaskCost
  latex: C_{\text{with\ harm}}
  definition: monetary cost of one initiated cascade task including the harm of gate false accepts
  kind: scalar
  unit: USD
- macro: \HeadByteAllocation
  latex: M_{\text{head}}
  definition: bytes of the observation budget reserved for the start of a tool's output, captured into
    a linear buffer that fills once
  kind: scalar
  unit: bytes
  notes: One of the three parts of $\ObservationByteBudget$.
- macro: \HeadSamplingProbability
  latex: \theta
  definition: probability with which head sampling retains each trace, decided before the trial's outcome
    is known
  kind: scalar
  unit: dimensionless
  notes: A failure mode seen $n_f$ times leaves no retained trace with probability $(1-\theta)^{n_f}$.
    Not \ModelParameters.
- macro: \HistoryAdvantage
  latex: A
  definition: expected return of taking a given action at a given interaction history minus the policy's
    expected return at that history
  kind: scalar
  unit: dimensionless
  notes: Written with the policy superscript the chapter keeps, $\HistoryAdvantage^\pi(h_k,a_k) = \ExpectedHistoryActionReturn^\pi(h_k,a_k)
    - \ExpectedRemainingReturn^\pi(h_k)$. The true quantity that \EstimatedHistoryAdvantage estimates.
    Not an authority level $A_0$ to $A_3$.
- macro: \HnswLayerIndex
  latex: L
  definition: level of one layer in an HNSW graph, counted from layer 0 which holds every vector
  kind: index
  notes: A vector reaches layer $L$ or above with probability $M^{-L}$. Not the network \LayerIndex.
- macro: \HnswLevelDraw
  latex: U
  definition: random number drawn uniformly from (0, 1] for each vector inserted into an HNSW graph, which
    sets the highest layer the vector joins
  kind: scalar
  unit: dimensionless
  notes: Assigned layer is $\lfloor -\ln U \cdot m_\ell \rfloor$.
- macro: \HnswLevelNormalization
  latex: m_\ell
  definition: normalization factor of HNSW layer assignment, the reciprocal of the natural log of the
    per-layer connection limit
  kind: scalar
  unit: dimensionless
  notes: Equals $1/\ln M$ for \HnswMaximumConnectionCount $M$; makes each layer hold about $1/M$ of the
    nodes below it.
- macro: \HnswMaximumConnectionCount
  latex: M
  definition: largest number of bidirectional links each node keeps in one layer of an HNSW graph
  kind: count
  notes: Each layer holds roughly $1/M$ as many nodes as the one beneath it; a recall knob alongside the
    search beam width.
- macro: \HnswSearchBeamWidth
  latex: ef_{\text{search}}
  definition: number of closest candidates the layer-0 beam search of an HNSW query keeps in its priority
    queue, its primary recall knob
  kind: count
  notes: Wider beams visit more nodes, recover more true neighbors and cost more latency.
- macro: \HostRuntimeCount
  latex: N_{\text{host}}
  definition: number of host runtimes, agent applications, that must connect to independently maintained
    tool services
  kind: count
  notes: Point-to-point integration needs up to $\HostRuntimeCount \times \ToolServiceCount$ adapters;
    a shared protocol needs $\HostRuntimeCount + \ToolServiceCount$ implementations.
- macro: \HumanFallbackCost
  latex: C_{h}
  definition: monetary cost of sending one rejected ticket through the human fallback workflow
  kind: scalar
  unit: USD
- macro: \HumanResolutionProbability
  latex: h
  definition: probability that the human fallback workflow resolves a ticket the automated tier rejected
  kind: scalar
  unit: dimensionless
- macro: \HumanReviewCost
  latex: C_{\text{human}}
  definition: cost of human review that an escalated action or a rejected attempt triggers, inspection
    and labor included
  kind: scalar
  unit: USD
  notes: Latency must be converted to the common cost unit before addition.
- macro: \HypothesisIndex
  latex: h
  definition: index naming one of the two hypotheses of a test, zero for the null and one for the alternative
  kind: index
  notes: Not the interaction history.
- macro: \HypothesizedAcceptanceProbability
  latex: p
  definition: acceptance probability a sequential probability ratio test specifies under one of its two
    simple hypotheses, indexed 0 for the baseline and 1 for the degraded alternative
  kind: scalar
  unit: dimensionless
  notes: Written $p_0$ and $p_1$ with $0<p_1<p_0<1$; both are design inputs. Not \AttemptPassProbability,
    the per-attempt pass probability, nor \BaselineConversionRate.
- macro: \IdempotencyKey
  latex: k_{\text{idem}}
  definition: identifier for one intended operation, kept across retries so its effect applies once
  kind: record
  notes: Derived from the trajectory, turn, call, tool, and canonical arguments. A string, not a number.
- macro: \ImmediateTaskCostScore
  latex: C
  definition: normalized cost, between zero and one, of taking one action in one state of a delegated
    task, in the imitation-learning bounds
  kind: function
  unit: dimensionless
  notes: 'Written with its arguments, $C(s,a)$. Not monetary: dollar costs are $\TaskCost$ and $\AttemptCost$.
    Its sum over the horizon is $\ExpectedTaskCostSum$.'
- macro: \IncorrectCandidateTrialPassProbability
  latex: p_{b}
  definition: probability that a fixed incorrect candidate passes one verification trial
  kind: scalar
  unit: dimensionless
  notes: The all-pass rule lowers its acceptance to $p_b^{n_{\text{trial}}}$.
- macro: \IncrementalSnapshotWriteVolume
  latex: D_{\text{vol,delta}}
  definition: cumulative bytes a trajectory writes when each checkpoint after the base is an incremental
    delta
  kind: scalar
  unit: bytes
- macro: \IndependentAttemptCount
  latex: k
  definition: number of independent attempts or runs at one task, such as the attempts a retry budget
    allows or the runs pass@k and pass^k score
  kind: count
  notes: At least one of $\IndependentAttemptCount$ independent attempts is accepted with probability
    $1-(1-\AcceptanceProbability)^{\IndependentAttemptCount}$; the same $k$ appears in pass@$k$ and pass$^k$.
- macro: \IndexGraphNodeSet
  latex: V
  definition: set of nodes, one per stored record, of a vector index graph such as HNSW
  kind: set
  notes: Not \GraphNodeSet.
  render_exception: Graph theory writes the vertex sets of G = (V, E) as plain italic capitals.
- macro: \IndexedDocumentCount
  latex: N
  definition: number of documents in the corpus a lexical index covers
  kind: count
  notes: Appears in BM25's inverse document frequency. Not the vector-search \EligibleVectorCount.
- macro: \InflightRolloutReservation
  latex: M_{\text{inflight}}
  definition: staging bytes that rollouts already running can still reserve after the dispatcher stops
    issuing work
  kind: scalar
  unit: bytes
  notes: Subtracted, with growth over $\ControllerReactionDelay$, from the store to size the high watermark.
- macro: \InformativeTaskFraction
  latex: p_{\text{inform}}
  definition: probability that a fixed number of independent attempts on one task contains at least one
    success and at least one failure, the informative-task fraction
  kind: function
  unit: dimensionless
  notes: Written with its arguments, $\InformativeTaskFraction(\AttemptPassProbability,\IndependentAttemptCount)=1-(1-\AttemptPassProbability)^{\IndependentAttemptCount}-\AttemptPassProbability^{\IndependentAttemptCount}$.
    Groups outside it carry no within-group contrast for preference or group-relative objectives.
- macro: \InitiatedTasks
  latex: N
  definition: number of tasks in a settled cohort, whatever their outcome
  kind: count
  notes: Denominator of $\AcceptanceFraction = \AcceptedTasks/\InitiatedTasks$ and the range of the cost
    sum in $\CostPerAcceptedTask$.
- macro: \InputTokenPrice
  latex: c_{\text{in}}
  definition: price of one uncached input token
  kind: scalar
  unit: USD/token
  notes: Lowercase $c$ is a unit price that an uppercase $C$ totals.
  aliases:
  - \PertokenPricesIn
- macro: \InputTokenSequence
  latex: x_{1:S}
  definition: sequence of input tokens a language model conditions on, positions one through the sequence
    length
  kind: record
  notes: A slice of the token sequence, not a number. Renders as $x_{1:S}$. The request tuple writes the
    same prompt as bold $\RequestPromptTokens$.
- macro: \InstanceReplenishTime
  latex: T_{\text{init}}
  definition: time to prepare one clean sandbox instance for the standby reserve, such as by snapshot
    restore
  kind: scalar
  unit: s
- macro: \IntegrationCandidateCommitHash
  latex: h_{\text{candidate}}
  definition: content hash of the immutable integration candidate, the worker's commit or a staged merge
    of it with the captured head
  kind: record
  notes: Acceptance checks run on exactly this commit; a check on the worker's private branch does not
    validate it.
- macro: \IntegrationHeadCommitHash
  latex: h_{\text{head}}
  definition: content hash of the integration branch head captured for this integration attempt
  kind: record
  notes: A content hash names an immutable commit; the integration gate compares hashes, never mutable
    directory references.
- macro: \IntegrityProvenance
  latex: \iota
  definition: set of sources whose content may have influenced a record
  kind: function
  notes: Written with its record, $\iota(x)$. The evidence check is $\IntegrityProvenance \subseteq \AcceptedInfluences$;
    endorsement never rewrites it.
- macro: \IntegrityTrustLabel
  latex: \iota
  definition: two-level integrity label, trusted or untrusted, that marks whether a record's dependencies
    are qualified for a specified use, propagated by join
  kind: function
  notes: Written with its argument, $\iota(x_i)$, $\iota(\Context)$; ordered $\text{Trusted} \sqsubset
    \text{Untrusted}$. A two-element coarsening of \IntegrityProvenance, whose values are sets of sources.
- macro: \IntentAcknowledgmentEvent
  latex: e_{\text{flush}}
  definition: event at which the log durably acknowledges an operation's recoverable intent record, and
    the records before it, under the declared failure domain
  kind: record
  notes: 'The durability barrier: dispatch may follow only after it.'
- macro: \InterAnnotatorAgreement
  latex: \kappa
  definition: Cohen's kappa, agreement between two annotators corrected for the agreement expected by
    chance
  kind: scalar
  unit: dimensionless
  notes: $(p_o - p_e)/(1 - p_e)$ for observed agreement $p_o$ and chance agreement $p_e$. Not the confidentiality
    label $\ConfidentialityLabel$ or the coherency coefficient $\CoherencyCoefficient$, which share the
    letter.
  aliases:
  - \CohensKappa
- macro: \InteractionHistory
  latex: h
  definition: transcript of delivered prompts, emitted actions and observations up to a turn of a rollout,
    the history a policy conditions on
  kind: record
  notes: Indexed by turn, $\InteractionHistory_k$, or by token position inside a per-token loss, $\InteractionHistory_t$;
    $\InteractionHistory_0$ is the initial task prompt.
- macro: \IntervalNormalQuantile
  latex: z
  definition: positive standard-normal quantile that sets the width of a two-sided confidence interval
    at its stated nominal confidence, written bare inside interval formulas
  kind: scalar
  unit: dimensionless
  notes: 1.96 for a nominal 95 percent interval. Equal to $z_{1-\StatisticalSignificanceLevel/2}$; the
    bare form is used inside the Wald, Wilson and paired-interval formulas. Not \ProportionTestStatistic,
    a test statistic.
- macro: \InvalidatedArtifactNode
  latex: v
  definition: artifact node of a candidate plan's dependency graph whose supporting evidence fails, the
    root of a revision traversal
  kind: record
  notes: Its reachable descendants $\text{Desc}(v)$ are the artifacts to re-evaluate.
- macro: \KeepContextPathCost
  latex: C_{\text{keep}}
  definition: remaining token cost of a trajectory that keeps its full uncompacted context, as a function
    of the remaining call count
  kind: function
  unit: USD
- macro: \KvBlockSize
  latex: S_{\text{blk}}
  definition: number of token positions in one fixed block of a paged KV cache
  kind: count
  notes: Tail waste per sequence is between $0$ and $\KvBlockSize-1$ tokens.
  aliases:
  - \KvBlockSizeBlk
- macro: \KvBlockTailWaste
  latex: \Delta_{\text{tail}}
  definition: number of unused token positions in the last block of one sequence under paged KV cache
    allocation
  kind: count
  notes: Lies between $0$ and $\KvBlockSize-1$; its mean is $(\KvBlockSize-1)/2$ when sequence lengths
    have uniformly distributed remainders modulo the block size. Not $\FiniteChange$, which shares the
    Delta glyph.
- macro: \KvBytesPerToken
  latex: m_{\text{token}}
  definition: bytes of KV cache one token occupies across all layers
  kind: scalar
  unit: bytes/token
  notes: $2 \cdot N_L \cdot H_{\text{KV}} \cdot d_{\text{head}} \cdot s_{\text{elem}}$, in the shared
    symbols for layers, KV heads, head dimension, and element size.
- macro: \LabeledRecord
  latex: x
  definition: record that carries integrity-provenance and confidentiality labels, such as a context item,
    a derived value or a proposal argument
  kind: record
  notes: Argument of $\IntegrityProvenance$ and $\ConfidentialityLabel$; inputs to a transformation are
    $\LabeledRecord_i$. A record, not a number.
- macro: \LabelingRoundIndex
  latex: k
  definition: position of one on-policy data-collection and retraining round
  kind: index
  notes: Indexes the mixing probability $\ReferenceMixingProbability_k$ and the policy $\pi_k$. Not \FederatedRoundIndex
    or \CompletedRoundIndex.
- macro: \LaggedStateDigest
  latex: h_{\text{state},t-k}
  definition: digest of the canonicalized workspace projection captured a recurrence period before the
    current observation step
  kind: record
  notes: Compared with $\CurrentStateDigest$ for each period $\StateRecurrencePeriod$ in the retained
    window of $\RetainedDigestCount$ digests.
- macro: \LaterRolloutTurnIndex
  latex: j
  definition: position of the later turn of a pair of reinforcement-learning rollout turns compared in
    a covariance
  kind: index
  notes: Paired with $\RolloutTurnIndex$ with $k<j$; exempt as a subscript, needs this entry in an exponent.
- macro: \LaterStepIndex
  latex: j
  definition: position of a later decision step summed over in a return, from the current step to the
    end of the episode
  kind: index
- macro: \LearnedRemainingReturnEstimate
  latex: \widehat{V}
  definition: learned value function that approximates the policy's expected remaining return at an interaction
    history, used to form temporal-difference residuals
  kind: function
  unit: dimensionless
  notes: Written $\widehat V(h_k)$, with $\widehat V(h_H)=0$ at the terminal history. A fitted critic,
    not the Monte Carlo continuation mean $\EstimatedRemainingReturn$ ($\hat V$). Approximates $V^{\pi}$
    ($\PolicyRemainingReturn$).
- macro: \LearnerStateDisagreementRate
  latex: \epsilon_\pi
  definition: probability that a learned policy's action differs from the reference policy's, averaged
    over the states the learner itself visits
  kind: scalar
  unit: dimensionless
  notes: $\epsilon_\pi = \mathbb{E}_{s\sim \StateDistribution}[\Pr(a\ne\pi^*(s))]$; enters the linear
    bound $\min\{H, uH\epsilon_\pi\}$.
- macro: \LeaseDirtyMemory
  latex: M_{\text{dirty}}
  definition: memory of the private pages one active sandbox lease writes under copy-on-write
  kind: scalar
  unit: bytes
- macro: \LeaseHoldTime
  latex: T_{\text{hold}}
  definition: mean time a trajectory holds a sandbox or other leased resource
  kind: scalar
  unit: s
  notes: Residence term of Little's law, $N_{\text{active}} = \ArrivalRate\,\LeaseHoldTime$.
- macro: \LedgerEvaluationTime
  latex: \tau
  definition: wall-clock time at which a task's spending ledger is evaluated, the argument of its settled
    charges and reserved funds in the conservation invariant
  kind: scalar
  unit: s
  notes: Argument of \LedgerSettledCharges and \LedgerReservedFunds. Kept distinct from the turn index
    $t$ that the same chapter's cost equations sum over; admission timestamps in the trailing-window limit
    remain \TimeInstant.
- macro: \LedgerFreeBalance
  latex: F
  definition: unreserved monetary balance of one budget ledger node, from which new reservations and allocations
    are drawn
  kind: scalar
  unit: USD
  notes: Written $F_k$; never negative.
- macro: \LedgerNodeIndex
  latex: k
  definition: index of one node, the root task or a delegated child, in a delegation tree whose budget
    ledger the runtime keeps
  kind: index
  notes: Subscripts the ledger balances, $E_k$, $R_k$, $F_k$.
- macro: \LedgerReservedFunds
  latex: R
  definition: monetary funds a budget ledger withholds for outstanding liabilities, delegated allocations
    and protected finalization
  kind: scalar
  unit: USD
  notes: Written $R(t)$ or $R_k$. Not a reward.
- macro: \LedgerSettledCharges
  latex: E
  definition: gross monetary charges settled into one budget ledger, of a task or of a node in its delegation
    tree
  kind: scalar
  unit: USD
  notes: Written as a function of time, $E(t)$, or with a node index, $E_k$. Not energy.
- macro: \LengthPenaltyWeight
  latex: \lambda_{\text{len}}
  definition: non-negative weight on the normalized generated-length penalty of a shaped trajectory reward
  kind: scalar
  unit: dimensionless
  notes: Pass-over-failure order holds when $\FormatRewardWeight+\LengthPenaltyWeight<1$.
- macro: \LexicalDocument
  latex: x
  definition: one indexed document that a lexical ranking function such as BM25 scores against a query
  kind: record
  notes: Its length in analyzer words is $\lvert x\rvert$; the collection mean is \MeanDocumentLength.
    Distinct from the fusion candidate \FusionCandidate.
- macro: \LexicalFrequencySaturation
  latex: k_1
  definition: tuning parameter of BM25 lexical ranking that sets how quickly repeated occurrences of a
    query word stop adding to a document's score
  kind: scalar
  unit: dimensionless
  notes: As the occurrence count grows, the frequency factor rises toward $k_1+1$. The subscript 1 is
    part of the name, not an index.
- macro: \LexicalLengthNormalization
  latex: b
  definition: tuning parameter in [0, 1] of BM25 lexical ranking that sets how strongly a document's score
    is penalized for its length relative to the collection mean
  kind: scalar
  unit: dimensionless
  notes: One means full length normalization, zero disables it. Not \NumericBitWidth.
- macro: \LexicalQuery
  latex: Q
  definition: lexical query as the multiset of analyzer words a ranking function such as BM25 scores documents
    against
  kind: record
  notes: Summed over as $q \in Q$. Kind record rather than set so the italic capital needs no render exception.
- macro: \LintFalseAcceptFraction
  latex: \phi
  definition: fraction of the tasks a cheap replacement gate exits that violate the independently assessed
    operational criterion
  kind: scalar
  unit: dimensionless
- macro: \LiveAutomatonStateSet
  latex: Q_{\text{live}}
  definition: set of automaton states from which some finite sequence of ordinary vocabulary tokens reaches
    an accepting state
  kind: set
  notes: A subset of \AutomatonStateSet. Avoiding a syntax error is not enough; a tokenized completion
    must remain possible.
  render_exception: Finite-automaton convention writes the state set, alphabet and accepting set as italic
    or Greek capitals; the kind rule would ask for calligraphic.
- macro: \LogFailureRatio
  latex: s_{\text{fail}}
  definition: natural logarithm of the probability that a claim-size subset of graded runs contains no
    pass, accumulated factor by factor
  kind: scalar
  unit: dimensionless
  notes: One minus its exponential is the pass@k estimate.
- macro: \LogPositionIndex
  latex: j
  definition: position of one entry or boundary in a trajectory's durable append-only log, counted from
    one
  kind: index
  notes: 'Distinct from the turn index t: one turn can append several log records.'
- macro: \LoggedEvent
  latex: e
  definition: one event recorded in a trajectory's durable append-only log, numbered by its log position
  kind: record
  notes: Indexed by log position (e_1, e_j). Not the base of the natural exponential, and not the named
    ordering events e_{\text{prop}} to e_{\text{obs}}.
- macro: \LoggedEventPrefix
  latex: \mathbf{e}_{1:j}
  definition: ordered sequence of the events in a trajectory's durable append-only log, from the first
    entry through a given log position
  kind: record
  notes: The range 1:j is part of the rendered symbol; j is the log position (\LogPositionIndex), not
    the turn index t. Each element is one \LoggedEvent.
- macro: \LogitMask
  latex: \mathbf{M}
  definition: vector of additive logit masks over the vocabulary for one parser state, zero on valid tokens
    and minus infinity elsewhere
  kind: vector
  notes: Entries are $\LogitMaskEntry$. Not the pruning mask $\PruningMask$, which shares the glyph.
- macro: \LogitMaskEntry
  latex: M
  definition: additive mask value for one vocabulary token, zero if the token is valid in the parser state
    and minus infinity otherwise
  kind: scalar
  unit: dimensionless
  notes: Indexed by token, $M_i(\DecodingConstraintState_t)$; entries of $\LogitMask$. Not memory.
- macro: \LonePassAdvantage
  latex: \hat{A}_{\text{pass}}
  definition: group-relative coefficient of the single passing rollout in a binary-reward group with exactly
    one pass
  kind: scalar
  unit: dimensionless
  notes: Approaches $\sqrt{\GroupSize-1}$ as $\AdvantageStabilizer\to0$.
- macro: \LoopAcceptanceProbability
  latex: p_{\text{loop}}
  definition: probability that a bounded agent loop produces an accepted candidate within its turn cap,
    a function of the cap
  kind: function
  unit: dimensionless
- macro: \LoopTurnCost
  latex: C
  definition: 'monetary cost of one turn of a bounded agent loop: inference, tool execution, sandbox lease
    and assessment'
  kind: scalar
  unit: USD
  notes: Indexed by turn, $C_t$.
- macro: \LostSuffixTurnCount
  latex: H_{\text{suffix},i}
  definition: number of completed turns past the most recent checkpoint when one crash in a trace occurs,
    as a function of the checkpoint stride
  kind: count
  notes: The crash index i is part of the rendered symbol; the stride is the argument. Not the horizon
    \TurnHorizon.
- macro: \LowerRatioClippingWidth
  latex: \epsilon_{\text{low}}
  definition: distance below one at which the clip-higher surrogate stops penalizing a falling probability
    ratio
  kind: scalar
  unit: dimensionless
  notes: Smaller than $\UpperRatioClippingWidth$ in clip-higher.
- macro: \MarginalFalseApprovalProbability
  latex: p
  definition: probability that one model reviewer approves a candidate known to be invalid, averaged over
    the candidate population
  kind: scalar
  unit: dimensionless
  notes: Equals $\mathbb{E}[\FalseApprovalPropensity]$ in the latent-propensity model. Compare $\VerifierFalseAcceptanceRate$,
    a single verifier's false-acceptance rate.
- macro: \MarginalLimitDistance
  latex: \delta
  definition: distance from a marginal acceptance estimate to one limit of its Wilson interval, the downward
    or upward half-width
  kind: scalar
  unit: dimensionless
  notes: Written with a side superscript and a configuration label, $\delta^-_{\text{cand}}$, $\delta^+_{\text{base}}$.
    Not the temporal-difference residual.
- macro: \MarginalStoppingThreshold
  latex: \epsilon_{\text{stop}}
  definition: smallest gain in the calibrated probability of an acceptable result per unit of added cost
    for which a search keeps admitting work
  kind: scalar
  unit: 1/USD
  notes: An economic choice, not an error rate (exercise 9 uses 0.25 per dollar). Not the per-step error
    rate $\PerStepErrorRate$.
- macro: \MaskTokenIndex
  latex: i
  definition: index of one vocabulary token whose logit a grammar mask keeps or removes
  kind: index
  notes: Ranges over $\TokenVocabulary$; in the sampling equations the evaluated token is $\VocabularyToken$.
- macro: \MaskedFinetuningLoss
  latex: \mathcal{L}_{\text{SFT}}
  definition: mean cross-entropy over the token positions the loss mask selects, for one example
  kind: function
  unit: nats
  notes: $-\frac{1}{N_{\text{active}}}\sum_t \PositionLossMask \log \Policy(x_t \mid x_{<t})$ with $N_{\text{active}}
    = \sum_t \PositionLossMask > 0$.
  aliases:
  - \MaskedFinetuningLossSft
- macro: \MaskedLogitVector
  latex: \mathbf{z}'
  definition: vector of next-token logits after the grammar constraint mask is added, unchanged on valid
    tokens and minus infinity elsewhere
  kind: vector
  unit: dimensionless
  notes: Indexed by decoding step, $\mathbf{z}'_t = \LogitVector_t + \LogitMask$; entries are $\MaskedTokenLogit$.
    The unmasked vector is $\LogitVector$.
- macro: \MaskedTokenLogit
  latex: z'
  definition: logit of one vocabulary token at a decoding step after the constraint mask, equal to its
    logit when allowed and minus infinity otherwise
  kind: scalar
  unit: dimensionless
  notes: Written with step and token indices after it, $z'_{t,v}$. The unmasked logit is \StepTokenLogit.
    02_foundation_model writes the same masked logit $z'_{t,i}$.
- macro: \MaximumBreakerCooldownInterval
  latex: T_{\text{cool}}^{\max}
  definition: largest cooldown a circuit breaker reaches when repeated failed probes keep doubling it
  kind: scalar
  unit: s
  notes: Caps $\BreakerCooldownInterval$ in $\BreakerCooldownInterval \leftarrow \min(2\,\BreakerCooldownInterval,
    \MaximumBreakerCooldownInterval)$.
- macro: \MaximumRetryBackoffInterval
  latex: b_{\max}
  definition: cap on the backoff interval of any single retry under capped exponential backoff
  kind: scalar
  unit: s
  notes: Caps the span of individual delay intervals, not the number of attempts.
- macro: \MeanAttemptCost
  latex: c
  definition: expected all-inclusive monetary cost of one attempt at a task, the same for every attempt
    under the independent-trials model
  kind: scalar
  unit: USD
  notes: Equals $\mathbb{E}[\AttemptCost]$ when attempts are identical; the planning ratio is $c/\AttemptPassProbability$.
- macro: \MeanDeliveryPayloadLength
  latex: L
  definition: mean number of tokens one message delivery between agents carries
  kind: scalar
  unit: tokens
  notes: A full-mesh round costs $\WorkerCount(\WorkerCount-1)L$ tokens, a supervisor round $2\WorkerCount
    L$. Not latency or loss.
- macro: \MeanDocumentLength
  latex: \overline{|x|}
  definition: mean length, in analyzer words, of the documents in a lexically indexed collection
  kind: scalar
  unit: words
  notes: Analyzer words, not the foundation model's tokens. A single document's length is $\lvert x\rvert$
    for \LexicalDocument $x$.
- macro: \MeanRolloutLength
  latex: \bar{N}
  definition: mean number of sampled policy tokens per rollout over a group or microbatch, used as a shared
    loss divisor
  kind: scalar
  unit: tokens
  notes: The constant divisor of $\ConstantDivisorGrpoObjective$; the mean of $\RolloutPolicyTokenCount_i$.
- macro: \MeanStoredTokensPerRecord
  latex: \bar{S}
  definition: average number of stored tokens per retained record of one trajectory category, context
    and targets together, under the active tokenizer
  kind: scalar
  unit: tokens
  notes: Per category, written $\bar S^{(j)}$; stored tokens set attention compute and memory traffic.
- macro: \MeanTargetTokensPerRecord
  latex: \bar{w}
  definition: average number of loss-selected target tokens per record of one trajectory category admitted
    into an imitation fine-tuning artifact
  kind: scalar
  unit: tokens
  notes: Per category, $\bar w_j$; target tokens set the volume of supervised gradient updates.
- macro: \MeanVerifierServiceTime
  latex: \bar{T}_{\text{svc}}
  definition: mean time one verifier slot spends assessing one record
  kind: scalar
  unit: s
  notes: Pool capacity is $\WorkerCount/\MeanVerifierServiceTime$ records per second and utilization $\ServingUtilization=\ArrivalRate\,\MeanVerifierServiceTime/\WorkerCount$.
- macro: \MechanismAcceptanceProbability
  latex: p'_{\text{acc}}
  definition: probability that one attempt at a task is accepted with an added mechanism, such as a check,
    a sandbox boundary or a prompt cache, in place
  kind: scalar
  unit: dimensionless
  notes: Compared with $\AcceptanceProbability$ in $C'_{\text{attempt}}/p'_{\text{acc}} < \AttemptCost/\AcceptanceProbability$.
    Pairs with $\MechanismAttemptCost$.
- macro: \MechanismAttemptCost
  latex: C'_{\text{attempt}}
  definition: full monetary cost of one attempt at a task with an added mechanism, such as a check, a
    sandbox boundary or a prompt cache, in place
  kind: scalar
  unit: USD
  notes: The mechanism pays when $C'_{\text{attempt}}/p'_{\text{acc}} < \AttemptCost/\AcceptanceProbability$.
    Pairs with $\MechanismAcceptanceProbability$.
- macro: \MemoryEntryBirthGeneration
  latex: g_{\text{birth}}
  definition: source generation from which a derived memory entry is supported
  kind: index
  notes: An entry $c$ is valid for a query at generation $\QueryWorkspaceGeneration$ when $\MemoryEntryBirthGeneration
    \le \QueryWorkspaceGeneration < \MemoryEntryDeathGeneration$.
  aliases:
  - \ValidityIntervalOfAMemoryEntryBirth
- macro: \MemoryEntryDeathGeneration
  latex: g_{\text{death}}
  definition: source generation at which a later edit stops supporting a derived memory entry
  kind: index
  notes: Open until a subsequent edit to the source scope closes the interval.
  aliases:
  - \ValidityIntervalOfAMemoryEntryDeath
- macro: \MemoryHoldDuringWait
  latex: O_{\text{mem}}
  definition: accelerator memory a paused trajectory withholds, multiplied by how long it waits
  kind: scalar
  unit: bytes*s
  notes: $\KvcacheMemory \cdot \ExternalWait$ when the payload is fully resident and unshared.
  aliases:
  - \MemoryHeldDuringAWait
- macro: \MisroutedQueryFraction
  latex: m
  definition: fraction of queries in each class that a router sends to the wrong architecture
  kind: scalar
  unit: dimensionless
  notes: Exercise quantity for routing between a fixed workflow and a model-directed loop.
- macro: \ModelCallIndex
  latex: i
  definition: position of one model call among the calls whose staged tool definitions are counted
  kind: index
  notes: Runs from 1 to $\CatalogStagingCallCount$.
- macro: \ModelCallRequest
  latex: \mathcal{R}
  definition: 'bounded request one model call sends: prompt tokens, model identifier, output limit, deadline,
    stop sequences and sampling parameters'
  kind: record
  notes: $\mathcal{R} = \langle \RequestPromptTokens, \text{ModelID}, \OutputLimit, \CompletionDeadline,
    \StopSequenceSet, \SamplingParameters \rangle$.
- macro: \ModelTime
  latex: T_{\text{model}}
  definition: time a turn spends in model calls
  kind: scalar
  unit: s
  notes: Time spent in model calls during a turn.
- macro: \ModelTimeFraction
  latex: f
  definition: share of a trajectory's baseline elapsed time spent in model execution, the fraction a faster
    model can shorten
  kind: scalar
  unit: dimensionless
  notes: Sets the ceiling $1/(1-f)$ on whole-trajectory speedup from model acceleration.
- macro: \MonitorStartupTime
  latex: T_{\text{vmm}}
  definition: time to start the virtual machine monitor for one sandbox instance
  kind: scalar
  unit: s
- macro: \MultiAgentAcceptanceProbability
  latex: p_{\text{multi}}
  definition: probability that one attempt by a delegated multi-agent configuration is accepted
  kind: scalar
  unit: dimensionless
  notes: The delegated case of $\AcceptanceProbability$; break-even on cost per accepted task needs it
    to reach $\DelegationTokenMultiple$ times $\SingleAgentAcceptanceProbability$.
- macro: \MutatingToolAction
  latex: a
  definition: mutation one tool call performs on an external system, the action whose outcome a timeout
    can leave unknown
  kind: record
  notes: Argument of actuate, probe and compensate in the reconcilable tool interface $\ReconcilableToolInterface$.
    Not the policy action $\PolicyAction$ or the turn's proposal $\TrajectoryAction$.
- macro: \NextDecisionProcessState
  latex: s'
  definition: environment state of a decision process that a transition leads to after an action is taken
    in the current state
  kind: record
  notes: The successor of $\DecisionProcessState$ in the transition law $p(s'\mid s,a)$, the observation
    law $\mathsf{O}(o\mid s',a)$ and the belief update. The normalizing sum of the belief update ranges
    over $\NormalizingNextState$ instead.
- macro: \NextTokenEntropy
  latex: \mathcal{H}
  definition: entropy of a policy's next-token distribution after a delivered prefix
  kind: function
  unit: nats
  notes: Written with its distribution, $\mathcal{H}(\Policy(\cdot\mid x_{<t}))$; natural logarithms give
    nats. Calligraphic so it is not read as the horizon $\TurnHorizon$.
- macro: \NoninferiorityTolerance
  latex: \delta_{\text{tol}}
  definition: declared largest loss in acceptance probability that a candidate may show against its baseline
    and still count as noninferior
  kind: scalar
  unit: dimensionless
  notes: The paired gate requires $L_\Delta>-\delta_{\text{tol}}$; stated in percentage points in the
    chapter. Not \DivergenceTolerance.
- macro: \NormalizedElapsedTimeRatio
  latex: D
  definition: elapsed time of a fixed work partition split across workers divided by its serial elapsed
    time, the reciprocal of the speedup
  kind: function
  unit: dimensionless
  notes: Written with its worker count, $D(\WorkerCount)$; equals one at a single worker. Not dataset
    size.
- macro: \NormalizedStatusEnvelope
  latex: \mathcal{N}
  definition: 'normalized record of a model call''s observed outcome: a status, the returned payload and
    its metadata'
  kind: record
  notes: $\mathcal{N} = \langle \text{status}, \ResponsePayload, \ResponseMetadata \rangle$; statuses
    are those of the invocation-status table.
- macro: \NormalizerTokenIndex
  latex: w
  definition: token of the vocabulary that a softmax normalizer sums over
  kind: index
  notes: Bound variable of the normalizing sum, kept distinct from the evaluated token $\VocabularyToken$.
- macro: \NormalizingNextState
  latex: \tilde{s}
  definition: candidate next environment state that the normalizing sum of a belief update ranges over
  kind: record
  notes: Summation variable of the denominator in the Bayes belief update; plays the role of $s'$ in the
    numerator.
- macro: \NoticeByteAllocation
  latex: M_{\text{notice}}
  definition: bytes of the observation budget reserved for the notice that reports how many bytes were
    omitted
  kind: scalar
  unit: bytes
  notes: One of the three parts of $\ObservationByteBudget$.
- macro: \ObjectHandle
  latex: h
  definition: typed handle passed as a tool argument that designates a host-held object, carrying its
    own labels for what influenced its selection
  kind: record
  notes: Checked with effective labels $\EffectiveIntegrityProvenance$ and $\EffectiveConfidentialityLabel$
    that join the handle's labels with its object's, $\text{obj}(h)$. Not the interaction history $\InteractionHistory$.
- macro: \ObservationBinding
  latex: \lambda
  definition: function that binds a staged observation to the artifact it describes, as an artifact, kind,
    revision, range and content identifier tuple
  kind: function
  notes: A tool write to the artifact marks every bound observation historical. Not the trace decay or
    a failure or arrival rate, which also use $\lambda$ in this volume.
- macro: \ObservationByteBudget
  latex: M_{\text{obs},\max}
  definition: maximum number of bytes of captured tool output staged as one observation
  kind: scalar
  unit: bytes
  notes: A head-and-tail policy splits it as $\ObservationByteBudget = \HeadByteAllocation + \NoticeByteAllocation
    + \TailByteAllocation$. Set in bytes for memory safety; the staged observation is then admitted in
    tokens against $\ObservationTokenCount$.
- macro: \ObservationIntervalEnd
  latex: t_{b}
  definition: time at which an observation interval closes, its excluded end
  kind: scalar
  unit: s
  notes: Pairs with \ObservationIntervalStart.
- macro: \ObservationIntervalStart
  latex: t_{a}
  definition: time at which an observation interval opens, its included start
  kind: scalar
  unit: s
  notes: With \ObservationIntervalEnd it bounds $[t_a,t_b)$, whose length is \ObservationIntervalLength.
- macro: \ObservationTokenCount
  latex: S_{\text{obs}}
  definition: number of tokens one call devotes to immediate tool observations and user steering, the
    observation buffer of the context budget
  kind: count
  notes: Partition term of the context budget.
- macro: \ObservedLabelCount
  latex: n
  definition: number of task labels a sequential test has observed so far
  kind: count
  notes: Indexes the running statistics $\CumulativeLogLikelihoodRatio_n$ and $\AcceptedLabelCount_n$.
    Same quantity as \SequentialTestObservationCount ($m$) rendered as the release chapter does.
- macro: \OperationChargeBound
  latex: \bar{c}
  definition: enforced upper bound on the maximum monetary charge one billable operation can incur, reserved
    before it is dispatched
  kind: scalar
  unit: USD
  notes: Indexed by operation, $\bar c_i$, in the trailing-window admission limit.
- macro: \OperationRecipient
  latex: r
  definition: recipient a proposed operation would send its argument values to, as resolved by the host
  kind: record
  notes: The release check is $\OperationRecipient \in \ConfidentialityLabel(\LabeledRecord)$. Not the
    per-turn read count $\TurnReadCount$.
- macro: \OperationReconciliationTime
  latex: T_{\text{rec}}
  definition: time to reconcile a trajectory's outstanding external operations during resume
  kind: scalar
  unit: s
- macro: \OptimalCheckpointInterval
  latex: T^\ast_{\text{ckpt}}
  definition: checkpoint interval that minimizes expected overhead from checkpoint writes and lost work
  kind: scalar
  unit: s
  notes: Young's approximation, $\sqrt{2\,\CheckpointWriteTime\,\SystemMtbf}$, with the system (not per-component)
    MTBF.
  aliases:
  - \OptimalCheckpointIntervalCkpt
- macro: \OptimumMissFactor
  latex: x
  definition: factor by which a chosen checkpoint interval or stride differs from its optimum, the argument
    of the flat-minimum overhead ratio
  kind: scalar
  unit: dimensionless
- macro: \OrphanSweepInterval
  latex: T
  definition: time between successive runs of a sweep that deletes environments no obligation owns
  kind: scalar
  unit: s
  notes: Local to the lost-provisioning-reply exercise; an orphan's creation time is uniform within the
    interval, so it lingers half an interval on average.
- macro: \OscillationPriorStateDigest
  latex: h_{\text{state},t-2}
  definition: digest of the canonicalized workspace projection captured two observation steps before the
    current one
  kind: record
  notes: 'The period-two case of $\LaggedStateDigest$: equality with $\CurrentStateDigest$ marks an agent
    toggling between two candidate patches.'
- macro: \OutcomeCheckPassProbability
  latex: p_{\text{out}}
  definition: probability that a candidate passes the outcome-verification predicate of an admission route
  kind: scalar
  unit: dimensionless
  notes: The pass probability $p_i$ of $\text{chk}_{\text{out}}$.
- macro: \OutcomeCheckSlotTime
  latex: T_{\text{out}}
  definition: expected verifier slot time of the outcome-verification predicate for a record that reaches
    it
  kind: scalar
  unit: s
  notes: The slot time $T_i$ of $\text{chk}_{\text{out}}$. Same glyph as $\VerifierTimeout$, in another
    section of the chapter.
- macro: \OutputLength
  latex: K
  definition: number of tokens a call generates
  kind: count
  notes: Lowercase $k$ is reserved for sample counts, as in pass@$k$.
- macro: \OutputLimit
  latex: K_{\max}
  definition: maximum number of tokens the runtime lets a call generate
  kind: count
  notes: Reserved output headroom inside $\ContextWindow$.
- macro: \OutputToken
  latex: y
  definition: token a language model generates at one output position
  kind: record
  notes: Indexed by output position, $y_t$. Distinct from the bold response payload $\ResponsePayload$.
- macro: \OutputTokenPrefix
  latex: y_{<t}
  definition: output tokens generated before the current position, the prefix the next token conditions
    on
  kind: record
  notes: Equals $y_{1:t-1}$. A token sequence, not a number.
- macro: \OutputTokenPrice
  latex: c_{\text{out}}
  definition: price of one generated output token
  kind: scalar
  unit: USD/token
  notes: Lowercase $c$ is a unit price that an uppercase $C$ totals.
  aliases:
  - \PertokenPricesOut
- macro: \OutputTokenSequence
  latex: y_{1:K}
  definition: sequence of tokens one call generates, positions one through the output length
  kind: record
  notes: Renders as $y_{1:K}$. A token sequence, not a number.
- macro: \OutstandingItemCount
  latex: N_{\text{out}}
  definition: number of admitted items still holding a credit, from admission to their capacity-release
    boundary
  kind: count
  notes: Equals the window capacity when the window is saturated.
- macro: \OwnershipAcquisitionTime
  latex: T_{\text{own}}
  definition: time a replacement worker takes to acquire a trajectory's ownership fence before resuming
    it
  kind: scalar
  unit: s
- macro: \PageRankDampingFactor
  latex: d
  definition: damping factor of personalized PageRank, the weight on following graph edges rather than
    teleporting to the personalization vector
  kind: scalar
  unit: dimensionless
  notes: $0\le d<1$; the update contracts differences by at most $d$. Not the differential \DerivativeOperator.
- macro: \PageRankScoreVector
  latex: \mathbf{r}
  definition: personalized PageRank score vector over the symbols of a repository graph, the unique fixed
    point of the damped update
  kind: vector
  notes: $\mathbf{r}=(1-d)\mathbf{p}+d\mathbf{P}_{\text{graph}}^T\mathbf{r}$; sorted to pack a repository
    map within a token budget.
- macro: \PairedAcceptanceDifference
  latex: \Delta
  definition: difference between a candidate's and a baseline's acceptance probabilities over the task
    population, measured on the same tasks
  kind: scalar
  unit: dimensionless
  notes: The estimand of a paired comparison and of its noninferiority gate; the estimate is \EstimatedPairedAcceptanceDifference.
    Not \TargetAcceptanceDifference (a planning input) nor the prefix operator \FiniteChange.
- macro: \PairedDifferenceLowerLimit
  latex: L_{\Delta}
  definition: lower endpoint of a confidence interval for the paired acceptance difference between a candidate
    and its baseline
  kind: scalar
  unit: dimensionless
  notes: The noninferiority gate checks $L_\Delta>-\delta_{\text{tol}}$. Computed by Newcombe's paired-score
    method 10 in appendix_math.
- macro: \PairedDifferenceUpperLimit
  latex: U_{\Delta}
  definition: upper endpoint of a confidence interval for the paired acceptance difference between a candidate
    and its baseline
  kind: scalar
  unit: dimensionless
  notes: Pairs with \PairedDifferenceLowerLimit; appendix_math gives its Newcombe method-10 formula.
- macro: \PairedOutcomeCellCount
  latex: n
  definition: number of paired tasks in one cell of the baseline-by-candidate outcome table, indexed by
    the baseline outcome then the candidate outcome, 1 for accepted and 0 for rejected
  kind: count
  notes: Written $n_{11}$ (both accepted) and $n_{00}$ (both rejected); the discordant cells have their
    own names, \BaselineOnlyAcceptedTaskCount and \CandidateOnlyAcceptedTaskCount.
- macro: \PairedVerdictCorrelation
  latex: \hat{\phi}
  definition: estimated correlation (phi coefficient) between the baseline and candidate verdicts on the
    same task, with a continuity-corrected numerator when positive
  kind: scalar
  unit: dimensionless
  notes: Zero when its denominator is zero. A positive value narrows Newcombe's paired interval; setting
    it to zero discards the pairing.
- macro: \PairwiseCoordinationCoefficient
  latex: \beta_{\text{pair}}
  definition: coordination overhead each pair of workers adds, as a fraction of serial time, in an assumed
    quadratic overhead model
  kind: scalar
  unit: dimensionless
  notes: Multiplies $\WorkerCount(\WorkerCount-1)$ in $\CoordinationOverhead(\WorkerCount)$; zero recovers
    the universal scalability law.
- macro: \ParallelFraction
  latex: f_{\text{parallel}}
  definition: share of the work that divides among workers
  kind: scalar
  unit: dimensionless
  notes: 'Amdahl''s law: $\text{Speedup} \le 1/((1-\ParallelFraction) + \ParallelFraction/\WorkerCount)$,
    plus $\CoordinationOverhead(\WorkerCount)$ in the coordination bound.'
- macro: \ParameterSpaceDirection
  latex: u
  definition: fixed direction in a model's parameter space onto which a gradient estimate is projected
    to study its variance as a scalar
  kind: vector
  notes: Used as $\ParameterSpaceDirection^T\PolicyGradientEstimate$. Not the disadvantage bound of the
    imitation bounds, which shares the glyph.
  render_exception: Keeps the appendix's non-bold u for a parameter-space direction, matching the non-bold
    gradient estimate it projects.
- macro: \ParentCapabilityGrant
  latex: \Gamma_{\text{parent}}
  definition: capability grant from which a narrower child grant is derived
  kind: record
  notes: Remains usable after deriving a child unless the runtime withdraws it.
- macro: \ParentFreeBalance
  latex: F_{P}
  definition: unreserved monetary balance of the delegating parent node's ledger
  kind: scalar
  unit: USD
  notes: Parent case of \LedgerFreeBalance.
- macro: \ParentReservedFunds
  latex: R_{P}
  definition: monetary funds the delegating parent node's ledger withholds, including allocations delegated
    to its children
  kind: scalar
  unit: USD
  notes: Parent case of \LedgerReservedFunds.
- macro: \ParentSettledCharges
  latex: E_{P}
  definition: gross monetary charges settled into the delegating parent node's budget ledger
  kind: scalar
  unit: USD
  notes: Parent case of \LedgerSettledCharges.
- macro: \ParetoMinimumDemand
  latex: x_{\min}
  definition: smallest demand a Pareto tail model allows, its scale parameter
  kind: scalar
  unit: varies
  notes: Same unit as \ParetoTaskDemand. Not \BoxMinimumHorizontalCoordinate.
- macro: \ParetoTailExponent
  latex: \alpha_{\text{tail}}
  definition: tail index of a Pareto model, the exponent at which the probability of exceeding a demand
    falls with that demand
  kind: scalar
  unit: dimensionless
  notes: Mean finite only for $\alpha_{\text{tail}}>1$, second moment only for $\alpha_{\text{tail}}>2$.
    Not \AcceptanceFraction.
- macro: \ParetoTaskDemand
  latex: X
  definition: unconstrained demand of a task, such as its step count, modeled as a continuous Pareto random
    variable
  kind: scalar
  unit: varies
  notes: Unit is that of the demand modeled, such as steps or seconds. Finite mean only for $\alpha_{\text{tail}}>1$;
    capped as $\min(X,x_{\max})$.
- macro: \PassAtK
  latex: \text{pass}@k
  definition: probability that at least one of k runs of a task passes, averaged over tasks
  kind: scalar
  unit: dimensionless
  notes: With independent attempts, $1-(1-\AttemptPassProbability)^k$. Candidate availability, not selected
    acceptance.
- macro: \PassAtKEstimate
  latex: \widehat{\operatorname{pass@}k}
  definition: unbiased estimate of pass@k for one task from a set of generated candidates, one minus the
    share of size-k subsets that contain no passing candidate
  kind: scalar
  unit: dimensionless
  notes: $1-\binom{n-c}{k}/\binom{n}{k}$ with $\GeneratedSampleCount$ generated and $\PassingSampleCount$
    passing; the plug-in $1-(1-c/n)^k$ is biased. Estimates $\PassAtK$.
- macro: \PassingRunCount
  latex: s
  definition: number of one task's fully graded repeated runs that pass, the count from which an all-runs-pass
    consistency estimate draws its passing subsets
  kind: count
  notes: Indexed by task, $\PassingRunCount_i \le R_i$ with $R_i$ the task's graded runs (\PerTaskRunCount);
    the consistency estimator is $\binom{\PassingRunCount_i}{k}/\binom{R_i}{k}$. Distinct from \PassingSampleCount
    ($c$), the passing candidates of the pass@k availability estimate, and from the McNemar discordant
    count \CandidateOnlyAcceptedTaskCount ($c$).
- macro: \PassingSampleCount
  latex: c
  definition: number of the candidates generated for one task in a pass@k estimate that pass the test
    criterion
  kind: count
  notes: At most $\GeneratedSampleCount$; the subset estimator counts the $\binom{n-c}{k}$ all-failing
    subsets.
- macro: \PeerReviewerIndex
  latex: i
  definition: index of the other reviewer of a pair whose errors are compared with reviewer j's
  kind: index
  notes: Distinct from $\ReviewerIndex$ in a pairwise covariance.
- macro: \PeerToolCallIndex
  latex: j
  definition: index of a second tool call in the same batch, checked against call i for noninterference
  kind: index
  notes: Paired with $\ToolCallIndex$ in Bernstein's conditions.
- macro: \PerStepErrorRate
  latex: \epsilon
  definition: probability that one unchecked turn of a trajectory is wrong
  kind: scalar
  unit: dimensionless
  notes: Assumed independent across turns, so an unchecked horizon succeeds with $(1-\PerStepErrorRate)^{\Horizon}$.
    Verifier error rates and $\StaleSupportRate$ carry subscripts.
- macro: \PerTaskRunCount
  latex: R
  definition: number of independent runs an evaluation gives each sampled task
  kind: count
  notes: Divides only the run term of the variance decomposition; distinct from the $k$ runs over which
    pass at k and pass to the k are computed. Not \TrajectoryReward ($R$).
- macro: \PerTokenDecodeTime
  latex: t_{\text{decode}}
  definition: time to generate one output token on a single stream
  kind: scalar
  unit: s
  notes: At least $\Parameters\,\ElementStorageSize/\Bandwidth$ when decoding is memory-bandwidth bound.
    A whole call output takes $\DecodeInterval$.
  aliases:
  - \PertokenDecodeTime
- macro: \PerTokenKlEstimate
  latex: \hat{\mathcal{D}}
  definition: non-negative per-token estimate of the Kullback-Leibler divergence of the current policy
    from the reference policy
  kind: scalar
  unit: nats
  notes: Indexed by rollout and token; equals $z-\log z-1$ with $z=\ReferenceProbabilityRatio$. Its expectation
    under the current policy is $\KlDivergence$.
- macro: \PerTokenMaskingTime
  latex: t_{\text{mask}}
  definition: time constrained decoding adds to each output token to compute and apply the grammar mask
  kind: scalar
  unit: s
  notes: Added to $\PerTokenDecodeTime$ per token, so a constrained call of $\OutputLength$ tokens pays
    $\OutputLength\,\PerTokenMaskingTime$ of masking. Excludes schema compilation and setup.
- macro: \PerTokenPrefillTime
  latex: t_{\text{prefill}}
  definition: time prefill spends per prompt token at the compute-bound floor, about two operations per
    parameter at peak rate
  kind: scalar
  unit: s
  notes: About $2\Parameters/\PeakRate$. Pairs with $\PerTokenDecodeTime$; $T_{\text{prefill}} \approx
    \SequenceLength\,t_{\text{prefill}}$.
- macro: \PermittedActions
  latex: \mathcal{A}_{\text{perm}}
  definition: set of tools the task may call, with the limits on each
  kind: set
  notes: Third element of the task contract $\TaskContract$; least privilege stated per task.
- macro: \PermittedUsePassProbability
  latex: p_{\text{use}}
  definition: probability that a candidate passes the permitted-use predicate (provenance, licensing,
    access rights, split compatibility)
  kind: scalar
  unit: dimensionless
  notes: The pass probability $p_i$ of $\text{chk}_{\text{use}}$.
- macro: \PersonalizationVector
  latex: \mathbf{p}
  definition: nonnegative vector over the symbols of a repository graph, summing to one, toward which
    personalized PageRank teleports
  kind: vector
  notes: Also replaces the row of a dangling symbol, $\mathbf{p}^T$. Favors symbols implicated by the
    task; an input preference, not evidence of necessity.
- macro: \PlanAction
  latex: a
  definition: one action of an execution plan, as the expected irreversible loss sums over the plan's
    actions
  kind: record
  notes: Used as the summation variable and argument in $\sum_a \Pr(\text{bad}\ a)\cdot\text{consequence}(a)\cdot(1-\rho_a)$.
    Not \TrajectoryAction ($a_t$), the action a model proposes on one turn.
- macro: \Policy
  latex: \pi_\theta
  definition: learned model viewed as a mapping from context or observation to actions, with parameters
    theta
  kind: function
  notes: A stochastic policy gives a distribution over actions, $\Policy(a \mid s)$. A local derivation
    that writes a fixed policy as bare $\pi$ says so.
- macro: \PolicyAction
  latex: a
  definition: action a policy chooses given the state it observes
  kind: record
  notes: The argument of $\Policy$ in $\pi_\theta(a \mid s)$; agentic rollouts use $\RolloutAction$.
- macro: \PolicyCheckpoint
  latex: v
  definition: policy checkpoint that generated one model invocation of a rollout, indexed by invocation
  kind: record
  notes: Indexed by invocation, $v_1$, $v_2$. A record identifying weights, not a number.
- macro: \PolicyGradientBaseline
  latex: b
  definition: offset subtracted from the return in a policy-gradient estimator, a function of the interaction
    history that does not depend on the sampled action
  kind: scalar
  unit: dimensionless
  notes: Written with its argument, $b(\InteractionHistory_k)$. Fixed, task-specific, or a learned value
    estimate; subtracting it leaves the gradient unbiased.
- macro: \PolicyGradientEstimate
  latex: \widehat{g}
  definition: likelihood-ratio estimate of the gradient of a policy's expected reward with respect to
    its parameters, computed from one sampled trajectory
  kind: vector
  notes: Sums $\nabla_\theta\log\Policy$ of each sampled action times the baselined reward. Projected
    onto a direction as $\ParameterSpaceDirection^T\PolicyGradientEstimate$ to study its variance.
  render_exception: Keeps the policy-gradient literature's non-bold hatted g for the gradient estimator,
    as the appendix writes it.
- macro: \PolicyHistoryActionReturn
  latex: Q^{\pi}
  definition: expected remaining return under the current policy after taking a given action at a given
    interaction history and then following that policy
  kind: function
  unit: dimensionless
  notes: Written $\PolicyHistoryActionReturn(h_k,a_k)$. The superscript names the policy that continues;
    the bare letter is $\ExpectedHistoryActionReturn$. Same meaning as $\ExpectedActionReturn$, whose
    LaTeX bakes in the index t.
- macro: \PolicyHistoryAdvantage
  latex: A^{\pi}
  definition: expected return of taking a given action at a given interaction history under the current
    policy minus that policy's expected remaining return at the same history
  kind: function
  unit: dimensionless
  notes: Written $\PolicyHistoryAdvantage(h_k,a_k) = \PolicyHistoryActionReturn(h_k,a_k) - \PolicyRemainingReturn(h_k)$.
    The superscript names the policy that continues; the bare letter is $\HistoryAdvantage$. The true
    quantity that $\EstimatedHistoryAdvantage$ and the group-relative coefficient $\GroupRelativeAdvantage$
    estimate. Not an authority level.
- macro: \PolicyObservedState
  latex: s
  definition: state or observation a policy conditions its choice of action on
  kind: record
  notes: The conditioning argument of $\Policy$ in $\pi_\theta(a \mid s)$.
- macro: \PolicyProbabilityRatio
  latex: \rho
  definition: ratio of a sampled token's probability under the current policy to its probability under
    the behavior policy that generated it
  kind: scalar
  unit: dimensionless
  notes: Indexed by rollout and token, $\rho_{i,t}(\ModelParameters)$; clipped to $[1-\RatioClippingWidth,1+\RatioClippingWidth]$
    in the surrogate. Not \ServingUtilization.
- macro: \PolicyRemainingReturn
  latex: V^{\pi}
  definition: expected remaining return under the current policy from a given interaction history at a
    decision step
  kind: function
  unit: dimensionless
  notes: Written $\PolicyRemainingReturn(h_k)$. The superscript names the policy that continues; the bare
    letter is $\ExpectedRemainingReturn$. Its estimate is $\EstimatedRemainingReturn$.
- macro: \PolicyRequestLength
  latex: S_{\pi}
  definition: number of tokens in the request a context policy produces at one decision step
  kind: count
  notes: The subscript names the policy; it is not the constant pi.
- macro: \PolicyUpdateStepTime
  latex: T_{\text{step}}
  definition: wall-clock time of one training step of a reinforcement-learning loop, from one parameter
    update to the next
  kind: scalar
  unit: s
  notes: Under a group barrier it is the slowest rollout's duration plus $T_{\text{train}}$. Not the per-step
    generation time of the appendix's block-verification model.
- macro: \PomdpActionSet
  latex: \mathsf{A}
  definition: set of actions available to the agent in a partially observable Markov decision process
  kind: set
  notes: Second component of the POMDP tuple. Not \PermittedActions, the task contract's permitted actions,
    nor \AuthorityExposureLevel ($A_0$ to $A_3$).
  render_exception: The finite-state convention is mathsf for the components of the POMDP tuple; the kind
    rule would ask for calligraphic.
- macro: \PomdpObservationFunction
  latex: \mathsf{O}
  definition: observation law of a partially observable Markov decision process, the probability of receiving
    an observation after an action leads to a given next state
  kind: function
  notes: Written $\mathsf{O}(o \mid s',a)$. Supplies the evidence weight in the belief update.
- macro: \PomdpObservationSet
  latex: \Omega
  definition: set of possible observations in a partially observable Markov decision process
  kind: set
  notes: Fifth component of the POMDP tuple; its elements are \TrajectoryObservation. Not \AvailableObservations,
    the task contract's observation specification.
  render_exception: Capital Omega is the standard POMDP name for the observation set; the kind rule would
    ask for calligraphic.
- macro: \PomdpRewardFunction
  latex: \mathsf{R}
  definition: reward function of a partially observable Markov decision process, the modeled objective
    signal for taking an action in a state
  kind: function
  notes: Written with its arguments, $\mathsf{R}(s,a)$. A chosen objective, not a certificate of correctness.
    Not \TrajectoryReward ($R$), the verifier's score for a whole trajectory.
- macro: \PomdpStateSpace
  latex: \mathsf{S}
  definition: set of environment states of a partially observable Markov decision process, including remote
    state and concurrent activity the agent cannot see
  kind: set
  notes: First component of the POMDP tuple $\langle \mathsf{S}, \mathsf{A}, \mathsf{T}, \mathsf{R}, \Omega,
    \mathsf{O}, \gamma \rangle$. Its elements are \DecisionProcessState. Not \StateExposureLevel ($S_0$
    to $S_3$) nor \SequenceLength ($S$).
  render_exception: The finite-state convention is mathsf for the components of the POMDP tuple; the kind
    rule would ask for calligraphic.
- macro: \PomdpTransitionFunction
  latex: \mathsf{T}
  definition: transition law of a partially observable Markov decision process, giving the distribution
    of the next environment state after an action in a state
  kind: function
  notes: Its probabilities are written \EnvironmentTransitionDistribution, $p(s' \mid s,a)$. Must make
    the state Markov under the assumed law.
- macro: \PoolResidentMemory
  latex: M_{\text{pool}}
  definition: host resident memory of a copy-on-write sandbox pool, guest pages only
  kind: scalar
  unit: bytes
- macro: \PooledAcceptanceProbability
  latex: \bar{p}
  definition: average of the acceptance probabilities of the two system versions a release comparison
    tests, used as the pooled variance estimate
  kind: scalar
  unit: dimensionless
  notes: $\bar p = (p_1+p_2)/2$ in the planning estimate $\TasksPerComparisonArm \approx 2(z_{1-\alpha_{\text{sig}}/2}+z_{1-\beta})^2\,\bar
    p(1-\bar p)/\Delta^2$. Vol3 counterpart of the learning entries \PooledConversionRate and \PooledSampleApprovalRate
    ($\hat{p}$), which pool observed sample shares rather than planned probabilities.
- macro: \PositionLossMask
  latex: m
  definition: loss-mask indicator at the token position named by its index subscript
  kind: scalar
  unit: dimensionless
  notes: 'The indexed form of \PositionLossMask ($m_t$), for a specific position such as $m_1$. Same values:
    one on selected targets, zero elsewhere.'
  aliases:
  - \TokenLossMask
  - \LossMaskT
- macro: \PqApproximateDistance
  latex: \tilde{d}
  definition: approximate squared distance between a search query embedding and a product-quantized stored
    vector, summed from per-subspace lookup-table entries
  kind: function
  notes: 'Asymmetric distance computation: $\tilde{d}(\mathbf{q},\mathbf{x}) = \sum_j \text{LUT}[j, c_j]$.'
- macro: \PqCentroidCode
  latex: c^{\text{pq}}
  definition: index of one centroid in a product-quantization subspace codebook, stored as the one-byte
    code of the subvector it is nearest
  kind: index
  notes: Indexed by subspace, $\PqCentroidCode_j$. Not the memory entry \DerivedMemoryEntry.
- macro: \PqSubspaceIndex
  latex: j
  definition: index of one product-quantization subspace, from 1 to the subvector count
  kind: index
  notes: Exempt inside a subscript; this entry covers uses such as $\text{LUT}[j, c]$.
- macro: \PqSubvectorCount
  latex: m
  definition: number of subvectors product quantization splits each stored vector into, which is also
    the number of one-byte codes it stores per vector
  kind: count
  notes: Bytes per scored vector fall from $d\,w$ to $m$.
- macro: \PreAdmissionAction
  latex: a_{\text{prop}}
  definition: action as proposed, before the runtime checks it
  kind: record
  notes: Element of $\mathcal{A}_{\text{prop}}$; the closure operator maps it to $\AdmittedAction$ or
    $\ProposalRejection$. A tool call, not a number.
  aliases:
  - \Proposed
- macro: \PreForwardEnvironmentState
  latex: \sigma_0
  definition: state of the environment before a forward step of a saga executes
  kind: record
  notes: Compared with $\CompensatedEnvironmentState$ only on the predicates in $\CompensationPostconditionSet$.
    Not a standard deviation.
- macro: \PrePivotCatchRate
  latex: v
  definition: share of defective actions that a check placed before the pivot catches
  kind: scalar
  unit: dimensionless
  notes: Multiplies $\RevertFidelity$ to give the recoverable fraction $\ActionRecoverableFraction$; a
    missed action recovers nothing.
- macro: \PredecessorGraphVertex
  latex: u
  definition: vertex at the tail of a precedence edge, whose output the edge's head vertex needs before
    it can start
  kind: record
  notes: Written with its successor as the edge $(u,v)$.
- macro: \PreferenceMargin
  latex: z
  definition: preference scale times the difference between the preferred and dispreferred records' reference-relative
    scores
  kind: scalar
  unit: dimensionless
  notes: $z=\beta(\Delta_w-\Delta_l)$; the pair's gradient weight is $\sigma(-z)$. Not \RationaleTokens
    or \OutputLogit, which share the glyph.
- macro: \PreferencePairDataset
  latex: \mathcal{D}
  definition: dataset of curated preference comparisons, each a context with a preferred and a dispreferred
    trajectory record
  kind: set
  notes: Elements are triples $(c,\tau_w,\tau_l)$. Not \ClientLocalDataset or \DivergenceMeasure, which
    share the glyph.
- macro: \PreferenceScale
  latex: \beta
  definition: positive coefficient in direct preference optimization that scales the score difference
    and sets how strongly the objective resists drift from the reference policy
  kind: scalar
  unit: dimensionless
  notes: Plays the role of the inverse KL-penalty weight. Not \LinkBandwidth, \AdamMomentDecayRate or
    \DataScalingExponent, which share the glyph.
- macro: \PreferenceScoredPositionSet
  latex: \mathcal{A}
  definition: set of policy-generated token positions of one trajectory that a preference objective scores
  kind: set
  notes: Written as a function of the trajectory, $\mathcal{A}(\tau)$; its size $|\mathcal{A}(\tau)|$
    length-normalizes a score. Not \PermittedActions or \ArchitectureSearchSpace.
- macro: \PreferredReferenceRelativeScore
  latex: \Delta_w
  definition: reference-relative score of the preferred trajectory record of one comparison pair
  kind: scalar
  unit: dimensionless
  notes: Shorthand for $\Delta_\theta(\tau_w;c)$.
- macro: \PreferredTrajectory
  latex: \tau_w
  definition: trajectory record ranked higher in one preference comparison
  kind: record
  notes: Relative ranking from curation, not absolute correctness. Pairs with \DispreferredTrajectory.
- macro: \PrefillTime
  latex: T_{\text{prefill}}
  definition: time a model call spends in prefill, processing its whole prompt
  kind: scalar
  unit: s
  notes: About $\SequenceLength\,\PerTokenPrefillTime$; may be written with the prompt length as argument.
- macro: \PriorTurnCount
  latex: j
  definition: number of turns whose appended tokens a call's prompt already carries, counted from zero
    on the first call
  kind: count
  notes: Summation variable of the resend sum; the j-th call sends $\BasePromptLength + j\,\TurnAppendLength$
    tokens.
- macro: \PrivilegeTrapTime
  latex: T_{\text{trap}}
  definition: time one system call spends crossing a privilege boundary in hardware
  kind: scalar
  unit: s
- macro: \ProbedCellCount
  latex: n_{\text{probe}}
  definition: number of nearest coarse cells an inverted-file index query scans, its recall knob
  kind: count
  notes: Out of \CoarseCellCount cells.
- macro: \ProcessConditionCheckTime
  latex: T_{\text{proc}}
  definition: expected verifier slot time of the process-conditions predicate for a record that reaches
    it
  kind: scalar
  unit: s
  notes: The slot time $T_i$ of $\text{chk}_{\text{proc}}$.
- macro: \ProcessConditionPassProbability
  latex: p_{\text{proc}}
  definition: probability that a candidate passes the process-conditions predicate, the audit of its execution
    history against operational constraints and tool policies
  kind: scalar
  unit: dimensionless
  notes: The pass probability $p_i$ of $\text{chk}_{\text{proc}}$.
- macro: \ProductFactorIndex
  latex: j
  definition: position of one factor in a product or sum that runs from zero to one less than the claim
    size
  kind: index
- macro: \ProjectedTrajectoryRecord
  latex: R
  definition: trajectory control record that a deterministic reducer rebuilds by folding logged events,
    indexed by the log position it reflects
  kind: record
  notes: R_0 is the initial record before any event; R_j the projection after folding events through log
    position j. Not reliability R or a replica count.
- macro: \ProjectedTurnGradientContribution
  latex: Z
  definition: contribution of one turn's action to a likelihood-ratio policy-gradient estimate, projected
    onto a fixed parameter-space direction
  kind: scalar
  unit: dimensionless
  notes: Indexed by turn, $Z_k$; summing over turns gives $\ParameterSpaceDirection^T\PolicyGradientEstimate$,
    whose variance is the sum of their variances and covariances.
- macro: \PromotedFusionInputRank
  latex: r'
  definition: better 1-based rank a candidate moves to within one retrieval method's ranked list, compared
    with its earlier rank there, when reasoning about how reciprocal rank fusion scores respond
  kind: index
  notes: Smaller than the $\FusionInputRank$ it replaces, $r' < r$. Used in the monotonicity argument
    for reciprocal rank fusion.
- macro: \PromptToken
  latex: x
  definition: one token of the serialized prompt a call sends, indexed by its position
  kind: record
  notes: Indexed by position, $x_i$; the whole prompt is $\RequestPromptTokens$.
- macro: \PromptTokensSent
  latex: S_{\text{sent}}
  definition: cumulative number of prompt tokens a trajectory sends across all its calls
  kind: count
  notes: With a fixed append and no compaction, $\Horizon\,\BasePromptLength + \TurnAppendLength\,\Horizon(\Horizon-1)/2$.
- macro: \PropensityPriorApprovalShape
  latex: a
  definition: first shape parameter of the beta distribution assumed for the false-approval propensity,
    the pseudo-count weighting approval
  kind: scalar
  unit: dimensionless
  notes: Mean $a/(a+b)$; set from the marginal rate and correlation by $a=p(\rho^{-1}-1)$.
- macro: \PropensityPriorRejectionShape
  latex: b
  definition: second shape parameter of the beta distribution assumed for the false-approval propensity,
    the pseudo-count weighting correct rejection
  kind: scalar
  unit: dimensionless
  notes: Set by $b=(1-p)(\rho^{-1}-1)$. Not batch size.
- macro: \ProposalRejection
  latex: \bot
  definition: outcome of withholding a proposal at the admission gate, recorded with its reason
  kind: record
  notes: Does not undo earlier attempts or establish that outstanding external work has stopped. A marker,
    not a number.
  aliases:
  - \RejectionSymbol
- macro: \ProposedAccess
  latex: r
  definition: access a tool call proposes, naming an operation, a target and its arguments, which an enforcement
    point admits or refuses under a capability grant
  kind: record
  notes: Its fields are written $\ProposedAccess.\text{op}$ and $\ProposedAccess.\text{target}$; admitted
    under $\CapabilityGrant$ only if $\ProposedAccess.\text{op} \in \mathcal{R}_\Gamma$, $\ProposedAccess.\text{target}
    \sqsubseteq \mathcal{O}_\Gamma$, $\phi_\Gamma(\ProposedAccess)$ and $t < \GrantExpiryTime$. Not the
    rollout action $\RolloutAction$.
- macro: \ProposedActionSet
  latex: \mathcal{A}_{\text{prop}}
  definition: set of actions a model may propose, the domain the runtime closure check reads from
  kind: set
  notes: The closure operator maps it, with the system state, to $\PermittedActions \cup \{\bot\}$. A
    single proposal is $\PreAdmissionAction$.
- macro: \ProposedOperation
  latex: o
  definition: operation a proposed tool call would perform, the unit a reference monitor admits or refuses
  kind: record
  notes: Argument of $\AcceptedInfluences$. Not the observation $\TrajectoryObservation$.
- macro: \ProxyTrajectoryReward
  latex: \hat{R}
  definition: reward the training loop computes for a trajectory, viewed as an imperfect proxy for the
    intended objective
  kind: scalar
  unit: dimensionless
  notes: Written with its trajectory, $\hat{R}(\Trajectory)$. Contrasted with the intended utility $\CandidateUtility$;
    gradient ascent climbs this, not the utility.
- macro: \QuantileLevel
  latex: u
  definition: probability level at which a quantile function is evaluated, strictly between zero and one
  kind: scalar
  unit: dimensionless
  notes: Not the upper boundary of a sequential test.
- macro: \QuantileProbabilityLevel
  latex: q
  definition: cumulative probability at which a quantile of a distribution is taken
  kind: scalar
  unit: dimensionless
  notes: Argument of \StandardNormalQuantile. Not \TargetCompletionQuantile, a latency objective's quantile.
- macro: \QuantileThresholdCandidate
  latex: x
  definition: candidate value of a statistic over which an empirical quantile's infimum is taken
  kind: scalar
  unit: varies
  notes: Same unit as the statistic. A bound variable of the quantile definition.
- macro: \QueryWord
  latex: q
  definition: one analyzer word of a lexical query
  kind: record
  notes: Argument of \QueryWordFrequency and \QueryWordDocumentFrequency.
- macro: \QueryWordDocumentFrequency
  latex: n
  definition: number of documents in a lexically indexed corpus that contain a given query word
  kind: function
  notes: Written with its argument, $n(q)$; feeds the inverse document frequency.
- macro: \QueryWordFrequency
  latex: f
  definition: number of times one query word occurs in one indexed document, as the lexical analyzer counts
    it
  kind: function
  notes: Written with its arguments, $f(q,x)$. Not \ClockFrequency.
- macro: \QueryWorkspaceGeneration
  latex: g_q
  definition: workspace generation a memory query requires
  kind: index
  notes: The active workspace generation for current-state execution, or an earlier one for historical
    diagnostics.
  aliases:
  - \ValidityIntervalOfAMemoryEntryQ
- macro: \RandomEnvironmentState
  latex: S
  definition: environment state at a turn of a partially observable decision process, viewed as a random
    variable over its state space
  kind: record
  notes: Indexed by turn, $S_t$; a realization is \DecisionProcessState. Not \StateExposureLevel ($S_0$
    to $S_3$) nor \SequenceLength ($S$).
- macro: \RankFusionSmoothingConstant
  latex: k_{\text{rrf}}
  definition: positive constant reciprocal rank fusion adds to each rank before taking the reciprocal,
    which compresses score differences between adjacent ranks
  kind: scalar
  unit: dimensionless
  notes: The standard choice is 60.
- macro: \RankingFunction
  latex: V
  definition: nonnegative integer measure of remaining admissible steps that every admitted step decreases
    by at least one, bounding how many steps can be admitted
  kind: function
  notes: Indexed by turn, $V_t$; $V_{t+1} \le V_t - 1$ admits at most $V_0$ steps. An enforced remaining-step
    allowance is one example. Not \EstimatedRemainingReturn ($\hat{V}$).
- macro: \RatingCategory
  latex: y
  definition: one category of the categorical rating that two raters assign to the same cases, the variable
    the chance-agreement sum runs over
  kind: index
  notes: Indexes the per-rater label fractions in $p_e=\sum_y p_{y,1}p_{y,2}$. Not \ExampleLabel or \TrueLabelComponent.
- macro: \RatioClippingWidth
  latex: \epsilon_{\text{clip}}
  definition: half-width of the interval around one to which the clipped surrogate limits the probability
    ratio
  kind: scalar
  unit: dimensionless
  notes: Between zero and one. Clip-higher splits it into $\LowerRatioClippingWidth$ and $\UpperRatioClippingWidth$.
- macro: \RationaleTokens
  latex: z
  definition: rationale tokens a policy generates before the action tokens of one response
  kind: record
  notes: May be selected as targets, kept as context only, or removed. Not the preference margin \PreferenceMargin,
    which the same chapter also writes $z$.
- macro: \ReachableArtifactNode
  latex: u
  definition: artifact node reachable by a directed path from a given node of a candidate plan's dependency
    graph
  kind: record
  notes: Ranges over $\text{Desc}(\InvalidatedArtifactNode)$.
- macro: \RealizedDamageOutcome
  latex: y
  definition: realized value, zero or one, of the damaging-outcome indicator
  kind: scalar
  unit: dimensionless
  notes: The column argument of $\EscalationLossMatrix$.
- macro: \RealizedFalseAlarmProbability
  latex: \alpha_{*}
  definition: realized probability that an untruncated sequential test selects the degradation when the
    baseline holds
  kind: scalar
  unit: dimensionless
  notes: An operating characteristic of the actual test, distinct from the design target \StatisticalSignificanceLevel.
- macro: \RealizedMissedDegradationProbability
  latex: \beta_{*}
  definition: realized probability that an untruncated sequential test selects the baseline when the specified
    degradation holds
  kind: scalar
  unit: dimensionless
  notes: An operating characteristic of the actual test, distinct from the design target \StatisticalFalseNegativeRate.
- macro: \ReasoningBudget
  latex: B_{\text{reason}}
  definition: maximum number of reasoning tokens a call may spend before it answers
  kind: count
- macro: \ReconcilableToolInterface
  latex: \mathbb{T}_{a}
  definition: 'three-part interface a mutating tool over an endpoint without deduplication ships: an actuation,
    a verification probe against the pre-dispatch baseline, and an optional compensation'
  kind: record
  notes: $\ReconcilableToolInterface = \langle \text{actuate}(\MutatingToolAction), \text{probe}(\MutatingToolAction,
    \ToolTargetState_0), \text{compensate}(\MutatingToolAction) \rangle$. The subscript a is the action
    the interface serves and is part of the glyph as the chapter writes it.
- macro: \RecordAdequacyPassProbability
  latex: p_{\text{record}}
  definition: probability that a candidate passes the record-adequacy and fidelity predicate of an admission
    route
  kind: scalar
  unit: dimensionless
  notes: The pass probability $p_i$ of $\text{chk}_{\text{record}}$.
- macro: \RecordSizeCeiling
  latex: s_{\max}
  definition: largest size in bytes one trajectory record may reach, against which staging reservations
    and storage writes are dimensioned
  kind: scalar
  unit: bytes
  notes: Reservations are sized by it, not the mean record size; storage supports at most $\DurableStoreWriteBandwidth/\RecordSizeCeiling$
    attempts per second.
- macro: \RecoveryTargetLogPosition
  latex: j_{\text{target}}
  definition: log position up to which a recovery reconstructs record and workspace state
  kind: index
- macro: \ReferenceActionDisadvantage
  latex: A_t^{\pi^*}
  definition: extra expected task cost of taking an action instead of the reference policy's action at
    one step and then following the reference
  kind: function
  unit: dimensionless
  notes: Written $A_t^{\pi^*}(s,a)$; zero when the action agrees with the reference. Not the advantage
    $\hat{\Advantage}$ of policy-gradient training.
- macro: \ReferenceAssessedFailure
  latex: F
  definition: event that a trial fails its specified criterion according to an independent reference assessment,
    the conditioning event of a grader's false-acceptance rate
  kind: record
  notes: Used in $\epsilon_{\text{FA}}=\Pr(\text{Acc}\mid F)$ and in failure among accepted, $\Pr(F\mid\text{Acc})$.
    Not \NextFailureTime or a distribution function.
- macro: \ReferenceCostToGo
  latex: Q_t^{\pi^*}
  definition: expected task cost from a step through the end of the horizon after taking an action in
    a state and then following the reference policy
  kind: function
  unit: dimensionless
  notes: Written with its arguments, $Q_t^{\pi^*}(s,a)$. The reference-policy case of $\ExpectedActionReturn$.
- macro: \ReferenceDisagreementProbability
  latex: \mathcal{L}
  definition: probability that a policy's action in a given state differs from the reference policy's
    action there
  kind: function
  unit: dimensionless
  notes: Written $\mathcal{L}(s,\pi)$. A disagreement proxy, neither the task cost nor the token-level
    training loss $\LossFunction$.
- macro: \ReferenceLogProbabilitySum
  latex: \Delta_{\text{ref}}
  definition: sum of the frozen reference policy's log-probabilities over a trajectory's selected tokens,
    precomputed and cached
  kind: function
  unit: dimensionless
  notes: Written $\Delta_{\text{ref}}(\tau)$; valid only for the exact model, tokenizer, template and
    selection it was computed under.
- macro: \ReferenceMixingProbability
  latex: \lambda
  definition: probability with which a data-collection round executes the reference action instead of
    the learner's
  kind: scalar
  unit: dimensionless
  notes: Indexed by round, $\lambda_k$, and decayed toward zero across rounds. Not \TraceDecay or a rate.
- macro: \ReferenceProbabilityRatio
  latex: z
  definition: ratio of a sampled token's probability under the frozen reference policy to its probability
    under the current policy
  kind: scalar
  unit: dimensionless
  notes: Indexed by rollout and token. Enters the per-token divergence estimate $z-\log z-1$.
- macro: \ReferenceRelativeScore
  latex: \Delta_\theta
  definition: sum over a trajectory's scored token positions of the log ratio of the trained policy's
    to the reference policy's token probabilities
  kind: function
  unit: dimensionless
  notes: Written $\Delta_\theta(\tau;c)$; natural-log quantities, treated as dimensionless as the chapter
    states. Its values for the two records of a pair are \PreferredReferenceRelativeScore and \DispreferredReferenceRelativeScore.
- macro: \ReferenceRequestLength
  latex: S_{\text{ref}}
  definition: number of tokens in the uncompacted reference request that carries the complete raw history
  kind: count
  notes: May exceed $\ContextWindow$; it is measured, never sent.
- macro: \ReferenceStateDisagreementRate
  latex: \epsilon_E
  definition: probability that a learned policy's action differs from the reference policy's, averaged
    over the states the reference visits
  kind: scalar
  unit: dimensionless
  notes: $\epsilon_E = \mathbb{E}_{s\sim d_{\pi^*}}[\Pr(a\ne\pi^*(s))]$; enters the quadratic bound $\min\{H,
    H^2\epsilon_E\}$. Not \PerStepErrorRate, which is an error probability rather than any disagreement.
- macro: \ReferenceStateDistribution
  latex: d_{\pi^*}
  definition: average distribution of states the reference policy visits over the horizon
  kind: distribution
  notes: The reference-policy counterpart of \StateDistribution; the per-step form carries a superscript,
    $d_{\pi^*}^t$.
- macro: \ReferenceStepDisagreementRate
  latex: \epsilon
  definition: probability that a learner's action disagrees with the reference policy at one step, averaged
    over the reference policy's state distribution at that step
  kind: scalar
  unit: dimensionless
  notes: 'Indexed by step, $\epsilon_t$; its horizon average is $\ReferenceStateDisagreementRate$. A marginal
    rate: unlike $\PerStepErrorRate$, no independence across steps is assumed.'
- macro: \RegisteredDescriptorCount
  latex: n_{\text{reg}}
  definition: number of tool descriptors registered in a toolkit catalog, all of which a call carries
    without selection
  kind: count
  notes: Selection pays when $(\RegisteredDescriptorCount - \SelectedDescriptorCount)\,\ToolDescriptorSize
    > \SelectionOverheadSize$.
- macro: \RejectionDecodeStep
  latex: t_{\text{cut}}
  definition: decode step at which a stream validator detects the first schema violation and rejects the
    output
  kind: index
  notes: Counted from one; $\OutputLimit - t_{\text{cut}}$ bounds the decode steps an honored cancellation
    saves.
- macro: \RelativeImprovementFraction
  latex: \delta
  definition: relative fraction by which an intervention lowers the cost per attempt or raises the acceptance
    probability, in a comparison of the two
  kind: scalar
  unit: dimensionless
  notes: Exercise variable in the conclusion's ledger checkpoint.
- macro: \RelevantRecordSet
  latex: \mathcal{D}^*
  definition: set of records labeled relevant to one evaluation query within the eligible snapshot
  kind: set
  notes: Recall is undefined when it is empty. The star marks the labeled relevant set, not an optimum.
- macro: \RemainingCallCount
  latex: N_{\text{rem}}
  definition: number of ordinary model calls a trajectory still makes after a compaction decision point,
    including the first compacted call
  kind: count
- macro: \RemainingReturn
  latex: R_{\geq k}
  definition: sum of the rewards a rollout receives from one turn to the end of its horizon, the reward-to-go
  kind: scalar
  unit: dimensionless
  notes: The turn index $k$ is part of the symbol. Equals the terminal reward $\TrajectoryReward$ at every
    turn when only the final check scores the rollout. With discounting each later reward is weighted
    by $\DiscountFactor$.
- macro: \RepairAttemptCost
  latex: C_{\text{repair}}
  definition: cost of one bounded repair attempt toward a declared readiness endpoint
  kind: scalar
  unit: varies
  notes: Seconds of elapsed time or dollars of model charges, on the same axis as $\FallbackCost$; when
    it is at least $\FallbackCost$ no success probability below one makes repair first cheaper.
- macro: \RepairCap
  latex: K_{\text{repair}}
  definition: maximum number of forward repair attempts on one failed step before the harness compensates
    or escalates
  kind: count
  notes: Exhaustion selects recovery or handoff; it does not prove repair impossible.
- macro: \RepairCapabilityGrant
  latex: \Gamma_{\text{repair}}
  definition: capability grant a repair task holds over its repository
  kind: record
- macro: \RepairFirstCost
  latex: C_{\text{repair\ first}}
  definition: total cost of attempting one bounded repair and falling back only if it fails
  kind: scalar
  unit: varies
  notes: A random variable on one resource axis (seconds or dollars); $\mathbb{E}[\RepairFirstCost] =
    \RepairAttemptCost + (1-\RepairSuccessProbability)\FallbackCost$ when a failed repair leaves the fallback
    unchanged.
- macro: \RepairPatchArtifact
  latex: P
  definition: one patch artifact in a repair candidate's dependency graph, numbered by its subscript
  kind: record
  notes: 'Exercise labels: $P_1$ the pool patch, $P_2$ the metrics patch.'
- macro: \RepairSuccessProbability
  latex: p
  definition: probability that one bounded repair attempt reaches the declared readiness endpoint, measured
    per failure class and feedback policy
  kind: scalar
  unit: dimensionless
  notes: 'Repair first beats immediate fallback when it exceeds $\RepairSuccessProbability^* = \RepairAttemptCost/\FallbackCost$,
    evaluated separately in seconds and dollars. Not the attempt pass probability $\AttemptPassProbability$
    of independent resamples: repair attempts are conditioned on feedback.'
- macro: \RepairTurnLatency
  latex: T_{\text{repair}}
  definition: latency one repair turn adds after a malformed tool call, including the re-sent context
    and the regenerated call
  kind: scalar
  unit: s
  notes: Denominator of the break-even parse failure rate; when it is zero the ratio is undefined and
    the two latencies are compared directly.
- macro: \ReplyLossProbability
  latex: q_{\text{rep}}
  definition: probability that a call's reply is lost in transit
  kind: scalar
  unit: dimensionless
  notes: Independent of the request-loss probability $\RequestLossProbability$.
  aliases:
  - \RequestAndReplylossProbabilitiesTwo
- macro: \RepositoryEdgeSourceIndex
  latex: i
  definition: index of the symbol a directed edge of a repository symbol graph leaves
  kind: index
  notes: Row index of \RepositoryEdgeWeightMatrix. Used outside a subscript in the prose, so it is a symbol
    here.
- macro: \RepositoryEdgeTargetIndex
  latex: j
  definition: index of the symbol a directed edge of a repository symbol graph enters
  kind: index
  notes: Column index of \RepositoryEdgeWeightMatrix.
- macro: \RepositoryEdgeWeight
  latex: A
  definition: nonnegative weight of the directed edge from one symbol to another in a repository symbol
    graph
  kind: scalar
  unit: dimensionless
  notes: Indexed by source and target, $A_{ij}$; one entry of \RepositoryEdgeWeightMatrix. Not \Advantage.
- macro: \RepositoryEdgeWeightMatrix
  latex: \mathbf{A}
  definition: matrix of directed edge weights of a repository symbol graph, one row per source symbol
  kind: matrix
  notes: Entries \RepositoryEdgeWeight. Row-normalizing it, with dangling rows replaced by \PersonalizationVector,
    gives \RepositoryTransitionMatrix.
- macro: \RepositoryFileCount
  latex: n
  definition: number of files in a shared repository from which workers draw their write sets
  kind: count
  notes: Used in the birthday-bound estimate of write collisions.
- macro: \RepositoryGraphEdgeSet
  latex: E
  definition: set of directed edges of a repository symbol graph, whose direction is declared before ranking
  kind: set
  notes: Following references and following reverse dependencies answer different questions.
  render_exception: Graph convention writes the vertex and edge sets of G=(V,E) as italic capitals; the
    kind rule would ask for calligraphic.
- macro: \RepositoryGraphVertexSet
  latex: V
  definition: set of vertices of a repository symbol graph, one per symbol definition or reference
  kind: set
  notes: First component of the directed graph $(V,E)$ a repository map ranks. Not \BufferDependencyVertexSet.
  render_exception: Graph convention writes the vertex and edge sets of G=(V,E) as italic capitals; the
    kind rule would ask for calligraphic.
- macro: \RepositoryTransitionMatrix
  latex: \mathbf{P}_{\text{graph}}
  definition: row-stochastic transition matrix of a repository symbol graph, its row-normalized edge weights
    with dangling rows set to the personalization vector
  kind: matrix
  notes: Its transpose propagates scores in the PageRank update; nonexpansive in the vector 1-norm. Not
    \EstimationErrorCovariance.
- macro: \RequestCompressionRatio
  latex: \gamma_{\text{req}}
  definition: token count of an uncompacted reference request divided by that of the request a context
    policy produces at the same decision step
  kind: scalar
  unit: dimensionless
  notes: Values above one mean token reduction; both terms are fully serialized with the same tokenizer.
    Measures size, not decision quality.
- macro: \RequestLossProbability
  latex: q_{\text{req}}
  definition: probability that a call's request is lost in transit
  kind: scalar
  unit: dimensionless
  notes: Independent of the reply-loss probability $\ReplyLossProbability$.
  aliases:
  - \RequestAndReplylossProbabilities
- macro: \RequestPromptTokens
  latex: \mathbf{x}
  definition: 'serialized prompt token sequence a model call request carries: messages, role markers,
    tool schemas and delimiters'
  kind: record
  notes: First field of the request tuple $\ModelCallRequest$. Same tokens the factorization writes as
    $\InputTokenSequence$. A token sequence, not a number.
- macro: \RequestQueueTime
  latex: T_{\text{queue}}
  definition: time a request, such as a model call or a queued job, waits in a queue before its service
    begins
  kind: scalar
  unit: s
  notes: Realized wait of one request; the mean wait of queueing theory is $\QueueWaitTime$. For a model
    call this is the wait in the serving admission queue before prefill begins.
- macro: \RequiredResultCount
  latex: k
  definition: number of interchangeable admissible results a task contract requires before a fan-out may
    stop
  kind: count
  notes: A k-of-N stopping rule; $k=\WorkerCount$ is the all-results barrier.
- macro: \RequiredTaskPairCount
  latex: N'
  definition: number of task pairs a paired comparison needs for its noninferiority gate to clear if the
    observed difference holds, scaled from the current count by the squared ratio of half-widths
  kind: count
  notes: The prime marks a planned count against the current \EvaluationSampleCount; the whole decorated
    form $N'$ is the symbol.
- macro: \ResourceChangeRate
  latex: r_{\text{chg}}
  definition: mean rate at which other actors change one observed shared resource, modeled as a Poisson
    process
  kind: scalar
  unit: 1/s
  notes: Sets how fast an observation of shared state goes stale.
- macro: \ResponseActionTokens
  latex: a
  definition: action tokens of one policy response, written with a position index for a single token
  kind: record
  notes: $a=(a_1,\ldots,a_n)$; the prefix before position $j$ is \ActionTokenPrefix. Not \PolicyAction
    or \TrajectoryAction, which are whole actions.
- macro: \ResponseMetadata
  latex: \mathbf{m}
  definition: 'metadata a model call''s response carries: kind, raw stop reason, token usage, request
    identifiers, latency and serving parameters'
  kind: record
  notes: Third field of $\NormalizedStatusEnvelope$; unreported usage is unmeasured, not zero.
- macro: \ResponsePayload
  latex: \mathbf{y}
  definition: payload a model call returns, which may be complete, partial or absent
  kind: record
  notes: Second field of $\NormalizedStatusEnvelope$. Distinct from the generated token $\OutputToken$.
- macro: \ResponseThreshold
  latex: \tau
  definition: score threshold at which a monitoring or selective-prediction rule acts, such as alerting,
    abstaining, or routing to manual review
  kind: scalar
  unit: dimensionless
  notes: In the units of the score it thresholds. Volume III reserves bare $\tau$ for a trajectory; there
    a threshold or a sampling temperature ($\tau_{\text{temp}}$) carries a subscript.
- macro: \RestoreWorkerCount
  latex: w
  definition: number of restores a host runs concurrently to replenish a sandbox pool
  kind: count
- macro: \ResumeTime
  latex: T_{\text{resume}}
  definition: 'end-to-end time to resume a trajectory after a failure: ownership, reading, folding, workspace
    restore, reconciliation and serving-state prefill'
  kind: scalar
  unit: s
- macro: \RetainedDigestCount
  latex: m
  definition: number of previous workspace digests a semantic watchdog retains for recurrence checks
  kind: count
  notes: Caps memory and comparison work at $\mathcal{O}(\RetainedDigestCount)$ but blinds the detector
    to cycles longer than $\RetainedDigestCount$ turns.
- macro: \RetainingCallCount
  latex: H_{\text{rem}}
  definition: number of later model calls in a trajectory that retain one staged observation in context
  kind: count
  notes: At most the remaining horizon; multiplies $\ShapedObservationSize$ into carried input tokens.
- macro: \RetrievalCutoffCount
  latex: k
  definition: number of top-ranked records a retrieval request asks for, the cutoff at which ranking stops
    and at which precision and recall at k are measured
  kind: count
  notes: 'Requested, not returned: precision at k divides by this cutoff even when fewer records come
    back. Covers lexical, dense and fused retrieval. Distinct from \NeighborCount (k-nearest-neighbor
    classification) and \TopTokenSampleCount (top-k sampling).'
- macro: \RetrievalMethodIndex
  latex: i
  definition: index of one retrieval method, such as lexical or dense, whose ranked list rank fusion combines
  kind: index
  notes: Exempt inside a subscript; this entry covers the standalone mention.
- macro: \RetrievedRecordSet
  latex: \mathcal{R}
  definition: set of distinct records a retriever returns up to a cutoff
  kind: set
  notes: Indexed by cutoff, $\mathcal{R}_k$; it may hold fewer than $k$ records. Not \FusionInputList.
- macro: \RetryAttemptIndex
  latex: j
  definition: position of one retry among the retries of an operation, counted from zero
  kind: index
  notes: The exponent of the backoff doubling $\RetryBackoffInterval_0 2^{\RetryAttemptIndex}$.
- macro: \RetryBackoffInterval
  latex: b
  definition: upper end of the interval from which a retry's jittered delay is drawn under capped exponential
    backoff
  kind: scalar
  unit: s
  notes: 'Indexed by retry: $\RetryBackoffInterval_k = \min(\MaximumRetryBackoffInterval, \RetryBackoffInterval_0
    2^{\RetryAttemptIndex})$, with $\RetryBackoffInterval_0$ the base backoff.'
- macro: \RetryJitterDelay
  latex: d
  definition: delay a client waits before one retry, drawn uniformly between zero and that retry's backoff
    interval (full jitter)
  kind: scalar
  unit: s
  notes: Indexed by retry, $\RetryJitterDelay_k \sim \operatorname{Uniform}(0, \RetryBackoffInterval_k)$;
    a server-specified Retry-After minimum overrides a shorter draw.
- macro: \RevertFidelity
  latex: \rho_{\text{revert}}
  definition: share of a caught defective action's consequence that reverting it avoids
  kind: scalar
  unit: dimensionless
  notes: Helps only the detected fraction $\PrePivotCatchRate$; $\ActionRecoverableFraction = \PrePivotCatchRate\,\RevertFidelity$.
- macro: \ReviewerFalseApprovalIndicator
  latex: X
  definition: indicator that one reviewer approves a candidate known to violate its acceptance criterion,
    one when it falsely approves and zero otherwise
  kind: scalar
  unit: dimensionless
  notes: Indexed by reviewer, $X_j$; the false-approval count sums them.
- macro: \ReviewerIndex
  latex: j
  definition: index of one reviewer in a review ensemble
  kind: index
  notes: A second reviewer of a pair is $\PeerReviewerIndex$.
- macro: \RevisionPassProbability
  latex: p_{\text{rev}}
  definition: probability that a revised candidate passes its check, given that the initial candidate
    failed and its diagnostics were fed back
  kind: scalar
  unit: dimensionless
  notes: Sequential feedback truncated to one revision passes with $\AttemptPassProbability+(1-\AttemptPassProbability)p_{\text{rev}}$.
- macro: \RolloutAction
  latex: a
  definition: response the policy samples at a turn of a reinforcement-learning rollout, a proposed tool
    call or a final answer
  kind: record
  notes: Indexed by turn, $\RolloutAction_k$. Same idea as $\TrajectoryAction$ ($a_t$), which bakes the
    index $t$ into its LaTeX. A record, not a number.
- macro: \RolloutAdmissionAge
  latex: \Delta T_{\text{rollout}}
  definition: wall-clock time from sampling a rollout's first prompt token to its admission into the training
    batch
  kind: scalar
  unit: s
  notes: Divided by the training step time it gives the update-count lag of a rollout. Its LaTeX spans
    the Delta and the T. Distinct from \TrajectoryDuration, which ends at the rollout's own endpoint.
- macro: \RolloutAssessmentTime
  latex: T_{v}
  definition: time to run the final assessment of one completed rollout inside its environment slot
  kind: scalar
  unit: s
  notes: Paid once per trajectory in $\EnvironmentCycleTime$; distinct from one repeated verification
    trial, $\VerificationTrialTime$, and from the cascade expectation $\ExpectedCheckingTime$.
- macro: \RolloutDuration
  latex: T_{\text{rollout}}
  definition: wall-clock time one rollout has run since its first prompt token was sampled
  kind: scalar
  unit: s
  notes: Written $\RolloutDuration(\Trajectory_i)$ at the group barrier; its finite change up to admission,
    $\FiniteChange\RolloutDuration$, is the rollout's age when admitted, which sets its version lag.
- macro: \RolloutEnvironmentState
  latex: s
  definition: full environment state at a turn of a reinforcement-learning rollout, where turns are indexed
    by k
  kind: record
  notes: Same meaning as $\EnvironmentState$ with turn index $k$, because the reinforcement-learning chapter
    uses $t$ for token positions. A record, not a number.
  aliases:
  - \EnvironmentStateK
- macro: \RolloutPolicyTokenCount
  latex: N
  definition: number of tokens the policy sampled in one rollout, excluding prompt, tool-output and environment
    tokens
  kind: count
  notes: Indexed by rollout, $\RolloutPolicyTokenCount_i$; it is the per-sequence divisor of the GRPO
    objective. Its group mean is $\MeanRolloutLength$.
- macro: \RolloutSurrogateObjective
  latex: \mathcal{L}
  definition: contribution of one rollout to the GRPO reward surrogate, its coefficient times the mean
    of its token log probabilities
  kind: scalar
  unit: dimensionless
  notes: Indexed by rollout, $\mathcal{L}_i$. At the start of an update each of its tokens carries weight
    $\GroupRelativeAdvantage_i/\RolloutPolicyTokenCount_i$.
- macro: \RolloutTurnIndex
  latex: k
  definition: position of an agent-environment turn within a reinforcement-learning rollout, counted from
    zero
  kind: index
  notes: Runs from 0 to $\TurnHorizon-1$ and indexes $\InteractionHistory_k$, $\RolloutAction_k$ and $\RolloutEnvironmentState$.
    The reinforcement-learning chapter uses $k$ for turns because $t$ is the token index $\TokenIndex$;
    elsewhere the turn index is $\TurnIndex$ ($t$).
- macro: \RunIndexSubset
  latex: J
  definition: subset of the graded runs' indices of the claim size, over which the pass@k and pass^k estimators
    average
  kind: set
  notes: Its size is $\IndependentAttemptCount$.
  render_exception: Italic J for a subset of run indices, following the pass@k estimator literature.
- macro: \RuntimeSystemState
  latex: \mathcal{X}_{\text{sys}}
  definition: current system state the runtime checks a proposed action against, such as grants, budgets
    and resource state
  kind: record
  notes: The second argument of the closure operator $\ClosureOperator$.
- macro: \RuntimeTime
  latex: T_{\text{runtime}}
  definition: time a turn spends in the runtime's own work, such as assembling context, validating proposals,
    and running checks
  kind: scalar
  unit: s
  notes: 'The runtime''s own work: assembling context, validating proposals, running checks.'
- macro: \SagaCompensatingStep
  latex: C
  definition: compensating operation of a saga, a new forward operation that remediates an earlier step's
    established external effect
  kind: record
  notes: 'Indexed like its forward step, $\SagaCompensatingStep_i$ for $\SagaForwardStep_i$; itself separately
    committed with its own outcome. The vertices of a cleanup graph are compensating operations. Not a
    cost: costs carry subscripts.'
- macro: \SagaFailedForwardStep
  latex: F_k^{\text{fail}}
  definition: forward step of a linear saga whose failure starts the reverse-order unwind
  kind: record
  notes: Step $k$ of $\SagaForwardStep_1, \dots, \SagaForwardStep_n$; the unwind then runs $\SagaCompensatingStep_k$
    (only on evidence that it took effect) down to $\SagaCompensatingStep_1$.
- macro: \SagaForwardStep
  latex: F
  definition: one separately committed forward operation of a saga, which may produce an external effect
  kind: record
  notes: Indexed by its position in the saga, $F_1, \dots, F_n$; paired with the compensating step $\SagaCompensatingStep$
    of the same index. The forward step that fails is $\SagaFailedForwardStep$. Not a cumulative distribution
    function.
- macro: \SagaStepIndex
  latex: k
  definition: position of one step in a saga's sequence of forward steps, used for the step that fails
  kind: index
  notes: Indexes $\SagaForwardStep_k$ and $\SagaCompensatingStep_k$.
- macro: \SampleStatistic
  latex: \widehat{\theta}
  definition: evaluation statistic computed from the sampled units, recomputed on each bootstrap resample
  kind: scalar
  unit: varies
  notes: Unit is that of the statistic (a proportion, a difference, a score). The replicate value is written
    $\SampleStatistic^{*(\BootstrapReplicateIndex)}$ and the ordered replicates $\SampleStatistic^*_{(1)}$.
    Not the model parameters.
- macro: \SampledPolicyToken
  latex: w
  definition: token the policy sampled at one generation position of a rollout
  kind: record
  notes: Indexed by rollout and token, $w_{i,t}$; its conditioning prefix is $\ConditioningTokenPrefix_{i,t}$.
    A record, not a number.
- macro: \SampledUnit
  latex: y
  definition: one independently sampled unit of an evaluation, such as a paired task record, that a bootstrap
    resamples whole
  kind: record
  notes: Indexed $\SampledUnit_1,\ldots,\SampledUnit_{\SampledUnitCount}$. Not the interval critical value.
- macro: \SampledUnitCount
  latex: m
  definition: number of independently sampled units in an evaluation, which each bootstrap resample redraws
    with replacement
  kind: count
- macro: \SamplingParameters
  latex: \mathbf{\Theta}_{\text{sample}}
  definition: sampling configuration of one model call, such as temperature, top-k and top-p, that sets
    the decoding rule
  kind: record
  notes: Holds $\SamplingTemperature$, $\TopTokenSampleCount$ and $\NucleusProbabilityMass$ among others.
- macro: \SamplingTemperature
  latex: \tau_{\text{temp}}
  definition: positive scalar that divides a language model's logits before the softmax at sampling time,
    sharpening the distribution below one and flattening it above
  kind: scalar
  unit: dimensionless
  notes: Zero denotes greedy argmax decoding, not a division. Distinct from the calibration temperature
    $\CalibrationTemperature$ and the distillation temperature $\DistillationTemperature$; bare $\tau$
    is a trajectory.
- macro: \SandboxColdBootTime
  latex: T_{\text{cold}}
  definition: 'time to cold-boot one sandbox instance: monitor startup, guest kernel boot, and user-space
    setup'
  kind: scalar
  unit: s
- macro: \ScanCapabilityGrant
  latex: \Gamma_{\text{scan}}
  definition: read-only capability grant over one source file, derived from the edit grant
  kind: record
- macro: \ScheduleFinishTime
  latex: T_{\text{finish}}
  definition: makespan of one schedule of a dependency graph, the elapsed time from its first start to
    its last finish
  kind: scalar
  unit: s
  notes: Bounded below by $\max(\AggregateSlotWork/\WorkerCount, \CriticalPathDuration)$.
- macro: \SchedulingClassWeight
  latex: w
  definition: weight of one service class in weighted deficit round-robin, the multiplier on the per-round
    credit quantum
  kind: scalar
  unit: dimensionless
  notes: Each round a class gains $w$ times the quantum in scheduling-charge tokens; long-run calls per
    round are $w \times \text{quantum}/(\SequenceLength + \OutputLimit)$. Weights fix charge shares, not
    call shares. Must be positive for every class expected to progress.
- macro: \ScoredPrefixLength
  latex: S_{\text{step}}
  definition: number of tokens in the growing candidate prefix that a process scorer reads after one step
  kind: count
  notes: 'Always written with the finite-change prefix in this chapter: $\FiniteChange\,S_{\text{step}}$
    is the tokens one step appends. Not the task prompt length $\SequenceLength$.'
- macro: \ScoredStepCount
  latex: J
  definition: number of steps in a candidate whose growing prefix a process scorer evaluates, once after
    each step
  kind: count
  notes: Rescoring every prefix from scratch costs a term quadratic in $J$.
- macro: \ScoredStepIndex
  latex: j
  definition: position of one step of a candidate that a process scorer evaluates, counted from one
  kind: index
  notes: Runs to $\ScoredStepCount$.
- macro: \ScoredToolCall
  latex: a
  definition: one proposed tool call in a schema-robustness evaluation, indexed by its position among
    the scored calls
  kind: record
  notes: Indexed $a_i$; checked against \ActiveSchemaSet. Not \PolicyAction.
- macro: \ScoredToolCallCount
  latex: N
  definition: number of proposed tool calls an evaluation scores for schema following and parametric recall
  kind: count
  notes: Denominator of SFA and PRE. Not \CandidatePoolSize or \InitiatedTasks.
- macro: \ScoringErrorStandardDeviation
  latex: \sigma
  definition: standard deviation of the error a learned scorer adds to each candidate's true utility
  kind: scalar
  unit: dimensionless
  notes: The argmax of $\CandidatePoolSize$ scores carries an expected error near $\sigma\sqrt{2\ln\CandidatePoolSize}$.
- macro: \ScreeningMissRate
  latex: m
  definition: fraction of injected payloads a screening classifier fails to catch
  kind: scalar
  unit: dimensionless
  notes: A share per payload. Screening lowers the effective payload fraction from $\DocumentPayloadFraction$
    to $\DocumentPayloadFraction\,\ScreeningMissRate$.
- macro: \SearchBranchingFactor
  latex: b
  definition: number of candidate extensions each expanded node of a search tree proposes before any pruning
  kind: count
  notes: The pruned tree's expected survivors per node are $\EffectiveBranchingFactor$.
- macro: \SearchDepth
  latex: d_{\max}
  definition: maximum depth a tree search expands
  kind: count
  notes: The depth index is $d$. Written $d_{\max}$ because bare $D$ is dataset size.
- macro: \SearchDepthIndex
  latex: d
  definition: depth of one level of a search tree, counted from the root
  kind: index
  notes: Runs from 1 to the depth limit $\SearchDepth$. Not the differential d.
- macro: \SearchQueryEmbedding
  latex: \mathbf{q}
  definition: embedding of a search query, the full-precision vector a vector index compares against its
    stored vectors
  kind: vector
  notes: Not the attention \QueryVector.
- macro: \SecondAdjacentCheckIndex
  latex: b
  definition: label of the second of two adjacent independent admission predicates whose order is compared
  kind: index
  notes: Paired with $\FirstAdjacentCheckIndex$. Not $\SignatureBandCount$, which renders the same letter
    in the Split Design section.
- macro: \SecondAdjacentCheckPassProbability
  latex: p_{b}
  definition: pass probability of the second of two adjacent independent admission predicates
  kind: scalar
  unit: dimensionless
  notes: The pass probability $p_i$ of predicate $\text{chk}_b$; see $\FirstAdjacentCheckPassProbability$.
- macro: \SecondAdjacentCheckSlotTime
  latex: T_{b}
  definition: expected verifier slot time of the second of two adjacent independent admission predicates
  kind: scalar
  unit: s
  notes: The slot time $T_i$ of predicate $\text{chk}_b$; see $\FirstAdjacentCheckSlotTime$.
- macro: \SecondCatalogDefinitionCount
  latex: n_{\text{def},B}
  definition: number of tool definitions each call stages under the second of two compared fixed catalogs
  kind: count
  notes: Catalog B in the token ratio against catalog A.
- macro: \SecondCatalogDefinitionSize
  latex: S_{B}
  definition: mean number of tokens one tool definition of the second of two compared catalogs contributes
    to the serialized request
  kind: scalar
  unit: tokens
  notes: Catalog B in the token ratio against catalog A.
- macro: \SecondRaterCategoryFraction
  latex: p_{y,2}
  definition: fraction of the cases the second of two raters assigns to one rating category
  kind: scalar
  unit: dimensionless
  notes: Multiplies \FirstRaterCategoryFraction in the chance agreement of Cohen's kappa. The $y$ in the
    subscript is \RatingCategory.
- macro: \SecurityLabelLattice
  latex: \mathbb{L}
  definition: information-flow security lattice, the set of security labels together with their ordering,
    join and meet
  kind: record
  notes: $\mathbb{L} = \langle \mathcal{S}_{\text{lab}}, \sqsubseteq, \sqcup, \sqcap \rangle$. Its label
    set is \SecurityLabelSet.
- macro: \SecurityLabelSet
  latex: \mathcal{S}_{\text{lab}}
  definition: set of security labels an information-flow lattice orders
  kind: set
  notes: First component of \SecurityLabelLattice. Not \AgenticSystem ($\mathcal{S}$).
- macro: \SelectedDescriptorCount
  latex: n_{\text{sel}}
  definition: number of tool descriptors a selection step places in one call's context
  kind: count
  notes: A subset of the $\RegisteredDescriptorCount$ registered descriptors.
- macro: \SelectionOverheadSize
  latex: S_{\text{sel}}
  definition: number of tokens of overhead a tool-selection step adds to a call
  kind: count
  notes: A selection step that needs its own model call adds that call's cost as well.
- macro: \SelfConsistencySampleCount
  latex: k
  definition: number of reasoning paths or answers sampled for one query to check self-consistency
  kind: count
  notes: Each sample repeats the decode phase, so decode work grows about $k$-fold; only prefill can be
    shared. Not $\PassAtK$'s run count.
- macro: \SequenceToken
  latex: x
  definition: one token of a serialized input sequence, written with its position as an index
  kind: record
  notes: Indexed by position, $x_t$, from $x_1$ to $x_{\SequenceLength}$. Its prefix before position $t$
    is $\TokenPrefix$. Not an input feature vector or an adversarial example $x_{\text{adv}}$.
- macro: \SequentialAttemptIndex
  latex: j
  definition: position of one attempt in a sequential retry sequence, counted from zero, so attempt j
    runs only after j rejections
  kind: index
- macro: \SequentialCandidateCount
  latex: M
  definition: number of candidates sequential generation starts on one task before the first one passes
    or the cap is reached, indexed by the cap
  kind: count
  notes: Its expectation with independent candidates is $\mathbb{E}[\SequentialCandidateCount_k]=q_k/p$,
    never more than the cap $k$.
- macro: \SequentialCostPerAcceptedTask
  latex: C_{\text{eff,seq}}
  definition: expected cost per accepted task when candidates are generated and checked one at a time
    until the first passes
  kind: scalar
  unit: USD/task
  notes: Equals $(g+v)/p$ for independent candidates and an exact checker, whatever the cap. A case of
    \CostPerAcceptedTask under a stated selection policy.
- macro: \SerialCallCount
  latex: n
  definition: number of model calls a trajectory makes one after another, each exposed to the per-call
    latency tail
  kind: count
- macro: \SerialReferenceTime
  latex: T_{\text{serial}}
  definition: elapsed time of a fixed work partition executed serially on a single thread, the reference
    a parallel speedup is measured against
  kind: scalar
  unit: s
  notes: Numerator of $\text{Speedup}(\WorkerCount)$; the coordination overhead $\CoordinationOverhead$
    is normalized by it. Not the capable single-agent baseline, which already overlaps tool calls.
- macro: \SerializedTrainingExample
  latex: X
  definition: one serialized training example, the ordered token sequence a fine-tuning loader builds
    from a trajectory
  kind: record
  notes: $X=(\SequenceToken_1,\ldots,\SequenceToken_{\SequenceLength})$. Not \NeighboringDataset or \DiscreteRandomVariable,
    which share the glyph.
- macro: \ServiceRate
  latex: \mu
  definition: rate at which one server, such as a worker, consumer, or model endpoint, completes items
    or calls
  kind: scalar
  unit: items/s
  notes: A pool of $\WorkerCount$ servers has capacity $\WorkerCount\,\ServiceRate$. Subscripted rates
    such as $\mu_{\text{out}}$ and a mean reward $\mu_R$ are distinct.
- macro: \SettledOperationCharge
  latex: c
  definition: final monetary charge settled for one billable operation, posted from authenticated usage
    evidence
  kind: scalar
  unit: USD
  notes: Bounded by the reservation $\bar c$; $c>\bar c$ signals a failed cost bound.
- macro: \SettledTrajectoryCost
  latex: C
  definition: settled cumulative monetary spend of a trajectory through a turn, from reported usage
  kind: scalar
  unit: USD
  notes: Written $C^{(t)}$ for the ledger after turn $t$, $C^{(t)} = C^{(t-1)} + \InputTokenPrice\,\UncachedInputTokenCount^{(t)}
    + \dots$. Replaces reservations as usage settles; at the end of an attempt it is $\AttemptCost$'s
    model-and-tool part. Uppercase $C$ totals the lowercase unit prices.
- macro: \SetupShareCap
  latex: \phi
  definition: largest share of a fresh call's elapsed time that envelope setup may occupy
  kind: scalar
  unit: dimensionless
- macro: \ShapedObservationSize
  latex: S_{\text{shaped}}
  definition: number of tokens one staged observation occupies after shaping
  kind: count
  notes: Carried input is $\ShapedObservationSize \cdot \RetainingCallCount$ tokens; a screenshot's token
    count plays the same role.
- macro: \SharedPoolWorkerCount
  latex: N_{\text{pool}}
  definition: number of worker slots in a pool shared across external dependencies, which one stalled
    dependency can exhaust
  kind: count
  notes: Bounds $\BlockedWorkerCount = \min(\SharedPoolWorkerCount, \ArrivalRate\,\BlockingCallTimeout)$;
    a bulkhead caps each dependency's share.
- macro: \ShipDecision
  latex: \mathbf{1}_{\text{ship}}
  definition: release decision of a declared gate, one when every predicate of the gate holds and zero
    otherwise
  kind: scalar
  unit: dimensionless
  notes: The bold one is the indicator convention, not a vector, so the registry step may need a render_exception.
    A failure of any predicate yields zero.
  render_exception: The bold 1 is the indicator-function convention for a binary decision, not a vector.
- macro: \SiblingPolicyAction
  latex: a'
  definition: any action available at the same state as a given action, the variable a sum over that state's
    actions runs over
  kind: record
  notes: Summation variable in the PUCT exploration bonus, $\sum_{a'} N(s,a')$. Not a successor action
    and not the action $\PolicyAction$ being scored.
- macro: \SignificanceCriticalQuantile
  latex: z_{1-\alpha_{\text{sig}}/2}
  definition: standard-normal quantile at one minus half the significance level, the two-sided critical
    value of a release test
  kind: scalar
  unit: dimensionless
  notes: About 1.96 when \StatisticalSignificanceLevel is 0.05. The subscript writes the significance
    level as $\alpha_{\text{sig}}$, matching \StatisticalSignificanceLevel. Not \ConfidenceCriticalQuantile
    ($z_{\alpha/2}$), whose bare $\alpha$ would read as \AcceptanceFraction in vol3.
- macro: \SingleAgentAcceptanceProbability
  latex: p_{\text{single}}
  definition: probability that one attempt by a single-agent configuration is accepted
  kind: scalar
  unit: dimensionless
  notes: The single-agent case of $\AcceptanceProbability$, compared against $\MultiAgentAcceptanceProbability$.
- macro: \SnapshotResetCycleTime
  latex: T_{\text{cycle,snap}}
  definition: environment-slot cycle time when each episode ends with a snapshot reset
  kind: scalar
  unit: s
  notes: Compared with $T_{\text{cycle,cold}}$ in the reset-cost notebook.
- macro: \SourceSinkPathSet
  latex: \Pi
  definition: set of all source-to-sink paths through an execution dependency graph
  kind: set
  notes: Upright capital Pi as the chapter renders it; a path is $\pi \in \Pi$.
  render_exception: Keeps the plain capital Pi the chapter uses for the path set, the graph-theory convention
    for a family of paths, rather than a calligraphic letter.
- macro: \SourceWriteShardGrant
  latex: \Gamma_{c}
  definition: child capability grant proposed for a shard with write access over the source directory
  kind: record
- macro: \SpendingWindowDuration
  latex: T_{\text{win}}
  definition: duration of the trailing window over which spending is measured or new liabilities are limited
  kind: scalar
  unit: s
- macro: \SplitAssignmentMap
  latex: s
  definition: 'function that assigns a task group to one data partition: training, development or final
    test'
  kind: function
  notes: Applied to $\TaskGroupMap(f)$; randomization runs over task groups, not rollouts. Not $s_{\max}$,
    the record size ceiling.
- macro: \SprtExpectedLogIncrement
  latex: m
  definition: expected increment of a sequential probability ratio test's log-likelihood ratio per labeled
    observation, under the hypothesis its index names
  kind: scalar
  unit: nats
  notes: Written $m_1$ under the degraded hypothesis; divides the boundary average in the expected stopping
    sample count.
- macro: \SprtLowerLogBoundary
  latex: b_{\text{low}}
  definition: lower stopping boundary on the log-likelihood ratio of a release sequential probability
    ratio test, at or below which the test selects the baseline hypothesis
  kind: scalar
  unit: nats
  notes: Wald's approximation $b_{\text{low}}=\ln(\beta/(1-\alpha_{\text{sig}}))$, negative. Counterpart
    of \SprtLowerBoundary in the physical domain.
- macro: \SprtStoppingSampleCount
  latex: N_{\text{stop}}
  definition: random number of labeled observations a sequential probability ratio test takes before its
    statistic first crosses a boundary, without truncation
  kind: count
  notes: Its planning approximation under the degraded hypothesis is $\mathbb{E}_1[\SprtStoppingSampleCount]\approx((1-\beta)u+\beta
    b_{\text{low}})/m_1$.
- macro: \SprtUpperLogBoundary
  latex: u
  definition: upper stopping boundary on the log-likelihood ratio of a release sequential probability
    ratio test, at or above which the test selects the degraded hypothesis
  kind: scalar
  unit: nats
  notes: Wald's approximation $u=\ln((1-\beta)/\alpha_{\text{sig}})$. Counterpart of \SprtUpperBoundary
    in the physical domain.
- macro: \StageConditionalAcceptanceProbability
  latex: q
  definition: probability that one stage of a sequential policy, a cascade tier or a loop turn, accepts
    the task, conditional on the task reaching that stage
  kind: scalar
  unit: dimensionless
  notes: Indexed by stage, $q_j$ or $q_t$. Not a task-level acceptance probability.
- macro: \StageReachProbability
  latex: r
  definition: probability that a task reaches one stage of a sequential policy, a cascade tier or a loop
    turn, the product of the rejection probabilities of the stages before it
  kind: scalar
  unit: dimensionless
  notes: Indexed by stage; $r_1=1$.
- macro: \StagedDefinitionCount
  latex: n_{\text{def}}
  definition: number of tool definitions one model call stages in its request
  kind: count
  notes: Constant across calls under a fixed catalog; written with a call index for on-demand staging.
- macro: \StagingExhaustionTime
  latex: T_{\text{exhaust}}
  definition: time until an initially empty staging store is fully reserved while records arrive faster
    than stalled verifiers drain them
  kind: scalar
  unit: s
  notes: $\StagingExhaustionTime=\StagingStoreCapacity/\big((\ArrivalRate-\WorkerCount/\VerifierTimeout)\,\RecordSizeCeiling\big)$.
- macro: \StagingStoreCapacity
  latex: M_{\text{stage}}
  definition: total bytes of the staging store that holds collected records awaiting assessment
  kind: scalar
  unit: bytes
  notes: Exhausted after $\StagingExhaustionTime$ during a verifier stall; the high watermark is a fraction
    of it.
- macro: \StaleSupportRate
  latex: \epsilon_{\text{stale}}
  definition: share of decisions requiring current evidence that relied on superseded support
  kind: scalar
  unit: dimensionless
  notes: Source-version checks identify superseded support; the runtime must label or exclude it first.
  aliases:
  - \StalesupportRate
- macro: \StandardNormalQuantile
  latex: z_q
  definition: standard-normal quantile function, the value below which a standard normal variable falls
    with a given probability
  kind: function
  notes: Its argument is \QuantileProbabilityLevel, baked into the LaTeX; \SignificanceCriticalQuantile
    and \StatisticalPowerQuantile are its values at named levels.
- macro: \StandbyInstanceMemory
  latex: M_{\text{standby}}
  definition: private memory one idle standby instance keeps resident
  kind: scalar
  unit: bytes
- macro: \StandbyReserveCount
  latex: N_{\text{reserve}}
  definition: number of clean, unassigned sandbox instances a pool keeps ready
  kind: count
- macro: \StateDistribution
  latex: d_\pi
  definition: average distribution of states a policy visits over the horizon
  kind: distribution
  notes: $d_\pi^t$ is the distribution before step $t$, and $d_\pi = \Horizon^{-1}\sum_t d_\pi^t$.
- macro: \StateExposureLevel
  latex: S
  definition: state exposure level, what a task carries between turns, from nothing to durable shared
    state
  kind: scalar
  unit: dimensionless
  notes: One level is written with its index, $\StateExposureLevel_0$ to $\StateExposureLevel_3$; the
    range is written $\StateExposureLevel_0$ to $\StateExposureLevel_3$ in words.
  aliases:
  - \StateLevels
- macro: \StateRecurrencePeriod
  latex: \ell
  definition: number of observation steps between the current workspace digest and the earlier digest
    it matches
  kind: count
  notes: Ranges over $1, \dots, \RetainedDigestCount$; a period of one is a stutter turn, a period of
    two an oscillation between two candidates.
- macro: \StatelessCursorPayload
  latex: d
  definition: 'serialized continuation state a stateless cursor carries: a query descriptor, the last
    evaluated sort key and an issuance timestamp'
  kind: record
  notes: The token returned to the client is $\StatelessCursorPayload \parallel \text{MAC}_{\text{key}}(\StatelessCursorPayload)$.
    Not a differential.
- macro: \StationaryConditionPolynomial
  latex: P
  definition: polynomial in the worker count whose positive root is the stationary point of the normalized
    elapsed-time ratio in the pairwise overhead model
  kind: function
  unit: dimensionless
  notes: Written $P(\WorkerCount)$; multiplying the derivative of $\NormalizedElapsedTimeRatio$ by $\WorkerCount^2$.
    Not parameter count.
- macro: \StatisticalFalseNegativeRate
  latex: \beta
  definition: allowed probability of a type II error, a release comparison missing a true difference of
    the target size
  kind: scalar
  unit: dimensionless
  notes: One minus it is the statistical power of the comparison. Pairs with \StatisticalSignificanceLevel.
    Not \LinkBandwidth, nor the preference or divergence weights written $\beta$.
- macro: \StatisticalPowerQuantile
  latex: z_{1-\beta}
  definition: standard-normal quantile at the target statistical power of a release test, one minus its
    type II error rate
  kind: scalar
  unit: dimensionless
  notes: About 0.84 at 80 percent power. The $\beta$ in the subscript is \StatisticalFalseNegativeRate.
    Not \PowerCriticalQuantile ($z_{\beta}$), which writes the same number in the upper-tail convention.
- macro: \StatisticalSignificanceLevel
  latex: \alpha_{\text{sig}}
  definition: allowed probability of a type I error, rejecting a true null hypothesis
  kind: scalar
  unit: dimensionless
  notes: One minus the confidence level, e.g. 0.05 for 95 percent. Used only in vol3; same glyph and meaning
    as \TypeIAndTypeIiErrorRatesSig in the distributed registry.
- macro: \StatusPollCount
  latex: N_{\text{poll}}
  definition: number of intermediate model-directed status calls made while an asynchronous job runs
  kind: count
  notes: $\StatusPollCount = \lceil \JobDuration/\FiniteChange\TimeInstant \rceil - 1$ for a poll interval
    $\FiniteChange\TimeInstant$; excludes the dispatch and completion calls.
- macro: \StepFailureHazard
  latex: a
  definition: negative natural logarithm of the per-step success probability, the per-step failure hazard
  kind: scalar
  unit: dimensionless
  notes: $a=-\ln p$; close to $1-p$ when $p$ is close to one. Not \TrajectoryAction.
- macro: \StepGenerationCost
  latex: C_{\text{gen}}
  definition: cost of generating one useful step, assumed the same for every step
  kind: scalar
  unit: varies
  notes: In money or serial elapsed time, the same unit as \VerificationCheckCost; never mix the two.
- macro: \StepGenerationTime
  latex: T_{\text{step}}
  definition: time to generate one step in a complete-block verification model
  kind: scalar
  unit: s
  notes: Not the reinforcement-learning training step latency $T_{\text{step}}$ of 17_rlvr.
- macro: \StepSuccessProbability
  latex: p
  definition: probability that one generation step succeeds, independently of the others
  kind: scalar
  unit: dimensionless
  notes: A block of $m$ steps succeeds with probability $p^m$. Not \AttemptPassProbability, the per-attempt
    task pass probability.
- macro: \StepTokenLogit
  latex: z_{t,v}
  definition: unnormalized logit the model assigns to one vocabulary token at one decoding step, before
    any constraint mask
  kind: scalar
  unit: dimensionless
  notes: The indices are the decoding step $t$ and the token \VocabularyToken; the masked counterpart
    is \MaskedTokenLogit. Not \OutputLogit ($z$), a classifier's per-class score.
- macro: \StockoutNormalQuantile
  latex: z_{1-\epsilon}
  definition: standard normal quantile at one minus the stockout probability target, the reserve's safety
    factor
  kind: scalar
  unit: dimensionless
  notes: Margin term of square-root staffing for the standby reserve.
- macro: \StockoutProbabilityTarget
  latex: \epsilon
  definition: largest acceptable probability that an arriving task finds the standby reserve empty
  kind: scalar
  unit: dimensionless
  notes: A design target; not the per-step error rate $\PerStepErrorRate$.
- macro: \StopSequenceSet
  latex: \mathcal{S}_{\text{stop}}
  definition: set of token patterns that make a serving engine halt decoding when the output matches one
  kind: set
  notes: Matched on bytes by provider semantics; a match inside a quoted argument can truncate a structure.
- macro: \StoredIndexVector
  latex: \mathbf{x}
  definition: one vector stored in a vector index, scored against a search query embedding
  kind: vector
  notes: Under product quantization it is held as codes \PqCentroidCode.
- macro: \StoredTokenVolume
  latex: V
  definition: total stored tokens of one trajectory category, its record count times the mean stored tokens
    per record
  kind: scalar
  unit: tokens
  notes: $V_j = n_j\bar S^{(j)}$; its share of the repository footprint is the stored token share.
- macro: \StreamAcceptanceProbability
  latex: p
  definition: stationary probability that one monitored task is accepted, the Bernoulli parameter a sequential
    release test compares at two hypothesized values
  kind: scalar
  unit: dimensionless
  notes: 'Hypothesized values are indexed: $\StreamAcceptanceProbability_0$ for the baseline, $\StreamAcceptanceProbability_1$
    for the specified degradation. Same quantity as \AcceptanceProbability ($p_{\text{acc}}$) but rendered
    bare as the release chapter does.'
- macro: \StrideCheckpointCount
  latex: N
  definition: number of checkpoints a policy takes over a trace, written with its stride as subscript
  kind: count
  notes: Written N_k with the stride k. Counts the same kind of thing as \TrajectoryCheckpointCount but
    renders without a label.
- macro: \StrongConfigurationAttemptCost
  latex: c_{\text{big}}
  definition: all-in monetary cost of one attempt by the stronger, more expensive agent configuration
  kind: scalar
  unit: USD
- macro: \StrongConfigurationPassProbability
  latex: p_{\text{big}}
  definition: probability that one attempt by the stronger, more expensive agent configuration is accepted
  kind: scalar
  unit: dimensionless
- macro: \SubsetAllPassIndicator
  latex: I_J^{\text{all}}
  definition: indicator that every run in a subset of graded runs passed
  kind: scalar
  unit: dimensionless
  notes: Chapter writes it $I_J^{\text{all}}$; the label superscript should move into this LaTeX ($I_J^{\text{all}}$)
    when the site is converted. Its subset average is $\AllRunsPassEstimate$.
- macro: \SubsetAnyPassIndicator
  latex: I_J
  definition: indicator that at least one run in a subset of graded runs passed
  kind: scalar
  unit: dimensionless
  notes: Its average over all subsets is the unbiased pass@k estimator $\CandidateAvailabilityEstimate$.
- macro: \SuffixFoldTime
  latex: T_{\text{fold}}
  definition: time to fold a trajectory's logged event suffix into its record during resume
  kind: scalar
  unit: s
- macro: \SummaryOutputLength
  latex: K_{\text{sum}}
  definition: number of output tokens the summarization call generates during context compaction
  kind: count
- macro: \SustainableAttemptRate
  latex: R_{\text{attempt}}
  definition: rollout attempts per second a collector sustains, the minimum of its generation, assessment
    and storage ceilings
  kind: scalar
  unit: 1/s
  notes: $\min(\AcceleratorCount/\AttemptGenerationTime,\ \WorkerCount/\ExpectedCheckingTime,\ \DurableStoreWriteBandwidth/\RecordSizeCeiling)$;
    admitted data arrives at $\SustainableAttemptRate\,\AdmissionRouteYield$.
- macro: \SystemCallFilterTime
  latex: T_{\text{filter}}
  definition: time one system call spends being validated or emulated in software
  kind: scalar
  unit: s
- macro: \SystemCallOverheadTime
  latex: T_{\text{syscall}}
  definition: time a sandbox envelope adds to one mediated system call, its system-call tax
  kind: scalar
  unit: s
  notes: Sum of $\PrivilegeTrapTime$, $\SystemCallFilterTime$ and $\ExecutionSwitchTime$.
- macro: \SystemInstructionTokenCount
  latex: S_{\text{system}}
  definition: number of tokens one call devotes to static system instructions, one term of the context
    budget partition
  kind: count
  notes: Partition term with the tool, state and observation token counts against the context window minus
    the output limit.
- macro: \TailByteAllocation
  latex: M_{\text{tail}}
  definition: bytes of the observation budget reserved for the end of a tool's output, kept in a ring
    buffer that overwrites its oldest bytes
  kind: scalar
  unit: bytes
  notes: One of the three parts of $\ObservationByteBudget$.
- macro: \TargetAcceptanceDifference
  latex: \Delta
  definition: difference in task acceptance probability between two system versions that a release comparison
    is planned to detect
  kind: scalar
  unit: dimensionless
  notes: Appears squared in the denominator of the per-arm planning estimate, so halving it quadruples
    \TasksPerComparisonArm. Not \FiniteChange, the prefix operator, nor \MinimumDetectableEffect ($\delta_{\text{MDE}}$)
    of the A/B-test chapter.
- macro: \TargetRepeatedRunConsistency
  latex: p_{\text{target}}
  definition: repeated-run consistency, the probability that all k recurrences of a task pass, that a
    recurring workload is required to hold
  kind: scalar
  unit: dimensionless
  notes: Requires a single-run pass probability of at least $p_{\text{target}}^{1/k}$. Not \TargetTrialSuccessProbability,
    a per-trial target.
- macro: \TargetTokenVolume
  latex: W
  definition: total loss-selected target tokens of one trajectory category, its record count times the
    mean target tokens per record
  kind: scalar
  unit: tokens
  notes: $W_j = n_j\bar w_j$; its share of active supervision tokens is the target token share.
- macro: \TaskAcceptanceLabel
  latex: x
  definition: binary label recording whether one monitored task was accepted, one for acceptance
  kind: scalar
  unit: dimensionless
  notes: Indexed by arrival order, $\TaskAcceptanceLabel_i$; the sequential test sums them.
- macro: \TaskContract
  latex: \mathcal{C}
  definition: 'five-part specification of a delegated task: goal, environment, permitted actions, available
    observations, and completion criteria'
  kind: set
  notes: $\TaskContract = \langle \TaskContractGoal, \TaskEnvironment, \PermittedActions, \AvailableObservations,
    \CompletionCriteria \rangle$.
- macro: \TaskContractGoal
  latex: G
  definition: desired end state of a task, with explicit negative scope, as the first element of the task
    contract
  kind: record
  notes: Text, not a number. Elsewhere $G$ is the group size $\GroupSize$.
  aliases:
  - \GoalContract
- macro: \TaskCost
  latex: C_{\text{task}}
  definition: total monetary cost of all attempts and branches for one initiated task
  kind: scalar
  unit: USD
  notes: Summed over a cohort in $\CostPerAcceptedTask$; the per-task saving of an adaptation is $\Delta
    \TaskCost$.
- macro: \TaskCoverageProbability
  latex: Q
  definition: probability that at least one attempt in a retry budget is accepted on a task, its coverage
  kind: scalar
  unit: dimensionless
  notes: Indexed by the attempt budget, $Q_k$.
- macro: \TaskEnvironment
  latex: \mathcal{E}_{\text{env}}
  definition: specification of the reproducible place the work happens, such as base commit, image, configuration,
    and network rules
  kind: set
  notes: Second element of the task contract $\TaskContract$. The environment itself, as a component of
    the agentic system, is $\mathcal{E}$.
  aliases:
  - \Environment
- macro: \TaskGroupMap
  latex: g
  definition: function that sends an environment fixture to the task group that holds all its attempts,
    paraphrases and solution-equivalent variants
  kind: function
  notes: 'Split integrity: $\TaskGroupMap(f_i)=\TaskGroupMap(f_j) \implies \SplitAssignmentMap(\TaskGroupMap(f_i))=\SplitAssignmentMap(\TaskGroupMap(f_j))$.
    Same glyph as the goal $g$ of the vol3 notation chapter (notation.qmd:77).'
- macro: \TaskIndex
  latex: i
  definition: position of one task among the tasks an evaluation samples, the index of its per-task acceptance
    probability
  kind: index
  notes: Written as the subscript of $p_i$, $n_i$, $c_i$ and $\widehat r_{i,k}$ and of the task average
    $\mathbb{E}_i$; written bare only when the text names "task $i$".
- macro: \TaskReadCount
  latex: n_{\text{read}}
  definition: number of untrusted documents or items one task reads
  kind: count
  notes: Read volume that compounds injection exposure, $1-(1-\DocumentPayloadFraction)^{\TaskReadCount}$.
    Over a trajectory, $\TaskReadCount = \TurnReadCount\,\TurnHorizon$.
- macro: \TaskStateTokenCount
  latex: S_{\text{state}}
  definition: number of tokens one call devotes to task state, such as constraints, progress records and
    source or test excerpts
  kind: count
  notes: Partition term of the context budget.
- macro: \TaskTurnCost
  latex: C_{\text{call}}
  definition: total monetary cost of one task turn's model call, its cached and uncached input tokens
    and its output tokens
  kind: scalar
  unit: USD
  notes: Indexed by the turn within a compaction cycle, ${\TaskTurnCost}_{i}$; cache misses after a rewrite
    appear in its uncached input, so no separate invalidation penalty is added.
- macro: \TasksPerComparisonArm
  latex: N_{\text{arm}}
  definition: number of tasks per arm needed for a two-proportion release comparison
  kind: count
  notes: $\approx 2(z_{1-\StatisticalSignificanceLevel/2}+z_{1-\beta})^2\,\bar p(1-\bar p)/\Delta^2$.
- macro: \TemplateSharedMemory
  latex: M_{\text{template}}
  definition: memory of the golden template image that all pool instances share copy-on-write
  kind: scalar
  unit: bytes
- macro: \TemporalDifferenceResidual
  latex: \delta
  definition: 'sampled one-step temporal-difference residual: the turn reward plus the next history''s
    value minus the current history''s value'
  kind: scalar
  unit: dimensionless
  notes: Indexed by turn, $\TemporalDifferenceResidual_k$. Its conditional expectation is the advantage
    when the value function is exact. Not \DivergenceTolerance or other subscripted deltas.
- macro: \TestPhaseCapabilityGrant
  latex: \Gamma_{\text{test}}
  definition: capability grant proposed for the test phase of a repair, read and execute over the repository
  kind: record
  notes: Not an attenuation of $\EditPhaseCapabilityGrant$, which lacks execute.
- macro: \TestsDirectoryShardGrant
  latex: \Gamma_{a}
  definition: child capability grant proposed for a test shard over the tests directory
  kind: record
- macro: \TimeBudgetUsedFraction
  latex: \rho_T
  definition: fraction of a trajectory's wall-clock allowance already elapsed
  kind: scalar
  unit: dimensionless
  notes: Elapsed time over the trajectory deadline $\CompletionDeadline$, read from the wall-clock timer.
    One of the four budget fractions whose maximum steers staged intervention.
- macro: \TokenAuthenticationCode
  latex: \sigma
  definition: message authentication code carried by a chained-caveat token, recomputed as each caveat
    is appended
  kind: record
  notes: 'Indexed by caveat position: $\TokenAuthenticationCode_i = \text{HMAC}(\TokenAuthenticationCode_{i-1},
    \TokenCaveat_i)$.'
- macro: \TokenBudgetUsedFraction
  latex: \rho_N
  definition: fraction of a trajectory's token allowance already used or reserved
  kind: scalar
  unit: dimensionless
  notes: Tokens used plus reserved over $\TrajectoryTokenLimit$. One of the four budget fractions whose
    maximum steers staged intervention.
- macro: \TokenByteDecoding
  latex: s
  definition: function mapping an ordinary vocabulary token to the fixed nonempty byte string it decodes
    to
  kind: function
  notes: Written with its argument, $s(v)$. Context-dependent tokenizers need their state in the constraint
    machine.
- macro: \TokenCaveat
  latex: c
  definition: restriction a holder appends to a chained-caveat token, such as a path prefix or an earlier
    expiry
  kind: record
  notes: Indexed by position in the chain.
- macro: \TokenIndex
  latex: t
  definition: position of a token within a rollout or a serialized training example
  kind: index
  notes: In the reinforcement-learning chapter, where turns are indexed by $k$. Elsewhere $t$ is the turn
    index $\TurnIndex$.
- macro: \TokenPrefix
  latex: x_{<t}
  definition: tokens of a serialized sequence that precede the current position, the context an autoregressive
    model conditions on
  kind: record
  notes: The prefix $x_1,\ldots,x_{t-1}$ of $\SequenceToken$; $t$ is the token position. The subscript
    $<t$ is a range, not an index, so the prefix is its own entry.
- macro: \TokenVocabulary
  latex: \mathcal{V}
  definition: set of tokens a model call samples from
  kind: set
  notes: Logits live in $\mathbb{R}^{|\TokenVocabulary|}$.
  aliases:
  - \Vocabulary
- macro: \TombstonedNodeSet
  latex: V_{\text{tomb}}
  definition: set of nodes in a vector index graph whose records are tombstoned, excluded from results
    but still linked in the graph
  kind: set
  notes: A subset of \IndexGraphNodeSet.
  render_exception: Graph theory writes the vertex sets of G = (V, E) as plain italic capitals.
- macro: \TombstonedRecordFraction
  latex: \rho_{\text{dead}}
  definition: fraction of the records in a vector index graph that are tombstoned but not yet compacted
    away
  kind: scalar
  unit: dimensionless
  notes: Compaction runs when it crosses a tuned threshold.
- macro: \ToolArgumentKey
  latex: p
  definition: one parameter name that a proposed tool call emits
  kind: record
  notes: Ranges over $\operatorname{keys}(\ProposedAccess_i)$. Not \IdempotencyKey.
- macro: \ToolCallCategory
  latex: y
  definition: one kind of tool call, such as a test run or a lint call, over which a configuration's tool-call
    distribution is defined
  kind: index
  notes: The variable the KL and Jensen-Shannon sums run over in the tool-drift comparison. Not \RatingCategory.
- macro: \ToolCallCost
  latex: c_{\text{tool}}
  definition: monetary charge for executing one tool call, such as a sandbox run or a paid third-party
    request
  kind: function
  unit: USD
  notes: Written with its call, $c_{\text{tool}}(\ExecutedToolCall_{t,j})$; posts exactly once to the
    settled ledger $\SettledTrajectoryCost$.
- macro: \ToolCallIndex
  latex: i
  definition: index of one tool call within a batch the runtime may dispatch concurrently
  kind: index
  notes: Written bare in prose (call $\ToolCallIndex$) and as the subscript of $\ToolCallReadSet$ and
    $\ToolCallWriteSet$; the second call of a compared pair is $\PeerToolCallIndex$.
- macro: \ToolCallReadSet
  latex: R
  definition: set of resources one tool call declares it reads, the read half of its resource footprint
  kind: set
  notes: 'Bernstein''s conditions: calls $i$ and $j$ may run concurrently when $\ToolCallWriteSet_i \cap
    (\ToolCallReadSet_j \cup \ToolCallWriteSet_j) = \emptyset$ and $\ToolCallWriteSet_j \cap \ToolCallReadSet_i
    = \emptyset$. Valid only for trustworthy footprints. Not the trajectory reward $\TrajectoryReward$.'
  render_exception: Bernstein's noninterference conditions write the read and write sets as plain italic
    capitals R_i and W_i.
- macro: \ToolCallWriteSet
  latex: W
  definition: set of resources one tool call declares it writes, the write half of its resource footprint
  kind: set
  notes: Paired with $\ToolCallReadSet$ in Bernstein's conditions for running two batched calls concurrently.
  render_exception: Bernstein's noninterference conditions write the read and write sets as plain italic
    capitals R_i and W_i.
- macro: \ToolDeclarationTokenCount
  latex: S_{\text{tools}}
  definition: number of tokens one call devotes to API schemas and tool declarations, one term of the
    context budget partition
  kind: count
  notes: Partition term of the context budget.
- macro: \ToolDescriptorSize
  latex: S_{\text{desc}}
  definition: number of tokens one tool descriptor occupies in a call's context
  kind: count
  notes: Taken as equal across descriptors in the selection break-even.
- macro: \ToolServiceCount
  latex: N_{\text{tool}}
  definition: number of independently maintained tool services that host runtimes integrate with
  kind: count
  notes: See $\HostRuntimeCount$ for the adapter-count comparison.
- macro: \ToolTargetState
  latex: s
  definition: state of the external system or resource a tool operation reads or mutates, such as a remote
    file or service record
  kind: record
  notes: Argument of $\StateOperation$ in the idempotency condition $\StateOperation(\StateOperation(\ToolTargetState))
    = \StateOperation(\ToolTargetState)$; $\ToolTargetState_0$ is the baseline captured immediately before
    dispatch, which a reconciliation probe compares against. Not the trajectory state $s_t$ ($\TrajectoryState$).
- macro: \ToolTime
  latex: T_{\text{tool}}
  definition: time a tool takes to execute, such as a build or a test run
  kind: scalar
  unit: s
  notes: Time a tool takes to execute, such as a build or a test run.
- macro: \TraceCrashCount
  latex: N_{\text{crash}}
  definition: number of work-losing crashes in one failure trace
  kind: count
- macro: \TraceCrashIndex
  latex: i
  definition: position of one crash among those in a failure trace
  kind: index
- macro: \TraceDecay
  latex: \lambda
  definition: generalized advantage estimator's decay factor between zero and one
  kind: scalar
  unit: dimensionless
  notes: Elsewhere a rate carries a subscript, as $\ArrivalRate$ does.
- macro: \TrainerUpdateTime
  latex: T_{\text{train}}
  definition: time the trainer spends computing and applying one parameter update after its rollouts are
    collected
  kind: scalar
  unit: s
  notes: Added to the slowest rollout duration in the group-barrier step time.
- macro: \TrainingSchemaKeySet
  latex: \mathcal{K}_{\text{train}}
  definition: set of parameter names that appeared in the tool schemas of the training corpus
  kind: set
  notes: Parametric recall error counts calls emitting a key in this set that the current schema lacks.
    Not \CompletionCriteria.
- macro: \Trajectory
  latex: \tau
  definition: ordered record of the states, actions, and observations of one delegated task
  kind: record
  notes: $\tau = (s_0, a_0, o_1, \dots, s_H)$. Bare $\tau$ always means a trajectory in Volume III. A
    record, not a number.
- macro: \TrajectoryAction
  latex: a
  definition: action the agent takes at one turn of a trajectory or decision process, an element of its
    action set
  kind: record
  notes: Indexed by turn, $\TrajectoryAction_0$. $\TrajectoryAction$ is the same action with the index
    $t$ built in; nothing happens until the runtime admits it. A record, not a number.
  aliases:
  - \ActionProposal
- macro: \TrajectoryAdmissionRate
  latex: \lambda_{\text{traj}}
  definition: rate at which trajectories are admitted, or arrive at a stage, per second
  kind: scalar
  unit: trajectories/s
  notes: The shared arrival rate $\ArrivalRate$ counted in trajectories. Sustaining goodput $\TrajectoryGoodput$
    at acceptance fraction $\AcceptanceFraction$ needs $\TrajectoryAdmissionRate = \TrajectoryGoodput/\AcceptanceFraction$.
  aliases:
  - \ConcurrentTrajectoriesTwo
- macro: \TrajectoryBudget
  latex: \mathbf{B}
  definition: ceilings on turns, tokens, wall-clock time, and dollars that the harness checks before every
    call
  kind: vector
  notes: $\TrajectoryBudget = \langle H_{\max}, N_{\max}, T_{\max}, \CostCeiling \rangle$; entries have
    mixed units. Bold, to stay distinct from batch size $B$.
- macro: \TrajectoryCallCount
  latex: N_{\text{call}}
  definition: number of model calls one admitted trajectory makes, including retries, reflection loops
    and delegated sub-agent calls
  kind: count
  notes: Its mean converts admission rate into call arrival rate.
- macro: \TrajectoryCategoryIndex
  latex: j
  definition: index of one trajectory category in a curated corpus, such as direct successes, recovery
    traces or negatives
  kind: index
  notes: Indexes the per-category record counts and token volumes, $V_j$ and $W_j$.
- macro: \TrajectoryCheckpointCount
  latex: N_{\text{ckpt}}
  definition: number of checkpoints a trajectory publishes over its run
  kind: count
  notes: Not the gradient-checkpointing layer count \ActivationCheckpointCount.
- macro: \TrajectoryDuration
  latex: T_{\text{traj}}
  definition: elapsed time of one trajectory between its declared endpoints
  kind: scalar
  unit: s
  notes: Sum over turns of $\ModelTime$, $\ToolTime$, $\ExternalWait$, and $\RuntimeTime$ when those intervals
    are disjoint.
- macro: \TrajectoryGoodput
  latex: \mathcal{G}
  definition: distinct accepted task completions per unit of elapsed time under the declared contract
  kind: scalar
  unit: tasks/s
  notes: $\TrajectoryGoodput = \AcceptedTasks/T_{\text{obs}}$. Sustaining it needs admission rate $\TrajectoryAdmissionRate
    = \TrajectoryGoodput/\AcceptanceFraction$.
- macro: \TrajectoryObservation
  latex: o
  definition: observation the environment returns to the agent after an action, an element of the decision
    process's observation set
  kind: record
  notes: Indexed by turn, $\TrajectoryObservation_{t+1}$ follows $\TrajectoryAction_t$. Not the proposed
    operation $\ProposedOperation$. A record, not a number.
  aliases:
  - \ActionObservation
  - \Observation
- macro: \TrajectoryReward
  latex: R
  definition: reward a verifier assigns to a whole trajectory
  kind: scalar
  unit: dimensionless
  notes: Reward a verifier assigns to a whole trajectory.
- macro: \TrajectoryState
  latex: s
  definition: context state the model saw at one turn of a trajectory, written with an explicit turn index
  kind: record
  notes: 'Indexed by turn: $\TrajectoryState_0$ is the initial state and $\TrajectoryState_{\TurnHorizon}$
    the state after the final turn. $\TrajectoryState$ is the same state with the index $t$ built in.
    A record, not a number.'
  aliases:
  - \StateAtTurn
- macro: \TrajectoryTimeLimit
  latex: T_{\max}
  definition: elapsed wall-clock time a trajectory budget allows, the trajectory deadline
  kind: scalar
  unit: s
  notes: Third element of $\TrajectoryBudget = \langle H_{\max}, N_{\max}, T_{\max}, \CostCeiling \rangle$.
    Outside the budget a deadline is $\CompletionDeadline$.
- macro: \TrajectoryTokenCost
  latex: C_{\text{session}}
  definition: total token charge of one trajectory's calls under a declared tariff, fresh input, cached
    input and output
  kind: scalar
  unit: USD
- macro: \TrajectoryTokenLimit
  latex: N_{\max}
  definition: largest cumulative number of tokens, input plus output, the harness lets one trajectory
    consume
  kind: count
  notes: Second element of $\TrajectoryBudget$. The token meter counts every input token, cached or not,
    plus generated output. Not \ContextWindow, a per-call limit, nor \OutputLimit.
- macro: \TrajectoryTurnLimit
  latex: H_{\max}
  definition: largest number of turns the harness admits for one trajectory, the turn allowance of its
    budget
  kind: count
  notes: First element of $\TrajectoryBudget$. Each admitted model invocation increments the turn meter.
    The cap on $\TurnHorizon$, which is the number of turns actually run.
- macro: \TransformationInputCount
  latex: k
  definition: number of labeled input records a transformation derives one record from
  kind: count
  notes: Upper limit of the label join over inputs $\LabeledRecord_1, \dots, \LabeledRecord_{\TransformationInputCount}$.
- macro: \TreeSearchExplorationWeight
  latex: c_{\text{explore}}
  definition: positive weight on the exploration bonus of the PUCT selection rule, trading exploitation
    of high-scoring edges against exploration of under-sampled ones
  kind: scalar
  unit: dimensionless
  notes: Multiplies $p(a\mid s)\sqrt{\sum_{a'}N(s,a')}/(1+N(s,a))$.
- macro: \TreeSearchLeafScore
  latex: V
  definition: score of a newly reached partial candidate in a tree search, supplied by a process scorer
    or a check, that each visit backs up along its path
  kind: scalar
  unit: dimensionless
  notes: Called the leaf value in the text. Not the estimated value $\hat{V}(h_k)$ of the learning chapters.
- macro: \TreeSearchMeanReturn
  latex: Q
  definition: running mean of the leaf scores backed up through one edge of a tree search, the edge's
    empirical mean return
  kind: function
  unit: dimensionless
  notes: Written $Q(s,a)$; each visit updates it as $Q \leftarrow Q + (V - Q)/\TreeSearchVisitCount$.
    A sample mean, not the policy action value $Q^{\pi}$ of the learning chapters.
- macro: \TreeSearchPriorDistribution
  latex: p_{\text{prior}}
  definition: prior distribution over the extensions available at a partial state, such as the base model's
    proposal probability for each reasoning step, that steers a tree search
  kind: distribution
  notes: Written $\TreeSearchPriorDistribution(a \mid s)$ in the PUCT rule.
- macro: \TreeSearchVisitCount
  latex: N_{\text{visit}}
  definition: number of times a tree search has traversed one edge, an extension taken from a partial
    state
  kind: count
  notes: Written $\TreeSearchVisitCount(s,a)$ in the PUCT rule; incremented by one on every backup through
    the edge. Not the candidate pool size $\CandidatePoolSize$.
- macro: \TrialPassProbability
  latex: p_{\text{trial}}
  definition: probability that a fixed candidate passes one verification trial under a specified protocol
  kind: scalar
  unit: dimensionless
  notes: Varies run to run only through flakiness; repeated trials of an under-specified suite pass an
    incorrect candidate every time.
- macro: \TurnAppendLength
  latex: \Delta S_{\text{turn}}
  definition: number of tokens one turn adds to the next prompt
  kind: count
  notes: Model output plus tool observations.
  aliases:
  - \PerturnAppend
- macro: \TurnBoundaryDelay
  latex: t_{\text{boundary}}
  definition: time an admitted model call can postpone the next turn boundary, the time to generate its
    full output allowance
  kind: scalar
  unit: s
  notes: $t_{\text{boundary}} \approx \OutputLimit \times \PerTokenDecodeTime$; the full-allowance case
    of $\DecodeInterval$, the wait a pause or cancellation checked only at turn boundaries can incur.
    Streaming cancellation removes the dependence on $\OutputLimit$.
- macro: \TurnBudgetUsedFraction
  latex: \rho_H
  definition: fraction of a trajectory's turn allowance already used
  kind: scalar
  unit: dimensionless
  notes: Turns used over $\TrajectoryTurnLimit$. One of the four budget fractions whose maximum steers
    staged intervention.
- macro: \TurnContext
  latex: c
  definition: tokens the runtime assembles and sends to the model on one turn
  kind: record
  notes: Instructions, goal, tool definitions, and the history of actions, observations, and evidence.
    Can summarize or omit parts of the interaction history $h_t$. A token sequence, not a number.
  aliases:
  - \Context
- macro: \TurnContributionDeviationBound
  latex: \sigma
  definition: uniform upper bound on the standard deviation of each turn's projected contribution to a
    policy-gradient estimate
  kind: scalar
  unit: dimensionless
  notes: Appears squared, $\sigma^2$, as a bound on each $\operatorname{Var}(\ProjectedTurnGradientContribution_k)$;
    gives the variance bounds $H^2\sigma^2$ and $H\sigma^2$.
- macro: \TurnCovarianceBoundScale
  latex: C
  definition: constant multiplying the geometric decay in an assumed bound on the covariance between two
    turns' projected policy-gradient contributions
  kind: scalar
  unit: dimensionless
  notes: 'Bound: $\lvert\operatorname{Cov}(Z_k,Z_j)\rvert\le C\,\TurnCovarianceDecayRatio^{j-k}$. Not
    the immediate task cost of the imitation bounds, and not a monetary cost.'
- macro: \TurnCovarianceDecayRatio
  latex: \alpha_{\text{corr}}
  definition: factor, between zero and one, by which an assumed bound on the covariance between two turns'
    projected policy-gradient contributions shrinks per turn of separation
  kind: scalar
  unit: dimensionless
  notes: Raised to the turn separation, $\alpha_{\text{corr}}^{j-k}$; a value below one makes the variance
    bound linear in the horizon.
- macro: \TurnFailureRate
  latex: \lambda_{\text{fail}}
  definition: expected number of work-losing crashes per completed turn of a trajectory
  kind: scalar
  unit: dimensionless
  notes: A per-turn share (crashes per completed turn), not a per-second rate; the per-time counterpart
    is the reciprocal of \MeanTimeBetweenFailures. Not the arrival rate \ArrivalRate or the component
    failure rate \ComponentFailureRate.
- macro: \TurnGeneratedTokenCount
  latex: n_{\text{gen}}
  definition: number of output tokens each turn of a trajectory generates, taken as constant across turns
    in a token-cost inventory
  kind: count
  notes: Multiplies the horizon $\TurnHorizon$ for a base trajectory and the remaining turns for each
    continuation branch.
- macro: \TurnHorizon
  latex: H
  definition: number of sequential turns an agent trajectory runs
  kind: count
  notes: The H axis of the H-S-A framework. Vol4 uses of the old name mean the action-chunk horizon, which
    is \ActionChunkHorizon.
  aliases:
  - \Horizon
- macro: \TurnIndex
  latex: t
  definition: position of a turn within a trajectory, counted from zero or from one as the chapter states
  kind: index
  notes: $s_H$ is the state after the final turn. Inside a per-token loss $t$ indexes token positions
    instead, and positions in a durable log use $j$.
- macro: \TurnInputTokenCost
  latex: C_{\text{in}}
  definition: inference charge for the input tokens of one turn of an attempt, under the provider's rate
    card including caching discounts
  kind: scalar
  unit: USD
  notes: Turn index as a parenthesized superscript, $C_{\text{in}}^{(t)}$. Not the input channel count.
- macro: \TurnOutputTokenCost
  latex: C_{\text{out}}
  definition: inference charge for the output tokens one turn of an attempt generates
  kind: scalar
  unit: USD
  notes: Written $C_{\text{out}}^{(t)}$. Not the output channel count.
- macro: \TurnPayloadProbability
  latex: q_{\text{turn}}
  definition: probability that one turn of a trajectory encounters attacker-influenced content, independently
    across turns
  kind: scalar
  unit: dimensionless
  notes: Per turn; per document it is $\DocumentPayloadFraction$. Over a horizon, exposure is $1-(1-\TurnPayloadProbability)^{\TurnHorizon}$.
- macro: \TurnReadCount
  latex: r
  definition: number of untrusted documents one turn of a trajectory reads
  kind: count
  notes: 'Links the per-turn and per-document exposure forms: $\TaskReadCount = \TurnReadCount\,\TurnHorizon$.
    Not the operation recipient $\OperationRecipient$, which shares the letter in the security chapter.'
- macro: \TurnReconstructionTime
  latex: T_{\text{recon}}
  definition: time to reconstruct one logged turn of a recovery suffix by reading, validating, folding
    and applying its records
  kind: scalar
  unit: s
- macro: \TurnReexecutionTime
  latex: T_{\text{exec}}
  definition: time to re-execute one unlogged turn by repeating its model calls and tool invocations
  kind: scalar
  unit: s
- macro: \TurnReward
  latex: r
  definition: reward a rollout receives immediately after the action at one turn
  kind: scalar
  unit: dimensionless
  notes: Indexed by turn, $\TurnReward_k$. Zero at every intermediate turn when only a terminal check
    scores the rollout; the sum over turns is the trajectory reward $\TrajectoryReward$.
- macro: \TurnSandboxCost
  latex: C_{\text{sandbox}}
  definition: charge for the wall-clock lifetime of an attempt's sandbox environment during one turn,
    idle waits included
  kind: scalar
  unit: USD
  notes: Written $C_{\text{sandbox}}^{(t)}$.
- macro: \TurnStateGrowth
  latex: s_{\text{turn}}
  definition: bytes of checkpointed state, workspace files and record fields, that one turn adds
  kind: scalar
  unit: bytes
  notes: Per turn. Not the per-turn prompt append \TurnAppendLength, which counts tokens.
- macro: \TurnToolFeeCost
  latex: C_{\text{tools}}
  definition: billable external tool, API and data-lookup fees one turn of an attempt incurs
  kind: scalar
  unit: USD
  notes: Written $C_{\text{tools}}^{(t)}$.
- macro: \UnacceptedTaskMeanCost
  latex: C_{\text{fail}}
  definition: 'mean task-account cost of the unaccepted tasks in a settled cohort: failures, cancellations
    and timeouts'
  kind: scalar
  unit: USD
- macro: \UncachedInputTokenCount
  latex: n_{\text{in}}
  definition: number of input tokens in a call that the provider bills at the uncached input rate
  kind: count
  notes: Settled-ledger category priced at $\InputTokenPrice$; disjoint from $\CachedInputTokenCount$,
    so the two sum to the prompt $\SequenceLength$. Written $n_{\text{in}}^{(t)}$ for turn $t$.
- macro: \UnconstrainedCallLatency
  latex: T_{\text{free}}
  definition: latency of a tool call generated by free sampling without constrained decoding, including
    at most one repair turn when it fails to parse
  kind: scalar
  unit: s
  notes: Random over whether the call parses; its expectation is $\OutputLength\,\PerTokenDecodeTime +
    \UnconstrainedParseFailureRate\,\RepairTurnLatency$.
- macro: \UnconstrainedParseFailureRate
  latex: p_{\text{err}}
  definition: fraction of tool calls generated without constrained decoding whose output fails to parse
  kind: scalar
  unit: dimensionless
  notes: A share per call, measured for the actual model, schema and prompt. Constraining reduces expected
    latency when it exceeds $\BreakEvenParseFailureRate$.
- macro: \UniformLoopTurnCost
  latex: C_{\text{turn}}
  definition: monetary cost of one turn of a bounded agent loop when every turn costs the same, including
    inference, tools, sandbox lease and assessment
  kind: scalar
  unit: USD
  notes: The uniform case of \LoopTurnCost ($C_t$).
- macro: \UnitTemperatureProbabilityVector
  latex: \mathbf{p}_{\tau_{\text{temp}}=1}
  definition: vector of next-token probabilities the softmax assigns at unit sampling temperature
  kind: vector
  notes: One entry per vocabulary token; renders $\mathbf{p}_{\tau_{\text{temp}}=1}$.
- macro: \UnrecoverableDamageCost
  latex: C_{\text{blast}}
  definition: cost of the unrecoverable damage a modeled external failure causes when an action executes
    automatically
  kind: scalar
  unit: USD
  notes: The text allows any common cost unit; USD is the default. Positive by assumption.
- macro: \UpperRatioClippingWidth
  latex: \epsilon_{\text{high}}
  definition: distance above one at which the clip-higher surrogate stops rewarding a rising probability
    ratio
  kind: scalar
  unit: dimensionless
  notes: Larger than $\LowerRatioClippingWidth$, so low-probability tokens with positive coefficients
    can climb faster.
- macro: \UsefulStepCount
  latex: N
  definition: number of useful generation steps a task needs, excluding regenerated work
  kind: count
  notes: Shared by the rare-error and complete-block verification cadence models. Not \RetrievalCollectionSize.
- macro: \UserSpaceSetupTime
  latex: T_{\text{user}}
  definition: time to set up the user-space runtime of one sandbox instance, such as language runtimes
    and libraries
  kind: scalar
  unit: s
- macro: \ValidCandidateRate
  latex: p_{\text{valid}}
  definition: share of generated candidates that meet the specification, before any check
  kind: scalar
  unit: dimensionless
  notes: $\ValidCandidateRate = \Pr(\text{Valid})$; with $\VerifierFalseAcceptanceRate$ and $\VerifierFalseRejectionRate$
    it sets verifier precision $\Pi_V$.
- macro: \ValidTokenSet
  latex: \mathcal{V}_{\text{valid}}
  definition: set of vocabulary tokens whose decoded strings keep the output a viable prefix of the target
    grammar from a parser state
  kind: set
  notes: Written with its argument, $\mathcal{V}_{\text{valid}}(\DecodingConstraintState_t)$; a subset
    of $\TokenVocabulary$.
- macro: \ValidatedProposalEvent
  latex: e_{\text{prop}}
  definition: event at which the runtime holds a validated, complete proposal for an external effect,
    first in the write-ahead dispatch ordering
  kind: record
  notes: Precedes $e_{\text{auth}}$ in the ordering $e_{\text{prop}} \prec e_{\text{auth}} \prec e_{\text{flush}}
    \prec a_{\text{ext}} \prec e_{\text{obs}}$ (intent before effect). Distinct from \TrajectoryAction
    ($a_t$), the action itself.
- macro: \VerificationCheckCost
  latex: C_{\text{ver}}
  definition: cost of running one verification check on generated work
  kind: scalar
  unit: varies
  notes: In money or serial elapsed time, the same unit as \StepGenerationCost. Not \ExpectedCheckingTime.
- macro: \VerificationCheckCount
  latex: K
  definition: number of verification checks over a task
  kind: count
  notes: At the relaxed optimum $K^*=N/m^*$. Not \OutputLength ($K$).
- macro: \VerificationEvidence
  latex: v
  definition: result of a check the runtime runs on the resulting state, as pass or fail or a score
  kind: scalar
  unit: dimensionless
  notes: Independent of the action and of the model's report.
- macro: \VerificationPoolCapacity
  latex: \mu_{\text{verify}}
  definition: number of trajectories per second a verification pool can finish when every trajectory needs
    its full set of trials
  kind: scalar
  unit: trajectories/s
  notes: Equals $\WorkerCount/(n_{\text{trial}}T_{\text{trial}})$; compared directly with the arrival
    rate $\TrajectoryAdmissionRate$. Not the per-server \ServiceRate.
- macro: \VerificationScheduleCost
  latex: C
  definition: expected total cost of a task's generation, verification checks and error recovery as a
    function of the check interval
  kind: function
  unit: varies
  notes: Written $C(m)$; same unit as \StepGenerationCost. Minimized at $m^*$.
- macro: \VerificationTrialCount
  latex: n_{\text{trial}}
  definition: number of verification trials an all-pass rule requires of one candidate, counting the first
  kind: count
  notes: Acceptance needs every one of them to pass, probability $p_{\text{trial}}^{n_{\text{trial}}}$;
    each trajectory demands $n_{\text{trial}}T_{\text{trial}}$ worker-seconds when all run.
- macro: \VerificationTrialIndex
  latex: j
  definition: number of verification trials already run on a candidate, the index of a sum over trials
  kind: index
  notes: Runs from 0 to $n_{\text{trial}}-1$ in the expected trial count; written as an exponent, $p_{\text{trial}}^j$.
- macro: \VerificationTrialTime
  latex: T_{\text{trial}}
  definition: mean time one verification trial occupies a worker slot, including environment provisioning,
    execution and cleanup
  kind: scalar
  unit: s
  notes: A trajectory demands $n_{\text{trial}}T_{\text{trial}}$ worker-seconds when every trial runs.
- macro: \VerifiedTrajectorySet
  latex: \mathcal{T}_{\text{success}}
  definition: set of dispatched trajectories whose results passed verification
  kind: set
  notes: Subset of $\DispatchedTrajectorySet$.
  aliases:
  - \TrajectorySetsSuccess
- macro: \VerifierFalseAcceptanceRate
  latex: \epsilon_{\text{FA}}
  definition: probability that a verifier passes a candidate that does not meet the specification
  kind: scalar
  unit: dimensionless
  notes: $\Pr(\text{PASS} \mid \neg\text{Valid})$. Subscripted to stay distinct from $\PerStepErrorRate$.
  aliases:
  - \VerifierFalseacceptance
- macro: \VerifierFalseRejectionRate
  latex: \epsilon_{\text{FR}}
  definition: probability that a verifier fails a candidate that meets the specification
  kind: scalar
  unit: dimensionless
  notes: $\Pr(\neg\text{PASS} \mid \text{Valid})$.
  aliases:
  - \VerifierFalseacceptanceFr
- macro: \VerifierPassProbability
  latex: q
  definition: probability that a verifier passes one candidate drawn from the generator, valid or not
  kind: scalar
  unit: dimensionless
  notes: $q=\ValidCandidateRate(1-\VerifierFalseRejectionRate)+(1-\ValidCandidateRate)\VerifierFalseAcceptanceRate$;
    a pool of $\CandidatePoolSize$ yields a selection with probability $1-(1-q)^{\CandidatePoolSize}$.
- macro: \VerifierPrecision
  latex: \Pi_{V}
  definition: probability that a candidate meets the specification given that the verifier passed it,
    the precision of a passing verdict
  kind: scalar
  unit: dimensionless
  notes: Set by Bayes' rule from the valid-candidate rate $\ValidCandidateRate$, the false-rejection rate
    $\VerifierFalseRejectionRate$ and the false-acceptance rate $\VerifierFalseAcceptanceRate$; unchanged
    by candidate pool size at fixed rates. $1-\Pi_V$ is the false-discovery rate among accepted candidates,
    not the false-acceptance rate. Not a product operator.
- macro: \VerifierTimeout
  latex: T_{\text{out}}
  definition: hard timeout after which one verifier execution is stopped, the service time of every assessment
    during a stall
  kind: scalar
  unit: s
  notes: During a stall capacity falls to $\WorkerCount/\VerifierTimeout$. Same glyph as $\OutcomeCheckSlotTime$,
    in another section of the chapter.
- macro: \VerifierTrueAcceptanceRate
  latex: u
  definition: probability that a verifier passes a candidate that meets the specification
  kind: scalar
  unit: dimensionless
  notes: Equals one minus $\VerifierFalseRejectionRate$. With $\ValidCandidateRate$ and $\VerifierFalseAcceptanceRate$
    it sets the false-accept share $(1-p)q/(pu+(1-p)q)$.
- macro: \VerifierVerdict
  latex: V
  definition: verdict of the training verifier on a rollout, written with a plus superscript for the event
    that it accepts
  kind: record
  notes: $V^+$ is acceptance, the event 13_evaluation writes $\text{Acc}$. The superscript stays in the
    chapter. Not \ExpectedRemainingReturn, which shares the glyph in the same chapter.
- macro: \VertexSlotTime
  latex: d
  definition: time one vertex of a task-precedence graph occupies a worker slot, including model inference
    and tool execution
  kind: function
  unit: s
  notes: Written with its vertex, $d(v)$. Not a differential or a dimension.
- macro: \VocabularyToken
  latex: v
  definition: one token of a model's vocabulary, the variable a next-token distribution, a logit or a
    sum over candidate tokens ranges over
  kind: index
  notes: An element of \TokenVocabulary; indexes the logit $z_{t,v}$. 02_foundation_model writes the same
    vocabulary position as $i$. Not \VerificationEvidence ($v_t$).
- macro: \VocabularyTokenLogit
  latex: o
  definition: logit a language model produces for one vocabulary token at one sequence position, before
    the softmax
  kind: scalar
  unit: dimensionless
  notes: Indexed by position and vocabulary token, $o_{t-1,v}$. Not \OutputLogit ($z$, a classifier's
    class score) or \ProposedOperation, which share or resemble the glyph.
- macro: \WholeRepositoryShardGrant
  latex: \Gamma_{b}
  definition: child capability grant proposed for a test shard over the whole repository
  kind: record
- macro: \WilsonIntervalCenter
  latex: \tilde{p}
  definition: center of the Wilson score interval for an acceptance probability, the observed share shrunk
    toward one half
  kind: scalar
  unit: dimensionless
  notes: $\tilde p=(X+z^2/2)/(N+z^2)$; the interval is $\tilde p$ plus or minus a half-width that stays
    positive when no task, or every task, is accepted.
- macro: \WindowSpendingLimit
  latex: C_{\text{win}}
  definition: largest total of admitted charge bounds permitted within any trailing spending window
  kind: scalar
  unit: USD
- macro: \WithinTaskRunStandardDeviation
  latex: \sigma_{\text{run}}
  definition: square root of the expected variance of one run's acceptance outcome across repeated runs
    of the same task, averaged over the task population
  kind: scalar
  unit: dimensionless
  notes: Written squared, $\sigma^2_{\text{run}}=\mathbb E[p_i(1-p_i)]$, in the variance decomposition,
    where it divides by both the task count and the runs per task. Not \RepeatedRunStandardDeviation,
    which measures a benchmark metric's run-to-run spread.
- macro: \WorkerBaseCommitHash
  latex: h_{\text{base}}
  definition: content hash of the commit a worker started from
  kind: record
  notes: A content hash names an immutable commit; the integration gate compares hashes, never mutable
    directory references.
- macro: \WorkerCandidateCommitHash
  latex: h_{\text{worker}}
  definition: content hash of the candidate commit a worker returns
  kind: record
  notes: A content hash names an immutable commit; the integration gate compares hashes, never mutable
    directory references.
- macro: \WorkerCompletionDistribution
  latex: F
  definition: cumulative distribution function of one parallel worker's completion time, the probability
    it returns an admissible result within a given time
  kind: function
  unit: dimensionless
  notes: An all-results barrier meets a deadline with probability $F(t)^{\WorkerCount}$.
- macro: \WorkerCompletionTime
  latex: T
  definition: time a parallel worker takes from dispatch to return an admissible result
  kind: scalar
  unit: s
  notes: Indexed by worker, $T_i$; $T_{(k)}$ is the k-th smallest, the arrival of the k-th admissible
    result.
- macro: \WorkerCount
  latex: N_{\text{workers}}
  definition: number of equally capable workers, agents, threads, or verifier slots in one pool
  kind: count
  notes: Never bare $M$ or $P$, which are memory and parameter count.
  aliases:
  - \WorkerCountWorkers
- macro: \WorkerOverheadSlope
  latex: \gamma
  definition: normalized coordination overhead added by each worker beyond the first, in a linear overhead
    model of a fixed work partition
  kind: scalar
  unit: dimensionless
  notes: Overhead is $\CoordinationOverhead(\WorkerCount)=\gamma(\WorkerCount-1)$ as a fraction of $\SerialReferenceTime$;
    the best worker count sits near $\sqrt{\ParallelFraction/\gamma}$. Equals $\CoherencyCoefficient$
    only when all overhead is pairwise.
- macro: \WorkerWrittenFileCount
  latex: w
  definition: number of distinct files each worker writes, its write-set size
  kind: count
  notes: Collision odds grow with $\WorkerCount(\WorkerCount-1)w^2/(2\RepositoryFileCount)$.
- macro: \WorkspaceRestoreTime
  latex: T_{\text{ws}}
  definition: time to restore a trajectory's workspace files during resume
  kind: scalar
  unit: s
