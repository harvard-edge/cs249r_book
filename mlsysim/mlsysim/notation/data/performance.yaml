# Notation registry: performance
# Iron law, roofline, memory, serving and energy: the quantities every volume measures performance in.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AcceleratorCount
  latex: N_{\text{GPU}}
  definition: Accelerator Count
  kind: count
  unit: Integer
  notes: Number of accelerators in one job.
  aliases:
  - \AcceleratorCountGpu
- macro: \ActivationMemory
  latex: M_{\text{activations}}
  definition: Activation Memory
  kind: scalar
  unit: bytes
  notes: Retained activations for the backward pass or serving intermediates.
  aliases:
  - \ActivationMemoryActivations
- macro: \ArithmeticIntensity
  latex: I
  definition: Arithmetic Intensity
  kind: scalar
  unit: FLOP/byte
  notes: Workload FLOPs per byte moved. The Roofline Model uses $I$ as the independent variable.
- macro: \ArrivalRate
  latex: \lambda_{\text{arr}}
  definition: Arrival Rate
  kind: scalar
  unit: requests/s
  notes: Request arrival rate. The subscript keeps bare $\lambda$ free for fitted sensitivities.
- macro: \AttainableComputeRate
  latex: R_{\text{attain}}
  definition: Attainable Compute Rate
  kind: scalar
  unit: FLOP/s
  notes: 'Roofline bound: $\AttainableComputeRate \leq \min(\PeakRate, I \times \Bandwidth)$. Uses $R$,
    not $T$, because this quantity is a rate.'
- macro: \Bandwidth
  latex: \text{BW}
  definition: Bandwidth
  kind: scalar
  unit: bytes/s
  notes: '**Avoids collision with $B$ (Batch Size)**. Systems literature often uses $B$ for bandwidth,
    while ML literature often uses $B$ for batch size. The notation preserves the ML convention.'
- macro: \BatchServiceTime
  latex: T_{\text{svc}}(B)
  definition: Batch Service Time
  kind: scalar
  unit: seconds
  notes: Time to serve a batch of size $B$.
  aliases:
  - \BatchServiceTimeSvc
- macro: \BatchSize
  latex: B
  definition: Batch Size
  kind: scalar
  unit: Bandwidth ($\text{BW}$), Body frame ($\mathcal{F}_B$), bus burst size ($B_k$), or input matrix
    $\mathbf{B}$
  notes: Batch size is $B$; sustained bandwidth is $\text{BW}$ (per Iron Law); coordinate reference frames
    use calligraphic script ($\mathcal{F}_W, \mathcal{F}_B, \mathcal{F}_E$); bus transaction sizes use
    $D_{\text{trans}, k}$ or $B_k$; state-space control input matrix is bold capital $\mathbf{B} \in \mathbb{R}^{n
    \times m}$.
- macro: \CompressionRatio
  latex: r_{\text{comp}}
  definition: Compression Ratio
  kind: scalar
  unit: Dimensionless
  notes: Uncompressed size divided by compressed size. A compressed payload has $1/\CompressionRatio$
    of the uncompressed size; the subscript avoids bare $C$ collisions.
- macro: \DataVolume
  latex: D_{\text{vol}}
  definition: Data Volume
  kind: scalar
  unit: bytes
  notes: '**Avoids collision with $D$ (Dataset Size)**. In scaling laws, $D$ means training tokens. Here
    we need bytes moved through memory. The subscript disambiguates.'
- macro: \EffectiveServiceRate
  latex: \mu_{\text{eff}}(B)
  definition: Effective Service Rate
  kind: scalar
  unit: requests/s
  notes: Batched service rate, typically $\EffectiveServiceRate = B/\BatchServiceTimeSvc$. The unbatched
    service rate is $\mu = \mu_{\text{eff}}(1)$.
- macro: \EfficiencyHw
  latex: \eta_{\text{hw}}
  definition: Efficiency
  kind: scalar
  unit: —
  notes: Hardware utilization $(0 \le \EfficiencyHw \le 1)$. Avoids collision with learning rate $(\eta)$.
- macro: \ElementStorageSize
  latex: s_{\text{elem}}
  definition: Element Storage Size
  kind: scalar
  unit: bytes/element
  notes: Bytes per stored tensor element.
- macro: \EndToEndRequestLatency
  latex: L_{\text{lat, total}}
  definition: End-to-End Request Latency
  kind: scalar
  unit: seconds
  notes: Request-path latency budget, $L_{\text{lat,network}} + L_{\text{lat,pre}} + L_{\text{lat,infer}}
    + L_{\text{lat,post}} + L_{\text{lat,queue}}$. $\RequestTimeInSystemLat$ covers only the time inside
    the serving system.
- macro: \EnergyPerByteMoved
  latex: E_{\text{move}}
  definition: Energy per Byte Moved
  kind: scalar
  unit: joules/byte
  notes: Effective movement cost; total energy also depends on bytes moved and operations executed.
- macro: \EnergyPerOperationCompute
  latex: E_{\text{compute}}
  definition: Energy per Operation
  kind: scalar
  unit: joules/FLOP
  notes: Energy cost of a single arithmetic operation.
- macro: \GradientMemory
  latex: M_{\text{gradients}}
  definition: Gradient Memory
  kind: scalar
  unit: bytes
  notes: Memory occupied by stored gradients.
  aliases:
  - \GradientMemoryGradients
- macro: \IronLawComputeTime
  latex: T_{\text{compute}}
  definition: time spent computing in the iron law, operations divided by the sustained compute rate
  kind: scalar
  unit: seconds
  notes: The memory and compute terms of the iron law, $\DataVolume/\Bandwidth$ and $O/(\PeakRate \cdot
    \EfficiencyHw)$.
  aliases:
  - \IronlawTermTimesCompute
- macro: \IronLawMemoryTime
  latex: T_{\text{memory}}
  definition: Iron-Law Term Times
  kind: scalar
  aliases:
  - \IronlawTermTimesMemory
- macro: \Latency
  latex: L_{\text{lat}}
  definition: Latency
  kind: scalar
  unit: seconds
  notes: '**Avoids collision with $\mathcal{L}$ (Loss)**. Fixed overhead time (kernel launch, network
    RTT). The subscript distinguishes from the loss function.'
- macro: \LayerInputWidth
  latex: d_{\text{in}}
  definition: Layer Input Width
  kind: scalar
  unit: Integer
  notes: Number of input features in a layer.
  aliases:
  - \LayerInputAndOutputWidths
- macro: \LearningRate
  latex: \eta
  definition: Learning Rate
  kind: scalar
- macro: \Loss
  latex: L
  definition: Loss
  kind: scalar
  unit: Latency
  notes: '**Loss** $(\mathcal{L})$. Use $\Latency$ for latency.'
- macro: \LossscaleFactor
  latex: s_{\text{loss}}
  definition: Loss-Scale Factor
  kind: scalar
  unit: Dimensionless
  notes: Multiplier applied to the loss in reduced-precision training so small gradients stay representable.
- macro: \ModelFlopsUtilization
  latex: \text{MFU}
  definition: Model FLOPs Utilization
  kind: scalar
  unit: Dimensionless
  notes: Useful model FLOP/s divided by available peak FLOP/s. Text acronym avoids overloading $\eta$.
- macro: \Operations
  latex: O
  definition: Operations
  kind: scalar
  unit: FLOPs
  notes: Total floating-point operations. Clean in equations (vs. "$\text{Ops}$").
- macro: \OptimizerstateMemory
  latex: M_{\text{optimizer}}
  definition: Optimizer-State Memory
  kind: scalar
  unit: bytes
  notes: Momentum, variance, master weights, and related optimizer buffers.
- macro: \Parameters
  latex: P
  definition: Parameters
  kind: scalar
  unit: Power ($P_{\text{elec}}, P_{\text{cont}}$), Riccati error covariance $\mathbf{P}(t)$, failure
    rate $p_{\text{fail}}$, or 3D point $\mathbf{p}$
  notes: Use $P$ for parameter count. Electrical/mechanical power is $P_{\text{elec}}, P_{\text{cont}},
    P_{\text{peak}}$ (in Watts); continuous Riccati/Kalman error covariance is bold matrix $\mathbf{P}(t)$;
    statistical failure probability or rate is lowercase italic $p$ ($p_{\text{target}}, p_{\text{emp}},
    p_{\text{fail}}$); 3D Cartesian position is bold lowercase $\mathbf{p} = [x, y, z]^\top$.
- macro: \PeakRate
  latex: R_{\text{peak}}
  definition: Peak Rate
  kind: scalar
  unit: FLOP/s
  notes: '**Avoids collision with $P$ (Parameters)**. Roofline presentations often use $P$ for performance,
    while ML literature commonly uses $P$ for parameter count. The notation preserves the ML convention.'
- macro: \RequestConcurrency
  latex: Q_{\text{req}}
  definition: Request Concurrency
  kind: scalar
  unit: requests
  notes: Average in-flight requests in a stable serving system ($\RequestConcurrency = \ArrivalRate \cdot
    \RequestTimeInSystemLat$ via Little's Law). Avoids overloading $N$, which counts devices, elements,
    or samples elsewhere.
- macro: \RequestTimeInSystem
  latex: T_{\text{lat}}
  definition: Request Time in System
  kind: scalar
  unit: seconds
  notes: End-to-end queueing/serving latency for Little's Law. Distinct from $\Latency$, the fixed-latency
    term in the iron law.
  aliases:
  - \RequestTimeInSystemLat
- macro: \RooflineRidgePoint
  latex: I_{\text{ridge}}
  definition: Roofline Ridge Point
  kind: scalar
  unit: FLOP/byte
  notes: $\RooflineRidgePoint = \PeakRate/\Bandwidth$. Prefer this explicit form over starred shorthand
    so the meaning remains clear in prose.
- macro: \SampleStorageSize
  latex: s_{\text{sample}}
  definition: Sample Storage Size
  kind: scalar
  unit: bytes/sample
  notes: Bytes per stored training or serving sample.
- macro: \SequenceLength
  latex: S
  definition: Sequence Length
  kind: scalar
- macro: \ServingUtilization
  latex: \rho_{\text{serv}}
  definition: Serving Utilization
  kind: scalar
  unit: Dimensionless
  notes: Queue/server utilization. The subscript keeps bare $\rho$ free for other ratio models.
- macro: \Time
  latex: T
  definition: Time
  kind: scalar
  unit: s
  notes: Execution or wall-clock time (e.g. training time, serving latency term in the Iron Law).
- macro: \TotalEnergy
  latex: E_{\text{total}}
  definition: Total Energy
  kind: scalar
  unit: joules
  notes: Total energy consumed by an ML workload, decomposed into data-movement and compute terms.
- macro: \TotalMemoryFootprint
  latex: M_{\text{total}}
  definition: Total Memory Footprint
  kind: scalar
  unit: bytes
  notes: Sum of explicit memory components; avoids bare $M$ ambiguity.
- macro: \WeightMemory
  latex: M_{\text{weights}}
  definition: Weight Memory
  kind: scalar
  unit: bytes
  notes: Total memory required to store policy weights ($P \times \text{bytes-per-parameter}$).
  aliases:
  - \WeightMemoryWeights
