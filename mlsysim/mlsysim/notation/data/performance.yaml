# Notation registry: performance
# Iron law, roofline, memory, serving and energy: the quantities every volume measures performance in.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AcceleratedFractionSpeedup
  latex: G
  definition: speedup factor applied to the accelerated fraction of a workload in Amdahl's law, whether
    it comes from faster hardware or from more workers
  kind: scalar
  unit: dimensionless
  notes: General form of the Amdahl gain; specializes to \AcceleratorGain ($G_{\text{accel}}$) for an
    accelerator or to \WorkerCount for linear scaling over workers. Not the LogGP per-byte gap \LongMessageGapPerByte,
    the agentic \GroupSize, or \TaskContractGoal, which share the glyph.
- macro: \AcceleratorBatchTime
  latex: T_{\text{GPU}}
  definition: time the accelerator takes to run one training step on one batch
  kind: scalar
  unit: s
  notes: Denominator of $\InputPipelineRatio$.
- macro: \AcceleratorConsumptionRate
  latex: R_{\text{accel}}
  definition: batches per second the accelerator can consume, its compute rate divided by the operations
    per batch
  kind: scalar
  unit: batches/s
- macro: \AcceleratorCount
  latex: N_{\text{GPU}}
  definition: number of accelerators one job runs on
  kind: count
  notes: Counts accelerators, not host nodes. Training time divides across it in the iron law's compute
    term, and ring AllReduce traffic per rank scales as $2(\AcceleratorCount-1)/\AcceleratorCount$.
  aliases:
  - \AcceleratorCountGpu
- macro: \AcceleratorGain
  latex: G_{\text{accel}}
  definition: speedup an optimization or accelerator gives the fraction of execution it applies to, in
    Amdahl's law
  kind: scalar
  unit: dimensionless
  notes: Pairs with $\ParallelFraction$; overall speedup is $1/((1-\ParallelFraction) + \ParallelFraction/G_{\text{accel}})$.
- macro: \AcceleratorMemoryBandwidth
  latex: \text{BW}_{\text{accelerator}}
  definition: sustained rate at which bytes move between an accelerator's own memory, such as HBM, and
    its compute units
  kind: scalar
  unit: bytes/s
- macro: \AcceleratorStepTime
  latex: T_{\text{step}}
  definition: time the accelerator spends executing one training step, excluding host-side data preparation
  kind: scalar
  unit: s
  notes: In a serial pipeline the step costs host preparation plus this; prefetching overlaps the two.
- macro: \AcceleratorSupplyCurrent
  latex: i
  definition: electrical current an accelerator draws from its power supply
  kind: scalar
  unit: A
  notes: Appears as its time derivative di/dt, the current slew that average-power meters miss. Not the
    motor phase current i_{phase} of the physical domain.
- macro: \AccumulatedSyncTime
  latex: T_{\text{sync}}
  definition: gradient synchronization time paid once for an accumulated update
  kind: scalar
  unit: s
- macro: \AccumulatedUpdateTime
  latex: T_{\text{effective}}
  definition: 'time of one optimizer update under gradient accumulation: all micro-batch passes, one synchronization
    and the step'
  kind: scalar
  unit: s
- macro: \AchievedKernelBandwidth
  latex: \text{BW}_{\text{effective}}
  definition: memory bandwidth a kernel actually achieves, the bytes it moves divided by its measured
    execution time
  kind: scalar
  unit: bytes/s
  notes: Measured from a profiler trace and compared against the peak memory bandwidth to diagnose a memory-bound
    kernel. Decorated form of \Bandwidth.
- macro: \ActivationCheckpointCount
  latex: n_{\text{ckpt}}
  definition: number of layers whose activations gradient checkpointing keeps
  kind: count
  notes: Uniform spacing puts the optimum at $\sqrt{\LayerCount}$.
- macro: \ActivationMemory
  latex: M_{\text{activations}}
  definition: memory holding the intermediate activations a model keeps for the backward pass or between
    serving stages
  kind: scalar
  unit: bytes
  notes: One term of $\TotalMemoryFootprint$. Grows with batch size and sequence length while weight,
    gradient and optimizer-state memory stay fixed; activation checkpointing trades it for recomputation.
  aliases:
  - \ActivationMemoryActivations
- macro: \ActiveInferencePower
  latex: P_{\text{active}}
  definition: average power an accelerator draws while actively running inference
  kind: scalar
  unit: W
  notes: Times the inference duration gives the energy of one inference.
- macro: \AlgorithmTaxonomyAxis
  latex: \mathsf{Algorithm}
  definition: Algorithm axis of the D·A·M taxonomy, viewed as the set of techniques and concepts it covers
    so that axis intersections name zones of the taxonomy
  kind: set
  notes: The chapter states the D·A·M axes are taxonomy labels, not mathematical variables; $\mathsf{Algorithm}$
    appears only inside set intersections such as $\mathsf{Data} \cap \mathsf{Algorithm}$. Never \DatasetSize
    or \DataVolume.
  render_exception: Sans-serif upright-ish name marks a D·A·M taxonomy axis treated as a set of techniques
    in an intersection, not a calligraphic or blackboard set symbol.
- macro: \ArithmeticIntensity
  latex: I
  definition: operations a workload performs per byte it moves through memory
  kind: scalar
  unit: FLOP/byte
  notes: $\ArithmeticIntensity = \Operations/\DataVolume$. The roofline model plots attainable rate against
    it; above $\RooflineRidgePoint$ a kernel is compute-bound, below it memory-bound.
- macro: \ArrivalRate
  latex: \lambda_{\text{arr}}
  definition: average number of requests or jobs arriving per second
  kind: scalar
  unit: arrivals/s
  notes: Enters Little's law, $\RequestConcurrency = \ArrivalRate \RequestTimeInSystem$, and serving utilization
    $\ServingUtilization = \ArrivalRate/\mu$. The subscript keeps bare $\lambda$ free for other rates.
- macro: \AsymptoticTightBound
  latex: \Theta
  definition: 'asymptotic tight bound: grows at the same rate as its argument, up to constant factors'
  kind: operator
  notes: Companion to big-O, which is exempt.
- macro: \AttainableComputeRate
  latex: R_{\text{attain}}
  definition: highest operation rate a workload can sustain on given hardware, capped by peak compute
    or by memory bandwidth times arithmetic intensity
  kind: scalar
  unit: FLOP/s
  notes: 'Roofline bound: $\AttainableComputeRate \leq \min(\PeakRate, \ArithmeticIntensity \times \Bandwidth)$.
    Uses $R$, not $T$, because this quantity is a rate.'
- macro: \AveragePower
  latex: P_{\text{avg}}
  definition: power drawn averaged over a stated period
  kind: scalar
  unit: W
  notes: Power always carries a subscript; bare $P$ is parameter count $\Parameters$.
- macro: \Bandwidth
  latex: \text{BW}
  definition: sustained rate at which bytes move across a memory or data path
  kind: scalar
  unit: bytes/s
  notes: The denominator of the iron law's data-movement term $\DataVolume/\Bandwidth$. Never bare $B$,
    which is batch size $\BatchSize$.
- macro: \BatchBufferMemory
  latex: M_{\text{batch}}
  definition: host memory one batch occupies while it sits in a pipeline buffer
  kind: scalar
  unit: bytes
- macro: \BatchDataVolume
  latex: D_{\text{vol}}^{(\text{batch})}
  definition: bytes of input data one batch carries to the accelerator
  kind: scalar
  unit: bytes
- macro: \BatchFetchTime
  latex: T_{\text{fetch}}
  definition: time to fetch one batch from storage
  kind: scalar
  unit: s
- macro: \BatchFormationDelay
  latex: L_{\text{lat,form}}
  definition: time a request waits for its batch to fill before the batch is dispatched
  kind: scalar
  unit: s
  notes: Averages $(\BatchSize-1)/(2\ArrivalRate)$ for a count-triggered batcher under Poisson arrivals;
    bounded by \BatchingWindow for a timed one.
- macro: \BatchLatencyEnvelope
  latex: L_{\text{lat,envelope}}
  definition: conservative bound on a request's batching latency, the full batching window plus the service
    time of its 99th-percentile batch
  kind: scalar
  unit: s
  notes: Assumes an available worker at dispatch; excludes other request stages.
- macro: \BatchOperations
  latex: O_{\text{batch}}
  definition: floating-point operations of the forward and backward pass for one batch
  kind: scalar
  unit: FLOP
- macro: \BatchProcessingTime
  latex: T_{\text{process}}
  definition: time the preprocessing stage spends on one batch
  kind: scalar
  unit: s
- macro: \BatchServiceTime
  latex: T_{\text{svc}}
  definition: time an accelerator takes to process one batch once execution begins, as a function of batch
    size
  kind: scalar
  unit: s
  notes: Often modeled as a fixed overhead plus a per-request cost times batch size. Sets the batched
    service rate $\EffectiveServiceRate = \BatchSize/\BatchServiceTime$.
  aliases:
  - \BatchServiceTimeSvc
- macro: \BatchTransferTime
  latex: T_{\text{transfer}}
  definition: time to copy one batch of input data from host memory to the device that consumes it
  kind: scalar
  unit: s
  notes: Overlap with compute bounds the batch interval by $\max(\IronLawComputeTime, T_{\text{transfer}})$.
- macro: \BatchedRequestLatency
  latex: L_{\text{lat,total}}
  definition: latency a request accrues in a batching server, its batching wait plus the service time
    of its batch
  kind: scalar
  unit: s
  notes: Covers batching and service only, not network, preprocessing or other stages; distinct from \EndToEndRequestLatency
    despite the shared subscript.
- macro: \BatchingLatencyBudget
  latex: L_{\text{lat,SLO}}
  definition: share of a mean latency objective allotted to batching wait and batch service
  kind: scalar
  unit: s
  notes: Bounds $T_{\text{window}}/2 + \BatchServiceTime$ when screening batch sizes. A part of \LatencySlo,
    not all of it; the two share a glyph today.
- macro: \BatchingQueueWait
  latex: L_{\text{lat,wait}}
  definition: time a request waits in a batching server's queue before its batch begins service, formation
    included
  kind: scalar
  unit: s
  notes: The text says it corresponds to the queue-only wait \QueueWaitTime and to the latency budget's
    \QueueingLatency.
- macro: \BatchingWindow
  latex: T_{\text{window}}
  definition: length of the batching window, the longest a dynamic batcher holds requests before dispatching
    a batch
  kind: scalar
  unit: s
  notes: Measured from the oldest buffered request for a triggered window, or as a fixed calendar interval.
    Poisson arrivals give a mean of $\ArrivalRate T_{\text{window}}$ requests per window.
- macro: \BroadcastColumnElement
  latex: A
  definition: one element of the broadcast column tensor
  kind: scalar
  unit: dimensionless
- macro: \BroadcastColumnTensor
  latex: \mathbf{A}
  definition: column tensor of shape (3, 1) that broadcasting stretches across columns
  kind: matrix
- macro: \BroadcastRowElement
  latex: B
  definition: one element of the broadcast row tensor
  kind: scalar
  unit: dimensionless
  notes: Not batch size.
- macro: \BroadcastRowTensor
  latex: \mathbf{B}
  definition: row tensor of shape (1, 4) that broadcasting stretches across rows
  kind: matrix
- macro: \BroadcastTableSize
  latex: s_{\text{table}}
  definition: size in bytes of the small table a broadcast join sends to every worker
  kind: scalar
  unit: bytes
  notes: Broadcast traffic is this size times one less than the worker count.
- macro: \ChainedOperationCount
  latex: n_{\text{ops}}
  definition: number of consecutive operations in a chain that each read and write the same intermediate
    tensor, the chain kernel fusion merges
  kind: count
- macro: \ClockFrequency
  latex: f
  definition: rate at which a processor's clock ticks, setting how many switching cycles occur per second
  kind: scalar
  unit: Hz
  notes: With voltage rising in proportion to frequency, dynamic power scales roughly as $f^3$.
- macro: \CloudOffloadEnergy
  latex: E_{\text{cloud}}
  definition: energy a device spends transmitting an input to the cloud for remote inference
  kind: scalar
  unit: J
  notes: Approximately data volume times $\TransmissionEnergyPerByte$; excludes the server's own energy.
- macro: \ClusterPower
  latex: P_{\text{cluster}}
  definition: electrical power a training cluster draws, accelerators plus hosts
  kind: scalar
  unit: W
  notes: Times training time gives training energy.
- macro: \CompilationBreakevenCount
  latex: N_{\text{breakeven}}
  definition: number of executions whose per-execution savings repay one compilation
  kind: count
  notes: Compilation time over the per-execution saving of compiled over eager mode. Not the agentic $\BreakEvenTaskCount$.
- macro: \CompilationTime
  latex: T_{\text{compile}}
  definition: time one compilation or recompilation of a model takes
  kind: scalar
  unit: s
- macro: \CompiledExecutionTime
  latex: T_{\text{compiled}}
  definition: time for one execution of a model after compilation
  kind: scalar
  unit: s
- macro: \CompilerBackendCount
  latex: N
  definition: number of hardware backends a compiler stack generates code for
  kind: count
- macro: \CompilerFrontendCount
  latex: M
  definition: number of source frontends, such as capture mechanisms or languages, a compiler stack supports
  kind: count
- macro: \CompletedRequestCount
  latex: N
  definition: number of requests a system has completed by a given time
  kind: count
  notes: Written N(T) in the Little's law proof. Not \DeviceCount.
- macro: \CompressionRatio
  latex: r_{\text{comp}}
  definition: uncompressed size of a payload divided by its compressed size
  kind: scalar
  unit: dimensionless
  notes: A compressed payload has $1/\CompressionRatio$ of the uncompressed size. The subscript avoids
    bare $C$ collisions.
- macro: \ComputationalDimensionCount
  latex: N_{\text{comp}}
  definition: number of computational dimensions of an operation whose memory placement a mapping chooses
  kind: count
- macro: \ComputeLimitedSampleRate
  latex: R_{\text{compute}}
  definition: samples per second the accelerators could process if input data were always ready
  kind: scalar
  unit: samples/s
  notes: Compute-capacity side of the training-throughput bound; not $\AttainableComputeRate$, which is
    in FLOP/s.
- macro: \ConversationTurnIndex
  latex: k
  definition: position of one turn within a multi-turn conversation
  kind: index
  notes: Turn k+1 reuses turn k's KV cache only if routed to the same replica.
- macro: \CumulativeArrivals
  latex: A
  definition: cumulative number of requests that have arrived at a system by a given time
  kind: function
  unit: requests
  notes: Written A(t). Not the advantage A of reinforcement learning.
- macro: \CumulativeCompletions
  latex: C
  definition: cumulative number of requests a system has completed by a given time
  kind: function
  unit: requests
  notes: Written C(t).
- macro: \DataSupplyRate
  latex: R_{\text{data}}
  definition: samples per second the storage and input pipeline can deliver to training
  kind: scalar
  unit: samples/s
  notes: Storage bandwidth after overhead divided by bytes per sample, $\Bandwidth_{\text{storage}}(1-f)/\SampleStorageSize$.
- macro: \DataTaxonomyAxis
  latex: \mathsf{Data}
  definition: Data axis of the D·A·M taxonomy, viewed as the set of techniques and concepts it covers
    so that axis intersections name zones of the taxonomy
  kind: set
  notes: The chapter states the D·A·M axes are taxonomy labels, not mathematical variables; $\mathsf{Data}$
    appears only inside set intersections such as $\mathsf{Data} \cap \mathsf{Algorithm}$. Never \DatasetSize
    or \DataVolume.
  render_exception: Sans-serif upright-ish name marks a D·A·M taxonomy axis treated as a set of techniques
    in an intersection, not a calligraphic or blackboard set symbol.
- macro: \DataVolume
  latex: D_{\text{vol}}
  definition: total bytes a workload moves through memory or across a data path
  kind: scalar
  unit: bytes
  notes: The numerator of the iron law's data-movement term $\DataVolume/\Bandwidth$. Distinct from bare
    $D$, which is dataset size in tokens in scaling laws.
- macro: \DatasetTransferTime
  latex: T
  definition: ideal line-rate time to move a dataset of a given size across a network or storage path,
    data volume divided by bandwidth
  kind: scalar
  unit: s
  notes: Lower bound that ignores latency and protocol overhead; the data-gravity calculation.
- macro: \DecodeTokenTimeFloor
  latex: T_{\text{token}}
  definition: lower bound on the time to generate one token at batch one, bytes streamed per step divided
    by memory bandwidth
  kind: scalar
  unit: s
  notes: Realized time per output token (\PerTokenDecodeTime) adds dispatch and launch overhead on top
    of it.
- macro: \DevelopmentIterationCount
  latex: N_{\text{dev}}
  definition: number of development iterations that each force a recompilation
  kind: count
- macro: \DeviceHardwareTime
  latex: T_{\text{hw}}
  definition: time the device spends executing a step's kernels, compute plus memory time when they do
    not overlap
  kind: scalar
  unit: s
  notes: Approximately $\IronLawComputeTime + \IronLawMemoryTime$ without overlap; replace with measured
    device time when they overlap.
- macro: \DeviceMemoryCapacity
  latex: M_{\text{device}}
  definition: total memory a device provides for a model's weights and activations
  kind: scalar
  unit: bytes
  notes: 'A fit precondition: $\WeightMemory + \ActivationMemory$ must not exceed it.'
- macro: \DevicePower
  latex: P_{\text{device}}
  definition: electrical power one device draws
  kind: scalar
  unit: W
  notes: Integrated over time it gives the device's energy.
- macro: \DeviceRequestCapacity
  latex: Q_{\text{req,max}}
  definition: largest number of requests a device can hold in service at once, its concurrent request
    slots
  kind: count
  notes: Upper bound on \RequestConcurrency set by device state; divided by \RequestTimeInSystem it gives
    a throughput proxy.
- macro: \DiskBandwidth
  latex: \text{BW}_{\text{disk}}
  definition: sustained rate at which a storage disk delivers bytes
  kind: scalar
  unit: bytes/s
  notes: One of three bandwidths on the data path with $\NetworkBandwidth$ and $\AcceleratorMemoryBandwidth$;
    they differ by orders of magnitude.
- macro: \DispatchedOperationCount
  latex: N_{\text{ops}}
  definition: number of operations a framework dispatches, each paying its own launch overhead
  kind: count
  notes: A count of dispatches, not of arithmetic operations ($\Operations$).
- macro: \DraftAcceptanceRate
  latex: \alpha
  definition: fraction of draft-model tokens the target model accepts in speculative decoding
  kind: scalar
  unit: dimensionless
  notes: Sets the expected accepted tokens per verification step.
- macro: \DraftTokenCount
  latex: k
  definition: number of tokens a draft model proposes for the target model to verify in one speculative-decoding
    step
  kind: count
  notes: The target model verifies the k-token block in one forward pass.
- macro: \DynamicPower
  latex: P_{\text{dynamic}}
  definition: power a chip draws switching its transistors, proportional to switched capacitance, supply
    voltage squared and clock frequency
  kind: scalar
  unit: W
  notes: $P_{\text{dynamic}} \propto \SupplyVoltage^2 \ClockFrequency$; leakage power is separate.
- macro: \EagerExecutionTime
  latex: T_{\text{eager}}
  definition: time for one execution of a model in eager mode
  kind: scalar
  unit: s
- macro: \EchoFactor
  latex: e
  definition: number of times data echoing reuses each sample the input pipeline produces
  kind: scalar
  unit: dimensionless
  notes: Raising it beyond $\InputPipelineRatio$ adds no throughput.
- macro: \EffectiveServiceRate
  latex: \mu_{\text{eff}}
  definition: requests a batched server completes per second at a given batch size
  kind: scalar
  unit: requests/s
  notes: $\EffectiveServiceRate = \BatchSize/\BatchServiceTime$. The unbatched service rate is $\mu =
    \mu_{\text{eff}}(1)$; a stable server needs $\EffectiveServiceRate > \ArrivalRate$.
- macro: \EffectiveStorageThroughput
  latex: R_{\text{storage,eff}}
  definition: storage throughput a training job actually achieves, after record size, layout, caching
    and shuffling losses
  kind: scalar
  unit: bytes/s
- macro: \EfficiencyHw
  latex: \eta_{\text{hw}}
  definition: fraction of peak compute rate the hardware actually sustains on a workload
  kind: scalar
  unit: dimensionless
  notes: Lies between 0 and 1; the iron law's compute term is $\Operations/(\PeakRate \cdot \EfficiencyHw)$.
    The subscript keeps bare $\eta$ for the learning rate $\LearningRate$.
- macro: \ElementStorageSize
  latex: s_{\text{elem}}
  definition: bytes needed to store one tensor element at its numerical precision
  kind: scalar
  unit: bytes/element
  notes: Two bytes for FP16 or BF16, one for INT8. Multiplies element counts into bytes moved or held,
    as in weight bytes $\Parameters \ElementStorageSize$.
- macro: \EndToEndRequestLatency
  latex: L_{\text{lat, total}}
  definition: time from a request leaving the client to its response returning, summed over every stage
    on the request path
  kind: scalar
  unit: s
  notes: Sums network, preprocessing, inference, postprocessing and queueing delay, $L_{\text{lat,network}}
    + L_{\text{lat,pre}} + L_{\text{lat,infer}} + L_{\text{lat,post}} + L_{\text{lat,queue}}$. $\RequestTimeInSystem$
    covers only the time inside the serving system, and the iron law's $\Latency$ only fixed overhead.
- macro: \EnergyPerByteMoved
  latex: E_{\text{move}}
  definition: energy spent moving one byte between memory and the compute units
  kind: scalar
  unit: J/byte
  notes: The movement term of total energy is $\DataVolume \times \EnergyPerByteMoved$. Moving a byte
    from DRAM costs far more than one arithmetic operation, $\EnergyPerByteMoved \gg \EnergyPerOperation$.
- macro: \EnergyPerOperation
  latex: E_{\text{compute}}
  definition: energy spent executing one arithmetic operation
  kind: scalar
  unit: J/operation
  notes: The compute term of total energy is $\Operations \times \EnergyPerOperation$. Depends on precision
    and process node.
  aliases:
  - \EnergyPerOperationCompute
- macro: \FanoutBackendCount
  latex: m
  definition: number of parallel backend sub-requests one user request fans out to and must wait for
  kind: count
  notes: With independent backends each meeting a threshold with probability 0.99, all meet it with probability
    $0.99^m$.
- macro: \FeedForwardOperations
  latex: O_{\text{FFN}}
  definition: floating-point operations of the two linear transformations of one transformer feed-forward
    block
  kind: scalar
  unit: FLOP
- macro: \FirstAtomicGradientUpdate
  latex: A
  definition: first of three gradient updates that accelerator threads accumulate atomically into a shared
    tensor, whose accumulation order varies between runs
  kind: scalar
  unit: dimensionless
  notes: Concrete instance of the floating-point associativity example; the run-dependent grouping of
    these updates is the source of bitwise nondeterminism. Not the generic addends a, b, c and not matrix
    operands.
- macro: \FirstFloatingPointAddend
  latex: a
  definition: first of three floating-point numbers added in either grouping to show that floating-point
    addition is not associative
  kind: scalar
  unit: dimensionless
  notes: The three addends a, b, c appear together only in the associativity identity (a+b)+c vs a+(b+c);
    they are generic numbers, not any modeled quantity. Distinct from the bold GEMM matrix operands A,
    B, C.
- macro: \FlopPrice
  latex: c_{\text{FLOP}}
  definition: price of executing one floating-point operation on rented or owned accelerators
  kind: scalar
  unit: USD/FLOP
  notes: Turns training operations into processing cost.
- macro: \FormatEfficiency
  latex: \eta_{\text{format}}
  definition: fraction of the bytes a storage format reads that carry the features a job selects
  kind: scalar
  unit: dimensionless
  notes: Multiplies physical bandwidth into effective bandwidth. Not the learning rate $\LearningRate$
    or hardware efficiency $\EfficiencyHw$.
- macro: \FusedDataVolume
  latex: D_{\text{vol,fused}}
  definition: bytes an operation sequence moves after fusion keeps its intermediates on chip
  kind: scalar
  unit: bytes
  notes: Specialization of \DataVolume; about $2\,\IntermediateTensorSize$.
- macro: \FusionInputTensor
  latex: \mathbf{X}
  definition: input tensor of a chain of elementwise operators that kernel fusion combines
  kind: matrix
  notes: Its intermediate results are $\mathbf{X}'$ after ReLU and $\mathbf{X}''$ after batch normalization.
- macro: \FusionOutputTensor
  latex: \mathbf{Y}
  definition: output tensor of a chain of elementwise operators that kernel fusion combines
  kind: matrix
- macro: \GemmAccumulatorScale
  latex: \beta
  definition: scalar multiplier applied to the existing output matrix before the product is added in a
    general matrix multiply
  kind: scalar
  unit: dimensionless
  notes: BLAS convention; not the link bandwidth $\LinkBandwidth$.
- macro: \GemmColumnDimension
  latex: N
  definition: number of columns of the right operand and of the output in a matrix multiply
  kind: count
  notes: Not $\DeviceCount$; a GEMM dimension, so it appears only beside $M$ and $K$.
- macro: \GemmInnerDimension
  latex: K
  definition: shared inner dimension of a general matrix multiply, the number of products summed per output
    element
  kind: count
- macro: \GemmLeftOperand
  latex: \mathbf{A}
  definition: left input matrix of a general matrix multiply, of size M by K
  kind: matrix
  notes: In $\GemmOutputMatrix = \GemmProductScale \GemmLeftOperand\GemmRightOperand + \GemmAccumulatorScale
    \GemmOutputMatrix$.
- macro: \GemmLeftOperandElement
  latex: A
  definition: one entry of the left operand of a matrix multiply, indexed by row and reduction position
  kind: scalar
  unit: dimensionless
  notes: Entry $(i,k)$ of $\GemmLeftOperand$, written $\GemmLeftOperandElement_{ik}$.
- macro: \GemmLeftOperandEntry
  latex: A_{ik}
  definition: entry in row i and column k of the left input matrix of a matrix multiply
  kind: scalar
  unit: dimensionless
  notes: k is the summed inner index; the matrix is $\GemmLeftOperand$.
- macro: \GemmOutputElement
  latex: C
  definition: one entry of the output of a matrix multiply, indexed by row and column
  kind: scalar
  unit: dimensionless
  notes: Entry $(i,j)$ of $\GemmOutputMatrix$, written $\GemmOutputElement_{ij}$.
- macro: \GemmOutputEntry
  latex: C_{ij}
  definition: entry in row i and column j of the output matrix of a matrix multiply
  kind: scalar
  unit: dimensionless
  notes: Italic because it is a scalar; the matrix is $\GemmOutputMatrix$.
- macro: \GemmOutputMatrix
  latex: \mathbf{C}
  definition: output matrix of a general matrix multiply, of size M by N, which the operation updates
    in place
  kind: matrix
  notes: Appears on both sides of $\mathbf{C}=\alpha \mathbf{A}\mathbf{B}+\beta \mathbf{C}$.
- macro: \GemmProductScale
  latex: \alpha
  definition: scalar multiplier applied to the matrix product in a general matrix multiply
  kind: scalar
  unit: dimensionless
  notes: BLAS convention; not the significance level $\SignificanceLevel$.
- macro: \GemmReductionIndex
  latex: k
  definition: index of the reduction position a matrix-multiply loop is summing over
  kind: index
  notes: Ranges over $\GemmInnerDimension$. As a subscript, $k$ is exempt.
- macro: \GemmRightOperand
  latex: \mathbf{B}
  definition: right input matrix of a general matrix multiply, of size K by N
  kind: matrix
  notes: Bold; never batch size $\BatchSize$.
- macro: \GemmRightOperandElement
  latex: B
  definition: one entry of the right operand of a matrix multiply, indexed by reduction position and column
  kind: scalar
  unit: dimensionless
  notes: Entry $(k,j)$ of $\GemmRightOperand$, written $\GemmRightOperandElement_{kj}$. Not $\BatchSize$.
- macro: \GemmRightOperandEntry
  latex: B_{kj}
  definition: entry in row k and column j of the right input matrix of a matrix multiply
  kind: scalar
  unit: dimensionless
  notes: Italic scalar entry; not batch size.
- macro: \GemmRowDimension
  latex: M
  definition: number of rows of the left operand and of the output in a matrix multiply
  kind: count
  notes: An $M{\times}K$ by $K{\times}N$ product costs $2MNK$ operations. Not $\CollectivePayloadSize$
    and not a memory size.
- macro: \GemmTileColumnDimension
  latex: N_{\text{tile}}
  definition: number of output columns in one tile of a tiled matrix multiply
  kind: count
  notes: The tile counterpart of $\GemmColumnDimension$.
- macro: \GemmTileInnerDimension
  latex: K_{\text{tile}}
  definition: length of the reduction dimension covered by one tile of a tiled matrix multiply
  kind: count
  notes: The tile counterpart of $\GemmInnerDimension$.
- macro: \GemmTileRowDimension
  latex: M_{\text{tile}}
  definition: number of output rows in one tile of a tiled matrix multiply
  kind: count
  notes: The tile counterpart of $\GemmRowDimension$.
- macro: \GemvArithmeticIntensity
  latex: I_{\text{GEMV}}
  definition: arithmetic intensity of a matrix-vector multiply that reads each weight once, counting weight
    traffic only
  kind: scalar
  unit: FLOP/byte
  notes: About 1 FLOP/byte at FP16 and 0.5 at FP32; the batch-one decode regime. General intensity is
    $\ArithmeticIntensity$.
- macro: \GradientMemory
  latex: M_{\text{gradients}}
  definition: memory holding the gradient of every trainable parameter during training
  kind: scalar
  unit: bytes
  notes: One term of $\TotalMemoryFootprint$; zero at inference. ZeRO-2 shards it across data-parallel
    workers.
  aliases:
  - \GradientMemoryGradients
- macro: \HalfPrecisionGemvIntensity
  latex: I_{\text{GEMV, 16-bit}}
  definition: arithmetic intensity of a batch-one matrix-vector multiply whose 16-bit weights stream from
    memory
  kind: scalar
  unit: FLOP/byte
  notes: A specific case of \ArithmeticIntensity; 16-bit covers FP16 and BF16.
- macro: \HostPower
  latex: P_{\text{host}}
  definition: electrical power one host server draws for its CPUs and other non-accelerator components
  kind: scalar
  unit: W
  notes: Multiplied by the node count for the host share of cluster power $P_{\text{cluster}}$; excludes
    the accelerators, counted in $P_{\text{GPU}}$.
- macro: \HostPreparationTime
  latex: T_{\text{prep}}
  definition: time the host takes to prepare one batch for the accelerator, from read through batching
  kind: scalar
  unit: s
- macro: \HostSoftwareTime
  latex: T_{\text{sw}}
  definition: host-side software time a step spends in the interpreter, dispatch and kernel launch
  kind: scalar
  unit: s
  notes: In the additive model $T_{\text{sw}} = N_{\text{ops}} \cdot t_{\text{dispatch}}$; the dispatch
    tax is $T_{\text{sw}}/(T_{\text{sw}}+T_{\text{hw}})$.
- macro: \HostTransferBandwidth
  latex: \text{BW}_{\text{host}}
  definition: sustained bandwidth of the host-to-accelerator transfer path
  kind: scalar
  unit: bytes/s
- macro: \InferenceDutyCycle
  latex: \alpha_{\text{duty}}
  definition: fraction of time an accelerator actively runs inference rather than waiting in standby
  kind: scalar
  unit: dimensionless
  notes: Weights active and standby power in the average-power model. Not the actuator duty cycle of the
    physical domain.
- macro: \InferenceEnergy
  latex: E_{\text{inf}}
  definition: energy consumed to complete one inference request
  kind: scalar
  unit: J
  notes: Equals active power times inference duration for an isolated request.
- macro: \InferenceLatency
  latex: L_{\text{lat,infer}}
  definition: time the model takes to compute a request's output
  kind: scalar
  unit: s
  notes: One stage of $\EndToEndRequestLatency$.
- macro: \IngestionPricePerSample
  latex: C_{\text{ingest/sample}}
  definition: provider price charged to ingest one telemetry sample
  kind: scalar
  unit: USD/sample
- macro: \InputPipelineRate
  latex: R_{\text{pipeline}}
  definition: batches per second the host-side input pipeline supplies
  kind: scalar
  unit: batches/s
- macro: \InputPipelineRatio
  latex: r_{\text{pipe}}
  definition: time the input pipeline takes to produce a batch divided by the time the accelerator takes
    to train on it
  kind: scalar
  unit: dimensionless
  notes: Above one, the pipeline bottlenecks training; data echoing helps up to an echo factor equal to
    it.
- macro: \InstantaneousRequestOccupancy
  latex: Q
  definition: number of requests inside a system at one instant, arrivals so far minus completions so
    far
  kind: function
  unit: requests
  notes: Written Q(t). Its long-run time average is \RequestConcurrency.
- macro: \InterKernelGapTime
  latex: T_{\text{gap}}
  definition: time the device sits idle between consecutive kernels on a profiler timeline
  kind: scalar
  unit: s
  notes: Exposed dispatch, dependency or transfer waiting; its share of kernel-plus-gap time is the overhead
    ratio.
- macro: \IntermediateTensorSize
  latex: M_{\text{tensor}}
  definition: bytes in the intermediate tensor that a sequence of operations passes between its steps
  kind: scalar
  unit: bytes
- macro: \IntervalMeanOccupancy
  latex: \bar{Q}
  definition: average number of requests inside a system over a finite observation interval
  kind: scalar
  unit: requests
  notes: Tends to \RequestConcurrency as the interval grows for a stable system.
- macro: \IoTransferTime
  latex: T_{\text{IO}}
  definition: time to move a workload's data over a storage or network link, the input/output stage of
    a pipelined step
  kind: scalar
  unit: s
  notes: Overlaps with compute in the pipelined iron law; the step is I/O bound when it is the largest
    stage.
- macro: \IronLawComputeTime
  latex: T_{\text{compute}}
  definition: time spent computing in the iron law, operations divided by the sustained compute rate
  kind: scalar
  unit: s
  notes: Equals $\Operations/(\PeakRate \cdot \EfficiencyHw)$. Its partner is $\IronLawMemoryTime$; in
    the Fleet Law the single-device term is divided across devices, $\IronLawComputeTime/N$.
  aliases:
  - \IronlawTermTimesCompute
  - \SingleDeviceComputeTime
- macro: \IronLawMemoryTime
  latex: T_{\text{memory}}
  definition: time spent moving data in the iron law, bytes moved divided by bandwidth
  kind: scalar
  unit: s
  notes: Equals $\DataVolume/\Bandwidth$. When $\IronLawMemoryTime > \IronLawComputeTime$ without overlap,
    execution is memory-bound.
  aliases:
  - \IronlawTermTimesMemory
- macro: \KendallMarkovianCode
  latex: M
  definition: Kendall-notation code marking a Markovian, memoryless arrival or service process in a queue
    model name such as M/M/1
  kind: record
  notes: A label, not a quantity. Upright $\text{M/M/1}$ (as line 2323 already writes in prose) would
    remove the need for this entry; see the chapter questions.
- macro: \KernelActiveTime
  latex: T_{\text{compute}}
  definition: time a resource spends executing useful kernels, the union of its kernel-active intervals
  kind: scalar
  unit: s
  notes: Measured accelerator busy time, the numerator of duty-cycle system efficiency. Counts memory-bound
    kernels too, so it is not the iron law's \IronLawComputeTime, though the two share the glyph.
- macro: \KernelExecutionTime
  latex: T_{\text{kernel}}
  definition: time a kernel spends executing on the device, as measured on a profiler timeline
  kind: scalar
  unit: s
  notes: The denominator of achieved bandwidth and achieved compute throughput in trace-based diagnosis.
- macro: \KvCacheFootprint
  latex: M_{\text{KV}}
  definition: memory a transformer key-value cache occupies during autoregressive decoding
  kind: scalar
  unit: bytes
  notes: $2 \times N_L \times d \times S \times s_{\text{elem}}$ bytes.
  aliases:
  - \TransformerKvcacheFootprint
- macro: \KvTileCount
  latex: T_c
  definition: number of key-value tiles the sequence is split into in tiled attention
  kind: count
  notes: 'Not a time: equals the ceiling of sequence length over the key-value block size.'
- macro: \KvTileIndex
  latex: j
  definition: index of one key-value tile in tiled attention
  kind: index
  notes: Runs from 1 to the key-value block count.
- macro: \KvTileSize
  latex: B_c
  definition: number of key and value rows in one tile of tiled attention
  kind: count
  notes: 'Not batch size: the subscript c marks the column (key-value) blocking of FlashAttention.'
- macro: \Latency
  latex: L_{\text{lat}}
  definition: fixed overhead time a step pays regardless of bytes moved or operations executed, such as
    kernel launch, dispatch or network round trip
  kind: scalar
  unit: s
  notes: The additive third term of the iron law. Distinct from loss $\mathcal{L}$, from request time
    in system $\RequestTimeInSystem$, and from end-to-end request latency $\EndToEndRequestLatency$.
- macro: \LatencyBoundedBatchSize
  latex: B_{\text{SLO}}
  definition: largest batch size whose half-window wait plus batch service time fits the batching share
    of the latency objective
  kind: count
  notes: A first-order screen on the mean; it does not certify a percentile target.
- macro: \LatencySlo
  latex: L_{\text{lat,SLO}}
  definition: latency target a serving system's service-level objective sets for a request
  kind: scalar
  unit: s
  notes: May bound a mean or a stated percentile. The portion of it allotted to batching and service is
    \BatchingLatencyBudget.
- macro: \LayerActivationMemory
  latex: M_{\text{activations}}^{(\ell)}
  definition: memory holding the activations of layer l
  kind: scalar
  unit: bytes
  notes: Per-layer term of \ActivationMemory.
- macro: \LayerIntermediateStateMemory
  latex: s_{\ell}
  definition: bytes of saved intermediate state, other than activation outputs, one example leaves at
    one layer for the backward pass
  kind: scalar
  unit: bytes
- macro: \LayerSavedTensorCount
  latex: n_{\text{saved}}
  definition: number of activation tensors one layer retains for its backward pass
  kind: count
- macro: \LeakageCurrent
  latex: I_{\text{leak}}
  definition: current that leaks through a chip's transistors when they are not switching
  kind: scalar
  unit: A
  notes: Rises with temperature; times supply voltage it gives leakage power.
- macro: \LeakagePower
  latex: P_{\text{leakage}}
  definition: static power a chip dissipates through leakage current regardless of switching
  kind: scalar
  unit: W
  notes: Equals leakage current times supply voltage; grows with temperature.
- macro: \LinkEnergyPerBit
  latex: E_{\text{link}}
  definition: physical-layer energy spent sending one bit across a host bus, accelerator interconnect
    or network link
  kind: scalar
  unit: J/bit
  notes: Quoted in pJ/bit on spec sheets. Not \EnergyPerByteMoved, which is the per-byte cost of memory-to-compute
    movement.
- macro: \LocalInferenceEnergy
  latex: E_{\text{local}}
  definition: energy a device spends running one inference on its own hardware
  kind: scalar
  unit: J
  notes: Compared against $\CloudOffloadEnergy$ to decide whether to transmit or process locally.
- macro: \LocalPathTime
  latex: T_{\text{local}}
  definition: complete time to serve one request on the local device, with no network transit
  kind: scalar
  unit: s
  notes: Compared with $\RemotePathTime$; must itself be validated against the deadline.
- macro: \LoopNestDepth
  latex: n_{\text{loops}}
  definition: number of nested loops in a computation's loop nest
  kind: count
  notes: Gives at most $n_{\text{loops}}!$ execution orders.
- macro: \LoopOrderCount
  latex: N_{\text{order}}
  definition: number of ways to order the loops of a loop nest, ignoring dependences and equivalent orderings
  kind: count
  notes: $N_{\text{order}} = \LoopNestDepth!$.
- macro: \LoopParallelizationChoiceCount
  latex: \mathcal{P}_{\text{parallel}}
  definition: number of ordered ways to choose the loops of a loop nest that run in parallel, before legality
    constraints
  kind: count
  notes: $\LoopNestDepth!/(\LoopNestDepth - \ParallelLoopCount)!$.
- macro: \LossScaleFactor
  latex: s_{\text{loss}}
  definition: multiplier applied to the loss in reduced-precision training so small gradients stay representable
  kind: scalar
  unit: dimensionless
  notes: Gradients are divided by it before the optimizer step; dynamic scaling halves it on overflow
    and doubles it after a run of clean steps.
  aliases:
  - \LossscaleFactor
- macro: \MacAccumulator
  latex: a
  definition: running sum that a multiply-accumulate operation adds each product into
  kind: scalar
  unit: dimensionless
  notes: 'Not \NeuronActivation: here a is the accumulator register of a MAC.'
- macro: \MachineTaxonomyAxis
  latex: \mathsf{Machine}
  definition: Machine axis of the D·A·M taxonomy, viewed as the set of techniques and concepts it covers
    so that axis intersections name zones of the taxonomy
  kind: set
  notes: The chapter states the D·A·M axes are taxonomy labels, not mathematical variables; $\mathsf{Machine}$
    appears only inside set intersections such as $\mathsf{Data} \cap \mathsf{Algorithm}$. Never \DatasetSize
    or \DataVolume.
  render_exception: Sans-serif upright-ish name marks a D·A·M taxonomy axis treated as a set of techniques
    in an intersection, not a calligraphic or blackboard set symbol.
- macro: \MappingSearchSpaceSize
  latex: \mathcal{S}_{\text{mapping}}
  definition: number of candidate mappings of an operation, the product of placement, ordering and parallelization
    choices across memory levels
  kind: count
  notes: An illustration, not an exact count of legal schedules.
- macro: \MatrixMultiplyDestination
  latex: \mathbf{D}
  definition: destination matrix of a matrix multiply-accumulate instruction, which receives the product
    plus the accumulator input
  kind: matrix
  notes: Tensor Core instructions compute $\mathbf{D} = \mathbf{A}\mathbf{B} + \mathbf{C}$; $\mathbf{D}$
    may alias $\mathbf{C}$.
- macro: \MaxBatchSize
  latex: B_{\text{max}}
  definition: largest batch a dynamic batcher forms, the size at which it dispatches without waiting for
    the window to close
  kind: count
  notes: The size trigger of the dual-trigger batcher; the time trigger is \BatchingWindow.
- macro: \MeasurementWindowEnd
  latex: t_{\text{end}}
  definition: instant at which an energy measurement window closes
  kind: scalar
  unit: s
  notes: Upper limit of the energy integral; its lower limit t_{\text{start}} opens the window.
- macro: \MemoryHierarchyLevelCount
  latex: N_{\text{mem}}
  definition: number of levels in a memory hierarchy, such as registers, shared memory and DRAM
  kind: count
- macro: \MemoryPlacementCount
  latex: \mathcal{M}_{\text{placement}}
  definition: number of ways to place every computational dimension at every memory level, before legality
    constraints
  kind: count
  notes: $\PlacementChoiceCount^{\ComputationalDimensionCount \times \MemoryHierarchyLevelCount}$.
- macro: \MicroUnitPrefix
  latex: \mu
  definition: SI unit prefix micro, one millionth, written before a unit such as seconds
  kind: operator
  notes: 'Not a quantity: it only scales the unit after it ($\mu$s). Never the unbatched service rate
    or a mean.'
- macro: \MicrobatchPassTime
  latex: T_{\text{micro},j}
  definition: measured forward and backward time of one micro-batch, indexed by micro-batch
  kind: scalar
  unit: s
- macro: \MinimumRoundTripLatency
  latex: L_{\text{lat,min}}
  definition: smallest possible round-trip time over a network path, set by the propagation speed of the
    medium
  kind: scalar
  unit: s
  notes: Twice the one-way distance divided by $\FiberPropagationSpeed$; a physical floor no optimization
    removes.
- macro: \ModelFlopsUtilization
  latex: \text{MFU}
  definition: useful model operations per second divided by the hardware's peak operation rate
  kind: scalar
  unit: dimensionless
  notes: Counts only operations the model needs, excluding recomputation and padding. Written as a text
    acronym to avoid overloading $\eta$.
- macro: \ModelStepOperations
  latex: O_{\text{model}}
  definition: useful model floating-point operations of one training step, forward plus backward, excluding
    recomputation
  kind: scalar
  unit: FLOP
  notes: Numerator of $\ModelFlopsUtilization$.
- macro: \MonitoringAlertCost
  latex: C_{\text{alert}}
  definition: monitoring cost of evaluating alert rules over an accounting window
  kind: scalar
  unit: USD
  notes: One of the four terms of the monitoring cost.
- macro: \MonitoringComputeCost
  latex: C_{\text{compute}}
  definition: monitoring cost of query and dashboard compute over an accounting window
  kind: scalar
  unit: USD
  notes: One of the four terms of the monitoring cost. Same glyph as the retraining compute cost, different
    meaning.
- macro: \MonitoringCostComponent
  latex: C_*
  definition: any one of the four monitoring cost components (ingestion, storage, compute, alert) over
    an accounting window
  kind: scalar
  unit: USD
  notes: Wildcard name for the family of monitoring cost terms.
- macro: \MonitoringIngestionCost
  latex: C_{\text{ingest}}
  definition: monitoring cost of ingesting telemetry over an accounting window
  kind: scalar
  unit: USD
  notes: One of the four terms of the monitoring cost.
- macro: \MonitoringStorageCost
  latex: C_{\text{storage}}
  definition: monitoring cost of storing retained telemetry over an accounting window
  kind: scalar
  unit: USD
  notes: One of the four terms of the monitoring cost.
- macro: \NetworkBandwidth
  latex: \text{BW}_{\text{network}}
  definition: sustained rate at which a network path delivers bytes between machines
  kind: scalar
  unit: bytes/s
  notes: Not $\LinkBandwidth$ ($\beta$), which is one link in the alpha-beta model.
- macro: \NetworkLatency
  latex: L_{\text{lat,network}}
  definition: time a request and its response spend crossing the network, including propagation, routing
    and protocol handling
  kind: scalar
  unit: s
  notes: One stage of $\EndToEndRequestLatency$. Not the LogP wire latency $\LogpNetworkLatency$.
- macro: \NextLayerActivationMemory
  latex: M_{\text{activations}}^{(\ell+1)}
  definition: memory holding the activations of the layer after layer l
  kind: scalar
  unit: bytes
  notes: Exists only because the checker treats (\LayerIndex+1) as a new decoration; see question.
- macro: \NonzeroCount
  latex: n_{\text{nz}}
  definition: number of nonzero values a sparse matrix format stores
  kind: count
- macro: \NumericBitWidth
  latex: b
  definition: number of bits used to represent one numeric value, such as an arithmetic operand or a quantized
    weight or activation
  kind: count
  notes: 'Bit width, not bytes: bytes per element is \ElementStorageSize. Multiplier energy and area grow
    roughly as b^2, adder cost as b.'
- macro: \ObservationIntervalLength
  latex: T
  definition: length of the observation interval over which arrivals, completions and in-system requests
    are counted, starting at time zero
  kind: scalar
  unit: s
  notes: Used in the operational proof of Little's law; the law follows as T goes to infinity. Distinct
    from \Time, the time to complete a unit of work.
- macro: \OperationDispatchOverhead
  latex: t_{\text{dispatch}}
  definition: host time to dispatch one operation, including framework dispatch and kernel launch
  kind: scalar
  unit: s
  notes: Per operation; the per-step fixed overhead is $\Latency$.
- macro: \Operations
  latex: O
  definition: total arithmetic operations a workload executes
  kind: scalar
  unit: FLOP
  notes: The numerator of the iron law's compute term $\Operations/(\PeakRate \cdot \EfficiencyHw)$. Dense
    training costs about $6 \Parameters$ operations per token.
- macro: \OperationsPerSample
  latex: O_{\text{sample}}
  definition: arithmetic operations spent training on one sample in one pass
  kind: scalar
  unit: FLOP
  notes: Total operations are $\Operations = \OperationsPerSample \cdot \DatasetSize$ per pass.
- macro: \OptimizerStateMemory
  latex: M_{\text{optimizer}}
  definition: memory holding the optimizer's per-parameter state, such as momentum, variance and master
    weights
  kind: scalar
  unit: bytes
  notes: One term of $\TotalMemoryFootprint$; zero at inference. ZeRO-1 shards it across data-parallel
    workers.
  aliases:
  - \OptimizerstateMemory
- macro: \OptimizerStepTime
  latex: T_{\text{update}}
  definition: time the optimizer takes to apply one parameter update
  kind: scalar
  unit: s
- macro: \OutputProjectionOperations
  latex: O_{\text{out}}
  definition: floating-point operations of the output projection that maps attention output back to the
    hidden width, for one layer
  kind: scalar
  unit: FLOP
- macro: \ParallelLoopCount
  latex: k_{\text{parallel}}
  definition: number of loops of a loop nest selected to run in parallel
  kind: count
- macro: \PeakMemoryBandwidth
  latex: \text{BW}_{\text{peak}}
  definition: highest memory bandwidth the hardware specification states for a device
  kind: scalar
  unit: bytes/s
  notes: The bandwidth counterpart of \PeakRate. Decorated form of \Bandwidth.
- macro: \PeakRate
  latex: R_{\text{peak}}
  definition: highest operation rate the hardware can execute, as specified for a given precision
  kind: scalar
  unit: FLOP/s
  notes: Roofline presentations often write $P$ for performance; the series keeps $P$ for parameter count
    $\Parameters$.
- macro: \PerExampleForwardBackwardTime
  latex: T_{\text{forward+backward per example}}
  definition: amortized forward and backward pass time per training example at a given micro-batch size
  kind: scalar
  unit: s
- macro: \PipelineBufferMemory
  latex: M_{\text{required}}
  definition: total host memory the prefetch, processing and transfer buffers of an input pipeline require
  kind: scalar
  unit: bytes
- macro: \PipelineIterationTime
  latex: T_{\text{iteration}}
  definition: steady-state interval between batches an overlapped input pipeline delivers, the largest
    stage time
  kind: scalar
  unit: s
- macro: \PipelinedExecutionTime
  latex: T_{\text{pipelined}}
  definition: execution time of a workload whose data movement and computation overlap, set by the slower
    of the two plus fixed latency
  kind: scalar
  unit: s
  notes: The max-form iron law, $\PipelinedExecutionTime \ge \max(\IronLawMemoryTime, \IronLawComputeTime)
    + \Latency$. Its serialized counterpart is $\Time$, the sum of the terms.
- macro: \PlacementChoiceCount
  latex: n
  definition: number of placement choices a computational dimension has at each memory level in the toy
    mapping count
  kind: count
- macro: \PostprocessingLatency
  latex: L_{\text{lat,post}}
  definition: time spent turning a model's output into the response
  kind: scalar
  unit: s
  notes: One stage of $\EndToEndRequestLatency$.
- macro: \PrefetchBufferCount
  latex: N_{\text{prefetch}}
  definition: number of buffers holding batches loaded ahead of use
  kind: count
- macro: \PreprocessingLatency
  latex: L_{\text{lat,pre}}
  definition: time spent preparing a request's input before inference
  kind: scalar
  unit: s
  notes: One stage of $\EndToEndRequestLatency$.
- macro: \PreprocessingServiceTime
  latex: T_{\text{preprocessing}}
  definition: average time between batches the preprocessing workers deliver, across all workers
  kind: scalar
  unit: s
- macro: \PreprocessingThroughput
  latex: R_{\text{preprocessing}}
  definition: batches per second the host workers can transform into model-ready tensors
  kind: scalar
  unit: batches/s
- macro: \ProcessingBufferCount
  latex: N_{\text{processing}}
  definition: number of buffers holding batches under transformation
  kind: count
- macro: \ProductionExecutionCount
  latex: N_{\text{prod}}
  definition: number of production executions, such as inference requests or training steps, that reuse
    one compiled program
  kind: count
- macro: \QueryBlockCount
  latex: T_r
  definition: number of query tiles the sequence is split into in tiled attention
  kind: count
  notes: 'Not a time: equals the ceiling of sequence length over the query block size.'
- macro: \QueryBlockIndex
  latex: i
  definition: index of one query tile in tiled attention
  kind: index
  notes: Runs from 1 to the query block count.
- macro: \QueryBlockSize
  latex: B_r
  definition: number of query rows in one tile of tiled attention
  kind: count
  notes: 'Not batch size: the subscript r marks the row (query) blocking of FlashAttention.'
- macro: \QueueServerCount
  latex: c
  definition: number of identical servers in an M/M/c queue
  kind: count
  notes: Kendall's c, the third field of the A/S/c queue-model name, kept because the prose names the
    M/M/c model. Distinct from \WorkerCount, the size of a general worker pool.
- macro: \QueueWaitTime
  latex: W_{q}
  definition: mean time a request waits in a queue before its service begins, excluding service time
  kind: scalar
  unit: s
  notes: The classical queue-only wait. Time in system \RequestTimeInSystem adds the service time to it.
    Grows as utilization over one minus utilization in an M/M/1 queue.
- macro: \QueueingLatency
  latex: L_{\text{lat,queue}}
  definition: time a request waits in queues before it is served
  kind: scalar
  unit: s
  notes: One stage of $\EndToEndRequestLatency$.
- macro: \ReadByteAddress
  latex: X
  definition: memory address of a byte a program has just read, used to describe spatial locality
  kind: index
  notes: Names a location, not a byte count; distinct from \ScaledResource (X) and from \DataVolume.
- macro: \RecommenderItemCount
  latex: N_{\text{items}}
  definition: number of catalog items a static recommendation system precomputes predictions for
  kind: count
  notes: With \RecommenderUserCount it sets the size of the precomputed prediction table, which grows
    as their product.
- macro: \RecommenderUserCount
  latex: N_{\text{users}}
  definition: number of users whose predictions a static recommendation system precomputes
  kind: count
  notes: With \RecommenderItemCount it sets the size of the precomputed prediction table, which grows
    as their product.
- macro: \ReductionInputCount
  latex: n
  definition: number of values one reduction combines
  kind: count
  notes: A tree reduction takes $\mathcal{O}(\log n)$ stages, a serial one $\mathcal{O}(n)$.
- macro: \RemoteHardwareEfficiency
  latex: \eta_{\text{hw,remote}}
  definition: fraction of its peak compute rate the remote server sustains on an offloaded request
  kind: scalar
  unit: dimensionless
  notes: The remote instance of $\EfficiencyHw$.
- macro: \RemotePathTime
  latex: T_{\text{remote}}
  definition: 'complete time to serve one request remotely: transmission, network round trip and remote
    compute'
  kind: scalar
  unit: s
  notes: Remote execution is feasible only when it is within the deadline; compared with $\LocalPathTime$.
- macro: \RemotePeakRate
  latex: R_{\text{peak,remote}}
  definition: peak compute rate of the remote server that would execute an offloaded request
  kind: scalar
  unit: FLOP/s
  notes: The remote instance of $\PeakRate$.
- macro: \RepeatedRunMean
  latex: \mu_{\text{run}}
  definition: mean of a measured benchmark metric across repeated runs of the same configuration
  kind: scalar
  unit: varies
  notes: 'Not the service rate \mu of queueing. Unit: units of the measured metric.'
- macro: \RepeatedRunStandardDeviation
  latex: \sigma_{\text{run}}
  definition: standard deviation of a measured benchmark metric across repeated runs of the same configuration
  kind: scalar
  unit: varies
  notes: 'Divided by the run mean it gives the coefficient of variation used to flag unstable measurements.
    Unit: units of the measured metric.'
- macro: \RequestConcurrency
  latex: Q_{\text{req}}
  definition: average number of requests in flight inside a stable serving system
  kind: scalar
  unit: requests
  notes: Little's law gives $\RequestConcurrency = \ArrivalRate \cdot \RequestTimeInSystem$. Avoids bare
    $N$, which counts devices, elements or samples elsewhere.
- macro: \RequestResidenceTime
  latex: W
  definition: time one request spends inside a system from arrival to completion
  kind: scalar
  unit: s
  notes: Indexed W_i by request; its mean over requests is \RequestTimeInSystem.
- macro: \RequestResponseTime
  latex: t
  definition: time one request spends in a serving system, the random variable whose distribution gives
    tail latency
  kind: scalar
  unit: s
  notes: Its mean is \RequestTimeInSystem; its 99th percentile is \TailRequestLatency. Bare t is otherwise
    an index letter.
- macro: \RequestSeenBatchSize
  latex: B_{\text{req}}
  definition: size of the batch a given request lands in, counting itself and the other arrivals in its
    window
  kind: count
  notes: One plus a Poisson count with mean $\ArrivalRate T_{\text{window}}$; larger on average than the
    per-window batch size because requests land in busy windows more often.
- macro: \RequestTimeInSystem
  latex: T_{\text{lat}}
  definition: average time a request spends inside a serving system, waiting plus being served
  kind: scalar
  unit: s
  notes: The time term of Little's law. Distinct from the iron law's fixed overhead $\Latency$ and from
    end-to-end request latency $\EndToEndRequestLatency$.
  aliases:
  - \RequestTimeInSystemLat
- macro: \RequiredMemoryBandwidth
  latex: \text{BW}_{\text{req}}
  definition: memory bandwidth a workload needs to sustain a target operation rate at its arithmetic intensity
  kind: scalar
  unit: bytes/s
  notes: $\text{BW}_{\text{req}} = \TargetComputeRate/\ArithmeticIntensity$; the workload is memory bound
    when it exceeds $\Bandwidth$.
- macro: \RequiredServiceRate
  latex: \mu_{\text{required}}
  definition: service rate a server must sustain so peak arrivals keep utilization at the safe ceiling
  kind: scalar
  unit: requests/s
  notes: Peak arrival rate divided by the safe \ServingUtilization.
- macro: \ResponseTimeDistributionFunction
  latex: F
  definition: cumulative distribution function of the time a request spends in a serving system
  kind: function
  notes: Exponential in an M/M/1 queue, $F(t) = 1 - e^{-t/\RequestTimeInSystem}$; its 0.99 quantile is
    the p99 latency.
- macro: \RooflineRidgePoint
  latex: I_{\text{ridge}}
  definition: arithmetic intensity at which a device's memory-bandwidth limit meets its compute limit
  kind: scalar
  unit: FLOP/byte
  notes: $\RooflineRidgePoint = \PeakRate/\Bandwidth$, also called hardware balance. Prefer this explicit
    form over starred shorthand so the meaning stays clear in prose.
- macro: \SampleStorageSize
  latex: s_{\text{sample}}
  definition: bytes needed to store one training or serving sample
  kind: scalar
  unit: bytes/sample
- macro: \SecondAtomicGradientUpdate
  latex: B
  definition: second of three gradient updates that accelerator threads accumulate atomically into a shared
    tensor, whose accumulation order varies between runs
  kind: scalar
  unit: dimensionless
  notes: Concrete instance of the floating-point associativity example; the run-dependent grouping of
    these updates is the source of bitwise nondeterminism. Not the generic addends a, b, c and not matrix
    operands.
- macro: \SecondFloatingPointAddend
  latex: b
  definition: second of three floating-point numbers added in either grouping to show that floating-point
    addition is not associative
  kind: scalar
  unit: dimensionless
  notes: The three addends a, b, c appear together only in the associativity identity (a+b)+c vs a+(b+c);
    they are generic numbers, not any modeled quantity. Distinct from the bold GEMM matrix operands A,
    B, C.
- macro: \SequentialExecutionTime
  latex: T_{\text{sequential}}
  definition: execution time when data movement, computation and fixed overhead run one after another
    with no overlap, the sum of the iron-law terms
  kind: scalar
  unit: s
  notes: Equals the additive iron law $\DataVolume/\Bandwidth + \Operations/(\PeakRate \cdot \EfficiencyHw)
    + \Latency$, i.e. $\Time$; written with a subscript only when contrasted with $\PipelinedExecutionTime$.
- macro: \ServingUtilization
  latex: \rho_{\text{serv}}
  definition: fraction of time a server is busy, offered load divided by service capacity
  kind: scalar
  unit: dimensionless
  notes: $\ServingUtilization = \ArrivalRate/\mu$ for one server. Queueing delay grows without bound as
    it approaches 1. The subscript keeps bare $\rho$ free for other ratios.
- macro: \SessionRequestCount
  latex: N_{\text{session}}
  definition: number of independent requests a single user session issues, each of which may hit the latency
    tail
  kind: count
  notes: Probability that at least one request is slow grows as one minus the per-request fast probability
    raised to this count.
- macro: \SharedPrefixLength
  latex: S_{\text{prefix}}
  definition: number of tokens in a prompt prefix that several requests share
  kind: count
  notes: A part of \SequenceLength; prefix caching reuses its KV states.
- macro: \SharedPrefixRequestCount
  latex: n_{\text{req}}
  definition: number of requests that share an identical prompt prefix
  kind: count
  notes: Prefix caching avoids about $(n_{\text{req}}-1)$ prefix prefills.
- macro: \SinglePrecisionGemvIntensity
  latex: I_{\text{GEMV, 32-bit}}
  definition: arithmetic intensity of a batch-one matrix-vector multiply whose 32-bit weights stream from
    memory
  kind: scalar
  unit: FLOP/byte
  notes: A specific case of \ArithmeticIntensity.
- macro: \SparseMatrixRowCount
  latex: n_{\text{rows}}
  definition: number of rows of a sparse matrix, which sets the length of the CSR row-pointer array
  kind: count
  notes: Sparse storage formats; CSR keeps one more row pointer than rows.
- macro: \SquareGemmDimension
  latex: N
  definition: side length of the square matrices in a matrix multiply, the shared row, column and inner
    dimension
  kind: count
- macro: \SramCapacity
  latex: M_{\text{SRAM}}
  definition: capacity of the fast on-chip SRAM available to one kernel
  kind: scalar
  unit: words
  notes: Counted in words (tensor elements), not bytes, in the FlashAttention I/O analysis.
- macro: \StandbyPower
  latex: P_{\text{idle}}
  definition: power a device draws in standby, when it is not running inference
  kind: scalar
  unit: W
  notes: Dominates battery life at low duty cycle.
- macro: \StepIoTime
  latex: T_{\text{IO}}
  definition: time the input pipeline needs to read, decompress, decode and stage the data for one training
    step
  kind: scalar
  unit: s
  notes: 'Paired with $\IronLawComputeTime$ in the two-stage overlap model: step time lies between $\max(\IronLawComputeTime,
    T_{\text{IO}})$ and their sum. Not $\IronLawMemoryTime$, which is device memory traffic inside the
    iron law; this term includes storage reads and CPU-side decode.'
- macro: \StorageAccessFactor
  latex: F_{\text{access}}
  definition: fraction of peak storage throughput a workload's access pattern achieves
  kind: scalar
  unit: dimensionless
- macro: \StorageBandwidth
  latex: \text{BW}_{\text{storage}}
  definition: sustained rate at which the storage system delivers bytes to the input pipeline
  kind: scalar
  unit: bytes/s
  notes: A specialization of $\Bandwidth$ to the storage path; the data-fetch time of one batch is $\DataVolume/\Bandwidth_{\text{storage}}$.
- macro: \StorageCapacityPrice
  latex: C_{\text{storage/byte-time}}
  definition: provider price charged to retain one byte of telemetry for one unit of time
  kind: scalar
  unit: USD/(byte*s)
  aliases:
  - \StoragePricePerByteTime
- macro: \StoragePrice
  latex: c_{\text{storage}}
  definition: price of keeping one gigabyte in storage for one month
  kind: scalar
  unit: USD/GB/month
  notes: Object-storage pricing in the data cost model.
- macro: \StorageReadTime
  latex: T_{\text{read}}
  definition: time to read one batch's raw data from storage at the effective storage throughput
  kind: scalar
  unit: s
- macro: \StorageRetentionTime
  latex: T_{\text{months}}
  definition: length of time a dataset is kept in storage
  kind: scalar
  unit: months
  notes: Multiplies stored volume and monthly storage price.
- macro: \StorageThroughput
  latex: R_{\text{storage}}
  definition: rate at which storage can deliver training data, bounded by disk and network bandwidth
  kind: scalar
  unit: bytes/s
- macro: \StoredDataVolume
  latex: D_{\text{vol,store}}
  definition: bytes a retained dataset occupies in storage
  kind: scalar
  unit: bytes
  notes: Not $\DataVolume$, the bytes a workload moves.
- macro: \SupplyVoltage
  latex: V
  definition: supply voltage that powers a digital circuit, the quantity dynamic voltage and frequency
    scaling lowers
  kind: scalar
  unit: V
  notes: Dynamic power scales with $V^2$. Not the virtual pipeline stage count $\VirtualPipelineStagesPerDevice$.
- macro: \SustainedComputeRate
  latex: R_{\text{sustained}}
  definition: operation rate an accelerator or system actually sustains on a workload
  kind: scalar
  unit: FLOP/s
  notes: Divided by $\BatchOperations$ it gives batches per second.
- macro: \SwitchedCapacitance
  latex: C
  definition: capacitance of the wires and gates a circuit charges when it switches
  kind: scalar
  unit: F
- macro: \SwitchingActivityFactor
  latex: \alpha
  definition: average fraction of a chip's gate capacitance that switches each clock cycle
  kind: scalar
  unit: dimensionless
  notes: Not the significance level or the alpha-beta startup latency.
- macro: \SwitchingEnergy
  latex: E
  definition: dynamic energy a circuit dissipates charging and discharging its switched capacitance
  kind: scalar
  unit: J
  notes: Proportional to $\SwitchedCapacitance \cdot \SupplyVoltage^2$.
- macro: \SystemMemoryBandwidth
  latex: \text{BW}_{\text{system}}
  definition: sustained bandwidth of host system memory
  kind: scalar
  unit: bytes/s
- macro: \TailRequestLatency
  latex: T_{\text{lat},\text{p99}}
  definition: 99th-percentile time a request spends in a serving system
  kind: scalar
  unit: s
  notes: About 4.6 times the mean \RequestTimeInSystem in an M/M/1 queue. The same quantity as $t_{99}$
    in the derivation.
- macro: \TailRequestSeenBatchSize
  latex: B_{\text{req,p99}}
  definition: 99th percentile of the batch size a request lands in
  kind: count
  notes: Evaluated in \BatchServiceTimeFunction to bound tail service time.
- macro: \TargetCompletionQuantile
  latex: q
  definition: required probability that a request completes within its latency deadline, the completion
    quantile a service level states
  kind: scalar
  unit: dimensionless
  notes: Written $\Pr[\EndToEndRequestLatency \le \CompletionDeadline] \ge q$; typical values 0.95, 0.99,
    0.999.
- macro: \TargetComputeRate
  latex: R_{\text{ops}}
  definition: operation rate a workload is required to sustain, from which the memory bandwidth it needs
    follows
  kind: scalar
  unit: FLOP/s
  notes: Required bandwidth is $R_{\text{ops}}/\ArithmeticIntensity$. Not $\AttainableComputeRate$, which
    is what the hardware allows.
- macro: \TargetInferenceLatency
  latex: L_{\text{lat,target}}
  definition: inference latency a searched architecture is required to meet
  kind: scalar
  unit: s
- macro: \TelemetryRetentionDuration
  latex: T_{\text{retention}}
  definition: length of time stored telemetry samples are retained
  kind: scalar
  unit: s
- macro: \TelemetrySamplingFrequency
  latex: f_{\text{sample}}
  definition: number of samples recorded per second for one telemetry series
  kind: scalar
  unit: Hz
  notes: Not the controller sampling rate $f_s$ of the physical volumes.
- macro: \TelemetrySeriesCount
  latex: N_{\text{series}}
  definition: number of distinct telemetry time series after label expansion
  kind: count
  notes: Grows with metric label cardinality.
- macro: \TensorCoreAccumulatorMatrix
  latex: \mathbf{C}_{\text{acc}}
  definition: accumulator matrix added to the product in one Tensor Core matrix multiply-accumulate
  kind: matrix
- macro: \TensorCoreLeftInput
  latex: \mathbf{A}_{\text{tc}}
  definition: left input matrix of one Tensor Core matrix multiply-accumulate
  kind: matrix
- macro: \TensorCoreOutputMatrix
  latex: \mathbf{D}_{\text{tc}}
  definition: result matrix of one Tensor Core matrix multiply-accumulate
  kind: matrix
- macro: \TensorCoreRightInput
  latex: \mathbf{B}_{\text{tc}}
  definition: right input matrix of one Tensor Core matrix multiply-accumulate
  kind: matrix
- macro: \TensorElementCount
  latex: N
  definition: number of elements in one tensor
  kind: count
  notes: Times $\ElementStorageSize$ gives the tensor size in bytes. Not the device count of a collective.
- macro: \ThirdAtomicGradientUpdate
  latex: C
  definition: third of three gradient updates that accelerator threads accumulate atomically into a shared
    tensor, whose accumulation order varies between runs
  kind: scalar
  unit: dimensionless
  notes: Concrete instance of the floating-point associativity example; the run-dependent grouping of
    these updates is the source of bitwise nondeterminism. Not the generic addends a, b, c and not matrix
    operands.
- macro: \ThirdFloatingPointAddend
  latex: c
  definition: third of three floating-point numbers added in either grouping to show that floating-point
    addition is not associative
  kind: scalar
  unit: dimensionless
  notes: The three addends a, b, c appear together only in the associativity identity (a+b)+c vs a+(b+c);
    they are generic numbers, not any modeled quantity. Distinct from the bold GEMM matrix operands A,
    B, C.
- macro: \TileRowIndex
  latex: m
  definition: index of the tile row that an output block occupies in a tiled matrix multiply
  kind: index
- macro: \Time
  latex: T
  definition: total wall-clock time to complete a unit of work, from start to finish
  kind: scalar
  unit: s
  notes: In the iron law, $\Time = \DataVolume/\Bandwidth + \Operations/(\PeakRate \cdot \EfficiencyHw)
    + \Latency$.
- macro: \TimeInstant
  latex: t
  definition: a point in continuous wall-clock time, the variable over which time-varying quantities are
    integrated
  kind: scalar
  unit: s
  notes: Argument of time-varying quantities such as power, $P(t)$, and the variable of $\int \ldots\,dt$.
    Not the turn index $\TurnIndex$ or token index $\TokenIndex$, which share the glyph.
- macro: \TokenizationTime
  latex: T_{\text{tokenize}}
  definition: time one CPU core takes to tokenize one batch
  kind: scalar
  unit: s
- macro: \TotalChipPower
  latex: P_{\text{total}}
  definition: total power a chip dissipates, the sum of dynamic switching power and static leakage power
  kind: scalar
  unit: W
- macro: \TotalEnergy
  latex: E_{\text{total}}
  definition: total energy a workload consumes
  kind: scalar
  unit: J
  notes: Decomposes into movement and compute terms, $\TotalEnergy \approx \DataVolume \times \EnergyPerByteMoved
    + \Operations \times \EnergyPerOperation$, or is measured as average power times run time.
- macro: \TotalMemoryFootprint
  latex: M_{\text{total}}
  definition: total memory a workload occupies on a device
  kind: scalar
  unit: bytes
  notes: For training, $\TotalMemoryFootprint = \WeightMemory + \GradientMemory + \OptimizerStateMemory
    + \ActivationMemory$; for serving, weights plus KV cache plus activations. Avoids bare $M$.
- macro: \TrainingSampleThroughput
  latex: R_{\text{train}}
  definition: samples per second a training job actually processes
  kind: scalar
  unit: samples/s
  notes: Bounded by $\min(R_{\text{compute}}, R_{\text{data}})$.
- macro: \TrainingStepTime
  latex: T_{\text{step}}
  definition: wall-clock time of one training step, bounded below by the slower of compute and input I/O
  kind: scalar
  unit: s
  notes: Single-job step time without a device-count argument; $\DistributedStepTime$ is the same idea
    written $T_{\text{step}}(N)$ as a function of device count.
- macro: \TrainingThroughput
  latex: R_{\text{training}}
  definition: batches per second a training system completes, the slowest of preprocessing, transfer and
    compute
  kind: scalar
  unit: batches/s
- macro: \TrainingTime
  latex: T_{\text{train}}
  definition: wall-clock time to complete one training run
  kind: scalar
  unit: s
  notes: In the compute-dominated case $\TrainingTime \approx \Operations/(\AcceleratorCount \cdot \PeakRate
    \cdot \EfficiencyHw)$. Benchmarking defines it operationally as time to reach a target accuracy. One
    step on N devices is $\DistributedStepTime$.
- macro: \TransferBufferCount
  latex: N_{\text{transfer}}
  definition: number of buffers staging batches for transfer to the accelerator
  kind: count
- macro: \TransmissionEnergyPerByte
  latex: E_{\text{tx}}
  definition: energy a device spends transmitting one byte of data over a wireless link
  kind: scalar
  unit: J/byte
  notes: The chapter quotes it per megabyte; multiplied by data volume it gives $\CloudOffloadEnergy$.
- macro: \UnfusedDataVolume
  latex: D_{\text{vol,unfused}}
  definition: bytes an operation sequence moves when each operation reads and writes its intermediate
    in memory
  kind: scalar
  unit: bytes
  notes: Specialization of \DataVolume; $2\,\ChainedOperationCount \IntermediateTensorSize$.
- macro: \UnitAliasMultiplier
  latex: k
  definition: number of base units in one unit alias, the conversion multiplier of a unit-conventions
    table row
  kind: scalar
  unit: dimensionless
  notes: For KB, k = 10^3 bytes. Not an index letter here; it stands outside any subscript.
- macro: \VacuumLightSpeed
  latex: c
  definition: speed of light in vacuum, the upper limit on how fast an electrical signal crosses a chip
    or link
  kind: scalar
  unit: m/s
  notes: About $3 \times 10^8$ m/s; on-chip wires propagate signals at a fraction of it.
- macro: \WeightMemory
  latex: M_{\text{weights}}
  definition: memory holding a model's weights
  kind: scalar
  unit: bytes
  notes: Equals parameter count times bytes per parameter, $\Parameters \ElementStorageSize$. Small-batch
    decoding streams it once per step.
  aliases:
  - \WeightMemoryWeights
- macro: \WindowArrivalCount
  latex: k
  definition: number of requests that arrive during one batching window
  kind: count
  notes: Poisson with mean $\ArrivalRate T_{\text{window}}$ under Poisson arrivals, so it is the realized
    batch size of a fixed calendar window.
- macro: \WindowArrivalOffset
  latex: t
  definition: time at which a request arrives, measured from the start of its batching window
  kind: scalar
  unit: s
  notes: Uniform over the window under Poisson arrivals, so the mean wait is half the window.
- macro: \WorkerTransformTime
  latex: T_{\text{transform}}
  definition: time one preprocessing worker takes to transform one batch
  kind: scalar
  unit: s
