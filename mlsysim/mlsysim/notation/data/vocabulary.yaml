# Notation registry: the controlled vocabulary for units and quantity words.
# Read by mlsysim/mlsysim/notation/types.py (convention_problems). Guide: README.md,
# sections "Units" and "Quantity words".

# Every `unit:` in the registry is built from these units with *, / and ^n
# (parentheses allowed). Singular and plural spellings are the same unit:
# write the plural for an amount (`tokens`) and the singular after `/` (`USD/token`): `bytes/s`, `kg*m^2`, `USD/GB/month`, `V/(rad/s)`.
# Each unit maps to base dimensions. Data, compute, money and the countable
# things ML systems move (tokens, requests, samples, ...) are dimensions of
# their own, so bytes/s and Hz are never confused, nor USD/token and a
# probability. `dimensionless` stands alone. `varies` means the unit depends on
# what the symbol is applied to; the entry's notes must say how.
units:
  # time
  s: {time: 1}
  h: {time: 1}
  hour: {time: 1}
  hours: {time: 1}
  day: {time: 1}
  month: {time: 1}
  months: {time: 1}
  Hz: {time: -1}
  # space, mass, mechanics
  m: {length: 1}
  kg: {mass: 1}
  N: {mass: 1, length: 1, time: -2}
  J: {mass: 1, length: 2, time: -2}
  W: {mass: 1, length: 2, time: -3}
  rad: {angle: 1}
  deg: {angle: 1}
  # electrical and thermal
  A: {current: 1}
  V: {mass: 1, length: 2, time: -3, current: -1}
  Ohm: {mass: 1, length: 2, time: -3, current: -2}
  F: {mass: -1, length: -2, time: 4, current: 2}
  H: {mass: 1, length: 2, time: -2, current: -2}
  K: {temperature: 1}
  degC: {temperature: 1}
  # information and compute
  bit: {information: 1}
  bits: {information: 1}
  byte: {information: 1}
  bytes: {information: 1}
  GB: {information: 1}
  FLOP: {compute: 1}
  # money
  USD: {currency: 1}
  # countable things (each its own dimension)
  token: {token: 1}
  tokens: {token: 1}
  words: {token: 1}
  pixel: {pixel: 1}
  pixels: {pixel: 1}
  parameters: {parameter: 1}
  element: {element: 1}
  elements: {element: 1}
  request: {request: 1}
  requests: {request: 1}
  query: {request: 1}
  queries: {request: 1}
  sample: {sample: 1}
  samples: {sample: 1}
  batch: {batch: 1}
  batches: {batch: 1}
  item: {item: 1}
  items: {item: 1}
  task: {task: 1}
  tasks: {task: 1}
  trajectories: {trajectory: 1}
  arrivals: {event: 1}
  failures: {event: 1}
  operation: {operation: 1}
  operations: {operation: 1}
  # information-theoretic and ratio units
  nats: {}
  ppm: {}

# Quantity words. When a macro name ends in one of these words (the longest
# match wins: `TimeConstant` before `Constant`), the entry must have one of the
# listed kinds and, when `dimension` is given, a unit with that dimension.
# `dimension` uses the base dimensions above; `any` in an exponent slot is not
# allowed, so a word either pins its dimension or leaves it free.
# `per_time_or_share: true`: a Rate is either something per unit of time
# (`requests/s`) or a dimensionless share per trial, as statistics uses the word
# (error rate, false acceptance rate). Any other unit is an error.
words:
  Time:        {kinds: [scalar, function], dimension: {time: 1}}
  Latency:     {kinds: [scalar], dimension: {time: 1}}
  Interval:    {kinds: [scalar, count], dimension: {time: 1}}
  Delay:       {kinds: [scalar], dimension: {time: 1}}
  Period:      {kinds: [scalar, count], dimension: {time: 1}}
  Duration:    {kinds: [scalar], dimension: {time: 1}}
  Timeout:     {kinds: [scalar], dimension: {time: 1}}
  Deadline:    {kinds: [scalar], dimension: {time: 1}}
  TimeConstant: {kinds: [scalar], dimension: {time: 1}}
  Rate:        {kinds: [scalar, function, vector], per_time_or_share: true}
  Probability: {kinds: [scalar, function], dimension: {}}
  Fraction:    {kinds: [scalar, function], dimension: {}}
  Count:       {kinds: [count]}
  Index:       {kinds: [index]}
  Memory:      {kinds: [scalar], dimension: {information: 1}}
  Bandwidth:   {kinds: [scalar], dimension: {information: 1, time: -1}}
  Energy:      {kinds: [scalar, function], dimension: {mass: 1, length: 2, time: -2}}
  Power:       {kinds: [scalar, function], dimension: {mass: 1, length: 2, time: -3}}
  Cost:        {kinds: [scalar, function], currency: true}
  Price:       {kinds: [scalar], currency: true}
  Matrix:      {kinds: [matrix]}
  Vector:      {kinds: [vector]}
  Set:         {kinds: [set]}
  Function:    {kinds: [function]}
  Distribution: {kinds: [distribution, function]}

# Name endings that contain a quantity word but are the field's established
# term for something else. A name ending in one of these is exempt from the word
# rule. Each needs a reason; the list is reviewed, not grown casually.
idioms:
  LearningRate: the optimizer step size; machine learning calls it a rate though it is a dimensionless factor
  DecayRate: a dimensionless per-step decay factor (Adam's beta, exponential moving averages)
  GrowthRate: DenseNet's growth rate, a count of feature maps each layer adds

# Pairs that may render alike in one section: a quantity and its special case,
# which a reader never mistakes for two things. Each needs a reason.
same_glyph_ok:
  - macros: [\GemmColumnDimension, \SquareGemmDimension]
    reason: a square GEMM sets every dimension to N; the general column dimension is the same N
  - macros: [\ResponseActionTokens, \TrajectoryAction]
    reason: the action and the tokens that spell it are the same object at one step
  - macros: [\DecisionProcessState, \TrajectoryState]
    reason: the same per-step state of a decision process, registered twice (to merge)
  - macros: [\RolloutEnvironmentState, \TrajectoryState]
    reason: the same per-step environment state of a rollout, registered twice (to merge)
