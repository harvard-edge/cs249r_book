# Notation registry: learning
# Machine learning: data, models, training, loss, and degradation of deployed models.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AccuracyAtTime
  latex: \text{Accuracy}(t)
  definition: Accuracy at Time $t$
  kind: scalar
  unit: Scalar
  notes: Model accuracy after the model has been deployed for time $t$.
- macro: \AttentionHeadDimension
  latex: d_{\text{head}}
  definition: Attention Head Dimension
  kind: scalar
  unit: Integer. Per-head hidden dimension in attention layers.
- macro: \ConditionalDistribution
  latex: p(y \mid x)
  definition: Conditional Distribution
  kind: distribution
  unit: Conditional probability/density. Use this form for generic label relationships; reserve $P_0$
    and $P_t$ for the training/current distributions of drift analysis.
- macro: \CurrentDistribution
  latex: P_t
  definition: Current Distribution
  kind: distribution
  unit: Distribution
  notes: The data distribution at time $t$. *(Not parameters—use $P$ for parameter count.)*
- macro: \DistillationTemperature
  latex: T_{\text{distill}}
  definition: Distillation Temperature
  kind: scalar
  unit: Dimensionless. Softmax temperature in knowledge distillation; the one use of the $T$ root that
    is not a time.
- macro: \Distribution
  latex: p(x)
  definition: Distribution
  kind: distribution
  unit: Probability mass/density for a random variable. Use lowercase $p(\cdot)$ for generic distributions
    to avoid collision with $P$ (parameter count).
- macro: \EventProbability
  latex: \Pr(E)
  definition: Event Probability
  kind: scalar
  unit: Probability of an event $E$. Use for event statements such as $\Pr(\text{batch}=0)$; use $p(x)$
    and $p(y \mid x)$ for distributions.
- macro: \FittedSensitivity
  latex: \lambda
  definition: Fitted Sensitivity
  kind: scalar
  unit: Scalar
  notes: Local coefficient estimated from outcomes over a stated range; not a universal constant. *(Not
    wavelength.)*
- macro: \HiddenDimension
  latex: d
  definition: Hidden Dimension
  kind: scalar
  unit: Integer
  notes: Model (embedding) width of a transformer layer, $d = N_{\text{heads}} \cdot d_{\text{head}}$
    for standard multi-head attention.
- macro: \InitialAccuracy
  latex: \text{Accuracy}_0
  definition: Initial Accuracy
  kind: scalar
  unit: Scalar
  notes: Model accuracy at deployment time.
- macro: \LayerIndex
  latex: \ell
  definition: Layer Index
  kind: scalar
  unit: Integer. Index for a layer. Use instead of bare $L$ when indexing layers, since $L$ collides with
    loss and latency. A numeric subscript marks a norm instead ($\ell_1$, $\ell_2$).
- macro: \LayerOutputWidth
  latex: d_{\text{out}}
  definition: Layer Output Width
  kind: scalar
  unit: Integer
  notes: Number of output features in a layer.
  aliases:
  - \LayerInputAndOutputWidthsTwo
- macro: \LossFunction
  latex: \mathcal{L}
  definition: Loss Function
  kind: function
  unit: Scalar. The objective function minimized during training.
- macro: \NumberOfAttentionHeads
  latex: N_{\text{heads}}
  definition: Number of Attention Heads
  kind: count
  unit: Integer. Number of attention heads in a multi-head attention layer.
- macro: \NumberOfKeyValueHeads
  latex: H_{\text{KV}}
  definition: Number of Key-Value Heads
  kind: count
  unit: Integer. Number of key-value heads in grouped-query or multi-query attention.
  aliases:
  - \NumberOfKeyvalueHeadsKv
- macro: \NumberOfLayers
  latex: N_L
  definition: Number of Layers
  kind: count
  unit: Integer. Total number of layers in a network.
- macro: \PredictedOutput
  latex: \hat{\mathbf{y}}
  definition: Predicted Output
  kind: scalar
  unit: Vector. A model's output for one example, such as class probabilities; $\mathbf{y}$ is the label
    vector.
- macro: \StatisticalDivergence
  latex: \mathcal{D}(P_t \| P_0)
  definition: Statistical Divergence
  kind: set
  unit: Scalar $\ge 0$
  notes: 'Measures how far $P_t$ has drifted from $P_0$. Common choices: KL divergence, total variation,
    Wasserstein. *(Calligraphic to avoid collision with $D$ = dataset size.)*'
- macro: \TrainingDistribution
  latex: P_0
  definition: Training Distribution
  kind: distribution
  unit: Distribution
  notes: The data distribution at training time.
  aliases:
  - \TrainingDistributionZero
