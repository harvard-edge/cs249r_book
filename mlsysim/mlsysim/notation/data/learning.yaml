  definition: multidimensional weight tensor that a tensor decomposition approximates
  kind: matrix
  notes: Three modes here, sized m by n by p.
  render_exception: Tensor-decomposition literature writes higher-order tensors as calligraphic capitals.
- macro: \DecomposedTensorEntry
  latex: y_{ijt}
  definition: one entry of a decomposed three-mode tensor, at row i, column j and depth t
  kind: scalar
  unit: dimensionless
  notes: Entry of \DecomposedTensor.
- macro: \DemographicParityTolerance
  latex: \epsilon_{\text{par}}
  definition: largest allowed difference in positive prediction rates between protected groups under a
