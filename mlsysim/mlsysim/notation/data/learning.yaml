- macro: \DepthModeComponentVector
  latex: \mathbf{c}_s
  definition: column of the depth-mode factor matrix for one rank-one component of a CP decomposition
  kind: vector
- macro: \DepthModeFactorMatrix
  latex: \mathbf{C}
  definition: factor matrix for the depth mode of a tensor decomposition, one row per depth index and
    one column per rank component
  kind: matrix
- macro: \DepthModeFactorSlice
  latex: \mathbf{c}
  definition: row of the depth-mode factor matrix for one depth index, holding its weight on every rank
    component
  kind: vector
  notes: Indexed $\mathbf{x}_t$. Not the layer input \LayerInputVector.
- macro: \DepthScalingRatio
  latex: \alpha
  definition: ratio by which compound scaling multiplies network depth for each unit of the scaling coefficient
  kind: scalar
  unit: dimensionless
  notes: EfficientNet compound scaling; set empirically.
- macro: \DerivativeOperator
  latex: d
  definition: differential operator d of an ordinary derivative, written over the differential in a Leibniz
    quotient
  kind: operator
  notes: Prefer writing the derivative so d sits before a variable, where it is exempt.
- macro: \DictionaryCoefficientMatrix
  latex: \mathbf{C}
  definition: block-sparse coefficient matrix recording which dictionary patterns are active in each stored
    example
  kind: matrix
- macro: \DifferentialEntropy
  latex: h
  definition: differential entropy of a continuous random variable, the negative expected log density
  kind: function
  unit: nats
  notes: Unlike discrete entropy it depends on units and can be negative.
- macro: \DirectionalDerivativeStep
  latex: \epsilon
  definition: scalar step along a direction at which a directional derivative is taken in the limit of
    zero
  kind: scalar
  unit: s
  notes: Here the direction is the drift field, a state rate, so the step has units of time.
- macro: \DisadvantagedGroupClassificationThreshold
  latex: \gamma_{\text{cls},g=\text{B}}
  definition: classification threshold applied only to the disadvantaged group in a group-specific thresholding
    intervention
  kind: scalar
  unit: dimensionless
  notes: Lowering it closes a true positive rate gap at the cost of more false positives.
- macro: \DiscountedReturn
  latex: G
  definition: discounted sum of the rewards an episode collects from a given step onward, the return of
    reinforcement learning
  kind: scalar
  unit: dimensionless
  notes: Indexed by the step it starts from, $G_t = \sum_k \gamma^k r_{t+k}$; \ExpectedReturnObjective
    is its expectation from the initial step.
- macro: \DiscreteOutcome
  latex: x
  definition: one outcome of a discrete random variable, the value at which a probability distribution
    is evaluated or summed
  kind: record
  notes: Summation variable in KL divergence and entropy; distinct from \SoftmaxInputScore.
- macro: \DiscreteRandomVariable
  latex: X
  definition: discrete random variable, the uncertain quantity whose outcomes a distribution describes
  kind: record
  notes: Uppercase for the variable, lowercase \DiscreteOutcome for one of its outcomes.
- macro: \DistanceNormOrder
  latex: p
  definition: order of the vector norm in which query-candidate distances are measured
  kind: scalar
  unit: dimensionless
  notes: Written as the norm subscript $\|\cdot\|_p$. Not a probability.
- macro: \DistillationClassProbability
  latex: p^{(T_{\text{distill}})}
  definition: probability that the softmax at the distillation temperature assigns to one class
  kind: scalar
  unit: dimensionless
  notes: Indexed by class, $p_i^{(\DistillationTemperature)}$. The temperature superscript is part of
    the glyph, so this is the written form of \SoftenedClassProbability in the distillation softmax; at
    $\DistillationTemperature = 1$ it is the ordinary softmax probability.
- macro: \DistillationLoss
  latex: \mathcal{L}_{\text{distill}}
  definition: knowledge-distillation training objective, a weighted sum of hard-label cross-entropy and
    the temperature-scaled divergence from the teacher
  kind: function
  notes: $(1-\DistillationLossWeight)\CrossEntropyLoss + \DistillationLossWeight \DistillationTemperature^2
    \KlDivergence$.
- macro: \DistillationLossWeight
  latex: \gamma_{\text{KD}}
  definition: weight in [0, 1] given to the soft-target distillation term, with the rest on the hard-label
    term
  kind: scalar
  unit: dimensionless
- macro: \DistillationTemperature
  latex: T_{\text{distill}}
  definition: softmax temperature that softens teacher and student output probabilities in knowledge distillation
  kind: scalar
  unit: dimensionless
  notes: Values above 1 soften the distribution; 1 recovers the ordinary softmax. The one use of the $T$
    root that is not a time.
- macro: \DivergenceMeasure
  latex: \mathcal{D}
  definition: divergence function that measures how far one probability distribution lies from another,
    with the specific measure left open
  kind: function
  notes: Written with its two arguments, $\DivergenceMeasure(p \lVert q)$. Its value on the current and
    training distributions is $\StatisticalDivergence$. Named measures carry a subscript ($\mathcal{D}_{\text{KL}}$,
    $\mathcal{D}_{\text{KS}}$, $\mathcal{D}_{\text{JS}}$) and are separate entries.
- macro: \DriftTestSampleSize
  latex: n
  definition: number of observations in one of the two samples a two-sample drift test compares
  kind: count
  notes: Index 0 marks the training-baseline sample and $t$ the serving sample at time $t$, matching $\TrainingDistribution$
    and $\CurrentDistribution$.
- macro: \DropoutProbability
  latex: p_{\text{drop}}
  definition: probability that a dropout layer zeroes each element during training
  kind: scalar
  unit: dimensionless
- macro: \DualNumberInfinitesimal
  latex: \epsilon
  definition: nonzero infinitesimal unit of dual numbers, whose square is zero
  kind: scalar
  unit: dimensionless
  notes: Not a small numerical-stability constant or a tolerance.
- macro: \EffectiveSampleSize
  latex: N_{\text{eff}}
  definition: number of independent observations that carry the same information about a mean as a serially
    correlated stream
  kind: count
- macro: \ElapsedPlanningPeriods
  latex: n
  definition: number of planning periods elapsed since the data-debt backlog was measured
  kind: count
  notes: Exponent of the compounding model; as the subscript of $\text{Debt}_n$ it is an exempt index.
- macro: \ElementaryOperationCount
  latex: W
  definition: number of elementary operations a computational graph needs to evaluate a function once,
    its forward work
  kind: count
  notes: Written W(f) to name the function it counts.
- macro: \EmpiricalBellmanOperator
  latex: \mathcal{B}
  definition: empirical Bellman backup operator that maps an action-value estimate to its one-step target,
    reward plus discounted next value
  kind: operator
  notes: Starred, $\mathcal{B}^*$, for the optimality backup that maximizes over next actions.
- macro: \EmpiricalTimestepAverage
  latex: \hat{\mathbb{E}}
  definition: empirical average over the sampled timesteps of a batch of rollouts, the sample estimate
    of an expectation
  kind: operator
- macro: \EncodedLatentState
  latex: \hat{\mathbf{z}}
  definition: latent state estimate a learned neural encoder produces from sensor observations
  kind: vector
  notes: Not the CVAE latent style variable \LatentStyleVariable.
- macro: \EncoderLatentRepresentation
  latex: \mathbf{z}
  definition: intermediate representation a shared encoder computes from an input, consumed by the heads
    that sit on top of it
  kind: vector
  notes: Not logits, nor $\LatentStyleVariable$ of a conditional VAE.
- macro: \EngineeringTeamSize
  latex: n
  definition: number of engineers on a team sharing one ML workflow or platform
  kind: count
  notes: Appears only as the argument of the assumed manual-workflow and shared-platform throughput curves;
    not a message size or trial count.
- macro: \EntityEmbedding
  latex: \mathbf{e}
  definition: embedding row of one entity, such as a user or item, in a recommendation embedding table
  kind: vector
  notes: Written $\EntityEmbedding_j$ for entity $j$.
- macro: \EntityIndex
  latex: j
  definition: index of one entity, a row of an embedding table
  kind: index
- macro: \EntropyTemperature
  latex: \alpha
  definition: weight on the policy entropy in the maximum-entropy objective, trading reward maximization
    against exploration
  kind: scalar
  unit: dimensionless
  notes: Reward per nat of entropy; tuned automatically by dual gradient descent in SAC.
- macro: \EnvironmentResponseFunction
  latex: g
  definition: response of the environment to a deployed model, mapping the current data distribution and
    the model's decisions to the next data distribution
  kind: function
  notes: The performative feedback map of the sociotechnical feedback invariant. Not a loss gradient,
    a subgroup label or gravity, which share the glyph.
- macro: \EnvironmentRolloutStepCount
  latex: h
  definition: number of steps each parallel environment contributes to one on-policy rollout
  kind: count
  notes: Not \ObjectHandle, which also renders h.
- macro: \EpochCount
  latex: N_{\text{epochs}}
  definition: number of full passes a training run makes over its dataset
  kind: count
  notes: Training work scales with it times dataset size.
- macro: \EpochIndex
  latex: n_{\text{epoch}}
  definition: position of the current epoch in a training run, counted from one
  kind: index
  notes: Drives the linear curriculum pacing fraction $n_{\text{epoch}}/N_{\text{warmup}}$.
- macro: \ErroneousPredictionCost
  latex: C_{\text{error}}
  definition: average business cost incurred by one erroneous prediction
  kind: scalar
  unit: USD
  notes: Multiplies the skew rate and query volume in the training-serving skew cost.
- macro: \EstimatedAccuracy
  latex: \hat{p}
  definition: accuracy of a model estimated from a finite evaluation set, the fraction of evaluated examples
    it gets right
  kind: scalar
  unit: dimensionless
  notes: A numeric subscript identifies the model being compared. The hat marks a sample estimate of the
    population accuracy.
- macro: \EulerIntegralFirstShape
  latex: a
  definition: first shape argument of the regularized incomplete beta function
  kind: scalar
  unit: dimensionless
  notes: Set to the failure count k in the binomial-tail identity.
- macro: \EulerIntegralSecondShape
  latex: b
  definition: second shape argument of the regularized incomplete beta function
  kind: scalar
  unit: dimensionless
  notes: Set to n - k + 1 in the binomial-tail identity.
- macro: \EulerIntegralVariable
  latex: t
  definition: integration variable of the incomplete beta integral, a probability level between zero and
    the upper limit
  kind: scalar
  unit: dimensionless
- macro: \EvaluationSampleCount
  latex: N
  definition: number of examples in the evaluation set over which an accuracy or calibration metric is
    computed
  kind: count
  notes: Sets the sampling error of an accuracy estimate. Not the training-set size \DatasetSize.
- macro: \EventIndicator
  latex: \mathbf{1}
  definition: indicator of an event, one when the braced condition holds and zero otherwise
  kind: function
  notes: Written $\EventIndicator\{\cdot\}$. Same meaning as \IndicatorFunction ($\mathbb{I}$), kept for
    the bold-one rendering vol3 uses. Not the all-ones vector.
- macro: \EvidenceLowerBound
  latex: \mathcal{L}_{\text{ELBO}}
  definition: evidence lower bound, the expected reconstruction log-likelihood minus the KL divergence
    of the latent posterior from the prior, which lower-bounds the log-marginal likelihood
  kind: function
  notes: Function of decoder parameters \ModelParameters and encoder parameters \CvaeEncoderParameters;
    \ActVariationalObjective is its weighted negative.
- macro: \ExampleAveragedBatchLoss
  latex: \mathcal{L}_{\text{example}}
  definition: batch loss that gives every example equal weight, the unweighted mean of per-example masked
    token losses
  kind: function
  unit: nats
  notes: $\frac{1}{\BatchSize}\sum_j \LossFunction_j$. Contrast \TokenAveragedBatchLoss.
- macro: \ExampleIndex
  latex: i
  definition: index of an example within a batch
  kind: index
  notes: Written bare only when the text names the index.
- macro: \ExampleLabel
  latex: y
  definition: the label paired with one input, treated as a random variable
  kind: record
  notes: A bold $\mathbf{y}$ is the label written as a vector.
- macro: \ExecutionNondeterminism
  latex: \xi
  definition: run-to-run execution nondeterminism of a training job, such as random seeds, data ordering
    and the order of floating-point accumulation
  kind: record
  notes: The non-versioned last argument of the reproducibility function.
- macro: \ExogenousDataDistribution
  latex: \mathcal{D}
  definition: exogenous stationary distribution from which a passive learner's samples are drawn independently
  kind: distribution
- macro: \ExpectedCategoryFrequency
  latex: n_i^{\text{exp}}
  definition: number of observations one category of a categorical feature is expected to hold under the
    baseline distribution, in a chi-square goodness-of-fit test
  kind: scalar
  unit: dimensionless
  notes: Not necessarily an integer (sample size times a baseline probability), hence scalar. The category
    index $i$ is part of the glyph. Pairs with $\ObservedCategoryCount$.
- macro: \ExpectedCostLimit
  latex: \delta
  definition: upper bound a constrained reinforcement learning objective places on expected constraint
    cost
  kind: scalar
  unit: varies
  notes: Constrains only the mean cost, not its tail.
- macro: \ExperienceReplayBuffer
  latex: \mathcal{D}
  definition: buffer of past transitions, each a state, action, reward and next state, from which an off-policy
    learner samples minibatches
  kind: set
  notes: Not \ReplayBuffer (continual-learning replay, calligraphic M).
- macro: \ExperimentUserIndex
  latex: i
  definition: index of one user, the experimental unit of an online experiment
  kind: index
- macro: \ExpertCapacityFactor
  latex: C_{\text{cap}}
  definition: multiplier on an expert's uniform share of token assignments that sets how many assignments
    it may accept per step
  kind: scalar
  unit: dimensionless
  notes: Per-expert capacity is about $C_{\text{cap}} \cdot \RoutedExpertCount \cdot \text{tokens}/\ExpertCount$;
    1.0 is the uniform share. Excess assignments are dropped through the residual or need extra buffer.
- macro: \ExpertCount
  latex: N_{\text{experts}}
  definition: number of expert subnetworks in one mixture-of-experts layer
  kind: count
- macro: \ExpertIndex
  latex: e
  definition: index of one expert in a mixture-of-experts layer
  kind: index
  notes: Subscripts per-expert quantities such as \ExpertTokenCount.
- macro: \ExpertSelectionProbability
  latex: p_e
  definition: probability that a given token is routed to one particular expert
  kind: scalar
  unit: dimensionless
  notes: Marginal over tokens; distinct from \RouterGateProbability, the gate weight for one token.
- macro: \ExpertTokenCount
  latex: B_e
  definition: number of token assignments a router sends to one expert in one layer
  kind: count
  notes: Random under data-dependent routing; sets the buffer an expert needs.
- macro: \ExponentialSeriesArgument
  latex: u
  definition: argument of a power-series expansion of the exponential function
  kind: scalar
  unit: dimensionless
  notes: Local to a Taylor step; distinct from \DiscreteOutcome, which shares the glyph.
- macro: \ExtractionAnomalyClassifier
  latex: f_{\theta}
  definition: trained classifier that maps an account's query features (volume, distribution, timing regularity)
    to an extraction anomaly score
  kind: function
  notes: The subscript names its learned parameters. Not $\ModelPredictor$, the model being protected.
- macro: \FactoredIntermediateActivation
  latex: \mathbf{z}
  definition: intermediate activation vector produced by the first factor of a low-rank layer and consumed
    by the second
  kind: vector
  notes: $\FactoredIntermediateActivation = \LowRankRightFactor^T \LayerInputVector$, length \FactorizationRank.
- macro: \FactorizationRank
  latex: k
  definition: number of rank-one components a low-rank matrix or tensor factorization keeps
  kind: count
  notes: Truncated SVD keeps the k largest singular values; storage falls from mn to k(m+n).
- macro: \FairnessGapTolerance
  latex: \epsilon_{\text{fair}}
  definition: largest allowed gap between protected groups in the fairness metric a release gate or monitor
    enforces
  kind: scalar
  unit: dimensionless
  notes: Applies to whichever criterion is chosen (demographic parity, equalized odds). Not the privacy
    budget \PrivacyBudget; \DemographicParityTolerance is the parity-only case.
- macro: \FakeQuantizedOutput
  latex: x_{\text{fake}}
  definition: value after quantizing and immediately dequantizing, which stays in floating point but carries
    the rounding error
  kind: scalar
  unit: varies
  notes: 'Used in quantization-aware training; the straight-through estimator passes its gradient through
    unchanged inside the clipping range. Unit: units of the quantized tensor.'
- macro: \FalseDiscoveryRateTarget
  latex: q
  definition: level at which the Benjamini-Hochberg procedure bounds the expected false-discovery proportion
  kind: scalar
  unit: dimensionless
  notes: Not \TargetCompletionQuantile, which shares the glyph.
- macro: \FarthestCandidateDistance
  latex: D_{\max}
  definition: distance from a query vector to the farthest stored candidate vector, as a function of collection
    size and dimension
  kind: function
  notes: Written $D_{\max}(N, D)$ or bare. Relative contrast is $(D_{\max}-D_{\min})/D_{\min}$.
- macro: \FeatureCategoryCount
  latex: k
  definition: number of categories a categorical feature takes, the number of terms of a chi-square goodness-of-fit
    statistic
  kind: count
  notes: The statistic has $k - 1$ degrees of freedom when baseline probabilities are fixed. Not $\ClassCount$.
- macro: \FeatureCategoryIndex
  latex: i
  definition: position of one category among the categories of a categorical feature
  kind: index
  notes: Runs from 1 to $\FeatureCategoryCount$. Not $\LabelCategoryIndex$, which indexes a classifier's
    output classes.
- macro: \FeatureCount
  latex: N_{\text{features}}
  definition: number of features a feature store maintains for each entity
  kind: count
  notes: Not \AttributionFeatureCount.
- macro: \FeatureFreshnessLatency
  latex: T_{\text{freshness}}
  definition: delay from a source event to the moment a feature value reflecting it is available for serving
  kind: scalar
  unit: s
  notes: Availability time minus event time. Not the refresh age (time since last update), which is \FeatureUpdateLag.
- macro: \FeatureMapColumnCoordinate
  latex: x
  definition: column coordinate of a position in a feature map, as a loop nest or parallel schedule traverses
    it
  kind: index
  notes: Pairs with $y$ (FeatureMapRowCoordinate).
- macro: \FeatureMapGrowthRate
  latex: g
  definition: number of new feature maps each DenseNet layer adds to the concatenated input of later layers
  kind: count
- macro: \FeatureMapHeight
  latex: H_{\text{img}}
  definition: height, in pixels, of the image or feature map a convolution layer reads
  kind: count
  notes: With $W_{\text{img}}$ it gives the spatial size; output size after the convolution is $H_{\text{out}}
    \times W_{\text{out}}$.
- macro: \FeatureMapRowCoordinate
  latex: y
  definition: row coordinate of a position in a feature map, as a loop nest or parallel schedule traverses
    it
  kind: index
  notes: Not a label or output; pairs with $x$ (FeatureMapColumnCoordinate).
- macro: \FeatureMapWidth
  latex: W_{\text{img}}
  definition: width, in pixels, of the image or feature map a convolution layer reads
  kind: count
  notes: 'Not a weight: weights are $\mathbf{W}$.'
- macro: \FeatureRecordTime
  latex: t
  definition: time at which a feature record became available, which a point-in-time join requires to
    be no later than the observation timestamp
  kind: scalar
  unit: s
  notes: Data engineering writes the same quantity as $t_{\text{feat}}$ (the feature update timestamp).
- macro: \FeatureUpdateInterval
  latex: T_{\text{update}}
  definition: interval between successive updates of one feature value in a feature store
  kind: scalar
  unit: s
- macro: \FeatureUpdateLag
  latex: T_{\text{staleness}}
  definition: time since a served feature value was last materialized, the behavior it omits
  kind: scalar
  unit: s
  notes: The refresh age; equals the current time minus \FeatureUpdateTimestamp. Not \FeatureFreshnessLatency.
- macro: \FeatureUpdateTimestamp
  latex: t_{\text{feat}}
  definition: time at which a feature record was last updated
  kind: scalar
  unit: s
- macro: \FeedForwardWidth
  latex: d_{\text{ff}}
  definition: width of the hidden layer inside a transformer block's feed-forward network
  kind: count
  notes: Typically about $4\HiddenDimension$; a block holds $\mathcal{O}(\HiddenDimension^2 + \HiddenDimension
    d_{\text{ff}})$ weights.
- macro: \FeedbackIntervalCount
  latex: k
  definition: number of fixed feedback intervals, such as retraining cycles, elapsed since the disparity
    was first measured
  kind: count
  notes: The argument of $\GroupDisparity$ and the exponent of $\BiasFeedbackFactor$.
- macro: \FeedbackStepIndex
  latex: t
  definition: position of one deployment period in the feedback loop between a model's decisions and the
    data it later sees
  kind: index
  notes: Exempt inside a subscript ($p_t$, $f_t$); this entry covers the standalone use "at time $t$".
- macro: \FewShotStepCount
  latex: n_{\text{steps}}
  definition: number of gradient steps a few-shot adaptation policy permits
  kind: count
- macro: \FewShotSupportSet
  latex: \mathcal{D}_{\text{shot}}
  definition: local support set of labeled examples a few-shot adaptation trains on
  kind: set
- macro: \FilterWeight
  latex: w
  definition: one weight of a convolution filter, as listed in a small worked example
  kind: scalar
  unit: dimensionless
  notes: Written $w_1, \ldots, w_4$ for a $2 \times 2$ filter.
- macro: \FinalGeneratorLatentVector
  latex: \mathbf{z}_{m}
  definition: latent vector of the last of the m synthetic records a generator produces
  kind: vector
  notes: The subscript m counts the synthetic records.
- macro: \FinalLayerFunction
  latex: f_{N_L}
  definition: function the last layer of a deep network computes
  kind: function
  notes: The subscript is the layer count $\LayerCount$; the LaTeX matches what $f_{\NumberOfLayers}$
    renders today.
- macro: \FinalLayerWidth
  latex: n_{N_L}
  definition: number of units in a network's last layer
  kind: count
  notes: The output width of the network.
- macro: \FinalMiniBatchActivation
  latex: a_{B}
  definition: activation of the last example in a mini-batch of batch size B
  kind: scalar
  unit: dimensionless
  notes: The subscript is the batch size $\BatchSize$; the LaTeX matches what $x_\BatchSize$ renders today.
- macro: \FinalRecurrentHiddenState
  latex: \mathbf{h}_{S}
  definition: hidden state a recurrent network holds after the last step of a sequence
  kind: vector
  notes: The subscript is the sequence length $\SequenceLength$; the LaTeX matches what the chapter renders
    today.
- macro: \FiniteChange
  latex: \Delta
  definition: finite change in the quantity it prefixes, between two states, configurations or points
    in time
  kind: operator
  notes: Prefix operator, as in the return-on-compute ratio of accuracy change to compute-cost change.
    Differs from $\Delta$ fused into named entries such as $\JouleanTemperatureRise$.
- macro: \FirstClassCoverageFloor
  latex: a
  definition: minimum number of examples of the first class, A, that a coreset must retain
  kind: count
  notes: A coverage floor; the allocation is infeasible if $\CoresetBudget$ is below the sum of floors.
- macro: \FirstComparedGroupLabel
  latex: a
  definition: first of two group labels compared in a group-fairness condition, one value of the protected
    group attribute
  kind: record
  notes: A value of $\ProtectedGroupMembership$; its partner is $\SecondComparedGroupLabel$. Not an activation,
    an inner-product component or a rollout action, which share the glyph.
- macro: \FirstComparedItem
  latex: i
  definition: first of two items in a paired comparison, the one whose preference probability is stated
  kind: index
  notes: 'Bradley-Terry: the probability that item $i$ beats item $j$ is a logistic function of their
    latent score difference. Pairs with \SecondComparedItem.'
- macro: \FirstDiscardedSingularNumber
  latex: \sigma_{r+1}
  definition: largest singular value a rank-r truncation discards, which equals the spectral-norm reconstruction
    error
  kind: scalar
  unit: dimensionless
  notes: Bounds each unscaled query-key dot-product error by $\|\mathbf{q}\|_2\sigma_{r+1}$. Index $r+1$
    baked into the LaTeX because $r$ is \TruncationRank.
- macro: \FirstGroupClassificationThreshold
  latex: \tau_{\text{thr},a}
  definition: score threshold applied to the first compared group in a group-specific thresholding policy
  kind: scalar
  unit: dimensionless
  notes: Partner of $\SecondGroupClassificationThreshold$; the single shared threshold is $\ClassificationThreshold$.
    In the units of the score it thresholds.
- macro: \FirstGroupQualifiedFraction
  latex: q_a
  definition: fraction of the first compared group's applicants who are qualified, that group's base rate
    of the positive outcome
  kind: scalar
  unit: dimensionless
  notes: Partner of $\SecondGroupQualifiedFraction$; the overall admission rate under equal opportunity
    is $r q_a$.
- macro: \FirstGroupSampleApprovalRate
  latex: \hat{p}_a
  definition: observed share of the first compared group's sampled applicants who are approved
  kind: scalar
  unit: dimensionless
  notes: Estimated from $\FirstGroupSampleSize$ decisions; partner of $\SecondGroupSampleApprovalRate$.
- macro: \FirstGroupSampleSize
  latex: n_a
  definition: number of sampled decisions from the first compared group in a two-proportion test
  kind: count
  notes: Partner of $\SecondGroupSampleSize$. Not $\SubgroupSampleSize$, which sizes an error-rate estimate.
- macro: \FirstGroupThresholdClassifier
  latex: h_a
  definition: decision rule applied to the first compared group, one when the score reaches that group's
    classification threshold
  kind: function
  notes: Group-specific form of $\BinaryClassifier$, $h_a(x) = \mathbb{1}[s(x) \geq \tau_{\text{thr},a}]$;
    the partner rule for group b is described in prose only.
- macro: \FirstInputNodePrimal
  latex: v_{1-N}
  definition: value of the first input node of a computational graph, holding the first input
  kind: scalar
  unit: dimensionless
- macro: \FirstJaccardSet
  latex: \mathcal{A}
  definition: first of two sets compared by Jaccard similarity, such as one document's shingles
  kind: set
  notes: Paired with $\SecondJaccardSet$.
- macro: \FirstSummandStandardDeviation
  latex: \sigma_a
  definition: standard deviation of the first of two independent zero-mean Gaussian variables in the variance-addition
    identity
  kind: scalar
  unit: dimensionless
  notes: 'Variances of independent Gaussians add: $\sigma_a^2 + \sigma_b^2$.'
- macro: \FirstTwinCriticReturnEstimate
  latex: Q_{\phi_1}
  definition: action-value estimate of the first of the two independently parameterized critics in clipped
    double Q-learning
  kind: function
  unit: dimensionless
  notes: Pairs with \SecondTwinCriticReturnEstimate.
- macro: \FittedSensitivity
  latex: \lambda
  definition: accuracy lost per unit of distribution divergence, fitted from labeled outcomes over a stated
    range
  kind: scalar
  unit: dimensionless
  notes: Slope of the degradation equation; a local empirical coefficient, not a universal constant. Not
    wavelength, and not the arrival rate $\ArrivalRate$.
- macro: \FlattenedFilterWeights
  latex: \mathbf{w}_{\text{col}}
  definition: column vector of a filter's weights, flattened so im2col can apply the filter as a matrix
    product
  kind: vector
- macro: \ForgetDataset
  latex: D_{\text{forget}}
  definition: training records whose influence machine unlearning must remove, the forget set
  kind: record
  notes: Retraining on the training data without it is the exact-removal reference. Italic $D$ with a
    label, not calligraphic, so it is a record rather than a set.
- macro: \FrobeniusNorm
  latex: F
  definition: label marking a matrix norm as the Frobenius norm, the square root of the sum of squared
    entries
  kind: operator
  notes: Written as the subscript of a norm, $\|\cdot\|_F$. Not \AcceptingStateSet.
- macro: \FrozenBackboneFunction
  latex: f
  definition: function the frozen pretrained layers compute, to which a residual adapter's output is added
  kind: function
- macro: \FrozenFeatureEncoder
  latex: f
  definition: fixed pretrained feature encoder that maps an input to the embedding stored for replay
  kind: function
- macro: \FrozenWeightMatrix
  latex: \mathbf{W}_{\text{frozen}}
  definition: pretrained weight matrix held fixed while a low-rank update is trained
  kind: matrix
  notes: Same role as the frozen base $\WeightMatrix_0$ in the LoRA figure; see questions.
- macro: \FullBatchLoss
  latex: \mathcal{L}_B
  definition: training loss averaged over all examples of one effective batch
  kind: function
- macro: \FullDatasetSize
  latex: D_{\text{total}}
  definition: number of samples in the full dataset before any selection removes some
  kind: count
  notes: Contrasted with $\SubsetDatasetSize$ in the selection inequality and the data compression ratio.
- macro: \FullPrecisionWeight
  latex: w
  definition: one model weight at full precision, before quantization maps it to an integer code
  kind: scalar
  unit: dimensionless
  notes: Indexed $w_i$ within a quantization group; its reconstruction is \ReconstructedWeight. A weight-specific
    case of \QuantizerInput, kept as w because the chapter writes the weight, its code and its reconstruction
    as w, q and \hat{w}.
- macro: \FunctionInputAdjoint
  latex: \bar{x}
  definition: reverse-mode adjoint of an input variable, the derivative of the output with respect to
    it
  kind: scalar
  unit: dimensionless
- macro: \FunctionInputDimension
  latex: N
  definition: number of inputs of a differentiated function, the column count of its Jacobian
  kind: count
- macro: \FunctionInputElement
  latex: x
  definition: one element of the input vector of a layer or elementwise function
  kind: scalar
  unit: dimensionless
- macro: \FunctionInputTangent
  latex: \dot{x}
  definition: forward-mode tangent of an input variable, the seed of the forward sweep
  kind: scalar
  unit: dimensionless
- macro: \FunctionInputVariable
  latex: x
  definition: scalar input variable of an illustrative function being traced or differentiated
  kind: scalar
  unit: dimensionless
  notes: Indexed $x_j$ when a program has several inputs.
- macro: \FunctionInputVector
  latex: \mathbf{x}
  definition: vector a layer or differentiated function takes as input
  kind: vector
- macro: \FunctionJacobian
  latex: \mathbf{J}
  definition: matrix of partial derivatives of a function's outputs with respect to its inputs
  kind: matrix
  notes: Not the robot manipulator Jacobian $\ManipulatorJacobian$.
- macro: \FunctionOutputDimension
  latex: M
  definition: number of outputs of a differentiated function, the row count of its Jacobian
  kind: count
- macro: \FunctionOutputElement
  latex: y
  definition: one element of the output vector of a layer or differentiated function
  kind: scalar
  unit: dimensionless
  notes: Always indexed, $y_j$.
- macro: \FunctionOutputVariable
  latex: z
  definition: scalar output of an illustrative function or computational graph
  kind: scalar
  unit: dimensionless
- macro: \FunctionOutputVector
  latex: \mathbf{y}
  definition: vector a layer or differentiated function produces as output
  kind: vector
- macro: \FunctionSecondInputVariable
  latex: y
  definition: second scalar input of an illustrative two-input function
  kind: scalar
  unit: dimensionless
- macro: \FusedConvolutionBias
  latex: \mathbf{b}_{\text{fused}}
  definition: per-channel bias vector of a convolution after the following batch normalization is folded
    into it
  kind: vector
  notes: The prime marks the folded bias, not a derivative. Pairs with \FoldedConvolutionWeight; the unfolded
    bias is \BiasVector.
- macro: \FusedConvolutionWeight
  latex: \mathbf{W}_{\text{fused}}
  definition: convolution weight tensor after the following batch normalization is folded into it
  kind: matrix
- macro: \GaussianCovarianceMatrix
  latex: \boldsymbol{\Sigma}
  definition: covariance matrix of a multivariate Gaussian distribution
  kind: matrix
  unit: varies
  notes: Entries carry the products of the random vector component units.
- macro: \GaussianDistribution
  latex: \mathcal{N}
  definition: Gaussian (normal) distribution with the mean and covariance given as its arguments
  kind: distribution
  notes: Written $\mathcal{N}(\mu, \Sigma)$.
- macro: \GaussianMeanVector
  latex: \boldsymbol{\mu}
  definition: mean vector of a multivariate Gaussian distribution
  kind: vector
  notes: Pairs with \GaussianCovarianceMatrix as the arguments of \GaussianDistribution.
- macro: \GaussianMechanismNoiseVector
  latex: \mathbf{z}
  definition: Gaussian noise vector a Gaussian mechanism adds to a vector-valued query output
  kind: vector
  notes: Drawn from $\GaussianDistribution(\ZeroVector, \sigma^2 \IdentityMatrix)$. Not $\LogitVector$
    or the generator latent vector, which also render bold z.
- macro: \GaussianMechanismStandardDeviation
  latex: \sigma_{\text{mech}}
  definition: standard deviation of the Gaussian noise a Gaussian mechanism adds to a query output, in
    the query's units
  kind: scalar
  unit: varies
  notes: 'Calibrated to the l2 sensitivity: $\sigma_{\text{mech}} \geq \Delta_2 f \sqrt{2\ln(1.25/\delta)}/\epsilon$.
    Distinct from $\PrivacyNoiseMultiplier$, the dimensionless ratio of this deviation to the clipping
    norm in DP-SGD; they coincide numerically only at unit sensitivity.'
- macro: \GaussianStandardDeviation
  latex: \sigma
  definition: standard deviation of a Gaussian distribution, or of each coordinate of an isotropic one
  kind: scalar
  unit: varies
  notes: Carries the unit of the Gaussian variable; a k-sigma bound is k times it.
- macro: \GeneratedResponse
  latex: y
  definition: response a language model generates for a prompt, as scored by a reward model
  kind: record
  notes: Text, not a number. Paired with the prompt $\ModelInput$ in $\RewardModel(x, y)$. Not a label
    $\ExampleLabel$, which shares the glyph.
- macro: \GenerativeActionModelDistribution
  latex: p_\theta
  definition: probability distribution that a learned generative action model with parameters theta defines
    over action chunks and its latent or noisy intermediates
  kind: distribution
  notes: ACT writes the decoder likelihood and its joint with the latent this way; a diffusion policy
    writes its learned reverse transition this way. Not \PolicyTrajectoryDistribution, the trajectory
    distribution a policy induces.
- macro: \GeneratorLatentVector
  latex: \mathbf{z}
  definition: latent vector sampled from standard Gaussian noise and mapped by a generator to one synthetic
    record
  kind: vector
  notes: Not $\LogitVector$ or a noise vector added to an output.
- macro: \GenericRandomVariable
  latex: X
  definition: arbitrary real-valued random variable in a general probability inequality
  kind: record
  notes: Pairs with \PairedRandomVariable. Not \DiscreteRandomVariable, which is discrete.
- macro: \GlobalBatchSize
  latex: B_{\text{global}}
  definition: number of examples one synchronous optimizer update averages over across all data-parallel
    workers
  kind: count
  notes: Equals $\DeviceCount \times \LocalBatchSize$, times the accumulation steps when gradients are
    accumulated (line 2868).
- macro: \GlobalDeviationPenalty
  latex: \mathcal{R}
  definition: penalty function measuring how far a personalized client model deviates from the global
    model
  kind: function
- macro: \GlobalModelParameters
  latex: \theta_{\text{global}}
  definition: parameters of the aggregated global model in federated learning, the reference personalized
    clients stay near
  kind: vector
  notes: 'render_exception: Machine learning writes the parameter vector as a plain theta, never bold
    (as \ModelParameters).'
  render_exception: Machine learning writes the parameter vector as a plain theta, never bold.
- macro: \GradientClippingNorm
  latex: C
  definition: largest L2 norm a per-example gradient may keep after clipping in differentially private
    training
  kind: scalar
  unit: varies
  notes: 'Sets the sensitivity of the clipped gradient sum; DP-SGD noise has standard deviation $\PrivacyNoiseMultiplier
    \cdot C$. Unit: loss per parameter unit.'
- macro: \GradientCovarianceMatrix
  latex: \Sigma
  definition: covariance matrix of per-example gradients about the true gradient, whose trace is the total
    gradient variance
  kind: matrix
  notes: 'Its trace over the squared gradient norm estimates \CriticalBatchSize (gradient noise scale).
    render_exception: statistics writes a covariance matrix as non-bold capital Sigma.'
  render_exception: Statistics writes a covariance matrix as a plain capital Sigma.
- macro: \GraphEdgeSet
  latex: E
  definition: set of edges, the data dependencies between nodes, of a computational graph
  kind: set
  notes: 'render_exception: graph-theory convention writes the edge set as italic E.'
  render_exception: Graph theory writes the node and edge sets of G = (V, E) as plain italic capitals.
- macro: \GraphNodeIndex
  latex: i
  definition: index of any node of a computational graph in topological order
  kind: index
- macro: \GraphNodeSet
  latex: V
  definition: set of nodes (variables) of a computational graph
  kind: set
  notes: 'render_exception: graph-theory convention writes the vertex set as italic V.'
  render_exception: Graph theory writes the node and edge sets of G = (V, E) as plain italic capitals.
- macro: \GroupDisparity
  latex: \Delta_g
  definition: nonnegative magnitude of the performance disparity between one group and a specified reference
    group
  kind: scalar
  unit: dimensionless
  notes: Written $\Delta_g(k)$ after $k$ feedback intervals; evolves as $\Delta_g(0)\,\BiasFeedbackFactor^{k}$
    in the bias feedback model. Carries the units of the disparity metric (dimensionless for rate gaps).
- macro: \HadamardRotationMatrix
  latex: \mathbf{H}
  definition: orthogonal Hadamard matrix that rotates activations and weights to spread outliers before
    quantization
  kind: matrix
  notes: Applied implicitly by a fast transform rather than stored. Not $\MeasurementMatrix$ or $\HiddenActivationMatrix$.
- macro: \HeadAxisLabel
  latex: h
  definition: einsum index label naming the attention-head axis of an attention tensor
  kind: index
- macro: \HeadComponentIndex
  latex: m
  definition: position of one component within a query or key vector of one attention head
  kind: index
  notes: Runs from 1 to $\AttentionHeadDimension$.
- macro: \HeadDimensionAxisLabel
  latex: d
  definition: einsum index label naming the per-head feature axis of an attention tensor
  kind: index
- macro: \HeadKeyProjectionMatrix
  latex: \mathbf{W}_{K,i}
  definition: learned key projection matrix of one attention head
  kind: matrix
  notes: The index $i$ names the head.
- macro: \HeadQueryProjectionMatrix
  latex: \mathbf{W}_{Q,i}
  definition: learned query projection matrix of one attention head
  kind: matrix
  notes: The index $i$ names the head.
- macro: \HeadValuesProjectionMatrix
  latex: \mathbf{W}_{V,i}
  definition: learned value projection matrix of one attention head
  kind: matrix
  notes: The index $i$ names the head.
- macro: \HiddenActivation
  latex: \mathbf{h}
  definition: activation vector a hidden layer outputs and passes to the next layer
  kind: vector
  notes: Indexed by layer as $\mathbf{h}^{(\LayerIndex)}$, with $\mathbf{h}^{(0)}$ the network input.
    A recurrent network's state is $\mathbf{h}_t$, a separate entry.
- macro: \HiddenActivationMatrix
  latex: \mathbf{H}
  definition: matrix of hidden-layer activations after the nonlinearity, one row per example in the batch
  kind: matrix
  notes: Not the Hessian (09_data_selection uses bold H for the Hessian).
- macro: \HiddenDimension
  latex: d
  definition: width of a model's hidden representation, the transformer model width or a recurrent network's
    hidden-state size
  kind: count
  notes: In standard multi-head attention $\HiddenDimension = \AttentionHeadCount \cdot \AttentionHeadDimension$.
- macro: \HiddenUnitOutput
  latex: h
  definition: output of one hidden unit of a small network
  kind: scalar
  unit: dimensionless
  notes: Not \BarrierFunction or \CoordinationOverhead, which share the glyph.
- macro: \HuberLossThreshold
  latex: \delta
  definition: residual magnitude at which the Huber penalty switches from quadratic to linear growth
  kind: scalar
  unit: dimensionless
  notes: Subscript of the Huber penalty $\ell_\delta$; in normalized action coordinates here. Not \PenetrationDepth.
- macro: \HumanStandaloneSensitivity
  latex: S_{\text{human}}
  definition: fraction of actual positives, such as tumors, that human readers detect without AI assistance
  kind: scalar
  unit: dimensionless
  notes: Compared with $\AiStandaloneSensitivity$ in the automation-bias example.
- macro: \IdempotentAlgebraElement
  latex: x
  definition: element of a linear associative algebra that remains unchanged when raised to any positive
    integer power, Peirce's idempotent
  kind: scalar
  unit: dimensionless
  notes: 'Etymology of idempotence: $\IdempotentAlgebraElement^{\PositiveIntegerExponent} = \IdempotentAlgebraElement$.
    An abstract algebra element, not a measured quantity.'
- macro: \IdentityMatrix
  latex: \mathbf{I}
  definition: square matrix with ones on the diagonal and zeros elsewhere
  kind: matrix
  notes: Size follows from context.
- macro: \IllustrativeFunction
  latex: f
  definition: function used as a worked example of graph tracing or differentiation
  kind: function
- macro: \ImageChannelIndex
  latex: c
  definition: channel coordinate of an element in an image tensor
  kind: index
  notes: Not $\VacuumLightSpeed$.
- macro: \ImageColumnIndex
  latex: w
  definition: column (width) coordinate of an element in an image tensor
  kind: index
- macro: \ImageHeight
  latex: H
  definition: number of pixel rows in an image or its segmentation mask
  kind: count
  notes: Not a horizon ($\TurnHorizon$, $\ActionChunkHorizon$), which share the glyph.
- macro: \ImageRowIndex
  latex: h
  definition: row (height) coordinate of an element in an image tensor
  kind: index
- macro: \ImageTensorElement
  latex: X
  definition: value of an image tensor at a given height, width and channel coordinate
  kind: function
  notes: Written $X(h,w,c)$ independent of the memory layout (channels-last or channels-first).
- macro: \ImageWidth
  latex: W
  definition: number of pixel columns in an image or its segmentation mask
  kind: count
- macro: \ImplicitPolicyEnergyFunction
  latex: E_\theta
  definition: learned scalar energy that implicit behavioral cloning assigns to an observation-action
    pair, low for demonstrated actions and high for counterfactual ones
  kind: function
  notes: Inference returns the action that minimizes it; trained with contrastive or InfoNCE objectives.
    Not a physical energy.
- macro: \IndicatorFunction
  latex: \mathbb{I}
  definition: function equal to one when its condition holds and zero otherwise
  kind: function
- macro: \InequalityConstraintFunction
  latex: g
  definition: constraint function of an optimization problem, whose nonpositive values define the feasible
    set
  kind: function
  unit: varies
  notes: In the interior-point barrier $-\log(-g(x))$.
- macro: \InfluenceFunction
  latex: I
  definition: influence function, the approximate change in a test example's loss when a training example's
    weight in the training loss is increased infinitesimally
  kind: function
  notes: $-\nabla_\theta \mathcal{L}(z_{\text{test}}, \hat\theta)^T \mathbf{H}^{-1} \nabla_\theta \mathcal{L}(z,
    \hat\theta)$; removing one of $\DatasetSize$ examples scales it by $-1/\DatasetSize$. Not arithmetic
    intensity $I$.
- macro: \InitialAccuracy
  latex: \text{Accuracy}_0
  definition: model accuracy at deployment, or right after the most recent retraining
  kind: scalar
  unit: dimensionless
  notes: Intercept of the degradation equation; $\AccuracyAtTime$ starts here and falls as $\StatisticalDivergence$
    grows.
- macro: \InnerLayerFunction
  latex: g
  definition: inner function of a composition, the layer applied before the outer one
  kind: function
- macro: \InnerProductLeftComponent
  latex: a
  definition: one component of the first vector in a dot product
  kind: scalar
  unit: dimensionless
- macro: \InnerProductLeftVector
  latex: \mathbf{a}
  definition: first of two vectors whose dot product measures their similarity
  kind: vector
- macro: \InnerProductRightComponent
  latex: v
  definition: one component of the second vector in a dot product
  kind: scalar
  unit: dimensionless
- macro: \InnerProductRightVector
  latex: \mathbf{b}
  definition: second of two vectors whose dot product measures their similarity
  kind: vector
- macro: \InputChannelCount
  latex: C_{\text{in}}
  definition: number of channels in the feature map a convolution layer reads
  kind: count
  notes: Pairs with $C_{\text{out}}$. A $K \times K$ convolution holds $K^2 C_{\text{in}} C_{\text{out}}$
    weights. Dense-layer widths are $\LayerInputWidth$ and $\LayerOutputWidth$.
- macro: \InputChannelIndex
  latex: c
  definition: position of one input channel of a convolution layer
  kind: index
  notes: Runs from 1 to $C_{\text{in}}$.
- macro: \InputCoordinateCount
  latex: d
  definition: number of coordinates of an input vector, such as the pixels of an image
  kind: count
  notes: An $\ell_\infty$ budget $\epsilon$ allows Euclidean length up to $\epsilon\sqrt{d}$. Not the
    hidden dimension $d$ of the vol2 notation table.
- macro: \InputDistribution
  latex: p(x)
  definition: probability distribution of a model's inputs, whose change is data drift
  kind: distribution
  notes: Lowercase $p(\cdot)$ keeps distributions apart from parameter count $\Parameters$. Covariate
    shift changes this while $\ConditionalDistribution$ stays fixed.
  render_exception: The input distribution p(x) is one named quantity of the drift taxonomy (data drift
    and covariate shift change it), defined by its argument rather than evaluated at others.
  aliases:
  - \Distribution
- macro: \InputFeatureIndex
  latex: i
  definition: index of an input feature of a neuron or layer
  kind: index
  notes: Written bare only when the text names the index.
- macro: \InputFeatureVector
  latex: \mathbf{x}
  definition: input feature vector of one example, written as a row vector
  kind: vector
  notes: 'Row-vector convention: a layer computes \InputFeatureVector\WeightMatrix. A batch stacks these
    rows into \LayerInputMatrix. Not \MechanicalPlantState, which shares the glyph.'
- macro: \InputNodePrimal
  latex: v_{i-N}
  definition: value of the input node of a computational graph that holds input i
  kind: scalar
  unit: dimensionless
- macro: \InputQuantizationScale
  latex: s_X
  definition: quantization scale of a layer's input activation tensor
  kind: scalar
  unit: varies
  notes: 'Unit: units of the activations per integer step.'
- macro: \InputResolution
  latex: r
  definition: input image resolution of a convolutional model
  kind: count
  notes: Subscript 0 marks the base model in compound scaling.
- macro: \InputVariableIndex
  latex: m
  definition: index of one input variable of a scalar graph function
  kind: index
- macro: \IntegerWeightCode
  latex: q
  definition: integer code symmetric group quantization stores for one weight, its rounded and clamped
    ratio to the group scale
  kind: scalar
  unit: dimensionless
  notes: Range $[-2^{b-1}, 2^{b-1}-1]$ for bit width \QuantizationBitWidth. Weight-specific case of \QuantizedIntegerCode
    (x_q), kept as q to match the chapter.
- macro: \IntegrationPoint
  latex: \mathbf{y}
  definition: point of a Euclidean space that a volume or Gaussian integral ranges over
  kind: vector
  notes: Integrated with $d\mathbf{y}$; coordinates \IntegrationPointCoordinate. Not \InputFeatureVector.
- macro: \IntegrationPointCoordinate
  latex: y
  definition: one coordinate of a point that a separable Euclidean integral ranges over
  kind: scalar
  unit: dimensionless
  notes: Indexed $y_i$, the $i$-th coordinate of \IntegrationPoint.
- macro: \IntraClusterCorrelation
  latex: \rho_{\text{ICC}}
  definition: correlation of outcomes between users in the same randomization cluster
  kind: scalar
  unit: dimensionless
  notes: Not \CorrelationCoefficient between two quantities.
- macro: \JaccardSimilarity
  latex: J
  definition: Jaccard similarity of two sets, the size of their intersection divided by the size of their
    union
  kind: scalar
  unit: dimensionless
  notes: Written with its sets as arguments, $\JaccardSimilarity(X_1,X_2)$, or as a value. Equals the
    probability that one random-permutation MinHash component matches; the estimate from $n$ components
    has variance $J(1-J)/n$.
- macro: \JensenShannonDivergence
  latex: \mathcal{D}_{\text{JS}}
  definition: Jensen-Shannon divergence between two probability distributions, a symmetric bounded measure
    of how far they differ
  kind: function
  notes: Written $\mathcal{D}_{\text{JS}}(P \lVert Q)$; one concrete choice for $\StatisticalDivergence$.
- macro: \JensenShannonMixtureDistribution
  latex: \bar{P}
  definition: equal-weight average of the current and training distributions, the reference against which
    Jensen-Shannon divergence measures each
  kind: distribution
- macro: \KernelColumnOffset
  latex: n
  definition: column offset of one position inside a convolution kernel window
  kind: index
  notes: Runs over the $K$ kernel columns; pairs with $m$ (KernelRowOffset).
- macro: \KernelHeight
  latex: K_h
  definition: height of a convolution kernel, in input positions
  kind: count
  notes: Pairs with \KernelWidth.
- macro: \KernelHorizontalLoopOffset
  latex: k_{x}
  definition: horizontal kernel offset a direct-convolution loop nest iterates over
  kind: index
  notes: Pairs with $k_y$.
- macro: \KernelRowOffset
  latex: m
  definition: row offset of one position inside a convolution kernel window
  kind: index
  notes: Runs over the $K$ kernel rows; pairs with $n$ (KernelColumnOffset).
- macro: \KernelSize
  latex: K
  definition: side length, in input positions, of a square convolution kernel
  kind: count
  notes: A $K \times K$ kernel covers $K^2$ positions per input channel; receptive-field side grows by
    $K-1$ per stride-1 layer. Not a class count, coreset size or GEMM inner dimension.
- macro: \KernelVerticalLoopOffset
  latex: k_{y}
  definition: vertical kernel offset a direct-convolution loop nest iterates over
  kind: index
  notes: Pairs with $k_x$.
- macro: \KernelWeight
  latex: W
  definition: one convolution kernel weight, connecting one input channel at one kernel offset to one
    output channel
  kind: scalar
  unit: dimensionless
  notes: Written $W^{(\ell)}_{m,n,c,k}$; an entry of the kernel tensor $\mathbf{W}$.
- macro: \KernelWidth
  latex: K_w
  definition: width of a convolution kernel, in input positions
  kind: count
  notes: Pairs with \KernelHeight.
- macro: \KeyAxisLabel
  latex: j
  definition: einsum index label naming the key-position axis of an attention tensor
  kind: index
- macro: \KeyBufferPosition
  latex: j
  definition: position of the key token within a packed attention buffer
  kind: index
  notes: Pairs with \QueryBufferPosition $i$; causality requires $j\le i$. Not the einsum label \KeyAxisLabel.
- macro: \KeyComponent
  latex: k_{jm}
  definition: one component of one token's key vector
  kind: scalar
  unit: dimensionless
  notes: The subscripts are the token $j$ and the head-dimension position $m$.
- macro: \KeyLeftSingularMatrix
  latex: \mathbf{U}
  definition: orthonormal matrix whose columns are the left singular vectors of a key activation matrix
  kind: matrix
  notes: Factor of $\mathbf{K}^{(\ell)} = \mathbf{U} \mathbf{\Sigma} \mathbf{V}^T$. The weight-matrix
    counterpart is \LeftSingularVectorMatrix ($\mathbf{P}$).
- macro: \KeyLeftSingularVector
  latex: \mathbf{u}
  definition: one left singular vector of a key activation matrix, a column of its left singular matrix
  kind: vector
  notes: Indexed $\mathbf{u}_i$, paired with \KeySingularNumber and \KeyRightSingularVector.
- macro: \KeyProjectionMatrix
  latex: \mathbf{W}_{K}
  definition: learned matrix that projects token representations into keys
  kind: matrix
- macro: \KeyRightSingularMatrix
  latex: \mathbf{V}
  definition: orthonormal matrix whose columns are the right singular vectors of a key activation matrix
  kind: matrix
  notes: Factor of $\mathbf{K}^{(\ell)} = \mathbf{U} \mathbf{\Sigma} \mathbf{V}^T$. The weight-matrix
    counterpart is \RightSingularVectorMatrix ($\mathbf{Q}$).
- macro: \KeyRightSingularVector
  latex: \mathbf{v}
  definition: one right singular vector of a key activation matrix, a column of its right singular matrix
  kind: vector
  notes: Indexed $\mathbf{v}_i$. Not \CompressedGradientUpdate.
- macro: \KeySingularNumber
  latex: \sigma
  definition: one singular value of a key activation matrix, indexed in decreasing order
  kind: scalar
  unit: dimensionless
  notes: Indexed $\sigma_i$ from $\sigma_1$; the energy fraction and reconstruction error sum its squares.
    Not \ServiceTimeStandardDeviation or \PrivacyNoiseMultiplier.
- macro: \KeySingularSpectrumMatrix
  latex: \mathbf{\Sigma}
  definition: rectangular diagonal matrix holding the singular values of a key activation matrix in decreasing
    order
  kind: matrix
  notes: Diagonal entries \KeySingularNumber. The weight-matrix counterpart is \SingularSpectrumMatrix,
    which renders the same glyph.
- macro: \KeySourceMatrix
  latex: \mathbf{X}_{K}
  definition: representations attention draws its keys from, before a head-specific key projection
  kind: matrix
  notes: Equals $\mathbf{X}$ in self-attention.
- macro: \KeySpectrumLength
  latex: q
  definition: number of singular values of a key activation matrix, the smaller of its sequence length
    and head dimension
  kind: count
  notes: $q=\min(S,\AttentionHeadDimension)$; at $r=q$ the reconstruction error is zero. Not \TargetCompletionQuantile.
- macro: \KeyVector
  latex: \mathbf{k}
  definition: key vector of one token, one row of the key matrix
  kind: vector
  notes: Indexed by token, $\mathbf{k}_j$.
- macro: \KlDivergence
  latex: \mathcal{D}_{\text{KL}}
  definition: Kullback-Leibler divergence, the expected extra code length from encoding one distribution
    with a code built for another
  kind: function
  notes: 'Asymmetric: $\KlDivergence(p \lVert q) \ne \KlDivergence(q \lVert p)$. Distillation uses teacher-to-student.'
- macro: \KlPenaltyCoefficient
  latex: \beta_{\text{KL}}
  definition: weight on the Kullback-Leibler divergence from the reference model that RLHF subtracts from
    the reward
  kind: scalar
  unit: dimensionless
  notes: Penalized reward $r - \beta_{\text{KL}}\,\text{KL}$ discourages drift from the reference policy.
    Not \LinkBandwidth ($\beta$).
- macro: \KlSampleStatistic
  latex: d
  definition: nonnegative per-token statistic, the reference-to-current probability ratio minus its log
    minus one, whose expectation under the current distribution is the KL divergence
  kind: function
  unit: dimensionless
  notes: Not the divergence itself; its expectation recovers it only for tokens sampled from the current
    distribution.
- macro: \KolmogorovSmirnovCriticalThreshold
  latex: c_{\text{crit}}
  definition: critical threshold that the two-sample Kolmogorov-Smirnov statistic must exceed to reject
    equal distributions at a given significance level
  kind: scalar
  unit: dimensionless
  notes: Large-sample form $c_{\text{crit}} \approx 1.36\sqrt{(n_0+n_t)/(n_0 n_t)}$ at significance level
    0.05.
- macro: \KolmogorovSmirnovStatistic
  latex: \mathcal{D}_{\text{KS}}
  definition: two-sample Kolmogorov-Smirnov statistic, the largest absolute difference between two empirical
    cumulative distribution functions
  kind: scalar
  unit: dimensionless
  notes: One concrete choice of drift measure; the general divergence term of the degradation equation
    is $\StatisticalDivergence$. Ranges from 0 to 1.
- macro: \KroneckerIndicator
  latex: \delta
  definition: Kronecker delta, one when its two indices are equal and zero otherwise
  kind: scalar
  unit: dimensionless
  notes: Always written with two index subscripts, $\delta_{jk}$. Not the differential privacy slack $\PrivacyAdditiveSlack$.
- macro: \KsCriticalCoefficient
  latex: c
  definition: asymptotic coefficient of the two-sample Kolmogorov-Smirnov rejection rule, a function of
    the significance level alone
  kind: function
  notes: Equals $\sqrt{-\ln(\HypothesisTestSignificanceLevel/2)/2}$, about 1.36 at level 0.05. Multiplied
    by $\sqrt{(n+m)/(nm)}$ it gives $\KolmogorovSmirnovCriticalThreshold$.
- macro: \KvHeadCount
  latex: H_{\text{KV}}
  definition: number of key-value heads in grouped-query or multi-query attention
  kind: count
  notes: Equals $\AttentionHeadCount$ in standard multi-head attention and 1 in multi-query attention.
    Sets the KV cache size.
  aliases:
  - \NumberOfKeyValueHeads
  - \NumberOfKeyvalueHeadsKv
- macro: \LabelCategoryIndex
  latex: i
  definition: position of one label category among a classifier's output classes
  kind: index
  notes: As a subscript ($p_i$, $\sum_i$) the letter is an exempt index; this entry covers the standalone
    use in prose.
- macro: \LabelFlipRate
  latex: \rho_{\text{flip}}
  definition: probability that a training label is flipped to the wrong class under symmetric label noise
  kind: scalar
  unit: dimensionless
  notes: Scales effective sample size by $(1-2\rho_{\text{flip}})^2$.
- macro: \LabelRandomVariable
  latex: Y
  definition: label of a passively trained model viewed as a random variable
  kind: record
- macro: \LabelVector
  latex: \mathbf{y}
  definition: true label of one example written as a vector, such as a one-hot class vector
  kind: vector
  notes: Compared with $\PredictedOutput$ ($\hat{\mathbf{y}}$) by the loss $\LossFunction$.
- macro: \LabeledSampleCount
  latex: D_{\text{labeled}}
  definition: number of samples in a dataset that carry labels
  kind: count
  notes: Drives labeling cost.
- macro: \LaggedModelInput
  latex: x_{t-\Delta}
  definition: model input features as they existed a lag before the current time, as point-in-time retrieval
    reconstructs them for training
  kind: record
  notes: Historical counterpart of $\ModelInput_t$.
- macro: \LaplaceLikelihoodScale
  latex: b
  definition: scale parameter of the isotropic Laplace likelihood a decoder assigns to each action-chunk
    entry, which turns maximum likelihood into an l1 loss
  kind: scalar
  unit: varies
  notes: Unit of the action entries. Not \LaplaceNoiseScale, the differential-privacy noise scale.
- macro: \LaplaceNoiseSample
  latex: x
  definition: value of a zero-mean Laplace noise variable at which its density is evaluated
  kind: scalar
  unit: varies
  notes: Local to the Laplace density formula; carries the query's units. Not $\ModelInput$.
- macro: \LaplaceNoiseScale
  latex: b
  definition: scale parameter of the Laplace noise a differentially private mechanism adds, the query
    sensitivity divided by the privacy budget
  kind: scalar
  unit: varies
  notes: Carries the units of the query output (USD in the salary example). The expected absolute value
    of a Laplace draw equals $b$. Not a bit width.
- macro: \LargestEigenvalue
  latex: \lambda_{\max}
  definition: largest eigenvalue of a symmetric matrix, applied to that matrix
  kind: function
  unit: varies
  notes: Unit is that of the matrix entries.
- macro: \LargestSingularNumber
  latex: \sigma_{\max}
  definition: largest singular value of a matrix, its spectral norm
  kind: function
  unit: dimensionless
  notes: Unit is that of the matrix entries.
- macro: \LarsGlobalLearningRate
  latex: \eta_{\text{global}}
  definition: global learning rate that layer-wise adaptive rate scaling multiplies by each layer's trust
    ratio
  kind: scalar
  unit: dimensionless
  notes: Per-layer rate $\LearningRate_\ell$ is this times the weight-norm to gradient-norm ratio.
- macro: \LastCandidateEmbeddingVector
  latex: \mathbf{x}_N
  definition: last stored candidate vector of a nearest-neighbor collection, whose index is the collection
    size
  kind: vector
  notes: Closes the list $\mathbf{x}_1,\dots,\mathbf{x}_N$ of \StoredIndexVector; the index \RetrievalCollectionSize
    is baked into the LaTeX.
- macro: \LastFunctionInputComponent
  latex: x_N
  definition: last component of the input vector of a scalar graph function
  kind: scalar
  unit: dimensionless
- macro: \LatencyRewardExponent
  latex: \beta_{\text{lat}}
  definition: exponent on the latency ratio in a hardware-aware search reward, setting how hard missing
    the latency target is penalized
  kind: scalar
  unit: dimensionless
- macro: \LatentActionComponent
  latex: u
  definition: one component of the unbounded latent action of a squashed-Gaussian policy, before tanh
    squashing
  kind: scalar
  unit: dimensionless
  notes: Indexed by action dimension, $u_i$; the component of \UnsquashedLatentAction.
- macro: \LatentGaussianPolicyDensity
  latex: \mu
  definition: Gaussian density that a squashed-Gaussian policy assigns to an unbounded latent action given
    the state, before the tanh change of variables
  kind: distribution
  notes: Not \CoulombFrictionCoefficient or \ConservativeSamplingDistribution, which share the glyph.
- macro: \LatentStateEncoder
  latex: q_\phi
  definition: learned encoder, with parameters phi, that maps sensor observations to a latent state estimate
  kind: function
  notes: Deterministic state encoder of world models and latent state-space models; not the CVAE recognition
    distribution \CvaeRecognitionEncoder, which shares the glyph.
- macro: \LatestSequentialObservation
  latex: X_m
  definition: latest observation of a sequential test after m observations
  kind: record
  notes: The m matches the m of \SequentialLikelihoodRatio.
- macro: \LayerCount
  latex: N_L
  definition: number of layers in a network
  kind: count
  notes: Layers are indexed by $\LayerIndex$ from 1 to $\LayerCount$.
  aliases:
  - \NumberOfLayers
- macro: \LayerFunction
  latex: f
  definition: function one layer, operator or recurrent cell computes, as a whole map from its inputs
    to its output
  kind: function
  notes: Indexed by layer as $f_1, f_2, \ldots$. Not the elementwise activation function, which shares
    the glyph.
- macro: \LayerIndex
  latex: \ell
  definition: position of one layer within a network, counted from the input
  kind: index
  notes: Use instead of bare $L$ when indexing layers, since $L$ collides with loss and latency. A numeric
    subscript marks a norm instead ($\ell_1$, $\ell_2$).
- macro: \LayerInputComponent
  latex: x
  definition: one component, or feature, of a layer's input vector
  kind: scalar
  unit: dimensionless
  notes: Written $x_i$; a component of $\mathbf{x}$.
- macro: \LayerInputMatrix
  latex: \mathbf{X}
  definition: input to a layer in matrix form, one row per example or token, or a single-channel image
  kind: matrix
  notes: The matrix form of $\mathbf{x}$. In self-attention, $\mathbf{Q} = \mathbf{X}\mathbf{W}_Q$.
- macro: \LayerInputVector
  latex: \mathbf{x}
  definition: vector of activations one layer receives as input
  kind: vector
- macro: \LayerInputWidth
  latex: d_{\text{in}}
  definition: number of input features, or input channels, of one layer
  kind: count
  notes: Pairs with $\LayerOutputWidth$; a dense layer holds $\LayerInputWidth \times \LayerOutputWidth$
    weights.
  aliases:
  - \LayerInputAndOutputWidths
- macro: \LayerNonlinearity
  latex: \phi
  definition: elementwise nonlinearity written inside a convolution or recurrent layer's update equation,
    kept apart from the whole-layer map f
  kind: function
  notes: Used where the same passage also names the layer's whole map \LayerFunction ($f$); elsewhere
    the generic activation is \ActivationFunction. Typical instances are ReLU in a convolution and tanh
    in a recurrent update.
- macro: \LayerNormMean
  latex: \mu_{\text{LN}}
  definition: mean over the features of one input vector, as layer normalization computes it
  kind: scalar
  unit: dimensionless
- macro: \LayerNormStandardDeviation
  latex: \sigma_{\text{LN}}
  definition: standard deviation over the features of one input vector, as layer normalization computes
    it
  kind: scalar
  unit: dimensionless
  notes: Squared, it is the per-vector variance.
- macro: \LayerOutputMatrix
  latex: \mathbf{Y}
  definition: output matrix of a layer's matrix multiplication of the input matrix by the weight matrix,
    one row per example
  kind: matrix
  notes: Shape batch size by layer output width; before any bias or activation function. Not the label
    vector.
- macro: \LayerOutputVector
  latex: \mathbf{y}
  definition: vector of activations one layer produces
  kind: vector
  notes: Not the label vector \LabelVector.
- macro: \LayerOutputWidth
  latex: d_{\text{out}}
  definition: number of output features, or output channels, of one layer
  kind: count
  notes: Pairs with $\LayerInputWidth$; a dense layer's weight matrix holds $\LayerInputWidth \cdot \LayerOutputWidth$
    weights.
  aliases:
  - \LayerInputAndOutputWidthsTwo
- macro: \LayerSelectionIndex
  latex: i
  definition: position of one layer's parameter block among a network's layers, from one to the layer
    count, as task-adaptive sparse updates select layers
  kind: index
  notes: Same role as \LayerIndex (ell); kept as i only because the chapter renders i.
- macro: \LayerWeightEntry
  latex: W
  definition: one scalar entry of a layer's weight matrix, picked out by a layer superscript and numeric
    row and column subscripts
  kind: scalar
  unit: dimensionless
  notes: Italic per the notation chapter's rule that individual matrix entries stay italic. Same quantity
    family as \WeightMatrixEntry.
- macro: \LayerWeights
  latex: \mathbf{w}
  definition: weights of one layer viewed as a single vector, whose norm layer-wise adaptive rate scaling
    compares with the layer's gradient norm
  kind: vector
  notes: Indexed by layer, $\mathbf{w}_\ell$. Not \WeightVector (one neuron) or \WeightMatrix.
- macro: \LayerWidth
  latex: n
  definition: number of units in the layer at a given position of the network, with n_0 the input width
  kind: count
  notes: Indexed by layer position. The single-layer view writes \LayerInputWidth and \LayerOutputWidth.
- macro: \LearningCurveSampleCount
  latex: n
  definition: number of training samples a model is trained on at one point of its learning curve
  kind: count
  notes: Runs from 0 to the total $\DatasetSize$ in performance-per-data and area-under-the-learning-curve
    metrics.
- macro: \LearningRate
  latex: \eta
  definition: step size the optimizer multiplies the gradient by in each parameter update
  kind: scalar
  unit: dimensionless
  notes: Bare $\eta$ is reserved for the learning rate; hardware efficiency is $\EfficiencyHw$.
- macro: \LeftSingularVectorMatrix
  latex: \mathbf{P}
  definition: matrix whose columns are the left singular vectors of a weight matrix
  kind: matrix
  notes: Subscript $k$ keeps the first \FactorizationRank columns.
- macro: \LifecycleStageIndex
  latex: i
  definition: position of a stage in the ML lifecycle, counted from problem definition as stage one
  kind: index
  notes: Used in the constraint propagation relation, where a constraint found at stage i costs about
    2^{i-1} times its stage-one correction cost. The exponent i-1 is the same index, not a separate symbol.
- macro: \LipschitzConstant
  latex: K
  definition: Lipschitz constant of a function, the largest ratio of the change in its output to the change
    in its input
  kind: scalar
  unit: varies
  notes: 'Defined by $\lVert f(x) - f(x'') \rVert \le K \lVert x - x'' \rVert$. Unit: output units per
    input unit. Not the PGD step count $\AttackStepsPgd$.'
- macro: \LogisticProbability
  latex: p_{\text{sig}}
  definition: probability between zero and one taken as the argument of the logit function, the output
    of a logistic sigmoid
  kind: scalar
  unit: dimensionless
  notes: logit(p) = log(p/(1-p)) is its log-odds.
- macro: \LogitVector
  latex: \mathbf{z}
  definition: vector of logits a classifier outputs, the unnormalized score for every class before softmax
  kind: vector
  notes: Elements are \OutputLogit. Vector named as such because the scalar per-class logit has its own
    entry.
- macro: \LookaheadStepIndex
  latex: l
  definition: number of steps ahead of the current step at which a temporal-difference residual enters
    the generalized advantage sum
  kind: index
  notes: Summation index of \GaeAdvantageEstimate; also the exponent of the discount-times-decay weight.
- macro: \Loss
  latex: L
  definition: value of the training objective a model minimizes
  kind: scalar
  unit: dimensionless
  notes: Latency is $\Latency$, never bare $L$.
- macro: \LossAdjointSeed
  latex: \bar{\mathcal{L}}
  definition: reverse-mode adjoint of the loss, set to one to seed the backward sweep
  kind: scalar
  unit: dimensionless
- macro: \LossFunction
  latex: \mathcal{L}
  definition: training objective that scores a model's predictions against the labels, the quantity training
    minimizes
  kind: function
  notes: Gradients are written $\nabla_{\ModelParameters}\LossFunction$. The performance registry's $\Loss$
    ($L$) is a separate entry for a loss value.
- macro: \LossGradient
  latex: g
  definition: gradient of the training loss with respect to one model parameter, as an optimizer update
    uses it
  kind: scalar
  unit: varies
  notes: 'Optimizer update rules use it per step, $\LossGradient_t$. Unit: loss per parameter unit.'
  aliases:
  - \Gradient
- macro: \LossGradientVector
  latex: \mathbf{g}
  definition: gradient of the training loss with respect to all model parameters, written as one vector
  kind: vector
  notes: Not the LogGP injection gap $\MessageInjectionGap$ ($g$), nor the per-parameter $\LossGradient$;
    $\MicrobatchGradient$ is the gradient of one micro-batch.
- macro: \LossHessian
  latex: \mathbf{H}
  definition: matrix of second derivatives of the loss with respect to every pair of model parameters
  kind: matrix
  notes: Has $\Parameters \times \Parameters$ entries, so storing it needs memory quadratic in parameter
    count.
- macro: \LossLowerBound
  latex: \mathcal{L}_{\inf}
  definition: greatest lower bound of the training objective over all parameter values
  kind: scalar
  unit: dimensionless
  notes: Enters the optimization term $\LossFunction(\ModelParameters_0) - \mathcal{L}_{\inf}$ of the
    SGD bound.
- macro: \LossTimeDerivative
  latex: \dot{\mathcal{L}}
  definition: rate of change of the training loss along a continuous-time parameter trajectory
  kind: function
  notes: Equals minus the squared gradient norm under gradient flow.
- macro: \LotSamplingProbability
  latex: q
  definition: probability that Poisson sampling includes each record in a DP-SGD lot, the expected lot
    size divided by the dataset size
  kind: scalar
  unit: dimensionless
  notes: Privacy amplification by subsampling depends on it; accountants need the sampling convention
    alongside it.
- macro: \LowRankLeftFactor
  latex: \mathbf{U}
  definition: tall factor of a low-rank weight factorization, with one row per weight-matrix row and one
    column per retained rank
  kind: matrix
  notes: $\WeightMatrix \approx \LowRankLeftFactor\LowRankRightFactor^T$.
- macro: \LowRankRightFactor
  latex: \mathbf{V}
  definition: second factor of a low-rank weight factorization, with one row per weight-matrix column
    and one column per retained rank
  kind: matrix
  notes: Its transpose is the wide factor in $\WeightMatrix \approx \LowRankLeftFactor\LowRankRightFactor^T$.
- macro: \LshBandCount
  latex: L
  definition: number of bands locality-sensitive hashing splits a MinHash signature into
  kind: count
  notes: Documents collide if all rows of any one band match.
- macro: \LshCandidateProbability
  latex: p_{\text{candidate}}
  definition: probability that a pair of records with a given Jaccard similarity matches in at least one
    band of a banded LSH index and so becomes a candidate
  kind: scalar
  unit: dimensionless
  notes: $1-(1-J^{r})^{b}$ for $b$ bands of $r$ rows; an S-shaped curve whose steep region is near $(1/b)^{1/r}$.
- macro: \LshRowsPerBand
  latex: r
  definition: number of MinHash signature rows in each locality-sensitive hashing band
  kind: count
  notes: Signature length is bands times rows.
- macro: \ManualReviewCost
  latex: C_{\text{manual}}
  definition: cost of sending one item to manual review
  kind: scalar
  unit: USD/item
  notes: Not \AssuranceClaim.
- macro: \ManualReviewFraction
  latex: r_{\text{manual}}
  definition: fraction of items a confidence threshold routes to manual review
  kind: function
  unit: dimensionless
  notes: A function of \ResponseThreshold. Not \Reward.
- macro: \MapParameterEstimate
  latex: \theta_{\text{MAP}}
  definition: maximum a posteriori point estimate of model parameters, the mode of the posterior
  kind: vector
  notes: 'Render exception as for \ModelParameters: italic theta for a parameter collection.'
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \MaskedImitationDataset
  latex: \mathcal{D}_{\text{train}}
  definition: training dataset of plant-state, imitation-target and causal-mask triples built from logged
    intervention episodes
  kind: set
  notes: A curated instance of \TrainingDataset, kept separate because it carries the mask and is rendered
    calligraphic.
- macro: \MaskedImitationLoss
  latex: \mathcal{L}_{\text{imitation}}
  definition: imitation-learning objective over recorded trajectories in which a binary causal mask selects
    which steps' targets train the policy
  kind: function
  notes: Labeled instance of \LossFunction; the mask is \CausalInterventionMask.
- macro: \MatchingRowCount
  latex: K
  definition: number of rows that satisfy a selection predicate and are returned by an index lookup
  kind: count
  notes: Output-size term of indexed selection cost.
- macro: \MatrixColumnIndex
  latex: j
  definition: column index of an entry in a matrix
  kind: index
  notes: Inside a subscript the exempt index letter needs no macro.
- macro: \MatrixRowIndex
  latex: i
  definition: position of a row within a matrix
  kind: index
  notes: Mentioned bare in the notation chapter as an example of an italic index.
- macro: \MaximumEntropyObjective
  latex: J
  definition: expected discounted sum of rewards plus the temperature-weighted entropy of the policy at
    each visited state, the objective maximum-entropy reinforcement learning maximizes
  kind: function
  unit: dimensionless
  notes: Written J(pi). Differs from \ExpectedReturnObjective by the entropy bonus.
- macro: \MaximumLogit
  latex: z_{\max}
  definition: largest logit in one example's logit vector
  kind: scalar
  unit: dimensionless
  notes: Subtracted from every logit in the log-sum-exp trick.
- macro: \McnemarTestStatistic
  latex: \chi^2
  definition: McNemar test statistic, the squared difference of the two discordant counts divided by their
    sum
  kind: scalar
  unit: dimensionless
  notes: 'Compared against a chi-square critical value with one degree of freedom. The square belongs
    to the glyph: the chapter writes chi^2, so the conversion must replace the whole chi^2, not chi alone.'
- macro: \MealTokenKeyVector
  latex: \mathbf{k}_{\text{meal}}
  definition: key vector of the token "meal" in the chef-cooked-the-meal example
  kind: vector
  notes: Example-specific label.
- macro: \MealTokenQueryVector
  latex: \mathbf{q}_{\text{meal}}
  definition: query vector of the token "meal" in the chef-cooked-the-meal example
  kind: vector
  notes: Example-specific label.
- macro: \MeanClusterSize
  latex: m
  definition: average number of users in one randomization cluster
  kind: scalar
  unit: dimensionless
  notes: Enters the design effect with \IntraClusterCorrelation.
- macro: \MeanQueryDistance
  latex: \mu_D
  definition: common mean distance between the query and each candidate vector at a given ambient dimension
  kind: scalar
  unit: dimensionless
  notes: The dimension \AmbientDimension is baked into the LaTeX. Not \ServiceRate.
- macro: \MechanismLogMoment
  latex: \alpha_{\mathcal{M}}
  definition: log moment of a mechanism's privacy loss at a given moment order, the worst case over adjacent
    datasets of the log expected likelihood ratio raised to that order
  kind: function
  notes: Applied to the moment order $\MomentOrder$; composes additively over steps in the moments accountant.
    Not the Renyi order $\RenyiOrder$.
- macro: \MechanismOutcome
  latex: o
  definition: one output a randomized mechanism can release, the value at which its output probabilities
    or densities on adjacent datasets are compared
  kind: record
  notes: The chapter wrote the same quantity as $s$ (4140), $y$ (4341-4347) and $x$ (4435); all now render
    $o$. Not $\MechanismOutputSet$, a set of outputs, nor $\MechanismOutputVector$, the Gaussian mechanism's
    vector output.
- macro: \MechanismOutputSet
  latex: \mathcal{S}
  definition: set of possible outputs of a randomized mechanism over which a differential privacy bound
    must hold
  kind: set
  notes: Quantified over all such sets in the definition.
- macro: \MechanismOutputVector
  latex: \mathbf{y}
  definition: vector output a Gaussian mechanism releases, the vector-valued query plus Gaussian noise
  kind: vector
  notes: Vector counterpart of $\MechanismOutcome$; not the masked client update of secure aggregation,
    also bold y.
- macro: \MechanismRenyiPrivacyBudget
  latex: \epsilon_{\text{R},i}
  definition: Renyi differential privacy bound of the i-th mechanism in a composition, at a common Renyi
    order
  kind: scalar
  unit: dimensionless
  notes: The index i is fused into the label subscript; summing over i gives the composed bound $\RenyiPrivacyBudget$.
- macro: \MergedAttentionOutput
  latex: \mathbf{O}^{\text{new}}
  definition: attention output accumulated over two key blocks taken together, the block partial outputs
    rescaled to the merged softmax statistics and added
  kind: vector
  notes: The partial output of one block is \AttentionHeadOutput^{(1)}; this is the result after merging
    the next block, normalized by \MergedSoftmaxNormalizer.
- macro: \MergedSoftmaxMaximum
  latex: m^{\text{new}}
  definition: largest score over two softmax blocks taken together, the maximum online softmax carries
    forward after merging a block
  kind: scalar
  unit: dimensionless
  notes: The maximum of the two block maxima \SoftmaxRowMaximum^{(1)} and \SoftmaxRowMaximum^{(2)}; the
    superscript new marks the merged result, not a block index.
- macro: \MergedSoftmaxNormalizer
  latex: z^{\text{new}}
  definition: softmax denominator over two blocks taken together, the block sums rescaled to the merged
    maximum and added
  kind: scalar
  unit: dimensionless
  notes: Built from the block sums \SoftmaxNormalizer^{(1)} and \SoftmaxNormalizer^{(2)}, each rescaled
    by the exponential of its block maximum minus \MergedSoftmaxMaximum.
- macro: \MergedWeightMatrix
  latex: \mathbf{W}_{\text{final}}
  definition: weight matrix with a low-rank update folded into the frozen weights for serving
  kind: matrix
- macro: \MicrobatchGradient
  latex: \mathbf{g}
  definition: gradient of one micro-batch's loss with respect to all model parameters
  kind: vector
  notes: Indexed by micro-batch, $\mathbf{g}_j$; accumulation sums them before the optimizer step.
- macro: \MicrobatchIndex
  latex: j
  definition: position of one micro-batch among those accumulated into an optimizer update
  kind: index
- macro: \MicrobatchSize
  latex: B_{\text{micro}}
  definition: number of examples in one micro-batch, the unit run through a single forward and backward
    pass
  kind: count
  notes: Gradient accumulation forms $\BatchSize = k \times \MicrobatchSize$.
- macro: \MinHashPermutation
  latex: \sigma
  definition: uniformly random permutation of the feature vocabulary whose minimum over a set gives one
    MinHash component
  kind: function
  notes: Production systems approximate it with universal hash functions. Not $\RelationalSelection$,
    the relational selection operator.
- macro: \MinHashPermutationCount
  latex: n_{\sigma}
  definition: number of independent random permutations, and so of components, in one MinHash signature
    as used for screening trajectory records
  kind: count
  notes: Equals bands times rows, $\MinHashPermutationCount = \SignatureBandCount\,\LshRowsPerBand$. The
    similarity estimate has standard error at most $0.5/\sqrt{\MinHashPermutationCount}$.
- macro: \MinHashSketchSize
  latex: s
  definition: number of hash values in one MinHash signature
  kind: count
  notes: Pairwise similarity estimation costs time linear in it.
- macro: \MiniBatchActivation
  latex: a
  definition: activation of one example in a mini-batch, for a single feature or channel, as batch normalization
    sees it
  kind: scalar
  unit: dimensionless
  notes: Indexed by example, $x_i$ for $i = 1, \ldots, \BatchSize$. LayerNorm instead indexes features
    of one example.
- macro: \MiniBatchSet
  latex: \mathcal{B}
  definition: set of examples processed together as one mini-batch
  kind: set
  notes: Has $\BatchSize$ members; subscripts name batch-normalization statistics ($\mu_{\mathcal{B}}$).
- macro: \MinibatchGradient
  latex: \mathbf{g}
  definition: gradient of the mean loss over one minibatch with respect to all model parameters, the stochastic
    gradient estimate one SGD update uses
  kind: vector
  notes: Indexed by worker ($\mathbf{g}_k$), update ($\mathbf{g}_t$) or layer ($\mathbf{g}_\ell$). The
    average over workers is \GlobalBatchGradient.
- macro: \MinimumDetectableEffect
  latex: \delta_{\text{MDE}}
  definition: smallest absolute difference in the outcome metric that an A/B test is designed to detect
  kind: scalar
  unit: dimensionless
  notes: Absolute difference in a rate such as conversion.
- macro: \MisclassifiedFraction
  latex: r_{\text{error}}
  definition: fraction of items a model misclassifies at a given confidence threshold
  kind: function
  unit: dimensionless
  notes: A function of \ResponseThreshold.
- macro: \MissAcceptanceProbability
  latex: \alpha
  definition: probability that a human reviewer accepts an AI assistant's missed detection instead of
    correcting it
  kind: scalar
  unit: dimensionless
  notes: Accepted-miss failure probability is $(1 - S_{\text{AI}})\alpha$. Not a significance level, which
    shares the glyph.
- macro: \MixtureComponentCount
  latex: M
  definition: number of components of a mixture distribution
  kind: count
- macro: \MixtureComponentCovariance
  latex: \boldsymbol{\Sigma}_m
  definition: covariance matrix of one component of a Gaussian mixture, output by a mixture density network
    for the given input
  kind: matrix
- macro: \MixtureComponentIndex
  latex: m
  definition: position of one component of a mixture distribution, from one to the component count
  kind: index
  notes: Indexes the mixture weight, mean and covariance of a mixture density network.
- macro: \MixtureComponentMean
  latex: \boldsymbol{\mu}_m
  definition: mean vector of one component of a Gaussian mixture, output by a mixture density network
    for the given input
  kind: vector
  notes: Not the friction coefficient \CoulombFrictionCoefficient.
- macro: \MixtureComponentWeight
  latex: w_m
  definition: nonnegative weight of one component of a mixture distribution, the weights over all components
    summing to one
  kind: scalar
  unit: dimensionless
  notes: Output of a mixture density network for the given input; written $\pi_m$ in the training chapter.
    Not \TemporalEnsemblingWeight ($w_i$).
- macro: \MixupSample
  latex: \tilde{x}
  definition: virtual training input MixUp forms as a weighted combination of two real inputs
  kind: record
  notes: Weighted by $\MixupWeight$.
- macro: \MixupWeight
  latex: \lambda_{\text{mix}}
  definition: weight MixUp gives the first of two inputs and labels it combines
  kind: scalar
  unit: dimensionless
  notes: Lies in [0, 1]; the second input gets one minus it.
- macro: \MobilenetWidthMultiplier
  latex: \alpha_{\text{width}}
  definition: MobileNet width multiplier, the factor that scales the channel count of every layer
  kind: scalar
  unit: dimensionless
  notes: Same idea as \WidthMultiplier ($w_{\text{mult}}$, compound scaling); kept separate only because
    the chapter renders MobileNet's alpha.
- macro: \ModelGenerationIndex
  latex: n
  definition: position of a model in a chain of models each trained on the previous one's synthetic output
  kind: index
  notes: Used in describing model collapse.
- macro: \ModelInput
  latex: x
  definition: input of one example, the data a model receives to produce a prediction
  kind: record
  notes: The conditioning variable in $\ConditionalDistribution$ and the argument of $\InputDistribution$;
    its label partner is $\ExampleLabel$. Not a scalar feature $x_i$ of a neuron, which is an indexed
    component.
- macro: \ModelInputRandomVariable
  latex: X
  definition: input of a passively trained model viewed as a random variable
  kind: record
- macro: \ModelParameters
  latex: \theta
  definition: learned weights and biases of a model or policy
  kind: vector
  notes: Written non-bold $\theta$ by ML convention; subscripts such as $\pi_\theta$ show which model
    they parameterize.
  render_exception: Machine learning writes the parameter vector as a plain theta, never bold.
- macro: \ModelPrediction
  latex: \hat{y}
  definition: prediction a model outputs for one example, compared with its label by the loss
  kind: scalar
  unit: dimensionless
  notes: Scalar partner of $\ExampleLabel$; the vector of class probabilities is $\PredictedOutput$.
- macro: \ModelPredictor
  latex: f
  definition: trained model viewed as a function that maps an input to its prediction
  kind: function
  notes: $f(\ModelInput)$ is compared with $\ExampleLabel$. Its training-path and serving-path implementations
    are $\TrainingPathPredictor$ and $\ServingPathPredictor$.
- macro: \ModelScore
  latex: s
  definition: score a classifier assigns to one individual, read as the predicted probability of the positive
    outcome
  kind: scalar
  unit: dimensionless
  notes: Calibration within groups requires the observed positive rate among individuals scored $s$ to
    equal $s$.
- macro: \ModelWeight
  latex: w
  definition: value of one learnable weight of a model, such as the weight on one input of a neuron
  kind: scalar
  unit: dimensionless
  notes: One entry of $\ModelParameters$.
- macro: \MomentOrder
  latex: \lambda_{\text{mom}}
  definition: order of the moment of the privacy loss that the moments accountant bounds, optimized when
    converting to an (epsilon, delta) guarantee
  kind: scalar
  unit: dimensionless
  notes: Positive; the conversion minimizes over it. Not a failure rate or arrival rate.
- macro: \MonitoredFairnessMetricCount
  latex: m
  definition: number of fairness metrics a monitor computes for each protected group
  kind: count
  notes: Paired with $\MonitoredGroupCount$ in the $\mathcal{O}(km)$ counter cost. Not the pipeline microbatch
    count, which shares the glyph.
- macro: \MonitoredFeatureCount
  latex: m
  definition: number of features monitored at once, each tested for drift, so the size of the test family
    a multiple-comparison correction divides the significance level by
  kind: count
  notes: Bonferroni tests each feature at $\HypothesisTestSignificanceLevel/m$.
- macro: \MonitoredFeatureLevel
  latex: x_{\text{feat}}
  definition: one value of a monitored feature, the argument at which its distribution or empirical cumulative
    distribution function is evaluated
  kind: scalar
  unit: varies
  notes: 'The maximization variable of the Kolmogorov-Smirnov statistic. Not the model input $\ModelInput$.
    Unit: unit of the feature.'
- macro: \MonitoredGroupCount
  latex: k
  definition: number of protected groups a fairness monitor keeps separate statistics for
  kind: count
  notes: Monitoring cost grows as $\mathcal{O}(km)$ with $\MonitoredFairnessMetricCount$. Not $\AnonymitySetSize$,
    which shares the glyph.
- macro: \MutualInformation
  latex: I
  definition: mutual information between two random variables, how much observing one reduces uncertainty
    about the other
  kind: function
  notes: Written $I(\cdot;\cdot)$ with a semicolon between its arguments; zero exactly when they are independent.
    In bits or nats depending on the log base. Not arithmetic intensity $\ArithmeticIntensity$ or $\DataInformationContent$.
- macro: \NaturalLogarithmBase
  latex: e
  definition: Euler's number, the base of the natural logarithm, written as a factor rather than as an
    exponential base
  kind: scalar
  unit: dimensionless
  notes: As an exponential base ($e^{x}$) it is exempt and needs no macro.
- macro: \NearestCandidateDistance
  latex: D_{\min}
  definition: distance from a query vector to the nearest stored candidate vector, as a function of collection
    size and dimension
  kind: function
  notes: Written $D_{\min}(N, D)$ or bare. Denominator of the relative contrast. Not \AmbientDimension.
- macro: \NeighborCount
  latex: k
  definition: number of nearest neighbors a similarity search returns for one query
  kind: count
  notes: Appears as part of the name k-nearest-neighbor.
- macro: \NeighborUserIndex
  latex: j
  definition: index of one peer user in another user's recorded connection set
  kind: index
- macro: \NeighboringDataset
  latex: X
  definition: dataset input to a randomized mechanism in the differential privacy definition, compared
    against a copy that differs in one record
  kind: record
  notes: Written $X$ and $X'$ for a neighboring pair under the chosen neighboring-dataset relation.
- macro: \NetworkFunction
  latex: f_{\text{net}}
  definition: whole neural network viewed as a function of its input and its current parameters, the composition
    of all its layers
  kind: function
  notes: Written f_net(x; theta); the semicolon separates the per-example input from the parameters. Not
    \ActivationFunction (f, one layer's element-wise nonlinearity) or \ModelPredictor (a trained model
    as an input-to-prediction map in deployment contexts).
- macro: \NetworkOutput
  latex: y
  definition: scalar output of a neuron or of a small network
  kind: scalar
  unit: dimensionless
  notes: A computed output, not a label (\TrueLabelComponent) and not a prediction probability (\PredictedOutputComponent).
- macro: \NeuronActivation
  latex: a
  definition: activation output of one neuron, the activation function applied to its preactivation
  kind: scalar
  unit: dimensionless
  notes: Layer vector is \ActivationVector; batch matrix is \ActivationMatrix.
- macro: \NeuronBias
  latex: b
  definition: bias term added to one neuron's weighted sum
  kind: scalar
  unit: dimensionless
  notes: Indexed by neuron (b_j). The layer's vector is \BiasVector.
- macro: \NeuronConnectionWeight
  latex: w_{ij}
  definition: weight on the connection from input feature i to neuron j of a layer
  kind: scalar
  unit: dimensionless
  notes: The (i, j) entry of \WeightMatrix in this chapter's lowercase scalar notation; \WeightMatrixEntry
    writes the same entry with a capital W.
- macro: \NeuronIndex
  latex: j
  definition: index of a receiving neuron within a layer
  kind: index
  notes: Written bare only when the text names the index; inside subscripts it stays an exempt index letter.
- macro: \NeuronPreactivation
  latex: z
  definition: preactivation of one neuron, its weighted input sum plus bias before the activation function
  kind: scalar
  unit: dimensionless
  notes: At the output layer z_j is the logit for class j, the argument of softmax. The vector is \PreactivationVector.
- macro: \NewSoftmaxRunningMaximum
  latex: m_{\text{new}}
  definition: running maximum of an online softmax after the current block of scores is seen
  kind: scalar
  unit: dimensionless
  notes: $m_{\text{new}} = \max(m_{\text{old}}, \max(A_t))$. Same quantity as \UpdatedSoftmaxRunningMaximum
    ($m'$) under the subscript label this chapter uses.
- macro: \NextTokenDistribution
  latex: p
  definition: probability distribution a language model assigns over the next token given its context
  kind: distribution
  notes: Its entropy in bits, exponentiated base two, is the perplexity.
- macro: \NextTokenLogitFunction
  latex: \mathbf{f}_\theta
  definition: function a language model with parameters theta computes, mapping input tokens and the generated
    prefix to next-token logits
  kind: function
  notes: Subscript is $\ModelParameters$. Output is $\LogitVector$, one logit per token of $\TokenVocabulary$.
- macro: \NgramLength
  latex: n
  definition: number of consecutive tokens in one n-gram
  kind: count
  notes: Appears mostly as part of the name n-gram.
- macro: \NoisyClassProbability
  latex: \tilde{p}
  definition: one entry of the noise-shaped class-probability vector, the returned probability of one
    class
  kind: scalar
  unit: dimensionless
  notes: Entry of $\NoisyClassProbabilityVector$; not the rounded probability $\RoundedClassProbability$.
- macro: \NoisyClassProbabilityVector
  latex: \tilde{\mathbf{p}}
  definition: class-probability vector an API returns after adding Gaussian noise to the model's scores
    and projecting the result back onto the probability simplex
  kind: vector
  notes: An extraction defense, not by itself a differential privacy guarantee.
- macro: \NoisyLabelSampleCount
  latex: D_{\text{noisy}}
  definition: number of training samples with noisy labels needed to reach a target error
  kind: count
  notes: Scales as $1/\epsilon^2$ in the illustrative quality-multiplier model.
- macro: \NonconformityScore
  latex: s
  definition: conformal nonconformity score, how poorly a candidate label agrees with an input, larger
    meaning less conformity
  kind: function
  notes: Written $s(x, y)$; its sorted calibration values are $s_{(k)}$. Not $\SelectiveAcceptanceScore$,
    where larger means more confident.
- macro: \NonzeroParameterBudget
  latex: k_{\text{nz}}
  definition: largest number of nonzero weights a pruned model may keep
  kind: count
  notes: Constraint of the pruning objective, $\|\PrunedWeightMatrix\|_0 \le \NonzeroParameterBudget$.
- macro: \NormalizationScale
  latex: \gamma
  definition: learned factor a normalization layer multiplies each normalized activation by
  kind: scalar
  unit: dimensionless
  notes: Per feature or channel; the vector form is $\boldsymbol{\gamma}$.
- macro: \NormalizationScaleVector
  latex: \boldsymbol{\gamma}
  definition: vector of learned per-channel or per-feature factors a normalization layer multiplies its
    normalized output by
  kind: vector
  notes: Entries are $\gamma$.
- macro: \NormalizationShift
  latex: \beta
  definition: learned offset a normalization layer adds to each scaled activation
  kind: scalar
  unit: dimensionless
  notes: Per feature or channel; the vector form is $\boldsymbol{\beta}$.
- macro: \NormalizationShiftVector
  latex: \boldsymbol{\beta}
  definition: vector of learned per-channel or per-feature offsets a normalization layer adds to its scaled
    output
  kind: vector
  notes: Entries are $\beta$.
- macro: \NormalizedActivation
  latex: \hat{a}
  definition: activation after batch normalization subtracts the batch mean and divides by the batch standard
    deviation
  kind: scalar
  unit: dimensionless
- macro: \NormalizedMetricBaseline
  latex: v
  definition: normalized value two tracked metrics share before a change, the baseline their later values
    are expressed against
  kind: scalar
  unit: dimensionless
  notes: Used as $1.20v$ and $0.95v$ to show a proxy metric and the true goal diverging.
- macro: \NormalizingClassIndex
  latex: k
  definition: index that runs over every output class in the softmax denominator
  kind: index
  notes: Paired with \ClassIndex, which picks the class being normalized.
- macro: \NormalizingKeyIndex
  latex: m
  definition: index that runs over every key token in the denominator of an attention softmax
  kind: index
  notes: The key-side counterpart of \NormalizingClassIndex.
- macro: \NucleusProbabilityMass
  latex: p
  definition: cumulative probability mass of the smallest high-probability token set that nucleus sampling
    draws from
  kind: scalar
  unit: dimensionless
  notes: Between zero and one.
- macro: \NumericalStabilityConstant
  latex: \epsilon
  definition: small positive constant added to a denominator or variance so the computation never divides
    by zero
  kind: scalar
  unit: dimensionless
  notes: Adam adds it to the square root of the second-moment estimate. Not the tolerated failure probability
    $\ToleratedFailureProbability$ or the adversarial budget $\AdversarialPerturbationBudget$.
- macro: \ObservableModelOutput
  latex: O
  definition: model output an adversary can observe, such as a prediction, score or generated text
  kind: record
  notes: Second argument of $\MutualInformation$ in the information leakage invariant. Not the operation
    count $\Operations$, which shares the glyph.
- macro: \ObservationCount
  latex: N
  definition: number of observations in a dataset a model is fitted to
  kind: count
- macro: \ObservationDataset
  latex: \mathcal{D}
  definition: dataset or sequence of observations whose likelihood a model with given parameters evaluates,
    as in a Bayesian posterior
  kind: set
  notes: Distinct from \DemonstrationDataset (logged demonstration pairs) and from \DatasetSize D, a count.
- macro: \ObservationTimestamp
  latex: t_{\text{obs}}
  definition: time at which a labeled observation, such as a churn event, occurred
  kind: scalar
  unit: s
  notes: Upper bound on the feature timestamps an as-of join may use.
- macro: \ObservedAnnotatorAgreement
  latex: p_o
  definition: share of items on which two annotators assign the same label
  kind: scalar
  unit: dimensionless
  notes: Numerator term of Cohen's kappa, $\InterAnnotatorAgreement = (p_o - p_e)/(1 - p_e)$.
- macro: \ObservedCategoryCount
  latex: n_i^{\text{obs}}
  definition: number of current observations that fall in one category of a categorical feature, in a
    chi-square goodness-of-fit test
  kind: count
  notes: The category index $i$ is part of the glyph because the chapter writes it before the label superscript.
    Pairs with $\ExpectedCategoryFrequency$.
- macro: \ObservedDataPoint
  latex: \mathbf{x}
  definition: one observation of a dataset, such as a sensor reading, indexed by its position
  kind: vector
  notes: The elements of \ObservationDataset.
- macro: \OldSoftmaxRunningMaximum
  latex: m_{\text{old}}
  definition: running maximum of an online softmax before the current block of scores is seen
  kind: scalar
  unit: dimensionless
  notes: Paired with $m_{\text{new}}$; accumulated sums are rescaled by $e^{m_{\text{old}} - m_{\text{new}}}$.
    The value of \SoftmaxRunningMaximum before an update.
- macro: \OnlineSoftmaxKeyTile
  latex: \mathbf{K}_{\text{tile}}
  definition: tile of key rows the online softmax loads and scores against the current query block
  kind: matrix
  notes: Indexed by the tile, $K_t$. A tile of \AttentionKeyMatrix in the step-by-step online-softmax
    description.
- macro: \OnlineSoftmaxQueryBlock
  latex: \mathbf{Q}_{\text{block}}
  definition: block of query rows that one pass of the online softmax processes against every key tile
  kind: matrix
  notes: A tile of \AttentionQueryMatrix in the step-by-step online-softmax description.
- macro: \OnlineSoftmaxScoreBlock
  latex: \mathbf{A}_{\text{block}}
  definition: block of attention scores of the current query block against one key tile, computed in one
    step of the online softmax
  kind: matrix
  notes: Indexed by the tile, $A_t = Q_{\text{block}} K_t^T$. Same role as \AttentionScoreTile ($\mathbf{S}_{ij}$)
    in the step-by-step description.
- macro: \OptimalModelParameters
  latex: \theta^*
  definition: model parameters that minimize the training loss for a given architecture
  kind: vector
  notes: Written as a function of the architecture, $\OptimalModelParameters(\CandidateArchitecture)$.
  render_exception: Machine learning writes the parameter vector as a plain theta, never bold.
- macro: \OptimalStateReturn
  latex: V_{\text{RL}}
  definition: largest expected discounted return attainable from a state of a Markov decision process,
    the fixed point of the Bellman optimality equation
  kind: function
  unit: dimensionless
  notes: Written with the optimum mark, $V_{\text{RL}}^*(s)$. The reward-maximizing counterpart of \OptimalCostToGoFunction
    ($V$), which minimizes cost; the subscript keeps the two apart where they are compared. Not \ExpectedRemainingReturn,
    which is policy-dependent and defined on interaction histories.
- macro: \OptimizationIterate
  latex: x
  definition: decision variable of an optimization problem, whose successive values are the numerical
    iterates
  kind: scalar
  unit: varies
  notes: Unit of the decision variable being optimized.
- macro: \OptimizerStepIndex
  latex: t
  definition: position of one optimizer update in the sequence of training steps
  kind: index
  notes: Usually a subscript ($\LossGradient_t$, $\ModelParameters_t$); written bare only when the step
    itself is named.
- macro: \OptimizerUpdateCount
  latex: T
  definition: number of optimizer updates a training run takes, the horizon over which a convergence bound
    averages
  kind: count
  notes: Indexed by \OptimizerStepIndex from 0 to $T-1$. Not \Time.
- macro: \OrderedTestRank
  latex: r
  definition: rank of one test's p-value in the list ordered from smallest to largest, as Benjamini-Hochberg
    uses it
  kind: index
- macro: \OutcomeAlphabet
  latex: \mathcal{X}
  definition: finite set of values a discrete random variable can take, over which its entropy sums
  kind: set
- macro: \OutcomePairPrivacyLoss
  latex: \mathcal{L}_{\text{priv},(X,X')}^{(o)}
  definition: privacy loss of a mechanism at one released outcome for one ordered adjacent pair of datasets,
    the log ratio of that outcome's probabilities on the first dataset and on the second
  kind: scalar
  unit: dimensionless
  notes: The value of $\PairPrivacyLoss$ at outcome $\MechanismOutcome$, written with the outcome as a
    parenthesized superscript.
- macro: \OutcomeStandardDeviation
  latex: \sigma
  definition: standard deviation of one user's outcome metric under the common-variance Normal approximation
    of an A/B test
  kind: scalar
  unit: dimensionless
  notes: For a conversion metric, sigma squared is p(1-p) at the baseline rate.
- macro: \OutputChannelCount
  latex: C_{\text{out}}
  definition: number of channels, one per filter, in the feature map a convolution layer produces
  kind: count
  notes: Pairs with $C_{\text{in}}$. Dense-layer output width is $\LayerOutputWidth$.
- macro: \OutputChannelIndex
  latex: k
  definition: position of one output channel of a convolution layer
  kind: index
  notes: Runs from 1 to $C_{\text{out}}$. Inside a subscript $k$ is an exempt index letter; this entry
    is for standalone uses.
- macro: \OutputFeatureMapHeight
  latex: H_{\text{out}}
  definition: number of output rows a convolution produces
  kind: count
  notes: Depends on $H_{\text{img}}$, kernel size, stride and padding.
- macro: \OutputFeatureMapWidth
  latex: W_{\text{out}}
  definition: number of output columns a convolution produces
  kind: count
  notes: Depends on $W_{\text{img}}$, kernel size, stride and padding.
- macro: \OutputLayerBiasVector
  latex: \mathbf{b}_{\text{out}}
  definition: bias vector of a network's final linear output layer
  kind: vector
- macro: \OutputLayerWeightMatrix
  latex: \mathbf{W}_{\text{out}}
  definition: weight matrix of a network's final linear output layer, applied after the last hidden activation
  kind: matrix
- macro: \OutputLogit
  latex: z
  definition: raw score a model outputs for one class before the softmax
  kind: scalar
  unit: dimensionless
  notes: Indexed by class, $z_i$; the softmax turns logits into class probabilities.
- macro: \OutputNodeAdjoint
  latex: \bar{v}_W
  definition: adjoint of the output node of a computational graph, which reverse mode seeds with one
  kind: scalar
  unit: dimensionless
- macro: \OutputNodePrimal
  latex: v_W
  definition: value of the final output node of a computational graph, the function value
  kind: scalar
  unit: dimensionless
- macro: \OutputQuantizationScale
  latex: s_Y
  definition: quantization scale of a layer's output activation tensor
  kind: scalar
  unit: varies
  notes: 'Unit: units of the activations per integer step.'
- macro: \PackedExampleIndex
  latex: k
  definition: position of one example among the examples packed into a training buffer
  kind: index
  notes: Example $k$ spans positions $b_k$ to $b_{k+1}-1$ (\PackedExampleOffset). Not \BatchIndex or \AdapterIndex.
- macro: \PackedExampleLength
  latex: s
  definition: number of tokens one packed example occupies in a training buffer
  kind: count
  notes: Indexed by example, $s_k$; cumulative sums give the boundary offsets \PackedExampleOffset. The
    same count as \SequenceLength for that example.
- macro: \PackedExampleOffset
  latex: b
  definition: zero-based buffer position at which one packed example begins
  kind: index
  notes: Indexed by example, $b_k$; $b_{k+1}$ is the next example's start. Position resets compute $\operatorname{pos}[t]=t-b_k$.
    Not \AffineOffset.
- macro: \PairPrivacyLoss
  latex: \mathcal{L}_{\text{priv},(X,X')}
  definition: privacy loss of a mechanism for one ordered adjacent pair of datasets, the log ratio of
    the output probabilities on the first and on the second
  kind: function
  notes: Decorated form of $\PrivacyLossVariable$ naming the pair; the output is the parenthesized superscript,
    $^{(o)}$.
- macro: \PairedRandomVariable
  latex: Y
  definition: second arbitrary real-valued random variable, paired with the first in a general probability
    inequality
  kind: record
  notes: Paired with \GenericRandomVariable.
- macro: \ParallelEnvironmentCount
  latex: n_{\text{env}}
  definition: number of simulated environments stepped in parallel to collect one on-policy rollout
  kind: count
- macro: \ParameterScaleCoefficient
  latex: A
  definition: fitted coefficient of the parameter-count term of a two-term scaling law in parameters and
    tokens
  kind: scalar
  unit: dimensionless
  notes: Strictly loss units times parameters raised to the parameter exponent; local to the Chinchilla
    parametric loss.
- macro: \ParameterScalingExponent
  latex: \alpha
  definition: power-law exponent at which a two-term scaling-law loss falls as parameter count grows
  kind: scalar
  unit: dimensionless
  notes: Chinchilla fit about 0.34. Not network latency.
- macro: \ParameterSpace
  latex: \Theta
  definition: set of all values the parameters of a model may take, over which a posterior is integrated
  kind: set
  notes: Not \AsymptoticTightBound, which shares the glyph.
  render_exception: Statistics writes a parameter space as capital Theta, upright Greek rather than calligraphic.
- macro: \ParameterVelocity
  latex: \dot{\theta}
  definition: rate of change of a model's parameters under continuous-time gradient flow, the parameter
    velocity
  kind: vector
  notes: 'render_exception: non-bold theta by ML convention, as for \ModelParameters.'
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \ParameterizedPredictor
  latex: f_{\theta}
  definition: trained model written as a function of its parameters, where training optimizes over those
    parameters
  kind: function
  notes: The same model as $\ModelPredictor$ with its dependence on $\ModelParameters$ shown, as in adversarial
    training's $\min_\theta \max_\delta$.
- macro: \Parameters
  latex: P
  definition: number of trainable parameters in a model
  kind: count
  notes: Bare $P$ is reserved for parameter count; peak hardware rate is $\PeakRate$ and power carries
    a subscript.
- macro: \ParentNodeIndex
  latex: k
  definition: index of a parent node, one of the inputs to the node being evaluated
  kind: index
- macro: \PassiveModelPrediction
  latex: \hat{Y}
  definition: prediction a passively deployed model outputs for an input
  kind: record
- macro: \PearsonFitStatistic
  latex: \chi^2
  definition: chi-square goodness-of-fit statistic, the sum over categories of squared differences between
    observed and expected counts divided by the expected counts
  kind: scalar
  unit: dimensionless
  notes: 'Approximately chi-square with $\FeatureCategoryCount - 1$ degrees of freedom under the null.
    The square belongs to the glyph: the conversion replaces the whole $\chi^2$. Not $\McnemarTestStatistic$.'
- macro: \PenultimateLayerWidth
  latex: n_{N_L-1}
  definition: number of units in the layer before a network's last layer
  kind: count
  notes: Input width of the output layer.
- macro: \PerWorkerBatchSize
  latex: B_{\text{per-worker}}
  definition: number of examples one worker contributes to one optimizer update, including gradient accumulation
  kind: count
  notes: Times the worker count gives the global batch size.
- macro: \PersonalizationPenaltyWeight
  latex: \lambda_{\text{reg}}
  definition: weight of the penalty that keeps a personalized client model near the global model
  kind: scalar
  unit: dimensionless
  notes: Same LaTeX as \WeightPenaltyStrength (L1/L2 weight decay) but a different penalty; see questions.
- macro: \PerturbationNoiseStandardDeviation
  latex: \sigma
  definition: standard deviation of the isotropic Gaussian noise that perturbs the clean signal in Tweedie's
    formula
  kind: scalar
  unit: varies
  notes: 'Line 765 identifies it for the diffusion marginal: its square is one minus the cumulative schedule
    over the cumulative schedule.'
- macro: \PerturbationNormOrder
  latex: p
  definition: order of the vector norm that measures a perturbation, such as 2 for Euclidean length or
    infinity for the largest coordinate
  kind: scalar
  unit: dimensionless
  notes: Written as the norm subscript, $\lVert \AdversarialPerturbation \rVert_p$.
- macro: \PerturbedSignalDimension
  latex: D
  definition: number of coordinates of the signal vector in the Gaussian perturbation model of Tweedie's
    formula
  kind: count
  notes: Sets the normalizing constant $(2\pi\sigma^2)^{\PerturbedSignalDimension/2}$ and the integration domain $\mathbb{R}^{\PerturbedSignalDimension}$.
- macro: \PerturbedSignalVector
  latex: \mathbf{x}
  definition: signal vector in the Gaussian perturbation model of Tweedie's formula, the noisy measurement,
    with subscript 0 for the clean value it perturbs
  kind: vector
  notes: Generic stand-in that the diffusion derivation then specializes to the noisy action chunk.
- macro: \PoisonedModel
  latex: f_{\mathcal{S} \cup \mathcal{S}_{\text{poison}}}
  definition: model trained on the union of the original training data and the attacker's poisoning data
  kind: function
- macro: \PoisoningDataset
  latex: \mathcal{S}_{\text{poison}}
  definition: set of crafted or mislabeled examples an attacker adds to a training set
  kind: set
  notes: Chosen in the outer problem of bilevel poisoning.
- macro: \PoisoningTargetDataset
  latex: \mathcal{S}_{\text{test}}
  definition: validation or target dataset on which a poisoning attacker seeks to raise the trained model's
    loss
  kind: set
- macro: \PolicyGaussianMean
  latex: \boldsymbol{\mu}_{\theta}
  definition: mean of the Gaussian over unbounded latent actions that a squashed-Gaussian policy network
    outputs for a state
  kind: vector
  notes: Written as a function of the state, $\PolicyGaussianMean(s)$; its components are \PolicyGaussianMeanComponent.
- macro: \PolicyGaussianMeanComponent
  latex: \mu^{\pi}
  definition: one component of the mean a squashed-Gaussian policy outputs for a state, for one action
    dimension
  kind: scalar
  unit: dimensionless
  notes: Written $\PolicyGaussianMeanComponent_i(s)$; the component of \PolicyGaussianMean.
- macro: \PolicyGaussianStandardDeviation
  latex: \boldsymbol{\sigma}_{\theta}
  definition: per-dimension standard deviation of the Gaussian over unbounded latent actions that a squashed-Gaussian
    policy network outputs, through its logarithm, for a state
  kind: vector
  notes: Components are \PolicyActionStandardDeviation.
- macro: \PolicyImitationLoss
  latex: \mathcal{L}_{\text{policy}}
  definition: imitation loss of a policy averaged over demonstration pairs labeled with one chosen action
    tap
  kind: function
  notes: Written with the policy parameters, $\mathcal{L}_{\text{policy}}(\ModelParameters)$.
- macro: \PolicyLipschitzBound
  latex: L_{\text{lip}}
  definition: Lipschitz bound of a learned policy over a specified operating domain, the largest ratio
    of action change to state change
  kind: scalar
  unit: varies
  notes: Units of the action per unit of the plant state. Gives no guarantee unless established for the
    domain; times \SensorErrorBound it bounds the action error.
- macro: \PolicyStateActionDistribution
  latex: \rho_{\pi_\theta}
  definition: distribution of state-action pairs a policy visits at a step, its trajectory marginal
  kind: distribution
  notes: Subscript is the learned policy \Policy.
- macro: \PolicyTrajectoryDistribution
  latex: p_\theta
  definition: distribution over state-action trajectories that a policy with parameters theta induces
    together with the environment dynamics
  kind: distribution
  notes: Expectation domain of the policy-gradient estimator.
- macro: \PolyakAveragingCoefficient
  latex: \tau
  definition: fraction of the active network's parameters blended into the target network's at each update
    in Polyak averaging
  kind: scalar
  unit: dimensionless
  notes: Per update, not per second. Not \Trajectory or a time constant, which also use tau.
- macro: \PooledConversionRate
  latex: \hat{p}
  definition: conversion rate pooled over both variants of an A/B test, weighted by their sample sizes
  kind: scalar
  unit: dimensionless
  notes: Used in the null-hypothesis standard error of \ProportionTestStatistic.
- macro: \PooledSampleApprovalRate
  latex: \hat{p}
  definition: observed approval share pooled over both compared groups, the sample-size-weighted mean
    of the two group approval rates
  kind: scalar
  unit: dimensionless
  notes: Sets the standard error of the two-proportion z-test under the null. Not $\EstimatedAccuracy$,
    which shares the glyph.
- macro: \PopulationStabilityBinCount
  latex: n_{\text{bins}}
  definition: number of fixed bins over which the population stability index sums
  kind: count
- macro: \PopulationStabilitySmoothingConstant
  latex: \epsilon_{\text{smooth}}
  definition: small constant added to the bin proportions of the population stability index before renormalizing,
    so an empty bin does not make a logarithm undefined
  kind: scalar
  unit: dimensionless
  notes: 'Part of the monitoring configuration: it can change the index materially when bins are sparse.
    Not $\NumericalStabilityConstant$, which guards a denominator or variance.'
- macro: \PositiveClassInput
  latex: x_{+}
  definition: clean input of the positive class, the labeled point whose perturbation neighborhood an
    illustrative decision boundary may cut through
  kind: record
  notes: Illustrative point of a two-class figure; a particular value of $\ModelInput$. Not an adversarial
    example $\AdversarialExample$.
- macro: \PositiveIntegerExponent
  latex: n
  definition: positive integer power to which an algebra element is raised in the definition of an idempotent
    element
  kind: count
  notes: Exponent of $\IdempotentAlgebraElement$; outside a subscript, so not the exempt index letter.
- macro: \PosteriorCovarianceMatrix
  latex: \boldsymbol{\Sigma}_{\text{post}}
  definition: covariance matrix of a Gaussian state estimate after a measurement update
  kind: matrix
  unit: varies
  notes: Entries carry the products of the state component units.
- macro: \PosteriorDifferentialEntropy
  latex: h_{\text{post}}
  definition: differential entropy of a state estimate after a measurement update
  kind: scalar
  unit: nats
- macro: \PotentialOutcome
  latex: Y^{\text{pot}}
  definition: potential outcome of one experimental unit as a function of the treatment assignment it
    receives
  kind: function
  notes: Written $Y^{\text{pot}}_i(w)$. Not \TrueOutcome.
- macro: \PowerCriticalQuantile
  latex: z_{\beta}
  definition: positive standard-Normal critical value corresponding to the chosen statistical power of
    a test
  kind: scalar
  unit: dimensionless
  notes: About 0.84 at 80 percent power.
- macro: \PowerLimitBase
  latex: a
  definition: positive base of a power whose exponent tends to zero, so the scaled power tends to its
    logarithm
  kind: scalar
  unit: dimensionless
  notes: Here it stands for the ratio N_u/(n epsilon).
- macro: \PpoClippedSurrogateObjective
  latex: \mathcal{L}^{\text{CLIP}}
  definition: clipped surrogate objective proximal policy optimization maximizes, the empirical mean of
    the smaller of the ratio-weighted advantage and its clipped counterpart
  kind: function
  unit: dimensionless
  notes: Whole-batch objective; \ClippedSurrogateObjective is the per-token term of the LLM variant.
- macro: \PreactivationMatrix
  latex: \mathbf{Z}
  definition: preactivation matrix of one layer for a batch, one example per row
  kind: matrix
  notes: Not \MultimodalFusedTokenStream, which shares the glyph.
- macro: \PreactivationVector
  latex: \mathbf{z}
  definition: preactivation vector of one layer for one example, the logit vector at the output layer
  kind: vector
  notes: Batched form is \PreactivationMatrix. Not \LatentStyleVariable, which shares the glyph.
- macro: \PredictedClassProbability
  latex: p
  definition: probability a classifier assigns to one label category for a given input
  kind: scalar
  unit: dimensionless
  notes: Indexed by category, $p_i$; one component of $\PredictedOutput$.
- macro: \PredictedConfidence
  latex: \hat{p}
  definition: confidence a classifier reports for its predicted class on one example, its largest class
    probability
  kind: scalar
  unit: dimensionless
  notes: Averaged within a calibration bin to compare against that bin's accuracy.
- macro: \PredictedDecision
  latex: \hat{Y}
  definition: binary decision a classifier outputs for a randomly drawn individual, one for a positive
    prediction
  kind: scalar
  unit: dimensionless
  notes: Random variable of the group-fairness criteria (demographic parity, equal opportunity, equalized
    odds); its truth partner is $\TrueOutcome$.
- macro: \PredictedOutput
  latex: \hat{\mathbf{y}}
  definition: model output for one example, such as its vector of class probabilities
  kind: vector
  notes: The label vector it is compared with is $\mathbf{y}$.
- macro: \PredictedOutputComponent
  latex: \hat{y}
  definition: one entry of a model's prediction, such as the predicted probability for one class
  kind: scalar
  unit: dimensionless
  notes: Entry of \PredictedOutput. A perceptron's single output and the scalar output of a one-output
    network are this quantity.
- macro: \PredictedProtectedAttribute
  latex: \hat{a}
  definition: protected attribute an adversary head predicts from a latent representation
  kind: record
  notes: Scored against $\ProtectedAttribute$ by $\AdversaryLoss$.
- macro: \PredictionHeadFunction
  latex: g
  definition: prediction function of a small trainable head applied to a stored embedding
  kind: function
- macro: \PredictiveEntropy
  latex: H_{\text{pred}}
  definition: entropy of a model's predicted class distribution for one input, a measure of its uncertainty
  kind: scalar
  unit: nats
  notes: Natural logarithm, so nats. Rises with uncertainty but does not identify its cause.
- macro: \PreviousLayerWidth
  latex: n_{\ell-1}
  definition: number of units in the layer before layer l
  kind: count
  notes: Equals \LayerInputWidth of layer l.
- macro: \PrimitiveOperation
  latex: \phi
  definition: elementary operation a computational graph node applies to the values of its parent nodes
  kind: function
- macro: \PriorCovarianceMatrix
  latex: \boldsymbol{\Sigma}_{\text{prior}}
  definition: covariance matrix of a Gaussian state estimate before a measurement update
  kind: matrix
  unit: varies
  notes: Entries carry the products of the state component units.
- macro: \PriorDifferentialEntropy
  latex: h_{\text{prior}}
  definition: differential entropy of a state estimate before a measurement update
  kind: scalar
  unit: nats
- macro: \PriorStandardDeviation
  latex: \sigma_0
  definition: standard deviation of an isotropic zero-mean Gaussian prior over model parameters
  kind: scalar
  unit: varies
  notes: Sets the equivalent l2 penalty \WeightPenaltyStrength $= 1/\sigma_0^2$; carries the unit of the
    parameters.
- macro: \PrivacyAdditiveSlack
  latex: \delta
  definition: additive slack term of approximate differential privacy, the probability mass by which the
    multiplicative bound may be exceeded
  kind: scalar
  unit: dimensionless
  notes: Paired with $\PrivacyBudget$ in $(\epsilon, \delta)$-differential privacy; typically much smaller
    than one over the dataset size.
- macro: \PrivacyBudget
  latex: \epsilon
  definition: 'privacy-loss bound of differential privacy: the log of the largest factor by which one
    record may change the probability of any output'
  kind: scalar
  unit: dimensionless
  notes: Smaller is more private; composes across repeated releases. Paired with $\PrivacyAdditiveSlack$.
    Not $\ToleratedFailureProbability$ or $\AdversarialPerturbationBudget$.
- macro: \PrivacyLossVariable
  latex: \mathcal{L}_{\text{priv}}
  definition: 'privacy loss random variable: the log of the ratio between a mechanism''s output probabilities
    or densities on two adjacent datasets, evaluated at the observed output'
  kind: function
  notes: Random because the output is. $(\epsilon,\delta)$-DP holds when $\Pr[\mathcal{L}_{\text{priv}}
    > \epsilon] \leq \delta$ for every ordered adjacent pair. Not a training loss $\LossFunction$.
- macro: \PrivacyNoiseMultiplier
  latex: \sigma
  definition: ratio of the Gaussian noise standard deviation to the gradient clipping norm in differentially
    private training
  kind: scalar
  unit: dimensionless
  notes: Noise is drawn from $\mathcal{N}(0, \sigma^2 C^2 \mathbf{I})$; larger values give stronger privacy
    at a utility cost. Not an activation function or a standard deviation in general.
- macro: \PrivatizedQuery
  latex: \tilde{f}
  definition: 'privatized query: the value a differentially private mechanism releases, the query on the
    dataset plus Laplace or Gaussian noise'
  kind: function
  notes: Defined as $\tilde{f}(X) = f(X) + \text{noise}$; the noise distribution names the mechanism.
- macro: \ProbabilityFunction
  latex: p
  definition: probability mass or density function of a random variable, applied to its argument
  kind: function
  notes: The generic form behind $\InputDistribution$ ($p(x)$) and $\ConditionalDistribution$ ($p(y \mid
    x)$). Lowercase keeps it apart from parameter count $\Parameters$.
- macro: \ProbabilitySimplex
  latex: \Delta
  definition: 'probability simplex: the set of vectors with nonnegative entries that sum to one, the valid
    probability distributions over a finite set of classes'
  kind: set
  notes: Written with the dimension as a superscript, $\Delta^{K-1}$ for $K$ classes. Not the sensitivity
    $\QuerySensitivity$.
  render_exception: Convex geometry writes the probability simplex as a plain capital Delta.
- macro: \ProcessedSampleCount
  latex: N_{\text{samples}}
  definition: total number of training samples a run processes, counting repeated passes over the data
  kind: count
  notes: Divided by training time it gives training throughput. Not \DatasetSize, which counts distinct
    examples.
- macro: \ProductionOnlyFailureCount
  latex: n_{\text{prod}}
  definition: number of paired requests on which the production model fails and the shadow model succeeds
  kind: count
  notes: A discordant count of McNemar's test, with \ShadowOnlyFailureCount.
- macro: \ProportionTestStatistic
  latex: z
  definition: test statistic of a two-proportion z-test, the difference of two sample proportions divided
    by its pooled standard error
  kind: scalar
  unit: dimensionless
  notes: Compared against $\ConfidenceCriticalQuantile$. Not an output logit or a latent vector, which
    share the glyph.
- macro: \ProprioceptiveInputSpace
  latex: \mathcal{X}
  definition: normed space of the inputs a continuous-control policy network accepts
  kind: set
  notes: Its elements are \ProprioceptiveInputVector.
- macro: \ProprioceptiveInputVector
  latex: \mathbf{x}
  definition: 'low-dimensional proprioceptive vector a continuous-control policy network takes as input:
    joint positions and velocities, inertial rates, projected gravity and recent actions'
  kind: vector
  notes: Not the mechanical plant state \MechanicalPlantState, which holds only $\mathbf{q}$ and $\dot{\mathbf{q}}$.
- macro: \ProtectedAttribute
  latex: a
  definition: protected attribute of one example, such as its demographic group, used as the target of
    an adversary in adversarial debiasing
  kind: record
  notes: Predicted by the adversary as $\PredictedProtectedAttribute$. Not $\SubgroupIndex$, which names
    a group being compared.
- macro: \ProtectedGroupMembership
  latex: G
  definition: protected group a randomly drawn individual belongs to, as a random variable over group
    labels
  kind: record
  notes: Its values are group labels such as $\text{A}$, $\text{B}$ or $\SubgroupIndex$.
- macro: \ProtectedTrainingRecord
  latex: R
  definition: training record of one protected individual, the unit whose leakage a privacy claim bounds
  kind: record
  notes: First argument of $\MutualInformation$ in the information leakage invariant. Not a replica count,
    a resistance or a trajectory reward, which share the glyph.
- macro: \PrunedWeightMatrix
  latex: \hat{\mathbf{W}}
  definition: weight matrix of a layer after pruning, with the removed weights set to zero
  kind: matrix
  notes: $\PrunedWeightMatrix = \PruningMask \odot \WeightMatrix$. Its $\ell_0$ norm counts the surviving
    weights.
- macro: \PruningMask
  latex: \mathbf{M}
  definition: binary matrix, the same shape as a weight matrix, whose ones mark the weights pruning keeps
  kind: matrix
  notes: 'Applied elementwise: $\PrunedWeightMatrix = \PruningMask \odot \WeightMatrix$.'
- macro: \PruningMaskEntry
  latex: M_{i,j}
  definition: one entry of the pruning mask, 1 if the weight at row i and column j is kept and 0 if removed
  kind: scalar
  unit: dimensionless
  notes: Entry of \PruningMask; italic per the notation chapter's rule for matrix entries.
- macro: \PruningThreshold
  latex: \delta_{\text{prune}}
  definition: weight magnitude at or below which magnitude-based pruning removes a weight
  kind: scalar
  unit: dimensionless
  notes: Chosen so that the kept fraction of weights matches the target sparsity; the same threshold defines
    the thresholded sparsity ratio.
- macro: \QualifiedAdmissionRate
  latex: r
  definition: fraction of qualified applicants admitted, the same in every group under equal opportunity,
    the shared true positive rate
  kind: scalar
  unit: dimensionless
  notes: Overall admission rates are $r q_a$ and $r q_b$. Not $\Reward$ or $\WheelRadius$, which share
    the glyph.
- macro: \QuantizationBitWidth
  latex: b
  definition: number of bits in each integer code a quantizer produces
  kind: count
  notes: The integer range holds $2^b$ levels.
- macro: \QuantizationBlockSize
  latex: b_{\text{block}}
  definition: number of tensor elements in one block of block-wise quantization, all sharing one scale
  kind: count
  notes: Typically 64 or 128; one FP32 scale is sent per block.
- macro: \QuantizationRoundingError
  latex: \epsilon_{\text{quant}}
  definition: difference between a value and its quantized reconstruction, for a value inside the clipping
    range
  kind: scalar
  unit: dimensionless
  notes: Bounded in magnitude by half the quantization scale.
- macro: \QuantizationScale
  latex: s
  definition: real-valued step between adjacent integer levels of a uniform quantizer
  kind: scalar
  unit: varies
  notes: 'Affine form $s = (\ClippingRangeUpperBound - \ClippingRangeLowerBound)/(2^b - 1)$. Not \ElementStorageSize
    or \LossScaleFactor. Unit: units of the quantized tensor per integer step.'
- macro: \QuantizationZeroPoint
  latex: z
  definition: integer code that an affine quantizer assigns to real zero
  kind: scalar
  unit: dimensionless
  notes: Zero for symmetric quantization; shifts the integer range for skewed (asymmetric) ranges.
- macro: \QuantizedIntegerCode
  latex: x_q
  definition: integer code a quantizer assigns to one real value
  kind: scalar
  unit: dimensionless
  notes: $x_q = \mathrm{round}(x/\QuantizationScale + \QuantizationZeroPoint)$, clamped to the integer
    range.
- macro: \QuantizedWeightEntry
  latex: W_{ik}
  definition: one integer-quantized weight at output row i and reduction index k of an integer matrix
    multiply
  kind: scalar
  unit: dimensionless
  notes: Summed over $k$ in the zero-point correction $\QuantizationZeroPoint \sum_k W_{ik}$.
- macro: \QuantizerInput
  latex: x
  definition: full-precision real value, a weight or activation, that a quantizer maps to an integer code
  kind: scalar
  unit: varies
  notes: 'Unit: units of the quantized tensor.'
- macro: \QueryAxisLabel
  latex: i
  definition: einsum index label naming the query-position axis of an attention tensor
  kind: index
- macro: \QueryBufferPosition
  latex: i
  definition: position of the query token within a packed attention buffer
  kind: index
  notes: Pairs with \KeyBufferPosition $j$ in the block-diagonal mask, $\text{score}_{i,j}$. Not the einsum
    label \QueryAxisLabel.
- macro: \QueryComponent
  latex: q_{im}
  definition: one component of one token's query vector
  kind: scalar
  unit: dimensionless
  notes: The subscripts are the token $i$ and the head-dimension position $m$; the LaTeX matches today's
    rendering.
- macro: \QueryProjectionMatrix
  latex: \mathbf{W}_{Q}
  definition: learned matrix that projects token representations into queries
  kind: matrix
- macro: \QuerySensitivity
  latex: \Delta
  definition: 'global sensitivity of a query function: the largest change in its output when one protected
    record changes, in the l1 norm, or in the l2 norm when subscripted 2'
  kind: operator
  notes: Applied to the query $\DatasetQuery$ as $\Delta f$; $\Delta_2 f$ is the l2 sensitivity the Gaussian
    mechanism calibrates to. Not the probability simplex $\ProbabilitySimplex$ (also $\Delta$) and not
    a generic difference.
- macro: \QuerySourceMatrix
  latex: \mathbf{X}_{Q}
  definition: representations attention draws its queries from, before a head-specific query projection
  kind: matrix
  notes: Equals $\mathbf{X}$ in self-attention; projected per head as $\mathbf{Q}\mathbf{W}_{Q,i}$.
- macro: \QueryVector
  latex: \mathbf{q}
  definition: query vector of one token, one row of the query matrix
  kind: vector
  notes: Indexed by token, $\mathbf{q}_i$ or $\mathbf{q}_t$.
- macro: \RadialBasisKernelCoefficient
  latex: \gamma
  definition: coefficient of a radial basis function kernel, the factor multiplying the squared distance
    between two inputs in the exponent
  kind: scalar
  unit: varies
  notes: 'Kernel $\exp(-\gamma \lVert x - x'' \rVert^2)$; larger values make the kernel narrower. Unit:
    inverse squared feature units.'
- macro: \RandomSampleCollectionSize
  latex: D_{\text{eval,total}}
  definition: total number of examples that must be collected and labeled at random to obtain a target
    number from one subgroup in expectation
  kind: count
  notes: Equals the target subgroup sample size divided by the subgroup's population fraction. A decorated
    $\DatasetSize$, so its own entry.
- macro: \RandomVectorDimension
  latex: d
  definition: number of components of a continuous random vector, the dimension of the space its density
    is defined on
  kind: count
- macro: \RandomizationClusterCount
  latex: K
  definition: number of clusters to which treatment is assigned in graph cluster randomization
  kind: count
- macro: \RandomizedMechanism
  latex: \mathcal{M}
  definition: randomized algorithm that maps a dataset to a released output, the object a differential
    privacy guarantee constrains
  kind: function
  notes: Applied to neighboring datasets $\NeighboringDataset$ in the differential privacy inequality.
- macro: \RandomizedSmoothingNoise
  latex: \boldsymbol{\delta}
  definition: random Gaussian noise vector randomized smoothing adds to an input before the base classifier
    sees it
  kind: vector
  notes: 'Drawn as $\GaussianDistribution(\ZeroVector, \SmoothingNoiseStandardDeviation^2 \IdentityMatrix)$.
    Random noise, not an adversary''s choice: not $\AdversarialPerturbation$. Bold because it is a vector
    (the chapter wrote a plain $\delta$).'
- macro: \RankComponentIndex
  latex: s
  definition: index of one rank-one component in a CP decomposition, from 1 to the factorization rank
  kind: index
- macro: \RankConstrainedMatrix
  latex: \mathbf{A}
  definition: candidate matrix of rank at most a given value that a low-rank approximation minimum ranges
    over
  kind: matrix
  notes: Bound variable of the Eckart-Young-Mirsky minimum; the minimizer is \TruncatedKeyApproximation.
    Not \RepositoryEdgeWeightMatrix.
- macro: \RawPipelineInput
  latex: x
  definition: raw input record before feature transformation, as received by the training or serving pipeline
  kind: record
  notes: The argument of \TrainingTransformFunction and \ServingTransformFunction.
- macro: \RawRecordCount
  latex: N
  definition: number of logged records, such as control steps, in a telemetry stream before any correction
    for serial correlation
  kind: count
  notes: Contrasted with \EffectiveSampleSize.
- macro: \RealDataset
  latex: \mathcal{S}_{\text{real}}
  definition: sensitive source dataset a synthetic-data generator is trained on
  kind: set
- macro: \ReconstructedWeight
  latex: \hat{w}
  definition: approximate weight a kernel reconstructs from a weight's integer code times its group scale
  kind: scalar
  unit: dimensionless
  notes: $\hat{w}_i = s\,q_i$; differs from \FullPrecisionWeight by at most half the scale.
- macro: \RecurrentHiddenBias
  latex: \mathbf{b}_{\text{h}}
  definition: bias vector a recurrent network adds in its hidden-state update
  kind: vector
- macro: \RecurrentHiddenState
  latex: \mathbf{h}
  definition: fixed-size state vector a recurrent network carries from one time step to the next
  kind: vector
  notes: Written $\mathbf{h}_t$; updated as $\mathbf{h}_t = f(\mathbf{W}_{\text{hh}}\mathbf{h}_{t-1} +
    \mathbf{W}_{\text{hx}}\mathbf{x}_t + \mathbf{b}_{\text{h}})$. Its size is $\HiddenDimension$.
- macro: \RecurrentInputWeights
  latex: \mathbf{W}_{\text{hx}}
  definition: weight matrix a recurrent network applies to the current input at every step
  kind: matrix
  notes: Shared across time steps.
- macro: \RecurrentOutputWeights
  latex: \mathbf{W}_{\text{yh}}
  definition: weight matrix that maps a recurrent network's hidden state to its output
  kind: matrix
  notes: Shared across time steps.
- macro: \RecurrentStateWeights
  latex: \mathbf{W}_{\text{hh}}
  definition: weight matrix a recurrent network applies to its previous hidden state at every step
  kind: matrix
  notes: Shared across time steps; its repeated Jacobians attenuate or amplify gradients.
- macro: \ReducibleLoss
  latex: \hat{\mathcal{L}}
  definition: part of a scaling-law loss that more parameters or data can remove, the loss minus its irreducible
    floor
  kind: function
  notes: Written as a function of parameters and tokens, \hat{\mathcal{L}}(P, D).
- macro: \ReferenceBinIndex
  latex: b
  definition: position of one reference bin among the bins a continuous feature is discretized into for
    the population stability index
  kind: index
  notes: Distribution macros applied to it, $\CurrentDistribution(b)$, read as the share of samples falling
    in bin $b$.
- macro: \ReferenceBinProportion
  latex: E
  definition: proportion of reference (training-time) observations falling in one bin of the population
    stability index
  kind: scalar
  unit: dimensionless
  notes: Written $E_i$; compared with \CurrentBinProportion.
- macro: \ReferenceDistribution
  latex: p
  definition: distribution whose samples are encoded, the first argument of a KL divergence
  kind: distribution
  notes: Pairs with \ApproximatingDistribution in $\KlDivergence(p \lVert q)$.
- macro: \ReferenceNextTokenDistribution
  latex: q
  definition: next-token distribution a frozen reference policy assigns at a given prefix
  kind: distribution
  notes: The second argument of the reference-policy KL penalty; the first is \NextTokenDistribution under
    the current policy.
- macro: \ReferenceSampleEmpiricalCdf
  latex: F
  definition: empirical cumulative distribution function of the first of two samples a two-sample Kolmogorov-Smirnov
    test compares
  kind: function
  notes: Written with its sample size as an index, $F_n$. Generic counterpart of $\TrainingEmpiricalCdf$;
    pairs with $\ComparisonSampleEmpiricalCdf$ ($G_m$).
- macro: \RegularizedEulerIntegral
  latex: I
  definition: regularized incomplete beta function, the incomplete Euler integral of the first kind divided
    by the complete one
  kind: function
  notes: Written $I_x(a, b)$ with the upper limit x as subscript; equals a binomial upper-tail probability,
    which is how Clopper-Pearson limits come from beta quantiles.
- macro: \RelationalSelection
  latex: \sigma
  definition: relational-algebra selection, the operator that keeps only the rows of a table satisfying
    a predicate
  kind: operator
  notes: Standard database notation; paired with projection and join in the feature-pipeline algebra.
- macro: \RelativeContrastTolerance
  latex: \epsilon_{\text{contrast}}
  definition: positive tolerance below which the relative contrast between farthest and nearest candidate
    distances falls with probability tending to one
  kind: scalar
  unit: dimensionless
  notes: Fixed before taking $D\to\infty$. Not \ShellRelativeThickness.
- macro: \RelativeDeviationBound
  latex: \delta
  definition: bound on the relative deviation of each query-candidate distance from their common mean
  kind: scalar
  unit: dimensionless
  notes: $0<\delta<1$; gives relative contrast at most $2\delta/(1-\delta)$. Not \AutomatonTransitionFunction
    or \PrivacyAdditiveSlack.
- macro: \ReluIntermediateTensor
  latex: \mathbf{X}'
  definition: intermediate tensor the ReLU step writes in an unfused chain of elementwise operators, read
    back by the batch normalization step
  kind: matrix
  notes: First intermediate of the chain that starts at \FusionInputTensor ($\mathbf{X}$); kernel fusion
    removes its write and reread. The prime marks a stage of the chain, not a derivative.
- macro: \RenyiDivergence
  latex: \mathcal{D}_{\alpha_{\text{R}}}
  definition: Renyi divergence of the given order between two probability distributions
  kind: function
  notes: Specializes the generic $\DivergenceMeasure$; the order is the subscript $\RenyiOrder$.
- macro: \RenyiOrder
  latex: \alpha_{\text{R}}
  definition: order of the Renyi divergence at which a Renyi differential privacy guarantee is stated,
    a number greater than one
  kind: scalar
  unit: dimensionless
  notes: Accountants evaluate several orders and keep the tightest converted bound.
- macro: \RenyiPrivacyBudget
  latex: \epsilon_{\text{R}}
  definition: 'Renyi differential privacy bound: the largest Renyi divergence of the given order between
    a mechanism''s outputs on adjacent datasets'
  kind: scalar
  unit: dimensionless
  notes: Adds across composed mechanisms at a fixed order and converts to $\PrivacyBudget$ through $\epsilon
    = \epsilon_{\text{R}} + \ln(1/\delta)/(\alpha_{\text{R}}-1)$.
- macro: \ReparameterizationNoise
  latex: \boldsymbol{\epsilon}
  definition: standard normal noise vector that the reparameterization trick scales and shifts into a
    latent sample, so gradients reach the encoder
  kind: vector
  notes: Same dimension as the latent. Not \DiffusionGaussianNoise, the noise a diffusion forward process
    adds to action chunks.
- macro: \RepeatedRunCount
  latex: k
  definition: number of repeated runs of one benchmark configuration, such as runs under different random
    seeds
  kind: count
  notes: Best-of-N reporting keeps the maximum of these runs. Not the device count or the candidate pool
    of best-of-N sampling.
- macro: \ReplayBuffer
  latex: \mathcal{M}
  definition: fixed-size buffer of past training examples that replay-based continual learning samples
    batches from
  kind: set
  notes: Not the randomized mechanism of differential privacy (\RandomizedMechanism).
- macro: \ReplayBufferTransitionCount
  latex: n_{\text{replay}}
  definition: number of transitions an off-policy replay buffer holds
  kind: count
- macro: \RequantizationScale
  latex: s_{\text{eff}}
  definition: scale that converts an integer matrix multiply's accumulator into the output tensor's quantized
    range
  kind: scalar
  unit: dimensionless
  notes: $\RequantizationScale = \WeightQuantizationScale \cdot \InputQuantizationScale / \OutputQuantizationScale$.
- macro: \RequiredUsersPerVariant
  latex: n
  definition: number of users each variant of an A/B test needs to detect the minimum detectable effect
    at the chosen confidence and power
  kind: count
  notes: Output of the A/B sample-size formula.
- macro: \ResidualAdapterFunction
  latex: A
  definition: trainable residual adapter transformation added to a hidden representation, two linear projections
    around a nonlinearity
  kind: function
- macro: \ResidualBlockOutput
  latex: \mathbf{y}
  definition: output of a residual block, the residual function plus the identity shortcut
  kind: vector
  notes: Not the label vector that other chapters write as $\mathbf{y}$.
- macro: \ResidualFunction
  latex: \mathcal{F}
  definition: function the weight layers of a residual block compute, which the identity shortcut adds
    its input to
  kind: function
  notes: $\mathbf{y} = \mathcal{F}(\mathbf{x}) + \mathbf{x}$; $\mathcal{F}'$ is its Jacobian and $\mathcal{F}_\ell$
    the branch of block $\ell$.
- macro: \ResolutionScalingRatio
  latex: \gamma
  definition: ratio by which compound scaling multiplies input resolution for each unit of the scaling
    coefficient
  kind: scalar
  unit: dimensionless
- macro: \ResourceCostBudget
  latex: C_{\text{max}}
  definition: largest resource cost a searched architecture may have
  kind: scalar
  unit: varies
  notes: 'Unit: latency or memory units of the constraint.'
- macro: \ResponseReward
  latex: r
  definition: scalar score a learned reward model assigns to one generated response in reinforcement learning
    from human feedback
  kind: scalar
  unit: dimensionless
  notes: Sequence-level; PPO subtracts a KL penalty weighted by \KlPenaltyCoefficient. Not \Reward, the
    hand-written per-step reward of policy search.
- macro: \RetainedSpectralEnergyFraction
  latex: \eta_r
  definition: fraction of a matrix's total squared Frobenius norm, its activation energy, that a rank-r
    truncated approximation preserves
  kind: scalar
  unit: dimensionless
  notes: $\eta_r=\sum_{i\le r}\sigma_i^2/\sum_{i\le q}\sigma_i^2$, undefined for the zero matrix; the
    rank \TruncationRank is baked into the LaTeX. Not \EfficiencyHw.
- macro: \RetrainingComputeCost
  latex: C_{\text{compute}}
  definition: compute cost of executing one retraining run
  kind: scalar
  unit: USD
  notes: One of the four terms of the retraining cost.
- macro: \RetrainingDeploymentCost
  latex: C_{\text{deployment}}
  definition: cost of rolling a retrained model into production
  kind: scalar
  unit: USD
  notes: One of the four terms of the retraining cost.
- macro: \RetrainingInterval
  latex: T
  definition: time between successive retrainings of a deployed model
  kind: scalar
  unit: s
  notes: Written $T^*$ for the interval that minimizes total cost per unit time. Not $\Time$, the iron-law
    execution time.
- macro: \RetrainingRiskCost
  latex: C_{\text{risk}}
  definition: expected cost of a production regression caused by a retrained model
  kind: scalar
  unit: USD
  notes: One of the four terms of the retraining cost.
- macro: \RetrainingRunCost
  latex: C
  definition: fixed total cost of one retraining run, the sum of compute, validation, deployment and risk
    costs
  kind: scalar
  unit: USD
  notes: The amortized term in the optimal retraining interval.
- macro: \RetrainingValidationCost
  latex: C_{\text{validation}}
  definition: cost of evaluating a retrained model before it is released
  kind: scalar
  unit: USD
  notes: One of the four terms of the retraining cost.
- macro: \RetrievalCollectionSize
  latex: N
  definition: number of stored candidate vectors a nearest-neighbor query is compared against
  kind: count
  notes: Held fixed as dimension grows; if it grows with dimension the union bound needs more control.
    Not \DatasetSize, which renders $D$.
- macro: \ReturnStepOffset
  latex: k
  definition: number of control steps after the current step at which a reward arrives, summed over in
    a discounted return
  kind: index
  notes: Discount exponent in $G_t = \sum_k \gamma^k r_{t+k}$.
- macro: \ReturnedClassLabel
  latex: c
  definition: label of one class an API returns in its truncated top-k output, paired with its probability
  kind: record
  notes: Indexed by the class index, $c_i$. Not $\CorrectClassIndex$, the true class of an example.
- macro: \ReverseModeWorkConstant
  latex: C
  definition: constant factor bounding the work of reverse-mode gradient evaluation as a multiple of one
    function evaluation
  kind: scalar
  unit: dimensionless
- macro: \RewardModel
  latex: r
  definition: learned reward model that scores a generated response to a prompt, trained from human preference
    comparisons
  kind: function
  notes: Written $r(x, y)$ with the prompt and the response; its score drives PPO updates in RLHF. Not
    the per-step reward $\Reward$ of policy search.
- macro: \RightSingularVectorMatrix
  latex: \mathbf{Q}
  definition: matrix whose columns are the right singular vectors of a weight matrix
  kind: matrix
  notes: Subscript $k$ keeps the first \FactorizationRank columns.
- macro: \RmspropSquaredGradientAverage
  latex: s
  definition: per-parameter running average of squared gradients that RMSprop divides the step by
  kind: scalar
  unit: varies
  notes: 'Indexed by optimizer step, $s_t$. Unit: squared loss per parameter unit.'
- macro: \RolloutLoss
  latex: \mathcal{L}
  definition: loss of a simulated rollout, the sum over its steps of a per-step loss on the state and
    parameters
  kind: function
  notes: Not \LossFunction, which scores predictions against labels.
- macro: \RolloutPolicyParameters
  latex: \theta_{\text{old}}
  definition: parameters of the policy that collected the current batch of rollouts, frozen while the
    updated parameters are optimized
  kind: vector
  notes: The denominator policy of \PolicyProbabilityRatio. Non-bold like \ModelParameters.
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \RotaryRotationMatrix
  latex: \mathbf{R}
  definition: rotation matrix a rotary position embedding applies to a query or key vector at one position
  kind: matrix
  notes: Indexed by position, $\mathbf{R}_i$; relative position follows from $\mathbf{R}_i^T\mathbf{R}_j=\mathbf{R}_{j-i}$.
    Not \DirectionalCosineMatrix, a frame rotation.
- macro: \RotatedActivationMatrix
  latex: \mathbf{X}'
  definition: activation matrix after multiplication by the orthogonal rotation QuaRot applies before
    quantization
  kind: matrix
- macro: \RotatedWeightMatrix
  latex: \mathbf{W}'
  definition: weight matrix after an orthogonal rotation is folded into it, as QuaRot does before quantization
  kind: matrix
- macro: \RoundedClassProbability
  latex: p^{\text{rnd}}
  definition: class probability an API returns after rounding the model's score to a fixed number of decimal
    places
  kind: scalar
  unit: dimensionless
  notes: Indexed by class, $p^{\text{rnd}}_i$. Not the noise-shaped score entry $\NoisyClassProbability$.
- macro: \RoundingDecimalCount
  latex: d_{\text{dec}}
  definition: number of decimal places to which an API rounds the class probabilities it returns
  kind: count
  notes: Each dropped decimal digit removes about 3.3 bits of representational precision per class.
- macro: \RoutedExpertCount
  latex: k_{\text{experts}}
  definition: number of experts a mixture-of-experts router sends each token to
  kind: count
  notes: Top-k routing; Switch Transformer uses one.
- macro: \RouterGateProbability
  latex: p_{\text{gate}}
  definition: probability a mixture-of-experts router assigns to the expert it selects for a token
  kind: scalar
  unit: dimensionless
- macro: \RowModeComponentVector
  latex: \mathbf{a}_s
  definition: column of the row-mode factor matrix for one rank-one component of a CP decomposition
  kind: vector
- macro: \RowModeFactorMatrix
  latex: \mathbf{A}
  definition: factor matrix for the row mode of a tensor decomposition, one row per row index and one
    column per rank component
  kind: matrix
- macro: \RowModeFactorSlice
  latex: \mathbf{a}
  definition: row of the row-mode factor matrix for one row index, holding its weight on every rank component
  kind: vector
  notes: Indexed $\mathbf{u}_i$.
- macro: \SampleAcquisitionPrice
  latex: c_{\text{sample}}
  definition: price of obtaining one raw training sample
  kind: scalar
  unit: USD/sample
  notes: Ranges from web scraping to licensed data.
- macro: \SampleGradientStandardDeviation
  latex: \sigma
  definition: bound on the standard deviation of a single-sample stochastic gradient about the true gradient,
    so its square bounds the per-sample gradient variance
  kind: scalar
  unit: varies
  notes: Unit of the loss gradient. Averaging over $\DeviceCount \LocalBatchSize$ samples divides the
    variance bound $\sigma^2$ by that count.
- macro: \SampleLabelingPrice
  latex: c_{\text{label}}
  definition: price of labeling one training sample
  kind: scalar
  unit: USD/sample
  notes: Ranges from crowd to expert annotation.
- macro: \ScalarGraphFunction
  latex: f
  definition: scalar-valued function of many inputs, evaluated by a computational graph, whose gradient
    reverse-mode differentiation computes
  kind: function
- macro: \ScaledBatchSize
  latex: B_{\text{new}}
  definition: batch size a training recipe is scaled to under the linear scaling rule
  kind: count
- macro: \ScaledLearningRate
  latex: \eta_{\text{new}}
  definition: learning rate used at a new batch size under a batch-size scaling rule (linear or square
    root)
  kind: scalar
  unit: dimensionless
- macro: \ScoreNoiseStandardDeviation
  latex: \sigma
  definition: standard deviation of the Gaussian noise an API adds to each returned class probability
    as an extraction defense
  kind: scalar
  unit: dimensionless
  notes: Probabilities are dimensionless, so is the deviation. Compare $\GaussianMechanismStandardDeviation$.
- macro: \ScoreNoiseVector
  latex: \mathbf{z}
  definition: Gaussian noise vector an API adds to a model's class-probability vector to make repeated
    extraction measurements less useful
  kind: vector
  notes: Output shaping against extraction, not a differential privacy mechanism; compare $\GaussianMechanismNoiseVector$.
- macro: \ScoreRefreshInterval
  latex: k
  definition: number of training epochs between two re-scorings of the candidate pool
  kind: count
  notes: Trades score freshness against scoring overhead.
- macro: \ScreenedFeature
  latex: x
  definition: one feature, such as a shingle, drawn from a record's feature set
  kind: record
  notes: Ranges over $\ScreenedFeatureSet$ in the MinHash collision identity. Not $\LabeledRecord$, which
    vol3 writes as $x$ for a whole labeled record.
- macro: \ScreenedFeatureSet
  latex: X
  definition: finite feature set extracted from one trajectory record, such as its shingles, compared
    with another by Jaccard similarity
  kind: set
  notes: Indexed by record, $X_1$ and $X_2$. MinHash estimates $\JaccardSimilarity(X_1,X_2)$ from signatures
    of these sets.
  render_exception: Keeps the italic capital X the chapter prints for a feature set, the convention of
    the MinHash literature, rather than a calligraphic letter.
- macro: \SecondClassCoverageFloor
  latex: b
  definition: minimum number of examples of the second class, B, that a coreset must retain
  kind: count
  notes: Paired with $\FirstClassCoverageFloor$.
- macro: \SecondComparedGroupLabel
  latex: b
  definition: second of two group labels compared in a group-fairness condition, one value of the protected
    group attribute
  kind: record
  notes: A value of $\ProtectedGroupMembership$; its partner is $\FirstComparedGroupLabel$. Not a bias,
    a bit width or a band count, which share the glyph.
- macro: \SecondComparedItem
  latex: j
  definition: second of two items in a paired comparison, the one the first is preferred over
  kind: index
  notes: Pairs with \FirstComparedItem.
- macro: \SecondGroupClassificationThreshold
  latex: \tau_{\text{thr},b}
  definition: score threshold applied to the second compared group in a group-specific thresholding policy
  kind: scalar
  unit: dimensionless
  notes: Partner of $\FirstGroupClassificationThreshold$. In the units of the score it thresholds.
- macro: \SecondGroupQualifiedFraction
  latex: q_b
  definition: fraction of the second compared group's applicants who are qualified, that group's base
    rate of the positive outcome
  kind: scalar
  unit: dimensionless
  notes: Partner of $\FirstGroupQualifiedFraction$.
- macro: \SecondGroupSampleApprovalRate
  latex: \hat{p}_b
  definition: observed share of the second compared group's sampled applicants who are approved
  kind: scalar
  unit: dimensionless
  notes: Estimated from $\SecondGroupSampleSize$ decisions; partner of $\FirstGroupSampleApprovalRate$.
- macro: \SecondGroupSampleSize
  latex: n_b
  definition: number of sampled decisions from the second compared group in a two-proportion test
  kind: count
  notes: Partner of $\FirstGroupSampleSize$.
- macro: \SecondJaccardSet
  latex: \mathcal{B}
  definition: second of two sets compared by Jaccard similarity, such as another document's shingles
  kind: set
  notes: Paired with $\FirstJaccardSet$.
- macro: \SecondSummandStandardDeviation
  latex: \sigma_b
  definition: standard deviation of the second of two independent zero-mean Gaussian variables in the
    variance-addition identity
  kind: scalar
  unit: dimensionless
  notes: 'Variances of independent Gaussians add: $\sigma_a^2 + \sigma_b^2$.'
- macro: \SecondTwinCriticReturnEstimate
  latex: Q_{\phi_2}
  definition: action-value estimate of the second of the two independently parameterized critics in clipped
    double Q-learning
  kind: function
  unit: dimensionless
  notes: Pairs with \FirstTwinCriticReturnEstimate.
- macro: \SelectedLayerSet
  latex: \mathcal{S}
  definition: subset of layer indices whose parameters a task-adaptive sparse update trains
  kind: set
- macro: \SelectionScoreFunction
  latex: f
  definition: function that scores a candidate sample for selection into training
  kind: function
  notes: Evaluating it over the pool is the selection latency.
- macro: \SelectionTime
  latex: T_{\text{selection}}
  definition: wall-clock time spent scoring and filtering a candidate pool to choose a training subset
  kind: scalar
  unit: s
  notes: Left side of the selection inequality with $\TrainingTime$ of the subset.
- macro: \SelectiveAcceptanceScore
  latex: \kappa
  definition: score a selective predictor computes for a request, larger when there is stronger evidence
    that answering it will be correct
  kind: function
  notes: Compared against $\ResponseThreshold$ to accept or abstain. Not the conformal $\NonconformityScore$
    and not $\ModelScore$.
- macro: \SensorNoiseBound
  latex: \epsilon
  definition: bound on the norm of the sensor measurement noise added to a policy input
  kind: scalar
  unit: varies
  notes: In the units of the policy input norm.
- macro: \SensorPatternDictionary
  latex: \mathbf{\Phi}_{\text{dict}}
  definition: dictionary matrix whose columns are the recurring basis patterns of sensor traces
  kind: matrix
- macro: \SensorTraceMatrix
  latex: \mathbf{X}
  definition: matrix of stored sensor traces, one column per example, that dictionary learning factorizes
  kind: matrix
- macro: \SequenceLength
  latex: S
  definition: number of tokens in one input sequence
  kind: count
  notes: Attention score work grows as $\SequenceLength^2$; KV-cache memory grows linearly with it.
- macro: \SequentialLikelihoodRatio
  latex: \Lambda_m
  definition: likelihood ratio of the alternative to the null hypothesis after m observations of a sequential
    probability ratio test
  kind: scalar
  unit: dimensionless
  notes: The ratio itself, not its logarithm $\SequentialLogLikelihoodRatio$, which shares the glyph in
    other volumes.
- macro: \SequentialTestObservation
  latex: X
  definition: one observation a sequential test collects, indexed in arrival order
  kind: record
  notes: Written $X_1, \ldots, X_m$; the last is \LatestSequentialObservation.
- macro: \SerialAutocorrelation
  latex: \rho
  definition: lag-one autocorrelation coefficient of a stationary first-order autoregressive telemetry
    series
  kind: scalar
  unit: dimensionless
  notes: Indexed by lag, $\rho_k = \rho^k$. Not \CorrelationCoefficient, the correlation between two different
    quantities.
- macro: \ServingEmpiricalCdf
  latex: F_{P_t}
  definition: empirical cumulative distribution function of a feature in the current serving sample
  kind: function
  notes: Subscript is the current distribution $\CurrentDistribution$; pairs with $\TrainingEmpiricalCdf$.
- macro: \ServingPathPredictor
  latex: f_{\text{serve}}
  definition: serving code path viewed as a function from a raw input to the model's output, including
    its preprocessing and runtime
  kind: function
  notes: Its training-path counterpart is $\TrainingPathPredictor$; their mean absolute gap is $\TrainingServingSkew$.
- macro: \ServingTransformFunction
  latex: f_{\text{serve}}
  definition: transformation the serving pipeline applies to a raw input to produce model features
  kind: function
  notes: Should equal \TrainingTransformFunction on every input; a difference is training-serving skew.
- macro: \ShadowOnlyFailureCount
  latex: n_{\text{shadow}}
  definition: number of paired requests on which the shadow model fails and the production model succeeds
  kind: count
  notes: A discordant count of McNemar's test, with \ProductionOnlyFailureCount.
- macro: \ShannonEntropy
  latex: H
  definition: average uncertainty of a probability distribution, the expected negative log probability
    of its outcomes
  kind: function
  unit: bits
  notes: 'The log base sets the unit: base 2 gives bits, natural log nats. Two raised to it in bits is
    perplexity.'
- macro: \ShapingPotential
  latex: \Phi
  definition: potential function over decision-process states whose discounted difference, added to the
    reward, leaves the optimal policy unchanged
  kind: function
  unit: dimensionless
  notes: Potential-based reward shaping adds $\gamma\Phi(s') - \Phi(s)$ [Ng et al. 1999]. Not the standard
    normal CDF.
- macro: \ShellRelativeThickness
  latex: \epsilon
  definition: thickness of the outer shell of a ball as a fraction of its radius
  kind: scalar
  unit: dimensionless
  notes: $0<\epsilon<1$; the shell holds $1-(1-\epsilon)^D$ of the volume. Not \PerStepErrorRate.
- macro: \ShingleLength
  latex: w
  definition: number of consecutive characters or words in one shingle used for near-duplicate detection
  kind: count
  notes: Appears as part of the name k-shingle.
- macro: \SigmoidFunction
  latex: \sigma
  definition: logistic sigmoid function, one over one plus e to the minus x
  kind: function
  notes: Maps any real input to the open interval (0, 1).
- macro: \SignatureBandCount
  latex: b
  definition: number of bands a locality-sensitive hashing index splits a MinHash signature into for trajectory
    screening
  kind: count
  notes: 'A pair becomes a candidate if all $\LshRowsPerBand$ rows of at least one band match: $1-(1-J^{\LshRowsPerBand})^{\SignatureBandCount}$.'
- macro: \SimplexProjection
  latex: \Pi_{\Delta^{K-1}}
  definition: projection that maps a vector to the closest point of the probability simplex, a valid distribution
    over the classes
  kind: operator
- macro: \SingularSpectrumMatrix
  latex: \mathbf{\Sigma}
  definition: diagonal matrix holding the singular values of a weight matrix in decreasing order
  kind: matrix
  notes: Subscript $k$ keeps the largest \FactorizationRank values.
- macro: \SisaShardCount
  latex: K
  definition: number of independent shards, and so of constituent models, that SISA training partitions
    the data into
  kind: count
  notes: Deleting one datum retrains about one shard, a $1/K$ share of the data. Not the class count,
    which shares the glyph.
- macro: \SisaTrainingShard
  latex: S
  definition: one isolated partition of the training data in SISA training, on which one constituent model
    is trained
  kind: record
  notes: Indexed by shard, $S_1, S_2, \ldots$; there are $\SisaShardCount$ of them. Not the sequence length,
    which shares the glyph.
- macro: \SmallChange
  latex: \delta
  definition: small change, increment or error in the quantity it prefixes
  kind: operator
  notes: Companion of \FiniteChange (Delta) for small or first-order changes.
- macro: \SmallPerturbation
  latex: \delta
  definition: small change or error in the quantity it prefixes, treated to first order
  kind: operator
  notes: 'Prefixes a quantity: $\delta z$, $\delta t$. The finite change is \FiniteChange ($\Delta$).
    Not \LocalizationBound or other $\delta$ entries that carry a label.'
- macro: \SmallestKeySingularNumber
  latex: \sigma_{\min(S, d_{\text{head}})}
  definition: smallest singular value of a key activation matrix, the last in decreasing order
  kind: scalar
  unit: dimensionless
  notes: Its index is the full rank count \KeySpectrumLength, written out as $\min(S, \AttentionHeadDimension)$
    where it first appears.
- macro: \SmoothedClassifier
  latex: g
  definition: smoothed classifier of randomized smoothing, which returns the class the base classifier
    predicts most often when Gaussian noise is added to the input
  kind: function
  notes: $g(x) = \arg\max_c \Pr(f(x+\delta) = c)$ with $\delta$ the $\RandomizedSmoothingNoise$. Not the
    LogGP gap $g$.
- macro: \SmoothedRunnerUpProbability
  latex: p_{B}
  definition: probability that the base classifier predicts the second most likely class when randomized-smoothing
    noise is added to the input
  kind: scalar
  unit: dimensionless
  notes: Bounded above by $1 - p_A$. Pairs with $\SmoothedTopClassProbability$.
- macro: \SmoothedTopClassProbability
  latex: p_{A}
  definition: probability that the base classifier predicts the most likely class when randomized-smoothing
    noise is added to the input
  kind: scalar
  unit: dimensionless
  notes: A certificate uses a lower confidence bound on it estimated by sampling. Pairs with $\SmoothedRunnerUpProbability$.
- macro: \SmoothingNoiseClipBound
  latex: c
  definition: largest magnitude a component of the target smoothing noise may keep after clipping
  kind: scalar
  unit: varies
  notes: In the units of the action components.
- macro: \SmoothingNoiseStandardDeviation
  latex: \sigma
  definition: standard deviation of the isotropic Gaussian noise randomized smoothing adds to each input
    coordinate
  kind: scalar
  unit: varies
  notes: In the units of the input. The certified radius scales with it, $\CertifiedRadius = \sigma\Phi^{-1}(p_A)$
    in the binary case. Not $\PrivacyNoiseMultiplier$.
- macro: \SmoothnessConstant
  latex: L_s
  definition: Lipschitz constant of the loss gradient, bounding how fast the gradient can change as the
    parameters move
  kind: scalar
  unit: dimensionless
  notes: Caps the step size, $\LearningRate \leq 1/L_s$, in the SGD convergence bound. Not \Loss or \Latency.
- macro: \SoftenedStudentProbabilityVector
  latex: \mathbf{p}_{\text{student}}^{(T_{\text{distill}})}
  definition: vector of class probabilities the student model outputs from a softmax at the distillation
    temperature
  kind: vector
  notes: Temperature-softened form of \StudentProbabilityVector, matched against \SoftenedTeacherProbabilityVector
    in \DistillationLoss.
- macro: \SoftenedTeacherProbabilityVector
  latex: \mathbf{p}_{\text{teacher}}^{(T_{\text{distill}})}
  definition: vector of class probabilities the teacher model outputs from a softmax at the distillation
    temperature
  kind: vector
  notes: Temperature-softened form of \TeacherProbabilityVector, the target of the distillation divergence
    term in \DistillationLoss.
- macro: \SoftmaxFunction
  latex: \sigma
  definition: softmax function, which maps a vector of logits to a probability vector that sums to one
  kind: function
  notes: $\sigma(\mathbf{z})_i = e^{z_i}/\sum_j e^{z_j}$; normalization by construction, not calibrated
    confidence. Not \SigmoidFunction.
- macro: \SoftmaxInputScore
  latex: x
  definition: one entry of the score vector the online softmax normalizes
  kind: scalar
  unit: dimensionless
  notes: Written with an index, x_j, and a block superscript, x_j^{(1)}.
- macro: \SoftmaxInputVector
  latex: \mathbf{x}
  definition: vector of scores an online softmax normalizes block by block
  kind: vector
- macro: \SoftmaxNormalizer
  latex: z
  definition: sum of the max-shifted exponentials of a softmax row or block, the softmax denominator,
    kept as a running sum by online softmax
  kind: scalar
  unit: dimensionless
  notes: Not the class logit z of the data appendix.
- macro: \SoftmaxOutputProbability
  latex: p
  definition: one entry of a softmax output, the probability it assigns to one position
  kind: scalar
  unit: dimensionless
  notes: Indexed by position, $p_j$; its Jacobian is $\partial p_j/\partial x_k = p_j(\delta_{jk} - p_k)$.
- macro: \SoftmaxRowMaximum
  latex: m
  definition: largest score in a softmax row or block, subtracted before exponentiation to prevent overflow
  kind: scalar
  unit: dimensionless
- macro: \SoftmaxRowScore
  latex: s
  definition: one score in the row of scores a softmax normalizes
  kind: scalar
  unit: dimensionless
  notes: Indexed by position, $s_i$. Same quantity as \SoftmaxInputScore ($x$); not \QuantizationScale,
    which shares the glyph.
- macro: \SoftmaxRunningMaximum
  latex: m
  definition: largest score seen so far in a block of the online softmax, subtracted before exponentiation
  kind: scalar
  unit: dimensionless
  notes: Superscripts (1), (2), new mark the block it covers.
- macro: \SoftmaxVectorLength
  latex: n
  definition: number of scores in the vector an online softmax normalizes, or in one block of it
  kind: count
- macro: \SourceEventTime
  latex: T_{\text{event}}
  definition: time at which the source event a feature value reflects occurred
  kind: scalar
  unit: s
  notes: Subtracted from \FeatureRecordTime to give \FeatureFreshnessLatency.
- macro: \SparseWeightMatrix
  latex: \mathbf{W}_{\text{sparse}}
  definition: weight matrix with many zero entries, as stored for sparse execution
  kind: matrix
- macro: \SparsityPenaltyWeight
  latex: \lambda_{\text{L1}}
  definition: weight of the L1 penalty on weight magnitudes that pushes weights toward zero before pruning
  kind: scalar
  unit: dimensionless
  notes: 'A specific \RegularizationWeight: the penalty term is $\SparsityPenaltyWeight \|\WeightMatrix\|_1$.'
- macro: \SparsityRatio
  latex: \rho_{\text{sparse}}
  definition: fraction of a weight matrix's entries that are zero
  kind: scalar
  unit: dimensionless
  notes: Magnitude pruning at this ratio keeps the largest $(1 - \SparsityRatio)$ fraction of weights.
- macro: \SpatialColumnIndex
  latex: j
  definition: column coordinate of one output position of a convolution
  kind: index
  notes: Exempt inside a subscript; this entry covers the standalone pair $(i,j)$.
- macro: \SpatialPositionCount
  latex: N_{\text{pix}}
  definition: number of pixel positions in an image or feature map that a convolution filter is applied
    at
  kind: count
  notes: Equals feature-map height times width, $H_{\text{img}} W_{\text{img}}$. A standard convolution
    costs $\mathcal{O}(N_{\text{pix}} K^2 C_{\text{in}} C_{\text{out}})$.
- macro: \SpatialRowIndex
  latex: i
  definition: row coordinate of one output position of a convolution
  kind: index
  notes: Exempt inside a subscript; this entry covers the standalone pair $(i,j)$.
- macro: \SpatialTransformation
  latex: \mathcal{T}
  definition: spatial transformation, such as a translation, applied to an image or feature map
  kind: operator
  notes: 'Equivariance: $f(\mathcal{T}(\mathbf{x})) = \mathcal{T}(f(\mathbf{x}))$; $\mathcal{T}_2$ is
    a two-pixel shift.'
- macro: \SpectrallyNormalizedWeightMatrix
  latex: \overline{\mathbf{W}}
  definition: weight matrix divided by its spectral norm, so its own spectral norm is one
  kind: matrix
- macro: \SphereSurfaceArea
  latex: S_{D-1}
  definition: surface area of the sphere bounding a ball of the ambient dimension, as a function of its
    radius
  kind: function
  notes: $S_{D-1}(r)=\frac{d}{dr}V_D(r)$; the sphere's own dimension $D-1$ is baked into the LaTeX.
- macro: \SquaredRadiusSubstitution
  latex: u
  definition: integration variable equal to the squared radius, introduced to reduce a radial integral
    to a gamma function
  kind: scalar
  unit: dimensionless
  notes: $u=r^2$, $du=2r\,dr$.
- macro: \SquashedActionComponent
  latex: a
  definition: one component of a normalized action after tanh squashing, in the open interval from minus
    one to one
  kind: scalar
  unit: dimensionless
  notes: Indexed by action dimension, $a_i$; the component of \ContinuousActionVector.
- macro: \StalenessAdjustedLearningRate
  latex: \eta'
  definition: learning rate of a stale-synchronous run reduced from the bulk-synchronous rate to compensate
    for bounded staleness
  kind: scalar
  unit: dimensionless
  notes: Illustrative rule $\BspLearningRate/\sqrt{1+\StalenessBound}$, not a theorem. A prime on a quantity
    is a new symbol.
- macro: \StandardNormalCumulativeDistribution
  latex: \Phi
  definition: cumulative distribution function of the standard normal distribution
  kind: function
  notes: GELU weights its input by $\Phi(x)$.
- macro: \StateOperation
  latex: f
  definition: operation that maps a system's stored state to a new state, such as one pipeline write
  kind: function
  notes: Idempotent when $f(f(x)) = f(x)$.
- macro: \StatedEvent
  latex: E
  definition: an event whose probability is stated
  kind: record
  notes: Written in $\Pr(E)$; distinct from energy terms such as $\TotalEnergy$ and from expectation $\mathbb{E}$.
- macro: \StaticDataDistribution
  latex: p_{\text{data}}
  definition: fixed data distribution from which a static benchmark draws its held-out examples
  kind: distribution
- macro: \StatisticalDivergence
  latex: \mathcal{D}(P_t \| P_0)
  definition: divergence of the current data distribution from the training distribution, a nonnegative
    measure of drift
  kind: scalar
  unit: dimensionless
  notes: 'The divergence term of the degradation equation. Common choices: KL divergence, total variation,
    Wasserstein. Calligraphic to avoid collision with $D$ (dataset size).'
  render_exception: The divergence of the current from the training distribution is the single drift term
    of the degradation equation; its two arguments define it, and \DivergenceMeasure is the head for other
    arguments.
- macro: \StatisticalHypothesis
  latex: H
  definition: a statistical hypothesis about a population, such as the null hypothesis H_0 or the alternative
    H_1
  kind: record
  notes: 'Indexed: $H_0$ null, $H_1$ alternative, $H_{(i)}$ the hypothesis with the i-th smallest p-value.'
- macro: \StoredEmbedding
  latex: \mathbf{z}
  definition: embedding a frozen feature encoder computes for one example, stored in place of the raw
    input for replay
  kind: vector
  notes: 'render_exception: kept non-bold as the chapter renders it today; a vector written in plain italic
    by the field convention of the surrounding derivation.'
- macro: \StoredSystemState
  latex: x
  definition: stored state an operation reads and writes, such as a register, counter or table
  kind: record
  notes: Argument of $\StateOperation$ in the idempotency condition.
- macro: \StructuredSparsityGroupSize
  latex: m_{\text{group}}
  definition: number of consecutive values in one group of an N:M structured-sparsity pattern
  kind: count
  notes: The 2:4 pattern has $m=4$.
- macro: \StructuredSparsityNonzeroCount
  latex: n_{\text{keep}}
  definition: number of values kept nonzero in each group of an N:M structured-sparsity pattern
  kind: count
  notes: With group size $\StructuredSparsityGroupSize$; the 2:4 pattern has $n=2$.
- macro: \StudentProbabilityVector
  latex: \mathbf{p}_{\text{student}}
  definition: vector of class probabilities the student model outputs
  kind: vector
  notes: A superscript $(\DistillationTemperature)$ marks the temperature-softened version.
- macro: \SubgroupIndex
  latex: g
  definition: label of one population subgroup whose outcomes are compared against a reference group
  kind: index
  notes: The subscript in $\GroupDisparity$. Not $\LossGradient$ or gravity, which share the glyph.
- macro: \SubgroupSampleSize
  latex: n
  definition: number of labeled examples from one subgroup used to estimate that subgroup's error rate
  kind: count
  notes: Sets the binomial margin of error $1.96\sqrt{0.25/n}$ at worst case.
- macro: \SubsetDatasetSize
  latex: D_{\text{subset}}
  definition: number of samples a selection method retains from the full dataset for training
  kind: count
  notes: The realized subset size; the target a coreset method is given is $\CoresetBudget$.
- macro: \SupportSetSize
  latex: n_{\text{shot}}
  definition: number of examples in a few-shot support set, counted over all classes
  kind: count
  notes: Not examples per class.
- macro: \SweepCandidateCostFraction
  latex: f
  definition: cost of one sweep candidate as a fraction of the final training run's cost
  kind: scalar
  unit: dimensionless
  notes: Not \ClockFrequency, which shares the glyph in the same chapter.
- macro: \SweepCandidateCount
  latex: k
  definition: number of candidate models a hyperparameter or architecture sweep trains before the final
    run
  kind: count
  notes: With \SweepCandidateCostFraction, the sweep adds $k f$ final-run equivalents.
- macro: \SymmetricClippingThreshold
  latex: \alpha_{\text{sym}}
  definition: largest magnitude a symmetric quantizer represents, so values are clipped to plus or minus
    this bound
  kind: scalar
  unit: varies
  notes: 'Symmetric case of the clipping range; not \ClippingRangeLowerBound, which is negative here.
    Unit: units of the quantized tensor.'
- macro: \SyntheticDataGenerator
  latex: G_{\theta}
  definition: generative model with learned parameters that maps latent noise vectors to synthetic data
    records
  kind: function
- macro: \SyntheticDataset
  latex: \mathcal{S}_{\text{synthetic}}
  definition: set of synthetic records a trained generator produces from sampled latent vectors
  kind: set
- macro: \TableRowCount
  latex: N
  definition: number of rows in a database table
  kind: count
  notes: 'Sets selection cost: logarithmic with a B-tree index, linear for a full scan.'
- macro: \TangentSeedVector
  latex: \dot{\mathbf{x}}
  definition: tangent vector seeded on a function's inputs for one forward-mode pass
  kind: vector
- macro: \TapeIntermediateResult
  latex: y_{\text{tape}}
  definition: intermediate result of the autograd tape example, twice its input
  kind: scalar
  unit: dimensionless
- macro: \TargetActionReturnEstimate
  latex: \hat{Q}
  definition: target estimate of the action value, held fixed during one value-fitting update to form
    the Bellman target
  kind: function
  unit: dimensionless
  notes: Used as $\mathcal{B}^*\hat{Q}$ in conservative Q-learning.
- macro: \TargetActorParameters
  latex: \theta'
  definition: parameters of the target actor network, a slowly Polyak-averaged copy of the actor parameters
  kind: vector
  notes: 'render_exception: non-bold parameter vector, as for \ModelParameters. The prime marks the target
    copy.'
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \TargetCriticParameters
  latex: \phi'
  definition: parameters of the target critic network, a slowly Polyak-averaged copy of the critic parameters
  kind: vector
  notes: 'render_exception: non-bold parameter vector, as for \ModelParameters. The prime marks the target
    copy, not a derivative.'
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \TargetError
  latex: \epsilon
  definition: test error a model is required to reach
  kind: scalar
  unit: dimensionless
  notes: Sets the sample requirement in the clean- versus noisy-label comparison.
- macro: \TargetKeyAttentionWeight
  latex: \alpha_{\text{target}}
  definition: softmax attention weight one query assigns to the target key, its share of attention
  kind: scalar
  unit: dimensionless
  notes: $\TargetKeyAttentionWeight = e^{\TargetKeyLogit}/(e^{\TargetKeyLogit} + \sum_{j=1}^{\CompetingKeyCount}
    e^{\CompetingKeyLogit_j})$; falls as competing keys are added at fixed logits (attention dilution).
- macro: \TargetKeyLogit
  latex: z_{\text{target}}
  definition: scaled query-key logit of the target key in one attention head, the key whose share of attention
    is tracked
  kind: scalar
  unit: dimensionless
  notes: Used in the attention-dilution model with $\CompetingKeyLogit$ and $\CompetingKeyCount$.
- macro: \TargetPolicyEntropy
  latex: \overline{\mathcal{H}}
  definition: minimum average policy entropy that automatic temperature tuning holds the policy to
  kind: scalar
  unit: nats
  notes: Commonly minus \ActionDimension.
- macro: \TargetSmoothingNoise
  latex: \boldsymbol{\epsilon}
  definition: zero-mean Gaussian noise vector added to the target actor's action before clipping, in target
    policy smoothing
  kind: vector
  notes: Not \DiffusionGaussianNoise.
- macro: \TargetSmoothingNoiseStandardDeviation
  latex: \sigma
  definition: standard deviation of each component of the Gaussian noise added in target policy smoothing
  kind: scalar
  unit: varies
  notes: In the units of the action components.
- macro: \TargetTwinCriticReturnEstimate
  latex: Q_{\phi'_i}
  definition: action-value estimate of the target copy of the i-th twin critic, minimized over both critics
    in the clipped Bellman target
  kind: function
  unit: dimensionless
  notes: The index i runs over the two critics.
- macro: \TaskDistance
  latex: d_{\text{task}}
  definition: task-specific distance between a model's prediction and the correct label, the error measure
    a verification guarantee bounds
  kind: function
  notes: Compared against $\TaskErrorTolerance$. Not the hidden width $\HiddenDimension$, which shares
    the letter d.
- macro: \TaskErrorTolerance
  latex: \tau_{\text{tol}}
  definition: largest task distance between a prediction and its label that still counts as an acceptable
    output
  kind: scalar
  unit: dimensionless
  notes: Carries the units of $\TaskDistance$ (dimensionless for most task metrics). Not the monitoring
    threshold $\ResponseThreshold$ or the physical $\PositionalTaskTolerance$.
- macro: \TaskLoss
  latex: \mathcal{L}_{\text{task}}
  definition: loss that scores the primary task prediction against the label in a multi-objective training
    setup
  kind: function
  notes: First term of $\DebiasingTotalLoss$.
- macro: \TaskSpecificLoss
  latex: \mathcal{L}
  definition: loss function of one task in multi-task learning, indexed by task
  kind: function
  notes: A component of a multi-task objective; \LossFunction is the single training objective.
- macro: \TeacherProbabilityVector
  latex: \mathbf{p}_{\text{teacher}}
  definition: vector of class probabilities the teacher model outputs
  kind: vector
  notes: A superscript $(\DistillationTemperature)$ marks the temperature-softened version.
- macro: \TemperatureDualObjective
  latex: \mathcal{L}
  definition: dual objective of automatic entropy tuning, whose gradient with respect to the temperature
    drives policy entropy toward its target
  kind: function
  notes: Written $\TemperatureDualObjective(\EntropyTemperature)$.
- macro: \TemperatureStepSize
  latex: \lambda_{\alpha}
  definition: step size of the dual gradient descent update of the entropy temperature
  kind: scalar
  unit: 1/nats^2
  notes: Multiplies the gradient of \TemperatureDualObjective, in nats, to change \EntropyTemperature,
    in 1/nats.
- macro: \TensorAxisCount
  latex: n
  definition: number of axes, or dimensions, of an array or tensor
  kind: count
  notes: Used in the phrase "$n$-dimensional array"; distinct from the element count $\TensorElementCount$.
- macro: \TensorColumnModeSize
  latex: J
  definition: size of the column mode of a decomposed three-mode tensor
  kind: count
  notes: Indexed by j; its factor is \ColumnModeFactorMatrix.
- macro: \TensorDepthModeSize
  latex: T
  definition: size of the depth mode of a decomposed three-mode tensor
  kind: count
  notes: Indexed by t; its factor is \DepthModeFactorMatrix.
- macro: \TensorModeIndex
  latex: n_{\text{mode}}
  definition: position of one axis (mode) of a tensor, the axis a mode-n product multiplies along
  kind: index
- macro: \TensorRowModeSize
  latex: I
  definition: size of the row mode of a decomposed three-mode tensor
  kind: count
  notes: Indexed by i; its factor is \RowModeFactorMatrix.
- macro: \TestExample
  latex: z_{\text{test}}
  definition: one test example, an input with its label, at which an influence function measures the change
    in loss
  kind: record
  notes: Pairs with $\TrainingExample$ in $\InfluenceFunction$.
- macro: \TestFamilySize
  latex: k
  definition: number of hypothesis tests in a family whose error rate a multiple-testing correction controls
  kind: count
- macro: \ThresholdedSparsityRatio
  latex: \rho_{\text{sparse},\delta}
  definition: fraction of a weight matrix's entries whose magnitude is at or below the pruning threshold
  kind: scalar
  unit: dimensionless
  notes: Counts near-zero entries as removable; equals \SparsityRatio when the threshold is zero.
- macro: \TiledAttentionOutput
  latex: \mathbf{Y}
  definition: output matrix of one attention head that a tiled attention kernel accumulates on chip and
    writes back to memory tile by tile
  kind: matrix
  notes: The attention weights applied to $\mathbf{V}$, one row per query. Same quantity as \AttentionHeadOutput
    ($\mathbf{O}$) under the glyph the FlashAttention figure uses.
- macro: \TimeStepIndex
  latex: t
  definition: position of one step in a sequence that a recurrent network or decoder processes one step
    at a time
  kind: index
  notes: Exempt inside a subscript ($\mathbf{h}_t$); this entry covers standalone uses such as "step $t$
    waits on step $t-1$".
- macro: \TokenAveragedBatchLoss
  latex: \mathcal{L}_{\text{token}}
  definition: batch loss that averages over all selected target tokens of a batch, so each example counts
    in proportion to its selected-token count
  kind: function
  unit: nats
  notes: $\sum_j \frac{N_{\text{active},j}}{\sum_k N_{\text{active},k}}\LossFunction_j$. Contrast \ExampleAveragedBatchLoss.
- macro: \TopClassCount
  latex: k
  definition: number of highest-scoring classes a top-k prediction returns or checks for the correct label
  kind: count
  notes: As in top-$k$ prediction and top-$k$ accuracy. Distinct from the top-$k$ sampling cutoff \TopTokenSampleCount
    and from the draft length \DraftTokenCount.
- macro: \TopTokenSampleCount
  latex: k
  definition: number of highest-probability tokens top-k sampling keeps as candidates at each decoding
    step
  kind: count
  notes: Distinct from \TopClassCount, a classifier's returned predictions.
- macro: \TotalDataCost
  latex: C_{\text{total}}
  definition: total cost of a training dataset over its lifecycle
  kind: scalar
  unit: USD
  notes: 'Its components depend on the analysis: typically acquisition, labeling, cleaning, storage, egress
    and processing.'
- macro: \TraceIntermediateAdjoint
  latex: \bar{v}
  definition: reverse-mode adjoint of an intermediate variable, the derivative of the output with respect
    to it
  kind: scalar
  unit: dimensionless
- macro: \TraceIntermediateTangent
  latex: \dot{v}
  definition: forward-mode tangent of an intermediate variable, its directional derivative
  kind: scalar
  unit: dimensionless
- macro: \TraceIntermediateVariable
  latex: v
  definition: intermediate variable in the evaluation trace of a differentiated program, its primal value
  kind: scalar
  unit: dimensionless
  notes: Indexed $v_i$ by position in the trace.
- macro: \TrainingDataset
  latex: D
  definition: training dataset, the collection of examples a model is trained on
  kind: record
  notes: The dataset itself; its size is \DatasetSize. Kind record because the chapter writes plain $D$,
    not calligraphic.
- macro: \TrainingDistribution
  latex: P_0
  definition: data distribution the model was trained on, the baseline that drift is measured against
  kind: distribution
  notes: Compared with $\CurrentDistribution$ by $\StatisticalDivergence$.
  aliases:
  - \TrainingDistributionZero
- macro: \TrainingEmpiricalCdf
  latex: F_{P_0}
  definition: empirical cumulative distribution function of a feature in the training-baseline sample
  kind: function
  notes: Subscript is the training distribution $\TrainingDistribution$; pairs with $\ServingEmpiricalCdf$
    in the Kolmogorov-Smirnov statistic.
- macro: \TrainingExample
  latex: z
  definition: one training example, an input together with its label, treated as a point whose weight
    in the training loss can change
  kind: record
  notes: Argument of $\InfluenceFunction$. Not a latent representation.
- macro: \TrainingFeatureMean
  latex: \mu
  definition: mean of one feature fitted on the training data, as a cleaning or normalization parameter
  kind: scalar
  unit: varies
  notes: 'Not the service rate $\ServiceRate$, which shares the glyph. Unit: unit of the feature.'
- macro: \TrainingFeatureStandardDeviation
  latex: \sigma
  definition: standard deviation of one feature fitted on the training data, as a cleaning or normalization
    parameter
  kind: scalar
  unit: varies
  notes: 'Not the A/B-test outcome standard deviation of the ML operations chapter. Unit: unit of the
    feature.'
- macro: \TrainingLoss
  latex: \mathcal{L}_{\text{train}}
  definition: loss a model incurs on its training data, the objective its weights are fit to
  kind: function
  notes: Inner objective of the neural architecture search problem.
- macro: \TrainingPathPredictor
  latex: f_{\text{train}}
  definition: training code path viewed as a function from a raw input to the model's output, as offline
    validation evaluates it
  kind: function
  notes: Its serving-path counterpart is $\ServingPathPredictor$; their mean absolute gap is $\TrainingServingSkew$.
- macro: \TrainingPipelineFunction
  latex: f
  definition: function that maps a training pipeline's versioned inputs and its execution nondeterminism
    to the model output it produces
  kind: function
  notes: Only in the reproducibility equation; its arguments are the versioned code, data, configuration
    and environment and the nondeterminism $\xi$.
- macro: \TrainingRunCount
  latex: N_{\text{runs}}
  definition: number of training runs that reuse one curated dataset, such as sweeps and ablations
  kind: count
  notes: Amortizes one-time curation cost.
- macro: \TrainingServingSkew
  latex: S_{\text{skew}}
  definition: expected absolute difference between the serving-path and training-path model scores on
    the same inputs, over a stated comparison-input distribution
  kind: scalar
  unit: dimensionless
  notes: Measurable without labels; a risk signal, not an accuracy-loss equation. Carries the units of
    the model score. Not $\SequenceLength$ or the physical $\ClockSynchronizationSkew$.
- macro: \TrainingSplitFraction
  latex: f_{\text{train}}
  definition: fraction of individual traces a random trace-level split assigns to the training partition
  kind: scalar
  unit: dimensionless
  notes: A task with $\IndependentAttemptCount$ independent attempts stays on one side of the split with
    probability $\TrainingSplitFraction^{\IndependentAttemptCount} + (1-\TrainingSplitFraction)^{\IndependentAttemptCount}$.
    Same glyph as the functions $\TrainingTransformFunction$ and $\TrainingPathPredictor$, which are code
    paths, not shares.
- macro: \TrainingStepCount
  latex: K
  definition: number of training steps over which a per-step quantity is summed or averaged
  kind: count
  notes: Steps are indexed by \OptimizerStepIndex from 1 to \TrainingStepCount.
- macro: \TrainingTransformFunction
  latex: f_{\text{train}}
  definition: transformation the training pipeline applies to a raw input to produce model features
  kind: function
  notes: Training-serving skew is $f_{\text{train}}(x) \neq f_{\text{serve}}(x)$ for some input.
- macro: \TransitionStorageSize
  latex: b_{\text{tr}}
  definition: bytes one stored reinforcement-learning transition occupies in a rollout store or replay
    buffer
  kind: scalar
  unit: bytes
  notes: Rollout storage is \ParallelEnvironmentCount times \RolloutStepCount times it; a replay buffer
    needs \ReplayBufferTransitionCount times it.
- macro: \TranslationComponent
  latex: v
  definition: shift along one spatial axis, one component of a translation vector
  kind: scalar
  unit: pixels
  notes: Written $v_1$, $v_2$.
- macro: \TranslationVector
  latex: \mathbf{v}
  definition: vector by which an image or feature map is shifted
  kind: vector
  notes: Components $v_1, v_2$ are the shifts along the two spatial axes.
- macro: \TreatedNeighborFraction
  latex: e
  definition: fraction of one user's recorded connections that receive the treatment, its network exposure
  kind: scalar
  unit: dimensionless
  notes: Written $e_i$.
- macro: \TreatmentAssignment
  latex: w
  definition: treatment assignment of one experimental unit, one if treated and zero for control
  kind: scalar
  unit: dimensionless
- macro: \TreatmentConversionRate
  latex: \hat{p}_B
  definition: observed conversion rate of the treatment variant of an A/B test
  kind: scalar
  unit: dimensionless
  notes: Estimated from \TreatmentSampleSize observations.
- macro: \TreatmentSampleSize
  latex: m_B
  definition: number of observations in the treatment variant of an A/B test
  kind: count
- macro: \TrueLabelComponent
  latex: y
  definition: one entry of an example's true label, such as the one-hot target for one class or a scalar
    regression target
  kind: scalar
  unit: dimensionless
  notes: Entry of \LabelVector.
- macro: \TrueOutcome
  latex: Y
  definition: true binary outcome of a randomly drawn individual, such as whether an applicant repays,
    one for the positive class
  kind: scalar
  unit: dimensionless
  notes: Random variable paired with $\PredictedDecision$ in group-fairness criteria; a particular value
    is $\TrueOutcomeLevel$.
- macro: \TrueOutcomeLevel
  latex: v
  definition: one value of a binary true outcome, zero or one, on which a fairness condition is evaluated
  kind: index
  notes: Ranges over $\{0,1\}$ in $Y=y$; the random variable is $\TrueOutcome$.
- macro: \TruncatedKeyApproximation
  latex: \hat{\mathbf{K}}_r
  definition: rank-r truncated singular value decomposition approximation of a key activation matrix,
    the optimal approximation of that rank in spectral and Frobenius norm
  kind: matrix
  notes: The rank $r$ is \TruncationRank, baked into the LaTeX; written with the layer index $\hat{\mathbf{K}}_r^{(\ell)}$.
- macro: \TruncatedKeyLeftSingularMatrix
  latex: \mathbf{U}_r
  definition: matrix of the first r left singular vectors of a key activation matrix
  kind: matrix
  notes: Truncation of \KeyLeftSingularMatrix to \TruncationRank columns, baked into the LaTeX.
- macro: \TruncatedKeyRightSingularMatrix
  latex: \mathbf{V}_r
  definition: matrix of the first r right singular vectors of a key activation matrix
  kind: matrix
  notes: Truncation of \KeyRightSingularMatrix to \TruncationRank columns, baked into the LaTeX.
- macro: \TruncatedKeySpectrumMatrix
  latex: \mathbf{\Sigma}_r
  definition: diagonal matrix of the r largest singular values of a key activation matrix
  kind: matrix
  notes: Leading block of \KeySingularSpectrumMatrix of size \TruncationRank, baked into the LaTeX.
- macro: \TruncationRank
  latex: r
  definition: number of leading singular components a truncated singular value decomposition keeps
  kind: count
  notes: $0\le r\le$ \KeySpectrumLength. Not \AdapterRank, the rank of a low-rank adapter update.
- macro: \TuckerCoreTensor
  latex: \mathcal{G}
  definition: small dense core tensor of a Tucker decomposition, multiplied along each mode by a factor
    matrix
  kind: matrix
  render_exception: Tensor-decomposition literature writes higher-order tensors as calligraphic capitals.
- macro: \UnfoldedConvolutionOutput
  latex: \mathbf{Y}_{\text{col}}
  definition: convolution output computed as the im2col product of the unfolded patch matrix and the flattened
    filter
  kind: vector
  notes: $\mathbf{Y}_{\text{col}} = \mathbf{X}_{\text{col}} \mathbf{w}_{\text{col}}$; one entry per output
    position.
- macro: \UnfoldedPatchMatrix
  latex: \mathbf{X}_{\text{col}}
  definition: matrix im2col builds by flattening each receptive-field patch of the input into one row
  kind: matrix
  notes: Input pixels appear in up to $K^2$ rows.
- macro: \UniformDistribution
  latex: \mathcal{U}
  definition: uniform distribution over the set or interval given as its argument
  kind: distribution
  notes: Discrete over a step range in diffusion training; continuous over [0, 1] in flow matching. Not
    the admissible control set, which several vol4 chapters also write as a calligraphic U.
- macro: \UnlabeledPool
  latex: U
  definition: pool of unlabeled candidate samples an active learner scores to choose what to label
  kind: set
  notes: 'render_exception needed: active-learning literature writes the unlabeled pool as italic U. Its
    size is $|U|$.'
  render_exception: Active-learning literature writes the unlabeled pool as a plain italic U.
- macro: \UnscaledAttentionScoreMatrix
  latex: \mathbf{A}
  definition: matrix of raw query-key dot products of one attention head, one row per query, before scaling
    and softmax
  kind: matrix
  notes: $\mathbf{A} = \mathbf{Q}\mathbf{K}^T$, sequence length by sequence length. Not \AttentionWeightMatrix
    (the softmax of the scaled scores), which shares the glyph.
- macro: \UnsquashedLatentAction
  latex: \mathbf{u}
  definition: unbounded latent action sampled from a squashed-Gaussian policy before the tanh squashing
    that bounds it
  kind: vector
  notes: The action is $\ContinuousActionVector = \tanh(\UnsquashedLatentAction)$. Not \NominalControlCommand,
    which also renders bold u.
- macro: \UpdatedModelParameters
  latex: \theta_{\text{new}}
  definition: model parameters after one optimizer update
  kind: vector
  notes: Italic theta like \ModelParameters.
  render_exception: theta stays italic as the conventional parameter-vector glyph, as in \ModelParameters.
- macro: \UpdatedParameterSubset
  latex: \theta_{\text{updated}}
  definition: subset of the model parameters a few-shot adaptation policy allows to change
  kind: vector
  notes: 'render_exception: kept non-bold as the chapter renders it today; a vector written in plain italic
    by the field convention of the surrounding derivation. Its size is compared with \ModelParameters.'
  render_exception: Machine learning writes the parameter vector as a plain theta, never bold.
- macro: \UpdatedSoftmaxRunningMaximum
  latex: m'
  definition: running maximum of an online softmax after a new block of scores has been seen, replacing
    the previous running maximum
  kind: scalar
  unit: dimensionless
  notes: Paired with $\SoftmaxRunningMaximum$; accumulated sums are rescaled by $e^{m - m'}$ when the
    maximum rises. The prime marks the updated value, not a derivative. The algorithm appendix writes
    the same quantity as $m^{\text{new}}$.
- macro: \UpstreamGradientElement
  latex: \bar{y}
  definition: one element of the upstream gradient vector
  kind: scalar
  unit: dimensionless
  notes: Always indexed, $v_j$.
- macro: \UpstreamGradientVector
  latex: \mathbf{v}
  definition: gradient of the loss with respect to an operation's output, passed backward into it
  kind: vector
- macro: \UserConnectionSet
  latex: \mathcal{N}
  definition: set of users recorded as connected to one user in the social or interaction graph
  kind: set
  notes: Written $\mathcal{N}_i$. Not \GaussianDistribution, which shares the glyph.
- macro: \ValidationDataset
  latex: \mathcal{D}_{\text{val}}
  definition: held-out validation dataset of input-label pairs on which a model is scored
  kind: set
- macro: \ValidationLoss
  latex: \mathcal{L}_{\text{val}}
  definition: loss a trained model incurs on held-out validation data
  kind: function
  notes: Outer objective of the neural architecture search problem.
- macro: \VariationalDistribution
  latex: q_\phi
  definition: tractable distribution, with variational parameters phi, fitted to approximate an intractable
    posterior by maximizing the evidence lower bound
  kind: distribution
  notes: The CVAE encoder \CvaeRecognitionEncoder is one instance, over a latent style variable.
- macro: \VariationalParameters
  latex: \phi
  definition: parameters of a variational distribution, adjusted to maximize the evidence lower bound
  kind: vector
  notes: Italic phi for a parameter collection, as for \ModelParameters.
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \VectorAngle
  latex: \phi
  definition: angle between two vectors in the geometric form of their dot product
  kind: scalar
  unit: rad
- macro: \WarmupEpochCount
  latex: N_{\text{warmup}}
  definition: number of epochs a curriculum takes to ramp from the easiest samples to the full dataset
  kind: count
  notes: Under linear pacing the warmup serves about half the samples of full-data epochs.
- macro: \WarmupStepCount
  latex: W
  definition: number of initial optimizer steps over which learning-rate warmup ramps the rate from its
    base to its scaled value
  kind: count
  notes: Not \WarmupEpochCount, which counts curriculum epochs.
- macro: \WeightMatrix
  latex: \mathbf{W}
  definition: matrix of learned weights one layer multiplies its input by, or the kernel tensor of a convolution
    layer
  kind: matrix
  notes: A subscript names the layer ($\mathbf{W}_1$). Entries are $\WeightMatrixEntry$.
- macro: \WeightMatrixColumnCount
  latex: n
  definition: number of columns of a layer's weight matrix
  kind: count
  notes: Pairs with \WeightMatrixRowCount.
- macro: \WeightMatrixEntry
  latex: W_{ij}
  definition: entry in row i and column j of a weight matrix
  kind: scalar
  unit: dimensionless
  notes: Italic because it is a scalar; the matrix is $\WeightMatrix$.
- macro: \WeightMatrixRowCount
  latex: m
  definition: number of rows of a layer's weight matrix
  kind: count
  notes: Pairs with \WeightMatrixColumnCount; a dense matrix stores $m \times n$ weights.
- macro: \WeightPenaltyStrength
  latex: \lambda_{\text{reg}}
  definition: coefficient that scales an l1 or l2 penalty on weight magnitude added to the training loss,
    equivalent to weight decay under plain gradient descent
  kind: scalar
  unit: dimensionless
  notes: The reg subscript keeps it apart from the bare $\lambda$ of \RegularizationWeight and \ComponentFailureRate;
    it multiplies $\sum w^2$ or $\sum \lvert w \rvert$ over the model weights.
- macro: \WeightQuantizationScale
  latex: s_W
  definition: quantization scale of a layer's weight tensor
  kind: scalar
  unit: varies
  notes: 'Unit: units of the weights per integer step.'
- macro: \WeightRangeBound
  latex: W_{\text{max}}
  definition: largest weight magnitude a serving-time range check accepts, set from the distribution of
    the trained weights
  kind: scalar
  unit: dimensionless
  notes: A weight $\ModelWeight$ with $|\ModelWeight|$ above it is flagged as corrupted. Same units as
    the weights.
- macro: \WeightVector
  latex: \mathbf{w}
  definition: weight vector of one neuron, one weight per input
  kind: vector
  notes: One column of \WeightMatrix.
- macro: \WidthMultiplier
  latex: w_{\text{mult}}
  definition: channel count of a scaled model relative to its base model
  kind: scalar
  unit: dimensionless
- macro: \WidthScalingRatio
  latex: \beta
  definition: ratio by which compound scaling multiplies network width for each unit of the scaling coefficient
  kind: scalar
  unit: dimensionless
- macro: \WorkedTraceProduct
  latex: c
  definition: output of the reverse-mode worked example, the product of its two intermediates
  kind: scalar
  unit: dimensionless
- macro: \WorkedTraceProductAdjoint
  latex: \bar{c}
  definition: reverse-mode adjoint of the worked example output, seeded to one
  kind: scalar
  unit: dimensionless
- macro: \WorkedTraceSine
  latex: b
  definition: intermediate equal to the sine of the input in the reverse-mode worked example
  kind: scalar
  unit: dimensionless
- macro: \WorkedTraceSineAdjoint
  latex: \bar{b}
  definition: reverse-mode adjoint of the sine intermediate in the worked example
  kind: scalar
  unit: dimensionless
- macro: \WorkedTraceSquare
  latex: a
  definition: intermediate equal to the square of the input in the reverse-mode worked example
  kind: scalar
  unit: dimensionless
- macro: \WorkedTraceSquareAdjoint
  latex: \bar{a}
  definition: reverse-mode adjoint of the square intermediate in the worked example
  kind: scalar
  unit: dimensionless
- macro: \ZeroEntryIndicator
  latex: \mathbf{1}_{\{(\mathbf{W}_{\text{sparse}})_{ij} = 0\}}
  definition: indicator over a sparse weight matrix that is one at each exactly-zero entry
  kind: matrix
  notes: Its $\ell_0$ norm over $m \times n$ gives \SparsityRatio.
- macro: \ZeroMatrix
  latex: \mathbf{0}
  definition: matrix or vector whose entries are all zero
  kind: matrix
  notes: A constant; see questions (candidate for exempt.yaml beside \mathbb{1}).
- macro: \ZeroVector
  latex: \mathbf{0}
  definition: vector whose entries are all zero, such as the mean of zero-centered Gaussian noise
  kind: vector
  notes: Companion of $\AllOnesVector$. Its dimension follows from context.
