  kind: matrix
- macro: \ColumnModeFactorSlice
  latex: \mathbf{b}
  definition: row of the column-mode factor matrix for one column index, holding its weight on every rank
    component
  kind: vector
  notes: Indexed $\mathbf{v}_j$.
- macro: \CommonPositionShift
  latex: \Delta
  definition: number of positions by which a query and a key are both shifted, as when a packed example
    sits at an offset
  kind: count
  notes: Rotary embeddings satisfy $\mathbf{R}_{i+\CommonPositionShift}^T\mathbf{R}_{j+\CommonPositionShift}=\mathbf{R}_i^T\mathbf{R}_j$
    for any $\CommonPositionShift$.
- macro: \ComparedPeriodAccuracy
  latex: a
  definition: accuracy of a model over one of two compared periods, indexed 1 for the baseline and 2 after
    drift
  kind: scalar
  unit: dimensionless
  notes: Inputs of the unpooled two-proportion sample size, written $a_1$ and $a_2$.
- macro: \ComparisonSampleEmpiricalCdf
  latex: G_{m}
  definition: empirical cumulative distribution function of the second of two samples a two-sample Kolmogorov-Smirnov
    test compares, the sample of size m
  kind: function
  notes: Pairs with $\ReferenceSampleEmpiricalCdf$ ($F_n$). Generic counterpart of $\ServingEmpiricalCdf$.
    The subscript is the sample size $\ComparisonSampleSize$.
- macro: \ComparisonSampleSize
  latex: m
  definition: number of observations in the second of the two samples a two-sample drift test compares
  kind: count
  notes: The first sample's size is $\DriftTestSampleSize$ ($n$); the KS rejection threshold scales as
    $\sqrt{(n+m)/(nm)}$.
- macro: \CompetingKeyCount
  latex: n
  definition: number of keys other than the target key that one attention query normalizes over
  kind: count
  notes: Upper limit of the normalizer sum in the attention-dilution model; growing it at fixed logits
    depresses $\TargetKeyAttentionWeight$.
- macro: \CompetingKeyLogit
  latex: z
  definition: scaled query-key logit of one key other than the target in one attention head
  kind: scalar
  unit: dimensionless
  notes: Indexed by key, $\CompetingKeyLogit_j = \QueryVector\cdot\KeyVector_j/\sqrt{\AttentionHeadDimension}$.
    Each adds a positive $e^{\CompetingKeyLogit_j}$ to the softmax normalizer.
- macro: \ComposedFunctionInput
  latex: x
  definition: input of a composition of layer functions
  kind: scalar
  unit: dimensionless
- macro: \ComposedFunctionOutput
  latex: y
  definition: output of a composition of layer functions, whose derivative the chain rule computes
  kind: scalar
  unit: dimensionless
- macro: \ComposedMechanismCount
  latex: k
  definition: number of differentially private mechanism applications whose privacy loss is composed,
    such as the training steps of a DP-SGD run
  kind: count
  notes: For DP-SGD with Poisson sampling, $k = \EpochCount \cdot \DatasetSize / \BatchSize$. Not top-k
    $\TopClassCount$.
- macro: \CompoundScalingCoefficient
  latex: \phi
  definition: exponent that sets how much compute compound scaling adds to a base model
  kind: scalar
  unit: dimensionless
- macro: \CompressedOnlyCorrectCount
  latex: n_{\text{comp}}
  definition: number of evaluation examples the compressed model classifies correctly and the baseline
    model gets wrong
  kind: count
  notes: The other discordant count in McNemar's paired test.
- macro: \ComputationalGraph
  latex: G
  definition: computational graph that evaluates a function, a pair of nodes and edges
  kind: record
- macro: \ComputeBudgetConstraint
  latex: g
  definition: constraint function that is zero when training compute, six times parameters times tokens,
    equals the fixed budget
  kind: function
  notes: Not a gradient or a LogP gap.
- macro: \ComputeConstrainedLagrangian
  latex: \mathcal{L}_{\text{Lagrange}}
  definition: Lagrangian of minimizing scaling-law loss over parameters and tokens at a fixed training
    compute budget
  kind: function
  notes: Reducible loss plus the multiplier times the compute constraint; not a training loss.
- macro: \ComputeConstraintMultiplier
  latex: \lambda
  definition: Lagrange multiplier attached to the fixed training compute budget in the compute-optimal
    allocation
  kind: scalar
  unit: varies
  notes: 'Its value is the marginal loss reduction per extra FLOP at the optimum. Not a regularization
    weight or a failure rate. Unit: loss per FLOP.'
- macro: \ComputeOptimalTokenCount
  latex: D_{\text{opt}}
  definition: number of training tokens that minimizes loss for a fixed compute budget
  kind: count
  notes: Grows as the square root of compute when parameters and tokens scale together.
- macro: \ConditionalDistribution
  latex: p(y \mid x)
  definition: probability distribution of the label given an input, the input-to-label relationship that
    concept drift changes
  kind: distribution
  notes: Pairs with $\InputDistribution$ in the drift taxonomy (covariate shift changes $\InputDistribution$
    and keeps this fixed). $\TrainingDistribution$ and $\CurrentDistribution$ name the whole data distribution
    at training time and in service.
  render_exception: The label-given-input distribution p(y \mid x) is one named quantity of the drift
    taxonomy (concept drift changes it), defined by its arguments rather than evaluated at others.
- macro: \ConditioningTokenPrefix
  latex: x
  definition: token prefix a language-model policy conditions on when choosing the next token, such as
    the context delivered before one sampled token of a rollout
  kind: record
  notes: Written without a position index; \TokenPrefix ($x_{<t}$) is the same prefix written relative
    to a position.
- macro: \ConfidenceCalibrationDataset
  latex: \mathcal{D}_{\text{cal}}
  definition: held-out labeled examples on which a post-hoc confidence calibration, such as a softmax
    temperature, is fitted
  kind: set
  notes: Not \CalibrationDataset, the examples used to set quantization ranges.
- macro: \ConfidenceCriticalQuantile
  latex: z_{\alpha/2}
  definition: positive standard-Normal critical value for a two-sided test at the chosen confidence level
  kind: scalar
  unit: dimensionless
  notes: About 1.96 at 95 percent confidence.
- macro: \ConformalQuantileRank
  latex: k_{\epsilon}
  definition: position, among the calibration scores sorted in ascending order, of the score that becomes
    the conformal prediction threshold
  kind: index
  notes: Equals $\lceil(n_{\text{cal}}+1)(1-\ConformalMiscoverageRate)\rceil$ capped at $n_{\text{cal}}$;
    the threshold is the order statistic $s_{(k_{\epsilon})}$.
- macro: \ConformalScoreQuantile
  latex: \widehat{q}_{1-\epsilon}
  definition: nonconformity-score threshold calibrated on held-out data, the finite-sample corrected one-minus-miscoverage
    quantile of the calibration scores
  kind: scalar
  unit: dimensionless
  notes: Equals the order statistic $s_{(k_{\epsilon})}$ at rank $\ConformalQuantileRank$. The level subscript
    uses the glyph of $\ConformalMiscoverageRate$ so the formula reads consistently; the chapter rendered
    it with the significance-level glyph $\alpha_{\text{sig}}$. In the units of the score.
- macro: \ConservativePenaltyWeight
  latex: \alpha_{\text{CQL}}
  definition: weight of the conservative penalty that pushes down values of unsupported actions in conservative
    Q-learning
  kind: scalar
  unit: dimensionless
- macro: \ConservativeSamplingDistribution
  latex: \mu
  definition: action distribution from which the conservative Q-learning regularizer samples actions whose
    values it pushes down
  kind: distribution
  notes: Not \LatentGaussianPolicyDensity or \CoulombFrictionCoefficient.
- macro: \ConstraintLagrangeMultiplier
  latex: \lambda
  definition: Lagrange multiplier attached to an inequality constraint in constrained optimization, nonnegative
    and nonzero only when the constraint is active
  kind: scalar
  unit: varies
  notes: Unit is the objective unit per unit of the constraint. Not \ComputeConstraintMultiplier, which
    is specific to the compute budget.
- macro: \ContinuousFactorialFunction
  latex: \Gamma
  definition: Euler's gamma function, the continuous extension of the factorial
  kind: function
  notes: $\Gamma(z)=\int_0^\infty u^{z-1}e^{-u}du$, with $\Gamma(z+1)=z\Gamma(z)$. Not \CapabilityGrant.
- macro: \ContinuousOutcome
  latex: \mathbf{x}
  definition: value of a continuous random vector, such as a physical state, at which its probability
    density is evaluated or integrated
  kind: vector
  notes: The random variable itself is \ContinuousRandomVariable.
- macro: \ContinuousRandomVariable
  latex: \mathbf{X}
  definition: continuous random variable, such as a physical state, described by a probability density
  kind: record
  notes: Its values are written \ContinuousOutcome; pairs with \DiscreteRandomVariable.
- macro: \ControlConversionRate
  latex: \hat{p}_A
  definition: observed conversion rate of the control variant of an A/B test
  kind: scalar
  unit: dimensionless
  notes: Estimated from \ControlSampleSize observations.
- macro: \ControlSampleSize
  latex: m_A
  definition: number of observations in the control variant of an A/B test
  kind: count
- macro: \ConvolutionActivation
  latex: H
  definition: activation at one spatial position and channel of a convolution layer's feature map
  kind: scalar
  unit: dimensionless
  notes: Written $H^{(\ell)}_{i,j,k}$. Not feature-map height, which is $H_{\text{img}}$.
- macro: \CookedTokenKeyVector
  latex: \mathbf{k}_{\text{cooked}}
  definition: key vector of the token "cooked" in the chef-cooked-the-meal example
  kind: vector
  notes: Example-specific label.
- macro: \CookedTokenQueryVector
  latex: \mathbf{q}_{\text{cooked}}
  definition: query vector of the token "cooked" in the chef-cooked-the-meal example
  kind: vector
  notes: Example-specific label.
- macro: \CoresetBudget
  latex: K
  definition: number of examples a coreset selection method is asked to retain
  kind: count
  notes: The selection budget; the realized retained count is $\SubsetDatasetSize$.
- macro: \CorrectClassIndex
