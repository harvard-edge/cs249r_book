# Notation registry: learning
# Machine learning: data, models, training, loss, and degradation of deployed models.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AcceptedInputSet
  latex: \mathcal{A}_{\tau}
  definition: set of inputs a selective predictor accepts, those whose acceptance score reaches the threshold
  kind: set
  notes: Coverage is $\Pr(x \in \mathcal{A}_{\tau})$ and selective risk the mean loss over it. The subscript
    is $\ResponseThreshold$. Calligraphic because it is a set (the chapter wrote italic $A_\tau$).
- macro: \AccumulationStepCount
  latex: k
  definition: number of micro-batches whose gradients are accumulated before one optimizer update
  kind: count
- macro: \AccuracyAfterDeployment
  latex: \text{Accuracy}
  definition: model accuracy after the model has been in service for time t since deployment or its last
    retraining
  kind: scalar
  unit: dimensionless
  notes: Left-hand side of the degradation equation, $\AccuracyAtTime \approx \InitialAccuracy - \FittedSensitivity
    \cdot \StatisticalDivergence$; it starts at $\InitialAccuracy$.
  aliases:
  - \AccuracyAtTime
- macro: \AccuracyDecayRate
  latex: \gamma
  definition: fitted rate at which deployed model accuracy decays exponentially with time since deployment
    or last retraining
  kind: scalar
  unit: 1/day
  notes: Time-domain summary of the degradation equation, $\text{Accuracy}(t) = \text{Accuracy}_0 e^{-\gamma
    t}$; half-life $\ln 2/\gamma$. Not the LayerNorm scale or the distillation weight.
- macro: \AccuracyPayoffPerQuery
  latex: V
  definition: monetary value of one query per unit change in accuracy fraction
  kind: scalar
  unit: USD/query
  notes: V/100 is the value of one percentage point per query; the retraining decision's Value per Point
    is this priced over a horizon.
- macro: \ActivationFunction
  latex: f
  definition: activation function of a neuron or layer, applied element-wise to the preactivation
  kind: function
  notes: A layer superscript names the layer (f^{(l)}); f' is its derivative. The whole-network map is
    \ModelPredictor.
- macro: \ActivationInput
  latex: x
  definition: scalar argument an activation function is applied to in its defining formula
  kind: scalar
  unit: dimensionless
  notes: In a network this argument is the neuron's preactivation \NeuronPreactivation; the activation-function
    definitions write it x.
- macro: \ActivationLipschitzBound
  latex: L_{\phi}
  definition: bound on the absolute slope of an activation function over the input domain, its Lipschitz
    constant
  kind: scalar
  unit: dimensionless
  notes: Indexed by layer. One for ReLU and Tanh; about 1.1289 for exact GeLU.
- macro: \ActivationMatrix
  latex: \mathbf{A}
  definition: activation matrix of one layer for a batch, one example per row
  kind: matrix
  notes: Not \ActionChunk, which shares the glyph, nor the generic GEMM operand A of hardware chapters.
- macro: \ActivationVector
  latex: \mathbf{a}
  definition: activation vector of one layer for one example
  kind: vector
  notes: Batched form is \ActivationMatrix.
- macro: \ActiveParameterCount
  latex: P_{\text{model}}
  definition: number of model parameters each token's forward pass uses, all parameters for a dense model
    and the active ones for a mixture of experts
  kind: count
  notes: Not $\Parameters$, the total parameter count.
- macro: \ActorUpdateDelayCount
  latex: d
  definition: number of critic updates between successive actor and target-network updates in delayed
    policy updates
  kind: count
  notes: Typically 2 in TD3.
- macro: \AdamFirstMoment
  latex: m
  definition: per-parameter exponential moving average of gradients that Adam keeps, its first moment
  kind: scalar
  unit: varies
  notes: 'Indexed by optimizer step, $m_t$; one persistent state tensor. Unit: loss per parameter unit.'
- macro: \AdamMomentDecayRate
  latex: \beta
  definition: exponential decay factor of an Adam moment estimate, between zero and one
  kind: scalar
  unit: dimensionless
  notes: Subscript 1 for the first moment, 2 for the second. Not the link bandwidth $\LinkBandwidth$.
- macro: \AdamSecondMoment
  latex: v
  definition: per-parameter exponential moving average of squared gradients that Adam keeps, its second
    moment
  kind: scalar
  unit: varies
  notes: 'Indexed by optimizer step, $v_t$; one persistent state tensor. Unit: squared loss per parameter
    unit.'
- macro: \AdaptedHiddenActivation
  latex: \mathbf{h}'
  definition: hidden representation after a residual adapter's output is added to it
  kind: vector
  notes: A prime on a quantity is a new symbol (README); this entry carries it.
- macro: \AdaptedWeightMatrix
  latex: \mathbf{W}_{\text{adapted}}
  definition: weight matrix in use during adaptation, the frozen weights plus the current low-rank update
  kind: matrix
  notes: See \MergedWeightMatrix for the copy folded for serving.
- macro: \AdapterActivationFunction
  latex: \sigma
  definition: element-wise nonlinearity between a residual adapter's down-projection and up-projection
  kind: function
  notes: General \ActivationFunction renders f; this one renders sigma as the adapter literature writes
    it.
- macro: \AdapterAssignmentVector
  latex: \mathbf{m}
  definition: integer vector whose entry for each request of a batch is the identifier of the adapter
    that request uses
  kind: vector
- macro: \AdapterDownProjectionMatrix
  latex: \mathbf{A}
  definition: first low-rank adapter matrix, which projects a layer's input down to the adapter rank,
    the LoRA down-projection
  kind: matrix
  notes: Written $\AdapterDownProjectionMatrix_k$ for adapter $k$ in multi-adapter serving. Pairs with
    $\AdapterUpProjectionMatrix$; the low-rank update is their product.
- macro: \AdapterIndex
  latex: k
  definition: identifier of one low-rank adapter among those a multi-tenant server holds
  kind: index
  notes: Written $k(i)$ for the adapter assigned to request $i$.
- macro: \AdapterInitializationStandardDeviation
  latex: \sigma
  definition: standard deviation of the Gaussian from which a low-rank adapter's down-projection is initialized
  kind: scalar
  unit: dimensionless
- macro: \AdapterRank
  latex: r
  definition: rank of a low-rank adapter update, equivalently the bottleneck width of a residual adapter,
    which sets its trainable parameter count
  kind: count
  notes: Written $\AdapterRank_k$ for adapter $k$ in multi-adapter serving.
- macro: \AdapterScalingFactor
  latex: \gamma
  definition: fixed scaling factor a low-rank adapter's output is multiplied by, divided by the adapter
    rank
  kind: scalar
  unit: dimensionless
  notes: Written $\AdapterScalingFactor_k$ for adapter $k$.
- macro: \AdapterUpProjectionMatrix
  latex: \mathbf{B}
  definition: second low-rank adapter matrix, which projects the rank-sized intermediate up to the layer's
    output width, the LoRA up-projection
  kind: matrix
  notes: Written $\AdapterUpProjectionMatrix_k$ for adapter $k$ in multi-adapter serving. Pairs with $\AdapterDownProjectionMatrix$.
- macro: \AdjacentNeighboringDataset
  latex: X'
  definition: neighboring copy of a differential privacy input dataset that differs from it in exactly
    one record
  kind: record
  notes: Pairs with $\NeighboringDataset$ ($X$) in the differential privacy definition; the prime marks
    the neighbor, not a derivative.
- macro: \AdjacentQueryResult
  latex: v'
  definition: value a query returns on the adjacent dataset of a neighboring pair, before any noise is
    added
  kind: scalar
  unit: varies
  notes: Partner of $\DatasetQueryResult$, which the query returns on $\NeighboringDataset$; this is its
    value on $\AdjacentNeighboringDataset$, and the sensitivity bounds $|\DatasetQueryResult - \AdjacentQueryResult|$.
    Units are those of the query.
- macro: \AdversarialExample
  latex: x_{\text{adv}}
  definition: adversarial example, an input an attacker forms by adding a bounded perturbation to a clean
    input so the model mispredicts
  kind: record
  notes: Equals $\ModelInput + \AdversarialPerturbation$ with the perturbation bounded by $\AdversarialPerturbationBudget$.
- macro: \AdversarialPenaltyWeight
  latex: \lambda_{\text{adv}}
  definition: weight of the adversary loss relative to the task loss in an adversarial debiasing objective
  kind: scalar
  unit: dimensionless
  notes: Larger values push the encoder harder to remove protected-attribute signal.
- macro: \AdversaryLoss
  latex: \mathcal{L}_{\text{adv}}
  definition: loss an adversary head minimizes when predicting a protected attribute from a model's latent
    representation
  kind: function
  notes: Subtracted, weighted by $\AdversarialPenaltyWeight$, in $\DebiasingTotalLoss$.
- macro: \AffineOffset
  latex: b
  definition: additive offset of an affine scaling step applied elementwise to a tensor
  kind: scalar
  unit: dimensionless
  notes: Not $\GemmAccumulatorScale$ and not $\LinkBandwidth$.
- macro: \AffineScale
  latex: s
  definition: multiplicative factor of an affine scaling step applied elementwise to a tensor
  kind: scalar
  unit: dimensionless
  notes: Not $\GemmProductScale$.
- macro: \AiStandaloneSensitivity
  latex: S_{\text{AI}}
  definition: fraction of actual positives, such as tumors, that the AI assistant detects on its own
  kind: scalar
  unit: dimensionless
  notes: Its miss probability $1 - S_{\text{AI}}$ times $\MissAcceptanceProbability$ bounds the accepted-miss
    failure probability.
- macro: \AllOnesVector
  latex: \mathbf{1}
  definition: vector whose entries are all one, used to sum over a dimension
  kind: vector
  notes: Not the indicator \mathbb{1}, which is exempt.
- macro: \AlternateModelInput
  latex: x'
  definition: any second input compared with a model input, as in a Lipschitz bound over pairs of inputs
  kind: record
  notes: The prime belongs to the glyph, so the conversion replaces the whole $x'$. Not the adversarial
    example $\AdversarialExample$.
- macro: \AmbientDimension
  latex: D
  definition: number of dimensions of the Euclidean space a ball or a collection of embedding vectors
    lives in
  kind: count
  notes: Appears as $\mathbb{R}^D$ and as the limit $D\to\infty$. Not \DatasetSize, which the notation
    chapter assigns to bare $D$; a book row should note the local exception.
- macro: \AnnualQueryVolume
  latex: Q_{\text{annual}}
  definition: number of queries a deployed model serves in one year
  kind: count
  notes: The yearly counterpart of \DailyQueryVolume.
- macro: \AnonymitySetSize
  latex: k_{\text{anon}}
  definition: smallest number of records that share every quasi-identifier value in a k-anonymous release
  kind: count
  notes: Each record is indistinguishable from at least $k-1$ others.
- macro: \ApproximatingDistribution
  latex: q
  definition: distribution the code is built for, the second argument of a KL divergence
  kind: distribution
  notes: Pairs with \ReferenceDistribution.
- macro: \ArchitectureResourceCost
  latex: C
  definition: resource cost of a candidate architecture, such as its latency or memory, that a search
    constrains
  kind: function
- macro: \ArchitectureSearchSpace
  latex: \mathcal{A}
  definition: set of candidate architectures a neural architecture search may choose from
  kind: set
- macro: \ArtifactVersion
  latex: v
  definition: immutable version identifier, such as a content hash, that pins one version of a code, data,
    configuration or environment artifact
  kind: index
  notes: Written as a subscript on a named artifact, $\text{Data}_v$. Not a speed or velocity.
- macro: \AttentionHeadCount
  latex: N_{\text{heads}}
  definition: number of attention heads in one multi-head attention layer
  kind: count
  notes: Query heads. Grouped-query and multi-query attention share keys and values across fewer heads,
    $\KvHeadCount$. Standard multi-head attention splits the hidden width as $\HiddenDimension = \AttentionHeadCount
    \cdot \AttentionHeadDimension$.
  aliases:
  - \NumberOfAttentionHeads
- macro: \AttentionHeadDimension
  latex: d_{\text{head}}
  definition: width of the query, key and value vectors in one attention head
  kind: count
  notes: Sets the $1/\sqrt{\AttentionHeadDimension}$ scaling of attention scores. Equals $\HiddenDimension/\AttentionHeadCount$
    in standard multi-head attention, and the full hidden width when a single head is discussed.
- macro: \AttentionHeadIndex
  latex: i
  definition: index of one attention head in a multi-head attention layer
  kind: index
- macro: \AttentionHeadOutput
  latex: \mathbf{O}
  definition: output of one attention head before the output projection, the attention weights applied
    to the value matrix
  kind: matrix
  notes: Distinct from the output-projection result of a whole attention layer. FlashAttention accumulates
    it tile by tile with superscripts (1), new for partial and combined results.
- macro: \AttentionKeyMatrix
  latex: \mathbf{K}
  definition: matrix of key vectors, one row per token, in an attention layer
  kind: matrix
- macro: \AttentionOutputMatrix
  latex: \mathbf{O}
  definition: output of an attention layer after the output projection recombines the heads, one row per
    token
  kind: matrix
  notes: Not the operation count $\Operations$ ($O$) and not big-O.
- macro: \AttentionOutputProjectionMatrix
  latex: \mathbf{W}_{O}
  definition: learned matrix that projects the concatenated outputs of all attention heads back to the
    model width
  kind: matrix
- macro: \AttentionQueryMatrix
  latex: \mathbf{Q}
  definition: matrix of query vectors, one row per token, in an attention layer
  kind: matrix
- macro: \AttentionScoreEntry
  latex: S_{ij}
  definition: attention score of query i against key j, one entry of the score matrix
  kind: scalar
  unit: dimensionless
- macro: \AttentionScoreMatrix
  latex: \mathbf{S}
  definition: matrix of attention scores, the scaled dot products of every query with every key before
    the softmax
  kind: matrix
- macro: \AttentionScoreRow
  latex: \mathbf{S}_{i, \cdot}
  definition: row of the attention score matrix for one query token, the logits its softmax normalizes
  kind: vector
  notes: Row $i$ of $\AttentionScoreMatrix$. Chapter writes Z today; LaTeX follows $\AttentionScoreMatrix$
    so the two render alike.
- macro: \AttentionScoreSummand
  latex: S_{ik}
  definition: attention score of query i against key k, the term a softmax normalizing sum runs over
  kind: scalar
  unit: dimensionless
- macro: \AttentionScoreTile
  latex: \mathbf{S}_{ij}
  definition: block of attention scores between query tile i and key tile j, computed on chip in tiled
    attention
  kind: matrix
  notes: The full score matrix is S x S; this tile is B_r x B_c.
- macro: \AttentionValuesMatrix
  latex: \mathbf{V}
  definition: matrix of value vectors, one row per token, that attention weights combine into the output
  kind: matrix
  notes: In self-attention $\mathbf{V} = \mathbf{X}\mathbf{W}_V$. The value matrix of attention, not a
    singular-vector factor.
- macro: \AttentionValuesProjectionMatrix
  latex: \mathbf{W}_{V}
  definition: learned matrix that projects token representations into values
  kind: matrix
- macro: \AttentionValuesSourceMatrix
  latex: \mathbf{X}_{V}
  definition: representations attention draws its values from, before a head-specific value projection
  kind: matrix
  notes: Equals $\mathbf{X}$ in self-attention.
- macro: \AttentionValuesVector
  latex: \mathbf{v}
  definition: value vector of one token, one row of the value matrix
  kind: vector
  notes: Indexed by token, $\mathbf{v}_j$.
- macro: \AttentionWeightEntry
  latex: A_{ij}
  definition: attention weight query i places on key j, one entry of the attention weight matrix
  kind: scalar
  unit: dimensionless
- macro: \AttentionWeightMatrix
  latex: \mathbf{A}
  definition: matrix of attention weights, the row-wise softmax of scaled query-key scores
  kind: matrix
  notes: $\mathbf{A} = \text{softmax}(\mathbf{Q}\mathbf{K}^T/\sqrt{\AttentionHeadDimension})$; $\SequenceLength
    \times \SequenceLength$ per head.
- macro: \AttentionWeightVector
  latex: \mathbf{a}
  definition: attention weights one query token places on every key, one row of the attention weight matrix
  kind: vector
  notes: Indexed by query token, $\mathbf{a}_i = \operatorname{softmax}$ of row $i$ of $\AttentionScoreMatrix$;
    one row of $\AttentionWeightMatrix$.
- macro: \AttributionFeatureCount
  latex: n_{\text{feat}}
  definition: number of input features a feature-attribution method assigns contributions to
  kind: count
  notes: Exact Shapley attribution enumerates $2^{n_{\text{feat}}}$ feature subsets. Not $\LayerInputWidth$.
- macro: \AuditGroupRecordCount
  latex: n_{\text{records}}
  definition: number of records from one group in a fairness audit's confusion matrix, the sum of its
    four cells
  kind: count
  notes: Equals TP + FP + FN + TN for the group.
- macro: \AutocorrelationLagIndex
  latex: k
  definition: number of samples separating the two values whose autocorrelation is taken
  kind: index
- macro: \AutoencoderReconstructionError
  latex: \mathcal{L}_{\text{rec}}
  definition: reconstruction error of an autoencoder on one record, the squared distance between the record
    and its reconstruction, used as an anomaly score
  kind: scalar
  unit: varies
  notes: 'Records with error above $\ResponseThreshold$ are quarantined. Unit: squared input units. An
    anomaly score, not proof of poisoning.'
- macro: \BallRadius
  latex: r
  definition: radius of a Euclidean ball, also the radial coordinate when an integral switches to spherical
    coordinates
  kind: scalar
  unit: dimensionless
  notes: Appears as $V_D(r)=r^D V_D(1)$ and as the integration variable in $\int_0^\infty r^{D-1}e^{-r^2}dr$.
    Not \TruncationRank or \WheelRadius.
- macro: \BallVolume
  latex: V_D
  definition: volume of a Euclidean ball in a space of the ambient dimension, as a function of its radius
  kind: function
  notes: $V_D(r)=\pi^{D/2}r^D/\Gamma(D/2+1)$; the dimension \AmbientDimension is baked into the LaTeX.
- macro: \BaseBatchSize
  latex: B_{\text{base}}
  definition: reference batch size at which the base learning rate was tuned
  kind: count
- macro: \BaseLayerCount
  latex: N_{L,0}
  definition: number of layers in the base model before compound scaling
  kind: count
  notes: Base value of \LayerCount.
- macro: \BaseLearningRate
  latex: \eta_{\text{base}}
  definition: learning rate tuned at the reference batch size before linear scaling
  kind: scalar
  unit: dimensionless
- macro: \BaseWidthMultiplier
  latex: w_{\text{mult},0}
  definition: width multiplier of the base model before compound scaling
  kind: scalar
  unit: dimensionless
  notes: Base value of \WidthMultiplier.
- macro: \BaselineConversionRate
  latex: p_0
  definition: conversion rate of the control variant before the change an A/B test evaluates
  kind: scalar
  unit: dimensionless
  notes: An input of the A/B sample-size formula.
- macro: \BaselineFeatureMean
  latex: \mu_{\text{base}}
  definition: mean of the Gaussian fitted to the baseline sample of a monitored feature
  kind: scalar
  unit: varies
  notes: In the units of the feature (log-dollars in the fraud example). Pairs with $\CurrentFeatureMean$
    in the closed-form Gaussian KL divergence. Not $\TrainingFeatureMean$, a cleaning or normalization
    parameter.
- macro: \BaselineFeatureStandardDeviation
  latex: \sigma_{\text{base}}
  definition: standard deviation of the Gaussian fitted to the baseline sample of a monitored feature
  kind: scalar
  unit: varies
  notes: In the units of the feature. Pairs with $\CurrentFeatureStandardDeviation$. Not $\TrainingFeatureStandardDeviation$.
- macro: \BaselineOnlyCorrectCount
  latex: n_{\text{base}}
  definition: number of evaluation examples the baseline model classifies correctly and the compared model
    gets wrong
  kind: count
  notes: One of the two discordant counts in McNemar's paired test.
- macro: \BatchAxisLabel
  latex: b
  definition: einsum index label naming the batch axis of an attention tensor
  kind: index
- macro: \BatchExampleIndex
  latex: n
  definition: position of one example within a training batch whose per-example losses are aggregated
  kind: index
  notes: Written $n$ in the batch loss equations; \ExampleIndex is the same role written $i$.
- macro: \BatchIndex
  latex: k
  definition: position of one batch in the sequence of batches a data loader or runtime delivers
  kind: index
  notes: Outside a subscript, so not covered by the index-letter exemption.
- macro: \BatchLabelComponent
  latex: y_{ij}
  definition: one-hot target indicator for class j on example i of a batch
  kind: scalar
  unit: dimensionless
  notes: Batched form of \TrueLabelComponent.
- macro: \BatchLoss
  latex: \mathcal{L}_{\text{batch}}
  definition: mean loss over the examples of one mini-batch
  kind: scalar
  unit: dimensionless
  notes: Average of the per-example \LossFunction over \BatchSize examples; its gradient is the mini-batch
    gradient.
- macro: \BatchNormIntermediateTensor
  latex: \mathbf{X}''
  definition: intermediate tensor the batch normalization step writes in an unfused chain of elementwise
    operators, read back by the affine scaling step
  kind: matrix
  notes: Second intermediate of the chain that starts at \FusionInputTensor ($\mathbf{X}$) and ends at
    \FusionOutputTensor ($\mathbf{Y}$); kernel fusion removes its write and reread.
- macro: \BatchNormMean
  latex: \mu_{\mathcal{B}}
  definition: mean of one feature's activations over a mini-batch, as batch normalization computes it
  kind: scalar
  unit: dimensionless
- macro: \BatchNormOutput
  latex: y
  definition: activation batch normalization outputs after its learned scale and shift
  kind: scalar
  unit: dimensionless
  notes: $y_i = \gamma \hat{x}_i + \beta$. Not a label.
- macro: \BatchNormRunningMean
  latex: \boldsymbol{\mu}_{\mathcal{B}}
  definition: per-channel running mean of activations that batch normalization stores for inference
  kind: vector
  notes: Fixed after training; distinct from the per-mini-batch mean used during training.
- macro: \BatchNormRunningStandardDeviation
  latex: \boldsymbol{\sigma}_{\mathcal{B}}
  definition: per-channel square root of the running variance plus the numerical stabilizer that batch
    normalization uses at inference
  kind: vector
- macro: \BatchNormStandardDeviation
  latex: \sigma_{\mathcal{B}}
  definition: standard deviation of one feature's activations over a mini-batch
  kind: scalar
  unit: dimensionless
  notes: Squared, it is the batch variance.
- macro: \BatchPredictedProbability
  latex: \hat{y}_{ij}
  definition: predicted probability for class j on example i of a batch
  kind: scalar
  unit: dimensionless
  notes: Batched form of \PredictedOutputComponent.
- macro: \BatchScalingFactor
  latex: k
  definition: factor by which a training recipe multiplies its batch size, the multiplier the linear and
    square-root learning-rate scaling rules apply
  kind: scalar
  unit: dimensionless
  notes: 'Linear rule: $\ScaledLearningRate = k \BaseLearningRate$; square-root rule: $\sqrt{k}\,\BaseLearningRate$.'
- macro: \BatchSize
  latex: B
  definition: number of examples or requests processed together in one step
  kind: count
  notes: Batch size is $B$ throughout the series; bandwidth is $\Bandwidth$, never $B$. Weight bytes loaded
    once are reused across all $\BatchSize$ examples, so arithmetic intensity grows with it.
- macro: \BehaviorCloningLoss
  latex: \mathcal{L}_{\text{BC}}
  definition: behavior-cloning objective, the expected imitation error under the collecting policy's empirical
    state-action occupancy
  kind: function
  notes: Written with the policy parameters, $\mathcal{L}_{\text{BC}}(\ModelParameters)$.
- macro: \BehaviorDistribution
  latex: b
  definition: next-token distribution under which training tokens were actually sampled, such as an older
    policy
  kind: distribution
  notes: Importance weighting by $\NextTokenDistribution/\BehaviorDistribution$ corrects for it at a fixed
    prefix.
- macro: \BellmanBackupTarget
  latex: y
  definition: 'regression target of a critic update: the reward plus the discounted value estimate at
    the next state'
  kind: scalar
  unit: dimensionless
  notes: Clipped double Q-learning takes the smaller of the two target critics.
- macro: \BellmanErrorLoss
  latex: \mathcal{L}_{\text{Bellman}}
  definition: squared Bellman error of a Q-function against its bootstrapped target, the standard critic
    loss
  kind: function
- macro: \BelowThresholdIndicator
  latex: \mathbf{1}_{\{|(\mathbf{W}_{\text{sparse}})_{ij}| \leq \delta_{\text{prune}}\}}
  definition: indicator over a sparse weight matrix that is one at each entry whose magnitude is at or
    below the pruning threshold
  kind: matrix
  notes: Its $\ell_0$ norm over $m \times n$ gives \ThresholdedSparsityRatio.
- macro: \BiasFeedbackFactor
  latex: \alpha_{\text{fb}}
  definition: factor by which a group's disparity is multiplied over one feedback interval, fitted from
    observed disparities
  kind: scalar
  unit: dimensionless
  notes: Above 1 the feedback loop is self-reinforcing; at or below 1 it is stable or damped. Not $\SignificanceLevel$
    or $\MessageStartupLatency$.
- macro: \BiasVector
  latex: \mathbf{b}
  definition: vector of learned biases one layer adds to its weighted sums, one per neuron or output channel
  kind: vector
  notes: Broadcast across the batch. Not the generic second vector of a dot product (a . b) in appendix
    refreshers.
- macro: \BinaryActivationVector
  latex: \mathbf{a}
  definition: vector of binarized activations packed into one machine word
  kind: vector
- macro: \BinaryClassifier
  latex: h
  definition: binary classifier viewed as a function that maps an individual's input to a decision of
    zero or one
  kind: function
  notes: Written with its argument, $\BinaryClassifier(\ModelInput)$; the decision it outputs, as a random
    variable, is $\PredictedDecision$. Not $\BarrierFunction$ or $\InteractionHistory$, which share the
    glyph.
- macro: \BinaryWeightVector
  latex: \mathbf{w}
  definition: vector of binarized weights packed into one machine word
  kind: vector
- macro: \BlockQuantizationScale
  latex: s_b
  definition: quantization scale computed independently for one block of a block-quantized tensor
  kind: scalar
  unit: varies
  notes: 'Unit: units of the quantized tensor per integer step, as for \QuantizationScale, which is the
    tensor-wide scale.'
- macro: \BlockRangeMaximum
  latex: x_{\max,i}
  definition: largest value in one block of a block-wise quantized tensor, the upper end of that block's
    range
  kind: scalar
  unit: varies
  notes: In the units of the quantized tensor. With $x_{\min,i}$ it sets the block's affine scale $s_i$.
- macro: \BlockRangeMinimum
  latex: x_{\min,i}
  definition: smallest value in one block of a block-wise quantized tensor, the lower end of that block's
    range
  kind: scalar
  unit: varies
  notes: In the units of the quantized tensor. With $x_{\max,i}$ it sets the block's affine scale $s_i$.
- macro: \BoxMaximumHorizontalCoordinate
  latex: x_{\text{max}}
  definition: horizontal pixel coordinate of a bounding box's right edge
  kind: scalar
  unit: pixels
- macro: \BoxMaximumVerticalCoordinate
  latex: y_{\text{max}}
  definition: larger vertical pixel coordinate of a bounding box's edges
  kind: scalar
  unit: pixels
- macro: \BoxMinimumHorizontalCoordinate
  latex: x_{\text{min}}
  definition: horizontal pixel coordinate of a bounding box's left edge
  kind: scalar
  unit: pixels
- macro: \BoxMinimumVerticalCoordinate
  latex: y_{\text{min}}
  definition: smaller vertical pixel coordinate of a bounding box's edges
  kind: scalar
  unit: pixels
- macro: \BspLearningRate
  latex: \eta_{\text{BSP}}
  definition: learning rate a bulk-synchronous data-parallel run uses at the same effective batch size
  kind: scalar
  unit: dimensionless
  notes: Reference rate that \StalenessAdjustedLearningRate scales down for stale-synchronous training.
- macro: \CalibrationBinCount
  latex: N_{\text{bins}}
