  kind: index
- macro: \CorrectClassLogit
  latex: z_{c}
  definition: logit of the correct class
  kind: scalar
  unit: dimensionless
  notes: Used in the fused cross-entropy-from-logits form.
- macro: \CorrectClassProbability
  latex: \hat{y}_{c}
  definition: predicted probability of the correct class
  kind: scalar
  unit: dimensionless
  notes: Cross-entropy for a one-hot label reduces to minus its log.
- macro: \CorruptedAttentionScoreMatrix
  latex: \mathbf{S}_{\text{corrupt}}
  definition: pre-softmax attention score matrix computed from a query matrix that silent data corruption
