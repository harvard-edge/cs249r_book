  kind: vector
  notes: Its entries are \SoftmaxOutputProbability.
- macro: \ClassificationThreshold
  latex: \gamma_{\text{cls}}
  definition: score threshold above which a classifier outputs the positive class
  kind: scalar
  unit: dimensionless
  notes: Lowering it raises both true and false positive rates. Not $\ResponseThreshold$, the monitoring
