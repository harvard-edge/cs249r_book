  kind: record
  notes: Neural architecture search returns the best candidate, written with a star.
- macro: \CandidateScoringCost
  latex: c_{\text{infer}}
  definition: cost of running the active model's inference on one candidate sample
  kind: scalar
  unit: USD/sample
