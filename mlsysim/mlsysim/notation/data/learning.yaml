  latex: u
  definition: intermediate variable u = x squared of the scalar chain-rule illustration
  kind: scalar
  unit: dimensionless
  notes: Illustrative only.
- macro: \ChainRuleOutput
  latex: v
  definition: output variable v = 3u of the scalar chain-rule illustration
  kind: scalar
  unit: dimensionless
  notes: Illustrative only; not a label or a network output.
- macro: \ChanceAnnotatorAgreement
  latex: p_e
  definition: share of items on which two annotators would agree by chance, given each annotator's label
    frequencies
  kind: scalar
  unit: dimensionless
  notes: Chance-correction term of Cohen's kappa $\InterAnnotatorAgreement$.
- macro: \ChinchillaIrreducibleLoss
  latex: E
  definition: constant term of Hoffmann et al.'s parametric loss fit, the loss no amount of parameters
    or tokens removes
  kind: scalar
  unit: dimensionless
  notes: Keeps the paper's letter inside the scaling-law derivation, where the section says so; elsewhere
    the irreducible loss is $\IrreducibleLoss$.
- macro: \ClassCount
  latex: K
  definition: number of classes a classifier distinguishes, or vocabulary entries it scores, the length
    of its softmax output
  kind: count
  notes: Not \ContinuationCount or \OutputLength, which share the glyph.
- macro: \ClassIndex
  latex: j
  definition: index of an output class
  kind: index
  notes: Written bare only when the text names the index.
- macro: \ClassProbabilityVector
  latex: \mathbf{p}
  definition: vector of class probabilities over a classifier's classes, nonnegative and summing to one,
