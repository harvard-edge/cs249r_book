# Notation registry: learning
# Machine learning: data, models, training, loss, and degradation of deployed models.
# How to add or change an entry: README.md in this directory.

symbols:
- macro: \AccumulationStepCount
  latex: k
  definition: number of micro-batches whose gradients are accumulated before one optimizer update
  kind: count
- macro: \AccuracyAfterDeployment
  latex: \text{Accuracy}(t)
  definition: model accuracy after the model has been in service for time t since deployment or its last
    retraining
  kind: scalar
  unit: dimensionless
  notes: Left-hand side of the degradation equation, $\AccuracyAtTime \approx \InitialAccuracy - \FittedSensitivity
    \cdot \StatisticalDivergence$; it starts at $\InitialAccuracy$.
  aliases:
  - \AccuracyAtTime
- macro: \AccuracyDecayRate
  latex: \gamma
  definition: fitted rate at which deployed model accuracy decays exponentially with time since deployment
    or last retraining
  kind: scalar
  unit: 1/day
  notes: Time-domain summary of the degradation equation, $\text{Accuracy}(t) = \text{Accuracy}_0 e^{-\gamma
    t}$; half-life $\ln 2/\gamma$. Not the LayerNorm scale or the distillation weight.
- macro: \AccuracyPayoffPerQuery
  latex: V
  definition: monetary value of one query per unit change in accuracy fraction
  kind: scalar
  unit: USD/query
  notes: V/100 is the value of one percentage point per query; the retraining decision's Value per Point
    is this priced over a horizon.
- macro: \ActivationFunction
  latex: f
  definition: activation function of a neuron or layer, applied element-wise to the preactivation
  kind: function
  notes: A layer superscript names the layer (f^{(l)}); f' is its derivative. The whole-network map is
    \ModelPredictor.
- macro: \ActivationInput
  latex: x
  definition: scalar argument an activation function is applied to in its defining formula
  kind: scalar
  unit: dimensionless
  notes: In a network this argument is the neuron's preactivation \NeuronPreactivation; the activation-function
    definitions write it x.
- macro: \ActivationMatrix
  latex: \mathbf{A}
  definition: activation matrix of one layer for a batch, one example per row
  kind: matrix
  notes: Not \ActionChunk, which shares the glyph, nor the generic GEMM operand A of hardware chapters.
- macro: \ActivationVector
  latex: \mathbf{a}
  definition: activation vector of one layer for one example
  kind: vector
  notes: Batched form is \ActivationMatrix.
- macro: \AdamFirstMoment
  latex: m
  definition: per-parameter exponential moving average of gradients that Adam keeps, its first moment
  kind: scalar
  unit: varies
  notes: 'Indexed by optimizer step, $m_t$; one persistent state tensor. Unit: loss per parameter unit.'
- macro: \AdamMomentDecayRate
  latex: \beta
  definition: exponential decay factor of an Adam moment estimate, between zero and one
  kind: scalar
  unit: dimensionless
  notes: Subscript 1 for the first moment, 2 for the second. Not the link bandwidth $\LinkBandwidth$.
- macro: \AdamSecondMoment
  latex: v
  definition: per-parameter exponential moving average of squared gradients that Adam keeps, its second
    moment
  kind: scalar
  unit: varies
  notes: 'Indexed by optimizer step, $v_t$; one persistent state tensor. Unit: squared loss per parameter
    unit.'
- macro: \AdversarialPenaltyWeight
  latex: \lambda_{\text{adv}}
  definition: weight of the adversary loss relative to the task loss in an adversarial debiasing objective
  kind: scalar
  unit: dimensionless
  notes: Larger values push the encoder harder to remove protected-attribute signal.
- macro: \AdversaryLoss
  latex: \mathcal{L}_{\text{adv}}
  definition: loss an adversary head minimizes when predicting a protected attribute from a model's latent
    representation
  kind: function
  notes: Subtracted, weighted by $\AdversarialPenaltyWeight$, in $\DebiasingTotalLoss$.
- macro: \AffineOffset
  latex: \beta
  definition: additive offset of an affine scaling step applied elementwise to a tensor
  kind: scalar
  unit: dimensionless
  notes: Not $\GemmAccumulatorScale$ and not $\LinkBandwidth$.
- macro: \AffineScale
  latex: \alpha
  definition: multiplicative factor of an affine scaling step applied elementwise to a tensor
  kind: scalar
  unit: dimensionless
  notes: Not $\GemmProductScale$.
- macro: \AllOnesVector
  latex: \mathbf{1}
  definition: vector whose entries are all one, used to sum over a dimension
  kind: vector
  notes: Not the indicator \mathbb{1}, which is exempt.
- macro: \AnonymitySetSize
  latex: k
  definition: smallest number of records that share every quasi-identifier value in a k-anonymous release
  kind: count
  notes: Each record is indistinguishable from at least $k-1$ others.
- macro: \ApproximatingDistribution
  latex: q
  definition: distribution the code is built for, the second argument of a KL divergence
  kind: distribution
  notes: Pairs with \ReferenceDistribution.
- macro: \ArchitectureResourceCost
  latex: C
  definition: resource cost of a candidate architecture, such as its latency or memory, that a search
    constrains
  kind: function
- macro: \ArchitectureSearchSpace
  latex: \mathcal{A}
  definition: set of candidate architectures a neural architecture search may choose from
  kind: set
- macro: \ArtifactVersion
  latex: v
  definition: immutable version identifier, such as a content hash, that pins one version of a code, data,
    configuration or environment artifact
  kind: index
  notes: Written as a subscript on a named artifact, $\text{Data}_v$. Not a speed or velocity.
- macro: \AttentionHeadCount
  latex: N_{\text{heads}}
  definition: number of attention heads in one multi-head attention layer
  kind: count
  notes: Query heads. Grouped-query and multi-query attention share keys and values across fewer heads,
    $\KvHeadCount$. Standard multi-head attention splits the hidden width as $\HiddenDimension = \AttentionHeadCount
    \cdot \AttentionHeadDimension$.
  aliases:
  - \NumberOfAttentionHeads
- macro: \AttentionHeadDimension
  latex: d_{\text{head}}
  definition: width of the query, key and value vectors in one attention head
  kind: count
  notes: Sets the $1/\sqrt{\AttentionHeadDimension}$ scaling of attention scores. Equals $\HiddenDimension/\AttentionHeadCount$
    in standard multi-head attention, and the full hidden width when a single head is discussed.
- macro: \AttentionHeadOutput
  latex: \mathbf{O}
  definition: output of one attention head before the output projection, the attention weights applied
    to the value matrix
  kind: matrix
  notes: Distinct from the output-projection result of a whole attention layer. FlashAttention accumulates
    it tile by tile with superscripts (1), new for partial and combined results.
- macro: \AttentionKeyMatrix
  latex: \mathbf{K}
  definition: matrix of key vectors, one row per token, in an attention layer
  kind: matrix
- macro: \AttentionOutputMatrix
  latex: \mathbf{O}
  definition: output of an attention layer after the output projection recombines the heads, one row per
    token
  kind: matrix
  notes: Not the operation count $\Operations$ ($O$) and not big-O.
- macro: \AttentionOutputProjectionMatrix
  latex: \mathbf{W}_{O}
  definition: learned matrix that projects the concatenated outputs of all attention heads back to the
    model width
  kind: matrix
- macro: \AttentionQueryMatrix
  latex: \mathbf{Q}
  definition: matrix of query vectors, one row per token, in an attention layer
  kind: matrix
- macro: \AttentionScoreEntry
  latex: S_{ij}
  definition: attention score of query i against key j, one entry of the score matrix
  kind: scalar
  unit: dimensionless
- macro: \AttentionScoreMatrix
  latex: \mathbf{S}
  definition: matrix of attention scores, the scaled dot products of every query with every key before
    the softmax
  kind: matrix
- macro: \AttentionScoreSummand
  latex: S_{ik}
  definition: attention score of query i against key k, the term a softmax normalizing sum runs over
  kind: scalar
  unit: dimensionless
- macro: \AttentionScoreTile
  latex: \mathbf{S}_{ij}
  definition: block of attention scores between query tile i and key tile j, computed on chip in tiled
    attention
  kind: matrix
  notes: The full score matrix is S x S; this tile is B_r x B_c.
- macro: \AttentionValuesMatrix
  latex: \mathbf{V}
  definition: matrix of value vectors, one row per token, that attention weights combine into the output
  kind: matrix
  notes: In self-attention $\mathbf{V} = \mathbf{X}\mathbf{W}_V$. The value matrix of attention, not a
    singular-vector factor.
- macro: \AttentionValuesProjectionMatrix
  latex: \mathbf{W}_{V}
  definition: learned matrix that projects token representations into values
  kind: matrix
- macro: \AttentionValuesSourceMatrix
  latex: \mathbf{V}
  definition: representations attention draws its values from, before a head-specific value projection
  kind: matrix
  notes: Equals $\mathbf{X}$ in self-attention.
- macro: \AttentionValuesVector
  latex: \mathbf{v}
  definition: value vector of one token, one row of the value matrix
  kind: vector
  notes: Indexed by token, $\mathbf{v}_j$.
- macro: \AttentionWeightEntry
  latex: A_{ij}
  definition: attention weight query i places on key j, one entry of the attention weight matrix
  kind: scalar
  unit: dimensionless
- macro: \AttentionWeightMatrix
  latex: \mathbf{A}
  definition: matrix of attention weights, the row-wise softmax of scaled query-key scores
  kind: matrix
  notes: $\mathbf{A} = \text{softmax}(\mathbf{Q}\mathbf{K}^T/\sqrt{\AttentionHeadDimension})$; $\SequenceLength
    \times \SequenceLength$ per head.
- macro: \AttributionFeatureCount
  latex: n_{\text{feat}}
  definition: number of input features a feature-attribution method assigns contributions to
  kind: count
  notes: Exact Shapley attribution enumerates $2^{n_{\text{feat}}}$ feature subsets. Not $\LayerInputWidth$.
- macro: \BaseBatchSize
  latex: B_{\text{base}}
  definition: reference batch size at which the base learning rate was tuned
  kind: count
- macro: \BaseLayerCount
  latex: N_{L,0}
  definition: number of layers in the base model before compound scaling
  kind: count
  notes: Base value of \LayerCount.
- macro: \BaseLearningRate
  latex: \eta_{\text{base}}
  definition: learning rate tuned at the reference batch size before linear scaling
  kind: scalar
  unit: dimensionless
- macro: \BaseWidthMultiplier
  latex: w_{\text{mult},0}
  definition: width multiplier of the base model before compound scaling
  kind: scalar
  unit: dimensionless
  notes: Base value of \WidthMultiplier.
- macro: \BaselineOnlyCorrectCount
  latex: n_{\text{base}}
  definition: number of evaluation examples the baseline model classifies correctly and the compared model
    gets wrong
  kind: count
  notes: One of the two discordant counts in McNemar's paired test.
- macro: \BatchAxisLabel
  latex: b
  definition: einsum index label naming the batch axis of an attention tensor
  kind: index
- macro: \BatchIndex
  latex: k
  definition: position of one batch in the sequence of batches a data loader or runtime delivers
  kind: index
  notes: Outside a subscript, so not covered by the index-letter exemption.
- macro: \BatchLabelComponent
  latex: y_{ij}
  definition: one-hot target indicator for class j on example i of a batch
  kind: scalar
  unit: dimensionless
  notes: Batched form of \TrueLabelComponent.
- macro: \BatchLoss
  latex: \mathcal{L}_{\text{batch}}
  definition: mean loss over the examples of one mini-batch
  kind: scalar
  unit: dimensionless
  notes: Average of the per-example \LossFunction over \BatchSize examples; its gradient is the mini-batch
    gradient.
- macro: \BatchNormMean
  latex: \mu_{\mathcal{B}}
  definition: mean of one feature's activations over a mini-batch, as batch normalization computes it
  kind: scalar
  unit: dimensionless
- macro: \BatchNormOutput
  latex: y
  definition: activation batch normalization outputs after its learned scale and shift
  kind: scalar
  unit: dimensionless
  notes: $y_i = \gamma \hat{x}_i + \beta$. Not a label.
- macro: \BatchNormRunningMean
  latex: \boldsymbol{\mu}_{\mathcal{B}}
  definition: per-channel running mean of activations that batch normalization stores for inference
  kind: vector
  notes: Fixed after training; distinct from the per-mini-batch mean used during training.
- macro: \BatchNormRunningStandardDeviation
  latex: \boldsymbol{\sigma}_{\mathcal{B}}
  definition: per-channel square root of the running variance plus the numerical stabilizer that batch
    normalization uses at inference
  kind: vector
- macro: \BatchNormStandardDeviation
  latex: \sigma_{\mathcal{B}}
  definition: standard deviation of one feature's activations over a mini-batch
  kind: scalar
  unit: dimensionless
  notes: Squared, it is the batch variance.
- macro: \BatchPredictedProbability
  latex: \hat{y}_{ij}
  definition: predicted probability for class j on example i of a batch
  kind: scalar
  unit: dimensionless
  notes: Batched form of \PredictedOutputComponent.
- macro: \BatchSize
  latex: B
  definition: number of examples or requests processed together in one step
  kind: count
  notes: Batch size is $B$ throughout the series; bandwidth is $\Bandwidth$, never $B$. Weight bytes loaded
    once are reused across all $\BatchSize$ examples, so arithmetic intensity grows with it.
- macro: \BelowThresholdIndicator
  latex: \mathbf{1}_{\{|(\mathbf{W}_{\text{sparse}})_{ij}| \leq \delta_{\text{prune}}\}}
  definition: indicator over a sparse weight matrix that is one at each entry whose magnitude is at or
    below the pruning threshold
  kind: matrix
  notes: Its $\ell_0$ norm over $m \times n$ gives \ThresholdedSparsityRatio.
- macro: \BiasFeedbackFactor
  latex: \alpha_{\text{fb}}
  definition: factor by which a group's disparity is multiplied over one feedback interval, fitted from
    observed disparities
  kind: scalar
  unit: dimensionless
  notes: Above 1 the feedback loop is self-reinforcing; at or below 1 it is stable or damped. Not $\SignificanceLevel$
    or $\MessageStartupLatency$.
- macro: \BiasVector
  latex: \mathbf{b}
  definition: vector of learned biases one layer adds to its weighted sums, one per neuron or output channel
  kind: vector
  notes: Broadcast across the batch. Not the generic second vector of a dot product (a . b) in appendix
    refreshers.
- macro: \BinaryActivationVector
  latex: \mathbf{a}
  definition: vector of binarized activations packed into one machine word
  kind: vector
- macro: \BinaryWeightVector
  latex: \mathbf{w}
  definition: vector of binarized weights packed into one machine word
  kind: vector
- macro: \BoxMaximumHorizontalCoordinate
  latex: x_{\text{max}}
  definition: horizontal pixel coordinate of a bounding box's right edge
  kind: scalar
  unit: pixels
- macro: \BoxMaximumVerticalCoordinate
  latex: y_{\text{max}}
  definition: larger vertical pixel coordinate of a bounding box's edges
  kind: scalar
  unit: pixels
- macro: \BoxMinimumHorizontalCoordinate
  latex: x_{\text{min}}
  definition: horizontal pixel coordinate of a bounding box's left edge
  kind: scalar
  unit: pixels
- macro: \BoxMinimumVerticalCoordinate
  latex: y_{\text{min}}
  definition: smaller vertical pixel coordinate of a bounding box's edges
  kind: scalar
  unit: pixels
- macro: \CalibrationBinCount
  latex: N_{\text{bins}}
  definition: number of confidence intervals predictions are grouped into to estimate calibration error
  kind: count
- macro: \CalibrationBinIndex
  latex: m
  definition: position of one confidence bin among the calibration bins, counted from one
  kind: index
  notes: Not the pipeline microbatch count or a mass.
- macro: \CalibrationDataset
  latex: \mathcal{C}_{\text{cal}}
  definition: set of representative examples run through a model to estimate quantization ranges
  kind: set
- macro: \CalibrationTemperature
  latex: T_{\text{cal}}
  definition: positive scalar fitted on held-out calibration data that divides a model's logits before
    softmax to calibrate its confidence
  kind: scalar
  unit: dimensionless
  notes: Post-hoc temperature scaling; preserves the top-one ranking. Not \DistillationTemperature.
- macro: \CandidateArchitecture
  latex: \alpha
  definition: one candidate network architecture drawn from a search space
  kind: record
  notes: Neural architecture search returns the best candidate, written with a star.
- macro: \CandidateScoringCost
  latex: c_{\text{infer}}
  definition: cost of running the active model's inference on one candidate sample
  kind: scalar
  unit: USD/sample
  notes: Pool scoring cost is pool size times it, per round.
- macro: \CenterCount
  latex: k
  definition: number of centers a k-center selection places, each a retained sample
  kind: count
  notes: Appears as part of the name k-center; in coreset use it equals the coreset budget $\CoresetBudget$.
- macro: \ChainRuleInput
  latex: x
  definition: input variable of the scalar chain-rule illustration y = 3u with u = x squared
  kind: scalar
  unit: dimensionless
  notes: Illustrative only; paired with \ChainRuleIntermediate and \ChainRuleOutput.
- macro: \ChainRuleIntermediate
  latex: u
  definition: intermediate variable u = x squared of the scalar chain-rule illustration
  kind: scalar
  unit: dimensionless
  notes: Illustrative only.
- macro: \ChainRuleOutput
  latex: y
  definition: output variable y = 3u of the scalar chain-rule illustration
  kind: scalar
  unit: dimensionless
  notes: Illustrative only; not a label or a network output.
- macro: \ChanceAnnotatorAgreement
  latex: p_e
  definition: share of items on which two annotators would agree by chance, given each annotator's label
    frequencies
  kind: scalar
  unit: dimensionless
  notes: Chance-correction term of Cohen's kappa $\InterAnnotatorAgreement$.
- macro: \ClassCount
  latex: K
  definition: number of classes a classifier distinguishes, or vocabulary entries it scores, the length
    of its softmax output
  kind: count
  notes: Not \ContinuationCount or \OutputLength, which share the glyph.
- macro: \ClassIndex
  latex: j
  definition: index of an output class
  kind: index
  notes: Written bare only when the text names the index.
- macro: \ClassificationThreshold
  latex: \gamma_{\text{cls}}
  definition: score threshold above which a classifier outputs the positive class
  kind: scalar
  unit: dimensionless
  notes: Lowering it raises both true and false positive rates. Not $\ResponseThreshold$, the monitoring
    or selective-prediction threshold.
- macro: \CleanLabelSampleCount
  latex: D_{\text{clean}}
  definition: number of training samples with clean labels needed to reach a target error
  kind: count
  notes: Scales as $1/\epsilon$ in the illustrative quality-multiplier model.
- macro: \ClippingRangeLowerBound
  latex: \alpha
  definition: lower end of the real-valued range a quantizer represents, below which values are clipped
  kind: scalar
  unit: varies
  notes: 'Calibration estimates it. Pairs with \ClippingRangeUpperBound. Not \SymmetricClippingThreshold.
    Unit: units of the quantized tensor.'
- macro: \ClippingRangeUpperBound
  latex: \beta
  definition: upper end of the real-valued range a quantizer represents, above which values are clipped
  kind: scalar
  unit: varies
  notes: 'Pairs with \ClippingRangeLowerBound. Unit: units of the quantized tensor.'
- macro: \ColumnModeComponentVector
  latex: \mathbf{v}_r
  definition: column of the column-mode factor matrix for one rank-one component of a CP decomposition
  kind: vector
- macro: \ColumnModeFactorMatrix
  latex: \mathbf{V}
  definition: factor matrix for the column mode of a tensor decomposition, one row per column index and
    one column per rank component
  kind: matrix
- macro: \ColumnModeFactorSlice
  latex: \mathbf{v}
  definition: row of the column-mode factor matrix for one column index, holding its weight on every rank
    component
  kind: vector
  notes: Indexed $\mathbf{v}_j$.
- macro: \ComposedFunctionInput
  latex: x
  definition: input of a composition of layer functions
  kind: scalar
  unit: dimensionless
- macro: \ComposedFunctionOutput
  latex: y
  definition: output of a composition of layer functions, whose derivative the chain rule computes
  kind: scalar
  unit: dimensionless
- macro: \CompoundScalingCoefficient
  latex: \phi
  definition: exponent that sets how much compute compound scaling adds to a base model
  kind: scalar
  unit: dimensionless
- macro: \CompressedOnlyCorrectCount
  latex: n_{\text{comp}}
  definition: number of evaluation examples the compressed model classifies correctly and the baseline
    model gets wrong
  kind: count
  notes: The other discordant count in McNemar's paired test.
- macro: \ComputationalGraph
  latex: G
  definition: computational graph that evaluates a function, a pair of nodes and edges
  kind: record
- macro: \ComputeBudgetConstraint
  latex: g
  definition: constraint function that is zero when training compute, six times parameters times tokens,
    equals the fixed budget
  kind: function
  notes: Not a gradient or a LogP gap.
- macro: \ComputeConstrainedLagrangian
  latex: \mathcal{L}_{\text{Lagrange}}
  definition: Lagrangian of minimizing scaling-law loss over parameters and tokens at a fixed training
    compute budget
  kind: function
  notes: Reducible loss plus the multiplier times the compute constraint; not a training loss.
- macro: \ComputeConstraintMultiplier
  latex: \lambda
  definition: Lagrange multiplier attached to the fixed training compute budget in the compute-optimal
    allocation
  kind: scalar
  unit: varies
  notes: 'Its value is the marginal loss reduction per extra FLOP at the optimum. Not a regularization
    weight or a failure rate. Unit: loss per FLOP.'
- macro: \ComputeOptimalTokenCount
  latex: D_{\text{opt}}
  definition: number of training tokens that minimizes loss for a fixed compute budget
  kind: count
  notes: Grows as the square root of compute when parameters and tokens scale together.
- macro: \ConditionalDistribution
  latex: p(y \mid x)
  definition: probability distribution of the label given an input, the input-to-label relationship that
    concept drift changes
  kind: distribution
  notes: Pairs with $\InputDistribution$ in the drift taxonomy (covariate shift changes $\InputDistribution$
    and keeps this fixed). $\TrainingDistribution$ and $\CurrentDistribution$ name the whole data distribution
    at training time and in service.
- macro: \ConfidenceCriticalQuantile
  latex: z_{\alpha/2}
  definition: positive standard-Normal critical value for a two-sided test at the chosen confidence level
  kind: scalar
  unit: dimensionless
  notes: About 1.96 at 95 percent confidence.
- macro: \ConvolutionActivation
  latex: H
  definition: activation at one spatial position and channel of a convolution layer's feature map
  kind: scalar
  unit: dimensionless
  notes: Written $H^{(\ell)}_{i,j,k}$. Not feature-map height, which is $H_{\text{img}}$.
- macro: \CookedTokenKeyVector
  latex: \mathbf{k}_{\text{cooked}}
  definition: key vector of the token "cooked" in the chef-cooked-the-meal example
  kind: vector
  notes: Example-specific label.
- macro: \CookedTokenQueryVector
  latex: \mathbf{q}_{\text{cooked}}
  definition: query vector of the token "cooked" in the chef-cooked-the-meal example
  kind: vector
  notes: Example-specific label.
- macro: \CoresetBudget
  latex: K
  definition: number of examples a coreset selection method is asked to retain
  kind: count
  notes: The selection budget; the realized retained count is $\SubsetDatasetSize$.
- macro: \CorrectClassIndex
  latex: c
  definition: index of an example's correct class
  kind: index
- macro: \CorrectClassLogit
  latex: z_{c}
  definition: logit of the correct class
  kind: scalar
  unit: dimensionless
  notes: Used in the fused cross-entropy-from-logits form.
- macro: \CorrectClassProbability
  latex: \hat{y}_{c}
  definition: predicted probability of the correct class
  kind: scalar
  unit: dimensionless
  notes: Cross-entropy for a one-hot label reduces to minus its log.
- macro: \CrossEntropyLoss
  latex: \mathcal{L}_{\text{CE}}
  definition: cross-entropy between a model's predicted class probabilities and the ground-truth labels
  kind: function
- macro: \CurrentDistribution
  latex: P_t
  definition: data distribution a deployed model sees in service at time t
  kind: distribution
  notes: Compared against $\TrainingDistribution$ by $\StatisticalDivergence$. Uppercase $P$ with a subscript;
    bare $P$ is never a distribution, and parameter count is $\Parameters$.
- macro: \CurrentLayerWidth
  latex: n_{\ell}
  definition: number of units in layer l
  kind: count
  notes: Equals \LayerOutputWidth of layer l. Written n with the layer-index macro as subscript.
- macro: \CurrentModelParameters
  latex: \theta_{\text{old}}
  definition: model parameters before one optimizer update
  kind: vector
  notes: Italic theta like \ModelParameters.
  render_exception: theta stays italic as the conventional parameter-vector glyph, as in \ModelParameters.
- macro: \CurrentNodeIndex
  latex: j
  definition: index of the computational-graph node being evaluated or differentiated
  kind: index
- macro: \DailyQueryVolume
  latex: Q_{\text{day}}
  definition: number of queries, requests or transactions a deployed model serves per day
  kind: scalar
  unit: queries/day
  notes: Traffic term in the skew-cost and staleness-cost models; a rate, not a count of a fixed batch.
- macro: \DataAcquisitionCost
  latex: C_{\text{acquire}}
  definition: cost of obtaining the raw samples of a training dataset, by scraping, licensing or collection
  kind: scalar
  unit: USD
  notes: Sample count times per-sample acquisition price.
- macro: \DataDebtGrowthRate
  latex: r
  definition: net fractional growth of the data-debt remediation backlog per planning period
  kind: scalar
  unit: varies
  notes: 'Compounds as $\text{Debt}_n \approx \text{Debt}_0 (1 + r)^n$. Unit: per period, as the context
    sets.'
- macro: \DataInformationContent
  latex: \mathcal{I}
  definition: learning signal a body of training data carries, measured as the gain it produces in a fixed
    evaluation metric
  kind: function
  notes: Written $\mathcal{I}(\DatasetSize)$ as a function of dataset size; its increment per operation
    is the information-compute ratio (ICR). Not $\ClosureOperator$.
- macro: \DataLabelingCost
  latex: C_{\text{label}}
  definition: cost of labeling the samples of a training dataset
  kind: scalar
  unit: USD
  notes: Labeled sample count times per-sample labeling price.
- macro: \DataProcessingCost
  latex: C_{\text{process}}
  definition: accelerator compute cost of training passes over a dataset
  kind: scalar
  unit: USD
  notes: Samples times epochs times per-sample operations times price per operation.
- macro: \DataScaleCoefficient
  latex: B
  definition: fitted coefficient of the training-token term of a two-term scaling law in parameters and
    tokens
  kind: scalar
  unit: dimensionless
  notes: Not batch size. Strictly loss units times tokens raised to the data exponent.
- macro: \DataScalingExponent
  latex: \beta
  definition: fitted power-law exponent at which loss falls as the training dataset or token count grows
  kind: scalar
  unit: dimensionless
  notes: 'The data-size instance of $\ScalingExponent$; appears as $\LossFunction \propto \DatasetSize^{-\alpha}$.
    Not universal: Kaplan et al. fit about 0.095 for language models.'
- macro: \DataScalingLossFactor
  latex: D^{-\beta}
  definition: dataset size raised to minus the data scaling exponent, the factor to which a power-law
    fit makes loss proportional
  kind: scalar
  unit: dimensionless
  notes: Whole decorated form of $\DatasetSize$ with exponent $-\alpha$ ($\DataScalingExponent$).
- macro: \DataStorageCost
  latex: C_{\text{store}}
  definition: cost of keeping a training dataset in storage over its retention period
  kind: scalar
  unit: USD
  notes: Stored bytes times storage price times retention time.
- macro: \DatasetSize
  latex: D
  definition: number of training examples or tokens in a dataset
  kind: count
