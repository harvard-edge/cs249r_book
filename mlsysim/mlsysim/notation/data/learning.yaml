- macro: \CriticActionReturnEstimate
  latex: Q_{\phi}
  definition: action-value estimate a learned critic network with parameters phi predicts for a state
    and action
  kind: function
  notes: Action counterpart of \CriticReturnEstimate ($V_\phi$).
- macro: \CriticApproximationError
  latex: \epsilon
  definition: error of a learned critic's action-value estimate relative to the true value, at a given
