- macro: \CriticParameters
  latex: \phi
  definition: learned weights of an actor-critic method's critic network
  kind: vector
  notes: 'render_exception: field convention writes parameter vectors non-bold, as for \ModelParameters.
    Superscript of \CriticActionReturnEstimate. Not \CvaeEncoderParameters (also phi).'
  render_exception: Machine learning writes a parameter vector as a plain Greek letter, never bold.
- macro: \CriticalBatchSize
  latex: B^{*}
  definition: batch size beyond which further growth yields diminishing reductions in optimization steps
