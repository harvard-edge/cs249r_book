# Values reported by incident investigations (report results). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Times count backward from impact, as the NTSB event table does.
# Added 2026-10-20.
TempeFirstDetectionS:
  value: 5.6
  provenance: NTSB_HAR_19_03
  name: Tempe first detection, time before impact (s)
  description: Radar first detects the pedestrian (table of selected ADS parameters, pp. 15-16).
TempeFirstDetectionDistanceFt:
  value: 350
  provenance: NTSB_HAR_19_03
  name: Tempe distance to the pedestrian at first detection (ft)
  description: About 350 feet when the system first detected her (section 2.1.2).
TempeInitialSpeedMph:
  value: 44
  provenance: NTSB_HAR_19_03
  name: Tempe initial vehicle speed (mph)
  description: The initial speed footnote 91 uses for its stopping time.
TempeFullStopTimeS:
  value: 2.1
  provenance: NTSB_HAR_19_03
  name: Tempe stopping time from 44 mph at 0.92 g, as the NTSB states it (s)
  description: Footnote 91. Its own inputs give about 2.18 s; the report prints 2.1.
TempeEmergencyRecognitionS:
  value: 1.2
  provenance: NTSB_HAR_19_03
  name: Tempe emergency recognized and action suppression begins, time before impact (s)
  description: Table of selected ADS parameters (pp. 15-16).
TempeEmergencyRecognitionSpeedMph:
  value: 43.2
  provenance: NTSB_HAR_19_03
  name: Tempe recorded speed when the emergency was recognized (mph)
  description: Table of selected ADS parameters (pp. 15-16).
TempeActionSuppressionS:
  value: 1.0
  provenance: NTSB_HAR_19_03
  name: Tempe action-suppression period (s)
  description: One-second period during which the ADS suppressed braking (p. 13).
TempeSuppressionEndS:
  value: 0.2
  provenance: NTSB_HAR_19_03
  name: Tempe action suppression ends, time before impact (s)
  description: Table of selected ADS parameters (pp. 15-16).
TempeSuppressionEndSpeedMph:
  value: 40.5
  provenance: NTSB_HAR_19_03
  name: Tempe recorded speed when action suppression ended (mph)
  description: Table of selected ADS parameters (pp. 15-16).
TempeOperatorTakeoverS:
  value: 0.02
  provenance: NTSB_HAR_19_03
  name: Tempe operator takes the steering wheel, time before impact (s)
  description: Table of selected ADS parameters (pp. 15-16).
TempeImpactSpeedMph:
  value: 39
  provenance: NTSB_HAR_19_03
  name: Tempe speed at impact (mph)
  description: The vehicle struck the pedestrian at 39 mph (p. v and p. 2).
TempeAdsBrakingCapMps2:
  value: 7.0
  provenance: NTSB_HAR_19_03
  name: Tempe ADS emergency threshold and automated braking cap (m/s^2)
  description: Braking above 7 m/s^2 (0.71 g) defined an emergency, and the ADS capped automated braking there (p. 13, footnote 33).
TempeRoadDecelerationG:
  value: 0.92
  provenance: NTSB_HAR_19_03
  name: Tempe deceleration capability in the crash area, from police friction testing (g)
  description: Average deceleration the SUV could achieve on that road surface (footnotes 33 and 91).
CruisePulloverDistanceFt:
  value: 20
  provenance: QUINN_EMANUEL_CRUISE_2024
  name: Cruise pullover distance with the pedestrian beneath the vehicle (ft)
  description: About 20 feet (p. 10).
CruisePulloverMaxSpeedMph:
  value: 7.7
  provenance: QUINN_EMANUEL_CRUISE_2024
  name: Cruise maximum speed during the pullover (mph)
  description: Up to 7.7 mph (p. 10).
