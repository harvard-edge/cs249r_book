# Responsible-AI technique overhead ranges for @tbl-responsible-ai-overhead.
# Accuracy impact stored as signed percentage points (negative = accuracy drop);
# training/inference/memory overheads stored as positive percent unless marked
# as a multiplier (Exact SHAP inference, stored as a x-factor).
# Order-of-magnitude empirical ranges across published responsible-AI benchmarks.

# --- Differential Privacy (DP-SGD) ---
# Accuracy range widened 2026-09-28 so the planning table does not contradict the
# vol2 security/privacy chapter's DP frontier: CIFAR-10 trained from scratch at
# (eps=8, delta=1e-5) reaches 73-81.4% against a ~93% non-private baseline
# (Abadi et al. 2016; De et al. 2022), a 12-20 pp loss. The low end reflects
# fine-tuning from public pretraining or very large datasets, where De et al.
# report losses near 1 pp. Training range covers per-example clipping cost plus
# the extra epochs a tight budget needs (the responsible-AI chapter's weaker and
# stronger configurations assume +30% and +200%).
DpAccuracyLowPct: {value: -1, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP accuracy impact low}
DpAccuracyHighPct: {value: -20, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP accuracy impact high}
DpTrainingLowPct: {value: 30, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP training overhead low}
DpTrainingHighPct: {value: 300, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP training overhead high}
DpMemoryLowPct: {value: 10, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP memory overhead low}
DpMemoryHighPct: {value: 20, provenance: RESPONSIBLE_AI_OVERHEAD, name: DP memory overhead high}

# --- Fairness-Aware Training ---
FairnessAccuracyLowPct: {value: -1, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness accuracy impact low}
FairnessAccuracyHighPct: {value: -3, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness accuracy impact high}
FairnessTrainingLowPct: {value: 5, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness training overhead low}
FairnessTrainingHighPct: {value: 15, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness training overhead high}
FairnessMemoryLowPct: {value: 5, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness memory overhead low}
FairnessMemoryHighPct: {value: 10, provenance: RESPONSIBLE_AI_OVERHEAD, name: Fairness memory overhead high}

# --- Approximate SHAP (Tree/Kernel) ---
ApproxShapInferenceLowPct: {value: 50, provenance: RESPONSIBLE_AI_OVERHEAD, name: Approx SHAP inference overhead low}
ApproxShapInferenceHighPct: {value: 200, provenance: RESPONSIBLE_AI_OVERHEAD, name: Approx SHAP inference overhead high}
ApproxShapMemoryLowPct: {value: 20, provenance: RESPONSIBLE_AI_OVERHEAD, name: Approx SHAP memory overhead low}
ApproxShapMemoryHighPct: {value: 100, provenance: RESPONSIBLE_AI_OVERHEAD, name: Approx SHAP memory overhead high}

# --- Exact SHAP (inference stored as a multiplier) ---
ExactShapInferenceLowX: {value: 50, provenance: RESPONSIBLE_AI_OVERHEAD, name: Exact SHAP inference multiplier low}
ExactShapInferenceHighX: {value: 1000, provenance: RESPONSIBLE_AI_OVERHEAD, name: Exact SHAP inference multiplier high}
ExactShapMemoryLowPct: {value: 50, provenance: RESPONSIBLE_AI_OVERHEAD, name: Exact SHAP memory overhead low}
ExactShapMemoryHighPct: {value: 200, provenance: RESPONSIBLE_AI_OVERHEAD, name: Exact SHAP memory overhead high}

# --- Adversarial Training ---
# Widened 2026-09-28 to agree with the vol2 robust-AI chapter: PGD-k training costs
# roughly (1 + k) forward/backward passes per batch, so PGD-7 is ~8x (+700%) and
# PGD-10 ~11x (+1000%); single-step (FGSM-style) training is ~2x (+100%).
# Clean-accuracy loss on CIFAR-10 is ~8 pp for PGD training (Madry et al. 2018:
# 95.2% -> 87.3%) and larger on harder tasks.
AdversarialAccuracyLowPct: {value: -3, provenance: RESPONSIBLE_AI_OVERHEAD, name: Adversarial accuracy impact low}
AdversarialAccuracyHighPct: {value: -15, provenance: RESPONSIBLE_AI_OVERHEAD, name: Adversarial accuracy impact high}
AdversarialTrainingLowPct: {value: 100, provenance: RESPONSIBLE_AI_OVERHEAD, name: Adversarial training overhead low}
AdversarialTrainingHighPct: {value: 1000, provenance: RESPONSIBLE_AI_OVERHEAD, name: Adversarial training overhead high}
AdversarialMemoryLowPct: {value: 50, provenance: RESPONSIBLE_AI_OVERHEAD, name: Adversarial memory overhead low}
AdversarialMemoryHighPct: {value: 100, provenance: RESPONSIBLE_AI_OVERHEAD, name: Adversarial memory overhead high}

