FederatedAccuracyLowPct: {value: -5, provenance: RESPONSIBLE_AI_OVERHEAD, name: Federated accuracy impact low}
FederatedAccuracyHighPct: {value: -15, provenance: RESPONSIBLE_AI_OVERHEAD, name: Federated accuracy impact high}
FederatedTrainingLowPct: {value: 200, provenance: RESPONSIBLE_AI_OVERHEAD, name: Federated training overhead low}
FederatedTrainingHighPct: {value: 500, provenance: RESPONSIBLE_AI_OVERHEAD, name: Federated training overhead high}
FederatedMemoryLowPct: {value: 100, provenance: RESPONSIBLE_AI_OVERHEAD, name: Federated memory overhead low}
