# Cited model-compression results: magnitude pruning of ResNet-50, DistilBERT,
# sparse GPU kernels, 2:4 sparse tensor cores, INT8 ResNet-50, and the
# plateau-and-cliff readings of Deep Compression. Values are dimensionless
# scalars as load_sourced_registry requires; the unit is in the key name.
# Added 2026-10-20.
GaleResNet50PrunedPct:
  value: 80
  provenance: GALE_STATE_OF_SPARSITY_2019
  name: Share of ResNet-50 weights removed by magnitude pruning with retraining (percent)
  description: Removed for roughly one point of ImageNet top-1 accuracy.
GaleResNet50Top1LossPts:
  value: 1
  provenance: GALE_STATE_OF_SPARSITY_2019
  name: ResNet-50 top-1 accuracy lost at that sparsity (points, approximate)
  description: The approximate top-1 cost of removing 80 percent of the weights.
SanhDistilBertParamReductionPct:
  value: 40
  provenance: SANH_DISTILBERT_2019
  name: DistilBERT parameters fewer than BERT-base (percent)
  description: Reported in the abstract.
SanhDistilBertSpeedupPct:
  value: 60
  provenance: SANH_DISTILBERT_2019
  name: DistilBERT inference faster than BERT-base (percent)
  description: Reported in the abstract.
SanhDistilBertRetainedPct:
  value: 97
  provenance: SANH_DISTILBERT_2019
  name: Share of BERT-base language-understanding performance DistilBERT keeps (percent)
  description: Reported in the abstract (GLUE).
SanhDistilBertLayers:
  value: 6
  provenance: SANH_DISTILBERT_2019
  name: DistilBERT transformer layers
  description: The student keeps every other layer of the teacher.
SanhBertBaseLayers:
  value: 12
  provenance: SANH_DISTILBERT_2019
  name: BERT-base transformer layers (the teacher)
  description: The teacher's depth.
GaleSparseKernelSpeedupLow:
  value: 1.2
  provenance: GALE_SPARSE_GPU_KERNELS_2020
  name: Sparse-over-dense speedup of the sparse GPU kernels, low end (V100)
  description: End-to-end on sparse Transformer and MobileNet models.
GaleSparseKernelSpeedupHigh:
  value: 2.1
  provenance: GALE_SPARSE_GPU_KERNELS_2020
  name: Sparse-over-dense speedup of the sparse GPU kernels, high end (V100)
  description: End-to-end on sparse Transformer and MobileNet models.
GaleSparseKernelPeakPct:
  value: 27
  provenance: GALE_SPARSE_GPU_KERNELS_2020
