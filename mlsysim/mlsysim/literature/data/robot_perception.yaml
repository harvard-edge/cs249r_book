# Cited figures of robot odometry, volumetric mapping, and tracking systems: the UMBmark odometry
# benchmark, nvblox's ESDF update times against CPU mappers, and the SORT tracker's reference
# defaults. Values are dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
UmbmarkSquareSideM:
  value: 4
  provenance: BORENSTEIN_UMBMARK_1996
  name: "UMBmark square path side (m)"
  description: "Each run drives a 4 m by 4 m square."
UmbmarkLegsPerRun:
  value: 4
  provenance: BORENSTEIN_UMBMARK_1996
  name: "UMBmark legs per run"
  description: "Four straight legs of the square per run."
UmbmarkReturnErrorUncalibratedMm:
  value: 317
  provenance: BORENSTEIN_UMBMARK_1996
  name: "UMBmark E_max,syst before calibration (mm, Table I, experiment 1)"
  description: "Larger of the two direction-averaged return errors, uncalibrated LabMate base."
UmbmarkReturnErrorCalibratedMm:
  value: 21
  provenance: BORENSTEIN_UMBMARK_1996
  name: "UMBmark E_max,syst after calibration (mm, Table I, experiment 1)"
  description: "Same measure after correcting wheelbase and wheel-diameter ratio."
UmbmarkRunSigmaMm:
  value: 25
  provenance: BORENSTEIN_UMBMARK_1996
