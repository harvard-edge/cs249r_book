# Measured human annotation times (paper results). Values are dimensionless
# scalars as load_sourced_registry requires; the unit is in the key name.
# Added 2026-10-20.
ImageNetBoxDrawSeconds:
  value: 35
  provenance: PAPADOPOULOS_EXTREME_CLICKING_2017
  name: Time to draw one high-quality bounding box in ImageNet's campaign (s)
  description: About 35 seconds per box, as Papadopoulos et al. (2017) report it.
CityscapesFineMaskHours:
  value: 1.5
  provenance: CITYSCAPES_2016
  name: Time to annotate one Cityscapes image at pixel level (h, more than)
  description: Fine annotation and quality control took more than 1.5 hours on average per image.
