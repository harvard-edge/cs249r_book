# Values are dimensionless scalars as load_sourced_registry requires; the unit
# is in the key name. Added 2026-10-20.
CybenchTasks:
  value: 40
  provenance: ZHANG_2024_CYBENCH
  name: Cybench professional capture-the-flag tasks (count)
  description: Tasks in the Cybench benchmark; Literature.CybenchSolveRate scores each model on them.
