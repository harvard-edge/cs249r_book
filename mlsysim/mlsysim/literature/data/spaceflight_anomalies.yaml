# Cited results of spaceflight anomaly inquiries (report results). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
SchiaparelliSaturationAcceptanceMs:
  value: 15
  provenance: ESA_SCHIAPARELLI_INQUIRY
  name: Schiaparelli IMU saturation duration assumed at acceptance (ms)
  description: The longest IMU saturation-flag duration assumed when the unit was accepted.
SchiaparelliAttitudeDriftDeg:
  value: 165
  provenance: ESA_SCHIAPARELLI_INQUIRY
  name: Schiaparelli attitude-estimate drift (degrees, about)
  description: Drift of the attitude estimate after the saturated rate was integrated.
SchiaparelliReleaseAltitudeKm:
  value: 3.7
  provenance: ESA_SCHIAPARELLI_INQUIRY
  name: Schiaparelli altitude at parachute release (km, about)
  description: True altitude when the guidance logic released the parachute and backshell.
SchiaparelliThrusterBurnS:
  value: 3
  provenance: ESA_SCHIAPARELLI_INQUIRY
  name: Schiaparelli thruster burn as executed (s)
  description: Duration the braking thrusters fired before the on-ground sequence began.
SchiaparelliPlannedBurnS:
  value: 30
  provenance: ESA_SCHIAPARELLI_INQUIRY
  name: Schiaparelli planned thruster burn (s)
  description: Planned duration of the braking-thruster burn.
SchiaparelliImpactKmh:
  value: 540
  provenance: ESA_SCHIAPARELLI_INQUIRY
  name: Schiaparelli impact speed (km/h, about)
  description: Speed at which the lander struck the surface after free fall.
MarsClimateOrbiterPlannedAltitudeKm:
  value: 226
  provenance: NASA_MCO_PHASE1_1999
  name: Mars Climate Orbiter planned orbit-insertion altitude (km)
  description: Planned closest approach to Mars at orbit insertion.
MarsClimateOrbiterActualAltitudeKm:
  value: 57
  provenance: NASA_MCO_PHASE1_1999
  name: Mars Climate Orbiter estimated orbit-insertion altitude (km, about)
  description: Final estimate of the closest approach after the impulse error.
# Space Shuttle Challenger, STS-51L, 28 January 1986 (added 2026-10-20).
ChallengerLaunchAirF:
  value: 36
  provenance: ROGERS_COMMISSION_1986
  name: Challenger launch-pad air temperature at launch (F)
  description: Ch. IV finding 6.
ChallengerColderThanPriorLaunchF:
  value: 15
  provenance: ROGERS_COMMISSION_1986
  name: Challenger launch air temperature below any previous launch (F)
  description: Ch. IV finding 6, 15 degrees colder than any previous launch.
ChallengerAftJointEstimateF:
  value: 28
  provenance: ROGERS_COMMISSION_1986
  name: Challenger right aft field joint temperature estimate (F)
  description: Ch. IV finding 6; stated with an uncertainty of plus or minus 5 F.
ChallengerAftJointEstimateUncertaintyF:
  value: 5
  provenance: ROGERS_COMMISSION_1986
  name: Uncertainty of the right aft field joint temperature estimate (F, plus or minus)
  description: Ch. IV finding 6.
ChallengerBreakupS:
  value: 73
  provenance: ROGERS_COMMISSION_1986
  name: Time from liftoff to vehicle breakup (s, about)
  description: Ch. III.
ChallengerPriorJointFlights:
  value: 24
  provenance: ROGERS_COMMISSION_1986
  name: Previous flights of the field-joint design before Challenger (count)
  description: Ch. V; 23 of them had boosters recovered and inspected.
ThiokolMinimumJointTempF:
  value: 53
  provenance: ROGERS_COMMISSION_1986
  name: Thiokol engineers' recommended minimum O-ring temperature at launch (F)
  description: Ch. V, the 27 January chart; the coldest prior flight, SRM 15.
