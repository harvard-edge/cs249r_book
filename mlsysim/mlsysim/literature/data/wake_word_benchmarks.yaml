# Published wake-word detector benchmark results (report results). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
PicovoiceFalseAlarmsPerHour:
  value: 0.1
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Picovoice benchmark operating point (false alarms per hour)
  description: Every engine's threshold is set to raise 1 false alarm per 10 hours (plot.py target_false_alarm_per_hour).
PicovoiceMissPctPocketSphinx:
  value: 52.0
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: PocketSphinx miss rate at the operating point (percent)
  description: Share of wake words missed, averaged over six keywords (README "Accuracy").
PicovoiceMissPctSnowboy:
  value: 31.9
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Snowboy miss rate at the operating point (percent)
  description: Share of wake words missed, averaged over six keywords (README "Accuracy").
PicovoiceMissPctPorcupine:
  value: 2.7
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Porcupine miss rate at the operating point (percent)
  description: Share of wake words missed, averaged over six keywords (README "Accuracy").
PicovoiceRecordingsPerWord:
  value: 300
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Picovoice benchmark recordings per wake word (more than)
  description: The benchmark plays more than this many recordings of each wake word.
PicovoiceSpeakers:
  value: 50
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Picovoice benchmark speakers (more than)
  description: Recordings come from more than this many speakers.
PicovoiceMixSnrDb:
  value: 10
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Picovoice benchmark mixing SNR (dB)
  description: Wake-word recordings are mixed with background noise at this signal-to-noise ratio.
PicovoiceNoiseEnvironments:
  value: 18
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Picovoice benchmark noise environments (DEMAND)
  description: Recorded noise environments, such as kitchens, offices, and traffic.
PicovoiceWakeWords:
  value: 6
  provenance: PICOVOICE_WAKE_WORD_BENCHMARK
  name: Picovoice benchmark wake words
  description: Miss rates are averaged over this many wake words.
