# Cited measurements of deployed ML hardware: TPU v1 roofline, the memory wall's
# growth factors, a phone's sustained-load stress test, and a two-pass wake-word
# detector's sizes (added 2026-10-20).
TpuV1RooflineRidge:
  value: 1350
  provenance: JOUPPI_TPU_V1_ISCA_2017
  name: TPU v1 roofline ridge (operations per weight byte)
  description: Intensity at which the TPU v1 roofline's memory slope meets its 92 TOPS ceiling, as drawn in Fig. 5.
MemoryWallFlopsGrowthPer2Years:
  value: 3.0
  provenance: GHOLAMI_MEMORY_WALL_2024
  name: Server peak FLOP/s growth every two years
  description: Fitted growth of server-chip peak compute every two years, as printed on Fig. 1.
MemoryWallDramGrowthPer2Years:
  value: 1.6
  provenance: GHOLAMI_MEMORY_WALL_2024
  name: DRAM bandwidth growth every two years
  description: Fitted growth of DRAM bandwidth every two years, as printed on Fig. 1.
MemoryWallInterconnectGrowthPer2Years:
  value: 1.4
  provenance: GHOLAMI_MEMORY_WALL_2024
  name: Interconnect bandwidth growth every two years
  description: Fitted growth of interconnect bandwidth every two years, as printed on Fig. 1.
MemoryWallFlopsGrowth20Years:
  value: 60000
  provenance: GHOLAMI_MEMORY_WALL_2024
  name: Server peak FLOP/s growth over 20 years
  description: Growth of server-chip peak compute over twenty years, as printed on Fig. 1.
MemoryWallDramGrowth20Years:
  value: 100
  provenance: GHOLAMI_MEMORY_WALL_2024
  name: DRAM bandwidth growth over 20 years
  description: Growth of DRAM bandwidth over twenty years, as printed on Fig. 1.
MemoryWallInterconnectGrowth20Years:
  value: 30
  provenance: GHOLAMI_MEMORY_WALL_2024
  name: Interconnect bandwidth growth over 20 years
  description: Growth of interconnect bandwidth over twenty years, as printed on Fig. 1.
