# Cited figures of the Netflix Prize and what Netflix shipped from it. Values
# are dimensionless scalars as load_sourced_registry requires; the unit is in
# the key name (Usd = dollars, Pct = percent, count otherwise). Added 2026-10-20.
GrandPrizeUsd:
  value: 1000000
  provenance: JOHNSTON_NETFLIX_PRIZE_2012
  name: Netflix Prize Grand Prize (dollars)
  description: Prize for the first team to beat Netflix's own recommender by the target improvement.
TargetImprovementPct:
  value: 10
  provenance: JOHNSTON_NETFLIX_PRIZE_2012
  name: Netflix Prize target improvement (percent)
  description: Required improvement in rating-prediction accuracy (RMSE) over Netflix's Cinematch.
WinningImprovementPct:
  value: 10.05
  provenance: NETFLIX_PRIZE_LEADERBOARD
  name: Leaderboard improvement of the Grand Prize team (percent)
  description: BellKor's Pragmatic Chaos on the leaderboard of June 2009, the first entry past the target.
ProgressPrizeBlendAlgorithms:
  value: 107
  provenance: AMATRIAIN_NETFLIX_RECOMMENDATIONS_2012
  name: Algorithms in the 2007 Progress Prize blend (count)
  description: The winning 2007 entry was a linear blend of 107 algorithms.
ProgressPrizeImprovementPct:
  value: 8.43
  provenance: AMATRIAIN_NETFLIX_RECOMMENDATIONS_2012
  name: 2007 Progress Prize improvement (percent)
  description: Improvement of the 2007 Progress Prize blend over Cinematch.
ProgressPrizeAlgorithmsKept:
  value: 2
  provenance: AMATRIAIN_NETFLIX_RECOMMENDATIONS_2012
  name: Progress Prize algorithms Netflix put into production (count)
  description: Matrix factorization and a restricted Boltzmann machine, rebuilt for production scale.
ContestRatings:
  value: 100000000
  provenance: AMATRIAIN_NETFLIX_RECOMMENDATIONS_2012
  name: Ratings in the contest dataset (count)
  description: The contest data held 100 million ratings.
ProductionRatings:
  value: 5000000000
  provenance: AMATRIAIN_NETFLIX_RECOMMENDATIONS_2012
  name: Ratings in production (count)
  description: Netflix's production system held more than 5 billion ratings in 2012.
DeanonymizationRatings:
  value: 8
  provenance: NARAYANAN_NETFLIX_DEANON_2008
  name: Movie ratings with approximate dates needed to identify a record (count)
  description: Up to 2 of the 8 may be wrong and dates may be off by 14 days.
DeanonymizationRecordsPct:
  value: 99
  provenance: NARAYANAN_NETFLIX_DEANON_2008
  name: Netflix Prize records uniquely identified by those ratings (percent)
