# Cited prediction-quality results (paper results): benchmark error rates and
# documented accuracy failures. Values are dimensionless scalars as
# load_sourced_registry requires; the unit is in the key name (Pct = percent,
# Weeks = count of weeks). Added 2026-10-20.
AlexNetIlsvrc2012Top5ErrorPct:
  value: 15.3
  provenance: KRIZHEVSKY_ALEXNET_2012
  name: AlexNet ILSVRC-2012 top-5 test error (percent)
  description: Winning top-5 test error of the AlexNet entry at ILSVRC-2012 (Krizhevsky et al. 2012, Sec. 6).
Ilsvrc2012RunnerUpTop5ErrorPct:
  value: 26.2
  provenance: KRIZHEVSKY_ALEXNET_2012
  name: ILSVRC-2012 second-best top-5 test error (percent)
  description: Top-5 test error of the second-best ILSVRC-2012 entry, as reported by Krizhevsky et al. (2012).
GoogleFluTrendsOverestimateWeeks:
  value: 100
  provenance: LAZER_GOOGLE_FLU_2014
  name: Weeks Google Flu Trends overestimated (count)
  description: Weeks, of the window starting August 2011, in which the GFT estimate exceeded the CDC count.
GoogleFluTrendsOverestimateWindowWeeks:
  value: 108
  provenance: LAZER_GOOGLE_FLU_2014
  name: Weeks in the Google Flu Trends overestimate window (count)
  description: Length of the window, starting August 2011, over which Lazer et al. counted overestimates.
# Accuracy under distribution shift (added 2026-10-20)
WildsCamelyon17IdAccuracy:
  value: 93.2
  provenance: KOH_WILDS_ICML_2021
  name: Camelyon17-WILDS in-distribution accuracy, standard training (percent)
  description: Average accuracy of ERM training on held-out patches from the training hospitals (Table 1).
WildsCamelyon17OodAccuracy:
  value: 70.3
  provenance: KOH_WILDS_ICML_2021
  name: Camelyon17-WILDS out-of-distribution accuracy, standard training (percent)
  description: Average accuracy of the same ERM models on patches from hospital 5, unseen in training (Table 1).
LeCun1989ZipCodeRejectPct:
  value: 12.1
  provenance: LECUN_ZIPCODE_1989
  name: LeCun et al. (1989) ZIP-code reader, test digits rejected (percent)
  description: Share of USPS test digits the network sent for review to reach 1 percent error on the rest.
LeCun1989ZipCodeAcceptedErrorPct:
  value: 1.0
  provenance: LECUN_ZIPCODE_1989
  name: LeCun et al. (1989) ZIP-code reader, error on accepted digits (percent)
  description: Classification error on the test digits the network accepted after rejecting 12.1 percent.
