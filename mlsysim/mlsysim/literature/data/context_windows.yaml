Gemini15ProPreviewTokens:
  value: 1000000
  provenance: GOOGLE_GEMINI_15_2024
  name: Gemini 1.5 Pro context window in limited preview (tokens)
  description: Offered to a limited group of developers, 15 February 2024.
Gemini15ProStandardTokens:
  value: 128000
  provenance: GOOGLE_GEMINI_15_2024
  name: Gemini 1.5 Pro standard context window (tokens)
  description: The window Gemini 1.5 Pro shipped with, 15 February 2024.
