# Cited data-selection results: model collapse, scored pruning, selection via
# proxy, data echoing, deduplication, a corpus's MinHash configuration,
# semi-supervised labels, augmentation, and an input-bound profile. Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
