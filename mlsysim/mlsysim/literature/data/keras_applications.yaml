# Keras Applications published model table: ImageNet top-1 accuracy and time
# per inference step at batch 32 on a CPU and on an A100 GPU. Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name (Pct = percent, Ms = milliseconds per step). Added 2026-10-20.
ResNet50Top1Pct:
  value: 74.9
  provenance: KERAS_APPLICATIONS_TABLE
  name: Keras ResNet50 ImageNet top-1 accuracy (percent)
  description: Top-1 accuracy of the Keras ResNet50 weights.
ResNet50CpuMsPerStep:
  value: 58.2
  provenance: KERAS_APPLICATIONS_TABLE
  name: Keras ResNet50 CPU time per inference step (ms)
  description: Batch 32 on an AMD EPYC CPU (92 cores).
ResNet50GpuMsPerStep:
  value: 4.6
  provenance: KERAS_APPLICATIONS_TABLE
  name: Keras ResNet50 GPU time per inference step (ms)
  description: Batch 32 on a Tesla A100.
MobileNetV2Top1Pct:
  value: 71.3
  provenance: KERAS_APPLICATIONS_TABLE
  name: Keras MobileNetV2 ImageNet top-1 accuracy (percent)
  description: Top-1 accuracy of the Keras MobileNetV2 weights.
MobileNetV2CpuMsPerStep:
  value: 25.9
  provenance: KERAS_APPLICATIONS_TABLE
  name: Keras MobileNetV2 CPU time per inference step (ms)
  description: Batch 32 on an AMD EPYC CPU (92 cores).
MobileNetV2GpuMsPerStep:
  value: 3.8
  provenance: KERAS_APPLICATIONS_TABLE
  name: Keras MobileNetV2 GPU time per inference step (ms)
  description: Batch 32 on a Tesla A100.
BatchSize:
  value: 32
  provenance: KERAS_APPLICATIONS_TABLE
  name: Batch size of the Keras timing (count)
  description: Inference step batch size for the published timings.
CpuCores:
  value: 92
  provenance: KERAS_APPLICATIONS_TABLE
  name: Cores of the Keras timing CPU (count)
  description: AMD EPYC CPU cores used for the CPU timings.
