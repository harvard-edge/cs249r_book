# Cited results of extraction attacks through a model's own query interface:
# partial parameter extraction from a production API (Carlini et al. 2024) and
# training-data extraction from GPT-2 (Carlini et al. 2021). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name (Usd = dollars, count otherwise). Query counts are the paper's upper
# bounds. Added 2026-10-20.
AdaHiddenWidth:
  value: 1024
  provenance: CARLINI_STEALING_LM_2024
  name: OpenAI ada hidden dimension recovered
  description: Width of the final projection recovered through the public API.
BabbageHiddenWidth:
  value: 2048
  provenance: CARLINI_STEALING_LM_2024
  name: OpenAI babbage hidden dimension recovered
Babbage002HiddenWidth:
  value: 1536
  provenance: CARLINI_STEALING_LM_2024
  name: OpenAI babbage-002 hidden dimension recovered
AdaQueriesUpperBound:
  value: 2000000
  provenance: CARLINI_STEALING_LM_2024
  name: Queries to extract ada's projection matrix, upper bound
BabbageQueriesUpperBound:
  value: 4000000
  provenance: CARLINI_STEALING_LM_2024
  name: Queries to extract babbage's projection matrix, upper bound
Gpt35QueriesUpperBound:
  value: 40000000
  provenance: CARLINI_STEALING_LM_2024
  name: Queries to recover gpt-3.5-turbo's hidden width, upper bound
  description: Dimension recovery only, for gpt-3.5-turbo-instruct and gpt-3.5-turbo-1106.
AdaProjectionRms:
  value: 0.0005
  provenance: CARLINI_STEALING_LM_2024
  name: RMS error of ada's extracted projection matrix
BabbageProjectionRms:
  value: 0.0007
  provenance: CARLINI_STEALING_LM_2024
  name: RMS error of babbage's extracted projection matrix
SmallModelMatrixCostUpperBoundUsd:
  value: 20
  provenance: CARLINI_STEALING_LM_2024
  name: Query cost to extract ada's or babbage's full projection matrix, upper bound (dollars)
Gpt35MatrixCostEstimateUsd:
  value: 2000
  provenance: CARLINI_STEALING_LM_2024
  name: Estimated query cost to recover gpt-3.5-turbo's full projection matrix, upper bound (dollars)
Gpt2SamplesGenerated:
