# Measured slowdowns of a victim task from co-runners on shared multicore hardware (paper results).
# Values are dimensionless slowdown factors (victim time over solo time). Added 2026-10-20.
ValsanCacheSlowdownMax:
  value: 21
  provenance: VALSAN_TAMING_NONBLOCKING_CACHES_2016
  name: "Largest execution-time increase with cache partitioning (x)"
  description: "Abstract: up to 21X, MSHR contention despite partitioning."
ValsanCortexA9ReadSlowdown:
  value: 2.1
  provenance: VALSAN_TAMING_NONBLOCKING_CACHES_2016
  name: "Cortex-A9 victim slowdown, three DRAM read co-runners (x)"
  description: "Exp. 2 text, BwRead(LLC) victim against BwRead(DRAM) co-runners."
ValsanNehalemReadSlowdown:
  value: 7.9
  provenance: VALSAN_TAMING_NONBLOCKING_CACHES_2016
  name: "Nehalem victim slowdown, three DRAM read co-runners (x)"
  description: "Exp. 2 text."
ValsanCortexA15ReadSlowdown:
  value: 10.6
  provenance: VALSAN_TAMING_NONBLOCKING_CACHES_2016
  name: "Cortex-A15 victim slowdown, three DRAM read co-runners (x)"
  description: "Fig. 2(b) label."
ValsanCortexA15WriteSlowdown:
  value: 21.4
  provenance: VALSAN_TAMING_NONBLOCKING_CACHES_2016
  name: "Cortex-A15 victim slowdown, three DRAM write co-runners (x)"
