# Horovod at Uber (Sergeev and Del Balso 2018). Values are dimensionless
# scalars as load_sourced_registry requires; the unit is in the key name.
# Added 2026-10-20.
HorovodBenchmarkGpus:
  value: 128
  provenance: SERGEEV_HOROVOD_2018
  name: Horovod benchmark GPUs (count)
  description: NVIDIA Pascal GPUs in the paper's largest benchmark of standard distributed TensorFlow (Section 2).
HorovodEthernetGbps:
  value: 25
  provenance: SERGEEV_HOROVOD_2018
  name: Horovod benchmark network (Gb/s Ethernet, TCP)
  description: The 25GbE TCP network of the paper's scaling benchmarks.
HorovodScalingEfficiencyPct:
  value: 88
  provenance: SERGEEV_HOROVOD_2018
  name: Horovod scaling efficiency (percent)
  description: The "88 percent efficiency mark" Horovod reached for Inception V3 and ResNet-101 (Section 8).
HorovodTensorFusionGainPct:
  value: 65
  provenance: SERGEEV_HOROVOD_2018
  name: Tensor Fusion performance gain, upper bound (percent)
  description: Up to 65 percent improvement on models with many layers over unoptimized TCP (Section 7).
HorovodFusionBufferMB:
  value: 64
  provenance: SERGEEV_HOROVOD_2018
  name: Tensor Fusion default buffer (MB)
  description: Default fusion buffer size (Section 7).
HorovodRdmaGainLowPct:
  value: 3
  provenance: SERGEEV_HOROVOD_2018
  name: RDMA gain over TCP, Inception V3 and ResNet-101, low (percent)
  description: '"Only achieved a three to four percent increase over TCP networking" (Section 8).'
HorovodRdmaGainHighPct:
  value: 4
  provenance: SERGEEV_HOROVOD_2018
  name: RDMA gain over TCP, Inception V3 and ResNet-101, high (percent)
  description: Upper end of the same three-to-four-percent range (Section 8).
HorovodRdmaGainVgg16Pct:
  value: 30
  provenance: SERGEEV_HOROVOD_2018
  name: RDMA speedup for VGG-16 (percent)
  description: '"A significant 30 percent speedup when we leveraged RDMA networking" (Section 8).'
HorovodTimelineOriginMs:
  value: 18500
  provenance: SERGEEV_HOROVOD_2018
  name: Horovod Timeline screenshot, first tick (ms)
  description: The first time tick of the redrawn Horovod Timeline screenshot; the trace series is in ms after it.
HorovodTimelineAllreduceStartMs:
  value: 18663.501
  provenance: SERGEEV_HOROVOD_2018
  name: Horovod Timeline, ALLREDUCE start of tensors 2 to 4 (ms)
  description: Start time printed in the screenshot's detail pane.
HorovodTimelineAllreduceSpanMs:
  value: 184.063
  provenance: SERGEEV_HOROVOD_2018
  name: Horovod Timeline, ALLREDUCE span of tensors 2 to 4 (ms)
  description: Duration printed in the screenshot's detail pane.
# 1-bit Adam (Tang et al. 2021), abstract. Added 2026-10-20.
OneBitAdamVolumeReduction:
  value: 5
  provenance: TANG_ONEBIT_ADAM_2021
  name: 1-bit Adam communication-volume reduction, upper bound (x)
  description: Reduces the communication volume by up to 5 times.
OneBitAdamBertLargeSpeedup:
  value: 3.3
  provenance: TANG_ONEBIT_ADAM_2021
  name: 1-bit Adam BERT-Large pretraining throughput gain, upper bound (x)
  description: Up to 3.3 times higher throughput for BERT-Large pretraining.
OneBitAdamSquadSpeedup:
  value: 2.9
  provenance: TANG_ONEBIT_ADAM_2021
  name: 1-bit Adam SQuAD fine-tuning throughput gain, upper bound (x)
  description: Up to 2.9 times higher throughput for SQuAD fine-tuning.
OneBitAdamMaxGpus:
  value: 256
  provenance: TANG_ONEBIT_ADAM_2021
  name: 1-bit Adam experiments, largest GPU count
  description: Experiments on up to 256 GPUs.
HorovodTensorflowResourceLossPct:
  value: 50
  provenance: SERGEEV_HOROVOD_2018
  name: Resources lost to communication, standard distributed TensorFlow at 128 GPUs (percent, approximate)
  description: '"We lost about half of our resources due to communication overhead when training on 128 GPUs" (Section 2).'
