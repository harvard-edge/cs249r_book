# Averaged locked-wheel friction coefficients on contaminated surfaces (TRL PPR073, Lambourn and Viner
# 2006, Table 5.1). Skid cars run treaded tyres; the PFT trailer runs a smooth ASTM test tyre.
# Dimensionless coefficients as published. Added 2026-10-20.
ConcreteDrySkidCars:
  value: 0.85
  provenance: TRL_PPR073_2006
  name: "Concrete, dry, skid cars"
ConcreteWetPft:
  value: 0.52
  provenance: TRL_PPR073_2006
  name: "Concrete, wet, PFT smooth tyre (pre-wetted tests only)"
ConcreteDieselSkidCars:
  value: 0.44
  provenance: TRL_PPR073_2006
  name: "Concrete, diesel oil, skid cars"
ConcreteDieselPft:
  value: 0.24
  provenance: TRL_PPR073_2006
  name: "Concrete, diesel oil, PFT smooth tyre"
AsphaltEngineOilSkidCars:
  value: 0.41
  provenance: TRL_PPR073_2006
  name: "Asphalt, waste engine oil, skid cars"
AsphaltEngineOilPft:
  value: 0.01
  provenance: TRL_PPR073_2006
  name: "Asphalt, waste engine oil, PFT smooth tyre"
