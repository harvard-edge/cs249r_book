# Cited production storage-system measurements (report results). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
Fs3ReadThroughputTiBps:
  value: 6.6
  provenance: DEEPSEEK_3FS_README
  name: 3FS aggregate read throughput, stress test (TiB/s)
  description: Aggregate read throughput (about 6.6 TiB/s) of the 180-node 3FS cluster, with background training traffic.
Fs3StorageNodes:
  value: 180
  provenance: DEEPSEEK_3FS_README
  name: 3FS stress-test storage nodes (count)
  description: Storage nodes in the 3FS read stress test.
Fs3SsdsPerNode:
  value: 16
  provenance: DEEPSEEK_3FS_README
  name: 3FS NVMe SSDs per storage node (count)
  description: NVMe SSDs in each 3FS storage node.
Fs3SsdCapacityTiB:
  value: 14
  provenance: DEEPSEEK_3FS_README
  name: 3FS SSD capacity (TiB)
  description: Capacity of each NVMe SSD in the 3FS storage nodes.
Fs3NicsPerNode:
  value: 2
  provenance: DEEPSEEK_3FS_README
  name: 3FS InfiniBand NICs per storage node (count)
  description: InfiniBand adapters in each 3FS storage node.
Fs3NicGbps:
  value: 200
  provenance: DEEPSEEK_3FS_README
  name: 3FS InfiniBand NIC rate (Gb/s)
  description: Line rate of each InfiniBand adapter in the 3FS cluster.
Fs3ClientNodes:
  value: 500
  provenance: DEEPSEEK_3FS_README
  name: 3FS stress-test client nodes (count, lower bound)
  description: The README reports approximately 500+ client nodes; 500 is the stated lower bound.
