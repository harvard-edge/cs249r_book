# Cited production serving-incident figures (report results). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
Anthropic2025MisroutedShareWorstHour:
  value: 0.16
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: Requests misrouted at the worst hour (fraction)
  description: Share of one model's requests misrouted at the worst-affected hour, after a load-balancing change.
Anthropic2025AffectedUserShare:
  value: 0.30
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: Coding-tool users with at least one misrouted message (fraction, approximate)
  description: Approximate share of the coding tool's active users with at least one message routed to the wrong server type.
