# Cited production serving-incident figures (report results). Values are
# dimensionless scalars as load_sourced_registry requires; the unit is in the
# key name. Added 2026-10-20.
Anthropic2025MisroutedShareInitial:
  value: 0.008
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: Requests misrouted to long-context servers at first (fraction)
  description: Share of one model's requests sent to servers configured for a longer context window when the routing bug began.
Anthropic2025MisroutedShareWorstHour:
  value: 0.16
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: Requests misrouted at the worst hour (fraction)
  description: Share of one model's requests misrouted at the worst-affected hour, after a load-balancing change.
Anthropic2025AffectedUserShare:
  value: 0.30
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: Coding-tool users with at least one misrouted message (fraction, approximate)
  description: Approximate share of the coding tool's active users with at least one message routed to the wrong server type.
Anthropic2025TopKProbeLength:
  value: 12000
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: Approximate top-k reproduction array length (elements)
  description: Length of the all-zeros array, with a single one, used to reproduce the miscompiled approximate top-k.
Anthropic2025TopKFirstFailingIndex:
  value: 10240
  provenance: ANTHROPIC_2025_SERVING_POSTMORTEM
  name: First index at which the approximate top-k missed the maximum (index)
  description: On the accelerator the approximate top-k missed the single one for every position at or after this index.
