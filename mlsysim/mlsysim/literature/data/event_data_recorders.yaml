# Recording windows that US rules require of automotive event data recorders (regulation text,
# retrieved on the date in the provenance record). Values are dimensionless scalars as
# load_sourced_registry requires; the unit is in the key name. Added 2026-10-20.
PreCrashWindowS:
  value: 20
  provenance: ECFR_49_CFR_563_EDR
  name: "Pre-crash recording interval for speed, accelerator, and brake (s, 49 CFR 563.7 Table I)"
  description: "Recording interval -20 to 0 s, phase-in from 2028."
PreCrashRateHz:
  value: 10
  provenance: ECFR_49_CFR_563_EDR
  name: "Pre-crash sample rate (samples per second, 49 CFR 563.7 Table I)"
  description: "Data sample rate for the same elements."
LegacyPreCrashWindowS:
  value: 5
  provenance: ECFR_49_CFR_563_EDR
  name: "Pre-crash recording interval before the phase-in (s, 49 CFR 563.7 Table I footnote 4)"
  description: "Recording interval -5.0 to 0 s."
LegacyPreCrashRateHz:
  value: 2
  provenance: ECFR_49_CFR_563_EDR
  name: "Pre-crash sample rate before the phase-in (samples per second)"
  description: "Data sample rate before the phase-in."
