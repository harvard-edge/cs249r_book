# Security/cryptography overhead anchors used by the security_privacy chapter.
# Order-of-magnitude figures from TEE vendor documentation (Intel SGX, ARM
# TrustZone), FHE benchmark literature, and security-engineering practice.
FheOverheadMultiplier:
  value: 10000
  provenance: FHE_OVERHEAD
  name: FHE compute overhead multiplier
  description: Conservative low-end slowdown of fully homomorphic encryption vs plaintext inference.
SgxEpcOverflowPenalty:
  value: 100
  provenance: TEE_HARDWARE_SPECS
  name: SGX EPC overflow penalty (x)
  description: Approximate latency penalty when an SGX enclave's working set exceeds the Enclave Page Cache and triggers secure paging.
SgxEnclaveSizeMb:
  value: 128
  provenance: TEE_HARDWARE_SPECS
  name: SGX enclave page cache size (MB)
  description: Nominal Enclave Page Cache size that must hold both model weights and activations for in-enclave inference.
SgxContextSwitchLowUs:
  value: 15
  provenance: TEE_HARDWARE_SPECS
  name: SGX context-switch overhead, low (us)
  description: Lower bound on per-inference enclave-transition overhead.
SgxContextSwitchHighUs:
  value: 30
  provenance: TEE_HARDWARE_SPECS
  name: SGX context-switch overhead, high (us)
  description: Upper bound on per-inference enclave-transition overhead.
TrustZoneWorldSwitchLowCycles:
  value: 300
  provenance: TEE_HARDWARE_SPECS
  name: TrustZone world-switch latency, low (cycles)
  description: Lower bound on secure/nonsecure world-switch cost, best-case cache state.
TrustZoneWorldSwitchHighCycles:
  value: 1000
  provenance: TEE_HARDWARE_SPECS
  name: TrustZone world-switch latency, high (cycles)
  description: Upper bound on secure/nonsecure world-switch cost, cold-cache state.
TrustZoneSecurePowerLowPct:
  value: 15
  provenance: TEE_HARDWARE_SPECS
  name: Secure-mode power overhead, low (percent)
  description: Lower bound on additional power drawn by cryptographic operations in secure mode.
TrustZoneSecurePowerHighPct:
  value: 30
  provenance: TEE_HARDWARE_SPECS
  name: Secure-mode power overhead, high (percent)
  description: Upper bound on additional power drawn by cryptographic operations in secure mode.
MtlsHandshakeLowMs:
  value: 15
  provenance: TEE_HARDWARE_SPECS
  name: mTLS handshake overhead, low (ms)
  description: Lower bound on the one-time mutual-TLS handshake cost per connection.
MtlsHandshakeHighMs:
  value: 30
  provenance: TEE_HARDWARE_SPECS
  name: mTLS handshake overhead, high (ms)
  description: Upper bound on the one-time mutual-TLS handshake cost per connection.
HsmRsa2048OpsPerSec:
  value: 10000
  provenance: HSM_GPU_CRYPTO
  name: HSM RSA-2048 throughput (ops/s)
  description: Representative enterprise-HSM RSA-2048 signing throughput.
GpuRsa2048OpsPerSec:
  value: 100000
  provenance: HSM_GPU_CRYPTO
  name: GPU RSA-2048 throughput (ops/s)
  description: Representative general-purpose GPU RSA-2048 throughput, ~10x an HSM.
HsmUnitCostLowUsd:
  value: 20000
  provenance: HSM_GPU_CRYPTO
  name: HSM unit cost, low (USD)
  description: Lower bound on enterprise hardware-security-module unit price.
HsmUnitCostHighUsd:
  value: 100000
  provenance: HSM_GPU_CRYPTO
  name: HSM unit cost, high (USD)
  description: Upper bound on enterprise hardware-security-module unit price.
GpuCryptoUnitCostUsd:
  value: 1000
  provenance: HSM_GPU_CRYPTO
  name: GPU crypto unit cost (USD)
  description: Representative general-purpose GPU unit price for the HSM-vs-GPU throughput comparison.
