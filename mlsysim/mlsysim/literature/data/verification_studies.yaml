# Cited results of verification studies of autonomous-driving stacks: fault
# injection (DriveFI) and rare-event estimation (O'Kelly et al. 2018).
# Values are dimensionless scalars as load_sourced_registry requires; the unit
# is in the key name. Added 2026-10-20.
# DriveFI: Bayesian fault injection into NVIDIA DriveAV and Baidu Apollo (Jha et al. 2019)
DriveFiFaultListSize:
  value: 98400
  provenance: JHA_2019_DRIVEFI
  name: "Faults in the DriveFI fault list (fault model b)"
  description: Sec. I, Results.
DriveFiExhaustiveDays:
  value: 615
  provenance: JHA_2019_DRIVEFI
  name: "Days an exhaustive evaluation of the fault list would take"
  description: Sec. I, Results.
DriveFiBayesianHours:
  value: 4
  provenance: JHA_2019_DRIVEFI
  name: "Hours within which Bayesian FI found the safety-critical faults (less than)"
  description: Abstract; Sec. I, Results.
DriveFiAccelerationX:
  value: 3690
  provenance: JHA_2019_DRIVEFI
  name: "Acceleration of Bayesian FI over exhaustive evaluation (times)"
  description: Sec. I, Results.
DriveFiCriticalFaults:
  value: 561
  provenance: JHA_2019_DRIVEFI
  name: "Safety-critical faults found by Bayesian FI"
  description: Abstract; Sec. I, Results.
DriveFiHazardFaults:
  value: 460
  provenance: JHA_2019_DRIVEFI
  name: "Found faults that manifested as safety hazards"
  description: Sec. I, Results.
DriveFiHazardScenes:
  value: 68
  provenance: JHA_2019_DRIVEFI
  name: "Safety-critical scenes associated with the hazard faults"
  description: Sec. I, Results.
DriveFiScenes:
  value: 7200
  provenance: JHA_2019_DRIVEFI
  name: "Scenes in the driving scenarios"
  description: Sec. I, Results.
DriveFiRandomExperiments:
  value: 5000
  provenance: JHA_2019_DRIVEFI
  name: "Random FI experiments over several weeks (no safety hazard found)"
  description: Sec. I, Results.
DriveFiGpuInjections:
  value: 2400
  provenance: JHA_2019_DRIVEFI
  name: "Random GPU fault injections into DriveAV"
  description: Sec. VI-A.
DriveFiGpuSdcPct:
  value: 1.93
  provenance: JHA_2019_DRIVEFI
  name: "Single-bit GPU injections that led to silent data corruption (percent)"
  description: Sec. I.
DriveFiGpuDuePct:
