# Cited training-curve readings from reinforcement learning of language models
# on verifiable rewards. Values are read from published plots by eye (the
# provenance notes say which curve and how), so they carry the precision of a
# reading, not of a table. Added 2026-10-20.
R1ZeroResponseLengthStartBelowTokens:
  value: 1000
  provenance: DEEPSEEK_2025_R1
  name: DeepSeek-R1-Zero average response length at the start of RL, upper reading (tokens)
  description: Figure 3, smoothed curve near 500 at step 0, read as "under 1,000".
R1ZeroResponseLengthEndAboutTokens:
  value: 10000
  provenance: DEEPSEEK_2025_R1
  name: DeepSeek-R1-Zero average response length at the end of the plotted RL run, reading (tokens)
  description: Figure 3, smoothed curve near 9,500 at the last step, read as "about 10,000".
R1ZeroPlottedStepsAbout:
  value: 8000
  provenance: DEEPSEEK_2025_R1
  name: DeepSeek-R1-Zero RL steps plotted in the length figure, reading (steps)
  description: Figure 3 x-axis runs to about 8,400 steps.
DapoEntropyStartAbout:
  value: 0.7
  provenance: YU_2025_DAPO
  name: DAPO actor generation entropy at the start of training, reading
  description: Figure 2(b), both curves start near 0.67 to 0.74.
DapoSymmetricClipCollapseStepsAbout:
  value: 1000
  provenance: YU_2025_DAPO
  name: steps within which entropy falls near zero without Clip-Higher, reading (steps)
  description: Figure 2(b), the curve without Clip-Higher is below 0.02 by step 1,000.
DapoClipHigherEntropyAbout:
  value: 0.4
  provenance: YU_2025_DAPO
  name: generation entropy held with Clip-Higher, reading
  description: Figure 2(b), the curve with Clip-Higher settles between about 0.35 and 0.46.
