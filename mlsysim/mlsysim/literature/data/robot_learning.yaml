# Cited figures of published robot-learning runs: sim-to-real transfer (Dactyl), massively parallel
# simulation (legged_gym), on-robot reinforcement learning (HIL-SERL, QT-Opt), a physical grasping
# farm, a multimodal policy evaluation, and a VLA's pretraining mixture. Values are dimensionless
# scalars as load_sourced_registry requires; the unit is in the key name. Per-trial Dactyl results are
# the series Literature.DactylPhysicalTrials. Added 2026-10-20.
