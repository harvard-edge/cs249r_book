# Cited figures on human takeover of automated machines: filed disengagement records,
# human-in-the-loop learning windows, driver recovery after resuming control, and the
# regulatory limits that bound takeover time. Units are in the key names. Added 2026-10-20.
SiriusPreInterventionActions:
  value: 15
  provenance: LIU_2023_SIRIUS
  name: "Sirius pre-intervention class length (robot actions)"
  description: "l = 15 actions before an intervention are relabeled."
SiriusPreInterventionWindowS:
  value: 2
  provenance: LIU_2023_SIRIUS
  name: "Sirius operator reaction time behind the pre-intervention window (s)"
  description: "Average reaction time of 2 seconds."
MeratLateralStabilizationLowS:
  value: 35
  provenance: MERAT_2014_TRANSITION
  name: "Time to stabilize lateral control after resuming manual driving, low (s)"
  description: "Around 35-40 s."
MeratLateralStabilizationHighS:
  value: 40
  provenance: MERAT_2014_TRANSITION
  name: "Time to stabilize lateral control after resuming manual driving, high (s)"
  description: "Around 35-40 s."
R157MinimumRiskManoeuvreDelayS:
  value: 10
  provenance: UNECE_R157_ALKS
  name: "UN R157 earliest start of a minimum risk manoeuvre after a transition demand (s)"
  description: "Para 5.4.4.1."
R157DssadTimestampAccuracyS:
  value: 1.0
  provenance: UNECE_R157_ALKS
  name: "UN R157 DSSAD timestamp accuracy (s)"
  description: "Para 8.3.1(d)(ii), +/- 1.0 s."
