# Cited results of differentially private training. Values are dimensionless
# scalars as load_sourced_registry requires; the unit is in the key name
# (Pct = percent, Epochs, otherwise the quantity itself). These values belong
# to their experiments and are not reusable constants for another run.
# Added 2026-10-20.
