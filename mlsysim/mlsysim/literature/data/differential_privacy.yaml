# Cited results of differentially private training. Values are dimensionless
# scalars as load_sourced_registry requires; the unit is in the key name
# (Pct = percent, Epochs, otherwise the quantity itself). These values belong
# to their experiments and are not reusable constants for another run.
# Added 2026-10-20.
MnistNonprivateAccuracyPct:
  value: 98.3
  provenance: ABADI_DPSGD_2016
  name: MNIST nonprivate baseline accuracy (percent)
Cifar10NonprivateAccuracyPct:
  value: 94.98
  provenance: ZAGORUYKO_WRN_2016
  name: CIFAR-10 nonprivate reference accuracy, WRN-16-4 without dropout (percent; 100 minus the 5.02 percent test error)
Cifar10AbadiAccuracyAtEps8Pct:
  value: 73.0
  provenance: ABADI_DPSGD_2016
  name: CIFAR-10 accuracy at epsilon 8, Abadi et al. 2016 (percent)
Cifar10DeAccuracyAtEps8Pct:
  value: 81.4
  provenance: DE_DP_IMAGE_CLASSIFICATION_2022
  name: CIFAR-10 accuracy at epsilon 8 from scratch, De et al. 2022 (percent)
Cifar10ComparisonEpsilon:
  value: 8
  provenance: ABADI_DPSGD_2016
  name: Privacy budget of the CIFAR-10 comparison points
