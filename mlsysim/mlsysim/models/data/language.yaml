GPT3:
  __type__: TransformerWorkload
  name: GPT-3 (175B)
  release_year: 2020
  architecture: Transformer
  metadata:
    provenance:
      kind: literature
      ref: Brown et al. (2020), Language Models are Few-Shot Learners
      url: https://arxiv.org/abs/2005.14165
      verified: '2026-03-06'
      id: prov:gpt3-brown-2020
  parameters: 175000000000.0 param
  inference_flops: 350000000000.0 flop
  layers: 96
  hidden_dim: 12288
  heads: 96
  training_ops: 3.14e+23 flop
  training_tokens: 300000000000.0 count
  # Corrected 2026-09-29. Reference run from Patterson et al. (2021), Table 4 and
  # Appendix A (catalog key PATTERSON_CARBON_2021): 10,000 V100 GPUs (NVIDIA's
  # stated count) at the 24.6 TFLOP/s per GPU OpenAI measured, which gives ~14.8 days
  # for 3.14e23 FLOPs (~20% of the 125 TFLOP/s V100 peak; PaLM Table 3 reports 21.3%).
  # Only the product (148,000 V100-days) is constrained, and it reproduces the
  # 1,287 MWh below (x 330 W x PUE 1.10). The old 1,024 / 25 d pairing was an
  # A100 what-if (~142 TFLOP/s per GPU, 114% of V100 peak), not the GPT-3 run.
  training_accelerators_ref: 10000 count
  training_days_ref: 14.8 d
  training_hardware_label: V100
  training_energy_mwh: 1287 MWh
  # Added 2026-09-28. Context window: Brown et al. (2020) Sec. 2.1 (n_ctx = 2048).
  # Vocabulary: the 50,257-token byte-level BPE inherited from GPT-2 (Radford
  # et al. 2019). Emissions: Patterson et al. (2021), Table 4, 552 tCO2e
  # (catalog key PATTERSON_CARBON_2021; the energy above is from the same table).
  context_length: 2048
  vocab_size: 50257
  training_co2e: 552 metric_ton
GPT4:
  # Retyped as MoE (audit fix 2026-06-06): the SemiAnalysis estimate this entry
  # cites describes 16 experts with 2 routed per token (~280B active), so
  # per-token inference FLOPs follow the registry's MoE convention of
  # 2 x ACTIVE params (matching DeepSeek_V3 and Mixtral_8x7B), not 2 x total —
  # the old 3.52e12 figure overstated per-token compute ~6x.
  __type__: SparseTransformerWorkload
  name: GPT-4
  architecture: MoE Transformer
  metadata:
    provenance:
      kind: estimate
      ref: SemiAnalysis (2023) public MoE estimate; OpenAI (2023) technical report (no parameter count)
      url: https://www.semianalysis.com/p/gpt-4-architecture-infrastructure
      verified: '2026-09-29'
      notes: '1.76T total / ~280B active parameters are third-party estimates, not OpenAI disclosures. Training fleet per SemiAnalysis (2023): ~25,000 A100s for 90 to 100 days at 32 to 36% MFU, ~2.15e25 FLOP. The registry takes the 100-day upper end so training_accelerators_ref x training_days_ref = training_gpu_days (2.5M A100-days).'
      id: prov:gpt4-semianalysis-estimate
    description: '1.76T total / ~280B active parameters are third-party estimates, not OpenAI disclosures. Training fleet per SemiAnalysis (2023): ~25,000 A100s for 90 to 100 days at 32 to 36% MFU, ~2.15e25 FLOP. The registry takes the 100-day upper end so training_accelerators_ref x training_days_ref = training_gpu_days (2.5M A100-days).'
  parameters: 1760000000000.0 param
  active_parameters: 280000000000.0 param
  inference_flops: 560000000000.0 flop
  layers: 120
  hidden_dim: 16384
  heads: 128
  experts: 16
  active_experts_per_token: 2
  training_accelerators_ref: 25000 count
  training_days_ref: 100 d
  training_gpu_days: 2500000.0
  training_hardware_label: A100-class
