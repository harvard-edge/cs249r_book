GPT4:
  # Retyped as MoE (audit fix 2026-06-06): the SemiAnalysis estimate this entry
  # cites describes 16 experts with 2 routed per token (~280B active), so
  # per-token inference FLOPs follow the registry's MoE convention of
  # 2 x ACTIVE params (matching DeepSeek_V3 and Mixtral_8x7B), not 2 x total —
  # the old 3.52e12 figure overstated per-token compute ~6x.
  __type__: SparseTransformerWorkload
  name: GPT-4
  architecture: MoE Transformer
  metadata:
    provenance:
      kind: estimate
      ref: SemiAnalysis (2023) public MoE estimate; OpenAI (2023) technical report (no parameter count)
      url: https://www.semianalysis.com/p/gpt-4-architecture-infrastructure
      verified: '2026-03-06'
      notes: 1.76T total / ~280B active parameters and 2.5M GPU-days are third-party estimates, not OpenAI disclosures.
      id: prov:gpt4-semianalysis-estimate
    description: 1.76T total / ~280B active parameters and 2.5M GPU-days are third-party estimates, not OpenAI disclosures.
  parameters: 1760000000000.0 param
  active_parameters: 280000000000.0 param
  inference_flops: 560000000000.0 flop
  layers: 120
  hidden_dim: 16384
  heads: 128
  experts: 16
  active_experts_per_token: 2
  training_accelerators_ref: 25000 count
  training_days_ref: 90 d
  training_gpu_days: 2500000.0
  training_hardware_label: A100-class
