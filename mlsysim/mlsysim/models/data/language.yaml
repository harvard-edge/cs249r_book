PaLM_540B:
  # Added 2026-09-28. Chowdhery et al. (2022), Table 1 (118 layers, d_model
  # 18,432, 48 heads) and Sec. 4 (6,144 TPU v4 chips across two pods).
  # training_ops is not repeated here: the PaLM compute estimate lives in
  # Literature.ComputeTrend. Training duration (added 2026-10-15): Appendix B
  # reports 1,200 hours on 6,144 TPU v4 chips plus 336 hours on 3,072 chips,
  # "including some downtime and repeated steps"; the two phases sum to 1,536
  # hours = 64 days of wall-clock time. The phase figures live in
  # Literature.TrainingRuns.Palm540B_*; test_palm_training_duration guards the sum.
  # training_gpu_days is deliberately unset: 6,144 x 64 overstates the
  # chip-days because the second phase ran on half the chips.
  __type__: TransformerWorkload
  name: PaLM (540B)
  release_year: 2022
  architecture: Transformer
  metadata:
    provenance: '@prov:PALM_MFU'
  parameters: 540000000000.0 param
  inference_flops: 1080000000000.0 flop
  layers: 118
  hidden_dim: 18432
  # Attention (added 2026-10-20): Table 1, 48 heads of size 256, and Sec. 2,
  # multi-query attention (one key-value head shared by all query heads).
  # PaLM decouples the head size from d_model / heads (384), so head_dim is
  # stated explicitly.
  heads: 48
  kv_heads: 1
  head_dim: 256
  training_tokens: 780000000000.0 count
  training_accelerators_ref: 6144 count
  training_days_ref: 64 d
  training_hardware_label: TPU v4
