BERT_Base:
  __type__: TransformerWorkload
  name: BERT-Base
  architecture: Transformer
  metadata:
    provenance:
      kind: literature
      ref: 'Devlin et al. (2019), BERT: Pre-training of Deep Bidirectional Transformers'
      url: https://arxiv.org/abs/1810.04805
      verified: '2026-03-06'
      notes: The 22 GFLOP inference reference is one sequence at length 128.
      id: prov:devlin-bert-2019
  parameters: 110000000.0 param
  inference_flops: 22000000000.0 flop
  layers: 12
  hidden_dim: 768
  heads: 12
  # Added 2026-10-20. Devlin et al. (2019), Sec. 3 and Appendix A.2: learned
  # position embeddings for sequences of up to 512 tokens.
  context_length: 512
BERT_Large:
  __type__: TransformerWorkload
  name: BERT-Large
  release_year: 2018
  architecture: Transformer
  metadata:
    provenance:
      kind: literature
      ref: 'Devlin et al. (2019), BERT: Pre-training of Deep Bidirectional Transformers'
      url: https://arxiv.org/abs/1810.04805
      verified: '2026-03-06'
      id: prov:devlin-bert-2019
  parameters: 340000000.0 param
  inference_flops: 72000000000.0 flop
  layers: 24
  hidden_dim: 1024
  heads: 16
  # Added 2026-09-28. Devlin et al. (2019), Appendix A.2: "Training of BERT_LARGE
  # was performed on 16 Cloud TPUs (64 TPU chips total). Each pretraining took
  # 4 days to complete."
  training_accelerators_ref: 64 count
  training_days_ref: 4 d
  training_hardware_label: Cloud TPU (16 devices, 64 chips)
DeepSeek_V3:
  __type__: SparseTransformerWorkload
  name: DeepSeek-V3
  release_year: 2024
  architecture: MoE Transformer
  metadata:
    provenance:
      kind: literature
      ref: DeepSeek-AI (2025), Insights Into DeepSeek-V3
      url: https://arxiv.org/abs/2412.19437
      verified: '2026-03-06'
      id: prov:deepseek-v3-2024
  parameters: 671000000000.0 param
  inference_flops: 74000000000.0 flop
  layers: 61
  hidden_dim: 7168
  heads: 56
  # Multi-Head Latent Attention: the report's compressed key-value latent
  # (d_c = 512) plus the decoupled rotary position key (d_h^R = 64). Together
  # they are the only per-token state MLA keeps resident, which is why the
  # cache is far smaller than a grouped-query model of the same depth.
  kv_lora_rank: 512
  qk_rope_head_dim: 64
  active_parameters: 37000000000.0 param
  experts: 256
  active_experts_per_token: 8
Mixtral_8x7B:
  __type__: SparseTransformerWorkload
  name: Mixtral-8x7B
  architecture: MoE Transformer
  metadata:
    provenance:
      kind: literature
      ref: Jiang et al. (2024), Mixtral of Experts
      url: https://arxiv.org/abs/2401.04088
      verified: '2026-05-31'
      notes: The paper reports 47B accessible parameters and 13B active parameters per token; the registry stores 46.7B and 12.9B for arithmetic while rendered prose rounds them.
      id: prov:jiang-mixtral-2024
  parameters: 46700000000.0 param
  inference_flops: 25800000000.0 flop
  layers: 32
  hidden_dim: 4096
  heads: 32
  # 2026-10-12: grouped-query attention, num_key_value_heads = 8 in the
  # published config.json (mistralai/Mixtral-8x7B-v0.1 @ fc7ac946). Without
  # it the KV sizing fell back to 32 heads and overstated the cache 4x.
  kv_heads: 8
  active_parameters: 12900000000.0 param
  experts: 8
  active_experts_per_token: 2
GPT2:
  __type__: TransformerWorkload
  name: GPT-2 (1.5B)
  architecture: Transformer
  metadata:
    provenance:
      kind: literature
      ref: Radford et al. (2019), Language Models are Unsupervised Multitask Learners
      url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
      verified: '2026-03-06'
      id: prov:radford-gpt2-2019
  parameters: 1500000000.0 param
  inference_flops: 3000000000.0 flop
  # Epoch AI Notable AI Models estimate (~1.5e21 FLOP); consistent with
  # 6*N*D at roughly 165B tokens seen across epochs of WebText.
  training_ops: 1.5e+21 flop
  training_dataset_size: 40 GB
  layers: 48
  hidden_dim: 1600
  heads: 25
  # Added 2026-10-20. Radford et al. (2019), Sec. 2.3: "The vocabulary is
  # expanded to 50,257. We also increase the context size from 512 to 1024
  # tokens"; config.json of openai-community/gpt2-xl (vocab_size 50257,
  # n_positions 1024).
  context_length: 1024
  vocab_size: 50257
