DLRM:
  __type__: Workload
  name: DLRM
  architecture: DLRM
  metadata:
    provenance:
      kind: literature
      ref: Naumov et al. (2019), Deep Learning Recommendation Model (DLRM)
      url: https://arxiv.org/abs/1906.00091
      verified: '2026-03-06'
      id: prov:naumov-dlrm-2019
  # Reference model used by the book: 25e9 FP32 embedding values (4 B each) = 100 GB,
  # larger than one 80 GiB accelerator, so the tables span the GPUs of one node or host memory.
  # parameter_range_min/max below describe production recommenders in the field,
  # not this reference model (vol1 streamline review 2026-10-11).
  model_size: 100 GB
  embedding_entries: 25000000000.0 count
  parameter_range_min: 100 Bparam
  parameter_range_max: 10 Tparam
