      id: prov:lecun-lenet1-size-estimate
  parameters: 10000.0 param
MobileNetV2:
  __type__: CNNWorkload
  name: MobileNetV2
  architecture: CNN
  metadata:
    provenance:
      kind: illustrative
      ref: 'Sandler et al. (2018) MobileNetV2 architecture with an illustrative book energy anchor'
      url: https://arxiv.org/abs/1801.04381
      verified: '2026-08-11'
      notes: >-
        Alpha=1.0, 1000-class ImageNet classifier at 224x224 input resolution. The paper reports about
        300M multiply-adds, represented here as 600 MFLOP under the book's
        convention that one multiply-accumulate is two FLOPs. The 0.1 mJ
        inference-energy value is an illustrative book anchor, not a
        measurement reported by Sandler et al. (2018).
      id: prov:mobilenetv2-with-energy-anchor
  parameters: 3504872.0 param
  inference_flops: 600000000.0 flop
  inference_energy: 0.1 mJ
  layers: 54
