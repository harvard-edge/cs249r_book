ResNet50:
  __type__: CNNWorkload
  name: ResNet-50
  architecture: CNN
  metadata:
    provenance:
      kind: literature
      ref: He et al. (2016), Deep Residual Learning for Image Recognition
      url: https://arxiv.org/abs/1512.03385
      verified: '2026-06-10'
      id: prov:he-resnet-2016
      notes: >-
        Architecture, 50-layer depth, and 25.6M parameter count per He et al. (2016).
        inference_flops is ~8.2 GFLOP for a 224x224 forward pass under the book's
        convention that one multiply-accumulate is two FLOPs. This corresponds to
        the commonly reported ~4.1 GMAC count (torchvision/fvcore ~4.09 GMAC).
        He et al. Table 1 reports 3.8e9 operations under its own counting convention.
  parameters: 25600000.0 param
  inference_flops: 8200000000.0 flop
  layers: 50
YOLOv8_Nano:
  __type__: CNNWorkload
  name: YOLOv8-Nano
  architecture: CNN
  metadata:
