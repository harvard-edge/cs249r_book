LeNet1:
  __type__: Workload
  name: LeNet-1
  architecture: CNN
  metadata:
    provenance:
      kind: estimate
      ref: LeCun et al. (1989), Backpropagation Applied to Handwritten Zip Code Recognition
      url: https://doi.org/10.1162/neco.1989.1.4.541
      verified: '2026-05-31'
