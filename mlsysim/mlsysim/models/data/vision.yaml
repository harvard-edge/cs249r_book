      url: https://docs.ultralytics.com/models/yolov8/
      verified: '2026-03-06'
      notes: The 8.7 GFLOP inference reference uses a 640x640 input.
      id: prov:ultralytics-yolov8
  parameters: 3200000.0 param
  inference_flops: 8700000000.0 flop
  layers: 225
