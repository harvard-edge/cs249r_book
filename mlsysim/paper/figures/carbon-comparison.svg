<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="460" fill="#fff" />

  <!-- ===== CO₂ Emissions (left panel) ===== -->
  <text x="200" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#333">CO₂ Emissions (tonnes)</text>

  <!-- Y axis -->
  <line x1="80" y1="90" x2="80" y2="320" stroke="#333" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y1="320" x2="320" y2="320" stroke="#333" stroke-width="1"/>

  <!-- Y ticks -->
  <text x="72" y="320" text-anchor="end" font-size="12" fill="#555">0</text>
  <text x="72" y="274" text-anchor="end" font-size="12" fill="#555">15</text>
  <text x="72" y="228" text-anchor="end" font-size="12" fill="#555">30</text>
  <text x="72" y="182" text-anchor="end" font-size="12" fill="#555">45</text>
  <text x="72" y="136" text-anchor="end" font-size="12" fill="#555">60</text>
  <line x1="80" y1="274" x2="320" y2="274" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="228" x2="320" y2="228" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="182" x2="320" y2="182" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="136" x2="320" y2="136" stroke="#eee" stroke-width="0.5"/>

  <!-- Iowa bar: 58.4 tonnes -->
  <rect x="110" y="141" width="70" height="179"  fill="#fed7aa" opacity="0.85"/>
  <text x="145" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">58.4</text>
  <text x="145" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Iowa</text>
  <text x="145" y="354" text-anchor="middle" font-size="11" fill="#555">680 gCO₂/kWh</text>
  <text x="145" y="366" text-anchor="middle" font-size="11" fill="#555">PUE 1.12</text>

  <!-- Québec bar: 1.6 tonnes -->
  <rect x="220" y="315" width="70" height="5"  fill="#10b981" opacity="0.85"/>
  <text x="255" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#10b981">1.6</text>
  <text x="255" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Québec</text>
  <text x="255" y="354" text-anchor="middle" font-size="11" fill="#555">20 gCO₂/kWh</text>
  <text x="255" y="366" text-anchor="middle" font-size="11" fill="#555">PUE 1.06</text>

  <!-- 36× annotation -->
  <line x1="150" y1="220" x2="250" y2="315" stroke="#a31f34" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="163" y="253" width="60" height="24"  fill="#a31f34"/>
  <text x="193" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">36×</text>

  <!-- ===== Water Usage (right panel) ===== -->
  <text x="500" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Water Usage (kilolitres)</text>

  <!-- Y axis -->
  <line x1="380" y1="90" x2="380" y2="320" stroke="#333" stroke-width="1"/>
  <!-- X axis -->
  <line x1="380" y1="320" x2="620" y2="320" stroke="#333" stroke-width="1"/>

  <!-- Y ticks -->
  <text x="372" y="320" text-anchor="end" font-size="12" fill="#555">0</text>
  <text x="372" y="274" text-anchor="end" font-size="12" fill="#555">40</text>
  <text x="372" y="228" text-anchor="end" font-size="12" fill="#555">80</text>
  <text x="372" y="182" text-anchor="end" font-size="12" fill="#555">120</text>
  <text x="372" y="136" text-anchor="end" font-size="12" fill="#555">160</text>
  <line x1="380" y1="274" x2="620" y2="274" stroke="#eee" stroke-width="0.5"/>
  <line x1="380" y1="228" x2="620" y2="228" stroke="#eee" stroke-width="0.5"/>
  <line x1="380" y1="182" x2="620" y2="182" stroke="#eee" stroke-width="0.5"/>
  <line x1="380" y1="136" x2="620" y2="136" stroke="#eee" stroke-width="0.5"/>

  <!-- Iowa bar: 155 kL -->
  <rect x="410" y="142" width="70" height="178"  fill="#0284c7" opacity="0.7"/>
  <text x="445" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">155</text>
  <text x="445" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Iowa</text>

  <!-- Québec bar: 0 kL (WUE = 0) -->
  <text x="555" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">0</text>
  <text x="555" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Québec</text>

  <!-- WUE annotation -->
  <line x1="450" y1="220" x2="550" y2="316" stroke="#a31f34" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="453" y="253" width="80" height="24"  fill="#a31f34"/>
  <text x="493" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">WUE = 0</text>

  <!-- ===== Key insight box ===== -->
  <rect x="50" y="370" width="580" height="44"  fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Wall 18 (Sustainability): Grid carbon intensity is a first-order systems design variable.</text>
  <text x="340" y="405" text-anchor="middle" font-size="12" fill="#555">256 GPUs, 70B model, 30 days, MFU 0.42 — identical in both regions. Only the grid profile differs.</text>

  <!-- ===== Grid profiles ===== -->
  <rect x="80" y="425" width="14" height="14" fill="#fed7aa" opacity="0.85" />
  <text x="100" y="436" font-size="12" fill="#333">Iowa — coal + natural gas dominant</text>
  <rect x="380" y="425" width="14" height="14" fill="#10b981" opacity="0.85" />
  <text x="400" y="436" font-size="12" fill="#333">Québec — 95% hydroelectric</text>

  <!-- Footnote -->
  <text x="340" y="455" text-anchor="middle" font-size="12" font-style="italic" fill="#999">Output of the MLSysim SustainabilityModel on the registered Iowa and Québec datacenter profiles.</text>
</svg>
