    <text x="502" y="57" text-anchor="middle" font-size="8" fill="#555555">H = (F, BW, C, TDP): FLOP/s, bandwidth, capacity, power</text>

    <path d="M140.0,82.0 L540.0,82.0 L540.0,112.0 L140.0,112.0 z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
