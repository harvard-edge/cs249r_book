<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Column headings -->
  <text x="125" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">
    FACTS LIVE ONCE
  </text>
  <text x="380" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">
    SCENARIO BINDS A QUESTION
  </text>
  <text x="635" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">
    RESOLVERS PRODUCE BOUNDS
  </text>

  <!-- Reusable registry facts -->
  <rect x="30" y="70" width="190" height="38" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/>
  <text x="44" y="86" font-size="8.5" font-weight="700" fill="#92400e">Models.Language.Llama3_70B</text>
  <text x="44" y="99" font-size="7.5" fill="#475569">parameters, layers, heads, sequence</text>

  <rect x="30" y="116" width="190" height="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="44" y="132" font-size="8.5" font-weight="700" fill="#5b21b6">Hardware.Cloud.H100</text>
  <text x="44" y="145" font-size="7.5" fill="#475569">@tech: HBM3, NVLink4; @prov: datasheet</text>

  <rect x="30" y="162" width="190" height="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="44" y="178" font-size="8.5" font-weight="700" fill="#5b21b6">Systems.Clusters.Research_256</text>
  <text x="44" y="191" font-size="7.5" fill="#475569">32 x DGX H100 nodes + network fabric</text>

  <rect x="30" y="208" width="190" height="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="44" y="224" font-size="8.5" font-weight="700" fill="#334155">Infrastructure.Grids.Quebec</text>
  <text x="44" y="237" font-size="7.5" fill="#475569">CI=20 gCO2/kWh, PUE=1.06, WUE=0</text>

  <rect x="30" y="254" width="190" height="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="44" y="270" font-size="8.5" font-weight="700" fill="#334155">Ops.TrainingRunOverheads</text>
  <text x="44" y="283" font-size="7.5" fill="#475569">checkpoint, recovery, maintenance</text>

  <rect x="30" y="300" width="190" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="44" y="316" font-size="8.5" font-weight="700" fill="#334155">Literature.Benchmarks</text>
  <text x="44" y="329" font-size="7.5" fill="#475569">ReferenceStats.TrainingScaleProfiles</text>

  <!-- Arrows from facts to scenario -->
  <line x1="220" y1="89" x2="280" y2="132" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="135" x2="280" y2="157" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="181" x2="280" y2="181" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="227" x2="280" y2="206" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="273" x2="280" y2="231" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="319" x2="280" y2="256" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Scenario binding -->
  <rect x="280" y="104" width="200" height="192" fill="#fff" stroke="#334155" stroke-width="1.4"/>
  <rect x="280" y="104" width="200" height="28" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="380" y="123" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Scenario: 70B Training Run</text>

  <text x="300" y="154" font-size="8.5" font-weight="700" fill="#92400e">Demand</text>
  <text x="354" y="154" font-size="8.5" fill="#475569">Llama-3 70B workload</text>
  <line x1="300" y1="162" x2="460" y2="162" stroke="#e2e8f0" stroke-width="1"/>

  <text x="300" y="180" font-size="8.5" font-weight="700" fill="#5b21b6">Supply</text>
  <text x="354" y="180" font-size="8.5" fill="#475569">256 H100 GPUs, fabric</text>
  <line x1="300" y1="188" x2="460" y2="188" stroke="#e2e8f0" stroke-width="1"/>

  <text x="300" y="206" font-size="8.5" font-weight="700" fill="#334155">Context</text>
  <text x="354" y="206" font-size="8.5" fill="#475569">Quebec vs. Iowa grids</text>
  <line x1="300" y1="214" x2="460" y2="214" stroke="#e2e8f0" stroke-width="1"/>

  <text x="300" y="232" font-size="8.5" font-weight="700" fill="#334155">Policy</text>
  <text x="354" y="232" font-size="8.5" fill="#475569">30 days, overhead budget</text>
  <line x1="300" y1="240" x2="460" y2="240" stroke="#e2e8f0" stroke-width="1"/>

  <text x="300" y="258" font-size="8.5" font-weight="700" fill="#334155">Contract</text>
  <text x="354" y="258" font-size="8.5" fill="#475569">typed pint quantities</text>
  <text x="300" y="278" font-size="8" font-style="italic" fill="#64748b">No copied constants; registry keys only.</text>

  <!-- Scenario to solvers -->
  <line x1="480" y1="118" x2="535" y2="99" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Resolver chain -->
  <rect x="535" y="82" width="170" height="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="620" y="103" text-anchor="middle" font-size="9" font-weight="700" fill="#075985">SingleNodeModel</text>
  <line x1="620" y1="116" x2="620" y2="132" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arrow-cyan)"/>

  <rect x="535" y="132" width="170" height="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="620" y="153" text-anchor="middle" font-size="9" font-weight="700" fill="#075985">DistributedModel</text>
  <line x1="620" y1="166" x2="620" y2="182" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arrow-cyan)"/>

  <rect x="535" y="182" width="170" height="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="620" y="203" text-anchor="middle" font-size="9" font-weight="700" fill="#075985">EconomicsModel</text>
  <line x1="620" y1="216" x2="620" y2="232" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arrow-cyan)"/>

  <rect x="535" y="232" width="170" height="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="620" y="253" text-anchor="middle" font-size="9" font-weight="700" fill="#075985">SustainabilityModel</text>
  <line x1="620" y1="266" x2="620" y2="284" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arrow-cyan)"/>

  <rect x="535" y="284" width="170" height="70" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="620" y="303" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">SystemEvaluation</text>
  <text x="552" y="321" font-size="8" fill="#475569">Feasibility: fits / fails</text>
  <text x="552" y="335" font-size="8" fill="#475569">Bottleneck: binding wall</text>
  <text x="552" y="349" font-size="8" fill="#475569">Macro: TCO, CO2, water</text>

  <!-- Bottom provenance rail -->
  <rect x="30" y="372" width="675" height="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="392" font-size="9" font-weight="700" fill="#334155">Audit trail:</text>
  <text x="112" y="392" font-size="9" fill="#475569">
    each output can be traced to registry keys, provenance kind, source URL, verification date, and explicit scenario assumptions.
  </text>
</svg>
