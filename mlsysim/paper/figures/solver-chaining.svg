<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 680 375"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="460" fill="#fff" />
  <!-- Labels carrying data-template are rewritten by paper/scripts/generate_paper_values.py. -->

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ===== Layer A: Workload (Demand) ===== -->
  <rect x="30" y="50" width="180" height="70" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer A: Workload</text>
  <text x="120" y="84" text-anchor="middle" font-size="8" fill="#555">TransformerWorkload</text>
  <text x="120" y="96" text-anchor="middle" font-size="7.5" fill="#555" data-template="{ChainModelName} · FP16">Llama-2-7B · FP16</text>
  <text x="120" y="108" text-anchor="middle" font-size="7.5" fill="#555" data-template="{ChainFlopsPerTokenG} GFLOPs/token · {ChainWeightsGB} GB">14 GFLOPs/token · 14 GB</text>

  <!-- ===== Layer B: Hardware (Supply) ===== -->
  <rect x="30" y="140" width="180" height="70" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="120" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer B: Hardware</text>
  <text x="120" y="174" text-anchor="middle" font-size="8" fill="#555">HardwareNode</text>
  <text x="120" y="186" text-anchor="middle" font-size="7.5" fill="#555" data-template="H100 · {RegHhPeakTflops} TFLOP/s">H100 · 989 TFLOP/s</text>
  <text x="120" y="198" text-anchor="middle" font-size="7.5" fill="#555" data-template="{RegHhBandwidthTBs} TB/s HBM · {RegHhCapacityGiB} GiB">3.35 TB/s HBM · 80 GiB</text>

  <!-- ===== Layer C: Infrastructure ===== -->
  <rect x="30" y="230" width="180" height="62" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer C: Infrastructure</text>
  <text x="120" y="264" text-anchor="middle" font-size="8" fill="#555" data-template="GridProfile: Iowa ({RegGridIowaProvenanceKind})">GridProfile: Iowa (illustrative)</text>
  <text x="120" y="278" text-anchor="middle" font-size="7.5" fill="#555" data-template="CI={RegGridIowaCarbonIntensity} g/kWh · PUE={RegGridIowaPue}">CI=680 g/kWh · PUE=1.12</text>

  <!-- ===== Arrows from inputs to the resolver chain ===== -->
  <line x1="210" y1="85" x2="270" y2="85" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="210" y1="153" x2="270" y2="153" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="210" y1="266" x2="270" y2="266" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Resolver chain ===== -->
  <rect x="270" y="52" width="180" height="48" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="275" y="55" width="40" height="14" fill="#a31f34"/>
  <text x="295" y="65" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">W 1-2</text>
  <text x="370" y="70" text-anchor="middle" font-size="9" font-weight="700" fill="#333">SingleNodeModel</text>
  <text x="360" y="90" text-anchor="middle" font-size="7.5" fill="#555" data-template="→ bottleneck: {ChainBottleneck} · MFU {ChainMfu}">→ bottleneck: memory · MFU 0.003</text>

  <line x1="360" y1="100" x2="360" y2="118" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="270" y="118" width="180" height="48" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="275" y="121" width="28" height="14" fill="#a31f34"/>
  <text x="289" y="131" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">W 4</text>
  <text x="370" y="136" text-anchor="middle" font-size="9" font-weight="700" fill="#333">ServingModel</text>
  <text x="360" y="156" text-anchor="middle" font-size="7.5" fill="#555" data-template="→ TTFT {ChainTtftMs} ms · ITL {ChainItlMs} ms">→ TTFT 62 ms · ITL 4.8 ms</text>

  <line x1="360" y1="166" x2="360" y2="184" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="270" y="184" width="180" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="275" y="187" width="32" height="14" fill="#a31f34"/>
  <text x="291" y="197" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">W 17</text>
  <text x="370" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#333">EconomicsModel</text>
  <text x="360" y="222" text-anchor="middle" font-size="7.5" fill="#555" data-template="→ TCO ${ChainTcoKPerYear}K per year">→ TCO $9.8K per year</text>

  <line x1="360" y1="232" x2="360" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="270" y="250" width="180" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="275" y="253" width="32" height="14" fill="#a31f34"/>
  <text x="291" y="263" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">W 18</text>
  <text x="370" y="268" text-anchor="middle" font-size="9" font-weight="700" fill="#333">SustainabilityModel</text>
  <text x="360" y="288" text-anchor="middle" font-size="7.5" fill="#555" data-template="→ CO₂ {ChainCarbonTPerYear} t · H₂O {ChainWaterKLPerYear} kL per year">→ CO₂ 1.41 t · H₂O 3.7 kL per year</text>

  <!-- ===== Arrow to scorecard ===== -->
  <line x1="450" y1="175" x2="500" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ===== System Scorecard (output) ===== -->
  <rect x="500" y="52" width="160" height="260" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="580" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#333">SystemEvaluation</text>
  <text x="580" y="86" text-anchor="middle" font-size="8" fill="#555">Scorecard</text>
  <line x1="510" y1="92" x2="650" y2="92" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>

  <text x="515" y="110" font-size="8.5" font-weight="700" fill="#333">Feasibility</text>
  <text x="515" y="124" font-size="8" fill="#555" data-template="✓ Fits in {RegHhCapacityGiB} GiB HBM">✓ Fits in 80 GiB HBM</text>

  <text x="515" y="144" font-size="8.5" font-weight="700" fill="#333">Performance</text>
  <text x="515" y="158" font-size="8" fill="#555" data-template="Bottleneck: {ChainBottleneck}">Bottleneck: memory</text>
  <text x="515" y="170" font-size="8" fill="#555" data-template="MFU: {ChainMfu}">MFU: 0.003</text>

  <text x="515" y="190" font-size="8.5" font-weight="700" fill="#333">Serving latency</text>
  <text x="515" y="204" font-size="8" fill="#555" data-template="TTFT: {ChainTtftMs} ms">TTFT: 62 ms</text>
  <text x="515" y="216" font-size="8" fill="#555" data-template="ITL: {ChainItlMs} ms/token">ITL: 4.8 ms/token</text>

  <text x="515" y="236" font-size="8.5" font-weight="700" fill="#333">Economics</text>
  <text x="515" y="250" font-size="8" fill="#555" data-template="TCO: ${ChainTcoKPerYear}K/yr">TCO: $9.8K/yr</text>

  <text x="515" y="270" font-size="8.5" font-weight="700" fill="#333">Sustainability</text>
  <text x="515" y="284" font-size="8" fill="#555" data-template="CO₂: {ChainCarbonTPerYear} t/yr">CO₂: 1.41 t/yr</text>
  <text x="515" y="296" font-size="8" fill="#555" data-template="H₂O: {ChainWaterKLPerYear} kL/yr">H₂O: 3.7 kL/yr</text>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="330" width="630" height="50" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="350" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Key: Each resolver is a pure function — typed inputs in, dimensionally correct outputs out.</text>
  <text x="345" y="365" text-anchor="middle" font-size="9" fill="#555">Resolvers compose by chaining outputs → inputs. The type system enforces consistency at every boundary.</text>

  <!-- ===== Demand/Supply labels ===== -->
  <rect x="55" y="306" width="60" height="14" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="85" y="316" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">Demand</text>
  <rect x="122" y="306" width="60" height="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="152" y="316" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5b21b6">Supply</text>

  <!-- Footnote: the example configuration -->
  <text x="345" y="400" text-anchor="middle" font-size="9" font-style="italic" fill="#999" data-template="Example: {ChainModelName}, batch 1, {ChainSeqLen}-token context, one H100 serving for a year on the Iowa grid profile.">Example: Llama-2-7B, batch 1, 2,048-token context, one H100 serving for a year on the Iowa grid profile.</text>
</svg>
