<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="460" fill="#fff" />

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
  </defs>

  <!-- ===== Axes ===== -->
  <line x1="80" y1="30" x2="80" y2="380" stroke="#333" stroke-width="1.2"/>
  <line x1="80" y1="380" x2="640" y2="380" stroke="#333" stroke-width="1.2"/>

  <!-- Y axis label -->
  <text x="24" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#333" transform="rotate(-90 24 220)">Attainable TFLOP/s</text>
  <!-- X axis label -->
  <text x="360" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Arithmetic Intensity (FLOP/byte)</text>

  <!-- ===== Y axis ticks ===== -->
  <line x1="75" y1="360" x2="80" y2="360" stroke="#333" stroke-width="1"/>
  <text x="70" y="364" text-anchor="end" font-size="12" fill="#555">10</text>
  <line x1="75" y1="300" x2="80" y2="300" stroke="#333" stroke-width="1"/>
  <text x="70" y="304" text-anchor="end" font-size="12" fill="#555">50</text>
  <line x1="75" y1="240" x2="80" y2="240" stroke="#333" stroke-width="1"/>
  <text x="70" y="244" text-anchor="end" font-size="12" fill="#555">150</text>
  <line x1="75" y1="80" x2="80" y2="80" stroke="#333" stroke-width="1"/>
  <text x="70" y="84" text-anchor="end" font-size="12" fill="#555">494</text>

  <!-- ===== X axis ticks ===== -->
  <line x1="188" y1="380" x2="188" y2="385" stroke="#333" stroke-width="1"/>
  <text x="188" y="398" text-anchor="middle" font-size="12" fill="#555">73</text>
  <line x1="300" y1="380" x2="300" y2="385" stroke="#333" stroke-width="1"/>
  <text x="300" y="398" text-anchor="middle" font-size="12" fill="#555">148</text>
  <line x1="380" y1="380" x2="380" y2="385" stroke="#333" stroke-width="1"/>
  <text x="380" y="398" text-anchor="middle" font-size="12" fill="#555">356</text>
  <line x1="470" y1="380" x2="470" y2="385" stroke="#333" stroke-width="1"/>
  <text x="470" y="398" text-anchor="middle" font-size="12" fill="#555">610</text>
  <line x1="545" y1="380" x2="545" y2="385" stroke="#333" stroke-width="1"/>
  <text x="545" y="398" text-anchor="middle" font-size="12" fill="#555">743</text>
  <line x1="600" y1="380" x2="600" y2="385" stroke="#333" stroke-width="1"/>
  <text x="600" y="398" text-anchor="middle" font-size="12" fill="#555">771</text>

  <!-- ===== Effective compute ceiling (horizontal) ===== -->
  <line x1="300" y1="80" x2="640" y2="80" stroke="#0284c7" stroke-width="2"/>
  <text x="312" y="68" text-anchor="start" font-size="11" font-weight="700" fill="#0284c7">η × Peak = 494 TFLOP/s</text>

  <!-- ===== Memory bandwidth slope (diagonal) ===== -->
  <line x1="80" y1="380" x2="300" y2="80" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="230" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed" transform="rotate(-54 160 230)">BW = 3.35 TB/s</text>

  <!-- ===== Effective ridge point ===== -->
  <circle cx="300" cy="80" r="6" fill="#a31f34" stroke="#fff" stroke-width="1.5"/>
  <line x1="300" y1="86" x2="300" y2="380" stroke="#a31f34" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="306" y="135" font-size="11" font-weight="700" fill="#a31f34">Effective ridge: 148 FLOP/byte (η = 0.5)</text>

  <!-- ===== Region labels ===== -->
  <rect x="95" y="308" width="130" height="24"  fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="160" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">Memory-Bound</text>

  <rect x="480" y="42" width="120" height="22"  fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="540" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#0284c7">Compute-Bound</text>

  <!-- ===== Data points (ResNet-50, batch sizes) ===== -->
  <!-- B=1: AI 73, memory-bound on the slope -->
  <circle cx="188" cy="233" r="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="202" y="229" text-anchor="start" font-size="11" font-weight="700" fill="#333">B=1</text>
  <text x="202" y="241" text-anchor="start" font-size="10" fill="#555">MFU 0.01</text>

  <!-- B=8: AI 356, compute-bound on the roof -->
  <circle cx="380" cy="80" r="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="368" y="102" text-anchor="start" font-size="11" font-weight="700" fill="#333">B=8</text>
  <text x="360" y="114" text-anchor="start" font-size="10" fill="#555">MFU 0.06</text>

  <!-- B=32 -->
  <circle cx="470" cy="80" r="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="456" y="102" text-anchor="start" font-size="11" font-weight="700" fill="#333">B=32</text>
  <text x="452" y="114" text-anchor="start" font-size="10" fill="#555">MFU 0.17</text>

  <!-- B=128 -->
  <circle cx="545" cy="80" r="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="528" y="102" text-anchor="start" font-size="11" font-weight="700" fill="#333">B=128</text>
  <text x="526" y="114" text-anchor="start" font-size="10" fill="#555">MFU 0.34</text>

  <!-- B=256 -->
  <circle cx="600" cy="80" r="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="590" y="130" text-anchor="start" font-size="11" font-weight="700" fill="#333">B=256</text>
  <text x="586" y="142" text-anchor="start" font-size="10" fill="#555">MFU 0.40</text>

  <!-- ===== Crossover annotation ===== -->
  <text x="300" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="#a31f34">↑ Crossover between B=1 and B=8</text>

  <!-- Footnote -->
  <text x="340" y="452" text-anchor="middle" font-size="9" font-style="italic" fill="#999">Batching amortizes the one-time weight read: ResNet-50 on an H100 crosses from memory-bound to compute-bound; MFU keeps rising as overheads amortize.</text>
</svg>
