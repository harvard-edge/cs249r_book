<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="960" height="346" fill="#fff" />
  <!-- Labels carrying data-template are rewritten by paper/scripts/generate_paper_values.py. -->

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
  </defs>

  <!-- ===== Column Labels ===== -->
  <text x="110" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">INPUTS</text>
  <text x="350" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">IR</text>
  <text x="590" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5" data-template="LAYER E: {CountResolvers} RESOLVERS">LAYER E: 28 RESOLVERS</text>
  <text x="840" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">OUTPUT</text>

  <!-- Dashed vertical separators -->
  <line x1="235" y1="10" x2="235" y2="318" stroke="#e0e0e0" stroke-dasharray="4,3" stroke-width="0.8"/>
  <line x1="460" y1="10" x2="460" y2="318" stroke="#e0e0e0" stroke-dasharray="4,3" stroke-width="0.8"/>
  <line x1="720" y1="10" x2="720" y2="318" stroke="#e0e0e0" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- ===== Layer A: Workload (Demand) ===== -->
  <rect x="15" y="36" width="195" height="72" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <rect x="20" y="40" width="46" height="12" fill="#d97706" opacity="0.16"/>
  <text x="43" y="49" text-anchor="middle" font-size="6.5" font-weight="700" fill="#92400e">DEMAND</text>
  <text x="112" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer A: Workload</text>
  <text x="112" y="84" text-anchor="middle" font-size="8" fill="#555" data-template="Llama-3 70B · FP16 · seq {CaseRThreeSeqLen}">Llama-3 70B · FP16 · seq 4,096</text>
  <text x="112" y="97" text-anchor="middle" font-size="8" fill="#555" data-template="{RegLlamaSeventyParamsB}B params · {RegLlamaSeventyWeightsGB} GB weights">70.6B params · 141 GB weights</text>

  <!-- ===== Layer B: Hardware (Supply) ===== -->
  <rect x="15" y="116" width="195" height="72" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="20" y="120" width="42" height="12" fill="#7c3aed" opacity="0.16"/>
  <text x="41" y="129" text-anchor="middle" font-size="6.5" font-weight="700" fill="#5b21b6">SUPPLY</text>
  <text x="112" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer B: Hardware</text>
  <text x="112" y="164" text-anchor="middle" font-size="8" fill="#555" data-template="H100 · {RegHhPeakTflops} TFLOP/s (FP16)">H100 · 989 TFLOP/s (FP16)</text>
  <text x="112" y="177" text-anchor="middle" font-size="8" fill="#555" data-template="{RegHhBandwidthTBs} TB/s HBM · {RegHhCapacityGiB} GiB">3.35 TB/s HBM · 80 GiB</text>

  <!-- ===== Layer C: Infrastructure (Context) ===== -->
  <rect x="15" y="196" width="195" height="56" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="200" width="50" height="12" fill="#94a3b8" opacity="0.16"/>
  <text x="45" y="209" text-anchor="middle" font-size="6.5" font-weight="700" fill="#64748b">CONTEXT</text>
  <text x="112" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer C: Infrastructure</text>
  <text x="112" y="243" text-anchor="middle" font-size="8" fill="#555" data-template="Québec · {RegGridQuebecCarbonIntensity} g/kWh · PUE {RegGridQuebecPue}">Québec · 20 g/kWh · PUE 1.06</text>

  <!-- ===== Layer D: Topology (Context) ===== -->
  <rect x="15" y="260" width="195" height="56" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="264" width="50" height="12" fill="#94a3b8" opacity="0.16"/>
  <text x="45" y="273" text-anchor="middle" font-size="6.5" font-weight="700" fill="#64748b">CONTEXT</text>
  <text x="112" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Layer D: Topology</text>
  <text x="112" y="307" text-anchor="middle" font-size="8" fill="#555" data-template="{CaseRThreeNodes} nodes · {CaseRThreeFabric} · NVLink">64 nodes · IB HDR · NVLink</text>

  <!-- ===== Computation Graph (IR) ===== -->
  <rect x="280" y="45" width="140" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="350" y="63" text-anchor="middle" font-size="9" font-weight="700" fill="#333">ComputationGraph</text>
  <text x="350" y="77" text-anchor="middle" font-size="7.5" fill="#555">flop, byte, intensity</text>
  <text x="350" y="89" text-anchor="middle" font-size="7.5" fill="#555">(hardware-agnostic IR)</text>

  <!-- lower() arrow A → IR -->
  <line x1="210" y1="72" x2="278" y2="72" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="244" y="66" text-anchor="middle" font-size="7.5" font-weight="700" fill="#92400e">lower()</text>

  <!-- ===== Resolver boxes ===== -->
  <rect x="480" y="38" width="220" height="45" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="485" y="42" width="32" height="13" fill="#a31f34"/>
  <text x="501" y="51.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff">W 1-2</text>
  <text x="600" y="55" text-anchor="middle" font-size="9" font-weight="700" fill="#333">SingleNodeModel</text>
  <text x="590" y="73" text-anchor="middle" font-size="7.5" fill="#555">Compute Wall · Memory Wall</text>

  <rect x="480" y="98" width="220" height="45" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="485" y="102" width="32" height="13" fill="#a31f34"/>
  <text x="501" y="111.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff">W 14</text>
  <text x="600" y="115" text-anchor="middle" font-size="9" font-weight="700" fill="#333">DistributedModel</text>
  <text x="590" y="133" text-anchor="middle" font-size="7.5" fill="#555">Comm · Parallelism · Pipeline bubble</text>

  <rect x="480" y="158" width="220" height="45" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="485" y="162" width="32" height="13" fill="#a31f34"/>
  <text x="501" y="171.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff">W 17</text>
  <text x="600" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#333">EconomicsModel</text>
  <text x="590" y="193" text-anchor="middle" font-size="7.5" fill="#555">TCO · CapEx · OpEx</text>

  <rect x="480" y="218" width="220" height="45" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="485" y="222" width="32" height="13" fill="#a31f34"/>
  <text x="501" y="231.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff">W 18</text>
  <text x="600" y="235" text-anchor="middle" font-size="9" font-weight="700" fill="#333">SustainabilityModel</text>
  <text x="590" y="253" text-anchor="middle" font-size="7.5" fill="#555">CO₂ · H₂O · PUE/WUE</text>

  <rect x="510" y="278" width="160" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="590" y="294" text-anchor="middle" font-size="8" fill="#999" data-template="+ {DiagramStackMoreResolvers} more resolvers…">+ 24 more resolvers…</text>

  <!-- ===== Arrows into the resolvers ===== -->
  <line x1="420" y1="68" x2="478" y2="60" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="420" y1="76" x2="478" y2="118" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="210" y1="176" x2="478" y2="80" stroke="#7c3aed" stroke-width="1" marker-end="url(#arrow)" opacity="0.55"/>
  <line x1="210" y1="166" x2="478" y2="130" stroke="#7c3aed" stroke-width="1" marker-end="url(#arrow)" opacity="0.55"/>
  <line x1="210" y1="230" x2="478" y2="188" stroke="#999" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="210" y1="238" x2="478" y2="244" stroke="#999" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="210" y1="284" x2="478" y2="136" stroke="#999" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ===== Output Scorecard ===== -->
  <rect x="740" y="38" width="200" height="278" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="840" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#333">SystemEvaluation</text>
  <line x1="750" y1="65" x2="930" y2="65" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>

  <text x="755" y="82" font-size="8.5" font-weight="700" fill="#333">Feasibility</text>
  <text x="755" y="95" font-size="8" fill="#555" data-template="Training memory {CaseRThreePerGpuMemoryGB} GB/GPU">Training memory 1,602.4 GB/GPU</text>
  <text x="755" y="107" font-size="8" fill="#555" data-template="({CaseRThreeMemoryFits} {RegHhCapacityGiB} GiB HBM)">(exceeds 80 GiB HBM)</text>

  <text x="755" y="127" font-size="8.5" font-weight="700" fill="#333">Performance</text>
  <text x="755" y="140" font-size="8" fill="#a31f34" data-template="Binding: {CaseRThreeNodeBottleneck} (Wall {CaseRThreeBindingWall})">Binding: Memory (Wall 2)</text>
  <text x="755" y="152" font-size="8" fill="#555" data-template="MFU {CaseRThreeMfuPct}% · scaling {CaseRThreeScalingEffPct}%">MFU 35.6% · scaling 89.1%</text>

  <text x="755" y="172" font-size="8.5" font-weight="700" fill="#333">Step time</text>
  <text x="755" y="185" font-size="8" fill="#555" data-template="{CaseRThreeStepSeconds} s per step · comm {CaseRThreeCommMs} ms">6.44 s per step · comm 892 ms</text>

  <text x="755" y="205" font-size="8.5" font-weight="700" fill="#333">Economics (30 days)</text>
  <text x="755" y="218" font-size="8" fill="#555" data-template="TCO ${CaseRThreeTcoK}K · CapEx ${CaseRThreeCapexK}K">TCO $421K · CapEx $351K</text>

  <text x="755" y="238" font-size="8.5" font-weight="700" fill="#333">Sustainability (30 days)</text>
  <text x="755" y="251" font-size="8" fill="#555" data-template="CO₂ {CaseRThreeCarbonTonnes} t · H₂O {CaseRThreeWaterKL} kL">CO₂ 3.0 t · H₂O 0 kL</text>

  <text x="755" y="276" font-size="8.5" font-weight="700" fill="#333">Binding Wall</text>
  <rect x="755" y="284" width="90" height="13" fill="#a31f34"/>
  <text x="800" y="293.5" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" data-template="{CaseRThreeBindingChip}">MEMORY</text>

  <!-- ===== Arrows: resolvers → scorecard ===== -->
  <line x1="700" y1="60" x2="738" y2="60" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="700" y1="120" x2="738" y2="120" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="700" y1="180" x2="738" y2="180" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="700" y1="240" x2="738" y2="240" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- ===== Footnote: the example configuration ===== -->
  <text x="480" y="336" text-anchor="middle" font-size="8.5" font-style="italic" fill="#999" data-template="Example: Llama-3 70B training on {CaseRThreeGpus} H100 ({CaseRThreeNodes} nodes, {CaseRThreeFabric}), batch {CaseRThreeBatch}, TP={CaseRThreeTp}, 30 days in Québec. The red arrow marks the binding constraint.">Example: Llama-3 70B training on 512 H100 (64 nodes, IB HDR), batch 1,024, TP=8, 30 days in Québec. The red arrow marks the binding constraint.</text>
</svg>
