<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="960" height="410" fill="#fff"/>
  <!-- Labels carrying data-template are rewritten by paper/scripts/generate_paper_values.py.
       The generator also fails if a physics domain module is missing from panel (a). -->

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- ===== Panel Labels ===== -->
  <text x="230" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#222" letter-spacing="0.5">(a) Package Architecture</text>
  <text x="715" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#222" letter-spacing="0.5">(b) Analysis Pipeline</text>

  <line x1="475" y1="6" x2="475" y2="404" stroke="#ccc" stroke-width="0.5"/>

  <!-- ================================================================ -->
  <!-- PANEL (a): Package Architecture                                   -->
  <!-- ================================================================ -->

  <!-- ===== Registries ===== -->
  <text x="12" y="40" font-size="8" font-weight="700" fill="#888" letter-spacing="1.2" data-template="MLSys ZOO ({CountRegistriesCurated} REGISTRIES, 6 SHOWN)">MLSys ZOO (13 REGISTRIES, 6 SHOWN)</text>

  <rect x="12" y="50" width="143" height="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="83" y="66" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Hardware</text>
  <text x="83" y="78" text-anchor="middle" font-size="7" fill="#666" data-template="{CountHardwareDevices} devices + Tech classes">44 devices + Tech classes</text>

  <rect x="163" y="50" width="143" height="38" fill="#fff7ed" stroke="#d97706" stroke-width="0.8"/>
  <text x="234" y="66" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Models</text>
  <text x="234" y="78" text-anchor="middle" font-size="7" fill="#666" data-template="{CountModels} architectures">33 architectures</text>

  <rect x="314" y="50" width="143" height="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="385" y="66" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Datasets</text>
  <text x="385" y="78" text-anchor="middle" font-size="7" fill="#666">benchmark catalog</text>

  <rect x="12" y="94" width="143" height="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="83" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Systems</text>
  <text x="83" y="122" text-anchor="middle" font-size="7" fill="#666">nodes, fabrics, fleets</text>

  <rect x="163" y="94" width="143" height="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="234" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Infrastructure</text>
  <text x="234" y="122" text-anchor="middle" font-size="7" fill="#666">grids, datacenters</text>

  <rect x="314" y="94" width="143" height="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="385" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Platforms</text>
  <text x="385" y="122" text-anchor="middle" font-size="7" fill="#666">deployment envelopes</text>
  <text x="234" y="143" text-anchor="middle" font-size="6.5" font-style="italic" fill="#888">+ Ops · Scenarios · Agents · Embodied; auxiliary: Literature · ReferenceStats</text>

