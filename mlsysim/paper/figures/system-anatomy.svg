  <text x="12" y="318" font-size="8" font-weight="700" fill="#888" letter-spacing="1.2">INVARIANT CHECKS</text>
  <rect x="12" y="326" width="82" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="53" y="337" text-anchor="middle" font-size="6" fill="#555">no constants module</text>
  <rect x="100" y="326" width="82" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="141" y="337" text-anchor="middle" font-size="6" fill="#555">loader contract</text>
  <rect x="188" y="326" width="82" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="229" y="337" text-anchor="middle" font-size="6" fill="#555">provenance audit</text>
  <rect x="276" y="326" width="82" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="317" y="337" text-anchor="middle" font-size="6" fill="#555">cross-registry check</text>
  <rect x="364" y="326" width="82" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="405" y="337" text-anchor="middle" font-size="6" fill="#555">frozen registries</text>

  <text x="230" y="398" text-anchor="middle" font-size="6.5" font-style="italic" fill="#aaa">All quantities carry SI units at runtime via pint</text>

  <!-- ================================================================ -->
  <!-- PANEL (b): Analysis Pipeline                                      -->
  <!-- ================================================================ -->

  <rect x="495" y="32" width="148" height="44" fill="#fff7ed" stroke="#d97706" stroke-width="0.8"/>
  <text x="569" y="48" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Layer A: Workload</text>
  <text x="569" y="60" text-anchor="middle" font-size="6.5" fill="#666">TransformerWorkload</text>
  <text x="569" y="70" text-anchor="middle" font-size="6.5" fill="#666" data-template="{RegLlamaSeventyParamsB}B params · {RegLlamaSeventyLayers} layers">70.6B params · 80 layers</text>

  <rect x="495" y="82" width="148" height="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="569" y="98" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Layer B: Hardware</text>
  <text x="569" y="110" text-anchor="middle" font-size="6.5" fill="#666" data-template="H100 · {RegHhPeakTflops} TFLOP/s · {RegHhBandwidthTBs} TB/s">H100 · 989 TFLOP/s · 3.35 TB/s</text>

  <rect x="495" y="126" width="148" height="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="569" y="142" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Layer C: Infrastructure</text>
  <text x="569" y="152" text-anchor="middle" font-size="6.5" fill="#666" data-template="Québec · {RegGridQuebecCarbonIntensity} gCO₂/kWh">Québec · 20 gCO₂/kWh</text>

  <rect x="495" y="164" width="148" height="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="569" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">Layer D: Systems</text>
  <text x="569" y="192" text-anchor="middle" font-size="6.5" fill="#666" data-template="{CaseRThreeGpus} GPUs · {CaseRThreeFabric} {CaseRThreeFabricGbps} Gb/s">512 GPUs · IB HDR 200 Gb/s</text>

  <line x1="643" y1="54" x2="688" y2="54" stroke="#444" stroke-width="0.8" marker-end="url(#arrow)"/>
  <text x="665" y="48" text-anchor="middle" font-size="6" font-style="italic" fill="#666">lower()</text>

  <rect x="692" y="32" width="108" height="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="746" y="49" text-anchor="middle" font-size="8" font-weight="700" fill="#222">Computation</text>
  <text x="746" y="60" text-anchor="middle" font-size="8" font-weight="700" fill="#222">Graph (IR)</text>
  <text x="746" y="72" text-anchor="middle" font-size="6" fill="#666">FLOPs · bytes · AI</text>

  <line x1="643" y1="101" x2="688" y2="140" stroke="#444" stroke-width="0.6" marker-end="url(#arrow)"/>
  <line x1="643" y1="142" x2="688" y2="145" stroke="#444" stroke-width="0.6" marker-end="url(#arrow)"/>
  <line x1="643" y1="183" x2="688" y2="155" stroke="#444" stroke-width="0.6" marker-end="url(#arrow)"/>
  <line x1="800" y1="54" x2="835" y2="54" stroke="#444" stroke-width="0.6"/>
  <line x1="835" y1="54" x2="835" y2="104" stroke="#444" stroke-width="0.6" marker-end="url(#arrow)"/>

  <text x="695" y="102" font-size="7" font-weight="700" fill="#888" letter-spacing="1">RESOLVERS</text>

  <rect x="692" y="108" width="248" height="56" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
  <text x="702" y="122" font-size="7.5" font-weight="700" fill="#222" data-template="Tier 1: {CountResolverModels} Analytical Models">Tier 1: 23 Analytical Models</text>
  <text x="702" y="134" font-size="6" fill="#555">SingleNode · Serving · ContinuousBatching · Data · Scaling</text>
  <text x="702" y="145" font-size="6" fill="#555">Distributed · Topology · Reliability · Economics · Sustainability</text>
  <text x="702" y="156" font-size="6" fill="#555">Compression · WeightStreaming · Efficiency · TailLatency · …</text>

  <rect x="692" y="170" width="248" height="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
  <text x="702" y="184" font-size="7.5" font-weight="700" fill="#222" data-template="Tier 2: {CountResolverSolvers} Analysis Solvers">Tier 2: 2 Analysis Solvers</text>
  <text x="702" y="195" font-size="6" fill="#555">Sensitivity (∂T/∂xᵢ) · Synthesis (BW = |W|/T)</text>

  <rect x="692" y="208" width="248" height="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
  <text x="702" y="222" font-size="7.5" font-weight="700" fill="#222" data-template="Tier 3: {CountResolverOptimizers} Optimizers">Tier 3: 3 Optimizers</text>
  <text x="702" y="233" font-size="6" fill="#555">Parallelism · Batching · Placement</text>

  <line x1="816" y1="240" x2="816" y2="262" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="692" y="268" width="248" height="96" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="816" y="284" text-anchor="middle" font-size="8.5" font-weight="700" fill="#222">SystemEvaluation</text>
  <rect x="702" y="292" width="228" height="18" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="712" y="304" font-size="7" font-weight="600" fill="#333">Level 1: Feasibility</text>
  <text x="920" y="304" text-anchor="end" font-size="6" fill="#777">fits? pipeline OK?</text>
  <rect x="702" y="314" width="228" height="18" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="712" y="326" font-size="7" font-weight="600" fill="#333">Level 2: Performance</text>
  <text x="920" y="326" text-anchor="end" font-size="6" fill="#777">latency, MFU, binding wall</text>
  <rect x="702" y="336" width="228" height="18" fill="#f0f0f0" stroke="#aaa" stroke-width="0.6"/>
  <text x="712" y="348" font-size="7" font-weight="600" fill="#333">Level 3: Macro</text>
  <text x="920" y="348" text-anchor="end" font-size="6" fill="#777">TCO, CO₂, H₂O, DP-SGD</text>

  <text x="715" y="398" text-anchor="middle" font-size="6.5" font-style="italic" fill="#aaa">Each resolver: pure f(config) → metrics. Full evaluation &lt;0.3 s on a laptop.</text>
</svg>
