  <text x="12" y="162" font-size="8" font-weight="700" fill="#888" letter-spacing="1.2" data-template="PHYSICS ENGINE ({CountPhysicsDomainModules} DOMAIN MODULES)">PHYSICS ENGINE (11 DOMAIN MODULES)</text>

  <rect x="12" y="170" width="82" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="53" y="186" text-anchor="middle" font-size="7" font-weight="600" fill="#444">performance</text>
