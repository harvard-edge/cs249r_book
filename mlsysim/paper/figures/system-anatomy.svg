  <rect x="396" y="170" width="60" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="426" y="186" text-anchor="middle" font-size="7" font-weight="600" fill="#444">agents</text>

  <rect x="12" y="200" width="72" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="48" y="216" text-anchor="middle" font-size="7" font-weight="600" fill="#444">transformer</text>
  <rect x="90" y="200" width="68" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="124" y="216" text-anchor="middle" font-size="7" font-weight="600" fill="#444">economics</text>
  <rect x="164" y="200" width="72" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="200" y="216" text-anchor="middle" font-size="7" font-weight="600" fill="#444">networking</text>
  <rect x="242" y="200" width="62" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="273" y="216" text-anchor="middle" font-size="7" font-weight="600" fill="#444">statistics</text>
  <rect x="310" y="200" width="62" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.7"/>
  <text x="341" y="216" text-anchor="middle" font-size="7" font-weight="600" fill="#444">robotics</text>
  <rect x="378" y="200" width="78" height="24" fill="#fff" stroke="#bbb" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="417" y="216" text-anchor="middle" font-size="6.5" font-style="italic" fill="#888">_ensure_unit()</text>

