version: "1.0"
name: "Llama-3 70B Distributed Training with Assertions"

workload:
  name: "Llama3_70B"
  batch_size: 4096
  seq_len: 2048

hardware:
  name: "H100"
  accelerators: 64
  precision: "fp16"
  efficiency: 0.45

ops:
  region: "Quebec"
  duration_days: 14.0

constraints:
  assert:
    - metric: "macro.carbon_footprint"
      max: 0.1  # Force a failure (64 H100s on Quebec's hydro grid over 14 days emit ~0.20 tCO2e > 0.1 tCO2e)
