<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 6; }
      .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0F172A; }
      .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #475569; }
      .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #1E293B; }
      .metric-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #64748B; }
      .bar-blue { fill: #2563EB; rx: 3; }
      .bar-amber { fill: #D97706; rx: 3; }
      .bar-green { fill: #16A34A; rx: 3; }
      .bar-red { fill: #DC2626; rx: 3; }
      .bar-gray { fill: #94A3B8; rx: 3; }
      .line { stroke: #94A3B8; stroke-width: 1; stroke-dasharray: 4,4; }
      .badge-win { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; fill: #16A34A; }
      .badge-fail { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: bold; fill: #DC2626; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- PANEL 1: Flow Regulation (State Support Truncation) -->
  <g transform="translate(20, 20)">
    <rect width="270" height="320" class="box" />
    <text x="135" y="24" text-anchor="middle" class="title">1. Flow Regulation</text>
    <text x="135" y="40" text-anchor="middle" class="subtitle">Recovery Data Curation</text>

    <!-- Training Metric (Validation MSE) -->
    <g transform="translate(15, 65)">
      <text x="0" y="0" class="metric-label">OFFLINE VALIDATION LOSS (MSE ↓)</text>
      <!-- Policy A -->
      <text x="0" y="22" class="label">Policy A (w/ Recov)</text>
      <rect x="0" y="28" width="140" height="14" class="bar-amber" />
      <text x="148" y="40" class="label">0.042 V²</text>

      <!-- Policy B -->
      <text x="0" y="62" class="label">Policy B (Sanitized)</text>
      <rect x="0" y="68" width="37" height="14" class="bar-blue" />
      <text x="45" y="80" class="label">0.011 V²</text>
      <text x="95" y="80" class="badge-win">★ 4× Better Score</text>
    </g>

    <!-- Inversion Divider -->
    <line x1="15" y1="170" x2="255" y2="170" class="line" />
    <text x="135" y="180" text-anchor="middle" style="font-size: 10px; font-weight: bold; fill: #DC2626;">▼ RANKING INVERSION ON HARDWARE ▼</text>

    <!-- Machine Metric (Hardware Closed-Loop Recovery) -->
    <g transform="translate(15, 195)">
      <text x="0" y="0" class="metric-label">CLOSED-LOOP SURVIVAL (130 kPa Drop)</text>
      <!-- Policy A -->
      <text x="0" y="22" class="label">Policy A (w/ Recov)</text>
      <rect x="0" y="28" width="160" height="14" class="bar-green" />
      <text x="168" y="40" class="badge-win">100% (140 ms)</text>

      <!-- Policy B -->
      <text x="0" y="62" class="label">Policy B (Sanitized)</text>
      <rect x="0" y="68" width="8" height="14" class="bar-red" />
      <text x="16" y="80" class="badge-fail">0% (Overflow Crash)</text>
    </g>

    <text x="135" y="305" text-anchor="middle" style="font-size: 9.5px; fill: #475569; font-style: italic;">Pruning recoveries hides compounding drift.</text>
  </g>

  <!-- PANEL 2: Surface Touchdown (Simulation Energy Sink) -->
  <g transform="translate(315, 20)">
    <rect width="270" height="320" class="box" />
    <text x="135" y="24" text-anchor="middle" class="title">2. Surface Touchdown</text>
    <text x="135" y="40" text-anchor="middle" class="subtitle">Penalty Solver Exploit</text>

    <!-- Training Metric (Simulated Return) -->
    <g transform="translate(15, 65)">
      <text x="0" y="0" class="metric-label">SIMULATED EPISODE RETURN (↑)</text>
      <!-- Policy 1 -->
      <text x="0" y="22" class="label">Policy 1 (Braked Descent)</text>
      <rect x="0" y="28" width="130" height="14" class="bar-blue" />
      <text x="138" y="40" class="label">R = 78 (45 ms)</text>

      <!-- Policy 2 -->
      <text x="0" y="62" class="label">Policy 2 (Unbraked Plunge)</text>
      <rect x="0" y="68" width="165" height="14" class="bar-blue" />
      <text x="173" y="80" class="badge-win">★ R = 100</text>
    </g>

    <!-- Inversion Divider -->
    <line x1="15" y1="170" x2="255" y2="170" class="line" />
    <text x="135" y="180" text-anchor="middle" style="font-size: 10px; font-weight: bold; fill: #DC2626;">▼ RANKING INVERSION ON HARDWARE ▼</text>

    <!-- Machine Metric (Peak Hardware Contact Force) -->
    <g transform="translate(15, 195)">
      <text x="0" y="0" class="metric-label">HARDWARE IMPACT FORCE &amp; SURVIVAL</text>
      <!-- Policy 1 -->
      <text x="0" y="22" class="label">Policy 1 (Braked Descent)</text>
      <rect x="0" y="28" width="55" height="14" class="bar-green" />
      <text x="65" y="40" class="badge-win">11.4 N (Safe)</text>

      <!-- Policy 2 -->
      <text x="0" y="62" class="label">Policy 2 (Unbraked Plunge)</text>
      <rect x="0" y="68" width="180" height="14" class="bar-red" />
      <text x="110" y="80" class="badge-fail">68.0 N (Flexure Shattered)</text>
    </g>

    <text x="135" y="305" text-anchor="middle" style="font-size: 9.5px; fill: #475569; font-style: italic;">Solver penetration acts as unphysical sink.</text>
  </g>

  <!-- PANEL 3: Regime Transition (Debt Migration) -->
  <g transform="translate(610, 20)">
    <rect width="270" height="320" class="box" />
    <text x="135" y="24" text-anchor="middle" class="title">3. Regime Migration</text>
    <text x="135" y="40" text-anchor="middle" class="subtitle">Data Debt vs Modeling Debt</text>

    <!-- Training Metric (Simulated Success Rate) -->
    <g transform="translate(15, 65)">
      <text x="0" y="0" class="metric-label">SIMULATED / OFFLINE METRIC (↑)</text>
      <!-- Policy A -->
      <text x="0" y="22" class="label">Policy A (BC Imitation)</text>
      <rect x="0" y="28" width="110" height="14" class="bar-amber" />
      <text x="118" y="40" class="label">66% (Drift Loss)</text>

      <!-- Policy B -->
      <text x="0" y="62" class="label">Policy B (Sim RL)</text>
      <rect x="0" y="68" width="165" height="14" class="bar-blue" />
      <text x="105" y="80" class="badge-win">★ 100% Sim Success</text>
    </g>

    <!-- Inversion Divider -->
    <line x1="15" y1="170" x2="255" y2="170" class="line" />
    <text x="135" y="180" text-anchor="middle" style="font-size: 10px; font-weight: bold; fill: #DC2626;">▼ RANKING INVERSION ON HARDWARE ▼</text>

    <!-- Machine Metric (Hardware Task Success & Thermal Limits) -->
    <g transform="translate(15, 195)">
      <text x="0" y="0" class="metric-label">HARDWARE PRODUCTION COMPLETION</text>
      <!-- Policy A -->
      <text x="0" y="22" class="label">Policy A (BC Imitation)</text>
      <rect x="0" y="28" width="110" height="14" class="bar-amber" />
      <text x="118" y="40" class="label">66% (Drift Limit)</text>

      <!-- Policy B -->
      <text x="0" y="62" class="label">Policy B (Sim RL)</text>
      <rect x="0" y="68" width="24" height="14" class="bar-red" />
      <text x="32" y="80" class="badge-fail">12% (95°C Thermal Trip)</text>
    </g>

    <text x="135" y="305" text-anchor="middle" style="font-size: 9.5px; fill: #475569; font-style: italic;">65 Hz chatter excites resonance and heat.</text>
  </g>
</svg>
