<?xml version='1.0' encoding='utf-8'?>
<svg font-family="Arial, Helvetica, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f8f52"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f76b7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#ffffff"/>

  <rect x="50" y="24" width="580" height="34" fill="#fff5e6" stroke="#d49145" stroke-width="1.5"/>
  <text x="340" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#c87b2a">Goodhart's Law</text>
  <text x="340" y="51" text-anchor="middle" font-size="10.5" fill="#c87b2a">When a measure becomes a target, it ceases to be a good measure.</text>

  <rect x="235" y="78" width="210" height="62" fill="#eef8f1" stroke="#4aa567" stroke-width="2.2"/>
  <text x="340" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#2f8f52">True Goal</text>
  <text x="340" y="118" text-anchor="middle" font-size="11" fill="#2f8f52">Maximize user value</text>
  <text x="340" y="132" text-anchor="middle" font-size="10" fill="#2f8f52">long-term engagement and trust</text>

  <rect x="500" y="188" width="150" height="62" fill="#eef6fd" stroke="#4a90c4" stroke-width="2.2"/>
  <text x="575" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#2f76b7">ML System</text>
  <text x="575" y="228" text-anchor="middle" font-size="11" fill="#2f76b7">Optimizes proxy</text>
  <text x="575" y="242" text-anchor="middle" font-size="10" fill="#2f76b7">metric via gradient</text>

  <rect x="235" y="318" width="210" height="62" fill="#fff5e6" stroke="#d49145" stroke-width="2.2"/>
  <text x="340" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#c87b2a">Proxy Metric</text>
  <text x="340" y="358" text-anchor="middle" font-size="11" fill="#c87b2a">Maximize clicks</text>
  <text x="340" y="372" text-anchor="middle" font-size="10" fill="#c87b2a">easy to measure, easy to hack</text>

  <rect x="34" y="188" width="178" height="76" fill="#fdeaea" stroke="#c44" stroke-width="2.2"/>
  <text x="123" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#a31f34">Observed Behavior</text>
  <text x="123" y="228" text-anchor="middle" font-size="11" fill="#c44">Clickbait content</text>
  <text x="123" y="242" text-anchor="middle" font-size="11" fill="#c44">Outrage amplification</text>
  <text x="123" y="256" text-anchor="middle" font-size="11" fill="#c44">Filter bubbles</text>

  <path d="M 445 109 H 475 V 219 H 500" stroke="#2f8f52" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="506" y="101" text-anchor="middle" font-size="10" fill="#2f8f52">designer sets</text>
  <text x="506" y="114" text-anchor="middle" font-size="10" fill="#2f8f52">objective</text>

  <path d="M 575 250 V 300 H 445 V 349" stroke="#2f76b7" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="531" y="295" text-anchor="middle" font-size="10" fill="#2f76b7">measured by</text>

  <path d="M 235 349 H 166 V 264" stroke="#c87b2a" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="174" y="326" text-anchor="middle" font-size="10" fill="#c87b2a">drives</text>

  <path d="M 123 188 V 109 H 235" stroke="#c44" stroke-width="2.3" stroke-dasharray="7,4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="142" y="101" text-anchor="middle" font-size="10" font-weight="700" fill="#a31f34">Training data reflects</text>
  <text x="142" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#a31f34">the hack</text>

  <rect x="246" y="202" width="188" height="42" fill="#fdeaea" stroke="#c44" stroke-width="1.5"/>
  <text x="340" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#a31f34">Reinforcement Loop</text>
  <text x="340" y="234" text-anchor="middle" font-size="10" fill="#c44">each cycle worsens misalignment</text>

  <line x1="60" y1="415" x2="620" y2="415" stroke="#d6dade" stroke-width="1"/>
  <text x="340" y="437" text-anchor="middle" font-size="11" fill="#555b60">Reward hacking optimizes the proxy, not the intended outcome.</text>
</svg>
