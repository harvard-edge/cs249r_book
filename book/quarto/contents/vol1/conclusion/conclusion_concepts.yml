  formulas:
    - 'Data as code: System Behavior ~= f(Data)'
    - 'Data gravity: C_move(D) >> C_move(Compute)'
    - 'Iron Law: T = D_vol / BW + O / (R_peak * eta_hw) + L_lat'
    - 'Arithmetic intensity law: R = min(R_peak, I * BW)'
    - 'Energy-movement invariant: E_move >> E_compute'
    - 'Amdahl''s Law: Speedup = 1 / ((1 - p) + p / s)'
    - 'Verification gap: Pr(f(X) ~= Y) > 1 - epsilon'
    - 'Statistical drift: Accuracy(t) ~= Accuracy_0 - lambda * D(P_t || P_0)'
    - 'Training-serving skew: Delta Accuracy ~= E[|f_serve(x) - f_train(x)|]'
    - 'Bias feedback: Delta_g(k) ~= Delta_g(0) * alpha^k, alpha > 1'
    - 'Tail latency ratio: P99 latency / mean latency'
    - 'Cluster MTBF: component MTTF / number of independent components'
  applications:
