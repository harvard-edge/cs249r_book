crossref:
  fig-prefix: "figure"
  tbl-prefix: "table"
  sec-prefix: "section"
  eq-prefix: "equation"
  lst-prefix: "listing"
  appendix-title: "Appendix"
  appendix-delim: ":"
  # Principle callouts use mlsysbook-ext/custom-numbered-blocks (numbered + box).
  # Do NOT add key: pri here: Quarto would treat #pri-* divs as floats, wrap them,
  # and use the last paragraph as caption, which breaks the callout box rendering.
  # Refs: \ref{pri-xxx} works in PDF (foldbox emits \label); @pri-xxx in HTML
  # is resolved by custom-numbered-blocks' Pandoc_resolvexref (Cite and inline @).
  custom:
    - kind: float
      key: vid
      latex-env: vid
      reference-prefix: Video

# Native Quarto algorithm refs are theorem-style labels and use the language
# table rather than crossref.*-prefix metadata. Point each top-level config's
# `language:` key at this same file so @alg-* renders as "Algorithm N" instead
# of Quarto's default "alg. N".
crossref-alg-prefix: Algorithm
