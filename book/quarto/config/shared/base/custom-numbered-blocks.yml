filter-metadata:
  mlsysbook-ext/custom-numbered-blocks:
    icon-path: "assets/images/icons/callouts"
    icon-format: "png"
    # Numbering scope (per group, only when numbered: true):
    #   scope: global  — One sequence for the whole book (e.g. Principle 1, 2, 3...). Use for book-wide references.
    #   scope: local   — Per-chapter numbering (e.g. Napkin Math 4.1, 4.2 in chapter 4). Omit scope for same default.
    groups:
      quiz-question:
        colors: ["F0F0F8", "5B4B8A"]
        collapse: true
        numbered: false
      quiz-answer:
        colors: ["E8F2EA", "4A7C59"]
        collapse: true
        numbered: false
      resource-slides:
        colors: ["E0F2F1", "20B2AA"]
        collapse: true
        numbered: false
      resource-videos:
        colors: ["E0F2F1", "20B2AA"]
        collapse: true
        numbered: false
      resource-exercises:
        colors: ["E0F2F1", "20B2AA"]
        collapse: true
        numbered: false
      chapter-connection:
        colors: ["F1F5F9", "64748B"]
        collapse: false
        numbered: false
      learning-objectives:
        colors: ["E8F2EA", "4A7C59"] # Green theme matching native .callout-tip
        collapse: false
        numbered: false
      chapter-forward:
        colors: ["F5F3FF", "8B5CF6"]
        collapse: true
        numbered: false
      chapter-recall:
        colors: ["FFF4E6", "C06014"]
        collapse: true
        numbered: false
      code-listing:
        colors: ["F2F4F8", "3C4858"]
        collapse: false
        numbered: false
      definition:
        colors: ["F2F7FA", "4F7396"]
        collapse: false
        numbered: true
      example:
        colors: ["F0F8F6", "148F77"]
        collapse: false
        numbered: true
      engineers-notebook:
        colors: ["F4F7FA", "3F6077"]
        collapse: false
        numbered: true
        scope: local   # per-chapter: Napkin Math 4.1, 4.2 in ch. 4
      colab-interactive:
        colors: ["FFF5E6", "FF6B35"]
        collapse: false
        numbered: false
      lighthouse:
        colors: ["FDF8E6", "B8860B"]
        collapse: false
        numbered: true
      perspective:
        colors: ["F7F8FA", "4A5568"]
        collapse: false
        numbered: true
      checkpoint:
        colors: ["F7FEE7", "4D7C0F"]
        collapse: false
        numbered: true
      principle:
        colors: ["F3F2FA", "3D3B8E"]
        collapse: false
        numbered: true
        scope: global   # book-wide: Principle 1, 2, 3... (in-text refs stay simple)
      takeaways:
        colors: ["FCF4F8", "9D3C72"]
        collapse: false
        numbered: false
      war-story:
        colors: ["FEF2F2", "C53030"] # Red/Warning theme
        collapse: false
        numbered: true
      theorem:
        colors: ["F5F0FA", "6B46C1"]
        collapse: false
        numbered: true
    classes:
      callout-quiz-question:
        label: "Self-Check: Question"
        group: quiz-question
      callout-quiz-answer:
        label: "Self-Check: Answer"
        group: quiz-answer
      callout-resource-slides:
        label: "Listing"
        group: resource-slides
      callout-resource-videos:
        label: "Videos"
        group: resource-videos
      callout-resource-exercises:
        label: "Exercises"
        group: resource-exercises
      callout-chapter-connection:
        label: "What's Next"
        group: chapter-connection
      callout-learning-objectives:
        label: "Learning Objectives"
        group: learning-objectives
      callout-code:
        label: "Code"
        group: code-listing
      callout-definition:
        label: "Definition"
        group: definition
        prefix: dfn     # \ref{dfn-…} → "Definition X.Y"
      callout-example:
        label: "Example"
        group: example
        prefix: exmp     # \ref{exmp-…} → "Example X.Y"
      callout-colab:
        label: "Interactive Colab"
        group: colab-interactive
      callout-lighthouse:
        label: "Lighthouse"
        group: lighthouse
        prefix: lhs     # \ref{lhs-…} → "Lighthouse X.Y"
      callout-perspective:
        label: "Systems Perspective"
        group: perspective
        prefix: psp     # \ref{psp-…} → "Systems Perspective X.Y"
      callout-notebook:
        label: "Napkin Math"
        group: engineers-notebook
        prefix: nbk     # \ref{nbk-…} → "Napkin Math X.Y"
      callout-theorem:
        label: "Theorem"
        group: theorem
        prefix: thrm     # \ref{thrm-…} → "Theorem X.Y"
      callout-checkpoint:
        label: "Checkpoint"
        group: checkpoint
        prefix: chk     # \ref{chk-…} → "Checkpoint X.Y"
      callout-principle:
        label: "Principle"
        group: principle
        prefix: pri     # \ref{pri-…} → "Principle N"  (book-wide global)
      callout-takeaways:
        label: "Key Takeaways"
        group: takeaways
      callout-war-story:
        label: "War Story"
        group: war-story
        prefix: ws      # \ref{ws-…} → "War Story X.Y"
