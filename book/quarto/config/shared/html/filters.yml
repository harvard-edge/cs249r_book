# inject_quizzes.lua is HTML-ONLY. PDF and EPUB do not list it. The filter
# is also self-guarded via quarto.doc.is_format("html") so even accidental
# cross-format inclusion is a no-op. The quiz JSON files it reads live at
# book/quarto/contents/{vol}/{chapter}/{chapter}_quizzes.json and are
# regenerated by book/tools/scripts/quizzes/generate_quizzes.py
# against the canonical spec in the project quiz-generation spec.
#
# QUIZZES ARE DISABLED (2026-08-17, temporary).
#
# The render+prose audit found self-check answers asserting statistics their
# chapter never states, in nearly every chapter -- in robust_ai, 9 of 18
# findings were fabricated quiz numbers attributed to the body. Whether those
# items get rewritten against the body or retired is an open authorial
# question, so the quizzes are held out of the render until it is settled
# rather than shipping answers the book contradicts.
#
# Scope: HTML only, because HTML is the only format that injects them -- pdf/
# and epub/ filters.yml never listed inject_quizzes.lua. Nothing else is
# touched: every *_quizzes.json file and every `quiz:` key in chapter
# frontmatter stays exactly as it is, and the `quiz-config` filter-metadata
# below is simply left unread.
#
# To re-enable: uncomment the one line. That is the whole switch.
#
filters:
  - filters/sidenote.lua
  - filters/inject_parts.lua
  - filters/dropcap.lua
  # - filters/inject_quizzes.lua
  - pandoc-ext/diagram
  - mlsysbook-ext/custom-numbered-blocks
  - mlsysbook-ext/pseudocode
