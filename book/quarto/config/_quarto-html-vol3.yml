# =============================================================================
# VOLUME III HTML WEBSITE CONFIGURATION: Agentic Machine Learning Systems
# =============================================================================
# Builds Volume III: Agentic Machine Learning Systems
# Deploys to: mlsysbook.ai/vol3/
# =============================================================================

project:
  type: website
  output-dir: _build/html-vol3
  execute-dir: project

  resources:
    - assets/images/covers/*
    - assets/downloads/*

  render:
    - index.qmd
    - contents/vol3/frontmatter/author_note.qmd
    - contents/vol3/frontmatter/about.qmd

  post-render:
    - scripts/clean_svgs.py
    - scripts/resolve_cross_references.py
    - scripts/fix_lightbox_paths.py

  preview:
    browser: false
    navigate: false

website:
  title: "Agentic Machine Learning Systems"
  description: "Volume III: Agentic Machine Learning Systems. Systems architecture of inference-time compute, stateful trajectories, and autonomous control loops."
  site-url: https://mlsysbook.ai/vol3/

  open-graph:
    locale: en_US
    site-name: "Machine Learning Systems"
    image: assets/images/covers/cover-hardcover-book-vol3.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: assets/images/covers/cover-hardcover-book-vol3.png

  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    keyboard-shortcut: ["/"]

  navbar:
    logo: "assets/images/icons/logo-seas-shield.png"
    search: true
    title: "Machine Learning Systems"

  favicon: assets/images/icons/favicon.png

  sidebar:
    - id: vol3-content
      title: "Volume III"
      style: "floating"
      background: light
      collapse-level: 2
      contents:
        - text: "Homepage"
          href: index.qmd
        - href: contents/vol3/frontmatter/author_note.qmd
        - href: contents/vol3/frontmatter/about.qmd

  page-footer:
    center: |
      <a href="../vol4/">Next to Volume IV →</a>

bibliography:
  - contents/references.bib

format:
  html:
    lightbox: true
    mermaid:
      theme: default
    theme:
      light:
        - default
        - assets/styles/style-vol3.scss
      dark:
        - default
        - assets/styles/style-vol3.scss
        - assets/styles/dark-mode-vol3.scss
    respect-user-color-scheme: true
    title-prefix: ""
    pagetitle: "Agentic Machine Learning Systems"
    code-block-bg: true
    code-copy: true
    code-overflow: wrap
    language:
      title-block-author-single: "Author, Editor & Curator"
      title-block-published: "Last Updated"
    reference-location: margin
    citation-location: margin
    sidenote: true
    syntax-highlighting: assets/styles/custom-code.theme
    code-link: true
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: false
    footnotes-hover: false
    fig-width: 7
    fig-height: 5
    toc: true
    toc-depth: 4
    toc-expand: true
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    include-in-header:
      - file: ../../shared/config/site-head.html
      - text: |
          <link rel="manifest" href="/site.webmanifest">
          <link rel="apple-touch-icon" href="/assets/images/icons/favicon.png">
          <meta name="theme-color" content="#581C87">
          <script src="/assets/scripts/sidebar-auto-collapse.js" defer></script>
          <script src="/assets/scripts/version-link.js" defer></script>
          <script src="/assets/scripts/subscribe-modal.js" defer></script>
    citeproc: true

metadata-files:
  - config/shared/base/crossref-labels.yml
  - config/shared/base/custom-numbered-blocks.yml
  - config/shared/base/execute-env.yml
  - config/shared/base/diagram.yml
  - config/shared/base/citation-style.yml
  - config/shared/html/filters.yml
  - config/shared/html/announcement-vol3.yml
  - ../../shared/config/navbar-common.yml
  - config/shared/html/footer-common.yml
