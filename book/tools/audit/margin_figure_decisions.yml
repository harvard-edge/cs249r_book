metadata:
  created: "2026-05-30"
  branch: "feat/margin-elements"
  source_audit: "book/tools/audit/margin_figure_opportunities.yml"
  principle: "Figure count is an outcome, not an input. Keep a candidate when the local prose exposes a relationship, scale gap, threshold, trend, framework locator, or reusable schema that a learner benefits from seeing in parallel."
  note: "Line numbers and candidate IDs come from the source audit. Decisions here are pedagogical curation, not implementation status."

decision_labels:
  must_add: "The adjacent prose contains a load-bearing relationship that should be visualized."
  should_add: "The figure materially improves recall or orientation and should be implemented unless layout blocks it."
  revise_then_add: "The teaching moment is valid, but the proposed visual needs a simpler or more honest device before implementation."
  defer: "The idea is valid but less urgent because of redundancy, weaker local fit, or likely layout pressure."
  drop: "The candidate does not survive the pedagogical gate."

rubric:
  - "Name the one teaching job before drawing: magnitude, threshold, trend, locator, or schema."
  - "Read the local paragraph; the figure must support that exact prose, not a nearby general topic."
  - "Prefer visualizing hidden structure: scale gaps, cliffs, saturation, dominance, causality, and recurring book frameworks."
  - "Allow recurrence when it teaches pattern recognition, especially D-A-M, D-A-I, roofline, blast radius, and iron-law motifs."
  - "Reject decoration. Empty margin is not itself a reason to add a figure."
  - "If the candidate has numbers, implementation must pull them from the chapter LEGO/MLSysIM source of truth."

decisions:
  - id: "vol1-introduction-margin-001"
    decision: "must_add"
    job: "schema"
    device: "other-new"
    purpose: "Show that production ML work is mostly the surrounding system, not the model code alone."
    note: "This anchors the book's central premise at the moment the prose introduces hidden technical debt."
  - id: "vol1-introduction-margin-002"
    decision: "must_add"
    job: "magnitude"
    device: "hierarchy-ladder"
    purpose: "Make the verification gap between input space and test coverage physically visible."
    note: "The prose gives a vast numeric contrast; a ladder reduces the mental arithmetic burden."
  - id: "vol1-introduction-margin-003"
    decision: "should_add"
    job: "trend"
    device: "sparkline-trend"
    purpose: "Show silent degradation as accuracy decay under drift."
    note: "Helpful because the prose explains a dynamic failure mode that students should remember as a shape."
  - id: "vol1-introduction-margin-004"
    decision: "should_add"
    job: "magnitude"
    device: "iron-law-bar"
    purpose: "Show why optimizing only inference leaves end-to-end latency mostly intact."
    note: "Strong local Amdahl moment; ensure it does not duplicate a nearby iron-law margin element on the same page."

  - id: "vol1-ml-systems-margin-001"
    decision: "should_add"
    job: "schema"
    device: "thumbnail-roofline"
    purpose: "Place batch-1 inference on the memory-bound side of the roofline."
    note: "Good recurrence cue for the roofline idea; implement only as a very lite regime locator."
  - id: "vol1-ml-systems-margin-002"
