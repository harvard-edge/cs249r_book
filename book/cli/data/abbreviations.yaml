# Canonical Abbreviations Registry for MLSysBook
#
# This file is the single source of truth for:
# 1. exempt_baselines: Universal computing fundamentals and brand names that are never re-expanded per chapter.
# 2. canonical_expansions: Domain-specific ML, systems, hardware, and networking acronyms that must expand on first use in each chapter.
#
# Audited by: book/tools/audit/checks/abbreviation_first_use.py (invoked by ./book/binder check prose)
# If this file is missing or invalid, the abbreviation audit checks will fail immediately.

exempt_baselines:
  - CPU
  - GPU
  - RAM
  - DRAM
  - SRAM
  - SSD
  - HDD
  - PCIe
  - NVLink
  - API
  - SDK
  - HTTP
  - TCP
  - JSON
  - XML
  - YAML
  - I/O
  - OS
  - NaN
  - CUDA
  - cuDNN
  - US
  - UK
  - MIPS
  - CISC

canonical_expansions:
  # ML Architectures & Model Families
  CNN: convolutional neural network
  LLM: large language model
  MLP: multilayer perceptron
  MoE:
    - mixture of experts
    - mixture-of-experts
  RNN: recurrent neural network
  LSTM: long short-term memory
  ViT: vision transformer
  GAN: generative adversarial network
  VAE: variational autoencoder

  # Math, Optimization & Core Algorithms
  ReLU: rectified linear unit
  SGD: stochastic gradient descent
  Adam: Adaptive Moment Estimation
  GEMM: general matrix multiply
  BLAS: Basic Linear Algebra Subprograms
  BPTT: backpropagation through time
  AD: automatic differentiation
  GELU: Gaussian Error Linear Unit
  FFT: fast Fourier transform
  UAT: universal approximation theorem

  # Hardware, Accelerators & Interconnects
  TPU: Tensor Processing Unit
  HBM: high-bandwidth memory
  ASIC: application-specific integrated circuit
  FPGA: field-programmable gate array
  SoC:
    - system on chip
    - system-on-chip
  NIC: network interface card
  DMA: direct memory access
  NUMA: non-uniform memory access
  NVMe: Non-Volatile Memory Express
  RDMA: remote direct memory access
  SIMD: single instruction, multiple data
  SIMT: single instruction, multiple threads
  RISC: reduced instruction set computer
  MAC: multiply-accumulate

  # Compilers, IRs & Runtime Systems
  ONNX: Open Neural Network Exchange
  JIT: just-in-time
  AOT: ahead-of-time
  IR: intermediate representation
  XLA: Accelerated Linear Algebra
  PTX: Parallel Thread Execution
  AST: abstract syntax tree
  DAG: directed acyclic graph
  DCE: dead-code elimination
  SSA: static single-assignment

  # Systems, Reliability, Operations & Networking
  MFU: model FLOPs utilization
  TDP: thermal design power
  FEC: forward error correction
  PUE: power usage effectiveness
  CUE: carbon usage effectiveness
  WUE: water usage effectiveness
  CDU: coolant distribution unit
  ERE: energy reuse effectiveness
  ECMP: equal-cost multi-path
  ECN: explicit congestion notification
  BSP: bulk synchronous parallel
  DPO: direct preference optimization
  MMD: maximum mean discrepancy
  PSI: population stability index
  SRPT: shortest remaining processing time
  TVO: total value of ownership
  RAID: redundant array of independent disks
  VFS: virtual file system
  UPW: ultra-pure water
  EDP: energy-delay product
  PIR: post-incident report
  MTBF: mean time between failures
  MTTF: mean time to failure
  MTTR: mean time to recovery
  SLA: service level agreement
  SLO: service-level objective
  SLI: service level indicator
  TCO: total cost of ownership
  i.i.d.: independent and identically distributed

  # Data Engineering & Specialized Topics
  ETL: extract, transform, load
  ELT: extract, load, transform
  OLAP: online analytical processing
  OLTP: online transaction processing
  OTA: over-the-air
  RBAC: role-based access control
  RFM: "recency, frequency, and monetary"
  TFDV: TensorFlow Data Validation
  V2X: vehicle-to-everything
  CTM: continuous therapeutic monitoring
  HELM: Holistic Evaluation of Language Models
  HIS: hospital information systems
  HOG: histogram of oriented gradients
  ICR: information-compute ratio
  ILSVRC: ImageNet Large Scale Visual Recognition Challenge
  KWS: keyword spotting
  MMLU: Massive Multitask Language Understanding
  MSWC: Multilingual Spoken Words Corpus
  NAS:
    - neural architecture search
    - network-attached storage
