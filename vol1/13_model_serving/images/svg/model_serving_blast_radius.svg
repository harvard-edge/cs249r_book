<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="69.8pt" height="44pt" viewBox="0 0 69.8 44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="69.8" height="44" fill="#ffffff"/>
  <!-- ===== Three identical forward passes (48 units of blue work each), schematic =====
       red = preemption by an unisolated daemon or IRQ; finish time shifts right -->
  <!-- ── Pass 1: unpreempted ── -->
  <rect x="3" y="10" width="48" height="5" fill="#006395" stroke="#ffffff" stroke-width="0.35"/>
  <!-- ── Pass 2: one preemption ── -->
  <rect x="3" y="18" width="19.2" height="5" fill="#006395" stroke="#ffffff" stroke-width="0.35"/>
  <rect x="22.2" y="18" width="6" height="5" fill="#cb202d" stroke="#ffffff" stroke-width="0.35"/>
  <rect x="28.2" y="18" width="28.8" height="5" fill="#006395" stroke="#ffffff" stroke-width="0.35"/>
  <!-- ── Pass 3: two preemptions ── -->
  <rect x="3" y="26" width="12" height="5" fill="#006395" stroke="#ffffff" stroke-width="0.35"/>
  <rect x="15" y="26" width="4.8" height="5" fill="#cb202d" stroke="#ffffff" stroke-width="0.35"/>
  <rect x="19.8" y="26" width="16.8" height="5" fill="#006395" stroke="#ffffff" stroke-width="0.35"/>
  <rect x="36.6" y="26" width="8.4" height="5" fill="#cb202d" stroke="#ffffff" stroke-width="0.35"/>
  <rect x="45" y="26" width="19.2" height="5" fill="#006395" stroke="#ffffff" stroke-width="0.35"/>
  <!-- ── Unpreempted finish ── -->
  <path d="M 51 8 L 51 33" fill="none" stroke="#999999" stroke-width="0.55" stroke-dasharray="2,0.9"/>
  <!-- ── Spread of finish times ── -->
  <path d="M 51 34 L 51 35.5 L 64.2 35.5 L 64.2 34" fill="none" stroke="#cb202d" stroke-width="0.55"/>
  <!-- ===== Labels ===== -->
  <text x="3" y="6.4" font-size="4.8" fill="#333333">same pass</text>
  <text x="57.6" y="41.4" text-anchor="middle" font-size="4.8" fill="#cb202d">jitter</text>
</svg>
