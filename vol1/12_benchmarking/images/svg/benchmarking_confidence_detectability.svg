<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Paired test, disagreements from a minimum of 10: 26 or fewer disagreements reveal a regression; more leave it unresolved.">
  <rect x="0" y="0" width="180" height="92" fill="#ffffff"/>
  <!-- linear scale: disagreements 10 to 40, x = 14 + (v - 10) * 5.2 ; threshold 26 at x = 97.2 -->
  <rect x="14" y="26" width="83.2" height="36" fill="#5e6b73" fill-opacity="0.16"/>
  <path d="M14 62 H170" stroke="#5e6b73" stroke-width="1.6" fill="none"/>
  <path d="M164 58 L171 62 L164 66" stroke="#5e6b73" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  <path d="M97.2 20 V70" stroke="#cb202d" stroke-width="1.8" stroke-dasharray="5 3" fill="none"/>
  <text x="97.2" y="15" font-size="13" font-weight="bold" fill="#cb202d" text-anchor="middle">26</text>
  <text x="55.6" y="49" font-size="12" fill="#333333" text-anchor="middle">regression</text>
  <text x="135" y="49" font-size="12" fill="#333333" text-anchor="middle">unresolved</text>
  <path d="M14 62 V68" stroke="#5e6b73" stroke-width="1.6" fill="none"/>
  <text x="14" y="81" font-size="12" fill="#555555" text-anchor="middle">10</text>
  <text x="96" y="84" font-size="12" fill="#555555" text-anchor="middle">disagreements</text>
</svg>
