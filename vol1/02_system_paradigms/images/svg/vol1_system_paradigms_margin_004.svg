<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="57pt" viewBox="0 0 90 57" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Amdahl camera pipeline, linear scale 0.43 units per ms (AmdahlCameraCalc):
       ISP 100 ms + ML 60 ms + post 40 ms = 200 ms; ML 10x faster (6 ms) gives 146 ms, 1.37x. -->
  <rect x="0" y="0" width="90" height="57" fill="#ffffff"/>
  <text x="45" y="8" text-anchor="middle" font-size="7" font-weight="700" fill="#333333">10× → 1.37×</text>
  <!-- ===== Before: 200 ms ===== -->
  <g stroke="#ffffff" stroke-width="0.5">
    <rect x="2" y="13" width="43" height="11" fill="#cccccc"/>
    <rect x="45" y="13" width="25.8" height="11" fill="#e67817"/>
    <rect x="70.8" y="13" width="17.2" height="11" fill="#cccccc"/>
  </g>
  <text x="57.9" y="20.8" text-anchor="middle" font-size="6.5" font-weight="700" fill="#ffffff">ML</text>
  <text x="88" y="31" text-anchor="end" font-size="6.5" fill="#555555">200 ms</text>
  <!-- ===== After: 146 ms ===== -->
  <g stroke="#ffffff" stroke-width="0.5">
    <rect x="2" y="36" width="43" height="11" fill="#cccccc"/>
    <rect x="45" y="36" width="2.6" height="11" fill="#e67817"/>
    <rect x="47.6" y="36" width="17.2" height="11" fill="#cccccc"/>
  </g>
  <text x="64.8" y="54" text-anchor="end" font-size="6.5" fill="#555555">146 ms</text>
</svg>
