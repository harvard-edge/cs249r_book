<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="47pt" viewBox="0 0 180 94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- To scale (1.3 px per ms): pre 60 ms, model 45 -> 15 ms, post 25 ms -->
  <text x="4" y="14" font-size="13" fill="#333333">before</text>
  <text x="173" y="14" font-size="13" fill="#555555" text-anchor="end">130 ms</text>
  <rect x="4" y="20" width="78" height="24" fill="#CCCCCC"/>
  <rect x="82" y="20" width="58.5" height="24" fill="#E67817"/>
  <rect x="140.5" y="20" width="32.5" height="24" fill="#CCCCCC"/>
  <line x1="82" y1="20" x2="82" y2="44" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="140.5" y1="20" x2="140.5" y2="44" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="111.25" y="36.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">model</text>
  <text x="4" y="64" font-size="13" fill="#333333">after</text>
  <text x="134" y="64" font-size="13" fill="#555555" text-anchor="end">100 ms</text>
  <rect x="4" y="70" width="78" height="24" fill="#CCCCCC"/>
  <rect x="82" y="70" width="19.5" height="24" fill="#E67817"/>
  <rect x="101.5" y="70" width="32.5" height="24" fill="#CCCCCC"/>
  <line x1="82" y1="70" x2="82" y2="94" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="101.5" y1="70" x2="101.5" y2="94" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
