<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="96pt" viewBox="0 0 180 192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Schematic, not a scale: default execution style on the iteration-latency vs compiler-visibility trade.
       PyTorch and TensorFlow 2 share the eager default (graph capture via torch.compile / tf.function is opt-in);
       JAX's idiom is a pure function traced under jit. Not a product ranking. -->
  <defs>
    <marker id="fw-ax" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="180" height="192" fill="#FFFFFF"/>
  <text x="4" y="16" font-size="13" fill="#666666">Fast iteration</text>
  <line x1="12" y1="30" x2="12" y2="164" stroke="#666666" stroke-width="1.5" marker-start="url(#fw-ax)" marker-end="url(#fw-ax)"/>
  <circle cx="12" cy="58" r="6" fill="#333333"/>
  <circle cx="12" cy="136" r="6" fill="#333333"/>
  <text x="28" y="54" font-size="13" fill="#333333">PyTorch</text>
  <text x="28" y="70" font-size="13" fill="#333333">TensorFlow</text>
  <text x="28" y="140.5" font-size="13" fill="#333333">JAX</text>
  <text x="4" y="186" font-size="13" fill="#666666">Compiler visibility</text>
</svg>
