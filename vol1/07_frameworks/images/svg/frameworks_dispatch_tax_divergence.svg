<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90pt" height="64pt" viewBox="0 0 180 128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Dispatch tax as share of modeled step time (DispatchTax: 15 us dispatch; 1 us vs 100 us kernel).
       Each bar is normalized to 100% of its own step time. Slate = host dispatch time, orange = device compute. -->
  <rect width="180" height="128" fill="#FFFFFF"/>
  <text x="4" y="15" font-size="13" fill="#333333">Small op</text>
  <rect x="4" y="21" width="161.2" height="26" fill="#5E6B73"/>
  <rect x="165.2" y="21" width="10.8" height="26" fill="#E67817"/>
  <line x1="165.2" y1="21" x2="165.2" y2="47" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="84.6" y="38.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dispatch 94%</text>
  <text x="4" y="73" font-size="13" fill="#333333">Large op</text>
  <rect x="4" y="79" width="22.4" height="26" fill="#5E6B73"/>
  <rect x="26.4" y="79" width="149.6" height="26" fill="#E67817"/>
  <line x1="26.4" y1="79" x2="26.4" y2="105" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="101.2" y="96.5" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Compute</text>
  <text x="4" y="122" font-size="13" font-weight="bold" fill="#5E6B73">13%</text>
</svg>
